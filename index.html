<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ufuk Aksoy | Render Projesi</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        p {
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .status {
            display: inline-block;
            margin-top: 1rem;
            padding: 5px 15px;
            background: #e1f5fe;
            color: #0288d1;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .links {
            margin-top: 20px;
        }

        .links a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }

        .links a:hover {
            border-bottom: 1px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Render'a Merhaba!</h1>
        <p>Bu site şu an Render üzerinden <strong>statik</strong> olarak yayınlanıyor.</p>
        
        <div class="status">● Canlı Yayın Aktif</div>

        <div class="links">
            <p>Projelerim: <a href="https://sonsuz.us" target="_blank">sonsuz.us</a></p>
        </div>
    </div>

</body>
</html>
