<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9edff"/>
      <stop offset="100%" stop-color="#c5e1f5"/>
    </linearGradient>
    <linearGradient id="networkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5dcff"/>
      <stop offset="100%" stop-color="#d1c3f2"/>
    </linearGradient>
    <linearGradient id="costGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4d1"/>
      <stop offset="100%" stop-color="#f7c8b1"/>
    </linearGradient>
    <linearGradient id="updateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f1d7"/>
      <stop offset="100%" stop-color="#bce0c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52708a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="77" cy="37" r="70" fill="#dceefa" opacity="0.42"/>
  <circle cx="582" cy="275" r="88" fill="#dcefdc" opacity="0.46"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37536c">SİNİR AĞINDA HATADAN ÖĞRENME</text>

  <path d="M130 129 H160" fill="none" stroke="#6c91ac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="160,129 151,124 151,134" fill="#6c91ac"/>

  <path d="M294 129 H324" fill="none" stroke="#6c91ac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="324,129 315,124 315,134" fill="#6c91ac"/>

  <path d="M450 129 H480" fill="none" stroke="#6c91ac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="480,129 471,124 471,134" fill="#6c91ac"/>

  <path d="M529 177 V205 H253 V177" fill="none" stroke="#d97867" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="253,177 247,187 259,187" fill="#d97867"/>
  <text x="390" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ad5f55">geri yayılım · gradyan</text>

  <path d="M213 244 H130 V181" fill="none" stroke="#579670" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="130,181 124,191 136,191" fill="#579670"/>

  <g filter="url(#shadow)">
    <rect x="40" y="80" width="90" height="98" rx="18" fill="url(#inputGrad)"/>
    <circle cx="66" cy="111" r="12" fill="#ffffff" opacity="0.82"/>
    <path d="M59 112 H73 M66 105 V119" stroke="#5c8dae" stroke-width="2" stroke-linecap="round"/>
    <text x="85" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385c74">Giriş</text>
    <text x="85" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54748a">x ve y</text>
    <text x="85" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54748a">verisi</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="160" y="65" width="134" height="128" rx="20" fill="url(#networkGrad)"/>
    <text x="227" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#55477b">Sinir Ağı</text>
    <path d="M187 116 L221 104 M187 116 L221 132 M187 144 L221 104 M187 144 L221 132 M233 104 L264 122 M233 132 L264 122" stroke="#8879ac" stroke-width="2" opacity="0.7"/>
    <circle cx="182" cy="116" r="7" fill="#fbfaff"/>
    <circle cx="182" cy="144" r="7" fill="#fbfaff"/>
    <circle cx="227" cy="104" r="7" fill="#fbfaff"/>
    <circle cx="227" cy="132" r="7" fill="#fbfaff"/>
    <circle cx="270" cy="122" r="8" fill="#fbfaff"/>
    <text x="227" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#625682">ileri yayılım</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="324" y="80" width="126" height="98" rx="18" fill="url(#costGrad)"/>
    <circle cx="351" cy="112" r="13" fill="#fff8f3" opacity="0.9"/>
    <path d="M344 116 L349 110 L354 113 L360 105" fill="none" stroke="#d07459" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="386" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8d5041">Maliyet</text>
    <text x="386" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a26756">tahmin − gerçek</text>
    <text x="386" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a26756">hata ölçümü</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="80" width="98" height="98" rx="18" fill="url(#updateGrad)"/>
    <circle cx="529" cy="112" r="14" fill="#f8fff8" opacity="0.9"/>
    <path d="M522 112 H536 M532 106 L538 112 L532 118" fill="none" stroke="#4d9770" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="529" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#387252">Güncelle</text>
    <text x="529" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#568566">ağırlıklar</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="214" y="218" width="178" height="57" rx="16" fill="#ffffff" opacity="0.92"/>
    <text x="303" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42637a">Zincir Kuralı</text>
    <text x="303" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668095">her ağırlığın hata payı</text>
  </g>

  <path d="M120 246 C145 270 181 277 207 255" fill="none" stroke="#76ad8b" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
  <text x="112" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#548267">daha düşük hata</text>
</svg>