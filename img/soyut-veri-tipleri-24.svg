<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="interfaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddecff"/>
      <stop offset="100%" stop-color="#c9ddf7"/>
    </linearGradient>
    <linearGradient id="safeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e1f4df"/>
      <stop offset="100%" stop-color="#c5e8ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5f7890" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5f7890" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="156" r="126" fill="#dff0ee" opacity="0.42"/>
  <circle cx="320" cy="156" r="96" fill="#ffffff" opacity="0.35"/>

  <!-- İstemci -->
  <g filter="url(#shadow)">
    <rect x="32" y="122" width="128" height="76" rx="18" fill="#fff8df"/>
    <rect x="44" y="136" width="42" height="42" rx="13" fill="#f5d77f"/>
    <circle cx="65" cy="150" r="7" fill="#ffffff"/>
    <path d="M52 171 C54 160 76 160 78 171" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <text x="100" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e5864" font-weight="600">İstemci</text>
    <text x="100" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78818b">Uygulama</text>
  </g>

  <!-- Sol akış -->
  <path d="M166 160 H209" fill="none" stroke="#809bb4" stroke-width="3" stroke-linecap="round"/>
  <polygon points="209,160 199,154 199,166" fill="#809bb4"/>
  <text x="168" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607487">çağrı</text>

  <!-- Arayüz -->
  <g filter="url(#shadow)">
    <rect x="216" y="65" width="208" height="181" rx="26" fill="url(#interfaceGrad)" stroke="#b1cce9" stroke-width="1.5"/>
    <rect x="236" y="84" width="168" height="34" rx="12" fill="#ffffff" opacity="0.72"/>
    <text x="320" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365775" font-weight="700">ADT Sözleşmesi</text>

    <g filter="url(#smallShadow)">
      <rect x="238" y="132" width="74" height="36" rx="11" fill="#ffffff"/>
      <text x="275" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45637c">push</text>
      <rect x="328" y="132" width="74" height="36" rx="11" fill="#ffffff"/>
      <text x="365" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45637c">pop</text>
      <rect x="238" y="180" width="74" height="36" rx="11" fill="#ffffff"/>
      <text x="275" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45637c">peek</text>
      <rect x="328" y="180" width="74" height="36" rx="11" fill="#ffffff"/>
      <text x="365" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45637c">boyut</text>
    </g>
  </g>

  <!-- Sağ akış -->
  <path d="M431 160 H467" fill="none" stroke="#6c9b86" stroke-width="3" stroke-linecap="round"/>
  <polygon points="467,160 457,154 457,166" fill="#6c9b86"/>
  <text x="431" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8673">kontrol</text>

  <!-- Kapsülleme -->
  <g filter="url(#shadow)">
    <rect x="474" y="62" width="134" height="190" rx="22" fill="url(#safeGrad)" stroke="#b4dbb9" stroke-width="1.5"/>
    <path d="M541 84 L574 98 V130 C574 155 558 170 541 177 C524 170 508 155 508 130 V98 Z" fill="#80bd92" opacity="0.28"/>
    <path d="M541 91 L567 103 V129 C567 149 554 162 541 168 C528 162 515 149 515 129 V103 Z" fill="none" stroke="#5c9d70" stroke-width="2.5"/>
    <path d="M530 128 L538 136 L553 118" fill="none" stroke="#5c9d70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="541" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386348" font-weight="700">Kapsülleme</text>
    <text x="541" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#61806a">Gizli iç veri</text>
    <rect x="495" y="227" width="92" height="13" rx="6.5" fill="#a9d5ae"/>
    <rect x="503" y="230" width="35" height="7" rx="3.5" fill="#ffffff" opacity="0.72"/>
  </g>

  <!-- Alt uygulama seçenekleri -->
  <path d="M320 252 V270" fill="none" stroke="#879eb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M320 270 H236 V279" fill="none" stroke="#879eb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M320 270 H405 V279" fill="none" stroke="#879eb5" stroke-width="2.5" stroke-linecap="round"/>

  <g filter="url(#smallShadow)">
    <rect x="171" y="280" width="130" height="29" rx="11" fill="#f5e8fb"/>
    <text x="236" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765784">Dizi tabanlı</text>
    <rect x="340" y="280" width="130" height="29" rx="11" fill="#e5f2ff"/>
    <text x="405" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d718f">Bağlı liste</text>
  </g>

  <text x="320" y="49" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617789">Aynı arayüz, değişebilir uygulama</text>
</svg>