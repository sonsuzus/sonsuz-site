<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7d9ee8"/>
      <stop offset="100%" stop-color="#6cb9ad"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#61728d" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#61728d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="158" r="113" fill="#dcecf0" opacity="0.42"/>
  <circle cx="320" cy="158" r="82" fill="#eaf3f4" opacity="0.58"/>

  <!-- connections -->
  <path d="M174 76 C207 87 225 105 251 121" fill="none" stroke="#8aa7bb" stroke-width="2.2"/>
  <polygon points="251,121 241,119 246,112" fill="#8aa7bb"/>

  <path d="M465 76 C433 89 416 104 390 121" fill="none" stroke="#8aa7bb" stroke-width="2.2"/>
  <polygon points="390,121 397,112 400,121" fill="#8aa7bb"/>

  <path d="M174 239 C207 226 224 211 251 195" fill="none" stroke="#8aa7bb" stroke-width="2.2"/>
  <polygon points="251,195 245,204 241,196" fill="#8aa7bb"/>

  <path d="M465 239 C434 226 416 211 390 195" fill="none" stroke="#8aa7bb" stroke-width="2.2"/>
  <polygon points="390,195 400,196 397,204" fill="#8aa7bb"/>

  <path d="M320 213 L320 264" fill="none" stroke="#6f9b9a" stroke-width="2.5"/>
  <polygon points="320,264 314,253 326,253" fill="#6f9b9a"/>

  <!-- top left -->
  <g filter="url(#softShadow)">
    <rect x="42" y="43" width="132" height="67" rx="17" fill="#ffffff"/>
    <rect x="55" y="56" width="35" height="35" rx="11" fill="#dbe6ff"/>
    <path d="M65 65 h15 M65 72 h15 M65 79 h10" stroke="#627fc7" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="70" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34455d" font-weight="600">Turnuva</text>
    <text x="100" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Format ve kurallar</text>
  </g>

  <!-- top right -->
  <g filter="url(#softShadow)">
    <rect x="465" y="43" width="133" height="67" rx="17" fill="#ffffff"/>
    <rect x="478" y="56" width="35" height="35" rx="11" fill="#d9f1e8"/>
    <circle cx="489" cy="68" r="5" fill="#59a98c"/>
    <circle cx="503" cy="68" r="5" fill="#59a98c"/>
    <path d="M483 82 C486 75 493 75 496 82 M497 82 C500 75 507 75 510 82" fill="none" stroke="#59a98c" stroke-width="1.8" stroke-linecap="round"/>
    <text x="523" y="70" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34455d" font-weight="600">Katılımcı</text>
    <text x="523" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Takım veya oyuncu</text>
  </g>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="249" y="108" width="142" height="106" rx="26" fill="url(#core)"/>
    <circle cx="320" cy="143" r="21" fill="#ffffff" opacity="0.22"/>
    <path d="M307 143 h26 M320 130 v26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Hesaplama Motoru</text>
    <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#effffc">Puan · Averaj · Sıralama</text>
  </g>

  <!-- bottom left -->
  <g filter="url(#softShadow)">
    <rect x="42" y="210" width="132" height="67" rx="17" fill="#ffffff"/>
    <rect x="55" y="223" width="35" height="35" rx="11" fill="#ffe9d4"/>
    <path d="M62 234 h21 M62 242 h14 M77 242 h6 M62 250 h21" stroke="#d68b52" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34455d" font-weight="600">Karşılaşma</text>
    <text x="100" y="254" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Skor ve durum</text>
  </g>

  <!-- bottom right -->
  <g filter="url(#softShadow)">
    <rect x="465" y="210" width="133" height="67" rx="17" fill="#ffffff"/>
    <rect x="478" y="223" width="35" height="35" rx="11" fill="#f0e2ff"/>
    <path d="M486 249 v-7 M495 249 v-14 M504 249 v-20" stroke="#9b72c8" stroke-width="3.2" stroke-linecap="round"/>
    <text x="523" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34455d" font-weight="600">Puan Tablosu</text>
    <text x="523" y="254" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Yeniden hesaplanır</text>
  </g>

  <!-- output -->
  <g filter="url(#shadow)">
    <rect x="220" y="264" width="200" height="43" rx="15" fill="#ffffff"/>
    <rect x="233" y="275" width="20" height="20" rx="7" fill="#d8f0e5"/>
    <path d="M239 285 l4 4 7-8" fill="none" stroke="#4f9a7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="265" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34455d" font-weight="700">Güvenilir Sıralama</text>
    <text x="265" y="297" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Denetim ve önbellek</text>
  </g>
</svg>