<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Hata Yönetimi: Error Değerleri ve Panic-Recover</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="115" width="150" height="50" rx="12" fill="#4a90d9" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Go Hata Modeli</text>
  <text x="320" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f0fe">(T, error) dönüşü</text>

  <!-- Sol üst: Error value -->
  <rect x="40" y="50" width="140" height="55" rx="10" fill="#e8f4e8" stroke="#7cb342" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="110" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#33691e">Error Değeri</text>
  <text x="110" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#558b2f">if err != nil</text>
  <text x="110" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#689f38">açık kontrol</text>

  <!-- Sol alt: Error wrapping -->
  <rect x="40" y="135" width="140" height="55" rx="10" fill="#fff8e1" stroke="#fbc02d" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="110" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#f57f17">Error Wrapping</text>
  <text x="110" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#f9a825">%w ile bağlam</text>
  <text x="110" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fbc02d">errors.Is / As</text>

  <!-- Sol alt alt: Panic -->
  <rect x="40" y="220" width="140" height="55" rx="10" fill="#fce4ec" stroke="#e57373" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="110" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Panic</text>
  <text x="110" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e53935">varsayım çökmesi</text>
  <text x="110" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ef5350">acil durum</text>

  <!-- Sağ üst: Recover -->
  <rect x="460" y="50" width="140" height="55" rx="10" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="530" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Recover</text>
  <text x="530" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1976d2">defer içinde</text>
  <text x="530" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#42a5f5">panic yakalama</text>

  <!-- Sağ alt: İstisna karşılaştırma -->
  <rect x="460" y="135" width="140" height="55" rx="10" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="530" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">Exception</text>
  <text x="530" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8e24aa">ani akış atlama</text>
  <text x="530" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ab47bc">gizli yollar</text>

  <!-- Sağ alt alt: Tasarım önerileri -->
  <rect x="460" y="220" width="140" height="55" rx="10" fill="#e0f2f1" stroke="#26a69a" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="530" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#00695c">Tasarım Önerileri</text>
  <text x="530" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#00897b">bağlam ekle</text>
  <text x="530" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#26a69a">sınırlarda recover</text>

  <!-- Oklar: merkezden dışa -->
  <!-- Sol üst ok -->
  <path d="M245 130 L185 82" stroke="#7cb342" stroke-width="2" fill="none"/>
  <polygon points="185 82, 193 88, 189 76" fill="#7cb342"/>

  <!-- Sol alt ok -->
  <path d="M245 145 L185 168" stroke="#fbc02d" stroke-width="2" fill="none"/>
  <polygon points="185 168, 195 165, 189 175" fill="#fbc02d"/>

  <!-- Sol alt alt ok -->
  <path d="M245 155 L185 242" stroke="#e57373" stroke-width="2" fill="none"/>
  <polygon points="185 242, 195 236, 189 248" fill="#e57373"/>

  <!-- Sağ üst ok -->
  <path d="M395 130 L455 82" stroke="#42a5f5" stroke-width="2" fill="none"/>
  <polygon points="455 82, 447 88, 451 76" fill="#42a5f5"/>

  <!-- Sağ alt ok -->
  <path d="M395 145 L455 168" stroke="#ab47bc" stroke-width="2" fill="none"/>
  <polygon points="455 168, 445 165, 451 175" fill="#ab47bc"/>

  <!-- Sağ alt alt ok -->
  <path d="M395 155 L455 242" stroke="#26a69a" stroke-width="2" fill="none"/>
  <polygon points="455 242, 445 236, 451 248" fill="#26a69a"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" opacity="0.8">P(başarı) + P(hata) = 1</text>
</svg>