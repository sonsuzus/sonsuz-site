<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d9f3ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7890a8" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6c8195" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="39" r="65" fill="#dceeff" opacity="0.42"/>
  <circle cx="598" cy="275" r="92" fill="#dff3dd" opacity="0.38"/>
  <path d="M28 265 C122 221, 150 290, 246 254 S410 219, 601 255" fill="none" stroke="#c9e3da" stroke-width="2" opacity="0.55"/>

  <text x="30" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496078" font-weight="600">Klasik Bilgisayarda Kuantum Simülatörü</text>
  <text x="30" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a2">durum vektörü ile periyot bulma</text>

  <!-- Left: classical simulator -->
  <g filter="url(#shadow)">
    <rect x="30" y="88" width="132" height="151" rx="18" fill="#ffffff"/>
    <rect x="30" y="88" width="132" height="35" rx="18" fill="#dbeaff"/>
    <rect x="30" y="106" width="132" height="17" fill="#dbeaff"/>
  </g>
  <text x="53" y="111" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#365778">Klasik Simülatör</text>
  <rect x="48" y="141" width="96" height="27" rx="8" fill="#eff6ff" stroke="#c8dcef"/>
  <text x="61" y="159" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6880">NumPy vektörü</text>
  <rect x="48" y="180" width="96" height="38" rx="8" fill="#f3faf6" stroke="#cce5d7"/>
  <text x="67" y="197" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7664">2ⁿ genlik</text>
  <text x="60" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#789286">O(2ⁿ) bellek</text>

  <!-- arrow 1 -->
  <path d="M172 163 L202 163" stroke="#7896ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="202,163 194,158 194,168" fill="#7896ad"/>

  <!-- Center quantum core -->
  <g filter="url(#shadow)">
    <rect x="212" y="70" width="190" height="188" rx="24" fill="url(#core)"/>
  </g>
  <text x="258" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#315f6d">Kuantum Durumu</text>
  <text x="250" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527783">α|0⟩ + β|1⟩</text>

  <g filter="url(#smallShadow)">
    <circle cx="270" cy="159" r="27" fill="#ffffff"/>
    <circle cx="270" cy="159" r="17" fill="#e8dfff"/>
    <text x="262" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#665282">H</text>
  </g>
  <path d="M299 159 L319 159" stroke="#6e91a1" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="319,159 312,155 312,163" fill="#6e91a1"/>

  <g filter="url(#smallShadow)">
    <circle cx="344" cy="145" r="8" fill="#8ec6b1"/>
    <path d="M344 153 L344 177" stroke="#679987" stroke-width="2"/>
    <circle cx="344" cy="188" r="15" fill="#ffffff" stroke="#8ec6b1" stroke-width="3"/>
    <path d="M336 188 L352 188 M344 180 L344 196" stroke="#679987" stroke-width="2"/>
  </g>
  <text x="326" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f776d">CNOT</text>

  <rect x="237" y="228" width="140" height="18" rx="8" fill="#ffffff" opacity="0.76"/>
  <text x="249" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527783">Bell: |00⟩ + |11⟩</text>

  <!-- arrow 2 -->
  <path d="M412 163 L440 163" stroke="#7896ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="440,163 432,158 432,168" fill="#7896ad"/>

  <!-- right period workflow -->
  <g filter="url(#shadow)">
    <rect x="450" y="88" width="160" height="151" rx="18" fill="#ffffff"/>
    <rect x="450" y="88" width="160" height="35" rx="18" fill="#f5e6cb"/>
    <rect x="450" y="106" width="160" height="17" fill="#f5e6cb"/>
  </g>
  <text x="475" y="111" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#806035">Shor Akışı</text>

  <rect x="468" y="140" width="124" height="25" rx="8" fill="#fff8eb"/>
  <text x="482" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806847">aˣ mod N</text>

  <path d="M530 169 L530 180" stroke="#b3905e" stroke-width="2"/>
  <polygon points="530,180 526,173 534,173" fill="#b3905e"/>

  <rect x="468" y="184" width="56" height="28" rx="8" fill="#e7f1ff"/>
  <text x="483" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496d94">QFT</text>
  <rect x="536" y="184" width="56" height="28" rx="8" fill="#e8f5e9"/>
  <text x="548" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#51775a">EBOB</text>

  <path d="M524 198 L533 198" stroke="#7896ad" stroke-width="2"/>
  <polygon points="533,198 527,194 527,202" fill="#7896ad"/>

  <!-- bottom outcome -->
  <g filter="url(#smallShadow)">
    <rect x="224" y="278" width="192" height="27" rx="13" fill="#ffffff"/>
  </g>
  <circle cx="243" cy="291.5" r="7" fill="#9dcdb1"/>
  <text x="257" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496d59">Periyot r = 4</text>
  <path d="M346 291 L360 291" stroke="#85a89a" stroke-width="2"/>
  <polygon points="360,291 354,287 354,295" fill="#85a89a"/>
  <text x="371" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#496d59">15 = 3 × 5</text>

  <path d="M530 244 L530 267 L416 267 L416 286" fill="none" stroke="#98b8a7" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="416,286 412,279 420,279" fill="#98b8a7"/>
</svg>