    <circle cx="266" cy="210" r="17" fill="#edc8e5"/>
    <text x="266" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9b4e8c">+</text>
    <text x="294" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#794169">Tek sayı</text>
    <text x="294" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#976b8d">3n + 1</text>
  </g>

