  <polygon points="429,146 441,157 426,158" fill="#7990a7"/>
  <path d="M390 210 C414 210 415 179 435 169" fill="none" stroke="#7990a7" stroke-width="2"/>
  <polygon points="426,165 441,166 430,177" fill="#7990a7"/>

