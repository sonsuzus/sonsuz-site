    <text x="88" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40556b">Pozitif tam sayı</text>
    <text x="88" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a7">Başlangıç değeri</text>
  </g>

