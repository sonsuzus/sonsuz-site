    <text x="142" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="159" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7895">3</text>
    <text x="176" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="193" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7895">10</text>
    <text x="218" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="235" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7895">5</text>
    <text x="252" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="269" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7895">16</text>
    <text x="295" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="312" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7895">8</text>
    <text x="329" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="346" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7895">4</text>
    <text x="363" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="380" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7895">2</text>
    <text x="397" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0b1">→</text>
    <text x="414" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#367656">1</text>
    <text x="51" y="283" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b90a1">27 sayısı 9232'ye çıkabilir • Genel ispat bilinmiyor</text>
