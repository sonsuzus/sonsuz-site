    <text x="266" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a66d16">%</text>
    <text x="294" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765326">Çift sayı</text>
    <text x="294" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#96794c">n / 2</text>
  </g>

  <g filter="url(#soft)">
