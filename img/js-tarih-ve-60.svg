<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e9"/>
      <stop offset="100%" stop-color="#ccebd2"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8fd"/>
      <stop offset="100%" stop-color="#e0d4f5"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8ef"/>
      <stop offset="100%" stop-color="#f8d4e0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#8899aa" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#8899aa" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="640" height="320" rx="12" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">JavaScript Tarih ve Zaman</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="55" width="150" height="42" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#b0c4de" stroke-width="1"/>
  <text x="320" y="81" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">new Date()</text>

  <!-- Ok: merkezden yukarı -->
  <path d="M320 97 L320 118" stroke="#5b7a9d" stroke-width="1.5" fill="none"/>
  <polygon points="315,116 320,126 325,116" fill="#5b7a9d"/>

  <!-- Üst kutu: Anlık zaman -->
  <rect x="215" y="128" width="210" height="36" rx="8" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a8cbaa" stroke-width="1"/>
  <text x="320" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c4a3a">Tarayıcı anlık tarih ve saat</text>

  <!-- Oklar: merkezden sola ve sağa -->
  <path d="M245 76 L190 76" stroke="#5b7a9d" stroke-width="1.5" fill="none"/>
  <polygon points="193,71 183,76 193,81" fill="#5b7a9d"/>

  <path d="M395 76 L450 76" stroke="#5b7a9d" stroke-width="1.5" fill="none"/>
  <polygon points="447,71 457,76 447,81" fill="#5b7a9d"/>

  <!-- Sol kutu: String parametre -->
  <rect x="40" y="55" width="140" height="42" rx="8" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#e0c090" stroke-width="1"/>
  <text x="110" y="71" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a4a2a">String tarih</text>
  <text x="110" y="87" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a4a">8/24/2010 14:50:10</text>

  <!-- Sağ kutu: Sayısal parametre -->
  <rect x="460" y="55" width="140" height="42" rx="8" fill="url(#boxGrad4)" filter="url(#shadowLight)" stroke="#b0a0d0" stroke-width="1"/>
  <text x="530" y="71" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a2a5a">Sayısal parametre</text>
  <text x="530" y="87" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a7a">yıl, ay, gün, saat...</text>

  <!-- Alt kısım: Metotlar -->
  <path d="M320 164 L320 190" stroke="#5b7a9d" stroke-width="1.5" fill="none"/>
  <polygon points="315,188 320,198 325,188" fill="#5b7a9d"/>

  <rect x="140" y="200" width="360" height="36" rx="8" fill="url(#boxGrad5)" filter="url(#shadowLight)" stroke="#d0a0b0" stroke-width="1"/>
  <text x="320" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a2a3a">Zaman ekleme, yıl veya saat bilgisi alma</text>

  <!-- Alt dallar -->
  <path d="M200 236 L200 258" stroke="#5b7a9d" stroke-width="1.2" fill="none"/>
  <polygon points="196,256 200,265 204,256" fill="#5b7a9d"/>
  <rect x="120" y="267" width="160" height="32" rx="7" fill="#e8f0fe" filter="url(#shadowLight)" stroke="#b0c4de" stroke-width="1"/>
  <text x="200" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">getFullYear()</text>

  <path d="M440 236 L440 258" stroke="#5b7a9d" stroke-width="1.2" fill="none"/>
  <polygon points="436,256 440,265 444,256" fill="#5b7a9d"/>
  <rect x="360" y="267" width="160" height="32" rx="7" fill="#e8f0fe" filter="url(#shadowLight)" stroke="#b0c4de" stroke-width="1"/>
  <text x="440" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">getHours()</text>

  <!-- Bağlantı çizgisi -->
  <path d="M280 236 L280 250 L200 250 L200 258" stroke="#5b7a9d" stroke-width="1.2" fill="none"/>
  <path d="M360 236 L360 250 L440 250 L440 258" stroke="#5b7a9d" stroke-width="1.2" fill="none"/>

  <!-- Küçük etiketler -->
  <text x="110" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a8a9a">Parametre türleri</text>
  <text x="530" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a8a9a">Parametre türleri</text>
</svg>