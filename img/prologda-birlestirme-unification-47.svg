<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#c9ddf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#71839a" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#71839a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="120" fill="#dceef1" opacity="0.3"/>
  <circle cx="320" cy="160" r="92" fill="none" stroke="#c4dce1" stroke-width="1.5" stroke-dasharray="4 6"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476072" font-weight="600">PROLOG BİRLEŞTİRME AKIŞI</text>

  <g filter="url(#shadow)">
    <rect x="29" y="73" width="148" height="74" rx="16" fill="#fff7e7" stroke="#ead7ad"/>
    <rect x="29" y="174" width="148" height="74" rx="16" fill="#f3eaff" stroke="#d8c6ec"/>
  </g>

  <text x="49" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a5935" font-weight="600">Terim 1</text>
  <rect x="48" y="108" width="109" height="24" rx="8" fill="#fffdf7"/>
  <text x="102" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#695b43">nokta(X, 5)</text>

  <text x="49" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#655176" font-weight="600">Terim 2</text>
  <rect x="48" y="209" width="109" height="24" rx="8" fill="#fcf9ff"/>
  <text x="102" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#655176">nokta(3, Y)</text>

  <path d="M177 110 C204 110 208 129 232 140" fill="none" stroke="#8ba2ae" stroke-width="2"/>
  <polygon points="232,140 222,134 224,145" fill="#8ba2ae"/>
  <path d="M177 211 C204 211 208 191 232 180" fill="none" stroke="#8ba2ae" stroke-width="2"/>
  <polygon points="232,180 224,175 222,186" fill="#8ba2ae"/>

  <g filter="url(#shadow)">
    <rect x="235" y="101" width="170" height="118" rx="28" fill="url(#core)" stroke="#a9c6df"/>
  </g>
  <circle cx="320" cy="139" r="25" fill="#f7fcff" stroke="#96b8d6" stroke-width="1.5"/>
  <path d="M309 139 L317 147 L333 130" fill="none" stroke="#4c86b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315a78" font-weight="700">Birleştirme</text>
  <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53738b">Yapı • İsim • Arite</text>

  <path d="M405 147 L440 147" fill="none" stroke="#719a91" stroke-width="2.5"/>
  <polygon points="440,147 430,141 430,153" fill="#719a91"/>

  <g filter="url(#shadow)">
    <rect x="443" y="73" width="169" height="88" rx="16" fill="#eaf7ef" stroke="#b9d9c3"/>
    <rect x="443" y="180" width="169" height="68" rx="16" fill="#fff0ef" stroke="#ecc6c1"/>
  </g>

  <text x="462" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f7157" font-weight="700">En genel çözüm</text>
  <rect x="461" y="109" width="132" height="34" rx="9" fill="#fafffc"/>
  <text x="527" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397055">X = 3</text>
  <text x="527" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397055">Y = 5</text>

  <text x="462" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a554d" font-weight="700">Başarısızlık</text>
  <text x="527" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a554d">f(X) ≠ g(X)</text>

  <path d="M320 219 L320 264" fill="none" stroke="#8ba2ae" stroke-width="2"/>
  <polygon points="320,264 314,254 326,254" fill="#8ba2ae"/>

  <g filter="url(#smallShadow)">
    <rect x="204" y="266" width="232" height="35" rx="13" fill="#ffffff" stroke="#d4e1e4"/>
  </g>
  <circle cx="225" cy="283.5" r="8" fill="#b8dcd1"/>
  <text x="239" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#48656b">Katman katman eşleştirme</text>
</svg>