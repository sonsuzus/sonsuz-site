  <path d="M489 181 L489 206" stroke="#7098a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="483,202 495,202 489,211" fill="#7098a6"/>

  <g filter="url(#shadow)">
    <rect x="385" y="211" width="208" height="49" rx="16" fill="#d9e8ff"/>
