  <text x="315" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#896838">[3]</text>
  <text x="315" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#896838">[5]</text>
  <text x="315" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#896838">[1]</text>

  <rect x="67" y="150" width="100" height="25" rx="12" fill="#e8f1f5"/>
  <text x="117" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547184">1. Böl</text>
