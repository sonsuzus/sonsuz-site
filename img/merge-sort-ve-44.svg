    <rect x="34" y="205" width="294" height="77" rx="20" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="55" y="229" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#536b7e">Özyineleme ağacı</text>
  <path d="M57 251 L142 251" stroke="#a3bdc8" stroke-width="7" stroke-linecap="round"/>
  <path d="M57 251 L101 251" stroke="#81b7ad" stroke-width="7" stroke-linecap="round"/>
  <circle cx="57" cy="251" r="8" fill="#77b6a8"/>
  <circle cx="142" cy="251" r="8" fill="#9fc2d9"/>
  <text x="160" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607b89">Seviye başına</text>
  <text x="160" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39736b">O(n) iş</text>
  <rect x="243" y="226" width="65" height="37" rx="13" fill="#fff0cc"/>
  <text x="275" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#866a39">Toplam</text>
  <text x="275" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7a5a24">O(n log n)</text>

  <text x="48" y="303" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8390">Kararlı sıralama</text>
  <circle cx="154" cy="299" r="3" fill="#8bbdae"/>
  <text x="166" y="303" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8390">Ek bellek O(n)</text>
  <circle cx="278" cy="299" r="3" fill="#a7bdd9"/>
  <text x="290" y="303" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8390">Öngörülebilir süre</text>
</svg>