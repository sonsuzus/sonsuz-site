  <text x="439" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466376">[3, 8]</text>
  <text x="539" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466376">[1, 5]</text>
  <path d="M439 133 L462 143" stroke="#6d9c94" stroke-width="2" fill="none"/>
  <path d="M539 133 L516 143" stroke="#6d9c94" stroke-width="2" fill="none"/>
