  <text x="489" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47677c">Sıralı sonuç</text>
  <text x="489" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#30577a">[1, 3, 5, 8]</text>

