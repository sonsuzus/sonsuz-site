  <polygon points="179,82 188,87 179,92" fill="#7195a7"/>
  <polygon points="179,120 188,125 179,130" fill="#7195a7"/>
  <polygon points="284,71 293,76 284,81" fill="#7195a7"/>
  <polygon points="284,91 293,96 284,101" fill="#7195a7"/>
  <polygon points="284,111 293,116 284,121" fill="#7195a7"/>
  <polygon points="284,131 293,136 284,141" fill="#7195a7"/>

  <g filter="url(#shadow)">
    <rect x="42" y="78" width="86" height="54" rx="15" fill="#dbeaff"/>
    <rect x="181" y="66" width="66" height="42" rx="13" fill="#e1f2e9"/>
    <rect x="181" y="104" width="66" height="42" rx="13" fill="#e1f2e9"/>
    <rect x="293" y="58" width="45" height="35" rx="11" fill="#fff1cf"/>
