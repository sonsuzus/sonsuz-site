<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f1"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8cb8f4"/>
      <stop offset="100%" stop-color="#7798dc"/>
    </linearGradient>
    <filter id="golge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52708f" flood-opacity="0.20"/>
    </filter>
    <filter id="hafifGolge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52708f" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arka)"/>
  <circle cx="321" cy="155" r="120" fill="#dfeefa" opacity="0.42"/>
  <circle cx="321" cy="155" r="84" fill="none" stroke="#bdd6ef" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4660">
    <text x="28" y="28" font-weight="700" fill="#42617c">OLAY TABANLI ARAYÜZ</text>
    <text x="28" y="45" fill="#71879a">Kullanıcı etkileşimi · kuyruk · asenkron tepki</text>
  </g>

  <!-- Sol kullanıcı olayları -->
  <g filter="url(#golge)">
    <rect x="27" y="82" width="130" height="143" rx="18" fill="#ffffff"/>
    <rect x="27" y="82" width="130" height="31" rx="18" fill="#dceeff"/>
    <rect x="27" y="98" width="130" height="15" fill="#dceeff"/>
  </g>
  <text x="48" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365775">Kullanıcı</text>

  <g filter="url(#hafifGolge)">
    <rect x="43" y="126" width="98" height="23" rx="8" fill="#fff0d5"/>
    <rect x="43" y="157" width="98" height="23" rx="8" fill="#e4f4df"/>
    <rect x="43" y="188" width="98" height="23" rx="8" fill="#eee6fb"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d5965">
    <text x="69" y="142">Tıklama</text>
    <text x="72" y="173">Tuşlar</text>
    <text x="61" y="204">Kaydırma</text>
  </g>

  <!-- input to browser -->
  <path d="M157 153 H190" fill="none" stroke="#7e9db6" stroke-width="2.2"/>
  <polygon points="198,153 189,148 189,158" fill="#7e9db6"/>

  <!-- Tarayıcı -->
  <g filter="url(#golge)">
    <rect x="202" y="100" width="128" height="111" rx="18" fill="#ffffff"/>
    <rect x="202" y="100" width="128" height="30" rx="18" fill="#d9f1ed"/>
    <rect x="202" y="115" width="128" height="15" fill="#d9f1ed"/>
  </g>
  <text x="228" y="120" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386c68">Tarayıcı</text>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476167">
    <text x="224" y="151">Dinleyici</text>
    <text x="224" y="172">Olay nesnesi</text>
    <text x="224" y="193">Hedef</text>
  </g>
  <circle cx="302" cy="147" r="5" fill="#74c5b9"/>
  <circle cx="302" cy="169" r="5" fill="#74c5b9"/>
  <circle cx="302" cy="191" r="5" fill="#74c5b9"/>

  <!-- browser queue -->
  <path d="M331 154 H360" fill="none" stroke="#7e9db6" stroke-width="2.2"/>
  <polygon points="368,154 359,149 359,159" fill="#7e9db6"/>

  <!-- event loop center -->
  <g filter="url(#golge)">
    <circle cx="416" cy="154" r="53" fill="url(#merkez)"/>
    <circle cx="416" cy="154" r="42" fill="none" stroke="#dceaff" stroke-width="1.5" opacity="0.8"/>
  </g>
  <path d="M395 145 C403 127 428 126 437 143" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="438,150 440,140 431,143" fill="#ffffff"/>
  <path d="M437 163 C429 181 404 182 395 165" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="394,158 392,168 401,165" fill="#ffffff"/>
  <text x="385" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Olay Döngüsü</text>

  <!-- to call stack -->
  <path d="M470 154 H495" fill="none" stroke="#7e9db6" stroke-width="2.2"/>
  <polygon points="503,154 494,149 494,159" fill="#7e9db6"/>

  <!-- callback -->
  <g filter="url(#golge)">
    <rect x="507" y="96" width="108" height="117" rx="18" fill="#ffffff"/>
    <rect x="507" y="96" width="108" height="31" rx="18" fill="#e9e0fa"/>
    <rect x="507" y="112" width="108" height="15" fill="#e9e0fa"/>
  </g>
  <text x="523" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b4b7d">Geri Çağırım</text>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d5965">
    <text x="529" y="150">İşle</text>
    <text x="529" y="173">Arayüzü güncelle</text>
    <text x="529" y="195">Tepki ver</text>
  </g>

  <!-- async branch -->
  <path d="M416 207 V239" fill="none" stroke="#7e9db6" stroke-width="2"/>
  <polygon points="416,247 411,238 421,238" fill="#7e9db6"/>
  <g filter="url(#hafifGolge)">
    <rect x="348" y="251" width="137" height="46" rx="14" fill="#fff7dc"/>
  </g>
  <path d="M372 274 h13 m-6.5-6.5 v13" stroke="#c69239" stroke-width="2" stroke-linecap="round"/>
  <text x="394" y="271" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#756037">Asenkron İş</text>
  <text x="394" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7a55">Ağ ve zamanlayıcı</text>

  <!-- bubbling branch -->
  <path d="M267 212 V235 H194" fill="none" stroke="#9a8abd" stroke-width="2"/>
  <polygon points="186,235 195,230 195,240" fill="#9a8abd"/>
  <g filter="url(#hafifGolge)">
    <rect x="43" y="246" width="253" height="50" rx="15" fill="#ffffff"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <text x="61" y="267" font-weight="700" fill="#66527f">Yayılma ve Delegasyon</text>
    <text x="61" y="284" fill="#718092">Hedeften üst kapsayıcıya</text>
  </g>
  <path d="M256 280 V260" fill="none" stroke="#9a8abd" stroke-width="2"/>
  <polygon points="256,252 251,261 261,261" fill="#9a8abd"/>
  <circle cx="256" cy="285" r="5" fill="#b59bdd"/>
</svg>