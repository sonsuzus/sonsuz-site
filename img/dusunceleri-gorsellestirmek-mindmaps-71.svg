<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d8f4"/>
      <stop offset="100%" stop-color="#80bce5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66849a" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#66849a" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="105" cy="265" r="82" fill="#dff2e4" opacity="0.48"/>
  <circle cx="574" cy="58" r="94" fill="#dcecfb" opacity="0.55"/>

  <text x="32" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6077">DÜŞÜNCEYİ GÖRSEL SİSTEME DÖNÜŞTÜR</text>
  <line x1="32" y1="44" x2="608" y2="44" stroke="#c9dae3" stroke-width="1"/>

  <!-- Input -->
  <g filter="url(#softShadow)">
    <rect x="31" y="122" width="100" height="76" rx="18" fill="#fff8dc"/>
    <circle cx="57" cy="150" r="12" fill="#f7ce72"/>
    <path d="M57 140 L57 160 M47 150 L67 150" stroke="#8d6d27" stroke-width="2.2" stroke-linecap="round"/>
    <text x="80" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665224">Ham fikir</text>
    <text x="80" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7648">Yakalama</text>
  </g>

  <!-- input arrow -->
  <path d="M132 160 H166" fill="none" stroke="#7b9caf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="166,154 177,160 166,166" fill="#7b9caf"/>

  <!-- central -->
  <g filter="url(#shadow)">
    <circle cx="242" cy="160" r="70" fill="#eaf6fd"/>
    <circle cx="242" cy="160" r="56" fill="url(#core)"/>
    <circle cx="242" cy="160" r="44" fill="#bde3f8" opacity="0.48"/>
    <path d="M224 166 C224 149 233 140 242 140 C251 140 260 149 260 166" fill="none" stroke="#39779d" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="228" cy="169" r="4" fill="#39779d"/>
    <circle cx="242" cy="169" r="4" fill="#39779d"/>
    <circle cx="256" cy="169" r="4" fill="#39779d"/>
    <text x="242" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#285a78">Zihin haritası</text>
  </g>

  <!-- Branch top -->
  <path d="M221 95 C212 79 193 76 178 78" fill="none" stroke="#9bb7c7" stroke-width="2"/>
  <circle cx="174" cy="78" r="4" fill="#9bb7c7"/>
  <g filter="url(#softShadow)">
    <rect x="72" y="57" width="100" height="42" rx="14" fill="#efe5fb"/>
    <text x="122" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#674b85">Çağrışımlar</text>
  </g>

  <!-- Branch lower -->
  <path d="M212 215 C197 233 179 239 160 239" fill="none" stroke="#9bb7c7" stroke-width="2"/>
  <circle cx="156" cy="239" r="4" fill="#9bb7c7"/>
  <g filter="url(#softShadow)">
    <rect x="67" y="218" width="91" height="42" rx="14" fill="#dff1e5"/>
    <text x="112.5" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7659">Alt başlıklar</text>
  </g>

  <!-- workflow separator / arrows -->
  <path d="M314 160 H338" fill="none" stroke="#628ba5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="338,154 349,160 338,166" fill="#628ba5"/>

  <!-- tool columns -->
  <g filter="url(#softShadow)">
    <rect x="352" y="76" width="106" height="62" rx="16" fill="#f8e7d2"/>
    <rect x="352" y="146" width="106" height="62" rx="16" fill="#e6ddf6"/>
    <rect x="352" y="216" width="106" height="62" rx="16" fill="#d9efec"/>
  </g>

  <circle cx="375" cy="107" r="13" fill="#edb96c"/>
  <path d="M369 110 L375 101 L381 110" fill="none" stroke="#825c2b" stroke-width="2" stroke-linejoin="round"/>
  <text x="395" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#704c23">Mindmaps</text>
  <text x="395" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6c43">Dallandır</text>

  <rect x="363" y="159" width="24" height="18" rx="4" fill="#a58ace"/>
  <path d="M369 165 H381 M369 171 H378" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="395" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#604882">Excalidraw</text>
  <text x="395" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806a9c">Karala</text>

  <rect x="363" y="229" width="24" height="18" rx="4" fill="#72b9ad"/>
  <rect x="368" y="233" width="6" height="6" rx="1.5" fill="#ffffff"/>
  <rect x="377" y="233" width="6" height="6" rx="1.5" fill="#ffffff"/>
  <text x="395" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d726b">draw.io</text>
  <text x="395" y="262" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#568b84">Yapılandır</text>

  <!-- converge -->
  <path d="M459 107 C478 107 483 145 495 158" fill="none" stroke="#91aabd" stroke-width="2"/>
  <path d="M459 177 H493" fill="none" stroke="#91aabd" stroke-width="2"/>
  <path d="M459 247 C478 247 483 188 495 174" fill="none" stroke="#91aabd" stroke-width="2"/>
  <circle cx="497" cy="166" r="6" fill="#91aabd"/>
  <path d="M503 166 H516" fill="none" stroke="#628ba5" stroke-width="2.5"/>
  <polygon points="516,160 527,166 516,172" fill="#628ba5"/>

  <!-- output -->
  <g filter="url(#shadow)">
    <rect x="530" y="119" width="82" height="94" rx="19" fill="#ffffff"/>
    <rect x="548" y="137" width="46" height="37" rx="7" fill="#cdebd9"/>
    <path d="M557 154 H585 M557 162 H578" stroke="#4c8a68" stroke-width="2" stroke-linecap="round"/>
    <path d="M557 181 H585 M557 188 H579" stroke="#a7bfaf" stroke-width="2" stroke-linecap="round"/>
    <text x="571" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6f58">Sun ve paylaş</text>
  </g>

  <text x="32" y="299" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Az düğüm • anlamlı bağlantı • temiz çıktı</text>
</svg>