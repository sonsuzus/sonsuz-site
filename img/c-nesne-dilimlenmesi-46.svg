  <text x="371" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#535c79">yalnızca temel</text>

  <path d="M247 176 C274 176 278 195 300 199" fill="none" stroke="#d87878" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="300,199 291,193 292,204" fill="#d87878"/>
