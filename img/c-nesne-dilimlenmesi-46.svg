  </g>
  <text x="551" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#53667a">tanit()</text>
  <text x="551" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9c5653">Çalışan</text>

  <path d="M48 274 L592 274" stroke="#cadbe0" stroke-width="1.5"/>
