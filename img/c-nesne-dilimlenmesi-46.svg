  <text x="126" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d5076">Temel bölüm</text>
  <text x="126" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#535c79">ad · tanit()</text>
  <text x="126" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#27627d">Türetilmiş bölüm</text>
  <text x="126" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3c7088">dil · kimlik</text>
  <text x="126" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#48647a">Yazılımcı nesnesi</text>

