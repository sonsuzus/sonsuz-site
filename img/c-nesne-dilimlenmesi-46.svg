  <text x="348" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35735b">Kimlik korunur</text>

  <path d="M430 298 L475 298" fill="none" stroke="#4e9b78" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="475,298 465,292 465,304" fill="#4e9b78"/>
  <g filter="url(#soft)">
