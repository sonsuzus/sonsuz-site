<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d8e8"/>
      <stop offset="100%" stop-color="#7eb8d2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#527187" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5b7280" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="157" r="115" fill="#d8edf0" opacity="0.42"/>
  <circle cx="320" cy="157" r="90" fill="none" stroke="#b9d9df" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- bağlantılar -->
  <path d="M171 91 C194 102 207 112 227 124" fill="none" stroke="#769aaa" stroke-width="2"/>
  <polygon points="227,124 217,123 222,115" fill="#769aaa"/>
  <path d="M171 222 C194 210 206 200 226 188" fill="none" stroke="#769aaa" stroke-width="2"/>
  <polygon points="226,188 221,197 217,188" fill="#769aaa"/>
  <path d="M413 142 C438 130 452 114 469 99" fill="none" stroke="#769aaa" stroke-width="2"/>
  <polygon points="469,99 459,103 463,111" fill="#769aaa"/>
  <path d="M413 172 C438 184 452 199 469 213" fill="none" stroke="#769aaa" stroke-width="2"/>
  <polygon points="469,213 463,201 459,209" fill="#769aaa"/>

  <!-- kaynak kartı -->
  <g filter="url(#soft)">
    <rect x="36" y="53" width="137" height="77" rx="17" fill="#fffdf8"/>
    <rect x="47" y="66" width="29" height="38" rx="5" fill="#f4cfa4"/>
    <path d="M53 76h17M53 83h17M53 90h12" stroke="#b78264" stroke-width="2" stroke-linecap="round"/>
    <circle cx="91" cy="77" r="10" fill="#b9d8e6"/>
    <path d="M85 77h12M91 71v12" stroke="#4e8196" stroke-width="1.6"/>
    <text x="89" y="108" fill="#3e5b67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Arşiv ve bulgular</text>
  </g>

  <!-- tarama kartı -->
  <g filter="url(#soft)">
    <rect x="36" y="184" width="137" height="77" rx="17" fill="#fbfcff"/>
    <path d="M52 225l18-22 17 17 14-11 18 20H52z" fill="#a9d5c1"/>
    <path d="M53 231h65" stroke="#648d7e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="129" cy="207" r="12" fill="#d1c8eb"/>
    <path d="M123 207h12M129 201v12" stroke="#76669b" stroke-width="1.7"/>
    <text x="57" y="248" fill="#3e5b67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Tarama ve ölçüm</text>
  </g>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <rect x="226" y="105" width="188" height="105" rx="28" fill="url(#core)"/>
    <path d="M253 170v-29l26-16 26 16v29" fill="#eaf6f3" stroke="#47819a" stroke-width="2"/>
    <path d="M262 170v-22h34v22M279 125v45" fill="none" stroke="#47819a" stroke-width="2"/>
    <path d="M313 166v-38l21-12 22 12v38" fill="#d9eff4" stroke="#47819a" stroke-width="2"/>
    <path d="M322 166v-24h25v24" fill="none" stroke="#47819a" stroke-width="2"/>
    <text x="320" y="190" text-anchor="middle" fill="#17485d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Dijital rekonstrüksiyon</text>
  </g>

  <!-- VR kartı -->
  <g filter="url(#soft)">
    <rect x="469" y="53" width="136" height="77" rx="17" fill="#fffdfb"/>
    <path d="M492 81c0-9 8-15 17-15h18c9 0 17 6 17 15v12c0 5-4 8-9 8h-9l-5-6h-10l-5 6h-8c-4 0-7-3-7-8V81z" fill="#c7b9e4"/>
    <rect x="502" y="78" width="13" height="8" rx="3" fill="#665387"/>
    <rect x="522" y="78" width="13" height="8" rx="3" fill="#665387"/>
    <text x="537" y="116" text-anchor="middle" fill="#3e5b67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">WebXR deneyimi</text>
  </g>

  <!-- performans kartı -->
  <g filter="url(#soft)">
    <rect x="469" y="184" width="136" height="77" rx="17" fill="#fffdfb"/>
    <circle cx="499" cy="220" r="18" fill="#f3d69b"/>
    <path d="M499 207v14l10 6" fill="none" stroke="#9d7141" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="529" y="214" fill="#3e5b67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Akıcı çalışma</text>
    <text x="529" y="233" fill="#76634b" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">90 Hz · LOD</text>
  </g>

  <!-- alt kesinlik anahtarı -->
  <g filter="url(#soft)">
    <rect x="183" y="267" width="274" height="35" rx="15" fill="#ffffff"/>
    <circle cx="205" cy="284.5" r="7" fill="#70b69d"/>
    <text x="218" y="289" fill="#466b63" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Belgeli</text>
    <path d="M281 284h22" stroke="#a2b1ba" stroke-width="1.5"/>
    <circle cx="324" cy="284.5" r="7" fill="#e7af78"/>
    <text x="337" y="289" fill="#765d46" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Yorum ve belirsizlik</text>
  </g>
</svg>