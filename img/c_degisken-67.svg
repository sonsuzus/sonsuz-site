<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1e8f0"/>
    </linearGradient>
    <linearGradient id="globalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9e4c5"/>
      <stop offset="100%" stop-color="#a8d5a2"/>
    </linearGradient>
    <linearGradient id="localGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e7b3"/>
      <stop offset="100%" stop-color="#f2d68a"/>
    </linearGradient>
    <linearGradient id="paramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c5f0"/>
      <stop offset="100%" stop-color="#b8a8e0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">C Değişken Kapsamları</text>

  <!-- Bellek Alanı -->
  <rect x="30" y="50" width="580" height="240" rx="10" fill="url(#memGrad)" stroke="#b0c4d8" stroke-width="1.5" filter="url(#shadow)" opacity="0.7"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#34495e">Bellek Alanı</text>

  <!-- Global Değişkenler -->
  <rect x="55" y="90" width="170" height="80" rx="8" fill="url(#globalGrad)" stroke="#7dab70" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d5a2a">Global Değişkenler</text>
  <text x="140" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a6b37">Tüm fonksiyonların</text>
  <text x="140" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a6b37">dışında tanımlanır</text>

  <!-- Lokal Değişkenler -->
  <rect x="235" y="90" width="170" height="80" rx="8" fill="url(#localGrad)" stroke="#c4a04a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6b4e1a">Lokal Değişkenler</text>
  <text x="320" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a5c24">Fonksiyon içinde</text>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a5c24">tanımlanır</text>

  <!-- Parametre Değişkenleri -->
  <rect x="415" y="90" width="170" height="80" rx="8" fill="url(#paramGrad)" stroke="#8b7bb8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a7a">Parametreler</text>
  <text x="500" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a8a">Fonksiyon imzasında</text>
  <text x="500" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a8a">tanımlanır</text>

  <!-- Fonksiyon Kutuları -->
  <rect x="100" y="200" width="120" height="40" rx="6" fill="#ffffff" stroke="#95a5a6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="160" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">main()</text>

  <rect x="260" y="200" width="120" height="40" rx="6" fill="#ffffff" stroke="#95a5a6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">fonksiyon()</text>

  <rect x="420" y="200" width="120" height="40" rx="6" fill="#ffffff" stroke="#95a5a6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="480" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">fonksiyon(param)</text>

  <!-- Ok: Global -> main -->
  <path d="M 140 170 L 140 195 L 155 195" stroke="#7dab70" stroke-width="1.8" fill="none"/>
  <polygon points="160,195 150,190 150,200" fill="#7dab70"/>

  <!-- Ok: Global -> fonksiyon -->
  <path d="M 150 170 L 150 185 L 300 185 L 300 195" stroke="#7dab70" stroke-width="1.8" fill="none"/>
  <polygon points="300,200 295,190 305,190" fill="#7dab70"/>

  <!-- Ok: Global -> fonksiyon(param) -->
  <path d="M 160 170 L 160 180 L 470 180 L 470 195" stroke="#7dab70" stroke-width="1.8" fill="none"/>
  <polygon points="470,200 465,190 475,190" fill="#7dab70"/>

  <!-- Ok: Lokal -> main -->
  <path d="M 300 170 L 300 195" stroke="#c4a04a" stroke-width="1.8" fill="none"/>
  <polygon points="300,200 295,190 305,190" fill="#c4a04a"/>

  <!-- Ok: Lokal -> fonksiyon -->
  <path d="M 340 170 L 340 195" stroke="#c4a04a" stroke-width="1.8" fill="none"/>
  <polygon points="340,200 335,190 345,190" fill="#c4a04a"/>

  <!-- Ok: Parametre -> fonksiyon(param) -->
  <path d="M 500 170 L 500 195" stroke="#8b7bb8" stroke-width="1.8" fill="none"/>
  <polygon points="500,200 495,190 505,190" fill="#8b7bb8"/>

  <!-- Alt açıklama -->
  <rect x="55" y="260" width="530" height="25" rx="5" fill="#ffffff" opacity="0.6" filter="url(#shadowLight)"/>
  <text x="320" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">Kullanımdan önce bildirim ve değer ataması zorunludur</text>
</svg>