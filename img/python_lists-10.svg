<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="220" y="15" width="200" height="36" rx="18" fill="#4a90d9" filter="url(#shadow)"/>
  <text x="320" y="38" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Python Listeler</text>

  <!-- Merkez kavram -->
  <rect x="255" y="95" width="130" height="44" rx="10" fill="#5b9bd5" filter="url(#shadow)"/>
  <text x="320" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Liste Yapısı</text>

  <!-- Sol üst: Oluşturma -->
  <rect x="40" y="70" width="140" height="40" rx="8" fill="#a8d8ea" filter="url(#shadowLight)"/>
  <text x="110" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Oluşturma</text>
  <rect x="55" y="115" width="110" height="28" rx="6" fill="#d4e6f1"/>
  <text x="110" y="133" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">[ ] veya list()</text>

  <!-- Sol alt: Erişim -->
  <rect x="40" y="175" width="140" height="40" rx="8" fill="#a8d8ea" filter="url(#shadowLight)"/>
  <text x="110" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Erişim</text>
  <rect x="55" y="220" width="110" height="28" rx="6" fill="#d4e6f1"/>
  <text x="110" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Endeks 0'dan başlar</text>

  <!-- Sağ üst: Özellikler -->
  <rect x="460" y="70" width="140" height="40" rx="8" fill="#a9dfbf" filter="url(#shadowLight)"/>
  <text x="530" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#145a32">Özellikler</text>
  <rect x="465" y="115" width="130" height="28" rx="6" fill="#d5f5e3"/>
  <text x="530" y="133" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Sıralı ve değiştirilebilir</text>

  <!-- Sağ alt: Veri Türleri -->
  <rect x="460" y="175" width="140" height="40" rx="8" fill="#a9dfbf" filter="url(#shadowLight)"/>
  <text x="530" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#145a32">Veri Türleri</text>
  <rect x="465" y="220" width="130" height="28" rx="6" fill="#d5f5e3"/>
  <text x="530" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Aynı veya farklı olabilir</text>

  <!-- Alt: Örnek -->
  <rect x="220" y="265" width="200" height="36" rx="18" fill="#f0b27a" filter="url(#shadow)"/>
  <text x="320" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7b4b1e">liste1 = ["Bilgisayar", ...]</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üstten merkeze -->
  <path d="M180 90 L248 108" stroke="#5b9bd5" stroke-width="2" fill="none"/>
  <polygon points="248,108 238,103 240,113" fill="#5b9bd5"/>

  <!-- Sol alttan merkeze -->
  <path d="M180 195 L248 130" stroke="#5b9bd5" stroke-width="2" fill="none"/>
  <polygon points="248,130 238,133 243,123" fill="#5b9bd5"/>

  <!-- Sağ üstten merkeze -->
  <path d="M460 90 L392 108" stroke="#5b9bd5" stroke-width="2" fill="none"/>
  <polygon points="392,108 400,103 398,113" fill="#5b9bd5"/>

  <!-- Sağ alttan merkeze -->
  <path d="M460 195 L392 130" stroke="#5b9bd5" stroke-width="2" fill="none"/>
  <polygon points="392,130 400,133 395,123" fill="#5b9bd5"/>

  <!-- Alttan merkeze -->
  <path d="M320 265 L320 142" stroke="#f0b27a" stroke-width="2" fill="none"/>
  <polygon points="320,142 315,152 325,152" fill="#f0b27a"/>

  <!-- Liste elemanları görseli -->
  <rect x="230" y="155" width="180" height="30" rx="6" fill="#ebf5fb" stroke="#5b9bd5" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">[0] [1] [2] [3] ...</text>
</svg>