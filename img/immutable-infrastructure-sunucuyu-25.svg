<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="imageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#c7dff7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f6e5"/>
      <stop offset="100%" stop-color="#baeacb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7990a5" flood-opacity="0.2"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7990a5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="588" cy="32" r="74" fill="#dceffc" opacity="0.55"/>
  <circle cx="42" cy="287" r="90" fill="#e0f4e5" opacity="0.55"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38526b">DEĞİŞMEZ ALTYAPI</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668096">Yama yerine yeniden üret</text>

  <!-- Source -->
  <g filter="url(#shadow)">
    <rect x="32" y="87" width="115" height="92" rx="18" fill="#fff6e3"/>
    <rect x="32" y="87" width="115" height="28" rx="18" fill="#ffe4aa"/>
    <rect x="32" y="103" width="115" height="12" fill="#ffe4aa"/>
  </g>
  <path d="M59 132 h22 M59 142 h42 M59 152 h32" stroke="#b58132" stroke-width="3" stroke-linecap="round"/>
  <circle cx="119" cy="141" r="13" fill="#fff" opacity="0.72"/>
  <path d="M113 141 l4 4 8-9" fill="none" stroke="#58a16d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="89.5" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#6d5328">Kod ve Tanım</text>

  <!-- arrow 1 -->
  <path d="M157 133 H183" fill="none" stroke="#7f9ab1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="183,133 175,128 175,138" fill="#7f9ab1"/>

  <!-- Golden Image -->
  <g filter="url(#shadow)">
    <rect x="192" y="70" width="142" height="126" rx="22" fill="url(#imageGrad)"/>
    <rect x="205" y="84" width="116" height="37" rx="11" fill="#f8fcff" opacity="0.9"/>
    <rect x="205" y="129" width="116" height="17" rx="7" fill="#aacbe9"/>
    <rect x="205" y="151" width="78" height="17" rx="7" fill="#b7d8f0"/>
  </g>
  <path d="M255 91 l17 9 v17 l-17 9 -17-9 v-17z" fill="#73aeda"/>
  <path d="M247 106 h16 M255 98 v16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="263" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#335b7d">Altın İmaj</text>

  <!-- arrow 2 -->
  <path d="M345 133 H371" fill="none" stroke="#7f9ab1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="371,133 363,128 363,138" fill="#7f9ab1"/>

  <!-- test -->
  <g filter="url(#shadow)">
    <rect x="380" y="87" width="95" height="92" rx="18" fill="#eee9ff"/>
  </g>
  <circle cx="427" cy="124" r="20" fill="#d8cef8"/>
  <path d="M417 125 l7 7 14-17" fill="none" stroke="#6d58b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="427.5" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#554584">Doğrulama</text>

  <!-- arrow 3 -->
  <path d="M485 133 H510" fill="none" stroke="#7f9ab1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="510,133 502,128 502,138" fill="#7f9ab1"/>

  <!-- traffic / blue green -->
  <g filter="url(#shadow)">
    <rect x="519" y="68" width="91" height="131" rx="20" fill="#f9fcff"/>
  </g>
  <rect x="533" y="83" width="63" height="22" rx="8" fill="#b9d9f4"/>
  <rect x="533" y="115" width="63" height="22" rx="8" fill="url(#greenGrad)"/>
  <rect x="533" y="147" width="63" height="35" rx="10" fill="#edf4f8"/>
  <path d="M545 94 H581 M545 126 H581" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M553 160 H578 M553 170 H570" stroke="#8ba5b7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="564.5" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#416b8e">Mavi</text>
  <text x="564.5" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#397457">Yeşil</text>
  <text x="564.5" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4a6578">Trafik</text>

  <!-- lower flow -->
  <path d="M263 207 V229 H151 V244" fill="none" stroke="#91aabd" stroke-width="2" stroke-linecap="round"/>
  <polygon points="151,244 146,236 156,236" fill="#91aabd"/>
  <path d="M263 207 V229 H443 V244" fill="none" stroke="#91aabd" stroke-width="2" stroke-linecap="round"/>
  <polygon points="443,244 438,236 448,236" fill="#91aabd"/>

  <!-- replace -->
  <g filter="url(#smallShadow)">
    <rect x="67" y="245" width="169" height="51" rx="15" fill="#fff" opacity="0.94"/>
  </g>
  <circle cx="94" cy="270" r="15" fill="#f9d6d6"/>
  <path d="M88 264 l12 12 M100 264 l-12 12" stroke="#bf5d5d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M115 270 H135" stroke="#879dad" stroke-width="2" stroke-linecap="round"/>
  <polygon points="135,270 128,266 128,274" fill="#879dad"/>
  <circle cx="157" cy="270" r="15" fill="#ccefd9"/>
  <path d="M151 270 l4 4 8-9" fill="none" stroke="#4f9a68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="198" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#486172">Yenisini Başlat</text>

  <!-- external state -->
  <g filter="url(#smallShadow)">
    <rect x="359" y="245" width="169" height="51" rx="15" fill="#fff" opacity="0.94"/>
  </g>
  <ellipse cx="388" cy="259" rx="16" ry="6" fill="#a9d9ce"/>
  <path d="M372 259 v16 c0 4 32 4 32 0 v-16 M372 267 c0 4 32 4 32 0" fill="#cceee6" stroke="#6db5a5" stroke-width="1.5"/>
  <path d="M418 264 h18 M418 273 h29" stroke="#7595a7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="476" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#486172">Haricî Veri</text>
</svg>