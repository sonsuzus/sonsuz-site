<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="timeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8d8f0"/>
      <stop offset="50%" stop-color="#b7e5d1"/>
      <stop offset="100%" stop-color="#f7d7a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6c8294" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6c8294" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="54" cy="46" r="72" fill="#d9edf7" opacity="0.48"/>
  <circle cx="596" cy="275" r="95" fill="#dff0d5" opacity="0.46"/>

