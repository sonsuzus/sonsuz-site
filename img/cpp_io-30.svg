<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#5BA0E9"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="100%" stop-color="#D4EAF7"/>
    </linearGradient>
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF7E7"/>
      <stop offset="100%" stop-color="#D8EED2"/>
    </linearGradient>
    <linearGradient id="ioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="100%" stop-color="#FFE8CC"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <rect x="170" y="12" width="300" height="34" rx="17" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="320" y="34" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">C++ Giriş/Çıkış Sistemleri</text>

  <!-- Sol taraf: C tabanlı I/O -->
  <rect x="30" y="62" width="270" height="240" rx="12" fill="url(#cGrad)" stroke="#B8D8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="62" width="270" height="30" rx="12" fill="#4A90D9" opacity="0.85"/>
  <rect x="30" y="78" width="270" height="14" fill="#4A90D9" opacity="0.85"/>
  <text x="165" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C Tabanlı I/O</text>

  <!-- C fonksiyonları -->
  <rect x="50" y="104" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#7FB8E0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="105" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2C5F8A">printf() / scanf()</text>

  <rect x="50" y="142" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#7FB8E0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="105" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2C5F8A">getchar() / putchar()</text>

  <rect x="50" y="180" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#7FB8E0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="105" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2C5F8A">getch() / getche()</text>

  <rect x="50" y="218" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#7FB8E0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="105" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2C5F8A">fgets() / fputs()</text>

  <!-- C kütüphane etiketi -->
  <rect x="180" y="104" width="100" height="142" rx="8" fill="#FFFFFF" opacity="0.6" stroke="#A0C8E8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="230" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4A7A9E">Kütüphaneler</text>
  <text x="230" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4A7A9E">cstdio</text>
  <text x="230" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4A7A9E">conio.h</text>
  <text x="230" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4A7A9E">stdio.h</text>

  <!-- Fonksiyonel oklar -->
  <line x1="160" y1="118" x2="180" y2="130" stroke="#7FB8E0" stroke-width="1.2"/>
  <polygon points="180,130 176,124 184,126" fill="#7FB8E0"/>
  <line x1="160" y1="156" x2="180" y2="160" stroke="#7FB8E0" stroke-width="1.2"/>
  <polygon points="180,160 176,154 184,156" fill="#7FB8E0"/>
  <line x1="160" y1="194" x2="180" y2="190" stroke="#7FB8E0" stroke-width="1.2"/>
  <polygon points="180,190 176,184 184,186" fill="#7FB8E0"/>
  <line x1="160" y1="232" x2="180" y2="220" stroke="#7FB8E0" stroke-width="1.2"/>
  <polygon points="180,220 176,214 184,216" fill="#7FB8E0"/>

  <!-- Orta ok -->
  <path d="M 300 180 L 330 180" stroke="#888" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="330,180 322,176 322,184" fill="#888"/>

  <!-- Sağ taraf: C++ tabanlı I/O -->
  <rect x="340" y="62" width="270" height="240" rx="12" fill="url(#cppGrad)" stroke="#B0D8A8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="340" y="62" width="270" height="30" rx="12" fill="#5BA05B" opacity="0.85"/>
  <rect x="340" y="78" width="270" height="14" fill="#5BA05B" opacity="0.85"/>
  <text x="475" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C++ Nesneye Yönelik I/O</text>

  <!-- C++ akışları -->
  <rect x="360" y="104" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#8CC88C" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="415" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2E6B2E">cin (istream)</text>

  <rect x="360" y="142" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#8CC88C" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="415" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2E6B2E">cout (ostream)</text>

  <rect x="360" y="180" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#8CC88C" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="415" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2E6B2E">cerr (ostream)</text>

  <rect x="360" y="218" width="110" height="28" rx="8" fill="#FFFFFF" stroke="#8CC88C" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="415" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2E6B2E">clog (ostream)</text>

  <!-- C++ operatör etiketi -->
  <rect x="490" y="104" width="100" height="142" rx="8" fill="#FFFFFF" opacity="0.6" stroke="#A8D8A0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="540" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3A7A3A">Operatörler</text>
  <text x="540" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3A7A3A">&gt;&gt; (okuma)</text>
  <text x="540" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3A7A3A">&lt;&lt; (yazma)</text>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3A7A3A">Başlık: iostream</text>

  <!-- Operatör okları -->
  <line x1="470" y1="118" x2="490" y2="130" stroke="#8CC88C" stroke-width="1.2"/>
  <polygon points="490,130 486,124 494,126" fill="#8CC88C"/>
  <line x1="470" y1="156" x2="490" y2="160" stroke="#8CC88C" stroke-width="1.2"/>
  <polygon points="490,160 486,154 494,156" fill="#8CC88C"/>
  <line x1="470" y1="194" x2="490" y2="190" stroke="#8CC88C" stroke-width="1.2"/>
  <polygon points="490,190 486,184 494,186" fill="#8CC88C"/>
  <line x1="470" y1="232" x2="490" y2="220" stroke="#8CC88C" stroke-width="1.2"/>
  <polygon points="490,220 486,214 494,216" fill="#8CC88C"/>

  <!-- Alt bilgi -->
  <rect x="180" y="280" width="280" height="28" rx="14" fill="url(#ioGrad)" stroke="#E0C8A0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8A6A3A">Nesneye yönelik programlama desteği</text>
</svg>