<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d9fe8"/>
      <stop offset="100%" stop-color="#8fcfc0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#52708d" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#52708d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="75" cy="42" r="58" fill="#dbeeff" opacity="0.55"/>
  <circle cx="586" cy="278" r="77" fill="#dff2d9" opacity="0.55"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516b">LSTM Hücresi · Seçici Uzun Vadeli Hafıza</text>

  <!-- Previous state -->
  <g filter="url(#softShadow)">
    <rect x="25" y="73" width="92" height="50" rx="15" fill="#ffffff"/>
    <rect x="25" y="73" width="92" height="50" rx="15" fill="none" stroke="#d7e5ef"/>
  </g>
  <text x="71" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#455f76">Önceki</text>
  <text x="71" y="111" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60798e">durumlar</text>

  <!-- Input -->
  <g filter="url(#softShadow)">
    <rect x="25" y="193" width="92" height="50" rx="15" fill="#ffffff"/>
    <rect x="25" y="193" width="92" height="50" rx="15" fill="none" stroke="#d7e5ef"/>
  </g>
  <text x="71" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#455f76">Yeni girdi</text>
  <text x="71" y="231" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60798e">zaman adımı</text>

  <!-- connectors into cell -->
  <path d="M117 98 H143 V142 H162" fill="none" stroke="#8ca7bd" stroke-width="2"/>
  <polygon points="162,142 154,137 154,147" fill="#8ca7bd"/>
  <path d="M117 218 H143 V178 H162" fill="none" stroke="#8ca7bd" stroke-width="2"/>
  <polygon points="162,178 154,173 154,183" fill="#8ca7bd"/>

  <!-- LSTM container -->
  <g filter="url(#shadow)">
    <rect x="162" y="55" width="345" height="211" rx="24" fill="#ffffff" opacity="0.94"/>
    <rect x="162" y="55" width="345" height="211" rx="24" fill="none" stroke="#d6e4ed" stroke-width="1.5"/>
  </g>
  <text x="181" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#415e75">LSTM hücresi</text>

  <!-- Memory highway -->
  <path d="M180 105 H474" fill="none" stroke="#d5e3ed" stroke-width="17" stroke-linecap="round"/>
  <path d="M180 105 H474" fill="none" stroke="url(#memory)" stroke-width="10" stroke-linecap="round"/>
  <polygon points="480,105 468,98 468,112" fill="#8fcfc0"/>
  <text x="327" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Hücre durumu · C</text>

  <!-- Forget gate -->
  <g filter="url(#softShadow)">
    <rect x="184" y="136" width="74" height="76" rx="17" fill="#fde7df"/>
    <rect x="184" y="136" width="74" height="76" rx="17" fill="none" stroke="#f2c9bb"/>
  </g>
  <circle cx="221" cy="155" r="12" fill="#ef9981"/>
  <path d="M215 155 H227" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="221" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a5545">Unutma</text>
  <text x="221" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a36a59">Seç ve sil</text>
  <path d="M221 136 V117" fill="none" stroke="#d48570" stroke-width="2"/>
  <polygon points="221,112 216,120 226,120" fill="#d48570"/>

  <!-- Input gate -->
  <g filter="url(#softShadow)">
    <rect x="298" y="136" width="74" height="76" rx="17" fill="#e8e1fb"/>
    <rect x="298" y="136" width="74" height="76" rx="17" fill="none" stroke="#d1c2f1"/>
  </g>
  <circle cx="335" cy="155" r="12" fill="#9b85d5"/>
  <path d="M335 149 V161 M329 155 H341" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
  <text x="335" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#625087">Giriş</text>
  <text x="335" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79679b">Yaz ve ekle</text>
  <path d="M335 136 V117" fill="none" stroke="#8870c4" stroke-width="2"/>
  <polygon points="335,112 330,120 340,120" fill="#8870c4"/>

  <!-- Output gate -->
  <g filter="url(#softShadow)">
    <rect x="412" y="136" width="74" height="76" rx="17" fill="#dff2eb"/>
    <rect x="412" y="136" width="74" height="76" rx="17" fill="none" stroke="#bde1d4"/>
  </g>
  <circle cx="449" cy="155" r="12" fill="#70bca7"/>
  <path d="M444 151 L454 155 L444 159 Z" fill="#ffffff"/>
  <text x="449" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d786a">Çıktı</text>
  <text x="449" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#588e81">Göster</text>
  <path d="M449 136 V117" fill="none" stroke="#60a993" stroke-width="2"/>
  <polygon points="449,112 444,120 454,120" fill="#60a993"/>

  <!-- Gate input bus -->
  <path d="M174 228 H486" fill="none" stroke="#bfd0dd" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M221 228 V215 M335 228 V215 M449 228 V215" fill="none" stroke="#bfd0dd" stroke-width="2"/>
  <text x="330" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a3">Geçmiş bilgi ve yeni gözlem</text>

  <!-- outputs -->
  <path d="M507 105 H544" fill="none" stroke="#7ebdad" stroke-width="2.5"/>
  <polygon points="552,105 540,98 540,112" fill="#7ebdad"/>
  <g filter="url(#softShadow)">
    <rect x="552" y="80" width="69" height="50" rx="15" fill="#ffffff"/>
    <rect x="552" y="80" width="69" height="50" rx="15" fill="none" stroke="#d7e5ef"/>
  </g>
  <text x="586.5" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45677a">Yeni</text>
  <text x="586.5" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60798e">bellek</text>

  <path d="M486 174 H526 V211 H544" fill="none" stroke="#70bca7" stroke-width="2.5"/>
  <polygon points="552,211 540,204 540,218" fill="#70bca7"/>
  <g filter="url(#softShadow)">
    <rect x="552" y="186" width="69" height="50" rx="15" fill="#ffffff"/>
    <rect x="552" y="186" width="69" height="50" rx="15" fill="none" stroke="#d7e5ef"/>
  </g>
  <text x="586.5" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45677a">Gizli</text>
  <text x="586.5" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60798e">çıktı</text>

  <!-- Bottom message -->
  <g filter="url(#softShadow)">
    <rect x="182" y="278" width="276" height="26" rx="13" fill="#e7f2f8"/>
  </g>
  <circle cx="199" cy="291" r="5" fill="#6e9fbd"/>
  <text x="215" y="295" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496a80">Uzun dizilerde kararlı bilgi akışı</text>
</svg>