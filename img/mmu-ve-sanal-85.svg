<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="cpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#bcd6f5"/>
    </linearGradient>
    <linearGradient id="mmu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6dcff"/>
      <stop offset="100%" stop-color="#cfc0f0"/>
    </linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f1df"/>
      <stop offset="100%" stop-color="#bce1c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c8297" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6c8297" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="510" cy="39" r="78" fill="#d9f0e2" opacity="0.34"/>
  <circle cx="112" cy="286" r="92" fill="#dbe9ff" opacity="0.40"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40546b">Sanal Adresleme Akışı</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718296">VPN eşleşir, ofset korunur</text>

  <g filter="url(#shadow)">
    <rect x="32" y="98" width="122" height="112" rx="19" fill="url(#cpu)"/>
    <rect x="43" y="110" width="100" height="27" rx="9" fill="#ffffff" opacity="0.62"/>
    <text x="93" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40546b">CPU</text>
    <text x="93" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b637a">Sanal Adres</text>
    <rect x="48" y="171" width="90" height="24" rx="7" fill="#ffffff" opacity="0.76"/>
    <text x="93" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#47627d">VPN | Ofset</text>
  </g>

  <path d="M154 154 H183" fill="none" stroke="#6685a1" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="183,154 174,149 174,159" fill="#6685a1"/>

  <g filter="url(#shadow)">
    <rect x="190" y="76" width="132" height="157" rx="19" fill="url(#mmu)"/>
    <rect x="202" y="89" width="108" height="28" rx="9" fill="#ffffff" opacity="0.58"/>
    <text x="256" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#51436d">MMU</text>

    <rect x="205" y="130" width="102" height="39" rx="11" fill="#f9f7ff" opacity="0.86"/>
    <text x="256" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5a4b73">TLB</text>
    <text x="256" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74668a">Hızlı önbellek</text>

    <rect x="205" y="180" width="102" height="38" rx="11" fill="#f9f7ff" opacity="0.67"/>
    <text x="256" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a4b73">Çeviri</text>
  </g>

  <path d="M322 138 H358 V102 H383" fill="none" stroke="#7c6a9d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="383,102 374,97 374,107" fill="#7c6a9d"/>
  <rect x="332" y="119" width="48" height="20" rx="10" fill="#e8ddf7"/>
  <text x="356" y="133" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64537e">İsabet</text>

  <path d="M322 192 H347 V238 H383" fill="none" stroke="#8a789d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="383,238 374,233 374,243" fill="#8a789d"/>
  <rect x="327" y="199" width="56" height="20" rx="10" fill="#f0e8f8"/>
  <text x="355" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#706080">Kaçırma</text>

  <g filter="url(#soft)">
