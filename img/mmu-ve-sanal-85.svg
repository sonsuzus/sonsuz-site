    <text x="444" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#775a2d">Fiziksel</text>
    <text x="444" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#775a2d">Çerçeve</text>
    <text x="444" y="127" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#967544">PFN + Ofset</text>
  </g>

  <g filter="url(#soft)">
    <rect x="388" y="198" width="112" height="81" rx="17" fill="#fde6e5"/>
    <text x="444" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#815453">Sayfa Tablosu</text>
    <line x1="405" y1="239" x2="482" y2="239" stroke="#dfb7b5" stroke-width="1"/>
    <text x="408" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936563">VPN</text>
    <text x="459" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936563">PFN</text>
  </g>

  <path d="M500 102 H521" fill="none" stroke="#6685a1" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="521,102 512,97 512,107" fill="#6685a1"/>
  <path d="M500 238 H521" fill="none" stroke="#a07878" stroke-width="2.1" stroke-linecap="round"/>
  <polygon points="521,238 512,233 512,243" fill="#a07878"/>

  <g filter="url(#shadow)">
    <rect x="528" y="83" width="82" height="174" rx="19" fill="url(#ram)"/>
    <text x="569" y="111" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6c53">RAM</text>
    <rect x="543" y="125" width="52" height="20" rx="5" fill="#edf9ef"/>
    <rect x="543" y="150" width="52" height="20" rx="5" fill="#ffffff" opacity="0.68"/>
    <rect x="543" y="175" width="52" height="20" rx="5" fill="#b8dfc2"/>
    <rect x="543" y="200" width="52" height="20" rx="5" fill="#ffffff" opacity="0.68"/>
    <text x="569" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7254">Çerçeve 9</text>
    <text x="569" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#548267">Gerçek bellek</text>
