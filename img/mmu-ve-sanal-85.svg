  <path d="M444 142 V170 H522 V191" fill="none" stroke="#789584" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round"/>
  <polygon points="522,191 517,182 527,182" fill="#789584"/>

  <g transform="translate(32 260)">
    <rect width="281" height="35" rx="12" fill="#ffffff" opacity="0.68"/>
    <circle cx="18" cy="17.5" r="8" fill="#88b99a"/>
    <path d="M14.5 17.5 L17 20 L21.5 14.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="35" y="22" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a61">Aynı ofset, yeni fiziksel çerçeve</text>
  </g>
