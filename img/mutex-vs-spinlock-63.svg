<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="mutex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dcf5"/>
    </linearGradient>
    <linearGradient id="spin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5c9"/>
      <stop offset="100%" stop-color="#f8cfa1"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff3df"/>
      <stop offset="100%" stop-color="#c5e8d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66829a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#66829a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="55" cy="47" r="76" fill="#dcefff" opacity="0.45"/>
  <circle cx="595" cy="282" r="93" fill="#dff1d8" opacity="0.48"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31536d">KİLİT BEKLEME STRATEJİSİ</text>

  <g filter="url(#shadow)">
    <rect x="242" y="43" width="156" height="52" rx="18" fill="#ffffff"/>
    <circle cx="270" cy="69" r="14" fill="#9fc7df"/>
    <path d="M265 69h10M270 64v10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="285" y="67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35536a">Paylaşılan Veri</text>
    <text x="285" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8291">Kritik bölüm</text>
  </g>

  <path d="M280 96 C245 112 193 113 169 128" fill="none" stroke="#7c9bb2" stroke-width="2.5" stroke-linecap="round"/>
