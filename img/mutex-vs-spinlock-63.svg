  <path d="M360 96 C395 112 447 113 471 128" fill="none" stroke="#b98a58" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="470,135 463,126 474,125" fill="#b98a58"/>

  <g filter="url(#shadow)">
    <rect x="54" y="128" width="224" height="105" rx="20" fill="url(#mutex)"/>
    <rect x="70" y="144" width="39" height="39" rx="12" fill="#ffffff" opacity="0.83"/>
    <path d="M82 160c0-5 3-8 8-8s8 3 8 8v4h-16z" fill="none" stroke="#4e7ca0" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="80" y="164" width="20" height="13" rx="3" fill="#4e7ca0"/>
    <circle cx="90" cy="170" r="2" fill="#ffffff"/>
    <text x="120" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b7d">Mutex</text>
    <text x="120" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456a83">Uyut ve uyandır</text>
    <line x1="72" y1="195" x2="260" y2="195" stroke="#89acca" stroke-width="1" opacity="0.7"/>
    <circle cx="84" cy="212" r="5" fill="#638fb0"/>
    <text x="97" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f6380">Düşük CPU tüketimi</text>
    <circle cx="84" cy="230" r="5" fill="#638fb0"/>
    <text x="97" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f6380">Uzun bekleme için uygun</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="362" y="128" width="224" height="105" rx="20" fill="url(#spin)"/>
    <rect x="378" y="144" width="39" height="39" rx="12" fill="#ffffff" opacity="0.83"/>
    <path d="M397 152a11 11 0 1 1-8 18" fill="none" stroke="#b8753b" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="386,168 386,160 393,165" fill="#b8753b"/>
    <text x="428" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#895426">Spinlock</text>
    <text x="428" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#946536">Aktif döngü</text>
    <line x1="380" y1="195" x2="568" y2="195" stroke="#d6a879" stroke-width="1" opacity="0.75"/>
    <circle cx="392" cy="212" r="5" fill="#c48548"/>
    <text x="405" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#805429">Kısa kilitte hızlı</text>
    <circle cx="392" cy="230" r="5" fill="#c48548"/>
    <text x="405" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#805429">Yüksek CPU maliyeti</text>
  </g>

  <path d="M166 237 C183 255 226 260 257 263" fill="none" stroke="#7c9bb2" stroke-width="2" stroke-linecap="round"/>
  <polygon points="254,258 265,264 253,269" fill="#7c9bb2"/>
  <path d="M474 237 C457 255 414 260 383 263" fill="none" stroke="#b98a58" stroke-width="2" stroke-linecap="round"/>
  <polygon points="387,269 375,264 386,258" fill="#b98a58"/>

  <g filter="url(#soft)">
    <rect x="216" y="252" width="208" height="51" rx="17" fill="url(#decision)"/>
    <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37684d">Karar Eşiği</text>
    <text x="320" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b765d">Bekleme &lt; uyutma + uyandırma</text>
  </g>

  <text x="320" y="316" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66807a">Ölç • çakışmayı azalt • uygun kilidi seç</text>
</svg>