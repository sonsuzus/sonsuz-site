<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="juliaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e4f7"/>
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e8"/>
      <stop offset="100%" stop-color="#fde8d4"/>
    </linearGradient>
    <linearGradient id="commonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f8f0"/>
      <stop offset="100%" stop-color="#d4f0e4"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e8f8"/>
      <stop offset="100%" stop-color="#e4d4f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Julia ve Python: Bilimsel Hesaplama Yarışı</text>

  <!-- Julia Bloğu -->
  <rect x="30" y="55" width="180" height="90" rx="12" fill="url(#juliaGrad)" filter="url(#shadow)" stroke="#a0b8d8" stroke-width="1.5"/>
  <text x="120" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">Julia</text>
  <text x="120" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c4a6e">JIT Derleme</text>
  <text x="120" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c4a6e">Tür Uzmanlaşması</text>
  <text x="120" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c4a6e">Noktasal İşleç Füzyonu</text>

  <!-- Python Bloğu -->
  <rect x="430" y="55" width="180" height="90" rx="12" fill="url(#pythonGrad)" filter="url(#shadow)" stroke="#d8b8a0" stroke-width="1.5"/>
  <text x="520" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#5c3a1a">Python</text>
  <text x="520" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6e4a2c">NumPy Vektörleştirme</text>
  <text x="520" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6e4a2c">Numba JIT</text>
  <text x="520" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6e4a2c">BLAS/LAPACK Çağrıları</text>

  <!-- Ortak Bileşen -->
  <rect x="230" y="70" width="180" height="60" rx="12" fill="url(#commonGrad)" filter="url(#shadow)" stroke="#a0c8b8" stroke-width="1.5"/>
  <text x="320" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a3c">Ortak Çekirdek</text>
  <text x="320" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c6e5a">BLAS / LAPACK</text>

  <!-- Oklar: Julia ve Python'dan Ortak Çekirdeğe -->
  <path d="M210 100 L225 100" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="228,95 228,105 238,100" fill="#5a7a9a"/>

  <path d="M430 100 L415 100" stroke="#9a7a5a" stroke-width="2" fill="none"/>
  <polygon points="412,95 412,105 402,100" fill="#9a7a5a"/>

  <!-- Performans Karşılaştırma Bloğu -->
  <rect x="200" y="165" width="240" height="65" rx="12" fill="url(#resultGrad)" filter="url(#shadow)" stroke="#c8a8d8" stroke-width="1.5"/>
  <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a1a5c">Performans Karşılaştırması</text>
  <text x="320" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a2c6e">Saf Döngü: Julia Önde</text>
  <text x="320" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a2c6e">Dizi İşlemleri: Yakın Sonuç</text>

  <!-- Ortak Çekirdekten Karşılaştırmaya Ok -->
  <path d="M320 130 L320 160" stroke="#7a5a9a" stroke-width="2" fill="none"/>
  <polygon points="315,163 325,163 320,173" fill="#7a5a9a"/>

  <!-- Alt Karşılaştırma Kriterleri -->
  <rect x="50" y="255" width="160" height="45" rx="10" fill="#f0f4f8" filter="url(#shadow)" stroke="#b0c0d0" stroke-width="1.2"/>
  <text x="130" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">İlk Çalıştırma</text>
  <text x="130" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Python Avantajlı</text>

  <rect x="240" y="255" width="160" height="45" rx="10" fill="#f0f4f8" filter="url(#shadow)" stroke="#b0c0d0" stroke-width="1.2"/>
  <text x="320" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Bellek Hiyerarşisi</text>
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Önbellek Kullanımı</text>

  <rect x="430" y="255" width="160" height="45" rx="10" fill="#f0f4f8" filter="url(#shadow)" stroke="#b0c0d0" stroke-width="1.2"/>
  <text x="510" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Doğrusal Cebir</text>
  <text x="510" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Benzer BLAS Sonucu</text>

  <!-- Karşılaştırmadan Alt Kriterlere Oklar -->
  <path d="M240 230 L160 250" stroke="#8a9aaa" stroke-width="1.5" fill="none"/>
  <polygon points="157,247 163,243 160,255" fill="#8a9aaa"/>

  <path d="M320 230 L320 250" stroke="#8a9aaa" stroke-width="1.5" fill="none"/>
  <polygon points="315,253 325,253 320,263" fill="#8a9aaa"/>

  <path d="M400 230 L480 250" stroke="#8a9aaa" stroke-width="1.5" fill="none"/>
  <polygon points="483,247 477,243 480,255" fill="#8a9aaa"/>

  <!-- Etiket: Ölçüm Metodolojisi -->
  <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a" font-style="italic">Ölçüm: Medyan Tekrar, Eşit Veri Türü, Derleme Öncesi Isınma</text>
</svg>