<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce9fb"/>
      <stop offset="100%" stop-color="#cbdcf5"/>
    </linearGradient>
    <linearGradient id="loraGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee1ff"/>
      <stop offset="100%" stop-color="#dcc7f5"/>
    </linearGradient>
    <linearGradient id="adapterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e7"/>
      <stop offset="100%" stop-color="#bfe4d2"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d9"/>
      <stop offset="100%" stop-color="#f5dfac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66809b" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#66809b" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="61" cy="42" r="45" fill="#d9ecfb" opacity="0.45"/>
  <circle cx="594" cy="278" r="63" fill="#dcefdc" opacity="0.42"/>
  <path d="M25 270 C112 236 132 292 215 264 S360 237 442 267 S564 282 622 235" fill="none" stroke="#c9dde6" stroke-width="2" opacity="0.55"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#436176">PEFT · Küçük dokunuşlarla özelleştirme</text>

  <!-- Base Model -->
  <g filter="url(#shadow)">
    <rect x="34" y="91" width="146" height="142" rx="20" fill="url(#baseGrad)" stroke="#abc5e3"/>
    <rect x="48" y="107" width="118" height="25" rx="10" fill="#f5f9ff" opacity="0.83"/>
    <text x="107" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355a76">Temel Model</text>
    <g opacity="0.9">
      <rect x="55" y="146" width="104" height="12" rx="6" fill="#8daed2"/>
      <rect x="55" y="164" width="104" height="12" rx="6" fill="#9bb8d8"/>
      <rect x="55" y="182" width="104" height="12" rx="6" fill="#8daed2"/>
      <rect x="55" y="200" width="104" height="12" rx="6" fill="#9bb8d8"/>
    </g>
    <path d="M151 146 l10 0 l0 66 l-10 0" fill="none" stroke="#5d89b5" stroke-width="2"/>
    <text x="95" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496981">W₀ dondurulur</text>
  </g>

  <!-- lines and arrows -->
  <path d="M180 135 C206 135 205 104 229 104" fill="none" stroke="#8871ac" stroke-width="2.5"/>
  <polygon points="228,98 240,104 228,110" fill="#8871ac"/>
  <path d="M180 190 C205 190 204 216 229 216" fill="none" stroke="#4f9a78" stroke-width="2.5"/>
  <polygon points="228,210 240,216 228,222" fill="#4f9a78"/>

  <!-- LoRA branch -->
  <g filter="url(#shadow)">
    <rect x="241" y="56" width="170" height="97" rx="18" fill="url(#loraGrad)" stroke="#c2a6df"/>
    <rect x="256" y="69" width="83" height="23" rx="9" fill="#fbf7ff" opacity="0.78"/>
    <text x="297" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#604477">LoRA</text>
    <rect x="260" y="108" width="45" height="25" rx="7" fill="#b893d8"/>
    <text x="282" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">A</text>
    <path d="M308 120 L328 120" stroke="#765697" stroke-width="2"/>
    <polygon points="327,115 337,120 327,125" fill="#765697"/>
    <rect x="339" y="108" width="45" height="25" rx="7" fill="#9d75c4"/>
    <text x="361" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">B</text>
    <text x="326" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#604477">Düşük rütbe · r</text>
  </g>

  <!-- Adapter branch -->
  <g filter="url(#shadow)">
    <rect x="241" y="168" width="170" height="97" rx="18" fill="url(#adapterGrad)" stroke="#9bcbb4"/>
    <rect x="256" y="181" width="92" height="23" rx="9" fill="#f7fffa" opacity="0.83"/>
    <text x="302" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356d54">Adaptör</text>
    <path d="M261 231 L277 231" stroke="#4d9573" stroke-width="2"/>
    <polygon points="276,226 286,231 276,236" fill="#4d9573"/>
    <path d="M286 218 L306 218 L316 231 L306 244 L286 244 Z" fill="#8cc7a7"/>
    <text x="301" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">m</text>
    <path d="M317 231 L334 231" stroke="#4d9573" stroke-width="2"/>
    <polygon points="333,226 343,231 333,236" fill="#4d9573"/>
    <path d="M343 218 L363 218 L373 231 L363 244 L343 244 Z" fill="#5ca982"/>
    <text x="353" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">d</text>
    <text x="326" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356d54">Daralt · genişlet</text>
  </g>

  <!-- Convergence -->
  <path d="M411 104 C435 104 432 145 454 145" fill="none" stroke="#8871ac" stroke-width="2.5"/>
  <polygon points="453,139 465,145 453,151" fill="#8871ac"/>
  <path d="M411 216 C435 216 432 175 454 175" fill="none" stroke="#4f9a78" stroke-width="2.5"/>
  <polygon points="453,169 465,175 453,181" fill="#4f9a78"/>

  <!-- Outcome -->
  <g filter="url(#shadow)">
    <rect x="466" y="88" width="143" height="152" rx="20" fill="url(#resultGrad)" stroke="#e4c579"/>
    <rect x="481" y="103" width="113" height="25" rx="10" fill="#fffdf7" opacity="0.85"/>
    <text x="537" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7a5d21">Göreve Uyum</text>

    <g filter="url(#softShadow)">
      <rect x="483" y="141" width="108" height="22" rx="8" fill="#f9edca"/>
      <circle cx="496" cy="152" r="4" fill="#c9973a"/>
      <text x="508" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#70561f">Az parametre</text>

      <rect x="483" y="170" width="108" height="22" rx="8" fill="#f9edca"/>
      <circle cx="496" cy="181" r="4" fill="#c9973a"/>
      <text x="508" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#70561f">Düşük bellek</text>

      <rect x="483" y="199" width="108" height="22" rx="8" fill="#f9edca"/>
      <circle cx="496" cy="210" r="4" fill="#c9973a"/>
      <text x="508" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#70561f">Görev paketi</text>
    </g>
  </g>

  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e7784">Kalite · bellek · gecikme dengesi</text>
</svg>