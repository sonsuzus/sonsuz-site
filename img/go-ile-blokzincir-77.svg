<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f5ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C9BCF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B8DB8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7BC47F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E57373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#37474F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#455A64;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="exampleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="invalidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E57373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000025"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="8"/>

  <!-- Başlık -->
  <rect x="20" y="15" width="600" height="28" rx="14" fill="url(#titleGrad)" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="320" y="34" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Blokzincir Temelleri: Hash ile Değiştirilemez Zincir</text>

  <!-- Ana oklar -->
  <polygon points="185,145 200,145 200,138 210,148 200,158 200,151 185,151" fill="#666" opacity="0.6"/>
  <polygon points="315,145 330,145 330,138 340,148 330,158 330,151 315,151" fill="#666" opacity="0.6"/>
  <polygon points="445,145 460,145 460,138 470,148 460,158 460,151 445,151" fill="#666" opacity="0.6"/>

  <!-- Blok 1 -->
  <g filter="url(#shadow)">
    <rect x="30" y="85" width="150" height="120" rx="12" fill="url(#blockGrad)" opacity="0.95"/>
    <text x="80" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fff">BLOK 0</text>
    <text x="80" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#E3F2FD">Genesis</text>
    
    <rect x="45" y="140" width="120" height="18" rx="4" fill="url(#dataGrad)" opacity="0.9"/>
    <text x="105" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff">Veri: Başlangıç</text>
    
    <rect x="45" y="163" width="120" height="18" rx="4" fill="url(#hashGrad)" opacity="0.9"/>
    <text x="105" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff">Hash: 7f4a...</text>
    
    <rect x="45" y="186" width="50" height="14" rx="3" fill="#455A64" opacity="0.7"/>
    <text x="70" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff">Prev: ---</text>
  </g>

  <!-- Blok 2 -->
  <g filter="url(#shadow)">
    <rect x="220" y="85" width="150" height="120" rx="12" fill="url(#blockGrad)" opacity="0.95"/>
    <text x="270" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fff">BLOK 1</text>
    <text x="270" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#E3F2FD">İşlem bloğu</text>
    
    <rect x="235" y="140" width="120" height="18" rx="4" fill="url(#dataGrad)" opacity="0.9"/>
    <text x="295" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff">Veri: Ali → Ayşe</text>
    
    <rect x="235" y="163" width="120" height="18" rx="4" fill="url(#hashGrad)" opacity="0.9"/>
    <text x="295" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff">Hash: 8e31...</text>
    
    <rect x="235" y="186" width="50" height="14" rx="3" fill="#455A64" opacity="0.7"/>
    <text x="260" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff">Prev: 7f4a</text>
  </g>

  <!-- Blok 3 -->
  <g filter="url(#shadow)">
    <rect x="410" y="85" width="150" height="120" rx="12" fill="url(#blockGrad)" opacity="0.95"/>
    <text x="460" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fff">BLOK 2</text>
    <text x="460" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#E3F2FD">İşlem bloğu</text>
    
    <rect x="425" y="140" width="120" height="18" rx="4" fill="url(#dataGrad)" opacity="0.9"/>
    <text x="485" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff">Veri: Ayşe → M.</text>
    
    <rect x="425" y="163" width="120" height="18" rx="4" fill="url(#hashGrad)" opacity="0.9"/>
    <text x="485" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff">Hash: 3a12...</text>
    
    <rect x="425" y="186" width="50" height="14" rx="3" fill="#455A64" opacity="0.7"/>
    <text x="450" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff">Prev: 8e31</text>
  </g>

  <!-- Değişmezlik göstergesi -->
  <g filter="url(#shadowLight)">
    <rect x="35" y="230" width="570" height="20" rx="10" fill="#ffffff" opacity="0.7"/>
    <text x="320" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474F" font-weight="bold">Zincir yapısı: her blok öncekinin hash'ini taşır • Zincir doğrulama: değişiklik sonraki bloklarda tespit edilir</text>
  </g>

  <!-- Doğrulama kısmı -->
  <g filter="url(#shadowLight)">
    <!-- Geçerli ok -->
    <polygon points="180,275 195,275 195,269 205,279 195,289 195,283 180,283" fill="#4CAF50" opacity="0.7"/>
    
    <rect x="55" y="262" width="120" height="35" rx="8" fill="url(#validGrad)" opacity="0.9"/>
    <text x="115" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff">✓ Geçerli</text>
  </g>

  <!-- Geçersiz kısım -->
  <g filter="url(#shadowLight)">
    <polygon points="460,275 475,275 475,269 485,279 475,289 475,283 460,283" fill="#C62828" opacity="0.7"/>
    
    <rect x="350" y="262" width="120" height="35" rx="8" fill="url(#invalidGrad)" opacity="0.9"/>
    <text x="410" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff">✗ Geçersiz</text>
  </g>

  <!-- Değişiklik göstergesi -->
  <g filter="url(#shadowLight)">
    <rect x="180" y="258" width="165" height="44" rx="8" fill="#ffffff" opacity="0.6"/>
    <text x="262" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#C62828" font-weight="bold">Değiştirilmiş blok →</text>
    <text x="262" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#D32F2F">hash uyuşmazlığı</text>
  </g>

  <!-- Kenet sembolü -->
  <g transform="translate(585, 60)" filter="url(#shadowLight)">
    <rect x="-5" y="-5" width="50" height="50" rx="25" fill="#37474F" opacity="0.8"/>
    <path d="M15 18 L25 18 L25 25 L15 25 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M12 18 L15 18 L15 12 Q15 8 20 8 Q25 8 25 12 L25 18" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="20" cy="21" r="2" fill="#4CAF50"/>
    <path d="M18 6 L22 6 L21 4 L19 4 Z" fill="#4CAF50"/>
  </g>
</svg>