  <rect x="464" y="156" width="14" height="20" rx="4" fill="#b7c9dc"/>
  <rect x="481" y="156" width="14" height="20" rx="4" fill="#a7d1c0"/>
  <rect x="498" y="156" width="14" height="20" rx="4" fill="#f3c992"/>
  <rect x="515" y="156" width="14" height="20" rx="4" fill="#b7c9dc"/>
  <rect x="532" y="156" width="14" height="20" rx="4" fill="#a7d1c0"/>
  <rect x="549" y="156" width="14" height="20" rx="4" fill="#f3c992"/>
  <rect x="566" y="156" width="14" height="20" rx="4" fill="#b7c9dc"/>

