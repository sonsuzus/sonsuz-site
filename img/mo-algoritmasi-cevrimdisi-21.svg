<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71839a" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="575" cy="44" r="77" fill="#dff2ed" opacity="0.62"/>
  <circle cx="57" cy="292" r="86" fill="#e3edff" opacity="0.72"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516d">MO ALGORİTMASI</text>
  <text x="28" y="50" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c7e92">Çevrimdışı aralık sorgularında kısa pencere hareketleri</text>

  <g filter="url(#shadow)">
    <rect x="26" y="78" width="139" height="182" rx="18" fill="url(#panel)" stroke="#d6e1ed"/>
  </g>
