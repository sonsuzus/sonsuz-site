    <text x="56" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#41658d">S1 [2, 7]</text>
    <rect x="45" y="174" width="99" height="24" rx="8" fill="#eaf7e8"/>
    <text x="56" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7960">S2 [1, 4]</text>
    <rect x="45" y="206" width="99" height="24" rx="8" fill="#fff0dc"/>
    <text x="56" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936b3d">S3 [5, 9]</text>
