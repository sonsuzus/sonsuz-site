<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="arrayFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9e3fb"/>
    </linearGradient>
    <linearGradient id="tupleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5d7"/>
      <stop offset="100%" stop-color="#d4ecc5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66839b" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#66839b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="55" cy="42" r="68" fill="#cde9f5" opacity="0.3"/>
  <circle cx="598" cy="280" r="94" fill="#d9edc8" opacity="0.34"/>

