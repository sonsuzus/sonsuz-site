  <path d="M311 145h17" stroke="#a7bdc6" stroke-width="2"/>
  <polygon points="328,145 321,140 321,150" fill="#a7bdc6"/>
  <text x="320" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708894">seçim</text>

  <text x="320" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597080">Değişen koleksiyon ↔ Sabit yapılı kayıt</text>
