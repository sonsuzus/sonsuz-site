<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7a9"/>
      <stop offset="100%" stop-color="#ffc978"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9d4ff"/>
      <stop offset="100%" stop-color="#afa7ed"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#63809a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6c889d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="75" cy="48" r="38" fill="#fff3c8" opacity="0.45"/>
  <circle cx="570" cy="260" r="60" fill="#d9f3e5" opacity="0.45"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405469">Komşular Arası Enerji Ticareti</text>

  <!-- Solar producer -->
  <g filter="url(#shadow)">
    <rect x="31" y="74" width="142" height="112" rx="18" fill="#ffffff"/>
    <path d="M48 129 L102 91 L156 129 Z" fill="#62788b"/>
    <path d="M57 127 L102 98 L147 127 Z" fill="#4f91b7"/>
    <path d="M73 117 L77 126 M91 106 L94 126 M112 106 L109 126 M130 117 L126 126" stroke="#d5efff" stroke-width="2"/>
    <rect x="60" y="129" width="84" height="39" rx="4" fill="#f4f8fb"/>
    <rect x="92" y="143" width="19" height="25" rx="2" fill="#b8d5e5"/>
    <rect x="70" y="140" width="13" height="12" rx="2" fill="#ffdda1"/>
    <circle cx="145" cy="91" r="13" fill="url(#solar)"/>
  </g>
  <text x="102" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405469">Üretici</text>
  <text x="102" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62778a">Fazla enerji</text>

  <!-- energy flow line -->
  <path d="M176 136 C203 136 205 136 225 136" fill="none" stroke="#e2a642" stroke-width="3" stroke-linecap="round"/>
  <polygon points="225,136 215,130 215,142" fill="#e2a642"/>
  <text x="198" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7440">kWh</text>

  <!-- Main trade / chain core -->
  <g filter="url(#shadow)">
    <rect x="226" y="64" width="188" height="139" rx="22" fill="#ffffff"/>
    <rect x="248" y="82" width="144" height="31" rx="12" fill="#e6f3fb"/>
    <circle cx="267" cy="97.5" r="8" fill="#75b8da"/>
    <path d="M263 97.5 L266 101 L272 93" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="324" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405469">Akıllı Sayaç</text>

    <path d="M320 118 L320 127" stroke="#8da9bc" stroke-width="2"/>
    <polygon points="320,132 315,124 325,124" fill="#8da9bc"/>

    <rect x="252" y="134" width="58" height="42" rx="10" fill="url(#chain)"/>
    <rect x="330" y="134" width="58" height="42" rx="10" fill="#ccebdd"/>
    <path d="M310 155 L330 155" stroke="#8e83d7" stroke-width="3"/>
    <polygon points="330,155 322,150 322,160" fill="#8e83d7"/>
    <path d="M267 154 h28 M281 143 v22" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <path d="M344 156 L353 165 L373 144" fill="none" stroke="#5aab80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="281" y="191" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c5688">Zincir</text>
    <text x="359" y="191" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47765d">Sözleşme</text>
  </g>

  <!-- outgoing flow -->
  <path d="M415 136 C440 136 444 136 463 136" fill="none" stroke="#5aae87" stroke-width="3" stroke-linecap="round"/>
  <polygon points="463,136 453,130 453,142" fill="#5aae87"/>
  <text x="439" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c8068">3 TL</text>

  <!-- Consumer / EV -->
  <g filter="url(#shadow)">
    <rect x="466" y="74" width="142" height="112" rx="18" fill="#ffffff"/>
    <path d="M487 149 C487 137 497 128 510 128 H556 C570 128 580 137 581 149 L579 162 H489 Z" fill="#82b6ca"/>
    <path d="M506 132 L514 119 H554 L565 132 Z" fill="#d9eff7"/>
    <rect x="516" y="137" width="18" height="10" rx="2" fill="#eff9fc"/>
    <rect x="538" y="137" width="19" height="10" rx="2" fill="#eff9fc"/>
    <circle cx="510" cy="162" r="9" fill="#536d7e"/>
    <circle cx="561" cy="162" r="9" fill="#536d7e"/>
    <circle cx="510" cy="162" r="3" fill="#d9edf4"/>
    <circle cx="561" cy="162" r="3" fill="#d9edf4"/>
    <path d="M477 105 h16 v13 h-16z" fill="#bee8d2"/>
    <path d="M493 110 h7" stroke="#65af83" stroke-width="2"/>
    <path d="M477 116 C468 116 469 133 481 133" fill="none" stroke="#65af83" stroke-width="2"/>
  </g>
  <text x="537" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405469">Tüketici</text>
  <text x="537" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62778a">Elektrikli araç</text>

  <!-- bottom process -->
  <g filter="url(#soft)">
    <rect x="62" y="255" width="112" height="40" rx="13" fill="#e4f3fb"/>
    <rect x="191" y="255" width="112" height="40" rx="13" fill="#ece9ff"/>
    <rect x="320" y="255" width="112" height="40" rx="13" fill="#e1f3e8"/>
    <rect x="449" y="255" width="112" height="40" rx="13" fill="#fff0d5"/>
  </g>
  <text x="118" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#486477">Ölçüm</text>
  <text x="247" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#615b94">Eşleştirme</text>
  <text x="376" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b7960">Doğrulama</text>
  <text x="505" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#916e3b">Uzlaştırma</text>

  <path d="M176 275 H188 M305 275 H317 M434 275 H446" stroke="#91a9b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="188,275 181,271 181,279" fill="#91a9b8"/>
  <polygon points="317,275 310,271 310,279" fill="#91a9b8"/>
  <polygon points="446,275 439,271 439,279" fill="#91a9b8"/>
</svg>