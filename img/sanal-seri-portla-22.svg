<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92b7e8"/>
      <stop offset="50%" stop-color="#a8d8c3"/>
      <stop offset="100%" stop-color="#d8a9d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="80" cy="49" r="57" fill="#dcecff" opacity="0.55"/>
  <circle cx="573" cy="279" r="80" fill="#dbf0df" opacity="0.52"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40546c">Sanal Seri Port ile Süreçler Arası Haberleşme</text>

  <g filter="url(#shadow)">
    <rect x="38" y="78" width="164" height="160" rx="20" fill="#eef5ff" stroke="#bdd4ef"/>
    <rect x="238" y="58" width="164" height="200" rx="22" fill="#f0faf5" stroke="#b9ddca"/>
    <rect x="438" y="78" width="164" height="160" rx="20" fill="#fff3fb" stroke="#e6c4df"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31465d">
    <text x="120" y="106" text-anchor="middle" font-weight="700">Process 1</text>
    <text x="120" y="125" text-anchor="middle">Terminal</text>

    <text x="320" y="86" text-anchor="middle" font-weight="700">Sanal Seri Hat</text>
    <text x="320" y="105" text-anchor="middle">PTY Çifti</text>

    <text x="520" y="106" text-anchor="middle" font-weight="700">Process 2</text>
    <text x="520" y="125" text-anchor="middle">Modem Taklidi</text>
  </g>

  <g filter="url(#soft)">
    <rect x="63" y="144" width="114" height="57" rx="12" fill="#dbeaff"/>
    <rect x="263" y="124" width="114" height="49" rx="12" fill="#d8f1e4"/>
    <rect x="263" y="191" width="114" height="42" rx="12" fill="#e6f7ed"/>
    <rect x="463" y="144" width="114" height="57" rx="12" fill="#f9dfef"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34475d">
    <text x="120" y="167" text-anchor="middle" font-weight="600">AT Komutları</text>
    <text x="120" y="186" text-anchor="middle">ATZ   ATI   ATD</text>

    <text x="320" y="145" text-anchor="middle" font-weight="600">/tmp/ttyV0</text>
    <text x="320" y="163" text-anchor="middle">yazma ucu</text>

    <text x="320" y="211" text-anchor="middle" font-weight="600">/tmp/ttyV1</text>
    <text x="320" y="226" text-anchor="middle">okuma ucu</text>

    <text x="520" y="167" text-anchor="middle" font-weight="600">Çözümle</text>
    <text x="520" y="186" text-anchor="middle">Cevap Üret</text>
  </g>

  <path d="M177 172 H250" fill="none" stroke="url(#cable)" stroke-width="5" stroke-linecap="round"/>
  <polygon points="250,172 240,166 240,178" fill="#9bc8b2"/>

  <path d="M390 172 H463" fill="none" stroke="url(#cable)" stroke-width="5" stroke-linecap="round"/>
  <polygon points="463,172 453,166 453,178" fill="#c99ac5"/>

  <path d="M463 214 H390 Q385 214 385 219 V270 Q385 275 380 275 H260 Q255 275 255 270 V219 Q255 214 250 214 H177" fill="none" stroke="#8ba9d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
  <polygon points="177,214 187,208 187,220" fill="#8ba9d4"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="279" y="266" width="82" height="21" rx="10" fill="#ffffff" opacity="0.9"/>
    <text x="320" y="281" text-anchor="middle" fill="#587293">OK / CONNECT</text>
  </g>

  <g opacity="0.95">
    <circle cx="281" cy="116" r="5" fill="#6fb88d"/>
    <circle cx="320" cy="116" r="5" fill="#75aadf"/>
    <circle cx="359" cy="116" r="5" fill="#cf96c7"/>
    <path d="M286 116 H315 M325 116 H354" stroke="#9abaae" stroke-width="2"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b6e7c">
    <text x="320" y="307" text-anchor="middle">9600 · 8N1 · raw · echo kapalı · satır sonu: \r</text>
  </g>
</svg>