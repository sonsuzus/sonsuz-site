  <text x="274" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526b82">Orta: ekonomi</text>
  <path d="M395 285 H424" stroke="#b2c1cf" stroke-width="1.8"/>
  <polygon points="420,280 430,285 420,290" fill="#b2c1cf"/>
  <circle cx="447" cy="285.5" r="7" fill="#75b77e"/>
  <text x="462" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526b82">Seyrek: göç</text>
