<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="seriGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9d9fa"/>
      <stop offset="100%" stop-color="#d8edff"/>
    </linearGradient>
    <linearGradient id="paralelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe8d1"/>
      <stop offset="100%" stop-color="#e0f5d8"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#597082" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#597082" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#zemin)"/>
  <circle cx="58" cy="42" r="45" fill="#dceeff" opacity="0.45"/>
  <circle cx="586" cy="274" r="60" fill="#dff3d8" opacity="0.5"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#344c5c">Kinematik Mimari Seçimi</text>
  <path d="M283 34 L357 34" stroke="#93acb8" stroke-width="1.5" stroke-linecap="round"/>

