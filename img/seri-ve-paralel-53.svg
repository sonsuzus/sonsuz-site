  <text x="160" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557181">Çeviklik ve çalışma alanı</text>
  <text x="480" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557181">Hassasiyet ve taşıma</text>
