  <rect x="365" y="242" width="101" height="22" rx="11" fill="#e5f6e9"/>
  <text x="415" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397250">Yük paylaşımı</text>
