<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8dcf7"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee2ff"/>
      <stop offset="100%" stop-color="#ddcdf7"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcf3e5"/>
      <stop offset="100%" stop-color="#c5e8d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7791a6" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71869b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="42" cy="45" r="72" fill="#dceeff" opacity="0.45"/>
  <circle cx="598" cy="272" r="90" fill="#d9f1dd" opacity="0.5"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536b">Z-ALGORİTMASI • DOĞRUSAL METİN ARAMA</text>

  <!-- Input card -->
  <g filter="url(#shadow)">
    <rect x="26" y="65" width="157" height="174" rx="18" fill="#ffffff"/>
    <rect x="26" y="65" width="157" height="42" rx="18" fill="url(#blueCard)"/>
    <rect x="26" y="89" width="157" height="18" fill="url(#blueCard)"/>
  </g>
  <text x="104" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31516b">Girdi Dizeleri</text>
  <text x="45" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456176">Desen P</text>
  <g filter="url(#softShadow)">
    <rect x="45" y="143" width="116" height="30" rx="9" fill="#e8f2ff"/>
  </g>
  <text x="103" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426788">a b r a</text>
  <text x="45" y="197" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456176">Metin T</text>
  <g filter="url(#softShadow)">
    <rect x="45" y="207" width="116" height="21" rx="8" fill="#e8f2ff"/>
  </g>
  <text x="103" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426788">abrakadabra</text>

  <!-- arrow 1 -->
  <path d="M191 151 H215" fill="none" stroke="#7e9bb3" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="222,151 213,146 213,156" fill="#7e9bb3"/>

  <!-- Combined string -->
  <g filter="url(#shadow)">
    <rect x="228" y="65" width="187" height="174" rx="18" fill="#ffffff"/>
    <rect x="228" y="65" width="187" height="42" rx="18" fill="url(#purpleCard)"/>
    <rect x="228" y="89" width="187" height="18" fill="url(#purpleCard)"/>
  </g>
  <text x="321" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5d4778">Birleştirilmiş Dize</text>
  <text x="321" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a5a7e">S = P + ayraç + T</text>

  <g filter="url(#softShadow)">
    <rect x="246" y="143" width="27" height="33" rx="7" fill="#d5e9ff"/>
    <rect x="276" y="143" width="27" height="33" rx="7" fill="#d5e9ff"/>
    <rect x="306" y="143" width="27" height="33" rx="7" fill="#d5e9ff"/>
    <rect x="336" y="143" width="27" height="33" rx="7" fill="#d5e9ff"/>
    <rect x="366" y="143" width="30" height="33" rx="7" fill="#f9dda9"/>
  </g>
  <text x="259" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426788">a</text>
  <text x="289" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426788">b</text>
  <text x="319" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426788">r</text>
  <text x="349" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426788">a</text>
  <text x="381" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#865e20">$</text>
  <path d="M249 196 H392" fill="none" stroke="#a99bbc" stroke-width="2" stroke-linecap="round"/>
  <text x="321" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#756286">Önek karşılaştırması</text>

  <!-- arrow 2 -->
  <path d="M423 151 H446" fill="none" stroke="#7e9bb3" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="453,151 444,146 444,156" fill="#7e9bb3"/>

  <!-- Z box processing -->
  <g filter="url(#shadow)">
    <rect x="460" y="65" width="154" height="174" rx="18" fill="#ffffff"/>
    <rect x="460" y="65" width="154" height="42" rx="18" fill="url(#greenCard)"/>
    <rect x="460" y="89" width="154" height="18" fill="url(#greenCard)"/>
  </g>
  <text x="537" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c6b52">Z Kutusu [L, R]</text>

  <path d="M481 143 H592" fill="none" stroke="#c2d0d9" stroke-width="5" stroke-linecap="round"/>
  <path d="M499 143 H570" fill="none" stroke="#72b58c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="499" cy="143" r="7" fill="#4f9d72"/>
  <circle cx="570" cy="143" r="7" fill="#4f9d72"/>
  <text x="499" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397355">L</text>
  <text x="570" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397355">R</text>

  <g filter="url(#softShadow)">
    <rect x="478" y="177" width="117" height="38" rx="10" fill="#e4f5e9"/>
  </g>
  <text x="536" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397355">Z[i] = |P|</text>
  <text x="536" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#548067">Tam eşleşme</text>

  <!-- bottom summary -->
  <g filter="url(#shadow)">
    <rect x="104" y="263" width="432" height="39" rx="15" fill="#ffffff"/>
  </g>
  <circle cx="137" cy="282" r="13" fill="#dcecff"/>
  <path d="M131 282 L135 286 L144 277" fill="none" stroke="#4e7da4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="164" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405d70">Tek geçiş</text>
  <path d="M246 282 H278" fill="none" stroke="#a8bbc6" stroke-width="2"/>
  <polygon points="284,282 276,278 276,286" fill="#a8bbc6"/>
  <text x="302" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405d70">Eşleşme konumları</text>
  <path d="M433 282 H459" fill="none" stroke="#a8bbc6" stroke-width="2"/>
  <polygon points="465,282 457,278 457,286" fill="#a8bbc6"/>
  <text x="479" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397355">O(n + m)</text>
</svg>