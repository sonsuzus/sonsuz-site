<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="dictGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#c7ecee"/>
    </linearGradient>
    <linearGradient id="setGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c291"/>
      <stop offset="100%" stop-color="#f6e58d"/>
    </linearGradient>
    <linearGradient id="hashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dff9fb"/>
      <stop offset="100%" stop-color="#c7ecee"/>
    </linearGradient>
    <linearGradient id="mergeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1ccc0"/>
      <stop offset="100%" stop-color="#f5f6fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Python Sözlük ve Küme Mimarisi</text>

  <!-- Sözlük Kutusu -->
  <rect x="40" y="55" width="180" height="100" rx="12" fill="url(#dictGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="130" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Sözlük (dict)</text>
  <text x="130" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Anahtar-Değer</text>
  <text x="130" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Eşleştirme</text>
  <text x="130" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Profil, Sayaç</text>
  <text x="130" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Boş: {}</text>

  <!-- Küme Kutusu -->
  <rect x="420" y="55" width="180" height="100" rx="12" fill="url(#setGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="510" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Küme (set)</text>
  <text x="510" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Benzersiz Eleman</text>
  <text x="510" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Tekrar Temizleme</text>
  <text x="510" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Üyelik Testi</text>
  <text x="510" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Boş: set()</text>

  <!-- Hash Tablosu Kutusu -->
  <rect x="230" y="160" width="180" height="90" rx="12" fill="url(#hashGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Hash Tablosu</text>
  <text x="320" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Ortalama O(1)</text>
  <text x="320" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Konum = hash mod kapasite</text>
  <text x="320" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Liste O(n)</text>

  <!-- Birleşim Kutusu -->
  <rect x="230" y="270" width="180" height="40" rx="10" fill="url(#mergeGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Birlikte Kullanım</text>

  <!-- Oklar: Sözlük -> Hash -->
  <path d="M 130 155 L 130 170 L 230 195" stroke="#2c3e50" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="230,195 220,190 222,200" fill="#2c3e50" opacity="0.6"/>

  <!-- Oklar: Küme -> Hash -->
  <path d="M 510 155 L 510 170 L 410 195" stroke="#2c3e50" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="410,195 420,190 418,200" fill="#2c3e50" opacity="0.6"/>

  <!-- Oklar: Hash -> Birleşim -->
  <path d="M 320 250 L 320 270" stroke="#2c3e50" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="320,270 315,262 325,262" fill="#2c3e50" opacity="0.6"/>

  <!-- Küme İşlemleri Alt Kutusu -->
  <rect x="40" y="200" width="160" height="70" rx="10" fill="#e8f8f5" filter="url(#shadow)" opacity="0.8"/>
  <text x="120" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Küme Cebiri</text>
  <text x="120" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Kesişim, Birleşim</text>
  <text x="120" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">Fark, Simetrik Fark</text>

  <!-- Sözlük Metodları Alt Kutusu -->
  <rect x="440" y="200" width="160" height="70" rx="10" fill="#fef9e7" filter="url(#shadow)" opacity="0.8"/>
  <text x="520" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Sözlük Metodları</text>
  <text x="520" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">get, add, discard</text>
  <text x="520" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">KeyError Koruması</text>

  <!-- Alt Kutulara Oklar -->
  <path d="M 130 155 L 130 200" stroke="#2c3e50" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="130,200 125,192 135,192" fill="#2c3e50" opacity="0.5"/>

  <path d="M 510 155 L 510 200" stroke="#2c3e50" stroke-width="1.5" fill="none" opacity="0.5"/>
  <polygon points="510,200 505,192 515,192" fill="#2c3e50" opacity="0.5"/>

  <!-- Anahtar Kuralı Notu -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7f8c8d" opacity="0.8">Anahtarlar: sayı, metin, tuple - Liste kullanılamaz</text>
</svg>