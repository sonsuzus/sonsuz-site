<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8ddf5"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e4"/>
      <stop offset="100%" stop-color="#bee5d0"/>
    </linearGradient>
    <linearGradient id="reconnect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1cf"/>
      <stop offset="100%" stop-color="#f7dda5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#62809a" flood-opacity="0.19"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#55758a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="154" r="121" fill="#d7edf1" opacity="0.32"/>
  <circle cx="320" cy="154" r="91" fill="none" stroke="#b7d8df" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.72"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#456177">Dayanıklı WebSocket Akışı</text>

  <!-- Client -->
  <rect x="52" y="103" width="151" height="102" rx="20" fill="url(#client)" filter="url(#shadow)"/>
  <rect x="63" y="115" width="129" height="78" rx="14" fill="#eef7ff" opacity="0.7"/>
  <circle cx="88" cy="139" r="14" fill="#77aee1" filter="url(#soft)"/>
  <path d="M82 139h12M88 133v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="108" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#315a7a">İstemci</text>
  <text x="108" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58758a">Sohbet oturumu</text>
  <rect x="75" y="169" width="102" height="13" rx="6.5" fill="#bad7ee"/>
  <rect x="75" y="169" width="69" height="13" rx="6.5" fill="#6fa9d8"/>
  <circle cx="185" cy="175.5" r="4" fill="#4eae82"/>

  <!-- Server -->
  <rect x="437" y="103" width="151" height="102" rx="20" fill="url(#server)" filter="url(#shadow)"/>
  <rect x="448" y="115" width="129" height="78" rx="14" fill="#f1fbf5" opacity="0.75"/>
  <rect x="464" y="127" width="30" height="30" rx="8" fill="#69b78d" filter="url(#soft)"/>
  <path d="M471 135h16M471 142h16M471 149h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="507" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#356c50">Sunucu</text>
  <text x="507" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#59806a">Oturum doğrulama</text>
  <circle cx="475" cy="175" r="5" fill="#47ad78"/>
  <text x="487" y="179" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#498066">Hazır</text>

  <!-- bidirectional socket -->
  <path d="M207 136 C264 103 376 103 433 136" fill="none" stroke="#5d9fc1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="432,130 443,137 430,142" fill="#5d9fc1"/>
  <path d="M433 173 C376 205 264 205 207 173" fill="none" stroke="#72b693" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="208,167 197,174 210,179" fill="#72b693"/>

  <rect x="263" y="87" width="114" height="27" rx="13.5" fill="#ffffff" filter="url(#soft)"/>
  <text x="320" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#46728b">Kalıcı bağlantı</text>

  <!-- heartbeat center -->
  <rect x="254" y="129" width="132" height="51" rx="17" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="277" cy="154.5" r="13" fill="#f5b76f"/>
  <path d="M270 155h5l3-6 4 11 3-5h5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="298" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#725335">Nabız kontrolü</text>
  <text x="298" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7259">ping  →  pong</text>

  <!-- failure branch -->
  <path d="M320 184 L320 217" fill="none" stroke="#cf8d68" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="314,215 320,225 326,215" fill="#cf8d68"/>
  <rect x="270" y="220" width="100" height="27" rx="13.5" fill="#fff3ef" filter="url(#soft)"/>
  <text x="320" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#a45c45">Zaman aşımı</text>

  <!-- reconnect panel -->
  <rect x="109" y="260" width="422" height="48" rx="18" fill="url(#reconnect)" filter="url(#shadow)"/>
  <circle cx="139" cy="284" r="15" fill="#e49a58"/>
  <path d="M144 276a9 9 0 1 0 3 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <polygon points="148,284 150,292 142,290" fill="#fff"/>
  <text x="166" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#78532d">Yeniden bağlanma</text>
  <text x="166" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d7049">Üstel bekleme + jitter</text>

  <path d="M353 283h28M393 283h28M433 283h28" stroke="#bc8552" stroke-width="2" stroke-linecap="round"/>
  <circle cx="370" cy="283" r="5" fill="#f5f9ff" stroke="#bc8552" stroke-width="2"/>
  <circle cx="410" cy="283" r="7" fill="#f5f9ff" stroke="#bc8552" stroke-width="2"/>
  <circle cx="450" cy="283" r="9" fill="#f5f9ff" stroke="#bc8552" stroke-width="2"/>
  <path d="M480 283h25" stroke="#bc8552" stroke-width="2" stroke-linecap="round"/>
  <polygon points="504,277 514,283 504,289" fill="#bc8552"/>
</svg>