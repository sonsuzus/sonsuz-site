<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8ddf7"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0cf"/>
      <stop offset="100%" stop-color="#f9d998"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7890a5" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6e8b92" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="321" cy="160" r="117" fill="#d9ebec" opacity="0.32"/>
  <circle cx="321" cy="160" r="87" fill="none" stroke="#adcbd0" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.7"/>

  <!-- environmental causes -->
  <g filter="url(#soft)">
    <rect x="28" y="34" width="120" height="48" rx="14" fill="#fce4dc"/>
    <rect x="32" y="38" width="112" height="40" rx="11" fill="#fff4ef" opacity="0.58"/>
    <text x="88" y="57" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75554e">Sıcaklık</text>
    <text x="88" y="71" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75554e">ve yaşlanma</text>

    <rect x="28" y="237" width="120" height="48" rx="14" fill="#e7dff8"/>
    <rect x="32" y="241" width="112" height="40" rx="11" fill="#f6f1ff" opacity="0.6"/>
    <text x="88" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665677">Titreşim</text>
    <text x="88" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665677">ve aşınma</text>

    <rect x="491" y="34" width="120" height="48" rx="14" fill="#d9f0e9"/>
    <rect x="495" y="38" width="112" height="40" rx="11" fill="#effaf5" opacity="0.65"/>
    <text x="551" y="57" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426b61">Saat kayması</text>
    <text x="551" y="71" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426b61">ve gecikme</text>

    <rect x="491" y="237" width="120" height="48" rx="14" fill="#dceafb"/>
    <rect x="495" y="241" width="112" height="40" rx="11" fill="#f0f7ff" opacity="0.65"/>
    <text x="551" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46647d">Yazılım</text>
    <text x="551" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46647d">değişimi</text>
  </g>

  <!-- cause arrows inward -->
  <path d="M148 65 L194 94" fill="none" stroke="#c8907d" stroke-width="2" stroke-linecap="round"/>
  <polygon points="196,96 186,94 191,87" fill="#c8907d"/>
  <path d="M148 255 L194 227" fill="none" stroke="#9b83be" stroke-width="2" stroke-linecap="round"/>
  <polygon points="196,225 190,234 186,227" fill="#9b83be"/>
  <path d="M491 65 L445 94" fill="none" stroke="#75a897" stroke-width="2" stroke-linecap="round"/>
  <polygon points="443,96 448,87 453,94" fill="#75a897"/>
  <path d="M491 255 L445 227" fill="none" stroke="#779bbd" stroke-width="2" stroke-linecap="round"/>
  <polygon points="443,225 453,227 448,234" fill="#779bbd"/>

  <!-- robot sensor core -->
  <g filter="url(#shadow)">
    <rect x="202" y="96" width="236" height="128" rx="24" fill="url(#core)" stroke="#a9c5df" stroke-width="1.2"/>
    <rect x="214" y="108" width="212" height="104" rx="18" fill="#f8fcff" opacity="0.55"/>
  </g>

  <text x="320" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#35556f">Çoklu Sensör Robotu</text>

  <!-- sensors -->
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle">
    <rect x="220" y="138" width="54" height="29" rx="9" fill="#d6f0ec" stroke="#a7d3ca"/>
    <text x="247" y="157" fill="#355f5b">Kamera</text>
    <rect x="292" y="138" width="54" height="29" rx="9" fill="#e6ddf5" stroke="#c6b5df"/>
    <text x="319" y="157" fill="#5b4d75">LiDAR</text>
    <rect x="364" y="138" width="54" height="29" rx="9" fill="#ffe7bf" stroke="#e5c388"/>
    <text x="391" y="157" fill="#755a2f">IMU</text>
    <rect x="255" y="178" width="58" height="24" rx="8" fill="#dceafa" stroke="#b4cae4"/>
    <text x="284" y="194" fill="#45627a">Enkoder</text>
    <rect x="328" y="178" width="58" height="24" rx="8" fill="#f9dedc" stroke="#dfb6b1"/>
    <text x="357" y="194" fill="#7a504c">GPS</text>
  </g>

  <!-- output flow -->
  <path d="M438 160 L470 160" fill="none" stroke="#5c88a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="477,160 467,154 467,166" fill="#5c88a6"/>

  <!-- monitoring -->
  <g filter="url(#shadow)">
    <rect x="476" y="116" width="137" height="89" rx="18" fill="#ffffff" stroke="#c6d9df"/>
    <rect x="487" y="128" width="115" height="64" rx="13" fill="#eff8f5"/>
  </g>
  <text x="544" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#365f5a">Kalibrasyon</text>
  <text x="544" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365f5a">sağlığı</text>
  <path d="M502 178 L516 174 L529 177 L542 166 L555 170 L569 151 L585 155" fill="none" stroke="#d3894b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="501" y1="182" x2="588" y2="182" stroke="#a8c9bf" stroke-width="1"/>

  <!-- lower decision flow -->
  <path d="M544 205 L544 221" fill="none" stroke="#769f95" stroke-width="2"/>
  <polygon points="544,228 538,218 550,218" fill="#769f95"/>

  <g filter="url(#soft)">
    <rect x="464" y="229" width="159" height="53" rx="16" fill="url(#warn)" stroke="#e3bd76"/>
    <rect x="474" y="238" width="28" height="28" rx="9" fill="#fff8e8"/>
    <path d="M488 244 L497 260 L479 260 Z" fill="#e39b42"/>
    <rect x="487" y="249" width="2" height="6" rx="1" fill="#fffaf0"/>
    <circle cx="488" cy="257" r="1.3" fill="#fffaf0"/>
    <text x="553" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#795522">Eşik aşıldı</text>
    <text x="553" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#795522">Yeniden kalibrasyon</text>
  </g>

  <!-- loop return -->
  <path d="M464 255 C418 292, 235 293, 190 226 C177 206, 178 176, 195 158" fill="none" stroke="#7ea7a2" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.9"/>
  <polygon points="199,151 189,157 199,163" fill="#7ea7a2"/>
  <text x="314" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587975">Sürekli izleme ve doğrulama</text>
</svg>