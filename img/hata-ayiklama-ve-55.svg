<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2faef"/>
    </linearGradient>
    <linearGradient id="traceLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8294d6"/>
      <stop offset="100%" stop-color="#58b99b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#54708c" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#526f8a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="55" cy="38" r="72" fill="#dceaff" opacity="0.55"/>
  <circle cx="594" cy="286" r="92" fill="#d9f3e5" opacity="0.55"/>

  <text x="32" y="35" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#435670">İzleme Modu</text>
  <text x="32" y="53" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#73849b">Kodun ayak izleri</text>

  <g filter="url(#shadow)">
    <rect x="31" y="77" width="145" height="190" rx="18" fill="#ffffff"/>
  </g>
  <rect x="47" y="94" width="113" height="28" rx="10" fill="#e8edff"/>
  <text x="62" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5367ad">Program</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667990">
    <text x="53" y="146">1  toplam = 0</text>
    <text x="53" y="171">2  döngü başla</text>
    <text x="53" y="196">3  koşulu denetle</text>
    <text x="53" y="221">4  sonucu döndür</text>
  </g>
  <rect x="47" y="181" width="112" height="25" rx="7" fill="#ffe5df"/>
  <text x="53" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#b75e58">i ≤ uzunluk</text>
  <circle cx="150" cy="193" r="8" fill="#ef8276"/>
  <path d="M147 190 L153 196 M153 190 L147 196" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <path d="M182 171 C202 171 205 160 222 160" fill="none" stroke="#8194c7" stroke-width="2.2"/>
  <polygon points="222,155 231,160 222,165" fill="#8194c7"/>

  <g filter="url(#shadow)">
    <rect x="232" y="65" width="177" height="222" rx="22" fill="#ffffff"/>
  </g>
  <text x="255" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566d">Trace Zaman Çizelgesi</text>
  <line x1="277" y1="117" x2="277" y2="251" stroke="url(#traceLine)" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <circle cx="277" cy="128" r="12" fill="#dfe6ff"/>
    <rect x="300" y="111" width="88" height="34" rx="10" fill="#eff2ff"/>
    <circle cx="277" cy="174" r="12" fill="#d9f3e9"/>
    <rect x="300" y="157" width="88" height="34" rx="10" fill="#e9f8f1"/>
    <circle cx="277" cy="220" r="12" fill="#ffe1db"/>
    <rect x="300" y="203" width="88" height="34" rx="10" fill="#fff0ec"/>
  </g>

  <text x="271" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#596db1">1</text>
  <text x="313" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5367a5">Başlangıç</text>
  <text x="313" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#458a76">i: 2  toplam: 10</text>
  <text x="313" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#bd615b">i: 3  tanımsız</text>
  <text x="271" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b9c83">2</text>
  <text x="271" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#c5655c">!</text>

  <path d="M416 220 C434 220 436 191 451 191" fill="none" stroke="#e07b70" stroke-width="2.2"/>
  <polygon points="451,186 460,191 451,196" fill="#e07b70"/>

  <g filter="url(#shadow)">
    <rect x="461" y="98" width="149" height="148" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="535" cy="142" r="28" fill="#fff0c9"/>
  <circle cx="531" cy="138" r="12" fill="none" stroke="#c98a35" stroke-width="3"/>
  <path d="M540 147 L551 158" stroke="#c98a35" stroke-width="4" stroke-linecap="round"/>
  <path d="M526 138 L530 142 L537 133" fill="none" stroke="#d66b60" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="486" y="189" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4a6278">Mantık Pürüzü</text>
  <text x="483" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74869a">Koşulu düzelt</text>
  <rect x="482" y="220" width="107" height="14" rx="7" fill="#daf2e6"/>
  <text x="494" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#438c72">i &lt; uzunluk</text>

  <path d="M193 286 L439 286" stroke="#c7d5e1" stroke-width="1"/>
  <circle cx="198" cy="286" r="4" fill="#8497c9"/>
  <text x="210" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74869a">Durum</text>
  <circle cx="299" cy="286" r="4" fill="#62b99b"/>
  <text x="311" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74869a">Değer</text>
  <circle cx="401" cy="286" r="4" fill="#e47f72"/>
  <text x="413" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74869a">Neden</text>
