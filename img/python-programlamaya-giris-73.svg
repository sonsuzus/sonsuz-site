<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Python Küme Metodları</text>

  <!-- Merkez küme kavramı -->
  <ellipse cx="320" cy="160" rx="70" ry="45" fill="#e8f4f8" stroke="#5dade2" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276" font-weight="bold">Küme</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2980b9">sırasız, benzersiz</text>

  <!-- Dış halka: temel işlemler -->
  <!-- Bileşim -->
  <rect x="80" y="60" width="100" height="50" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e8449" font-weight="bold">Bileşim</text>
  <text x="130" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">| işlemi</text>

  <!-- Kesişim -->
  <rect x="460" y="60" width="100" height="50" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ca6f1e" font-weight="bold">Kesişim</text>
  <text x="510" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e67e22">&amp; işlemi</text>

  <!-- Fark -->
  <rect x="80" y="210" width="100" height="50" rx="10" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c3483" font-weight="bold">Fark</text>
  <text x="130" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8e44ad">- işlemi</text>

  <!-- Simetrik fark -->
  <rect x="460" y="210" width="100" height="50" rx="10" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a93226" font-weight="bold">Simetrik fark</text>
  <text x="510" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c0392b">^ işlemi</text>

  <!-- Alt küme -->
  <rect x="270" y="40" width="100" height="40" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="57" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276" font-weight="bold">Alt küme</text>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2980b9">&lt;= &lt; &gt; &gt;=</text>

  <!-- Metodlar -->
  <rect x="270" y="240" width="100" height="40" rx="10" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e8449" font-weight="bold">Metodlar</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">add, remove, pop</text>

  <!-- Bağlantı çizgileri (ok başları manuel) -->
  <!-- Bileşim -->
  <path d="M180 85 L250 130" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <polygon points="250,130 241,124 244,133" fill="#27ae60"/>

  <!-- Kesişim -->
  <path d="M460 85 L390 130" stroke="#e67e22" stroke-width="1.5" fill="none"/>
  <polygon points="390,130 399,124 396,133" fill="#e67e22"/>

  <!-- Fark -->
  <path d="M180 235 L250 190" stroke="#8e44ad" stroke-width="1.5" fill="none"/>
  <polygon points="250,190 241,196 244,187" fill="#8e44ad"/>

  <!-- Simetrik fark -->
  <path d="M460 235 L390 190" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <polygon points="390,190 399,196 396,187" fill="#c0392b"/>

  <!-- Alt küme -->
  <path d="M320 80 L320 115" stroke="#2980b9" stroke-width="1.5" fill="none"/>
  <polygon points="320,115 316,106 324,106" fill="#2980b9"/>

  <!-- Metodlar -->
  <path d="M320 240 L320 205" stroke="#1e8449" stroke-width="1.5" fill="none"/>
  <polygon points="320,205 316,214 324,214" fill="#1e8449"/>

  <!-- Yan not: donuk küme -->
  <rect x="520" y="140" width="90" height="40" rx="8" fill="#f9e79f" stroke="#d4ac0d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="565" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d6608" font-weight="bold">Donuk küme</text>
  <text x="565" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#b7950b">frozenset</text>

  <!-- Donuk küme bağlantısı -->
  <path d="M390 160 L520 160" stroke="#d4ac0d" stroke-width="1.5" fill="none"/>
  <polygon points="520,160 511,156 511,164" fill="#d4ac0d"/>

  <!-- Alt not: hız -->
  <rect x="30" y="140" width="90" height="40" rx="8" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="75" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276" font-weight="bold">Hash tabanlı</text>
  <text x="75" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2980b9">hızlı arama</text>

  <path d="M250 160 L120 160" stroke="#2980b9" stroke-width="1.5" fill="none"/>
  <polygon points="120,160 129,156 129,164" fill="#2980b9"/>
</svg>