<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Tutuklular ve Kutular - Strateji Diyagramı</text>

  <!-- Sol taraf: Ali odası -->
  <rect x="30" y="55" width="180" height="220" rx="14" fill="#e8f4f8" stroke="#b8dce8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">ALİ ODASI</text>

  <!-- Kutular -->
  <rect x="50" y="95" width="32" height="32" rx="6" fill="#d4e6f1" stroke="#5d8aa8" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="66" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">1</text>

  <rect x="92" y="95" width="32" height="32" rx="6" fill="#d4e6f1" stroke="#5d8aa8" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="108" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">2</text>

  <rect x="134" y="95" width="32" height="32" rx="6" fill="#d4e6f1" stroke="#5d8aa8" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="150" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">3</text>

  <rect x="176" y="95" width="32" height="32" rx="6" fill="#d4e6f1" stroke="#5d8aa8" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="192" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">4</text>

  <!-- Kağıt simgesi -->
  <rect x="100" y="145" width="40" height="28" rx="4" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.2"/>
  <line x1="108" y1="155" x2="132" y2="155" stroke="#d4ac0d" stroke-width="1"/>
  <line x1="108" y1="162" x2="132" y2="162" stroke="#d4ac0d" stroke-width="1"/>
  <text x="120" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7d6608">Kağıt</text>

  <!-- Para simgeleri -->
  <circle cx="70" cy="200" r="10" fill="#fad7a0" stroke="#d35400" stroke-width="1.2"/>
  <text x="70" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7e5109">Y</text>

  <circle cx="110" cy="200" r="10" fill="#fad7a0" stroke="#d35400" stroke-width="1.2"/>
  <text x="110" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7e5109">T</text>

  <circle cx="150" cy="200" r="10" fill="#fad7a0" stroke="#d35400" stroke-width="1.2"/>
  <text x="150" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7e5109">Y</text>

  <circle cx="190" cy="200" r="10" fill="#fad7a0" stroke="#d35400" stroke-width="1.2"/>
  <text x="190" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7e5109">T</text>

  <text x="120" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5d8aa8">Para seç ve çevir</text>

  <!-- Orta ok: Ali'den Veli'ye -->
  <path d="M 215 160 L 265 160" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <polygon points="265,155 275,160 265,165" fill="#2c3e50"/>

  <!-- Orta bölüm: Strateji -->
  <rect x="280" y="70" width="130" height="190" rx="14" fill="#eafaf1" stroke="#82e0aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="345" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e8449">ORTAK STRATEJİ</text>

  <!-- Strateji ikonları -->
  <rect x="295" y="110" width="100" height="35" rx="8" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1"/>
  <text x="345" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Kodlama</text>
  <text x="345" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">Yazı/Tura</text>

  <rect x="295" y="155" width="100" height="35" rx="8" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1"/>
  <text x="345" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Kutu seçimi</text>
  <text x="345" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">İpucu çözümü</text>

  <rect x="295" y="200" width="100" height="35" rx="8" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1"/>
  <text x="345" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Garanti</text>
  <text x="345" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">%100 başarı</text>

  <!-- Sağ ok: Strateji'den Veli'ye -->
  <path d="M 415 160 L 465 160" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <polygon points="465,155 475,160 465,165" fill="#2c3e50"/>

  <!-- Sağ taraf: Veli odası -->
  <rect x="480" y="55" width="140" height="220" rx="14" fill="#fef9e7" stroke="#f0d78c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#7d6608">VELİ ODASI</text>

  <!-- Veli görüşü -->
  <rect x="495" y="95" width="110" height="60" rx="8" fill="#fcf3cf" stroke="#f0d78c" stroke-width="1"/>
  <text x="550" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d6608">Paraları görür</text>
  <text x="550" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d6608">Kutuları görmez</text>
  <text x="550" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d6608">Bir kutu seçer</text>

  <!-- Sonuç -->
  <rect x="495" y="170" width="110" height="50" rx="8" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1.2"/>
  <text x="550" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Doğru kutu</text>
  <text x="550" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#27ae60">Serbest kalma</text>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d" opacity="0.8">Ali kağıdın yerini bilir ve parayı çevirerek Veli'ye ipucu kodlar</text>
</svg>