<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="180" y="15" width="280" height="38" rx="19" fill="#4a6fa5" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="39" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">C Konsol İşlemleri</text>

  <!-- Giriş bloğu -->
  <rect x="40" y="80" width="160" height="55" rx="10" fill="#d4e6f1" filter="url(#shadow)" stroke="#85c1e9" stroke-width="1.5"/>
  <text x="120" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Klavye Girişi</text>
  <text x="120" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">getchar()</text>

  <!-- Çıkış bloğu -->
  <rect x="440" y="80" width="160" height="55" rx="10" fill="#d5f5e3" filter="url(#shadow)" stroke="#82e0aa" stroke-width="1.5"/>
  <text x="520" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e8449">Ekran Çıkışı</text>
  <text x="520" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#196f3d">putchar()</text>

  <!-- Ok: Giriş -> İşlem -->
  <path d="M200 107 L260 107" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="260,102 272,107 260,112" fill="#5d6d7e"/>

  <!-- Ok: İşlem -> Çıkış -->
  <path d="M380 107 L440 107" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="440,102 452,107 440,112" fill="#5d6d7e"/>

  <!-- İşlem merkez bloğu -->
  <rect x="260" y="75" width="120" height="65" rx="12" fill="#fdebd0" filter="url(#shadow)" stroke="#f5b041" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7e5109">Karakter İşleme</text>
  <text x="320" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9c640c">stdio.h</text>

  <!-- Alt bilgi: EOF -->
  <rect x="40" y="170" width="250" height="60" rx="10" fill="#e8daef" filter="url(#shadowLight)" stroke="#a569bd" stroke-width="1.2" opacity="0.9"/>
  <text x="165" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">EOF Makrosu</text>
  <text x="165" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d3c98">Hata durumunda -1 döner</text>

  <!-- Alt bilgi: ENTER -->
  <rect x="350" y="170" width="250" height="60" rx="10" fill="#fadbd8" filter="url(#shadowLight)" stroke="#e74c3c" stroke-width="1.2" opacity="0.9"/>
  <text x="475" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#922b21">ENTER Tuşu</text>
  <text x="475" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a93226">\n karakteri döner</text>

  <!-- Bağlantı çizgileri -->
  <path d="M120 135 L120 170" stroke="#aab7b8" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <path d="M520 135 L520 170" stroke="#aab7b8" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>

  <!-- Alt açıklama -->
  <rect x="140" y="260" width="360" height="40" rx="8" fill="#ebedef" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#566573">int getchar(void)  |  int putchar(int id)</text>
  <text x="320" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">Klavye ve ekran arasında karakter tabanlı iletişim</text>
</svg>