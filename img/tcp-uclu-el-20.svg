    <rect x="68" y="151" width="20" height="4" rx="2" fill="#b2c9e2"/>
    <path d="M59 178 H100" stroke="#7097c1" stroke-width="4" stroke-linecap="round"/>
    <path d="M78 169 V178" stroke="#7097c1" stroke-width="4" stroke-linecap="round"/>

    <rect x="500" y="122" width="49" height="57" rx="8" fill="#ffffff"/>
    <circle cx="513" cy="137" r="4" fill="#77b889"/>
    <rect x="523" y="134" width="17" height="5" rx="2" fill="#9fcfb0"/>
    <circle cx="513" cy="151" r="4" fill="#77b889"/>
    <rect x="523" y="148" width="17" height="5" rx="2" fill="#9fcfb0"/>
    <circle cx="513" cy="165" r="4" fill="#77b889"/>
    <rect x="523" y="162" width="17" height="5" rx="2" fill="#9fcfb0"/>
