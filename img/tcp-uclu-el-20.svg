<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dcf6"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff3df"/>
      <stop offset="100%" stop-color="#c5e5cb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#526579" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="111" fill="#ffffff" opacity="0.42"/>
  <circle cx="320" cy="160" r="87" fill="none" stroke="#cbddeb" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g filter="url(#shadow)">
    <rect x="42" y="102" width="145" height="118" rx="20" fill="url(#clientGrad)"/>
    <rect x="453" y="102" width="145" height="118" rx="20" fill="url(#serverGrad)"/>
  </g>

  <g opacity="0.85">
    <rect x="63" y="125" width="33" height="44" rx="6" fill="#ffffff"/>
    <rect x="68" y="131" width="23" height="4" rx="2" fill="#86a9d1"/>
