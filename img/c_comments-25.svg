<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C Yorum Satırları</text>

  <!-- Kaynak Kod Kutusu -->
  <rect x="40" y="55" width="260" height="100" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#d0dce8" stroke-width="1.5"/>
  <text x="55" y="78" font-family="Consolas, monospace" font-size="11" fill="#4a6a8a">#include &lt;stdio.h&gt;</text>
  <text x="55" y="95" font-family="Consolas, monospace" font-size="11" fill="#4a6a8a">void main(void) {</text>
  <text x="55" y="112" font-family="Consolas, monospace" font-size="11" fill="#4a6a8a">  int id; <tspan fill="#8a9a4a" font-style="italic">/* bildirim */</tspan></text>
  <text x="55" y="129" font-family="Consolas, monospace" font-size="11" fill="#4a6a8a">  id = 27; <tspan fill="#8a9a4a" font-style="italic">/* atama */</tspan></text>
  <text x="55" y="146" font-family="Consolas, monospace" font-size="11" fill="#4a6a8a">  printf("%d", id); }</text>

  <!-- Derleyici Kutusu -->
  <rect x="380" y="55" width="220" height="100" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#d0dce8" stroke-width="1.5"/>
  <text x="490" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Derleyici</text>
  <text x="490" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">Yorumları tamamen yok sayar</text>
  <text x="490" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">Sadece kod satırlarını işler</text>
  <text x="490" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">Çıktı üretir</text>

  <!-- Ok: Kaynak -> Derleyici -->
  <path d="M300 105 L375 105" stroke="#7a9a7a" stroke-width="2" fill="none"/>
  <polygon points="375,100 385,105 375,110" fill="#7a9a7a"/>

  <!-- Çıktı Kutusu -->
  <rect x="380" y="195" width="220" height="70" rx="10" fill="#e8f4e8" filter="url(#shadowLight)" stroke="#b0ccb0" stroke-width="1.5"/>
  <text x="490" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c5a2c">Program Çıktısı</text>
  <text x="490" y="245" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#2c5a2c">27</text>

  <!-- Ok: Derleyici -> Çıktı -->
  <path d="M490 155 L490 190" stroke="#7a9a7a" stroke-width="2" fill="none"/>
  <polygon points="485,190 490,200 495,190" fill="#7a9a7a"/>

  <!-- Yorum Satırı Kutusu -->
  <rect x="40" y="195" width="260" height="70" rx="10" fill="#f0f0f8" filter="url(#shadowLight)" stroke="#c8c8d8" stroke-width="1.5"/>
  <text x="170" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#4a4a6a">Yorum Satırları</text>
  <text x="170" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6a6a8a">/* ... */</text>
  <text x="170" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a6a8a">Açıklama ve geçici iptal için</text>

  <!-- Kesikli ok: Yorum -> Derleyici (yok sayma) -->
  <path d="M300 225 L375 130" stroke="#c86a6a" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="372,125 382,128 375,135" fill="#c86a6a"/>
  <text x="330" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c86a6a" transform="rotate(-20, 330, 170)">yok sayılır</text>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8899aa">Yorum satırları program akışını etkilemez</text>
</svg>