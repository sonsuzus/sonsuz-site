<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6d8197" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#526b7d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="155" r="117" fill="#dceef2" opacity="0.34"/>
  <circle cx="319" cy="155" r="92" fill="#edf6f7" opacity="0.78"/>

  <rect x="22" y="27" width="150" height="266" rx="18" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="43" y="55" fill="#39556a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Başlangıç düzeni</text>
  <text x="43" y="73" fill="#738594" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Kişi kendi şapkasında</text>

  <g filter="url(#softShadow)">
    <rect x="42" y="91" width="110" height="34" rx="10" fill="#dceaff"/>
    <circle cx="60" cy="108" r="11" fill="#87aee8"/>
    <text x="56" y="112" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">1</text>
    <text x="80" y="112" fill="#3e5f82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Şapka 1</text>

    <rect x="42" y="137" width="110" height="34" rx="10" fill="#daf3e8"/>
    <circle cx="60" cy="154" r="11" fill="#72b89c"/>
    <text x="56" y="158" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">2</text>
    <text x="80" y="158" fill="#3e6b5c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Şapka 2</text>

    <rect x="42" y="183" width="110" height="34" rx="10" fill="#fff0d5"/>
    <circle cx="60" cy="200" r="11" fill="#e6ae62"/>
    <text x="56" y="204" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">3</text>
    <text x="80" y="204" fill="#826137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Şapka 3</text>

    <rect x="42" y="229" width="110" height="34" rx="10" fill="#f2e0f5"/>
    <circle cx="60" cy="246" r="11" fill="#b886c2"/>
    <text x="56" y="250" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">4</text>
    <text x="80" y="250" fill="#715378" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Şapka 4</text>
  </g>

  <path d="M179 159 C194 159 201 159 213 159" fill="none" stroke="#7694a7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="213,159 204,153 204,165" fill="#7694a7"/>

  <g filter="url(#shadow)">
    <rect x="223" y="105" width="190" height="101" rx="20" fill="#ffffff"/>
  </g>
  <text x="318" y="132" text-anchor="middle" fill="#315b6c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Düzensizleştirme</text>
  <text x="318" y="151" text-anchor="middle" fill="#68808d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Sabit nokta yok</text>
  <rect x="255" y="164" width="127" height="27" rx="13" fill="#e6f4ef"/>
  <text x="318" y="182" text-anchor="middle" fill="#397462" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">π(i) ≠ i</text>

  <path d="M278 101 C255 82 260 55 288 51 C315 47 329 63 326 83" fill="none" stroke="#8ba9d8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="327,84 318,77 316,88" fill="#8ba9d8"/>
  <path d="M359 102 C384 82 384 55 354 51 C336 48 325 59 325 76" fill="none" stroke="#e1a767" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="325,77 320,67 331,68" fill="#e1a767"/>
  <path d="M278 209 C255 229 265 258 292 260 C319 262 331 244 326 225" fill="none" stroke="#76b99e" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="326,224 332,234 321,233" fill="#76b99e"/>
  <path d="M359 209 C383 229 376 257 349 260 C329 262 320 247 323 229" fill="none" stroke="#b887c2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="323,228 329,238 318,237" fill="#b887c2"/>

  <path d="M421 159 C432 159 439 159 450 159" fill="none" stroke="#7694a7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="450,159 441,153 441,165" fill="#7694a7"/>

  <rect x="460" y="27" width="158" height="266" rx="18" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="480" y="55" fill="#39556a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Hızlı hesaplama</text>

  <rect x="479" y="73" width="120" height="51" rx="12" fill="#e8f0ff"/>
  <text x="490" y="94" fill="#4c6e99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Dahil etme</text>
  <text x="490" y="111" fill="#657e9e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Dₙ ≈ n! / e</text>

  <rect x="479" y="136" width="120" height="58" rx="12" fill="#e4f5ed"/>
  <text x="490" y="157" fill="#397460" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Yineleme</text>
  <text x="490" y="176" fill="#5b8878" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Dₙ = (n−1)(Dₙ₋₁+Dₙ₋₂)</text>

  <rect x="479" y="206" width="120" height="67" rx="12" fill="#fff2df"/>
  <text x="490" y="227" fill="#8a6335" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Sonuçlar</text>
  <text x="490" y="246" fill="#9b784e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">n: 2   3   4   5</text>
  <text x="490" y="263" fill="#9b784e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Dₙ: 1   2   9   44</text>

  <rect x="224" y="277" width="190" height="27" rx="13" fill="#d9eef5" filter="url(#softShadow)"/>
  <text x="319" y="295" text-anchor="middle" fill="#3f7182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Her eşleşme farklı koltuğa</text>
</svg>