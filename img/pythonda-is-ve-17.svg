<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3d8ff"/>
      <stop offset="100%" stop-color="#cbbcf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#63748d" flood-opacity="0.2"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#63748d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="35" r="55" fill="#d9eff4" opacity="0.45"/>
  <circle cx="587" cy="285" r="72" fill="#e5dcfa" opacity="0.4"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40526b">Python: Değer ve Nesne Kimliği</text>

  <path d="M186 116 L252 139" fill="none" stroke="#8da0b5" stroke-width="2"/>
  <polygon points="252,139 242,132 244,143" fill="#8da0b5"/>
  <path d="M186 218 L252 182" fill="none" stroke="#8da0b5" stroke-width="2"/>
  <polygon points="252,182 242,181 247,191" fill="#8da0b5"/>
  <path d="M388 139 L455 116" fill="none" stroke="#8da0b5" stroke-width="2"/>
  <polygon points="455,116 444,114 448,124" fill="#8da0b5"/>
  <path d="M388 182 L455 217" fill="none" stroke="#8da0b5" stroke-width="2"/>
  <polygon points="455,217 447,207 443,217" fill="#8da0b5"/>

  <g filter="url(#softShadow)">
    <rect x="38" y="70" width="148" height="92" rx="18" fill="#d9f1ed"/>
    <rect x="38" y="184" width="148" height="92" rx="18" fill="#ffe8cf"/>
  </g>

  <text x="112" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#285c61">Değer karşılaştırma</text>
  <rect x="66" y="111" width="92" height="29" rx="10" fill="#ffffff" opacity="0.8"/>
  <text x="112" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#277478">==</text>
  <text x="112" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6970">Değerler eşit mi?</text>

  <text x="112" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a572d">Kimlik karşılaştırma</text>
  <rect x="66" y="225" width="92" height="29" rx="10" fill="#ffffff" opacity="0.8"/>
  <text x="112" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a35e25">is</text>
  <text x="112" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#826044">Aynı nesne mi?</text>

  <g filter="url(#shadow)">
    <rect x="252" y="91" width="136" height="139" rx="24" fill="url(#cache)"/>
    <circle cx="320" cy="142" r="35" fill="#f8f5ff" opacity="0.87"/>
    <text x="320" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#56467f">Küçük tam sayı</text>
    <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#56467f">önbelleği</text>
    <text x="320" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#675a88">-5 ... 256</text>
    <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#675a88">paylaşılan nesne</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="455" y="70" width="148" height="92" rx="18" fill="#dcf0d9"/>
    <rect x="455" y="184" width="148" height="92" rx="18" fill="#e9e8f8"/>
  </g>

  <text x="529" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416c47">Küçük sayı örneği</text>
  <rect x="477" y="108" width="47" height="30" rx="9" fill="#ffffff"/>
  <rect x="534" y="108" width="47" height="30" rx="9" fill="#ffffff"/>
  <text x="500" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416c47">a: 100</text>
  <text x="557" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416c47">b: 100</text>
  <path d="M524 123 L533 123" stroke="#6fa775" stroke-width="2"/>
  <text x="529" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416c47">== doğru · is tesadüfen doğru</text>

  <text x="529" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#58558b">Büyük sayı örneği</text>
  <rect x="477" y="222" width="47" height="30" rx="9" fill="#ffffff"/>
  <rect x="534" y="222" width="47" height="30" rx="9" fill="#ffffff"/>
  <text x="500" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58558b">1000</text>
  <text x="557" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58558b">1000</text>
  <path d="M525 237 L532 237" stroke="#8b88bd" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="529" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58558b">== doğru · is genelde yanlış</text>

  <g filter="url(#softShadow)">
    <rect x="178" y="280" width="284" height="28" rx="14" fill="#ffffff" opacity="0.92"/>
  </g>
  <text x="320" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d627a">Sayı ve içerik için == · None gibi tekiller için is</text>
</svg>