<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Hashlife Algoritması</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5d6d7e">Conway'in Hayat Oyunu için hızlandırma</text>

  <!-- Merkez düğüm -->
  <rect x="255" y="70" width="130" height="50" rx="10" fill="#a8d8ea" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Dört Ağaç</text>
  <text x="320" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a5276">(Quadtree)</text>

  <!-- Sol üst: Klasik -->
  <rect x="40" y="75" width="140" height="55" rx="10" fill="#f9e79f" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="110" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Dizi Tabanlı</text>
  <text x="110" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7d6608">Tüm hücreler</text>
  <text x="110" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7d6608">Birer nesil</text>

  <!-- Sol alt: Seyrek -->
  <rect x="40" y="155" width="140" height="55" rx="10" fill="#d5f5e3" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="110" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e8449">Seyrek Küme</text>
  <text x="110" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e8449">Canlı hücreler</text>
  <text x="110" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e8449">Birer nesil</text>

  <!-- Sağ üst: Hash-consing -->
  <rect x="460" y="75" width="140" height="55" rx="10" fill="#d2b4de" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="530" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">Hash-Consing</text>
  <text x="530" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c3483">Paylaşılan düğümler</text>
  <text x="530" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c3483">Tek depolama</text>

  <!-- Sağ alt: Önbellek -->
  <rect x="460" y="155" width="140" height="55" rx="10" fill="#fadbd8" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="530" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Sonuç Önbelleği</text>
  <text x="530" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c0392b">Gelecek durumlar</text>
  <text x="530" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c0392b">Üstel sıçrama</text>

  <!-- Alt merkez: Gelecek -->
  <rect x="230" y="240" width="180" height="50" rx="10" fill="#a9dfbf" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#145a32">Geleceğe Işınlanma</text>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#145a32">Milyonlarca nesil</text>

  <!-- Oklar: Sol üstten merkeze -->
  <path d="M180 100 L250 95" stroke="#7d6608" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="252,95 243,90 243,100" fill="#7d6608" opacity="0.7"/>

  <!-- Oklar: Sol alttan merkeze -->
  <path d="M180 180 L250 115" stroke="#1e8449" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="252,115 243,110 244,120" fill="#1e8449" opacity="0.7"/>

  <!-- Oklar: Sağ üstten merkeze -->
  <path d="M460 100 L390 95" stroke="#6c3483" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="388,95 397,90 397,100" fill="#6c3483" opacity="0.7"/>

  <!-- Oklar: Sağ alttan merkeze -->
  <path d="M460 180 L390 115" stroke="#c0392b" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="388,115 397,110 396,120" fill="#c0392b" opacity="0.7"/>

  <!-- Oklar: Merkezden aşağı -->
  <path d="M320 120 L320 235" stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="320,238 315,229 325,229" fill="#2c3e50" opacity="0.6"/>

  <!-- Bilgi akışı etiketi -->
  <text x="320" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d" opacity="0.8">tekrar eden desenler</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d" opacity="0.8">tanınır ve atlanır</text>

  <!-- Kenar notu -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#95a5a6">Boş bölgeler anında atlanır · Kök genişletme · Çöp toplama</text>
</svg>