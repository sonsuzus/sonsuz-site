<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="seedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#c9e8f7"/>
    </linearGradient>
    <linearGradient id="prngGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9ddff"/>
      <stop offset="100%" stop-color="#d8c8f4"/>
    </linearGradient>
    <linearGradient id="secureGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f3df"/>
      <stop offset="100%" stop-color="#bde5cc"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2c9"/>
      <stop offset="100%" stop-color="#f8df9d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5d7188" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5d7188" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="565" cy="48" r="92" fill="#dceefa" opacity="0.42"/>
  <circle cx="77" cy="283" r="110" fill="#dff2dd" opacity="0.38"/>
  <path d="M30 54 C145 12 221 38 306 23" fill="none" stroke="#b9d8ed" stroke-width="2" opacity="0.45"/>
  <path d="M355 295 C452 258 522 299 620 252" fill="none" stroke="#b9dfc1" stroke-width="2" opacity="0.45"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35536a">KONTROLLÜ BELİRSİZLİK</text>

  <!-- Tohum -->
  <g filter="url(#shadow)">
    <rect x="42" y="118" width="126" height="82" rx="20" fill="url(#seedGrad)" stroke="#9cc7df"/>
  </g>
  <circle cx="72" cy="146" r="15" fill="#ffffff" opacity="0.75"/>
  <circle cx="67" cy="142" r="3" fill="#5c91b1"/>
  <circle cx="77" cy="142" r="3" fill="#5c91b1"/>
  <path d="M65 151 Q72 158 79 151" fill="none" stroke="#5c91b1" stroke-width="2" stroke-linecap="round"/>
  <text x="113" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31536b">Tohum</text>
  <text x="113" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52758b">Başlangıç durumu</text>

  <!-- giriş oku -->
  <path d="M169 158 L205 158" stroke="#668da6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="211,158 201,152 201,164" fill="#668da6"/>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="214" y="92" width="192" height="132" rx="25" fill="#ffffff" stroke="#c8d9e5"/>
  </g>
  <circle cx="310" cy="127" r="21" fill="#e8f3fb" stroke="#a7cce2"/>
  <path d="M299 127 L305 133 L321 117" fill="none" stroke="#5c98ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="310" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334d63">Sayı Üreteci</text>
  <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607b8d">Algoritma ve durum</text>
  <rect x="248" y="196" width="124" height="17" rx="8.5" fill="#eff6fa"/>
  <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54758b">Xₙ₊₁ = (aXₙ+c) mod m</text>

  <!-- üst dal -->
  <path d="M407 132 C426 132 423 84 443 84" fill="none" stroke="#8771ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="449,84 439,78 440,90" fill="#8771ad"/>

  <!-- alt dal -->
  <path d="M407 184 C427 184 423 237 443 237" fill="none" stroke="#559275" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="449,237 439,231 440,243" fill="#559275"/>

  <!-- PRNG -->
  <g filter="url(#shadow)">
    <rect x="452" y="49" width="148" height="76" rx="19" fill="url(#prngGrad)" stroke="#b7a0da"/>
  </g>
  <circle cx="478" cy="76" r="13" fill="#ffffff" opacity="0.72"/>
  <path d="M472 76 L484 76 M478 70 L478 82" stroke="#8567ac" stroke-width="2" stroke-linecap="round"/>
  <text x="535" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#594175">PRNG</text>
  <text x="535" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d91">Tekrarlanabilir</text>
  <text x="535" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d91">Hızlı</text>

  <!-- secure -->
  <g filter="url(#shadow)">
    <rect x="452" y="198" width="148" height="77" rx="19" fill="url(#secureGrad)" stroke="#91c4a4"/>
  </g>
  <path d="M469 231 L469 224 Q469 214 479 214 Q489 214 489 224 L489 231" fill="none" stroke="#4f8d68" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="466" y="228" width="26" height="20" rx="5" fill="#ffffff" opacity="0.78" stroke="#6aa37e"/>
  <circle cx="479" cy="237" r="2.5" fill="#4f8d68"/>
  <text x="545" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38674c">CSPRNG</text>
  <text x="545" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#518167">Entropi ve güvenlik</text>
  <text x="545" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#518167">Öngörülemez</text>

  <!-- çıktı kartları -->
  <path d="M600 87 L617 87" stroke="#8771ad" stroke-width="2" stroke-linecap="round"/>
  <polygon points="623,87 613,81 613,93" fill="#8771ad"/>
  <g filter="url(#softShadow)">
    <rect x="535" y="130" width="83" height="38" rx="13" fill="url(#outGrad)" stroke="#e3c66b"/>
  </g>
  <text x="576.5" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#806529">Oyun</text>

  <path d="M600 236 L617 236" stroke="#559275" stroke-width="2" stroke-linecap="round"/>
  <polygon points="623,236 613,230 613,242" fill="#559275"/>
  <g filter="url(#softShadow)">
    <rect x="535" y="281" width="83" height="27" rx="12" fill="url(#outGrad)" stroke="#e3c66b"/>
  </g>
  <text x="576.5" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#806529">Anahtar</text>

  <!-- küçük bağlantılar -->
  <path d="M576 125 L576 129" stroke="#b69654" stroke-width="2"/>
  <path d="M576 275 L576 280" stroke="#b69654" stroke-width="2"/>
</svg>