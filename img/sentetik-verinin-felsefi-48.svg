<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8d0dc"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Sentetik Veri Döngüsü ve Model Çöküşü</text>

  <!-- Döngüsel akış: Gerçek Veri → Model 1 → Sentetik Veri → Model 2 -->
  
  <!-- Gerçek Veri Kutusu -->
  <rect x="30" y="55" width="110" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="85" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Gerçek Veri</text>
  <text x="85" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Dünya Gözlemi</text>

  <!-- Ok 1 -->
  <polygon points="145,80 165,73 165,87" fill="#5d6d7e"/>
  <line x1="140" y1="80" x2="160" y2="80" stroke="#5d6d7e" stroke-width="2"/>

  <!-- Model 1 Kutusu -->
  <rect x="170" y="55" width="110" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="225" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7e5109">Model 1</text>
  <text x="225" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Öğrenme ve Sıkıştırma</text>

  <!-- Ok 2 -->
  <polygon points="285,80 305,73 305,87" fill="#5d6d7e"/>
  <line x1="280" y1="80" x2="300" y2="80" stroke="#5d6d7e" stroke-width="2"/>

  <!-- Sentetik Veri Kutusu -->
  <rect x="310" y="55" width="110" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="365" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">Sentetik Veri</text>
  <text x="365" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Yankı Üretimi</text>

  <!-- Ok 3 -->
  <polygon points="425,80 445,73 445,87" fill="#5d6d7e"/>
  <line x1="420" y1="80" x2="440" y2="80" stroke="#5d6d7e" stroke-width="2"/>

  <!-- Model 2 Kutusu -->
  <rect x="450" y="55" width="110" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="505" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7e5109">Model 2</text>
  <text x="505" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Yankıyı Öğrenme</text>

  <!-- Geri besleme oku (döngü) -->
  <path d="M 505 105 Q 505 135 365 135 Q 225 135 225 105" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="225,105 219,118 231,118" fill="#c0392b"/>

  <!-- Döngü etiketi -->
  <text x="365" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-style="italic" fill="#c0392b">Döngüsel Öğrenme</text>

  <!-- Formül kutusu -->
  <rect x="30" y="165" width="290" height="65" rx="10" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="175" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Karışım Formülü</text>
  <text x="175" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">D(t+1) = (1-α) D(gerçek) + α D(sentetik)</text>
  <text x="175" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">α büyüdükçe dünya ile temas azalır</text>

  <!-- Riskler Kutusu -->
  <rect x="340" y="165" width="270" height="65" rx="10" fill="url(#box5)" filter="url(#shadow)"/>
  <text x="475" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">Üç Temel Risk</text>
  
  <circle cx="365" cy="205" r="4" fill="#e74c3c"/>
  <text x="375" y="209" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Model Çöküşü</text>
  
  <circle cx="365" cy="222" r="4" fill="#e67e22"/>
  <text x="375" y="226" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Epistemik Aklama</text>
  
  <circle cx="475" cy="205" r="4" fill="#2980b9"/>
  <text x="485" y="209" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Özgünlük Kaybı</text>

  <!-- Alt bilgi -->
  <rect x="30" y="250" width="580" height="50" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadow)"/>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Çözüm: Dengeli Kullanım</text>
  <text x="320" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">Veri kökeni kaydı · Sentetik oran sınırı · İnsan denetimi · Gerçek dünya ile yeniden bağlantı</text>

</svg>