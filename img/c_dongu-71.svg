<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7f0"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b9bd5"/>
      <stop offset="100%" stop-color="#4a8bbf"/>
    </linearGradient>
    <linearGradient id="forGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70ad47"/>
      <stop offset="100%" stop-color="#5e9e3a"/>
    </linearGradient>
    <linearGradient id="whileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f0a030"/>
    </linearGradient>
    <linearGradient id="doGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e07b7b"/>
      <stop offset="100%" stop-color="#d06565"/>
    </linearGradient>
    <linearGradient id="repeatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b7bb5"/>
      <stop offset="100%" stop-color="#8a6aa5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C Programlama Döngüler</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="52" width="150" height="44" rx="22" fill="url(#mainGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="79" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Döngü Kavramı</text>

  <!-- Alt açıklama -->
  <rect x="200" y="106" width="240" height="30" rx="15" fill="#e8f0fe" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7a">Koşula bağlı tekrar çalıştırma</text>

  <!-- Ok: merkezden for'a -->
  <path d="M 290 96 L 170 140" stroke="#70ad47" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="170,140 178,132 176,143" fill="#70ad47" opacity="0.8"/>

  <!-- Ok: merkezden while'a -->
  <path d="M 320 106 L 320 150" stroke="#ffb347" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="320,150 314,142 326,142" fill="#ffb347" opacity="0.8"/>

  <!-- Ok: merkezden do-while'a -->
  <path d="M 350 96 L 470 140" stroke="#e07b7b" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="470,140 462,132 464,143" fill="#e07b7b" opacity="0.8"/>

  <!-- for döngüsü -->
  <rect x="55" y="145" width="160" height="50" rx="12" fill="url(#forGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="135" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">for Döngüsü</text>
  <text x="135" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#eaffea">belirli sayıda tekrar</text>

  <!-- while döngüsü -->
  <rect x="240" y="155" width="160" height="50" rx="12" fill="url(#whileGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">while Döngüsü</text>
  <text x="320" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff8e0">koşul sağlandıkça</text>

  <!-- do-while döngüsü -->
  <rect x="425" y="145" width="160" height="50" rx="12" fill="url(#doGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="505" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">do while Döngüsü</text>
  <text x="505" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffeaea">en az bir kez çalışır</text>

  <!-- for detayları -->
  <rect x="30" y="220" width="210" height="80" rx="10" fill="#f0f9e8" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="135" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#4a7a2a">for (ilk değer; koşul; artış)</text>
  <text x="135" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8a3a">• İlk değer atama</text>
  <text x="135" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8a3a">• Koşul kontrolü</text>
  <text x="135" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8a3a">• Artırma / azaltma</text>

  <!-- while detayları -->
  <rect x="255" y="230" width="130" height="70" rx="10" fill="#fef5e6" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#a07020">while (koşul)</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b08030">• Koşul önce kontrol</text>
  <text x="320" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b08030">• Sonra işlem yapılır</text>

  <!-- do-while detayları -->
  <rect x="400" y="220" width="210" height="80" rx="10" fill="#fdeeee" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="505" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#a04040">do { işlem } while (koşul)</text>
  <text x="505" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b05050">• İşlem önce yapılır</text>
  <text x="505" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b05050">• Koşul sonra kontrol</text>
  <text x="505" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b05050">• En az bir kez çalışır</text>

  <!-- Alt bilgi -->
  <rect x="220" y="305" width="200" height="12" rx="6" fill="#d0e8d0" opacity="0.5"/>
  <text x="320" y="314" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#3a6a3a">Tekrar yazmak yerine döngü kullan</text>
</svg>