<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="sus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bde9f2"/>
      <stop offset="1" stop-color="#92d4e4"/>
