<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#dff3df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#75889b" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#75889b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="562" cy="39" r="72" fill="#dff3ee" opacity="0.55"/>
  <circle cx="66" cy="286" r="88" fill="#dcecff" opacity="0.55"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365269">Akıllı Sera Otomasyonu</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718493">Ölç • Karar ver • Dengele</text>

  <!-- connection lines -->
  <path d="M174 130 C202 130 203 130 228 130" fill="none" stroke="#7ea6b9" stroke-width="2"/>
  <polygon points="228,130 220,126 220,134" fill="#7ea6b9"/>
  <path d="M412 130 C438 130 440 130 466 130" fill="none" stroke="#7ea6b9" stroke-width="2"/>
  <polygon points="466,130 458,126 458,134" fill="#7ea6b9"/>
  <path d="M320 189 L320 226" fill="none" stroke="#7ea6b9" stroke-width="2"/>
  <polygon points="320,226 316,218 324,218" fill="#7ea6b9"/>
  <path d="M466 258 C431 258 413 255 390 240" fill="none" stroke="#9db5c0" stroke-width="1.7" stroke-dasharray="4 4"/>
  <polygon points="390,240 397,241 393,247" fill="#9db5c0"/>

  <!-- Sensor card -->
  <rect x="28" y="79" width="146" height="104" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="28" y="79" width="8" height="104" rx="4" fill="#8fc5e6"/>
  <text x="52" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365269">Sensör Ağı</text>
  <line x1="52" y1="113" x2="151" y2="113" stroke="#dce8ee"/>
  <circle cx="60" cy="132" r="6" fill="#ffd78f"/>
  <path d="M60 122 L60 142 M50 132 L70 132" stroke="#e5a843" stroke-width="1.5"/>
  <text x="76" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a79">Işık</text>
  <path d="M54 153 C54 148 64 148 64 153 C64 158 59 160 59 164" fill="none" stroke="#6aa9cb" stroke-width="2"/>
  <circle cx="59" cy="166" r="3.5" fill="#6aa9cb"/>
  <text x="76" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a79">Sıcaklık ve nem</text>
  <path d="M52 172 C57 166 64 166 69 172" fill="none" stroke="#6aad7c" stroke-width="2"/>
  <path d="M60 168 L60 178" stroke="#6aad7c" stroke-width="2"/>
  <text x="76" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a79">Toprak nemi</text>

  <!-- MQTT pill -->
  <rect x="181" y="108" width="46" height="43" rx="13" fill="#ecf7fb" filter="url(#smallShadow)"/>
  <path d="M193 129 C198 122 204 122 209 129 C214 136 219 136 222 130" fill="none" stroke="#4f9bbb" stroke-width="2"/>
  <text x="188" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#47798e">MQTT</text>

  <!-- Core controller -->
  <rect x="228" y="70" width="184" height="119" rx="22" fill="url(#core)" filter="url(#shadow)"/>
  <text x="320" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d63">Merkezi Denetleyici</text>
  <text x="320" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54757b">ESP32 veya Raspberry Pi</text>
  <rect x="248" y="128" width="64" height="36" rx="10" fill="#ffffff" opacity="0.78"/>
  <rect x="328" y="128" width="64" height="36" rx="10" fill="#ffffff" opacity="0.78"/>
  <text x="280" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c777b">Eşik</text>
  <text x="360" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c777b">PID</text>
  <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54757b">Histerezisli kontrol</text>

  <!-- actuator -->
  <rect x="466" y="79" width="146" height="104" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="604" y="79" width="8" height="104" rx="4" fill="#a6d5a2"/>
  <text x="488" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426c4a">Eyleyiciler</text>
  <line x1="488" y1="113" x2="588" y2="113" stroke="#dce8ee"/>
  <path d="M495 132 C504 122 517 122 523 132 C517 142 504 142 495 132Z" fill="#9ed3e8"/>
  <circle cx="509" cy="132" r="3" fill="#ffffff"/>
  <text x="532" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a79">Fan ve ısıtıcı</text>
  <path d="M498 156 C498 149 509 147 514 154 C518 160 513 165 506 165" fill="none" stroke="#5caa8a" stroke-width="2"/>
  <path d="M506 165 L506 171" stroke="#5caa8a" stroke-width="2"/>
  <text x="532" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a79">Pompa ve sisleme</text>
  <path d="M496 172 L504 166 L512 172 L504 178Z" fill="#f4c968"/>
  <text x="532" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a79">LED lamba</text>

  <!-- lower data card -->
  <rect x="159" y="226" width="322" height="67" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="183" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#436174">İzleme ve Güvenlik</text>
  <line x1="183" y1="258" x2="454" y2="258" stroke="#e1ebed"/>
  <circle cx="198" cy="274" r="8" fill="#d9ecff"/>
  <path d="M194 274 L197 277 L203 270" fill="none" stroke="#5a94c0" stroke-width="1.7"/>
  <text x="213" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#586e7c">Hareketli ortalama</text>
  <circle cx="331" cy="274" r="8" fill="#e0f2df"/>
  <path d="M327 274 L330 277 L336 270" fill="none" stroke="#62a36d" stroke-width="1.7"/>
  <text x="346" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#586e7c">Alarm ve kayıt</text>

  <!-- compact database/cloud -->
  <rect x="496" y="230" width="116" height="56" rx="17" fill="#edf5ff" filter="url(#smallShadow)"/>
  <ellipse cx="518" cy="246" rx="10" ry="4" fill="#91b8dc"/>
  <path d="M508 246 L508 264 C508 269 528 269 528 264 L528 246" fill="#bdd8ec"/>
  <ellipse cx="518" cy="264" rx="10" ry="4" fill="#91b8dc"/>
  <text x="541" y="252" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d7595">Zaman serisi</text>
  <text x="541" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617a8e">Bildirim</text>
</svg>