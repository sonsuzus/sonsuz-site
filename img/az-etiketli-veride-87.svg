<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dcf7"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9ddff"/>
      <stop offset="100%" stop-color="#d9c8f1"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8cf"/>
      <stop offset="100%" stop-color="#f7d2aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6f8aa0" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5f7890" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="#ffffff" opacity="0.42"/>
  <circle cx="320" cy="160" r="91" fill="none" stroke="#bdd8d5" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- Bağlantılar -->
  <path d="M188 100 C211 78 235 69 265 70" fill="none" stroke="#7897b5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="264,64 278,69 266,77" fill="#7897b5"/>

  <path d="M366 71 C397 71 420 82 443 101" fill="none" stroke="#7897b5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="439,94 454,110 435,106" fill="#7897b5"/>

  <path d="M479 157 C477 184 461 203 435 220" fill="none" stroke="#7897b5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="443,218 422,228 433,209" fill="#7897b5"/>

  <path d="M348 251 C313 270 269 270 230 252" fill="none" stroke="#7897b5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="236,260 216,247 238,244" fill="#7897b5"/>

  <path d="M161 216 C139 189 139 148 160 121" fill="none" stroke="#7897b5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="153,128 169,109 165,132" fill="#7897b5"/>

  <!-- Etiketli veri -->
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="118" height="58" rx="17" fill="#d8f1e7"/>
    <rect x="82" y="83" width="25" height="10" rx="5" fill="#9ed7c1"/>
    <rect x="82" y="100" width="45" height="7" rx="3.5" fill="#b5e3d2"/>
    <rect x="82" y="112" width="34" height="7" rx="3.5" fill="#b5e3d2"/>
    <circle cx="157" cy="98" r="17" fill="#f7fffb"/>
    <path d="M149 98 l6 6 11 -13" fill="none" stroke="#5ba986" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="131" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#385b53" font-weight="600">Etiketli veri</text>

  <!-- Model -->
  <g filter="url(#shadow)">
    <rect x="266" y="38" width="108" height="65" rx="19" fill="url(#model)"/>
    <circle cx="290" cy="69" r="12" fill="#f8fcff"/>
    <circle cx="326" cy="58" r="7" fill="#f8fcff"/>
    <circle cx="337" cy="82" r="8" fill="#f8fcff"/>
    <path d="M301 65 L319 60 M300 74 L329 80 M329 65 L334 75" stroke="#7194be" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="320" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365575" font-weight="600">Modeli eğit</text>

  <!-- Havuz -->
  <g filter="url(#shadow)">
    <rect x="447" y="82" width="121" height="78" rx="19" fill="url(#pool)"/>
    <rect x="462" y="97" width="19" height="19" rx="5" fill="#f9f6ff"/>
    <rect x="487" y="97" width="19" height="19" rx="5" fill="#f9f6ff"/>
    <rect x="512" y="97" width="19" height="19" rx="5" fill="#f9f6ff"/>
    <rect x="537" y="97" width="17" height="19" rx="5" fill="#f9f6ff"/>
    <rect x="462" y="123" width="19" height="19" rx="5" fill="#f9f6ff"/>
    <rect x="487" y="123" width="19" height="19" rx="5" fill="#f9f6ff"/>
    <rect x="512" y="123" width="19" height="19" rx="5" fill="#f9f6ff"/>
    <rect x="537" y="123" width="17" height="19" rx="5" fill="#f9f6ff"/>
  </g>
  <text x="507" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#594575" font-weight="600">Etiketsiz havuz</text>

  <!-- Seçim -->
  <g filter="url(#shadow)">
    <rect x="403" y="193" width="119" height="57" rx="18" fill="#d8edf5"/>
    <path d="M423 223 C430 211 438 235 446 218 C453 202 461 232 470 213 C477 198 486 224 495 207" fill="none" stroke="#4e91ad" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="495" cy="207" r="5" fill="#f39375"/>
  </g>
  <text x="462" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386377" font-weight="600">Aday seçimi</text>

  <!-- Anotatör -->
  <g filter="url(#shadow)">
    <rect x="215" y="220" width="136" height="57" rx="18" fill="url(#human)"/>
    <circle cx="244" cy="240" r="9" fill="#fffaf4"/>
    <path d="M230 263 C231 251 257 251 258 263" fill="#fffaf4"/>
    <rect x="274" y="235" width="54" height="8" rx="4" fill="#fffaf4"/>
    <rect x="274" y="250" width="38" height="7" rx="3.5" fill="#fffaf4"/>
  </g>
  <text x="283" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#795438" font-weight="600">İnsan anotatör</text>

  <!-- Merkez karar -->
  <g filter="url(#soft)">
    <rect x="252" y="131" width="137" height="55" rx="20" fill="#ffffff"/>
    <circle cx="276" cy="158" r="13" fill="#ffe4b9"/>
    <path d="M270 153 Q276 146 282 153 M270 163 Q276 170 282 163" fill="none" stroke="#d28c42" stroke-width="1.8" stroke-linecap="round"/>
    <text x="326" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6171" font-weight="600">Belirsizlik</text>
    <text x="326" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6171">ve çeşitlilik</text>
  </g>

  <!-- Bütçe etiketi -->
  <g filter="url(#soft)">
    <rect x="82" y="190" width="96" height="31" rx="15.5" fill="#ffffff"/>
    <circle cx="101" cy="205.5" r="7" fill="#f5b56f"/>
    <text x="137" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c5941">k soru</text>
  </g>
</svg>