<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Lorenz Çekici: Deterministik Kaos</text>

  <!-- Left: Input / Initial conditions -->
  <rect x="30" y="60" width="130" height="70" rx="10" fill="#bbdefb" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Başlangıç A</text>
  <text x="95" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#283593">(1.0, 1.0, 1.0)</text>
  <text x="95" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#283593">δ₀ = 0</text>

  <rect x="30" y="150" width="130" height="70" rx="10" fill="#bbdefb" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Başlangıç B</text>
  <text x="95" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#283593">(1.0+1e-8, 1.0, 1.0)</text>
  <text x="95" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#283593">δ₀ = 10⁻⁸</text>

  <!-- Center: Lorenz system -->
  <rect x="220" y="90" width="180" height="110" rx="12" fill="#c8e6c9" filter="url(#shadow)" opacity="0.95"/>
  <text x="310" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Lorenz Sistemi</text>
  <text x="310" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">σ=10, ρ=28, β=8/3</text>
  <text x="310" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">dx/dt = σ(y−x)</text>
  <text x="310" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">dy/dt = x(ρ−z)−y</text>
  <text x="310" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">dz/dt = xy−βz</text>

  <!-- Right: Output / Divergence -->
  <rect x="470" y="60" width="140" height="70" rx="10" fill="#ffecb3" filter="url(#shadow)" opacity="0.9"/>
  <text x="540" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Yörünge A</text>
  <text x="540" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ef6c00">Kararlı başlangıç</text>
  <text x="540" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ef6c00">Çekici üzerinde</text>

  <rect x="470" y="150" width="140" height="70" rx="10" fill="#ffecb3" filter="url(#shadow)" opacity="0.9"/>
  <text x="540" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Yörünge B</text>
  <text x="540" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ef6c00">Ayrışan yol</text>
  <text x="540" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ef6c00">δ(t) ≈ δ₀e^{λt}</text>

  <!-- Arrows from inputs to system -->
  <polygon points="160,95 210,110 160,125" fill="#5c6bc0" opacity="0.8"/>
  <polygon points="160,185 210,170 160,155" fill="#5c6bc0" opacity="0.8"/>

  <!-- Arrows from system to outputs -->
  <polygon points="400,110 460,95 460,125" fill="#ff8f00" opacity="0.8"/>
  <polygon points="400,170 460,185 460,155" fill="#ff8f00" opacity="0.8"/>

  <!-- Bottom: Lyapunov divergence concept -->
  <rect x="150" y="240" width="340" height="55" rx="10" fill="#f3e5f5" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="320" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">Hassas Bağımlılık</text>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a1b9a">Küçük fark → Üstel büyüme → Öngörülemezlik</text>

  <!-- Decorative butterfly -->
  <g transform="translate(580, 270) scale(0.6)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#e91e63"/>
    <ellipse cx="12" cy="-5" rx="10" ry="7" fill="#ff9800"/>
    <ellipse cx="-12" cy="-5" rx="10" ry="7" fill="#ff9800"/>
    <ellipse cx="12" cy="5" rx="7" ry="5" fill="#2196f3"/>
    <ellipse cx="-12" cy="5" rx="7" ry="5" fill="#2196f3"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#333" stroke-width="1.5"/>
  </g>
</svg>