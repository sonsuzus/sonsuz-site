<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33466d"/>
      <stop offset="100%" stop-color="#1f2b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708c" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="55" cy="50" r="78" fill="#dceefa" opacity="0.48"/>
  <circle cx="605" cy="276" r="108" fill="#dcefd8" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31465e">Yıldız İzleyici ile Yönelim Bulma</text>

  <!-- Sky source -->
  <g filter="url(#shadow)">
    <rect x="27" y="66" width="128" height="171" rx="20" fill="url(#space)"/>
  </g>
  <text x="49" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#eef5ff">Gök görüntüsü</text>
  <circle cx="57" cy="125" r="3.2" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="107" cy="112" r="2.2" fill="#ffd984" filter="url(#softGlow)"/>
  <circle cx="132" cy="144" r="3.5" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="73" cy="175" r="2.3" fill="#bde7ff" filter="url(#softGlow)"/>
  <circle cx="113" cy="197" r="2.8" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="47" cy="207" r="1.6" fill="#ffcf8a"/>
  <path d="M57 125 L107 112 L132 144 Z" fill="none" stroke="#89d9ee" stroke-width="1.2" opacity="0.7"/>
  <path d="M57 125 L73 175 L113 197 L132 144" fill="none" stroke="#89d9ee" stroke-width="1.2" opacity="0.55"/>
  <rect x="42" y="252" width="99" height="25" rx="11" fill="#526887"/>
  <text x="60" y="269" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">Yıldız noktaları</text>

  <!-- arrow one -->
  <path d="M164 151 H184" fill="none" stroke="#718ca5" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="190,151 181,146 181,156" fill="#718ca5"/>

  <!-- Camera / preprocessing -->
  <g filter="url(#shadow)">
    <rect x="192" y="99" width="126" height="105" rx="18" fill="#fffdf9"/>
    <rect x="204" y="112" width="102" height="42" rx="10" fill="#dbeefa"/>
  </g>
  <circle cx="224" cy="133" r="10" fill="#8bc5df"/>
  <circle cx="224" cy="133" r="5" fill="#f7fcff"/>
  <path d="M241 123 H286 M241 133 H278 M241 143 H291" stroke="#78a1ba" stroke-width="2" stroke-linecap="round"/>
  <text x="212" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37536b">Ön işleme</text>
  <text x="211" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#688092">Filtre ve merkez</text>

  <!-- arrow two -->
  <path d="M327 151 H347" fill="none" stroke="#718ca5" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="353,151 344,146 344,156" fill="#718ca5"/>

  <!-- Matching -->
  <g filter="url(#shadow)">
    <rect x="355" y="70" width="137" height="162" rx="20" fill="#fffdf9"/>
  </g>
  <text x="375" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37536b">Üçgen eşleştirme</text>
  <path d="M376 145 L412 113 L448 151 Z" fill="#e4f1d7" stroke="#83af77" stroke-width="2"/>
  <circle cx="376" cy="145" r="4" fill="#5e9e8d"/>
  <circle cx="412" cy="113" r="4" fill="#5e9e8d"/>
  <circle cx="448" cy="151" r="4" fill="#5e9e8d"/>
  <path d="M375 177 H470" stroke="#d9e5d6" stroke-width="1"/>
  <rect x="375" y="188" width="97" height="27" rx="10" fill="#d8eee1"/>
  <text x="388" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d715f">Katalog tarama</text>

  <!-- Catalog floating -->
  <g filter="url(#shadow)">
    <rect x="367" y="244" width="113" height="42" rx="13" fill="#e8e2f5"/>
  </g>
  <path d="M382 258 h12 M382 265 h20 M382 272 h16" stroke="#806ba7" stroke-width="2" stroke-linecap="round"/>
  <text x="403" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#574573">Yıldız kataloğu</text>
  <path d="M423 239 V232" fill="none" stroke="#8c77a9" stroke-width="1.8"/>
  <polygon points="423,226 419,234 427,234" fill="#8c77a9"/>

  <!-- arrow three -->
  <path d="M501 151 H521" fill="none" stroke="#718ca5" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="527,151 518,146 518,156" fill="#718ca5"/>

  <!-- Orientation -->
  <g filter="url(#shadow)">
    <rect x="529" y="84" width="87" height="135" rx="20" fill="#fffdf9"/>
  </g>
  <text x="542" y="109" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37536b">Yönelim</text>
  <circle cx="572" cy="152" r="25" fill="#d9ebf8" stroke="#85b4d0" stroke-width="1.5"/>
  <path d="M572 152 L596 142" stroke="#e27869" stroke-width="3" stroke-linecap="round"/>
  <polygon points="600,140 592,139 595,147" fill="#e27869"/>
  <path d="M572 152 L556 129" stroke="#6eaa8c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="553,125 553,133 560,129" fill="#6eaa8c"/>
  <path d="M572 152 L570 177" stroke="#6d8dcc" stroke-width="3" stroke-linecap="round"/>
  <polygon points="570,181 566,173 574,173" fill="#6d8dcc"/>
  <text x="544" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#688092">Kuaterniyon</text>

  <!-- gyro correction path -->
  <g filter="url(#shadow)">
    <rect x="167" y="251" width="142" height="39" rx="14" fill="#fde7d9"/>
  </g>
  <circle cx="187" cy="270" r="10" fill="#f1ae81"/>
  <path d="M183 270 h8 M187 266 v8" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="204" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80553c">Jiroskop: hızlı hareket</text>
  <path d="M309 270 H546 V226" fill="none" stroke="#d39875" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"/>
  <polygon points="546,220 542,229 550,229" fill="#d39875"/>
  <text x="428" y="263" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a17054">Sürüklenme düzeltme</text>
</svg>