<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python Sözlükler</text>
  <line x1="180" y1="42" x2="460" y2="42" stroke="#3498db" stroke-width="2" opacity="0.5"/>

  <!-- Merkez sözlük kutusu -->
  <rect x="245" y="120" width="150" height="60" rx="14" fill="#e8f4fd" stroke="#3498db" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2980b9">Sözlük</text>
  <text x="320" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">tr2sp = {}</text>

  <!-- Anahtar kutusu -->
  <rect x="60" y="55" width="130" height="50" rx="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2" filter="url(#shadowLight)"/>
  <text x="125" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">Anahtar (Key)</text>
  <text x="125" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">Değişmez</text>

  <!-- Değer kutusu -->
  <rect x="450" y="55" width="130" height="50" rx="12" fill="#eafaf1" stroke="#27ae60" stroke-width="2" filter="url(#shadowLight)"/>
  <text x="515" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Değer (Value)</text>
  <text x="515" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">Herhangi tip</text>

  <!-- Ok: Anahtar -> Sözlük -->
  <path d="M190 80 L240 80 L240 135 L245 135" stroke="#f39c12" stroke-width="2" fill="none"/>
  <polygon points="245,135 235,130 235,140" fill="#f39c12"/>

  <!-- Ok: Sözlük -> Değer -->
  <path d="M395 135 L400 135 L400 80 L450 80" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="450,80 440,75 440,85" fill="#27ae60"/>

  <!-- Alt sol: Ekleme örneği -->
  <rect x="40" y="210" width="170" height="80" rx="12" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="125" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Anahtar-Değer Çifti</text>
  <text x="125" y="252" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#c0392b">tr2sp['bir'] = 'uno'</text>
  <text x="125" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#c0392b">tr2sp['iki'] = 'dos'</text>
  <text x="125" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">Süslü parantez ile gösterim</text>

  <!-- Alt sağ: Özellikler -->
  <rect x="430" y="210" width="170" height="80" rx="12" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="515" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Özellikler</text>
  <text x="515" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">• Eşleştirme tipi</text>
  <text x="515" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">• Sıra garantisi yok</text>
  <text x="515" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">• Karmaşık algoritma</text>

  <!-- Alt orta bağlantı çizgileri -->
  <path d="M320 180 L320 200 L125 200 L125 210" stroke="#bdc3c7" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M320 180 L320 200 L515 200 L515 210" stroke="#bdc3c7" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Üst bilgi notu -->
  <rect x="200" y="55" width="240" height="40" rx="10" fill="#f4f6f7" stroke="#95a5a6" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Ardışık tiplerden farklıdır</text>
  <text x="320" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">İndis yerine anahtar kullanılır</text>
</svg>