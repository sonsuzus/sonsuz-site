<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#d8f2e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#64829b" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64829b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="45" r="80" fill="#dceeff" opacity="0.42"/>
  <circle cx="584" cy="270" r="115" fill="#d9f2df" opacity="0.48"/>
  <path d="M35 93 C160 57 218 116 314 82 S493 57 615 105" fill="none" stroke="#b8d9dd" stroke-width="1.5" opacity="0.55"/>
  <path d="M28 263 C132 227 215 281 326 242 S500 231 612 266" fill="none" stroke="#c5dccc" stroke-width="1.5" opacity="0.65"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35536b">MAHREMİYET ODAKLI PDF PLATFORMU</text>

  <!-- client -->
  <g filter="url(#shadow)">
    <rect x="30" y="120" width="104" height="83" rx="17" fill="#fffdfb"/>
    <rect x="47" y="137" width="70" height="42" rx="6" fill="#e4f0ff" stroke="#8db6d5" stroke-width="1.5"/>
    <path d="M72 190 h20" stroke="#8db6d5" stroke-width="3" stroke-linecap="round"/>
    <path d="M82 179 v11" stroke="#8db6d5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="82" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31506a">Kullanıcı</text>
  <text x="82" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587083">Yükleme arayüzü</text>

  <!-- arrow 1 -->
  <path d="M142 161 H173" fill="none" stroke="#5f92ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="177,161 169,156 169,166" fill="#5f92ae"/>

  <!-- gateway -->
  <g filter="url(#shadow)">
    <rect x="181" y="114" width="112" height="95" rx="18" fill="#fffdfb"/>
    <rect x="204" y="131" width="66" height="40" rx="10" fill="#dceeff"/>
    <path d="M220 151 h34 M220 159 h23" stroke="#6397bb" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="255" cy="158" r="3" fill="#77bb94"/>
  </g>
  <text x="237" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31506a">Güvenli giriş</text>
  <text x="237" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587083">Tür ve süre kontrolü</text>

  <!-- arrow 2 -->
  <path d="M300 161 H328" fill="none" stroke="#5f92ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="332,161 324,156 324,166" fill="#5f92ae"/>

  <!-- queue core -->
  <g filter="url(#shadow)">
    <rect x="339" y="93" width="130" height="137" rx="24" fill="url(#core)" stroke="#9ac8c7" stroke-width="1.4"/>
    <circle cx="404" cy="132" r="25" fill="#ffffff" opacity="0.85"/>
    <path d="M391 127 h26 M391 134 h26 M391 141 h18" stroke="#5797a0" stroke-width="2.5" stroke-linecap="round"/>
    <text x="404" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#285b65">İş kuyruğu</text>
    <text x="404" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#48727a">Sıralama ve izolasyon</text>
    <rect x="365" y="204" width="78" height="12" rx="6" fill="#bce5d0"/>
    <circle cx="375" cy="210" r="3" fill="#5ba980"/>
    <text x="404" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#397058">Kaynak sınırı</text>
  </g>

  <!-- branches -->
  <path d="M470 137 H496 V81 H513" fill="none" stroke="#739bb4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="517,81 509,76 509,86" fill="#739bb4"/>
  <path d="M470 161 H513" fill="none" stroke="#739bb4" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="517,161 509,156 509,166" fill="#739bb4"/>
  <path d="M470 185 H496 V241 H513" fill="none" stroke="#739bb4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="517,241 509,236 509,246" fill="#739bb4"/>

  <!-- services -->
  <g filter="url(#smallShadow)">
    <rect x="520" y="50" width="93" height="61" rx="14" fill="#fff8e7"/>
    <circle cx="540" cy="78" r="12" fill="#ffe2a8"/>
    <path d="M535 78 h10 M540 73 v10" stroke="#af7d22" stroke-width="2" stroke-linecap="round"/>
    <text x="575" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#74511c">OCR</text>
    <text x="575" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#886b39">Türkçe metin</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="520" y="130" width="93" height="61" rx="14" fill="#eee8ff"/>
    <circle cx="540" cy="158" r="12" fill="#ddd0ff"/>
    <path d="M535 153 h10 M535 158 h10 M535 163 h7" stroke="#795fa8" stroke-width="2" stroke-linecap="round"/>
    <text x="575" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#55417d">PDF araçları</text>
    <text x="575" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705e91">qpdf ve dönüşüm</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="520" y="210" width="93" height="61" rx="14" fill="#e2f5ed"/>
    <circle cx="540" cy="238" r="12" fill="#c8eadb"/>
    <path d="M535 241 l5 5 8 -11" fill="none" stroke="#458b68" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="575" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#33684f">Geçici alan</text>
    <text x="575" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56806b">Süreli silme</text>
  </g>

  <!-- privacy badge -->
  <g filter="url(#smallShadow)">
    <rect x="59" y="262" width="206" height="35" rx="17" fill="#ffffff" opacity="0.94"/>
    <path d="M79 270 l10 -4 10 4 v8 c0 7 -5 11 -10 13 -5 -2 -10 -6 -10 -13z" fill="#ccebdc" stroke="#5c9d77" stroke-width="1.2"/>
    <path d="M84 278 l3 3 6 -7" fill="none" stroke="#478c67" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="169" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416c58">Dosya kontrolü sizde</text>
  </g>
</svg>