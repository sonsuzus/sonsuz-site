<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Center: STL -->
  <rect x="255" y="125" width="130" height="50" rx="14" fill="#5b7db1" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">STL</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e0e8f5">Şablon Kütüphanesi</text>

  <!-- Four main components around center -->
  <!-- Containers (top) -->
  <rect x="255" y="30" width="130" height="44" rx="10" fill="#a8c5da" filter="url(#shadowLight)"/>
  <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Konteynerler</text>
  <text x="320" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#3d5a73">Containers</text>

  <!-- Algorithms (right) -->
  <rect x="480" y="125" width="120" height="44" rx="10" fill="#c9d8b6" filter="url(#shadowLight)"/>
  <text x="540" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Algoritmalar</text>
  <text x="540" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#3d5a73">Algorithms</text>

  <!-- Iterators (bottom) -->
  <rect x="255" y="235" width="130" height="44" rx="10" fill="#e8c9a0" filter="url(#shadowLight)"/>
  <text x="320" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Tekrarlayıcılar</text>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#3d5a73">Iterators</text>

  <!-- Functions (left) -->
  <rect x="40" y="125" width="120" height="44" rx="10" fill="#d4b8c8" filter="url(#shadowLight)"/>
  <text x="100" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Fonksiyonlar</text>
  <text x="100" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#3d5a73">Functions</text>

  <!-- Connection lines with manual arrows -->
  <!-- Top to center -->
  <path d="M320 74 L320 120" stroke="#5b7db1" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="315,120 320,130 325,120" fill="#5b7db1" opacity="0.7"/>

  <!-- Right to center -->
  <path d="M480 147 L390 147" stroke="#5b7db1" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="390,142 380,147 390,152" fill="#5b7db1" opacity="0.7"/>

  <!-- Bottom to center -->
  <path d="M320 235 L320 180" stroke="#5b7db1" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="315,180 320,170 325,180" fill="#5b7db1" opacity="0.7"/>

  <!-- Left to center -->
  <path d="M160 147 L250 147" stroke="#5b7db1" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="250,142 260,147 250,152" fill="#5b7db1" opacity="0.7"/>

  <!-- Container types (small boxes) -->
  <!-- Sequence -->
  <rect x="30" y="20" width="110" height="30" rx="8" fill="#dce8f0" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="85" y="39" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">Sıralı</text>

  <!-- Associative -->
  <rect x="160" y="20" width="110" height="30" rx="8" fill="#dce8f0" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="215" y="39" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">İlişkisel</text>

  <!-- Unordered -->
  <rect x="290" y="20" width="110" height="30" rx="8" fill="#dce8f0" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="345" y="39" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">Sırasız İlişkisel</text>

  <!-- Container examples -->
  <rect x="420" y="20" width="110" height="30" rx="8" fill="#dce8f0" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="475" y="39" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">bitset vb.</text>

  <!-- Lines from container types to Containers box -->
  <path d="M85 50 L85 70 Q85 80 95 80 L250 80 Q260 80 260 90 L260 100" stroke="#a8c5da" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M215 50 L215 80 L260 80" stroke="#a8c5da" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M345 50 L345 80 L320 80" stroke="#a8c5da" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M475 50 L475 70 Q475 80 460 80 L380 80 Q370 80 370 90 L370 100" stroke="#a8c5da" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Bottom note -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7c8a" opacity="0.8">Hazır sınıf ve fonksiyon şablonları · Her tür veriye uygulanabilir</text>
</svg>