<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="ikizGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9e4df"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7892a3" flood-opacity="0.22"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7892a3" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="64" cy="278" r="80" fill="#dcefed" opacity="0.45"/>
  <circle cx="584" cy="38" r="95" fill="#dce9fa" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#395468">Siber-Fiziksel Anomali Akışı</text>
  <path d="M28 40 H612" stroke="#c9d9df" stroke-width="1"/>

  <!-- Sensor swarm -->
  <g filter="url(#golge)">
    <rect x="25" y="78" width="130" height="174" rx="18" fill="#ffffff"/>
  </g>
  <rect x="25" y="78" width="130" height="174" rx="18" fill="none" stroke="#c7dce2"/>
  <text x="90" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315267">Sensör Sürüsü</text>

  <g filter="url(#hafifGolge)">
    <rect x="41" y="120" width="98" height="30" rx="10" fill="#e8f5ed"/>
    <rect x="41" y="161" width="98" height="30" rx="10" fill="#eaf1ff"/>
    <rect x="41" y="202" width="98" height="30" rx="10" fill="#fff1df"/>
  </g>
  <circle cx="57" cy="135" r="6" fill="#62b983"/>
  <path d="M57 126 V144 M48 135 H66" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="72" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365a4a">Sıcaklık</text>

  <path d="M52 176 C55 169 59 183 63 176 C67 169 71 183 75 176" fill="none" stroke="#608ad0" stroke-width="2" stroke-linecap="round"/>
  <text x="84" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#36536f">Nem</text>

  <path d="M50 217 L55 211 L60 223 L66 209 L72 219 L78 214" fill="none" stroke="#d88a42" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705033">Titreşim</text>

  <!-- Flow sensor to twin -->
  <path d="M156 164 H191" fill="none" stroke="#7294a8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="198,164 189,159 189,169" fill="#7294a8"/>
  <text x="176" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647e8e">Akış</text>

  <!-- Digital twin -->
  <g filter="url(#golge)">
    <rect x="201" y="70" width="190" height="191" rx="24" fill="url(#ikizGrad)"/>
  </g>
  <rect x="201" y="70" width="190" height="191" rx="24" fill="none" stroke="#b8d3d8"/>
  <text x="296" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294e5e">Dijital İkiz</text>
  <text x="296" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58727d">Anlık durum modeli</text>

  <g filter="url(#hafifGolge)">
    <rect x="222" y="136" width="148" height="42" rx="12" fill="#ffffff" opacity="0.92"/>
    <rect x="222" y="190" width="148" height="49" rx="12" fill="#ffffff" opacity="0.92"/>
  </g>
  <text x="237" y="154" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6371">Geçmiş pencere</text>
  <path d="M238 166 H350" stroke="#a9c5cf" stroke-width="2" stroke-linecap="round"/>
  <circle cx="248" cy="166" r="3" fill="#6fb8ad"/>
  <circle cx="268" cy="166" r="3" fill="#6fb8ad"/>
  <circle cx="288" cy="166" r="3" fill="#6fb8ad"/>
  <circle cx="308" cy="166" r="3" fill="#6fb8ad"/>
  <circle cx="328" cy="166" r="3" fill="#6fb8ad"/>
  <circle cx="347" cy="166" r="3" fill="#6fb8ad"/>

  <text x="237" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6371">Sensör kimliği</text>
  <text x="237" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b7680">Her cihaz için ayrı profil</text>

  <!-- Flow twin to analyzer -->
  <path d="M392 164 H423" fill="none" stroke="#7294a8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="430,164 421,159 421,169" fill="#7294a8"/>

  <!-- Analysis -->
  <g filter="url(#golge)">
    <rect x="433" y="82" width="112" height="164" rx="18" fill="#ffffff"/>
  </g>
  <rect x="433" y="82" width="112" height="164" rx="18" fill="none" stroke="#d0dce5"/>
  <text x="489" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42596b">Anomali</text>
  <text x="489" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42596b">Denetimi</text>

  <rect x="449" y="140" width="80" height="29" rx="9" fill="#edf3ff"/>
  <text x="489" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6d9b">Z-skoru</text>

  <rect x="449" y="180" width="80" height="29" rx="9" fill="#fff3e6"/>
  <text x="489" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#946334">Eşik ve sıçrama</text>

  <path d="M489 170 V177" stroke="#8ba3b1" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="489,181 485,175 493,175" fill="#8ba3b1"/>

  <!-- Decision lines -->
  <path d="M546 152 H570 V111 H580" fill="none" stroke="#77a88a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="587,111 578,106 578,116" fill="#77a88a"/>
  <path d="M546 188 H570 V220 H580" fill="none" stroke="#da856f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="587,220 578,215 578,225" fill="#da856f"/>

  <!-- Output status -->
  <g filter="url(#hafifGolge)">
    <rect x="588" y="82" width="39" height="58" rx="14" fill="#e8f6ed"/>
    <rect x="588" y="191" width="39" height="58" rx="14" fill="#ffebe7"/>
  </g>
  <circle cx="607.5" cy="102" r="7" fill="#58b278"/>
  <path d="M603 102 L606 105 L613 98" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="607.5" y="127" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397151">Normal</text>

  <path d="M607.5 207 L617 224 L598 224 Z" fill="#e76f5e"/>
  <path d="M607.5 212 V218" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="607.5" cy="221" r="1.2" fill="#ffffff"/>
  <text x="607.5" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a94e42">Alarm</text>

  <!-- feedback loop -->
  <path d="M607 257 V280 H297 V269" fill="none" stroke="#91a7b5" stroke-width="1.7" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="297,262 292,271 302,271" fill="#91a7b5"/>
  <text x="458" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687f8c">Geri bildirim ve güvenli mod</text>
</svg>