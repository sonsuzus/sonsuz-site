<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="100%" stop-color="#b9d9f4"/>
    </linearGradient>
    <linearGradient id="backup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5f5d7"/>
      <stop offset="100%" stop-color="#cde8bd"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8492" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8492" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="321" cy="159" r="120" fill="#dceffd" opacity="0.34"/>
  <circle cx="321" cy="159" r="92" fill="none" stroke="#b8d6e5" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Bağlantılar -->
  <path d="M199 104 C226 111 235 121 254 133" fill="none" stroke="#8ab3c9" stroke-width="2"/>
  <polygon points="254,133 245,128 248,138" fill="#8ab3c9"/>
  <path d="M199 216 C222 208 238 196 254 185" fill="none" stroke="#8ab3c9" stroke-width="2"/>
  <polygon points="254,185 247,180 252,190" fill="#8ab3c9"/>
  <path d="M389 134 C411 120 425 110 446 105" fill="none" stroke="#8ab3c9" stroke-width="2"/>
  <polygon points="446,105 437,102 441,112" fill="#8ab3c9"/>
  <path d="M389 184 C412 197 426 207 446 215" fill="none" stroke="#78a88a" stroke-width="2"/>
  <polygon points="446,215 438,208 435,218" fill="#78a88a"/>

  <!-- Sol üst: veri -->
  <g filter="url(#smallShadow)">
    <rect x="42" y="62" width="157" height="84" rx="17" fill="#fffdf9"/>
    <rect x="42" y="62" width="157" height="84" rx="17" fill="none" stroke="#d7e5eb"/>
  </g>
  <rect x="61" y="80" width="33" height="33" rx="9" fill="#d5ebfa"/>
  <path d="M69 90 h17 M69 96 h17 M69 102 h11" stroke="#4e8db1" stroke-width="2" stroke-linecap="round"/>
  <text x="106" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365568" font-weight="600">Veri kontrolü</text>
  <text x="106" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8290">Mahremiyet</text>
  <circle cx="178" cy="83" r="5" fill="#80bd9c"/>

  <!-- Sol alt: operasyon -->
  <g filter="url(#smallShadow)">
    <rect x="42" y="174" width="157" height="84" rx="17" fill="#fffdf9"/>
    <rect x="42" y="174" width="157" height="84" rx="17" fill="none" stroke="#d7e5eb"/>
  </g>
  <rect x="61" y="192" width="33" height="33" rx="9" fill="#fde6c8"/>
  <path d="M71 211 l6 6 11-14" fill="none" stroke="#bd7c32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="106" y="201" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365568" font-weight="600">Operasyon yükü</text>
  <text x="106" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8290">İzleme ve güncelleme</text>
  <circle cx="178" cy="195" r="5" fill="#e5a45d"/>

