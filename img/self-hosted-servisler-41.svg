    <rect x="253" y="105" width="136" height="110" rx="23" fill="none" stroke="#98c3dc" stroke-width="1.2"/>
  </g>
  <rect x="278" y="125" width="86" height="14" rx="6" fill="#f7fcff" opacity="0.9"/>
  <circle cx="291" cy="132" r="3.5" fill="#61ad83"/>
  <path d="M303 132 h45" stroke="#7ca8c1" stroke-width="2" stroke-linecap="round"/>
  <rect x="278" y="147" width="86" height="14" rx="6" fill="#f7fcff" opacity="0.9"/>
  <circle cx="291" cy="154" r="3.5" fill="#61ad83"/>
  <path d="M303 154 h45" stroke="#7ca8c1" stroke-width="2" stroke-linecap="round"/>
  <text x="321" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#244d67" font-weight="700">Kendi Sunucun</text>
  <text x="321" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547589">Kontrol ve sorumluluk</text>

  <!-- Sağ üst güvenlik -->
  <g filter="url(#smallShadow)">
    <rect x="446" y="62" width="152" height="84" rx="17" fill="#fffdf9"/>
    <rect x="446" y="62" width="152" height="84" rx="17" fill="none" stroke="#d7e5eb"/>
  </g>
  <path d="M470 83 l14-6 14 6 v12 c0 11-7 18-14 21-7-3-14-10-14-21z" fill="#e2d8f5" stroke="#9279bf" stroke-width="1.3"/>
  <path d="M477 96 l5 5 9-11" fill="none" stroke="#7e63aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="510" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365568" font-weight="600">Güvenlik</text>
  <text x="510" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8290">Yama ve erişim</text>
  <circle cx="577" cy="83" r="5" fill="#a689cf"/>

  <!-- Sağ alt yedek -->
  <g filter="url(#shadow)">
    <rect x="446" y="174" width="152" height="84" rx="17" fill="url(#backup)"/>
    <rect x="446" y="174" width="152" height="84" rx="17" fill="none" stroke="#bbd9ac"/>
  </g>
  <text x="466" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#41674d" font-weight="700">Yedekleme</text>
  <text x="466" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65816c">3 kopya · 2 ortam · 1 uzak</text>
  <rect x="467" y="229" width="22" height="12" rx="3" fill="#8bbb7e"/>
  <rect x="495" y="229" width="22" height="12" rx="3" fill="#a8ce99"/>
  <rect x="548" y="226" width="25" height="16" rx="5" fill="#78aa92"/>
  <path d="M520 235 h21" stroke="#6d9d7d" stroke-width="1.8" stroke-dasharray="3 3"/>
  <path d="M541 235 l-5-4 v8z" fill="#6d9d7d"/>

  <!-- Alt karar şeridi -->
  <g filter="url(#smallShadow)">
    <rect x="180" y="276" width="280" height="27" rx="13.5" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="201" cy="289.5" r="5" fill="#6ba9c5"/>
  <text x="215" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486676">Özgürlük</text>
  <path d="M281 290 h33" stroke="#a3bbc6" stroke-width="1.5"/>
  <polygon points="314,290 308,286 308,294" fill="#a3bbc6"/>
  <circle cx="335" cy="289.5" r="5" fill="#db9a55"/>
  <text x="349" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486676">Bilinçli risk yönetimi</text>
</svg>