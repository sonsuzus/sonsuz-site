<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">C++ Akıllı İşaretçiler</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#5d6d7e">RAII ile Güvenli Bellek Yönetimi</text>

  <!-- Merkez: RAII Çekirdeği -->
  <rect x="245" y="120" width="150" height="52" rx="14" fill="#4a90d9" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="140" text-anchor="middle" font-weight="bold" fill="#ffffff" font-size="13">RAII</text>
  <text x="320" y="158" text-anchor="middle" fill="#eaf2f8" font-size="11">Kaynak Ömrü = Kapsam Ömrü</text>

  <!-- Üst: Problem -->
  <rect x="60" y="80" width="180" height="44" rx="10" fill="#e74c3c" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="150" y="98" text-anchor="middle" font-weight="bold" fill="#ffffff">Ham İşaretçi (T*)</text>
  <text x="150" y="114" text-anchor="middle" fill="#fadbd8" font-size="11">Sahiplik belirsiz</text>

  <!-- Alt: Çözümler -->
  <!-- unique_ptr -->
  <rect x="60" y="220" width="180" height="52" rx="10" fill="#27ae60" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="150" y="238" text-anchor="middle" font-weight="bold" fill="#ffffff">std::unique_ptr</text>
  <text x="150" y="254" text-anchor="middle" fill="#eafaf1" font-size="11">Tek sahip, taşınabilir</text>
  <text x="150" y="268" text-anchor="middle" fill="#d5f5e3" font-size="10">Varsayılan tercih</text>

  <!-- shared_ptr -->
  <rect x="270" y="220" width="180" height="52" rx="10" fill="#2980b9" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="360" y="238" text-anchor="middle" font-weight="bold" fill="#ffffff">std::shared_ptr</text>
  <text x="360" y="254" text-anchor="middle" fill="#eaf2f8" font-size="11">Ortak sahiplik</text>
  <text x="360" y="268" text-anchor="middle" fill="#d6eaf8" font-size="10">Referans sayacı</text>

  <!-- weak_ptr -->
  <rect x="480" y="220" width="140" height="52" rx="10" fill="#8e44ad" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="550" y="238" text-anchor="middle" font-weight="bold" fill="#ffffff">std::weak_ptr</text>
  <text x="550" y="254" text-anchor="middle" fill="#f4ecf7" font-size="11">Zayıf referans</text>
  <text x="550" y="268" text-anchor="middle" fill="#e8daef" font-size="10">Döngü kırma</text>

  <!-- Oklar: Problem -> RAII -->
  <path d="M 150 124 L 150 140 Q 150 150 160 150 L 240 150" stroke="#e74c3c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="240,145 250,150 240,155" fill="#e74c3c"/>

  <!-- Oklar: RAII -> Çözümler -->
  <path d="M 320 172 L 320 190 Q 320 200 310 200 L 245 200 L 245 215" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="240,215 245,225 250,215" fill="#27ae60"/>

  <path d="M 335 172 L 335 190 Q 335 200 345 200 L 360 200 L 360 215" stroke="#2980b9" stroke-width="2" fill="none"/>
  <polygon points="355,215 360,225 365,215" fill="#2980b9"/>

  <path d="M 370 172 L 370 190 Q 370 200 380 200 L 550 200 L 550 215" stroke="#8e44ad" stroke-width="2" fill="none"/>
  <polygon points="545,215 550,225 555,215" fill="#8e44ad"/>

  <!-- Sağ üst: Güvenlik notu -->
  <rect x="460" y="80" width="160" height="44" rx="10" fill="#f39c12" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="540" y="98" text-anchor="middle" font-weight="bold" fill="#ffffff">İstisna Güvenliği</text>
  <text x="540" y="114" text-anchor="middle" fill="#fef9e7" font-size="11">Otomatik temizlik</text>

  <!-- Ok: Güvenlik -> RAII -->
  <path d="M 460 102 L 400 102" stroke="#f39c12" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="400,97 390,102 400,107" fill="#f39c12"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-size="10" fill="#7f8c8d">make_unique • make_shared • Kontrol Bloğu • Döngüsel Sızıntı</text>
</svg>