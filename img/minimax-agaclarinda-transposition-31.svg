    <rect x="301" y="111" width="113" height="28" rx="9" fill="#ffffff" opacity="0.7"/>
    <text x="357.5" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#58437c">Transposition Table</text>
    <text x="306" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c6680">Anahtar: Zobrist</text>
    <text x="306" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c6680">Derinlik · Skor</text>
    <text x="306" y="196" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c6680">Bayrak · En iyi hamle</text>
  </g>

  <path d="M433 151 L471 151" stroke="#7895aa" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="477,151 467,145 467,157" fill="#7895aa"/>

  <g filter="url(#shadow)">
    <rect x="477" y="92" width="125" height="120" rx="20" fill="#d9f1eb" stroke="#a8d3c9"/>
    <text x="539.5" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#246653">Alpha-Beta</text>
    <rect x="495" y="133" width="89" height="24" rx="8" fill="#ffffff" opacity="0.72"/>
    <text x="539.5" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397463">Tablo kontrolü</text>
    <rect x="495" y="166" width="89" height="25" rx="8" fill="#bfe8d7"/>
    <text x="539.5" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#276651">Alt ağacı atla</text>
  </g>

  <path d="M539 212 L539 250" stroke="#7895aa" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="539,256 533,246 545,246" fill="#7895aa"/>

  <g filter="url(#smallShadow)">
    <rect x="454" y="257" width="170" height="38" rx="15" fill="#fff4d9"/>
    <circle cx="477" cy="276" r="10" fill="#f4c767"/>
    <path d="M473 276 L476 279 L482 272" stroke="#8b6521" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="548" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#79602e">Daha az hesaplama</text>
  </g>

  <path d="M282 151 C265 151 257 151 244 151" stroke="#b6c7d3" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
  <text x="260" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718696">eşleşme</text>
