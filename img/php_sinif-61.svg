<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="classGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#88c1d9"/>
    </linearGradient>
    <linearGradient id="propGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5e8c3"/>
      <stop offset="100%" stop-color="#8fd6a8"/>
    </linearGradient>
    <linearGradient id="methodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd3b6"/>
      <stop offset="100%" stop-color="#f5b78e"/>
    </linearGradient>
    <linearGradient id="objGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c5f9"/>
      <stop offset="100%" stop-color="#b9a5e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Sınıf kutusu (merkez) -->
  <rect x="220" y="60" width="200" height="200" rx="14" fill="url(#classGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1a3a4a">SINIF</text>
  <text x="320" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a4a5a">class personel</text>

  <!-- Özellikler bölümü -->
  <rect x="240" y="125" width="160" height="50" rx="8" fill="url(#propGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a2a">Özellikler</text>
  <text x="320" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a3a">$adi, $soyadi</text>

  <!-- Metodlar bölümü -->
  <rect x="240" y="190" width="160" height="50" rx="8" fill="url(#methodGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a3a1a">Metodlar</text>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a4a2a">fonksiyon_adı()</text>

  <!-- Sınıf ile özellikler arası çizgi -->
  <line x1="320" y1="120" x2="320" y2="125" stroke="#4a7a5a" stroke-width="1.5"/>

  <!-- Sınıf ile metodlar arası çizgi -->
  <line x1="320" y1="175" x2="320" y2="190" stroke="#7a5a3a" stroke-width="1.5"/>

  <!-- Nesne kutusu (sağ alt) -->
  <rect x="440" y="200" width="160" height="70" rx="12" fill="url(#objGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="520" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#3a2a5a">NESNE</text>
  <text x="520" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a3a6a">$personel = new</text>
  <text x="520" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a3a6a">personel();</text>

  <!-- Nesneye ok (manuel çizim) -->
  <line x1="420" y1="220" x2="440" y2="225" stroke="#5a4a8a" stroke-width="2"/>
  <polygon points="440,225 432,220 434,230" fill="#5a4a8a"/>

  <!-- Dış erişim etiketi (sol üst) -->
  <rect x="40" y="50" width="140" height="60" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="110" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a4a5a">Dış Erişim</text>
  <text x="110" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">public, private</text>

  <!-- Dış erişimden sınıfa ok -->
  <line x1="180" y1="80" x2="220" y2="100" stroke="#4a6a8a" stroke-width="2"/>
  <polygon points="220,100 210,96 214,106" fill="#4a6a8a"/>

  <!-- Sabitler etiketi (sol alt) -->
  <rect x="40" y="200" width="140" height="50" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="110" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a4a5a">Sabitler</text>
  <text x="110" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">const, define</text>

  <!-- Sabitlerden sınıfa ok -->
  <line x1="180" y1="225" x2="220" y2="180" stroke="#4a6a8a" stroke-width="2"/>
  <polygon points="220,180 210,182 216,172" fill="#4a6a8a"/>

  <!-- Başlık -->
  <text x="320" y="35" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2a4a5a">PHP Sınıf Yapısı ve Nesne Kullanımı</text>
</svg>