<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="golge" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="arka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#arka)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Döngülerle Problem Çözme</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="55" width="150" height="42" rx="10" fill="#6c9bd1" filter="url(#golge)"/>
  <text x="320" y="81" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Döngü Yapıları</text>

  <!-- Ok: Merkezden Asal Sayılar -->
  <path d="M 245 76 L 120 76" stroke="#4a7aa8" stroke-width="2" fill="none"/>
  <polygon points="120,76 132,71 132,81" fill="#4a7aa8"/>

  <rect x="20" y="55" width="100" height="42" rx="10" fill="#a8d8ea" filter="url(#golge)"/>
  <text x="70" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276">Asal Sayılar</text>
  <text x="70" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">Listeleme</text>

  <!-- Ok: Merkezden Asal Çarpanlar -->
  <path d="M 245 96 L 120 136" stroke="#4a7aa8" stroke-width="2" fill="none"/>
  <polygon points="120,136 132,129 129,141" fill="#4a7aa8"/>

  <rect x="20" y="120" width="100" height="42" rx="10" fill="#a8d8ea" filter="url(#golge)"/>
  <text x="70" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276">Asal Çarpanlar</text>
  <text x="70" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">Bölme</text>

  <!-- Ok: Merkezden Fibonacci -->
  <path d="M 395 76 L 520 76" stroke="#4a7aa8" stroke-width="2" fill="none"/>
  <polygon points="520,76 508,71 508,81" fill="#4a7aa8"/>

  <rect x="520" y="55" width="100" height="42" rx="10" fill="#a8d8ea" filter="url(#golge)"/>
  <text x="570" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276">Fibonacci</text>
  <text x="570" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">Dizisi</text>

  <!-- Ok: Merkezden Collatz -->
  <path d="M 395 96 L 520 136" stroke="#4a7aa8" stroke-width="2" fill="none"/>
  <polygon points="520,136 508,129 509,141" fill="#4a7aa8"/>

  <rect x="520" y="120" width="100" height="42" rx="10" fill="#a8d8ea" filter="url(#golge)"/>
  <text x="570" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276">Collatz</text>
  <text x="570" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">Dizisi</text>

  <!-- Alt grup: Seriler ve Tablolama -->
  <rect x="20" y="200" width="180" height="42" rx="10" fill="#d5f5e3" filter="url(#golge)"/>
  <text x="110" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e8449">Seriler ve Pi</text>
  <text x="110" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Leibniz Formülü</text>

  <rect x="230" y="200" width="180" height="42" rx="10" fill="#d5f5e3" filter="url(#golge)"/>
  <text x="320" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e8449">Fonksiyon</text>
  <text x="320" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Tablolama</text>

  <rect x="440" y="200" width="180" height="42" rx="10" fill="#d5f5e3" filter="url(#golge)"/>
  <text x="530" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e8449">İteratif Denklem</text>
  <text x="530" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Sistemleri</text>

  <!-- Alt bağlantı çizgileri -->
  <path d="M 110 162 L 110 200" stroke="#82b74d" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="110,200 106,190 114,190" fill="#82b74d"/>

  <path d="M 320 162 L 320 200" stroke="#82b74d" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="320,200 316,190 324,190" fill="#82b74d"/>

  <path d="M 530 162 L 530 200" stroke="#82b74d" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="530,200 526,190 534,190" fill="#82b74d"/>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">Problem çözme: döngüler, koşullar ve tekrarlı işlemler</text>
</svg>