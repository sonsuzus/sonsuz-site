<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d9ff"/>
      <stop offset="1" stop-color="#b8f0df"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c7"/>
      <stop offset="1" stop-color="#ffe3ab"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d9e8"/>
      <stop offset="1" stop-color="#edc5dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#66829a" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#66829a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="68" cy="38" r="92" fill="#dcecff" opacity="0.48"/>
  <circle cx="585" cy="283" r="110" fill="#dff4dd" opacity="0.52"/>

  <text x="32" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425d70">Zaman içinde açılmış RNN</text>
