  <rect x="25" y="78" width="590" height="160" rx="24" fill="#ffffff" opacity="0.68" filter="url(#shadow)"/>

  <path d="M171 139 C184 115 210 115 223 139" fill="none" stroke="#6c94a8" stroke-width="2.2"/>
