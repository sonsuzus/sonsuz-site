<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#eef5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f8ef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" rx="12" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Retro Tarayıcı Oyun Mimarisi</text>

  <!-- Oyun Döngüsü (merkez döngü) -->
  <ellipse cx="320" cy="165" rx="95" ry="42" fill="#e8f4f8" opacity="0.5" stroke="#b0d4e8" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Döngü okları -->
  <path d="M 400 143 Q 430 130 430 165 Q 430 200 400 187" fill="none" stroke="#5fa8c9" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowSm)"/>
  
  <defs>
    <marker id="arrowSm" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5fa8c9"/>
    </marker>
  </defs>

  <!-- 1. Girdi -->
  <rect x="60" y="75" width="90" height="40" rx="10" fill="#d4e6f1" filter="url(#shadow)"/>
  <text x="105" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Girdi</text>

  <!-- 2. Güncelle -->
  <rect x="270" y="75" width="100" height="40" rx="10" fill="#d5f0d5" filter="url(#shadow)"/>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Güncelle</text>

  <!-- 3. Çiz -->
  <rect x="480" y="75" width="90" height="40" rx="10" fill="#fce4d6" filter="url(#shadow)"/>
  <text x="525" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Çizim</text>

  <!-- Oklar-->
  <line x1="150" y1="95" x2="265" y2="95" stroke="#8aa4b5" stroke-width="1.5" marker-end="url(#arrowSm)"/>
  <line x1="370" y1="95" x2="475" y2="95" stroke="#8aa4b5" stroke-width="1.5" marker-end="url(#arrowSm)"/>

  <!-- requestAnimationFrame -->
  <rect x="265" y="35" width="110" height="25" rx="8" fill="#e8e0f0" filter="url(#softShadow)"/>
  <text x="320" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b4b7a">requestAnimationFrame</text>
  <line x1="320" y1="60" x2="320" y2="73" stroke="#8a7baa" stroke-width="1" marker-end="url(#arrowSm)"/>

  <!-- Canvas Sahnesi büyük kutu -->
  <rect x="100" y="140" width="440" height="75" rx="14" fill="#ffffff" opacity="0.7" filter="url(#softShadow)" stroke="#c0d0e0" stroke-width="0.8"/>

  <!-- Canvas alanı -->
  <rect x="120" y="155" width="120" height="45" rx="5" fill="#f0f4fa" stroke="#b8cce0" stroke-width="0.8"/>
  <text x="180" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Canvas</text>
  <text x="180" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a9a">Sahne</text>

  <!-- Yönetmen JS -->
  <rect x="260" y="155" width="120" height="45" rx="5" fill="#eef8f0" stroke="#a0c8b0" stroke-width="0.8"/>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">JavaScript</text>
  <text x="320" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a7a5a">Yönetmen</text>

  <!-- Oyun Döngüsü -->
  <rect x="400" y="155" width="120" height="45" rx="5" fill="#faf4e8" stroke="#d0b890" stroke-width="0.8"/>
  <text x="460" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Oyun Döngüsü</text>
  <text x="460" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a7040">dt zamanlı</text>

  <!-- Oklar canvas bileşenleri -->
  <line x1="240" y1="177" x2="255" y2="177" stroke="#8aa4b5" stroke-width="1.2" marker-end="url(#arrowSm)"/>
  <line x1="380" y1="177" x2="395" y2="177" stroke="#8aa4b5" stroke-width="1.2" marker-end="url(#arrowSm)"/>

  <!-- Alttaki öğeler -->
  <!-- Çarpışma -->
  <rect x="60" y="245" width="110" height="40" rx="10" fill="#f0e0f0" filter="url(#shadow)"/>
  <text x="115" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Çarpışma Testi</text>
  <text x="115" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#6a4a6a">Fizik Kuralları</text>

  <!-- Durum -->
  <rect x="265" y="245" width="110" height="40" rx="10" fill="#e0e8f0" filter="url(#shadow)"/>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Durum Yönetimi</text>
  <text x="320" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a5a6a">Skor &amp; Seviye</text>

  <!-- Skor -->
  <rect x="470" y="245" width="110" height="40" rx="10" fill="#e8f0e0" filter="url(#shadow)"/>
  <text x="525" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Skor &amp; UI</text>
  <text x="525" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a6a4a">Kullanıcı Arayüzü</text>

  <!-- Alt bileşenler arası oklar -->
  <line x1="170" y1="265" x2="260" y2="265" stroke="#8aa4b5" stroke-width="1.2" marker-end="url(#arrowSm)"/>
  <line x1="375" y1="265" x2="465" y2="265" stroke="#8aa4b5" stroke-width="1.2" marker-end="url(#arrowSm)"/>

  <!-- Merkez döngüden alt bileşenlere bağlantılar -->
  <line x1="240" y1="215" x2="180" y2="243" stroke="#7a9ab0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="340" y1="215" x2="330" y2="243" stroke="#7a9ab0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="440" y1="215" x2="490" y2="243" stroke="#7a9ab0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Klavye etiketi -->
  <rect x="40" y="55" width="30" height="18" rx="4" fill="#d8d8e8" opacity="0.6"/>
  <text x="55" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#555">Klavye</text>

  <!-- Hareket formülü -->
  <rect x="370" y="130" width="130" height="20" rx="5" fill="#f8f8e8" opacity="0.8" filter="url(#softShadow)"/>
  <text x="435" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#666" font-style="italic">x = x + vx * dt</text>
</svg>