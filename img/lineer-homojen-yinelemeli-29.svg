<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="fib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c9"/>
      <stop offset="100%" stop-color="#ffe2b6"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#cce2fb"/>
    </linearGradient>
    <linearGradient id="roots" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6dbff"/>
      <stop offset="100%" stop-color="#d9ccf5"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e5"/>
      <stop offset="100%" stop-color="#c4ead8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6f8494" flood-opacity="0.19"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6f8494" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="580" cy="38" r="76" fill="#d8f0ed" opacity="0.45"/>
  <circle cx="60" cy="292" r="86" fill="#e0eafd" opacity="0.55"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40576b">YİNELEMELİ İLİŞKİDEN KAPALI FORMA</text>

  <path d="M152 157 H181" stroke="#7a9ab0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="181,151 193,157 181,163" fill="#7a9ab0"/>
  <path d="M304 157 H330" stroke="#7a9ab0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="330,151 342,157 330,163" fill="#7a9ab0"/>
  <path d="M457 157 H482" stroke="#7a9ab0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="482,151 494,157 482,163" fill="#7a9ab0"/>

  <g filter="url(#shadow)">
    <rect x="26" y="108" width="126" height="98" rx="18" fill="url(#fib)"/>
  </g>
  <circle cx="53" cy="135" r="16" fill="#f5bd5f"/>
  <path d="M46 135 H60 M53 128 V142" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="72" y="133" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#674d25">Fibonacci</text>
  <text x="89" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f5936">Fₙ = Fₙ₋₁ + Fₙ₋₂</text>
  <rect x="46" y="170" width="87" height="21" rx="10.5" fill="#fff8e5"/>
  <text x="89" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7d6540">F₀ = 0 · F₁ = 1</text>

  <g filter="url(#shadow)">
    <rect x="193" y="104" width="111" height="106" rx="18" fill="url(#eq)"/>
  </g>
  <circle cx="248.5" cy="130" r="20" fill="#84afe0"/>
  <path d="M239 130 H258 M248.5 120.5 V139.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="248.5" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b80">Karakteristik</text>
  <text x="248.5" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456988">r² − r − 1 = 0</text>

  <g filter="url(#shadow)">
    <rect x="342" y="86" width="115" height="142" rx="18" fill="url(#roots)"/>
  </g>
  <text x="399.5" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#554275">Kökler</text>
  <rect x="359" y="126" width="81" height="31" rx="11" fill="#f6f0ff"/>
  <text x="399.5" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f4a84">φ = 1,618...</text>
  <path d="M400 159 V169" stroke="#9b88bb" stroke-width="1.8"/>
  <polygon points="395,168 400,174 405,168" fill="#9b88bb"/>
  <rect x="359" y="176" width="81" height="31" rx="11" fill="#f6f0ff"/>
  <text x="399.5" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f4a84">ψ = −0,618...</text>

  <g filter="url(#shadow)">
    <rect x="494" y="104" width="120" height="106" rx="18" fill="url(#result)"/>
  </g>
  <circle cx="523" cy="133" r="16" fill="#64b98a"/>
  <path d="M516 133 L521 138 L531 127" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="558" y="133" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#2c6648">Binet Formülü</text>
  <text x="554" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397153">Fₙ = (φⁿ − ψⁿ) / √5</text>
  <rect x="512" y="173" width="84" height="21" rx="10.5" fill="#effbf3"/>
  <text x="554" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f7859">doğrudan n</text>

  <path d="M89 80 C137 55 197 56 242 79" fill="none" stroke="#b8cad7" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="165" y="67" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708799">önceki terimler</text>

  <g filter="url(#soft)">
    <rect x="180" y="255" width="280" height="38" rx="15" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="203" cy="274" r="10" fill="#9bc8ba"/>
  <path d="M198 274 H208" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="222" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42625b">Yineleme yerine köklerin üstel davranışı kullanılır</text>

  <path d="M554 212 V239" stroke="#8cb9a2" stroke-width="1.8" stroke-dasharray="3 4"/>
  <polygon points="549,238 554,244 559,238" fill="#8cb9a2"/>
  <text x="554" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#608373">büyük n için hızlı erişim</text>
</svg>