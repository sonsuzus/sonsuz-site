<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="actorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#c7dff5"/>
    </linearGradient>
    <linearGradient id="elixirGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e6fb"/>
      <stop offset="100%" stop-color="#ead5f4"/>
    </linearGradient>
    <linearGradient id="akkaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f4f1"/>
      <stop offset="100%" stop-color="#c8e9e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#55718a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#55718a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="157" r="112" fill="#ddecf5" opacity="0.37"/>
  <circle cx="320" cy="157" r="88" fill="#ffffff" opacity="0.28"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476278" font-weight="600">MESAJLARLA EŞZAMANLILIK</text>
  <line x1="28" y1="39" x2="612" y2="39" stroke="#c9dce4" stroke-width="1"/>

  <!-- Elixir platform -->
  <rect x="34" y="86" width="146" height="126" rx="18" fill="url(#elixirGrad)" filter="url(#shadow)"/>
  <circle cx="58" cy="111" r="13" fill="#9c66b4"/>
  <path d="M53 105 C57 101 62 102 64 106 C66 110 62 116 58 117 C54 116 50 110 53 105Z" fill="#ffffff" opacity="0.9"/>
  <text x="80" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#573a69" font-weight="700">Elixir</text>
  <text x="80" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765687">BEAM ve OTP</text>
  <rect x="49" y="142" width="116" height="27" rx="9" fill="#ffffff" opacity="0.78"/>
  <text x="107" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#634771">GenServer</text>
  <rect x="49" y="177" width="116" height="21" rx="8" fill="#dcbde8"/>
  <text x="107" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#593d68">Hafif süreçler</text>

  <!-- Akka platform -->
  <rect x="460" y="86" width="146" height="126" rx="18" fill="url(#akkaGrad)" filter="url(#shadow)"/>
  <circle cx="484" cy="111" r="13" fill="#3d9d99"/>
  <path d="M478 113 L484 103 L490 113 L484 118Z" fill="#ffffff" opacity="0.92"/>
  <text x="506" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#276d6b" font-weight="700">Akka Typed</text>
  <text x="506" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47817d">JVM ve Scala</text>
  <rect x="475" y="142" width="116" height="27" rx="9" fill="#ffffff" opacity="0.78"/>
  <text x="533" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#276d6b">Actor Behavior</text>
  <rect x="475" y="177" width="116" height="21" rx="8" fill="#b5e1da"/>
  <text x="533" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#276d6b">Tip güvenliği</text>

  <!-- Connection lines -->
  <path d="M180 149 C203 149 210 149 228 149" fill="none" stroke="#9a76aa" stroke-width="2"/>
  <polygon points="228,149 219,144 219,154" fill="#9a76aa"/>
  <path d="M460 149 C437 149 430 149 412 149" fill="none" stroke="#4faaa2" stroke-width="2"/>
  <polygon points="412,149 421,144 421,154" fill="#4faaa2"/>

  <!-- Central actor -->
  <rect x="228" y="88" width="184" height="144" rx="22" fill="url(#actorGrad)" filter="url(#shadow)"/>
  <text x="320" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#285775" font-weight="700">AKTÖR</text>
  <line x1="251" y1="122" x2="389" y2="122" stroke="#a2c4dc" stroke-width="1"/>

  <rect x="246" y="135" width="148" height="25" rx="8" fill="#ffffff" opacity="0.84" filter="url(#smallShadow)"/>
  <path d="M258 147 h13 M258 151 h13 M258 155 h9" stroke="#5f94b7" stroke-width="1.5" stroke-linecap="round"/>
  <text x="281" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355e78">Mesaj kutusu</text>

  <rect x="246" y="168" width="70" height="45" rx="10" fill="#eaf5ff" filter="url(#smallShadow)"/>
  <circle cx="263" cy="184" r="7" fill="#75a9c9"/>
  <text x="281" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355e78">Özel</text>
  <text x="281" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355e78">durum</text>

  <rect x="324" y="168" width="70" height="45" rx="10" fill="#eaf5ff" filter="url(#smallShadow)"/>
  <path d="M340 184 C344 178 351 178 354 184 C357 190 350 196 347 198 C344 196 337 190 340 184Z" fill="#75a9c9"/>
  <text x="359" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355e78">Davranış</text>

  <!-- Supervisor -->
  <rect x="249" y="258" width="142" height="39" rx="14" fill="#fff0d8" filter="url(#shadow)"/>
  <circle cx="272" cy="277" r="10" fill="#e1a044"/>
  <path d="M268 277 l3 3 l6 -7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="327" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#795527" font-weight="700">Gözetim ve toparlanma</text>
  <path d="M320 232 L320 250" fill="none" stroke="#c18b3d" stroke-width="2"/>
  <polygon points="320,258 315,249 325,249" fill="#c18b3d"/>

  <!-- incoming messages -->
  <rect x="58" y="244" width="102" height="32" rx="12" fill="#ffffff" opacity="0.92" filter="url(#smallShadow)"/>
  <text x="109" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547086">Gönderen aktör</text>
  <path d="M160 260 C193 260 198 218 246 206" fill="none" stroke="#7b9ab1" stroke-width="2"/>
  <polygon points="246,206 237,204 241,213" fill="#7b9ab1"/>
  <text x="184" y="246" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668397">mesaj</text>

  <rect x="481" y="244" width="102" height="32" rx="12" fill="#ffffff" opacity="0.92" filter="url(#smallShadow)"/>
  <text x="532" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547086">Diğer aktör</text>
  <path d="M394 207 C440 218 445 260 481 260" fill="none" stroke="#7b9ab1" stroke-width="2"/>
  <polygon points="481,260 472,255 472,265" fill="#7b9ab1"/>

  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8190">Sıralı işleme • Paylaşımsız durum • Çok aktör, az iş parçacığı</text>
</svg>