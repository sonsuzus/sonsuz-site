<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="queueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2cc"/>
      <stop offset="100%" stop-color="#ffe3a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6c8495" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#536d7d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="45" r="72" fill="#dceeff" opacity="0.48"/>
  <circle cx="585" cy="274" r="92" fill="#dff2dc" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">Kahn Algoritması · Topolojik Sıralama</text>

  <!-- Sol panel: Bağımlılık ağı -->
  <rect x="20" y="48" width="205" height="235" rx="18" fill="#ffffff" opacity="0.85" filter="url(#shadow)"/>
  <text x="38" y="75" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#496477">Bağımlılık Ağı</text>
  <text x="38" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909f">yönlü döngüsüz çizge</text>

  <!-- edges -->
  <path d="M83 138 L116 166" fill="none" stroke="#88a2b2" stroke-width="2.2"/>
  <polygon points="116,166 108,163 111,171" fill="#88a2b2"/>
  <path d="M83 217 L116 180" fill="none" stroke="#88a2b2" stroke-width="2.2"/>
  <polygon points="116,180 108,183 112,189" fill="#88a2b2"/>
  <path d="M154 173 L181 173" fill="none" stroke="#88a2b2" stroke-width="2.2"/>
  <polygon points="181,173 173,169 173,177" fill="#88a2b2"/>

  <!-- nodes -->
  <rect x="38" y="116" width="65" height="34" rx="11" fill="#dceeff" filter="url(#smallShadow)"/>
  <text x="70.5" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#365a77">Program.</text>

  <rect x="38" y="200" width="65" height="34" rx="11" fill="#dff2dc" filter="url(#smallShadow)"/>
  <text x="70.5" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#416b50">Matematik</text>

  <rect x="112" y="156" width="76" height="34" rx="11" fill="#eadfff" filter="url(#smallShadow)"/>
  <text x="150" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5c4b83">Algoritma</text>

  <rect x="177" y="156" width="35" height="34" rx="11" fill="#ffdfe3" filter="url(#smallShadow)"/>
  <text x="194.5" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#8a4a57">YZ</text>

  <text x="39" y="263" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65808f">Giriş derecesi = ön koşul</text>

  <!-- Arrow left to queue -->
  <path d="M234 164 L270 164" fill="none" stroke="#5d93a8" stroke-width="2.5"/>
  <polygon points="270,164 261,159 261,169" fill="#5d93a8"/>
  <text x="249" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587483">derece 0</text>

  <!-- Middle Queue -->
  <rect x="279" y="102" width="116" height="124" rx="18" fill="url(#queueGrad)" filter="url(#shadow)"/>
  <text x="337" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765c24">Hazır Kuyruk</text>
  <rect x="294" y="145" width="86" height="23" rx="8" fill="#ffffff" opacity="0.78"/>
  <text x="337" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#635535">Program.</text>
  <rect x="294" y="174" width="86" height="23" rx="8" fill="#ffffff" opacity="0.78"/>
  <text x="337" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#635535">Matematik</text>
  <path d="M337 229 L337 248" fill="none" stroke="#c69e41" stroke-width="2.3"/>
  <polygon points="337,248 332,240 342,240" fill="#c69e41"/>
  <text x="337" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806a38">çıkar · azalt · ekle</text>

  <!-- arrow queue to result -->
  <path d="M403 164 L434 164" fill="none" stroke="#5d93a8" stroke-width="2.5"/>
  <polygon points="434,164 425,159 425,169" fill="#5d93a8"/>

  <!-- Right output -->
  <rect x="443" y="48" width="178" height="235" rx="18" fill="#ffffff" opacity="0.85" filter="url(#shadow)"/>
  <text x="462" y="75" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#496477">Geçerli Sıra</text>
  <text x="462" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909f">işlenen düğümler</text>

  <!-- sequence -->
  <rect x="461" y="112" width="48" height="31" rx="10" fill="#dceeff" filter="url(#smallShadow)"/>
  <text x="485" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#365a77">Prog.</text>
  <path d="M512 127 L522 127" stroke="#8ba4b3" stroke-width="2"/>
  <polygon points="522,127 516,123 516,131" fill="#8ba4b3"/>

  <rect x="525" y="112" width="47" height="31" rx="10" fill="#dff2dc" filter="url(#smallShadow)"/>
  <text x="548.5" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#416b50">Mat.</text>
  <path d="M575 127 L585 127" stroke="#8ba4b3" stroke-width="2"/>
  <polygon points="585,127 579,123 579,131" fill="#8ba4b3"/>

  <rect x="461" y="153" width="70" height="31" rx="10" fill="#eadfff" filter="url(#smallShadow)"/>
  <text x="496" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5c4b83">Algoritma</text>
  <path d="M534 168 L544 168" stroke="#8ba4b3" stroke-width="2"/>
  <polygon points="544,168 538,164 538,172" fill="#8ba4b3"/>
  <rect x="547" y="153" width="48" height="31" rx="10" fill="#ffdfe3" filter="url(#smallShadow)"/>
  <text x="571" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#8a4a57">YZ</text>

  <rect x="461" y="210" width="142" height="48" rx="13" fill="#e7f5e5"/>
  <circle cx="480" cy="234" r="10" fill="#71ac73"/>
  <path d="M475 234 L479 238 L486 229" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="498" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#447346">Kontrol</text>
  <text x="498" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7f63">Tüm düğümler işlendi</text>
</svg>