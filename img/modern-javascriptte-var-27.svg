<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="varDolgu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5c2"/>
      <stop offset="100%" stop-color="#ffd2a1"/>
    </linearGradient>
    <linearGradient id="letDolgu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#bee0fb"/>
    </linearGradient>
    <linearGradient id="constDolgu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcf5e4"/>
      <stop offset="100%" stop-color="#b9e8cb"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#59718a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#59718a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="68" cy="41" r="72" fill="#ddecfa" opacity="0.48"/>
  <circle cx="600" cy="280" r="95" fill="#dff2dc" opacity="0.52"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#344b61">JavaScript Kapsam Modeli</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#688095">Görünmeyen sınırlar ve erişim davranışı</text>

  <!-- Sol: iç içe kapsam -->
  <g filter="url(#golge)">
    <rect x="31" y="71" width="270" height="210" rx="20" fill="#e8f1fa" stroke="#c7d9e9"/>
    <rect x="49" y="96" width="234" height="161" rx="16" fill="#f8fbff" stroke="#afcbe3" stroke-width="1.5"/>
    <rect x="69" y="125" width="194" height="109" rx="13" fill="#edf8f1" stroke="#a7d8ba" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>

  <rect x="47" y="81" width="92" height="23" rx="11" fill="#d3e6f7"/>
  <text x="61" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b77">Fonksiyon</text>

  <rect x="67" y="111" width="61" height="23" rx="11" fill="#d5efdf"/>
  <text x="81" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#327151">Blok</text>

  <g filter="url(#hafifGolge)">
    <rect x="84" y="148" width="165" height="25" rx="9" fill="url(#varDolgu)"/>
    <rect x="84" y="181" width="165" height="25" rx="9" fill="url(#letDolgu)"/>
    <rect x="84" y="214" width="165" height="25" rx="9" fill="url(#constDolgu)"/>
  </g>
  <text x="96" y="165" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#835524">var</text>
  <text x="135" y="165" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d43">fonksiyona taşar</text>
  <text x="96" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36709b">let</text>
  <text x="135" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486e87">blokta kalır</text>
  <text x="96" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31734c">const</text>
  <text x="143" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7960">blokta kalır</text>

  <!-- var dışarı hareketi -->
  <path d="M249 160 C270 160 272 113 256 113" fill="none" stroke="#d49343" stroke-width="2"/>
  <polygon points="252,119 256,108 262,118" fill="#d49343"/>
  <text x="195" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b06d22">erişir</text>

  <!-- Ayırıcı -->
  <path d="M322 73 L322 275" stroke="#c8d7de" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Sağ: seçim kartları -->
  <text x="350" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#344b61">Modern tercih</text>

  <g filter="url(#golge)">
    <rect x="350" y="96" width="252" height="53" rx="15" fill="url(#constDolgu)"/>
    <rect x="350" y="162" width="252" height="53" rx="15" fill="url(#letDolgu)"/>
    <rect x="350" y="228" width="252" height="53" rx="15" fill="url(#varDolgu)"/>
  </g>

  <circle cx="377" cy="122" r="15" fill="#ffffff" opacity="0.75"/>
  <path d="M370 122 L375 127 L385 116" fill="none" stroke="#3d9962" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="402" y="118" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286342">const</text>
  <text x="402" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#497962">Varsayılan · yeniden atama yok</text>

  <circle cx="377" cy="188" r="15" fill="#ffffff" opacity="0.75"/>
  <path d="M370 188 L375 193 L385 182" fill="none" stroke="#418dbd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="402" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286c99">let</text>
  <text x="402" y="201" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a748e">Değişecek değerler için</text>

  <circle cx="377" cy="254" r="15" fill="#ffffff" opacity="0.75"/>
  <path d="M370 247 L384 261 M384 247 L370 261" stroke="#c6782c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="402" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#93551e">var</text>
  <text x="402" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#876543">Eski kod ve geniş kapsam</text>

  <!-- Hoisting rozeti -->
  <g filter="url(#hafifGolge)">
    <rect x="465" y="48" width="137" height="31" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="481" cy="63" r="7" fill="#9276c9"/>
  <text x="494" y="67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e5279">TDZ: let ve const</text>
</svg>