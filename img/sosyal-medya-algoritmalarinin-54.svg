<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7fb8d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8b195"/>
      <stop offset="100%" stop-color="#e88a6a"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5cae9"/>
      <stop offset="100%" stop-color="#9fa8da"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2dfdb"/>
      <stop offset="100%" stop-color="#80cbc4"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1"/>
      <stop offset="100%" stop-color="#e57399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#37474f">Sosyal Medya Oyun Teorisi</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c">Dikkat Ekonomisi ve Teşvik Yapıları</text>

  <!-- Merkez platform kutusu -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#grad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">PLATFORM</text>
  <text x="320" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#283593">Etkileşim ve Gelir</text>

  <!-- Oyuncular: Kullanıcı -->
  <rect x="40" y="60" width="130" height="45" rx="10" fill="url(#grad2)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="105" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4e342e">KULLANICI</text>
  <text x="105" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5d4037">Bilgi, Eğlence</text>

  <!-- Oyuncular: Üretici -->
  <rect x="40" y="215" width="130" height="45" rx="10" fill="url(#grad3)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="105" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">ÜRETİCİ</text>
  <text x="105" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#283593">Görünürlük, Gelir</text>

  <!-- Oyuncular: Reklamveren -->
  <rect x="470" y="60" width="130" height="45" rx="10" fill="url(#grad4)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="535" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#004d40">REKLAMVEREN</text>
  <text x="535" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#00695c">Dönüşüm</text>

  <!-- Oyuncular: Algoritma -->
  <rect x="470" y="215" width="130" height="45" rx="10" fill="url(#grad5)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="535" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">ALGORİTMA</text>
  <text x="535" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ef6c00">Sıralama ve Ödül</text>

  <!-- Ok: Kullanıcı -> Platform (manuel ok) -->
  <path d="M 170 82 L 235 130" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="235,130 226,124 228,134" fill="#78909c"/>

  <!-- Ok: Platform -> Kullanıcı -->
  <path d="M 260 125 L 180 95" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="180,95 189,99 187,90" fill="#78909c"/>

  <!-- Ok: Üretici -> Platform -->
  <path d="M 170 237 L 235 175" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="235,175 226,179 230,170" fill="#78909c"/>

  <!-- Ok: Platform -> Üretici -->
  <path d="M 280 170 L 190 235" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="190,235 199,231 195,240" fill="#78909c"/>

  <!-- Ok: Reklamveren -> Platform -->
  <path d="M 470 82 L 405 130" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="405,130 412,124 410,134" fill="#78909c"/>

  <!-- Ok: Platform -> Reklamveren -->
  <path d="M 380 125 L 460 95" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="460,95 451,99 453,90" fill="#78909c"/>

  <!-- Ok: Algoritma -> Platform -->
  <path d="M 470 237 L 405 175" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="405,175 412,179 410,170" fill="#78909c"/>

  <!-- Ok: Platform -> Algoritma -->
  <path d="M 360 170 L 450 235" stroke="#78909c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="450,235 441,231 445,240" fill="#78909c"/>

  <!-- Mahkumlar İkilemi etiketi -->
  <rect x="40" y="275" width="180" height="30" rx="8" fill="#fff3e0" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="130" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">Mahkumlar İkilemi: 4,4</text>

  <!-- Nash dengesi etiketi -->
  <rect x="420" y="275" width="180" height="30" rx="8" fill="#e8f5e9" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="510" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">Nash Dengesi</text>

  <!-- Ödül fonksiyonu kutusu -->
  <rect x="245" y="55" width="150" height="35" rx="8" fill="#e3f2fd" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1565c0">Uk = B - αT - βS</text>
  <text x="320" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1565c0">Up = rE - cM</text>

  <!-- Öfke sinyali etiketi -->
  <rect x="245" y="230" width="150" height="30" rx="8" fill="#fce4ec" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c62828">Öfke: Yorum ve Paylaşım</text>

  <!-- Bağlantı çizgileri: ödül fonksiyonu -->
  <line x1="320" y1="90" x2="320" y2="120" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Bağlantı çizgisi: öfke etiketi -->
  <line x1="320" y1="230" x2="320" y2="170" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Döngü oku: platform kazanır -->
  <path d="M 395 145 C 430 145, 430 200, 395 200" stroke="#ff8a65" stroke-width="2" fill="none"/>
  <polygon points="395,200 403,196 401,205" fill="#ff8a65"/>
  <text x="420" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#d84315">Kazanır</text>

</svg>