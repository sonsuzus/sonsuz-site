<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="hostGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4efff"/>
      <stop offset="100%" stop-color="#d5e5fa"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5f8ed"/>
      <stop offset="100%" stop-color="#ccebd8"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1d8"/>
      <stop offset="100%" stop-color="#f9dfb9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c8394" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7892a0" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M0 269 C105 230 149 310 263 275 S457 227 640 276 L640 320 L0 320Z" fill="#dbeee7" opacity="0.48"/>
  <circle cx="77" cy="42" r="46" fill="#dcecff" opacity="0.56"/>
  <circle cx="583" cy="50" r="62" fill="#e4f3d9" opacity="0.55"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#415667">MCP · Ortak Araç Dili</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718391">Model ile dış dünya arasında güvenli köprü</text>

  <!-- Host alanı -->
  <rect x="31" y="83" width="146" height="171" rx="19" fill="#f8fbff" stroke="#c8dced" stroke-width="1.4" filter="url(#shadow)"/>
  <text x="52" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42637b">HOST</text>
  <text x="52" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708392">Yapay zekâ uygulaması</text>

  <rect x="49" y="143" width="110" height="48" rx="13" fill="url(#hostGrad)" filter="url(#soft)"/>
  <circle cx="70" cy="167" r="11" fill="#8eb5df"/>
  <path d="M65 167 Q70 158 75 167 Q70 176 65 167Z" fill="#ffffff"/>
  <text x="88" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365976">LLM</text>
  <text x="88" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547188">Bağlam</text>

  <rect x="49" y="204" width="110" height="31" rx="11" fill="#ffffff" stroke="#d7e5ef"/>
  <path d="M61 216 h15 M61 222 h10" stroke="#78a1bf" stroke-width="2" stroke-linecap="round"/>
  <text x="85" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6a7c">Kullanıcı</text>

  <!-- Host to client -->
  <path d="M177 168 H213" fill="none" stroke="#7595ab" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="218,168 210,163 210,173" fill="#7595ab"/>
  <text x="179" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698092">istek</text>

  <!-- MCP istemci -->
  <rect x="220" y="113" width="139" height="111" rx="20" fill="url(#mcpGrad)" stroke="#b8dbc6" stroke-width="1.4" filter="url(#shadow)"/>
  <circle cx="289" cy="143" r="19" fill="#77b995"/>
  <path d="M279 143 h20 M284 136 v14 M294 136 v14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="244" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356a4d">MCP İstemcisi</text>
  <text x="243" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#548069">JSON-RPC iletişimi</text>

  <!-- Client to server -->
  <path d="M360 168 H397" fill="none" stroke="#6e9b82" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="402,168 394,163 394,173" fill="#6e9b82"/>
  <text x="363" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e8270">çağrı</text>

  <!-- Server boundary -->
  <rect x="404" y="73" width="204" height="190" rx="22" fill="#ffffff" opacity="0.7" stroke="#e5cd9e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="426" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#967044">Yetki sınırı</text>

  <rect x="422" y="111" width="168" height="59" rx="16" fill="url(#serverGrad)" filter="url(#shadow)"/>
  <path d="M443 129 l10 -6 l10 6 v12 c0 9 -8 14 -10 15 c-2 -1 -10 -6 -10 -15Z" fill="#d3914d"/>
  <path d="M449 140 l3 3 l6 -7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="475" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805727">MCP Sunucusu</text>
  <text x="475" y="154" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#987343">Araç keşfi ve erişim</text>

  <!-- Downward branches -->
  <path d="M506 171 V187 M506 187 H451 V198 M506 187 H559 V198" fill="none" stroke="#b48450" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="451,203 446,195 456,195" fill="#b48450"/>
  <polygon points="559,203 554,195 564,195" fill="#b48450"/>

  <rect x="422" y="205" width="74" height="39" rx="11" fill="#f3e8ff" stroke="#decaef" filter="url(#soft)"/>
  <path d="M436 216 h17 v14 h-17z M439 213 h11" fill="none" stroke="#9b76b7" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="461" y="229" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705386">Araç</text>

  <rect x="520" y="205" width="70" height="39" rx="11" fill="#e3f2fb" stroke="#c8e0ed" filter="url(#soft)"/>
  <ellipse cx="536" cy="216" rx="8" ry="3.5" fill="none" stroke="#6197b4" stroke-width="1.6"/>
  <path d="M528 216 v9 c0 2 16 2 16 0 v-9 M528 220 c0 2 16 2 16 0" fill="none" stroke="#6197b4" stroke-width="1.6"/>
  <text x="550" y="229" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a7189">Veri</text>

  <!-- return flow -->
  <path d="M397 238 C350 270 241 270 176 237" fill="none" stroke="#8a9cab" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="171,235 179,232 177,242" fill="#8a9cab"/>
  <text x="260" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e8190">araç sonucu → bağlam → yanıt</text>
</svg>