  </g>
  <text x="544" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38546d">Doğrulayıcı</text>

  <!-- Sağ alt: Sunucu -->
  <g filter="url(#shadow)">
    <rect x="484" y="180" width="121" height="92" rx="18" fill="#ffffff"/>
    <rect x="509" y="195" width="70" height="48" rx="8" fill="#ece8fb"/>
    <path d="M509 211 H579 M509 227 H579" stroke="#c3b8e4" stroke-width="1"/>
    <circle cx="521" cy="203" r="3" fill="#8e7bc4"/>
    <circle cx="521" cy="219" r="3" fill="#8e7bc4"/>
    <circle cx="521" cy="235" r="3" fill="#8e7bc4"/>
    <path d="M534 203 H564 M534 219 H564 M534 235 H554" stroke="#8876bc" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="544" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38546d">Sunucu · Açık anahtar</text>

  <!-- Alt bilgi kartları -->
  <g filter="url(#smallShadow)">
    <rect x="176" y="270" width="134" height="31" rx="12" fill="#fff7dc"/>
    <circle cx="193" cy="285.5" r="7" fill="#e8b96a"/>
    <path d="M193 281 V286 L197 289" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="244" y="289.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#675232">Tek kullanımlık</text>
  </g>
  <g filter="url(#smallShadow)">
    <rect x="329" y="270" width="135" height="31" rx="12" fill="#e5f3ea"/>
    <path d="M347 279 L357 283 V289 C357 294 353 297 347 299 C341 297 337 294 337 289 V283 Z" fill="#7caf8e"/>
    <text x="404" y="289.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#395f49">Sayısal imza</text>
  </g>
</svg>