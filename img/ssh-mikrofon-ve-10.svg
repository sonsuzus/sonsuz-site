<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#5a6570" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d1e0fa"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e0"/>
      <stop offset="100%" stop-color="#fae3c4"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f7f0"/>
      <stop offset="100%" stop-color="#c9ebdd"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce8ec"/>
      <stop offset="100%" stop-color="#f7cbd4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="320" fill="url(#bg)" rx="12"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle">

    <!-- Merkez: Akustik Geri Besleme -->
    <rect x="225" y="115" width="190" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#8aa8d8" stroke-width="1.5"/>
    <text x="320" y="136" font-weight="bold" fill="#2c3e50">Akustik Geri Besleme</text>
    <text x="320" y="152" fill="#3a5169">y(t) = G·x(t−τ)</text>

    <!-- Sol üst: SSH Erişimi -->
    <rect x="40" y="25" width="130" height="42" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#d4a35a" stroke-width="1.5"/>
    <text x="105" y="42" font-weight="bold" fill="#4a3a1f">SSH Kanalı</text>
    <text x="105" y="58" fill="#5c4a2d">Uzaktan Komut</text>

    <!-- Sol alt: Mikrofon -->
    <rect x="40" y="120" width="130" height="42" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#c46a7d" stroke-width="1.5"/>
    <text x="105" y="137" font-weight="bold" fill="#4a1f2a">Mikrofon</text>
    <text x="105" y="153" fill="#5c2d3a">Ses Girişi</text>

    <!-- Sağ alt: Hoparlör -->
    <rect x="475" y="120" width="130" height="42" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#5aa87a" stroke-width="1.5"/>
    <text x="540" y="137" font-weight="bold" fill="#1f4a32">Hoparlör</text>
    <text x="540" y="153" fill="#2d5c42">Ses Çıkışı</text>

    <!-- Sağ üst: Etik Sınır -->
    <rect x="475" y="25" width="130" height="42" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#d4a35a" stroke-width="1.5"/>
    <text x="540" y="42" font-weight="bold" fill="#4a3a1f">Etik Sınır</text>
    <text x="540" y="58" fill="#5c4a2d">Açık Rıza Şart</text>

    <!-- Oklar ve bağlantılar -->
    <!-- SSH -> Mikrofon -->
    <path d="M 105 67 L 105 110" stroke="#7a8a9a" stroke-width="2" fill="none"/>
    <polygon points="100,112 105,122 110,112" fill="#7a8a9a"/>

    <!-- SSH -> Hoparlör -->
    <path d="M 540 67 L 540 110" stroke="#7a8a9a" stroke-width="2" fill="none"/>
    <polygon points="535,112 540,122 545,112" fill="#7a8a9a"/>

    <!-- Mikrofon -> Merkez -->
    <path d="M 170 141 L 215 141" stroke="#c46a7d" stroke-width="2" fill="none"/>
    <polygon points="218,136 228,141 218,146" fill="#c46a7d"/>

    <!-- Merkez -> Hoparlör -->
    <path d="M 425 141 L 465 141" stroke="#5aa87a" stroke-width="2" fill="none"/>
    <polygon points="468,136 478,141 468,146" fill="#5aa87a"/>

    <!-- Geri besleme döngüsü: Hoparlör -> Mikrofon (üstten) -->
    <path d="M 540 120 Q 540 85 320 85 Q 100 85 105 120" stroke="#8aa8d8" stroke-width="1.8" stroke-dasharray="6,4" fill="none"/>
    <polygon points="100,118 93,128 108,126" fill="#8aa8d8"/>

    <!-- Etik sınır mektup bağlantısı -->
    <path d="M 475 46 L 360 46" stroke="#d4a35a" stroke-width="1.8" stroke-dasharray="4,3" fill="none"/>
    <polygon points="362,41 352,46 362,51" fill="#d4a35a"/>

    <!-- Etiketler -->
    <text x="230" y="42" fill="#d4a35a" font-size="11" font-style="italic">Onay</text>
    <text x="230" y="78" fill="#7a8a9a" font-size="11" font-style="italic">Güvenli</text>
    <text x="300" y="95" fill="#8aa8d8" font-size="11" font-style="italic">Döngü Risk</text>
    <text x="420" y="78" fill="#7a8a9a" font-size="11" font-style="italic">Kontrol</text>

  </g>
</svg>