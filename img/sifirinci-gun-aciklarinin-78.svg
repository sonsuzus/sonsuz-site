<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d8fd"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#58718a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#667e91" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="none" stroke="#c8dbe1" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="320" cy="160" r="64" fill="#ffffff" opacity="0.55"/>

  <!-- Akış çizgileri -->
  <path d="M182 92 C218 55 260 42 287 53" fill="none" stroke="#8aa8bd" stroke-width="2.5"/>
  <polygon points="286,47 299,57 283,61" fill="#8aa8bd"/>
  <path d="M353 54 C402 61 435 85 452 111" fill="none" stroke="#8aa8bd" stroke-width="2.5"/>
  <polygon points="446,109 457,122 442,119" fill="#8aa8bd"/>
  <path d="M461 151 C461 194 439 225 411 242" fill="none" stroke="#8aa8bd" stroke-width="2.5"/>
  <polygon points="409,235 401,249 416,247" fill="#8aa8bd"/>
  <path d="M359 266 C315 283 267 275 238 252" fill="none" stroke="#8aa8bd" stroke-width="2.5"/>
  <polygon points="242,246 226,245 233,259" fill="#8aa8bd"/>
  <path d="M192 218 C169 183 169 136 187 106" fill="none" stroke="#8aa8bd" stroke-width="2.5"/>
  <polygon points="192,109 190,93 178,103" fill="#8aa8bd"/>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="254" y="121" width="132" height="78" rx="22" fill="url(#core)" stroke="#baa8dc" stroke-width="1.5"/>
    <path d="M320 137 l18 8 v14 c0 13-8 23-18 28-10-5-18-15-18-28v-14z" fill="#ffffff" opacity="0.9"/>
    <path d="M314 160 l5 5 10-12" fill="none" stroke="#715a9c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4a3b67">Sıfırıncı Gün</text>
  </g>

  <!-- Keşif -->
  <g filter="url(#soft)">
    <rect x="76" y="55" width="122" height="64" rx="16" fill="#dff3ed" stroke="#a7d9ca"/>
    <circle cx="101" cy="81" r="12" fill="#ffffff"/>
    <circle cx="99" cy="79" r="5" fill="none" stroke="#438a78" stroke-width="2"/>
    <path d="M103 84 l6 6" stroke="#438a78" stroke-width="2.5" stroke-linecap="round"/>
    <text x="144" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286653">Keşif</text>
    <text x="144" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d786c">Doğrulama</text>
  </g>

  <!-- Bildirim -->
  <g filter="url(#soft)">
    <rect x="385" y="43" width="137" height="64" rx="16" fill="#fff0d9" stroke="#edce9b"/>
    <path d="M407 67 h24 v18 h-24z" fill="#ffffff" stroke="#bd7a37" stroke-width="1.5"/>
    <path d="M407 68 l12 9 12-9" fill="none" stroke="#bd7a37" stroke-width="1.5"/>
    <text x="470" y="69" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a5321">Koordineli</text>
    <text x="470" y="87" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#956b42">Bildirim</text>
  </g>

  <!-- Düzeltme -->
  <g filter="url(#soft)">
    <rect x="446" y="128" width="142" height="65" rx="16" fill="#e5edff" stroke="#b9cbed"/>
    <path d="M471 155 l8-8 7 7-8 8-7 2z" fill="#ffffff" stroke="#547bb5" stroke-width="1.5"/>
    <path d="M483 149 l4-4 7 7-4 4" fill="none" stroke="#547bb5" stroke-width="1.5"/>
    <text x="534" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6296">Kök Neden</text>
    <text x="534" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#57749d">Düzeltme ve Test</text>
  </g>

  <!-- Dağıtım -->
  <g filter="url(#soft)">
    <rect x="366" y="225" width="151" height="64" rx="16" fill="#e5f5dd" stroke="#b9dca8"/>
    <path d="M391 247 h20 v14 h-20z" fill="#ffffff" stroke="#5e9662" stroke-width="1.5"/>
    <path d="M397 244 h8 M401 241 v6" stroke="#5e9662" stroke-width="1.5" stroke-linecap="round"/>
    <text x="462" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#417743">Dağıtım</text>
    <text x="462" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e865e">Doğrulama ve İzleme</text>
  </g>

  <!-- Risk -->
  <g filter="url(#soft)">
    <rect x="74" y="211" width="151" height="65" rx="16" fill="#ffe8e6" stroke="#efbdb9"/>
    <path d="M99 255 l12-21 12 21z" fill="#ffffff" stroke="#c96861" stroke-width="1.5"/>
    <path d="M111 241 v7 M111 252 v1" stroke="#c96861" stroke-width="2" stroke-linecap="round"/>
    <text x="165" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a74e49">Geçici Koruma</text>
    <text x="165" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a66a66">Risk Yönetimi</text>
  </g>

  <!-- Merkez bağlantıları -->
  <path d="M212 105 L259 132" stroke="#b2c7cf" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M386 119 L411 103" stroke="#b2c7cf" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M385 171 L445 161" stroke="#b2c7cf" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M362 201 L400 225" stroke="#b2c7cf" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M256 195 L220 218" stroke="#b2c7cf" stroke-width="1.5" stroke-dasharray="3 4"/>
</svg>