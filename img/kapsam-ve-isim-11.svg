<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6f8599" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6f8599" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="321" cy="161" r="145" fill="#dceefa" opacity="0.27"/>
  <circle cx="579" cy="53" r="82" fill="#daf1dd" opacity="0.28"/>

  <text x="28" y="33" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">KAPSAM VE İSİM ALANLARI</text>
  <text x="28" y="52" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718596">İsim çözümleme: en yakından en dışa</text>

  <!-- Namespace card -->
  <g filter="url(#shadow)">
    <rect x="28" y="83" width="145" height="154" rx="18" fill="#ffffff"/>
    <rect x="28" y="83" width="145" height="37" rx="18" fill="#dceeff"/>
    <rect x="28" y="102" width="145" height="18" fill="#dceeff"/>
  </g>
  <text x="48" y="107" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#335d79">İsim alanı</text>
  <text x="48" y="142" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60778a">İsim</text>
  <text x="118" y="142" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60778a">Nesne</text>
  <line x1="46" y1="151" x2="154" y2="151" stroke="#d8e5ed"/>
  <rect x="47" y="162" width="42" height="23" rx="8" fill="#e4f3ff"/>
  <text x="62" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397298">x</text>
  <path d="M96 174 L111 174" stroke="#88a8ba" stroke-width="1.5"/>
  <polygon points="111,170 118,174 111,178" fill="#88a8ba"/>
  <rect x="120" y="162" width="35" height="23" rx="8" fill="#ecf7e9"/>
  <text x="129" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e7e56">42</text>
  <text x="48" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718596">Bağ eşlemesi</text>

  <!-- Connector -->
  <path d="M174 160 C190 160 191 160 204 160" fill="none" stroke="#85aabe" stroke-width="2"/>
  <polygon points="204,155 213,160 204,165" fill="#85aabe"/>

  <!-- Main scope composition -->
  <g filter="url(#shadow)">
    <rect x="213" y="76" width="218" height="180" rx="25" fill="#f7edff" stroke="#e3ccef"/>
    <rect x="232" y="94" width="180" height="143" rx="21" fill="#e4f3ff" stroke="#c4e0ef"/>
    <rect x="251" y="112" width="142" height="107" rx="18" fill="#e2f4e6" stroke="#bfe0c5"/>
    <rect x="270" y="130" width="104" height="71" rx="15" fill="url(#center)" stroke="#b8d7e7"/>
  </g>

  <text x="225" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7c5791">B  Yerleşik</text>
  <text x="243" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397298">G  Global</text>
  <text x="262" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d815b">E  Çevreleyen</text>
  <text x="289" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345c76">L  Yerel</text>
  <text x="282" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698194">ilk eşleşme</text>

  <!-- LEGB flow -->
  <path d="M322 267 L322 282" stroke="#668da5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="317,278 322,286 327,278" fill="#668da5"/>
  <rect x="224" y="286" width="197" height="24" rx="12" fill="#ffffff" filter="url(#softShadow)"/>
  <text x="246" y="302" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#506b7c">L → E → G → B  arama sırası</text>

  <!-- Right informational cards -->
  <g filter="url(#shadow)">
    <rect x="459" y="75" width="154" height="81" rx="17" fill="#ffffff"/>
    <rect x="459" y="174" width="154" height="82" rx="17" fill="#ffffff"/>
  </g>

  <rect x="475" y="90" width="31" height="27" rx="9" fill="#e2f4e6"/>
  <path d="M484 103 L490 109 L499 97" fill="none" stroke="#539168" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466474">Yeni kapsam</text>
  <text x="516" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718596">Fonksiyon</text>
  <text x="516" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718596">Sınıf ve modül</text>

  <rect x="475" y="190" width="31" height="27" rx="9" fill="#fff0d9"/>
  <path d="M484 204 L498 204" stroke="#b87a35" stroke-width="2.2" stroke-linecap="round"/>
  <text x="516" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466474">Yeni kapsam yok</text>
  <text x="516" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718596">if ve for blokları</text>
  <text x="516" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718596">girintili olsa da</text>

  <path d="M432 146 C445 132 447 117 458 117" fill="none" stroke="#92b5c6" stroke-width="1.7"/>
  <polygon points="453,113 459,117 453,121" fill="#92b5c6"/>
  <path d="M432 181 C445 192 447 211 458 211" fill="none" stroke="#92b5c6" stroke-width="1.7"/>
  <polygon points="453,207 459,211 453,215" fill="#92b5c6"/>
</svg>