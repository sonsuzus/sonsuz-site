  <path d="M91 228 V254 H244" fill="none" stroke="#78af91" stroke-width="2.5"/>
  <polygon points="244,254 236,249 236,259" fill="#78af91"/>
  <path d="M519 231 V254 H396" fill="none" stroke="#78af91" stroke-width="2.5"/>
  <polygon points="396,254 404,249 404,259" fill="#78af91"/>

  <g filter="url(#shadow)">
    <rect x="244" y="238" width="152" height="62" rx="18" fill="#dff4e7" stroke="#a4d8b9"/>
    <text x="320" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#326a50">Daha Az Cache Miss</text>
    <text x="320" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527e66">Aynı algoritma • Hızlı sonuç</text>
