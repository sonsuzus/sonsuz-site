      <rect x="560" y="121" width="9" height="9" rx="2" fill="#5bb985"/>
      <rect x="571" y="121" width="9" height="9" rx="2" fill="#5bb985"/>
      <rect x="549" y="135" width="9" height="9" rx="2" fill="#bfe7cf"/>
      <rect x="560" y="135" width="9" height="9" rx="2" fill="#bfe7cf"/>
      <rect x="571" y="135" width="9" height="9" rx="2" fill="#bfe7cf"/>
    </g>

    <rect x="443" y="169" width="153" height="43" rx="10" fill="#fff0eb" stroke="#efc5ba"/>
    <text x="456" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a25a4e">Sıçramalı tarama</text>
    <text x="456" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a97870">Sütun sütun</text>

    <g>
      <rect x="549" y="177" width="9" height="9" rx="2" fill="#ed927f"/>
      <rect x="571" y="177" width="9" height="9" rx="2" fill="#f4c9bd"/>
      <rect x="560" y="191" width="9" height="9" rx="2" fill="#ed927f"/>
