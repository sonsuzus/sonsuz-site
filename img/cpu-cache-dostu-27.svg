<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#bdd8fb"/>
    </linearGradient>
    <linearGradient id="fastGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f5e4"/>
      <stop offset="100%" stop-color="#bce9d0"/>
    </linearGradient>
    <linearGradient id="slowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe6dc"/>
      <stop offset="100%" stop-color="#f7c9bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#60758a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#60758a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="553" cy="48" r="78" fill="#d9f1eb" opacity="0.42"/>
  <circle cx="84" cy="292" r="92" fill="#dceafe" opacity="0.48"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34516a">CACHE DOSTU VERİ AKIŞI</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62798c">Yakın veri • Ardışık erişim • Daha az kaçırma</text>

  <g filter="url(#shadow)">
    <rect x="28" y="76" width="126" height="152" rx="18" fill="url(#cpuGrad)" stroke="#a8c8ed"/>
    <rect x="43" y="94" width="96" height="49" rx="12" fill="#eef6ff" stroke="#b6d2f0"/>
    <text x="91" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315671">CPU</text>
    <text x="91" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58738b">İşlemci</text>

    <rect x="43" y="157" width="96" height="53" rx="12" fill="#d6f3e3" stroke="#9ed7b6"/>
    <text x="91" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#336950">L1 Önbellek</text>
    <text x="91" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56826b">Sıcak veri</text>
  </g>

  <path d="M154 152 H182" fill="none" stroke="#6f9bbb" stroke-width="2.5"/>
  <polygon points="182,152 174,147 174,157" fill="#6f9bbb"/>
  <path d="M182 166 H154" fill="none" stroke="#7cac91" stroke-width="2.5"/>
  <polygon points="154,166 162,161 162,171" fill="#7cac91"/>

