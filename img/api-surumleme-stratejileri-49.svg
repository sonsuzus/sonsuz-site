<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ea7da"/>
      <stop offset="100%" stop-color="#91c9bb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4c6680" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#60798d" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="47" r="68" fill="#d9ebfb" opacity="0.48"/>
  <circle cx="577" cy="282" r="82" fill="#dcefdc" opacity="0.46"/>

  <text x="32" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">API SÜRÜMLEME</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668094">Uyumluluğu koruyarak evrim</text>

  <!-- Connections -->
  <path d="M170 125 C200 125 202 147 228 147" fill="none" stroke="#87a6ba" stroke-width="3"/>
  <polygon points="228,147 218,141 218,153" fill="#87a6ba"/>
  <path d="M170 205 C201 205 201 174 228 174" fill="none" stroke="#87a6ba" stroke-width="3"/>
  <polygon points="228,174 218,168 218,180" fill="#87a6ba"/>

  <path d="M410 160 C429 160 432 96 454 96" fill="none" stroke="#75b69c" stroke-width="3"/>
  <polygon points="454,96 444,90 444,102" fill="#75b69c"/>
  <path d="M410 160 C430 160 432 160 454 160" fill="none" stroke="#6f9dcc" stroke-width="3"/>
  <polygon points="454,160 444,154 444,166" fill="#6f9dcc"/>
  <path d="M410 160 C429 160 432 224 454 224" fill="none" stroke="#d09a87" stroke-width="3"/>
  <polygon points="454,224 444,218 444,230" fill="#d09a87"/>

  <!-- client v1 -->
  <g filter="url(#soft)">
    <rect x="34" y="87" width="136" height="76" rx="16" fill="#ffffff"/>
    <rect x="46" y="101" width="31" height="31" rx="9" fill="#dbeafb"/>
    <path d="M54 117 h15 M54 122 h10" stroke="#5d8fc5" stroke-width="2" stroke-linecap="round"/>
    <text x="87" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39536b">Eski İstemci</text>
    <text x="87" y="131" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758b9b">v1 sözleşmesi</text>
    <rect x="47" y="142" width="47" height="12" rx="6" fill="#e4f3e9"/>
    <text x="55" y="152" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e8c6a">çalışır</text>
  </g>

  <!-- client v2 -->
  <g filter="url(#soft)">
    <rect x="34" y="168" width="136" height="76" rx="16" fill="#ffffff"/>
    <rect x="46" y="182" width="31" height="31" rx="9" fill="#e8e2fa"/>
    <path d="M54 199 h15 M54 204 h10" stroke="#826db9" stroke-width="2" stroke-linecap="round"/>
    <text x="87" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39536b">Yeni İstemci</text>
    <text x="87" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758b9b">v2 özellikleri</text>
    <rect x="47" y="223" width="63" height="12" rx="6" fill="#e7e0f8"/>
    <text x="55" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7560ad">genişler</text>
  </g>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="228" y="105" width="182" height="110" rx="22" fill="url(#core)"/>
    <circle cx="319" cy="139" r="24" fill="#ffffff" opacity="0.9"/>
    <path d="M307 139 h24 M319 127 v24" stroke="#5a91a7" stroke-width="3" stroke-linecap="round"/>
    <text x="272" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Uyumluluk Katmanı</text>
    <text x="255" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#efffff">C eski ⊆ S yeni</text>
  </g>

  <!-- right cards -->
  <g filter="url(#soft)">
    <rect x="454" y="61" width="151" height="69" rx="15" fill="#ffffff"/>
    <rect x="467" y="75" width="9" height="40" rx="4" fill="#83c5a7"/>
    <text x="488" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f685a">Ekleyici Değişim</text>
    <text x="488" y="106" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718a83">İsteğe bağlı alan</text>
    <circle cx="580" cy="85" r="8" fill="#e2f4e9"/>
    <path d="M576 85 l3 3 5 -6" fill="none" stroke="#55a879" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#soft)">
    <rect x="454" y="132" width="151" height="57" rx="15" fill="#ffffff"/>
    <rect x="467" y="146" width="9" height="29" rx="4" fill="#82a9d8"/>
    <text x="488" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426584">Sürüm Yolları</text>
    <text x="488" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718a9c">URL · Başlık · Parametre</text>
  </g>

  <g filter="url(#soft)">
    <rect x="454" y="202" width="151" height="69" rx="15" fill="#ffffff"/>
    <rect x="467" y="216" width="9" height="40" rx="4" fill="#dc9e8a"/>
    <text x="488" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a5548">Kırıcı Değişim</text>
    <text x="488" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#91786f">Geçiş ve kullanım ölçümü</text>
    <path d="M579 219 l9 16 h-18 z" fill="#f7e2da"/>
    <path d="M579 224 v5 M579 232 v1" stroke="#c77d68" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- lifecycle footer -->
  <path d="M84 282 H526" stroke="#b6cbd2" stroke-width="2" stroke-dasharray="4 5"/>
  <circle cx="140" cy="282" r="8" fill="#90c9ab"/>
  <circle cx="285" cy="282" r="8" fill="#8eb4dc"/>
  <circle cx="430" cy="282" r="8" fill="#dfa18e"/>
  <text x="101" y="306" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597369">Sözleşme testi</text>
  <text x="245" y="306" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597389">Gölge trafik</text>
  <text x="385" y="306" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#85675d">Kullanımdan kaldırma</text>
</svg>