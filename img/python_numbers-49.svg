<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="intGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#c7ecee"/>
    </linearGradient>
    <linearGradient id="floatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c291"/>
      <stop offset="100%" stop-color="#fad390"/>
    </linearGradient>
    <linearGradient id="complexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82ccdd"/>
      <stop offset="100%" stop-color="#b8e994"/>
    </linearGradient>
    <linearGradient id="boolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8a5c2"/>
      <stop offset="100%" stop-color="#f78fb3"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a89cc"/>
      <stop offset="100%" stop-color="#4a69bd"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Merkez düğüm -->
  <ellipse cx="320" cy="160" rx="95" ry="45" fill="url(#centerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Python</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e8f0fe">Sayısal Veri Tipleri</text>

  <!-- int kutusu -->
  <rect x="40" y="55" width="120" height="60" rx="12" fill="url(#intGrad)" filter="url(#shadow)"/>
  <text x="100" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e3799">int</text>
  <text x="100" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">tamsayı</text>

  <!-- float kutusu -->
  <rect x="240" y="30" width="120" height="60" rx="12" fill="url(#floatGrad)" filter="url(#shadow)"/>
  <text x="300" y="57" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#b71540">float</text>
  <text x="300" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">ondalıklı</text>

  <!-- complex kutusu -->
  <rect x="440" y="55" width="130" height="60" rx="12" fill="url(#complexGrad)" filter="url(#shadow)"/>
  <text x="505" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#0c2461">complex</text>
  <text x="505" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">karmaşık</text>

  <!-- bool kutusu -->
  <rect x="240" y="225" width="120" height="60" rx="12" fill="url(#boolGrad)" filter="url(#shadow)"/>
  <text x="300" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#6a0572">bool</text>
  <text x="300" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">True / False</text>

  <!-- Örnek değerler -->
  <rect x="40" y="230" width="120" height="55" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.9"/>
  <text x="100" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">deg = 21</text>
  <text x="100" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">type(deg)</text>

  <rect x="440" y="230" width="130" height="55" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.9"/>
  <text x="505" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">deg = 1+2j</text>
  <text x="505" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">type(deg)</text>

  <!-- Bağlantı çizgileri ve oklar -->
  <!-- int bağlantısı -->
  <path d="M 225 115 L 295 145" stroke="#4a69bd" stroke-width="2" fill="none"/>
  <polygon points="295,145 285,140 288,148" fill="#4a69bd"/>

  <!-- float bağlantısı -->
  <path d="M 300 90 L 300 135" stroke="#b71540" stroke-width="2" fill="none"/>
  <polygon points="300,135 294,127 306,127" fill="#b71540"/>

  <!-- complex bağlantısı -->
  <path d="M 415 115 L 345 145" stroke="#0c2461" stroke-width="2" fill="none"/>
  <polygon points="345,145 352,140 349,148" fill="#0c2461"/>

  <!-- bool bağlantısı -->
  <path d="M 300 205 L 300 225" stroke="#6a0572" stroke-width="2" fill="none"/>
  <polygon points="300,225 294,217 306,217" fill="#6a0572"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">type() fonksiyonu ile veri türü öğrenilir</text>
</svg>