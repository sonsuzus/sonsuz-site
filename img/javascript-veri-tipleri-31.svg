  <path d="M481 158 L481 171" stroke="#d28b75" stroke-width="2" stroke-linecap="round"/>
  <polygon points="481,176 476,169 486,169" fill="#d28b75"/>
  <path d="M563 158 L563 171" stroke="#d28b75" stroke-width="2" stroke-linecap="round"/>
