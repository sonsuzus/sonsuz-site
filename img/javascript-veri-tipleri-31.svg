  <text x="460" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a0614e">ToString • ToNumber</text>
  <text x="460" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7168">ToBoolean • ToPrimitive</text>

