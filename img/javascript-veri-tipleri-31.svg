  <polygon points="320,260 315,253 325,253" fill="#8baabe"/>
  <rect x="207" y="264" width="226" height="39" rx="15" fill="#e5f4dc" filter="url(#softShadow)"/>
  <circle cx="233" cy="283" r="11" fill="#95c67e"/>
  <path d="M228 283 L232 287 L239 278" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="253" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#48733f">Açık dönüşüm</text>
  <text x="253" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54794d">Number • String • Boolean • ===</text>
