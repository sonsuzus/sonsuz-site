  <rect x="42" y="202" width="43" height="27" rx="8" fill="#e7e0fa"/>
  <text x="50" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#66548a">A</text>
  <rect x="96" y="202" width="43" height="27" rx="8" fill="#e7e0fa"/>
  <text x="104" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#66548a">B</text>
