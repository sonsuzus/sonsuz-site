  <text x="54" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76633c">10</text>

  <rect x="119" y="113" width="65" height="46" rx="11" fill="#fff4d8" filter="url(#softShadow)"/>
  <text x="131" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a6828">puanB</text>
