<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ef"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8fd9"/>
      <stop offset="100%" stop-color="#4a7bbd"/>
    </linearGradient>
    <linearGradient id="cat1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8e8"/>
      <stop offset="100%" stop-color="#6aa5d4"/>
    </linearGradient>
    <linearGradient id="cat2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd4a8"/>
      <stop offset="100%" stop-color="#7ac296"/>
    </linearGradient>
    <linearGradient id="cat3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c987"/>
      <stop offset="100%" stop-color="#e8b96a"/>
    </linearGradient>
    <linearGradient id="cat4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9a8e0"/>
      <stop offset="100%" stop-color="#c994d1"/>
    </linearGradient>
    <linearGradient id="cat5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a8a8"/>
      <stop offset="100%" stop-color="#e09595"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez düğüm -->
  <circle cx="320" cy="160" r="52" fill="url(#centerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C++</text>
  <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f0ff">Anahtar</text>
  <text x="320" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f0ff">Kelimeler</text>

  <!-- Kategori 1: Veri Türleri (sol üst) -->
  <rect x="60" y="40" width="130" height="70" rx="12" fill="url(#cat1)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="125" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Veri Türleri</text>
  <text x="125" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0f6ff">bool, char, int</text>
  <text x="125" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0f6ff">float, double, void</text>

  <!-- Kategori 2: Kontrol Akışı (sağ üst) -->
  <rect x="450" y="40" width="130" height="70" rx="12" fill="url(#cat2)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="515" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Kontrol Akışı</text>
  <text x="515" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0f6ff">if, else, switch</text>
  <text x="515" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0f6ff">for, while, do</text>

  <!-- Kategori 3: Sınıf ve Nesne (sol alt) -->
  <rect x="60" y="210" width="130" height="70" rx="12" fill="url(#cat3)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="125" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Sınıf ve Nesne</text>
  <text x="125" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff8e8">class, struct, public</text>
  <text x="125" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff8e8">private, protected</text>

  <!-- Kategori 4: Bellek ve İşaretçiler (sağ alt) -->
  <rect x="450" y="210" width="130" height="70" rx="12" fill="url(#cat4)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="515" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Bellek ve İşaretçi</text>
  <text x="515" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fdf0ff">new, delete, this</text>
  <text x="515" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fdf0ff">sizeof, typeid</text>

  <!-- Kategori 5: Dönüşüm ve İstisna (üst orta) -->
  <rect x="255" y="20" width="130" height="55" rx="12" fill="url(#cat5)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="40" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Dönüşüm ve İstisna</text>
  <text x="320" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff0f0">static_cast, try, catch</text>

  <!-- Kategori 6: Diğer (alt orta) -->
  <rect x="255" y="245" width="130" height="55" rx="12" fill="url(#cat1)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="320" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Diğer Anahtar</text>
  <text x="320" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0f6ff">namespace, template</text>

  <!-- Bağlantı çizgileri ve oklar (manuel) -->
  <!-- Merkezden Kategori 1'e -->
  <path d="M 268 145 L 195 95" stroke="#6aa5d4" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="195,95 205,98 199,103" fill="#6aa5d4" opacity="0.8"/>

  <!-- Merkezden Kategori 2'ye -->
  <path d="M 372 145 L 445 95" stroke="#7ac296" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="445,95 435,98 441,103" fill="#7ac296" opacity="0.8"/>

  <!-- Merkezden Kategori 3'e -->
  <path d="M 268 175 L 195 225" stroke="#e8b96a" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="195,225 205,222 199,217" fill="#e8b96a" opacity="0.8"/>

  <!-- Merkezden Kategori 4'e -->
  <path d="M 372 175 L 445 225" stroke="#c994d1" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="445,225 435,222 441,217" fill="#c994d1" opacity="0.8"/>

  <!-- Merkezden Kategori 5'e -->
  <path d="M 320 108 L 320 80" stroke="#e09595" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="320,80 315,90 325,90" fill="#e09595" opacity="0.8"/>

  <!-- Merkezden Kategori 6'ya -->
  <path d="M 320 212 L 320 240" stroke="#6aa5d4" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="320,240 315,230 325,230" fill="#6aa5d4" opacity="0.8"/>

  <!-- Alt bilgi: 63 anahtar kelime -->
  <rect x="230" y="140" width="180" height="40" rx="20" fill="#ffffff" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="320" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#4a7bbd">63 Anahtar Kelime</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#6a8ab5">Küçük harf zorunluluğu</text>

  <!-- Bilgi notu: bool ve wchar_t -->
  <rect x="530" y="130" width="100" height="60" rx="10" fill="#e8f4ff" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="580" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#4a7bbd">Özel Türler</text>
  <text x="580" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a8ac5">bool: true/false</text>
  <text x="580" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a8ac5">wchar_t: geniş karakter</text>
</svg>