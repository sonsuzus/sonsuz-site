<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Javascript String Metotları</text>

  <!-- Merkez düğüm: String Nesnesi -->
  <rect x="245" y="55" width="150" height="48" rx="12" fill="url(#box1)" stroke="#5b7bb5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">String Nesnesi</text>
  <text x="320" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a9a">(Değiştirilemez)</text>

  <!-- Ok: merkezden dışa -->
  <!-- concat -->
  <path d="M 245 79 L 130 79" stroke="#7a9bc4" stroke-width="1.8" fill="none"/>
  <polygon points="135,73 125,79 135,85" fill="#7a9bc4"/>

  <!-- indexOf -->
  <path d="M 270 103 L 180 160" stroke="#7a9bc4" stroke-width="1.8" fill="none"/>
  <polygon points="185,153 175,160 187,163" fill="#7a9bc4"/>

  <!-- search -->
  <path d="M 320 103 L 320 160" stroke="#7a9bc4" stroke-width="1.8" fill="none"/>
  <polygon points="314,155 320,165 326,155" fill="#7a9bc4"/>

  <!-- toUpperCase -->
  <path d="M 370 103 L 460 160" stroke="#7a9bc4" stroke-width="1.8" fill="none"/>
  <polygon points="453,155 465,160 453,165" fill="#7a9bc4"/>

  <!-- trim -->
  <path d="M 395 79 L 510 79" stroke="#7a9bc4" stroke-width="1.8" fill="none"/>
  <polygon points="505,73 515,79 505,85" fill="#7a9bc4"/>

  <!-- slice -->
  <path d="M 370 55 L 460 20" stroke="#7a9bc4" stroke-width="1.8" fill="none"/>
  <polygon points="453,26 465,20 453,14" fill="#7a9bc4"/>

  <!-- Sol üst: concat -->
  <rect x="15" y="55" width="115" height="48" rx="10" fill="url(#box2)" stroke="#4a8a5a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="72" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">concat()</text>
  <text x="72" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a4a">Birleştirme</text>

  <!-- Sol alt: indexOf -->
  <rect x="15" y="145" width="115" height="48" rx="10" fill="url(#box3)" stroke="#b57a3a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="72" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">indexOf()</text>
  <text x="72" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a2a">Arama</text>

  <!-- Orta alt: search -->
  <rect x="265" y="165" width="110" height="48" rx="10" fill="url(#box4)" stroke="#b54a6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">search()</text>
  <text x="320" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a3a4a">Düzenli İfade</text>

  <!-- Sağ alt: toUpperCase -->
  <rect x="465" y="145" width="115" height="48" rx="10" fill="url(#box5)" stroke="#5a6ab5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="522" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">toUpperCase()</text>
  <text x="522" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a4a8a">Büyük Harf</text>

  <!-- Sağ üst: trim -->
  <rect x="515" y="55" width="110" height="48" rx="10" fill="url(#box6)" stroke="#3a9a9a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">trim()</text>
  <text x="570" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a7a7a">Boşluk Temizle</text>

  <!-- En üst: slice -->
  <rect x="465" y="5" width="115" height="40" rx="10" fill="url(#box1)" stroke="#5b7bb5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="522" y="24" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">slice()</text>
  <text x="522" y="38" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a9a">Parçalama</text>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a" opacity="0.8">concat • indexOf • lastIndexOf • search • toUpperCase • toLowerCase • trim • slice • substring • substr • replace • split</text>

  <!-- Dekoratif çizgi -->
  <line x1="80" y1="280" x2="560" y2="280" stroke="#a0b8d0" stroke-width="0.8" opacity="0.5"/>
</svg>