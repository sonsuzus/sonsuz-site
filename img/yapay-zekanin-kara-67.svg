<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#90a4ae" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#90a4ae" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#37474f">Kara Kutu Sorunu ve Açıklanabilirlik</text>

  <!-- Merkez: Kara Kutu -->
  <rect x="245" y="95" width="150" height="60" rx="12" fill="#5c6bc0" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Kara Kutu</text>
  <text x="320" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8eaf6">Derin Sinir Ağı</text>

  <!-- Sol: Girdi -->
  <rect x="45" y="100" width="120" height="50" rx="10" fill="#4db6ac" filter="url(#shadowLight)"/>
  <text x="105" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Girdi (x)</text>
  <text x="105" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e0f2f1">Veri ve Özellikler</text>

  <!-- Sağ: Çıktı -->
  <rect x="475" y="100" width="120" height="50" rx="10" fill="#ef5350" filter="url(#shadowLight)"/>
  <text x="535" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Çıktı (y)</text>
  <text x="535" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ffebee">Tahmin ve Karar</text>

  <!-- Oklar: Girdi -> Kara Kutu -->
  <line x1="165" y1="125" x2="240" y2="125" stroke="#546e7a" stroke-width="2"/>
  <polygon points="240,125 230,119 230,131" fill="#546e7a"/>

  <!-- Oklar: Kara Kutu -> Çıktı -->
  <line x1="400" y1="125" x2="470" y2="125" stroke="#546e7a" stroke-width="2"/>
  <polygon points="470,125 460,119 460,131" fill="#546e7a"/>

  <!-- Üst: Performans -->
  <rect x="245" y="30" width="150" height="40" rx="10" fill="#ffa726" filter="url(#shadowLight)"/>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Performans</text>
  <text x="320" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff8e1">Doğruluk ve Kayıp</text>

  <!-- Alt: Etik -->
  <rect x="245" y="180" width="150" height="40" rx="10" fill="#26a69a" filter="url(#shadowLight)"/>
  <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Etik ve Güven</text>
  <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e0f2f1">Adalet ve Denetim</text>

  <!-- Dikey bağlantılar -->
  <line x1="320" y1="70" x2="320" y2="90" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="320" y1="155" x2="320" y2="175" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Alt sol: Açıklama Yöntemleri -->
  <rect x="45" y="230" width="150" height="50" rx="10" fill="#7e57c2" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="120" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Açıklama Araçları</text>
  <text x="120" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ede7f6">LIME ve SHAP</text>

  <!-- Alt sağ: İnsan Denetimi -->
  <rect x="445" y="230" width="150" height="50" rx="10" fill="#42a5f5" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="520" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">İnsan Denetimi</text>
  <text x="520" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e3f2fd">İtiraz ve İnceleme</text>

  <!-- Bağlantılar -->
  <line x1="195" y1="255" x2="240" y2="215" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="240,215 231,218 235,226" fill="#546e7a"/>
  <line x1="445" y1="255" x2="400" y2="215" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="400,215 409,218 405,226" fill="#546e7a"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c">Şeffaflık ve performans arasında denge kurmak</text>
</svg>