<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Mini Derleyici Mimarisi</text>
  <line x1="180" y1="36" x2="460" y2="36" stroke="#b0c4de" stroke-width="1" opacity="0.6"/>

  <!-- Kaynak Kod Kutusu -->
  <rect x="30" y="55" width="130" height="50" rx="10" fill="#e8f4f8" filter="url(#shadow)" stroke="#a8c8d8" stroke-width="1"/>
  <text x="95" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Kaynak Kod</text>
  <text x="95" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a">Haskell benzeri</text>

  <!-- Ok 1 -->
  <polygon points="165,80 185,73 185,87" fill="#7fb3d3"/>
  <line x1="160" y1="80" x2="183" y2="80" stroke="#7fb3d3" stroke-width="2"/>

  <!-- AST Kutusu -->
  <rect x="190" y="55" width="130" height="50" rx="10" fill="#e8f8f0" filter="url(#shadow)" stroke="#a8d8c0" stroke-width="1"/>
  <text x="255" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Soyut Sözdizimi</text>
  <text x="255" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a6a">Ağacı (AST)</text>

  <!-- Ok 2 -->
  <polygon points="325,80 345,73 345,87" fill="#7fb3d3"/>
  <line x1="320" y1="80" x2="343" y2="80" stroke="#7fb3d3" stroke-width="2"/>

  <!-- Örüntü Eşleme Kutusu -->
  <rect x="350" y="55" width="130" height="50" rx="10" fill="#fdf5e6" filter="url(#shadow)" stroke="#d8c8a0" stroke-width="1"/>
  <text x="415" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Örüntü Eşleme</text>
  <text x="415" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a4a">Kaplayıcılık</text>

  <!-- Ok 3 -->
  <polygon points="485,80 505,73 505,87" fill="#7fb3d3"/>
  <line x1="480" y1="80" x2="503" y2="80" stroke="#7fb3d3" stroke-width="2"/>

  <!-- Kod Üretim Kutusu -->
  <rect x="510" y="55" width="110" height="50" rx="10" fill="#f0e8f8" filter="url(#shadow)" stroke="#c8a8d8" stroke-width="1"/>
  <text x="565" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Kod Üretimi</text>
  <text x="565" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a4a7a">Bayt Kodu</text>

  <!-- Yığın Makinesi Kutusu -->
  <rect x="510" y="140" width="110" height="50" rx="10" fill="#f8e8e8" filter="url(#shadow)" stroke="#d8a8a8" stroke-width="1"/>
  <text x="565" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Yığın Makinesi</text>
  <text x="565" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a4a4a">Çalışma Zamanı</text>

  <!-- Dikey ok -->
  <polygon points="565,135 558,120 572,120" fill="#d8a0a0"/>
  <line x1="565" y1="108" x2="565" y2="133" stroke="#d8a0a0" stroke-width="2"/>

  <!-- Veri Tipi Kategorileri -->
  <rect x="30" y="145" width="180" height="95" rx="12" fill="#ffffff" filter="url(#shadowLight)" stroke="#d0d8e0" stroke-width="1" opacity="0.9"/>
  <text x="120" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Cebirsel Veri Tipleri</text>
  <line x1="50" y1="172" x2="190" y2="172" stroke="#d0d8e0" stroke-width="1"/>

  <circle cx="50" cy="188" r="4" fill="#7fb3d3"/>
  <text x="62" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a">Toplam tip: alternatifler</text>

  <circle cx="50" cy="208" r="4" fill="#7fb3d3"/>
  <text x="62" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a">Çarpım tip: birlikte taşıma</text>

  <circle cx="50" cy="228" r="4" fill="#7fb3d3"/>
  <text x="62" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a">Örüntü: değeri parçalama</text>

  <!-- Derleyici Bileşenleri -->
  <rect x="240" y="145" width="240" height="95" rx="12" fill="#ffffff" filter="url(#shadowLight)" stroke="#d0d8e0" stroke-width="1" opacity="0.9"/>
  <text x="360" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Derleyici Bileşenleri</text>
  <line x1="260" y1="172" x2="460" y2="172" stroke="#d0d8e0" stroke-width="1"/>

  <text x="260" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a">• TestTag: kurucu kontrolü</text>
  <text x="260" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a">• Unpack: alanları yığına aç</text>
  <text x="260" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a">• FailMatch: eksik dal hatası</text>

  <!-- Etiketler arası bağlantı -->
  <line x1="210" y1="130" x2="210" y2="145" stroke="#b0c4de" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="360" y1="130" x2="360" y2="145" stroke="#b0c4de" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="565" y1="130" x2="565" y2="140" stroke="#b0c4de" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a8a9a" opacity="0.8">Kaynak → AST → Örüntü Eşleme → Kod Üretimi → Yığın Makinesi</text>
</svg>