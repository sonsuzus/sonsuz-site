<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">PHP + Regex Metin Madenciliği</text>
  <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Kalıpları Yakala, İçerik Üret</text>

  <!-- Akış okları -->
  <line x1="125" y1="155" x2="143" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="275" y1="155" x2="293" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="155" x2="433" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="155" x2="553" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Aşama 1: Ham Metin -->
  <rect x="15" y="115" width="110" height="80" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Ham Metin</text>
  <text x="70" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">log / HTML</text>
  <text x="70" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">yorum / veri</text>

  <!-- Aşama 2: Kalıp Tanımla -->
  <rect x="145" y="115" width="130" height="80" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Kalıp Tanımla</text>
  <text x="210" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">/[A-Z0-9._+-]+/i</text>
  <text x="210" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">x+ = n≥1</text>

  <!-- Aşama 3: PCRE Motoru -->
  <rect x="295" y="115" width="120" height="80" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">PCRE Motoru</text>
  <text x="355" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">M(T,P)</text>
  <text x="355" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">eşleşme yakala</text>

  <!-- Aşama 4: preg_* -->
  <rect x="435" y="115" width="105" height="80" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="487" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">preg_*</text>
  <text x="487" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">match / all</text>
  <text x="487" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">replace / split</text>

  <!-- Aşama 5: Çıktı -->
  <rect x="555" y="115" width="80" height="80" rx="12" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="595" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Çıktı</text>
  <text x="595" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">özet</text>
  <text x="595" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">etiket</text>

  <!-- Alt panel başlığı -->
  <text x="320" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#475569">Desen Davranışları</text>

  <!-- Alt panel kartları -->
  <rect x="20" y="245" width="180" height="60" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#431407">Açgözlü <tspan font-family="monospace">.*</tspan></text>
  <text x="110" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c2d12">en uzun eşleşme</text>

  <rect x="230" y="245" width="180" height="60" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#431407">Tembel <tspan font-family="monospace">.*?</tspan></text>
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c2d12">en yakın durur</text>

  <rect x="440" y="245" width="180" height="60" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#431407">Yakalama <tspan font-family="monospace">(.*?)</tspan></text>
  <text x="530" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c2d12">yalnızca içerik</text>
</svg>