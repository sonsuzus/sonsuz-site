<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9e7"/>
      <stop offset="100%" stop-color="#fdf2d0"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafaf1"/>
      <stop offset="100%" stop-color="#d5f5e3"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdedec"/>
      <stop offset="100%" stop-color="#fadbd8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">JavaScript For Döngüsü</text>

  <!-- Merkez düğüm -->
  <rect x="255" y="55" width="130" height="45" rx="12" fill="url(#boxGrad1)" stroke="#85c1e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="82" text-anchor="middle" font-weight="bold" fill="#1a5276">Döngü Tipleri</text>

  <!-- Ok: Merkez -> For -->
  <path d="M 320 100 L 320 125" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="315,123 320,133 325,123" fill="#5d6d7e"/>

  <!-- For ana kutusu -->
  <rect x="225" y="135" width="190" height="55" rx="14" fill="url(#boxGrad2)" stroke="#f0b27a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="158" text-anchor="middle" font-weight="bold" fill="#7e5109">for</text>
  <text x="320" y="175" text-anchor="middle" fill="#7e5109">(bölüm 1; bölüm 2; bölüm 3)</text>

  <!-- Ok: For -> Bölüm 1 -->
  <path d="M 225 162 L 175 162" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="180,157 170,162 180,167" fill="#5d6d7e"/>

  <!-- Bölüm 1 kutusu -->
  <rect x="45" y="140" width="125" height="45" rx="10" fill="url(#boxGrad3)" stroke="#82e0aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="107" y="160" text-anchor="middle" font-weight="bold" fill="#145a32">Bölüm 1</text>
  <text x="107" y="175" text-anchor="middle" fill="#145a32">Başlangıç</text>

  <!-- Ok: For -> Bölüm 2 -->
  <path d="M 415 162 L 465 162" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="460,157 470,162 460,167" fill="#5d6d7e"/>

  <!-- Bölüm 2 kutusu -->
  <rect x="470" y="140" width="125" height="45" rx="10" fill="url(#boxGrad3)" stroke="#82e0aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="532" y="160" text-anchor="middle" font-weight="bold" fill="#145a32">Bölüm 2</text>
  <text x="532" y="175" text-anchor="middle" fill="#145a32">Koşul</text>

  <!-- Ok: For -> Bölüm 3 -->
  <path d="M 320 190 L 320 215" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="315,213 320,223 325,213" fill="#5d6d7e"/>

  <!-- Bölüm 3 kutusu -->
  <rect x="245" y="225" width="150" height="45" rx="10" fill="url(#boxGrad3)" stroke="#82e0aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="245" text-anchor="middle" font-weight="bold" fill="#145a32">Bölüm 3</text>
  <text x="320" y="260" text-anchor="middle" fill="#145a32">Artırım</text>

  <!-- Ok: Bölüm 2 -> Kod Bloğu -->
  <path d="M 532 185 L 532 250 L 470 250" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="475,245 465,250 475,255" fill="#5d6d7e"/>

  <!-- Kod bloğu kutusu -->
  <rect x="345" y="230" width="120" height="40" rx="10" fill="url(#boxGrad4)" stroke="#f1948a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="405" y="254" text-anchor="middle" font-weight="bold" fill="#922b21">Kod Bloğu</text>

  <!-- Döngü oku (geri dönüş) -->
  <path d="M 405 270 L 405 290 L 60 290 L 60 185 L 100 185" stroke="#5d6d7e" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <polygon points="95,180 105,185 95,190" fill="#5d6d7e"/>

  <!-- Alt açıklama -->
  <text x="320" y="310" text-anchor="middle" fill="#7f8c8d" font-size="11">Koşul true olduğu sürece kod bloğu tekrarlanır</text>
</svg>