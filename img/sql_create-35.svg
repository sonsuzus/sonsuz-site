<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">SQL CREATE Komutları</text>

  <!-- Merkez: CREATE DATABASE -->
  <rect x="220" y="55" width="200" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">CREATE DATABASE</text>
  <text x="320" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">dbase_temel</text>

  <!-- Ok: DATABASE -> TABLE -->
  <path d="M 320 105 L 320 135" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="315,132 320,142 325,132" fill="#64748b"/>

  <!-- CREATE TABLE -->
  <rect x="220" y="142" width="200" height="50" rx="12" fill="url(#box2)" filter="url(#shadow)" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="320" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">CREATE TABLE</text>
  <text x="320" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">personel</text>

  <!-- Ok: TABLE -> COLUMNS -->
  <path d="M 320 192 L 320 215" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="315,212 320,222 325,212" fill="#64748b"/>

  <!-- Sütunlar -->
  <rect x="100" y="222" width="440" height="80" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1.5" opacity="0.9"/>

  <!-- Sütun etiketleri -->
  <rect x="115" y="235" width="72" height="28" rx="8" fill="url(#box3)" stroke="#86efac" stroke-width="1"/>
  <text x="151" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#166534">Adi</text>

  <rect x="197" y="235" width="72" height="28" rx="8" fill="url(#box3)" stroke="#86efac" stroke-width="1"/>
  <text x="233" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#166534">Soyadi</text>

  <rect x="279" y="235" width="72" height="28" rx="8" fill="url(#box3)" stroke="#86efac" stroke-width="1"/>
  <text x="315" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#166534">Gorevi</text>

  <rect x="361" y="235" width="82" height="28" rx="8" fill="url(#box3)" stroke="#86efac" stroke-width="1"/>
  <text x="402" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#166534">Memleketi</text>

  <rect x="453" y="235" width="72" height="28" rx="8" fill="url(#box3)" stroke="#86efac" stroke-width="1"/>
  <text x="489" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#166534">DTarihi</text>

  <!-- Veri türleri -->
  <text x="151" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">varchar(30)</text>
  <text x="233" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">varchar(30)</text>
  <text x="315" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">varchar(30)</text>
  <text x="402" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">varchar(30)</text>
  <text x="489" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">date</text>

  <!-- INSERT INTO (sağ alt) -->
  <rect x="470" y="55" width="140" height="40" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="540" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#831843">INSERT INTO</text>
  <text x="540" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b21a8">yeni kayıt ekle</text>

  <!-- Ok: INSERT -> TABLE -->
  <path d="M 470 95 C 430 110, 380 120, 330 138" stroke="#64748b" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
  <polygon points="325,135 332,142 337,133" fill="#64748b"/>

  <!-- Sol üst bilgi -->
  <rect x="30" y="55" width="150" height="40" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="105" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#78350f">CREATE Komutu</text>
  <text x="105" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#92400e">veritabanı ve tablo</text>

  <!-- Ok: sol üst -> DATABASE -->
  <path d="M 180 75 C 195 75, 205 75, 218 78" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="215,73 224,80 216,84" fill="#64748b"/>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#94a3b8">SQL Programlama - Veri Tabanı Oluşturma</text>
</svg>