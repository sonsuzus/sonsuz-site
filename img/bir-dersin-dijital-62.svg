    <circle cx="242" cy="151" r="6" fill="#9cbce6"/>
    <text x="266" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d5b76">Ders kaydı</text>

    <circle cx="340" cy="151" r="6" fill="#e6b779"/>
    <text x="364" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b5230">Etkinlik</text>

    <circle cx="242" cy="208" r="6" fill="#c693d8"/>
    <text x="267" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#654474">Yetki</text>

    <circle cx="340" cy="208" r="6" fill="#8fc5a1"/>
    <text x="367" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f694d">Dosya API</text>
  </g>

  <!-- Merkezden sağ akış -->
  <path d="M432 130 H455 V104 H472" fill="none" stroke="#779ca1" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472 104 L463 98 L463 110 Z" fill="#779ca1"/>
  <path d="M432 183 H455 V161 H472" fill="none" stroke="#779ca1" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472 161 L463 155 L463 167 Z" fill="#779ca1"/>
  <path d="M432 229 H455 V223 H472" fill="none" stroke="#779ca1" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472 223 L463 217 L463 229 Z" fill="#779ca1"/>

  <!-- Sağ sonuç alanları -->
  <g filter="url(#shadow)">
    <rect x="478" y="72" width="132" height="64" rx="17" fill="#fff8e9"/>
    <circle cx="503" cy="104" r="15" fill="#f2c980"/>
    <path d="M496 105 L501 110 L510 98" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="555" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#75562a">Değerlendirme</text>
    <text x="555" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7048">Puanlama</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="478" y="143" width="132" height="64" rx="17" fill="#f4ebfb"/>
    <circle cx="503" cy="175" r="15" fill="#c99cdd"/>
    <path d="M496 180 H510 M498 175 H508 M501 170 H505" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="555" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#684677">Not defteri</text>
    <text x="555" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#84648f">Birleştirme</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="478" y="214" width="132" height="64" rx="17" fill="#e9f7ee"/>
    <circle cx="503" cy="246" r="15" fill="#91c8a2"/>
    <path d="M496 246 L501 251 L510 240" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="555" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#426e50">Tamamlama</text>
    <text x="555" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668372">İlerleme</text>
  </g>

  <!-- Alttaki olay hattı -->
  <path d="M358 257 V285 H476" fill="none" stroke="#7b92ac" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <path d="M476 285 L467 279 L467 291 Z" fill="#7b92ac"/>
  <rect x="253" y="274" width="111" height="25" rx="12" fill="#ffffff" filter="url(#smallShadow)"/>
  <text x="308" y="291" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536c86">İşlem ve olay</text>
  <rect x="481" y="273" width="111" height="25" rx="12" fill="#ffffff" filter="url(#smallShadow)"/>
  <text x="536" y="291" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536c86">Arka plan görevi</text>
</svg>