<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d9f2e2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#70829a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#70829a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="71" cy="46" r="58" fill="#dceeff" opacity="0.5"/>
  <circle cx="587" cy="277" r="78" fill="#dff3df" opacity="0.52"/>
  <path d="M45 270 C125 235, 153 297, 225 277 S364 237, 423 273 S531 302, 603 244" fill="none" stroke="#b7d9d5" stroke-width="2" opacity="0.42"/>

  <!-- Sol: öğrenme girdisi -->
  <g filter="url(#shadow)">
    <rect x="28" y="105" width="126" height="108" rx="20" fill="#ffffff"/>
    <rect x="28" y="105" width="126" height="31" rx="20" fill="#ddecff"/>
    <path d="M28 126 H154" stroke="#c6daf2"/>
    <circle cx="53" cy="158" r="13" fill="#8eb8ef"/>
    <path d="M47 158 L51 162 L59 153" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="74" y="149" width="57" height="8" rx="4" fill="#c8dcf3"/>
    <rect x="74" y="164" width="43" height="7" rx="3.5" fill="#e1ebf7"/>
    <rect x="45" y="186" width="90" height="10" rx="5" fill="#eaf3ff"/>
    <text x="91" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#345372">Öğrenci işlemi</text>
    <text x="91" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54708b">Sınav ve teslim</text>
  </g>

  <!-- Manuel ok sol-orta -->
  <path d="M160 159 H199" fill="none" stroke="#6e95b4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M199 159 L190 153 L190 165 Z" fill="#6e95b4"/>
  <text x="179" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66819b">doğrula</text>

  <!-- Merkez çekirdek -->
  <g filter="url(#shadow)">
    <rect x="205" y="66" width="220" height="188" rx="28" fill="url(#core)" stroke="#b9d9d5" stroke-width="1.2"/>
    <rect x="225" y="84" width="180" height="35" rx="13" fill="#ffffff" opacity="0.88"/>
    <circle cx="247" cy="101" r="10" fill="#91c4af"/>
    <path d="M243 101 H251 M247 97 V105" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="316" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#315c55">Modüler LMS çekirdeği</text>

    <g filter="url(#smallShadow)">
      <rect x="225" y="134" width="82" height="43" rx="12" fill="#fffdf7"/>
      <rect x="323" y="134" width="82" height="43" rx="12" fill="#fffdf7"/>
      <rect x="225" y="191" width="82" height="43" rx="12" fill="#fffdf7"/>
      <rect x="323" y="191" width="82" height="43" rx="12" fill="#fffdf7"/>
