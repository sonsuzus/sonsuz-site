<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fc9ee"/>
      <stop offset="100%" stop-color="#75aee0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7290a0" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78909c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M34 265 C128 224 158 293 247 265 S394 230 475 267 S560 280 618 235" fill="none" stroke="#d9eadf" stroke-width="2" opacity="0.7"/>
  <circle cx="320" cy="160" r="105" fill="#ffffff" opacity="0.35"/>
  <circle cx="320" cy="160" r="82" fill="none" stroke="#b7d4df" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- Akış halkası -->
  <path d="M267 104 C300 75 350 79 379 111" fill="none" stroke="#6e9ec4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="381,104 391,116 376,117" fill="#6e9ec4"/>
  <path d="M394 131 C410 165 397 203 367 220" fill="none" stroke="#75a990" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="374,225 358,224 366,211" fill="#75a990"/>
  <path d="M342 231 C305 246 264 231 248 199" fill="none" stroke="#cb9a70" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="241,202 245,186 256,198" fill="#cb9a70"/>
  <path d="M238 177 C229 146 241 119 263 105" fill="none" stroke="#a88ac4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="259,113 267,99 251,102" fill="#a88ac4"/>

  <!-- Üst: hareket -->
  <g filter="url(#softShadow)">
    <rect x="230" y="29" width="180" height="54" rx="17" fill="#eee8f7"/>
    <circle cx="258" cy="56" r="15" fill="#b89bd1"/>
    <path d="M252 57 L258 51 L264 57 M258 51 L258 64" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="282" y="53" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4d4160">Hareket Tahmini</text>
    <text x="282" y="69" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#756887">Kontrol girdisi</text>
  </g>

  <!-- Sağ: ölçüm -->
  <g filter="url(#softShadow)">
    <rect x="445" y="108" width="160" height="61" rx="17" fill="#e1f2e8"/>
    <circle cx="473" cy="138" r="15" fill="#82b99a"/>
    <path d="M466 142 L471 136 L475 139 L481 132" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="497" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3f6852">Ölçüm Eşleştirme</text>
    <text x="497" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668574">Sensör verisi</text>
  </g>

  <!-- Alt: düzeltme -->
  <g filter="url(#softShadow)">
    <rect x="227" y="242" width="187" height="53" rx="17" fill="#fff0dc"/>
    <circle cx="255" cy="268" r="15" fill="#dfa66e"/>
    <path d="M248 268 L253 273 L263 262" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="279" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#765238">Düzeltme</text>
    <text x="279" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#987259">Belirsizlik azaltma</text>
  </g>

  <!-- Sol: harita -->
  <g filter="url(#softShadow)">
    <rect x="35" y="108" width="159" height="61" rx="17" fill="#e3f1f8"/>
    <circle cx="63" cy="138" r="15" fill="#83bed8"/>
    <path d="M56 132 L61 130 L66 133 L71 131 L71 144 L66 146 L61 143 L56 145 Z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="87" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3e6476">Harita</text>
    <text x="87" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668391">Özellik noktaları</text>
  </g>

  <!-- Bağlantılar -->
  <path d="M194 138 L218 138" stroke="#89b4c9" stroke-width="2" stroke-linecap="round"/>
  <polygon points="221,138 213,133 213,143" fill="#89b4c9"/>
  <path d="M410 56 L426 56 L426 109" fill="none" stroke="#b09ac7" stroke-width="2" stroke-linecap="round"/>
  <polygon points="426,112 421,104 431,104" fill="#b09ac7"/>
  <path d="M445 169 L425 169 L425 215 L412 215" fill="none" stroke="#8fb99e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="409,215 417,210 417,220" fill="#8fb99e"/>
  <path d="M227 268 L211 268 L211 170" fill="none" stroke="#d5a276" stroke-width="2" stroke-linecap="round"/>
  <polygon points="211,167 206,175 216,175" fill="#d5a276"/>

  <!-- Merkez robot -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="160" r="51" fill="url(#core)"/>
    <circle cx="320" cy="160" r="44" fill="none" stroke="#dff3ff" stroke-width="1.5" opacity="0.8"/>
    <rect x="299" y="145" width="42" height="29" rx="9" fill="#ffffff"/>
    <circle cx="309" cy="178" r="5" fill="#456e91"/>
    <circle cx="331" cy="178" r="5" fill="#456e91"/>
    <path d="M306 145 L312 136 L328 136 L334 145" fill="#d7edf9" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="313" cy="158" r="3" fill="#75aee0"/>
    <circle cx="327" cy="158" r="3" fill="#75aee0"/>
    <path d="M315 167 L325 167" stroke="#75aee0" stroke-width="2" stroke-linecap="round"/>
    <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345b7a">ROBOT</text>
  </g>

  <!-- Sensör ışınları -->
  <path d="M293 151 L267 137 M292 159 L263 159 M347 151 L373 137 M348 159 L378 159" stroke="#ffffff" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
  <circle cx="263" cy="159" r="2.5" fill="#ffffff"/>
  <circle cx="378" cy="159" r="2.5" fill="#ffffff"/>
</svg>