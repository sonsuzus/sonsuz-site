    <text x="438" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#277250">Parçalar</text>
    <path d="M410 142 Q412 119 425 126 Q438 112 451 126 Q464 119 466 142 Q457 160 438 163 Q419 160 410 142Z" fill="#f0fdf4" stroke="#54a979" stroke-width="2"/>
