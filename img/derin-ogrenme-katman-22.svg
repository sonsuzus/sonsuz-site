    <path d="M286 166 Q297 147 308 166 Q319 147 331 166 Q342 147 353 166" fill="none" stroke="#d99a3d" stroke-width="2.5" stroke-linecap="round"/>
    <text x="319" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#92672e">Orta katman</text>
  </g>

