    <rect x="525" y="131" width="76" height="16" rx="8" fill="#d1fae5"/>
    <rect x="525" y="155" width="55" height="16" rx="8" fill="#e0e7ff"/>
    <text x="532" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#277250">Kedi</text>
    <text x="532" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53659a">Köpek</text>
