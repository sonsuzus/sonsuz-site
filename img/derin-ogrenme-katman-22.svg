  <circle cx="572" cy="263" r="95" fill="#d1fae5" opacity="0.28"/>

  <text x="28" y="28" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334155">Katman Katman Özellik Keşfi</text>
  <text x="28" y="45" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">ham veriden anlamlı karara</text>

