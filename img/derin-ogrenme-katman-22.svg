  <path d="M562 207 C562 247 434 258 323 258 C211 258 156 250 156 216" fill="none" stroke="#7b8798" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
  <polygon points="156,216 151,224 161,223" fill="#7b8798"/>

  <g filter="url(#softShadow)">
