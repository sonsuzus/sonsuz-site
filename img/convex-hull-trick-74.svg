<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4f0ff"/>
      <stop offset="100%" stop-color="#d3e8fb"/>
    </linearGradient>
    <linearGradient id="cardMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f7ed"/>
      <stop offset="100%" stop-color="#cdeede"/>
    </linearGradient>
    <linearGradient id="cardPeach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0df"/>
      <stop offset="100%" stop-color="#ffe2bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5e7890" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#526f83" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="42" r="54" fill="#dcefff" opacity="0.58"/>
  <circle cx="584" cy="276" r="74" fill="#dff4e7" opacity="0.62"/>
  <circle cx="343" cy="25" r="18" fill="#fff2cf" opacity="0.7"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35516a">Convex Hull Trick ile DP Optimizasyonu</text>

  <g filter="url(#shadow)">
    <rect x="28" y="78" width="150" height="168" rx="19" fill="url(#cardBlue)"/>
  </g>
  <text x="103" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294b66">DP Durumları</text>
  <text x="103" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53718a">önceki j değerleri</text>

  <g filter="url(#softShadow)">
    <rect x="51" y="143" width="104" height="31" rx="10" fill="#ffffff"/>
    <rect x="51" y="183" width="104" height="31" rx="10" fill="#ffffff"/>
  </g>
  <text x="103" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35516a">dp[j] + b[j]</text>
  <text x="103" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35516a">eğim: m[j]</text>

  <path d="M181 162 C195 162 199 162 211 162" fill="none" stroke="#7892a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="211,162 202,157 202,167" fill="#7892a6"/>

  <g filter="url(#shadow)">
    <rect x="216" y="57" width="210" height="205" rx="21" fill="#ffffff"/>
  </g>
  <text x="321" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31556b">Alt Zarf ve Doğru Kuyruğu</text>

  <line x1="246" y1="228" x2="398" y2="228" stroke="#9aafbb" stroke-width="1.5"/>
  <line x1="262" y1="104" x2="262" y2="239" stroke="#9aafbb" stroke-width="1.5"/>
  <text x="402" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e8796">x</text>
  <text x="250" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e8796">y</text>

  <path d="M267 125 L393 209" fill="none" stroke="#b8c4d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M267 154 L393 119" fill="none" stroke="#c9b5d7" stroke-width="3" stroke-linecap="round"/>
  <path d="M267 213 L393 144" fill="none" stroke="#9cccb4" stroke-width="3" stroke-linecap="round"/>

  <path d="M267 213 L310 190 L345 163 L393 144" fill="none" stroke="#277d65" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="310" cy="190" r="4.5" fill="#ffffff" stroke="#277d65" stroke-width="2"/>
  <circle cx="345" cy="163" r="4.5" fill="#ffffff" stroke="#277d65" stroke-width="2"/>
  <text x="324" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#26705d">yalnız kazanan doğrular</text>

  <g filter="url(#softShadow)">
    <rect x="236" y="274" width="170" height="27" rx="11" fill="url(#cardMint)"/>
  </g>
  <text x="321" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#29624f">Gereksiz doğru silinir</text>

  <path d="M429 162 C443 162 449 162 462 162" fill="none" stroke="#7892a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="462,162 453,157 453,167" fill="#7892a6"/>

  <g filter="url(#shadow)">
    <rect x="467" y="78" width="145" height="168" rx="19" fill="url(#cardPeach)"/>
  </g>
  <text x="539.5" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#754c32">Nokta Sorgusu</text>

  <g filter="url(#softShadow)">
    <rect x="490" y="125" width="99" height="34" rx="11" fill="#ffffff"/>
    <rect x="490" y="174" width="99" height="34" rx="11" fill="#ffffff"/>
  </g>
  <text x="539.5" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76543d">x[i] girer</text>
  <text x="539.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76543d">en küçük değer</text>

  <path d="M540 160 L540 170" fill="none" stroke="#bf8b58" stroke-width="2"/>
  <polygon points="540,174 535,166 545,166" fill="#bf8b58"/>

  <g filter="url(#softShadow)">
    <rect x="477" y="263" width="125" height="31" rx="13" fill="#d7f0e0"/>
  </g>
  <text x="539.5" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#277052">O(n²) → O(n log n)</text>
</svg>