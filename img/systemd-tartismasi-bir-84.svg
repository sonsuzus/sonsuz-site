<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e4fc"/>
    </linearGradient>
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3e8"/>
      <stop offset="100%" stop-color="#fde8d4"/>
    </linearGradient>
    <linearGradient id="gradCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f8f0"/>
      <stop offset="100%" stop-color="#d0f0e0"/>
    </linearGradient>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#f0e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="170" y="12" width="300" height="30" rx="15" fill="url(#gradTop)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a3a5a">Systemd Tartışması</text>

  <!-- Sol taraf: Klasik Init -->
  <rect x="30" y="60" width="180" height="110" rx="10" fill="url(#gradLeft)" filter="url(#shadow)" opacity="0.95"/>
  <text x="120" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e6b">Klasik Init</text>
  <line x1="50" y1="90" x2="190" y2="90" stroke="#2c3e6b" stroke-width="0.5" opacity="0.3"/>

  <circle cx="55" cy="108" r="4" fill="#5b7bb5" opacity="0.8"/>
  <text x="68" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a4a6b">Kabuk betikleri</text>

  <circle cx="55" cy="128" r="4" fill="#5b7bb5" opacity="0.8"/>
  <text x="68" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a4a6b">Sıralı başlatma</text>

  <circle cx="55" cy="148" r="4" fill="#5b7bb5" opacity="0.8"/>
  <text x="68" y="152" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a4a6b">Dağınık günlükler</text>

  <!-- Sağ taraf: Systemd -->
  <rect x="430" y="60" width="180" height="110" rx="10" fill="url(#gradRight)" filter="url(#shadow)" opacity="0.95"/>
  <text x="520" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6b3a2c">Systemd</text>
  <line x1="450" y1="90" x2="590" y2="90" stroke="#6b3a2c" stroke-width="0.5" opacity="0.3"/>

  <circle cx="455" cy="108" r="4" fill="#c47a5b" opacity="0.8"/>
  <text x="468" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a3a2a">Birim dosyaları</text>

  <circle cx="455" cy="128" r="4" fill="#c47a5b" opacity="0.8"/>
  <text x="468" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a3a2a">Paralel başlatma</text>

  <circle cx="455" cy="148" r="4" fill="#c47a5b" opacity="0.8"/>
  <text x="468" y="152" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a3a2a">Merkezi günlükler</text>

  <!-- Merkez: Çatışma -->
  <rect x="255" y="75" width="130" height="80" rx="12" fill="url(#gradCenter)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a5a4a">İdeolojik Çatışma</text>
  <line x1="275" y1="105" x2="365" y2="105" stroke="#2a5a4a" stroke-width="0.5" opacity="0.3"/>

  <text x="320" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a6a5a">Özgürlük</text>
  <text x="320" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a6a5a">Kontrol</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol -> Merkez -->
  <path d="M210 120 L245 115" stroke="#5b7bb5" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polygon points="248,114.5 238,111 240,118.5" fill="#5b7bb5" opacity="0.7"/>

  <!-- Sağ -> Merkez -->
  <path d="M430 120 L395 115" stroke="#c47a5b" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polygon points="392,114.5 400,111 398,118.5" fill="#c47a5b" opacity="0.7"/>

  <!-- Alt bölüm: Sosyolojik eksenler -->
  <rect x="30" y="195" width="580" height="105" rx="10" fill="#ffffff" filter="url(#shadowLight)" opacity="0.85"/>

  <text x="320" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a4a6a">Sosyolojik Eksenler</text>

  <!-- Eksen 1 -->
  <rect x="50" y="225" width="120" height="25" rx="6" fill="#e8f0fe" opacity="0.9"/>
  <text x="110" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a4a6b">Standardizasyon</text>

  <rect x="180" y="225" width="120" height="25" rx="6" fill="#fef3e8" opacity="0.9"/>
  <text x="240" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b3a2c">Çeşitlilik kaybı</text>

  <!-- Eksen 2 -->
  <rect x="50" y="258" width="120" height="25" rx="6" fill="#e8f0fe" opacity="0.9"/>
  <text x="110" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a4a6b">Entegrasyon</text>

  <rect x="180" y="258" width="120" height="25" rx="6" fill="#fef3e8" opacity="0.9"/>
  <text x="240" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b3a2c">Merkezileşme</text>

  <!-- Eksen 3 -->
  <rect x="340" y="225" width="120" height="25" rx="6" fill="#e8f0fe" opacity="0.9"/>
  <text x="400" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a4a6b">Hızlı öğrenme</text>

  <rect x="470" y="225" width="120" height="25" rx="6" fill="#fef3e8" opacity="0.9"/>
  <text x="530" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b3a2c">Gizli karmaşıklık</text>

  <!-- Eksen 4 -->
  <rect x="340" y="258" width="120" height="25" rx="6" fill="#e8f0fe" opacity="0.9"/>
  <text x="400" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a4a6b">Kolay bakım</text>

  <rect x="470" y="258" width="120" height="25" rx="6" fill="#fef3e8" opacity="0.9"/>
  <text x="530" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b3a2c">Güç tekeli</text>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a6a8a" opacity="0.7">Teknik fayda - Algılanan risk + Kimlik uyumu = Tutum</text>

</svg>