<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="pointerCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f3"/>
      <stop offset="100%" stop-color="#ffe9e4"/>
    </linearGradient>
    <linearGradient id="noScanCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#effaf5"/>
      <stop offset="100%" stop-color="#dff4e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#61768c" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#61768c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="67" cy="37" r="55" fill="#dceefb" opacity="0.48"/>
  <circle cx="595" cy="277" r="76" fill="#dcefdc" opacity="0.45"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385168">Go GC: İşaretçi Tarama Maliyeti</text>

  <!-- Left pointer-heavy model -->
  <g filter="url(#shadow)">
    <rect x="28" y="51" width="215" height="189" rx="18" fill="url(#pointerCard)" stroke="#f0b9af"/>
  </g>
  <rect x="45" y="67" width="114" height="25" rx="12" fill="#f6c5bc"/>
  <text x="102" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9b4f49">İşaretçili Struct</text>

  <g filter="url(#smallShadow)">
    <rect x="47" y="108" width="110" height="108" rx="12" fill="#ffffff" stroke="#f0c6bd"/>
  </g>
  <text x="61" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#536575">Event</text>
  <line x1="59" y1="136" x2="145" y2="136" stroke="#dce4e8"/>
  <text x="61" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536575">ID: uint64</text>
  <text x="61" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b1534b">User: string</text>
  <text x="61" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b1534b">Payload: slice</text>
  <text x="61" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536575">Active: bool</text>

  <path d="M157 170 C171 170 172 145 184 145" fill="none" stroke="#d66e64" stroke-width="2"/>
  <polygon points="183,140 193,145 183,150" fill="#d66e64"/>
  <path d="M157 190 C171 190 172 202 184 202" fill="none" stroke="#d66e64" stroke-width="2"/>
  <polygon points="183,197 193,202 183,207" fill="#d66e64"/>

  <g filter="url(#smallShadow)">
    <rect x="193" y="126" width="33" height="38" rx="8" fill="#fff" stroke="#efc6be"/>
    <rect x="193" y="183" width="33" height="38" rx="8" fill="#fff" stroke="#efc6be"/>
  </g>
  <line x1="201" y1="139" x2="218" y2="139" stroke="#e6a097" stroke-width="3" stroke-linecap="round"/>
  <line x1="201" y1="149" x2="214" y2="149" stroke="#e6a097" stroke-width="3" stroke-linecap="round"/>
  <line x1="201" y1="195" x2="218" y2="195" stroke="#e6a097" stroke-width="3" stroke-linecap="round"/>
  <line x1="201" y1="205" x2="218" y2="205" stroke="#e6a097" stroke-width="3" stroke-linecap="round"/>
  <text x="136" y="231" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a65750">GC bağlantıları tarar</text>

  <!-- central GC -->
  <path d="M249 145 L287 145" fill="none" stroke="#7d8e9c" stroke-width="2"/>
  <polygon points="286,140 296,145 286,150" fill="#7d8e9c"/>
  <path d="M390 145 L398 145" fill="none" stroke="#7d8e9c" stroke-width="2"/>
  <polygon points="397,140 407,145 397,150" fill="#7d8e9c"/>

  <g filter="url(#shadow)">
    <circle cx="343" cy="145" r="49" fill="#e9efff" stroke="#b9c9ed" stroke-width="2"/>
  </g>
  <circle cx="343" cy="145" r="31" fill="#d5e2ff"/>
  <path d="M343 121 A24 24 0 1 1 323 134" fill="none" stroke="#5f7ec0" stroke-width="3" stroke-linecap="round"/>
  <polygon points="319,129 329,130 324,138" fill="#5f7ec0"/>
  <text x="343" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#455e91">GC</text>
  <text x="343" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#61758b">Tarama</text>

  <!-- Right noscan model -->
  <g filter="url(#shadow)">
    <rect x="404" y="51" width="208" height="189" rx="18" fill="url(#noScanCard)" stroke="#acdabe"/>
  </g>
  <rect x="421" y="67" width="120" height="25" rx="12" fill="#bde7cf"/>
  <text x="481" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#287255">Pointersız Struct</text>

  <g filter="url(#smallShadow)">
    <rect x="425" y="108" width="166" height="108" rx="12" fill="#ffffff" stroke="#bfe1cd"/>
  </g>
  <text x="440" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#536575">Event</text>
  <line x1="438" y1="136" x2="577" y2="136" stroke="#dcebe3"/>
  <text x="440" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536575">ID: uint64</text>
  <text x="440" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35775d">User: [32]byte</text>
  <text x="440" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35775d">Payload: [256]byte</text>
  <text x="440" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536575">Uzunluk ve durum</text>

  <circle cx="573" cy="124" r="10" fill="#d8f2e3"/>
  <path d="M568 124 L572 128 L579 119" fill="none" stroke="#369064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="445" y="223" width="123" height="20" rx="10" fill="#d7f1e2"/>
  <text x="506" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#287255">noscan: iç tarama yok</text>

  <!-- bottom tradeoff -->
  <g filter="url(#shadow)">
    <rect x="118" y="265" width="404" height="37" rx="16" fill="#ffffff" stroke="#d7e4e6"/>
  </g>
  <circle cx="144" cy="283.5" r="10" fill="#f7d7a7"/>
  <path d="M144 277 L144 284 L149 287" fill="none" stroke="#a66d23" stroke-width="2" stroke-linecap="round"/>
  <text x="164" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536575">Daha az GC taraması</text>
  <path d="M284 284 L310 284" fill="none" stroke="#9dacb6" stroke-width="2"/>
  <polygon points="309,279 319,284 309,289" fill="#9dacb6"/>
  <text x="337" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536575">Daha fazla sabit bellek</text>
</svg>