<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#3b5b7a" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3fa"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#dce8f5"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="100%" stop-color="#e3f0e3"/>
    </linearGradient>
    <linearGradient id="boxChild" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7f0"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a9bd8"/>
      <stop offset="100%" stop-color="#4a8f6a"/>
    </linearGradient>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" rx="16" fill="url(#bg)"/>

  <!-- Başlık çubuğu -->
  <rect x="160" y="12" width="320" height="30" rx="8" fill="#4a7a9b" opacity="0.85"/>
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Paralel Boru Hattı</text>

  <!-- Kaynak dosya kutusu -->
  <rect x="20" y="70" width="110" height="40" rx="10" fill="url(#box1)" stroke="#7fa8c9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="75" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c4a6e" font-weight="bold">metin.txt</text>
  <text x="75" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">satırlar</text>

  <!-- Ana proses kutusu -->
  <rect x="190" y="60" width="130" height="55" rx="12" fill="url(#box1)" stroke="#4a7a9b" stroke-width="2" filter="url(#shadow)"/>
  <text x="255" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5a" font-weight="bold">Ana Proses</text>
  <text x="255" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7a">fork + pipe + wait</text>

  <!-- Pipe hattı çizgisi -->
  <line x1="130" y1="90" x2="190" y2="85" stroke="#6a9bd8" stroke-width="2" opacity="0.7"/>

  <!-- Ok ucu: kaynak -> ana -->
  <polygon points="192,85 182,80 182,90" fill="#6a9bd8"/>

  <!-- Child process kutuları -->
  <!-- row 1 -->
  <rect x="80" y="170" width="90" height="40" rx="8" fill="url(#boxChild)" stroke="#5a9a7a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="125" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a6a4a" font-weight="bold">Child 1</text>
  <text x="125" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a6a">satır 1</text>

  <rect x="230" y="170" width="90" height="40" rx="8" fill="url(#boxChild)" stroke="#5a9a7a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="275" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a6a4a" font-weight="bold">Child 2</text>
  <text x="275" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a6a">satır 2</text>

  <rect x="380" y="170" width="90" height="40" rx="8" fill="url(#boxChild)" stroke="#5a9a7a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a6a4a" font-weight="bold">Child 3</text>
  <text x="425" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a6a">satır 3</text>

  <rect x="530" y="170" width="90" height="40" rx="8" fill="url(#boxChild)" stroke="#5a9a7a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="575" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a6a4a" font-weight="bold">Child n</text>
  <text x="575" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a6a">satır n</text>

  <!-- Bağlantı çizgileri: ana -> child -->
  <line x1="220" y1="115" x2="125" y2="168" stroke="#7aa8d8" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="250" y1="115" x2="275" y2="168" stroke="#7aa8d8" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="270" y1="115" x2="425" y2="168" stroke="#7aa8d8" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="290" y1="115" x2="575" y2="168" stroke="#7aa8d8" stroke-width="1.8" stroke-dasharray="5,3"/>

  <!-- Ok uçları -->
  <polygon points="125,168 132,164 130,172" fill="#7aa8d8"/>
  <polygon points="275,168 282,164 280,172" fill="#7aa8d8"/>
  <polygon points="425,168 432,164 430,172" fill="#7aa8d8"/>
  <polygon points="575,168 582,164 580,172" fill="#7aa8d8"/>

  <!-- Sistem çağrıları etiketi -->
  <rect x="20" y="245" width="150" height="60" rx="10" fill="url(#box2)" stroke="#5a9a7a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a6a4a" font-weight="bold">Sistem Çağrıları</text>
  <text x="95" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a6a">fork, pipe, dup2</text>
  <text x="95" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a6a">exec, waitpid</text>

  <!-- Çıktı kutusu -->
  <rect x="480" y="245" width="140" height="55" rx="12" fill="url(#box1)" stroke="#4a7a9b" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5a" font-weight="bold">Çıktı</text>
  <text x="550" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7a">birleşik satır</text>

  <!-- Toplayıcı kutu -->
  <rect x="300" y="250" width="140" height="45" rx="10" fill="url(#box2)" stroke="#c9a86a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a5a2a" font-weight="bold">Toplayıcı</text>
  <text x="370" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a7a4a">pipe oku + sırala</text>

  <!-- Çizgi: toplayıcı -> çıktı -->
  <line x1="440" y1="272" x2="478" y2="272" stroke="#c9a86a" stroke-width="2"/>
  <polygon points="478,272 468,267 468,277" fill="#c9a86a"/>

  <!-- Çizgi: child -> toplayıcı -->
  <line x1="275" y1="210" x2="330" y2="248" stroke="#8a9a6a" stroke-width="1.8"/>
  <line x1="425" y1="210" x2="390" y2="248" stroke="#8a9a6a" stroke-width="1.8"/>

  <!-- Dönüş ve ok işareti -->
  <polygon points="330,248 336,244 332,252" fill="#8a9a6a"/>
  <polygon points="390,248 396,244 392,252" fill="#8a9a6a"/>

  <!-- Alt açıklama -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a7a" opacity="0.8">satır = görev, process = işçi</text>
</svg>