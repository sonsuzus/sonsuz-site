<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Zig: Düşük Seviyeli Kontrol</text>

  <!-- Merkez çekirdek: Zig Felsefesi -->
  <rect x="245" y="48" width="150" height="44" rx="10" fill="#e8f4f8" stroke="#5b9bd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="66" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Zig Felsefesi</text>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">Gizli kontrol akışı yok</text>

  <!-- Üst sol: Bellek Yönetimi -->
  <rect x="30" y="120" width="160" height="52" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e8449">Bellek Yönetimi</text>
  <text x="110" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">Arena, Sabit Tampon</text>
  <text x="110" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">Görünür strateji</text>

  <!-- Üst orta: Hata Yönetimi -->
  <rect x="240" y="120" width="160" height="52" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#b7950b">Hata Yönetimi</text>
  <text x="320" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">try, errdefer</text>
  <text x="320" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">Sonuç = Değer ∪ Hata</text>

  <!-- Üst sağ: Derleme Zamanı -->
  <rect x="450" y="120" width="160" height="52" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">Derleme Zamanı</text>
  <text x="530" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">comptime</text>
  <text x="530" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">T_run = T_iş - T_comptime</text>

  <!-- Oklar: merkezden dışa -->
  <!-- Merkezden bellek yönetimine -->
  <path d="M 290 92 L 160 118" stroke="#27ae60" stroke-width="1.8" fill="none"/>
  <polygon points="160,118 168,114 164,122" fill="#27ae60"/>

  <!-- Merkezden hata yönetimine -->
  <path d="M 320 92 L 320 118" stroke="#f39c12" stroke-width="1.8" fill="none"/>
  <polygon points="320,118 314,114 326,114" fill="#f39c12"/>

  <!-- Merkezden derleme zamanına -->
  <path d="M 350 92 L 480 118" stroke="#8e44ad" stroke-width="1.8" fill="none"/>
  <polygon points="480,118 472,114 476,122" fill="#8e44ad"/>

  <!-- Alt bölüm: C ile etkileşim -->
  <rect x="200" y="210" width="240" height="44" rx="10" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ca6f1e">C ile Doğrudan Etkileşim</text>
  <text x="320" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">Kademeli geçiş, mevcut kod desteği</text>

  <!-- Alt oklar -->
  <path d="M 320 172 L 320 208" stroke="#e67e22" stroke-width="1.8" fill="none"/>
  <polygon points="320,208 314,204 326,204" fill="#e67e22"/>

  <!-- Alt bilgi: Avantaj -->
  <rect x="230" y="272" width="180" height="36" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Daha az sihir</text>
  <text x="320" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Daha fazla niyet</text>

  <!-- Alt bilgiye ok -->
  <path d="M 320 254 L 320 270" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <polygon points="320,270 315,266 325,266" fill="#27ae60"/>

  <!-- Dekoratif küçük kutular -->
  <rect x="60" y="230" width="80" height="28" rx="6" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="100" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#148f77">allocator</text>

  <rect x="500" y="230" width="80" height="28" rx="6" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="540" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#148f77">errdefer</text>

  <!-- Dekoratif bağlantılar -->
  <path d="M 140 230 L 198 230" stroke="#1abc9c" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <path d="M 500 230 L 442 230" stroke="#1abc9c" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
</svg>