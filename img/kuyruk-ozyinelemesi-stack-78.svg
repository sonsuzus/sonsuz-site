  <text x="481" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39795b">aynı çerçeve</text>

  <path d="M482 187 C540 187 547 224 500 225 C461 226 453 204 467 192" fill="none" stroke="#51af82" stroke-width="3" stroke-linecap="round"/>
  <polygon points="464,191 476,191 470,201" fill="#51af82"/>
  <text x="511" y="215" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39795b">yeniden kullan</text>

