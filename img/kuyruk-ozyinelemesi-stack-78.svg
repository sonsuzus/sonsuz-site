  <text x="84" y="85" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9d493f">Normal Özyineleme</text>

  <rect x="374" y="65" width="214" height="31" rx="12" fill="#ddf6e9"/>
