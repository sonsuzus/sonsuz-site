  <text x="90" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#713d39">3 × çağrı(2)</text>
  <text x="97" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#713d39">2 × çağrı(1)</text>

