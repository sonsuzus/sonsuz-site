  <polygon points="267,284 272,290 264,290" fill="#4d7fae"/>
  <text x="325" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365f88">Güvenli alternatif: Döngü</text>
