  <text x="481" y="251" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#28704e">TCO varsa: O(1)</text>

  <path d="M284 157 C302 157 316 157 337 157" fill="none" stroke="#789bb8" stroke-width="2.5" stroke-linecap="round"/>
