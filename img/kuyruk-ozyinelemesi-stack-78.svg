<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="normal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd7d2"/>
      <stop offset="100%" stop-color="#f7aaa2"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d3f4e2"/>
      <stop offset="100%" stop-color="#92dcbb"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#abcdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71839a" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71839a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="51" cy="43" r="70" fill="#cce8ff" opacity="0.28"/>
  <circle cx="595" cy="282" r="94" fill="#d5f1d3" opacity="0.30"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35516b">Özyineleme: Yığın mı, Sabit Bellek mi?</text>

  <g filter="url(#shadow)">
    <rect x="34" y="50" width="250" height="216" rx="20" fill="#ffffff" opacity="0.88"/>
    <rect x="356" y="50" width="250" height="216" rx="20" fill="#ffffff" opacity="0.88"/>
  </g>

  <rect x="52" y="65" width="214" height="31" rx="12" fill="#ffe8e5"/>
