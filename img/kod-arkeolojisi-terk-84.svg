<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez: Kod Arkeolojisi -->
  <rect x="235" y="125" width="170" height="60" rx="14" fill="#5b7db1" filter="url(#shadow)"/>
  <text x="320" y="150" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="13">Kod Arkeolojisi</text>
  <text x="320" y="168" text-anchor="middle" fill="#dce6f5" font-size="11">Terk Edilmiş Repolar</text>

  <!-- Sol Üst: Veri Yapısı -->
  <rect x="40" y="35" width="130" height="55" rx="10" fill="#c9d9f0" filter="url(#shadowLight)"/>
  <text x="105" y="55" text-anchor="middle" fill="#2c3e50" font-weight="bold">Veri Yapısı</text>
  <text x="105" y="72" text-anchor="middle" fill="#34495e" font-size="11">Bit maskesi, LRU</text>

  <!-- Sol Alt: Karmaşıklık -->
  <rect x="40" y="230" width="130" height="55" rx="10" fill="#c9d9f0" filter="url(#shadowLight)"/>
  <text x="105" y="250" text-anchor="middle" fill="#2c3e50" font-weight="bold">Karmaşıklık</text>
  <text x="105" y="267" text-anchor="middle" fill="#34495e" font-size="11">O(n/m), O(1)</text>

  <!-- Sağ Üst: Bağlam -->
  <rect x="470" y="35" width="130" height="55" rx="10" fill="#d5e8d4" filter="url(#shadowLight)"/>
  <text x="535" y="55" text-anchor="middle" fill="#2c3e50" font-weight="bold">Bağlam</text>
  <text x="535" y="72" text-anchor="middle" fill="#34495e" font-size="11">Kısıtlar, niyet</text>

  <!-- Sağ Alt: Kirli Dikdörtgen -->
  <rect x="470" y="230" width="130" height="55" rx="10" fill="#d5e8d4" filter="url(#shadowLight)"/>
  <text x="535" y="250" text-anchor="middle" fill="#2c3e50" font-weight="bold">Kirli Dikdörtgen</text>
  <text x="535" y="267" text-anchor="middle" fill="#34495e" font-size="11">T ≈ c·d</text>

  <!-- Oklar: Sol Üst -> Merkez -->
  <path d="M170 62 L225 140" stroke="#5b7db1" stroke-width="2" fill="none"/>
  <polygon points="225,140 218,128 220,143" fill="#5b7db1"/>

  <!-- Oklar: Sol Alt -> Merkez -->
  <path d="M170 257 L225 190" stroke="#5b7db1" stroke-width="2" fill="none"/>
  <polygon points="225,190 218,200 220,185" fill="#5b7db1"/>

  <!-- Oklar: Sağ Üst -> Merkez -->
  <path d="M470 62 L415 140" stroke="#5b7db1" stroke-width="2" fill="none"/>
  <polygon points="415,140 422,128 420,143" fill="#5b7db1"/>

  <!-- Oklar: Sağ Alt -> Merkez -->
  <path d="M470 257 L415 190" stroke="#5b7db1" stroke-width="2" fill="none"/>
  <polygon points="415,190 422,200 420,185" fill="#5b7db1"/>

  <!-- Alt Bilgi: Kazı Araçları -->
  <rect x="200" y="275" width="240" height="35" rx="8" fill="#e8f0fe" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="290" text-anchor="middle" fill="#2c3e50" font-size="11">git blame · testler · benchmark</text>
  <text x="320" y="303" text-anchor="middle" fill="#7f8c8d" font-size="10">Fikir fosili yatağı</text>

  <!-- Üst Başlık Çizgisi -->
  <line x1="180" y1="20" x2="460" y2="20" stroke="#b0c4de" stroke-width="1" opacity="0.5"/>
  <circle cx="320" cy="20" r="3" fill="#b0c4de" opacity="0.6"/>
</svg>