<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="plan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9cc8f5"/>
      <stop offset="100%" stop-color="#b7dbfa"/>
    </linearGradient>
    <linearGradient id="real" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3b789"/>
      <stop offset="100%" stop-color="#f7d18c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#68839b" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5b758a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="69" cy="45" r="82" fill="#dceeff" opacity="0.55"/>
  <circle cx="602" cy="286" r="105" fill="#dff1d9" opacity="0.55"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d5870">HOFSTADTER YASASI</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8091">Tahmin uzar, belirsizlik tamponu tüketir</text>

  <g filter="url(#shadow)">
    <rect x="35" y="88" width="150" height="96" rx="18" fill="#ffffff"/>
    <rect x="35" y="88" width="150" height="30" rx="18" fill="#dcedff"/>
    <rect x="35" y="105" width="150" height="13" fill="#dcedff"/>
  </g>
  <circle cx="61" cy="103" r="11" fill="#78aee7"/>
  <path d="M56 103h10M61 98v10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="80" y="107" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365773">İlk tahmin</text>
  <text x="57" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536d80">“2 gün”</text>
  <rect x="57" y="154" width="86" height="12" rx="6" fill="url(#plan)"/>
  <text x="57" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8291">İyimser senaryo</text>

  <path d="M193 136 H227" fill="none" stroke="#7b99ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="233,136 224,131 224,141" fill="#7b99ad"/>

  <g filter="url(#shadow)">
    <rect x="241" y="72" width="161" height="128" rx="21" fill="#ffffff"/>
    <rect x="255" y="86" width="133" height="34" rx="12" fill="#f2e7ff"/>
    <text x="321" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#70518f">Belirsizlik</text>

    <circle cx="274" cy="142" r="12" fill="#f8c4b4"/>
    <path d="M269 142h10M274 137v10" stroke="#a85d51" stroke-width="1.8" stroke-linecap="round"/>
    <text x="294" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596f7e">Kapsam</text>

    <circle cx="274" cy="173" r="12" fill="#fde6a5"/>
    <path d="M269 173h10M274 168v10" stroke="#9b7832" stroke-width="1.8" stroke-linecap="round"/>
    <text x="294" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596f7e">Risk ve hata</text>
  </g>

  <path d="M410 136 H440" fill="none" stroke="#7b99ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="446,136 437,131 437,141" fill="#7b99ad"/>

  <g filter="url(#shadow)">
    <rect x="454" y="88" width="151" height="96" rx="18" fill="#ffffff"/>
    <rect x="454" y="88" width="151" height="30" rx="18" fill="#fff0dc"/>
    <rect x="454" y="105" width="151" height="13" fill="#fff0dc"/>
  </g>
  <circle cx="480" cy="103" r="11" fill="#e99a69"/>
  <path d="M475 103h10M480 98v10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="499" y="107" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#815332">Gerçek süre</text>
  <text x="476" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536d80">“Daha uzun”</text>
  <rect x="476" y="154" width="111" height="12" rx="6" fill="url(#real)"/>
  <text x="476" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b765f">Test ve düzeltme</text>

  <g filter="url(#softShadow)">
    <rect x="82" y="231" width="476" height="59" rx="17" fill="#ffffff" opacity="0.96"/>
  </g>
  <text x="105" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#476374">Tek sayı yerine olasılık</text>

  <path d="M105 272 H180" stroke="#83b6e8" stroke-width="9" stroke-linecap="round"/>
  <path d="M180 272 H315" stroke="#a6d8b0" stroke-width="9" stroke-linecap="round"/>
  <path d="M315 272 H438" stroke="#f4c77f" stroke-width="9" stroke-linecap="round"/>
  <path d="M438 272 H526" stroke="#ee9e85" stroke-width="9" stroke-linecap="round"/>

  <circle cx="180" cy="272" r="6" fill="#ffffff" stroke="#75a8db" stroke-width="2"/>
  <circle cx="315" cy="272" r="6" fill="#ffffff" stroke="#76aa82" stroke-width="2"/>
  <circle cx="438" cy="272" r="6" fill="#ffffff" stroke="#d49550" stroke-width="2"/>
  <text x="105" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8190">İyimser</text>
  <text x="287" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b7c65">Olası</text>
  <text x="463" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d6344">Kötümser</text>

  <path d="M321 207 V220" stroke="#7594a5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="321,226 316,217 326,217" fill="#7594a5"/>
  <text x="344" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637d8d">Güven düzeyi</text>
</svg>