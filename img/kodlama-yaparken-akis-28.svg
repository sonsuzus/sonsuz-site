<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8dcff5"/>
      <stop offset="100%" stop-color="#91d8b4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708b" flood-opacity="0.17"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#53718b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="42" r="72" fill="#dceefa" opacity="0.55"/>
  <circle cx="574" cy="276" r="94" fill="#dff2dd" opacity="0.56"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39556e">KODLAMADA AKIŞ HALİ</text>

  <!-- Sol kaynaklar -->
  <g filter="url(#shadow)">
    <rect x="30" y="75" width="145" height="61" rx="16" fill="#fff9e9"/>
    <circle cx="57" cy="105" r="15" fill="#f7ca77"/>
    <path d="M51 109 L57 96 L63 109 L59.5 109 L59.5 115 L54.5 115 L54.5 109 Z" fill="#ffffff"/>
    <text x="83" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665236">Uygun zorluk</text>
    <text x="83" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#897458">Beceriye yakın</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="181" width="145" height="61" rx="16" fill="#eef1ff"/>
    <circle cx="57" cy="211" r="15" fill="#aebcf0"/>
    <path d="M50 211 H64 M57 204 V218" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="83" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d5790">Açık hedef</text>
    <text x="83" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7179a9">Küçük adımlar</text>
  </g>

  <!-- Bağlantılar sol -->
  <path d="M175 105 C195 105 199 126 217 137" fill="none" stroke="#9baec0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="217,137 208,134 212,143" fill="#9baec0"/>
  <path d="M175 211 C196 211 199 189 217 181" fill="none" stroke="#9baec0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="217,181 211,175 208,184" fill="#9baec0"/>

  <!-- Merkez akış -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="160" r="81" fill="#ffffff"/>
    <circle cx="320" cy="160" r="69" fill="url(#flow)" opacity="0.9"/>
    <circle cx="320" cy="160" r="56" fill="#ffffff" opacity="0.94"/>
  </g>
  <circle cx="320" cy="160" r="43" fill="#e9f8f1"/>
  <path d="M294 160 C300 147 307 145 314 153 C321 161 326 162 334 152 C341 143 349 145 353 151" fill="none" stroke="#4b9d82" stroke-width="3" stroke-linecap="round"/>
  <path d="M294 173 C301 164 308 165 315 173 C322 181 330 181 337 173 C343 166 349 166 353 170" fill="none" stroke="#78b69a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="320" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286d58">AKIŞ</text>
  <text x="320" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d7e6b">Odak ve kontrol</text>

  <!-- Sağ süreç -->
  <path d="M403 142 C419 130 423 113 438 109" fill="none" stroke="#8caaba" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="438,109 430,108 434,116" fill="#8caaba"/>
  <path d="M403 179 C419 190 423 207 438 211" fill="none" stroke="#8caaba" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="438,211 434,204 430,212" fill="#8caaba"/>

  <g filter="url(#shadow)">
    <rect x="438" y="75" width="170" height="61" rx="16" fill="#e9f5ff"/>
    <circle cx="467" cy="105" r="15" fill="#83c4ec"/>
    <path d="M460 98 L466 105 L460 112 M474 98 L468 105 L474 112" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="494" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385f78">Kod ve problem</text>
    <text x="494" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#628399">Tek noktada dikkat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="181" width="170" height="61" rx="16" fill="#eaf8f0"/>
    <circle cx="467" cy="211" r="15" fill="#83cea4"/>
    <path d="M459 212 L464 217 L476 205" fill="none" stroke="#ffffff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="494" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7660">Hızlı geri bildirim</text>
    <text x="494" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b937b">Test ve çıktı</text>
  </g>

  <!-- Geri dönüş döngüsü -->
  <path d="M525 242 C528 276 393 288 355 243" fill="none" stroke="#78af9a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="355,243 364,246 360,237" fill="#78af9a"/>
  <text x="457" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e8a78">Sürekli iyileştirme</text>

  <!-- Korunmuş dikkat rozeti -->
  <g filter="url(#soft)">
    <rect x="244" y="258" width="152" height="34" rx="17" fill="#ffffff"/>
    <path d="M265 266 L274 262 L283 266 V274 C283 279 279 282 274 284 C269 282 265 279 265 274 Z" fill="#d98d91"/>
    <path d="M270 273 L273 276 L279 269" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="328" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#586878">Korunmuş dikkat</text>
  </g>
</svg>