<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff3e0"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede7f6"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="640" height="320" rx="12" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Python Liste Kurma ve Üreteç İfadeleri</text>

  <!-- Merkez kutu: Liste Kurma -->
  <rect x="245" y="55" width="150" height="45" rx="10" fill="url(#boxGrad1)" stroke="#64b5f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Liste Kurma</text>

  <!-- Sol üst: Basit Liste -->
  <rect x="30" y="55" width="150" height="45" rx="10" fill="url(#boxGrad2)" stroke="#81c784" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Basit Liste</text>
  <text x="105" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">ifade + döngü</text>

  <!-- Sol alt: Şartlı Liste -->
  <rect x="30" y="135" width="150" height="45" rx="10" fill="url(#boxGrad2)" stroke="#81c784" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Şartlı Liste</text>
  <text x="105" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">if koşulu ekle</text>

  <!-- Sağ üst: İç içe Döngü -->
  <rect x="460" y="55" width="150" height="45" rx="10" fill="url(#boxGrad3)" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">İç içe Döngü</text>
  <text x="535" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">çoklu for</text>

  <!-- Sağ alt: Sözlük Kurma -->
  <rect x="460" y="135" width="150" height="45" rx="10" fill="url(#boxGrad3)" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="535" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Sözlük Kurma</text>
  <text x="535" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">anahtar: değer</text>

  <!-- Alt merkez: Üreteç İfadeleri -->
  <rect x="245" y="135" width="150" height="45" rx="10" fill="url(#boxGrad4)" stroke="#f06292" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Üreteç İfadeleri</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">tembel değerlendirme</text>

  <!-- Alt bilgi: Avantajlar -->
  <rect x="140" y="220" width="360" height="40" rx="10" fill="url(#boxGrad5)" stroke="#9575cd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4527a0">Avantajlar</text>
  <text x="320" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">Hız, sadelik, bellek verimliliği</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Merkezden sola -->
  <path d="M245 77 L180 77" stroke="#64b5f6" stroke-width="2" fill="none"/>
  <polygon points="180,72 192,77 180,82" fill="#64b5f6"/>

  <!-- Merkezden sağa -->
  <path d="M395 77 L460 77" stroke="#64b5f6" stroke-width="2" fill="none"/>
  <polygon points="460,72 448,77 460,82" fill="#64b5f6"/>

  <!-- Merkezden alt merkeze -->
  <path d="M320 100 L320 135" stroke="#64b5f6" stroke-width="2" fill="none"/>
  <polygon points="315,135 320,147 325,135" fill="#64b5f6"/>

  <!-- Sol üstten sol alta -->
  <path d="M105 100 L105 135" stroke="#81c784" stroke-width="2" fill="none"/>
  <polygon points="100,135 105,147 110,135" fill="#81c784"/>

  <!-- Sağ üstten sağ alta -->
  <path d="M535 100 L535 135" stroke="#ffb74d" stroke-width="2" fill="none"/>
  <polygon points="530,135 535,147 540,135" fill="#ffb74d"/>

  <!-- Alt kutulardan avantajlara -->
  <path d="M320 180 L320 220" stroke="#9575cd" stroke-width="2" fill="none"/>
  <polygon points="315,220 320,232 325,220" fill="#9575cd"/>

  <path d="M105 180 L200 220" stroke="#9575cd" stroke-width="2" fill="none"/>
  <polygon points="200,215 205,227 193,222" fill="#9575cd"/>

  <path d="M535 180 L440 220" stroke="#9575cd" stroke-width="2" fill="none"/>
  <polygon points="440,215 447,222 435,227" fill="#9575cd"/>

  <!-- Alt açıklama -->
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#777">Köşeli parantez [ ] → Liste | Küme parantezi { } → Küme ve Sözlük | Parantez ( ) → Üreteç</text>
</svg>