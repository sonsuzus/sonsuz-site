<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce9ff"/>
      <stop offset="100%" stop-color="#ccefe1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52677d" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52677d" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="318" cy="159" r="110" fill="#dff1eb" opacity="0.35"/>
  <circle cx="318" cy="159" r="78" fill="#d7e7ff" opacity="0.28"/>

  <text x="30" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">DİNAMİK AĞAÇ YÖNETİMİ</text>
  <text x="610" y="31" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#658094">Amortize O(log n)</text>

  <!-- Left forest panel -->
  <rect x="27" y="70" width="152" height="183" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="103" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">Dinamik Orman</text>
  <text x="103" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71879a">kenarlar değişir</text>

  <path d="M57 159 L81 139 L106 154 L132 133" fill="none" stroke="#7c99b4" stroke-width="3" stroke-linecap="round"/>
  <path d="M106 154 L122 181" fill="none" stroke="#7c99b4" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 208 L83 190 L110 211 L139 193" fill="none" stroke="#83a996" stroke-width="3" stroke-linecap="round"/>
  <circle cx="57" cy="159" r="8" fill="#a9c8f5" filter="url(#smallShadow)"/>
  <circle cx="81" cy="139" r="8" fill="#b7e2d1" filter="url(#smallShadow)"/>
  <circle cx="106" cy="154" r="8" fill="#f6ce9e" filter="url(#smallShadow)"/>
  <circle cx="132" cy="133" r="8" fill="#cbb8ed" filter="url(#smallShadow)"/>
  <circle cx="122" cy="181" r="8" fill="#a9c8f5" filter="url(#smallShadow)"/>
  <circle cx="58" cy="208" r="8" fill="#b7e2d1" filter="url(#smallShadow)"/>
  <circle cx="83" cy="190" r="8" fill="#f6ce9e" filter="url(#smallShadow)"/>
  <circle cx="110" cy="211" r="8" fill="#cbb8ed" filter="url(#smallShadow)"/>
  <circle cx="139" cy="193" r="8" fill="#a9c8f5" filter="url(#smallShadow)"/>

  <!-- arrow forest to core -->
  <path d="M185 160 L222 160" fill="none" stroke="#668ba8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="228,160 218,154 218,166" fill="#668ba8"/>

  <!-- Core -->
  <rect x="230" y="104" width="180" height="112" rx="25" fill="url(#core)" stroke="#b9d9d5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="133" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31566a">Link-Cut Tree</text>
  <text x="320" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56748a">Tercihli Yollar</text>

  <!-- splay path -->
  <path d="M267 181 L293 164 L321 181 L347 160 L375 180" fill="none" stroke="#507f9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="267" cy="181" r="10" fill="#fff" stroke="#8eb6ca" stroke-width="2"/>
  <circle cx="293" cy="164" r="10" fill="#fff" stroke="#8eb6ca" stroke-width="2"/>
  <circle cx="321" cy="181" r="10" fill="#fff" stroke="#8eb6ca" stroke-width="2"/>
  <circle cx="347" cy="160" r="10" fill="#fff" stroke="#8eb6ca" stroke-width="2"/>
  <circle cx="375" cy="180" r="10" fill="#fff" stroke="#8eb6ca" stroke-width="2"/>
  <path d="M283 195 C305 207 338 207 359 194" fill="none" stroke="#7db49d" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="320" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477466">Splay ağacı</text>

  <!-- arrows core right -->
  <path d="M418 128 L451 104" fill="none" stroke="#668ba8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="456,100 446,103 453,111" fill="#668ba8"/>
  <path d="M418 161 L451 161" fill="none" stroke="#668ba8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="457,161 447,155 447,167" fill="#668ba8"/>
  <path d="M418 192 L451 217" fill="none" stroke="#668ba8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="456,221 453,210 446,218" fill="#668ba8"/>

  <!-- Right operations -->
  <rect x="460" y="61" width="151" height="75" rx="15" fill="#fff5e6" filter="url(#smallShadow)"/>
  <circle cx="484" cy="88" r="14" fill="#f6ce9e"/>
  <path d="M477 88 L491 88 M484 81 L484 95" stroke="#8b6338" stroke-width="2" stroke-linecap="round"/>
  <text x="506" y="86" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6d563d">Bağla ve Kes</text>
  <text x="506" y="106" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b745b">link · cut</text>

  <rect x="460" y="143" width="151" height="75" rx="15" fill="#edf4ff" filter="url(#smallShadow)"/>
  <circle cx="484" cy="170" r="14" fill="#a9c8f5"/>
  <path d="M477 170 L491 170 M484 163 L484 177" stroke="#416d9a" stroke-width="2" stroke-linecap="round"/>
  <text x="506" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405d78">Kökü Değiştir</text>
  <text x="506" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66819b">makeRoot · access</text>

  <rect x="460" y="225" width="151" height="61" rx="15" fill="#eaf8f1" filter="url(#smallShadow)"/>
  <circle cx="484" cy="255" r="14" fill="#b7e2d1"/>
  <path d="M477 256 L482 261 L492 249" fill="none" stroke="#39745f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="506" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6c5e">Yol Sorgusu</text>
  <text x="506" y="272" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c887a">toplam · max · min</text>

  <!-- Bottom process line -->
  <path d="M140 282 L438 282" fill="none" stroke="#b3c9d2" stroke-width="1.5" stroke-dasharray="4 5"/>
  <circle cx="192" cy="282" r="5" fill="#8eb6ca"/>
  <circle cx="320" cy="282" r="5" fill="#7db49d"/>
  <circle cx="414" cy="282" r="5" fill="#8eb6ca"/>
  <text x="192" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8593">Yeniden düzenle</text>
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7c72">Yolu öne çıkar</text>
  <text x="414" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8593">Cevabı al</text>
</svg>