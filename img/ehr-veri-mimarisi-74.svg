<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#dff3e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7892aa" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7892aa" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="#ffffff" opacity="0.38"/>
  <circle cx="320" cy="160" r="93" fill="none" stroke="#b9d5df" stroke-width="1.5" stroke-dasharray="5 6"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39536b">EHR VERİ YOLCULUĞU</text>
  <text x="612" y="30" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#61798b">Güvenli ve birlikte çalışabilir</text>

  <!-- connections -->
  <path d="M149 92 C184 92 190 119 220 133" fill="none" stroke="#82a9bc" stroke-width="2"/>
