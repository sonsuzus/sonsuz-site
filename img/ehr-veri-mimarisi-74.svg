  <g filter="url(#smallShadow)">
    <rect x="463" y="66" width="148" height="53" rx="14" fill="#e7f3ff"/>
    <circle cx="489" cy="92" r="13" fill="#99c9ed"/>
    <path d="M484 94v-4a5 5 0 0 1 10 0v4M482 94h14v9h-14z" fill="none" stroke="#356989" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="512" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#365e78">Kimlik ve Yetki</text>
