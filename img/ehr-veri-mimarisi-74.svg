    <path d="M489 150l8 3v6c0 6-4 9-8 11-4-2-8-5-8-11v-6z" fill="none" stroke="#357357" stroke-width="1.5"/>
    <path d="M485 160l3 3 5-6" fill="none" stroke="#357357" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="512" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3a6952">TLS Şifreleme</text>
    <text x="512" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668471">Güvenli aktarım</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="463" y="202" width="148" height="53" rx="14" fill="#fff0e9"/>
    <circle cx="489" cy="228" r="13" fill="#f2b69c"/>
    <path d="M484 221h10v14h-10zM487 225h4M487 229h4M487 233h4" fill="none" stroke="#94553d" stroke-width="1.4" stroke-linecap="round"/>
    <text x="512" y="225" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#775044">Denetim İzi</text>
    <text x="512" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#967163">Onay ve kayıt</text>
  </g>

  <!-- bottom indicator -->
  <g transform="translate(188 275)">
    <rect x="0" y="0" width="264" height="27" rx="13.5" fill="#ffffff" filter="url(#smallShadow)"/>
    <circle cx="18" cy="13.5" r="5" fill="#72bd9b"/>
    <text x="31" y="18" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486978">Doğruluk</text>
    <path d="M100 13.5h20" stroke="#bfd2d9" stroke-width="1.5"/>
    <circle cx="134" cy="13.5" r="5" fill="#77b6db"/>
    <text x="147" y="18" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486978">Erişilebilirlik</text>
    <path d="M235 13.5h12" stroke="#bfd2d9" stroke-width="1.5"/>
  </g>
