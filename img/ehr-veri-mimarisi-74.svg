  <polygon points="218,160 209,155 209,165" fill="#82a9bc"/>
  <path d="M149 228 C184 228 190 201 220 187" fill="none" stroke="#82a9bc" stroke-width="2"/>
  <polygon points="220,187 214,181 211,191" fill="#82a9bc"/>

  <path d="M394 146 C423 132 432 103 463 93" fill="none" stroke="#789eb7" stroke-width="2.2"/>
  <polygon points="463,93 453,91 457,101" fill="#789eb7"/>
  <path d="M398 160 L462 160" fill="none" stroke="#789eb7" stroke-width="2.2"/>
  <polygon points="462,160 452,155 452,165" fill="#789eb7"/>
  <path d="M394 175 C422 188 434 216 463 227" fill="none" stroke="#789eb7" stroke-width="2.2"/>
  <polygon points="463,227 457,219 453,229" fill="#789eb7"/>

