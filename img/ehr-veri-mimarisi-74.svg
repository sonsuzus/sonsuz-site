  <g filter="url(#smallShadow)">
    <rect x="27" y="66" width="122" height="52" rx="14" fill="#fff5e4"/>
    <circle cx="51" cy="92" r="13" fill="#f6c97c"/>
    <rect x="45" y="85" width="12" height="14" rx="2" fill="none" stroke="#875f2c" stroke-width="1.5"/>
    <path d="M48 89h6M48 93h6" stroke="#875f2c" stroke-width="1.2"/>
    <text x="72" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5c4a31">Hastane</text>
    <text x="72" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6a55">Bilgi sistemi</text>
