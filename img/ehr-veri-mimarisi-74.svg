    <rect x="228" y="119" width="74" height="29" rx="10" fill="#ffe6cf"/>
    <text x="265" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9c5933">HL7 v2</text>
