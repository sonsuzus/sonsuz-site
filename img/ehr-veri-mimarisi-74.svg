  <g filter="url(#smallShadow)">
    <rect x="27" y="134" width="122" height="52" rx="14" fill="#eee8ff"/>
    <circle cx="51" cy="160" r="13" fill="#b8a5e7"/>
    <path d="M45 164h12M48 157h6M50 153h2M50 168h2" stroke="#5f508a" stroke-width="1.5" stroke-linecap="round"/>
    <text x="72" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4d4670">Laboratuvar</text>
    <text x="72" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#706887">Sonuçlar</text>
