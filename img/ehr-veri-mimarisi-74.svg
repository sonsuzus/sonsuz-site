  <g filter="url(#shadow)">
    <rect x="313" y="113" width="84" height="94" rx="25" fill="url(#core)" stroke="#b8d8d1" stroke-width="1"/>
    <circle cx="355" cy="144" r="17" fill="#ffffff" opacity="0.9"/>
    <circle cx="355" cy="139" r="5" fill="#5b91a2"/>
    <path d="M345 154c2-6 18-6 20 0" fill="none" stroke="#5b91a2" stroke-width="2.2" stroke-linecap="round"/>
    <text x="355" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d6d">EHR</text>
    <text x="355" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7781">Klinik kayıt</text>
  </g>

