<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="fusion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcff"/>
      <stop offset="100%" stop-color="#d8f2ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7990a3" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6f8496" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="69" cy="37" r="58" fill="#dbeeff" opacity="0.52"/>
  <circle cx="593" cy="286" r="76" fill="#dff3df" opacity="0.56"/>
  <path d="M22 270 C134 222, 190 306, 290 273 S480 212, 624 250" fill="none" stroke="#bfdde0" stroke-width="1.5" opacity="0.55"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41586b">VQA: Ortak Anlam Uzayı</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718394">Soru, görüntüdeki doğru kanıtı yönlendirir</text>

  <!-- visual input -->
  <g filter="url(#shadow)">
    <rect x="28" y="77" width="151" height="86" rx="18" fill="#ffffff"/>
    <rect x="28" y="77" width="151" height="86" rx="18" fill="none" stroke="#c9dfef"/>
  </g>
  <rect x="42" y="94" width="45" height="51" rx="9" fill="#cdeaf4"/>
  <rect x="48" y="100" width="33" height="21" rx="5" fill="#8fc4df"/>
  <path d="M48 136 L58 123 L65 130 L72 120 L81 136 Z" fill="#6ea9c5"/>
  <circle cx="74" cy="106" r="4" fill="#fff2a6"/>
  <rect x="99" y="97" width="61" height="8" rx="4" fill="#92bdd2"/>
  <rect x="99" y="112" width="48" height="7" rx="3.5" fill="#d0e3ec"/>
  <rect x="99" y="126" width="55" height="7" rx="3.5" fill="#d0e3ec"/>
  <text x="103" y="148" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#527287">Görüntü</text>

  <!-- visual encoder -->
  <g filter="url(#softShadow)">
    <rect x="48" y="190" width="112" height="45" rx="14" fill="#dff2f7" stroke="#b8dce8"/>
  </g>
  <text x="104" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3d7182">Görüntü</text>
  <text x="104" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8997">kodlayıcı</text>

  <!-- image down arrow -->
  <path d="M104 166 L104 184" fill="none" stroke="#7daabd" stroke-width="2"/>
  <polygon points="99,181 109,181 104,188" fill="#7daabd"/>

  <!-- visual tokens -->
  <g filter="url(#softShadow)">
    <rect x="178" y="186" width="60" height="52" rx="14" fill="#eefaff" stroke="#c5e2ee"/>
  </g>
  <rect x="190" y="198" width="11" height="11" rx="3" fill="#7cbcd3"/>
  <rect x="207" y="198" width="11" height="11" rx="3" fill="#9dd5c9"/>
  <rect x="190" y="215" width="11" height="11" rx="3" fill="#b4a3df"/>
  <rect x="207" y="215" width="11" height="11" rx="3" fill="#f0b899"/>
  <text x="208" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7787">Görsel vektörler</text>
  <path d="M163 212 L171 212" fill="none" stroke="#7daabd" stroke-width="2"/>
  <polygon points="168,207 178,212 168,217" fill="#7daabd"/>

  <!-- question input -->
  <g filter="url(#shadow)">
    <rect x="28" y="246" width="151" height="49" rx="18" fill="#ffffff"/>
    <rect x="28" y="246" width="151" height="49" rx="18" fill="none" stroke="#dfcfee"/>
  </g>
  <circle cx="55" cy="270" r="14" fill="#eadcf8"/>
  <text x="55" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8966a9">?</text>
  <text x="78" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#705486">Soru</text>
  <text x="78" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9077a3">Kelime dizisi</text>

  <!-- text encoder -->
  <g filter="url(#softShadow)">
    <rect x="198" y="256" width="112" height="43" rx="14" fill="#f2eafa" stroke="#ddc9ec"/>
  </g>
  <text x="254" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#79568e">Metin kodlayıcı</text>
  <path d="M181 270 L191 270" fill="none" stroke="#a27ab5" stroke-width="2"/>
  <polygon points="188,265 198,270 188,275" fill="#a27ab5"/>

  <!-- text tokens -->
  <g filter="url(#softShadow)">
    <rect x="330" y="257" width="78" height="42" rx="14" fill="#faf3ff" stroke="#e2cfef"/>
  </g>
  <rect x="343" y="269" width="13" height="14" rx="4" fill="#b28aca"/>
  <rect x="362" y="269" width="13" height="14" rx="4" fill="#d3b0df"/>
  <rect x="381" y="269" width="13" height="14" rx="4" fill="#9672bd"/>
  <text x="369" y="313" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d89">Dil vektörleri</text>
  <path d="M313 278 L323 278" fill="none" stroke="#a27ab5" stroke-width="2"/>
  <polygon points="320,273 330,278 320,283" fill="#a27ab5"/>

  <!-- fusion central -->
  <g filter="url(#shadow)">
    <rect x="270" y="85" width="178" height="137" rx="24" fill="url(#fusion)" stroke="#cbbfe3"/>
  </g>
  <circle cx="359" cy="126" r="27" fill="#ffffff" opacity="0.82"/>
  <circle cx="359" cy="126" r="20" fill="#d6c9ef"/>
  <path d="M346 128 C352 118, 363 116, 372 120" fill="none" stroke="#6d5b9b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="368,115 376,120 367,123" fill="#6d5b9b"/>
  <path d="M373 126 C367 136, 355 138, 346 133" fill="none" stroke="#4f8e91" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="350,138 342,133 351,130" fill="#4f8e91"/>
  <text x="359" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b507c">Cross-Attention</text>
  <text x="359" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71658d">Soruya göre odak</text>
  <rect x="298" y="196" width="122" height="10" rx="5" fill="#ffffff" opacity="0.78"/>
  <rect x="304" y="199" width="71" height="4" rx="2" fill="#86b9ae"/>
  
  <!-- token paths to fusion -->
  <path d="M240 208 C256 208, 255 174, 267 166" fill="none" stroke="#77aec2" stroke-width="2"/>
  <polygon points="262,164 271,161 268,171" fill="#77aec2"/>
  <path d="M408 276 C430 268, 430 234, 417 224" fill="none" stroke="#a27ab5" stroke-width="2"/>
  <polygon points="419,229 412,219 422,221" fill="#a27ab5"/>

  <!-- output -->
  <path d="M452 153 L479 153" fill="none" stroke="#6b9f95" stroke-width="2.5"/>
  <polygon points="476,148 486,153 476,158" fill="#6b9f95"/>
  <g filter="url(#shadow)">
    <rect x="489" y="104" width="124" height="99" rx="20" fill="#ffffff" stroke="#c5e3d5"/>
  </g>
  <circle cx="551" cy="133" r="20" fill="#d9f0df"/>
  <path d="M542 133 L548 139 L560 126" fill="none" stroke="#579a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="551" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4a7860">Cevap başlığı</text>
  <text x="551" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d927d">Olasılık seçimi</text>

  <!-- small answer badges -->
  <g filter="url(#softShadow)">
    <rect x="477" y="222" width="47" height="28" rx="12" fill="#f6caca"/>
    <rect x="535" y="222" width="35" height="28" rx="12" fill="#cce8f2"/>
    <rect x="580" y="222" width="34" height="28" rx="12" fill="#d7efd2"/>
  </g>
  <text x="500" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#925b5b">kırmızı</text>
  <text x="552" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4e7786">iki</text>
  <text x="597" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#56835b">evet</text>
  <path d="M551 207 L551 216" fill="none" stroke="#78a58b" stroke-width="2"/>
  <polygon points="546,213 556,213 551,219" fill="#78a58b"/>
</svg>