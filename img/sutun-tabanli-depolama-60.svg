<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="colGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f4ed"/>
      <stop offset="100%" stop-color="#c6e9df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#56718a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52718a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="570" cy="43" r="88" fill="#dceffa" opacity="0.52"/>
  <circle cx="58" cy="299" r="100" fill="#e2f2d8" opacity="0.42"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365268">Analitik Sorguda Sütun Tabanlı Hız</text>

  <!-- Sol: satır tabanlı -->
  <g filter="url(#shadow)">
    <rect x="25" y="51" width="177" height="216" rx="18" fill="#ffffff"/>
  </g>
  <rect x="41" y="66" width="145" height="28" rx="10" fill="#f9e3df"/>
  <text x="113.5" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8b524a">Satır tabanlı</text>

  <text x="48" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647786">Her kayıtta tüm alanlar</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="43" y="127" width="141" height="25" rx="7" fill="#edf2f5"/>
    <rect x="48" y="132" width="24" height="15" rx="3" fill="#c8ddf2"/>
    <rect x="76" y="132" width="37" height="15" rx="3" fill="#f5d7a7"/>
    <rect x="117" y="132" width="29" height="15" rx="3" fill="#d7c9ef"/>
    <rect x="150" y="132" width="29" height="15" rx="3" fill="#f2c7c1"/>

    <rect x="43" y="157" width="141" height="25" rx="7" fill="#edf2f5"/>
    <rect x="48" y="162" width="24" height="15" rx="3" fill="#c8ddf2"/>
    <rect x="76" y="162" width="37" height="15" rx="3" fill="#f5d7a7"/>
    <rect x="117" y="162" width="29" height="15" rx="3" fill="#d7c9ef"/>
    <rect x="150" y="162" width="29" height="15" rx="3" fill="#f2c7c1"/>

    <rect x="43" y="187" width="141" height="25" rx="7" fill="#edf2f5"/>
    <rect x="48" y="192" width="24" height="15" rx="3" fill="#c8ddf2"/>
    <rect x="76" y="192" width="37" height="15" rx="3" fill="#f5d7a7"/>
    <rect x="117" y="192" width="29" height="15" rx="3" fill="#d7c9ef"/>
    <rect x="150" y="192" width="29" height="15" rx="3" fill="#f2c7c1"/>
  </g>

  <rect x="43" y="228" width="141" height="23" rx="9" fill="#fdecea"/>
  <text x="113.5" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#a45a52">Fazla veri okuma</text>

  <!-- orta ayırıcı -->
  <path d="M215 159 L250 159" stroke="#8298a9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="250,159 242,154 242,164" fill="#8298a9"/>
  <text x="232" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647786">Sorgu</text>

  <!-- Merkez sütun -->
  <g filter="url(#shadow)">
    <rect x="263" y="51" width="177" height="216" rx="18" fill="#ffffff"/>
  </g>
  <rect x="279" y="66" width="145" height="28" rx="10" fill="#d9f1e8"/>
  <text x="351.5" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#307564">Sütun tabanlı</text>

  <text x="286" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647786">Yalnız gerekli alanlar</text>

  <rect x="282" y="127" width="38" height="86" rx="8" fill="#c8ddf2"/>
  <rect x="326" y="127" width="38" height="86" rx="8" fill="#f5d7a7"/>
  <rect x="370" y="127" width="38" height="86" rx="8" fill="url(#colGrad)"/>
  <text x="301" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45647a">id</text>
  <text x="345" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80633a">şehir</text>
  <text x="389" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286b5c">gelir</text>
  <path d="M389 157 L389 194" stroke="#4eaa91" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="389,202 384,193 394,193" fill="#4eaa91"/>

  <rect x="282" y="228" width="126" height="23" rx="9" fill="#e1f4eb"/>
  <text x="345" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#287761">Yüzde 3 okuma</text>

  <!-- Sağ işleme -->
  <path d="M453 159 L478 159" stroke="#4b9a87" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="478,159 470,154 470,164" fill="#4b9a87"/>

  <g filter="url(#shadow)">
    <rect x="489" y="51" width="126" height="216" rx="18" fill="#ffffff"/>
  </g>
  <text x="552" y="79" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365268">Analitik motor</text>

  <g filter="url(#softShadow)">
    <rect x="505" y="94" width="94" height="31" rx="10" fill="#e3edf9"/>
    <text x="552" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45647a">Blok atlama</text>

    <rect x="505" y="137" width="94" height="31" rx="10" fill="#f8ebcb"/>
    <text x="552" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80633a">Sıkıştırma</text>

    <rect x="505" y="180" width="94" height="31" rx="10" fill="#e0f3eb"/>
    <text x="552" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#287761">Vektör işlem</text>
  </g>

  <path d="M552 219 L552 235" stroke="#4b9a87" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="552,243 547,234 557,234" fill="#4b9a87"/>
  <rect x="512" y="246" width="80" height="16" rx="8" fill="#d8f1e8"/>
  <text x="552" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#287761">Hızlı toplam</text>
</svg>