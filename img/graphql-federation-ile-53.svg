<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f9f2"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcd5ff"/>
      <stop offset="100%" stop-color="#c9e6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#60758a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#708398" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="544" cy="55" r="90" fill="#d9f2e4" opacity="0.42"/>
  <circle cx="105" cy="274" r="83" fill="#dcecff" opacity="0.52"/>

  <text x="30" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547086" font-weight="600">GraphQL Federation</text>
  <text x="30" y="52" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8093a0">Dağıtık servisler · Tek uç nokta</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="30" y="119" width="118" height="84" rx="18" fill="#ffffff"/>
    <rect x="48" y="138" width="34" height="25" rx="6" fill="#b9dafa"/>
    <rect x="53" y="143" width="24" height="15" rx="3" fill="#ffffff"/>
    <path d="M59 168 L71 168 L76 176 L54 176 Z" fill="#8dbce7"/>
    <text x="92" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#314e62" font-weight="700">İstemci</text>
    <text x="92" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698092">Tek sorgu</text>
    <text x="48" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537087">user · orders</text>
  </g>

  <!-- input line and arrow -->
  <path d="M149 160 H204" fill="none" stroke="#7198bb" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="204,160 195,155 195,165" fill="#7198bb"/>
  <text x="160" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718899">Sorgu</text>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="208" y="87" width="190" height="145" rx="26" fill="url(#router)"/>
    <rect x="223" y="102" width="160" height="115" rx="20" fill="#ffffff" opacity="0.58"/>
    <circle cx="303" cy="139" r="27" fill="#7567b6"/>
    <path d="M290 134 Q303 123 316 134 M290 143 Q303 154 316 143" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="303" cy="139" r="4" fill="#ffffff"/>
    <text x="303" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f4773" font-weight="700">Federation Router</text>
    <text x="303" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65708c">Planla · Birleştir</text>
  </g>

  <!-- Branch paths -->
  <path d="M399 142 H430 V86 H450" fill="none" stroke="#82a6b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="450,86 441,81 441,91" fill="#82a6b6"/>
  <path d="M399 160 H450" fill="none" stroke="#82a6b6" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="450,160 441,155 441,165" fill="#82a6b6"/>
  <path d="M399 178 H430 V234 H450" fill="none" stroke="#82a6b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="450,234 441,229 441,239" fill="#82a6b6"/>

  <text x="406" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718899">Yürütme</text>

  <!-- Services -->
  <g filter="url(#softShadow)">
    <rect x="453" y="53" width="156" height="66" rx="16" fill="#fff4d8"/>
    <circle cx="479" cy="86" r="15" fill="#f1ba62"/>
    <path d="M471 91 Q479 79 487 91 M474 82 H484" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="503" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765527" font-weight="700">Kullanıcı</text>
    <text x="503" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#927447">User · id · ad</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="453" y="127" width="156" height="66" rx="16" fill="#dceff9"/>
    <circle cx="479" cy="160" r="15" fill="#61a8c9"/>
    <path d="M470 155 H488 M470 161 H488 M470 167 H482" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="503" y="154" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315d72" font-weight="700">Ürün</text>
    <text x="503" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597d8e">Product · fiyat</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="453" y="201" width="156" height="66" rx="16" fill="#e2f3df"/>
    <circle cx="479" cy="234" r="15" fill="#71b47a"/>
    <path d="M471 228 H487 V241 H471 Z M475 225 H483" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <text x="503" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d7046" font-weight="700">Sipariş</text>
    <text x="503" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63876a">Order · toplam</text>
  </g>

  <!-- Entity relationship -->
  <path d="M531 119 V126" stroke="#a0b9ae" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M531 193 V200" stroke="#a0b9ae" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="550" y="108" width="42" height="18" rx="9" fill="#ffffff" opacity="0.88"/>
  <text x="571" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#638176">id</text>

  <!-- Response line -->
  <path d="M303 233 V280 H148" fill="none" stroke="#8b76b5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="148,280 157,275 157,285" fill="#8b76b5"/>
  <rect x="222" y="267" width="137" height="25" rx="12" fill="#ffffff" filter="url(#softShadow)"/>
  <text x="290" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#685887">Birleşik yanıt</text>
</svg>