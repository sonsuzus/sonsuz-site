<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f85b8"/>
      <stop offset="100%" stop-color="#385b8a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9e4d0"/>
      <stop offset="100%" stop-color="#7bc4ad"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#54708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#54708a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>

  <circle cx="320" cy="160" r="117" fill="#dceefa" opacity="0.62"/>
  <circle cx="320" cy="160" r="91" fill="#eef7ef" opacity="0.82"/>

  <!-- Bağlantılar -->
  <path d="M151 92 C186 92 196 113 223 125" fill="none" stroke="#84a7c4" stroke-width="2"/>
  <polygon points="223,125 213,119 216,130" fill="#84a7c4"/>

  <path d="M151 225 C188 225 197 204 223 194" fill="none" stroke="#84a7c4" stroke-width="2"/>
  <polygon points="223,194 215,189 218,200" fill="#84a7c4"/>

  <path d="M417 125 C446 113 454 92 489 92" fill="none" stroke="#84a7c4" stroke-width="2"/>
  <polygon points="489,92 479,87 479,97" fill="#84a7c4"/>

  <path d="M417 194 C446 204 455 225 489 225" fill="none" stroke="#84a7c4" stroke-width="2"/>
  <polygon points="489,225 479,220 479,230" fill="#84a7c4"/>

  <!-- Sol üst: Mobil -->
  <g filter="url(#shadow)">
    <rect x="35" y="57" width="116" height="70" rx="17" fill="#ffffff"/>
    <rect x="48" y="69" width="31" height="45" rx="6" fill="#d9eafa" stroke="#78a2c8" stroke-width="1.5"/>
    <rect x="53" y="76" width="21" height="18" rx="3" fill="#8db9dc"/>
    <circle cx="63.5" cy="105" r="3" fill="#5d86ad"/>
    <text x="91" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365c7f" font-weight="600">Mobil</text>
    <text x="91" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617d95">Kimlik</text>
  </g>

  <!-- Sol alt: Ağ -->
  <g filter="url(#shadow)">
    <rect x="35" y="190" width="116" height="70" rx="17" fill="#ffffff"/>
    <path d="M59 223 L71 211 L83 223 L71 235 Z" fill="#b8d9ef" stroke="#6192ba" stroke-width="1.5"/>
    <path d="M71 211 L71 235 M59 223 L83 223" stroke="#6192ba" stroke-width="1.2"/>
    <text x="94" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365c7f" font-weight="600">TLS 1.3</text>
    <text x="94" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617d95">Aktarım</text>
  </g>

  <!-- Merkez kasa -->
  <g filter="url(#shadow)">
    <rect x="222" y="92" width="196" height="136" rx="29" fill="url(#vault)"/>
    <rect x="234" y="104" width="172" height="112" rx="22" fill="#ffffff" opacity="0.13"/>
    <circle cx="320" cy="153" r="34" fill="#e9f5ee" stroke="#c7e5d5" stroke-width="3"/>
    <rect x="303" y="151" width="34" height="26" rx="6" fill="#4f8e77"/>
    <path d="M310 151 V141 C310 127 330 127 330 141 V151" fill="none" stroke="#4f8e77" stroke-width="7" stroke-linecap="round"/>
    <circle cx="320" cy="163" r="3.5" fill="#e9f5ee"/>
    <path d="M320 166 L320 171" stroke="#e9f5ee" stroke-width="2" stroke-linecap="round"/>
    <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="600">Dijital Kasa</text>
  </g>

  <!-- Sağ üst: Şifreleme -->
  <g filter="url(#shadow)">
    <rect x="489" y="57" width="116" height="70" rx="17" fill="#ffffff"/>
    <path d="M514 82 L526 75 L538 82 L538 96 C538 105 532 111 526 114 C520 111 514 105 514 96 Z" fill="url(#shield)" stroke="#5aab8d" stroke-width="1.3"/>
    <path d="M521 94 L525 98 L532 89" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="549" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#366b5b" font-weight="600">AES-GCM</text>
    <text x="549" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617d95">Bütünlük</text>
  </g>

  <!-- Sağ alt: HSM -->
  <g filter="url(#shadow)">
    <rect x="489" y="190" width="116" height="70" rx="17" fill="#ffffff"/>
    <rect x="512" y="211" width="30" height="27" rx="5" fill="#eadcf4" stroke="#9c78b8" stroke-width="1.5"/>
    <circle cx="521" cy="220" r="3" fill="#9c78b8"/>
    <path d="M530 218 H536 M530 224 H536 M518 232 H536" stroke="#9c78b8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="553" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#674480" font-weight="600">HSM</text>
    <text x="553" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617d95">Anahtar</text>
  </g>

  <!-- Alt savunma şeridi -->
  <g filter="url(#smallShadow)">
    <rect x="154" y="274" width="332" height="29" rx="14.5" fill="#ffffff" opacity="0.94"/>
    <circle cx="178" cy="288.5" r="6" fill="#8bbca5"/>
    <text x="190" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496e60">Yetkilendirme</text>
    <path d="M284 288.5 H300" stroke="#adc6bb" stroke-width="1.5"/>
    <polygon points="300,288.5 294,285 294,292" fill="#adc6bb"/>
    <circle cx="316" cy="288.5" r="6" fill="#8baecb"/>
    <text x="328" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#49677e">Tekrar Koruması</text>
    <path d="M442 288.5 H456" stroke="#adc6bb" stroke-width="1.5"/>
    <polygon points="456,288.5 450,285 450,292" fill="#adc6bb"/>
    <circle cx="470" cy="288.5" r="6" fill="#b39aca"/>
  </g>
</svg>