<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="topicGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dff8"/>
    </linearGradient>
    <linearGradient id="measureGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3cf"/>
      <stop offset="100%" stop-color="#fbe5ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7890a5" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7890a5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="59" cy="53" r="44" fill="#d8f1ec" opacity="0.45"/>
  <circle cx="593" cy="75" r="58" fill="#e7dcf8" opacity="0.38"/>
  <circle cx="573" cy="288" r="42" fill="#dcefff" opacity="0.5"/>

  <text x="28" y="31" fill="#38516a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Kafka Throughput Laboratuvarı</text>
  <text x="28" y="48" fill="#72879a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Paralellik dengesi ölçümle bulunur</text>

