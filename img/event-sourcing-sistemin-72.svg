<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4edff"/>
      <stop offset="100%" stop-color="#d8e7fb"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff5ed"/>
      <stop offset="100%" stop-color="#c8e9db"/>
    </linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1d5"/>
      <stop offset="100%" stop-color="#f9dfae"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7c92a8" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7c92a8" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="60" cy="55" r="82" fill="#dbeafb" opacity="0.42"/>
  <circle cx="584" cy="277" r="95" fill="#dcefdc" opacity="0.42"/>

  <text x="32" y="33" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40576d">EVENT SOURCING</text>
  <text x="32" y="52" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718496">Olaylar değişmez, durum yeniden oluşturulur</text>

  <!-- Event store -->
  <rect x="30" y="80" width="175" height="190" rx="20" fill="url(#store)" filter="url(#shadow)"/>
  <rect x="30" y="80" width="175" height="38" rx="20" fill="#cbdcf4"/>
  <rect x="30" y="100" width="175" height="18" fill="#cbdcf4"/>
  <circle cx="53" cy="99" r="8" fill="#6f92bd"/>
  <path d="M49 99h8M53 95v8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="69" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385675">Olay Günlüğü</text>

  <line x1="55" y1="142" x2="55" y2="238" stroke="#94afca" stroke-width="2"/>
  <circle cx="55" cy="147" r="6" fill="#6799cd"/>
  <circle cx="55" cy="185" r="6" fill="#75b89b"/>
  <circle cx="55" cy="223" r="6" fill="#d39a52"/>

  <rect x="70" y="130" width="117" height="34" rx="10" fill="#f9fcff" filter="url(#smallShadow)"/>
  <text x="82" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45627e">Para Yatırıldı</text>

  <rect x="70" y="168" width="117" height="34" rx="10" fill="#f9fcff" filter="url(#smallShadow)"/>
  <text x="82" y="189" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45627e">Para Çekildi</text>

  <rect x="70" y="206" width="117" height="34" rx="10" fill="#f9fcff" filter="url(#smallShadow)"/>
  <text x="82" y="227" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45627e">Adres Değişti</text>

  <text x="50" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66809a">Sıralı • Sürümlü • Kalıcı</text>

  <!-- arrow to replay -->
  <path d="M218 176 H266" fill="none" stroke="#7b9caf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="272,176 263,170 263,182" fill="#7b9caf"/>

  <!-- replay core -->
  <rect x="278" y="121" width="124" height="110" rx="24" fill="url(#engine)" filter="url(#shadow)"/>
  <circle cx="340" cy="160" r="27" fill="#f8fffc" stroke="#9acbb6" stroke-width="2"/>
  <path d="M329 156c3-8 13-12 21-7" fill="none" stroke="#4c9b79" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="354,147 346,147 350,154" fill="#4c9b79"/>
  <path d="M351 165c-3 8-13 12-21 7" fill="none" stroke="#4c9b79" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="326,173 334,173 330,166" fill="#4c9b79"/>
  <text x="304" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#347257">Yeniden Oynat</text>

  <!-- arrow state -->
  <path d="M414 155 H456" fill="none" stroke="#7b9caf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="462,155 453,149 453,161" fill="#7b9caf"/>

  <!-- current state -->
  <rect x="469" y="103" width="142" height="105" rx="20" fill="url(#state)" filter="url(#shadow)"/>
  <circle cx="493" cy="130" r="12" fill="#e6a953"/>
  <path d="M488 130h10M493 125v10" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="514" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80582c">Güncel Durum</text>
  <line x1="488" y1="149" x2="588" y2="149" stroke="#e3c387" stroke-width="1"/>
  <text x="489" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#86683c">Bakiye: 1.250 TL</text>
  <text x="489" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7b4d">Olaylar sonucu</text>

  <!-- snapshot branch -->
  <path d="M340 242 V264 H421" fill="none" stroke="#8aa69b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="427,264 418,258 418,270" fill="#8aa69b"/>
  <rect x="438" y="239" width="173" height="54" rx="16" fill="#edf6ea" filter="url(#smallShadow)"/>
  <path d="M460 253h17v21h-17z" fill="#92bf89"/>
  <path d="M464 249h17v21h-4v-17h-13z" fill="#b2d6ab"/>
  <text x="492" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f7c50">Snapshot</text>
  <text x="492" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668666">Kalan olayları uygula</text>

  <!-- projection branch -->
  <path d="M539 216 V228" fill="none" stroke="#9da67f" stroke-width="2" stroke-linecap="round"/>
  <polygon points="539,234 533,225 545,225" fill="#9da67f"/>
  <rect x="470" y="238" width="0" height="0" fill="none"/>
  <text x="277" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668087">Sₙ = f(Sₙ₋₁, Eₙ)</text>
</svg>