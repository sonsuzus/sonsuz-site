<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5f8fda"/>
      <stop offset="100%" stop-color="#5fc39a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#57718c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="62" r="54" fill="#dcecff" opacity="0.48"/>
  <circle cx="571" cy="78" r="64" fill="#dff3df" opacity="0.52"/>
  <circle cx="333" cy="278" r="85" fill="#e8f1ff" opacity="0.42"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516c">MAKSİMUM AKIŞ</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a2">Ford-Fulkerson · artık ağ yaklaşımı</text>

  <g fill="none" stroke-linecap="round">
    <path d="M128 121 L225 92" stroke="#a7bdce" stroke-width="8" opacity="0.35"/>
    <path d="M128 121 L225 92" stroke="url(#flow)" stroke-width="4"/>
    <polygon points="217,85 232,90 221,99" fill="#5f8fda"/>

    <path d="M128 128 L225 190" stroke="#a7bdce" stroke-width="8" opacity="0.35"/>
    <path d="M128 128 L225 190" stroke="#78a8d6" stroke-width="4"/>
    <polygon points="216,180 231,193 212,196" fill="#78a8d6"/>

    <path d="M286 91 L410 121" stroke="#b6c9d8" stroke-width="8" opacity="0.35"/>
    <path d="M286 91 L410 121" stroke="#d19a62" stroke-width="4" stroke-dasharray="7 5"/>
    <polygon points="400,113 417,123 397,128" fill="#d19a62"/>

    <path d="M286 190 L410 128" stroke="#b6c9d8" stroke-width="8" opacity="0.35"/>
    <path d="M286 190 L410 128" stroke="url(#flow)" stroke-width="5"/>
    <polygon points="400,121 418,124 405,139" fill="#5fc39a"/>

    <path d="M252 123 C320 144 359 153 425 142" stroke="#91aab9" stroke-width="3" stroke-dasharray="5 5" opacity="0.75"/>
    <polygon points="415,135 429,141 416,148" fill="#91aab9"/>

    <path d="M432 119 L508 119" stroke="#b6c9d8" stroke-width="8" opacity="0.35"/>
    <path d="M432 119 L508 119" stroke="url(#flow)" stroke-width="5"/>
    <polygon points="500,112 515,119 500,126" fill="#5fc39a"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle">
    <rect x="28" y="94" width="100" height="60" rx="18" fill="#dbeaff" filter="url(#shadow)"/>
    <circle cx="52" cy="124" r="12" fill="#6b9fe2"/>
    <path d="M47 124 L57 124 M53 119 L58 124 L53 129" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="120" fill="#254c76" font-weight="700">Kaynak</text>
    <text x="91" y="137" fill="#58738d">s</text>

    <rect x="225" y="62" width="61" height="58" rx="17" fill="#e6f0ff" filter="url(#soft)"/>
    <text x="255.5" y="88" fill="#315979" font-weight="700">A</text>
    <text x="255.5" y="105" fill="#678299">düğüm</text>

    <rect x="225" y="162" width="61" height="58" rx="17" fill="#e4f7ef" filter="url(#soft)"/>
    <text x="255.5" y="188" fill="#276451" font-weight="700">B</text>
    <text x="255.5" y="205" fill="#618778">düğüm</text>

    <rect x="410" y="94" width="62" height="58" rx="17" fill="#fff0df" filter="url(#soft)"/>
    <text x="441" y="120" fill="#87552f" font-weight="700">C</text>
    <text x="441" y="137" fill="#9a7659">geçit</text>

    <rect x="508" y="94" width="104" height="60" rx="18" fill="#dff5e8" filter="url(#shadow)"/>
    <circle cx="587" cy="124" r="12" fill="#55b889"/>
    <path d="M582 124 L592 124 M588 119 L593 124 L588 129" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="548" y="120" fill="#28654f" font-weight="700">Hedef</text>
    <text x="548" y="137" fill="#5f8777">t</text>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle">
    <rect x="160" y="82" width="47" height="22" rx="11" fill="#ffffff" filter="url(#soft)"/>
    <text x="183.5" y="97" fill="#416889">8 / 10</text>

    <rect x="160" y="164" width="42" height="22" rx="11" fill="#ffffff" filter="url(#soft)"/>
    <text x="181" y="179" fill="#527895">3 / 6</text>

    <rect x="330" y="83" width="42" height="22" rx="11" fill="#fff8ef" filter="url(#soft)"/>
    <text x="351" y="98" fill="#986842">0 / 4</text>

    <rect x="331" y="171" width="42" height="22" rx="11" fill="#ffffff" filter="url(#soft)"/>
    <text x="352" y="186" fill="#3c7963">5 / 5</text>

    <rect x="471" y="90" width="42" height="22" rx="11" fill="#ffffff" filter="url(#soft)"/>
    <text x="492" y="105" fill="#3c7963">5 / 7</text>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="28" y="244" width="177" height="52" rx="16" fill="#ffffff" opacity="0.88" filter="url(#soft)"/>
    <circle cx="51" cy="270" r="12" fill="#ddecff"/>
    <text x="47" y="274" fill="#4774aa" font-weight="700">1</text>
    <text x="72" y="266" fill="#395974" font-weight="700">Artırıcı yol</text>
    <text x="72" y="282" fill="#71899c">s → B → C → t</text>

    <rect x="231" y="244" width="177" height="52" rx="16" fill="#ffffff" opacity="0.88" filter="url(#soft)"/>
    <circle cx="254" cy="270" r="12" fill="#fff0d9"/>
    <text x="250" y="274" fill="#ae7542" font-weight="700">2</text>
    <text x="275" y="266" fill="#395974" font-weight="700">Darboğaz</text>
    <text x="275" y="282" fill="#71899c">en küçük kapasite: 5</text>

    <rect x="434" y="244" width="178" height="52" rx="16" fill="#ffffff" opacity="0.88" filter="url(#soft)"/>
    <circle cx="457" cy="270" r="12" fill="#dff4e9"/>
    <text x="453" y="274" fill="#398064" font-weight="700">3</text>
    <text x="478" y="266" fill="#395974" font-weight="700">Güncelle</text>
    <text x="478" y="282" fill="#71899c">ileri azalır · ters oluşur</text>
  </g>

  <text x="320" y="231" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657f92">Kesikli çizgi: ters kenar ile geri yönlendirme</text>
</svg>