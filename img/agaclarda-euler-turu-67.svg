<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#c9e4ef"/>
    </linearGradient>
    <linearGradient id="arrayGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="1" stop-color="#fde0aa"/>
    </linearGradient>
    <linearGradient id="segGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4d9ff"/>
      <stop offset="1" stop-color="#d5c5f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#66809a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#66809a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="49" r="76" fill="#d9eff4" opacity="0.38"/>
  <circle cx="580" cy="287" r="100" fill="#e2e9d2" opacity="0.38"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">Euler Turu: Ağaçtan Aralığa</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668093">Alt ağaçlar kesintisiz dizi aralıklarına dönüşür</text>

  <!-- Tree panel -->
  <rect x="25" y="72" width="178" height="206" rx="18" fill="#fafdff" stroke="#c9dce8" filter="url(#shadow)"/>
  <text x="45" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405e71">Köklü Ağaç</text>
  <text x="45" y="118" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728a99">DFS giriş sırası</text>

  <path d="M114 145 L76 183 M114 145 L151 183 M76 183 L57 222 M76 183 L95 222 M151 183 L151 222" fill="none" stroke="#89aaba" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="114" cy="145" r="18" fill="url(#treeGrad)" stroke="#8bb4c7" filter="url(#soft)"/>
  <circle cx="76" cy="183" r="18" fill="url(#treeGrad)" stroke="#8bb4c7" filter="url(#soft)"/>
  <circle cx="151" cy="183" r="18" fill="url(#treeGrad)" stroke="#8bb4c7" filter="url(#soft)"/>
  <circle cx="57" cy="222" r="17" fill="url(#treeGrad)" stroke="#8bb4c7" filter="url(#soft)"/>
  <circle cx="95" cy="222" r="17" fill="url(#treeGrad)" stroke="#8bb4c7" filter="url(#soft)"/>
  <circle cx="151" cy="222" r="17" fill="url(#treeGrad)" stroke="#8bb4c7" filter="url(#soft)"/>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#35576b">
    <text x="114" y="149">A</text>
    <text x="76" y="187">B</text>
    <text x="151" y="187">C</text>
    <text x="57" y="226">D</text>
    <text x="95" y="226">E</text>
    <text x="151" y="226">F</text>
  </g>

  <!-- arrow 1 -->
  <path d="M213 174 C225 174 229 174 241 174" fill="none" stroke="#7195a8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="241,174 232,168 232,180" fill="#7195a8"/>
  <rect x="209" y="142" width="38" height="21" rx="10" fill="#e6f3f7"/>
  <text x="228" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#517386">DFS</text>

  <!-- Flattened array -->
  <rect x="251" y="72" width="170" height="206" rx="18" fill="#fffefd" stroke="#ead8ae" filter="url(#shadow)"/>
  <text x="271" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#755b29">Düzleştirilmiş Dizi</text>
  <text x="271" y="118" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#97805b">flat ve indeks aralığı</text>

  <rect x="270" y="143" width="130" height="48" rx="10" fill="url(#arrayGrad)" stroke="#dfbd70" filter="url(#soft)"/>
  <path d="M291.5 143 V191 M313 143 V191 M334.5 143 V191 M356 143 V191 M378 143 V191" stroke="#d4ab56" stroke-width="1"/>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#715622">
    <text x="281" y="172">A</text><text x="302" y="172">B</text><text x="324" y="172">D</text>
    <text x="345" y="172">E</text><text x="367" y="172">C</text><text x="389" y="172">F</text>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#8a795a">
    <text x="281" y="211">0</text><text x="302" y="211">1</text><text x="324" y="211">2</text>
    <text x="345" y="211">3</text><text x="367" y="211">4</text><text x="389" y="211">5</text>
  </g>
  <path d="M294 230 L354 230" fill="none" stroke="#d27d56" stroke-width="3" stroke-linecap="round"/>
  <path d="M294 226 V234 M354 226 V234" stroke="#d27d56" stroke-width="2"/>
  <rect x="280" y="240" width="88" height="22" rx="11" fill="#fff0e9"/>
  <text x="324" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#aa6042">B: [1, 3]</text>

  <!-- arrow 2 -->
  <path d="M431 174 C443 174 447 174 459 174" fill="none" stroke="#7195a8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="459,174 450,168 450,180" fill="#7195a8"/>
  <rect x="426" y="142" width="40" height="21" rx="10" fill="#eeeafd"/>
  <text x="446" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67588d">aralık</text>

  <!-- segment tree -->
  <rect x="469" y="72" width="146" height="206" rx="18" fill="#fdfcff" stroke="#d7cbed" filter="url(#shadow)"/>
  <text x="488" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c4d82">Segment Ağacı</text>
  <text x="488" y="118" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#82759e">Hızlı toplam sorgusu</text>

  <path d="M542 143 L514 174 M542 143 L570 174 M514 174 L499 208 M514 174 L529 208 M570 174 L555 208 M570 174 L585 208" fill="none" stroke="#a999ce" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="523" y="130" width="38" height="25" rx="8" fill="url(#segGrad)" stroke="#a995d0" filter="url(#soft)"/>
  <rect x="495" y="162" width="38" height="25" rx="8" fill="url(#segGrad)" stroke="#a995d0" filter="url(#soft)"/>
  <rect x="551" y="162" width="38" height="25" rx="8" fill="url(#segGrad)" stroke="#a995d0" filter="url(#soft)"/>
  <rect x="480" y="197" width="38" height="23" rx="8" fill="#eee9fc" stroke="#b5a6d8"/>
  <rect x="520" y="197" width="38" height="23" rx="8" fill="#eee9fc" stroke="#b5a6d8"/>
  <rect x="540" y="197" width="38" height="23" rx="8" fill="#eee9fc" stroke="#b5a6d8"/>
  <rect x="580" y="197" width="25" height="23" rx="8" fill="#eee9fc" stroke="#b5a6d8"/>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#584879">
    <text x="542" y="147" font-weight="700">Σ</text>
    <text x="514" y="179">Σ</text><text x="570" y="179">Σ</text>
    <text x="499" y="213">0</text><text x="539" y="213">1</text><text x="559" y="213">2</text><text x="592" y="213">3</text>
  </g>
  <rect x="487" y="238" width="109" height="25" rx="12" fill="#e8f5eb"/>
  <text x="541.5" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#48755a">Sorgu: O(log n)</text>
</svg>