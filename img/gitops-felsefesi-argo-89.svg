<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="gitKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f0ff"/>
      <stop offset="100%" stop-color="#d8e8fb"/>
    </linearGradient>
    <linearGradient id="argoKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff1df"/>
      <stop offset="100%" stop-color="#ffe1bb"/>
    </linearGradient>
    <linearGradient id="kumeKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5f7ed"/>
      <stop offset="100%" stop-color="#caecd9"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#55718b" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#55718b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="61" cy="42" r="55" fill="#dceeff" opacity="0.52"/>
  <circle cx="579" cy="273" r="78" fill="#dff2df" opacity="0.55"/>
  <path d="M30 267 C137 227 163 292 266 267 S464 229 612 255" fill="none" stroke="#cfe5df" stroke-width="2" opacity="0.75"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365269">GitOps: İstenen Durumdan Gerçek Duruma</text>

  <!-- Geliştirici -->
  <g filter="url(#hafifGolge)">
    <rect x="28" y="103" width="103" height="92" rx="18" fill="#ffffff" stroke="#d6e3ef"/>
    <circle cx="79.5" cy="129" r="16" fill="#dccdf5"/>
    <circle cx="79.5" cy="125" r="6" fill="#795da9"/>
    <path d="M67 143 Q79.5 132 92 143 L92 147 L67 147Z" fill="#795da9"/>
    <text x="79.5" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405365">Geliştirici</text>
    <text x="79.5" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7b89">İnceleme</text>
  </g>

  <!-- arrow developer git -->
  <path d="M139 149 L163 149" fill="none" stroke="#718da3" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="163,149 155,144 155,154" fill="#718da3"/>
  <text x="151" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637b8d">PR</text>

  <!-- Git -->
  <g filter="url(#golge)">
    <rect x="171" y="82" width="138" height="136" rx="20" fill="url(#gitKart)" stroke="#bdd7ef"/>
    <rect x="190" y="102" width="100" height="31" rx="9" fill="#ffffff" opacity="0.78"/>
    <path d="M203 113 L211 107 L219 113 L211 119Z" fill="#5b86b6"/>
    <circle cx="211" cy="113" r="2.5" fill="#ffffff"/>
    <text x="240" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365d81">Git Deposu</text>
    <line x1="193" y1="148" x2="286" y2="148" stroke="#b5cde3"/>
    <rect x="193" y="158" width="70" height="11" rx="5.5" fill="#89acd0" opacity="0.58"/>
    <rect x="193" y="178" width="87" height="11" rx="5.5" fill="#89acd0" opacity="0.42"/>
    <text x="240" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476c8b">Manifestler</text>
  </g>

  <!-- arrow git argo -->
  <path d="M317 150 L337 150" fill="none" stroke="#718da3" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="337,150 329,145 329,155" fill="#718da3"/>
  <text x="327" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637b8d">İzle</text>

  <!-- Argo central -->
  <g filter="url(#golge)">
    <circle cx="391" cy="150" r="61" fill="url(#argoKart)" stroke="#f0c983" stroke-width="1.4"/>
    <circle cx="391" cy="150" r="42" fill="#ffffff" opacity="0.62"/>
    <path d="M375 145 A18 18 0 0 1 403 132" fill="none" stroke="#db8c35" stroke-width="3" stroke-linecap="round"/>
    <polygon points="404,129 404,138 396,134" fill="#db8c35"/>
    <path d="M407 155 A18 18 0 0 1 379 168" fill="none" stroke="#db8c35" stroke-width="3" stroke-linecap="round"/>
    <polygon points="378,171 378,162 386,166" fill="#db8c35"/>
    <text x="391" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805321">Argo CD</text>
  </g>

  <!-- sync arrow -->
  <path d="M457 150 L480 150" fill="none" stroke="#718da3" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="480,150 472,145 472,155" fill="#718da3"/>
  <text x="468" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637b8d">Senkron</text>

  <!-- Kubernetes -->
  <g filter="url(#golge)">
    <rect x="488" y="80" width="125" height="140" rx="20" fill="url(#kumeKart)" stroke="#b5ddc5"/>
    <path d="M550 101 L568 111 L568 132 L550 142 L532 132 L532 111Z" fill="#4b9d77"/>
    <path d="M550 108 L561 114 L561 127 L550 133 L539 127 L539 114Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="550" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#33694f">Kubernetes</text>
    <rect x="510" y="174" width="80" height="12" rx="6" fill="#72b993" opacity="0.72"/>
    <rect x="521" y="194" width="58" height="9" rx="4.5" fill="#72b993" opacity="0.42"/>
  </g>

  <!-- status panel -->
  <g filter="url(#hafifGolge)">
    <rect x="232" y="246" width="177" height="48" rx="15" fill="#ffffff" stroke="#d6e4e5"/>
    <circle cx="253" cy="270" r="8" fill="#68b88a"/>
    <path d="M249 270 L252 273 L257 267" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="270" y="266" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6653">Sapma azaltılır</text>
    <text x="270" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72847b">İstenen durum = Gerçek durum</text>
  </g>

  <!-- feedback loop -->
  <path d="M550 227 C550 260 487 277 418 269" fill="none" stroke="#91b6a2" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
  <polygon points="418,269 426,264 425,274" fill="#91b6a2"/>
  <path d="M365 232 C337 222 327 208 330 190" fill="none" stroke="#e0a64d" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  <polygon points="330,190 334,199 325,197" fill="#e0a64d"/>
  <text x="462" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698575">Sürekli karşılaştırma ve iyileştirme</text>
</svg>