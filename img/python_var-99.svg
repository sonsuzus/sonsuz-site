<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python Değişkenler</text>

  <!-- Merkez kutu -->
  <rect x="245" y="55" width="150" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Değişken</text>
  <text x="320" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Bellek Bölgesi</text>

  <!-- Oklar merkezden dışa -->
  <!-- Sol üst: Veri Türü -->
  <path d="M245,75 L170,75" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="175,69 165,75 175,81" fill="#546e7a"/>

  <!-- Sağ üst: Otomatik Belirleme -->
  <path d="M395,75 L470,75" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="465,69 475,75 465,81" fill="#546e7a"/>

  <!-- Sol alt: Adlandırma Kuralları -->
  <path d="M245,105 L170,160" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="175,153 165,160 177,165" fill="#546e7a"/>

  <!-- Sağ alt: Örnek -->
  <path d="M395,105 L470,160" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="465,153 475,160 463,165" fill="#546e7a"/>

  <!-- Sol üst kutu: Veri Türü -->
  <rect x="55" y="50" width="115" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="112" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Veri Türü</text>
  <text x="112" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">int, float, string</text>

  <!-- Sağ üst kutu: Otomatik Belirleme -->
  <rect x="470" y="50" width="115" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="527" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Otomatik</text>
  <text x="527" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">Tür Belirleme</text>

  <!-- Sol alt kutu: Adlandırma Kuralları -->
  <rect x="30" y="160" width="140" height="90" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.5"/>
  <text x="100" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Adlandırma</text>
  <text x="100" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">Harf, rakam, _</text>
  <text x="100" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">Rakamla başlamaz</text>
  <text x="100" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">Büyük/küçük duyarlı</text>
  <text x="100" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">Deg ve deg farklı</text>

  <!-- Sağ alt kutu: Örnek -->
  <rect x="470" y="160" width="115" height="90" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#9575cd" stroke-width="1.5"/>
  <text x="527" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4527a0">Örnek</text>
  <text x="527" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">deg = 35</text>
  <text x="527" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">deg = 'Murat'</text>
  <text x="527" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">deg = 457.25</text>
  <text x="527" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">Tür değişir</text>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c" font-style="italic">Dinamik tür atama · Esnek değişken yapısı</text>
</svg>