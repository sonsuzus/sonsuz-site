<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#a0b8c8" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#b0c4d0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c4a6e">C Temel Veri Türleri</text>

  <!-- Merkez çekirdek: C -->
  <rect x="270" y="55" width="100" height="42" rx="12" fill="#4a90d9" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="81" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">C Dili</text>

  <!-- Beş temel veri türü - soldan sağa yayılan -->
  <!-- char -->
  <rect x="60" y="120" width="90" height="38" rx="10" fill="#f0a8c0" filter="url(#shadowLight)"/>
  <text x="105" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a2a3a">char</text>

  <!-- int -->
  <rect x="170" y="120" width="90" height="38" rx="10" fill="#f5c06a" filter="url(#shadowLight)"/>
  <text x="215" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a3a1a">int</text>

  <!-- float -->
  <rect x="280" y="120" width="90" height="38" rx="10" fill="#7ec8a0" filter="url(#shadowLight)"/>
  <text x="325" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a2a">float</text>

  <!-- double -->
  <rect x="390" y="120" width="90" height="38" rx="10" fill="#7ab8d0" filter="url(#shadowLight)"/>
  <text x="435" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a4a">double</text>

  <!-- void -->
  <rect x="500" y="120" width="90" height="38" rx="10" fill="#b0a8d0" filter="url(#shadowLight)"/>
  <text x="545" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a2a5a">void</text>

  <!-- Oklar: merkezden veri türlerine -->
  <!-- char oku -->
  <path d="M 270 78 L 155 118" stroke="#5a2a3a" stroke-width="1.8" fill="none" opacity="0.6"/>
  <polygon points="155,118 163,112 158,122" fill="#5a2a3a" opacity="0.6"/>

  <!-- int oku -->
  <path d="M 310 78 L 265 118" stroke="#5a3a1a" stroke-width="1.8" fill="none" opacity="0.6"/>
  <polygon points="265,118 273,112 268,122" fill="#5a3a1a" opacity="0.6"/>

  <!-- float oku -->
  <path d="M 340 78 L 330 118" stroke="#1a4a2a" stroke-width="1.8" fill="none" opacity="0.6"/>
  <polygon points="330,118 338,112 333,122" fill="#1a4a2a" opacity="0.6"/>

  <!-- double oku -->
  <path d="M 370 78 L 395 118" stroke="#1a3a4a" stroke-width="1.8" fill="none" opacity="0.6"/>
  <polygon points="395,118 403,112 398,122" fill="#1a3a4a" opacity="0.6"/>

  <!-- void oku -->
  <path d="M 380 78 L 505 118" stroke="#3a2a5a" stroke-width="1.8" fill="none" opacity="0.6"/>
  <polygon points="505,118 513,112 508,122" fill="#3a2a5a" opacity="0.6"/>

  <!-- Değiştiriciler bölümü -->
  <text x="320" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c4a6e">Veri Türü Değiştiricileri</text>

  <!-- Değiştirici kutuları -->
  <rect x="60" y="215" width="100" height="34" rx="8" fill="#d4e8f0" filter="url(#shadowLight)" stroke="#8ab0c0" stroke-width="1"/>
  <text x="110" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a5a">signed</text>

  <rect x="180" y="215" width="100" height="34" rx="8" fill="#d4e8f0" filter="url(#shadowLight)" stroke="#8ab0c0" stroke-width="1"/>
  <text x="230" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a5a">unsigned</text>

  <rect x="300" y="215" width="100" height="34" rx="8" fill="#d4e8f0" filter="url(#shadowLight)" stroke="#8ab0c0" stroke-width="1"/>
  <text x="350" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a5a">long</text>

  <rect x="420" y="215" width="100" height="34" rx="8" fill="#d4e8f0" filter="url(#shadowLight)" stroke="#8ab0c0" stroke-width="1"/>
  <text x="470" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a5a">short</text>

  <!-- Uygulandığı türler -->
  <text x="110" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a8a">char, int</text>
  <text x="230" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a8a">char, int</text>
  <text x="350" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a8a">int, double</text>
  <text x="470" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a8a">int</text>

  <!-- Değiştirici okları -->
  <path d="M 110 215 L 110 195" stroke="#8ab0c0" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M 230 215 L 230 195" stroke="#8ab0c0" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M 350 215 L 350 195" stroke="#8ab0c0" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.5"/>
  <path d="M 470 215 L 470 195" stroke="#8ab0c0" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Alt not -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a9aaa">İfadeler, değişkenler ve sabitler üzerinde işlemcilerle çalışır</text>
</svg>