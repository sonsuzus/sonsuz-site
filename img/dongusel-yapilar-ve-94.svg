<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="loopFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#cde4f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6c8ca0" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#66819a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="116" fill="#d9eef3" opacity="0.32"/>
  <circle cx="320" cy="160" r="91" fill="none" stroke="#9dc8d2" stroke-width="2" stroke-dasharray="5 7" opacity="0.7"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#416173">DÖNGÜSEL İTERASYON</text>

  <!-- Left while branch -->
  <rect x="30" y="83" width="143" height="63" rx="16" fill="#fff5dc" filter="url(#shadow)"/>
  <circle cx="56" cy="114" r="15" fill="#f4c76e"/>
  <text x="56" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805b14">?</text>
  <text x="116" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#72582e">while</text>
  <text x="116" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#876f48">Koşul doğruysa</text>

  <path d="M173 114 L206 128" fill="none" stroke="#7994a1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="208,129 198,121 200,132" fill="#7994a1"/>

  <!-- Right for branch -->
  <rect x="467" y="83" width="143" height="63" rx="16" fill="#e6f5df" filter="url(#shadow)"/>
  <rect x="486" y="99" width="28" height="28" rx="7" fill="#9fd28c"/>
  <path d="M493 107 H507 M493 113 H507 M493 119 H503" stroke="#41713a" stroke-width="2" stroke-linecap="round"/>
  <text x="555" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42703d">for</text>
  <text x="555" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557a52">Koleksiyon gez</text>

  <path d="M467 114 L434 128" fill="none" stroke="#7994a1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="432,129 440,121 442,132" fill="#7994a1"/>

  <!-- core -->
  <rect x="214" y="106" width="212" height="108" rx="25" fill="url(#loopFill)" filter="url(#shadow)"/>
  <text x="320" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b71">İTERASYON</text>

  <rect x="232" y="146" width="49" height="38" rx="10" fill="#ffffff" filter="url(#soft)"/>
  <text x="256.5" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#476578">Başla</text>
  <text x="256.5" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7a8c">i = 0</text>

  <rect x="296" y="146" width="49" height="38" rx="10" fill="#ffffff" filter="url(#soft)"/>
  <text x="320.5" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#476578">Koşul</text>
  <text x="320.5" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7a8c">doğru?</text>

  <rect x="360" y="146" width="49" height="38" rx="10" fill="#ffffff" filter="url(#soft)"/>
  <text x="384.5" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#476578">Güncelle</text>
  <text x="384.5" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7a8c">i + 1</text>

  <path d="M282 165 H292" stroke="#6d92a5" stroke-width="2"/>
  <polygon points="295,165 288,161 288,169" fill="#6d92a5"/>
  <path d="M346 165 H356" stroke="#6d92a5" stroke-width="2"/>
  <polygon points="359,165 352,161 352,169" fill="#6d92a5"/>

  <!-- circular return -->
  <path d="M386 195 C386 231 254 235 254 195" fill="none" stroke="#5d9eae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="254,192 248,201 260,200" fill="#5d9eae"/>
  <text x="320" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527b88">tekrar</text>

  <!-- output and controls -->
  <path d="M320 215 V255" fill="none" stroke="#7994a1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320,258 314,249 326,249" fill="#7994a1"/>

  <rect x="254" y="260" width="132" height="39" rx="14" fill="#f3e5f8" filter="url(#soft)"/>
  <text x="320" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#734b82">İşlem sonucu</text>

  <rect x="52" y="230" width="115" height="42" rx="14" fill="#ffe7e3" filter="url(#soft)"/>
  <text x="109.5" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#9a5048">break · bitir</text>
  <path d="M167 251 H221" fill="none" stroke="#bd7a70" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="224,251 216,247 216,255" fill="#bd7a70"/>

  <rect x="473" y="230" width="115" height="42" rx="14" fill="#e5f1ff" filter="url(#soft)"/>
  <text x="530.5" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4b7198">continue · atla</text>
  <path d="M473 251 H419" fill="none" stroke="#7397b9" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="416,251 424,247 424,255" fill="#7397b9"/>

  <text x="40" y="302" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8791">O(n) · her tur sabit iş</text>
  <text x="600" y="302" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8791">n² · iç içe döngü</text>
</svg>