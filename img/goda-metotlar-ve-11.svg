<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#90a4ae" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#90a4ae" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#37474f">Go Metotları ve Receiver Mantığı</text>

  <!-- Sol üst: Struct (Veri) -->
  <rect x="30" y="50" width="160" height="70" rx="10" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Struct (Veri)</text>
  <text x="110" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Rectangle, Account, Task</text>
  <text x="110" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">Alanlar: Width, Balance...</text>

  <!-- Sağ üst: Metotlar (Davranış) -->
  <rect x="450" y="50" width="160" height="70" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Metotlar (Davranış)</text>
  <text x="530" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Area, Deposit, Complete</text>
  <text x="530" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">İşlemler ve sorgular</text>

  <!-- Ok: Struct -> Metotlar -->
  <path d="M190 85 L440 85" stroke="#78909c" stroke-width="2" fill="none"/>
  <polygon points="440,80 452,85 440,90" fill="#78909c"/>

  <!-- Orta: Receiver Bağlantısı -->
  <rect x="230" y="140" width="180" height="60" rx="10" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Receiver Bağlantısı</text>
  <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">(r Rectangle) veya (a *Account)</text>

  <!-- Alt sol: Value Receiver -->
  <rect x="30" y="240" width="180" height="55" rx="10" fill="#fce4ec" stroke="#f48fb1" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="120" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Value Receiver</text>
  <text x="120" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Kopya üzerinde çalışır</text>

  <!-- Alt sağ: Pointer Receiver -->
  <rect x="430" y="240" width="180" height="55" rx="10" fill="#ede7f6" stroke="#b39ddb" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="520" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4527a0">Pointer Receiver</text>
  <text x="520" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Orijinal veriyi değiştirir</text>

  <!-- Bağlantılar: Receiver -> Alt kutular -->
  <path d="M260 200 L120 235" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="120,230 112,238 128,238" fill="#78909c"/>

  <path d="M380 200 L500 235" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="500,230 492,238 508,238" fill="#78909c"/>

  <!-- Alt orta: Go Felsefesi -->
  <rect x="230" y="245" width="180" height="45" rx="10" fill="#e0f7fa" stroke="#80deea" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="320" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#00838f">Az sihir, çok netlik</text>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Sınıf yok, kalıtım yok</text>

  <!-- OOP Karşılaştırma notu -->
  <rect x="30" y="140" width="160" height="50" rx="10" fill="#f1f8e9" stroke="#c5e1a5" stroke-width="1.5" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="110" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#558b2f">Klasik OOP</text>
  <text x="110" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">class, this, kalıtım</text>

  <rect x="450" y="140" width="160" height="50" rx="10" fill="#f1f8e9" stroke="#c5e1a5" stroke-width="1.5" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="530" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#558b2f">Go Yaklaşımı</text>
  <text x="530" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">struct, receiver, interface</text>

  <!-- Karşılaştırma okları -->
  <path d="M190 165 L230 165" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="230,160 240,165 230,170" fill="#78909c"/>

  <path d="M410 165 L450 165" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="450,160 460,165 450,170" fill="#78909c"/>
</svg>