<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8e8"/>
      <stop offset="100%" stop-color="#f8d0d0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#cceacc"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Python Yield ve Generator Mimarisi</text>

  <!-- Merkez kavram -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#box5)" filter="url(#shadow)" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="320" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">yield</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a1b9a">deyimi</text>

  <!-- Üst katman - Iterable -->
  <rect x="60" y="50" width="160" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="140" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#283593">Iterable</text>
  <text x="140" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3949ab">liste, demet vb.</text>

  <!-- Üst katman - Iterator -->
  <rect x="420" y="50" width="160" height="45" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#e53935" stroke-width="1.5"/>
  <text x="500" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#b71c1c">Iterator</text>
  <text x="500" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c62828">iter() döner</text>

  <!-- Alt katman - Generator -->
  <rect x="60" y="220" width="160" height="45" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#43a047" stroke-width="1.5"/>
  <text x="140" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Generator</text>
  <text x="140" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">yield içerir</text>

  <!-- Alt katman - for döngüsü -->
  <rect x="420" y="220" width="160" height="45" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="500" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">for döngüsü</text>
  <text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ef6c00">elemanları sıralar</text>

  <!-- Sağ alt - Örnek kod -->
  <rect x="245" y="260" width="150" height="40" rx="10" fill="url(#box6)" filter="url(#shadow)" stroke="#00acc1" stroke-width="1.5"/>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#006064">a = [1,2,3,4,5]</text>
  <text x="320" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#00838f">for k in a: print(k)</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Iterable -> yield -->
  <path d="M 220 72 L 240 72 L 240 130 L 243 130" stroke="#5c6bc0" stroke-width="2" fill="none"/>
  <polygon points="243,125 251,130 243,135" fill="#5c6bc0"/>

  <!-- Iterator -> yield -->
  <path d="M 420 72 L 400 72 L 400 130 L 397 130" stroke="#e53935" stroke-width="2" fill="none"/>
  <polygon points="397,125 389,130 397,135" fill="#e53935"/>

  <!-- yield -> Generator -->
  <path d="M 270 170 L 270 200 L 220 200 L 220 218" stroke="#43a047" stroke-width="2" fill="none"/>
  <polygon points="215,218 220,226 225,218" fill="#43a047"/>

  <!-- yield -> for -->
  <path d="M 370 170 L 370 200 L 500 200 L 500 218" stroke="#fb8c00" stroke-width="2" fill="none"/>
  <polygon points="495,218 500,226 505,218" fill="#fb8c00"/>

  <!-- yield -> örnek -->
  <path d="M 320 170 L 320 258" stroke="#00acc1" stroke-width="2" fill="none"/>
  <polygon points="315,258 320,266 325,258" fill="#00acc1"/>

  <!-- Iterable -> Iterator (üst bağlantı) -->
  <path d="M 220 72 L 418 72" stroke="#78909c" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <polygon points="418,68 426,72 418,76" fill="#78909c"/>

  <!-- Generator -> for (alt bağlantı) -->
  <path d="M 220 242 L 418 242" stroke="#78909c" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <polygon points="418,238 426,242 418,246" fill="#78909c"/>

  <!-- Etiketler -->
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a" font-style="italic">iter() fonksiyonu</text>
  <text x="320" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a" font-style="italic">ortak arayüz</text>
</svg>