<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="bios" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dcf7"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff5e7"/>
      <stop offset="100%" stop-color="#bfe7cf"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0cb"/>
      <stop offset="100%" stop-color="#f7dca0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9defb"/>
      <stop offset="100%" stop-color="#d4c2ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#75849b" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#75849b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="45" r="74" fill="#cfe5fa" opacity="0.32"/>
  <circle cx="591" cy="286" r="100" fill="#d8efd1" opacity="0.34"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45536b">BIOS İLE BOOTLOADER AÇILIŞ ZİNCİRİ</text>

  <!-- connection paths -->
  <path d="M143 157 H174" fill="none" stroke="#7191b1" stroke-width="3" stroke-linecap="round"/>
  <polygon points="174,157 165,151 165,163" fill="#7191b1"/>
  <path d="M279 157 H310" fill="none" stroke="#7191b1" stroke-width="3" stroke-linecap="round"/>
  <polygon points="310,157 301,151 301,163" fill="#7191b1"/>
  <path d="M417 157 H448" fill="none" stroke="#7191b1" stroke-width="3" stroke-linecap="round"/>
  <polygon points="448,157 439,151 439,163" fill="#7191b1"/>
  <path d="M553 157 H579" fill="none" stroke="#7191b1" stroke-width="3" stroke-linecap="round"/>
  <polygon points="579,157 570,151 570,163" fill="#7191b1"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#44536a">
    <text x="158" y="143" text-anchor="middle">denetler</text>
    <text x="294" y="143" text-anchor="middle">yükler</text>
    <text x="432" y="143" text-anchor="middle">devreder</text>
    <text x="565" y="143" text-anchor="middle">yazar</text>
  </g>

  <!-- BIOS -->
  <g filter="url(#shadow)">
    <rect x="38" y="104" width="105" height="106" rx="18" fill="url(#bios)" stroke="#a8c4e4"/>
    <rect x="49" y="116" width="83" height="31" rx="10" fill="#f8fcff" opacity="0.78"/>
    <path d="M64 132 h12 M70 126 v12 M92 126 l8 6 -8 6 M108 126 v12" fill="none" stroke="#6385ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f5e82">BIOS</text>
    <text x="90" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a86">Başlangıç</text>
  </g>

  <!-- Disk -->
  <g filter="url(#shadow)">
    <rect x="174" y="104" width="105" height="106" rx="18" fill="url(#disk)" stroke="#9dcdb0"/>
    <ellipse cx="226.5" cy="126" rx="29" ry="10" fill="#f5fff8" stroke="#77ad8c" stroke-width="1.5"/>
    <path d="M197.5 126 v28 c0 5.5 13 10 29 10s29-4.5 29-10v-28" fill="#d0edda" stroke="#77ad8c" stroke-width="1.5"/>
    <path d="M197.5 141 c0 5.5 13 10 29 10s29-4.5 29-10 M197.5 154 c0 5.5 13 10 29 10s29-4.5 29-10" fill="none" stroke="#77ad8c" stroke-width="1.2"/>
    <text x="226.5" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426b51">Disk</text>
    <text x="226.5" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52775e">İlk sektör</text>
  </g>

  <!-- Boot sector -->
  <g filter="url(#shadow)">
    <rect x="310" y="91" width="107" height="132" rx="18" fill="url(#memory)" stroke="#e3bd6d"/>
    <rect x="325" y="106" width="77" height="16" rx="5" fill="#fff9e8"/>
    <text x="363.5" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#84622c">512 BAYT</text>
    <rect x="325" y="130" width="77" height="39" rx="6" fill="#fffdf5" stroke="#e8ca86"/>
    <path d="M337 141 h41 M337 150 h29 M337 159 h36" stroke="#b38a42" stroke-width="2" stroke-linecap="round"/>
    <rect x="325" y="176" width="77" height="28" rx="6" fill="#f4cd77"/>
    <text x="363.5" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#77521c">0xAA55</text>
  </g>

  <!-- CPU -->
  <g filter="url(#shadow)">
    <rect x="448" y="104" width="105" height="106" rx="18" fill="#f4e7f8" stroke="#c9add8"/>
    <rect x="467" y="119" width="67" height="48" rx="10" fill="#fffaff" stroke="#af8dc2" stroke-width="1.5"/>
    <path d="M478 131 h45 M478 143 h45 M478 155 h45 M480 126 v34 M492 126 v34 M504 126 v34 M516 126 v34" stroke="#9b78af" stroke-width="1"/>
    <path d="M459 130 h8 M459 145 h8 M459 160 h8 M534 130 h8 M534 145 h8 M534 160 h8" stroke="#9b78af" stroke-width="2" stroke-linecap="round"/>
    <text x="500.5" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#674a77">CPU</text>
    <text x="500.5" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#755b83">16-bit kip</text>
  </g>

  <!-- Screen -->
  <g filter="url(#shadow)">
    <rect x="579" y="104" width="48" height="106" rx="18" fill="url(#screen)" stroke="#bca5d5"/>
    <rect x="587" y="119" width="32" height="39" rx="5" fill="#514668"/>
    <path d="M592 130 h20 M592 138 h15 M592 146 h18" stroke="#c8f0c1" stroke-width="2" stroke-linecap="round"/>
    <path d="M594 169 h18 M603 158 v11" stroke="#806792" stroke-width="2" stroke-linecap="round"/>
    <text x="603" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#634c75">Ekran</text>
    <text x="603" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#755e85">Mesaj</text>
  </g>

  <!-- lower technical strip -->
  <g filter="url(#soft)">
    <rect x="72" y="251" width="496" height="43" rx="15" fill="#ffffff" opacity="0.82"/>
  </g>
  <path d="M190 272 H245 M325 272 H381 M459 272 H514" fill="none" stroke="#a3b5c4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="245,272 238,267 238,277" fill="#839caf"/>
  <polygon points="381,272 374,267 374,277" fill="#839caf"/>
  <polygon points="514,272 507,267 507,277" fill="#839caf"/>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f6072">
    <text x="130" y="276" text-anchor="middle">0x7C00</text>
    <text x="285" y="276" text-anchor="middle">Segment</text>
    <text x="420" y="276" text-anchor="middle">BIOS kesmesi</text>
    <text x="543" y="276" text-anchor="middle">int 0x10</text>
  </g>
</svg>