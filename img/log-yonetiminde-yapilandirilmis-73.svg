<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="jsonBaslik" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f3ed"/>
      <stop offset="100%" stop-color="#cce8ff"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8493" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8493" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="72" cy="36" r="54" fill="#dcefff" opacity="0.55"/>
  <circle cx="589" cy="282" r="76" fill="#dff3d9" opacity="0.5"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">Yapılandırılmış Loglama Akışı</text>

  <!-- left source -->
  <g filter="url(#golge)">
    <rect x="26" y="91" width="150" height="143" rx="18" fill="#fff7e8"/>
    <rect x="26" y="91" width="150" height="35" rx="18" fill="#ffe5b7"/>
    <rect x="26" y="109" width="150" height="17" fill="#ffe5b7"/>
  </g>
  <text x="101" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76552c">Düz Metin Log</text>
  <rect x="42" y="143" width="118" height="14" rx="5" fill="#ebd7b5"/>
  <rect x="42" y="166" width="94" height="9" rx="4.5" fill="#e4cfaa"/>
  <rect x="42" y="184" width="108" height="9" rx="4.5" fill="#e4cfaa"/>
  <rect x="42" y="202" width="73" height="9" rx="4.5" fill="#e4cfaa"/>
  <text x="101" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6b41">Belirsiz alanlar</text>

  <!-- arrow 1 -->
  <path d="M187 162 L222 162" fill="none" stroke="#8fa4ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="222,162 213,157 213,167" fill="#8fa4ae"/>
  <text x="205" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#627984">ayrıştır</text>

  <!-- parser -->
  <g filter="url(#hafifGolge)">
    <rect x="231" y="126" width="90" height="72" rx="16" fill="#e7e2ff"/>
  </g>
  <circle cx="276" cy="151" r="13" fill="#a596df"/>
  <path d="M270 151 L274 155 L282 146" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="276" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c5290">Dönüştür</text>

  <!-- arrow 2 -->
  <path d="M332 162 L365 162" fill="none" stroke="#8fa4ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="365,162 356,157 356,167" fill="#8fa4ae"/>

  <!-- JSON central -->
  <g filter="url(#golge)">
    <rect x="376" y="62" width="146" height="200" rx="19" fill="#ffffff"/>
    <rect x="376" y="62" width="146" height="42" rx="19" fill="url(#jsonBaslik)"/>
    <rect x="376" y="84" width="146" height="20" fill="url(#jsonBaslik)"/>
  </g>
  <text x="449" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#256475">JSON Olayı</text>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="391" y="119" width="116" height="21" rx="7" fill="#e9f4ff"/>
    <text x="402" y="134" fill="#46708b">zaman</text>
    <rect x="461" y="124" width="34" height="10" rx="4" fill="#94c6e8"/>

    <rect x="391" y="146" width="116" height="21" rx="7" fill="#eaf8ed"/>
    <text x="402" y="161" fill="#46735a">servis</text>
    <rect x="461" y="151" width="34" height="10" rx="4" fill="#9dccaa"/>

    <rect x="391" y="173" width="116" height="21" rx="7" fill="#fff2dd"/>
    <text x="402" y="188" fill="#896d42">olay</text>
    <rect x="461" y="178" width="34" height="10" rx="4" fill="#e7ba78"/>

    <rect x="391" y="200" width="116" height="21" rx="7" fill="#f1ebff"/>
    <text x="402" y="215" fill="#695a99">süre ms</text>
    <rect x="461" y="205" width="34" height="10" rx="4" fill="#b8a7e9"/>

    <rect x="391" y="227" width="116" height="21" rx="7" fill="#ffecef"/>
    <text x="402" y="242" fill="#915565">iz kimliği</text>
    <rect x="461" y="232" width="34" height="10" rx="4" fill="#e6a1ae"/>
  </g>

  <!-- output branches -->
  <path d="M534 138 C552 138 552 94 568 94" fill="none" stroke="#7d9baa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="568,94 559,89 559,99" fill="#7d9baa"/>
  <path d="M534 188 C552 188 552 230 568 230" fill="none" stroke="#7d9baa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="568,230 559,225 559,235" fill="#7d9baa"/>

  <!-- right nodes -->
  <g filter="url(#hafifGolge)">
    <rect x="575" y="61" width="52" height="66" rx="15" fill="#dceeff"/>
    <rect x="575" y="197" width="52" height="66" rx="15" fill="#e4f4dc"/>
  </g>
  <circle cx="601" cy="83" r="10" fill="#69a9d1"/>
  <path d="M596 83 L600 87 L607 78" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="601" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356a8b">Sorgu</text>

  <path d="M592 222 L601 213 L610 222 L610 237 L592 237 Z" fill="#78af79"/>
  <path d="M601 207 L601 219" stroke="#78af79" stroke-width="3" stroke-linecap="round"/>
  <text x="601" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c7b4d">Alarm</text>

  <text x="449" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52717c">Tutarlı • Güvenli • Sorgulanabilir</text>
</svg>