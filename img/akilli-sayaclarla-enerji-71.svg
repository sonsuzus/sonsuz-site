  <g filter="url(#smallShadow)">
    <rect x="557" y="51" width="67" height="53" rx="14" fill="url(#grid)"/>
    <path d="M577 86 L577 70 L582 70 L582 62 L587 70 L592 70 L592 86" fill="none" stroke="#a8752f" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="600" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#805d31">Üretim</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="557" y="109" width="67" height="53" rx="14" fill="#ddecfa"/>
    <rect x="577" y="119" width="26" height="18" rx="4" fill="none" stroke="#5c8eae" stroke-width="1.8"/>
    <path d="M603 125 L608 125 L608 131 L603 131 M572 125 L577 125 M572 131 L577 131" stroke="#5c8eae" stroke-width="1.8" stroke-linecap="round"/>
    <text x="590" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b718d">Batarya</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="557" y="180" width="67" height="53" rx="14" fill="#e2f3de"/>
    <path d="M579 212 C580 201 589 197 600 198 C600 208 591 215 579 212 Z" fill="#7cad74"/>
    <path d="M580 211 L598 199" stroke="#4d8b62" stroke-width="1.5"/>
    <text x="590" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527a58">Talep Yönetimi</text>
  </g>

  <!-- security footer -->
  <g filter="url(#smallShadow)">
    <rect x="182" y="232" width="336" height="48" rx="16" fill="#eef2fb"/>
    <path d="M212 246 L224 241 L236 246 L236 256 C236 265 224 270 224 270 C224 270 212 265 212 256 Z" fill="#d5def3" stroke="#687da9" stroke-width="1.4"/>
    <rect x="219" y="251" width="10" height="9" rx="2" fill="none" stroke="#5d729e" stroke-width="1.6"/>
    <path d="M221 251 L221 248 C221 244 227 244 227 248 L227 251" fill="none" stroke="#5d729e" stroke-width="1.6"/>
    <text x="254" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#596c95">Güvenli İletişim</text>
    <text x="254" y="271" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71809d">Şifreleme • Anonimleştirme • Doğrulama</text>
  </g>
</svg>