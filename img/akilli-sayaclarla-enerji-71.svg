<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9edff"/>
      <stop offset="100%" stop-color="#c7dffc"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f5e8"/>
      <stop offset="100%" stop-color="#bde6d4"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0c9"/>
      <stop offset="100%" stop-color="#f9d99b"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7591a2" flood-opacity="0.2"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6b8795" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="52" r="66" fill="#dceeff" opacity="0.38"/>
  <circle cx="582" cy="286" r="95" fill="#dff2d5" opacity="0.38"/>
  <path d="M22 277 C125 236 138 308 234 275 S402 235 618 274" fill="none" stroke="#c8dfd5" stroke-width="1.5" opacity="0.65"/>

  <!-- left source area -->
  <text x="61" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#41657b">ANLIK ÖLÇÜM</text>

  <g filter="url(#shadow)">
    <rect x="24" y="48" width="110" height="66" rx="16" fill="url(#meter)"/>
    <rect x="39" y="61" width="28" height="39" rx="7" fill="#f8fcff" stroke="#82a8c7" stroke-width="1.5"/>
    <rect x="45" y="68" width="16" height="9" rx="2" fill="#a9d9c2"/>
    <path d="M48 87 L52 82 L56 89 L60 81" fill="none" stroke="#4f8eab" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="75" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#315b76">Akıllı Sayaç</text>
    <text x="78" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52738a">1–30 dk</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="24" y="137" width="110" height="54" rx="15" fill="#e9e1fb"/>
    <path d="M46 171 L46 152 L54 152 L54 171 M58 171 L58 145 L66 145 L66 171 M70 171 L70 155 L78 155 L78 171" fill="none" stroke="#8069a8" stroke-width="2" stroke-linejoin="round"/>
    <text x="87" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#655080">Şehir Yükü</text>
    <text x="87" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b6c94">tüketim</text>
  </g>

