    <path d="M215 151 L223 142 L231 146 L242 128 L254 134" fill="none" stroke="#45a07e" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="215" cy="151" r="2.6" fill="#45a07e"/>
    <circle cx="223" cy="142" r="2.6" fill="#45a07e"/>
    <circle cx="231" cy="146" r="2.6" fill="#45a07e"/>
    <circle cx="242" cy="128" r="2.6" fill="#45a07e"/>
    <circle cx="254" cy="134" r="2.6" fill="#45a07e"/>
    <text x="235" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397160">Temizleme</text>

    <rect x="281" y="106" width="68" height="66" rx="12" fill="#f8fffb" opacity="0.93"/>
    <path d="M295 150 C301 135 310 156 316 139 S330 135 336 126" fill="none" stroke="#4787a3" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M296 156 L336 156" stroke="#a5cdd4" stroke-width="1.3"/>
    <text x="315" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397160">Talep Tahmini</text>
  </g>

  <!-- right connection -->
  <path d="M373 134 L401 134" stroke="#598f78" stroke-width="2.5"/>
  <polygon points="401,134 392,129 392,139" fill="#598f78"/>

  <!-- optimization hub -->
  <g filter="url(#shadow)">
    <rect x="406" y="81" width="112" height="105" rx="21" fill="#dff0e8"/>
    <circle cx="462" cy="117" r="24" fill="#f7fffa" stroke="#8bbba4" stroke-width="1.5"/>
    <path d="M462 99 L462 117 L476 125" fill="none" stroke="#508b72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="462" cy="117" r="3.5" fill="#508b72"/>
    <text x="462" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356855">Dengeleme</text>
    <text x="462" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527a69">Optimizasyon</text>
  </g>

  <!-- outgoing branches -->
  <path d="M523 111 C537 111 540 78 553 78" fill="none" stroke="#d29c51" stroke-width="2.1"/>
  <polygon points="553,78 544,74 546,84" fill="#d29c51"/>
  <path d="M523 135 L553 135" fill="none" stroke="#638fb0" stroke-width="2.1"/>
  <polygon points="553,135 544,130 544,140" fill="#638fb0"/>
  <path d="M523 158 C538 158 539 207 553 207" fill="none" stroke="#68a183" stroke-width="2.1"/>
  <polygon points="553,207 544,202 546,212" fill="#68a183"/>

