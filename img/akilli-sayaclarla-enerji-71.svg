  <path d="M139 81 C157 81 158 116 177 116" fill="none" stroke="#72a5c5" stroke-width="2.2"/>
  <polygon points="177,116 168,111 169,121" fill="#72a5c5"/>
  <path d="M139 164 C158 164 158 143 177 143" fill="none" stroke="#947bb7" stroke-width="2.2"/>
  <polygon points="177,143 168,138 169,148" fill="#947bb7"/>

