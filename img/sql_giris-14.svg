<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b9bd5"/>
      <stop offset="100%" stop-color="#4a8bbf"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70ad47"/>
      <stop offset="100%" stop-color="#5e9e3a"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f0a030"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b7ed8"/>
      <stop offset="100%" stop-color="#8a6cc7"/>
    </linearGradient>
    <linearGradient id="permGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e57373"/>
      <stop offset="100%" stop-color="#d45c5c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">SQL ve İlişkisel Veritabanı Mimarisi</text>

  <!-- Merkez: SQL -->
  <rect x="245" y="50" width="150" height="42" rx="21" fill="url(#sqlGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SQL</text>

  <!-- Ok: SQL -> Veritabanı -->
  <path d="M 320 92 L 320 118" stroke="#4a8bbf" stroke-width="2" fill="none"/>
  <polygon points="314,116 320,128 326,116" fill="#4a8bbf"/>

  <!-- Katman 1: Veritabanı -->
  <rect x="225" y="130" width="190" height="38" rx="10" fill="url(#dbGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Veritabanı</text>
  <text x="320" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#e8f5e0" opacity="0.9">Tabloları barındırır</text>

  <!-- Ok: Veritabanı -> Tablolar -->
  <path d="M 320 168 L 320 192" stroke="#5e9e3a" stroke-width="2" fill="none"/>
  <polygon points="314,190 320,202 326,190" fill="#5e9e3a"/>

  <!-- Katman 2: Tablolar -->
  <rect x="205" y="204" width="230" height="38" rx="10" fill="url(#tableGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Tablolar</text>
  <text x="320" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff8e0" opacity="0.9">Sütunlar ve satırlar</text>

  <!-- Yan dallar: Kullanıcılar ve Yetkiler -->
  <!-- Sol: Kullanıcılar -->
  <rect x="30" y="130" width="140" height="38" rx="10" fill="url(#userGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="100" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Kullanıcılar</text>
  <text x="100" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#f0e8ff" opacity="0.9">Erişim yetkisi tanımı</text>

  <!-- Ok: Kullanıcılar -> Veritabanı -->
  <path d="M 170 149 L 223 149" stroke="#8a6cc7" stroke-width="2" fill="none"/>
  <polygon points="218,143 230,149 218,155" fill="#8a6cc7"/>

  <!-- Sağ: Yetkiler -->
  <rect x="470" y="130" width="140" height="38" rx="10" fill="url(#permGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="540" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Yetkiler</text>
  <text x="540" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#ffe8e8" opacity="0.9">Erişim derecesi</text>

  <!-- Ok: Yetkiler -> Veritabanı -->
  <path d="M 470 149 L 417 149" stroke="#d45c5c" stroke-width="2" fill="none"/>
  <polygon points="422,143 410,149 422,155" fill="#d45c5c"/>

  <!-- Alt bilgi: Standartlar -->
  <rect x="180" y="270" width="280" height="34" rx="8" fill="#ffffff" filter="url(#shadowLight)" opacity="0.8" stroke="#c0d8e8" stroke-width="1"/>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">ANSI (1986) ve ISO (1987) standartları</text>
  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7f8c8d">Tüm modern RDBMS sistemlerde ortak dil</text>

  <!-- Bağlantı çizgisi: Tablolar -> Alt bilgi -->
  <path d="M 320 242 L 320 268" stroke="#b0c4d8" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="315,266 320,276 325,266" fill="#b0c4d8"/>
</svg>