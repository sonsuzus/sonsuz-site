<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e5f7"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e4"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#d1efd1"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e8f8"/>
      <stop offset="100%" stop-color="#e0d0f0"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8ec"/>
      <stop offset="100%" stop-color="#ffd5dd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Legacy Kod Karşısında Empati</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">Teknik Mirası Yargılamadan Okumak</text>

  <!-- Merkez kavram -->
  <rect x="245" y="65" width="150" height="44" rx="22" fill="url(#grad1)" filter="url(#shadow)" stroke="#b0c8e8" stroke-width="1"/>
  <text x="320" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Empatik Yaklaşım</text>
  <text x="320" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a8a">Bağlamı Anlamak</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üst ok -->
  <path d="M170,95 L235,85" stroke="#7a9aba" stroke-width="1.5" fill="none"/>
  <polygon points="235,85 227,81 228,89" fill="#7a9aba"/>

  <!-- Sağ üst ok -->
  <path d="M470,95 L405,85" stroke="#7a9aba" stroke-width="1.5" fill="none"/>
  <polygon points="405,85 413,81 412,89" fill="#7a9aba"/>

  <!-- Sol alt ok -->
  <path d="M170,155 L235,145" stroke="#7a9aba" stroke-width="1.5" fill="none"/>
  <polygon points="235,145 227,141 228,149" fill="#7a9aba"/>

  <!-- Sağ alt ok -->
  <path d="M470,155 L405,145" stroke="#7a9aba" stroke-width="1.5" fill="none"/>
  <polygon points="405,145 413,141 412,149" fill="#7a9aba"/>

  <!-- Alt ok -->
  <path d="M320,175 L320,195" stroke="#7a9aba" stroke-width="1.5" fill="none"/>
  <polygon points="320,195 316,187 324,187" fill="#7a9aba"/>

  <!-- Sol üst kavram: Tarihsel Bağlam -->
  <rect x="40" y="65" width="120" height="44" rx="10" fill="url(#grad2)" filter="url(#shadowLight)" stroke="#e0c8a0" stroke-width="1"/>
  <text x="100" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#5a4a2a">Tarihsel Bağlam</text>
  <text x="100" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7a6a4a">Kararlar ve Kısıtlar</text>

  <!-- Sağ üst kavram: Kod Arkeolojisi -->
  <rect x="480" y="65" width="120" height="44" rx="10" fill="url(#grad3)" filter="url(#shadowLight)" stroke="#a0d0a0" stroke-width="1"/>
  <text x="540" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a5a2a">Kod Arkeolojisi</text>
  <text x="540" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a7a4a">İpuçlarını Kazmak</text>

  <!-- Sol alt kavram: Güvenli İyileştirme -->
  <rect x="40" y="125" width="120" height="44" rx="10" fill="url(#grad4)" filter="url(#shadowLight)" stroke="#c0b0d8" stroke-width="1"/>
  <text x="100" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#4a2a6a">Güvenli İyileştirme</text>
  <text x="100" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#6a4a8a">Küçük Adımlar</text>

  <!-- Sağ alt kavram: Ekip Kültürü -->
  <rect x="480" y="125" width="120" height="44" rx="10" fill="url(#grad5)" filter="url(#shadowLight)" stroke="#d8a0b0" stroke-width="1"/>
  <text x="540" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#6a2a3a">Ekip Kültürü</text>
  <text x="540" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#8a4a5a">Dil ve Güven</text>

  <!-- Alt kavram: Süreç -->
  <rect x="220" y="200" width="200" height="50" rx="12" fill="url(#grad1)" filter="url(#shadow)" stroke="#b0c8e8" stroke-width="1"/>
  <text x="320" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">İyileştirme Süreci</text>
  <text x="320" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a6a8a">Test → Değişim → Ölçüm → Dokümantasyon</text>

  <!-- Alt bilgi notu -->
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a9a" opacity="0.8">"Bugünün modern mimarisi de yarının legacy sistemidir."</text>

  <!-- Dekoratif öğeler -->
  <circle cx="30" cy="30" r="4" fill="#a0c0e0" opacity="0.3"/>
  <circle cx="610" cy="290" r="6" fill="#a0d0a0" opacity="0.3"/>
  <circle cx="600" cy="40" r="3" fill="#e0a0b0" opacity="0.3"/>
  <circle cx="50" cy="280" r="5" fill="#c0a0d0" opacity="0.3"/>
</svg>