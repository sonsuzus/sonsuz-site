  <g filter="url(#smallShadow)">
    <rect x="355" y="246" width="73" height="34" rx="12" fill="#e5d8fb"/>
    <rect x="438" y="246" width="77" height="34" rx="12" fill="#d9eee6"/>
  </g>
  <text x="370" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5a4782">AWS Glue</text>
  <text x="450" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#39715f">Hive</text>
  <path d="M397 246 V234" stroke="#8875ad" stroke-width="2" fill="none"/>
  <polygon points="397,234 393,241 401,241" fill="#8875ad"/>
  <path d="M476 246 V234" stroke="#6b9e8d" stroke-width="2" fill="none"/>
  <polygon points="476,234 472,241 480,241" fill="#6b9e8d"/>

  <!-- catalog to consumers -->
  <path d="M506 120 H531 V99 H548" stroke="#7794a4" stroke-width="2" fill="none"/>
  <polygon points="548,99 541,95 541,103" fill="#7794a4"/>
  <path d="M506 182 H531 V204 H548" stroke="#7794a4" stroke-width="2" fill="none"/>
  <polygon points="548,204 541,200 541,208" fill="#7794a4"/>

  <!-- right units -->
  <g filter="url(#smallShadow)">
    <rect x="550" y="76" width="69" height="47" rx="14" fill="#dff0fb"/>
    <rect x="550" y="181" width="69" height="47" rx="14" fill="#e4f3dd"/>
