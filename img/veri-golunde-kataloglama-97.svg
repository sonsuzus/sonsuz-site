  <g filter="url(#shadow)">
    <rect x="367" y="72" width="139" height="158" rx="22" fill="url(#catalog)"/>
    <rect x="384" y="108" width="105" height="26" rx="8" fill="#f8f4ff" opacity="0.88"/>
    <rect x="384" y="142" width="105" height="26" rx="8" fill="#f8f4ff" opacity="0.88"/>
    <rect x="384" y="176" width="105" height="26" rx="8" fill="#f8f4ff" opacity="0.88"/>
  </g>
  <text x="394" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#55427e">Veri Kataloğu</text>
  <text x="398" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e5680">Tablo ve şema</text>
  <text x="398" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e5680">Sahip ve etiket</text>
  <text x="398" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e5680">Bölüm ve konum</text>

