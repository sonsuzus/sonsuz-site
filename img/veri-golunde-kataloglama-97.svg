  <g filter="url(#smallShadow)">
    <rect x="205" y="248" width="94" height="39" rx="13" fill="#f9dfaf"/>
  </g>
  <text x="224" y="272" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#78562b">Glue Crawler</text>
  <path d="M252 248 V239" stroke="#be8e47" stroke-width="2" fill="none"/>
  <polygon points="252,239 248,246 256,246" fill="#be8e47"/>

  <!-- lake to catalog -->
  <path d="M328 151 H363" stroke="#7587ad" stroke-width="2.5" fill="none"/>
  <polygon points="363,151 355,146 355,156" fill="#7587ad"/>
  <text x="330" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667690">metaveri</text>

