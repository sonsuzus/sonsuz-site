  <text x="563" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386278">Sorgu</text>
  <text x="557" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52788c">Athena · Spark</text>
  <text x="557" y="201" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#427052">Yönetişim</text>
  <text x="559" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8168">İzin · Kalite</text>

  <!-- bottom explanation chips -->
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="32" y="294" width="170" height="18" rx="9" fill="#e7f1f5"/>
    <text x="46" y="307" fill="#527083">Keşif: doğru veriyi bul</text>
    <rect x="215" y="294" width="183" height="18" rx="9" fill="#eee8fa"/>
    <text x="229" y="307" fill="#62567e">Şema: değişikliği denetle</text>
    <rect x="411" y="294" width="183" height="18" rx="9" fill="#e5f2df"/>
    <text x="425" y="307" fill="#54725b">Erişim: hassas veriyi koru</text>
  </g>
</svg>