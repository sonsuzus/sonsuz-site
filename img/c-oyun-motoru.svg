<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background-color: #1e1e2e; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d2d44;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradEngine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b4f8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPointer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradPool" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8449;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#gradBg)" rx="12" />

  <!-- Başlık -->
  <text x="450" y="50" text-anchor="middle" fill="#ecf0f1" font-size="26" font-weight="bold" filter="url(#shadow)">C++ ve Oyun Motorlarının Kalbi</text>
  <text x="450" y="78" text-anchor="middle" fill="#bdc3c7" font-size="14">İşaretçilerle Belleği Dizginlemek</text>

  <!-- Ana Motor Bloğu -->
  <rect x="320" y="130" width="260" height="220" rx="20" fill="url(#gradEngine)" filter="url(#shadow)" stroke="#5d8ac0" stroke-width="2"/>
  <text x="450" y="170" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">🎮 Oyun Motoru</text>
  <line x1="360" y1="185" x2="540" y2="185" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Alt Bileşenler -->
  <rect x="350" y="205" width="90" height="40" rx="8" fill="#1e2a47" stroke="#5d8ac0" stroke-width="1.5"/>
  <text x="395" y="231" text-anchor="middle" fill="#ecf0f1" font-size="14">Fizik</text>

  <rect x="455" y="205" width="90" height="40" rx="8" fill="#1e2a47" stroke="#5d8ac0" stroke-width="1.5"/>
  <text x="500" y="231" text-anchor="middle" fill="#ecf0f1" font-size="14">Render</text>

  <rect x="350" y="260" width="90" height="40" rx="8" fill="#1e2a47" stroke="#5d8ac0" stroke-width="1.5"/>
  <text x="395" y="286" text-anchor="middle" fill="#ecf0f1" font-size="14">AI</text>

  <rect x="455" y="260" width="90" height="40" rx="8" fill="#1e2a47" stroke="#5d8ac0" stroke-width="1.5"/>
  <text x="500" y="286" text-anchor="middle" fill="#ecf0f1" font-size="14">Solver</text>

  <!-- İşaretçi Okları (Motorun dışına doğru) -->
  <!-- Sağ üst -->
  <line x1="580" y1="160" x2="690" y2="160" stroke="url(#gradPointer)" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="635" y="145" text-anchor="middle" fill="#f1c40f" font-size="13" font-weight="bold">İşaretçi (T*)</text>
  <text x="635" y="175" text-anchor="middle" fill="#bdc3c7" font-size="11">doğrudan erişim</text>

  <!-- Sol üst -->
  <line x1="320" y1="130" x2="210" y2="110" stroke="url(#gradPointer)" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="230" y="100" text-anchor="middle" fill="#f1c40f" font-size="13" font-weight="bold">Bellek Havuzu</text>
  <text x="230" y="130" text-anchor="middle" fill="#bdc3c7" font-size="11">önceden ayrılmış blok</text>

  <!-- Sağ alt -->
  <line x1="580" y1="280" x2="690" y2="320" stroke="url(#gradPointer)" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="635" y="300" text-anchor="middle" fill="#f1c40f" font-size="13" font-weight="bold">Akıllı İşaretçiler</text>
  <text x="635" y="330" text-anchor="middle" fill="#bdc3c7" font-size="11">unique_ptr, shared_ptr</text>

  <!-- Sol alt -->
  <line x1="320" y1="300" x2="210" y2="340" stroke="url(#gradPointer)" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="230" y="320" text-anchor="middle" fill="#f1c40f" font-size="13" font-weight="bold">Veri Yerleşimi</text>
  <text x="230" y="350" text-anchor="middle" fill="#bdc3c7" font-size="11">önbellek dostu</text>

  <!-- Bellek Havuzu Görseli (sol tarafta) -->
  <rect x="40" y="180" width="130" height="180" rx="10" fill="#1e2a47" stroke="#27ae60" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="205" text-anchor="middle" fill="#27ae60" font-size="14" font-weight="bold">Bellek Havuzu</text>
  <line x1="55" y1="215" x2="155" y2="215" stroke="#27ae60" stroke-opacity="0.4" stroke-width="1"/>
  <!-- kutucuklar -->
  <rect x="55" y="225" width="100" height="22" rx="4" fill="#2ecc71" opacity="0.8"/>
  <text x="105" y="241" text-anchor="middle" fill="#1e1e2e" font-size="11">Nesne 1</text>
  <rect x="55" y="253" width="100" height="22" rx="4" fill="#2ecc71" opacity="0.8"/>
  <text x="105" y="269" text-anchor="middle" fill="#1e1e2e" font-size="11">Nesne 2</text>
  <rect x="55" y="281" width="100" height="22" rx="4" fill="#2ecc71" opacity="0.5"/>
  <text x="105" y="297" text-anchor="middle" fill="#bdc3c7" font-size="11">Nesne 3</text>
  <rect x="55" y="309" width="100" height="22" rx="4" fill="#2ecc71" opacity="0.5"/>
  <text x="105" y="325" text-anchor="middle" fill="#bdc3c7" font-size="11">Nesne 4</text>
  <text x="105" y="350" text-anchor="middle" fill="#bdc3c7" font-size="10">... devam eder</text>

  <!-- Fizik Formülü (sağ alt) -->
  <rect x="650" y="390" width="210" height="70" rx="12" fill="#1e2a47" stroke="#e67e22" stroke-width="2" filter="url(#shadow)"/>
  <text x="755" y="415" text-anchor="middle" fill="#f39c12" font-size="16" font-family="serif" font-style="italic">x<subscript>t+dt</subscript> = x<subscript>t</subscript> + v<subscript>t</subscript> · dt</text>
  <text x="755" y="445" text-anchor="middle" fill="#bdc3c7" font-size="12">Hareket güncellemesi</text>

  <!-- 60 FPS Göstergesi (sol alt) -->
  <rect x="40" y="400" width="150" height="70" rx="12" fill="#1e2a47" stroke="#e74c3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="425" text-anchor="middle" fill="#e74c3c" font-size="22" font-weight="bold">60 FPS</text>
  <text x="115" y="450" text-anchor="middle" fill="#bdc3c7" font-size="11">~16.67ms / kare</text>

  <!-- Performans metni -->
  <text x="450" y="520" text-anchor="middle" fill="#7f8c8d" font-size="13" font-style="italic">C++ ile bellek kontrolü, oyun motorlarının ham gücünü ortaya çıkarır.</text>

  <!-- Dekoratif köşe ışıltıları -->
  <circle cx="40" cy="40" r="15" fill="#f1c40f" opacity="0.1"/>
  <circle cx="860" cy="40" r="15" fill="#f1c40f" opacity="0.1"/>
  <circle cx="40" cy="520" r="15" fill="#f1c40f" opacity="0.1"/>
  <circle cx="860" cy="520" r="15" fill="#f1c40f" opacity="0.1"/>
</svg>