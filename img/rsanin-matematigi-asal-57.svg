<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#c7e9f8"/>
    </linearGradient>
    <linearGradient id="publicGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ddff"/>
      <stop offset="100%" stop-color="#d8ccfa"/>
    </linearGradient>
    <linearGradient id="privateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5df"/>
      <stop offset="100%" stop-color="#f8cfc6"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff5e6"/>
      <stop offset="100%" stop-color="#c9ead7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#557089" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#64748b" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="579" cy="42" r="70" fill="#d9f0ec" opacity="0.48"/>
  <circle cx="62" cy="285" r="83" fill="#dfeaff" opacity="0.52"/>
  <path d="M26 97 C112 61 151 90 207 68" fill="none" stroke="#b9d9e5" stroke-width="1.5" opacity="0.55"/>
  <path d="M436 268 C508 224 570 252 625 214" fill="none" stroke="#b8dfcc" stroke-width="1.5" opacity="0.7"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38506b">RSA • Açık Anahtarlı Şifreleme</text>

  <g filter="url(#shadow)">
    <rect x="208" y="45" width="224" height="70" rx="18" fill="url(#keyGrad)" stroke="#a8cde0"/>
    <circle cx="239" cy="80" r="18" fill="#ffffff" opacity="0.7"/>
    <text x="239" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35627a">p × q</text>
    <text x="274" y="70" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294d68">Anahtar Üretimi</text>
    <text x="274" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47677d">Asal sayılar → n = pq</text>
  </g>

  <path d="M270 116 L190 143" fill="none" stroke="#7ca3bc" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="190,143 200,135 198,146" fill="#7ca3bc"/>
  <path d="M370 116 L450 143" fill="none" stroke="#7ca3bc" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="450,143 442,146 440,135" fill="#7ca3bc"/>

  <g filter="url(#soft)">
    <rect x="74" y="143" width="174" height="66" rx="16" fill="url(#publicGrad)" stroke="#bcaee5"/>
    <circle cx="106" cy="176" r="16" fill="#ffffff" opacity="0.7"/>
    <path d="M100 176 L105 181 L114 169" fill="none" stroke="#725fa7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#574483">Açık Anahtar</text>
    <text x="134" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d6091">(n, e) • Paylaşılır</text>
  </g>

  <g filter="url(#soft)">
    <rect x="392" y="143" width="174" height="66" rx="16" fill="url(#privateGrad)" stroke="#e1aba2"/>
    <circle cx="424" cy="176" r="16" fill="#ffffff" opacity="0.7"/>
    <rect x="417" y="175" width="14" height="10" rx="2" fill="none" stroke="#a35551" stroke-width="2"/>
    <path d="M420 175 L420 171 C420 166 428 166 428 171 L428 175" fill="none" stroke="#a35551" stroke-width="2" stroke-linecap="round"/>
    <text x="452" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#894846">Özel Anahtar</text>
    <text x="452" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#95615e">(n, d) • Gizli</text>
  </g>

  <path d="M156 211 L156 236" fill="none" stroke="#816caf" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="156,236 150,226 162,226" fill="#816caf"/>
  <path d="M480 211 L480 236" fill="none" stroke="#b26761" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="480,236 474,226 486,226" fill="#b26761"/>

  <g filter="url(#shadow)">
    <rect x="34" y="239" width="140" height="57" rx="16" fill="url(#dataGrad)" stroke="#a9d4bb"/>
    <text x="104" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397159">Mesaj m</text>
    <text x="104" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d866e">Kodlanmış veri</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="218" y="230" width="204" height="72" rx="18" fill="#ffffff" stroke="#b9cddd"/>
    <circle cx="254" cy="266" r="20" fill="#edf4fb"/>
    <path d="M248 266 L253 271 L263 259" fill="none" stroke="#4f7898" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="282" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b78">Modüler İşlem</text>
    <text x="282" y="279" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58748a">mᵉ mod n  →  c  →  cᵈ mod n</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="466" y="239" width="140" height="57" rx="16" fill="url(#dataGrad)" stroke="#a9d4bb"/>
    <text x="536" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397159">Mesaj m</text>
    <text x="536" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d866e">Güvenle çözüldü</text>
  </g>

  <path d="M175 268 L215 268" fill="none" stroke="#699786" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="215,268 205,262 205,274" fill="#699786"/>
  <path d="M424 268 L462 268" fill="none" stroke="#699786" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="462,268 452,262 452,274" fill="#699786"/>

  <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Güvenlik: n değerini asal çarpanlara ayırmanın zorluğu</text>
</svg>