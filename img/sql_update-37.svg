<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="640" height="320" rx="12" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#1e3a5f">SQL UPDATE Komutu</text>

  <!-- UPDATE ana kutusu -->
  <rect x="250" y="48" width="140" height="42" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">UPDATE</text>

  <!-- Ok: UPDATE -> SET -->
  <line x1="320" y1="90" x2="320" y2="110" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="315,108 320,118 325,108" fill="#64748b"/>

  <!-- SET kutusu -->
  <rect x="230" y="118" width="180" height="42" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#92400e">SET sütun = değer</text>

  <!-- WHERE koşulu için dallanma -->
  <line x1="320" y1="160" x2="320" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <line x1="320" y1="180" x2="160" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <line x1="320" y1="180" x2="480" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="155,178 165,180 155,182" fill="#64748b"/>
  <polygon points="475,178 485,180 475,182" fill="#64748b"/>

  <!-- WHERE'li kutu -->
  <rect x="80" y="188" width="160" height="42" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#10b981" stroke-width="1.5"/>
  <text x="160" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#065f46">WHERE koşul</text>

  <!-- WHERE'siz kutu -->
  <rect x="400" y="188" width="160" height="42" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3730a3">WHERE yok</text>

  <!-- Alt açıklamalar -->
  <line x1="160" y1="230" x2="160" y2="248" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="155,246 160,256 165,246" fill="#64748b"/>
  <rect x="75" y="256" width="170" height="38" rx="8" fill="url(#boxGrad5)" filter="url(#shadowLight)" stroke="#ec4899" stroke-width="1"/>
  <text x="160" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9d174d">Sadece koşulu sağlayan</text>
  <text x="160" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9d174d">kayıtlar güncellenir</text>

  <line x1="480" y1="230" x2="480" y2="248" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="475,246 480,256 485,246" fill="#64748b"/>
  <rect x="395" y="256" width="170" height="38" rx="8" fill="url(#boxGrad6)" filter="url(#shadowLight)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="480" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b21b6">Tüm kayıtlar</text>
  <text x="480" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b21b6">güncellenir</text>

  <!-- Örnek tablo küçük gösterimi -->
  <rect x="555" y="48" width="70" height="100" rx="8" fill="#ffffff" filter="url(#shadowLight)" stroke="#94a3b8" stroke-width="1" opacity="0.9"/>
  <text x="590" y="66" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#334155">personel</text>
  <line x1="560" y1="72" x2="620" y2="72" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="560" y="76" width="60" height="12" rx="3" fill="#e2e8f0"/>
  <text x="590" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#475569">Adi</text>
  <rect x="560" y="92" width="60" height="12" rx="3" fill="#e2e8f0"/>
  <text x="590" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#475569">Soyadi</text>
  <rect x="560" y="108" width="60" height="12" rx="3" fill="#e2e8f0"/>
  <text x="590" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#475569">Gorevi</text>
  <rect x="560" y="124" width="60" height="12" rx="3" fill="#e2e8f0"/>
  <text x="590" y="133" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#475569">Memleketi</text>

  <!-- Örnek sorgu balonu -->
  <rect x="20" y="48" width="200" height="72" rx="8" fill="#ffffff" filter="url(#shadowLight)" stroke="#94a3b8" stroke-width="1" opacity="0.9"/>
  <text x="30" y="66" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Örnek:</text>
  <text x="30" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#334155">UPDATE personel</text>
  <text x="30" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#334155">SET Adi='Nedim'</text>
  <text x="30" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#334155">WHERE Adi='Seyfi'</text>

  <!-- Bağlantı çizgisi örnek -> UPDATE -->
  <line x1="220" y1="80" x2="250" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bağlantı çizgisi tablo -> UPDATE -->
  <line x1="555" y1="80" x2="390" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b" opacity="0.8">UPDATE tablo_adı SET sütun1=değer1, sütun2=değer2 ... WHERE koşul</text>
</svg>