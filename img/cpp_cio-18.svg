<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ec"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">C ve C++ Konsol Giriş/Çıkış</text>
  <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">stdio.h ve temel I/O fonksiyonları</text>

  <!-- Merkez: stdio.h -->
  <rect x="255" y="120" width="130" height="50" rx="10" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e1b4b">stdio.h</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4338ca">Başlık Dosyası</text>

  <!-- Üst: Klavye -->
  <rect x="255" y="55" width="130" height="40" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Klavye</text>
  <text x="320" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3b82f6">Giriş</text>

  <!-- Alt: Ekran -->
  <rect x="255" y="225" width="130" height="40" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">Ekran</text>
  <text x="320" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#059669">Çıkış</text>

  <!-- Sol: getchar() -->
  <rect x="60" y="105" width="140" height="45" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#eab308" stroke-width="1.5"/>
  <text x="130" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#713f12">getchar()</text>
  <text x="130" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#a16207">Karakter okur</text>

  <!-- Sağ: putchar() -->
  <rect x="440" y="105" width="140" height="45" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#ec4899" stroke-width="1.5"/>
  <text x="510" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">putchar()</text>
  <text x="510" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#db2777">Karakter yazar</text>

  <!-- EOF kutusu -->
  <rect x="440" y="200" width="140" height="40" rx="10" fill="#f1f5f9" filter="url(#shadow)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="510" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">EOF</text>
  <text x="510" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">Hata durumu (-1)</text>

  <!-- ENTER kutusu -->
  <rect x="60" y="200" width="140" height="40" rx="10" fill="#f1f5f9" filter="url(#shadow)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">ENTER</text>
  <text x="130" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">\n karakteri</text>

  <!-- Oklar - Klavye -> getchar -->
  <path d="M 255 75 L 205 75 L 205 120" stroke="#3b82f6" stroke-width="1.8" fill="none"/>
  <polygon points="205,128 201,118 209,118" fill="#3b82f6"/>

  <!-- Oklar - Klavye -> stdio.h -->
  <path d="M 320 95 L 320 115" stroke="#6366f1" stroke-width="1.8" fill="none"/>
  <polygon points="320,123 316,113 324,113" fill="#6366f1"/>

  <!-- Oklar - stdio.h -> Ekran -->
  <path d="M 320 175 L 320 220" stroke="#10b981" stroke-width="1.8" fill="none"/>
  <polygon points="320,228 316,218 324,218" fill="#10b981"/>

  <!-- Oklar - getchar -> stdio.h -->
  <path d="M 205 130 L 250 130" stroke="#eab308" stroke-width="1.8" fill="none"/>
  <polygon points="258,130 248,126 248,134" fill="#eab308"/>

  <!-- Oklar - stdio.h -> putchar -->
  <path d="M 390 130 L 435 130" stroke="#ec4899" stroke-width="1.8" fill="none"/>
  <polygon points="443,130 433,126 433,134" fill="#ec4899"/>

  <!-- Oklar - getchar -> ENTER -->
  <path d="M 130 155 L 130 195" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="130,203 126,193 134,193" fill="#94a3b8"/>

  <!-- Oklar - putchar -> EOF -->
  <path d="M 510 155 L 510 195" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="510,203 506,193 514,193" fill="#94a3b8"/>

  <!-- Alt not -->
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#94a3b8">int getchar(void) • int putchar(int c)</text>
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#94a3b8">Klavyeden okuma ve ekrana yazma işlemleri</text>
</svg>