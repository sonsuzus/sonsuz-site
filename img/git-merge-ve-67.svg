<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="anaKart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8dcf6"/>
    </linearGradient>
    <linearGradient id="ozellikKart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5f6db"/>
      <stop offset="100%" stop-color="#ccebc2"/>
    </linearGradient>
    <linearGradient id="cozumKart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d2"/>
      <stop offset="100%" stop-color="#f8d69c"/>
    </linearGradient>
    <linearGradient id="sonucKart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ddfb"/>
      <stop offset="100%" stop-color="#d5c2f3"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8195" flood-opacity="0.20"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8195" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="74" cy="52" r="56" fill="#dceeff" opacity="0.48"/>
  <circle cx="581" cy="278" r="76" fill="#dff2d7" opacity="0.42"/>
  <path d="M24 271 C115 238 146 294 233 265 S375 228 450 258 S553 289 624 235" fill="none" stroke="#c8dae7" stroke-width="1.5" opacity="0.55"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d5267">PARALEL GELİŞTİRME VE BİRLEŞTİRME</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718395">Ortak ata üzerinden iki değişiklik yolu</text>

  <!-- ortak ata -->
  <g filter="url(#golge)">
    <rect x="34" y="130" width="88" height="62" rx="16" fill="#ffffff"/>
    <circle cx="58" cy="151" r="11" fill="#a9c8e8"/>
    <path d="M53 151 L57 155 L64 146" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566d">B</text>
    <text x="50" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617589">Ortak ata</text>
  </g>

  <!-- dallanma çizgileri -->
  <path d="M122 148 C143 148 145 94 169 94" fill="none" stroke="#86a7c8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="166,88 178,94 166,100" fill="#86a7c8"/>
  <path d="M122 174 C143 174 145 226 169 226" fill="none" stroke="#7fae8a" stroke-width="3" stroke-linecap="round"/>
  <polygon points="166,220 178,226 166,232" fill="#7fae8a"/>

  <!-- main -->
  <g filter="url(#golge)">
    <rect x="177" y="65" width="126" height="58" rx="16" fill="url(#anaKart)"/>
    <rect x="188" y="78" width="29" height="22" rx="8" fill="#ffffff" opacity="0.72"/>
    <path d="M195 89 L201 83 L207 89 L201 95 Z" fill="#729bc5"/>
    <text x="227" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365675">main</text>
    <text x="227" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52728e">M · üretim</text>
  </g>

  <!-- feature -->
  <g filter="url(#golge)">
    <rect x="177" y="197" width="126" height="58" rx="16" fill="url(#ozellikKart)"/>
    <rect x="188" y="210" width="29" height="22" rx="8" fill="#ffffff" opacity="0.72"/>
    <path d="M195 226 H207 M201 220 V232" stroke="#5d9870" stroke-width="2" stroke-linecap="round"/>
    <text x="227" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386346">özellik</text>
    <text x="227" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#568063">F · giriş</text>
  </g>

  <!-- merge yönleri -->
  <path d="M303 94 C325 94 326 126 346 139" fill="none" stroke="#7699bd" stroke-width="3" stroke-linecap="round"/>
  <polygon points="340,132 351,143 336,142" fill="#7699bd"/>
  <path d="M303 226 C325 226 326 194 346 181" fill="none" stroke="#75a27d" stroke-width="3" stroke-linecap="round"/>
  <polygon points="336,178 351,177 340,188" fill="#75a27d"/>

  <!-- conflict center -->
  <g filter="url(#golge)">
    <rect x="350" y="112" width="122" height="96" rx="20" fill="url(#cozumKart)"/>
    <circle cx="411" cy="143" r="18" fill="#fff8e9"/>
    <path d="M411 132 V145" stroke="#d08642" stroke-width="3" stroke-linecap="round"/>
    <circle cx="411" cy="152" r="2.2" fill="#d08642"/>
    <text x="374" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#86501f">Çakışma</text>
    <text x="369" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a6b39">Niyet seçimi</text>
  </g>

  <!-- resolution arrow -->
  <path d="M472 160 H502" fill="none" stroke="#b27a50" stroke-width="3" stroke-linecap="round"/>
  <polygon points="499,154 511,160 499,166" fill="#b27a50"/>

  <!-- resolved -->
  <g filter="url(#golge)">
    <rect x="511" y="88" width="100" height="67" rx="17" fill="url(#sonucKart)"/>
    <circle cx="535" cy="111" r="11" fill="#ffffff" opacity="0.82"/>
    <path d="M530 111 L534 115 L541 107" fill="none" stroke="#8062ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="552" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c4580">Birleştir</text>
    <text x="527" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#735b96">Yeni kayıt</text>
  </g>

  <!-- validation -->
  <path d="M561 155 V184" fill="none" stroke="#8e79ad" stroke-width="3" stroke-linecap="round"/>
  <polygon points="555,181 561,193 567,181" fill="#8e79ad"/>
  <g filter="url(#hafifGolge)">
    <rect x="511" y="194" width="100" height="56" rx="17" fill="#ffffff"/>
    <circle cx="535" cy="221" r="12" fill="#daf0e2"/>
    <path d="M529 221 L533 225 L541 216" fill="none" stroke="#4e9a69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="553" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426a50">Test et</text>
    <text x="553" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668070">Doğrula</text>
  </g>

  <!-- küçük açıklama -->
  <g opacity="0.92">
    <rect x="44" y="274" width="399" height="26" rx="13" fill="#ffffff" filter="url(#hafifGolge)"/>
    <circle cx="61" cy="287" r="5" fill="#f2b46d"/>
    <text x="74" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7081">Git satırları birleştirir; kararı insan verir.</text>
  </g>
</svg>