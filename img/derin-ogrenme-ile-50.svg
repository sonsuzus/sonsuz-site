    <rect x="352" y="69" width="128" height="195" rx="22" fill="#ffffff"/>
  </g>
  <text x="416" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#385267" font-weight="600">Evrişimli Ağ</text>
  <text x="416" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718494">Transfer Öğrenme</text>
  <g filter="url(#smallShadow)">
