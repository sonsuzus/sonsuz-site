  <rect x="43" y="106" width="95" height="87" rx="14" fill="#e7f4e4"/>
  <path d="M91 177 C63 165 59 132 84 119 C111 106 126 123 117 145 C111 159 102 170 91 177Z" fill="url(#leaf)"/>
  <path d="M88 170 C91 152 96 136 108 122" fill="none" stroke="#e9f7dd" stroke-width="2" stroke-linecap="round"/>
  <path d="M93 151 L78 140 M96 143 L109 137 M90 159 L104 155" fill="none" stroke="#e9f7dd" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="103" cy="143" r="6.5" fill="#b7764d"/>
  <circle cx="84" cy="151" r="4.5" fill="#9a603f"/>
  <circle cx="98" cy="159" r="3.5" fill="#c88a56"/>
  <text x="91" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#385267" font-weight="600">Yaprak Görseli</text>
  <text x="91" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728494">Kamera</text>

  <!-- arrow 1 -->
  <path d="M158 166 H180" fill="none" stroke="#7b97a7" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="180,166 172,161 172,171" fill="#7b97a7"/>

