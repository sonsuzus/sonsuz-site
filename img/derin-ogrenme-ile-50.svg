<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ed"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8d99a"/>
      <stop offset="100%" stop-color="#5fae74"/>
    </linearGradient>
    <linearGradient id="cnn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9d7fb"/>
      <stop offset="100%" stop-color="#9db4ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#71839a" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#71839a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="50" cy="42" r="72" fill="#dceefa" opacity="0.48"/>
  <circle cx="594" cy="275" r="96" fill="#dcefd9" opacity="0.46"/>
  <path d="M30 265 C130 230 163 293 254 262 S399 222 485 256 S572 271 630 226" fill="none" stroke="#c4dfd0" stroke-width="2" opacity="0.55"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#44546a" font-weight="600">Yaprak Hastalığı Tespiti</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#789080">görüntüden güvenilir tahmine</text>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="31" y="91" width="119" height="151" rx="20" fill="#ffffff"/>
