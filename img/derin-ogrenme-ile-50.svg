  <g filter="url(#smallShadow)">
    <rect x="207" y="126" width="38" height="38" rx="10" fill="#fce6d6"/>
    <rect x="257" y="126" width="38" height="38" rx="10" fill="#dcecfb"/>
    <rect x="207" y="177" width="38" height="38" rx="10" fill="#e0f1d8"/>
    <rect x="257" y="177" width="38" height="38" rx="10" fill="#eee1f7"/>
  </g>
  <path d="M217 146 A9 9 0 1 0 229 135" fill="none" stroke="#d38658" stroke-width="2"/>
