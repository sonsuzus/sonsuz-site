    <rect x="400" y="127" width="20" height="98" rx="6" fill="#c3d6f6"/>
    <rect x="425" y="139" width="20" height="74" rx="6" fill="#aec6ef"/>
    <rect x="450" y="146" width="12" height="60" rx="5" fill="#8faee1"/>
  </g>
  <path d="M379 148 H391 M379 160 H391 M379 172 H391 M379 184 H391 M379 196 H391" stroke="#7a9bce" stroke-width="1.5"/>
  <path d="M404 145 H416 M404 158 H416 M404 171 H416 M404 184 H416 M404 197 H416 M404 210 H416" stroke="#7193c8" stroke-width="1.5"/>
  <path d="M429 153 H441 M429 166 H441 M429 179 H441 M429 192 H441" stroke="#678bc2" stroke-width="1.5"/>
  <text x="416" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718494">Özellik Haritaları</text>

  <!-- arrow 3 -->
  <path d="M488 166 H510" fill="none" stroke="#7b97a7" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="510,166 502,161 502,171" fill="#7b97a7"/>

  <!-- output -->
  <g filter="url(#shadow)">
    <rect x="518" y="91" width="93" height="151" rx="20" fill="#ffffff"/>
  </g>
  <text x="564.5" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#385267" font-weight="600">Tahmin</text>
  <rect x="536" y="136" width="56" height="12" rx="6" fill="#e6edf4"/>
  <rect x="536" y="136" width="47" height="12" rx="6" fill="#d58a5a"/>
  <text x="564.5" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9d5e3c">Pas Lekesi</text>
  <text x="564.5" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587080">% 84</text>
  <path d="M543 203 L553 213 L579 191" fill="none" stroke="#63a873" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="564.5" y="229" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718494">Erken Uyarı</text>

  <!-- feedback loop -->
  <path d="M564 258 C564 287 415 294 327 278 C294 272 278 267 269 258" fill="none" stroke="#9ab9a5" stroke-width="1.8" stroke-dasharray="5 5"/>
  <polygon points="269,258 278,257 273,265" fill="#9ab9a5"/>
  <text x="420" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f8c76">Doğrulama ve iyileştirme</text>
</svg>