<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12px">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2F1"/>
      <stop offset="100%" stop-color="#B2DFDB"/>
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE7F6"/>
      <stop offset="100%" stop-color="#D1C4E9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#78909C"/>
    </marker>

    <!-- Dot Pattern -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#78909C" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>

  <!-- Diagram Header -->
  <text x="20" y="25" font-weight="bold" fill="#37474F">Web NFC Mimarisi</text>
  <text x="20" y="45" fill="#78909C">JavaScript ve NFC Etkileşimi</text>

  <!-- Main Flow Boundary (Mobil Tarayıcı) -->
  <rect x="20" y="60" width="370" height="190" rx="12" fill="#FFFFFF" fill-opacity="0.4" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="35" y="80" font-weight="bold" fill="#546E7A">Mobil Tarayıcı Ortamı</text>
  <text x="375" y="235" text-anchor="end" fill="#90A4AE">Android / Chrome</text>

  <!-- Soft UI Blocks -->
  <g filter="url(#shadow)">
    <!-- Block 1: Web Uygulama -->
    <rect x="40" y="120" width="130" height="90" rx="10" fill="url(#blueGrad)" stroke="#90CAF9" stroke-width="1"/>
    <text x="105" y="145" text-anchor="middle" font-weight="bold" fill="#1A237E">Web Uygulama</text>
    <text x="105" y="165" text-anchor="middle" fill="#3949AB">JavaScript</text>
    <text x="105" y="185" text-anchor="middle" fill="#5C6BC0">Oku / Yaz</text>

    <!-- Block 2: Web NFC API -->
    <rect x="230" y="120" width="140" height="90" rx="10" fill="url(#tealGrad)" stroke="#80CBC4" stroke-width="1"/>
    <text x="300" y="145" text-anchor="middle" font-weight="bold" fill="#004D40">Web NFC API</text>
    <text x="300" y="165" text-anchor="middle" fill="#00695C">NDEFReader</text>
    <text x="300" y="185" text-anchor="middle" fill="#00796B">HTTPS + İzin</text>

    <!-- Block 3: NFC Etiketi -->
    <rect x="460" y="120" width="140" height="90" rx="10" fill="url(#peachGrad)" stroke="#FFCC80" stroke-width="1"/>
    <text x="530" y="145" text-anchor="middle" font-weight="bold" fill="#E65100">NFC Etiketi</text>
    <text x="530" y="165" text-anchor="middle" fill="#EF6C00">NDEF Format</text>
    <text x="530" y="185" text-anchor="middle" fill="#F57C00">Text / URL / MIME</text>
    
    <!-- Tag Data Pills -->
    <rect x="465" y="195" width="65" height="18" rx="9" fill="#FFE0B2" stroke="#F57C00" stroke-width="0.5"/>
    <text x="497.5" y="208" text-anchor="middle" fill="#E65100">urun:3482</text>
    <rect x="535" y="195" width="60" height="18" rx="9" fill="#FFE0B2" stroke="#F57C00" stroke-width="0.5"/>
    <text x="565" y="208" text-anchor="middle" fill="#E65100">eser:12</text>

    <!-- Block 4: Güvenlik -->
    <rect x="230" y="20" width="140" height="50" rx="10" fill="url(#purpleGrad)" stroke="#B39DDB" stroke-width="1"/>
    <rect x="255" y="28" width="12" height="10" rx="2" fill="#6A1B9A"/>
    <path d="M 258 28 v -3 a 3 3 0 0 1 6 0 v 3" stroke="#6A1B9A" stroke-width="1.5" fill="none"/>
    <text x="310" y="40" font-weight="bold" fill="#4A148C">Sunucu Doğrulama</text>
    <text x="310" y="58" fill="#6A1B9A">Güvenlik Politikası</text>

    <!-- Block 5: Alternatif Akış -->
    <rect x="230" y="240" width="140" height="50" rx="10" fill="url(#greenGrad)" stroke="#A5D6A7" stroke-width="1"/>
    <text x="300" y="260" font-weight="bold" fill="#1B5E20">Alternatif Akış</text>
    <text x="300" y="278" fill="#2E7D32">QR Kod / Bluetooth</text>

    <!-- Block 6: Fiziksel Katman -->
    <rect x="460" y="240" width="140" height="50" rx="10" fill="url(#grayGrad)" stroke="#B0BEC5" stroke-width="1"/>
    <text x="530" y="260" font-weight="bold" fill="#37474F">Fiziksel Katman</text>
    <text x="530" y="278" fill="#455A64">d ≤ 4cm / P ≈ 1/r³</text>
  </g>

  <!-- Arrows and Connections -->
  <g stroke="#78909C" stroke-width="2">
    <!-- Block 1 -> Block 2 -->
    <line x1="170" y1="165" x2="222" y2="165" marker-end="url(#arrow)"/>
    <!-- Block 2 -> Block 3 -->
    <line x1="370" y1="165" x2="452" y2="165" marker-end="url(#arrow)"/>
    <!-- Block 4 -> Block 2 -->
    <line x1="300" y1="70" x2="300" y2="112" marker-end="url(#arrow)"/>
    <!-- Block 2 -> Block 5 -->
    <line x1="300" y1="210" x2="300" y2="232" marker-end="url(#arrow)"/>
  </g>

  <!-- NFC Signal & Badge -->
  <g>
    <!-- NFC Badge -->
    <rect x="400" y="140" width="40" height="20" rx="10" fill="#FF7043"/>
    <text x="420" y="154" text-anchor="middle" fill="#FFFFFF" font-weight="bold">NFC</text>
    
    <!-- Signal Waves -->
    <path d="M 405 175 Q 410 168 415 175" stroke="#FF7043" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 400 180 Q 410 168 420 180" stroke="#FF7043" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>