<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6efff"/>
      <stop offset="100%" stop-color="#d7e7fb"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#60758c" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#60758c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="45" r="63" fill="#dff1ed" opacity="0.55"/>
  <circle cx="586" cy="272" r="83" fill="#e6edff" opacity="0.65"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566c">AÇIK KAYNAK LİSANS SINIRLARI</text>
  <line x1="28" y1="40" x2="612" y2="40" stroke="#c9d8dd" stroke-width="1"/>

  <!-- central principle -->
  <rect x="222" y="73" width="196" height="78" rx="20" fill="url(#core)" stroke="#b8cce2" filter="url(#shadow)"/>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294b69">Kullanım Serbestliği</text>
  <text x="320" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6680">Haklar − Yükümlülükler</text>
  <path d="M287 131 H353" stroke="#87a9ca" stroke-width="2" stroke-linecap="round"/>
  <circle cx="320" cy="131" r="3" fill="#5e94bd"/>

  <!-- connectors top to licenses -->
  <path d="M260 151 C221 165,152 164,126 180" fill="none" stroke="#91a8b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="126,180 135,176 132,185" fill="#91a8b8"/>
  <path d="M320 151 V177" fill="none" stroke="#91a8b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="320,177 315,168 325,168" fill="#91a8b8"/>
  <path d="M380 151 C418 165,487 164,514 180" fill="none" stroke="#91a8b8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="514,180 505,176 508,185" fill="#91a8b8"/>

  <!-- MIT -->
  <rect x="41" y="181" width="170" height="91" rx="18" fill="#fff5dd" stroke="#ead29b" filter="url(#softShadow)"/>
  <circle cx="67" cy="207" r="15" fill="#f8d889"/>
  <text x="67" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765516">M</text>
  <text x="91" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765516">MIT</text>
  <text x="58" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665f51">Esnek kullanım</text>
  <text x="58" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665f51">Telif bildirimi</text>

  <!-- Apache -->
  <rect x="235" y="181" width="170" height="91" rx="18" fill="#e7f5ee" stroke="#acd9c1" filter="url(#softShadow)"/>
  <circle cx="261" cy="207" r="15" fill="#9ad5b4"/>
  <path d="M254 211 L261 199 L268 211 Z" fill="#39785a"/>
  <text x="285" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286246">Apache 2.0</text>
  <text x="252" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456657">Patent lisansı</text>
  <text x="252" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456657">NOTICE ve değişiklik</text>

  <!-- GPL -->
  <rect x="429" y="181" width="170" height="91" rx="18" fill="#f4e9f7" stroke="#d4b8df" filter="url(#softShadow)"/>
  <circle cx="455" cy="207" r="15" fill="#d4a9e1"/>
  <path d="M448 207 C448 200,459 198,462 204 C465 210,458 214,453 212" fill="none" stroke="#764a88" stroke-width="2.5" stroke-linecap="round"/>
  <text x="479" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#70437e">GPLv3</text>
  <text x="446" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66516c">Copyleft zinciri</text>
  <text x="446" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66516c">Dağıtımda kaynak</text>

  <!-- lower audit flow -->
  <path d="M320 273 V286" fill="none" stroke="#7895a9" stroke-width="2" stroke-linecap="round"/>
  <polygon points="320,286 315,277 325,277" fill="#7895a9"/>
  <rect x="184" y="287" width="272" height="25" rx="12" fill="#ffffff" stroke="#cedee0" filter="url(#softShadow)"/>
  <circle cx="205" cy="299.5" r="6" fill="#6caac3"/>
  <path d="M202 300 L204.5 302.5 L209 296.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="304" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#476273">Lisans denetimi → dağıtım modeli → uyumluluk</text>
</svg>