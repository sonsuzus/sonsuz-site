    <text x="90" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#47708d">Sanal düğümler</text>
    <text x="90" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f899b">Dengeli yük</text>
    <path d="M155 242 C174 237 182 225 190 205" fill="none" stroke="#82a9c4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="190,205 182,211 192,215" fill="#82a9c4"/>
  </g>
