<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">PHP Superglobal Değişkenler</text>
  <line x1="180" y1="40" x2="460" y2="40" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>

  <!-- Global Alan (sol üst) -->
  <rect x="40" y="60" width="160" height="70" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" opacity="0.9"/>
  <text x="120" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">Global Alan</text>
  <text x="120" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4a7a">$deg = 17</text>
  <text x="120" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a9a" opacity="0.8">(global değişken)</text>

  <!-- Fonksiyon (sağ üst) -->
  <rect x="420" y="60" width="180" height="70" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" opacity="0.9"/>
  <text x="510" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#7c5a00">fonk1()</text>
  <text x="510" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6d1a">$deg = 24</text>
  <text x="510" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a08030" opacity="0.8">(lokal değişken)</text>

  <!-- $GLOBALS merkez kutu -->
  <rect x="230" y="130" width="180" height="60" rx="12" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#059669" stroke-width="1.5"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#065f46">$GLOBALS</text>
  <text x="320" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#047857">tüm global değişkenlere erişim</text>

  <!-- Ok: Global Alan -> $GLOBALS -->
  <path d="M 160 130 C 200 150, 240 160, 270 165" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="270,165 260,160 262,170" fill="#059669"/>

  <!-- Ok: fonk1 -> $GLOBALS -->
  <path d="M 460 130 C 420 150, 380 160, 350 165" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="350,165 360,160 358,170" fill="#059669"/>

  <!-- Erişim etiketi -->
  <text x="320" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#065f46" opacity="0.8">global anahtar kelimesi gerekmez</text>

  <!-- Çıktı kutusu (alt) -->
  <rect x="220" y="230" width="200" height="55" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Ekran Çıktısı</text>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9d174d">24, 17, 17</text>

  <!-- Ok: $GLOBALS -> Çıktı -->
  <path d="M 320 190 L 320 225" stroke="#be185d" stroke-width="2" fill="none"/>
  <polygon points="320,225 315,215 325,215" fill="#be185d"/>

  <!-- Alt bilgi notları -->
  <rect x="40" y="250" width="140" height="45" rx="8" fill="url(#boxGrad5)" filter="url(#shadow)" opacity="0.7"/>
  <text x="110" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3730a3">Fonksiyon dışından</text>
  <text x="110" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3730a3">$deg yeterli</text>

  <rect x="460" y="250" width="140" height="45" rx="8" fill="url(#boxGrad6)" filter="url(#shadow)" opacity="0.7"/>
  <text x="530" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f1d1d">Fonksiyon içinden</text>
  <text x="530" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f1d1d">$GLOBALS['deg']</text>

  <!-- Bağlantı çizgileri -->
  <path d="M 180 272 L 215 272" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M 425 272 L 455 272" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
</svg>