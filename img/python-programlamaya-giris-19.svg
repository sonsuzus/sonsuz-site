<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e9"/>
      <stop offset="100%" stop-color="#c8f0d0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez düğüm -->
  <rect x="245" y="115" width="150" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Dize Metodları</text>
  <text x="320" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#42a5f5">Python</text>

  <!-- Dış gruplar -->
  <!-- Grup 1: Sorgulama -->
  <rect x="30" y="30" width="140" height="65" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#81c784" stroke-width="1.5"/>
  <text x="100" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Sorgulama</text>
  <text x="100" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4caf50">startswith</text>
  <text x="100" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4caf50">endswith</text>

  <!-- Grup 2: Biçimlendirme -->
  <rect x="470" y="30" width="140" height="65" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="540" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Biçimlendirme</text>
  <text x="540" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ff9800">upper, lower</text>
  <text x="540" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ff9800">capitalize, title</text>

  <!-- Grup 3: Arama -->
  <rect x="30" y="225" width="140" height="65" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#ba68c8" stroke-width="1.5"/>
  <text x="100" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">Arama</text>
  <text x="100" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ab47bc">find, rfind</text>
  <text x="100" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ab47bc">index, rindex</text>

  <!-- Grup 4: Dönüştürme -->
  <rect x="470" y="225" width="140" height="65" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#7986cb" stroke-width="1.5"/>
  <text x="540" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#283593">Dönüştürme</text>
  <text x="540" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5c6bc0">replace, split</text>
  <text x="540" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5c6bc0">join, strip</text>

  <!-- Oklar -->
  <!-- Sol üst -->
  <path d="M170 65 L240 65 L240 130 L245 130" fill="none" stroke="#66bb6a" stroke-width="2"/>
  <polygon points="245,130 235,125 235,135" fill="#66bb6a"/>

  <!-- Sağ üst -->
  <path d="M470 65 L400 65 L400 130 L395 130" fill="none" stroke="#ffa726" stroke-width="2"/>
  <polygon points="395,130 405,125 405,135" fill="#ffa726"/>

  <!-- Sol alt -->
  <path d="M170 255 L240 255 L240 190 L245 190" fill="none" stroke="#ab47bc" stroke-width="2"/>
  <polygon points="245,190 235,195 235,185" fill="#ab47bc"/>

  <!-- Sağ alt -->
  <path d="M470 255 L400 255 L400 190 L395 190" fill="none" stroke="#5c6bc0" stroke-width="2"/>
  <polygon points="395,190 405,185 405,195" fill="#5c6bc0"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c">Dize veri tipi metodları: sorgulama, biçimlendirme, arama ve dönüştürme</text>
</svg>