<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#d0e8d8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef7e0"/>
      <stop offset="100%" stop-color="#faecc9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f5d0cc"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#d0d6ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C İşaretçiler</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">Bellek Adresleri ve Erişim</text>

  <!-- Merkez: İşaretçi Değişkeni -->
  <rect x="245" y="105" width="150" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#8ab4f8" stroke-width="1.5"/>
  <text x="320" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a6a">İşaretçi</text>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c5a9a">int *ip</text>

  <!-- Sol üst: Değişken -->
  <rect x="60" y="70" width="130" height="45" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#81c995" stroke-width="1.5"/>
  <text x="125" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5a2a">Değişken</text>
  <text x="125" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a7a3a">int sayi = 42</text>

  <!-- Sağ üst: Bellek Adresi -->
  <rect x="450" y="70" width="130" height="45" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#fdd663" stroke-width="1.5"/>
  <text x="515" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5a00">Bellek Adresi</text>
  <text x="515" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7a20">0x7ffc1234</text>

  <!-- Alt sol: & İşlemcisi -->
  <rect x="60" y="190" width="130" height="45" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f28b82" stroke-width="1.5"/>
  <text x="125" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8a1a1a">& İşlemcisi</text>
  <text x="125" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a03a3a">Adres al</text>

  <!-- Alt sağ: * İşlemcisi -->
  <rect x="450" y="190" width="130" height="45" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#9fa8da" stroke-width="1.5"/>
  <text x="515" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a3a8a">* İşlemcisi</text>
  <text x="515" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a5aaa">Değere eriş</text>

  <!-- Ok: Değişken -> İşaretçi (adres atama) -->
  <path d="M 190 92 L 240 118" stroke="#5a9a6a" stroke-width="2" fill="none"/>
  <polygon points="240,118 230,112 232,122" fill="#5a9a6a"/>

  <!-- Ok: İşaretçi -> Bellek Adresi (gösterim) -->
  <path d="M 400 118 L 445 92" stroke="#c0a030" stroke-width="2" fill="none"/>
  <polygon points="445,92 435,90 438,98" fill="#c0a030"/>

  <!-- Ok: & İşlemcisi -> Değişken (adres üretir) -->
  <path d="M 125 185 L 125 120" stroke="#c05050" stroke-width="2" fill="none"/>
  <polygon points="125,120 119,130 131,130" fill="#c05050"/>

  <!-- Ok: & İşlemcisi -> İşaretçi (adres atanır) -->
  <path d="M 195 212 L 240 140" stroke="#c05050" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="240,140 230,138 234,147" fill="#c05050"/>

  <!-- Ok: * İşlemcisi -> İşaretçi (değer okur) -->
  <path d="M 445 212 L 400 140" stroke="#6a6ac0" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="400,140 408,146 410,136" fill="#6a6ac0"/>

  <!-- Ok: Bellek Adresi -> * İşlemcisi (adres kullanılır) -->
  <path d="M 515 120 L 515 185" stroke="#6a6ac0" stroke-width="2" fill="none"/>
  <polygon points="515,185 509,175 521,175" fill="#6a6ac0"/>

  <!-- Alt bilgi -->
  <text x="320" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a8a9a">İşaretçi, bir değişkenin bellek adresini tutar</text>
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a8a9a">& adres alır, * değere erişir</text>
</svg>