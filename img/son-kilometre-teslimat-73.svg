  <polygon points="212,120 222,128 210,131" fill="#8ba2ad"/>
  <path d="M168 160 L210 160" fill="none" stroke="#a7bac3" stroke-width="2"/>
  <polygon points="208,155 219,160 208,165" fill="#8ba2ad"/>
