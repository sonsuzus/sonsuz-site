    <rect x="241" y="96" width="154" height="31" rx="12" fill="#fafdff" opacity="0.88"/>
    <text x="318" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#36566a" font-weight="700">ROTA PLANLAYICI</text>

