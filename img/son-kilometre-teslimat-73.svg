    <text x="550" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">A</text>
    <text x="570" y="154" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607681">09:10</text>

    <circle cx="522" cy="184" r="11" fill="#8a73ba"/>
    <text x="522" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">B</text>
    <text x="542" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607681">09:35</text>

    <circle cx="573" cy="234" r="11" fill="#4cab80"/>
    <text x="573" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">C</text>
    <text x="491" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b8f72" font-weight="600">daha az bekleme</text>
  </g>
