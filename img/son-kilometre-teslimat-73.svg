    <path d="M314 166 L351 166" stroke="#7899d4" stroke-width="7" stroke-linecap="round"/>
    <path d="M314 181 L376 181" stroke="#d9a36b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="372" cy="151" r="8" fill="#4daa80"/>
    <circle cx="357" cy="166" r="8" fill="#668ad0"/>
    <circle cx="382" cy="181" r="8" fill="#e39a55"/>

    <text x="318" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53707d">en erken uygun teslimat</text>
  </g>

