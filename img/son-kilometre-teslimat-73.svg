<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeaff"/>
      <stop offset="100%" stop-color="#ccefe0"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#698cdb"/>
      <stop offset="100%" stop-color="#4cad82"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6f89a0" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#658098" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="45" r="55" fill="#dceeff" opacity="0.48"/>
  <circle cx="588" cy="282" r="75" fill="#d9f2dd" opacity="0.48"/>

  <!-- Sol girdi kartları -->
  <g filter="url(#soft)">
    <rect x="28" y="54" width="140" height="52" rx="15" fill="#fffdfb"/>
    <rect x="28" y="54" width="8" height="52" rx="4" fill="#f0a65f"/>
