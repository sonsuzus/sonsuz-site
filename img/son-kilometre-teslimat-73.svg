    <text x="76" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34505e" font-weight="600">Araç sınırları</text>
    <text x="76" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71818a">kapasite ve mesai</text>
