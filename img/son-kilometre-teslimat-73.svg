  <path d="M420 159 C441 159 447 159 462 159" fill="none" stroke="#779baf" stroke-width="2.2"/>
  <polygon points="459,153 471,159 459,165" fill="#668b9e"/>

  <!-- Sağ rota kartı -->
  <g filter="url(#shadow)">
    <rect x="470" y="43" width="142" height="230" rx="22" fill="#fffefd" stroke="#d5e4dc"/>
    <text x="491" y="70" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#385462" font-weight="700">Uygulanabilir rota</text>
    <text x="491" y="88" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909a">teslimat sırası</text>

    <path d="M501 118 C542 100 570 126 550 150 C535 167 511 158 522 184 C530 204 571 202 573 234" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="567,228 574,240 579,227" fill="#4cad82"/>

    <circle cx="501" cy="118" r="12" fill="#557ec6"/>
    <path d="M496 121 L496 115 L500 112 L506 112 L509 116 L509 121 Z" fill="none" stroke="#ffffff" stroke-width="1.3"/>
