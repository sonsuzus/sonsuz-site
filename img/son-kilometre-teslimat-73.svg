    <text x="76" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71818a">zamana bağlı</text>
  </g>

  <g filter="url(#soft)">
    <rect x="28" y="134" width="140" height="52" rx="15" fill="#fffdfb"/>
    <rect x="28" y="134" width="8" height="52" rx="4" fill="#a98bdb"/>
    <circle cx="54" cy="160" r="13" fill="#eee8fb"/>
    <circle cx="54" cy="160" r="7" fill="none" stroke="#856bb3" stroke-width="1.8"/>
    <path d="M54 155 L54 160 L59 163" fill="none" stroke="#856bb3" stroke-width="1.8" stroke-linecap="round"/>
    <text x="76" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34505e" font-weight="600">Zaman penceresi</text>
    <text x="76" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71818a">uygun saat</text>
  </g>

  <g filter="url(#soft)">
