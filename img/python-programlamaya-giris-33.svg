<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="box1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7e6"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3e2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce8e8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python Liste Metodları</text>

  <!-- Merkez Liste Nesnesi -->
  <rect x="255" y="55" width="130" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Liste Nesnesi</text>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">veri + metodlar</text>

  <!-- Ok: dir/help -->
  <line x1="320" y1="100" x2="320" y2="125" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="315,122 320,132 325,122" fill="#7f8c8d"/>

  <!-- Keşif Kutusu -->
  <rect x="240" y="132" width="160" height="40" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">dir ve help</text>
  <text x="320" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">metodları keşfet</text>

  <!-- Sol üst: Ekleyenler -->
  <rect x="40" y="55" width="140" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="110" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Eleman Ekleyenler</text>
  <text x="110" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">append, insert, extend</text>

  <!-- Ok: sol üst -->
  <line x1="180" y1="82" x2="252" y2="82" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="248,77 258,82 248,87" fill="#27ae60"/>

  <!-- Sağ üst: Çıkaranlar -->
  <rect x="460" y="55" width="140" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="530" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Eleman Çıkaranlar</text>
  <text x="530" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">pop, remove, clear</text>

  <!-- Ok: sağ üst -->
  <line x1="388" y1="82" x2="457" y2="82" stroke="#e74c3c" stroke-width="1.5"/>
  <polygon points="453,77 463,82 453,87" fill="#e74c3c"/>

  <!-- Sol alt: Bilgi Verenler -->
  <rect x="40" y="200" width="140" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#f39c12" stroke-width="1.5"/>
  <text x="110" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Bilgi Verenler</text>
  <text x="110" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">count, index, copy</text>

  <!-- Ok: sol alt -->
  <line x1="180" y1="230" x2="252" y2="185" stroke="#f39c12" stroke-width="1.5"/>
  <polygon points="248,189 258,182 253,193" fill="#f39c12"/>

  <!-- Sağ alt: Düzenleyenler -->
  <rect x="460" y="200" width="140" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="530" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Düzenleyenler</text>
  <text x="530" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">sort, reverse</text>

  <!-- Ok: sağ alt -->
  <line x1="388" y1="185" x2="457" y2="230" stroke="#4a90d9" stroke-width="1.5"/>
  <polygon points="453,225 463,232 452,235" fill="#4a90d9"/>

  <!-- Alt uyarı -->
  <rect x="170" y="272" width="300" height="35" rx="8" fill="#fff3cd" filter="url(#shadow)" stroke="#f0ad4e" stroke-width="1"/>
  <text x="320" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#856404">Dikkat: in-place metodlar</text>
  <text x="320" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#856404">sort ve reverse None döndürür</text>

  <!-- Ok: merkezden alt uyarıya -->
  <line x1="320" y1="172" x2="320" y2="270" stroke="#f0ad4e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="315,266 320,276 325,266" fill="#f0ad4e"/>
</svg>