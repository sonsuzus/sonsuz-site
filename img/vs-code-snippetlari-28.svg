<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f9f2"/>
    </linearGradient>
    <linearGradient id="snippetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfeaff"/>
      <stop offset="100%" stop-color="#d8f3ed"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4da"/>
      <stop offset="100%" stop-color="#fff9ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6e89a4" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6e89a4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="73" cy="45" r="62" fill="#dceeff" opacity="0.55"/>
  <circle cx="587" cy="280" r="86" fill="#dff4dd" opacity="0.52"/>
  <circle cx="564" cy="42" r="30" fill="#fff0d2" opacity="0.6"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536b">SNIPPET İLE HIZLI VE TUTARLI KOD</text>

  <g filter="url(#shadow)">
    <rect x="37" y="67" width="178" height="143" rx="18" fill="url(#snippetGrad)" stroke="#b9d2e8"/>
