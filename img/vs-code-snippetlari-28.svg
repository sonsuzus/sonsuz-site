    <circle cx="574.5" cy="98" r="18" fill="#7eb893"/>
    <path d="M566 99l5 5 12-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="574.5" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#467458">Hızlı</text>
    <text x="574.5" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547966">Tutarlı</text>
    <text x="574.5" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547966">Az hata</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="116" y="239" width="408" height="54" rx="17" fill="#ffffff" opacity="0.9" stroke="#d6e5e8"/>
    <circle cx="147" cy="266" r="17" fill="#e8dcff"/>
    <path d="M147 256v10l7 5" fill="none" stroke="#876db2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="177" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#506d7c">Zaman Kazancı</text>
    <text x="177" y="279" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8290">Kullanım sayısı × manuel süre farkı</text>
    <path d="M424 265h63" stroke="#91b2c1" stroke-width="2" stroke-linecap="round"/>
    <polygon points="491,265 482,259 482,271" fill="#91b2c1"/>
    <text x="507" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b8b69">Üretkenlik</text>
