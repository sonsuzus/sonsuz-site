    <text x="55" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47708b">Tetikleyici</text>
    <rect x="125" y="119" width="57" height="23" rx="7" fill="#718db4"/>
    <text x="153.5" y="134.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#fff">atry</text>

    <text x="55" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47708b">Gövde</text>
    <path d="M125 153h49M125 160h39M125 167h54" stroke="#5f98a1" stroke-width="4" stroke-linecap="round"/>
    <text x="55" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47708b">Açıklama</text>
    <path d="M125 188h47" stroke="#b18c57" stroke-width="4" stroke-linecap="round"/>
  </g>

  <path d="M225 137 C248 137, 253 137, 271 137" fill="none" stroke="#6a92af" stroke-width="3" stroke-linecap="round"/>
  <polygon points="272,137 262,131 262,143" fill="#6a92af"/>
  <g filter="url(#smallShadow)">
    <rect x="231" y="103" width="35" height="23" rx="8" fill="#ffffff"/>
    <text x="248.5" y="118.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#607c97">Tab</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="279" y="57" width="205" height="161" rx="18" fill="url(#codeGrad)" stroke="#ead7aa"/>
    <rect x="296" y="74" width="171" height="27" rx="9" fill="#fff" opacity="0.8"/>
    <rect x="307" y="83" width="10" height="10" rx="3" fill="#e88f83"/>
    <rect x="322" y="83" width="10" height="10" rx="3" fill="#eac66b"/>
    <rect x="337" y="83" width="10" height="10" rx="3" fill="#7dbd9a"/>
    <text x="358" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#755d35">Oluşan Kod</text>

    <text x="302" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e7a86">try {</text>
    <text x="315" y="144" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426e87">await işlem();</text>
    <text x="302" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e7a86">} catch (hata) {</text>
    <text x="315" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a26561">logla(hata);</text>
    <text x="302" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e7a86">}</text>
  </g>

  <path d="M494 137 C511 137, 516 137, 529 137" fill="none" stroke="#6a92af" stroke-width="3" stroke-linecap="round"/>
  <polygon points="530,137 520,131 520,143" fill="#6a92af"/>

