<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="draft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="100%" stop-color="#c7ddf5"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7ddff"/>
      <stop offset="100%" stop-color="#d6c7f2"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff5dc"/>
      <stop offset="100%" stop-color="#c8e8c3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#61758a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#61758a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="568" cy="44" r="78" fill="#d9f0ed" opacity="0.42"/>
  <circle cx="78" cy="282" r="96" fill="#e8e1ff" opacity="0.32"/>

  <text x="320" y="30" text-anchor="middle" fill="#34475b" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Spekülatif Çözümleme</text>
  <text x="320" y="47" text-anchor="middle" fill="#718194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Önce taslak, sonra toplu doğrulama</text>

  <path d="M130 159 L158 159" stroke="#7d94a8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="158,159 149,154 149,164" fill="#7d94a8"/>

  <path d="M285 159 L316 159" stroke="#7d94a8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="316,159 307,154 307,164" fill="#7d94a8"/>

  <path d="M462 159 L491 159" stroke="#7d94a8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="491,159 482,154 482,164" fill="#7d94a8"/>

  <g filter="url(#shadow)">
    <rect x="30" y="119" width="100" height="80" rx="18" fill="#ffffff"/>
    <rect x="43" y="134" width="74" height="49" rx="12" fill="#edf5fb"/>
    <path d="M57 151 C68 141 83 141 94 151" fill="none" stroke="#6f9bc1" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M57 163 C68 153 83 153 94 163" fill="none" stroke="#88b3d4" stroke-width="2.2" stroke-linecap="round"/>
    <text x="80" y="216" text-anchor="middle" fill="#405367" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Bağlam</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="158" y="91" width="127" height="137" rx="20" fill="url(#draft)"/>
    <circle cx="221.5" cy="121" r="17" fill="#ffffff" opacity="0.76"/>
    <path d="M213 121 L219 127 L231 114" fill="none" stroke="#598bb8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="221.5" y="153" text-anchor="middle" fill="#3e5870" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Taslak Model</text>
    <text x="221.5" y="171" text-anchor="middle" fill="#5c748b" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Hızlı öneri</text>
    <g filter="url(#smallShadow)">
      <rect x="177" y="187" width="18" height="22" rx="6" fill="#ffffff"/>
      <rect x="199" y="187" width="18" height="22" rx="6" fill="#ffffff"/>
      <rect x="221" y="187" width="18" height="22" rx="6" fill="#ffffff"/>
      <rect x="243" y="187" width="18" height="22" rx="6" fill="#ffffff"/>
    </g>
    <text x="186" y="202" text-anchor="middle" fill="#5685ad" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">A</text>
    <text x="208" y="202" text-anchor="middle" fill="#5685ad" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">B</text>
    <text x="230" y="202" text-anchor="middle" fill="#5685ad" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">C</text>
    <text x="252" y="202" text-anchor="middle" fill="#5685ad" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">D</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="316" y="82" width="146" height="154" rx="20" fill="url(#target)"/>
    <circle cx="389" cy="115" r="19" fill="#ffffff" opacity="0.78"/>
    <path d="M379 116 L386 123 L400 107" fill="none" stroke="#8066ad" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="389" y="151" text-anchor="middle" fill="#504368" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Hedef Model</text>
    <text x="389" y="169" text-anchor="middle" fill="#70617f" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Toplu denetim</text>
    <rect x="337" y="185" width="104" height="31" rx="11" fill="#ffffff" opacity="0.72"/>
    <text x="389" y="205" text-anchor="middle" fill="#655477" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">p(x) / q(x)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="491" y="102" width="119" height="114" rx="20" fill="url(#result)"/>
    <circle cx="550.5" cy="132" r="19" fill="#ffffff" opacity="0.8"/>
    <path d="M541 132 L548 139 L562 123" fill="none" stroke="#549465" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550.5" y="166" text-anchor="middle" fill="#3c6a48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Kabul</text>
    <text x="550.5" y="184" text-anchor="middle" fill="#568160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Hızlı çıktı</text>
    <text x="550.5" y="201" text-anchor="middle" fill="#568160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">A B C D</text>
  </g>

  <path d="M389 236 L389 262" stroke="#9b7d8b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="389,270 384,260 394,260" fill="#9b7d8b"/>
  <g filter="url(#smallShadow)">
    <rect x="329" y="271" width="120" height="31" rx="13" fill="#fff0f0"/>
    <text x="389" y="291" text-anchor="middle" fill="#a35e68" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Uyuşmazlık: düzelt</text>
  </g>

  <path d="M449 286 C480 284 490 253 508 220" fill="none" stroke="#9b7d8b" stroke-width="1.8" stroke-dasharray="4 5" stroke-linecap="round"/>
  <polygon points="512,213 502,219 511,224" fill="#9b7d8b"/>

  <text x="220" y="250" text-anchor="middle" fill="#7790a5" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">k token önerisi</text>
  <text x="389" y="65" text-anchor="middle" fill="#7a688c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">tek ileri geçiş</text>
</svg>