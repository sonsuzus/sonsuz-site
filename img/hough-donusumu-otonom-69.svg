<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#d8f3e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66809a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4e7184" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="575" cy="42" r="72" fill="#dceffc" opacity="0.55"/>
  <circle cx="72" cy="295" r="90" fill="#dff3e7" opacity="0.48"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#38536a">Pikselden geometrik yol haritasına</text>

  <!-- Kamera -->
  <g filter="url(#shadow)">
    <rect x="25" y="70" width="118" height="166" rx="18" fill="#ffffff"/>
    <rect x="36" y="82" width="96" height="104" rx="12" fill="#d9e7f3"/>
    <path d="M47 174 L68 132 L83 157 L101 111 L121 174 Z" fill="#849bb0"/>
    <path d="M48 174 L72 140 L89 158 L104 126 L122 174 Z" fill="#a9bdcc"/>
    <path d="M55 172 L78 133" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M83 172 L103 133" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <rect x="55" y="198" width="58" height="22" rx="11" fill="#e7f0f8"/>
    <circle cx="67" cy="209" r="4" fill="#82b6d8"/>
    <circle cx="84" cy="209" r="4" fill="#82b6d8"/>
    <circle cx="101" cy="209" r="4" fill="#82b6d8"/>
  </g>
  <text x="53" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#426075">Kamera</text>
  <text x="42" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8492">Piksel matrisi</text>

  <!-- Arrow 1 -->
  <path d="M151 153 H178" fill="none" stroke="#7e9eb2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="183,153 174,148 174,158" fill="#7e9eb2"/>

  <!-- Kenar block -->
  <g filter="url(#shadow)">
    <rect x="188" y="96" width="118" height="114" rx="18" fill="#fffdf8"/>
    <rect x="202" y="111" width="90" height="47" rx="10" fill="#f8e8c4"/>
    <path d="M212 146 L225 128 L235 142 L247 119 L264 147 L281 126" fill="none" stroke="#dc9b3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M212 155 H281" stroke="#e7c17e" stroke-width="2" stroke-dasharray="3 4"/>
    <circle cx="215" cy="174" r="5" fill="#e5a644"/>
    <circle cx="235" cy="174" r="5" fill="#e5a644" opacity="0.72"/>
    <circle cx="255" cy="174" r="5" fill="#e5a644" opacity="0.48"/>
    <circle cx="275" cy="174" r="5" fill="#e5a644" opacity="0.3"/>
  </g>
  <text x="220" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#6f5731">Kenarlar</text>
  <text x="210" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a795d">Gradyan türevleri</text>

  <!-- Arrow 2 -->
  <path d="M314 153 H337" fill="none" stroke="#7e9eb2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="342,153 333,148 333,158" fill="#7e9eb2"/>

  <!-- Central voting core -->
  <g filter="url(#shadow)">
    <rect x="347" y="61" width="143" height="184" rx="24" fill="url(#core)"/>
    <circle cx="418" cy="133" r="49" fill="#ffffff" opacity="0.72"/>
    <circle cx="418" cy="133" r="34" fill="none" stroke="#75a9be" stroke-width="2"/>
    <path d="M384 133 H452 M418 99 V167" stroke="#bdd9dd" stroke-width="1.5"/>
    <path d="M392 158 L445 108" stroke="#6a9eb8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M386 113 Q418 91 450 117" fill="none" stroke="#8fc49f" stroke-width="2.5"/>
    <circle cx="394" cy="158" r="4.5" fill="#dc8c70"/>
    <circle cx="416" cy="137" r="5" fill="#e39a59"/>
    <circle cx="443" cy="109" r="4.5" fill="#dc8c70"/>
    <rect x="373" y="192" width="91" height="30" rx="15" fill="#ffffff" opacity="0.85"/>
    <text x="389" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#436577">Oylama</text>
  </g>
  <text x="373" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3e6571">Parametre uzayı</text>

  <!-- Output branches -->
  <path d="M496 115 H515 V78 H533" fill="none" stroke="#779caf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="538,78 529,73 529,83" fill="#779caf"/>
  <path d="M496 153 H533" fill="none" stroke="#779caf" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="538,153 529,148 529,158" fill="#779caf"/>
  <path d="M496 191 H515 V230 H533" fill="none" stroke="#779caf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="538,230 529,225 529,235" fill="#779caf"/>

  <!-- Results -->
  <g filter="url(#soft)">
    <rect x="543" y="46" width="76" height="64" rx="15" fill="#fff7df"/>
    <path d="M555 94 L572 61 L583 94" fill="none" stroke="#d69b43" stroke-width="3" stroke-linecap="round"/>
    <path d="M579 94 L597 61 L608 94" fill="none" stroke="#d69b43" stroke-width="3" stroke-linecap="round"/>
    <text x="558" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705b37">Şerit</text>
  </g>

  <g filter="url(#soft)">
    <rect x="543" y="121" width="76" height="64" rx="15" fill="#e9f5ee"/>
    <circle cx="581" cy="146" r="17" fill="none" stroke="#68a985" stroke-width="3"/>
    <circle cx="581" cy="146" r="4" fill="#91cba6"/>
    <text x="554" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47745b">Çember</text>
  </g>

  <g filter="url(#soft)">
    <rect x="543" y="198" width="76" height="64" rx="15" fill="#f3eafa"/>
    <path d="M560 239 L580 216 L602 239" fill="none" stroke="#9b7ab8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="580" cy="216" r="5" fill="#b18dca"/>
    <text x="560" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#685174">Köşe</text>
  </g>

  <text x="535" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557181">Geometrik adaylar</text>
</svg>