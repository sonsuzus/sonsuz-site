  <polygon points="111,180 106,173 116,173" fill="#aac8df"/>
  <path d="M529 165 L529 180" fill="none" stroke="#aad2b3" stroke-width="1.5"/>
  <polygon points="529,180 524,173 534,173" fill="#aad2b3"/>

  <g filter="url(#soft)">
    <rect x="203" y="276" width="234" height="27" rx="13" fill="#ffffff" opacity="0.88"/>
    <text x="320" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536976">Önceden bilinen girdi → sıfır ek yük</text>
