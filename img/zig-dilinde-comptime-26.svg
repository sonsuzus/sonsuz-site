  <path d="M310 113 L318 106 L328 113 L322 113 L330 121 L321 128 L312 121 L318 121 Z" fill="#e98a38"/>
  <text x="320" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#884d20">comptime</text>
  <text x="320" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a613c">Değerlendir</text>
  <line x1="270" y1="193" x2="370" y2="193" stroke="#edbd82"/>
  <text x="320" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a613c">Sonucu göm</text>
  <text x="320" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9d6b40">tür · tablo · hesap</text>

  <path d="M401 168 L447 168" fill="none" stroke="#6eaa81" stroke-width="2.5"/>
  <polygon points="447,168 438,162 438,174" fill="#6eaa81"/>

