    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#668090" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M37 71 C141 32 190 56 255 31" fill="none" stroke="#dcebf1" stroke-width="2"/>
  <circle cx="49" cy="48" r="6" fill="#cfe6f1"/>
  <circle cx="579" cy="60" r="10" fill="#dcefd5"/>
  <circle cx="602" cy="82" r="4" fill="#f8ddb8"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405565">Zig comptime · zaman bilinçli kod</text>

  <g filter="url(#shadow)">
