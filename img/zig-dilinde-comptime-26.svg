    <text x="529" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#467458">Anlık girdi</text>
  </g>
  <text x="529" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547b60">Maliyet: O(1)</text>

