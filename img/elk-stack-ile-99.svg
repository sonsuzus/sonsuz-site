<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#c9def8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddf3e5"/>
      <stop offset="100%" stop-color="#c4e6d1"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d8"/>
      <stop offset="100%" stop-color="#f6dbaf"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee6ff"/>
      <stop offset="100%" stop-color="#dcd0f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8196" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8196" flood-opacity="0.16"/>
    </filter>
    <style>
      .label { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 12px; fill: #263b50; font-weight: 600; }
      .sub { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 12px; fill: #597086; }
      .tiny { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 12px; fill: #486278; }
      .line { fill: none; stroke: #7c9ab3; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #9ab1c0; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="562" cy="32" r="78" fill="#d8f1ec" opacity="0.42"/>
  <circle cx="55" cy="291" r="92" fill="#ddeafe" opacity="0.46"/>

  <text x="28" y="31" class="label" font-size="16">Merkezi Log Akışı</text>
  <text x="28" y="51" class="sub">Dağınık olaylardan aranabilir içgörüye</text>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="27" y="84" width="105" height="151" rx="17" fill="#ffffff"/>
    <rect x="27" y="84" width="105" height="34" rx="17" fill="url(#blue)"/>
    <rect x="27" y="101" width="105" height="17" fill="url(#blue)"/>
  </g>
  <text x="79.5" y="106" text-anchor="middle" class="label">Log Kaynakları</text>

  <g filter="url(#smallShadow)">
    <rect x="40" y="131" width="79" height="25" rx="8" fill="#eef6ff"/>
    <rect x="40" y="163" width="79" height="25" rx="8" fill="#f1f9f2"/>
    <rect x="40" y="195" width="79" height="25" rx="8" fill="#fff5e6"/>
  </g>
  <rect x="48" y="138" width="10" height="10" rx="2" fill="#7aaee2"/>
  <rect x="48" y="170" width="10" height="10" rx="2" fill="#73b890"/>
  <rect x="48" y="202" width="10" height="10" rx="2" fill="#e4a456"/>
  <text x="65" y="148" class="tiny">Uygulama</text>
  <text x="65" y="180" class="tiny">Konteyner</text>
  <text x="65" y="212" class="tiny">Sunucu</text>

  <!-- Arrow 1 -->
  <path d="M132 160 H155" class="line"/>
  <polygon points="163,160 154,155 154,165" fill="#7c9ab3"/>

  <!-- Filebeat -->
  <g filter="url(#shadow)">
    <rect x="164" y="119" width="91" height="82" rx="17" fill="url(#green)"/>
  </g>
  <circle cx="209.5" cy="146" r="16" fill="#ffffff" opacity="0.78"/>
  <path d="M202 141 H217 M202 146 H214 M202 151 H211" stroke="#4f9870" stroke-width="2" stroke-linecap="round"/>
  <text x="209.5" y="177" text-anchor="middle" class="label">Filebeat</text>
  <text x="209.5" y="193" text-anchor="middle" class="sub">Taşı</text>

  <!-- Arrow 2 -->
  <path d="M255 160 H278" class="line"/>
  <polygon points="286,160 277,155 277,165" fill="#7c9ab3"/>

  <!-- Logstash -->
  <g filter="url(#shadow)">
    <rect x="287" y="91" width="111" height="139" rx="19" fill="url(#orange)"/>
  </g>
  <text x="342.5" y="117" text-anchor="middle" class="label">Logstash</text>
  <path d="M309 132 H376" stroke="#d49a4d" stroke-width="1.2" opacity="0.6"/>
  <g fill="#ffffff" opacity="0.88">
    <rect x="305" y="142" width="75" height="20" rx="7"/>
    <rect x="305" y="169" width="75" height="20" rx="7"/>
    <rect x="305" y="196" width="75" height="20" rx="7"/>
  </g>
  <text x="342.5" y="156" text-anchor="middle" class="tiny">Al</text>
  <text x="342.5" y="183" text-anchor="middle" class="tiny">Ayrıştır</text>
  <text x="342.5" y="210" text-anchor="middle" class="tiny">Zenginleştir</text>

  <!-- Arrow 3 -->
  <path d="M398 160 H420" class="line"/>
  <polygon points="428,160 419,155 419,165" fill="#7c9ab3"/>

  <!-- Elasticsearch -->
  <g filter="url(#shadow)">
    <rect x="429" y="76" width="105" height="168" rx="20" fill="url(#violet)"/>
  </g>
  <text x="481.5" y="104" text-anchor="middle" class="label">Elasticsearch</text>
  <text x="481.5" y="121" text-anchor="middle" class="sub">İndeks ve arama</text>
  <g transform="translate(451 137)">
    <ellipse cx="30" cy="8" rx="29" ry="8" fill="#ffffff" opacity="0.86"/>
    <path d="M1 8 V43 C1 48 14 52 30 52 C46 52 59 48 59 43 V8" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="30" cy="43" rx="29" ry="8" fill="#e9e1f8"/>
    <ellipse cx="30" cy="8" rx="29" ry="8" fill="none" stroke="#9678bf" stroke-width="1.4"/>
    <path d="M1 24 C1 29 14 33 30 33 C46 33 59 29 59 24 M1 34 C1 39 14 43 30 43 C46 43 59 39 59 34" fill="none" stroke="#9678bf" stroke-width="1.2"/>
  </g>
  <rect x="446" y="203" width="71" height="22" rx="8" fill="#ffffff" opacity="0.8"/>
  <text x="481.5" y="218" text-anchor="middle" class="tiny">Ters indeks</text>

  <!-- Branch arrows -->
  <path d="M534 139 H553 V103 H566" class="line"/>
  <polygon points="574,103 565,98 565,108" fill="#7c9ab3"/>
  <path d="M534 183 H553 V224 H566" class="line"/>
  <polygon points="574,224 565,219 565,229" fill="#7c9ab3"/>

  <!-- Kibana -->
  <g filter="url(#shadow)">
    <rect x="575" y="65" width="54" height="78" rx="15" fill="#d9eef9"/>
  </g>
  <rect x="585" y="78" width="34" height="24" rx="5" fill="#ffffff" opacity="0.88"/>
  <path d="M590 97 L596 91 L602 94 L609 84 L615 88" fill="none" stroke="#5a9cc3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="602" y="120" text-anchor="middle" class="label">Kibana</text>
  <text x="602" y="135" text-anchor="middle" class="sub">Keşfet</text>

  <!-- Alert -->
  <g filter="url(#shadow)">
    <rect x="575" y="187" width="54" height="75" rx="15" fill="#fde7df"/>
  </g>
  <path d="M602 201 C594 201 592 207 592 214 V222 L588 228 H616 L612 222 V214 C612 207 610 201 602 201Z" fill="#e27b63" opacity="0.88"/>
  <circle cx="602" cy="233" r="3" fill="#e27b63"/>
  <text x="602" y="248" text-anchor="middle" class="label">Alarm</text>

  <!-- lifecycle -->
  <path d="M450 259 C469 274 496 275 518 260" class="dash"/>
  <text x="484" y="292" text-anchor="middle" class="sub">Yaşam döngüsü: sıcak → ılık → sil</text>

  <!-- Query pill -->
  <g filter="url(#smallShadow)">
    <rect x="277" y="264" width="139" height="29" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="293" cy="278.5" r="6" fill="none" stroke="#6c91ac" stroke-width="1.8"/>
  <path d="M297.5 283 L302 287.5" stroke="#6c91ac" stroke-width="1.8" stroke-linecap="round"/>
  <text x="311" y="283" class="tiny">Hata kodunu ara</text>
</svg>