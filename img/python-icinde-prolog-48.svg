<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Mini Uzman Sistem Mimarisi</text>

  <!-- Merkez: Motor -->
  <rect x="255" y="105" width="130" height="55" rx="12" fill="#ffffff" stroke="#4a90d9" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Çıkarım Motoru</text>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">Geri İzlemeli Arama</text>

  <!-- Sol üst: Bilgi Temsili -->
  <rect x="45" y="55" width="140" height="65" rx="10" fill="#e8f4fd" stroke="#5dade2" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="115" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Bilgi Temsili</text>
  <text x="115" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Atom ve Kural</text>
  <text x="115" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Nesne Yönelimli</text>

  <!-- Sol alt: Olgu ve Kurallar -->
  <rect x="45" y="215" width="140" height="65" rx="10" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="115" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Bilgi Tabanı</text>
  <text x="115" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Olgular ve Kurallar</text>
  <text x="115" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Bildirimsel Mantık</text>

  <!-- Sağ üst: Sorgu -->
  <rect x="455" y="55" width="140" height="65" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="525" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#a04000">Sorgu Girdisi</text>
  <text x="525" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Hedef Liste</text>
  <text x="525" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Değişkenler</text>

  <!-- Sağ alt: Sonuçlar -->
  <rect x="455" y="215" width="140" height="65" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="525" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#145a32">Çözüm Akışı</text>
  <text x="525" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">yield ile Üretim</text>
  <text x="525" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Fonksiyonel</text>

  <!-- Oklar -->
  <!-- Bilgi Temsili -> Motor -->
  <path d="M 185 88 L 250 115" stroke="#5dade2" stroke-width="2" fill="none"/>
  <polygon points="250,115 240,110 244,119" fill="#5dade2"/>

  <!-- Bilgi Tabanı -> Motor -->
  <path d="M 185 248 L 250 145" stroke="#f4d03f" stroke-width="2" fill="none"/>
  <polygon points="250,145 241,148 246,138" fill="#f4d03f"/>

  <!-- Sorgu -> Motor -->
  <path d="M 455 88 L 390 115" stroke="#e67e22" stroke-width="2" fill="none"/>
  <polygon points="390,115 400,110 396,119" fill="#e67e22"/>

  <!-- Motor -> Sonuç -->
  <path d="M 390 145 L 455 248" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="455,248 445,245 451,254" fill="#27ae60"/>

  <!-- Alt açıklama -->
  <rect x="180" y="270" width="280" height="35" rx="8" fill="#ffffff" opacity="0.7" filter="url(#shadowLight)"/>
  <text x="320" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Birleştirme: değişken bağlama ve geri izleme</text>
  <text x="320" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Karmaşıklık: O(b^d)</text>
</svg>