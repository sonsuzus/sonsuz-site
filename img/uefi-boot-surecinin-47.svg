<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="firmware" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#cbdcff"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddf5e8"/>
      <stop offset="100%" stop-color="#c7eadc"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0cb"/>
      <stop offset="100%" stop-color="#ffe0a5"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eadfff"/>
      <stop offset="100%" stop-color="#d8c5f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7390a0" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#608290" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="43" r="62" fill="#d8ebff" opacity="0.42"/>
  <circle cx="593" cy="282" r="86" fill="#d9f0dc" opacity="0.42"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#456170">UEFI ÖNYÜKLEME ZİNCİRİ</text>

  <path d="M138 153 C151 153 154 153 167 153" fill="none" stroke="#7290a0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="167,153 158,148 158,158" fill="#7290a0"/>
  <path d="M285 153 C298 153 301 153 314 153" fill="none" stroke="#7290a0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="314,153 305,148 305,158" fill="#7290a0"/>
  <path d="M432 153 C445 153 448 153 461 153" fill="none" stroke="#7290a0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="461,153 452,148 452,158" fill="#7290a0"/>

  <g filter="url(#shadow)">
    <rect x="25" y="108" width="113" height="91" rx="18" fill="url(#firmware)"/>
    <circle cx="52" cy="133" r="15" fill="#f8fcff" opacity="0.92"/>
    <path d="M46 133 h12 M52 127 v12" stroke="#6584a0" stroke-width="2" stroke-linecap="round"/>
    <text x="81" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355773">Firmware</text>
    <text x="81" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537189">SEC · PEI · DXE</text>
    <text x="81" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537189">Donanım hazırlığı</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="167" y="108" width="118" height="91" rx="18" fill="url(#disk)"/>
    <ellipse cx="193" cy="130" rx="16" ry="7" fill="#f7fffa"/>
    <path d="M177 130 v19 c0 4 32 4 32 0 v-19" fill="#effbf3" stroke="#74a88d" stroke-width="1.3"/>
    <ellipse cx="193" cy="149" rx="16" ry="7" fill="#effbf3" stroke="#74a88d" stroke-width="1.3"/>
    <text x="237" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356751">Önyükleme seçimi</text>
    <text x="226" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7d68">NVRAM · BootOrder</text>
    <text x="226" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7d68">GPT diski</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="314" y="108" width="118" height="91" rx="18" fill="url(#boot)"/>
    <path d="M338 122 h19 l9 9 v27 h-28 z" fill="#fffdf7" stroke="#ca9a48" stroke-width="1.4"/>
    <path d="M357 122 v10 h9" fill="none" stroke="#ca9a48" stroke-width="1.4"/>
    <text x="386" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80561d">EFI uygulaması</text>
    <text x="373" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b682f">ESP · FAT32</text>
    <text x="373" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b682f">.efi dosyası</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="461" y="108" width="151" height="91" rx="18" fill="url(#kernel)"/>
    <rect x="480" y="122" width="32" height="31" rx="7" fill="#faf8ff" stroke="#8b70ae" stroke-width="1.3"/>
    <path d="M487 129 h18 M487 136 h18 M487 143 h18" stroke="#8b70ae" stroke-width="1.6" stroke-linecap="round"/>
    <text x="553" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#60477e">Önyükleyici</text>
    <text x="553" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765e91">Çekirdek · initramfs</text>
    <text x="553" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765e91">İşletim sistemi</text>
  </g>

  <path d="M373 93 C373 70 410 64 437 77 C453 85 459 96 460 107" fill="none" stroke="#d29b42" stroke-width="1.8" stroke-dasharray="4 4"/>
  <polygon points="460,107 454,98 465,100" fill="#d29b42"/>
  <g filter="url(#softShadow)">
    <rect x="359" y="42" width="146" height="40" rx="14" fill="#fff8e8"/>
    <path d="M379 54 l10 -5 10 5 v9 c0 7 -5 11 -10 13 -5 -2 -10 -6 -10 -13z" fill="#ffd879" stroke="#bf8c24" stroke-width="1.2"/>
    <path d="M384 62 l4 4 7 -8" fill="none" stroke="#986a12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="449" y="66" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#825c22">Secure Boot doğrulaması</text>
  </g>

  <path d="M536 203 C536 222 508 226 480 226 H247 C221 226 209 234 209 248" fill="none" stroke="#80689e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="209,248 204,239 214,239" fill="#80689e"/>
  <g filter="url(#softShadow)">
    <rect x="113" y="247" width="203" height="47" rx="16" fill="#edf2ff"/>
    <circle cx="140" cy="270" r="12" fill="#d9e4ff"/>
    <path d="M136 270 h8 M140 266 v8" stroke="#627eaf" stroke-width="1.7" stroke-linecap="round"/>
    <text x="217" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6794">ExitBootServices()</text>
    <text x="217" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#61799e">Firmware devre dışı</text>
  </g>

  <path d="M316 270 H365" fill="none" stroke="#6d8a9c" stroke-width="2" stroke-linecap="round"/>
  <polygon points="365,270 356,265 356,275" fill="#6d8a9c"/>
  <g filter="url(#softShadow)">
    <rect x="365" y="247" width="163" height="47" rx="16" fill="#e6f5ed"/>
    <circle cx="391" cy="270" r="12" fill="#d2ecdf"/>
    <path d="M385 271 l4 4 8 -10" fill="none" stroke="#4d9370" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="458" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42795f">Çekirdek çalışıyor</text>
    <text x="458" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b8b72">Runtime servisleri</text>
  </g>
</svg>