<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#cceacc"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">PHP Değişkenler</text>

  <!-- Merkez kutu: Değişken -->
  <rect x="240" y="120" width="160" height="56" rx="14" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Değişken</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">$deg_adi = değer</text>

  <!-- Sol üst: Tanımlama -->
  <rect x="40" y="60" width="130" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="105" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Tanımlama</text>
  <text x="105" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">$ işareti ile başlar</text>

  <!-- Sağ üst: Veri Türleri -->
  <rect x="470" y="60" width="130" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="535" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Veri Türleri</text>
  <text x="535" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">int, float, bool, text</text>

  <!-- Sol alt: Adlandırma -->
  <rect x="40" y="210" width="130" height="50" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="105" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">Adlandırma</text>
  <text x="105" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">Harf, rakam, alt çizgi</text>

  <!-- Sağ alt: Örnek -->
  <rect x="470" y="210" width="130" height="50" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#ffe082" stroke-width="1.5"/>
  <text x="535" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#f57f17">Örnek</text>
  <text x="535" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">$deg_int01 = 37</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üstten merkeze -->
  <path d="M170 85 L235 120" stroke="#2e7d32" stroke-width="1.8" fill="none"/>
  <polygon points="235,120 226,114 228,124" fill="#2e7d32"/>

  <!-- Sağ üstten merkeze -->
  <path d="M470 85 L405 120" stroke="#e65100" stroke-width="1.8" fill="none"/>
  <polygon points="405,120 414,114 412,124" fill="#e65100"/>

  <!-- Sol alttan merkeze -->
  <path d="M170 235 L235 180" stroke="#6a1b9a" stroke-width="1.8" fill="none"/>
  <polygon points="235,180 226,186 228,176" fill="#6a1b9a"/>

  <!-- Sağ alttan merkeze -->
  <path d="M470 235 L405 180" stroke="#f57f17" stroke-width="1.8" fill="none"/>
  <polygon points="405,180 414,186 412,176" fill="#f57f17"/>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">PHP'de değişkenler atandığı anda bildirilmiş sayılır</text>

  <!-- Büyük/küçük harf duyarlılığı -->
  <rect x="240" y="250" width="160" height="30" rx="8" fill="#e8eaf6" filter="url(#shadow)" stroke="#9fa8da" stroke-width="1"/>
  <text x="320" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3949ab">$deg_adi ve $Deg_adi farklıdır</text>

  <!-- Bağlantı çizgisi -->
  <line x1="320" y1="176" x2="320" y2="250" stroke="#7986cb" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>