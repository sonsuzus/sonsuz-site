<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="ramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="100%" stop-color="#bdddf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a3" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7991a0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="69" cy="42" r="55" fill="#d9f0e5" opacity="0.42"/>
  <circle cx="587" cy="280" r="77" fill="#dceafa" opacity="0.52"/>
  <circle cx="554" cy="50" r="30" fill="#fff0cf" opacity="0.46"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566a">SAYFA DEĞİŞTİRME KARARI</text>
  <text x="320" y="45" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718494">Boş çerçeve yoksa kurban seçilir</text>

  <!-- disk -->
  <g filter="url(#shadow)">
    <rect x="35" y="114" width="105" height="85" rx="18" fill="#fffdf9"/>
    <ellipse cx="87.5" cy="133" rx="31" ry="10" fill="#cddced"/>
    <path d="M56.5 133v39c0 5.5 13.9 10 31 10s31-4.5 31-10v-39" fill="#dce9f5"/>
    <ellipse cx="87.5" cy="172" rx="31" ry="10" fill="#bdd4e8"/>
    <ellipse cx="87.5" cy="151" rx="31" ry="10" fill="#d2e2ef"/>
    <circle cx="87.5" cy="133" r="3.5" fill="#80a5c4"/>
  </g>
  <text x="87" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b6477">Disk</text>
  <text x="87" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748899">Yeni sayfa</text>

  <!-- incoming flow -->
  <path d="M147 156 H190" fill="none" stroke="#7b9db7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="190,156 181,151 181,161" fill="#7b9db7"/>
  <text x="165" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668195">Yükle</text>

  <!-- central RAM -->
  <g filter="url(#shadow)">
    <rect x="199" y="92" width="170" height="130" rx="20" fill="url(#ramGrad)"/>
    <rect x="214" y="108" width="140" height="29" rx="8" fill="#fafdff" opacity="0.92"/>
    <rect x="214" y="143" width="140" height="29" rx="8" fill="#fafdff" opacity="0.92"/>
    <rect x="214" y="178" width="140" height="29" rx="8" fill="#fafdff" opacity="0.92"/>
    <rect x="223" y="116" width="29" height="13" rx="4" fill="#b6d8f0"/>
    <rect x="258" y="116" width="29" height="13" rx="4" fill="#d5e8bc"/>
    <rect x="293" y="116" width="29" height="13" rx="4" fill="#f8d2c2"/>
    <rect x="223" y="151" width="29" height="13" rx="4" fill="#f9df9d"/>
    <rect x="258" y="151" width="29" height="13" rx="4" fill="#d7cbf0"/>
    <rect x="293" y="151" width="29" height="13" rx="4" fill="#b8e1d5"/>
    <rect x="223" y="186" width="29" height="13" rx="4" fill="#c9ddef"/>
    <rect x="258" y="186" width="29" height="13" rx="4" fill="#f4c7c0"/>
    <rect x="293" y="186" width="29" height="13" rx="4" fill="#cae6b9"/>
  </g>
  <text x="284" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#49677e">Fiziksel RAM</text>

  <!-- split lines -->
  <path d="M375 157 H397 V75 H416" fill="none" stroke="#87a1ad" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="416,75 407,70 407,80" fill="#87a1ad"/>
  <path d="M375 157 H416" fill="none" stroke="#87a1ad" stroke-width="2.2"/>
  <polygon points="416,157 407,152 407,162" fill="#87a1ad"/>
  <path d="M375 157 H397 V239 H416" fill="none" stroke="#87a1ad" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="416,239 407,234 407,244" fill="#87a1ad"/>

  <!-- LRU card -->
  <g filter="url(#smallShadow)">
    <rect x="424" y="43" width="181" height="65" rx="16" fill="#fff6e9"/>
    <circle cx="451" cy="75" r="16" fill="#f6cb91"/>
    <path d="M451 64v11l8 5" fill="none" stroke="#8d643d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="477" y="68" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#775237">LRU</text>
    <text x="477" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8c745e">En eski erişim</text>
    <text x="477" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8c745e">atılır</text>
  </g>

  <!-- LFU card -->
  <g filter="url(#smallShadow)">
    <rect x="424" y="125" width="181" height="65" rx="16" fill="#f1f8e8"/>
    <circle cx="451" cy="157" r="16" fill="#b9db9b"/>
    <rect x="443" y="158" width="4" height="7" rx="2" fill="#5f8754"/>
    <rect x="449" y="153" width="4" height="12" rx="2" fill="#5f8754"/>
    <rect x="455" y="147" width="4" height="18" rx="2" fill="#5f8754"/>
    <text x="477" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#527548">LFU</text>
    <text x="477" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71866a">En düşük sıklık</text>
    <text x="477" y="183" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71866a">atılır</text>
  </g>

  <!-- CLOCK card -->
  <g filter="url(#smallShadow)">
    <rect x="424" y="207" width="181" height="65" rx="16" fill="#f1effb"/>
    <circle cx="451" cy="239" r="16" fill="#cfc5ee"/>
    <circle cx="451" cy="239" r="8" fill="none" stroke="#6e6197" stroke-width="2"/>
    <path d="M451 239l6-5" fill="none" stroke="#6e6197" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="451" cy="239" r="2" fill="#6e6197"/>
    <text x="477" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5d5183">CLOCK</text>
    <text x="477" y="251" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#766d95">Referans biti</text>
    <text x="477" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#766d95">ikinci şans</text>
  </g>

  <!-- bottom status -->
  <g filter="url(#smallShadow)">
    <rect x="150" y="271" width="254" height="32" rx="14" fill="#ffffff"/>
    <circle cx="169" cy="287" r="7" fill="#f2b9aa"/>
    <path d="M166 287h6" stroke="#a85f56" stroke-width="1.8" stroke-linecap="round"/>
    <text x="184" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647786">Sayfa hatası → kurban seçimi</text>
  </g>
</svg>