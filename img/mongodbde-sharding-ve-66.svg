<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dcf6"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e5"/>
      <stop offset="100%" stop-color="#bde5d0"/>
    </linearGradient>
    <linearGradient id="secondary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5edff"/>
      <stop offset="100%" stop-color="#e5d8f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7691a5" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7691a5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="84" cy="60" r="74" fill="#dff2ef" opacity="0.42"/>
  <circle cx="586" cy="278" r="94" fill="#e4eafc" opacity="0.52"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">MongoDB: Ölçeklenebilir ve Dayanıklı Yazma</text>

  <!-- client -->
  <g filter="url(#soft)">
    <rect x="28" y="124" width="94" height="58" rx="15" fill="#fff5d9"/>
    <rect x="39" y="137" width="20" height="16" rx="4" fill="#efc766"/>
    <path d="M43 157h12M49 153v4" stroke="#9a7621" stroke-width="1.6" stroke-linecap="round"/>
    <text x="69" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c5239">Uygulama</text>
    <text x="69" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#766b4f">Yazma</text>
  </g>

  <!-- arrow app router -->
  <path d="M123 153H163" fill="none" stroke="#7d99ab" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="163,153 155,148 155,158" fill="#7d99ab"/>

  <!-- router -->
  <g filter="url(#shadow)">
    <rect x="164" y="105" width="126" height="96" rx="20" fill="url(#router)"/>
    <circle cx="227" cy="137" r="19" fill="#f9fcff" stroke="#9fbbd5" stroke-width="1.5"/>
    <path d="M217 137h20M227 127v20" stroke="#5580a5" stroke-width="2" stroke-linecap="round"/>
    <text x="198" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315775">mongos</text>
    <text x="182" y="189" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52738c">Shard key yönlendirme</text>
  </g>

  <!-- Majority badge -->
  <g filter="url(#soft)">
    <rect x="173" y="218" width="108" height="31" rx="12" fill="#fff" stroke="#d4e2ea"/>
    <circle cx="188" cy="233.5" r="8" fill="#83bca1"/>
    <path d="M184 233l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="202" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#48675b">Çoğunluk onayı</text>
  </g>

  <!-- branching lines -->
  <path d="M290 153H310V75H332" fill="none" stroke="#78a1af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="332,75 324,70 324,80" fill="#78a1af"/>
  <path d="M290 153H332" fill="none" stroke="#78a1af" stroke-width="2" stroke-linecap="round"/>
  <polygon points="332,153 324,148 324,158" fill="#78a1af"/>
  <path d="M290 153H310V231H332" fill="none" stroke="#78a1af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="332,231 324,226 324,236" fill="#78a1af"/>

  <!-- shard containers -->
  <g filter="url(#shadow)">
    <rect x="333" y="41" width="278" height="68" rx="17" fill="#ffffff" opacity="0.94"/>
    <rect x="333" y="119" width="278" height="68" rx="17" fill="#ffffff" opacity="0.94"/>
    <rect x="333" y="197" width="278" height="68" rx="17" fill="#ffffff" opacity="0.94"/>
  </g>

  <!-- shard 1 -->
  <rect x="346" y="54" width="64" height="42" rx="11" fill="url(#primary)"/>
  <text x="358" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356850">Birincil</text>
  <path d="M411 67H438" stroke="#9ab4c3" stroke-width="1.7"/>
  <polygon points="438,67 432,63 432,71" fill="#9ab4c3"/>
  <path d="M411 84H438" stroke="#9ab4c3" stroke-width="1.7"/>
  <polygon points="438,84 432,80 432,88" fill="#9ab4c3"/>
  <rect x="440" y="53" width="67" height="20" rx="7" fill="url(#secondary)"/>
  <rect x="440" y="78" width="67" height="20" rx="7" fill="url(#secondary)"/>
  <text x="449" y="67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67527b">İkincil</text>
  <text x="449" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67527b">İkincil</text>
  <rect x="526" y="61" width="70" height="28" rx="10" fill="#e8f4f0"/>
  <text x="540" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477867">Parça A</text>

  <!-- shard 2 -->
  <rect x="346" y="132" width="64" height="42" rx="11" fill="url(#primary)"/>
  <text x="358" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356850">Birincil</text>
  <path d="M411 145H438" stroke="#9ab4c3" stroke-width="1.7"/>
  <polygon points="438,145 432,141 432,149" fill="#9ab4c3"/>
  <path d="M411 162H438" stroke="#9ab4c3" stroke-width="1.7"/>
  <polygon points="438,162 432,158 432,166" fill="#9ab4c3"/>
  <rect x="440" y="131" width="67" height="20" rx="7" fill="url(#secondary)"/>
  <rect x="440" y="156" width="67" height="20" rx="7" fill="url(#secondary)"/>
  <text x="449" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67527b">İkincil</text>
  <text x="449" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67527b">İkincil</text>
  <rect x="526" y="139" width="70" height="28" rx="10" fill="#e8f4f0"/>
  <text x="540" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477867">Parça B</text>

  <!-- shard 3 -->
  <rect x="346" y="210" width="64" height="42" rx="11" fill="url(#primary)"/>
  <text x="358" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356850">Birincil</text>
  <path d="M411 223H438" stroke="#9ab4c3" stroke-width="1.7"/>
  <polygon points="438,223 432,219 432,227" fill="#9ab4c3"/>
  <path d="M411 240H438" stroke="#9ab4c3" stroke-width="1.7"/>
  <polygon points="438,240 432,236 432,244" fill="#9ab4c3"/>
  <rect x="440" y="209" width="67" height="20" rx="7" fill="url(#secondary)"/>
  <rect x="440" y="234" width="67" height="20" rx="7" fill="url(#secondary)"/>
  <text x="449" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67527b">İkincil</text>
  <text x="449" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67527b">İkincil</text>
  <rect x="526" y="217" width="70" height="28" rx="10" fill="#e8f4f0"/>
  <text x="540" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477867">Parça C</text>

  <!-- bottom legend -->
  <g filter="url(#soft)">
    <rect x="28" y="271" width="583" height="30" rx="13" fill="#ffffff" opacity="0.84"/>
    <circle cx="48" cy="286" r="6" fill="#7bb99a"/>
    <text x="61" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46685b">Replikasyon: kesintiye dayanıklılık</text>
    <path d="M266 286h24" stroke="#809ead" stroke-width="1.7"/>
    <polygon points="290,286 284,282 284,290" fill="#809ead"/>
    <circle cx="315" cy="286" r="6" fill="#85afd4"/>
    <text x="328" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#48697f">Sharding: paralel yazma ve kapasite</text>
  </g>
</svg>