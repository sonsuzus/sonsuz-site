<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="func1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>
    <linearGradient id="func2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <linearGradient id="func3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="func4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </linearGradient>
    <linearGradient id="func5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#b39ddb"/>
    </linearGradient>
    <linearGradient id="result" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffccbc"/>
      <stop offset="100%" stop-color="#ffab91"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="8"/>

  <!-- Başlık -->
  <rect x="140" y="12" width="360" height="32" rx="16" fill="url(#header)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="33" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Python Fonksiyon Örnekleri</text>

  <!-- Merkez fonksiyon kavramı -->
  <ellipse cx="320" cy="105" rx="70" ry="28" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Fonksiyon</text>
  <text x="320" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1565c0">tanımları</text>

  <!-- Ok: merkezden asallık testine -->
  <path d="M 255 100 Q 200 85 175 75" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="175,75 184,78 179,69" fill="#546e7a"/>

  <!-- Ok: merkezden asal çarpanlara -->
  <path d="M 270 120 Q 230 150 195 175" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="195,175 195,165 203,171" fill="#546e7a"/>

  <!-- Ok: merkezden standart sapmaya -->
  <path d="M 320 133 L 320 160" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="320,160 315,151 325,151" fill="#546e7a"/>

  <!-- Ok: merkezden Collatz'a -->
  <path d="M 370 120 Q 410 150 440 175" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="440,175 432,171 440,165" fill="#546e7a"/>

  <!-- Ok: merkezden Taylor'a -->
  <path d="M 385 100 Q 440 85 465 75" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="465,75 456,78 461,69" fill="#546e7a"/>

  <!-- Asallık testi kutusu -->
  <rect x="55" y="45" width="115" height="45" rx="10" fill="url(#func1)" stroke="#f9a825" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="112" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#5d4037">Asallık testi</text>
  <text x="112" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5d4037">asal_mı(x)</text>

  <!-- Asal çarpanlar kutusu -->
  <rect x="75" y="185" width="115" height="45" rx="10" fill="url(#func2)" stroke="#0288d1" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="132" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#01579b">Asal çarpanlar</text>
  <text x="132" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#01579b">asalçarpanlar(N)</text>

  <!-- Standart sapma kutusu -->
  <rect x="265" y="165" width="110" height="45" rx="10" fill="url(#func3)" stroke="#43a047" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1b5e20">Standart sapma</text>
  <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#1b5e20">stsapma(x1,x2,*y)</text>

  <!-- Collatz kutusu -->
  <rect x="450" y="185" width="115" height="45" rx="10" fill="url(#func4)" stroke="#d81b60" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="507" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#880e4f">Collatz dizisi</text>
  <text x="507" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#880e4f">collatz_uzunluk(n)</text>

  <!-- Taylor kutusu -->
  <rect x="470" y="45" width="115" height="45" rx="10" fill="url(#func5)" stroke="#5e35b1" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="527" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#311b92">Taylor serisi</text>
  <text x="527" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#311b92">üstel(x,hata,max)</text>

  <!-- Sonuçlar bölümü -->
  <rect x="200" y="255" width="240" height="50" rx="12" fill="url(#result)" stroke="#e64a19" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="320" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#bf360c">Örnek çıktılar</text>
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#bf360c">True / False, liste, sigma, uzunluk, e^x</text>

  <!-- Sonuç okları -->
  <path d="M 132 230 L 132 250 L 200 270" stroke="#546e7a" stroke-width="1.2" fill="none"/>
  <polygon points="200,270 191,267 193,275" fill="#546e7a"/>

  <path d="M 320 210 L 320 255" stroke="#546e7a" stroke-width="1.2" fill="none"/>
  <polygon points="320,255 315,247 325,247" fill="#546e7a"/>

  <path d="M 507 230 L 507 250 L 440 270" stroke="#546e7a" stroke-width="1.2" fill="none"/>
  <polygon points="440,270 448,267 446,275" fill="#546e7a"/>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#78909c" opacity="0.8">Python Programlamaya Giriş 9 – Fonksiyonlara Örnekler</text>
</svg>