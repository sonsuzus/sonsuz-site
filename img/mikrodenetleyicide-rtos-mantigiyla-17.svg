<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#eef7ec"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3e2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce8e8"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Görev Zamanlayıcı ve Kesme Yöneticisi</text>

  <!-- Sol üst: Sistem Tik -->
  <rect x="30" y="50" width="130" height="60" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#b0c4de" stroke-width="1.5"/>
  <text x="95" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Sistem Tik</text>
  <text x="95" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">1 ms periyot</text>

  <!-- Sağ üst: Zamanlama Koşulu -->
  <rect x="480" y="50" width="130" height="60" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#d4b896" stroke-width="1.5"/>
  <text x="545" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Zamanlama</text>
  <text x="545" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a4a">U = Σ Ci / Ti</text>

  <!-- Ok: Sistem Tik -> Zamanlayıcı -->
  <path d="M160 80 L220 80" stroke="#7a9bb5" stroke-width="2" fill="none"/>
  <polygon points="222,80 212,75 212,85" fill="#7a9bb5"/>

  <!-- Orta: Kooperatif Zamanlayıcı -->
  <rect x="225" y="50" width="170" height="60" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#8ab8a8" stroke-width="1.5"/>
  <text x="310" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Kooperatif Zamanlayıcı</text>
  <text x="310" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a6a">Görev tablosu döngüsü</text>

  <!-- Ok: Zamanlayıcı -> Görevler -->
  <path d="M310 110 L310 140" stroke="#7a9bb5" stroke-width="2" fill="none"/>
  <polygon points="310,143 305,133 315,133" fill="#7a9bb5"/>

  <!-- Görevler -->
  <rect x="30" y="145" width="120" height="50" rx="8" fill="url(#box1)" filter="url(#shadow)" stroke="#b0c4de" stroke-width="1.2"/>
  <text x="90" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Sensör Oku</text>
  <text x="90" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a9a">T=10 ms, C=200 µs</text>

  <rect x="170" y="145" width="120" height="50" rx="8" fill="url(#box4)" filter="url(#shadow)" stroke="#8ab8a8" stroke-width="1.2"/>
  <text x="230" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">PWM Güncelle</text>
  <text x="230" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a7a6a">T=1 ms, deadline=1 ms</text>

  <rect x="310" y="145" width="120" height="50" rx="8" fill="url(#box2)" filter="url(#shadow)" stroke="#d4b896" stroke-width="1.2"/>
  <text x="370" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Telemetri Gönder</text>
  <text x="370" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a6a4a">T=100 ms</text>

  <!-- Sağ: Kesme Yöneticisi -->
  <rect x="460" y="145" width="150" height="50" rx="8" fill="url(#box3)" filter="url(#shadow)" stroke="#d4a0a0" stroke-width="1.2"/>
  <text x="535" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Kesme Yöneticisi</text>
  <text x="535" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a5a">Öncelik sıralaması</text>

  <!-- Ok: Görevler -> Kesme Yöneticisi -->
  <path d="M430 170 L455 170" stroke="#c08080" stroke-width="2" fill="none"/>
  <polygon points="458,170 448,165 448,175" fill="#c08080"/>

  <!-- Kesme öncelikleri -->
  <rect x="460" y="215" width="150" height="85" rx="8" fill="#fdf6f6" filter="url(#shadow)" stroke="#e0c0c0" stroke-width="1"/>
  <text x="535" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#6a3a3a">Öncelik Sırası</text>
  <line x1="475" y1="240" x2="595" y2="240" stroke="#e0c0c0" stroke-width="0.8"/>
  <text x="475" y="255" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a4a">0: Aşırı akım</text>
  <text x="475" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a4a">1: PWM zamanlayıcı</text>
  <text x="475" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a4a">2: ADC, 3: UART</text>
  <text x="475" y="298" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a4a">4: SysTick</text>

  <!-- Ok: Kesme Yöneticisi -> Öncelikler -->
  <path d="M535 195 L535 212" stroke="#c08080" stroke-width="2" fill="none"/>
  <polygon points="535,215 530,205 540,205" fill="#c08080"/>

  <!-- Alt: Ölçüm ve doğrulama -->
  <rect x="30" y="260" width="180" height="40" rx="8" fill="#f0f4ff" filter="url(#shadow)" stroke="#a0b8d0" stroke-width="1"/>
  <text x="120" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a5a7a">Ölçüm ve Doğrulama</text>
  <text x="120" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a9a">Osiloskop ile izleme</text>

  <!-- Ok: Görevler -> Ölçüm -->
  <path d="M120 195 L120 255" stroke="#7a9bb5" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="120,258 115,248 125,248" fill="#7a9bb5"/>

  <!-- Alt: Jitter ve Deadline -->
  <rect x="240" y="260" width="180" height="40" rx="8" fill="#f4f0ff" filter="url(#shadow)" stroke="#b8a8d0" stroke-width="1"/>
  <text x="330" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#5a3a7a">Jitter ve Deadline</text>
  <text x="330" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a5a9a">Öngörülebilir zamanlama</text>

  <!-- Ok: Zamanlayıcı -> Jitter -->
  <path d="M310 110 L330 255" stroke="#8a7aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="331,258 323,251 337,250" fill="#8a7aaa"/>

  <!-- Alt: Ring Buffer -->
  <rect x="450" y="260" width="160" height="40" rx="8" fill="#f0fff4" filter="url(#shadow)" stroke="#a0d0b0" stroke-width="1"/>
  <text x="530" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a6a4a">Ring Buffer</text>
  <text x="530" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8a6a">Kesmede kısa işlem</text>

  <!-- Ok: Kesme -> Ring Buffer -->
  <path d="M535 215 L530 255" stroke="#7aaa8a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="529,258 524,248 534,248" fill="#7aaa8a"/>
</svg>