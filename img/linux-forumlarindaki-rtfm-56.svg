<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="gradHelp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4edda"/>
      <stop offset="100%" stop-color="#b7e4c7"/>
    </linearGradient>
    <linearGradient id="gradRude" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d7da"/>
      <stop offset="100%" stop-color="#f1c0c0"/>
    </linearGradient>
    <linearGradient id="gradCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3cd"/>
      <stop offset="100%" stop-color="#ffe8a1"/>
    </linearGradient>
    <linearGradient id="gradPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c757d"/>
      <stop offset="100%" stop-color="#28a745"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">RTFM Kültürü: İnce Çizgi</text>

  <!-- Sol: Acemi Kullanıcı -->
  <rect x="30" y="120" width="110" height="50" rx="10" fill="#cfe2ff" filter="url(#shadow)"/>
  <text x="85" y="140" text-anchor="middle" font-weight="bold" fill="#1a3a5c">Acemi</text>
  <text x="85" y="156" text-anchor="middle" fill="#1a3a5c">Kullanıcı</text>

  <!-- Sağ üst: Sert RTFM -->
  <rect x="500" y="50" width="110" height="55" rx="10" fill="url(#gradRude)" filter="url(#shadow)"/>
  <text x="555" y="72" text-anchor="middle" font-weight="bold" fill="#7a2e2e">Sert RTFM</text>
  <text x="555" y="88" text-anchor="middle" fill="#7a2e2e">"Oku!"</text>

  <!-- Sağ alt: Yapıcı RTFM -->
  <rect x="500" y="210" width="110" height="55" rx="10" fill="url(#gradHelp)" filter="url(#shadow)"/>
  <text x="555" y="232" text-anchor="middle" font-weight="bold" fill="#1c5e3a">Yapıcı RTFM</text>
  <text x="555" y="248" text-anchor="middle" fill="#1c5e3a">"Şuraya bak"</text>

  <!-- Merkez: İnce Çizgi -->
  <rect x="240" y="125" width="160" height="70" rx="12" fill="url(#gradCenter)" filter="url(#shadow)" stroke="#d4a017" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-weight="bold" fill="#6b4f0a">İnce Çizgi</text>
  <text x="320" y="168" text-anchor="middle" fill="#6b4f0a">Kaynak Yönetimi</text>
  <text x="320" y="184" text-anchor="middle" fill="#6b4f0a">ve Empati Dengesi</text>

  <!-- Oklar: Acemi -> İnce Çizgi -->
  <path d="M140 145 L235 145" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="235,145 225,140 225,150" fill="#5a7a9a"/>

  <!-- Oklar: İnce Çizgi -> Sert RTFM -->
  <path d="M400 140 L495 85" stroke="#b06a6a" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="495,85 484,84 489,94" fill="#b06a6a"/>

  <!-- Oklar: İnce Çizgi -> Yapıcı RTFM -->
  <path d="M400 180 L495 240" stroke="#3d8b5e" stroke-width="2" fill="none"/>
  <polygon points="495,240 486,234 487,245" fill="#3d8b5e"/>

  <!-- Alt bilgi: İyi forum yanıtı üç katman -->
  <rect x="150" y="260" width="340" height="40" rx="8" fill="#e2e8f0" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="276" text-anchor="middle" font-weight="bold" fill="#2d3748">İyi Yanıt: Kanıt + Araç + Kaynak</text>
  <text x="320" y="292" text-anchor="middle" fill="#4a5568">Önce ara, sonra sor, birlikte çöz</text>

  <!-- Bağlantı çizgisi alt bilgiye -->
  <line x1="320" y1="195" x2="320" y2="258" stroke="#718096" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="320,258 315,250 325,250" fill="#718096"/>

  <!-- Küçük semboller -->
  <circle cx="85" cy="105" r="8" fill="#cfe2ff" opacity="0.6"/>
  <text x="85" y="108" text-anchor="middle" font-size="9" fill="#1a3a5c">?</text>

  <circle cx="555" cy="35" r="8" fill="#f8d7da" opacity="0.6"/>
  <text x="555" y="38" text-anchor="middle" font-size="9" fill="#7a2e2e">!</text>

  <circle cx="555" cy="195" r="8" fill="#d4edda" opacity="0.6"/>
  <text x="555" y="198" text-anchor="middle" font-size="9" fill="#1c5e3a">✓</text>
</svg>