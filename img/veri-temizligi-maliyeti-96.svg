<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d9be8"/>
      <stop offset="100%" stop-color="#5979cd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c84a0" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6c84a0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="52" r="62" fill="#dceefa" opacity="0.62"/>
  <circle cx="594" cy="276" r="82" fill="#dcefdc" opacity="0.55"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42546a">VERİ TEMİZLİĞİ: GÖRÜNMEYEN MALİYET</text>
  <line x1="28" y1="41" x2="612" y2="41" stroke="#c7d8df" stroke-width="1"/>

  <!-- incoming raw data -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="122" width="112" height="92" rx="18" fill="#fff7e7"/>
    <rect x="41" y="137" width="86" height="13" rx="6" fill="#f4c870"/>
    <rect x="41" y="158" width="44" height="10" rx="5" fill="#efded0"/>
    <rect x="91" y="158" width="36" height="10" rx="5" fill="#ef9b91"/>
    <rect x="41" y="176" width="61" height="10" rx="5" fill="#b4d9d0"/>
    <rect x="108" y="176" width="19" height="10" rx="5" fill="#ef9b91"/>
    <rect x="41" y="194" width="86" height="7" rx="3" fill="#d9c9b1"/>
  </g>
  <text x="84" y="231" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b6270">Ham veri</text>

  <!-- connector left -->
  <path d="M145 168 H180" fill="none" stroke="#92a7bc" stroke-width="2.5"/>
  <polygon points="180,168 171,163 171,173" fill="#92a7bc"/>

  <!-- central cleaning hub -->
  <g filter="url(#shadow)">
    <rect x="184" y="93" width="224" height="151" rx="25" fill="#ffffff"/>
    <rect x="184" y="93" width="224" height="42" rx="25" fill="#e5ecff"/>
    <rect x="184" y="114" width="224" height="21" fill="#e5ecff"/>
  </g>
  <text x="296" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405687">Temizleme hattı</text>

  <!-- inner cards -->
  <g filter="url(#smallShadow)">
    <rect x="200" y="148" width="90" height="36" rx="10" fill="#e5f5f1"/>
    <rect x="302" y="148" width="90" height="36" rx="10" fill="#fff0ed"/>
    <rect x="200" y="194" width="90" height="36" rx="10" fill="#f5edff"/>
    <rect x="302" y="194" width="90" height="36" rx="10" fill="#eef4d9"/>
  </g>
  <text x="245" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356b65">Eksik değer</text>
  <text x="347" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a554c">Aykırı değer</text>
  <text x="245" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#715694">Biçim ve şema</text>
  <text x="347" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637a32">Kategori eşleme</text>

  <!-- monitoring loop -->
  <path d="M297 254 C297 276 445 278 445 221" fill="none" stroke="#78aa9f" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="445,221 439,230 450,228" fill="#78aa9f"/>
  <text x="370" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c837a">İzleme ve doğrulama</text>

  <!-- output split -->
  <path d="M412 168 H440 V100 H464" fill="none" stroke="#8da4bb" stroke-width="2.5"/>
  <polygon points="464,100 455,95 455,105" fill="#8da4bb"/>
  <path d="M412 168 H440 V191 H464" fill="none" stroke="#8da4bb" stroke-width="2.5"/>
  <polygon points="464,191 455,186 455,196" fill="#8da4bb"/>

  <!-- good outcome -->
  <g filter="url(#shadow)">
    <rect x="468" y="65" width="142" height="72" rx="17" fill="#e8f5ee"/>
    <circle cx="494" cy="101" r="15" fill="#8fc9aa"/>
    <path d="M487 101 L492 106 L502 94" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="553" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39725a">Güvenilir model</text>
  <text x="553" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8471">Tutarlı tahmin</text>

  <!-- risk outcome -->
  <g filter="url(#shadow)">
    <rect x="468" y="155" width="142" height="72" rx="17" fill="#fff0ed"/>
    <circle cx="494" cy="191" r="15" fill="#eea08f"/>
    <path d="M494 183 V194 M494 200 V201" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="553" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#98534c">Temizlenmezse</text>
  <text x="553" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a16b64">Hata maliyeti</text>

  <!-- cost badge -->
  <g filter="url(#smallShadow)">
    <rect x="36" y="260" width="212" height="35" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="56" cy="277" r="9" fill="#f2b96d"/>
  <text x="72" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e6977">İnceleme + düzeltme + doğrulama</text>
</svg>