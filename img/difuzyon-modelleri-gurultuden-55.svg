<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="latent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8c8f2"/>
      <stop offset="100%" stop-color="#bda8e2"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe9e2"/>
      <stop offset="100%" stop-color="#98d4ca"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#60758b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#60758b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="572" cy="38" r="74" fill="#dceff0" opacity="0.55"/>
  <circle cx="75" cy="292" r="90" fill="#e6ddf5" opacity="0.45"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385269">Latent Difüzyon: Gürültüden Görsele</text>

  <!-- upper conditioning path -->
  <rect x="230" y="47" width="117" height="42" rx="14" fill="#fff5d9" filter="url(#soft)"/>
  <rect x="230" y="47" width="117" height="42" rx="14" fill="none" stroke="#e8c974"/>
  <path d="M248 68 h15 M255.5 60.5 v15" stroke="#bc8e27" stroke-width="2" stroke-linecap="round"/>
  <text x="292" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#765713">Metin istemi</text>
  <text x="292" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b742f">kodlayıcı</text>

  <path d="M288 90 L288 112" fill="none" stroke="#c49337" stroke-width="2"/>
  <polygon points="282,108 294,108 288,116" fill="#c49337"/>

  <!-- input image -->
  <rect x="28" y="125" width="101" height="119" rx="18" fill="#e9f3ff" filter="url(#shadow)"/>
  <rect x="28" y="125" width="101" height="119" rx="18" fill="none" stroke="#a8c8e8"/>
  <rect x="43" y="143" width="71" height="52" rx="10" fill="#9fd0ef"/>
  <path d="M44 184 C56 164 63 177 72 166 C81 155 89 174 97 160 C104 151 109 158 114 166 V195 H43 Z" fill="#76ad83"/>
  <circle cx="82" cy="161" r="10" fill="#fff3c7"/>
  <text x="78" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#42647d">Temiz görsel</text>
  <text x="78" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e8798">x₀</text>

  <!-- encode arrow -->
  <path d="M132 184 H155" fill="none" stroke="#6e94b3" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="151,178 162,184 151,190" fill="#6e94b3"/>

  <!-- encoder -->
  <rect x="163" y="151" width="67" height="67" rx="17" fill="#d6eafa" filter="url(#soft)"/>
  <rect x="163" y="151" width="67" height="67" rx="17" fill="none" stroke="#9fc7e5"/>
  <path d="M179 171 L195 162 L213 171 L213 195 L195 205 L179 195 Z" fill="none" stroke="#4e8bb8" stroke-width="2"/>
  <path d="M195 162 V184 M179 171 L195 184 L213 171 M195 184 V205" fill="none" stroke="#4e8bb8" stroke-width="1.6"/>
  <text x="196" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42647d">Kodlayıcı</text>

  <!-- forward / noise connection -->
  <path d="M232 184 H257" fill="none" stroke="#8069ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="253,178 264,184 253,190" fill="#8069ad"/>

  <!-- noisy latent -->
  <rect x="265" y="139" width="80" height="90" rx="18" fill="url(#latent)" filter="url(#shadow)"/>
  <rect x="265" y="139" width="80" height="90" rx="18" fill="none" stroke="#a58dca"/>
  <circle cx="283" cy="160" r="3" fill="#f7f3ff"/>
  <circle cx="302" cy="170" r="4" fill="#6d5794"/>
  <circle cx="324" cy="158" r="3" fill="#f7f3ff"/>
  <circle cx="281" cy="187" r="4" fill="#7d65a7"/>
  <circle cx="305" cy="197" r="3" fill="#f8f4ff"/>
  <circle cx="327" cy="184" r="5" fill="#755c9e"/>
  <circle cx="293" cy="211" r="3" fill="#72599a"/>
  <text x="305" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5e477d">Gürültülü</text>
  <text x="305" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#725c91">latent xₜ</text>

  <!-- reverse arrow -->
  <path d="M347 184 H369" fill="none" stroke="#529890" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="365,178 376,184 365,190" fill="#529890"/>

  <!-- U-net -->
  <rect x="377" y="112" width="116" height="143" rx="21" fill="url(#model)" filter="url(#shadow)"/>
  <rect x="377" y="112" width="116" height="143" rx="21" fill="none" stroke="#78beb5"/>
  <text x="435" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#245d5a">U-Net</text>
  <path d="M398 155 V196 Q398 213 415 213 H422 V179 H448 V213 H455 Q472 213 472 196 V155" fill="none" stroke="#367e79" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M407 163 H463 M407 176 H463" stroke="#dff7f2" stroke-width="2" opacity="0.9"/>
  <text x="435" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#286965">Gürültü tahmini</text>

  <!-- text guide line -->
  <path d="M347 68 H435 V107" fill="none" stroke="#c49337" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="429,103 441,103 435,111" fill="#c49337"/>
  <text x="380" y="61" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#927329">çapraz dikkat</text>

  <!-- decoder arrow -->
  <path d="M495 184 H517" fill="none" stroke="#5e9c85" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="513,178 524,184 513,190" fill="#5e9c85"/>

  <!-- output -->
  <rect x="525" y="125" width="88" height="119" rx="18" fill="#edf8df" filter="url(#shadow)"/>
  <rect x="525" y="125" width="88" height="119" rx="18" fill="none" stroke="#b6d596"/>
  <rect x="539" y="143" width="60" height="52" rx="10" fill="#b9ddf0"/>
  <path d="M540 186 C548 173 555 179 563 168 C572 157 582 177 590 160 C594 157 596 162 599 167 V195 H539 Z" fill="#7aad75"/>
  <circle cx="577" cy="158" r="9" fill="#fff1b5"/>
  <text x="569" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#496d43">Üretilen görsel</text>
  <text x="569" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8c64">çözücü</text>

  <!-- loop cue -->
  <path d="M475 275 C442 301 348 299 323 273" fill="none" stroke="#88aaa4" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="328,267 318,272 327,280" fill="#88aaa4"/>
  <text x="402" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f817b">adım adım gürültü giderme</text>
</svg>