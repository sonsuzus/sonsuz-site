    <circle cx="59" cy="88" r="13" fill="#ffd98d"/>
    <path d="M54 86 h10 M59 81 v10" stroke="#9b7133" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="84" fill="#405264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Davranış</text>
    <text x="82" y="101" fill="#71808e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">tıklama · süre</text>
  </g>

