    <rect x="34" y="130" width="132" height="60" rx="16" fill="#f4e6fa"/>
    <circle cx="59" cy="160" r="13" fill="#dfb9ee"/>
    <path d="M53 164 l5-8 4 4 5-8" fill="none" stroke="#8d579f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="156" fill="#405264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Performans</text>
