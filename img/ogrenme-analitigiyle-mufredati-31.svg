    <circle cx="497" cy="160" r="13" fill="#ffc0b4"/>
    <path d="M491 166 l5-6 4 3 5-8" fill="none" stroke="#a95d50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="520" y="156" fill="#405264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Öğretmen Yorumu</text>
    <text x="520" y="173" fill="#71808e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">teşhis değil</text>
