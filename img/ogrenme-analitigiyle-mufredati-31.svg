    <circle cx="497" cy="88" r="13" fill="#b9ccef"/>
    <path d="M491 93 v-9 M497 93 v-14 M503 93 v-5" stroke="#536f9b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="520" y="84" fill="#405264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Doğrulama</text>
    <text x="520" y="101" fill="#71808e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">temiz veri</text>
