  <polygon points="458,155 472,160 458,165" fill="#789daf"/>
  <path d="M405 194 C428 211 443 224 462 231" fill="none" stroke="#789daf" stroke-width="2"/>
  <polygon points="462,224 472,235 458,235" fill="#789daf"/>

