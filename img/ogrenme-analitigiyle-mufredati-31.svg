  <polygon points="221,191 235,190 226,201" fill="#789daf"/>

  <path d="M405 126 C427 110 440 96 462 89" fill="none" stroke="#789daf" stroke-width="2"/>
  <polygon points="458,85 472,85 463,96" fill="#789daf"/>
