    <text x="520" y="228" fill="#405264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Müfredat</text>
    <text x="520" y="245" fill="#71808e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">iyileştirme</text>
  </g>

  <text x="320" y="295" text-anchor="middle" fill="#628275" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Ölç · yorumla · değiştir · yeniden ölç</text>
