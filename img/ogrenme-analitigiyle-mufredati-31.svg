    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71839b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="117" fill="#ddecf3" opacity="0.28"/>
  <circle cx="320" cy="160" r="93" fill="none" stroke="#b8d3dc" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>

  <!-- connections -->
  <path d="M165 88 C201 94 209 111 226 124" fill="none" stroke="#789daf" stroke-width="2"/>
  <polygon points="225,119 235,130 221,129" fill="#789daf"/>
