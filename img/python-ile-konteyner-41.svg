<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000022"/>
    </filter>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf7e8"/>
      <stop offset="100%" stop-color="#d4edd0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e8fd"/>
      <stop offset="100%" stop-color="#e1ccf9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Python ile Konteyner Yönetimi</text>

  <!-- Python SDK - orchestrator -->
  <rect x="230" y="50" width="180" height="42" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#c9b8e8" stroke-width="1"/>
  <text x="320" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a6b">Python SDK</text>
  <text x="320" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a5a8b">docker.from_env()</text>

  <!-- Arrow down -->
  <line x1="320" y1="92" x2="320" y2="118" stroke="#8899aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8899aa"/>
    </marker>
  </defs>

  <!-- Docker Engine -->
  <rect x="230" y="118" width="180" height="40" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#a8d4f0" stroke-width="1"/>
  <text x="320" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c5f7a">Docker Engine API</text>
  <text x="320" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a7a9a">HTTP + Unix Socket</text>

  <!-- Branch arrows to container boxes -->
  <line x1="230" y1="138" x2="120" y2="200" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="138" x2="320" y2="200" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="138" x2="520" y2="200" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Container 1: Web -->
  <rect x="40" y="200" width="160" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#b0d9ad" stroke-width="1"/>
  <text x="120" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d6b2a">nginx:alpine</text>
  <text x="120" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a8a47">80:8080</text>

  <!-- Container 2: Database -->
  <rect x="240" y="200" width="160" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#a8d4f0" stroke-width="1"/>
  <text x="320" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c5f7a">postgres:16</text>
  <text x="320" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a7a9a">5432:55432</text>

  <!-- Container 3: Worker -->
  <rect x="440" y="200" width="160" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#e8c9a0" stroke-width="1"/>
  <text x="520" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8a5f2a">worker</text>
  <text x="520" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#aa7f4a">geçici süreç</text>

  <!-- Lifecycle badges -->
  <text x="120" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#557755">oluştur → başlat</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#557799">izle → durdur</text>
  <text x="520" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#997755">temizle</text>

  <!-- Bottom info bar -->
  <rect x="60" y="290" width="520" height="24" rx="6" fill="#eef2f5" opacity="0.8"/>
  <text x="320" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#667788">Ölçekleme • Log izleme • Otomatik kurtarma • CI/CD entegrasyonu</text>
</svg>