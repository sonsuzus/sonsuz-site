<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">SQL ile felsefi metin madenciliği</title>
  <desc id="desc">Metinler, kavramlar, kökler ve ilişkisel sorgular üzerinden felsefi veri madenciliği gösteren teknik SVG grafik.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8f6ff"/>
      <stop offset="100%" stop-color="#f2f7f5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b6ef7"/>
      <stop offset="100%" stop-color="#46c5d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#51556f" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="22" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="58" y="60" width="206" height="200" rx="18" fill="url(#panel)" stroke="#dfe6ff" stroke-width="2"/>
    <text x="161" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#433c72">Metin</text>

    <rect x="78" y="110" width="165" height="18" rx="9" fill="#efeaff"/>
    <rect x="78" y="140" width="132" height="18" rx="9" fill="#edf5ff"/>
    <rect x="78" y="170" width="150" height="18" rx="9" fill="#efeaff"/>
    <rect x="78" y="200" width="118" height="18" rx="9" fill="#edf5ff"/>
    <rect x="78" y="230" width="145" height="18" rx="9" fill="#efeaff"/>

    <g stroke="#8b6ef7" stroke-width="3" fill="none">
      <path d="M270 114 C322 82, 355 82, 392 114"/>
      <path d="M270 150 C322 175, 355 175, 392 150"/>
      <path d="M270 208 C322 175, 355 175, 392 208"/>
    </g>

    <rect x="392" y="86" width="176" height="54" rx="14" fill="#f3f0ff" stroke="#d7d1ff"/>
    <text x="480" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5445a3">Tokens</text>
    <text x="480" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="17" font-weight="700" fill="#2d2d44">logos, töz, akıl</text>

    <rect x="392" y="160" width="176" height="54" rx="14" fill="#edf9ff" stroke="#cfeff5"/>
    <text x="480" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#2d7c8f">Roots</text>
    <text x="480" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="17" font-weight="700" fill="#2d2d44">ratio / nous</text>

    <rect x="392" y="234" width="176" height="34" rx="12" fill="url(#accent)"/>
    <text x="480" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="700" fill="#ffffff">PMI / co-occurrence</text>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" fill="#47607c">
    <text x="70" y="292" font-size="18" font-weight="700">SQL + semantics + context</text>
    <text x="288" y="292" font-size="12">felsefi metin madenciliği</text>
  </g>
</svg>
