  <text x="62" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6370">Şeffaflık</text>
  <circle cx="175" cy="284" r="6" fill="#9d8bd0"/>
  <text x="189" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6370">Tekrarlanabilirlik</text>
  <circle cx="342" cy="284" r="6" fill="#e1ad6d"/>
  <text x="356" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6370">Maliyet</text>
