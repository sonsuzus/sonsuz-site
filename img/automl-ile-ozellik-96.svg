  <text x="65" y="106" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294b51">Veri kümesi</text>
  <rect x="43" y="137" width="96" height="13" rx="6.5" fill="#e2f5f1"/>
  <rect x="43" y="158" width="72" height="13" rx="6.5" fill="#eaf5f4"/>
  <rect x="43" y="179" width="86" height="13" rx="6.5" fill="#e2f5f1"/>
  <text x="43" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527077">Gelir hedefi</text>

