  <text x="481" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806b91">Ağaç • Ağ • Ansambl</text>

  <!-- output -->
  <path d="M455 160 H478" stroke="#7293a1" stroke-width="2" stroke-linecap="round"/>
  <polygon points="478,160 471,156 471,164" fill="#7293a1"/>

  <!-- Leaderboard -->
  <g filter="url(#shadow)">
    <rect x="484" y="82" width="128" height="140" rx="18" fill="#ffffff"/>
    <rect x="484" y="82" width="128" height="34" rx="18" fill="#f2cde0"/>
