  <text x="503" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#69445a">Liderlik tablosu</text>
  <line x1="499" y1="130" x2="597" y2="130" stroke="#e4e9ed" stroke-width="1"/>
  <text x="500" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596878">CatBoost</text>
  <rect x="551" y="137" width="35" height="8" rx="4" fill="#8d79c8"/>
  <text x="500" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596878">LightGBM</text>
  <rect x="551" y="158" width="29" height="8" rx="4" fill="#8bbfc2"/>
  <text x="500" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#59726c">F1 ve ROC-AUC</text>
