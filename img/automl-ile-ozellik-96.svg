  <rect x="201" y="174" width="38" height="8" rx="4" fill="#d1c5f5"/>
  <text x="201" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687486">Eğitim  Doğrulama  Test</text>

