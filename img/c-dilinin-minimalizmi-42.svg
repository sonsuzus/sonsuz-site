<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1a1a2e" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f5ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="cbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="kbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="hbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="mbox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="320" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569" letter-spacing="0.5">C Dili → Çekirdek → Donanım Akışı</text>

  <!-- C Language Box (left) -->
  <rect x="30" y="70" width="130" height="190" rx="12" fill="url(#cbox)" filter="url(#shadow)"/>
  <text x="95" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#312e81">C</text>
  <text x="95" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#4338ca">Minimal Dil</text>
  <line x1="50" y1="120" x2="140" y2="120" stroke="#818cf8" stroke-width="0.8" opacity="0.5"/>
  <text x="95" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#4338ca">Pointer</text>
  <text x="95" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#4338ca">Struct</text>
  <text x="95" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#4338ca">Volatile</text>
  <text x="95" y="189" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#4338ca">Bit işlemleri</text>
  <text x="95" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#4338ca">Inline asm</text>
  <text x="95" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#6366f1" font-weight="600">doğrudan erişim</text>

  <!-- Arrow C → Kernel -->
  <line x1="160" y1="155" x2="205" y2="155" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Kernel/Memory Box (center) -->
  <rect x="210" y="55" width="180" height="210" rx="12" fill="url(#kbox)" filter="url(#shadow)"/>
  <text x="300" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#064e3b">Çekirdek</text>
  <text x="300" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#047857">Bellek Yönetimi</text>
  <line x1="230" y1="104" x2="370" y2="104" stroke="#34d399" stroke-width="0.8" opacity="0.5"/>

  <!-- Adres formülü -->
  <rect x="230" y="112" width="140" height="40" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="300" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#065f46">Adres = Taban + Ofset</text>
  <text x="300" y="143" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#047857">2³² bayt ≈ 4 GB</text>

  <!-- Register map -->
  <rect x="230" y="160" width="140" height="52" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="300" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="7.5" fill="#065f46" font-weight="bold">TIMER_BASE 0x40000000</text>
  <text x="300" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="7.5" fill="#065f46">TIMER_CTRL  +0x00</text>
  <text x="300" y="201" text-anchor="middle" font-family="Consolas, monospace" font-size="7.5" fill="#065f46">TIMER_COUNT +0x04</text>

  <!-- volatile badge -->
  <rect x="245" y="220" width="110" height="28" rx="14" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
  <text x="300" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#065f46">volatile = gerçek adres</text>

  <!-- Arrow Kernel → Hardware -->
  <line x1="390" y1="155" x2="435" y2="155" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Hardware Box (right) -->
  <rect x="440" y="55" width="170" height="210" rx="12" fill="url(#hbox)" filter="url(#shadow)"/>
  <text x="525" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#78350f">Donanım</text>
  <text x="525" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b45309">Bellek Eşlemeli Register</text>
  <line x1="460" y1="104" x2="590" y2="104" stroke="#fbbf24" stroke-width="0.8" opacity="0.5"/>

  <!-- Hardware components -->
  <rect x="460" y="112" width="130" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="525" y="129" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#78350f">Timer</text>

  <rect x="460" y="146" width="130" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="525" y="163" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#78350f">Kesme denetleyici</text>

  <rect x="460" y="180" width="130" height="26" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="525" y="197" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#78350f">I/O portları</text>

  <!-- Bit mask examples -->
  <rect x="460" y="214" width="130" height="36" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="525" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="7.5" fill="#78350f">1u &lt;&lt; 3 → maske</text>
  <text x="525" y="243" text-anchor="middle" font-family="Consolas, monospace" font-size="7.5" fill="#78350f">set/clear bit</text>

  <!-- Bottom memory structure box -->
  <rect x="160" y="275" width="320" height="30" rx="8" fill="url(#mbox)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#831843">Zihin modeli: kullanıcı modu ↔ çekirdek modu ↔ kesmeler ↔ sayfalama</text>

  <!-- Small connection dots -->
  <circle cx="205" cy="155" r="3" fill="#94a3b8"/>
  <circle cx="435" cy="155" r="3" fill="#94a3b8"/>

  <!-- Bottom-left hint -->
  <text x="40" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#94a3b8">tamamıyla tahmin edilebilir</text>
  <!-- Bottom-right hint -->
  <text x="600" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#94a3b8" text-anchor="end">kablo ve sinyal</text>
</svg>