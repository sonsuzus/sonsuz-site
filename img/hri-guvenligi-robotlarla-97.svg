<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#86d8c0"/>
      <stop offset="100%" stop-color="#74bde8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7892a5" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7892a5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="161" r="121" fill="#dceff0" opacity="0.44"/>
  <circle cx="320" cy="161" r="88" fill="none" stroke="#a8d5d2" stroke-width="2" stroke-dasharray="5 7" opacity="0.65"/>

  <!-- Bağlantılar -->
  <path d="M162 78 C199 90 218 110 242 130" fill="none" stroke="#86aeba" stroke-width="2"/>
  <polygon points="242,130 233,126 236,136" fill="#86aeba"/>
  <path d="M478 78 C442 90 422 110 398 130" fill="none" stroke="#86aeba" stroke-width="2"/>
  <polygon points="398,130 404,136 407,126" fill="#86aeba"/>
  <path d="M160 246 C200 232 218 211 243 192" fill="none" stroke="#86aeba" stroke-width="2"/>
  <polygon points="243,192 235,195 241,202" fill="#86aeba"/>
  <path d="M480 246 C440 232 422 211 397 192" fill="none" stroke="#86aeba" stroke-width="2"/>
  <polygon points="397,192 399,202 405,195" fill="#86aeba"/>

  <!-- Sol üst risk -->
  <g filter="url(#shadow)">
    <rect x="36" y="43" width="137" height="70" rx="18" fill="#fff5d9"/>
    <circle cx="65" cy="77" r="17" fill="#ffd47b"/>
    <path d="M65 65 L77 87 L53 87 Z" fill="#fff9e8" stroke="#bc8521" stroke-width="1.5"/>
    <rect x="64" y="72" width="2" height="8" rx="1" fill="#bc8521"/>
    <circle cx="65" cy="83" r="1.5" fill="#bc8521"/>
    <text x="92" y="73" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#51616a" font-weight="600">Risk analizi</text>
    <text x="92" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76858a">Tehlike ve temas</text>
  </g>

  <!-- Sağ üst sensor -->
  <g filter="url(#shadow)">
    <rect x="467" y="43" width="137" height="70" rx="18" fill="#e7f2ff"/>
    <circle cx="496" cy="78" r="17" fill="#9ecdf2"/>
    <circle cx="496" cy="78" r="4" fill="#ffffff"/>
    <path d="M488 69 Q496 61 504 69 M485 64 Q496 53 507 64" fill="none" stroke="#3e80af" stroke-width="1.7" stroke-linecap="round"/>
    <text x="522" y="73" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#51616a" font-weight="600">Algılama</text>
    <text x="522" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76858a">Mesafe sensörü</text>
  </g>

  <!-- Sol alt standart -->
  <g filter="url(#shadow)">
    <rect x="36" y="211" width="141" height="70" rx="18" fill="#eee9fb"/>
    <rect x="54" y="227" width="29" height="37" rx="5" fill="#bcaee7"/>
    <path d="M61 238 L65 242 L75 232" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M61 249 L65 253 L75 243" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#51616a" font-weight="600">Standartlar</text>
    <text x="94" y="259" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76858a">ISO doğrulama</text>
  </g>

  <!-- Sağ alt kontrol -->
  <g filter="url(#shadow)">
    <rect x="463" y="211" width="141" height="70" rx="18" fill="#e3f5ea"/>
    <circle cx="492" cy="246" r="18" fill="#91d9b6"/>
    <rect x="484" y="239" width="16" height="14" rx="3" fill="#ffffff"/>
    <path d="M488 236 L488 232 Q492 228 496 232 L496 236" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="520" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#51616a" font-weight="600">Güvenli kontrol</text>
    <text x="520" y="259" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76858a">Yavaşlat ve dur</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="241" y="105" width="158" height="112" rx="28" fill="#ffffff"/>
    <rect x="264" y="126" width="52" height="48" rx="14" fill="url(#safe)"/>
    <circle cx="279" cy="142" r="5" fill="#ffffff"/>
    <circle cx="302" cy="142" r="5" fill="#ffffff"/>
    <path d="M275 157 Q290 168 305 157" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M325 147 L350 130 L369 143 L347 159 L360 176 L344 187 L326 163" fill="#c7e5ed" stroke="#619cab" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="359" cy="179" r="9" fill="#78b9c9"/>
    <path d="M330 126 L338 115" stroke="#619cab" stroke-width="3" stroke-linecap="round"/>
    <circle cx="340" cy="113" r="4" fill="#f4bd78"/>
    <text x="320" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#425a64" font-weight="700">İnsan ve Robot</text>
  </g>

  <!-- Alt hız ölçeği -->
  <g filter="url(#smallShadow)">
    <rect x="205" y="275" width="230" height="28" rx="14" fill="#ffffff"/>
    <text x="222" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667b80">Mesafe</text>
    <rect x="278" y="284" width="105" height="8" rx="4" fill="#d9e6e8"/>
    <rect x="278" y="284" width="69" height="8" rx="4" fill="#79c8a7"/>
    <rect x="278" y="284" width="28" height="8" rx="4" fill="#f4bd78"/>
    <circle cx="307" cy="288" r="7" fill="#ffffff" stroke="#e49357" stroke-width="2"/>
    <text x="393" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667b80">Hız</text>
  </g>
</svg>