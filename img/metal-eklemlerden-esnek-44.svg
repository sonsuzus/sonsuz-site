<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="softBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9e9dc"/>
      <stop offset="100%" stop-color="#79cbb8"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8dfff"/>
      <stop offset="100%" stop-color="#7db4e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#577286" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#567080" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="66" cy="46" r="76" fill="#d9eff7" opacity="0.55"/>
  <circle cx="586" cy="284" r="99" fill="#e3f2d8" opacity="0.6"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426174">YUMUŞAK ROBOTİK</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668292">Basınç ile şekil değiştiren gövde</text>

  <!-- Sol: kontrol ve basınç -->
  <g filter="url(#shadow)">
    <rect x="28" y="92" width="126" height="137" rx="20" fill="#ffffff"/>
    <rect x="42" y="108" width="98" height="34" rx="12" fill="#e8f2fc"/>
    <circle cx="60" cy="125" r="9" fill="#79b6e8"/>
    <path d="M56 125h8M60 121v8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="76" y="121" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6077">Kontrol</text>
    <text x="76" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#648194">Sinyali</text>

    <rect x="42" y="153" width="98" height="60" rx="14" fill="url(#air)"/>
    <path d="M56 193c7-13 14 0 21-13s14 0 21-13 14 0 25-12" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="60" cy="169" r="4" fill="#ffffff" opacity="0.9"/>
    <text x="70" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Hava</text>
    <text x="70" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf8ff">Basıncı</text>
  </g>

  <!-- Akış oku -->
  <path d="M158 161 C177 161 180 155 198 155" fill="none" stroke="#71a7ba" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="204,155 195,150 197,155 195,160" fill="#71a7ba"/>
  <text x="160" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#638193">P · A</text>

  <!-- Merkez: yumuşak eyleyici -->
  <g filter="url(#shadow)">
    <rect x="206" y="79" width="239" height="166" rx="26" fill="#ffffff"/>
  </g>
  <text x="228" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#396573">Pnömatik eyleyici</text>
  <text x="228" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668394">Sürekli deformasyon</text>

  <!-- actuator inlet -->
  <path d="M207 170h25" stroke="#6ca3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M207 170h25" stroke="#c8e8f1" stroke-width="4" stroke-linecap="round"/>

  <!-- curved soft arm -->
  <path d="M231 183 C249 181 258 174 266 159 C277 138 285 139 302 150 C323 164 347 181 375 171 C392 165 399 149 394 137"
        fill="none" stroke="#4c9e91" stroke-width="39" stroke-linecap="round"/>
  <path d="M231 183 C249 181 258 174 266 159 C277 138 285 139 302 150 C323 164 347 181 375 171 C392 165 399 149 394 137"
        fill="none" stroke="url(#softBody)" stroke-width="31" stroke-linecap="round"/>

  <!-- chambers -->
  <g fill="#def7ef" stroke="#5da99a" stroke-width="1.3">
    <ellipse cx="252" cy="174" rx="8" ry="12" transform="rotate(25 252 174)"/>
    <ellipse cx="273" cy="153" rx="8" ry="12" transform="rotate(43 273 153)"/>
    <ellipse cx="298" cy="153" rx="8" ry="12" transform="rotate(-39 298 153)"/>
    <ellipse cx="323" cy="166" rx="8" ry="12" transform="rotate(-55 323 166)"/>
    <ellipse cx="350" cy="173" rx="8" ry="12" transform="rotate(74 350 173)"/>
    <ellipse cx="376" cy="160" rx="8" ry="12" transform="rotate(33 376 160)"/>
  </g>

  <!-- sensor strip -->
  <path d="M235 199 C266 198 278 178 296 178 C329 179 351 195 383 177" fill="none" stroke="#f5cf78" stroke-width="4" stroke-linecap="round"/>
  <circle cx="385" cy="175" r="6" fill="#f0b950"/>
  <text x="228" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#628091">Esnek malzeme ve sensör</text>

  <!-- arrow to interaction -->
  <path d="M449 161 C461 161 468 161 478 161" fill="none" stroke="#71a7ba" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="484,161 475,156 477,161 475,166" fill="#71a7ba"/>

  <!-- Right applications -->
  <g filter="url(#shadow)">
    <rect x="484" y="75" width="128" height="174" rx="21" fill="#ffffff"/>
  </g>
  <text x="503" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426174">Uyumlu temas</text>

  <g filter="url(#smallShadow)">
    <rect x="500" y="119" width="96" height="31" rx="12" fill="#ffe8cf"/>
    <path d="M514 134c5-10 11 3 16-6 4-7 9 3 15-6" fill="none" stroke="#d68d56" stroke-width="2" stroke-linecap="round"/>
    <text x="543" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d623f">Hassas</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="500" y="160" width="96" height="31" rx="12" fill="#e5def8"/>
    <path d="M516 176c5-8 10-8 15 0s10 8 15 0" fill="none" stroke="#8d77c4" stroke-width="2" stroke-linecap="round"/>
    <text x="548" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#69558d">Tıp</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="500" y="201" width="96" height="31" rx="12" fill="#dff1dc"/>
    <path d="M516 217h7l4-8 6 15 5-10h10" fill="none" stroke="#6b9f69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="548" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527b51">Keşif</text>
  </g>

  <!-- bottom balance -->
  <path d="M95 272 C175 247 237 275 319 270 S467 251 551 273" fill="none" stroke="#b8d9d4" stroke-width="1.5" stroke-dasharray="4 5"/>
  <g filter="url(#smallShadow)">
    <rect x="225" y="263" width="190" height="38" rx="18" fill="#ffffff"/>
    <circle cx="247" cy="282" r="9" fill="#f4c96c"/>
    <path d="M244 282h6M247 279v6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="265" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537181">Güç ve esneklik dengesi</text>
  </g>
</svg>