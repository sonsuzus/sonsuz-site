<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Dosya I/O Akışları</text>

  <!-- Merkez düğüm -->
  <rect x="255" y="120" width="130" height="50" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Akış</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e40af">Soyut Veri Kanalı</text>

  <!-- Üst sol: Kaynaklar -->
  <rect x="40" y="55" width="130" height="50" rx="12" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#86efac" stroke-width="1.5"/>
  <text x="105" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Kaynaklar</text>
  <text x="105" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#166534">Dosya, Soket, Tampon</text>

  <!-- Üst sağ: Hedefler -->
  <rect x="470" y="55" width="130" height="50" rx="12" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#86efac" stroke-width="1.5"/>
  <text x="535" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Hedefler</text>
  <text x="535" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#166534">Disk, Terminal, Ağ</text>

  <!-- Alt sol: Okuma -->
  <rect x="40" y="215" width="130" height="50" rx="12" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="105" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Okuma</text>
  <text x="105" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#92400e">read, readline, for</text>

  <!-- Alt orta: Yazma -->
  <rect x="255" y="215" width="130" height="50" rx="12" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="320" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Yazma</text>
  <text x="320" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#92400e">write, flush, fsync</text>

  <!-- Alt sağ: Güvenlik -->
  <rect x="470" y="215" width="130" height="50" rx="12" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="535" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Güvenlik</text>
  <text x="535" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9d174d">Kodlama, Yol, Kilit</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Kaynak -> Akış -->
  <line x1="170" y1="80" x2="250" y2="130" stroke="#64748b" stroke-width="2"/>
  <polygon points="250,130 242,122 244,132" fill="#64748b"/>

  <!-- Akış -> Hedef -->
  <line x1="390" y1="130" x2="465" y2="80" stroke="#64748b" stroke-width="2"/>
  <polygon points="465,80 457,88 463,86" fill="#64748b"/>

  <!-- Akış -> Okuma -->
  <line x1="290" y1="170" x2="140" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="140,210 150,208 142,216" fill="#64748b"/>

  <!-- Akış -> Yazma -->
  <line x1="320" y1="170" x2="320" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="320,210 315,202 325,202" fill="#64748b"/>

  <!-- Akış -> Güvenlik -->
  <line x1="350" y1="170" x2="500" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="500,210 490,208 498,216" fill="#64748b"/>

  <!-- Performans etiketi -->
  <rect x="255" y="55" width="130" height="30" rx="8" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#a5b4fc" stroke-width="1"/>
  <text x="320" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#312e81">Performans</text>

  <!-- Performans -> Akış -->
  <line x1="320" y1="85" x2="320" y2="115" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="320,115 315,107 325,107" fill="#64748b"/>

  <!-- T = B/R + L formülü -->
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-style="italic" fill="#475569">T = B/R + L</text>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#94a3b8">Veriyi doğru boyutta ve biçimde taşı</text>
</svg>