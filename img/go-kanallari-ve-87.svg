<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#90a4ae" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#90a4ae" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">Go Kanalları ve Senkronizasyon</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#607d8b">Goroutine'ler Arasında Güvenli Veri Trafiği</text>

  <!-- Goroutine A (sol üst) -->
  <rect x="40" y="70" width="130" height="50" rx="10" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="92" text-anchor="middle" font-weight="bold" fill="#1565c0">Goroutine A</text>
  <text x="105" y="108" text-anchor="middle" fill="#546e7a">Üretici</text>

  <!-- Goroutine B (sol alt) -->
  <rect x="40" y="210" width="130" height="50" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="105" y="232" text-anchor="middle" font-weight="bold" fill="#2e7d32">Goroutine B</text>
  <text x="105" y="248" text-anchor="middle" fill="#546e7a">Tüketici</text>

  <!-- Kanal merkez -->
  <rect x="245" y="130" width="150" height="60" rx="12" fill="#fff8e1" stroke="#ffe082" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="152" text-anchor="middle" font-weight="bold" fill="#f57f17">Kanal</text>
  <text x="320" y="168" text-anchor="middle" fill="#546e7a">chan T</text>
  <text x="320" y="182" text-anchor="middle" fill="#78909c" font-size="10">Gönder / Al</text>

  <!-- Senkronizasyon kutusu (sağ) -->
  <rect x="470" y="130" width="140" height="60" rx="10" fill="#fce4ec" stroke="#f48fb1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="152" text-anchor="middle" font-weight="bold" fill="#c2185b">Senkronizasyon</text>
  <text x="540" y="168" text-anchor="middle" fill="#546e7a">happens-before</text>
  <text x="540" y="182" text-anchor="middle" fill="#78909c" font-size="10">send → receive</text>

  <!-- Ok A -> Kanal -->
  <path d="M 170 95 C 200 95, 215 130, 245 150" fill="none" stroke="#42a5f5" stroke-width="2"/>
  <polygon points="245,150 237,144 239,154" fill="#42a5f5"/>

  <!-- Ok B -> Kanal -->
  <path d="M 170 235 C 200 235, 215 190, 245 170" fill="none" stroke="#66bb6a" stroke-width="2"/>
  <polygon points="245,170 237,176 239,166" fill="#66bb6a"/>

  <!-- Ok Kanal -> Senkronizasyon -->
  <path d="M 395 160 C 420 160, 440 160, 470 160" fill="none" stroke="#ec407a" stroke-width="2"/>
  <polygon points="470,160 461,155 461,165" fill="#ec407a"/>

  <!-- Race condition uyarı kutusu -->
  <rect x="245" y="240" width="150" height="40" rx="8" fill="#ffebee" stroke="#ef9a9a" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="320" y="258" text-anchor="middle" font-weight="bold" fill="#c62828">Race Condition</text>
  <text x="320" y="272" text-anchor="middle" fill="#78909c" font-size="10">Kilit unutma riski</text>

  <!-- Kanal -> Race uyarı bağlantısı -->
  <path d="M 320 190 C 320 210, 320 220, 320 240" fill="none" stroke="#ef9a9a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="320,240 315,232 325,232" fill="#ef9a9a"/>

  <!-- Alt bilgi: Kanal türleri -->
  <rect x="40" y="280" width="180" height="30" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="130" y="299" text-anchor="middle" fill="#006064" font-size="10">Unbuffered / Buffered</text>

  <rect x="245" y="280" width="150" height="30" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="320" y="299" text-anchor="middle" fill="#006064" font-size="10">select / close</text>

  <rect x="420" y="280" width="190" height="30" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="515" y="299" text-anchor="middle" fill="#006064" font-size="10">Send-only / Receive-only</text>
</svg>