  <text x="420" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#245942">Liste + join()</text>
  <text x="591" y="79" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#347559">O(n)</text>

