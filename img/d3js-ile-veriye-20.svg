<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8ddf8"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcff"/>
      <stop offset="100%" stop-color="#d8c7f1"/>
    </linearGradient>
    <linearGradient id="viewGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8f3e4"/>
      <stop offset="100%" stop-color="#bee8d1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#49627a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#49627a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="572" cy="49" r="76" fill="#dff3ec" opacity="0.55"/>
  <circle cx="71" cy="282" r="90" fill="#e4efff" opacity="0.6"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42576e">D3.js · Veri ile Belge Arasında Canlı Bağ</text>

  <!-- data source -->
  <g filter="url(#shadow)">
