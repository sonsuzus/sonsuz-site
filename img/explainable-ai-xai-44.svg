<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6676a7"/>
      <stop offset="100%" stop-color="#465578"/>
    </linearGradient>
    <linearGradient id="xai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="100%" stop-color="#e7f6dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708b" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="52" r="72" fill="#dceefe" opacity="0.55"/>
  <circle cx="581" cy="271" r="90" fill="#dcefdc" opacity="0.5"/>
  <circle cx="326" cy="151" r="117" fill="#ffffff" opacity="0.35"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536b">Açıklanabilir Yapay Zeka</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728398">Kararların perde arkası</text>

  <!-- Inputs -->
  <g filter="url(#softShadow)">
