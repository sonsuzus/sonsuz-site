<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeeff"/>
      <stop offset="100%" stop-color="#cce6f7"/>
    </linearGradient>
    <linearGradient id="any" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4dc"/>
      <stop offset="100%" stop-color="#ffcfc3"/>
    </linearGradient>
    <linearGradient id="unknown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff4df"/>
      <stop offset="100%" stop-color="#c8ebce"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e3ff"/>
      <stop offset="100%" stop-color="#d8d0fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6d8399" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58718b" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="40" r="76" fill="#d9eff4" opacity="0.38"/>
  <circle cx="598" cy="281" r="96" fill="#ddecce" opacity="0.32"/>
  <path d="M22 272 C137 226 172 292 273 257 S459 218 625 252" fill="none" stroke="#b9d7e1" stroke-width="1.5" opacity="0.38"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566d">BELİRSİZ VERİYİ YÖNETME</text>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="32" y="116" width="126" height="91" rx="19" fill="url(#input)" stroke="#b7d6e8"/>
  </g>
  <circle cx="62" cy="148" r="16" fill="#ffffff" opacity="0.8"/>
  <path d="M56 146 C56 141 59 138 63 138 C67 138 70 141 70 146 C70 150 68 152 66 154 L66 158 L60 158 L60 154 C58 152 56 150 56 146Z" fill="#6395b6"/>
  <circle cx="63" cy="162" r="2.4" fill="#6395b6"/>
  <text x="103" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345b75">Belirsiz Veri</text>
  <text x="103" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52758d">API · Girdi · JSON</text>

  <!-- split connector -->
  <path d="M158 161 L184 161 L184 91 L209 91" fill="none" stroke="#7894a8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="209,91 201,86 201,96" fill="#7894a8"/>
  <path d="M184 161 L184 231 L209 231" fill="none" stroke="#7894a8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="209,231 201,226 201,236" fill="#7894a8"/>
  <circle cx="184" cy="161" r="4.5" fill="#7894a8"/>

  <!-- any -->
  <g filter="url(#shadow)">
    <rect x="210" y="49" width="178" height="85" rx="19" fill="url(#any)" stroke="#edb8ae"/>
  </g>
  <rect x="226" y="64" width="49" height="25" rx="12" fill="#e88d7e"/>
  <text x="250.5" y="81" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">any</text>
  <text x="288" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#87483e">Serbest erişim</text>
  <text x="288" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9c6056">Denetim kapalı</text>

  <!-- unknown -->
  <g filter="url(#shadow)">
    <rect x="210" y="189" width="178" height="85" rx="19" fill="url(#unknown)" stroke="#acd7b5"/>
  </g>
  <rect x="226" y="204" width="72" height="25" rx="12" fill="#64ae78"/>
  <text x="262" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">unknown</text>
  <text x="300" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386a48">Önce kontrol</text>
  <text x="300" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#548362">Tip daraltma</text>

  <!-- unsafe path -->
  <path d="M388 91 L441 91" fill="none" stroke="#d58174" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="441,91 433,86 433,96" fill="#d58174"/>
  <g filter="url(#smallShadow)">
    <rect x="448" y="60" width="151" height="62" rx="16" fill="#fff2ed" stroke="#f0c2b7"/>
  </g>
  <circle cx="472" cy="91" r="13" fill="#ef9a88"/>
  <path d="M472 81 L472 94" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="472" cy="100" r="1.8" fill="#ffffff"/>
  <text x="536" y="87" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#985247">Çalışma zamanı</text>
  <text x="536" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ac685d">Hata riski yüksek</text>

  <!-- guarded path -->
  <path d="M388 231 L418 231" fill="none" stroke="#67a879" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="418,231 410,226 410,236" fill="#67a879"/>
  <g filter="url(#smallShadow)">
    <rect x="423" y="198" width="83" height="66" rx="16" fill="#eef9ee" stroke="#b6dcbf"/>
  </g>
  <path d="M464 210 L482 216 L482 230 C482 242 474 249 464 253 C454 249 446 242 446 230 L446 216 Z" fill="#72b885"/>
  <path d="M455 230 L461 236 L474 221" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="464" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477555">Tip kontrolü</text>

  <path d="M506 231 L526 231" fill="none" stroke="#67a879" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="526,231 518,226 518,236" fill="#67a879"/>
  <g filter="url(#shadow)">
    <rect x="530" y="198" width="82" height="66" rx="16" fill="url(#result)" stroke="#c5bce9"/>
  </g>
  <path d="M551 220 L560 214 L569 220 L569 239 L560 245 L551 239 Z" fill="#7c72bf"/>
  <path d="M556 229 L559 232 L565 225" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="578" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#544b91">Güvenli</text>
  <text x="571" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#69609c">Kullanım</text>
</svg>