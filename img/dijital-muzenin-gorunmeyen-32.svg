<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#d9f1e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7f96a8" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7f96a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="159" r="132" fill="#ffffff" opacity="0.32"/>
  <circle cx="319" cy="159" r="104" fill="none" stroke="#c8dceb" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Bağlantılar -->
  <path d="M161 83 C194 86 207 105 233 119" fill="none" stroke="#7796ae" stroke-width="2"/>
  <polygon points="230,113 242,123 227,125" fill="#7796ae"/>
  <path d="M164 238 C195 228 207 208 233 195" fill="none" stroke="#7796ae" stroke-width="2"/>
  <polygon points="227,189 242,192 232,201" fill="#7796ae"/>
  <path d="M406 121 C434 103 447 88 475 84" fill="none" stroke="#7796ae" stroke-width="2"/>
  <polygon points="470,78 483,82 473,90" fill="#7796ae"/>
  <path d="M406 196 C434 213 447 229 475 236" fill="none" stroke="#7796ae" stroke-width="2"/>
  <polygon points="473,230 483,239 469,242" fill="#7796ae"/>

  <!-- Sol üst: kaynak -->
  <g filter="url(#shadow)">
    <rect x="28" y="45" width="136" height="77" rx="16" fill="#fff5dc"/>
    <rect x="41" y="60" width="30" height="30" rx="9" fill="#f6cf82"/>
    <path d="M49 69 h14 M49 75 h14 M49 81 h9" stroke="#9b6b27" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="73" fill="#3f5260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Koleksiyon</text>
    <text x="80" y="91" fill="#657783" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Ham kayıtlar</text>
    <text x="42" y="108" fill="#9a7437" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">eser • kişi • görsel</text>
  </g>

  <!-- Sol alt: normalize -->
  <g filter="url(#shadow)">
    <rect x="28" y="201" width="136" height="77" rx="16" fill="#f5e8f3"/>
    <rect x="41" y="216" width="30" height="30" rx="9" fill="#dcadd0"/>
    <path d="M49 224 h14 M49 230 h10 M49 236 h14" stroke="#8c4f7c" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="229" fill="#3f5260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Uyumlama</text>
    <text x="80" y="247" fill="#657783" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Sözlük ve URI</text>
    <text x="42" y="264" fill="#8c5e81" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">birim • tarih • terim</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="232" y="103" width="176" height="114" rx="23" fill="url(#core)" stroke="#bad7d4" stroke-width="1.2"/>
    <circle cx="320" cy="137" r="22" fill="#ffffff" opacity="0.84"/>
    <path d="M310 141 C314 132 319 130 324 135 C328 128 334 132 335 139 C334 146 326 151 321 154 C316 151 307 147 310 141Z" fill="#68a9a1"/>
    <text x="320" y="174" text-anchor="middle" fill="#324e59" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Olay Merkezli Model</text>
    <text x="320" y="193" text-anchor="middle" fill="#55707a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">varlıklar ve ilişkiler</text>
  </g>

  <!-- Sağ üst standard -->
  <g filter="url(#shadow)">
    <rect x="475" y="45" width="137" height="77" rx="16" fill="#e7edff"/>
    <rect x="488" y="60" width="31" height="30" rx="9" fill="#b5c8fa"/>
    <path d="M496 68 h15 M496 75 h15 M496 82 h10" stroke="#536fae" stroke-width="2" stroke-linecap="round"/>
    <text x="529" y="73" fill="#3f5260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Standartlar</text>
    <text x="529" y="91" fill="#657783" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Ortak dil</text>
    <text x="489" y="108" fill="#5c70a5" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">LIDO • CRM • IIIF</text>
  </g>

  <!-- Sağ alt quality -->
  <g filter="url(#shadow)">
    <rect x="475" y="201" width="137" height="77" rx="16" fill="#e0f3ec"/>
    <rect x="488" y="216" width="31" height="30" rx="9" fill="#9fd8c5"/>
    <path d="M496 234 l6 6 11 -14" fill="none" stroke="#397e70" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="529" y="229" fill="#3f5260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Doğrulama</text>
    <text x="529" y="247" fill="#657783" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Kalite ve kaynak</text>
    <text x="489" y="264" fill="#467f73" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">raporla • yayımla</text>
  </g>

  <!-- Alt akış çizgisi -->
  <path d="M164 284 H472" fill="none" stroke="#a7c4c7" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="320" y="302" text-anchor="middle" fill="#66818a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Tekrarlanabilir aktarım hattı</text>
</svg>