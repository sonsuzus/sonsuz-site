  <text x="301" y="161" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35663d">20</text>
  <text x="342" y="161" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35663d">30</text>
  <text x="383" y="161" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35663d">40</text>
  <rect x="246" y="203" width="161" height="30" rx="10" fill="#dff1dc"/>
  <text x="265" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a7650">boyut = kapasite</text>

  <path d="M424 170 L454 170" fill="none" stroke="#df9b4b" stroke-width="2.5"/>
  <polygon points="454,170 445,164 445,176" fill="#df9b4b"/>
  <text x="427" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a56b26">push_back</text>

