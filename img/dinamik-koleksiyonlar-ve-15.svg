  <text x="473" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a682c">Kapasite dolu</text>
  <text x="473" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ac7c43">Yeni blok ayrılır</text>

  <path d="M488 117 C477 130,477 143,488 153" fill="none" stroke="#d39a50" stroke-width="2"/>
  <polygon points="488,153 481,145 492,144" fill="#d39a50"/>

  <g filter="url(#smallShadow)">
    <rect x="475" y="164" width="27" height="43" rx="7" fill="url(#newGrad)"/>
    <rect x="504" y="164" width="27" height="43" rx="7" fill="url(#newGrad)"/>
    <rect x="533" y="164" width="27" height="43" rx="7" fill="url(#newGrad)"/>
    <rect x="562" y="164" width="27" height="43" rx="7" fill="url(#newGrad)"/>
    <rect x="475" y="210" width="27" height="43" rx="7" fill="#fff7dd"/>
    <rect x="504" y="210" width="27" height="43" rx="7" fill="#fff7dd"/>
    <rect x="533" y="210" width="27" height="43" rx="7" fill="#f7c87a"/>
    <rect x="562" y="210" width="27" height="43" rx="7" fill="#fff7dd"/>
