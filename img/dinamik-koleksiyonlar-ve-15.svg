<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="stackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9ddf6"/>
    </linearGradient>
    <linearGradient id="heapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5f6df"/>
      <stop offset="100%" stop-color="#cceac8"/>
    </linearGradient>
    <linearGradient id="newGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0c9"/>
      <stop offset="100%" stop-color="#f8db9b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#56708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#56708a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>

  <text x="32" y="35" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39516a">Dinamik Vektör</text>
  <text x="32" y="53" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#678096">Nesne küçük, eleman deposu heap üzerinde</text>

  <rect x="32" y="78" width="146" height="182" rx="18" fill="#edf5ff" stroke="#c4d9ee"/>
  <text x="52" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45627c">Stack</text>

  <rect x="49" y="120" width="112" height="113" rx="13" fill="url(#stackGrad)" filter="url(#shadow)"/>
  <text x="63" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294861">Vektör</text>
  <line x1="61" y1="156" x2="149" y2="156" stroke="#95b6d4"/>
  <text x="63" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34546d">veri adresi</text>
  <text x="63" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34546d">boyut: 4</text>
  <text x="63" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34546d">kapasite: 4</text>

  <path d="M178 176 C205 176, 205 149, 226 149" fill="none" stroke="#698ba7" stroke-width="2"/>
  <polygon points="226,149 217,144 218,154" fill="#698ba7"/>

  <rect x="226" y="78" width="198" height="182" rx="18" fill="#eff9ec" stroke="#c9e5c3"/>
  <text x="246" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b7351">Heap</text>
  <text x="333" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#719477">Bitişik blok</text>

  <g filter="url(#smallShadow)">
    <rect x="246" y="129" width="38" height="54" rx="8" fill="#a9d9ac"/>
    <rect x="287" y="129" width="38" height="54" rx="8" fill="#a9d9ac"/>
    <rect x="328" y="129" width="38" height="54" rx="8" fill="#a9d9ac"/>
