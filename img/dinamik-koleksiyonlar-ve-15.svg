  <text x="482" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#855c29">10</text>
  <text x="511" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#855c29">20</text>
  <text x="540" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#855c29">30</text>
  <text x="569" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#855c29">40</text>
  <text x="539" y="236" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#855c29">50</text>
  <text x="475" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#93652c">boyut: 5  •  kapasite: 8</text>

  <path d="M406 253 C425 281,454 288,481 281" fill="none" stroke="#8199a9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="260" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607a89">Taşıma sonrası eski adres geçersiz</text>
