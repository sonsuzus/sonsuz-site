<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2faef"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9e4d5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7391a0" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7191a0" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="77" cy="58" r="64" fill="#dceefa" opacity="0.45"/>
  <circle cx="576" cy="264" r="78" fill="#dff2d9" opacity="0.5"/>
  <circle cx="570" cy="45" r="30" fill="#f7e9c9" opacity="0.6"/>

  <text x="28" y="31" fill="#486474" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Güvenli Mobil Ödeme Akışı</text>
  <text x="28" y="49" fill="#7b929c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Tek dokunuş • kontrollü işlem</text>

  <!-- Flow lines -->
  <path d="M143 125 H177" fill="none" stroke="#8daeba" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="177,125 169,120 169,130" fill="#8daeba"/>
  <path d="M274 125 H307" fill="none" stroke="#8daeba" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="307,125 299,120 299,130" fill="#8daeba"/>
  <path d="M405 125 H438" fill="none" stroke="#8daeba" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="438,125 430,120 430,130" fill="#8daeba"/>
  <path d="M535 125 H562" fill="none" stroke="#8daeba" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="562,125 554,120 554,130" fill="#8daeba"/>

  <!-- Mobile -->
  <g filter="url(#shadow)">
    <rect x="32" y="87" width="111" height="78" rx="18" fill="url(#phone)" stroke="#b9d3df"/>
    <rect x="44" y="99" width="87" height="50" rx="10" fill="#fafdff"/>
    <circle cx="87.5" cy="109" r="3" fill="#8eaeba"/>
    <rect x="67" y="119" width="41" height="18" rx="9" fill="#77c996"/>
    <path d="M78 128 l5 5 10 -11" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="87" y="181" text-anchor="middle" fill="#456373" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Mobil Uygulama</text>
  <text x="87" y="198" text-anchor="middle" fill="#718993" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Öde</text>

  <!-- API -->
  <g filter="url(#softShadow)">
    <rect x="177" y="88" width="97" height="74" rx="16" fill="#fffdf8" stroke="#ebd9ab"/>
    <circle cx="225.5" cy="112" r="15" fill="#f9e6ad"/>
    <path d="M218 113 h15 M221 108 v10 M230 108 v10" stroke="#9c7d2d" stroke-width="1.8" stroke-linecap="round"/>
    <text x="225.5" y="142" text-anchor="middle" fill="#5d5b45" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">API Kapısı</text>
  </g>

  <!-- Risk -->
  <g filter="url(#softShadow)">
    <rect x="307" y="88" width="98" height="74" rx="16" fill="#fffafa" stroke="#e8c5cb"/>
    <path d="M356 103 l13 5 v9 c0 9 -6 15 -13 18 c-7 -3 -13 -9 -13 -18 v-9z" fill="#f5c7cf"/>
    <path d="M350 119 l4 4 8 -9" fill="none" stroke="#a95468" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="356" y="142" text-anchor="middle" fill="#6e5058" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Risk Motoru</text>
  </g>

  <!-- Payment service -->
  <g filter="url(#softShadow)">
    <rect x="438" y="88" width="97" height="74" rx="16" fill="#f9fbff" stroke="#c5d7ed"/>
    <rect x="460" y="103" width="53" height="26" rx="7" fill="#dbeafe"/>
    <path d="M470 116 h32 M470 122 h19" stroke="#5e8bbd" stroke-width="2" stroke-linecap="round"/>
    <text x="486.5" y="142" text-anchor="middle" fill="#47637d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Ödeme Servisi</text>
  </g>

  <!-- Bank -->
  <g filter="url(#softShadow)">
    <rect x="562" y="88" width="55" height="74" rx="16" fill="#f8fffb" stroke="#b9dac5"/>
    <path d="M574 112 l15 -8 15 8 M576 114 h26 M579 116 v13 M586 116 v13 M593 116 v13 M572 132 h34" fill="none" stroke="#56906d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="589.5" y="142" text-anchor="middle" fill="#426c52" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Banka</text>
  </g>

  <!-- Downstream links -->
  <path d="M486 166 V196 H392" fill="none" stroke="#9bb7b6" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="392,196 400,191 400,201" fill="#9bb7b6"/>
  <path d="M589 166 V196 H527" fill="none" stroke="#9bb7b6" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="527,196 535,191 535,201" fill="#9bb7b6"/>

  <!-- Lower architecture -->
  <g filter="url(#shadow)">
    <rect x="39" y="214" width="151" height="76" rx="17" fill="#ffffff" stroke="#cce0e8"/>
    <rect x="54" y="231" width="28" height="38" rx="7" fill="#d7edf2"/>
    <path d="M61 242 h14 M61 249 h14 M61 256 h9" stroke="#5590a0" stroke-width="2" stroke-linecap="round"/>
    <text x="96" y="241" fill="#466875" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">İşlem Kaydı</text>
    <text x="96" y="260" fill="#76919a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Benzersiz anahtar</text>
    <text x="96" y="276" fill="#76919a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Tek sonuç</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="231" y="202" width="177" height="97" rx="18" fill="#ffffff" stroke="#c8ded4"/>
    <text x="319.5" y="225" text-anchor="middle" fill="#48695a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Durum Makinesi</text>
    <rect x="249" y="241" width="43" height="24" rx="9" fill="#fff0c9"/>
    <text x="270.5" y="257" text-anchor="middle" fill="#86692c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Bekliyor</text>
    <path d="M294 253 H311" fill="none" stroke="#8eaea0" stroke-width="1.8"/>
    <polygon points="311,253 305,249 305,257" fill="#8eaea0"/>
    <rect x="313" y="241" width="43" height="24" rx="9" fill="#dcefdc"/>
    <text x="334.5" y="257" text-anchor="middle" fill="#4f7b59" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Onay</text>
    <path d="M358 253 H374" fill="none" stroke="#8eaea0" stroke-width="1.8"/>
    <polygon points="374,253 368,249 368,257" fill="#8eaea0"/>
    <rect x="376" y="241" width="18" height="24" rx="9" fill="#c9e6f5"/>
    <path d="M382 253 l3 3 5 -7" fill="none" stroke="#4e819d" stroke-width="1.7" stroke-linecap="round"/>
    <text x="319.5" y="283" text-anchor="middle" fill="#789289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Yetkilendirme → Tahsilat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="449" y="214" width="151" height="76" rx="17" fill="#ffffff" stroke="#d8cfeb"/>
    <circle cx="475" cy="252" r="17" fill="#e9def7"/>
    <path d="M475 240 v24 M467 247 h16 M467 257 h16" stroke="#79619d" stroke-width="1.7" stroke-linecap="round"/>
    <text x="493" y="241" fill="#5d5072" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Çift Taraflı</text>
    <text x="493" y="259" fill="#5d5072" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Defter</text>
    <text x="493" y="277" fill="#837694" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Dengeli kayıt</text>
  </g>

  <!-- bottom arrows -->
  <path d="M191 252 H226" fill="none" stroke="#8daeba" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="226,252 218,247 218,257" fill="#8daeba"/>
  <path d="M410 252 H444" fill="none" stroke="#8daeba" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="444,252 436,247 436,257" fill="#8daeba"/>

  <text x="320" y="315" text-anchor="middle" fill="#6e8a8a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Güvenlik • tekrar deneme • mutabakat</text>
</svg>