<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9e1f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7390a7" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7590a0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="54" cy="42" r="74" fill="#dceef0" opacity="0.42"/>
  <circle cx="600" cy="290" r="100" fill="#e4edf9" opacity="0.55"/>

  <text x="32" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">Linux: Ortak Dosya Tanımlayıcısı Modeli</text>
  <text x="32" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718594">farklı kaynaklar • ortak giriş / çıkış dili</text>

  <!-- Connections behind blocks -->
  <path d="M158 104 L188 104" fill="none" stroke="#8ba5b6" stroke-width="2"/>
  <polygon points="188,104 180,99 180,109" fill="#8ba5b6"/>
  <path d="M158 160 L188 160" fill="none" stroke="#8ba5b6" stroke-width="2"/>
  <polygon points="188,160 180,155 180,165" fill="#8ba5b6"/>
  <path d="M158 216 L188 216" fill="none" stroke="#8ba5b6" stroke-width="2"/>
  <polygon points="188,216 180,211 180,221" fill="#8ba5b6"/>

  <path d="M329 160 L365 160" fill="none" stroke="#6d9eb9" stroke-width="2.5"/>
  <polygon points="365,160 356,155 356,165" fill="#6d9eb9"/>

  <path d="M487 160 L510 160 L510 103 L530 103" fill="none" stroke="#8ba5b6" stroke-width="2"/>
  <polygon points="530,103 522,98 522,108" fill="#8ba5b6"/>
  <path d="M487 160 L510 160" fill="none" stroke="#8ba5b6" stroke-width="2"/>
  <polygon points="510,160 502,155 502,165" fill="#8ba5b6"/>
  <path d="M487 160 L510 160 L510 217 L530 217" fill="none" stroke="#8ba5b6" stroke-width="2"/>
  <polygon points="530,217 522,212 522,222" fill="#8ba5b6"/>

  <!-- Sources -->
  <g filter="url(#soft)">
    <rect x="32" y="76" width="126" height="56" rx="15" fill="#fff4dc"/>
    <rect x="32" y="76" width="8" height="56" rx="4" fill="#f1bd62"/>
    <path d="M56 91 h18 v23 h-18 z M59 88 h10" fill="none" stroke="#b9822b" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="86" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#695128">Normal dosya</text>
    <text x="86" y="118" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#90754a">kalıcı veri</text>
  </g>

  <g filter="url(#soft)">
    <rect x="32" y="132" width="126" height="56" rx="15" fill="#e1f3ee"/>
    <rect x="32" y="132" width="8" height="56" rx="4" fill="#69bda3"/>
    <circle cx="58" cy="158" r="8" fill="none" stroke="#38866f" stroke-width="1.8"/>
    <path d="M66 158 h11 M73 154 l4 4 -4 4" fill="none" stroke="#38866f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#326856">Soket</text>
    <text x="86" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#568676">ağ iletişimi</text>
  </g>

  <g filter="url(#soft)">
    <rect x="32" y="188" width="126" height="56" rx="15" fill="#eee6fa"/>
    <rect x="32" y="188" width="8" height="56" rx="4" fill="#a889d3"/>
    <path d="M55 207 v18 M55 207 h10 M65 207 v18 M65 225 h10" fill="none" stroke="#7856aa" stroke-width="2" stroke-linecap="round"/>
    <text x="86" y="213" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5e4385">Pipe</text>
    <text x="86" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#816aa2">süreç akışı</text>
  </g>

  <!-- FD Table -->
  <g filter="url(#shadow)">
    <rect x="188" y="70" width="141" height="181" rx="20" fill="url(#core)"/>
    <text x="208" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#335d7d">Süreç</text>
    <text x="208" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527692">FD tablosu</text>
    <rect x="204" y="129" width="108" height="28" rx="8" fill="#f8fcff"/>
    <rect x="204" y="164" width="108" height="28" rx="8" fill="#f8fcff"/>
    <rect x="204" y="199" width="108" height="28" rx="8" fill="#f8fcff"/>
    <circle cx="221" cy="143" r="9" fill="#8ab5d4"/>
    <circle cx="221" cy="178" r="9" fill="#79bea9"/>
    <circle cx="221" cy="213" r="9" fill="#aa91d3"/>
    <text x="217" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="217" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="217" y="217" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="242" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43667f">indeks</text>
    <text x="242" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43667f">indeks</text>
    <text x="242" y="217" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43667f">indeks</text>
  </g>

  <!-- Common interface -->
  <g filter="url(#shadow)">
    <rect x="365" y="105" width="122" height="110" rx="20" fill="#d9f0ec"/>
    <circle cx="426" cy="130" r="19" fill="#f8fffd"/>
    <path d="M417 130 h18 M427 122 l8 8 -8 8" fill="none" stroke="#3e927d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="386" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#276b5c">Ortak arayüz</text>
    <text x="386" y="186" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#49897b">oku() • yaz()</text>
    <text x="386" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#49897b">kapat()</text>
  </g>

  <!-- Kernel -->
  <g filter="url(#shadow)">
    <rect x="530" y="76" width="82" height="55" rx="15" fill="#ffe7d9"/>
    <rect x="530" y="133" width="82" height="55" rx="15" fill="#e7edfc"/>
    <rect x="530" y="190" width="82" height="55" rx="15" fill="#f0e8fb"/>
    <text x="542" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8c5735">Kernel</text>
    <text x="542" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b7154">inode</text>
    <text x="542" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526a9c">Kernel</text>
    <text x="542" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687fa8">ağ tamponu</text>
    <text x="542" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#72548e">Kernel</text>
    <text x="542" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#896fa0">pipe tamponu</text>
  </g>

  <text x="32" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667f8c">FD kaynak değildir; süreç tablosundaki küçük bir sayısal başvurudur.</text>
  <path d="M32 296 H608" stroke="#c9dbe0" stroke-width="1"/>
</svg>