<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfeaff"/>
      <stop offset="100%" stop-color="#d8f4eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#58708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>

  <circle cx="320" cy="159" r="110" fill="#dcecf1" opacity="0.28"/>
  <circle cx="320" cy="159" r="84" fill="#ffffff" opacity="0.32"/>

  <!-- Bağlantılar -->
  <path d="M145 151 L218 151" fill="none" stroke="#7995ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="218,151 208,145 208,157" fill="#7995ad"/>

  <path d="M332 115 L405 78" fill="none" stroke="#6f9b8c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="405,78 394,76 399,86" fill="#6f9b8c"/>

  <path d="M336 176 L405 217" fill="none" stroke="#778db2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="405,217 395,207 390,216" fill="#778db2"/>

  <path d="M478 105 L478 143 L519 143" fill="none" stroke="#d19572" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="519,143 509,137 509,149" fill="#d19572"/>

  <path d="M478 245 L478 272 L519 272" fill="none" stroke="#7d9a98" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="519,272 509,266 509,278" fill="#7d9a98"/>

  <path d="M320 213 L320 259" fill="none" stroke="#a87878" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="320,259 314,249 326,249" fill="#a87878"/>

  <!-- Dağıtım -->
  <g filter="url(#shadow)">
    <rect x="28" y="112" width="117" height="78" rx="18" fill="#ffffff"/>
    <rect x="42" y="126" width="31" height="31" rx="9" fill="#cfe0ff"/>
    <path d="M50 143 L58 136 L66 143 L58 150 Z" fill="none" stroke="#5475a5" stroke-width="2"/>
    <path d="M79 137 H127 M79 150 H116 M79 163 H108" stroke="#abc0d7" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="179" text-anchor="middle" fill="#3e5874" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Kod dağıtımı</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="218" y="101" width="118" height="113" rx="23" fill="url(#core)" stroke="#c0dce1"/>
    <circle cx="277" cy="132" r="19" fill="#ffffff" opacity="0.85"/>
    <path d="M270 124 L284 132 L270 140 Z" fill="#587f9a"/>
    <rect x="251" y="159" width="52" height="20" rx="10" fill="#7ea994"/>
    <circle cx="291" cy="169" r="7" fill="#ffffff"/>
    <text x="277" y="196" text-anchor="middle" fill="#315c62" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Özellik bayrağı</text>
  </g>

  <!-- Yeni deneyim -->
  <g filter="url(#shadow)">
    <rect x="405" y="39" width="146" height="67" rx="17" fill="#e0f4e9"/>
    <circle cx="427" cy="62" r="11" fill="#77b898"/>
    <path d="M422 62 L426 66 L433 57" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="485" y="66" text-anchor="middle" fill="#356c56" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Yeni deneyim</text>
    <text x="485" y="86" text-anchor="middle" fill="#638b79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">%10 yayılım</text>
  </g>

  <!-- Eski deneyim -->
  <g filter="url(#shadow)">
    <rect x="405" y="190" width="146" height="67" rx="17" fill="#e6edff"/>
    <circle cx="427" cy="213" r="11" fill="#8399c8"/>
    <path d="M422 213 H432" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="485" y="217" text-anchor="middle" fill="#4d6397" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Güvenilir akış</text>
    <text x="485" y="237" text-anchor="middle" fill="#7486ae" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Varsayılan</text>
  </g>

  <!-- Kriterler -->
  <g filter="url(#smallShadow)">
    <rect x="349" y="118" width="103" height="25" rx="12" fill="#fff8df"/>
    <text x="400" y="135" text-anchor="middle" fill="#8a7140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Rol ve hedef</text>
  </g>
  <path d="M336 137 L349 131" fill="none" stroke="#ad9670" stroke-width="1.8"/>
  <g filter="url(#smallShadow)">
    <rect x="349" y="151" width="103" height="25" rx="12" fill="#fff8df"/>
    <text x="400" y="168" text-anchor="middle" fill="#8a7140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Bölge ve zaman</text>
  </g>
  <path d="M336 154 L349 163" fill="none" stroke="#ad9670" stroke-width="1.8"/>

  <!-- İzleme -->
  <g filter="url(#shadow)">
    <rect x="519" y="117" width="94" height="61" rx="16" fill="#fff0e8"/>
    <path d="M536 153 L546 144 L555 150 L568 134 L593 134" fill="none" stroke="#d17b58" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="546" cy="144" r="2.5" fill="#d17b58"/>
    <circle cx="555" cy="150" r="2.5" fill="#d17b58"/>
    <circle cx="568" cy="134" r="2.5" fill="#d17b58"/>
    <text x="566" y="168" text-anchor="middle" fill="#9b593f" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Metrikler</text>
  </g>

  <!-- Denetim -->
  <g filter="url(#shadow)">
    <rect x="519" y="245" width="94" height="52" rx="16" fill="#e3f1f0"/>
    <path d="M538 262 H569 M538 270 H578 M538 278 H559" stroke="#64908e" stroke-width="2.4" stroke-linecap="round"/>
    <text x="566" y="289" text-anchor="middle" fill="#4b7775" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Denetim</text>
  </g>

  <!-- Acil kapatma -->
  <g filter="url(#shadow)">
    <rect x="258" y="259" width="124" height="43" rx="15" fill="#ffe8e8"/>
    <circle cx="280" cy="280" r="10" fill="#d96868"/>
    <path d="M280 274 V286 M274 280 H286" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="332" y="285" text-anchor="middle" fill="#9d4d50" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Acil kapatma</text>
  </g>

  <!-- Küçük durum noktaları -->
  <circle cx="202" cy="151" r="4" fill="#7aaf9b"/>
  <circle cx="363" cy="100" r="4" fill="#7aaf9b"/>
  <circle cx="363" cy="198" r="4" fill="#8399c8"/>
</svg>