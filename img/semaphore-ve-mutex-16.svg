<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="mutexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5efff"/>
      <stop offset="100%" stop-color="#cfdef7"/>
    </linearGradient>
    <linearGradient id="semGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e1f5e9"/>
      <stop offset="100%" stop-color="#c8ead7"/>
    </linearGradient>
    <linearGradient id="resourceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff6dc"/>
      <stop offset="100%" stop-color="#f9e4a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7890a0" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#678091" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="85" cy="48" r="74" fill="#dcefff" opacity="0.42"/>
  <circle cx="572" cy="277" r="100" fill="#dff3df" opacity="0.38"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5264">ORTAK KAYNAK ERİŞİMİ</text>
  <text x="320" y="47" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#738594">Eşzamanlılık denetimi</text>

  <!-- Left mutex card -->
  <rect x="30" y="70" width="267" height="216" rx="20" fill="#f9fcff" filter="url(#shadow)"/>
  <rect x="30" y="70" width="267" height="47" rx="20" fill="url(#mutexGrad)"/>
  <rect x="30" y="96" width="267" height="21" fill="url(#mutexGrad)"/>
  <circle cx="57" cy="93" r="13" fill="#ffffff" opacity="0.82"/>
  <path d="M53 91 v-4.5 a4 4 0 0 1 8 0V91 M51 91 h12 v9 H51z" fill="none" stroke="#517aa8" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="80" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315878">MUTEX</text>
  <text x="147" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55728b">tek anahtar</text>

  <!-- mutex threads -->
  <rect x="52" y="139" width="65" height="31" rx="11" fill="#ffffff" filter="url(#smallShadow)"/>
  <circle cx="66" cy="154.5" r="5" fill="#87acd3"/>
  <text x="76" y="159" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456175">İş 1</text>

  <rect x="52" y="198" width="65" height="31" rx="11" fill="#ffffff" filter="url(#smallShadow)"/>
  <circle cx="66" cy="213.5" r="5" fill="#b6c6d8"/>
  <text x="76" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a0">İş 2</text>

  <!-- lines mutex -->
  <path d="M118 154.5 H153" fill="none" stroke="#7095ba" stroke-width="2"/>
  <polygon points="153,154.5 145,150 145,159" fill="#7095ba"/>
  <path d="M118 213.5 H136 Q144 213.5 144 205.5 V171 Q144 164 153 164" fill="none" stroke="#b0becc" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="153,164 145,159.5 145,168.5" fill="#b0becc"/>

  <!-- lock gate -->
  <rect x="154" y="136" width="43" height="45" rx="12" fill="#dce9f8" filter="url(#smallShadow)"/>
  <path d="M166 154 v-5 a5 5 0 0 1 10 0v5 M163 154 h16 v13 h-16z" fill="none" stroke="#49759f" stroke-width="2" stroke-linejoin="round"/>
  <text x="175.5" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#51718a">kilit</text>

  <path d="M198 158.5 H219" fill="none" stroke="#7095ba" stroke-width="2"/>
  <polygon points="219,158.5 211,154 211,163" fill="#7095ba"/>

  <!-- mutex resource -->
  <rect x="220" y="136" width="55" height="45" rx="12" fill="url(#resourceGrad)" filter="url(#smallShadow)"/>
  <path d="M237 148 h21 M237 155 h21 M237 162 h14" stroke="#a77c32" stroke-width="1.6" stroke-linecap="round"/>
  <text x="247.5" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#856631">veri</text>
  <text x="164" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416783">N ≤ 1</text>
  <text x="164" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718796">Sahip kilidi bırakır</text>

  <!-- Right semaphore card -->
  <rect x="343" y="70" width="267" height="216" rx="20" fill="#fbfefb" filter="url(#shadow)"/>
  <rect x="343" y="70" width="267" height="47" rx="20" fill="url(#semGrad)"/>
  <rect x="343" y="96" width="267" height="21" fill="url(#semGrad)"/>
  <circle cx="370" cy="93" r="13" fill="#ffffff" opacity="0.82"/>
  <circle cx="365" cy="93" r="3" fill="#4c9b71"/>
  <circle cx="370" cy="93" r="3" fill="#4c9b71"/>
  <circle cx="375" cy="93" r="3" fill="#4c9b71"/>
  <text x="394" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397657">SEMAPHORE</text>
  <text x="486" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56816b">izin havuzu</text>

  <!-- incoming jobs -->
  <rect x="361" y="137" width="55" height="27" rx="10" fill="#ffffff" filter="url(#smallShadow)"/>
  <circle cx="374" cy="150.5" r="4.5" fill="#75ba91"/>
  <text x="384" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477160">İş 1</text>
  <rect x="361" y="174" width="55" height="27" rx="10" fill="#ffffff" filter="url(#smallShadow)"/>
  <circle cx="374" cy="187.5" r="4.5" fill="#75ba91"/>
  <text x="384" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477160">İş 2</text>
  <rect x="361" y="211" width="55" height="27" rx="10" fill="#ffffff" filter="url(#smallShadow)"/>
  <circle cx="374" cy="224.5" r="4.5" fill="#75ba91"/>
  <text x="384" y="229" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477160">İş 3</text>

  <!-- collection lines -->
  <path d="M417 150.5 H433 Q440 150.5 440 158 V179" fill="none" stroke="#6ea98a" stroke-width="1.8"/>
  <path d="M417 187.5 H440" fill="none" stroke="#6ea98a" stroke-width="1.8"/>
  <path d="M417 224.5 H433 Q440 224.5 440 217 V196" fill="none" stroke="#6ea98a" stroke-width="1.8"/>
  <polygon points="440,187.5 433,183.5 433,191.5" fill="#6ea98a"/>

  <!-- permits -->
  <rect x="441" y="136" width="64" height="104" rx="14" fill="#d9efdf" filter="url(#smallShadow)"/>
  <text x="473" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d7656">İzinler</text>
  <rect x="453" y="164" width="40" height="17" rx="6" fill="#ffffff"/>
  <rect x="453" y="187" width="40" height="17" rx="6" fill="#ffffff"/>
  <rect x="453" y="210" width="40" height="17" rx="6" fill="#ffffff"/>
  <text x="473" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c9269">1</text>
  <text x="473" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c9269">2</text>
  <text x="473" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c9269">3</text>

  <path d="M506 188 H528" fill="none" stroke="#6ea98a" stroke-width="2"/>
  <polygon points="528,188 520,183.5 520,192.5" fill="#6ea98a"/>

  <!-- pool -->
  <rect x="529" y="145" width="61" height="86" rx="14" fill="url(#resourceGrad)" filter="url(#smallShadow)"/>
  <text x="559.5" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#88672b">Havuz</text>
  <circle cx="546" cy="192" r="8" fill="#d69e5a"/>
  <circle cx="559.5" cy="192" r="8" fill="#d69e5a"/>
  <circle cx="573" cy="192" r="8" fill="#d69e5a"/>
  <text x="559.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#856631">K kaynak</text>

  <text x="476" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f7a58">N ≤ K</text>
  <text x="476" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8978">İzin alınır ve iade edilir</text>
</svg>