<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff4ff"/>
      <stop offset="100%" stop-color="#dff7e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#62758a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#556b7b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="83" cy="52" r="58" fill="#d9ebff" opacity="0.48"/>
  <circle cx="584" cy="265" r="77" fill="#dff3dc" opacity="0.52"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40566c" font-weight="600">Kara Kutudan Cam Kutuya</text>

  <!-- Inputs -->
  <g filter="url(#soft)">
    <rect x="28" y="89" width="110" height="45" rx="13" fill="#fff4dc"/>
    <circle cx="51" cy="111" r="12" fill="#f4c978"/>
    <path d="M46 113 L51 106 L56 113 L51 117 Z" fill="#fffaf0"/>
    <text x="93" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#68533a" font-weight="600">Veri</text>
    <text x="93" y="123" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806b50">geçmiş kayıtlar</text>
  </g>

  <g filter="url(#soft)">
    <rect x="28" y="177" width="110" height="45" rx="13" fill="#eee5ff"/>
