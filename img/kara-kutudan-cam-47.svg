    <path d="M570 153 h17 M570 160 h25 M570 167 h12" stroke="#6392c8" stroke-width="2" stroke-linecap="round"/>
    <text x="598" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456b98" font-weight="600">Gerekçe</text>
  </g>

  <g filter="url(#soft)">
    <rect x="553" y="194" width="67" height="47" rx="12" fill="#fff0eb"/>
    <path d="M570 210 h18 v14 h-18 z M574 214 h10 M574 219 h7" fill="none" stroke="#c77861" stroke-width="1.8" stroke-linecap="round"/>
    <text x="598" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#93604f" font-weight="600">Denetim</text>
  </g>

  <!-- bottom ethics strip -->
  <g filter="url(#soft)">
    <rect x="151" y="269" width="371" height="34" rx="15" fill="#ffffff" opacity="0.9"/>
    <circle cx="177" cy="286" r="8" fill="#f3bd77"/>
    <text x="191" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e6873">Adalet</text>
    <path d="M250 286 H272" stroke="#bdcbd0" stroke-width="1.5"/>
    <circle cx="289" cy="286" r="8" fill="#83b9d7"/>
    <text x="303" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e6873">Şeffaflık</text>
    <path d="M383 286 H405" stroke="#bdcbd0" stroke-width="1.5"/>
    <circle cx="422" cy="286" r="8" fill="#8bc89a"/>
    <text x="436" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e6873">Sorumluluk</text>
  </g>
