    <rect x="383" y="78" width="123" height="31" rx="9" fill="#ffffff" opacity="0.72"/>
    <circle cx="400" cy="93" r="8" fill="#69b9cb"/>
    <text x="450" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355b67" font-weight="600">Karar Mantığı</text>

