    <circle cx="400" cy="153" r="5" fill="#f0ad72"/>
    <text x="414" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42636a">Gecikme</text>
    <rect x="443" y="146" width="43" height="10" rx="5" fill="#edb37e"/>

    <path d="M397 180 H487" stroke="#8bbbc3" stroke-width="1.5"/>
    <circle cx="400" cy="180" r="5" fill="#9c8cdf"/>
    <text x="414" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42636a">Veri kökeni</text>
    <rect x="452" y="173" width="34" height="10" rx="5" fill="#ae9ae7"/>

    <rect x="391" y="199" width="107" height="31" rx="9" fill="#ffffff" opacity="0.75"/>
    <text x="444" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38626b" font-weight="600">İzlenebilir karar</text>
  </g>

  <!-- outputs -->
  <path d="M522 108 H550" fill="none" stroke="#7a9ba1" stroke-width="2"/>
  <polygon points="550,108 542,103 542,113" fill="#7a9ba1"/>
  <path d="M522 153 H550" fill="none" stroke="#7a9ba1" stroke-width="2"/>
  <polygon points="550,153 542,148 542,158" fill="#7a9ba1"/>
  <path d="M522 198 H550" fill="none" stroke="#7a9ba1" stroke-width="2"/>
  <polygon points="550,198 542,193 542,203" fill="#7a9ba1"/>

  <g filter="url(#soft)">
    <rect x="553" y="84" width="67" height="47" rx="12" fill="#e1f5e6"/>
    <path d="M570 108 l7 7 l15 -16" fill="none" stroke="#54a776" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="598" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6c50" font-weight="600">Karar</text>
  </g>

