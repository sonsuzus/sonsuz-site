    <path d="M46 199 H56 M51 194 V204" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="93" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d4c83" font-weight="600">Başvuru</text>
    <text x="93" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76658f">özellikler</text>
  </g>

  <!-- arrows to model -->
  <path d="M138 111 H177" fill="none" stroke="#8293a3" stroke-width="2"/>
  <polygon points="177,111 169,106 169,116" fill="#8293a3"/>
  <path d="M138 199 H177" fill="none" stroke="#8293a3" stroke-width="2"/>
  <polygon points="177,199 169,194 169,204" fill="#8293a3"/>

  <!-- black box -->
  <g filter="url(#shadow)">
    <rect x="180" y="73" width="146" height="164" rx="22" fill="#33485d"/>
    <rect x="190" y="83" width="126" height="144" rx="17" fill="#283b4e"/>
    <circle cx="253" cy="145" r="37" fill="#1c2b3a"/>
    <path d="M232 130 C242 116 264 116 274 130 M228 155 C241 142 266 143 278 157 M239 170 C247 163 259 163 268 170" fill="none" stroke="#7c92a8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="238" cy="132" r="3" fill="#f2c76e"/>
    <circle cx="270" cy="132" r="3" fill="#f2c76e"/>
    <text x="253" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf5fc" font-weight="600">Kara Kutu Model</text>
    <text x="253" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b9c8d5">neden belirsiz</text>
