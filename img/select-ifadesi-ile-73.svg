<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Select İfadesi ile Çoklu Kanal Yönetimi</text>

  <!-- Merkez select kutusu -->
  <rect x="255" y="115" width="130" height="50" rx="12" fill="#4a90d9" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">select</text>
  <text x="320" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f0fe">karar mekanizması</text>

  <!-- Kanal kutuları -->
  <rect x="40" y="45" width="120" height="45" rx="10" fill="#e8a87c" filter="url(#shadowLight)"/>
  <text x="100" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5d3a1a">Kanal 1</text>
  <text x="100" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a4e2a">hızlı veri</text>

  <rect x="40" y="135" width="120" height="45" rx="10" fill="#95b8d1" filter="url(#shadowLight)"/>
  <text x="100" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">Kanal 2</text>
  <text x="100" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a4a6c">yavaş veri</text>

  <rect x="40" y="225" width="120" height="45" rx="10" fill="#c9a7d8" filter="url(#shadowLight)"/>
  <text x="100" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a1a5c">Kanal N</text>
  <text x="100" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a3a7c">zamanlayıcı</text>

  <!-- Sağdaki çıktı kutuları -->
  <rect x="480" y="45" width="130" height="45" rx="10" fill="#6bc5a5" filter="url(#shadowLight)"/>
  <text x="545" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0a3a2a">İşleme Al</text>
  <text x="545" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a4a3a">hazır kanal</text>

  <rect x="480" y="135" width="130" height="45" rx="10" fill="#f2c94c" filter="url(#shadowLight)"/>
  <text x="545" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a4a0a">Timeout</text>
  <text x="545" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a6a2a">zaman aşımı</text>

  <rect x="480" y="225" width="130" height="45" rx="10" fill="#e07a5f" filter="url(#shadowLight)"/>
  <text x="545" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a1a0a">Default</text>
  <text x="545" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a3a2a">bekleme</text>

  <!-- Oklar: soldan merkeze -->
  <path d="M160 67 L250 130" stroke="#4a90d9" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="250,130 241,122 244,133" fill="#4a90d9"/>

  <path d="M160 157 L250 142" stroke="#4a90d9" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="250,142 241,137 243,148" fill="#4a90d9"/>

  <path d="M160 247 L250 158" stroke="#4a90d9" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="250,158 241,154 244,165" fill="#4a90d9"/>

  <!-- Oklar: merkezden sağa -->
  <path d="M385 130 L475 67" stroke="#6bc5a5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="475,67 465,66 472,75" fill="#6bc5a5"/>

  <path d="M385 142 L475 157" stroke="#f2c94c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="475,157 466,151 466,163" fill="#f2c94c"/>

  <path d="M385 155 L475 247" stroke="#e07a5f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="475,247 466,240 466,252" fill="#e07a5f"/>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a" opacity="0.8">T_tepki = min(T_C1, T_C2, ..., T_Cn)</text>

  <!-- Küçük dekoratif noktalar -->
  <circle cx="220" cy="100" r="3" fill="#4a90d9" opacity="0.5"/>
  <circle cx="230" cy="170" r="3" fill="#95b8d1" opacity="0.5"/>
  <circle cx="420" cy="100" r="3" fill="#6bc5a5" opacity="0.5"/>
  <circle cx="410" cy="190" r="3" fill="#f2c94c" opacity="0.5"/>
</svg>