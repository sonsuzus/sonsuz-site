<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="arrayGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="100%" stop-color="#e5f6dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6d8494" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d8494" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="54" cy="42" r="48" fill="#dcefff" opacity="0.55"/>
  <circle cx="596" cy="282" r="68" fill="#dff1d7" opacity="0.5"/>
  <path d="M20 252 C120 220, 152 296, 248 260 S410 226, 620 250" fill="none" stroke="#c9e3df" stroke-width="2" opacity="0.55"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385269">Sıralı Dizide İki İşaretçi</text>
  <text x="32" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718592">uçlardan daralt, hedefi bul</text>

  <g filter="url(#shadow)">
    <rect x="32" y="74" width="262" height="106" rx="18" fill="#ffffff"/>
    <rect x="43" y="86" width="240" height="34" rx="10" fill="url(#arrayGrad)"/>
  </g>
  <text x="56" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#476373">Artan dizi</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="48" y="132" width="34" height="32" rx="8" fill="#d7ebff" filter="url(#softShadow)"/>
    <text x="65" y="153" fill="#315b78">2</text>
    <rect x="88" y="132" width="34" height="32" rx="8" fill="#e2f1ff" filter="url(#softShadow)"/>
    <text x="105" y="153" fill="#315b78">4</text>
    <rect x="128" y="132" width="34" height="32" rx="8" fill="#edf6e9" filter="url(#softShadow)"/>
    <text x="145" y="153" fill="#456b51">6</text>
    <rect x="168" y="132" width="34" height="32" rx="8" fill="#edf6e9" filter="url(#softShadow)"/>
    <text x="185" y="153" fill="#456b51">8</text>
    <rect x="208" y="132" width="34" height="32" rx="8" fill="#e2f1ff" filter="url(#softShadow)"/>
    <text x="225" y="153" fill="#315b78">11</text>
    <rect x="248" y="132" width="28" height="32" rx="8" fill="#d7ebff" filter="url(#softShadow)"/>
    <text x="262" y="153" fill="#315b78">14</text>
  </g>

  <path d="M64 127 L64 116 L72 116" fill="none" stroke="#4d8bb6" stroke-width="2"/>
  <polygon points="72,112 80,116 72,120" fill="#4d8bb6"/>
  <text x="48" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d8bb6">sol</text>

  <path d="M263 127 L263 116 L255 116" fill="none" stroke="#5d9e72" stroke-width="2"/>
  <polygon points="255,112 247,116 255,120" fill="#5d9e72"/>
  <text x="244" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d9e72">sağ</text>

  <path d="M300 127 L329 127" fill="none" stroke="#8199aa" stroke-width="2.5"/>
  <polygon points="329,122 339,127 329,132" fill="#8199aa"/>

  <g filter="url(#shadow)">
    <rect x="341" y="79" width="132" height="96" rx="20" fill="#ffffff"/>
    <circle cx="407" cy="117" r="27" fill="#f0e4ff"/>
    <text x="407" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#694d8a">a[sol]</text>
    <text x="407" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#694d8a">+ a[sağ]</text>
    <text x="407" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#6d7783">toplam ve hedef</text>
  </g>

  <path d="M476 103 C493 94, 503 88, 518 88" fill="none" stroke="#dc8d75" stroke-width="2.5"/>
  <polygon points="517,83 527,88 517,93" fill="#dc8d75"/>
  <path d="M476 127 L518 127" fill="none" stroke="#69966e" stroke-width="2.5"/>
  <polygon points="517,122 527,127 517,132" fill="#69966e"/>
  <path d="M476 151 C493 160, 503 166, 518 166" fill="none" stroke="#5b91bc" stroke-width="2.5"/>
  <polygon points="517,161 527,166 517,171" fill="#5b91bc"/>

  <g filter="url(#softShadow)">
    <rect x="529" y="67" width="85" height="42" rx="13" fill="#fff0e8"/>
    <rect x="529" y="106" width="85" height="42" rx="13" fill="#e7f5e6"/>
    <rect x="529" y="145" width="85" height="42" rx="13" fill="#e8f3ff"/>
  </g>
  <text x="571.5" y="85" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#a75543">Toplam büyük</text>
  <text x="571.5" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#a75543">sağ ←</text>
  <text x="571.5" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4c8252">Toplam = hedef</text>
  <text x="571.5" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#4c8252">çift bulundu</text>
  <text x="571.5" y="163" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#3e719a">Toplam küçük</text>
  <text x="571.5" y="179" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#3e719a">sol →</text>

  <g filter="url(#shadow)">
    <rect x="92" y="218" width="456" height="61" rx="18" fill="#ffffff"/>
  </g>
  <path d="M133 249 L204 249" fill="none" stroke="#a8b9c4" stroke-width="2"/>
  <polygon points="204,244 214,249 204,254" fill="#a8b9c4"/>
  <path d="M286 249 L357 249" fill="none" stroke="#a8b9c4" stroke-width="2"/>
  <polygon points="357,244 367,249 357,254" fill="#a8b9c4"/>
  <path d="M439 249 L499 249" fill="none" stroke="#a8b9c4" stroke-width="2"/>
  <polygon points="499,244 509,249 499,254" fill="#a8b9c4"/>

  <circle cx="116" cy="249" r="18" fill="#ddecff"/>
  <text x="116" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#416f96">Başla</text>
  <text x="163" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#687d8a">sol = 0</text>
  <text x="163" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#687d8a">sağ = n−1</text>

  <circle cx="269" cy="249" r="18" fill="#f0e4ff"/>
  <text x="269" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#70528f">Hesapla</text>
  <text x="316" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#687d8a">toplam</text>
  <text x="316" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#687d8a">karşılaştır</text>

  <circle cx="422" cy="249" r="18" fill="#e4f3df"/>
  <text x="422" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4f8154">Ele</text>
  <text x="468" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#687d8a">imkânsız</text>
  <text x="468" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#687d8a">adaylar</text>

  <text x="320" y="302" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#4f6877">Sıralılık değişmezi • Doğrusal süre O(n) • Ek bellek O(1)</text>
</svg>