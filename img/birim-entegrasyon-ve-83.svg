<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aee7d2"/>
      <stop offset="100%" stop-color="#81ceb9"/>
    </linearGradient>
    <linearGradient id="integration" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9d9f5"/>
      <stop offset="100%" stop-color="#8bbce5"/>
    </linearGradient>
    <linearGradient id="e2e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dec8f2"/>
      <stop offset="100%" stop-color="#bb9de0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#55708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#55708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="55" r="52" fill="#dcecf9" opacity="0.42"/>
  <circle cx="582" cy="267" r="68" fill="#dcefdc" opacity="0.42"/>

  <text x="320" y="30" text-anchor="middle" fill="#36526a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Güvenilir Yazılım · Test Piramidi</text>

  <g filter="url(#shadow)">
    <path d="M320 55 L405 139 L235 139 Z" fill="url(#e2e)" stroke="#a88acb" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M235 147 L405 147 L467 209 L173 209 Z" fill="url(#integration)" stroke="#77a9d2" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M173 217 L467 217 L535 286 L105 286 Z" fill="url(#unit)" stroke="#6ab49e" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#244257">
    <text x="320" y="101" text-anchor="middle" font-weight="700">Uçtan Uca</text>
    <text x="320" y="119" text-anchor="middle">Az · Yavaş · Kritik akış</text>

    <text x="320" y="174" text-anchor="middle" font-weight="700">Entegrasyon</text>
    <text x="320" y="192" text-anchor="middle">Yeterli · Orta hız · Bileşen uyumu</text>

    <text x="320" y="246" text-anchor="middle" font-weight="700">Birim</text>
    <text x="320" y="266" text-anchor="middle">Çok · Hızlı · İzole iş kuralları</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="24" y="76" width="108" height="50" rx="14" fill="#ffffff" opacity="0.93"/>
    <rect x="508" y="77" width="108" height="50" rx="14" fill="#ffffff" opacity="0.93"/>
    <rect x="24" y="230" width="118" height="48" rx="14" fill="#ffffff" opacity="0.93"/>
    <rect x="498" y="230" width="118" height="48" rx="14" fill="#ffffff" opacity="0.93"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#36526a">
    <text x="78" y="97" text-anchor="middle" font-weight="700">Geri bildirim</text>
    <text x="78" y="114" text-anchor="middle">hızı artar</text>

    <text x="562" y="98" text-anchor="middle" font-weight="700">Çalışma süresi</text>
    <text x="562" y="115" text-anchor="middle">artar</text>

    <text x="83" y="250" text-anchor="middle" font-weight="700">Kapsam</text>
    <text x="83" y="267" text-anchor="middle">daralır</text>

    <text x="557" y="250" text-anchor="middle" font-weight="700">Test sayısı</text>
    <text x="557" y="267" text-anchor="middle">azalır</text>
  </g>

  <g fill="none" stroke="#7194a8" stroke-width="1.5" stroke-linecap="round">
    <path d="M132 101 L181 101 L181 77 L286 77"/>
    <path d="M508 102 L458 102 L458 77 L354 77"/>
    <path d="M142 254 L161 254 L161 268 L196 268"/>
    <path d="M498 254 L478 254 L478 268 L444 268"/>
  </g>

  <g fill="#7194a8">
