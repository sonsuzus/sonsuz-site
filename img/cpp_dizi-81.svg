<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ed"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">C++ Diziler</text>

  <!-- Merkez kavram -->
  <rect x="255" y="50" width="130" height="44" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Dizi</text>

  <!-- Ok: Dizi -> Aynı Veri Türü -->
  <path d="M 255 72 L 195 72" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="195,72 205,67 205,77" fill="#64748b"/>

  <rect x="60" y="52" width="130" height="40" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="125" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3730a3">Aynı Veri Türü</text>

  <!-- Ok: Dizi -> Tek İsim -->
  <path d="M 385 72 L 445 72" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="445,72 435,67 435,77" fill="#64748b"/>

  <rect x="450" y="52" width="130" height="40" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="515" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#9d174d">Tek İsim</text>

  <!-- Alt başlık: Tek Boyutlu -->
  <rect x="230" y="120" width="180" height="36" rx="8" fill="url(#box4)" filter="url(#shadow)" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="320" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#065f46">Tek Boyutlu Dizi</text>

  <!-- Bağlantı çizgisi -->
  <line x1="320" y1="94" x2="320" y2="120" stroke="#64748b" stroke-width="1.8"/>

  <!-- Bildirim sözdizimi kutusu -->
  <rect x="170" y="175" width="300" height="40" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="320" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#92400e">veri-çeşidi dizi-adı [boyut]</text>

  <!-- Ok: Tek Boyutlu -> Bildirim -->
  <line x1="320" y1="156" x2="320" y2="175" stroke="#64748b" stroke-width="1.8"/>

  <!-- Eleman erişimi bölümü -->
  <rect x="60" y="240" width="150" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="135" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3730a3">İndeks ile Erişim</text>
  <text x="135" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4c1d95">0'dan başlar</text>

  <rect x="240" y="240" width="160" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Çok Boyutlu</text>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e40af">İhtiyaca göre</text>

  <rect x="430" y="240" width="150" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="505" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#9d174d">Aynı Tür Değerler</text>
  <text x="505" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#831843">Sadece aynı tür</text>

  <!-- Bağlantı çizgileri -->
  <line x1="320" y1="215" x2="320" y2="240" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 320 215 L 135 240" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <path d="M 320 215 L 505 240" stroke="#64748b" stroke-width="1.5" fill="none"/>

  <!-- Dizi elemanı görselleştirme -->
  <rect x="75" y="130" width="36" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="93" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#475569">[0]</text>

  <rect x="115" y="130" width="36" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="133" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#475569">[1]</text>

  <rect x="155" y="130" width="36" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="173" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#475569">[2]</text>

  <rect x="195" y="130" width="30" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="210" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#475569">...</text>

  <!-- Dizi örneği etiketi -->
  <text x="135" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">dizi[0..n]</text>
</svg>