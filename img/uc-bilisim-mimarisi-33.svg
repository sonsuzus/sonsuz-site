  <path d="M119 137 C119 130 128 130 128 137 C128 144 119 144 119 137 Z" fill="#f4a85d"/>
  <path d="M135 130 L146 130 M135 137 L149 137 M135 144 L146 144" stroke="#d58c4d" stroke-width="2" stroke-linecap="round"/>
  <rect x="106" y="159" width="53" height="30" rx="9" fill="#e7f5e5" filter="url(#smallShadow)"/>
  <circle cx="120" cy="174" r="7" fill="#72b77a"/>
  <path d="M132 169 L148 169 M132 175 L145 175 M132 181 L142 181" stroke="#69a171" stroke-width="2" stroke-linecap="round"/>
