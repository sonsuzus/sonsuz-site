  <text x="289" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#aa6a57">Düşük gecikme</text>

  <rect x="365" y="244" width="144" height="48" rx="15" fill="#edf6e9" stroke="#bddbb7" filter="url(#smallShadow)"/>
  <circle cx="388" cy="268" r="12" fill="#79b875"/>
  <path d="M382 268 L387 273 L396 262" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="443" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#487746">Seçili aktarım</text>
  <text x="443" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#658c62">Azalan yük</text>

  <text x="320" y="313" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66808a">Hibrit mimari · Gizlilik · Hız</text>
</svg>