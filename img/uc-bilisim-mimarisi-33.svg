  <circle cx="356" cy="155" r="3" fill="#e48165"/>
  <circle cx="370" cy="139" r="3" fill="#e48165"/>
  <text x="354.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#326d65">Karar ver</text>

