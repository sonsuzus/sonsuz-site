  <rect x="456" y="83" width="156" height="135" rx="20" fill="#edf1ff" stroke="#c9d4ef" filter="url(#shadow)"/>
  <text x="534" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#465984">Bulut Katmanı</text>
  <path d="M492 159 C483 159 481 148 489 144 C489 134 501 129 510 136 C517 124 537 129 538 142 C549 139 557 146 555 154 C554 160 549 163 542 163 L492 163 C485 163 482 161 482 156" fill="#c5d8f5" stroke="#7798c9" stroke-width="2"/>
  <path d="M500 175 L500 188 M516 175 L516 188 M532 175 L532 188" stroke="#7899c9" stroke-width="3" stroke-linecap="round"/>
  <text x="534" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64749a">Analiz ve arşiv</text>

  <!-- labels over arrows -->
  <rect x="184" y="130" width="39" height="18" rx="8" fill="#ffffff" opacity="0.9"/>
  <text x="203.5" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56766f">Yerel</text>
  <rect x="409" y="130" width="42" height="18" rx="8" fill="#ffffff" opacity="0.9"/>
  <text x="430" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667aa1">%2 veri</text>

  <!-- result cards -->
  <rect x="211" y="244" width="144" height="48" rx="15" fill="#fff0e9" stroke="#f0bea9" filter="url(#smallShadow)"/>
  <circle cx="234" cy="268" r="12" fill="#f29a7e"/>
