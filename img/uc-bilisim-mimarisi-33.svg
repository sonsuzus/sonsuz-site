  <text x="102.5" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">Cihaz Katmanı</text>
  <rect x="45" y="123" width="50" height="66" rx="12" fill="#ffffff" filter="url(#smallShadow)"/>
  <rect x="56" y="134" width="28" height="19" rx="4" fill="#8ab9e6"/>
