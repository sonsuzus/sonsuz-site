<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f5ed"/>
      <stop offset="100%" stop-color="#bce7d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#547080" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#547080" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="69" cy="43" r="54" fill="#d9eafa" opacity="0.45"/>
  <circle cx="580" cy="277" r="72" fill="#dff2d9" opacity="0.45"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365166">Uç Bilişim: Yakında Karar, Seçili Veri Buluta</text>

  <!-- connection lines behind -->
  <path d="M177 150 C204 150 209 150 231 150" fill="none" stroke="#74a6a1" stroke-width="3" stroke-linecap="round"/>
