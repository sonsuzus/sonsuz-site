<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#c1e5f5"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd3b6"/>
      <stop offset="100%" stop-color="#ffe4cc"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcedc1"/>
      <stop offset="100%" stop-color="#e8f5d6"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8b8c8"/>
      <stop offset="100%" stop-color="#fcd5e0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8d8f0"/>
      <stop offset="100%" stop-color="#d0e8fa"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c8f0"/>
      <stop offset="100%" stop-color="#f0d8fa"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">PHP Kontrol Akışı: return ve goto</text>

  <!-- ====== SOL TARAF: return deyimi ====== -->
  <text x="160" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">return Deyimi</text>

  <!-- Fonksiyon kutusu -->
  <rect x="50" y="75" width="220" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#7fb3d0" stroke-width="1.5"/>
  <text x="160" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Fonksiyon</text>
  <text x="160" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">return değer döndürür</text>

  <!-- Ok: fonksiyon -> çağrı -->
  <path d="M 160 130 L 160 150" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <polygon points="155,148 160,158 165,148" fill="#2c3e50"/>

  <!-- Çağrı kutusu -->
  <rect x="50" y="158" width="220" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#d4a373" stroke-width="1.5"/>
  <text x="160" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7b4b2a">Fonksiyon Çağrısı</text>
  <text x="160" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7b4b2a">include() / require()</text>

  <!-- Alt bölüm: global return -->
  <rect x="50" y="225" width="220" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#8a9a5b" stroke-width="1.5"/>
  <text x="160" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3d4d1a">Global return</text>
  <text x="160" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d4d1a">Betik çalışmasını durdurur</text>

  <!-- Ok: çağrı -> global -->
  <path d="M 160 208 L 160 225" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <polygon points="155,223 160,233 165,223" fill="#2c3e50"/>

  <!-- ====== SAĞ TARAF: goto deyimi ====== -->
  <text x="480" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">goto Deyimi</text>

  <!-- goto kutusu -->
  <rect x="370" y="75" width="220" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#c77d9a" stroke-width="1.5"/>
  <text x="480" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6d2a40">goto etiket</text>
  <text x="480" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6d2a40">Kod atlaması yapar</text>

  <!-- Ok: goto -> etiket -->
  <path d="M 480 130 L 480 150" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <polygon points="475,148 480,158 485,148" fill="#2c3e50"/>

  <!-- etiket kutusu -->
  <rect x="370" y="158" width="220" height="50" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#5b8ab5" stroke-width="1.5"/>
  <text x="480" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3d5c">Etiket Noktası</text>
  <text x="480" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a3d5c">Akış o noktadan sürer</text>

  <!-- Alt bölüm: sınırlama -->
  <rect x="370" y="225" width="220" height="50" rx="10" fill="url(#box6)" filter="url(#shadow)" stroke="#9b7bb5" stroke-width="1.5"/>
  <text x="480" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2d5c">Sınırlama</text>
  <text x="480" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a2d5c">Fonksiyon içine atlanamaz</text>

  <!-- Ok: etiket -> sınırlama -->
  <path d="M 480 208 L 480 225" stroke="#2c3e50" stroke-width="2" fill="none"/>
  <polygon points="475,223 480,233 485,223" fill="#2c3e50"/>

  <!-- ====== ORTA BAĞLANTI ====== -->
  <path d="M 270 200 L 370 200" stroke="#7f8c8d" stroke-width="1.8" stroke-dasharray="6,4" fill="none"/>
  <text x="320" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">Akışı değiştirir</text>

  <!-- Alt not -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5d6d7e">return: değer döndürür • goto: etikete atlar</text>
</svg>