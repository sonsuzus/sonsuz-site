<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#d9f5ec"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="100%" stop-color="#f7f0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5d748d" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5d748d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="68" cy="55" r="72" fill="#dff2ff" opacity="0.48"/>
  <circle cx="595" cy="274" r="94" fill="#e4f5d8" opacity="0.42"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516d">Kubernetes: hedef durumdan çalışan Pod'lara</text>

  <!-- Desired state -->
  <g filter="url(#shadow)">
    <rect x="28" y="66" width="136" height="82" rx="18" fill="#ffffff"/>
    <rect x="28" y="66" width="7" height="82" rx="3.5" fill="#8b9df5"/>
  </g>
  <text x="51" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334967">Arzu edilen durum</text>
  <text x="51" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63758a">Deployment</text>
  <g transform="translate(51 124)">
    <rect x="0" y="0" width="16" height="12" rx="4" fill="#cfd8ff"/>
    <rect x="21" y="0" width="16" height="12" rx="4" fill="#cfd8ff"/>
    <rect x="42" y="0" width="16" height="12" rx="4" fill="#cfd8ff"/>
    <text x="68" y="11" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63758a">3 kopya</text>
  </g>

  <!-- arrow -->
  <path d="M165 107 H194" fill="none" stroke="#7188ad" stroke-width="2"/>
  <polygon points="201,107 192,102 192,112" fill="#7188ad"/>

  <!-- Control plane -->
  <g filter="url(#shadow)">
    <rect x="204" y="48" width="224" height="124" rx="22" fill="url(#control)" stroke="#c3dcec"/>
  </g>
  <text x="226" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31576e">Kontrol Düzlemi</text>
  <text x="226" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617a87">Sürekli uzlaştırma</text>

  <g filter="url(#softShadow)">
    <rect x="225" y="108" width="78" height="42" rx="11" fill="#ffffff"/>
    <rect x="313" y="108" width="93" height="42" rx="11" fill="#ffffff"/>
  </g>
  <text x="242" y="133" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#46637b">API Sunucusu</text>
  <text x="326" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#46637b">Zamanlayıcı</text>
  <text x="324" y="141" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#738999">ve Denetleyici</text>

  <!-- Etcd -->
  <g filter="url(#softShadow)">
    <rect x="274" y="182" width="84" height="34" rx="12" fill="#fff5d9"/>
  </g>
  <ellipse cx="290" cy="194" rx="8" ry="3.5" fill="#eec977"/>
  <path d="M282 194 V203 C282 208 298 208 298 203 V194" fill="#f8dfa0" stroke="#e3bd67" stroke-width="1"/>
  <ellipse cx="290" cy="203" rx="8" ry="3.5" fill="#f8dfa0" stroke="#e3bd67" stroke-width="1"/>
  <text x="308" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#755a28">etcd durum kaydı</text>

  <path d="M316 172 V179" fill="none" stroke="#738da1" stroke-width="2"/>
  <polygon points="316,184 311,176 321,176" fill="#738da1"/>

  <!-- scheduling arrows -->
  <path d="M428 110 C454 110 456 91 474 91" fill="none" stroke="#6d8da8" stroke-width="2"/>
  <polygon points="480,91 471,86 471,96" fill="#6d8da8"/>
  <path d="M428 133 C451 133 454 229 474 229" fill="none" stroke="#6d8da8" stroke-width="2"/>
  <polygon points="480,229 471,224 471,234" fill="#6d8da8"/>

  <!-- cluster -->
  <text x="482" y="52" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#496476">Çalışan Düğümler</text>

  <!-- Node 1 -->
  <g filter="url(#shadow)">
    <rect x="480" y="64" width="132" height="88" rx="18" fill="url(#node)" stroke="#e6d9ee"/>
  </g>
  <rect x="495" y="78" width="46" height="19" rx="7" fill="#d8f0e4"/>
  <text x="504" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45745f">Düğüm A</text>
  <text x="552" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72818f">kubelet</text>
  <g transform="translate(495 108)">
    <rect x="0" y="0" width="46" height="29" rx="8" fill="#cddcff"/>
    <rect x="53" y="0" width="46" height="29" rx="8" fill="#cddcff"/>
    <text x="11" y="19" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#405a91">Pod</text>
    <text x="64" y="19" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#405a91">Pod</text>
  </g>

  <!-- Node 2 -->
  <g filter="url(#shadow)">
    <rect x="480" y="202" width="132" height="88" rx="18" fill="url(#node)" stroke="#e6d9ee"/>
  </g>
  <rect x="495" y="216" width="46" height="19" rx="7" fill="#d8f0e4"/>
  <text x="504" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45745f">Düğüm B</text>
  <text x="552" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72818f">kubelet</text>
  <g transform="translate(495 246)">
    <rect x="0" y="0" width="46" height="29" rx="8" fill="#cddcff"/>
    <rect x="53" y="0" width="46" height="29" rx="8" fill="#cddcff"/>
    <text x="11" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#405a91">Pod</text>
    <text x="64" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#405a91">Pod</text>
  </g>

  <!-- Feedback loop -->
  <path d="M480 278 C443 303 233 304 151 213 C127 187 121 170 121 157" fill="none" stroke="#91ae82" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="121,150 116,159 126,159" fill="#91ae82"/>
  <g filter="url(#softShadow)">
    <rect x="180" y="258" width="164" height="29" rx="13" fill="#edf7e9"/>
  </g>
  <text x="199" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52734b">İzle • karşılaştır • düzelt</text>

  <!-- pod callout -->
  <g filter="url(#softShadow)">
    <rect x="30" y="221" width="130" height="60" rx="16" fill="#ffffff"/>
  </g>
  <text x="47" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f6177">Pod</text>
  <rect x="79" y="231" width="28" height="17" rx="5" fill="#ffd8c8"/>
  <rect x="111" y="231" width="28" height="17" rx="5" fill="#d8e5ff"/>
  <text x="47" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728294">Paylaşılan ağ ve volume</text>
</svg>