    <text x="533" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7e97">203.0.113.10</text>

    <rect x="479" y="132" width="132" height="65" rx="15" fill="#ffffff" stroke="#c8dfd2"/>
    <rect x="494" y="146" width="26" height="35" rx="6" fill="#d8f0df"/>
    <path d="M500 156 H514 M500 165 H514 M500 174 H514" stroke="#639b76" stroke-width="2" stroke-linecap="round"/>
    <text x="533" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355675">Singapur</text>
    <text x="533" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7e97">203.0.113.10</text>

    <rect x="479" y="206" width="132" height="65" rx="15" fill="#ffffff" stroke="#ddd3ed"/>
    <rect x="494" y="220" width="26" height="35" rx="6" fill="#e8e0fa"/>
    <path d="M500 230 H514 M500 239 H514 M500 248 H514" stroke="#8d77bc" stroke-width="2" stroke-linecap="round"/>
    <text x="533" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355675">New York</text>
    <text x="533" y="249" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7e97">203.0.113.10</text>
