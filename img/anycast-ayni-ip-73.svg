    <text x="76" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71889a">Kullanıcı</text>

    <rect x="30" y="193" width="119" height="54" rx="16" fill="#ffffff" stroke="#c7dced"/>
    <circle cx="55" cy="220" r="12" fill="#ccebd5"/>
    <circle cx="55" cy="216" r="4" fill="#5b9970"/>
    <path d="M47 229 Q55 222 63 229" fill="none" stroke="#5b9970" stroke-width="2" stroke-linecap="round"/>
    <text x="76" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365673">Tokyo</text>
    <text x="76" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71889a">Kullanıcı</text>
  </g>

  <!-- incoming paths -->
  <path d="M149 103 C180 103 184 130 221 139" fill="none" stroke="#78aee0" stroke-width="3" stroke-linecap="round"/>
  <polygon points="220,134 232,142 218,146" fill="#78aee0"/>
  <path d="M149 220 C181 220 190 190 222 181" fill="none" stroke="#72b992" stroke-width="3" stroke-linecap="round"/>
  <polygon points="219,175 233,179 222,187" fill="#72b992"/>

  <!-- central BGP -->
  <g filter="url(#shadow)">
    <rect x="230" y="103" width="179" height="117" rx="27" fill="url(#hub)" stroke="#aacbe1" stroke-width="1.4"/>
    <path d="M273 146 C290 128 322 128 337 146 C352 133 379 144 379 164 C379 181 364 190 348 190 L281 190 C262 190 251 177 255 162 C258 153 264 148 273 146Z" fill="#ffffff" opacity="0.84"/>
    <path d="M274 174 L294 153 L311 169 L330 143 L349 163" fill="none" stroke="#6299c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="274" cy="174" r="3.5" fill="#6299c7"/>
    <circle cx="294" cy="153" r="3.5" fill="#6299c7"/>
    <circle cx="311" cy="169" r="3.5" fill="#6299c7"/>
