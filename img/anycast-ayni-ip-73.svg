<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d4f2e4"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#66809a" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#66809a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="97" cy="58" r="80" fill="#d9ecff" opacity="0.36"/>
  <circle cx="575" cy="275" r="106" fill="#d9f2df" opacity="0.38"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38526d">ANYCAST YÖNLENDİRME</text>
  <text x="498" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668095">Tek IP · Çok nokta</text>

  <!-- users -->
  <g filter="url(#soft)">
    <rect x="30" y="76" width="119" height="54" rx="16" fill="#ffffff" stroke="#c7dced"/>
    <circle cx="55" cy="103" r="12" fill="#bddcff"/>
    <circle cx="55" cy="99" r="4" fill="#5d8fbd"/>
