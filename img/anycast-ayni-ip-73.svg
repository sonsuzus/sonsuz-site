  <!-- bottom explanation chips -->
  <g filter="url(#soft)">
    <rect x="61" y="276" width="148" height="28" rx="14" fill="#ffffff" stroke="#d3e2eb"/>
    <circle cx="79" cy="290" r="5" fill="#73aee1"/>
    <text x="91" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6e87">Ağ yakınlığı seçilir</text>
    <rect x="225" y="276" width="176" height="28" rx="14" fill="#ffffff" stroke="#d3e2eb"/>
    <circle cx="243" cy="290" r="5" fill="#79ba95"/>
    <text x="255" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6e87">Arızada rota çekilir</text>
