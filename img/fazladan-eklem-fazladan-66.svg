<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8eaff"/>
      <stop offset="100%" stop-color="#c5dcfa"/>
    </linearGradient>
    <linearGradient id="nullGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e3"/>
      <stop offset="100%" stop-color="#bde5cf"/>
    </linearGradient>
    <linearGradient id="robotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667da6"/>
      <stop offset="100%" stop-color="#405779"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="88" cy="43" r="68" fill="#dceeff" opacity="0.45"/>
  <circle cx="584" cy="276" r="100" fill="#dff3e2" opacity="0.45"/>

  <text x="30" y="35" fill="#334155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">ARTIKLIKLI ROBOT KOL</text>
  <text x="30" y="53" fill="#64748b" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Hedef korunur, eklemler engelden kaçar</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="32" y="112" width="110" height="72" rx="17" fill="#fffdf8"/>
    <rect x="32" y="112" width="110" height="72" rx="17" fill="none" stroke="#e7d8b7"/>
  </g>
  <circle cx="58" cy="140" r="13" fill="#ffe6a7"/>
  <path d="M52 140 L57 145 L65 134" fill="none" stroke="#9a6a18" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="79" y="137" fill="#475569" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Hedef</text>
  <text x="79" y="154" fill="#64748b" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">uç nokta</text>

  <!-- connector input to controller -->
  <path d="M143 148 H180" fill="none" stroke="#8ca1b8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="180,148 172,143 172,153" fill="#8ca1b8"/>

  <!-- Core controller -->
  <g filter="url(#shadow)">
    <rect x="184" y="87" width="176" height="124" rx="20" fill="#ffffff"/>
    <rect x="184" y="87" width="176" height="124" rx="20" fill="none" stroke="#d9e4ed"/>
  </g>
  <text x="272" y="116" text-anchor="middle" fill="#334155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Jacobian Denetimi</text>
  <line x1="205" y1="128" x2="339" y2="128" stroke="#e2e8f0"/>
  <g filter="url(#softShadow)">
    <rect x="204" y="142" width="136" height="25" rx="11" fill="url(#mainGrad)"/>
  </g>
  <text x="272" y="159" text-anchor="middle" fill="#285274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Ana görev: J⁺ẋ</text>
  <g filter="url(#softShadow)">
    <rect x="204" y="174" width="136" height="25" rx="11" fill="url(#nullGrad)"/>
  </g>
  <text x="272" y="191" text-anchor="middle" fill="#246044" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Sıfır uzayı: (I−J⁺J)z</text>

  <!-- outbound split -->
  <path d="M361 150 H395 V108 H423" fill="none" stroke="#6d97bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="423,108 415,103 415,113" fill="#6d97bf"/>
  <path d="M361 181 H395 V219 H423" fill="none" stroke="#61a77d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="423,219 415,214 415,224" fill="#61a77d"/>

  <!-- Main task box -->
  <g filter="url(#shadow)">
    <rect x="428" y="76" width="178" height="64" rx="17" fill="#edf6ff"/>
    <rect x="428" y="76" width="178" height="64" rx="17" fill="none" stroke="#c9def1"/>
  </g>
  <circle cx="454" cy="108" r="14" fill="#a9cef1"/>
  <path d="M448 109 H459 M456 105 L460 109 L456 113" fill="none" stroke="#315d83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="478" y="105" fill="#315d83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Ana hareket</text>
  <text x="478" y="122" fill="#56728d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">hedefe ilerle</text>

  <!-- secondary box -->
  <g filter="url(#shadow)">
    <rect x="428" y="187" width="178" height="64" rx="17" fill="#edf9f1"/>
    <rect x="428" y="187" width="178" height="64" rx="17" fill="none" stroke="#c7e7d2"/>
  </g>
  <circle cx="454" cy="219" r="14" fill="#aee1c0"/>
  <path d="M450 224 C444 218 447 210 454 208 C461 210 464 218 458 224" fill="none" stroke="#28704a" stroke-width="2" stroke-linecap="round"/>
  <text x="478" y="216" fill="#286143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">İkincil hareket</text>
  <text x="478" y="233" fill="#527765" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">engel kaçınma</text>

  <!-- arrows toward arm -->
  <path d="M516 141 V159" fill="none" stroke="#93a4b7" stroke-width="2" stroke-linecap="round"/>
  <polygon points="516,167 511,158 521,158" fill="#93a4b7"/>
  <path d="M516 186 V169" fill="none" stroke="#93a4b7" stroke-width="2" stroke-linecap="round"/>
  <polygon points="516,161 511,170 521,170" fill="#93a4b7"/>

  <!-- robot illustration -->
  <g filter="url(#shadow)">
    <rect x="455" y="267" width="126" height="25" rx="12" fill="#d5dde8"/>
  </g>
  <path d="M477 267 L477 248 L509 218 L547 172" fill="none" stroke="#465f83" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M477 267 L477 248 L509 218 L547 172" fill="none" stroke="url(#robotGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="477" cy="248" r="10" fill="#eef5fb" stroke="#405779" stroke-width="4"/>
  <circle cx="509" cy="218" r="10" fill="#eef5fb" stroke="#405779" stroke-width="4"/>
  <circle cx="547" cy="172" r="8" fill="#ffe3a1" stroke="#a46d16" stroke-width="3"/>
  <path d="M551 168 L563 159 M551 176 L563 184" stroke="#405779" stroke-width="4" stroke-linecap="round"/>
  <text x="519" y="309" text-anchor="middle" fill="#475569" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">7 eklemli kol</text>

  <!-- obstacle and avoidance field -->
  <circle cx="414" cy="260" r="27" fill="#f8b8ae" opacity="0.22"/>
  <circle cx="414" cy="260" r="18" fill="#f49c91" filter="url(#softShadow)"/>
  <path d="M406 252 L422 268 M422 252 L406 268" stroke="#a94740" stroke-width="2.4" stroke-linecap="round"/>
  <text x="414" y="292" text-anchor="middle" fill="#9b4a45" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Engel</text>

  <!-- avoidance curved direction -->
  <path d="M486 228 C468 244 454 250 442 253" fill="none" stroke="#57a875" stroke-width="2.3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <polygon points="436,255 444,248 445,258" fill="#57a875"/>
  <text x="379" y="225" fill="#43875d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">−∇H(q)</text>

  <!-- target end indicator -->
  <circle cx="583" cy="145" r="16" fill="none" stroke="#d7a942" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="583" cy="145" r="4" fill="#efb743"/>
  <path d="M558 170 C570 161 576 154 580 150" fill="none" stroke="#8ca1b8" stroke-width="1.8" stroke-dasharray="4 3"/>
</svg>