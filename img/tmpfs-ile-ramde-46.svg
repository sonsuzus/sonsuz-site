<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8e6cf"/>
      <stop offset="100%" stop-color="#d4edda"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd3b6"/>
      <stop offset="100%" stop-color="#ffe8d6"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b5d8ff"/>
      <stop offset="100%" stop-color="#d0e8ff"/>
    </linearGradient>
    <linearGradient id="init" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c3b1e1"/>
      <stop offset="100%" stop-color="#d9c9f0"/>
    </linearGradient>
    <linearGradient id="rootfs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7b7c3"/>
      <stop offset="100%" stop-color="#fcd5ce"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">tmpfs ile RAM'de Yaşayan Mini Linux</text>

  <!-- Disk bölümü (kalıcı) -->
  <rect x="30" y="55" width="130" height="50" rx="10" fill="url(#disk)" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a3e2b">Disk / USB</text>
  <text x="95" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a3e2b">Kernel + initramfs</text>

  <!-- Bootloader oku -->
  <path d="M160 80 L200 80" stroke="#5a3e2b" stroke-width="2" fill="none"/>
  <polygon points="200,75 212,80 200,85" fill="#5a3e2b"/>

  <!-- Çekirdek -->
  <rect x="215" y="55" width="120" height="50" rx="10" fill="url(#kernel)" filter="url(#shadow)" opacity="0.9"/>
  <text x="275" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">Linux Çekirdek</text>
  <text x="275" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a3a5c">Boot aşaması</text>

  <!-- Çekirdek -> initramfs oku -->
  <path d="M335 80 L375 80" stroke="#1a3a5c" stroke-width="2" fill="none"/>
  <polygon points="375,75 387,80 375,85" fill="#1a3a5c"/>

  <!-- initramfs -->
  <rect x="390" y="55" width="130" height="50" rx="10" fill="url(#init)" filter="url(#shadow)" opacity="0.9"/>
  <text x="455" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3d2b5c">initramfs</text>
  <text x="455" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d2b5c">init betiği çalışır</text>

  <!-- initramfs -> tmpfs oku -->
  <path d="M520 80 L560 80" stroke="#3d2b5c" stroke-width="2" fill="none"/>
  <polygon points="560,75 572,80 560,85" fill="#3d2b5c"/>

  <!-- tmpfs / RAM -->
  <rect x="240" y="145" width="180" height="70" rx="12" fill="url(#ram)" filter="url(#shadow)" opacity="0.95"/>
  <text x="330" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a5c3a">tmpfs (RAM)</text>
  <text x="330" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a5c3a">Geçici kök dosya sistemi</text>
  <text x="330" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a5c3a">Güç kesilince sıfırlanır</text>

  <!-- rootfs kopyalama oku (initramfs -> tmpfs) -->
  <path d="M455 105 L380 145" stroke="#3d2b5c" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <polygon points="380,140 370,150 385,148" fill="#3d2b5c"/>
  <text x="430" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d2b5c">rootfs aç</text>

  <!-- switch_root oku -->
  <path d="M330 145 L330 120" stroke="#1a5c3a" stroke-width="2" fill="none"/>
  <polygon points="325,120 330,110 335,120" fill="#1a5c3a"/>
  <text x="310" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a5c3a">switch_root</text>

  <!-- Kalıcılık yok uyarısı -->
  <rect x="470" y="145" width="140" height="70" rx="10" fill="#ffe0e0" filter="url(#shadow)" opacity="0.85"/>
  <text x="540" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8b0000">Kalıcılık Yok</text>
  <text x="540" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8b0000">Log, ayar, dosya</text>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8b0000">kaydedilmez</text>

  <!-- Kullanım alanları -->
  <rect x="30" y="250" width="580" height="55" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.7"/>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Kullanım Alanları</text>
  <text x="120" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Kiosk</text>
  <text x="280" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Güvenli oturum</text>
  <text x="440" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Laboratuvar</text>
  <text x="580" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Test ortamı</text>

  <!-- Bağlantı çizgileri -->
  <line x1="120" y1="250" x2="120" y2="240" stroke="#2c3e50" stroke-width="1" opacity="0.3"/>
  <line x1="280" y1="250" x2="280" y2="240" stroke="#2c3e50" stroke-width="1" opacity="0.3"/>
  <line x1="440" y1="250" x2="440" y2="240" stroke="#2c3e50" stroke-width="1" opacity="0.3"/>
  <line x1="580" y1="250" x2="580" y2="240" stroke="#2c3e50" stroke-width="1" opacity="0.3"/>
</svg>