<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="queue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#c9dcfa"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0c9"/>
      <stop offset="100%" stop-color="#ffe0a3"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e2"/>
      <stop offset="100%" stop-color="#bee8ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="51" cy="61" r="72" fill="#dcefff" opacity="0.42"/>
  <circle cx="600" cy="279" r="92" fill="#dcf3dd" opacity="0.44"/>

  <text x="32" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38506b">KESİNTİYE DAYANIKLI SPOT HESAPLAMA</text>
  <text x="32" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708298">Kuyruk tabanlı, yeniden denemeli akış</text>

  <!-- left task source -->
  <g filter="url(#shadow)">
    <rect x="32" y="112" width="112" height="88" rx="18" fill="#ffffff"/>
    <rect x="43" y="125" width="36" height="31" rx="8" fill="#e5f1ff"/>
    <path d="M51 137h20M51 144h14M51 151h17" stroke="#5d8fbd" stroke-width="2" stroke-linecap="round"/>
    <text x="91" y="142" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#38506b">Görevler</text>
    <text x="91" y="163" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#718296">bağımsız iş</text>
    <rect x="44" y="173" width="88" height="12" rx="6" fill="#edf4fa"/>
    <rect x="44" y="173" width="53" height="12" rx="6" fill="#9bc8ef"/>
  </g>

  <!-- arrow left to queue -->
  <path d="M147 156 H178" fill="none" stroke="#6d9ec5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="178,156 169,151 169,161" fill="#6d9ec5"/>

  <!-- Queue -->
  <g filter="url(#shadow)">
    <rect x="181" y="92" width="132" height="128" rx="20" fill="url(#queue)"/>
    <text x="247" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#315777">Mesaj Kuyruğu</text>
    <rect x="203" y="133" width="88" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
    <rect x="203" y="153" width="70" height="14" rx="7" fill="#ffffff" opacity="0.78"/>
    <rect x="203" y="173" width="81" height="14" rx="7" fill="#ffffff" opacity="0.66"/>
    <circle cx="288" cy="140" r="4" fill="#71b68e"/>
    <text x="247" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#56718b">yeniden deneme</text>
  </g>

  <!-- branching lines -->
  <path d="M316 144 H341 V108 H362" fill="none" stroke="#6c99b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="362,108 353,103 353,113" fill="#6c99b5"/>
  <path d="M316 168 H341 V218 H362" fill="none" stroke="#6c99b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="362,218 353,213 353,223" fill="#6c99b5"/>

  <!-- upper spot worker -->
  <g filter="url(#shadow)">
    <rect x="366" y="66" width="136" height="84" rx="18" fill="url(#spot)"/>
    <rect x="380" y="80" width="30" height="25" rx="7" fill="#fff9e9"/>
    <path d="M387 87h16M387 94h11" stroke="#bc8737" stroke-width="2" stroke-linecap="round"/>
    <text x="455" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#76511f">Spot Worker</text>
    <text x="455" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#8f6b39">işle</text>
    <rect x="381" y="124" width="106" height="10" rx="5" fill="#f3c96d"/>
  </g>

  <!-- lower spot worker -->
  <g filter="url(#shadow)">
    <rect x="366" y="176" width="136" height="84" rx="18" fill="url(#spot)"/>
    <rect x="380" y="190" width="30" height="25" rx="7" fill="#fff9e9"/>
    <path d="M387 197h16M387 204h11" stroke="#bc8737" stroke-width="2" stroke-linecap="round"/>
    <text x="455" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#76511f">Spot Worker</text>
    <text x="455" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#8f6b39">işle</text>
    <rect x="381" y="234" width="75" height="10" rx="5" fill="#f3c96d"/>
  </g>

  <!-- interruption sign -->
  <g filter="url(#softShadow)">
    <circle cx="522" cy="91" r="22" fill="#fff4f2"/>
    <path d="M522 77 L527 88 L539 89 L530 97 L533 109 L522 103 L511 109 L514 97 L505 89 L517 88 Z" fill="#ef8b7d"/>
    <text x="522" y="95" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">!</text>
  </g>
  <path d="M510 106 C499 119 497 126 490 132" fill="none" stroke="#e58b7d" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="539" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b3675c">Kesinti</text>

  <!-- checkpoint to storage -->
  <path d="M505 218 H526 V187 H542" fill="none" stroke="#6aab87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="542,187 533,182 533,192" fill="#6aab87"/>

  <!-- durable storage -->
  <g filter="url(#shadow)">
    <rect x="545" y="126" width="72" height="122" rx="18" fill="url(#safe)"/>
    <ellipse cx="581" cy="151" rx="22" ry="8" fill="#f6fffa"/>
    <path d="M559 151v45c0 5 10 9 22 9s22-4 22-9v-45" fill="#e9faef" stroke="#72ad8a" stroke-width="1.5"/>
    <path d="M559 173c0 5 10 9 22 9s22-4 22-9M559 195c0 5 10 9 22 9s22-4 22-9" fill="none" stroke="#72ad8a" stroke-width="1.5"/>
    <text x="581" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#3f7657">Kalıcı</text>
    <text x="581" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#3f7657">depo</text>
  </g>

  <!-- return retry curve -->
  <path d="M430 263 C430 294 260 294 247 225" fill="none" stroke="#7e95aa" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
  <polygon points="247,225 242,234 252,232" fill="#7e95aa"/>
  <text x="332" y="302" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#64798e">kesilirse görev tekrar kuyruğa döner</text>

  <!-- checkpoint badge -->
  <g filter="url(#softShadow)">
    <rect x="510" y="166" width="78" height="26" rx="13" fill="#ffffff"/>
    <circle cx="525" cy="179" r="6" fill="#7fc59b"/>
    <path d="M522 179l2 2 4-5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="557" y="183" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#4b765c">Kontrol</text>
  </g>
</svg>