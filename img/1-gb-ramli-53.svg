<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="ramGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#bfdafa"/>
    </linearGradient>
    <linearGradient id="swapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4df"/>
      <stop offset="1" stop-color="#bce7c6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#54718b" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#54718b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="162" r="111" fill="#dceef2" opacity="0.32"/>
  <circle cx="320" cy="162" r="86" fill="#ffffff" opacity="0.38"/>

  <!-- Bağlantılar -->
  <path d="M235 140 C204 140 194 125 181 116" fill="none" stroke="#8ba4b7" stroke-width="2"/>
  <polygon points="180,110 169,116 181,122" fill="#8ba4b7"/>
  <path d="M405 140 C434 140 445 124 458 116" fill="none" stroke="#8ba4b7" stroke-width="2"/>
  <polygon points="459,110 470,116 458,122" fill="#8ba4b7"/>
  <path d="M319 204 L319 230" fill="none" stroke="#6d9b80" stroke-width="2.5"/>
  <polygon points="313,229 319,240 325,229" fill="#6d9b80"/>
  <path d="M230 266 C194 266 183 246 170 232" fill="none" stroke="#98a7ad" stroke-width="2"/>
  <polygon points="168,226 160,237 173,235" fill="#98a7ad"/>
  <path d="M410 266 C445 266 457 246 470 232" fill="none" stroke="#98a7ad" stroke-width="2"/>
  <polygon points="467,235 480,237 472,226" fill="#98a7ad"/>

  <!-- Sol üst: Servisler -->
  <g filter="url(#softShadow)">
    <rect x="40" y="70" width="130" height="92" rx="17" fill="#fff5df"/>
    <rect x="52" y="83" width="27" height="27" rx="8" fill="#f5ca78"/>
    <path d="M59 91 h13 M59 97 h13 M59 103 h8" stroke="#8f6423" stroke-width="2" stroke-linecap="round"/>
    <text x="89" y="96" fill="#5f6470" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">İş Yükü</text>
    <text x="89" y="114" fill="#7e848b" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Web • Veri • Docker</text>
    <rect x="52" y="128" width="105" height="8" rx="4" fill="#f5d89e"/>
    <rect x="52" y="128" width="82" height="8" rx="4" fill="#e9aa44"/>
    <text x="52" y="151" fill="#9c752f" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Bellek baskısı</text>
  </g>

  <!-- Sağ üst: OOM -->
  <g filter="url(#softShadow)">
    <rect x="470" y="70" width="130" height="92" rx="17" fill="#ffe9e9"/>
    <circle cx="494" cy="97" r="14" fill="#f6a9a9"/>
    <path d="M494 88 v11 M494 104 v1" stroke="#8b3e46" stroke-width="2.5" stroke-linecap="round"/>
    <text x="518" y="96" fill="#6e555a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">RAM Dolarsa</text>
    <text x="518" y="114" fill="#897277" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">OOM riski</text>
    <rect x="482" y="129" width="104" height="16" rx="8" fill="#fbd0d0"/>
    <text x="501" y="141" fill="#9a4e55" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Süreç sonlanır</text>
  </g>

  <!-- Merkez RAM -->
  <g filter="url(#shadow)">
    <rect x="235" y="92" width="170" height="112" rx="22" fill="url(#ramGrad)" stroke="#a7c6e7" stroke-width="1.5"/>
    <rect x="251" y="108" width="41" height="41" rx="12" fill="#ffffff" opacity="0.72"/>
    <path d="M261 121 h21 M261 128 h21 M265 135 h13" stroke="#5e87af" stroke-width="2.3" stroke-linecap="round"/>
    <text x="306" y="124" fill="#416d97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">RAM</text>
    <text x="306" y="142" fill="#5d7d9d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">1 GB</text>
    <rect x="251" y="164" width="138" height="12" rx="6" fill="#ffffff" opacity="0.72"/>
    <rect x="251" y="164" width="110" height="12" rx="6" fill="#659dd3"/>
    <text x="251" y="192" fill="#587b9d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Aktif sayfalar</text>
  </g>

  <!-- Alt merkez swap -->
  <g filter="url(#shadow)">
    <rect x="230" y="240" width="180" height="62" rx="18" fill="url(#swapGrad)" stroke="#9acdad" stroke-width="1.5"/>
    <ellipse cx="258" cy="259" rx="15" ry="6" fill="#70af82"/>
    <path d="M243 259 v17 c0 4 30 4 30 0 v-17 M243 267 c0 4 30 4 30 0" fill="none" stroke="#4f8a62" stroke-width="1.6"/>
    <text x="288" y="265" fill="#397352" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Swap Alanı</text>
    <text x="288" y="284" fill="#578168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">1–2 GB güvenlik ağı</text>
  </g>

  <!-- Alt sol yapılandırma -->
  <g filter="url(#softShadow)">
    <rect x="40" y="190" width="120" height="84" rx="17" fill="#eeeaff"/>
    <circle cx="63" cy="214" r="13" fill="#c6b8f4"/>
    <path d="M63 205 v18 M54 214 h18 M57 208 l12 12 M69 208 l-12 12" stroke="#67529e" stroke-width="1.6" stroke-linecap="round"/>
    <text x="84" y="213" fill="#62557b" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Ayarla</text>
    <text x="52" y="242" fill="#766a91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">swappiness 10</text>
    <text x="52" y="260" fill="#766a91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">fstab kalıcı</text>
  </g>

  <!-- Alt sağ izleme -->
  <g filter="url(#softShadow)">
    <rect x="480" y="190" width="120" height="84" rx="17" fill="#e4f5f3"/>
    <rect x="497" y="205" width="25" height="22" rx="5" fill="#a9ddd7"/>
    <path d="M501 222 l5-7 5 4 7-10" fill="none" stroke="#36837c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="535" y="215" fill="#4f7471" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">İzle</text>
    <text x="492" y="245" fill="#5d8581" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">free • vmstat</text>
    <text x="492" y="262" fill="#5d8581" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">si / so kontrolü</text>
  </g>

  <text x="320" y="33" text-anchor="middle" fill="#476677" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">1 GB Linux Sunucuda Bellek Dengesi</text>
</svg>