<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="commitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5edff"/>
      <stop offset="100%" stop-color="#d7e4fb"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4f8ef"/>
      <stop offset="100%" stop-color="#ccebdc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#60768a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#60768a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="60" cy="32" r="52" fill="#dceefe" opacity="0.5"/>
  <circle cx="590" cy="290" r="72" fill="#dbf3df" opacity="0.48"/>

  <text x="28" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38506a">OTOMATİK SÜRÜM YÖNETİMİ</text>
  <text x="28" y="50" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718397">Commit mesajından yayına</text>

  <!-- Commit source -->
  <g filter="url(#shadow)">
    <rect x="28" y="82" width="156" height="170" rx="18" fill="url(#commitGrad)" stroke="#bed0eb"/>
  </g>
  <text x="50" y="111" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345276">Git Geçmişi</text>
  <line x1="49" y1="120" x2="162" y2="120" stroke="#b5c7df"/>

  <g filter="url(#smallShadow)">
    <rect x="45" y="134" width="121" height="28" rx="8" fill="#ffffff"/>
    <rect x="45" y="171" width="121" height="28" rx="8" fill="#ffffff"/>
    <rect x="45" y="208" width="121" height="28" rx="8" fill="#ffffff"/>
  </g>
  <rect x="53" y="142" width="28" height="12" rx="5" fill="#8caeff"/>
  <text x="89" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38506a">feat(uyg)</text>
  <rect x="53" y="179" width="23" height="12" rx="5" fill="#72cba7"/>
  <text x="84" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38506a">fix(api)</text>
  <rect x="53" y="216" width="54" height="12" rx="5" fill="#f0a5aa"/>
  <text x="114" y="227" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38506a">feat!</text>

  <!-- Arrow 1 -->
  <path d="M190 167 L221 167" fill="none" stroke="#7893ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="225,167 216,162 216,172" fill="#7893ad"/>

  <!-- Engine -->
  <g filter="url(#shadow)">
    <rect x="230" y="105" width="177" height="128" rx="22" fill="url(#engineGrad)" stroke="#b4dec8"/>
  </g>
  <circle cx="318" cy="145" r="25" fill="#ffffff" stroke="#a9d4bd" stroke-width="2"/>
  <path d="M305 145 L314 154 L332 135" fill="none" stroke="#4c9b73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="263" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286347">Sürüm Analizi</text>
  <text x="256" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#517968">lint • tür • etki</text>

  <!-- branch arrows -->
  <path d="M413 157 C430 157 426 84 442 84" fill="none" stroke="#7893ad" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="446,84 437,79 438,89" fill="#7893ad"/>
  <path d="M413 169 L442 169" fill="none" stroke="#7893ad" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="446,169 437,164 437,174" fill="#7893ad"/>
  <path d="M413 181 C430 181 426 254 442 254" fill="none" stroke="#7893ad" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="446,254 437,249 438,259" fill="#7893ad"/>

  <!-- Version impacts -->
  <g filter="url(#smallShadow)">
    <rect x="450" y="57" width="151" height="55" rx="14" fill="#fde4e5" stroke="#f3c7ca"/>
    <rect x="450" y="142" width="151" height="55" rx="14" fill="#e4edff" stroke="#c8d7f4"/>
    <rect x="450" y="227" width="151" height="55" rx="14" fill="#e1f5e9" stroke="#bce3cb"/>
  </g>

  <circle cx="474" cy="84" r="12" fill="#ef949c"/>
  <text x="470" y="88" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">!</text>
  <text x="496" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#91454d">MAJOR</text>
  <text x="496" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9e6970">kırıcı değişim</text>

  <circle cx="474" cy="169" r="12" fill="#89aafa"/>
  <path d="M468 169 L480 169 M474 163 L474 175" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="496" y="165" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4868aa">MINOR</text>
  <text x="496" y="183" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647aa8">yeni özellik</text>

  <circle cx="474" cy="254" r="12" fill="#72c69d"/>
  <path d="M469 254 L472 257 L479 250" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="496" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397854">PATCH</text>
  <text x="496" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d896e">hata düzeltme</text>

  <!-- bottom release rail -->
  <path d="M104 276 L104 294 L535 294" fill="none" stroke="#b0c4d0" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M535 294 L550 294" fill="none" stroke="#7893ad" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="554,294 545,289 545,299" fill="#7893ad"/>
  <g filter="url(#smallShadow)">
    <rect x="460" y="285" width="144" height="27" rx="10" fill="#ffffff" stroke="#d5e2de"/>
  </g>
  <text x="477" y="303" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#456477">Yayın • Etiket • Notlar</text>
</svg>