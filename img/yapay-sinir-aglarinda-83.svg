<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#dcefe0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7d91a6" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#71879b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="45" r="50" fill="#d9eff3" opacity="0.36"/>
  <circle cx="585" cy="275" r="72" fill="#dfe9ff" opacity="0.42"/>
  <path d="M30 261 C128 232 164 285 254 264 S423 226 607 252" fill="none" stroke="#b9d9d3" stroke-width="2" opacity="0.46"/>

  <!-- Girdi -->
  <g filter="url(#shadow)">
    <rect x="24" y="123" width="112" height="74" rx="18" fill="#ffffff"/>
    <rect x="33" y="132" width="94" height="9" rx="4.5" fill="#d8ecff"/>
    <circle cx="53" cy="163" r="10" fill="#91c9ed"/>
    <circle cx="80" cy="163" r="10" fill="#a8d8c5"/>
    <circle cx="107" cy="163" r="10" fill="#b6bdec"/>
    <text x="80" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40566a">Girdi vektörü</text>
  </g>

  <!-- arrow to linear -->
  <path d="M136 160 H168" fill="none" stroke="#7d9bae" stroke-width="2.5"/>
  <polygon points="168,160 160,155 160,165" fill="#7d9bae"/>

  <!-- Linear -->
  <g filter="url(#shadow)">
    <rect x="174" y="105" width="130" height="109" rx="21" fill="url(#core)"/>
    <rect x="189" y="120" width="100" height="29" rx="10" fill="#ffffff" opacity="0.84"/>
    <text x="239" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#35516a">Doğrusal katman</text>
    <path d="M197 176 H279" stroke="#89aac2" stroke-width="2" opacity="0.7"/>
    <path d="M197 190 H262" stroke="#89aac2" stroke-width="2" opacity="0.7"/>
    <text x="239" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486477">z = Wx + b</text>
  </g>

  <!-- arrows outbound -->
  <path d="M304 141 C326 141 330 68 350 68" fill="none" stroke="#849bad" stroke-width="2.5"/>
  <polygon points="350,68 342,63 343,73" fill="#849bad"/>
  <path d="M304 160 H350" fill="none" stroke="#849bad" stroke-width="2.5"/>
  <polygon points="350,160 342,155 342,165" fill="#849bad"/>
  <path d="M304 180 C326 180 330 252 350 252" fill="none" stroke="#849bad" stroke-width="2.5"/>
  <polygon points="350,252 342,247 343,257" fill="#849bad"/>

  <!-- ReLU -->
  <g filter="url(#smallShadow)">
    <rect x="357" y="29" width="184" height="78" rx="18" fill="#fff7e8"/>
    <circle cx="383" cy="56" r="15" fill="#f5bf70"/>
    <path d="M375 63 L383 55 L390 55" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="410" y="56" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#6f5331">ReLU</text>
    <text x="410" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#856b4b">Keskin • hızlı</text>
    <path d="M508 86 H526 V50" fill="none" stroke="#e5aa58" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Swish -->
  <g filter="url(#shadow)">
    <rect x="350" y="118" width="210" height="84" rx="20" fill="#eaf5ff"/>
    <circle cx="379" cy="151" r="17" fill="#78b9e4"/>
    <path d="M368 155 C373 142 377 164 384 149 C388 141 390 146 392 143" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
    <text x="408" y="148" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d7b">Swish / SiLU</text>
    <text x="408" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54778e">Yumuşak kapı</text>
    <path d="M515 180 C524 170 530 155 537 136" fill="none" stroke="#71add5" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Mish -->
  <g filter="url(#smallShadow)">
    <rect x="357" y="214" width="184" height="78" rx="18" fill="#f1ecff"/>
    <circle cx="383" cy="241" r="15" fill="#a79bdf"/>
    <path d="M373 246 C378 236 379 250 383 241 C387 232 388 245 393 236" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
    <text x="410" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#564b8b">Mish</text>
    <text x="410" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#716895">Çok yumuşak</text>
    <path d="M508 270 H526 V231" fill="none" stroke="#9a8ed0" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- selection / deployment -->
  <g filter="url(#shadow)">
    <rect x="555" y="102" width="69" height="117" rx="20" fill="#ffffff"/>
    <rect x="568" y="117" width="43" height="27" rx="9" fill="#dff1e5"/>
    <path d="M577 131 H603 M580 125 V137 M588 125 V137 M596 125 V137" stroke="#5ca783" stroke-width="2" stroke-linecap="round"/>
    <text x="589.5" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3e6854">Seçim</text>
    <text x="589.5" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#658172">Doğruluk</text>
    <text x="589.5" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#658172">Gecikme</text>
  </g>

  <!-- top/bottom connections to selector -->
  <path d="M541 68 C558 68 552 121 555 126" fill="none" stroke="#849bad" stroke-width="2.2"/>
  <polygon points="555,126 548,120 558,118" fill="#849bad"/>
  <path d="M560 160 H555" fill="none" stroke="#849bad" stroke-width="2.2"/>
  <polygon points="555,160 563,155 563,165" fill="#849bad"/>
  <path d="M541 252 C558 252 552 200 555 195" fill="none" stroke="#849bad" stroke-width="2.2"/>
  <polygon points="555,195 558,203 548,201" fill="#849bad"/>
</svg>