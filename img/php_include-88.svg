<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="phpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c9bd1"/>
      <stop offset="100%" stop-color="#4a7fb5"/>
    </linearGradient>
    <linearGradient id="incGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b37e"/>
      <stop offset="100%" stop-color="#e89b5c"/>
    </linearGradient>
    <linearGradient id="reqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88b8b"/>
      <stop offset="100%" stop-color="#d96a6a"/>
    </linearGradient>
    <linearGradient id="onceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fc9a8"/>
      <stop offset="100%" stop-color="#6ab88a"/>
    </linearGradient>
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39ddb"/>
      <stop offset="100%" stop-color="#9b7fd4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#3a5a7a">PHP Dosya Dahil Etme İşlemleri</text>

  <!-- Merkez PHP dosyası -->
  <rect x="255" y="120" width="130" height="50" rx="12" fill="url(#phpGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">PHP Dosyası</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f0fe">(Aktif)</text>

  <!-- Üst: include -->
  <rect x="60" y="55" width="130" height="44" rx="10" fill="url(#incGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="125" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">include</text>
  <text x="125" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff5ec">Uyarı verir</text>

  <!-- Üst: require -->
  <rect x="230" y="45" width="130" height="44" rx="10" fill="url(#reqGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="295" y="64" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">require</text>
  <text x="295" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffecec">Ölümcül hata</text>

  <!-- Alt: include_once -->
  <rect x="60" y="220" width="130" height="44" rx="10" fill="url(#onceGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="125" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">include_once</text>
  <text x="125" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#eafaf0">Tekrar engeller</text>

  <!-- Alt: require_once -->
  <rect x="230" y="230" width="130" height="44" rx="10" fill="url(#onceGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="295" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">require_once</text>
  <text x="295" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#eafaf0">Tekrar engeller</text>

  <!-- Sağ: Dahil edilen dosya -->
  <rect x="470" y="120" width="130" height="50" rx="12" fill="url(#fileGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="535" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Dahil Edilen</text>
  <text x="535" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#f0eaff">Dosya</text>

  <!-- Oklar: include ve require -> PHP dosyası -->
  <!-- include -> PHP -->
  <path d="M 190 77 L 248 130" stroke="#e89b5c" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="248,130 239,122 240,133" fill="#e89b5c"/>

  <!-- require -> PHP -->
  <path d="M 360 67 L 390 120" stroke="#d96a6a" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="390,120 381,112 382,123" fill="#d96a6a"/>

  <!-- include_once -> PHP -->
  <path d="M 190 242 L 248 175" stroke="#6ab88a" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="248,175 239,183 240,172" fill="#6ab88a"/>

  <!-- require_once -> PHP -->
  <path d="M 360 252 L 390 175" stroke="#6ab88a" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="390,175 381,183 382,172" fill="#6ab88a"/>

  <!-- PHP -> Dahil edilen dosya -->
  <path d="M 390 145 L 462 145" stroke="#7a6a9a" stroke-width="2" fill="none"/>
  <polygon points="462,145 452,140 452,150" fill="#7a6a9a"/>

  <!-- Alt bilgi: include_path -->
  <rect x="420" y="260" width="190" height="40" rx="8" fill="#e8f0fe" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="515" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#4a6a8a">include_path</text>
  <text x="515" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a9a">Yol tanımlı değilse</text>

  <!-- include_path -> PHP -->
  <path d="M 470 260 L 400 175" stroke="#8aa8c8" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="400,175 401,185 408,177" fill="#8aa8c8"/>

  <!-- Etiket: Dosya yolu -->
  <text x="80" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a" font-style="italic">Dosya yolu</text>
  <text x="80" y="195" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a" font-style="italic">tanımlı ise</text>

  <!-- Çizgi: dosya yolu -->
  <path d="M 130 200 L 130 220" stroke="#8aa8c8" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <polygon points="130,220 126,212 134,212" fill="#8aa8c8"/>

  <!-- Bilgi notu -->
  <rect x="60" y="280" width="300" height="30" rx="8" fill="#f0f4fa" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="210" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">include_once ve require_once tekrar dahil etmeyi önler</text>
</svg>