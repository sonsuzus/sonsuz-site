  <path d="M275 251 L179 272" fill="none" stroke="#d18b7b" stroke-width="2.4"/>
  <polygon points="174,273 186,266 188,278" fill="#d18b7b"/>
  <path d="M365 251 L461 272" fill="none" stroke="#77a98e" stroke-width="2.4"/>
  <polygon points="466,273 452,278 454,266" fill="#77a98e"/>

  <g filter="url(#shadow)">
    <rect x="45" y="265" width="177" height="43" rx="15" fill="url(#risk)"/>
    <path d="M69 277 L80 298 L58 298 Z" fill="#ffffff" opacity="0.82"/>
    <rect x="68.4" y="283" width="1.8" height="8" rx="1" fill="#d77d69"/>
    <circle cx="69.3" cy="294" r="1.3" fill="#d77d69"/>
    <text x="145" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Geri izleme</text>
    <text x="145" y="301" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">ReDoS riski</text>
  </g>

  <g filter="url(#shadow)">
