<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="power" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9b9f3"/>
      <stop offset="100%" stop-color="#a893dd"/>
    </linearGradient>
    <linearGradient id="read" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9e8d4"/>
      <stop offset="100%" stop-color="#83caaa"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd5c9"/>
      <stop offset="100%" stop-color="#f3a58f"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#50627a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#50627a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="83" cy="52" r="72" fill="#dcecff" opacity="0.48"/>
  <circle cx="565" cy="278" r="98" fill="#dff3d5" opacity="0.48"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40516a">REGEX DENGESİ</text>

  <path d="M129 122 L195 151" fill="none" stroke="#8191a7" stroke-width="2.5"/>
