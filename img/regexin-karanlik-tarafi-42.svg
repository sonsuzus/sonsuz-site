    <rect x="452" y="56" width="146" height="70" rx="17" fill="url(#read)"/>
    <circle cx="480" cy="82" r="14" fill="#ffffff" opacity="0.33"/>
    <path d="M473 82 L478 87 L488 76" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="526" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Okunabilirlik</text>
    <text x="526" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">Niyet görünür</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="237" y="125" width="166" height="58" rx="18" fill="#ffffff"/>
    <text x="320" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b5d76">Regex Motoru</text>
    <text x="320" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a8799">Desen eşleştirme</text>
  </g>

  <path d="M320 183 L320 207" fill="none" stroke="#72839b" stroke-width="2.5"/>
  <polygon points="320,213 314,202 326,202" fill="#72839b"/>

  <g filter="url(#soft)">
    <rect x="211" y="213" width="218" height="38" rx="15" fill="#e8f0fa"/>
    <text x="320" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526780">Kural karmaşıklığı</text>
