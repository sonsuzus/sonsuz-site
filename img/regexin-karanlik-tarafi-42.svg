    <circle cx="69" cy="82" r="14" fill="#ffffff" opacity="0.32"/>
    <path d="M65 88 L71 76 L76 81 L82 72" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">İfade Gücü</text>
    <text x="112" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">Kısa ve hızlı</text>
  </g>

