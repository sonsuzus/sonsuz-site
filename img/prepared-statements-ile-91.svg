<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Prepared Statements ile Güvenli SQL</text>

  <!-- Sol taraf: Tehlikeli Yol -->
  <rect x="30" y="55" width="250" height="40" rx="8" fill="#ffebee" filter="url(#shadow)"/>
  <text x="155" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Tehlikeli Yol</text>

  <!-- Kullanıcı Girdisi -->
  <rect x="50" y="110" width="100" height="36" rx="6" fill="#fff3e0" filter="url(#shadowLight)"/>
  <text x="100" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e65100">Kullanıcı Verisi</text>

  <!-- SQL Metni -->
  <rect x="170" y="110" width="100" height="36" rx="6" fill="#fff3e0" filter="url(#shadowLight)"/>
  <text x="220" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e65100">SQL Metni</text>

  <!-- Birleştirme -->
  <rect x="80" y="165" width="160" height="36" rx="6" fill="#ffcdd2" filter="url(#shadowLight)"/>
  <text x="160" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b71c1c">Metin Birleştirme</text>

  <!-- Saldırı -->
  <rect x="80" y="220" width="160" height="36" rx="6" fill="#ffcdd2" filter="url(#shadowLight)"/>
  <text x="160" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b71c1c">Sorgu Yeniden Yazılır</text>

  <!-- Oklar sol -->
  <line x1="100" y1="146" x2="140" y2="165" stroke="#c62828" stroke-width="1.5"/>
  <polygon points="140,165 132,160 136,168" fill="#c62828"/>
  <line x1="220" y1="146" x2="180" y2="165" stroke="#c62828" stroke-width="1.5"/>
  <polygon points="180,165 188,160 184,168" fill="#c62828"/>
  <line x1="160" y1="201" x2="160" y2="220" stroke="#c62828" stroke-width="1.5"/>
  <polygon points="160,220 155,212 165,212" fill="#c62828"/>

  <!-- Sağ taraf: Güvenli Yol -->
  <rect x="360" y="55" width="250" height="40" rx="8" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="485" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Güvenli Yol</text>

  <!-- SQL Şablonu -->
  <rect x="370" y="110" width="110" height="36" rx="6" fill="#e3f2fd" filter="url(#shadowLight)"/>
  <text x="425" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0">SQL Şablonu</text>

  <!-- Parametreler -->
  <rect x="500" y="110" width="110" height="36" rx="6" fill="#e3f2fd" filter="url(#shadowLight)"/>
  <text x="555" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0">Parametreler</text>

  <!-- Hazırlama -->
  <rect x="390" y="165" width="160" height="36" rx="6" fill="#c8e6c9" filter="url(#shadowLight)"/>
  <text x="470" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">Hazırlama ve Bağlama</text>

  <!-- Güvenli Çalıştırma -->
  <rect x="390" y="220" width="160" height="36" rx="6" fill="#c8e6c9" filter="url(#shadowLight)"/>
  <text x="470" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">Güvenli Çalıştırma</text>

  <!-- Oklar sağ -->
  <line x1="425" y1="146" x2="445" y2="165" stroke="#2e7d32" stroke-width="1.5"/>
  <polygon points="445,165 437,160 441,168" fill="#2e7d32"/>
  <line x1="555" y1="146" x2="500" y2="165" stroke="#2e7d32" stroke-width="1.5"/>
  <polygon points="500,165 508,160 504,168" fill="#2e7d32"/>
  <line x1="470" y1="201" x2="470" y2="220" stroke="#2e7d32" stroke-width="1.5"/>
  <polygon points="470,220 465,212 475,212" fill="#2e7d32"/>

  <!-- Orta bölüm: Ayırıcı çizgi -->
  <line x1="320" y1="55" x2="320" y2="270" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Alt bölüm: Temel Kural -->
  <rect x="140" y="275" width="360" height="32" rx="16" fill="#ffffff" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#37474f">Veri, SQL cümlesi yazmamalı; yalnızca değer olarak yerini doldurmalı</text>

  <!-- Küçük ikonlar -->
  <circle cx="45" cy="80" r="8" fill="#ef9a9a" opacity="0.6"/>
  <text x="45" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b71c1c">!</text>

  <circle cx="595" cy="80" r="8" fill="#a5d6a7" opacity="0.6"/>
  <text x="595" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1b5e20">✓</text>
</svg>