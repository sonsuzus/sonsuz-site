<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#c9e3f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7995a8" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#718596" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="55" r="48" fill="#dceff4" opacity="0.5"/>
  <circle cx="577" cy="273" r="65" fill="#e4f0d4" opacity="0.55"/>
  <path d="M38 160 C120 125, 151 202, 221 171" fill="none" stroke="#cddfe2" stroke-width="2" stroke-dasharray="5 7"/>
  <path d="M417 148 C483 110, 547 174, 617 123" fill="none" stroke="#d6e5d4" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- üst bağlantılılık denetimi -->
  <g filter="url(#shadow)">
    <rect x="228" y="18" width="184" height="47" rx="15" fill="#fffdf8"/>
  </g>
  <circle cx="252" cy="41.5" r="13" fill="#ccebd6"/>
  <path d="M246 42 L250 46 L258 36" fill="none" stroke="#43845b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="272" y="39" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#385466">Bağlantılılık</text>
  <text x="272" y="54" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647784">ön kontrolü</text>

  <path d="M320 67 L320 84" fill="none" stroke="#7894a3" stroke-width="2"/>
  <polygon points="315,81 325,81 320,88" fill="#7894a3"/>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <rect x="220" y="89" width="200" height="83" rx="21" fill="url(#core)"/>
  </g>
  <path d="M267 136 L298 117 L337 127 L370 108" fill="none" stroke="#4c8197" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M298 117 L318 151 L370 108" fill="none" stroke="#4c8197" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="267" cy="136" r="6" fill="#fff" stroke="#4c8197" stroke-width="2"/>
  <circle cx="298" cy="117" r="6" fill="#fff" stroke="#4c8197" stroke-width="2"/>
  <circle cx="337" cy="127" r="6" fill="#fff" stroke="#4c8197" stroke-width="2"/>
  <circle cx="318" cy="151" r="6" fill="#fff" stroke="#4c8197" stroke-width="2"/>
  <circle cx="370" cy="108" r="6" fill="#fff" stroke="#4c8197" stroke-width="2"/>
  <text x="320" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31586c">Minimum Yayılım Ağacı</text>
  <text x="320" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567183">En düşük maliyet • Döngüsüz</text>

  <!-- sol akış -->
  <path d="M218 130 L174 130" fill="none" stroke="#8299a9" stroke-width="2"/>
  <polygon points="178,125 178,135 170,130" fill="#8299a9"/>
  <g filter="url(#shadow)">
    <rect x="30" y="91" width="140" height="81" rx="18" fill="#fff8ee"/>
