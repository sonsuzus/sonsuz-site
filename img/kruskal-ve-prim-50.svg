  <circle cx="497" cy="116" r="14" fill="#dcd1fb"/>
  <path d="M491 121 L497 109 L503 121 M493 117 L501 117" fill="none" stroke="#7057a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c4a88">Prim</text>
  <text x="489" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#706783">Ağacı büyüt</text>
  <text x="489" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#706783">Öncelik kuyruğu</text>

  <!-- sonuç dallanması -->
  <path d="M320 216 L320 232 L183 232 L183 248" fill="none" stroke="#7894a3" stroke-width="2"/>
  <polygon points="178,245 188,245 183,253" fill="#7894a3"/>
  <path d="M320 232 L457 232 L457 248" fill="none" stroke="#7894a3" stroke-width="2"/>
  <polygon points="452,245 462,245 457,253" fill="#7894a3"/>

  <g filter="url(#smallShadow)">
    <rect x="71" y="253" width="224" height="49" rx="15" fill="#e6f5e8"/>
  </g>
  <circle cx="98" cy="277.5" r="13" fill="#b7dfbf"/>
  <path d="M92 278 L96 282 L104 272" fill="none" stroke="#39704a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e654a">Bağlantılı grafik</text>
  <text x="120" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597464">n−1 kenar • Tek ağaç</text>

  <g filter="url(#smallShadow)">
    <rect x="345" y="253" width="224" height="49" rx="15" fill="#fff0ed"/>
  </g>
  <circle cx="372" cy="277.5" r="13" fill="#f6c7bd"/>
  <path d="M366 272 L378 284 M378 272 L366 284" stroke="#a24f43" stroke-width="2.3" stroke-linecap="round"/>
  <text x="394" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#875148">Bağlantısız grafik</text>
  <text x="394" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#81655f">Minimum yayılım ormanı</text>
</svg>