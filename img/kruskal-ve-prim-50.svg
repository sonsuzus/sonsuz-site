  <circle cx="57" cy="116" r="14" fill="#f9d8ae"/>
  <path d="M50 112 L64 112 M50 117 L61 117 M50 122 L57 122" stroke="#a76b2c" stroke-width="2" stroke-linecap="round"/>
  <text x="80" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765230">Kruskal</text>
  <text x="49" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806c59">Kenarları sırala</text>
  <text x="49" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806c59">DSU ile döngü denetle</text>

  <!-- sağ akış -->
  <path d="M422 130 L466 130" fill="none" stroke="#8299a9" stroke-width="2"/>
  <polygon points="462,125 462,135 470,130" fill="#8299a9"/>
  <g filter="url(#shadow)">
    <rect x="470" y="91" width="140" height="81" rx="18" fill="#f3f0ff"/>
