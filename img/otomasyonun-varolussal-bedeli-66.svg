<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fbae9"/>
      <stop offset="100%" stop-color="#6799d2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71839a" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8093a6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="159" r="113" fill="#dceef5" opacity="0.48"/>
  <circle cx="319" cy="159" r="90" fill="none" stroke="#b9d6e0" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- bağlantılar -->
  <path d="M173 151 C204 151 209 151 229 151" fill="none" stroke="#6e96b8" stroke-width="2.5"/>
  <polygon points="229,151 219,145 219,157" fill="#6e96b8"/>
  <path d="M409 151 C433 151 442 102 461 102" fill="none" stroke="#7a9eaa" stroke-width="2.5"/>
  <polygon points="461,102 451,97 454,108" fill="#7a9eaa"/>
  <path d="M409 161 C435 164 442 216 461 216" fill="none" stroke="#9a89a8" stroke-width="2.5"/>
  <polygon points="461,216 451,211 454,222" fill="#9a89a8"/>
  <path d="M320 225 L320 254" fill="none" stroke="#789b87" stroke-width="2.5"/>
  <polygon points="320,254 314,244 326,244" fill="#789b87"/>

  <!-- programcı -->
  <g filter="url(#shadow)">
    <rect x="27" y="105" width="146" height="105" rx="20" fill="#fffdf8"/>
    <rect x="38" y="116" width="124" height="27" rx="10" fill="#ead9bd"/>
    <text x="100" y="134" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e4c39" font-weight="600">PROGRAMCI</text>
    <circle cx="71" cy="166" r="13" fill="#edbf91"/>
    <path d="M49 198 C51 179 60 177 71 177 C83 177 93 181 95 198" fill="#91afd2"/>
    <rect x="105" y="158" width="40" height="28" rx="4" fill="#536d87"/>
    <rect x="109" y="162" width="32" height="18" rx="2" fill="#d9eff3"/>
    <path d="M116 168 L121 172 L116 176 M130 168 L125 172 L130 176" fill="none" stroke="#608ba4" stroke-width="1.5"/>
    <text x="100" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66707a">tekrar eden iş</text>
  </g>

  <!-- merkez otomasyon -->
  <g filter="url(#shadow)">
    <rect x="230" y="101" width="180" height="124" rx="27" fill="url(#core)"/>
    <rect x="241" y="112" width="158" height="102" rx="21" fill="#9fc8ed" opacity="0.38"/>
    <path d="M281 155 L300 136 L321 155 L340 136 L360 155" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="320" cy="176" r="22" fill="#eef8ff" opacity="0.95"/>
    <path d="M310 176 L317 183 L331 168" fill="none" stroke="#5d90bd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff" font-weight="600">OTOMASYON</text>
    <text x="320" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf8ff">betik ve sistem</text>
  </g>

  <!-- fayda -->
  <g filter="url(#soft)">
    <rect x="462" y="57" width="151" height="89" rx="18" fill="#e1f2e5"/>
    <circle cx="487" cy="83" r="15" fill="#a6d6ae"/>
    <path d="M480 84 L485 89 L495 77" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386747" font-weight="600">ÖLÇÜLEBİLİR KAZANÇ</text>
    <text x="550" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587665">zaman · hata · maliyet</text>
    <text x="550" y="127" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587665">daha az</text>
  </g>

  <!-- risk -->
  <g filter="url(#soft)">
    <rect x="462" y="173" width="151" height="89" rx="18" fill="#f2e3ed"/>
    <circle cx="487" cy="199" r="15" fill="#d9a7c0"/>
    <path d="M487 190 L487 201 M487 207 L487 208" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="550" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75445e" font-weight="600">GÖRÜNMEZ BEDEL</text>
    <text x="550" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#865e73">kimlik ve yetki</text>
    <text x="550" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#865e73">kaybı</text>
  </g>

  <!-- sorumluluk alt -->
  <g filter="url(#soft)">
    <rect x="216" y="255" width="208" height="48" rx="16" fill="#e6f0df"/>
    <circle cx="245" cy="279" r="13" fill="#a9cfa8"/>
    <path d="M239 280 L244 285 L253 274" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46684c" font-weight="600">İNSANİ MUHAKEME</text>
    <text x="330" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7b63">bağlam · sınır · sorumluluk</text>
  </g>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#506b7c" font-weight="600">OTOMASYON PARADOKSU</text>
</svg>