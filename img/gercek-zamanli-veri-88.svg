<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="kafka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd4ff"/>
      <stop offset="1" stop-color="#c7e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="37" r="52" fill="#d9efff" opacity="0.45"/>
  <circle cx="578" cy="278" r="70" fill="#ddf3d5" opacity="0.48"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">GERÇEK ZAMANLI KAYIPSIZ AKIŞ</text>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="27" y="65" width="118" height="48" rx="14" fill="#ffe4c4"/>
    <rect x="27" y="130" width="118" height="48" rx="14" fill="#d8f2df"/>
    <rect x="27" y="195" width="118" height="48" rx="14" fill="#dbeaff"/>
  </g>
  <circle cx="49" cy="89" r="10" fill="#f3a75f"/>
  <path d="M44 89h10M49 84v10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="62" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a5966">Tıklamalar</text>

  <rect x="40" y="145" width="18" height="16" rx="3" fill="#63ad7c"/>
  <path d="M44 151h10M44 156h7" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="67" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a5966">Sunucu logu</text>

  <circle cx="49" cy="219" r="10" fill="#6f9ed7"/>
  <path d="M49 213v7l4 3" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a5966">Sensörler</text>

  <!-- Input lines -->
  <path d="M145 89H174" fill="none" stroke="#7b9ab0" stroke-width="2"/>
  <polygon points="174,89 166,84 166,94" fill="#7b9ab0"/>
  <path d="M145 154H174" fill="none" stroke="#7b9ab0" stroke-width="2"/>
  <polygon points="174,154 166,149 166,159" fill="#7b9ab0"/>
  <path d="M145 219H174" fill="none" stroke="#7b9ab0" stroke-width="2"/>
  <polygon points="174,219 166,214 166,224" fill="#7b9ab0"/>

  <!-- Producer -->
  <g filter="url(#shadow)">
    <rect x="176" y="111" width="86" height="84" rx="18" fill="#fff9ee"/>
  </g>
  <rect x="201" y="128" width="36" height="27" rx="7" fill="#f2b86d"/>
  <path d="M209 136h20M209 143h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="219" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#46596a">Üretici</text>

  <path d="M262 153H287" fill="none" stroke="#6e89a2" stroke-width="2.5"/>
  <polygon points="287,153 278,147 278,159" fill="#6e89a2"/>
  <text x="274" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8291">olay</text>

  <!-- Kafka core -->
  <g filter="url(#shadow)">
    <rect x="289" y="65" width="180" height="177" rx="21" fill="url(#kafka)" stroke="#b8c9e9" stroke-width="1.2"/>
  </g>
  <text x="379" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#465679">Kafka Konusu</text>
  <text x="379" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647590">kalıcı olay günlüğü</text>

  <g filter="url(#smallShadow)">
    <rect x="310" y="121" width="42" height="91" rx="9" fill="#fff" opacity="0.92"/>
    <rect x="359" y="121" width="42" height="91" rx="9" fill="#fff" opacity="0.92"/>
    <rect x="408" y="121" width="42" height="91" rx="9" fill="#fff" opacity="0.92"/>
  </g>
  <rect x="317" y="134" width="28" height="7" rx="3.5" fill="#a994e0"/>
  <rect x="317" y="149" width="28" height="7" rx="3.5" fill="#c4b5ec"/>
  <rect x="317" y="164" width="28" height="7" rx="3.5" fill="#a994e0"/>
  <rect x="317" y="179" width="28" height="7" rx="3.5" fill="#c4b5ec"/>

  <rect x="366" y="134" width="28" height="7" rx="3.5" fill="#719fd7"/>
  <rect x="366" y="149" width="28" height="7" rx="3.5" fill="#a8caec"/>
  <rect x="366" y="164" width="28" height="7" rx="3.5" fill="#719fd7"/>
  <rect x="366" y="179" width="28" height="7" rx="3.5" fill="#a8caec"/>

  <rect x="415" y="134" width="28" height="7" rx="3.5" fill="#79bd9a"/>
  <rect x="415" y="149" width="28" height="7" rx="3.5" fill="#b3dfc6"/>
  <rect x="415" y="164" width="28" height="7" rx="3.5" fill="#79bd9a"/>
  <rect x="415" y="179" width="28" height="7" rx="3.5" fill="#b3dfc6"/>

  <text x="331" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52657d">Bölüm 1</text>
  <text x="380" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52657d">Bölüm 2</text>
  <text x="429" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52657d">Bölüm 3</text>

  <!-- Replication shield -->
  <g filter="url(#smallShadow)">
    <rect x="326" y="253" width="106" height="35" rx="13" fill="#e3f4e1"/>
  </g>
  <path d="M343 262l8-4 8 4v7c0 5-4 8-8 10-4-2-8-5-8-10z" fill="#75b987"/>
  <path d="M347 268l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="393" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#52725e">Çoğaltma</text>

  <!-- Output -->
  <path d="M469 153H496" fill="none" stroke="#6e89a2" stroke-width="2.5"/>
  <polygon points="496,153 487,147 487,159" fill="#6e89a2"/>

  <!-- Consumer group -->
  <g filter="url(#shadow)">
    <rect x="498" y="91" width="116" height="124" rx="19" fill="#fdfcff"/>
  </g>
  <text x="556" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d5f78">Tüketici Grubu</text>
  <g>
    <circle cx="525" cy="145" r="13" fill="#93c6e9"/>
    <circle cx="556" cy="145" r="13" fill="#af9adb"/>
    <circle cx="587" cy="145" r="13" fill="#8bc7a3"/>
    <path d="M520 146h10M551 146h10M582 146h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M519 174h74" stroke="#d7e1ed" stroke-width="2" stroke-linecap="round"/>
  <text x="556" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647590">Offset ile okuma</text>

  <!-- lag indicator -->
  <path d="M481 238c11 0 18-8 18-19" fill="none" stroke="#e6a15d" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="499,219 493,226 502,227" fill="#e6a15d"/>
  <text x="486" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b4773d">Gecikme tamponu</text>
</svg>