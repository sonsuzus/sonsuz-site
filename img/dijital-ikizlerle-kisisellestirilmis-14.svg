  <polygon points="523,269 519,261 527,261" fill="#8aa9b9"/>
  <g filter="url(#smallShadow)">
    <rect x="396" y="269" width="244" height="35" rx="15" fill="#e9f2f5"/>
  </g>
  <circle cx="419" cy="286.5" r="10" fill="#83aebe"/>
  <path d="M415 287l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="435" y="290.5" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#395b68">Klinik uzman değerlendirmesi</text>
