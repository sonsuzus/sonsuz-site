  <rect x="454" y="96" width="138" height="35" rx="10" fill="#fff3e6"/>
  <circle cx="472" cy="113.5" r="9" fill="#f3bf83"/>
  <path d="M468 113.5h8M472 109.5v8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="489" y="117.5" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765638">Doz seçenekleri</text>

  <rect x="454" y="141" width="138" height="35" rx="10" fill="#edf3ff"/>
  <path d="M466 165v-14M466 165h18M470 160l4-4 4 2 5-7" fill="none" stroke="#638dc3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
