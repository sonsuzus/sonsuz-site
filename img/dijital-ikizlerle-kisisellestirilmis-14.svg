    <path d="M47 207c0-3 8-3 8 0s-8 3-8 6 8 3 8 0M51 204v12" fill="none" stroke="#b47d47" stroke-width="1.4" stroke-linecap="round"/>
    <text x="68" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#38566c">Genetik</text>
    <text x="68" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8291">Hasta geçmişi</text>
