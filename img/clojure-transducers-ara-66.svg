<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d7de8"/>
      <stop offset="100%" stop-color="#6973d4"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#59708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#617588" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="84" cy="36" r="72" fill="#cfe9f4" opacity="0.38"/>
  <circle cx="587" cy="278" r="96" fill="#d8efcc" opacity="0.38"/>

  <text x="32" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e5570">TEK GEÇİŞLİ VERİ İŞLEME</text>
  <text x="32" y="52" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#738397">Ara koleksiyon olmadan dönüşüm hattı</text>

  <!-- source -->
  <g filter="url(#shadow)">
    <rect x="32" y="112" width="105" height="120" rx="20" fill="#ffffff"/>
    <rect x="42" y="123" width="85" height="27" rx="10" fill="#d9f0fb"/>
    <text x="84.5" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31627c">Veri Kaynağı</text>
    <circle cx="58" cy="171" r="7" fill="#78b9d5"/>
    <circle cx="84" cy="171" r="7" fill="#e9b875"/>
    <circle cx="110" cy="171" r="7" fill="#92c982"/>
    <circle cx="58" cy="199" r="7" fill="#b999d8"/>
    <circle cx="84" cy="199" r="7" fill="#78b9d5"/>
    <circle cx="110" cy="199" r="7" fill="#e9b875"/>
    <text x="84.5" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65798a">Akış veya dizi</text>
  </g>

  <!-- arrow 1 -->
  <path d="M142 172 H169" fill="none" stroke="#7c99ac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="177,172 167,166 167,178" fill="#7c99ac"/>

  <!-- transformation shell -->
  <g filter="url(#shadow)">
    <rect x="182" y="88" width="245" height="170" rx="25" fill="#ffffff"/>
    <rect x="199" y="104" width="211" height="29" rx="11" fill="#eeeafd"/>
    <text x="304.5" y="123" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5d50aa">Transducer Tarifi</text>

    <!-- filter -->
    <g filter="url(#smallShadow)">
      <rect x="201" y="151" width="86" height="75" rx="15" fill="#e8f6e4"/>
      <circle cx="222" cy="176" r="11" fill="#8bc47a"/>
      <path d="M217 176 L221 180 L228 171" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="252" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7751">Filtrele</text>
      <text x="252" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668071">Çift sayılar</text>
      <text x="252" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668071">geçer</text>
    </g>

    <path d="M291 188 H310" fill="none" stroke="#8ca5b2" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="317,188 308,182 308,194" fill="#8ca5b2"/>

    <!-- map -->
    <g filter="url(#smallShadow)">
      <rect x="323" y="151" width="86" height="75" rx="15" fill="#fff0d9"/>
      <rect x="337" y="165" width="21" height="21" rx="6" fill="#e4a956"/>
      <text x="347.5" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">²</text>
      <text x="366" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9b6130">Eşle</text>
      <text x="366" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#94755a">Karesini al</text>
      <text x="366" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#94755a">dönüştür</text>
    </g>
  </g>

  <!-- arrow to reducer -->
  <path d="M433 172 H455" fill="none" stroke="#7c99ac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="463,172 453,166 453,178" fill="#7c99ac"/>

  <!-- reducer -->
  <g filter="url(#shadow)">
    <rect x="468" y="112" width="140" height="120" rx="20" fill="url(#core)"/>
    <circle cx="538" cy="151" r="22" fill="#ffffff" opacity="0.17"/>
    <path d="M529 151 H547 M538 142 V160" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="538" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">İndirgeme</text>
    <text x="538" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eeedff">Toplam ve sonuç</text>
  </g>

  <!-- reusable destinations -->
  <path d="M538 237 V271" fill="none" stroke="#8597ac" stroke-width="2" stroke-linecap="round"/>
  <path d="M538 271 H484" fill="none" stroke="#8597ac" stroke-width="2" stroke-linecap="round"/>
  <polygon points="476,271 486,265 486,277" fill="#8597ac"/>
  <path d="M538 271 H592" fill="none" stroke="#8597ac" stroke-width="2" stroke-linecap="round"/>
  <polygon points="600,271 590,265 590,277" fill="#8597ac"/>

  <g filter="url(#smallShadow)">
    <rect x="421" y="272" width="104" height="32" rx="12" fill="#dceff8"/>
    <text x="473" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39718b">Vektör</text>
  </g>
  <g filter="url(#smallShadow)">
    <rect x="551" y="272" width="67" height="32" rx="12" fill="#e2f2dc"/>
    <text x="584.5" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#46784c">Kanal</text>
  </g>
</svg>