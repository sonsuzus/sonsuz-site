    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#61778c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="42" r="62" fill="#d8eff3" opacity="0.42"/>
  <circle cx="584" cy="279" r="92" fill="#dff0cd" opacity="0.42"/>

