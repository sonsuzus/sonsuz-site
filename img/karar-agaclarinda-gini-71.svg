  <path d="M73 198 L78 203 L86 192" fill="none" stroke="#916c1e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="101" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#62532d">Gini safsızlığı</text>
