<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#727de8"/>
      <stop offset="100%" stop-color="#5764c9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c7d9c" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6c7d9c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="160" r="120" fill="#dceaf5" opacity="0.42"/>
  <circle cx="319" cy="160" r="91" fill="none" stroke="#aabddd" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.75"/>

  <!-- bağlantılar -->
  <path d="M260 136 L174 91" fill="none" stroke="#8da5c8" stroke-width="2"/>
  <polygon points="174,91 183,90 178,98" fill="#8da5c8"/>
  <path d="M379 136 L464 91" fill="none" stroke="#8da5c8" stroke-width="2"/>
  <polygon points="464,91 455,90 460,98" fill="#8da5c8"/>
  <path d="M252 169 L152 169" fill="none" stroke="#8da5c8" stroke-width="2"/>
  <polygon points="152,169 161,164 161,174" fill="#8da5c8"/>
  <path d="M388 169 L488 169" fill="none" stroke="#8da5c8" stroke-width="2"/>
  <polygon points="488,169 479,164 479,174" fill="#8da5c8"/>
  <path d="M263 190 L181 239" fill="none" stroke="#8da5c8" stroke-width="2"/>
  <polygon points="181,239 186,231 190,239" fill="#8da5c8"/>
  <path d="M376 190 L458 239" fill="none" stroke="#8da5c8" stroke-width="2"/>
  <polygon points="458,239 449,239 454,231" fill="#8da5c8"/>

  <!-- üst sol -->
  <g filter="url(#smallShadow)">
    <rect x="72" y="56" width="107" height="70" rx="16" fill="#ffffff"/>
    <circle cx="96" cy="82" r="13" fill="#dfe4ff"/>
    <path d="M90 83 L94 87 L102 77" fill="none" stroke="#6270d3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34435d" font-weight="600">Hedef</text>
    <text x="115" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d7b91">Bağlam</text>
  </g>

  <!-- üst sağ -->
  <g filter="url(#smallShadow)">
    <rect x="461" y="56" width="107" height="70" rx="16" fill="#ffffff"/>
    <circle cx="486" cy="82" r="13" fill="#d9f2e6"/>
    <path d="M480 86 L485 79 L490 84 L496 76" fill="none" stroke="#3d9f79" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="505" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34435d" font-weight="600">Planlama</text>
    <text x="505" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d7b91">Yönlendirme</text>
  </g>

  <!-- sol -->
  <g filter="url(#smallShadow)">
    <rect x="35" y="139" width="119" height="61" rx="16" fill="#ffffff"/>
    <circle cx="60" cy="169" r="13" fill="#ffe7c9"/>
    <path d="M54 170 L59 175 L67 164" fill="none" stroke="#c88736" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34435d" font-weight="600">Uzman Ajan</text>
    <text x="82" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d7b91">Görev</text>
  </g>

  <!-- sağ -->
  <g filter="url(#smallShadow)">
    <rect x="486" y="139" width="119" height="61" rx="16" fill="#ffffff"/>
    <circle cx="511" cy="169" r="13" fill="#e9defb"/>
    <path d="M506 164 L516 164 L516 174 L506 174 Z" fill="none" stroke="#8864bb" stroke-width="1.8"/>
    <path d="M509 161 L513 161" stroke="#8864bb" stroke-width="1.8" stroke-linecap="round"/>
    <text x="533" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34435d" font-weight="600">Araçlar</text>
    <text x="533" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d7b91">API ve veri</text>
  </g>

  <!-- alt sol -->
  <g filter="url(#smallShadow)">
    <rect x="77" y="221" width="116" height="63" rx="16" fill="#ffffff"/>
    <circle cx="103" cy="252" r="13" fill="#ffdfe5"/>
    <path d="M97 252 C97 247 104 246 105 251 C106 246 113 247 113 252 C113 257 105 261 105 261 C105 261 97 257 97 252Z" fill="#dc7186"/>
    <text x="125" y="249" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34435d" font-weight="600">İnsan Kararı</text>
    <text x="125" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d7b91">İnceleme</text>
  </g>

  <!-- alt sağ -->
  <g filter="url(#smallShadow)">
    <rect x="447" y="221" width="116" height="63" rx="16" fill="#ffffff"/>
    <circle cx="473" cy="252" r="13" fill="#d9f1ee"/>
    <path d="M467 252 L471 256 L479 247" fill="none" stroke="#359b8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="495" y="249" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34435d" font-weight="600">Denetim</text>
    <text x="495" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d7b91">Risk ve kalite</text>
  </g>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="160" r="69" fill="#ffffff"/>
    <circle cx="320" cy="160" r="58" fill="url(#core)"/>
    <circle cx="320" cy="139" r="12" fill="#ffffff" opacity="0.95"/>
    <path d="M301 168 C306 156 334 156 339 168 L339 174 L301 174 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M294 184 L346 184" stroke="#dce1ff" stroke-width="1" opacity="0.85"/>
    <text x="320" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="600">Orkestra Şefi</text>
  </g>

  <!-- geri bildirim döngüsü -->
  <path d="M438 286 C400 310 240 310 202 286" fill="none" stroke="#69a99e" stroke-width="2" stroke-dasharray="5 5" opacity="0.85"/>
  <polygon points="202,286 211,282 208,291" fill="#69a99e"/>
  <text x="320" y="307" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f827b">Geri bildirim döngüsü</text>
</svg>