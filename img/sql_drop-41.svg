<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="220" y="18" width="200" height="38" rx="19" fill="#e8f0fe" filter="url(#shadow)"/>
  <text x="320" y="42" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">DROP KOMUTU</text>

  <!-- Merkez düğüm -->
  <rect x="255" y="82" width="130" height="42" rx="10" fill="#d4e6f1" filter="url(#shadow)"/>
  <text x="320" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">SQL DROP</text>

  <!-- Ok: merkezden veritabanına -->
  <path d="M 290 124 L 150 165" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="150,165 160,158 155,170" fill="#5d6d7e"/>

  <!-- Ok: merkezden tabloya -->
  <path d="M 320 124 L 320 165" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="320,165 314,155 326,155" fill="#5d6d7e"/>

  <!-- Ok: merkezden indekse -->
  <path d="M 350 124 L 490 165" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="490,165 480,158 485,170" fill="#5d6d7e"/>

  <!-- Veritabanı kutusu -->
  <rect x="60" y="165" width="180" height="52" rx="8" fill="#fadbd8" filter="url(#shadowLight)"/>
  <text x="150" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#922b21">DROP DATABASE</text>
  <text x="150" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6c3483">veritabani_adi</text>

  <!-- Tablo kutusu -->
  <rect x="240" y="165" width="160" height="52" rx="8" fill="#d5f5e3" filter="url(#shadowLight)"/>
  <text x="320" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e8449">DROP TABLE</text>
  <text x="320" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6c3483">tablo_adi</text>

  <!-- İndeks kutusu -->
  <rect x="420" y="165" width="160" height="52" rx="8" fill="#fdebd0" filter="url(#shadowLight)"/>
  <text x="500" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#a04000">DROP INDEX</text>
  <text x="500" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6c3483">indeks_adi</text>

  <!-- Alt platform kutuları -->
  <rect x="80" y="245" width="140" height="34" rx="6" fill="#eaf2f8" filter="url(#shadowLight)"/>
  <text x="150" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">MySQL</text>

  <rect x="250" y="245" width="140" height="34" rx="6" fill="#eaf2f8" filter="url(#shadowLight)"/>
  <text x="320" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">DB2 / Oracle</text>

  <rect x="420" y="245" width="140" height="34" rx="6" fill="#eaf2f8" filter="url(#shadowLight)"/>
  <text x="490" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">MSSQL</text>

  <!-- Alt bağlantı çizgileri -->
  <path d="M 150 217 L 150 245" stroke="#aab7b8" stroke-width="1.5" fill="none"/>
  <path d="M 320 217 L 320 245" stroke="#aab7b8" stroke-width="1.5" fill="none"/>
  <path d="M 490 217 L 490 245" stroke="#aab7b8" stroke-width="1.5" fill="none"/>

  <!-- Alt açıklama -->
  <text x="320" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">ALTER TABLE tablo_adi DROP INDEX indeks_adi (MySQL)</text>
</svg>