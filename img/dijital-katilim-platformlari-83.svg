<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7189d8"/>
      <stop offset="100%" stop-color="#9078c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#60728d" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#60728d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="116" fill="#dfeafa" opacity="0.52"/>
  <circle cx="320" cy="160" r="91" fill="none" stroke="#bfcfe2" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- bağlantı çizgileri -->
  <path d="M267 132 L174 91" fill="none" stroke="#8ea2bd" stroke-width="2"/>
  <polygon points="174,91 184,89 180,98" fill="#8ea2bd"/>
  <path d="M373 132 L466 91" fill="none" stroke="#8ea2bd" stroke-width="2"/>
  <polygon points="466,91 456,98 452,89" fill="#8ea2bd"/>
  <path d="M320 218 L320 254" fill="none" stroke="#8ea2bd" stroke-width="2"/>
  <polygon points="320,254 315,244 325,244" fill="#8ea2bd"/>

  <!-- üst sol platform -->
  <g filter="url(#shadow)">
    <rect x="42" y="43" width="158" height="96" rx="18" fill="#ffffff"/>
    <rect x="42" y="43" width="158" height="30" rx="18" fill="#dce7ff"/>
    <rect x="42" y="58" width="158" height="15" fill="#dce7ff"/>
  </g>
  <circle cx="68" cy="92" r="15" fill="#7f96dc"/>
  <path d="M61 92 h14 M68 85 v14" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="91" y="67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425273">Decidim</text>
  <text x="91" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d6b7e">Katılım döngüsü</text>
  <text x="91" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d6b7e">Bütçe · toplantı</text>

  <!-- üst sağ platform -->
  <g filter="url(#shadow)">
    <rect x="440" y="43" width="158" height="96" rx="18" fill="#ffffff"/>
    <rect x="440" y="43" width="158" height="30" rx="18" fill="#e6dcf5"/>
    <rect x="440" y="58" width="158" height="15" fill="#e6dcf5"/>
  </g>
  <circle cx="466" cy="92" r="15" fill="#9276bb"/>
  <path d="M459 95 L464 100 L475 86" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="489" y="67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#54436d">CONSUL</text>
  <text x="489" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#675b75">Öneri ve oylama</text>
  <text x="489" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#675b75">Destek eşiği</text>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="160" r="59" fill="url(#core)"/>
    <circle cx="320" cy="160" r="48" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.45"/>
  </g>
  <circle cx="320" cy="141" r="11" fill="#ffffff" opacity="0.95"/>
  <path d="M298 180 C302 163 338 163 342 180" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Vatandaş</text>

  <!-- alt platform -->
  <g filter="url(#shadow)">
    <rect x="241" y="251" width="158" height="57" rx="18" fill="#ffffff"/>
    <rect x="241" y="251" width="58" height="57" rx="18" fill="#d8f0e5"/>
    <rect x="281" y="251" width="18" height="57" fill="#d8f0e5"/>
  </g>
  <path d="M270 264 C261 264 257 271 257 277 C257 287 270 297 270 297 C270 297 283 287 283 277 C283 271 279 264 270 264 Z" fill="#50a886"/>
  <circle cx="270" cy="277" r="4" fill="#ffffff"/>
  <text x="315" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f755f">FixMyStreet</text>
  <text x="315" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#59766a">Harita bildirimi</text>

  <!-- sağ sonuç -->
  <path d="M383 177 L529 177" fill="none" stroke="#7f99a6" stroke-width="2"/>
  <polygon points="529,177 519,172 519,182" fill="#7f99a6"/>
  <g filter="url(#smallShadow)">
    <rect x="493" y="154" width="112" height="47" rx="14" fill="#fffdf8"/>
  </g>
  <path d="M512 174 h18 M512 181 h12" stroke="#d29c54" stroke-width="2" stroke-linecap="round"/>
  <text x="541" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6e5b3f">Kurum</text>
  <text x="541" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80735f">İnceleme</text>

  <!-- durum etiketi -->
  <g filter="url(#smallShadow)">
    <rect x="29" y="174" width="166" height="44" rx="15" fill="#ffffff"/>
  </g>
  <circle cx="51" cy="196" r="7" fill="#e3b45a"/>
  <text x="66" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#657386">Doğrulama</text>
  <text x="66" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a8798">Tekil destek · gizlilik</text>

  <path d="M195 196 L251 178" fill="none" stroke="#a3b4c1" stroke-width="1.5" stroke-dasharray="3 4"/>
  <polygon points="251,178 242,176 245,185" fill="#a3b4c1"/>
</svg>