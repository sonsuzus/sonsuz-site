<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Fonksiyon Yapısı</text>

  <!-- Merkez fonksiyon bloğu -->
  <rect x="220" y="105" width="200" height="80" rx="12" fill="#4a90d9" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">FONKSİYON</text>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f0fe">ad + işlem satırları</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#d0e0f5">(zorunlu)</text>

  <!-- Üst: veri-türü -->
  <rect x="60" y="50" width="140" height="48" rx="10" fill="#e8a87c" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="130" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2c1a">veri-türü</text>
  <text x="130" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a3a28">isteğe bağlı</text>

  <!-- Üst ok: veri-türü -> fonksiyon -->
  <path d="M 200 74 L 218 74" stroke="#5a3a28" stroke-width="1.8" fill="none"/>
  <polygon points="220,74 212,69 212,79" fill="#5a3a28"/>

  <!-- Sağ: parametreler -->
  <rect x="460" y="50" width="140" height="48" rx="10" fill="#7fc8a9" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="530" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a2a">parametreler</text>
  <text x="530" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a4a3a">isteğe bağlı</text>

  <!-- Sağ ok: parametreler -> fonksiyon -->
  <path d="M 460 74 L 422 74" stroke="#1a3a2a" stroke-width="1.8" fill="none"/>
  <polygon points="420,74 428,69 428,79" fill="#1a3a2a"/>

  <!-- Alt: return -->
  <rect x="460" y="210" width="140" height="48" rx="10" fill="#f7d794" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="530" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a10">return ifade</text>
  <text x="530" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a20">isteğe bağlı</text>

  <!-- Alt ok: return <- fonksiyon -->
  <path d="M 320 185 L 320 208" stroke="#4a3a10" stroke-width="1.8" fill="none"/>
  <polygon points="320,210 315,202 325,202" fill="#4a3a10"/>

  <!-- Sol: işlem satırları -->
  <rect x="60" y="210" width="140" height="48" rx="10" fill="#f08a8a" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="130" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a1a1a">işlem satırları</text>
  <text x="130" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a2a2a">zorunlu</text>

  <!-- Sol ok: işlem satırları -> fonksiyon -->
  <path d="M 200 234 L 218 234" stroke="#4a1a1a" stroke-width="1.8" fill="none"/>
  <polygon points="220,234 212,229 212,239" fill="#4a1a1a"/>

  <!-- Alt bilgi: çağrı -->
  <rect x="220" y="270" width="200" height="36" rx="10" fill="#9b9bd9" opacity="0.7" filter="url(#shadowLight)"/>
  <text x="320" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a2a4a">fonksiyon-adı() ile çağrılır</text>

  <!-- Bağlantı çizgisi: fonksiyon -> çağrı -->
  <path d="M 320 185 L 320 268" stroke="#4a4a8a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="320,270 315,262 325,262" fill="#4a4a8a"/>

</svg>