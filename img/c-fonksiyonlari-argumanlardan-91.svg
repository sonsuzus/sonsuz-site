<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#d8f1e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71829a" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71829a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="60" cy="42" r="58" fill="#dcefff" opacity="0.5"/>
  <circle cx="595" cy="278" r="76" fill="#dff3e4" opacity="0.55"/>

  <text x="32" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#476079">C Fonksiyonları</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a3">Parçala · çağır · tekrar kullan</text>

  <!-- left input cards -->
  <rect x="34" y="94" width="146" height="67" rx="15" fill="#fffdf9" filter="url(#softShadow)"/>
  <rect x="34" y="94" width="7" height="67" rx="4" fill="#8dbce8"/>
  <text x="55" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365675">Prototip</text>
  <text x="55" y="141" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667e91">İmza bildirimi</text>

  <rect x="34" y="183" width="146" height="67" rx="15" fill="#fffdf9" filter="url(#softShadow)"/>
  <rect x="34" y="183" width="7" height="67" rx="4" fill="#a9c996"/>
  <text x="55" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426342">Argümanlar</text>
  <text x="55" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667e72">Değer veya adres</text>

  <!-- arrows left to core -->
  <path d="M180 127 H216" fill="none" stroke="#87a9c6" stroke-width="2"/>
  <polygon points="216,127 208,122 208,132" fill="#87a9c6"/>
  <path d="M180 216 H216" fill="none" stroke="#95b989" stroke-width="2"/>
  <polygon points="216,216 208,211 208,221" fill="#95b989"/>

  <!-- core -->
  <rect x="219" y="84" width="186" height="176" rx="25" fill="url(#core)" filter="url(#shadow)"/>
  <rect x="234" y="99" width="156" height="39" rx="12" fill="#ffffff" opacity="0.82"/>
  <text x="312" y="123" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31536f">Fonksiyon</text>

  <path d="M254 159 H370" stroke="#9ab6cb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="266" cy="178" r="11" fill="#a9c8ec"/>
  <text x="266" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">P</text>
  <text x="286" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405f77">Parametre</text>

  <circle cx="266" cy="215" r="11" fill="#9dcea8"/>
  <text x="266" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">R</text>
  <text x="286" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405f77">Dönüş değeri</text>

  <!-- arrows core to right -->
  <path d="M405 128 H438 V105 H456" fill="none" stroke="#b59cc8" stroke-width="2"/>
  <polygon points="456,105 448,100 448,110" fill="#b59cc8"/>
  <path d="M405 211 H438 V234 H456" fill="none" stroke="#d19f83" stroke-width="2"/>
  <polygon points="456,234 448,229 448,239" fill="#d19f83"/>

  <!-- right recursion -->
  <rect x="457" y="69" width="150" height="75" rx="16" fill="#fdfaff" filter="url(#softShadow)"/>
  <rect x="457" y="69" width="150" height="8" rx="4" fill="#c7addd"/>
  <text x="477" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#654d79">Özyineleme</text>
  <text x="477" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6988">Küçük problem</text>
  <path d="M575 106 C590 106 591 128 573 130" fill="none" stroke="#a88abe" stroke-width="1.5"/>
  <polygon points="573,130 580,124 581,133" fill="#a88abe"/>

  <!-- right output -->
  <rect x="457" y="196" width="150" height="75" rx="16" fill="#fffdf9" filter="url(#softShadow)"/>
  <rect x="457" y="196" width="150" height="8" rx="4" fill="#e2b396"/>
  <text x="477" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#835b45">Tekrar kullanım</text>
  <text x="477" y="249" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7467">Okunur kod</text>

  <!-- base condition badge -->
  <rect x="467" y="154" width="130" height="27" rx="13" fill="#ffffff" opacity="0.88" filter="url(#softShadow)"/>
  <circle cx="483" cy="167.5" r="6" fill="#8fc6a0"/>
  <text x="495" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7058">Taban durum</text>

  <!-- bottom guide -->
  <path d="M83 284 H556" stroke="#cbdbe3" stroke-width="1.5"/>
  <circle cx="158" cy="284" r="5" fill="#8dbce8"/>
  <circle cx="320" cy="284" r="5" fill="#9dcea8"/>
  <circle cx="482" cy="284" r="5" fill="#c7addd"/>
  <text x="158" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62798b">Çağrı</text>
  <text x="320" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62798b">İşleme</text>
  <text x="482" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62798b">Sonuç</text>
</svg>