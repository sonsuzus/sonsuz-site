<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="tahta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <linearGradient id="maske" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcff"/>
      <stop offset="100%" stop-color="#d6efff"/>
    </linearGradient>
    <linearGradient id="durum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5d9"/>
      <stop offset="100%" stop-color="#e9f7d9"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890aa" flood-opacity="0.22"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890aa" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
