    <text x="525" y="73" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b9a72">8 × 8,125 kW</text>

    <rect x="480" y="101" width="130" height="43" rx="13" fill="#ffffff"/>
    <rect x="491" y="111" width="23" height="22" rx="7" fill="#fbe0e6"/>
    <path d="M494 128 L497 118 L507 118 L511 128 Z M496 128 L496 131 L500 131 L500 128 M506 128 L506 131 L510 131 L510 128" fill="none" stroke="#c6637e" stroke-width="1.7"/>
