<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b9fe8"/>
      <stop offset="100%" stop-color="#637ec9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="324" cy="159" r="118" fill="#dbeafe" opacity="0.30"/>
  <circle cx="324" cy="159" r="85" fill="#e9f7e9" opacity="0.34"/>

  <!-- Tesis girişi -->
  <g filter="url(#soft)">
    <rect x="28" y="42" width="142" height="62" rx="16" fill="#ffffff"/>
    <rect x="39" y="54" width="33" height="38" rx="9" fill="#d7e8ff"/>
    <path d="M55 59 L47 75 L55 75 L51 87 L65 69 L57 69 L62 59 Z" fill="#4f7ed4"/>
    <text x="83" y="68" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155" font-weight="600">Tesis Sınırı</text>
    <text x="83" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">120 kW</text>
  </g>

  <!-- Bina yükleri -->
  <g filter="url(#soft)">
    <rect x="28" y="209" width="142" height="68" rx="16" fill="#ffffff"/>
    <rect x="39" y="222" width="34" height="42" rx="9" fill="#fde9c8"/>
    <path d="M48 255 L48 234 L56 228 L65 234 L65 255 Z M53 241 L57 241 L57 246 L53 246 Z M60 241 L63 241 L63 246 L60 246 Z" fill="#ce8a31"/>
    <text x="83" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155" font-weight="600">Diğer Yükler</text>
    <text x="83" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Anlık ölçüm</text>
  </g>

  <!-- Bağlantılar -->
  <path d="M170 73 C209 73 209 116 251 127" fill="none" stroke="#91a9d8" stroke-width="2.5"/>
  <polygon points="250,121 263,130 247,134" fill="#91a9d8"/>
  <path d="M170 243 C211 243 214 204 251 190" fill="none" stroke="#d1a365" stroke-width="2.5"/>
  <polygon points="248,183 263,187 253,198" fill="#d1a365"/>

  <!-- Kontrol çekirdeği -->
  <g filter="url(#shadow)">
    <rect x="258" y="105" width="145" height="112" rx="25" fill="url(#core)"/>
    <circle cx="330" cy="139" r="21" fill="#ffffff" opacity="0.20"/>
    <path d="M330 120 L322 139 L330 139 L326 157 L340 135 L332 135 L337 120 Z" fill="#ffffff"/>
    <text x="330" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Akıllı Dengeleme</text>
    <text x="330" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e8efff">Bütçe ve öncelik</text>
