    <text x="525" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a74f69">Ağırlıklı paylaşım</text>

    <rect x="480" y="176" width="130" height="43" rx="13" fill="#ffffff"/>
    <rect x="491" y="186" width="23" height="22" rx="7" fill="#e7defb"/>
    <path d="M495 201 C497 192 508 192 510 201 M498 196 L503 191 L508 196 M503 191 L503 204" fill="none" stroke="#8065bc" stroke-width="1.7"/>
    <text x="525" y="195" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155" font-weight="600">Güvenlik Payı</text>
    <text x="525" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7258a7">Rezerv korunur</text>

    <rect x="480" y="239" width="130" height="43" rx="13" fill="#ffffff"/>
    <rect x="491" y="249" width="23" height="22" rx="7" fill="#d9f0f4"/>
    <path d="M496 260 L510 260 M503 253 L503 267 M497 267 L509 267" fill="none" stroke="#438b9a" stroke-width="1.7"/>
    <text x="525" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155" font-weight="600">Şebeke</text>
    <text x="525" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#418090">Tepe talep azalır</text>
  </g>

  <!-- Dal çizgileri -->
  <path d="M459 60 L480 60 M459 123 L480 123 M459 198 L480 198 M459 261 L480 261" fill="none" stroke="#9bb0df" stroke-width="2"/>
  <polygon points="477,55 486,60 477,65" fill="#9bb0df"/>
  <polygon points="477,118 486,123 477,128" fill="#9bb0df"/>
  <polygon points="477,193 486,198 477,203" fill="#9bb0df"/>
  <polygon points="477,256 486,261 477,266" fill="#9bb0df"/>

  <!-- Alt bilgi -->
  <g filter="url(#soft)">
    <rect x="202" y="267" width="218" height="33" rx="14" fill="#ffffff" opacity="0.94"/>
    <circle cx="221" cy="283.5" r="7" fill="#73b98d"/>
    <path d="M218 284 L221 287 L226 280" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="237" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6070">Güvenli • Adil • Zamanında</text>
  </g>
