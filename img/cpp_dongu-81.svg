<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="mainBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e4fc"/>
    </linearGradient>
    <linearGradient id="forBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="whileBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="doWhileBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Döngüler</text>

  <!-- Ana kavram kutusu -->
  <rect x="220" y="55" width="200" height="50" rx="12" fill="url(#mainBox)" filter="url(#shadow)" stroke="#a0b8d8" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">Döngü Kavramı</text>
  <text x="320" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7c">Koşula bağlı tekrar</text>

  <!-- Alt başlık -->
  <text x="320" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6a8c">3 Farklı Döngü Türü</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Ana kutu -> for -->
  <path d="M 270 105 L 130 155" stroke="#5a8a5a" stroke-width="2" fill="none"/>
  <polygon points="130,160 126,150 134,150" fill="#5a8a5a"/>

  <!-- Ana kutu -> while -->
  <path d="M 320 105 L 320 155" stroke="#e67e22" stroke-width="2" fill="none"/>
  <polygon points="320,160 316,150 324,150" fill="#e67e22"/>

  <!-- Ana kutu -> do-while -->
  <path d="M 370 105 L 510 155" stroke="#c0506a" stroke-width="2" fill="none"/>
  <polygon points="510,160 506,150 514,150" fill="#c0506a"/>

  <!-- for döngüsü kutusu -->
  <rect x="40" y="160" width="180" height="65" rx="12" fill="url(#forBox)" filter="url(#shadow)" stroke="#7cb87c" stroke-width="1.5"/>
  <text x="130" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2d5a2d">for</text>
  <text x="130" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">başlangıç; koşul;</text>
  <text x="130" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">artırma/azaltma</text>

  <!-- while döngüsü kutusu -->
  <rect x="240" y="160" width="160" height="65" rx="12" fill="url(#whileBox)" filter="url(#shadow)" stroke="#d4a050" stroke-width="1.5"/>
  <text x="320" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#7a4a10">while</text>
  <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a20">koşul sağlandıkça</text>
  <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a20">tekrarla</text>

  <!-- do-while döngüsü kutusu -->
  <rect x="430" y="160" width="180" height="65" rx="12" fill="url(#doWhileBox)" filter="url(#shadow)" stroke="#c07080" stroke-width="1.5"/>
  <text x="520" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#7a2040">do-while</text>
  <text x="520" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a3050">önce işlem yap</text>
  <text x="520" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a3050">sonra koşulu kontrol et</text>

  <!-- Alt bilgi -->
  <rect x="170" y="250" width="300" height="45" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadow)"/>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7c">Tekrarlı işlemler için pratik çözüm</text>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7c">Kod bloğu bir koşula bağlı olarak çalışır</text>
</svg>