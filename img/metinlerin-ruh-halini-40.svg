<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#cbe2fa"/>
    </linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9ddff"/>
      <stop offset="100%" stop-color="#d7c4f4"/>
    </linearGradient>
    <linearGradient id="score" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0c9"/>
      <stop offset="100%" stop-color="#f7daa0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="585" cy="42" r="68" fill="#d8f1e3" opacity="0.42"/>
  <circle cx="62" cy="292" r="78" fill="#d9eafe" opacity="0.48"/>

  <text x="28" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536a">DUYGU ANALİZİ MOTORU</text>
  <text x="28" y="51" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718197">Sözlük tabanlı ve açıklanabilir akış</text>

  <g filter="url(#shadow)">
    <rect x="28" y="105" width="112" height="108" rx="18" fill="url(#input)"/>
    <rect x="42" y="121" width="35" height="35" rx="10" fill="#ffffff" opacity="0.72"/>
    <path d="M51 132h17M51 138h13M51 144h17" fill="none" stroke="#5681ae" stroke-width="2" stroke-linecap="round"/>
    <text x="42" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334d69">Ham Metin</text>
    <text x="42" y="196" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55718e">“Harika değil”</text>
  </g>

  <path d="M140 159H165" fill="none" stroke="#7891aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="171,159 162,154 162,164" fill="#7891aa"/>

  <g filter="url(#shadow)">
    <rect x="173" y="105" width="125" height="108" rx="18" fill="#d8f0ed"/>
    <circle cx="200" cy="139" r="17" fill="#ffffff" opacity="0.74"/>
    <path d="M192 139h16M200 131v16" stroke="#49948c" stroke-width="2" stroke-linecap="round"/>
    <text x="191" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315e5b">Normalizasyon</text>
    <text x="191" y="196" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f807c">küçült • temizle • böl</text>
  </g>

  <path d="M298 159H323" fill="none" stroke="#7891aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="329,159 320,154 320,164" fill="#7891aa"/>

  <g filter="url(#shadow)">
    <rect x="331" y="70" width="145" height="178" rx="20" fill="url(#process)"/>
    <text x="351" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#493765">Puanlama Çekirdeği</text>
    <rect x="348" y="112" width="110" height="38" rx="10" fill="#ffffff" opacity="0.72"/>
    <text x="360" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#594676">harika  +2</text>
    <rect x="348" y="158" width="110" height="38" rx="10" fill="#ffffff" opacity="0.72"/>
    <text x="360" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#594676">iyi  +1</text>
    <rect x="348" y="204" width="110" height="28" rx="10" fill="#bfa7e5" opacity="0.7"/>
    <text x="360" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#493765">değil → ters çevir</text>
  </g>

  <path d="M476 159H497" fill="none" stroke="#7891aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="503,159 494,154 494,164" fill="#7891aa"/>

