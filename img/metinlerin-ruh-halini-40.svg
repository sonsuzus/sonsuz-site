    <rect x="505" y="112" width="105" height="94" rx="18" fill="url(#score)"/>
    <circle cx="528" cy="139" r="13" fill="#ffffff" opacity="0.72"/>
    <text x="524" y="144" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a6a16">Σ</text>
    <text x="524" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#69501f">Toplam Skor</text>
    <text x="524" y="191" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6c31">S = -2</text>
  </g>

  <path d="M558 206V235" fill="none" stroke="#7891aa" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M558 235H510V250M558 235H558V250M558 235H606V250" fill="none" stroke="#7891aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="510,256 505,247 515,247" fill="#7891aa"/>
  <polygon points="558,256 553,247 563,247" fill="#7891aa"/>
  <polygon points="606,256 601,247 611,247" fill="#7891aa"/>

  <g filter="url(#shadow)">
    <rect x="470" y="258" width="78" height="38" rx="13" fill="#f8cfd2"/>
    <text x="483" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a3942">Negatif</text>
    <rect x="552" y="258" width="60" height="38" rx="13" fill="#dce6ed"/>
    <text x="563" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526675">Nötr</text>
    <rect x="616" y="258" width="1" height="1" rx="0" fill="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="552" y="258" width="60" height="38" rx="13" fill="#d5efdb"/>
    <text x="561" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36714a">Pozitif</text>
  </g>

  <path d="M606 250V256" fill="none" stroke="#7891aa" stroke-width="2.5"/>
  <g filter="url(#shadow)">
    <rect x="552" y="258" width="60" height="38" rx="13" fill="#dce6ed"/>
    <text x="563" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526675">Nötr</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="616" y="258" width="0" height="0" rx="0" fill="none"/>
