  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38566b">Matris Zinciri Optimizasyonu</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66808e">En düşük maliyetli parantezleme</text>

