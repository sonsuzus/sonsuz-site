    <text x="90" y="18" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#658194">m</text>
    <text x="50" y="50" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34795d">min</text>
    <text x="88" y="50" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527a62">+</text>
    <text x="88" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a6714">7500</text>
    <path d="M57 62 L91 88" fill="none" stroke="#58a57e" stroke-width="2.5"/>
