  <text x="518" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6824">A₁ (A₂ A₃)</text>

  <circle cx="493" cy="139" r="5" fill="#4bae7b"/>
  <circle cx="493" cy="197" r="5" fill="#dcad54"/>
  <text x="507" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#367458">Minimum: 7.500</text>
  <text x="507" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718895">O(n³) zaman</text>
