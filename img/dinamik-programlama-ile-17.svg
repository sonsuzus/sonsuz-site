  <text x="56" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426478">A₃</text>
  <text x="106" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426478">pᵢ₋₁ × pᵢ</text>

