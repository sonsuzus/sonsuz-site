<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">C Programlama Alıştırmalar</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b7a9d">Sayı Sistemleri ve Dönüşümler</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="130" width="150" height="44" rx="22" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">Sayı Sistemleri</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3b5b8a">Temel Kavramlar</text>

  <!-- Sol üst: İşaretsiz -->
  <rect x="40" y="70" width="150" height="44" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="115" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">İşaretsiz İkilik</text>
  <text x="115" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#92400e">8 bit: 0 - 255</text>

  <!-- Sol alt: İşaretli -->
  <rect x="40" y="200" width="150" height="44" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.5"/>
  <text x="115" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">İşaretli İkilik</text>
  <text x="115" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#065f46">1, 2, 4 ve 8 byte</text>

  <!-- Sağ üst: İkiye Tümleyen -->
  <rect x="450" y="70" width="150" height="44" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="525" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">2'ye Tümleyen</text>
  <text x="525" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9d174d">Negatif sayı gösterimi</text>

  <!-- Sağ alt: 16'lık Sistem -->
  <rect x="450" y="200" width="150" height="44" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="525" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">16'lık Sistem</text>
  <text x="525" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3730a3">Onaltılık dönüşüm</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Merkez -> Sol üst -->
  <path d="M245,145 L200,110" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="195,106 205,108 200,115" fill="#94a3b8"/>

  <!-- Merkez -> Sol alt -->
  <path d="M245,165 L200,220" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="195,224 205,222 200,215" fill="#94a3b8"/>

  <!-- Merkez -> Sağ üst -->
  <path d="M395,145 L440,110" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="445,106 435,108 440,115" fill="#94a3b8"/>

  <!-- Merkez -> Sağ alt -->
  <path d="M395,165 L440,220" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <polygon points="445,224 435,222 440,215" fill="#94a3b8"/>

  <!-- Alt bilgi etiketleri -->
  <rect x="155" y="280" width="330" height="28" rx="14" fill="#e2e8f0" opacity="0.7"/>
  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">Alıştırmalar: dönüşümler, aralıklar ve tümleyenler</text>

  <!-- Küçük dekoratif öğeler -->
  <circle cx="30" cy="30" r="4" fill="#93c5fd" opacity="0.5"/>
  <circle cx="610" cy="30" r="4" fill="#fcd34d" opacity="0.5"/>
  <circle cx="30" cy="290" r="4" fill="#6ee7b7" opacity="0.5"/>
  <circle cx="610" cy="290" r="4" fill="#f9a8d4" opacity="0.5"/>
</svg>