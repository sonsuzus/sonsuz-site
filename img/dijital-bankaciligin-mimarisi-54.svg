<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="mobil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c7ddfa"/>
    </linearGradient>
    <linearGradient id="servis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5f6ea"/>
      <stop offset="100%" stop-color="#c9ebd3"/>
    </linearGradient>
    <linearGradient id="veri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2d5"/>
      <stop offset="100%" stop-color="#f8deb2"/>
    </linearGradient>
    <linearGradient id="dis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e5fb"/>
      <stop offset="100%" stop-color="#dfc9f3"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6f87a0" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#73889b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="84" cy="45" r="60" fill="#d9ecff" opacity="0.45"/>
  <circle cx="580" cy="278" r="82" fill="#dff1d8" opacity="0.5"/>

  <text x="30" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566d">GERÇEK ZAMANLI PARA TRANSFERİ</text>
  <text x="30" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718397">Güvenli istekten muhasebe kaydına</text>

  <!-- Bağlantılar -->
  <path d="M119 157 H145" fill="none" stroke="#7c9ab7" stroke-width="2"/>
  <polygon points="145,157 137,152 137,162" fill="#7c9ab7"/>
  <path d="M255 157 H280" fill="none" stroke="#7c9ab7" stroke-width="2"/>
  <polygon points="280,157 272,152 272,162" fill="#7c9ab7"/>
  <path d="M410 157 H436" fill="none" stroke="#7c9ab7" stroke-width="2"/>
  <polygon points="436,157 428,152 428,162" fill="#7c9ab7"/>
  <path d="M526 157 H550" fill="none" stroke="#7c9ab7" stroke-width="2"/>
  <polygon points="550,157 542,152 542,162" fill="#7c9ab7"/>

  <!-- Mobil -->
  <g filter="url(#golge)">
    <rect x="30" y="103" width="89" height="108" rx="18" fill="url(#mobil)" stroke="#aec9e8"/>
    <rect x="54" y="116" width="40" height="67" rx="7" fill="#f9fcff" stroke="#a9c5e2"/>
    <circle cx="74" cy="174" r="3" fill="#9eb9d7"/>
    <rect x="60" y="126" width="28" height="5" rx="2.5" fill="#78a5d2"/>
    <rect x="60" y="137" width="20" height="4" rx="2" fill="#c1d6eb"/>
    <rect x="60" y="147" width="28" height="14" rx="4" fill="#8ab9e2"/>
    <text x="74.5" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365878">Mobil Uygulama</text>
  </g>

  <!-- Gateway -->
  <g filter="url(#golge)">
    <rect x="145" y="103" width="110" height="108" rx="18" fill="#e8f1fa" stroke="#bfd2e5"/>
    <path d="M177 133 L200 121 L223 133 V153 C223 169 213 179 200 184 C187 179 177 169 177 153 Z" fill="#85abd0" opacity="0.9"/>
    <path d="M191 151 L197 157 L209 143" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365878">API Geçidi</text>
    <text x="200" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667d91">Kimlik ve limit</text>
  </g>

  <!-- Transfer Servisi -->
  <g filter="url(#golge)">
    <rect x="280" y="82" width="130" height="150" rx="20" fill="url(#servis)" stroke="#acd7b8"/>
    <circle cx="345" cy="124" r="25" fill="#ffffff" opacity="0.77"/>
    <path d="M333 125 H357" fill="none" stroke="#4d9870" stroke-width="3" stroke-linecap="round"/>
    <polygon points="357,125 350,120 350,130" fill="#4d9870"/>
    <path d="M357 137 H333" fill="none" stroke="#4d9870" stroke-width="3" stroke-linecap="round"/>
    <polygon points="333,137 340,132 340,142" fill="#4d9870"/>
    <text x="345" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#326448">Transfer Servisi</text>
    <text x="345" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#528064">Yetki • Bakiye • Risk</text>
    <rect x="300" y="210" width="90" height="12" rx="6" fill="#ffffff" opacity="0.72"/>
    <text x="345" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557866">Tekil işlem anahtarı</text>
  </g>

  <!-- Defter -->
  <g filter="url(#golge)">
    <rect x="436" y="103" width="90" height="108" rx="18" fill="url(#veri)" stroke="#e7c884"/>
    <ellipse cx="481" cy="128" rx="24" ry="8" fill="#e9bd66"/>
    <path d="M457 128 V164 C457 169 468 173 481 173 C494 173 505 169 505 164 V128" fill="#f3d28e"/>
    <path d="M457 146 C457 151 468 155 481 155 C494 155 505 151 505 146" fill="none" stroke="#d6a64d"/>
    <path d="M457 164 C457 169 468 173 481 173 C494 173 505 169 505 164" fill="none" stroke="#d6a64d"/>
    <text x="481" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#815c20">Çift Taraflı Defter</text>
  </g>

  <!-- Ağ -->
  <g filter="url(#golge)">
    <rect x="550" y="103" width="65" height="108" rx="18" fill="url(#dis)" stroke="#c9abdF"/>
    <circle cx="582.5" cy="133" r="13" fill="#ffffff" opacity="0.8"/>
    <circle cx="582.5" cy="133" r="6" fill="#a375cc"/>
    <path d="M567 159 H598" stroke="#a375cc" stroke-width="2" stroke-linecap="round"/>
    <path d="M567 168 H592" stroke="#c5a7df" stroke-width="2" stroke-linecap="round"/>
    <text x="582.5" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#714a91">Ödeme Ağı</text>
  </g>

  <!-- Olay hattı -->
  <path d="M345 232 V261 H427" fill="none" stroke="#72a18b" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="427,261 419,256 419,266" fill="#72a18b"/>
  <g filter="url(#hafifGolge)">
    <rect x="428" y="242" width="86" height="38" rx="12" fill="#ffffff" stroke="#c7dfd0"/>
    <circle cx="445" cy="261" r="7" fill="#92c5a5"/>
    <path d="M442 261 H448" stroke="#ffffff" stroke-width="1.5"/>
    <text x="477" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456b55">Olay Kuyruğu</text>
  </g>
  <path d="M514 261 H535" fill="none" stroke="#72a18b" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="535,261 527,256 527,266" fill="#72a18b"/>
  <g filter="url(#hafifGolge)">
    <rect x="536" y="242" width="78" height="38" rx="12" fill="#ffffff" stroke="#c7dfd0"/>
    <text x="575" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456b55">Bildirim</text>
    <text x="575" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456b55">ve İzleme</text>
  </g>

  <!-- Alt bilgi -->
  <g opacity="0.9">
    <circle cx="42" cy="276" r="8" fill="#8aafd2"/>
    <path d="M38 276 L41 279 L46 273" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="57" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60788b">Şifreli erişim</text>
    <circle cx="174" cy="276" r="8" fill="#8fc39f"/>
    <path d="M170 276 H178 M174 272 V280" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="189" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60788b">İzlenebilir akış</text>
    <circle cx="333" cy="276" r="8" fill="#e2b86d"/>
    <path d="M329 276 H337" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="348" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60788b">Dengeli kayıt</text>
  </g>
</svg>