<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="decor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4d9ff"/>
      <stop offset="100%" stop-color="#d2e9ff"/>
    </linearGradient>
    <linearGradient id="proxy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4c7"/>
      <stop offset="100%" stop-color="#fff1bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#63738a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#63738a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="63" cy="42" r="76" fill="#cceaf0" opacity="0.32"/>
  <circle cx="591" cy="288" r="96" fill="#ddeac9" opacity="0.35"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45576d">AYNI ARAYÜZ • FARKLI NİYET</text>

  <!-- Client -->
  <g filter="url(#soft)">
    <rect x="24" y="127" width="96" height="66" rx="16" fill="#ffffff" stroke="#c8d8e7"/>
    <circle cx="52" cy="151" r="12" fill="#ccebf2"/>
    <circle cx="52" cy="148" r="4" fill="#5a91a1"/>
    <path d="M44 160 Q52 153 60 160" fill="none" stroke="#5a91a1" stroke-width="2" stroke-linecap="round"/>
    <text x="78" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#374b61">İstemci</text>
    <text x="78" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718296">çağrı</text>
  </g>

  <!-- Common contract -->
  <path d="M122 160 H178" fill="none" stroke="#6d87a0" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="178,160 169,155 169,165" fill="#6d87a0"/>

  <g filter="url(#shadow)">
    <rect x="181" y="112" width="125" height="96" rx="20" fill="#ffffff" stroke="#b8cddd" stroke-width="1.4"/>
    <rect x="202" y="127" width="83" height="25" rx="9" fill="#d9edf6"/>
    <text x="243.5" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356778">Arayüz</text>
    <path d="M211 166 H276" stroke="#a9bdcc" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M211 180 H264" stroke="#c3d1dc" stroke-width="1.5" stroke-linecap="round"/>
    <text x="243.5" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657a8d">aynı sözleşme</text>
  </g>

  <!-- split -->
  <path d="M307 160 H331 Q342 160 342 149 V91 H362" fill="none" stroke="#7b8da2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="362,91 353,86 353,96" fill="#7b8da2"/>
  <path d="M307 160 H331 Q342 160 342 171 V229 H362" fill="none" stroke="#7b8da2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="362,229 353,224 353,234" fill="#7b8da2"/>

  <!-- Decorator branch -->
  <g filter="url(#shadow)">
    <rect x="365" y="48" width="146" height="86" rx="18" fill="url(#decor)" stroke="#baa8e1"/>
    <circle cx="394" cy="77" r="17" fill="#ffffff" opacity="0.82"/>
    <path d="M394 66 L397 73 L405 74 L399 79 L401 87 L394 83 L387 87 L389 79 L383 74 L391 73 Z" fill="#8d72bd"/>
    <text x="450" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e3e70">Dekoratör</text>
    <text x="450" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#68557f">davranış ekler</text>
    <text x="450" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75658b">zincirlenebilir</text>
  </g>

  <path d="M512 91 H540" fill="none" stroke="#8974b2" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="540,91 531,86 531,96" fill="#8974b2"/>
  <g filter="url(#soft)">
    <rect x="543" y="57" width="77" height="68" rx="15" fill="#ffffff" stroke="#c9bce5"/>
    <text x="581.5" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e3e70">Gerçek</text>
    <text x="581.5" y="99" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#68557f">nesne</text>
  </g>

  <!-- Proxy branch -->
  <g filter="url(#shadow)">
    <rect x="365" y="186" width="146" height="86" rx="18" fill="url(#proxy)" stroke="#e2bc82"/>
    <circle cx="394" cy="215" r="17" fill="#ffffff" opacity="0.84"/>
    <rect x="386" y="214" width="16" height="12" rx="3" fill="#c4883d"/>
    <path d="M389 214 V210 A5 5 0 0 1 399 210 V214" fill="none" stroke="#c4883d" stroke-width="2"/>
    <text x="450" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#75512c">Proxy</text>
    <text x="450" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#84613c">erişimi yönetir</text>
    <text x="450" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#92704b">yetki • önbellek</text>
  </g>

  <path d="M512 229 H540" fill="none" stroke="#c08c47" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="540,229 531,224 531,234" fill="#c08c47"/>
  <g filter="url(#soft)">
    <rect x="543" y="195" width="77" height="68" rx="15" fill="#ffffff" stroke="#ead2ad"/>
    <text x="581.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#75512c">Gerçek</text>
    <text x="581.5" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#84613c">servis</text>
  </g>

  <!-- divider and note -->
  <path d="M355 160 H625" stroke="#d2dde1" stroke-width="1" stroke-dasharray="4 5" opacity="0.8"/>
  <g filter="url(#soft)">
    <rect x="177" y="239" width="148" height="43" rx="14" fill="#ffffff" opacity="0.9"/>
    <text x="251" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b6373">Yapı benzer</text>
    <text x="251" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718596">kararı niyet verir</text>
  </g>
</svg>