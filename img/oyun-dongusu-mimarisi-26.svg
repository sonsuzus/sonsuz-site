<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#dff6e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7792a8" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6b8797" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="545" cy="52" r="76" fill="#d9f1ed" opacity="0.45"/>
  <circle cx="72" cy="281" r="92" fill="#dfeaff" opacity="0.52"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34556b">OYUN DÖNGÜSÜ · SABİT FİZİK, AKICI GÖRÜNTÜ</text>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="30" y="112" width="116" height="72" rx="16" fill="#fff5d9" stroke="#efcf85"/>
    <circle cx="58" cy="139" r="15" fill="#ffe5a5"/>
    <path d="M51 139h14M58 132v14" stroke="#9a6c18" stroke-width="2.4" stroke-linecap="round"/>
    <text x="91" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#72531b">Girdi</text>
    <text x="91" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b6d32">her kare</text>
  </g>

  <!-- arrow input -->
  <path d="M146 148 H178" fill="none" stroke="#7793a0" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="178,143 188,148 178,153" fill="#7793a0"/>

  <!-- central loop -->
  <g filter="url(#shadow)">
    <rect x="188" y="72" width="254" height="156" rx="24" fill="url(#loopGrad)" stroke="#b7d6d7"/>
  </g>
  <text x="315" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356273">ZAMAN YÖNETİCİSİ</text>

  <!-- accumulator -->
  <g filter="url(#softShadow)">
    <rect x="218" y="116" width="96" height="80" rx="14" fill="#ffffff" stroke="#bfd6e5"/>
    <path d="M241 145h49" stroke="#c8d9e5" stroke-width="6" stroke-linecap="round"/>
    <path d="M241 145h33" stroke="#78bad1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="279" cy="145" r="5" fill="#ffffff" stroke="#4895b2" stroke-width="2"/>
    <text x="266" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356273">Birikim</text>
    <text x="266" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537887">kare süresi</text>
  </g>

  <!-- physics -->
  <g filter="url(#softShadow)">
    <rect x="330" y="116" width="84" height="80" rx="14" fill="#ffffff" stroke="#c7ddc8"/>
    <circle cx="372" cy="143" r="15" fill="#d9f2df"/>
    <path d="M363 151c4-12 14-12 19-1M364 137l5 4 5-7 6 5" fill="none" stroke="#4d9a69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="372" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397052">Fizik</text>
  </g>

  <path d="M314 156 H320 V156 H320" fill="none" stroke="#6d99a4" stroke-width="2"/>
  <polygon points="320,151 329,156 320,161" fill="#6d99a4"/>

  <text x="315" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#497284">sabit adım: 1 / 60 sn</text>

  <!-- right render -->
  <path d="M442 148 H471" fill="none" stroke="#7793a0" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="471,143 481,148 471,153" fill="#7793a0"/>

  <g filter="url(#shadow)">
    <rect x="481" y="88" width="129" height="120" rx="18" fill="#eee6ff" stroke="#d2c1ee"/>
    <rect x="505" y="110" width="81" height="48" rx="7" fill="#ffffff" stroke="#ad95d1"/>
    <path d="M511 151l18-17 12 10 11-13 18 20z" fill="#b9e5d3"/>
    <circle cx="559" cy="122" r="5" fill="#ffd889"/>
    <path d="M532 171h27" stroke="#9d85c7" stroke-width="3" stroke-linecap="round"/>
    <text x="545" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#654b91">Görüntü</text>
  </g>

  <!-- interpolation arc -->
  <path d="M372 116 C390 70 462 59 510 88" fill="none" stroke="#9b83c4" stroke-width="2" stroke-dasharray="5 5" opacity="0.8"/>
  <polygon points="503,85 513,89 505,96" fill="#9b83c4"/>
  <rect x="405" y="47" width="111" height="27" rx="13" fill="#ffffff" opacity="0.88" filter="url(#softShadow)"/>
  <text x="460" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#664b91">enterpolasyon</text>

  <!-- lower safeguards -->
  <g filter="url(#softShadow)">
    <rect x="137" y="258" width="176" height="38" rx="13" fill="#ffffff" stroke="#c6dce5"/>
    <circle cx="159" cy="277" r="10" fill="#d9edf5"/>
    <path d="M159 271v7M159 282h.1" stroke="#397a93" stroke-width="2" stroke-linecap="round"/>
    <text x="230" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416a7b">kare süresi sınırı</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="329" y="258" width="176" height="38" rx="13" fill="#ffffff" stroke="#cbe1d0"/>
    <circle cx="351" cy="277" r="10" fill="#dff3e5"/>
    <path d="M346 277l4 4 7-8" fill="none" stroke="#4b9870" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="425" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416d55">tutarlı simülasyon</text>
  </g>

  <path d="M266 228 V248" fill="none" stroke="#8aa6ae" stroke-width="1.8"/>
  <polygon points="261,246 266,254 271,246" fill="#8aa6ae"/>
  <path d="M372 228 V248" fill="none" stroke="#8aa6ae" stroke-width="1.8"/>
  <polygon points="367,246 372,254 377,246" fill="#8aa6ae"/>
</svg>