<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="ptr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#c9e0f7"/>
    </linearGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f5e9"/>
      <stop offset="1" stop-color="#d5ebdc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7d8b99" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#718096"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Tahoma, sans-serif; font-size: 12px; fill: #334155; }
      .title { font-size: 15px; font-weight: 600; fill: #26364a; }
      .small { font-size: 11px; }
      .box { stroke: #d5dee8; stroke-width: 1; }
      .line { fill: none; stroke: #718096; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #91a1b3; stroke-width: 1.6; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="640" height="320" rx="18" fill="url(#bg)"/>

<text x="320" y="28" text-anchor="middle" class="title">C++ İşaretçiler: Adres → Değer → Bellek</text>

  <!-- Stack -->

  <rect x="35" y="62" width="250" height="218" rx="18" fill="#ffffff" opacity=".82" class="box" filter="url(#shadow)"/>
  <text x="55" y="87" class="title">Değişkenler</text>

  <rect x="55" y="105" width="100" height="58" rx="12" fill="#fff3d9" class="box" filter="url(#shadow)"/>
  <text x="105" y="128" text-anchor="middle">sayi</text>
  <text x="105" y="149" text-anchor="middle" class="title">50</text>

  <rect x="55" y="190" width="100" height="58" rx="12" fill="url(#ptr)" class="box" filter="url(#shadow)"/>
  <text x="105" y="213" text-anchor="middle">ptr</text>
  <text x="105" y="234" text-anchor="middle" class="title">&amp;sayi</text>

  <!-- Address relationship -->

  <path d="M155 219 C195 219 195 143 155 143" class="line"/>
  <text x="205" y="183" text-anchor="middle" class="small">&amp; adres</text>

  <!-- Dereference -->

  <path d="M155 143 C215 143 215 219 155 219" class="dashed"/>
  <text x="215" y="165" text-anchor="middle" class="small">* değer</text>

  <!-- Memory -->

  <rect x="330" y="62" width="275" height="218" rx="18" fill="#ffffff" opacity=".82" class="box" filter="url(#shadow)"/>
  <text x="350" y="87" class="title">Bellek</text>

  <rect x="350" y="105" width="220" height="52" rx="12" fill="url(#mem)" class="box"/>
  <text x="370" y="126">Adres</text>
  <text x="550" y="126" text-anchor="end" class="small">0x7FF0</text>
  <text x="460" y="147" text-anchor="middle" class="title">50</text>

  <rect x="350" y="176" width="220" height="52" rx="12" fill="url(#ptr)" class="box"/>
  <text x="370" y="197">İşaretçi</text>
  <text x="550" y="197" text-anchor="end" class="small">0x8AF4</text>
  <text x="460" y="218" text-anchor="middle" class="title">→ 0x7FF0</text>

  <path d="M285 134 C305 134 315 131 350 131" class="line"/>
  <text x="318" y="121" text-anchor="middle" class="small">adres</text>

  <path d="M285 219 C310 219 320 202 350 202" class="line"/>
  <text x="318" y="239" text-anchor="middle" class="small">işaret eder</text>

  <!-- Operations -->

  <rect x="350" y="247" width="65" height="22" rx="8" fill="#f1e9ff"/>
  <text x="382" y="262" text-anchor="middle" class="small">*ptr</text>

  <rect x="423" y="247" width="65" height="22" rx="8" fill="#e8f1ff"/>
  <text x="455" y="262" text-anchor="middle" class="small">ptr++</text>

  <rect x="496" y="247" width="74" height="22" rx="8" fill="#fff0e8"/>
  <text x="533" y="262" text-anchor="middle" class="small">new / delete</text>
</svg>
