<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <radialGradient id="heatHot">
      <stop offset="0" stop-color="#f05a5a" stop-opacity="0.92"/>
      <stop offset="0.34" stop-color="#ffac4d" stop-opacity="0.75"/>
      <stop offset="0.68" stop-color="#ffe18a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe18a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatCool">
      <stop offset="0" stop-color="#4888db" stop-opacity="0.7"/>
      <stop offset="0.48" stop-color="#86b8ed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b9daf5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6b8196" flood-opacity="0.19"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#527089" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="35" r="66" fill="#d9eef2" opacity="0.38"/>
  <circle cx="572" cy="278" r="94" fill="#dff0d5" opacity="0.42"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365269">Göz Takibinden Ölçülebilir Arayüz İçgörüsüne</text>

  <!-- bağlantılar -->
  <path d="M142 158 C153 158 158 158 169 158" fill="none" stroke="#83a2b5" stroke-width="2.3"/>
  <polygon points="169,158 161,153 161,163" fill="#83a2b5"/>
  <path d="M290 158 C301 158 307 158 319 158" fill="none" stroke="#83a2b5" stroke-width="2.3"/>
  <polygon points="319,158 311,153 311,163" fill="#83a2b5"/>
  <path d="M457 158 C468 158 474 158 486 158" fill="none" stroke="#83a2b5" stroke-width="2.3"/>
  <polygon points="486,158 478,153 478,163" fill="#83a2b5"/>

  <!-- 1: göz ve kızılötesi -->
  <g filter="url(#shadow)">
    <rect x="18" y="87" width="124" height="142" rx="20" fill="#fdfefe"/>
  </g>
  <rect x="31" y="100" width="98" height="25" rx="12" fill="#e3f1ed"/>
  <text x="80" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35665d">Kızılötesi</text>
  <path d="M43 161 Q80 128 117 161 Q80 194 43 161Z" fill="#edf7fc" stroke="#7199ae" stroke-width="2"/>
  <ellipse cx="80" cy="161" rx="14" ry="18" fill="#5a82a0"/>
  <circle cx="80" cy="161" r="8.5" fill="#243e58"/>
  <circle cx="85" cy="155" r="3.2" fill="#fff"/>
  <path d="M38 145 L54 151 M36 160 L53 160 M38 176 L54 170" stroke="#eb786c" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M46 145 L52 151 L43 153Z M45 160 L52 156 L52 164Z M46 176 L43 168 L52 170Z" fill="#eb786c"/>
  <text x="80" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557083">Göz ve kamera</text>

  <!-- 2 calibration -->
  <g filter="url(#shadow)">
    <rect x="169" y="75" width="121" height="166" rx="20" fill="#ffffff"/>
  </g>
  <rect x="182" y="88" width="95" height="25" rx="12" fill="#eee6fa"/>
  <text x="229.5" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#68528c">Kalibrasyon</text>
  <rect x="187" y="126" width="85" height="75" rx="8" fill="url(#screen)" stroke="#a5bdd3"/>
  <circle cx="201" cy="139" r="4" fill="#ee736c"/>
  <circle cx="257" cy="139" r="4" fill="#ee736c"/>
  <circle cx="229" cy="163.5" r="4.5" fill="#ee736c"/>
  <circle cx="201" cy="188" r="4" fill="#ee736c"/>
  <circle cx="257" cy="188" r="4" fill="#ee736c"/>
  <path d="M229 213 L229 219" stroke="#91a7b6" stroke-width="2"/>
  <rect x="211" y="219" width="37" height="5" rx="2.5" fill="#91a7b6"/>
  <text x="229.5" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557083">Ekran noktaları</text>

  <!-- 3 gaze transform -->
  <g filter="url(#shadow)">
    <rect x="319" y="87" width="138" height="142" rx="20" fill="#ffffff"/>
  </g>
  <rect x="334" y="100" width="108" height="25" rx="12" fill="#e3edf9"/>
  <text x="388" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41698f">Bakış verisi</text>
  <circle cx="352" cy="151" r="10" fill="#a9cce8"/>
  <circle cx="352" cy="151" r="4" fill="#315f83"/>
  <circle cx="379" cy="164" r="5" fill="#ef8d70"/>
  <circle cx="397" cy="146" r="7" fill="#729ed1"/>
  <circle cx="422" cy="174" r="4" fill="#ef8d70"/>
  <path d="M361 153 C369 153 370 160 379 164 S390 152 397 146 S411 162 422 174" fill="none" stroke="#7c98ae" stroke-width="1.8" stroke-dasharray="3 3"/>
  <rect x="341" y="194" width="94" height="19" rx="9.5" fill="#f6f2e9"/>
  <text x="388" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b694e">Fiksasyon · Sakkad</text>

  <!-- 4 heatmap -->
  <g filter="url(#shadow)">
    <rect x="486" y="61" width="136" height="194" rx="20" fill="#ffffff"/>
  </g>
  <rect x="500" y="74" width="108" height="25" rx="12" fill="#fae6df"/>
  <text x="554" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a5145">Isı haritası</text>
  <rect x="500" y="112" width="108" height="91" rx="9" fill="#eff6fb" stroke="#abc2d2"/>
  <rect x="509" y="122" width="37" height="8" rx="4" fill="#c0d6e8"/>
  <rect x="509" y="138" width="68" height="6" rx="3" fill="#d0dfeb"/>
  <rect x="509" y="151" width="46" height="6" rx="3" fill="#d0dfeb"/>
  <rect x="566" y="171" width="31" height="19" rx="5" fill="#65b998"/>
  <circle cx="536" cy="141" r="31" fill="url(#heatCool)"/>
  <circle cx="580" cy="180" r="38" fill="url(#heatHot)"/>
  <circle cx="535" cy="142" r="18" fill="url(#heatHot)" opacity="0.65"/>
  <path d="M509 214 H598" stroke="#d8e4e8" stroke-width="1"/>
  <circle cx="517" cy="226" r="5" fill="#4687d4"/>
  <circle cx="540" cy="226" r="5" fill="#ffd45e"/>
  <circle cx="563" cy="226" r="5" fill="#ed725e"/>
  <text x="582" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557083">Dikkat</text>

  <!-- alt metrik kartları -->
  <g filter="url(#softShadow)">
    <rect x="150" y="270" width="340" height="34" rx="15" fill="#ffffff" opacity="0.94"/>
  </g>
  <circle cx="173" cy="287" r="8" fill="#8bc4b0"/>
  <path d="M169 287 L172 290 L178 283" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="192" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486275">AOI · ilk bakış · süre · hata · görev başarısı</text>
</svg>