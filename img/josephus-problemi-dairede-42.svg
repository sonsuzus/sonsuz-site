<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="circleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddecff"/>
      <stop offset="100%" stop-color="#d9f4e5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7892a8" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7892a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="88" cy="44" r="55" fill="#dcefff" opacity="0.45"/>
  <circle cx="585" cy="282" r="80" fill="#dff3df" opacity="0.5"/>

  <text x="30" y="33" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36566f">JOSEPHUS PROBLEMİ</text>
  <text x="30" y="51" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#648093">Döngüsel eleme mantığı</text>

  <g filter="url(#shadow)">
