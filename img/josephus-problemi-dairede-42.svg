  </g>

  <path d="M116 112 A75 75 0 0 1 215 133" fill="none" stroke="#5b9cc2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M212 127 L220 136 L208 139 Z" fill="#5b9cc2"/>
  <text x="135" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#427897">k = 3 adım</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <g filter="url(#softShadow)">
      <circle cx="161" cy="83" r="18" fill="#ffffff" stroke="#a9ccda" stroke-width="2"/>
      <circle cx="230" cy="116" r="18" fill="#ffffff" stroke="#a9ccda" stroke-width="2"/>
      <circle cx="247" cy="190" r="18" fill="#ffdfe2" stroke="#e7979f" stroke-width="2"/>
      <circle cx="200" cy="250" r="18" fill="#ffffff" stroke="#a9ccda" stroke-width="2"/>
      <circle cx="122" cy="250" r="18" fill="#ffffff" stroke="#a9ccda" stroke-width="2"/>
      <circle cx="75" cy="190" r="18" fill="#ffffff" stroke="#a9ccda" stroke-width="2"/>
      <circle cx="92" cy="116" r="18" fill="#ffffff" stroke="#a9ccda" stroke-width="2"/>
    </g>
    <text x="161" y="87" fill="#35566e">1</text>
    <text x="230" y="120" fill="#35566e">2</text>
    <text x="247" y="194" fill="#b54d59">3</text>
    <text x="200" y="254" fill="#35566e">4</text>
    <text x="122" y="254" fill="#35566e">5</text>
    <text x="75" y="194" fill="#35566e">6</text>
    <text x="92" y="120" fill="#35566e">7</text>
  </g>

  <text x="161" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426379">Daire</text>
  <text x="161" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#658093">n = 7</text>
  <text x="161" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c05662">Ele: 3</text>

