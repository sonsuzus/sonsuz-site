    <text x="370" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#496fa4">%</text>
    <text x="402" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425c87">Yinelemeli bağıntı</text>
    <text x="402" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657797">J(n) = (J(n−1) + k) mod n</text>
    <rect x="526" y="208" width="59" height="25" rx="9" fill="#e5efff"/>
    <text x="555.5" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5272a7">O(1)</text>
