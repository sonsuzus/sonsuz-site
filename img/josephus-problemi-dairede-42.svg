    <text x="402" y="107" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#65512c">Kuyruk simülasyonu</text>
    <text x="402" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c715b">Döndür • çıkar • kaydet</text>
    <rect x="526" y="103" width="59" height="25" rx="9" fill="#fff2ca"/>
    <text x="555.5" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8c6a21">O(n)</text>
  </g>

  <g>
