<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="driver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="manager" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#64748b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="65" cy="55" r="72" fill="#dbeafe" opacity="0.32"/>
  <circle cx="593" cy="271" r="95" fill="#d1fae5" opacity="0.34"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334155">Apache Spark · Dağıtık İşleme</text>

  <!-- Veri kaynağı -->
  <g filter="url(#shadow)">
    <rect x="28" y="102" width="112" height="121" rx="18" fill="#ffffff"/>
    <rect x="37" y="112" width="94" height="28" rx="10" fill="url(#data)"/>
    <text x="84" y="131" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#854d0e">Büyük Veri</text>
    <rect x="43" y="153" width="82" height="12" rx="6" fill="#fef3c7"/>
    <rect x="43" y="171" width="68" height="12" rx="6" fill="#fde68a"/>
    <rect x="43" y="189" width="76" height="12" rx="6" fill="#fef3c7"/>
    <text x="84" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Partitionlar</text>
  </g>

  <!-- source to driver -->
  <path d="M141 154 C165 154 166 83 193 83" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="190,77 202,83 190,89" fill="#94a3b8"/>

  <!-- Driver -->
  <g filter="url(#shadow)">
    <rect x="202" y="48" width="145" height="70" rx="18" fill="url(#driver)"/>
    <circle cx="229" cy="82" r="17" fill="#ffffff" opacity="0.82"/>
    <path d="M221 85 L226 78 L232 83 L238 74" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Driver</text>
    <text x="280" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Plan ve görevler</text>
  </g>

  <!-- manager -->
  <g filter="url(#shadow)">
    <rect x="392" y="48" width="170" height="70" rx="18" fill="url(#manager)"/>
    <circle cx="420" cy="83" r="17" fill="#ffffff" opacity="0.82"/>
    <rect x="412" y="75" width="16" height="5" rx="2.5" fill="#7c3aed"/>
    <rect x="412" y="84" width="16" height="5" rx="2.5" fill="#8b5cf6"/>
    <text x="486" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c1d95">Küme Yöneticisi</text>
    <text x="486" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Kaynak dağıtımı</text>
  </g>

  <path d="M348 83 L378 83" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <polygon points="376,77 388,83 376,89" fill="#7c3aed"/>

  <!-- manager links -->
  <path d="M455 119 C455 136 336 132 271 151" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M477 119 C477 137 431 133 406 151" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M504 119 C504 138 524 135 542 151" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- executor container -->
  <rect x="177" y="137" width="391" height="130" rx="24" fill="#ffffff" opacity="0.56" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="196" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#64748b">Paralel Çalışanlar</text>

  <!-- executor 1 -->
  <g filter="url(#softShadow)">
    <rect x="194" y="168" width="112" height="78" rx="16" fill="url(#worker)"/>
    <text x="250" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">Executor 1</text>
    <rect x="209" y="203" width="38" height="25" rx="7" fill="#ffffff" opacity="0.9"/>
    <rect x="253" y="203" width="38" height="25" rx="7" fill="#ffffff" opacity="0.9"/>
    <text x="228" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#15803d">T1</text>
    <text x="272" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#15803d">T2</text>
  </g>

  <!-- executor 2 -->
  <g filter="url(#softShadow)">
    <rect x="331" y="168" width="112" height="78" rx="16" fill="url(#worker)"/>
    <text x="387" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">Executor 2</text>
    <rect x="346" y="203" width="38" height="25" rx="7" fill="#ffffff" opacity="0.9"/>
    <rect x="390" y="203" width="38" height="25" rx="7" fill="#ffffff" opacity="0.9"/>
    <text x="365" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#15803d">T3</text>
    <text x="409" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#15803d">T4</text>
  </g>

  <!-- executor 3 -->
  <g filter="url(#softShadow)">
    <rect x="468" y="168" width="82" height="78" rx="16" fill="url(#worker)"/>
    <text x="509" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">Executor</text>
    <rect x="481" y="203" width="56" height="25" rx="7" fill="#ffffff" opacity="0.9"/>
    <text x="509" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#15803d">T5</text>
  </g>

  <!-- partition task flow -->
  <path d="M141 183 C164 183 168 207 192 207" fill="none" stroke="#d97706" stroke-width="2"/>
  <polygon points="189,201 201,207 189,213" fill="#d97706"/>
  <path d="M141 193 C188 193 261 213 329 213" fill="none" stroke="#d97706" stroke-width="2" opacity="0.72"/>
  <polygon points="326,207 338,213 326,219" fill="#d97706"/>

  <!-- Result / action -->
  <path d="M551 207 C573 207 575 206 587 206" fill="none" stroke="#0f766e" stroke-width="2"/>
  <polygon points="584,200 596,206 584,212" fill="#0f766e"/>
  <g filter="url(#shadow)">
    <rect x="571" y="177" width="57" height="60" rx="15" fill="#ccfbf1"/>
    <path d="M587 195 L596 204 L613 187" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#115e59">Action</text>
  </g>

  <!-- footer concepts -->
  <g filter="url(#softShadow)">
    <rect x="50" y="276" width="151" height="28" rx="14" fill="#ffffff"/>
    <circle cx="67" cy="290" r="6" fill="#60a5fa"/>
    <text x="126" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Lazy planlama</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="220" y="276" width="175" height="28" rx="14" fill="#ffffff"/>
    <circle cx="237" cy="290" r="6" fill="#f59e0b"/>
    <text x="313" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Az veri hareketi</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="414" y="276" width="176" height="28" rx="14" fill="#ffffff"/>
    <circle cx="431" cy="290" r="6" fill="#34d399"/>
    <text x="510" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Hata toleransı</text>
  </g>
</svg>