<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="oldCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#c9dcf5"/>
    </linearGradient>
    <linearGradient id="newCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcf3df"/>
      <stop offset="100%" stop-color="#c6e8cf"/>
    </linearGradient>
    <linearGradient id="coreCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1d7"/>
      <stop offset="100%" stop-color="#f8dfb4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#53708a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#53708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="86" cy="45" r="58" fill="#cfe4f5" opacity="0.3"/>
  <circle cx="570" cy="269" r="82" fill="#d5ebcc" opacity="0.35"/>
  <path d="M38 261 C130 290 192 270 251 285" fill="none" stroke="#bdd7df" stroke-width="2" opacity="0.55"/>
  <path d="M396 38 C474 15 548 34 608 71" fill="none" stroke="#c6dfcd" stroke-width="2" opacity="0.65"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40586a">Dijital Sistem Göçü</text>
  <text x="320" y="47" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718595">Alışkanlıktan bilinçli yeniden kuruluşa</text>

  <!-- flow connections -->
  <path d="M187 155 C211 155 220 155 236 155" fill="none" stroke="#7e9db9" stroke-width="3" stroke-linecap="round"/>
  <polygon points="236,155 226,149 226,161" fill="#7e9db9"/>
  <path d="M404 155 C421 155 430 155 451 155" fill="none" stroke="#78a888" stroke-width="3" stroke-linecap="round"/>
  <polygon points="451,155 441,149 441,161" fill="#78a888"/>

  <!-- old system -->
  <g filter="url(#shadow)">
    <rect x="35" y="91" width="152" height="130" rx="22" fill="url(#oldCard)"/>
    <rect x="48" y="105" width="126" height="30" rx="12" fill="#f8fbff" opacity="0.82"/>
  </g>
  <rect x="62" y="112" width="21" height="16" rx="4" fill="#7199c2"/>
  <path d="M66 118 L71 121 L66 124 M74 124 L79 124" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="111" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5d78">Eski Sistem</text>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#48667c">
    <circle cx="60" cy="151" r="3.5" fill="#7fa9d0"/>
    <text x="71" y="155">Komut refleksleri</text>
    <circle cx="60" cy="177" r="3.5" fill="#7fa9d0"/>
    <text x="71" y="181">Dosya yolları</text>
    <circle cx="60" cy="203" r="3.5" fill="#7fa9d0"/>
    <text x="71" y="207">Tanıdık düzen</text>
  </g>

  <!-- central ritual -->
  <g filter="url(#shadow)">
    <rect x="237" y="78" width="167" height="157" rx="28" fill="url(#coreCard)"/>
    <circle cx="320.5" cy="129" r="35" fill="#fffaf0" opacity="0.88"/>
  </g>
  <!-- box/archive icon -->
  <rect x="296" y="115" width="49" height="31" rx="6" fill="#e89e63"/>
  <path d="M294 121 L320.5 107 L347 121 L320.5 134 Z" fill="#f3b97e"/>
  <path d="M320.5 134 L320.5 146" stroke="#c77e48" stroke-width="2"/>
  <path d="M296 122 L320.5 135 L345 122" fill="none" stroke="#c77e48" stroke-width="1.5"/>
  <path d="M315 126 L326 126" stroke="#fff9ef" stroke-width="2.5" stroke-linecap="round"/>
  <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805b3d">Göç Ritüeli</text>
  <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936b49">Yedekle</text>
  <circle cx="287" cy="186" r="4" fill="#e3a36d"/>
  <path d="M287 186 L287 190" stroke="#ffffff" stroke-width="1.2"/>
  <text x="320" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936b49">Seç ve sadeleştir</text>
  <circle cx="276" cy="207" r="4" fill="#e3a36d"/>
  <path d="M274 207 L276 209 L279 204" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- new system -->
  <g filter="url(#shadow)">
    <rect x="452" y="91" width="153" height="130" rx="22" fill="url(#newCard)"/>
    <rect x="465" y="105" width="127" height="30" rx="12" fill="#fbfffa" opacity="0.84"/>
  </g>
  <path d="M480 127 L480 115 L486 110 L493 115 L493 127 Z" fill="#6eac81"/>
  <rect x="483" y="120" width="4" height="7" rx="1" fill="#eff9ef"/>
  <text x="532" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#406a4d">Yeni Sistem</text>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7054">
    <circle cx="478" cy="151" r="3.5" fill="#7eb58c"/>
    <text x="489" y="155">Yeni sözdizimi</text>
    <circle cx="478" cy="177" r="3.5" fill="#7eb58c"/>
    <text x="489" y="181">Tekrarlanabilir yapı</text>
    <circle cx="478" cy="203" r="3.5" fill="#7eb58c"/>
    <text x="489" y="207">Yeniden güven</text>
  </g>

  <!-- lower conceptual factors -->
  <path d="M270 237 C244 251 216 254 191 251" fill="none" stroke="#d6a969" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="190,251 199,246 197,256" fill="#d6a969"/>
  <path d="M370 237 C396 251 423 254 448 251" fill="none" stroke="#d6a969" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="449,251 441,246 442,256" fill="#d6a969"/>

  <g filter="url(#softShadow)">
    <rect x="76" y="253" width="133" height="39" rx="15" fill="#ffffff" opacity="0.9"/>
    <rect x="431" y="253" width="133" height="39" rx="15" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="142" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#617b90">Alışkanlık Bağı</text>
  <text x="142" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#788e9e">Süre · Tekrar · Tutarlılık</text>
  <text x="497" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5d8065">Yeni Kimlik</text>
  <text x="497" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748f79">Öğrenme · Seçim · Uyum</text>
</svg>