  </g>
  <rect x="199" y="85" width="98" height="28" rx="12" fill="#e8d7fa"/>
  <text x="248" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#634e78">Word2Vec</text>
