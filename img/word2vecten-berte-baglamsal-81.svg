  <text x="91" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596b76">Seyrek kimlik</text>
  <g transform="translate(58 160)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#edf0ee"/>
    <rect x="18" y="0" width="13" height="13" rx="3" fill="#edf0ee"/>
    <rect x="36" y="0" width="13" height="13" rx="3" fill="#f5ad70"/>
    <rect x="54" y="0" width="13" height="13" rx="3" fill="#edf0ee"/>
    <rect x="0" y="19" width="13" height="13" rx="3" fill="#edf0ee"/>
    <rect x="18" y="19" width="13" height="13" rx="3" fill="#edf0ee"/>
    <rect x="36" y="19" width="13" height="13" rx="3" fill="#edf0ee"/>
    <rect x="54" y="19" width="13" height="13" rx="3" fill="#edf0ee"/>
