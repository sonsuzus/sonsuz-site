  <text x="547" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385f91">BERT</text>
  <text x="547" y="123" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596b76">Self-attention</text>
  <g filter="url(#smallShadow)">
