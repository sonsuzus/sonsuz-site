  <polygon points="427,171 419,166 419,176" fill="#61aa9f"/>
  <path d="M423 187 H367" stroke="#7cc5ba" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="363,187 371,182 371,192" fill="#61aa9f"/>
  <circle cx="383" cy="179" r="8" fill="#a5ddd5"/>
  <circle cx="410" cy="179" r="8" fill="#a5ddd5"/>
  <text x="397" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c8780">Dinamik</text>

  <!-- arrow -->
  <path d="M459 156 H475" stroke="#8ca2ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="479,156 471,151 471,161" fill="#8ca2ad"/>

  <!-- BERT -->
  <g filter="url(#shadow)">
