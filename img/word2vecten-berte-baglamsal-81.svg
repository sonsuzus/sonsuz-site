  </g>
  <text x="547" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#42667f">nehir bankası</text>
  <text x="547" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#42667f">hesap bankası</text>
  <path d="M512 174 C527 164 563 164 582 174" fill="none" stroke="#66a7b0" stroke-width="1.5"/>
  <polygon points="585,176 578,169 577,178" fill="#66a7b0"/>
  <path d="M582 176 C563 218 528 218 512 206" fill="none" stroke="#6b97cf" stroke-width="1.5"/>
  <polygon points="509,203 518,204 513,212" fill="#6b97cf"/>
  <text x="547" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f7771">Bağlamsal anlam</text>

  <!-- bottom notion -->
  <g filter="url(#smallShadow)">
    <rect x="165" y="271" width="310" height="30" rx="15" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="187" cy="286" r="7" fill="#78b8a9"/>
  <text x="321" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47616e">Anlam, kelime ve bağlamdan doğar</text>
