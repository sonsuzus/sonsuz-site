<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="bert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e8ff"/>
      <stop offset="100%" stop-color="#d9f2e4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7891a8" flood-opacity="0.2"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#73899c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="60" cy="45" r="78" fill="#dceeff" opacity="0.42"/>
  <circle cx="590" cy="286" r="100" fill="#dff3d9" opacity="0.43"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385269">Kelime Temsillerinin Evrimi</text>
  <path d="M35 48 H605" stroke="#cbdce4" stroke-width="1.5"/>

  <!-- One hot -->
  <g filter="url(#shadow)">
    <rect x="27" y="83" width="128" height="147" rx="18" fill="#fffaf1"/>
  </g>
