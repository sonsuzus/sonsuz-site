<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8dbf4"/>
    </linearGradient>
    <filter id="golge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4c6380" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4c6380" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="320" cy="160" r="121" fill="#dceaf5" opacity="0.32"/>
  <circle cx="320" cy="160" r="94" fill="none" stroke="#aabfd2" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.58"/>

  <!-- Bağlantılar -->
  <path d="M173 86 C208 96 221 111 244 126" fill="none" stroke="#7897ad" stroke-width="2"/>
  <polygon points="244,126 234,124 239,117" fill="#7897ad"/>

  <path d="M171 225 C204 211 223 198 244 187" fill="none" stroke="#7897ad" stroke-width="2"/>
