  <circle cx="75" cy="76" r="13" fill="#ffd66b"/>
  <path d="M75 56 v-6 M75 102 v-6 M55 76 h-6 M101 76 h-6 M61 62 l-4-4 M89 62 l4-4 M61 90 l-4 4 M89 90 l4 4" stroke="#d6a83c" stroke-width="1.7" stroke-linecap="round"/>
