  <circle cx="320" cy="145" r="19" fill="#ffffff" opacity="0.78"/>
  <path d="M307 146 h8 l5 -10 l6 21 l5 -11 h10" fill="none" stroke="#4f7ba1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#294967" font-weight="600">Enerji Yönetimi</text>
  <text x="320" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55738d">Denge ve karar</text>

