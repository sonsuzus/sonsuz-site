<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6dcff"/>
      <stop offset="100%" stop-color="#cddfff"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f4ef"/>
      <stop offset="100%" stop-color="#bfe7df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5b7185" flood-opacity=".18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5b7185" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.2" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#69869b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6.2" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4d9f86"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="49" r="75" fill="#dceeff" opacity=".45"/>
  <circle cx="575" cy="282" r="95" fill="#dff3d7" opacity=".42"/>

  <text x="32" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#496075">C++ SİNİR AĞI • VERİDEN ÖĞRENMEYE</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="30" y="92" width="118" height="132" rx="20" fill="#fff" stroke="#d5e5ef"/>
  </g>
  <text x="89" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466177">Girdi vektörü</text>
  <g fill="#8bc9e5">
    <rect x="51" y="135" width="17" height="17" rx="5"/>
    <rect x="51" y="162" width="17" height="17" rx="5"/>
    <rect x="51" y="189" width="17" height="17" rx="5"/>
  </g>
  <g fill="#d7edf7">
    <rect x="76" y="135" width="49" height="17" rx="5"/>
    <rect x="76" y="162" width="38" height="17" rx="5"/>
    <rect x="76" y="189" width="55" height="17" rx="5"/>
  </g>
  <text x="59" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff">x</text>
  <text x="59" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff">x</text>
  <text x="59" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff">x</text>

  <path d="M149 158 H184" fill="none" stroke="#69869b" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="187" y="69" width="220" height="177" rx="24" fill="url(#core)" stroke="#c7c3ec"/>
  </g>
  <text x="297" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c537f">Yoğun Katman</text>

  <g filter="url(#smallShadow)">
    <rect x="209" y="112" width="80" height="54" rx="13" fill="#ffffff" opacity=".88"/>
    <rect x="307" y="112" width="78" height="54" rx="13" fill="#ffffff" opacity=".88"/>
  </g>
  <text x="249" y="134" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#655c96">W · x</text>
  <text x="249" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b7799">matris çarpımı</text>
  <text x="346" y="134" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#655c96">+ b → f</text>
  <text x="346" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b7799">aktivasyon</text>
  <path d="M289 139 H305" fill="none" stroke="#817aa8" stroke-width="2" marker-end="url(#arrow)"/>

  <g fill="#7e78b7">
    <circle cx="228" cy="194" r="5"/>
    <circle cx="245" cy="194" r="5"/>
    <circle cx="262" cy="194" r="5"/>
    <circle cx="279" cy="194" r="5"/>
    <circle cx="296" cy="194" r="5"/>
    <circle cx="313" cy="194" r="5"/>
    <circle cx="330" cy="194" r="5"/>
    <circle cx="347" cy="194" r="5"/>
    <circle cx="364" cy="194" r="5"/>
  </g>
  <text x="297" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#595879">y = f(Wx + b)</text>

  <!-- Output -->
  <path d="M409 157 H439" fill="none" stroke="#69869b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="443" y="92" width="83" height="132" rx="20" fill="#fff8e9" stroke="#f0dfb2"/>
  </g>
  <text x="484" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#82683c">Çıktı</text>
  <g fill="#f3c77b">
    <rect x="462" y="135" width="43" height="15" rx="6"/>
    <rect x="462" y="160" width="30" height="15" rx="6"/>
    <rect x="462" y="185" width="52" height="15" rx="6"/>
  </g>
  <text x="484" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7d47">tahmin</text>

  <!-- memory bottom -->
  <g filter="url(#shadow)">
    <rect x="45" y="263" width="230" height="39" rx="14" fill="url(#memory)" stroke="#b9ded7"/>
  </g>
  <g fill="#67aa9a">
    <rect x="62" y="275" width="8" height="15" rx="2"/>
    <rect x="74" y="275" width="8" height="15" rx="2"/>
    <rect x="86" y="275" width="8" height="15" rx="2"/>
    <rect x="98" y="275" width="8" height="15" rx="2"/>
  </g>
  <text x="176" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397969">Ardışık bellek • Önbellek dostu</text>
  <path d="M186 246 C175 254 160 257 145 262" fill="none" stroke="#4d9f86" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowGreen)"/>

  <!-- Learning loop -->
  <g filter="url(#shadow)">
    <rect x="540" y="75" width="76" height="78" rx="19" fill="#eaf6ed" stroke="#c8e7ce"/>
    <rect x="540" y="173" width="76" height="78" rx="19" fill="#ffecef" stroke="#f0ccd3"/>
  </g>
  <text x="578" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#46805b">Kayıp</text>
  <text x="578" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f9070">L</text>
  <text x="578" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a75f70">Geri yayılım</text>
  <text x="578" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#bb7686">∇W · η</text>
  <path d="M526 129 H537" fill="none" stroke="#69869b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M578 154 V170" fill="none" stroke="#bf7885" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M540 212 C487 261 399 274 337 247" fill="none" stroke="#bf7885" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</svg>