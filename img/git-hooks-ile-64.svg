<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6efff"/>
      <stop offset="100%" stop-color="#d8f5ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="73" cy="50" r="43" fill="#dbeeff" opacity="0.55"/>
  <circle cx="582" cy="278" r="68" fill="#dcf4df" opacity="0.48"/>
  <circle cx="575" cy="44" r="24" fill="#fff0cc" opacity="0.62"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43576b">Git Hooks ile kalite kapısı</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728497">Yerel denetimden güvenli teslimata</text>

  <!-- developer -->
  <g filter="url(#shadow)">
    <rect x="27" y="105" width="104" height="117" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="79" cy="135" r="17" fill="#cfe2ff"/>
  <circle cx="79" cy="130" r="6.5" fill="#638bc3"/>
  <path d="M66 149 C68 140 90 140 92 149 L94 158 L64 158 Z" fill="#638bc3"/>
  <rect x="48" y="169" width="62" height="8" rx="4" fill="#e7eef6"/>
  <rect x="57" y="185" width="44" height="7" rx="3.5" fill="#dce8f4"/>
  <text x="79" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43576b">Geliştirici</text>

  <!-- input arrow -->
  <path d="M140 164 L181 164" stroke="#7c98ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="181,164 172,159 172,169" fill="#7c98ad"/>
  <text x="160" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#697f92">commit</text>

  <!-- gate -->
  <g filter="url(#shadow)">
    <rect x="190" y="76" width="182" height="177" rx="24" fill="url(#gate)" stroke="#c5dfd6" stroke-width="1.2"/>
  </g>
  <path d="M214 105 L232 95 L250 105 L250 126 C250 141 239 151 232 154 C225 151 214 141 214 126 Z" fill="#7cb69e"/>
  <path d="M224 124 L230 130 L241 116" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="262" y="111" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385a58">Hook Kapısı</text>
  <text x="262" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66817f">.git/hooks</text>

  <g filter="url(#smallShadow)">
    <rect x="211" y="166" width="66" height="57" rx="13" fill="#ffffff"/>
    <rect x="285" y="166" width="66" height="57" rx="13" fill="#ffffff"/>
  </g>
  <circle cx="244" cy="184" r="11" fill="#d9e8ff"/>
  <path d="M238 184 L242 188 L250 179" fill="none" stroke="#5c87bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="244" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6680">pre-commit</text>

  <circle cx="318" cy="184" r="11" fill="#d8f2df"/>
  <path d="M312 184 L316 188 L324 179" fill="none" stroke="#559775" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="318" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6680">pre-push</text>

  <!-- checks -->
  <g filter="url(#smallShadow)">
    <rect x="190" y="267" width="67" height="31" rx="12" fill="#fff5da"/>
    <rect x="264" y="267" width="67" height="31" rx="12" fill="#f2e9ff"/>
    <rect x="338" y="267" width="67" height="31" rx="12" fill="#ffe9e8"/>
  </g>
  <text x="223.5" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a7441">Biçim</text>
  <text x="297.5" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#71568c">Test</text>
  <text x="371.5" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9b5e5b">Anahtar</text>
  <path d="M244 224 L244 257" stroke="#9cb7ad" stroke-width="1.7"/>
  <path d="M244 257 L371 257 L371 262" fill="none" stroke="#9cb7ad" stroke-width="1.7"/>
  <path d="M297 224 L297 262" stroke="#9cb7ad" stroke-width="1.7"/>
  <polygon points="371,267 367,260 375,260" fill="#9cb7ad"/>
  <polygon points="297,267 293,260 301,260" fill="#9cb7ad"/>
  <polygon points="244,267 240,260 248,260" fill="#9cb7ad"/>

  <!-- pass route -->
  <path d="M381 145 L429 145" stroke="#70a88b" stroke-width="3" stroke-linecap="round"/>
  <polygon points="429,145 419,139 419,151" fill="#70a88b"/>
  <text x="405" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e886c">exit 0</text>

  <!-- remote repository -->
  <g filter="url(#shadow)">
    <rect x="439" y="89" width="172" height="111" rx="22" fill="#ffffff"/>
  </g>
  <path d="M472 119 L497 108 L522 119 L522 151 L497 162 L472 151 Z" fill="#d5e8ff" stroke="#8aafd4" stroke-width="1.4"/>
  <path d="M472 119 L497 131 L522 119 M497 131 L497 162" fill="none" stroke="#8aafd4" stroke-width="1.4"/>
  <text x="538" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43576b">Uzak Depo</text>
  <text x="538" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708497">güvenli push</text>
  <rect x="538" y="158" width="47" height="17" rx="8.5" fill="#ddf4e5"/>
  <text x="561.5" y="170.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d8b6b">Teslim</text>

  <!-- block route -->
  <path d="M281 76 L281 58 L398 58 L398 80" fill="none" stroke="#d4847d" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="398,85 393,76 403,76" fill="#d4847d"/>
  <g filter="url(#smallShadow)">
    <rect x="350" y="27" width="113" height="41" rx="15" fill="#fff0ef"/>
  </g>
  <circle cx="371" cy="47.5" r="11" fill="#ef9d98"/>
  <path d="M367 44 L375 52 M375 44 L367 52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="413" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a25d58">İşlem engellenir</text>
  <text x="322" y="69" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b36b65">sıfır dışı</text>

  <!-- ci assurance -->
  <path d="M525 211 L525 232" stroke="#8aa89b" stroke-width="2"/>
  <polygon points="525,237 520,228 530,228" fill="#8aa89b"/>
  <g filter="url(#smallShadow)">
    <rect x="460" y="239" width="130" height="48" rx="16" fill="#e6f4ed"/>
  </g>
  <path d="M481 251 L492 246 L503 251 L503 263 C503 271 497 277 492 279 C487 277 481 271 481 263 Z" fill="#69a985"/>
  <path d="M486 262 L490 266 L497 257" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="544" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477560">CI doğrulama</text>
  <text x="544" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66877a">merkezi güvence</text>
</svg>