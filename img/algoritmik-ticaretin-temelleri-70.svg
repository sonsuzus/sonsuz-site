  <text x="32" y="35" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536e">ALGORİTMİK TİCARET MİMARİSİ</text>
  <text x="32" y="53" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718397">Kural tabanlı karar ve kontrollü uygulama</text>

