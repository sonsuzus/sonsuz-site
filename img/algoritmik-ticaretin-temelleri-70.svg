    <rect x="416" y="232" width="79" height="42" rx="11" fill="#fff2e8"/>
  </g>
  <path d="M438 259 L447 244 L456 259 Z" fill="#efad72"/>
  <rect x="446" y="250" width="2" height="5" rx="1" fill="#ffffff"/>
  <circle cx="447" cy="257" r="1.3" fill="#ffffff"/>
  <text x="470" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d5b72">Durdur</text>

  <text x="320" y="307" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708496">Sinyal ≠ gerçekleşen işlem</text>
