  </g>
  <rect x="50" y="106" width="29" height="21" rx="6" fill="#dcecfb"/>
  <path d="M55 120 L61 114 L66 117 L73 109" fill="none" stroke="#4b85bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
