  <rect x="542" y="105" width="39" height="29" rx="7" fill="#e6effa"/>
  <path d="M551 125 V118 M558 125 V112 M565 125 V116 M572 125 V109" stroke="#5d8bc1" stroke-width="3" stroke-linecap="round"/>
