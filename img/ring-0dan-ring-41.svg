<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8996d6"/>
      <stop offset="100%" stop-color="#6675bb"/>
    </linearGradient>
    <linearGradient id="user" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7dfe3"/>
      <stop offset="100%" stop-color="#78c4ce"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#53627a" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#53627a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="139" fill="#dceff0" opacity="0.62"/>
  <circle cx="320" cy="160" r="106" fill="#edf4fb" stroke="#aac0d7" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="320" cy="160" r="72" fill="#f8fbff" stroke="#8a98ca" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="320" cy="160" r="55" fill="url(#kernel)" filter="url(#soft)"/>

  <text x="320" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Ring 0</text>
  <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eef1ff">Çekirdek</text>

  <text x="320" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#697a9e">Koruma Duvarı</text>
  <text x="320" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60738b">Ring 1 ve Ring 2</text>

  <g filter="url(#soft)">
