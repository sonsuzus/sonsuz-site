<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="buffer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aee4f6"/>
      <stop offset="100%" stop-color="#78c9e6"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd3ca"/>
      <stop offset="100%" stop-color="#f69d91"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9efd1"/>
      <stop offset="100%" stop-color="#9dd5b4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#56738a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#698093" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="78" cy="44" r="54" fill="#dcefff" opacity="0.55"/>
  <circle cx="593" cy="279" r="68" fill="#dff1d8" opacity="0.52"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38526a">TAMPON TAŞMASI</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718497">Sınır aşımı → bellek etkisi → savunma</text>

  <!-- Input -->
  <g filter="url(#soft)">
    <rect x="28" y="113" width="104" height="79" rx="16" fill="#ffffff"/>
    <rect x="39" y="126" width="82" height="18" rx="7" fill="#e8f2fb"/>
    <rect x="39" y="151" width="82" height="10" rx="5" fill="#8fcde7"/>
    <rect x="39" y="166" width="82" height="10" rx="5" fill="#8fcde7"/>
    <rect x="39" y="181" width="82" height="10" rx="5" fill="#f59688"/>
  </g>
  <text x="80" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405a70">Girdi</text>
  <text x="80" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557087">40 bayt veri</text>

  <!-- arrow input to stack -->
  <path d="M137 152 H168" fill="none" stroke="#6c9ab4" stroke-width="2"/>
  <polygon points="174,152 165,147 165,157" fill="#6c9ab4"/>

  <!-- Memory Stack -->
  <g filter="url(#shadow)">
    <rect x="177" y="72" width="190" height="185" rx="20" fill="#ffffff"/>
    <rect x="191" y="86" width="162" height="36" rx="10" fill="#eadff6"/>
    <rect x="191" y="127" width="162" height="40" rx="10" fill="#f6e9c9"/>
    <rect x="191" y="172" width="162" height="67" rx="10" fill="url(#buffer)"/>
  </g>
  <text x="272" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405a70">Stack frame</text>
  <text x="207" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56466c">Dönüş bilgisi</text>
  <text x="207" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#73603d">Diğer değişkenler</text>
  <text x="207" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#225d76">tampon [8]</text>
  <text x="207" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39738c">geçerli alan</text>

  <!-- overflow rising -->
  <path d="M333 224 C386 218 381 182 344 151 C329 138 330 126 344 113" fill="none" stroke="#ef897b" stroke-width="4" stroke-linecap="round"/>
  <polygon points="344,103 337,116 351,115" fill="#ef897b"/>
  <circle cx="334" cy="220" r="6" fill="#f59688"/>
  <text x="391" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#c86559">Taşan veri</text>
  <text x="391" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d6e70">komşu alanlara ilerler</text>

  <!-- impact -->
  <g filter="url(#soft)">
    <rect x="389" y="171" width="106" height="70" rx="16" fill="url(#danger)"/>
  </g>
  <path d="M442 184 l7 13 15 2 -11 10 3 15 -14 -7 -14 7 3 -15 -11 -10 15 -2z" fill="#ffffff" opacity="0.88"/>
  <text x="442" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a6554d">Bozulma</text>

  <!-- arrows to effects -->
  <path d="M499 193 H519" fill="none" stroke="#dc887d" stroke-width="2"/>
  <polygon points="525,193 516,188 516,198" fill="#dc887d"/>

  <!-- Defense panel -->
  <g filter="url(#shadow)">
    <rect x="524" y="75" width="91" height="181" rx="20" fill="#ffffff"/>
  </g>
  <path d="M570 94 L594 103 V132 C594 153 583 169 570 176 C557 169 546 153 546 132 V103 Z" fill="url(#shield)" stroke="#72b08e" stroke-width="1.5"/>
  <path d="M559 134 l8 8 15 -19" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="570" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416653">Savunma</text>
  <rect x="539" y="207" width="62" height="18" rx="8" fill="#edf7ea"/>
  <text x="570" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7460">Canary</text>
  <rect x="539" y="231" width="62" height="18" rx="8" fill="#edf7ea"/>
  <text x="570" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7460">ASLR ve NX</text>

  <!-- bottom formula note -->
  <g filter="url(#soft)">
    <rect x="28" y="273" width="467" height="30" rx="14" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="47" cy="288" r="8" fill="#f4b15d"/>
  <text x="47" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">!</text>
  <text x="65" y="292" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536c80">L ≤ N: normal çalışma</text>
  <path d="M206 288 H225" stroke="#9ab0c0" stroke-width="1.5"/>
  <polygon points="231,288 222,283 222,293" fill="#9ab0c0"/>
  <text x="244" y="292" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b25d54">L &gt; N: taşma ve risk</text>
</svg>