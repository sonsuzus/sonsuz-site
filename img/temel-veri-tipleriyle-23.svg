    <text x="76" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#495a67">boolean</text>
    <text x="76" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72808b">açık, kapalı</text>
