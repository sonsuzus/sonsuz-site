    <circle cx="448" cy="262" r="14" fill="#e48680"/>
    <path d="M443 257 L453 267 M453 257 L443 267" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
    <text x="472" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a4a4a">Hatalı değer</text>
    <text x="472" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a16868">"doksan" reddedildi</text>
