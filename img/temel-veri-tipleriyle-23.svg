    <text x="504" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a7d7a">puan: number</text>
    <line x1="471" y1="141" x2="587" y2="141" stroke="#d9ebe3"/>
    <text x="471" y="162" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b8872">puan = 100</text>
