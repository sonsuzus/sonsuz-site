<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d4eaf7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f9e6"/>
      <stop offset="100%" stop-color="#d0f0d0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8fd"/>
      <stop offset="100%" stop-color="#e0d0f5"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8ef"/>
      <stop offset="100%" stop-color="#f8d0e0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">C Program Oluşturma Süreci</text>

  <!-- Merkezden dışa yayılan dairesel yapı -->
  <!-- Merkez düğüm -->
  <rect x="245" y="125" width="150" height="50" rx="12" fill="#4a90d9" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Çalıştırılabilir</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">.EXE Dosyası</text>

  <!-- Üst: Kaynak Dosya -->
  <rect x="245" y="20" width="150" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#7fb3d5" stroke-width="1"/>
  <text x="320" y="40" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Kaynak Dosya</text>
  <text x="320" y="56" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">.c uzantılı</text>

  <!-- Sol: Derleme -->
  <rect x="20" y="125" width="150" height="50" rx="12" fill="url(#box2)" filter="url(#shadow)" stroke="#e6b566" stroke-width="1"/>
  <text x="95" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Derleme</text>
  <text x="95" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Nesne Dosyası</text>

  <!-- Sağ: Bağlama -->
  <rect x="470" y="125" width="150" height="50" rx="12" fill="url(#box3)" filter="url(#shadow)" stroke="#82c785" stroke-width="1"/>
  <text x="545" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Bağlama</text>
  <text x="545" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Kütüphaneler</text>

  <!-- Alt: IDE -->
  <rect x="245" y="235" width="150" height="50" rx="12" fill="url(#box4)" filter="url(#shadow)" stroke="#a58fd0" stroke-width="1"/>
  <text x="320" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">IDE Ortamı</text>
  <text x="320" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Metin Düzenleyici</text>

  <!-- Oklar: Kaynak -> Merkez -->
  <path d="M320 70 L320 118" stroke="#4a90d9" stroke-width="2" fill="none"/>
  <polygon points="315,115 320,125 325,115" fill="#4a90d9"/>

  <!-- Oklar: Derleme -> Merkez -->
  <path d="M170 145 L238 145" stroke="#e6b566" stroke-width="2" fill="none"/>
  <polygon points="233,140 243,145 233,150" fill="#e6b566"/>

  <!-- Oklar: Bağlama -> Merkez -->
  <path d="M470 145 L402 145" stroke="#82c785" stroke-width="2" fill="none"/>
  <polygon points="407,140 397,145 407,150" fill="#82c785"/>

  <!-- Oklar: Merkez -> IDE (geri bildirim) -->
  <path d="M320 175 L320 228" stroke="#a58fd0" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="315,225 320,235 325,225" fill="#a58fd0"/>

  <!-- Alt bilgi: İşletim Sistemi -->
  <rect x="470" y="235" width="150" height="50" rx="12" fill="url(#box5)" filter="url(#shadow)" stroke="#d48a9e" stroke-width="1"/>
  <text x="545" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">İşletim Sistemi</text>
  <text x="545" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Çalıştırma</text>

  <!-- Oklar: Merkez -> İşletim Sistemi -->
  <path d="M395 150 L463 150" stroke="#d48a9e" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="458,145 468,150 458,155" fill="#d48a9e"/>

  <!-- Etiket: Adımlar -->
  <text x="95" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">1. Yazım</text>
  <text x="545" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">2. Derleme</text>
  <text x="320" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">3. Bağlama</text>
</svg>