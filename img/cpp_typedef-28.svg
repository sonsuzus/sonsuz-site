<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ typedef Kavramı</text>

  <!-- Ana typedef kutusu -->
  <rect x="220" y="55" width="200" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">typedef</text>
  <text x="320" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">eski-isim → yeni-isim</text>

  <!-- Ok: typedef → int örneği -->
  <path d="M 270 105 L 160 145" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="160,145 170,140 164,152" fill="#546e7a"/>

  <!-- Ok: typedef → tms örneği -->
  <path d="M 370 105 L 480 145" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="480,145 470,140 476,152" fill="#546e7a"/>

  <!-- Sol alt: int kutusu -->
  <rect x="55" y="145" width="150" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="130" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#e65100">int</text>
  <text x="130" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">Standart veri türü</text>

  <!-- Sağ alt: tms kutusu -->
  <rect x="435" y="145" width="150" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="510" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">tms</text>
  <text x="510" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">Yeni takma ad</text>

  <!-- Alt orta: kullanım kutusu -->
  <rect x="220" y="230" width="200" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.5"/>
  <text x="320" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Değişken bildirimi</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">tms id;  →  id = 21;</text>

  <!-- Oklar: int ve tms → kullanım -->
  <path d="M 130 200 L 250 230" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="250,230 240,226 246,236" fill="#546e7a"/>

  <path d="M 510 200 L 390 230" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="390,230 400,226 394,236" fill="#546e7a"/>

  <!-- Sağ üst: çıktı kutusu -->
  <rect x="500" y="55" width="110" height="45" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#4dd0e1" stroke-width="1.5"/>
  <text x="555" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#00838f">Çıktı</text>
  <text x="555" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#006064">21</text>

  <!-- Ok: kullanım → çıktı -->
  <path d="M 420 240 L 555 100" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="555,100 546,104 552,94" fill="#546e7a"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c">typedef int tms; → int ile aynı işlemi yapar</text>
</svg>