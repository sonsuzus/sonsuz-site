<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#d9f2df"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6e8295" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6e8295" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="157" r="112" fill="#dceeff" opacity="0.32"/>
  <circle cx="319" cy="157" r="82" fill="#f8fcff" opacity="0.7"/>

  <!-- Sol üst: yer çekimi -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="37" width="137" height="55" rx="16" fill="#ffe7e0"/>
    <circle cx="52" cy="64" r="13" fill="#f6b4a5"/>
    <path d="M52 54 L52 69 M46 64 L52 70 L58 64" fill="none" stroke="#9e5146" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="60" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66413b" font-weight="600">Yer çekimi</text>
    <text x="76" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#88635c">Yük ve tork</text>
  </g>

  <!-- Sol alt: ölçüm -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="213" width="137" height="55" rx="16" fill="#e8e2fb"/>
    <circle cx="52" cy="240" r="13" fill="#c7b9ef"/>
    <path d="M45 244 L49 238 L53 241 L59 233" fill="none" stroke="#655795" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="236" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f4675" font-weight="600">Model verisi</text>
    <text x="76" y="252" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#756c98">Açı ve kütle</text>
  </g>

  <!-- Sağ üst: mekanik -->
  <g filter="url(#smallShadow)">
    <rect x="475" y="37" width="137" height="55" rx="16" fill="#fff0d9"/>
    <circle cx="499" cy="64" r="13" fill="#f5ca8c"/>
    <path d="M493 69 C493 61 505 67 505 59 C505 53 493 58 493 53" fill="none" stroke="#9b6a25" stroke-width="2" stroke-linecap="round"/>
    <text x="521" y="60" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#694b22" font-weight="600">Mekanik destek</text>
    <text x="521" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6b42">Yay ve denge</text>
  </g>

  <!-- Sağ alt: energy -->
  <g filter="url(#smallShadow)">
    <rect x="475" y="213" width="137" height="55" rx="16" fill="#ddf3e3"/>
    <circle cx="499" cy="240" r="13" fill="#a8d9b3"/>
    <path d="M501 229 L493 242 L499 242 L497 251 L506 237 L500 237 Z" fill="#348657"/>
    <text x="521" y="236" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315c40" font-weight="600">Enerji kazancı</text>
    <text x="521" y="252" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8168">Düşük kayıp</text>
  </g>

  <!-- Bağlantı çizgileri -->
  <path d="M165 65 C197 65 202 92 226 109" fill="none" stroke="#d49182" stroke-width="2.2"/>
  <polygon points="226,109 217,106 221,116" fill="#d49182"/>
  <path d="M165 240 C198 240 202 220 226 204" fill="none" stroke="#998bc7" stroke-width="2.2"/>
  <polygon points="226,204 220,214 229,211" fill="#998bc7"/>
  <path d="M414 109 C438 92 443 65 475 65" fill="none" stroke="#d5a354" stroke-width="2.2"/>
  <polygon points="475,65 466,60 466,70" fill="#d5a354"/>
  <path d="M414 204 C439 220 442 240 475 240" fill="none" stroke="#70b386" stroke-width="2.2"/>
  <polygon points="475,240 466,235 466,245" fill="#70b386"/>

  <!-- Merkez kontrol bloğu -->
  <g filter="url(#shadow)">
    <rect x="226" y="82" width="188" height="150" rx="25" fill="url(#core)" stroke="#c7ddec" stroke-width="1.2"/>
    <rect x="246" y="99" width="148" height="30" rx="11" fill="#ffffff" opacity="0.77"/>
    <text x="320" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#36516a" font-weight="700">Yer çekimi telafisi</text>

    <!-- robot arm -->
    <circle cx="274" cy="181" r="16" fill="#769cc0"/>
    <circle cx="274" cy="181" r="6" fill="#eef7ff"/>
    <path d="M282 174 L322 151 L351 180" fill="none" stroke="#507da8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M282 174 L322 151 L351 180" fill="none" stroke="#9cc0dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="322" cy="151" r="10" fill="#638db5"/>
    <circle cx="351" cy="180" r="9" fill="#638db5"/>
    <path d="M351 180 L365 176 M351 180 L362 188" fill="none" stroke="#486f93" stroke-width="4" stroke-linecap="round"/>

    <!-- control signal -->
    <path d="M248 207 L275 207 L284 197 L296 216 L307 202 L321 207" fill="none" stroke="#7663a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="335" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53506f">G(q) + kontrol</text>
  </g>

  <!-- Bottom benefit strip -->
  <g filter="url(#smallShadow)">
    <rect x="180" y="279" width="280" height="27" rx="13" fill="#ffffff" opacity="0.92"/>
    <circle cx="201" cy="292" r="6" fill="#74bf8c"/>
    <text x="214" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426451">Daha az akım</text>
    <path d="M300 286 L300 298" stroke="#c8d8cf" stroke-width="1"/>
    <circle cx="319" cy="292" r="6" fill="#78aeda"/>
    <text x="332" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42606f">Dengeli hareket</text>
  </g>
</svg>