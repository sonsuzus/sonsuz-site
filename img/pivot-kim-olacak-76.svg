<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Pivot Seçimi ve Toplumsal Hiyerarşi</text>

  <!-- Merkez pivot kutusu -->
  <rect x="255" y="45" width="130" height="40" rx="10" fill="url(#box2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="69" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Pivot / Ölçüt</text>

  <!-- Sol üst: Quicksort -->
  <rect x="30" y="45" width="140" height="40" rx="10" fill="url(#box1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="100" y="69" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Quicksort</text>

  <!-- Sağ üst: Toplumsal sıralama -->
  <rect x="470" y="45" width="140" height="40" rx="10" fill="url(#box4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="540" y="69" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Toplumsal Sıralama</text>

  <!-- Oklar merkezden -->
  <!-- Sol ok -->
  <path d="M255 65 L175 65" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="175,60 187,65 175,70" fill="#475569"/>

  <!-- Sağ ok -->
  <path d="M385 65 L465 65" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="465,60 453,65 465,70" fill="#475569"/>

  <!-- Alt sol: Böl ve yönet -->
  <rect x="30" y="120" width="140" height="36" rx="8" fill="url(#box3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="100" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#064e3b">Böl ve Yönet</text>

  <!-- Alt orta: Karşılaştırma -->
  <rect x="250" y="120" width="140" height="36" rx="8" fill="url(#box1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a8a">Karşılaştırma Kuralı</text>

  <!-- Alt sağ: Hiyerarşi -->
  <rect x="470" y="120" width="140" height="36" rx="8" fill="url(#box5)" filter="url(#shadow)" opacity="0.95"/>
  <text x="540" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c1d95">Hiyerarşi Oluşumu</text>

  <!-- Oklar aşağı -->
  <path d="M100 85 L100 115" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="95,115 100,125 105,115" fill="#475569"/>

  <path d="M320 85 L320 115" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="315,115 320,125 325,115" fill="#475569"/>

  <path d="M540 85 L540 115" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="535,115 540,125 545,115" fill="#475569"/>

  <!-- En alt: Adalet / Eşitlik -->
  <rect x="200" y="190" width="240" height="40" rx="10" fill="url(#box6)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Algoritmik Adalet</text>

  <!-- Oklar alt kutulardan adalete -->
  <path d="M100 156 L100 175 L250 175 L250 185" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="245,185 250,195 255,185" fill="#475569"/>

  <path d="M320 156 L320 185" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="315,185 320,195 325,185" fill="#475569"/>

  <path d="M540 156 L540 175 L390 175 L390 185" stroke="#475569" stroke-width="1.8" fill="none"/>
  <polygon points="385,185 390,195 395,185" fill="#475569"/>

  <!-- Alt bilgi: Dengesizlik uyarısı -->
  <rect x="30" y="255" width="180" height="40" rx="8" fill="#fee2e2" filter="url(#shadow)" opacity="0.9"/>
  <text x="120" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#991b1b">Dengesiz Pivot</text>
  <text x="120" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#991b1b">O(n²) riski</text>

  <!-- Alt bilgi: Eşitlik formülü -->
  <rect x="430" y="255" width="180" height="40" rx="8" fill="#dcfce7" filter="url(#shadow)" opacity="0.9"/>
  <text x="520" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#166534">Fırsat Eşitliği</text>
  <text x="520" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#166534">P(Ŷ=1 | Y=1, A=a)</text>

  <!-- Orta alt bağlantı -->
  <path d="M320 230 L320 250" stroke="#475569" stroke-width="1.8" fill="none"/>
  <path d="M120 250 L120 255" stroke="#475569" stroke-width="1.8" fill="none"/>
  <path d="M520 250 L520 255" stroke="#475569" stroke-width="1.8" fill="none"/>

  <!-- Etiket: Verimlilik vs Adalet -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-style="italic" fill="#475569">Hızlı olmak, adil olmak değildir</text>
</svg>