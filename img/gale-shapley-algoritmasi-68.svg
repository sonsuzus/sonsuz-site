  <polygon points="244,152 254,157 244,162" fill="#6f9fca"/>
  <path d="M191 197 H225 Q234 197 234 188 V178 H244" fill="none" stroke="#6f9fca" stroke-width="2.2"/>
  <polygon points="244,173 254,178 244,183" fill="#6f9fca"/>

  <text x="320" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#876331">Geçici Kabul</text>
  <circle cx="320" cy="137" r="34" fill="#fffaf0" stroke="#e8bf6f" stroke-width="2" filter="url(#soft)"/>
  <path d="M306 137 L316 147 L336 125" fill="none" stroke="#d39a3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b6848">Karşılaştır</text>
  <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b6848">Daha iyiyi tut</text>
  <text x="320" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7b48">Reddet ve sıradakine geç</text>

  <path d="M396 137 H435 Q444 137 444 128 V117 H449" fill="none" stroke="#5ca87a" stroke-width="2.2"/>
  <polygon points="449,112 459,117 449,122" fill="#5ca87a"/>
  <path d="M396 157 H449" fill="none" stroke="#5ca87a" stroke-width="2.2"/>
  <polygon points="449,152 459,157 449,162" fill="#5ca87a"/>
  <path d="M396 177 H435 Q444 177 444 188 V197 H449" fill="none" stroke="#5ca87a" stroke-width="2.2"/>
  <polygon points="449,192 459,197 449,202" fill="#5ca87a"/>

  <path d="M500 240 V257 H141 V240" fill="none" stroke="#c68675" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="136,240 141,230 146,240" fill="#c68675"/>
  <text x="320" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b6658">Red: yeni tercih</text>

  <g filter="url(#shadow)">
    <rect x="169" y="273" width="302" height="34" rx="15" fill="#ffffff" stroke="#c9deda"/>
  </g>
  <circle cx="193" cy="290" r="9" fill="#73b98a"/>
  <path d="M189 290 L192 293 L198 286" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="212" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6751">Kararlı Eşleştirme</text>
  <text x="448" y="294" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668072">Engelleyici çift yok</text>
