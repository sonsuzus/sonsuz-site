<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8eabd9"/>
      <stop offset="100%" stop-color="#6989bb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6f8297" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6f8297" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="160" r="129" fill="#dceaf3" opacity="0.38"/>
  <circle cx="319" cy="160" r="91" fill="none" stroke="#b7cddd" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- Cycle paths -->
  <path d="M210 107 C232 70 264 53 299 51" fill="none" stroke="#86a1bf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="298,45 311,52 297,58" fill="#86a1bf"/>
  <path d="M393 72 C431 86 451 111 457 137" fill="none" stroke="#d69b70" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="451,136 459,149 464,134" fill="#d69b70"/>
  <path d="M438 204 C416 240 380 260 346 266" fill="none" stroke="#a77caa" stroke-width="2.5" stroke-linecap="round"/>
