<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d8f5e8"/>
    </linearGradient>
    <linearGradient id="matrixGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e8ff"/>
      <stop offset="100%" stop-color="#e1efff"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d9"/>
      <stop offset="100%" stop-color="#ffe2e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="65" cy="35" r="72" fill="#dcefff" opacity="0.42"/>
  <circle cx="585" cy="277" r="102" fill="#dff4df" opacity="0.42"/>
  <circle cx="449" cy="43" r="35" fill="#f6e5ff" opacity="0.55"/>

