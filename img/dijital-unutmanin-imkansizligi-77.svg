<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Dijital Unutmanın İmkânsızlığı</text>

  <!-- Merkez kavram -->
  <rect x="255" y="50" width="130" height="44" rx="10" fill="url(#g1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">Silinen Veri</text>

  <!-- Sol üst: Kullanıcı algısı -->
  <rect x="30" y="50" width="140" height="44" rx="10" fill="url(#g2)" filter="url(#shadow)" opacity="0.9"/>
  <text x="100" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Kullanıcı Algısı</text>

  <!-- Sağ üst: Teknik gerçeklik -->
  <rect x="470" y="50" width="140" height="44" rx="10" fill="url(#g3)" filter="url(#shadow)" opacity="0.9"/>
  <text x="540" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">Teknik Gerçeklik</text>

  <!-- Oklar: merkezden -->
  <path d="M255 72 L170 72" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
  <polygon points="170,72 182,66 182,78" fill="#94a3b8"/>

  <path d="M385 72 L470 72" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
  <polygon points="470,72 458,66 458,78" fill="#94a3b8"/>

  <!-- Alt sol: İnsan hafızası -->
  <rect x="30" y="140" width="140" height="44" rx="10" fill="url(#g4)" filter="url(#shadow)" opacity="0.9"/>
  <text x="100" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">İnsan Hafızası</text>

  <!-- Alt orta: Üzerine yazma -->
  <rect x="250" y="140" width="140" height="44" rx="10" fill="url(#g5)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">Üzerine Yazma</text>

  <!-- Alt sağ: Bulut kopyaları -->
  <rect x="470" y="140" width="140" height="44" rx="10" fill="url(#g1)" filter="url(#shadow)" opacity="0.9"/>
  <text x="540" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">Bulut Kopyaları</text>

  <!-- Oklar: alt katman -->
  <path d="M100 94 L100 140" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
  <polygon points="100,140 94,128 106,128" fill="#94a3b8"/>

  <path d="M320 94 L320 140" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
  <polygon points="320,140 314,128 326,128" fill="#94a3b8"/>

  <path d="M540 94 L540 140" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
  <polygon points="540,140 534,128 546,128" fill="#94a3b8"/>

  <!-- Alt bilgi: Formül -->
  <rect x="170" y="220" width="300" height="40" rx="10" fill="#e2e8f0" filter="url(#shadow)" opacity="0.85"/>
  <text x="320" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">K = P(B) × P(E)  |  P(T) = pⁿ</text>

  <!-- Alt bağlam -->
  <rect x="170" y="275" width="300" height="30" rx="8" fill="#f1f5f9" filter="url(#shadow)" opacity="0.8"/>
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Unutma hakkı ve dijital kalıcılık</text>

  <!-- Bağlantı çizgileri alt -->
  <path d="M100 184 L100 220" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M320 184 L320 220" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M540 184 L540 220" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <path d="M320 260 L320 275" stroke="#cbd5e1" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
</svg>