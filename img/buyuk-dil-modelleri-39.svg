    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6c8a85" flood-opacity="0.14"/>
    </filter>
  </defs>

