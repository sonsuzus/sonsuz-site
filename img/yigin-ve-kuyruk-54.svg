<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="stackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd9ff"/>
      <stop offset="100%" stop-color="#9fb8f2"/>
    </linearGradient>
    <linearGradient id="queueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bfead8"/>
      <stop offset="100%" stop-color="#91d5bd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
