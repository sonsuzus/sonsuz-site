  <text x="484" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6f5e">Fatura</text>
  <text x="537" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6f5e">Sunum</text>

  <path d="M570 187 L584 187" fill="none" stroke="#4ca887" stroke-width="2.5"/>
  <polygon points="582,182 582,192 590,187" fill="#4ca887"/>
  <text x="515" y="227" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43846e">enqueue</text>
  <path d="M545 218 L545 207" fill="none" stroke="#4ca887" stroke-width="2"/>
