<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7169d8"/>
      <stop offset="100%" stop-color="#4e9ec5"/>
    </linearGradient>
    <linearGradient id="h5p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8b8"/>
      <stop offset="100%" stop-color="#ffd49f"/>
    </linearGradient>
    <linearGradient id="moodle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9efdb"/>
      <stop offset="100%" stop-color="#b9dfc5"/>
    </linearGradient>
    <linearGradient id="bank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#c6d8fb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#52657a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52657a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="73" cy="51" r="58" fill="#cdeeff" opacity="0.34"/>
  <circle cx="586" cy="283" r="85" fill="#d9f0c7" opacity="0.33"/>
  <circle cx="557" cy="38" r="25" fill="#fce6b7" opacity="0.38"/>

  <!-- Bağlantılar -->
  <path d="M166 99 C208 99 220 121 253 135" fill="none" stroke="#8aa2b7" stroke-width="2.5"/>
  <polygon points="248,129 260,137 246,140" fill="#8aa2b7"/>
  <path d="M476 100 C435 100 422 119 389 135" fill="none" stroke="#8aa2b7" stroke-width="2.5"/>
  <polygon points="394,129 382,137 396,140" fill="#8aa2b7"/>
  <path d="M320 222 C320 239 320 249 320 262" fill="none" stroke="#8aa2b7" stroke-width="2.5"/>
  <polygon points="314,257 320,268 326,257" fill="#8aa2b7"/>
  <path d="M254 184 C213 190 197 206 171 216" fill="none" stroke="#a1b1bd" stroke-width="2"/>
  <polygon points="177,209 165,218 180,220" fill="#a1b1bd"/>
  <path d="M387 184 C430 190 444 205 470 216" fill="none" stroke="#a1b1bd" stroke-width="2"/>
  <polygon points="460,220 475,218 463,209" fill="#a1b1bd"/>

  <!-- H5P -->
  <g filter="url(#shadow)">
    <rect x="46" y="51" width="122" height="96" rx="19" fill="url(#h5p)"/>
    <rect x="57" y="63" width="36" height="31" rx="9" fill="#fff7df" opacity="0.9"/>
    <circle cx="69" cy="78" r="5" fill="#e7a740"/>
    <path d="M80 72 L86 78 L80 84" fill="none" stroke="#c67d2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="78" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#75551d">H5P</text>
    <text x="59" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f5b37">Etkileşimli soru</text>
    <text x="59" y="131" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f5b37">Geri bildirim</text>
  </g>

  <!-- Moodle -->
  <g filter="url(#shadow)">
    <rect x="473" y="51" width="122" height="96" rx="19" fill="url(#moodle)"/>
    <rect x="485" y="63" width="35" height="31" rx="9" fill="#f6fff4" opacity="0.92"/>
    <circle cx="502" cy="72" r="5" fill="#69a879"/>
    <path d="M492 86 C494 79 510 79 512 86" fill="none" stroke="#49895b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="529" y="78" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#376a46">Moodle</text>
    <text x="486" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426c4b">Kullanıcı ve not</text>
    <text x="486" y="131" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426c4b">Raporlama</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="245" y="115" width="150" height="108" rx="25" fill="url(#core)"/>
    <circle cx="320" cy="150" r="21" fill="#ffffff" opacity="0.17"/>
    <path d="M309 150 L317 158 L333 141" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ZEKA PLATFORMU</text>
    <text x="320" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e8f6ff">Uyarlanabilir deneyim</text>
  </g>

  <!-- Soru bankası -->
  <g filter="url(#shadow)">
    <rect x="221" y="263" width="198" height="43" rx="16" fill="url(#bank)"/>
    <ellipse cx="250" cy="278" rx="13" ry="5" fill="#7092ca"/>
    <path d="M237 278 V290 C237 297 263 297 263 290 V278" fill="#88a7d9"/>
    <ellipse cx="250" cy="290" rx="13" ry="5" fill="#88a7d9"/>
    <text x="278" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405d91">Özel Soru Bankası</text>
    <text x="278" y="298" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58729e">API · sürüm · istatistik</text>
  </g>

  <!-- Sol mikro kart -->
  <g filter="url(#soft)">
    <rect x="45" y="194" width="124" height="61" rx="16" fill="#ffffff" opacity="0.94"/>
    <circle cx="65" cy="215" r="10" fill="#e9d7ff"/>
    <path d="M61 215 L64 218 L69 211" fill="none" stroke="#8d62b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b6171">Çözüm verisi</text>
    <text x="57" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78818d">Süre · ipucu · sonuç</text>
  </g>

  <!-- Sağ mikro kart -->
  <g filter="url(#soft)">
    <rect x="471" y="194" width="124" height="61" rx="16" fill="#ffffff" opacity="0.94"/>
    <path d="M493 226 V215 M501 226 V208 M509 226 V211" stroke="#6191b9" stroke-width="4" stroke-linecap="round"/>
    <text x="522" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b6171">Analiz</text>
    <text x="483" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78818d">p = D / N · z = 1-p</text>
  </g>

  <!-- Alt geri besleme -->
  <path d="M446 281 C485 277 506 265 520 248" fill="none" stroke="#9ab786" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="513,250 523,243 521,256" fill="#9ab786"/>
  <text x="438" y="303" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f8b62">zorluk uyarlama</text>
</svg>