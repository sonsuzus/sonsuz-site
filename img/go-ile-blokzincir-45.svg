<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#e8f0e8"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#5a9bd9"/>
    </linearGradient>
    <linearGradient id="block1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4fa"/>
    </linearGradient>
    <linearGradient id="block2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f8f0"/>
    </linearGradient>
    <linearGradient id="block3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f0f8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık çubuğu -->
  <rect x="0" y="0" width="640" height="40" fill="url(#header)" rx="12"/>
  <rect x="0" y="25" width="640" height="15" fill="url(#header)"/>
  <text x="320" y="26" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Go ile Blokzincir Temelleri</text>

  <!-- Eksen: Veri Akışı -->
  <text x="30" y="65" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6a8a" font-weight="bold">Veri Akışı</text>
  <line x1="30" y1="70" x2="610" y2="70" stroke="#4a6a8a" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>

  <!-- Bileşen Blokları - 3 ana blok + doğrulama -->
  <!-- Blok 1: Genesis -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="130" height="100" rx="10" fill="url(#block1)" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="105" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a90d9">Genesis</text>
    <line x1="55" y1="120" x2="155" y2="120" stroke="#d0d8e8" stroke-width="1"/>
    <text x="60" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Index: 0</text>
    <text x="60" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Data: Başlangıç</text>
    <text x="60" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Prev: —</text>
    <text x="60" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a90d9" font-weight="bold">Hash: H0</text>
  </g>

  <!-- Bağlantı 1-->
  <g>
    <line x1="170" y1="140" x2="210" y2="140" stroke="#2a5a8a" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="190" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2a5a8a">PrevHash</text>
  </g>

  <!-- Blok 2 -->
  <g filter="url(#shadow)">
    <rect x="210" y="75" width="130" height="100" rx="10" fill="url(#block2)" stroke="#5a9bd9" stroke-width="1.5"/>
    <text x="275" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a8a5a">Blok 1</text>
    <line x1="225" y1="105" x2="325" y2="105" stroke="#d0e8d8" stroke-width="1"/>
    <text x="230" y="121" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Index: 1</text>
    <text x="230" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Data: İşlem</text>
    <text x="230" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Prev: H0</text>
    <text x="230" y="163" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a8a5a" font-weight="bold">Hash: H1</text>
  </g>

  <!-- Bağlantı 2 -->
  <g>
    <line x1="340" y1="125" x2="380" y2="125" stroke="#2a5a8a" stroke-width="2.5"/>
    <text x="360" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2a5a8a">PrevHash</text>
  </g>

  <!-- Blok 3 -->
  <g filter="url(#shadow)">
    <rect x="380" y="60" width="130" height="100" rx="10" fill="url(#block3)" stroke="#9b59b6" stroke-width="1.5"/>
    <text x="445" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">Blok 2</text>
    <line x1="395" y1="90" x2="495" y2="90" stroke="#e8d8f0" stroke-width="1"/>
    <text x="400" y="106" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Index: 2</text>
    <text x="400" y="120" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Data: İşlem</text>
    <text x="400" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Prev: H1</text>
    <text x="400" y="148" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8e44ad" font-weight="bold">Hash: H2</text>
  </g>

  <!-- Sağ tarafta Doğrulama kutusu -->
  <g filter="url(#shadowLight)">
    <rect x="530" y="130" width="95" height="65" rx="8" fill="#fff8e8" stroke="#e6b800" stroke-width="1.2"/>
    <text x="577" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#cc8800">Doğrulama</text>
    <line x1="542" y1="160" x2="612" y2="160" stroke="#f0e0c0" stroke-width="1"/>
    <text x="547" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#666">isChainValid()</text>
    <text x="547" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a8a5a">✓ Zincir Sağlam</text>
  </g>

  <!-- Doğrulama bağlantısı -->
  <line x1="510" y1="110" x2="535" y2="145" stroke="#e6b800" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="505" y="120" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#cc8800">Hash kontrol</text>

  <!-- Alt bilgi: Değişmezlik vurgusu -->
  <rect x="40" y="225" width="560" height="55" rx="8" fill="#ffffff80" filter="url(#shadowLight)"/>
  <text x="320" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#d04040">⚠ Blok 1 değiştirilirse → Blok 2 bozulur → Geçersiz Zincir</text>
  <text x="320" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#666">Kriptografik Hash = SHA256(Index + Zaman + Veri + ÖncekiHash)</text>

  <!-- Alt etiketler -->
  <text x="30" y="310" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#888">Go + SHA-256</text>
  <text x="610" y="310" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#888">Kavramsal Mimari</text>
  <rect x="580" y="300" width="20" height="2" rx="1" fill="#4a90d9"/>
</svg>