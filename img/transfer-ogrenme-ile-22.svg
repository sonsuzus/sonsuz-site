<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="sourceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9dcff"/>
      <stop offset="100%" stop-color="#aebfed"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e6"/>
      <stop offset="100%" stop-color="#aee0c6"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7bd"/>
      <stop offset="100%" stop-color="#f5c77e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#58708a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="592" cy="38" r="72" fill="#dff3e8" opacity="0.55"/>
  <circle cx="52" cy="280" r="88" fill="#dce9ff" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516c">TRANSFER ÖĞRENME</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698095">Az veri ile güçlü başlangıç</text>

  <!-- Source data -->
  <g filter="url(#shadow)">
    <rect x="28" y="83" width="118" height="152" rx="18" fill="#ffffff"/>
    <rect x="39" y="95" width="96" height="38" rx="11" fill="url(#sourceGrad)"/>
    <path d="M51 120 L65 108 L77 117 L91 103 L119 121" fill="none" stroke="#5875a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="61" cy="106" r="4" fill="#ffffff" opacity="0.9"/>
    <text x="87" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5774">Kaynak Veri</text>
    <text x="87" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72859b">Milyonlarca örnek</text>
    <rect x="49" y="190" width="76" height="25" rx="9" fill="#eaf1ff"/>
    <text x="87" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58719a">Ön eğitim</text>
  </g>

  <!-- arrow 1 -->
  <path d="M153 159 H181" fill="none" stroke="#7590aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="181,153 192,159 181,165" fill="#7590aa"/>

  <!-- Pretrained backbone -->
  <g filter="url(#shadow)">
    <rect x="194" y="72" width="187" height="174" rx="20" fill="#ffffff"/>
    <rect x="207" y="86" width="161" height="30" rx="11" fill="url(#coreGrad)"/>
    <text x="287" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356d5b">Önceden Eğitilmiş Omurga</text>

    <g filter="url(#softShadow)">
      <rect x="218" y="132" width="32" height="76" rx="8" fill="#c5e8d6"/>
      <rect x="258" y="132" width="32" height="76" rx="8" fill="#b8ddce"/>
      <rect x="298" y="132" width="32" height="76" rx="8" fill="#a9d3c2"/>
      <rect x="338" y="132" width="19" height="76" rx="8" fill="#93c7b0"/>
    </g>
    <text x="234" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386b5c">Kenar</text>
    <text x="274" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386b5c">Doku</text>
    <text x="314" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386b5c">Parça</text>
    <path d="M215 219 H360" stroke="#d9ebe1" stroke-width="1"/>
    <text x="287" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#638575">wₜ⁽⁰⁾ = wₛ</text>
  </g>

  <!-- Target small data top -->
  <g filter="url(#shadow)">
    <rect x="416" y="49" width="190" height="74" rx="18" fill="#ffffff"/>
    <rect x="430" y="63" width="43" height="43" rx="11" fill="url(#targetGrad)"/>
    <circle cx="444" cy="77" r="6" fill="#ffffff" opacity="0.86"/>
    <path d="M434 97 Q445 84 459 97" fill="none" stroke="#bc7c35" stroke-width="2"/>
    <text x="486" y="78" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#68523d">Hedef Veri</text>
    <text x="486" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d7863">Birkaç yüz örnek</text>
  </g>

  <!-- connector from source target to core -->
  <path d="M416 108 C400 108 397 122 381 143" fill="none" stroke="#d09a55" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="380,136 378,148 389,143" fill="#d09a55"/>

  <!-- Branch guides -->
  <path d="M382 185 H398 V171 H415" fill="none" stroke="#7590aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="415,165 426,171 415,177" fill="#7590aa"/>
  <path d="M382 202 H398 V253 H415" fill="none" stroke="#7590aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="415,247 426,253 415,259" fill="#7590aa"/>

  <!-- Strategy 1 -->
  <g filter="url(#shadow)">
    <rect x="428" y="137" width="178" height="69" rx="17" fill="#ffffff"/>
    <rect x="440" y="150" width="27" height="27" rx="8" fill="#dce9ff"/>
    <path d="M448 158 H459 M448 164 H459 M448 170 H455" stroke="#5c7fb2" stroke-width="2" stroke-linecap="round"/>
    <text x="479" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425c7b">Özellik Çıkarımı</text>
    <text x="479" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718399">Omurga dondurulur</text>
    <rect x="545" y="165" width="45" height="22" rx="8" fill="#e7f6ed"/>
    <text x="567" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#478064">Az veri</text>
  </g>

  <!-- Strategy 2 -->
  <g filter="url(#shadow)">
    <rect x="428" y="219" width="178" height="70" rx="17" fill="#ffffff"/>
    <rect x="440" y="233" width="27" height="27" rx="8" fill="#ffe8c3"/>
    <path d="M448 251 C452 241 458 241 460 251" fill="none" stroke="#b97a30" stroke-width="2" stroke-linecap="round"/>
    <text x="479" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765538">İnce Ayar</text>
    <text x="479" y="262" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7a69">Üst katmanlar açılır</text>
    <rect x="539" y="247" width="51" height="22" rx="8" fill="#fff2db"/>
    <text x="564" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a66e2c">Düşük hız</text>
  </g>

  <!-- small tuning pulse -->
  <path d="M400 253 C405 247 410 259 415 253" fill="none" stroke="#77aa94" stroke-width="2" stroke-linecap="round"/>
</svg>