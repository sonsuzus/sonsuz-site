<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="100%" stop-color="#dff4df"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#64748b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="320" cy="159" r="124" fill="#dceef1" opacity="0.32"/>
  <circle cx="320" cy="159" r="93" fill="#ffffff" opacity="0.44"/>

  <!-- Bağlantılar -->
  <path d="M177 87 C211 91 227 108 248 126" fill="none" stroke="#8ba9ba" stroke-width="2"/>
  <polygon points="248,126 239,124 243,117" fill="#8ba9ba"/>
  <path d="M176 160 C202 160 218 160 242 160" fill="none" stroke="#8ba9ba" stroke-width="2"/>
  <polygon points="242,160 233,155 233,165" fill="#8ba9ba"/>
  <path d="M177 234 C208 226 226 208 248 191" fill="none" stroke="#8ba9ba" stroke-width="2"/>
  <polygon points="248,191 239,194 243,201" fill="#8ba9ba"/>

  <path d="M394 160 C419 160 431 160 455 160" fill="none" stroke="#6fa58a" stroke-width="2.5"/>
  <polygon points="455,160 446,155 446,165" fill="#6fa58a"/>

  <!-- Sol bileşenler -->
  <g filter="url(#hafifGolge)">
    <rect x="34" y="57" width="143" height="60" rx="16" fill="#fff4dd"/>
    <circle cx="59" cy="87" r="14" fill="#f6c978"/>
    <path d="M53 87 L57 92 L66 81" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5f4b25">Teknik doğruluk</text>
    <text x="82" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806a3a">T</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="34" y="130" width="143" height="60" rx="16" fill="#f2e8fa"/>
    <circle cx="59" cy="160" r="14" fill="#c59bdd"/>
    <path d="M53 161 C56 155 62 155 65 161" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="56" cy="156" r="2.2" fill="#ffffff"/>
    <circle cx="63" cy="156" r="2.2" fill="#ffffff"/>
    <text x="82" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#594466">Psikolojik güven</text>
    <text x="82" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#786182">G</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="34" y="203" width="143" height="60" rx="16" fill="#e4f4f6"/>
    <circle cx="59" cy="233" r="14" fill="#77c7cd"/>
    <path d="M53 228 L65 228 M53 233 L63 233 M53 238 L60 238" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="229" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355d61">Açıklık</text>
    <text x="82" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#518084">A</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#golge)">
    <rect x="244" y="105" width="152" height="110" rx="28" fill="url(#merkez)" stroke="#b9d9d2" stroke-width="1.5"/>
    <circle cx="320" cy="137" r="22" fill="#ffffff" opacity="0.86"/>
    <path d="M310 137 L317 144 L331 129" fill="none" stroke="#57a478" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#285d4d">İnceleme kalitesi</text>
    <text x="320" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b796b">Q = T × G × A</text>
  </g>

  <!-- Sağ sonuç -->
  <g filter="url(#golge)">
    <rect x="455" y="83" width="152" height="154" rx="22" fill="#ffffff" stroke="#c9e3d1" stroke-width="1.5"/>
    <rect x="472" y="101" width="118" height="31" rx="11" fill="#dff3e4"/>
    <text x="531" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35704a">Birlikte iyileştirme</text>

    <circle cx="483" cy="154" r="5" fill="#75b98c"/>
    <text x="497" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496353">Koda odaklan</text>

    <circle cx="483" cy="181" r="5" fill="#75b98c"/>
    <text x="497" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496353">Somut geri bildirim</text>

    <circle cx="483" cy="208" r="5" fill="#75b98c"/>
    <text x="497" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496353">Ortak öğrenme</text>
  </g>

  <!-- Alt vurgu -->
  <g filter="url(#hafifGolge)">
    <rect x="201" y="273" width="238" height="29" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="320" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e6570">Ego değil, ürün ve ekip</text>
  </g>
</svg>