<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f4ff"/>
      <stop offset="100%" stop-color="#dff2e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7190a0" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7891a0" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M0 257 C92 231 126 282 216 254 S377 218 467 250 S563 277 640 232 L640 320 L0 320Z" fill="#dcefe5" opacity="0.55"/>
  <path d="M0 276 C92 251 156 296 253 267 S408 248 517 272 S590 278 640 263" fill="none" stroke="#c6e2d4" stroke-width="2" opacity="0.7"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#395365">Kritik Enerji Altyapısında Saldırı Tespiti</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718795">Pasif izleme • Ağ ve fiziksel süreç bağlamı</text>

  <!-- enerji sahası -->
  <g filter="url(#shadow)">
    <rect x="27" y="83" width="137" height="164" rx="18" fill="#edf6ff" stroke="#c7dded"/>
    <rect x="43" y="101" width="105" height="30" rx="10" fill="#ffffff"/>
    <text x="60" y="121" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31556b">Enerji Sahası</text>

    <rect x="43" y="145" width="43" height="72" rx="11" fill="#d9ebfa" stroke="#b7d5ea"/>
    <rect x="101" y="145" width="47" height="72" rx="11" fill="#e4f2dc" stroke="#c9e1bd"/>
    <text x="51" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426174">RTU</text>
    <text x="51" y="186" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426174">SCADA</text>
    <text x="108" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456440">Röle</text>
    <text x="108" y="186" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456440">Kesici</text>

    <path d="M86 181 L101 181" stroke="#7694a5" stroke-width="2"/>
    <circle cx="93.5" cy="181" r="3" fill="#f2b66b"/>
    <path d="M119 198 L119 207 M113 207 L125 207" stroke="#6d9b75" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- mirror split -->
  <path d="M164 170 L191 170" stroke="#7f9baa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="191,170 184,165 184,175" fill="#7f9baa"/>
  <path d="M180 170 L180 112 L204 112" fill="none" stroke="#91b9cf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="204,112 197,107 197,117" fill="#91b9cf"/>
  <text x="170" y="102" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#618394">Ayna portu</text>

  <!-- passive sensor -->
  <g filter="url(#shadow)">
    <rect x="205" y="78" width="146" height="112" rx="18" fill="#fffdf5" stroke="#eadfbd"/>
    <circle cx="232" cy="109" r="17" fill="#fae3a9"/>
    <path d="M224 111 C228 102 235 102 240 109 C236 116 230 118 224 111Z" fill="none" stroke="#a9792c" stroke-width="2"/>
    <circle cx="231" cy="110" r="2.5" fill="#a9792c"/>
    <text x="258" y="107" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6f582c">Pasif Sensör</text>
    <text x="222" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#817253">Modbus • DNP3 • IEC 104</text>
    <rect x="222" y="157" width="112" height="13" rx="6.5" fill="#f6edcf"/>
    <rect x="222" y="157" width="76" height="13" rx="6.5" fill="#e5bf70"/>
  </g>

  <!-- sensor to detection -->
  <path d="M351 134 L377 134" stroke="#7f9baa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="377,134 370,129 370,139" fill="#7f9baa"/>

  <!-- detection engine -->
  <g filter="url(#shadow)">
    <rect x="378" y="70" width="146" height="130" rx="18" fill="#f4edff" stroke="#d9c9ee"/>
    <text x="399" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#60477c">Tespit Katmanı</text>

    <rect x="395" y="110" width="112" height="23" rx="8" fill="#ffffff"/>
    <circle cx="408" cy="121.5" r="5" fill="#b78cd5"/>
    <text x="421" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b5b7b">İmza</text>

    <rect x="395" y="140" width="112" height="23" rx="8" fill="#ffffff"/>
    <path d="M404 155 L409 150 L414 156 L420 146" fill="none" stroke="#768bc7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="429" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b5b7b">Anomali</text>

    <rect x="395" y="170" width="112" height="18" rx="8" fill="#ffffff"/>
    <text x="409" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b5b7b">Kural ve süreç</text>
  </g>

  <!-- data context upper route -->
  <path d="M292 190 L292 229 L410 229 L410 215" fill="none" stroke="#9ab8aa" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="410,215 405,222 415,222" fill="#9ab8aa"/>
  <text x="281" y="249" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668477">Süreç verisi ve zaman bağlamı</text>

  <!-- alert -->
  <path d="M524 135 L548 135" stroke="#7f9baa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="548,135 541,130 541,140" fill="#7f9baa"/>

  <g filter="url(#shadow)">
    <rect x="549" y="91" width="68" height="88" rx="18" fill="#fff0ed" stroke="#efc7bd"/>
    <path d="M583 108 L601 142 L565 142 Z" fill="#f2a38d"/>
    <rect x="582" y="119" width="3" height="12" rx="1.5" fill="#ffffff"/>
    <circle cx="583.5" cy="136" r="2" fill="#ffffff"/>
    <text x="559" y="163" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a5145">İnceleme</text>
  </g>

  <!-- Safe response lower -->
  <path d="M583 179 L583 210" stroke="#819ba8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="583,210 578,203 588,203" fill="#819ba8"/>
  <g filter="url(#smallShadow)">
    <rect x="509" y="212" width="108" height="56" rx="15" fill="#e4f4e8" stroke="#bee0c7"/>
    <path d="M529 239 L535 245 L547 231" fill="none" stroke="#559467" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="554" y="236" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#417a51">Güvenli</text>
    <text x="554" y="252" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b8365">Müdahale</text>
  </g>

  <!-- status legend -->
  <g filter="url(#smallShadow)">
    <rect x="27" y="276" width="404" height="25" rx="12" fill="#ffffff" opacity="0.88"/>
    <circle cx="45" cy="288.5" r="5" fill="#84c99a"/>
    <text x="57" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587267">Normal davranış</text>
    <circle cx="183" cy="288.5" r="5" fill="#f0b35d"/>
    <text x="195" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75674c">Eşik aşımı</text>
    <circle cx="301" cy="288.5" r="5" fill="#e58378"/>
    <text x="313" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#775856">Doğrulama gerekli</text>
  </g>
</svg>