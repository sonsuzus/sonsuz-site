<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python Kümeler</text>

  <!-- Merkez küme kutusu -->
  <rect x="245" y="55" width="150" height="45" rx="10" fill="#e8f4f8" stroke="#5dade2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Küme (Set)</text>

  <!-- Oluşturma yöntemleri -->
  <rect x="60" y="140" width="180" height="55" rx="10" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Süslü Parantez</text>
  <text x="150" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">kume = {"a", "b"}</text>

  <rect x="400" y="140" width="180" height="55" rx="10" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="490" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">set() Fonksiyonu</text>
  <text x="490" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">kume = set(("a", "b"))</text>

  <!-- Oklar (manuel çizim) -->
  <line x1="290" y1="100" x2="165" y2="138" stroke="#5dade2" stroke-width="1.8"/>
  <polygon points="165,138 172,132 160,132" fill="#5dade2"/>

  <line x1="350" y1="100" x2="475" y2="138" stroke="#5dade2" stroke-width="1.8"/>
  <polygon points="475,138 468,132 480,132" fill="#5dade2"/>

  <!-- Özellikler -->
  <rect x="60" y="235" width="120" height="50" rx="8" fill="#eafaf1" stroke="#58d68d" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="120" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Sırasız</text>
  <text x="120" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555">Endeks yok</text>

  <rect x="200" y="235" width="120" height="50" rx="8" fill="#eafaf1" stroke="#58d68d" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="260" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Değişmez</text>
  <text x="260" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555">Silme ve ekleme</text>

  <rect x="340" y="235" width="120" height="50" rx="8" fill="#eafaf1" stroke="#58d68d" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="400" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Benzersiz</text>
  <text x="400" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555">Tekrar yok</text>

  <rect x="480" y="235" width="120" height="50" rx="8" fill="#eafaf1" stroke="#58d68d" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="540" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Karma Tip</text>
  <text x="540" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555">Farklı türler</text>

  <!-- Özellik bağlantı çizgileri -->
  <line x1="320" y1="100" x2="320" y2="120" stroke="#58d68d" stroke-width="1.5"/>
  <line x1="320" y1="120" x2="120" y2="120" stroke="#58d68d" stroke-width="1.5"/>
  <line x1="320" y1="120" x2="260" y2="120" stroke="#58d68d" stroke-width="1.5"/>
  <line x1="320" y1="120" x2="400" y2="120" stroke="#58d68d" stroke-width="1.5"/>
  <line x1="320" y1="120" x2="540" y2="120" stroke="#58d68d" stroke-width="1.5"/>

  <line x1="120" y1="120" x2="120" y2="233" stroke="#58d68d" stroke-width="1.5"/>
  <polygon points="120,233 116,225 124,225" fill="#58d68d"/>

  <line x1="260" y1="120" x2="260" y2="233" stroke="#58d68d" stroke-width="1.5"/>
  <polygon points="260,233 256,225 264,225" fill="#58d68d"/>

  <line x1="400" y1="120" x2="400" y2="233" stroke="#58d68d" stroke-width="1.5"/>
  <polygon points="400,233 396,225 404,225" fill="#58d68d"/>

  <line x1="540" y1="120" x2="540" y2="233" stroke="#58d68d" stroke-width="1.5"/>
  <polygon points="540,233 536,225 544,225" fill="#58d68d"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Erişim: for döngüsü ile</text>
</svg>