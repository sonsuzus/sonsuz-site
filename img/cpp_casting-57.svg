<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7f0"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d4ecfb"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2f1"/>
      <stop offset="100%" stop-color="#b2dfdb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Veri Türü Dönüştürme</text>

  <!-- Ana kutu: C++ Değişken -->
  <rect x="240" y="50" width="160" height="44" rx="10" fill="url(#box1)" stroke="#90caf9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">C++ Değişken</text>

  <!-- Ok: C++ Değişken -> Dönüştürme Yöntemleri -->
  <path d="M 320 94 L 320 110" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="314,108 320,120 326,108" fill="#546e7a"/>

  <!-- Dönüştürme Yöntemleri başlığı -->
  <rect x="190" y="122" width="260" height="36" rx="10" fill="url(#box2)" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#e65100">Dönüştürme Yöntemleri</text>

  <!-- İki alt dala ayrılan oklar -->
  <path d="M 230 158 L 140 190" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="146,186 136,196 148,198" fill="#546e7a"/>

  <path d="M 410 158 L 500 190" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="494,186 504,196 492,198" fill="#546e7a"/>

  <!-- Sol dal: Üstü Kapalı -->
  <rect x="50" y="192" width="180" height="48" rx="10" fill="url(#box3)" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Üstü Kapalı</text>
  <text x="140" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">(Implicit)</text>

  <!-- Sağ dal: Açık -->
  <rect x="410" y="192" width="180" height="48" rx="10" fill="url(#box4)" stroke="#ef5350" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Açık</text>
  <text x="500" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c62828">(Explicit)</text>

  <!-- Sol alt: Derleyici -->
  <path d="M 140 240 L 140 258" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="134,256 140,268 146,256" fill="#546e7a"/>

  <rect x="50" y="260" width="180" height="40" rx="10" fill="url(#box5)" stroke="#9575cd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4527a0">Derleyici Otomatik</text>

  <!-- Sağ alt: Geçici Dönüşüm -->
  <path d="M 500 240 L 500 258" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="494,256 500,268 506,256" fill="#546e7a"/>

  <rect x="410" y="260" width="180" height="40" rx="10" fill="url(#box6)" stroke="#26a69a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#00695c">Geçici Dönüşüm</text>
  <text x="500" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#00695c">(Type Casting)</text>

  <!-- Örnek kod ipucu -->
  <rect x="240" y="270" width="160" height="34" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1" opacity="0.85" filter="url(#shadow)"/>
  <text x="320" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">int → float</text>
  <text x="320" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c">fd = id;</text>

  <!-- Bilgi notu -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#90a4ae">Değişken değeri korunur, tür geçici olarak değişir</text>
</svg>