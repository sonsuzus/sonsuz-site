<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
    <linearGradient id="queryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b5e7a0"/>
      <stop offset="100%" stop-color="#86d46b"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd3b6"/>
      <stop offset="100%" stop-color="#ffb88c"/>
    </linearGradient>
    <linearGradient id="filterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a5ff"/>
      <stop offset="100%" stop-color="#b980f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">SQL SELECT Sorgu Akışı</text>

  <!-- Veritabanı Kutusu -->
  <rect x="40" y="60" width="130" height="80" rx="12" fill="url(#dbGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="105" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">VERİ TABANI</text>
  <text x="105" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">personel</text>
  <text x="105" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a5276">7 kayıt</text>

  <!-- Tablo İkonu -->
  <rect x="65" y="60" width="18" height="18" rx="3" fill="#ffffff" opacity="0.4"/>
  <line x1="68" y1="65" x2="80" y2="65" stroke="#1a5276" stroke-width="1.5"/>
  <line x1="68" y1="70" x2="80" y2="70" stroke="#1a5276" stroke-width="1.5"/>
  <line x1="68" y1="75" x2="80" y2="75" stroke="#1a5276" stroke-width="1.5"/>

  <!-- Ok 1: Veritabanından Sorguya -->
  <path d="M 170 100 L 235 100" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="235,94 247,100 235,106" fill="#555"/>

  <!-- SELECT Sorgu Kutusu -->
  <rect x="250" y="55" width="150" height="90" rx="12" fill="url(#queryGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="325" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6f3e">SELECT SORGU</text>
  <text x="325" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e6f3e">SELECT *</text>
  <text x="325" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e6f3e">FROM personel</text>
  <text x="325" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e6f3e">sütun seçimi</text>

  <!-- Ok 2: Sorgudan Sonuç Tablosuna -->
  <path d="M 400 100 L 465 100" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="465,94 477,100 465,106" fill="#555"/>

  <!-- Sonuç Tablosu Kutusu -->
  <rect x="480" y="55" width="130" height="90" rx="12" fill="url(#resultGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="545" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8b4513">SONUÇ TABLO</text>
  <text x="545" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8b4513">tüm sütunlar</text>
  <text x="545" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8b4513">7 satır</text>
  <text x="545" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8b4513">veri aktarımı</text>

  <!-- Alt Akış: Filtreleme -->
  <rect x="250" y="190" width="150" height="80" rx="12" fill="url(#filterGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="325" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a235a">FİLTRELEME</text>
  <text x="325" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a235a">WHERE koşulu</text>
  <text x="325" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a235a">istenen satırlar</text>

  <!-- Ok 3: Sorgudan Filtrelemeye -->
  <path d="M 325 145 L 325 185" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="319,185 325,197 331,185" fill="#555"/>

  <!-- Ok 4: Filtrelemeden Sonuca -->
  <path d="M 400 230 L 465 230" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="465,224 477,230 465,236" fill="#555"/>

  <!-- İkinci Sonuç Kutusu -->
  <rect x="480" y="195" width="130" height="70" rx="12" fill="url(#resultGrad)" filter="url(#shadow)" opacity="0.7"/>
  <text x="545" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8b4513">FİLTRELİ</text>
  <text x="545" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8b4513">SONUÇ</text>
  <text x="545" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8b4513">seçili satırlar</text>

  <!-- Alt Bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">Sorgu sonucu yeni bir tabloya aktarılır</text>

  <!-- Dekoratif Noktalar -->
  <circle cx="30" cy="30" r="4" fill="#a8d8ea" opacity="0.5"/>
  <circle cx="610" cy="290" r="5" fill="#b5e7a0" opacity="0.5"/>
  <circle cx="600" cy="25" r="3" fill="#ffd3b6" opacity="0.5"/>
  <circle cx="25" cy="290" r="3" fill="#d4a5ff" opacity="0.5"/>
</svg>