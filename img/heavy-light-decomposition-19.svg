<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f1"/>
    </linearGradient>
    <linearGradient id="treeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf3ff"/>
      <stop offset="100%" stop-color="#e3efff"/>
    </linearGradient>
    <linearGradient id="chainCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eefaf5"/>
      <stop offset="100%" stop-color="#dff4e9"/>
    </linearGradient>
    <linearGradient id="segCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7e8"/>
      <stop offset="100%" stop-color="#ffefd1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5a7290" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#53708a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="610" cy="34" r="78" fill="#dcefff" opacity="0.45"/>
  <circle cx="33" cy="299" r="82" fill="#dff3e4" opacity="0.5"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31516d">AĞIR-HAFİF AYRIŞTIRMA</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8495">Ağaç yolu → zincir aralıkları → hızlı sorgu</text>

  <rect x="24" y="69" width="178" height="218" rx="18" fill="url(#treeCard)" filter="url(#shadow)"/>
  <text x="43" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345873">Ağaç</text>
  <text x="43" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668096">En büyük alt ağaç: ağır</text>

  <line x1="91" y1="137" x2="62" y2="169" stroke="#55748d" stroke-width="3" stroke-linecap="round"/>
  <line x1="91" y1="137" x2="119" y2="169" stroke="#177d99" stroke-width="6" stroke-linecap="round"/>
  <line x1="119" y1="169" x2="105" y2="204" stroke="#177d99" stroke-width="6" stroke-linecap="round"/>
  <line x1="119" y1="169" x2="149" y2="203" stroke="#5c7890" stroke-width="3" stroke-linecap="round"/>
  <line x1="105" y1="204" x2="105" y2="239" stroke="#177d99" stroke-width="6" stroke-linecap="round"/>
  <line x1="62" y1="169" x2="51" y2="207" stroke="#5c7890" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#smallShadow)">
    <circle cx="91" cy="137" r="13" fill="#ffffff"/>
    <circle cx="62" cy="169" r="13" fill="#ffffff"/>
    <circle cx="119" cy="169" r="13" fill="#d9f4f8"/>
    <circle cx="105" cy="204" r="13" fill="#d9f4f8"/>
    <circle cx="149" cy="203" r="13" fill="#ffffff"/>
    <circle cx="105" cy="239" r="13" fill="#d9f4f8"/>
    <circle cx="51" cy="207" r="13" fill="#ffffff"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#31546b">
    <text x="91" y="141">1</text>
    <text x="62" y="173">2</text>
    <text x="119" y="173">3</text>
    <text x="105" y="208">4</text>
    <text x="149" y="207">5</text>
    <text x="105" y="243">6</text>
    <text x="51" y="211">7</text>
  </g>
  <line x1="43" y1="263" x2="71" y2="263" stroke="#177d99" stroke-width="5" stroke-linecap="round"/>
  <text x="79" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547187">Ağır kenar</text>
  <line x1="43" y1="279" x2="71" y2="279" stroke="#617d94" stroke-width="3" stroke-linecap="round"/>
  <text x="79" y="283" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547187">Hafif kenar</text>

  <line x1="208" y1="175" x2="231" y2="175" stroke="#7993a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="238,175 229,169 229,181" fill="#7993a6"/>

  <rect x="244" y="69" width="166" height="218" rx="18" fill="url(#chainCard)" filter="url(#shadow)"/>
  <text x="263" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#346756">Zincirler</text>
  <text x="263" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668277">Ardışık konumlar</text>

  <rect x="265" y="132" width="122" height="35" rx="10" fill="#d4eef4" filter="url(#smallShadow)"/>
  <rect x="265" y="177" width="76" height="35" rx="10" fill="#fff2d8" filter="url(#smallShadow)"/>
  <rect x="265" y="222" width="104" height="35" rx="10" fill="#e7ddf7" filter="url(#smallShadow)"/>
  <text x="277" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#347188">Zincir A</text>
  <text x="277" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#976d2a">Zincir B</text>
  <text x="277" y="243" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#71558b">Zincir C</text>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#385a6e">
    <text x="337" y="153">1 · 3 · 4 · 6</text>
    <text x="323" y="198">2 · 7</text>
    <text x="332" y="243">5</text>
  </g>

  <line x1="416" y1="175" x2="439" y2="175" stroke="#7993a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="446,175 437,169 437,181" fill="#7993a6"/>

  <rect x="452" y="69" width="164" height="218" rx="18" fill="url(#segCard)" filter="url(#shadow)"/>
  <text x="470" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80602b">Segment Ağacı</text>
  <text x="470" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#907a54">Dizi aralığı işlemleri</text>

  <line x1="534" y1="139" x2="494" y2="163" stroke="#b28d49" stroke-width="2"/>
  <line x1="534" y1="139" x2="574" y2="163" stroke="#b28d49" stroke-width="2"/>
  <line x1="494" y1="177" x2="476" y2="201" stroke="#b28d49" stroke-width="2"/>
  <line x1="494" y1="177" x2="512" y2="201" stroke="#b28d49" stroke-width="2"/>
  <line x1="574" y1="177" x2="556" y2="201" stroke="#b28d49" stroke-width="2"/>
  <line x1="574" y1="177" x2="592" y2="201" stroke="#b28d49" stroke-width="2"/>
  <g filter="url(#smallShadow)">
    <rect x="516" y="126" width="36" height="25" rx="8" fill="#fffdf7"/>
    <rect x="476" y="163" width="36" height="25" rx="8" fill="#fffdf7"/>
    <rect x="556" y="163" width="36" height="25" rx="8" fill="#fffdf7"/>
    <rect x="458" y="201" width="36" height="25" rx="8" fill="#fffdf7"/>
    <rect x="494" y="201" width="36" height="25" rx="8" fill="#fffdf7"/>
    <rect x="538" y="201" width="36" height="25" rx="8" fill="#fffdf7"/>
    <rect x="574" y="201" width="36" height="25" rx="8" fill="#fffdf7"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#775d31">
    <text x="534" y="143">[1,7]</text>
    <text x="494" y="180">[1,4]</text>
    <text x="574" y="180">[5,7]</text>
    <text x="476" y="218">1</text>
    <text x="512" y="218">3</text>
    <text x="556" y="218">4</text>
    <text x="592" y="218">6</text>
  </g>

  <rect x="466" y="242" width="136" height="28" rx="10" fill="#f8e7bd"/>
  <text x="534" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#80602b">Yol sorgusu: O(log² n)</text>
</svg>