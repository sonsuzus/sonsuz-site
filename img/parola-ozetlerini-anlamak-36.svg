<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ee"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e3a5f">Parola Özeti Güvenlik Mimarisi</text>

  <!-- Merkez: Parola Özeti -->
  <rect x="245" y="115" width="150" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">Parola Özeti</text>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3b5b8a">h = H(p, s)</text>

  <!-- Sol üst: Girdi -->
  <rect x="45" y="55" width="130" height="45" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="110" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Parola Adayı</text>
  <text x="110" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#92400e">p' ve salt s</text>

  <!-- Sol alt: Hash Fonksiyonu -->
  <rect x="45" y="130" width="130" height="45" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.5"/>
  <text x="110" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">Hash Fonksiyonu</text>
  <text x="110" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#065f46">H(p, s)</text>

  <!-- Sağ üst: Karşılaştırma -->
  <rect x="465" y="55" width="130" height="45" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="530" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Karşılaştır</text>
  <text x="530" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9d174d">H(p',s) = h?</text>

  <!-- Sağ alt: Sonuç -->
  <rect x="465" y="130" width="130" height="45" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="530" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">Eşleşme</text>
  <text x="530" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4338ca">Parola bulundu</text>

  <!-- Oklar -->
  <!-- Girdi -> Hash -->
  <path d="M175 77 L235 77" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="235,72 245,77 235,82" fill="#64748b"/>

  <!-- Hash -> Merkez -->
  <path d="M175 152 L245 140" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="245,135 255,140 245,145" fill="#64748b"/>

  <!-- Girdi -> Merkez (üst) -->
  <path d="M175 77 L245 130" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="245,125 253,132 243,135" fill="#64748b"/>

  <!-- Merkez -> Karşılaştır -->
  <path d="M395 130 L465 77" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="465,72 473,77 465,82" fill="#64748b"/>

  <!-- Karşılaştır -> Sonuç -->
  <path d="M530 100 L530 130" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="525,130 530,140 535,130" fill="#64748b"/>

  <!-- Merkez -> Sonuç (alt) -->
  <path d="M395 140 L465 152" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="465,147 473,153 463,156" fill="#64748b"/>

  <!-- Alt bilgi: Araçlar -->
  <rect x="130" y="225" width="170" height="40" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1.5" opacity="0.9"/>
  <text x="215" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">Hashcat</text>
  <text x="215" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">GPU hızlandırma</text>

  <rect x="340" y="225" width="170" height="40" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1.5" opacity="0.9"/>
  <text x="425" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">John the Ripper</text>
  <text x="425" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">Esnek biçim algılama</text>

  <!-- Alt bilgi: Güvenlik -->
  <rect x="195" y="280" width="250" height="30" rx="8" fill="#fef3c7" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1" opacity="0.95"/>
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78350f">Yalnızca yetkili test ortamlarında kullanın</text>
</svg>