<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#81c7df"/>
      <stop offset="100%" stop-color="#8dbf9a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52718a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52718a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="50" cy="42" r="70" fill="#cfeafa" opacity="0.32"/>
  <circle cx="598" cy="274" r="95" fill="#d5edd6" opacity="0.34"/>

  <text x="30" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38556b">GERÇEK ZAMANLI ENERJİ AKIŞI</text>
  <text x="30" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8290">Milyonlarca ölçümden güvenilir karara</text>

  <!-- Main flow paths -->
  <path d="M131 157 L161 157" stroke="url(#stream)" stroke-width="4" stroke-linecap="round"/>
  <polygon points="161,151 172,157 161,163" fill="#71b5c9"/>
  <path d="M261 157 L291 157" stroke="url(#stream)" stroke-width="4" stroke-linecap="round"/>
  <polygon points="291,151 302,157 291,163" fill="#78b891"/>
  <path d="M399 157 L429 157" stroke="url(#stream)" stroke-width="4" stroke-linecap="round"/>
  <polygon points="429,151 440,157 429,163" fill="#78b891"/>
  <path d="M529 157 L553 157" stroke="url(#stream)" stroke-width="4" stroke-linecap="round"/>
  <polygon points="553,151 564,157 553,163" fill="#78b891"/>

  <!-- Meter -->
  <g filter="url(#shadow)">
    <rect x="30" y="112" width="101" height="90" rx="18" fill="#ffffff"/>
    <rect x="41" y="123" width="79" height="68" rx="13" fill="#dff2fb"/>
  </g>
  <rect x="55" y="132" width="51" height="26" rx="6" fill="#ffffff" stroke="#9ac8dc"/>
  <text x="80.5" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35667d">12.48</text>
  <path d="M52 174 L61 174 M67 174 L76 174 M82 174 L91 174 M97 174 L106 174" stroke="#63a8c2" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355469">Akıllı Sayaç</text>
  <text x="80" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8290">Ölçüm</text>

  <!-- Gateway -->
  <g filter="url(#shadow)">
    <rect x="172" y="112" width="89" height="90" rx="18" fill="#ffffff"/>
    <rect x="183" y="123" width="67" height="46" rx="12" fill="#e8f0ff"/>
  </g>
  <path d="M199 151 C199 143 205 138 216 138 C227 138 233 143 233 151" fill="none" stroke="#7897d1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="216" cy="153" r="5" fill="#7897d1"/>
  <path d="M193 161 L239 161" stroke="#9eb4e0" stroke-width="2" stroke-linecap="round"/>
  <text x="216.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355469">Ağ Geçidi</text>
  <text x="216.5" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8290">Doğrulama</text>

  <!-- Kafka -->
  <g filter="url(#shadow)">
    <rect x="302" y="104" width="97" height="106" rx="18" fill="#ffffff"/>
    <rect x="313" y="116" width="75" height="53" rx="12" fill="#f1e8fb"/>
  </g>
  <circle cx="331" cy="142" r="8" fill="#a886cc"/>
  <circle cx="370" cy="130" r="8" fill="#a886cc"/>
  <circle cx="370" cy="156" r="8" fill="#a886cc"/>
  <path d="M338 139 L362 132 M338 145 L362 153" stroke="#8764b6" stroke-width="2"/>
  <text x="350.5" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355469">Olay Omurgası</text>
  <text x="350.5" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8290">Bölümler ve kuyruk</text>

  <!-- Spark processing -->
  <g filter="url(#shadow)">
    <rect x="440" y="104" width="89" height="106" rx="18" fill="#ffffff"/>
    <rect x="451" y="116" width="67" height="53" rx="12" fill="#e5f5e8"/>
  </g>
  <path d="M463 153 L472 142 L480 149 L491 130 L505 141" fill="none" stroke="#5aa772" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="463" cy="153" r="3" fill="#5aa772"/>
  <circle cx="472" cy="142" r="3" fill="#5aa772"/>
  <circle cx="480" cy="149" r="3" fill="#5aa772"/>
  <circle cx="491" cy="130" r="3" fill="#5aa772"/>
  <circle cx="505" cy="141" r="3" fill="#5aa772"/>
  <text x="484.5" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355469">Akış İşleme</text>
  <text x="484.5" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8290">Pencere ve toplam</text>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="564" y="112" width="52" height="90" rx="18" fill="#ffffff"/>
    <rect x="574" y="124" width="32" height="31" rx="7" fill="#fff0d8"/>
  </g>
  <path d="M580 148 L580 140 M587 148 L587 133 M594 148 L594 137 M601 148 L601 129" stroke="#d59443" stroke-width="4" stroke-linecap="round"/>
  <text x="590" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355469">Karar</text>
  <text x="590" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8290">Alarm</text>

  <!-- Timing control -->
  <path d="M350 104 L350 82 L484 82 L484 94" fill="none" stroke="#9bb3c1" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="478,92 484,101 490,92" fill="#9bb3c1"/>
  <g filter="url(#soft)">
    <rect x="300" y="58" width="101" height="42" rx="13" fill="#ffffff"/>
  </g>
  <circle cx="319" cy="79" r="10" fill="#f9dfaa"/>
  <path d="M319 73 L319 79 L324 82" fill="none" stroke="#ba7c32" stroke-width="2" stroke-linecap="round"/>
  <text x="357" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526d7d">Olay Zamanı</text>
  <text x="357" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708894">Watermark</text>

  <!-- Trust base -->
  <g filter="url(#soft)">
    <rect x="84" y="263" width="472" height="35" rx="14" fill="#ffffff"/>
  </g>
  <path d="M111 280 L119 272 L127 280 L119 289 Z" fill="#77b6c8"/>
  <text x="142" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b6979">Güven Katmanı</text>
  <path d="M255 272 L255 289 M255 280 L267 280" stroke="#9b80c4" stroke-width="2" stroke-linecap="round"/>
  <text x="278" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d7d">Tekrar ayıklama</text>
  <path d="M407 272 L417 272 L419 280 L412 289 L405 280 Z" fill="#75ad82"/>
  <text x="431" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d7d">Şifreleme ve erişim</text>
</svg>