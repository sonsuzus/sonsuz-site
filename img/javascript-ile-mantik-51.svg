<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c9ded"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#2c3e50" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="4" flood-color="#2c3e50" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43a047"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935"/>
    </marker>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık çubuğu -->
  <rect x="20" y="15" width="600" height="42" rx="10" fill="url(#header)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="42" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">JavaScript ile Geri İzlemeli Bulmaca Çözücü Mimari Akış</text>

  <!-- 1. Kutu: Bulmaca Girdisi -->
  <rect x="30" y="80" width="130" height="55" rx="10" fill="#ffffff" stroke="#5c9ded" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="95" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Bulmaca Girdisi</text>
  <text x="95" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#546e7a">Sudoku / Nonogram / Labirent</text>

  <!-- 2. Kutu: Durum Uzayı Araması (ana algoritma) -->
  <rect x="220" y="75" width="200" height="65" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">Geri İzlemeli Arama</text>
  <text x="320" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">findEmpty → isValid → dene</text>
  <text x="320" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">hata → geri dön (backtrack)</text>

  <!-- 3. Kutu: Kural Doğrulama -->
  <rect x="470" y="75" width="140" height="55" rx="10" fill="#c8e6c9" stroke="#43a047" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="540" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Kural Doğrulama</text>
  <text x="540" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2e7d32">Satır / Sütun / Kutu</text>

  <!-- 4. Kutu: Görselleştirici -->
  <rect x="220" y="175" width="200" height="55" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="320" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Adım Gösterici (Render)</text>
  <text x="320" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6d4c41">try: yeşil | backtrack: kırmızı</text>

  <!-- 5. Kutu: Kullanıcı Kontrolleri -->
  <rect x="30" y="175" width="130" height="55" rx="10" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="95" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">Kullanıcı Kontrolleri</text>
  <text x="95" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ad1457">Hız / Duraklat / Adım</text>

  <!-- 6. Kutu: Async Animasyon -->
  <rect x="470" y="175" width="140" height="55" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="540" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#311b92">async/await</text>
  <text x="540" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4527a0">sleep → render → bekle</text>

  <!-- Oklar -->
  <!-- Girdi → Arama -->
  <line x1="160" y1="107" x2="212" y2="107" stroke="#455a64" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arama → Kural Doğrulama -->
  <line x1="420" y1="100" x2="462" y2="100" stroke="#43a047" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- Kural Doğrulama → Arama (geri bildirim) -->
  <line x1="540" y1="130" x2="540" y2="155" stroke="#43a047" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <line x1="540" y1="155" x2="360" y2="155" stroke="#43a047" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="155" x2="360" y2="142" stroke="#43a047" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <!-- Arama → Görselleştirici -->
  <line x1="320" y1="140" x2="320" y2="167" stroke="#fb8c00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kullanıcı → Görselleştirici -->
  <line x1="160" y1="202" x2="212" y2="202" stroke="#455a64" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Görselleştirici → Async -->
  <line x1="420" y1="202" x2="462" y2="202" stroke="#5e35b1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Async → Arama (geri besleme döngüsü) -->
  <path d="M 540 230 L 540 260 Q 540 270 530 270 L 250 270 Q 240 270 240 260 L 240 148" fill="none" stroke="#5e35b1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- MRV stratejisi rozeti -->
  <rect x="75" y="250" width="180" height="38" rx="8" fill="#ffebee" stroke="#ef5350" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="165" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#b71c1c">MRV: En az adaylı hücre</text>
  <text x="165" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#c62828">Arama ağacını buda</text>

  <!-- Brute force rozeti -->
  <rect x="400" y="250" width="180" height="38" rx="8" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.2" filter="url(#softShadow)"/>
  <text x="490" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">Karmaşıklık: O(b^d)</text>
  <text x="490" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#388e3c">Kaba arama çözümü</text>

  <!-- Zaman ekseni etiketi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" font-style="italic">Her hamle async/await ile görselleştirilir → kullanıcı algoritmanın düşüncesini izler</text>
</svg>