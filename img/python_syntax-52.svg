<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1e9f8"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="640" height="320" fill="url(#bgGrad)" rx="8"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python Girinti Yapısı</text>

  <!-- Sol blok: Girinti Tanımı -->
  <rect x="30" y="55" width="160" height="90" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)"/>
  <text x="110" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Girinti Tanımı</text>
  <text x="110" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Kod bloğu belirtir</text>
  <text x="110" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Yapıyı belirler</text>
  <text x="110" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e74c3c">Hata riski taşır</text>

  <!-- Ok 1: Girinti Tanımı -> Kural Kutusu -->
  <path d="M 190 100 L 235 100" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="240,100 230,95 230,105" fill="#5d6d7e"/>

  <!-- Kural Kutusu -->
  <rect x="245" y="55" width="150" height="90" rx="12" fill="url(#boxGrad2)" filter="url(#shadow)"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7b4a12">Temel Kural</text>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Aynı blokta</text>
  <text x="320" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Aynı girinti</text>
  <text x="320" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Miktarı şart</text>

  <!-- Ok 2: Kural Kutusu -> Örnek -->
  <path d="M 395 100 L 440 100" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="445,100 435,95 435,105" fill="#5d6d7e"/>

  <!-- Örnek Kutusu -->
  <rect x="450" y="55" width="160" height="90" rx="12" fill="url(#boxGrad3)" filter="url(#shadow)"/>
  <text x="530" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Örnek Kod</text>
  <text x="530" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">if deg1 > deg2:</text>
  <text x="530" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">print("Büyüktür!")</text>
  <text x="530" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">3 satır çıktı</text>

  <!-- Alt kısım: Hata ve Çözüm -->
  <rect x="30" y="185" width="180" height="100" rx="12" fill="url(#boxGrad4)" filter="url(#shadow)"/>
  <text x="120" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">Hatalı Kullanım</text>
  <text x="120" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Farklı girinti</text>
  <text x="120" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Derleme hatası</text>
  <text x="120" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Program çalışmaz</text>

  <rect x="430" y="185" width="180" height="100" rx="12" fill="url(#boxGrad5)" filter="url(#shadow)"/>
  <text x="520" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">Doğru Kullanım</text>
  <text x="520" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Tutarlı girinti</text>
  <text x="520" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Blok yapısı net</text>
  <text x="520" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Beklenen çıktı</text>

  <!-- Alt bağlantılar -->
  <path d="M 110 185 L 110 165 L 320 165 L 320 145" stroke="#5d6d7e" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="320,140 315,148 325,148" fill="#5d6d7e"/>

  <path d="M 520 185 L 520 165 L 320 165 L 320 145" stroke="#5d6d7e" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="320,140 315,148 325,148" fill="#5d6d7e"/>

  <!-- Orta bağlantı oku -->
  <path d="M 210 235 L 425 235" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="430,235 420,230 420,240" fill="#5d6d7e"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7f8c8d">Girinti: Python'da yapısal önem taşır</text>
</svg>