<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="delay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff3cf"/>
      <stop offset="100%" stop-color="#ffe0b3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#56718a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#56718a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="45" r="54" fill="#dbeefd" opacity="0.5"/>
  <circle cx="581" cy="277" r="78" fill="#dff0d8" opacity="0.48"/>
  <path d="M26 190 C112 153, 145 217, 221 181 S362 149, 437 185 S548 220, 619 169" fill="none" stroke="#c9ddea" stroke-width="2" opacity="0.6"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35546d">TELEOPERASYONDA ZAMAN GECİKMESİ</text>
  <text x="320" y="45" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8495">Komut ve geri bildirim geçmişten gelir</text>

  <!-- Operator -->
  <g filter="url(#shadow)">
    <rect x="32" y="78" width="136" height="112" rx="20" fill="#edf5ff" stroke="#b9d5ef"/>
  </g>
  <circle cx="100" cy="111" r="18" fill="#92bddc"/>
  <circle cx="100" cy="106" r="7" fill="#f8fcff"/>
  <path d="M86 130 Q100 120 114 130 L119 145 L81 145 Z" fill="#f8fcff"/>
  <rect x="60" y="151" width="80" height="17" rx="7" fill="#d7eafa"/>
  <text x="100" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b78">Operatör</text>
  <text x="100" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668197">Komut</text>

  <!-- Forward line -->
  <path d="M169 127 L217 127" fill="none" stroke="#638baa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="221,127 212,121 212,133" fill="#638baa"/>

  <!-- Delay -->
  <g filter="url(#shadow)">
    <rect x="223" y="76" width="194" height="115" rx="20" fill="url(#delay)" stroke="#ebc875"/>
  </g>
  <circle cx="267" cy="123" r="25" fill="#fffaf0" stroke="#e7b953" stroke-width="2"/>
  <path d="M267 105 L267 123 L280 131" fill="none" stroke="#cf9031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="267" cy="123" r="3" fill="#cf9031"/>
  <text x="337" y="111" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805c24">Gecikme Tamponu</text>
  <text x="337" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#98713c">Ağ · işleme · görüntü</text>
  <rect x="298" y="143" width="78" height="24" rx="12" fill="#fff8e8" stroke="#edcf89"/>
  <text x="337" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#b07622">Tᵈ artar</text>

  <!-- Forward line robot -->
  <path d="M418 127 L465 127" fill="none" stroke="#638baa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="469,127 460,121 460,133" fill="#638baa"/>

  <!-- Robot -->
  <g filter="url(#shadow)">
    <rect x="471" y="78" width="137" height="112" rx="20" fill="#e8f7ef" stroke="#addabf"/>
  </g>
  <rect x="501" y="101" width="43" height="34" rx="8" fill="#75b996"/>
  <rect x="507" y="108" width="11" height="9" rx="2" fill="#eaf9f0"/>
  <rect x="527" y="108" width="11" height="9" rx="2" fill="#eaf9f0"/>
  <path d="M512 135 L505 150 M534 135 L541 150 M493 151 L553 151" fill="none" stroke="#579675" stroke-width="4" stroke-linecap="round"/>
  <text x="539" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397457">Robot</text>
  <text x="539" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668c76">Geç uygulanır</text>

  <!-- Feedback loop -->
  <path d="M539 192 L539 224 Q539 239 524 239 L116 239 Q100 239 100 223 L100 205" fill="none" stroke="#a177ae" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
  <polygon points="100,201 94,211 106,211" fill="#a177ae"/>
  <rect x="249" y="225" width="141" height="29" rx="14" fill="#f5eafa" stroke="#dcc2e8" filter="url(#softShadow)"/>
  <text x="319" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765585">Gecikmeli geri bildirim</text>

  <!-- Impacts -->
  <g filter="url(#softShadow)">
    <rect x="54" y="269" width="151" height="34" rx="13" fill="#ffe9e7" stroke="#efc2bc"/>
    <rect x="245" y="269" width="151" height="34" rx="13" fill="#fff0d6" stroke="#ecd19e"/>
    <rect x="435" y="269" width="151" height="34" rx="13" fill="#e9f1ff" stroke="#c5d8f3"/>
  </g>
  <circle cx="75" cy="286" r="7" fill="#e88b82"/>
  <text x="130" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a55750">Aşırı düzeltme</text>
  <circle cx="266" cy="286" r="7" fill="#dbad4e"/>
  <text x="321" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9b7226">Salınım riski</text>
  <circle cx="456" cy="286" r="7" fill="#7da9dc"/>
  <text x="511" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f74a5">Düşük güven</text>
</svg>