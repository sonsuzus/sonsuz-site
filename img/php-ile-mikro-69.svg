<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BBF6A"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="eventGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AB47BC"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.15" flood-color="#333"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1" flood-color="#333"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Monolitik blok -->
  <rect x="20" y="50" width="145" height="200" rx="12" fill="url(#monoGrad)" opacity="0.9" filter="url(#shadow)"/>
  <text x="92" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fff">Monolitik PHP</text>

  <!-- Monolit içi kutucuklar -->
  <rect x="35" y="95" width="115" height="22" rx="6" fill="#fff" opacity="0.25"/>
  <text x="92" y="111" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff">Kullanıcı</text>
  <rect x="35" y="123" width="115" height="22" rx="6" fill="#fff" opacity="0.25"/>
  <text x="92" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff">Katalog</text>
  <rect x="35" y="151" width="115" height="22" rx="6" fill="#fff" opacity="0.25"/>
  <text x="92" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff">Sipariş</text>
  <rect x="35" y="179" width="115" height="22" rx="6" fill="#fff" opacity="0.25"/>
  <text x="92" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff">Ödeme</text>
  <rect x="35" y="207" width="115" height="22" rx="6" fill="#fff" opacity="0.25"/>
  <text x="92" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff">Bildirim</text>

  <!-- Ok: monolitikten mikro servislere -->
  <line x1="175" y1="150" x2="225" y2="150" stroke="#888" stroke-width="2.5"/>
  <polygon points="225,150 215,145 215,155" fill="#888"/>

  <!-- Mikro servis konteyner -->
  <rect x="235" y="30" width="380" height="180" rx="14" fill="#fff" opacity="0.5" stroke="#6BBF6A" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#shadowLight)"/>
  <text x="425" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">Mikro Servis Mimarisi</text>

  <!-- Servis kutucukları -->
  <rect x="250" y="65" width="70" height="45" rx="8" fill="url(#serviceGrad)" filter="url(#shadowLight)"/>
  <text x="285" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10.5" font-weight="bold" fill="#fff">User</text>
  <text x="285" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff" opacity="0.9">Servis</text>

  <rect x="335" y="65" width="70" height="45" rx="8" fill="url(#serviceGrad)" filter="url(#shadowLight)"/>
  <text x="370" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10.5" font-weight="bold" fill="#fff">Catalog</text>
  <text x="370" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff" opacity="0.9">Servis</text>

  <rect x="420" y="65" width="70" height="45" rx="8" fill="url(#serviceGrad)" filter="url(#shadowLight)"/>
  <text x="455" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10.5" font-weight="bold" fill="#fff">Order</text>
  <text x="455" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff" opacity="0.9">Servis</text>

  <rect x="505" y="65" width="70" height="45" rx="8" fill="url(#serviceGrad)" filter="url(#shadowLight)"/>
  <text x="540" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10.5" font-weight="bold" fill="#fff">Payment</text>
  <text x="540" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff" opacity="0.9">Servis</text>

  <!-- Event bus -->
  <rect x="250" y="130" width="325" height="30" rx="8" fill="url(#eventGrad)" opacity="0.9" filter="url(#shadowLight)"/>
  <text x="412" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff">Mesaj Kuyruğu / Event Bus</text>

  <!-- Servislerden event bus'a bağlantılar -->
  <line x1="285" y1="110" x2="285" y2="130" stroke="#FFB74D" stroke-width="1.5"/>
  <polygon points="285,130 281,123 289,123" fill="#FFB74D"/>
  <line x1="370" y1="110" x2="370" y2="130" stroke="#FFB74D" stroke-width="1.5"/>
  <polygon points="370,130 366,123 374,123" fill="#FFB74D"/>
  <line x1="455" y1="110" x2="455" y2="130" stroke="#FFB74D" stroke-width="1.5"/>
  <polygon points="455,130 451,123 459,123" fill="#FFB74D"/>
  <line x1="540" y1="110" x2="540" y2="130" stroke="#FFB74D" stroke-width="1.5"/>
  <polygon points="540,130 536,123 544,123" fill="#FFB74D"/>

  <!-- Veritabanları -->
  <rect x="250" y="185" width="55" height="20" rx="5" fill="url(#dbGrad)" opacity="0.8"/>
  <text x="277" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff">DB User</text>
  <rect x="320" y="185" width="55" height="20" rx="5" fill="url(#dbGrad)" opacity="0.8"/>
  <text x="347" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff">DB Catalog</text>
  <rect x="390" y="185" width="55" height="20" rx="5" fill="url(#dbGrad)" opacity="0.8"/>
  <text x="417" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff">DB Order</text>
  <rect x="460" y="185" width="60" height="20" rx="5" fill="url(#dbGrad)" opacity="0.8"/>
  <text x="490" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#fff">DB Payment</text>

  <!-- Servis-DB bağlantıları -->
  <line x1="277" y1="175" x2="277" y2="185" stroke="#AB47BC" stroke-width="1.2"/>
  <line x1="347" y1="175" x2="347" y2="185" stroke="#AB47BC" stroke-width="1.2"/>
  <line x1="417" y1="175" x2="417" y2="185" stroke="#AB47BC" stroke-width="1.2"/>
  <line x1="490" y1="175" x2="490" y2="185" stroke="#AB47BC" stroke-width="1.2"/>

  <!-- Alt bilgi kutusu -->
  <rect x="20" y="270" width="600" height="35" rx="8" fill="#fff" opacity="0.6" stroke="#ccc" stroke-width="1"/>
  <text x="320" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555">Bağımsız geliştirme · Ayrı ölçekleme · İzole hata yönetimi · API/event tabanlı iletişim</text>
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888">Monolitik: O(n) etki · Mikro servis: O(1) etki</text>
</svg>