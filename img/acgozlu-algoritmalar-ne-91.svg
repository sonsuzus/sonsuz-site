<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Açgözlü Algoritmalar: Ne Zaman En İyiyi Bulurlar?</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="48" width="150" height="44" rx="10" fill="#e8f4f8" stroke="#5b9bd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="66" text-anchor="middle" font-weight="bold" fill="#1a5276">Açgözlü Strateji</text>
  <text x="320" y="82" text-anchor="middle" fill="#2c3e50">Her adımda yerel en iyi</text>

  <!-- Sol üst: Temel mantık -->
  <rect x="30" y="48" width="170" height="70" rx="10" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="66" text-anchor="middle" font-weight="bold" fill="#7d6608">Temel Mantık</text>
  <text x="115" y="82" text-anchor="middle" fill="#2c3e50">Adım adım çözüm kur</text>
  <text x="115" y="96" text-anchor="middle" fill="#2c3e50">Geçmişi değiştirme</text>
  <text x="115" y="110" text-anchor="middle" fill="#2c3e50">Geleceği hesaplama</text>

  <!-- Sağ üst: Özellikler -->
  <rect x="440" y="48" width="170" height="70" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="66" text-anchor="middle" font-weight="bold" fill="#1e8449">Gerekli Özellikler</text>
  <text x="525" y="82" text-anchor="middle" fill="#2c3e50">Açgözlü seçim özelliği</text>
  <text x="525" y="96" text-anchor="middle" fill="#2c3e50">Optimal alt yapı</text>
  <text x="525" y="110" text-anchor="middle" fill="#2c3e50">Geri dönmeme</text>

  <!-- Oklar merkezden -->
  <path d="M245 70 L200 70" stroke="#5b9bd5" stroke-width="1.5" fill="none"/>
  <polygon points="200,66 212,70 200,74" fill="#5b9bd5"/>

  <path d="M395 70 L440 70" stroke="#5b9bd5" stroke-width="1.5" fill="none"/>
  <polygon points="440,66 428,70 440,74" fill="#5b9bd5"/>

  <!-- Sol alt: Kanıt yöntemi -->
  <rect x="30" y="145" width="170" height="70" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="163" text-anchor="middle" font-weight="bold" fill="#6c3483">Kanıt Yöntemi</text>
  <text x="115" y="179" text-anchor="middle" fill="#2c3e50">Değiş tokuş argümanı</text>
  <text x="115" y="193" text-anchor="middle" fill="#2c3e50">Tümevarım ile genelleme</text>
  <text x="115" y="207" text-anchor="middle" fill="#2c3e50">Güvenli seçim gösterimi</text>

  <!-- Sağ alt: Aktivite seçimi -->
  <rect x="440" y="145" width="170" height="70" rx="10" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="525" y="163" text-anchor="middle" font-weight="bold" fill="#21618c">Aktivite Seçimi</text>
  <text x="525" y="179" text-anchor="middle" fill="#2c3e50">En erken biteni seç</text>
  <text x="525" y="193" text-anchor="middle" fill="#2c3e50">Çakışmayan maksimum</text>
  <text x="525" y="207" text-anchor="middle" fill="#2c3e50">O(n log n) karmaşıklık</text>

  <!-- Alt orta: Tökezleme -->
  <rect x="220" y="145" width="200" height="70" rx="10" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="163" text-anchor="middle" font-weight="bold" fill="#922b21">Tökezlediği Yerler</text>
  <text x="320" y="179" text-anchor="middle" fill="#2c3e50">Para üstü {1,3,4} hedef 6</text>
  <text x="320" y="193" text-anchor="middle" fill="#2c3e50">Açgözlü: 4+1+1 (3 para)</text>
  <text x="320" y="207" text-anchor="middle" fill="#2c3e50">Optimal: 3+3 (2 para)</text>

  <!-- Oklar alt bölüm -->
  <path d="M115 118 L115 145" stroke="#8e44ad" stroke-width="1.5" fill="none"/>
  <polygon points="111,145 115,133 119,145" fill="#8e44ad"/>

  <path d="M525 118 L525 145" stroke="#2980b9" stroke-width="1.5" fill="none"/>
  <polygon points="521,145 525,133 529,145" fill="#2980b9"/>

  <path d="M320 92 L320 145" stroke="#e74c3c" stroke-width="1.5" fill="none"/>
  <polygon points="316,145 320,133 324,145" fill="#e74c3c"/>

  <!-- Alt bilgi kartı -->
  <rect x="140" y="240" width="360" height="55" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="258" text-anchor="middle" font-weight="bold" fill="#1e8449">Sonuç</text>
  <text x="320" y="274" text-anchor="middle" fill="#2c3e50">Güvenli seçim + değiş tokuş + optimal alt yapı</text>
  <text x="320" y="288" text-anchor="middle" fill="#2c3e50">→ Açgözlü yaklaşım matematiksel olarak iştah açıcı</text>

  <!-- Zaman çizelgesi şeridi -->
  <rect x="30" y="240" width="90" height="55" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="75" y="258" text-anchor="middle" font-weight="bold" fill="#148f77">Zaman</text>
  <line x1="45" y1="272" x2="105" y2="272" stroke="#1abc9c" stroke-width="2"/>
  <circle cx="55" cy="272" r="4" fill="#1abc9c"/>
  <circle cx="75" cy="272" r="4" fill="#1abc9c"/>
  <circle cx="95" cy="272" r="4" fill="#1abc9c"/>
  <text x="75" y="288" text-anchor="middle" fill="#2c3e50">Aktiviteler</text>

  <rect x="520" y="240" width="90" height="55" rx="8" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="565" y="258" text-anchor="middle" font-weight="bold" fill="#7d6608">Sıralama</text>
  <text x="565" y="274" text-anchor="middle" fill="#2c3e50">Bitiş zamanı</text>
  <text x="565" y="288" text-anchor="middle" fill="#2c3e50">O(n log n)</text>
</svg>