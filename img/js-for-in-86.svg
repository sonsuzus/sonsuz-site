<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxObj" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="boxArr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf7e8"/>
      <stop offset="100%" stop-color="#d4eed0"/>
    </linearGradient>
    <linearGradient id="boxKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3e0"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="boxVal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8fd"/>
      <stop offset="100%" stop-color="#e0d4f9"/>
    </linearGradient>
    <linearGradient id="boxLoop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8ec"/>
      <stop offset="100%" stop-color="#fdd4dc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">JavaScript For/In Döngüsü</text>

  <!-- Döngü yapısı - merkez -->
  <rect x="240" y="50" width="160" height="42" rx="10" fill="url(#boxLoop)" stroke="#e8a0b0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5b2c3a">for (key in nesne)</text>
  <text x="320" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a4a5a">kod blokları çalışır</text>

  <!-- Nesne bölümü -->
  <rect x="40" y="120" width="180" height="170" rx="12" fill="url(#boxObj)" stroke="#7ab8d4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Nesne</text>

  <!-- Nesne içi kutular -->
  <rect x="60" y="155" width="140" height="28" rx="6" fill="#ffffff" stroke="#a0d0e8" stroke-width="1"/>
  <text x="130" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">username</text>

  <rect x="60" y="192" width="140" height="28" rx="6" fill="#ffffff" stroke="#a0d0e8" stroke-width="1"/>
  <text x="130" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">name</text>

  <rect x="60" y="229" width="140" height="28" rx="6" fill="#ffffff" stroke="#a0d0e8" stroke-width="1"/>
  <text x="130" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">age</text>

  <!-- Dizi bölümü -->
  <rect x="420" y="120" width="180" height="170" rx="12" fill="url(#boxArr)" stroke="#8cc47e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e5631">Dizi</text>

  <!-- Dizi içi kutular -->
  <rect x="440" y="155" width="140" height="28" rx="6" fill="#ffffff" stroke="#b0d8a0" stroke-width="1"/>
  <text x="510" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">0</text>

  <rect x="440" y="192" width="140" height="28" rx="6" fill="#ffffff" stroke="#b0d8a0" stroke-width="1"/>
  <text x="510" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">1</text>

  <rect x="440" y="229" width="140" height="28" rx="6" fill="#ffffff" stroke="#b0d8a0" stroke-width="1"/>
  <text x="510" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">2</text>

  <!-- Key kutusu -->
  <rect x="240" y="140" width="160" height="36" rx="8" fill="url(#boxKey)" stroke="#e0b060" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5a20">key / index</text>
  <text x="320" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9a7a40">sırayla erişim</text>

  <!-- Value kutusu -->
  <rect x="240" y="200" width="160" height="36" rx="8" fill="url(#boxVal)" stroke="#a080d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2a7a">value</text>
  <text x="320" y="229" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a4a9a">karşılık gelen değer</text>

  <!-- Ok: döngü -> key -->
  <path d="M 320 92 L 320 138" stroke="#5b2c3a" stroke-width="1.8" fill="none"/>
  <polygon points="314,134 320,146 326,134" fill="#5b2c3a"/>

  <!-- Ok: key -> value -->
  <path d="M 320 176 L 320 198" stroke="#7a5a20" stroke-width="1.8" fill="none"/>
  <polygon points="314,194 320,206 326,194" fill="#7a5a20"/>

  <!-- Ok: nesne -> key -->
  <path d="M 222 160 Q 230 158 238 158" stroke="#1a5276" stroke-width="1.5" fill="none"/>
  <polygon points="234,152 246,158 234,164" fill="#1a5276"/>

  <!-- Ok: dizi -> key -->
  <path d="M 418 160 Q 410 158 402 158" stroke="#1e5631" stroke-width="1.5" fill="none"/>
  <polygon points="406,152 394,158 406,164" fill="#1e5631"/>

  <!-- Ok: key -> nesne değerleri -->
  <path d="M 238 218 Q 230 220 222 220" stroke="#4a2a7a" stroke-width="1.5" fill="none"/>
  <polygon points="226,214 214,220 226,226" fill="#4a2a7a"/>

  <!-- Ok: key -> dizi değerleri -->
  <path d="M 402 218 Q 410 220 418 220" stroke="#4a2a7a" stroke-width="1.5" fill="none"/>
  <polygon points="414,214 426,220 414,226" fill="#4a2a7a"/>

  <!-- Alt açıklama -->
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">Örnek: user["username"], sayilar[0]</text>

  <!-- Değer örnekleri -->
  <rect x="160" y="282" width="100" height="24" rx="6" fill="#f0f4f8" stroke="#c0ccd8" stroke-width="1"/>
  <text x="210" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a4a5a">sadikturan</text>

  <rect x="280" y="282" width="80" height="24" rx="6" fill="#f0f4f8" stroke="#c0ccd8" stroke-width="1"/>
  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a4a5a">Sadık Turan</text>

  <rect x="380" y="282" width="60" height="24" rx="6" fill="#f0f4f8" stroke="#c0ccd8" stroke-width="1"/>
  <text x="410" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a4a5a">38</text>

  <!-- Değer okları -->
  <path d="M 130 257 L 130 270 L 208 270 L 208 280" stroke="#7ab8d4" stroke-width="1.2" fill="none"/>
  <polygon points="202,276 208,288 214,276" fill="#7ab8d4"/>

  <path d="M 510 257 L 510 270 L 410 270 L 410 280" stroke="#8cc47e" stroke-width="1.2" fill="none"/>
  <polygon points="404,276 410,288 416,276" fill="#8cc47e"/>

</svg>