<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="coinGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a7"/>
      <stop offset="100%" stop-color="#f5be57"/>
    </linearGradient>
    <linearGradient id="coinMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdf4df"/>
      <stop offset="100%" stop-color="#72c99c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7892a3" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#627e91" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="67" cy="42" r="48" fill="#dceeff" opacity="0.5"/>
  <circle cx="585" cy="279" r="66" fill="#ddf2d8" opacity="0.48"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">EN AZ MADENİ PARA PROBLEMİ</text>

  <rect x="218" y="45" width="204" height="53" rx="17" fill="#ffffff" filter="url(#shadow)"/>
  <text x="320" y="67" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">Hedef miktar</text>
  <text x="320" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547086">6 kuruş • {1, 3, 4}</text>

