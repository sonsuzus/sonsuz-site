  <path d="M541 179 L528 165" stroke="#5baa80" stroke-width="2"/>
  <polygon points="528,165 537,168 532,174" fill="#5baa80"/>

  <rect x="383" y="248" width="184" height="25" rx="12" fill="#d9f3e5"/>
  <circle cx="401" cy="260" r="5" fill="#43aa72"/>
  <text x="486" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#28734f">3 + 3 = 2 para • optimal</text>

  <path d="M288 201 L349 201" stroke="#91a8b6" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="349,201 340,196 340,206" fill="#91a8b6"/>
  <text x="319" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60798b">karşılaştır</text>

  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587184">Yerel seçim her zaman küresel en iyi çözüm değildir</text>
