  <text x="109" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#79551a">Açgözlü seçim</text>
  <text x="176" y="163" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7655">en büyükten başla</text>

  <circle cx="91" cy="204" r="23" fill="url(#coinGold)" stroke="#dfaa48" stroke-width="1.5" filter="url(#soft)"/>
  <text x="91" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76501a">4</text>
