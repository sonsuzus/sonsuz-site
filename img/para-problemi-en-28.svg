  <text x="442" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#276b4d">Dinamik programlama</text>
  <text x="525" y="163" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56816b">tüm alt çözümler</text>

