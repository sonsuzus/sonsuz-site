<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ed"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa8d9"/>
      <stop offset="100%" stop-color="#5b8fc2"/>
    </linearGradient>
    <linearGradient id="derivedGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc7a8"/>
      <stop offset="100%" stop-color="#6dab8a"/>
    </linearGradient>
    <linearGradient id="derivedGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a8d9"/>
      <stop offset="100%" stop-color="#a985c2"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c96d"/>
      <stop offset="100%" stop-color="#dbb04e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c4a6e">C++ Sanal Fonksiyonlar ve Çok Biçimlilik</text>

  <!-- Ana sınıf kutusu -->
  <rect x="230" y="50" width="180" height="70" rx="10" fill="url(#baseGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Ana Sınıf</text>
  <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e8f0fa">virtual void islem()</text>
  <text x="320" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c5d8ef">// temel kod</text>

  <!-- Türetilmiş sınıf 1 -->
  <rect x="40" y="170" width="170" height="70" rx="10" fill="url(#derivedGrad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="125" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Türetilmiş Sınıf A</text>
  <text x="125" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e8f5ee">void islem()</text>
  <text x="125" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c0e0d0">// A işlemleri</text>

  <!-- Türetilmiş sınıf 2 -->
  <rect x="430" y="170" width="170" height="70" rx="10" fill="url(#derivedGrad2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="515" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Türetilmiş Sınıf B</text>
  <text x="515" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#f3eaf8">void islem()</text>
  <text x="515" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#dcc8ea">// B işlemleri</text>

  <!-- Ok: Ana sınıf -> Türetilmiş A -->
  <path d="M 270 120 L 150 165" stroke="#5b8fc2" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="150,165 160,158 155,170" fill="#5b8fc2"/>

  <!-- Ok: Ana sınıf -> Türetilmiş B -->
  <path d="M 370 120 L 490 165" stroke="#5b8fc2" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="490,165 480,158 485,170" fill="#5b8fc2"/>

  <!-- Çok biçimlilik kutusu -->
  <rect x="195" y="260" width="250" height="45" rx="10" fill="url(#resultGrad)" filter="url(#shadowLight)" opacity="0.95"/>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a4a1a">Çalışma Zamanı Çok Biçimlilik</text>
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6b5c2a">Aynı isim, farklı davranış</text>

  <!-- Oklar: Türetilmiş -> Çok biçimlilik -->
  <path d="M 125 240 L 250 258" stroke="#dbb04e" stroke-width="2" fill="none"/>
  <polygon points="250,258 240,253 245,263" fill="#dbb04e"/>

  <path d="M 515 240 L 390 258" stroke="#dbb04e" stroke-width="2" fill="none"/>
  <polygon points="390,258 400,253 395,263" fill="#dbb04e"/>

  <!-- virtual anahtar kelimesi etiketi -->
  <rect x="20" y="55" width="110" height="30" rx="8" fill="#e8f0fa" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="75" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a6a9e">virtual</text>

  <!-- İnce bağlantı çizgisi -->
  <line x1="130" y1="70" x2="228" y2="70" stroke="#3a6a9e" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Not kutusu -->
  <rect x="530" y="55" width="95" height="55" rx="8" fill="#fff8e8" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="577" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a7a4a">Türetilen sınıfta</text>
  <text x="577" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a7a4a">virtual</text>
  <text x="577" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a7a4a">yazılmaz</text>

  <!-- İnce bağlantı çizgisi -->
  <line x1="530" y1="80" x2="412" y2="80" stroke="#8a7a4a" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>