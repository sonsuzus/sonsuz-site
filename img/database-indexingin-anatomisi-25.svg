<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="readGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="writeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="321" cy="157" r="129" fill="#dbeafe" opacity="0.26"/>
  <circle cx="321" cy="157" r="96" fill="#ffffff" opacity="0.34"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#475569">İndeksleme Dengesi</text>

  <!-- Sol okuma alanı -->
  <rect x="32" y="67" width="173" height="151" rx="20" fill="url(#readGrad)" filter="url(#shadow)"/>
  <text x="118" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">Okuma Kazancı</text>

  <!-- B-tree -->
  <line x1="118" y1="116" x2="83" y2="143" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="118" y1="116" x2="153" y2="143" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="83" y1="148" x2="62" y2="174" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="83" y1="148" x2="101" y2="174" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="153" y1="148" x2="136" y2="174" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <line x1="153" y1="148" x2="174" y2="174" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <rect x="103" y="105" width="30" height="21" rx="7" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="68" y="137" width="30" height="21" rx="7" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="138" y="137" width="30" height="21" rx="7" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="47" y="169" width="30" height="20" rx="7" fill="#ffffff"/>
  <rect x="86" y="169" width="30" height="20" rx="7" fill="#ffffff"/>
  <rect x="121" y="169" width="30" height="20" rx="7" fill="#ffffff"/>
  <rect x="159" y="169" width="30" height="20" rx="7" fill="#ffffff"/>
  <text x="118" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#166534">B-ağacı · O(log n)</text>

  <!-- Sağ yazma alanı -->
  <rect x="435" y="67" width="173" height="151" rx="20" fill="url(#writeGrad)" filter="url(#shadow)"/>
  <text x="521" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a3412">Yazma Maliyeti</text>

  <rect x="462" y="110" width="118" height="25" rx="8" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="462" y="143" width="118" height="25" rx="8" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="462" y="176" width="118" height="25" rx="8" fill="#ffffff" filter="url(#softShadow)"/>
  <circle cx="478" cy="122" r="5" fill="#fb923c"/>
  <circle cx="478" cy="155" r="5" fill="#fb923c"/>
  <circle cx="478" cy="188" r="5" fill="#fb923c"/>
  <text x="495" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a3412">Tablo güncelle</text>
  <text x="495" y="159" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a3412">İndeks güncelle</text>
  <text x="495" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a3412">Sayfa bölünmesi</text>

  <!-- Bağlantılar -->
  <path d="M205 143 C228 143 236 143 252 143" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <polygon points="252,143 243,137 243,149" fill="#60a5fa"/>
  <path d="M388 143 C405 143 416 143 435 143" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="435,143 426,137 426,149" fill="#fb923c"/>

  <!-- Merkezi veritabanı -->
  <g filter="url(#shadow)">
    <ellipse cx="320" cy="113" rx="69" ry="20" fill="#dbeafe"/>
    <path d="M251 113 V174 C251 185 282 194 320 194 C358 194 389 185 389 174 V113" fill="url(#dbGrad)"/>
    <ellipse cx="320" cy="174" rx="69" ry="20" fill="#bfdbfe"/>
    <ellipse cx="320" cy="113" rx="69" ry="20" fill="#eaf3ff"/>
  </g>
  <path d="M251 137 C251 148 282 157 320 157 C358 157 389 148 389 137" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <text x="320" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Veritabanı</text>
  <text x="320" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">Tablo + İndeksler</text>
  <text x="320" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a8a">k adet indeks</text>

  <!-- Alt denge terazisi -->
  <path d="M151 259 H489" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M320 226 V269" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M294 270 H346" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M273 259 L320 226 L367 259" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>

  <rect x="150" y="239" width="116" height="39" rx="13" fill="#dcfce7" filter="url(#softShadow)"/>
  <text x="208" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">Hızlı sorgu</text>

  <rect x="374" y="239" width="116" height="39" rx="13" fill="#ffedd5" filter="url(#softShadow)"/>
  <text x="432" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a3412">Bakım yükü</text>

  <text x="320" y="304" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Seçicilik, kullanım ve maliyet dengelenir</text>
</svg>