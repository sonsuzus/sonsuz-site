<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#90a4ae" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#90a4ae" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#37474f">JavaScript Dinamik Tip Sistemi</text>

  <!-- Merkez düğüm: Değişken -->
  <rect x="255" y="55" width="130" height="42" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Değişken</text>
  <text x="320" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#bf360c">değer + tür taşır</text>

  <!-- Değer türleri (sol) -->
  <rect x="30" y="45" width="110" height="36" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="85" y="67" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0">string</text>

  <rect x="30" y="95" width="110" height="36" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="85" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0">number</text>

  <rect x="30" y="145" width="110" height="36" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="85" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0">boolean</text>

  <rect x="30" y="195" width="110" height="36" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="85" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0">bigint</text>

  <rect x="30" y="245" width="110" height="36" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="85" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0">undefined</text>

  <!-- Referans türleri (sağ) -->
  <rect x="500" y="45" width="110" height="36" rx="8" fill="#fce4ec" stroke="#f06292" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="555" y="67" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c2185b">object</text>

  <rect x="500" y="95" width="110" height="36" rx="8" fill="#fce4ec" stroke="#f06292" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="555" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c2185b">array</text>

  <rect x="500" y="145" width="110" height="36" rx="8" fill="#fce4ec" stroke="#f06292" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="555" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c2185b">function</text>

  <rect x="500" y="195" width="110" height="36" rx="8" fill="#fce4ec" stroke="#f06292" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="555" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c2185b">symbol</text>

  <rect x="500" y="245" width="110" height="36" rx="8" fill="#fce4ec" stroke="#f06292" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="555" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c2185b">null (object)</text>

  <!-- Oklar: sol taraftan merkeze -->
  <path d="M140 63 L250 63" stroke="#64b5f6" stroke-width="1.5" fill="none"/>
  <polygon points="250,58 260,63 250,68" fill="#64b5f6"/>

  <path d="M140 113 L250 73" stroke="#64b5f6" stroke-width="1.5" fill="none"/>
  <polygon points="250,68 260,73 250,78" fill="#64b5f6"/>

  <path d="M140 163 L250 83" stroke="#64b5f6" stroke-width="1.5" fill="none"/>
  <polygon points="250,78 260,83 250,88" fill="#64b5f6"/>

  <path d="M140 213 L250 90" stroke="#64b5f6" stroke-width="1.5" fill="none"/>
  <polygon points="250,85 260,90 250,95" fill="#64b5f6"/>

  <path d="M140 263 L250 97" stroke="#64b5f6" stroke-width="1.5" fill="none"/>
  <polygon points="250,92 260,97 250,102" fill="#64b5f6"/>

  <!-- Oklar: sağ taraftan merkeze -->
  <path d="M500 63 L390 63" stroke="#f06292" stroke-width="1.5" fill="none"/>
  <polygon points="390,58 380,63 390,68" fill="#f06292"/>

  <path d="M500 113 L390 73" stroke="#f06292" stroke-width="1.5" fill="none"/>
  <polygon points="390,68 380,73 390,78" fill="#f06292"/>

  <path d="M500 163 L390 83" stroke="#f06292" stroke-width="1.5" fill="none"/>
  <polygon points="390,78 380,83 390,88" fill="#f06292"/>

  <path d="M500 213 L390 90" stroke="#f06292" stroke-width="1.5" fill="none"/>
  <polygon points="390,85 380,90 390,95" fill="#f06292"/>

  <path d="M500 263 L390 97" stroke="#f06292" stroke-width="1.5" fill="none"/>
  <polygon points="390,92 380,97 390,102" fill="#f06292"/>

  <!-- Alt bilgi: tip zorlama -->
  <rect x="195" y="125" width="250" height="55" rx="10" fill="#e8f5e9" stroke="#81c784" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Tip Zorlama</text>
  <text x="320" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">"5" + 2 → "52"</text>
  <text x="320" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">"5" - 2 → 3</text>

  <!-- Alt bilgi: eşitlik -->
  <rect x="195" y="195" width="250" height="55" rx="10" fill="#fff8e1" stroke="#ffd54f" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#f57f17">Eşitlik</text>
  <text x="320" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">== dönüşüm uygular</text>
  <text x="320" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">=== tür ve değer kontrolü</text>

  <!-- Bağlantı çizgileri alt bilgi -->
  <line x1="320" y1="97" x2="320" y2="125" stroke="#78909c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="315,125 320,133 325,125" fill="#78909c"/>

  <line x1="320" y1="180" x2="320" y2="195" stroke="#78909c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="315,195 320,203 325,195" fill="#78909c"/>

  <!-- Sağ alt not -->
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a" font-style="italic">Tür bilgisi değere bağlıdır</text>
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a" font-style="italic">Kontroller çalışma zamanında yapılır</text>
</svg>