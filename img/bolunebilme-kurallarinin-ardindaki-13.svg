<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8eaff"/>
      <stop offset="100%" stop-color="#c9e8dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="158" r="126" fill="#dceef1" opacity="0.32"/>
  <circle cx="319" cy="158" r="91" fill="none" stroke="#b9d9d9" stroke-width="1.5" stroke-dasharray="5 6"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547087" font-weight="600">BÖLÜNEBİLME MOTORU</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909d">Basamaklar → kalanlar → hızlı karar</text>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="28" y="123" width="122" height="70" rx="17" fill="#ffffff"/>
    <rect x="38" y="134" width="102" height="17" rx="8.5" fill="#e7f0ff"/>
    <text x="89" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466886">Sayı</text>
    <text x="89" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29485f" font-weight="600">5  8  3  2</text>
  </g>

  <path d="M151 158 H203" fill="none" stroke="#789caf" stroke-width="2.2"/>
  <polygon points="203,158 194,153 194,163" fill="#789caf"/>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="205" y="102" width="224" height="111" rx="25" fill="url(#core)" stroke="#badcd5"/>
    <circle cx="240" cy="157" r="20" fill="#ffffff" opacity="0.74"/>
    <text x="240" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40717a" font-weight="700">mod</text>
    <text x="326" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315968" font-weight="700">Basamak Değeri</text>
    <text x="326" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527481">10⁰, 10¹, 10² ...</text>
    <rect x="273" y="177" width="106" height="21" rx="10" fill="#ffffff" opacity="0.72"/>
    <text x="326" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466b71">Kalan hesabı</text>
  </g>

  <!-- top branch -->
  <path d="M301 101 V78 H251" fill="none" stroke="#907db0" stroke-width="2"/>
  <polygon points="251,78 260,73 260,83" fill="#907db0"/>
  <g filter="url(#softShadow)">
    <rect x="73" y="57" width="177" height="43" rx="14" fill="#f2eaff"/>
    <circle cx="93" cy="78.5" r="11" fill="#d9c7f2"/>
    <text x="93" y="82.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#684f86" font-weight="700">3</text>
    <text x="111" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d4a75">Rakam toplamı</text>
    <text x="111" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806d92">10 ≡ 1</text>
  </g>

  <!-- bottom branch -->
  <path d="M339 214 V244 H268" fill="none" stroke="#d0826e" stroke-width="2"/>
  <polygon points="268,244 277,239 277,249" fill="#d0826e"/>
  <g filter="url(#softShadow)">
    <rect x="85" y="244" width="183" height="48" rx="14" fill="#fff0e9"/>
    <circle cx="106" cy="268" r="11" fill="#f2c7b9"/>
    <text x="106" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#985343" font-weight="700">7</text>
    <text x="124" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b5046">Son rakamı ikiyle çarp</text>
    <text x="124" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a16c5e">Kalandan çıkar</text>
  </g>

  <!-- right branch 11 -->
  <path d="M430 133 H459" fill="none" stroke="#6e9d9c" stroke-width="2"/>
  <polygon points="459,133 450,128 450,138" fill="#6e9d9c"/>
  <g filter="url(#softShadow)">
    <rect x="459" y="77" width="151" height="76" rx="17" fill="#e5f5f1"/>
    <circle cx="482" cy="103" r="12" fill="#bbe1d8"/>
    <text x="482" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39726e" font-weight="700">11</text>
    <text x="503" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426c6d">Dönüşümlü toplam</text>
    <text x="477" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8583">+ − + −</text>
    <text x="532" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8583">10 ≡ −1</text>
  </g>

  <!-- result flow -->
  <path d="M430 184 H468" fill="none" stroke="#789caf" stroke-width="2.2"/>
  <polygon points="468,184 459,179 459,189" fill="#789caf"/>
  <g filter="url(#shadow)">
    <rect x="468" y="167" width="143" height="52" rx="16" fill="#ffffff"/>
    <circle cx="491" cy="193" r="13" fill="#d4eed7"/>
    <path d="M484 193 L489 198 L499 187" fill="none" stroke="#4d9561" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="543" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39614a" font-weight="700">Kalan = 0 ?</text>
    <text x="543" y="206" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#648170">Tam bölünür</text>
  </g>

  <!-- tiny relation -->
  <path d="M531 154 V165" fill="none" stroke="#a7c4ba" stroke-width="1.5"/>
  <polygon points="531,165 527,158 535,158" fill="#a7c4ba"/>

  <text x="611" y="299" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8aa0a6">N ≡ 0</text>
</svg>