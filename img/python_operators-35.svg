<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7f0"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#357abd"/>
    </linearGradient>
    <linearGradient id="cat1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d4ecfb"/>
    </linearGradient>
    <linearGradient id="cat2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="cat3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f9e6"/>
      <stop offset="100%" stop-color="#d2f2d2"/>
    </linearGradient>
    <linearGradient id="cat4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e8fd"/>
      <stop offset="100%" stop-color="#e2d6f8"/>
    </linearGradient>
    <linearGradient id="cat5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde8ef"/>
      <stop offset="100%" stop-color="#fbd4e2"/>
    </linearGradient>
    <linearGradient id="cat6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f4f4"/>
      <stop offset="100%" stop-color="#cceeee"/>
    </linearGradient>
    <linearGradient id="cat7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9e0"/>
      <stop offset="100%" stop-color="#fcf0c0"/>
    </linearGradient>
    <linearGradient id="extraGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a5a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python İşlemciler</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">27 işlemci · 7 kategori · 12 bileşik atama</text>

  <!-- Merkez düğüm -->
  <ellipse cx="320" cy="165" rx="72" ry="32" fill="url(#centerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Python</text>
  <text x="320" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#d4e6f9">İşlemciler</text>

  <!-- Kategori 1: Aritmetik (sol üst) -->
  <rect x="40" y="70" width="130" height="58" rx="10" fill="url(#cat1)" filter="url(#shadowLight)" stroke="#a8d4f0" stroke-width="1"/>
  <text x="105" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c6faa">Aritmetik</text>
  <text x="105" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a8ac9">+ - * / % ** //</text>
  <text x="105" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7fa8cc">7 işlemci</text>

  <!-- Kategori 2: Atama (üst orta) -->
  <rect x="210" y="60" width="100" height="50" rx="10" fill="url(#cat2)" filter="url(#shadowLight)" stroke="#f0d49a" stroke-width="1"/>
  <text x="260" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#b8860b">Atama</text>
  <text x="260" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#cc9a2e">=</text>

  <!-- Kategori 3: Karşılaştırma (üst sağ) -->
  <rect x="350" y="70" width="130" height="58" rx="10" fill="url(#cat3)" filter="url(#shadowLight)" stroke="#a8dba8" stroke-width="1"/>
  <text x="415" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2e8b2e">Karşılaştırma</text>
  <text x="415" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4caf4c">== != > < >= <=</text>
  <text x="415" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7fb87f">6 işlemci</text>

  <!-- Kategori 4: Mantıksal (sol orta) -->
  <rect x="30" y="170" width="120" height="55" rx="10" fill="url(#cat4)" filter="url(#shadowLight)" stroke="#c4b0e8" stroke-width="1"/>
  <text x="90" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#6a3fb5">Mantıksal</text>
  <text x="90" y="206" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a63c9">and or not</text>
  <text x="90" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#a98fd4">3 işlemci</text>

  <!-- Kategori 5: Tanımlama (sağ orta) -->
  <rect x="490" y="170" width="120" height="55" rx="10" fill="url(#cat5)" filter="url(#shadowLight)" stroke="#e8a8c0" stroke-width="1"/>
  <text x="550" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#c04070">Tanımlama</text>
  <text x="550" y="206" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#d47098">is, is not</text>
  <text x="550" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#e0a0bc">2 işlemci</text>

  <!-- Kategori 6: Üyelik (sol alt) -->
  <rect x="40" y="260" width="120" height="50" rx="10" fill="url(#cat6)" filter="url(#shadowLight)" stroke="#a0d8d8" stroke-width="1"/>
  <text x="100" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1a8a8a">Üyelik</text>
  <text x="100" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3ab0b0">in, not in</text>

  <!-- Kategori 7: Bit işlemciler (sağ alt) -->
  <rect x="470" y="260" width="140" height="50" rx="10" fill="url(#cat7)" filter="url(#shadowLight)" stroke="#e0c860" stroke-width="1"/>
  <text x="540" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#b89b1a">Bit İşlemciler</text>
  <text x="540" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ccb040">&amp; | ^ ~ &lt;&lt; &gt;&gt;</text>

  <!-- Ek: Bileşik Atama (alt orta) -->
  <rect x="240" y="270" width="160" height="40" rx="10" fill="url(#extraGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Bileşik Atama</text>
  <text x="320" y="301" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#ffe0e0">+= -= *= /= vb. 12 adet</text>

  <!-- Bağlantı çizgileri (manuel ok uçları ile) -->
  <!-- Merkezden Aritmetik -->
  <path d="M 252 148 Q 180 120 155 100" stroke="#4a90d9" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="152,97 162,100 158,108" fill="#4a90d9" opacity="0.7"/>

  <!-- Merkezden Atama -->
  <path d="M 290 135 Q 280 100 270 90" stroke="#b8860b" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="267,87 277,90 273,98" fill="#b8860b" opacity="0.7"/>

  <!-- Merkezden Karşılaştırma -->
  <path d="M 370 135 Q 390 100 400 90" stroke="#2e8b2e" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="403,87 393,90 397,98" fill="#2e8b2e" opacity="0.7"/>

  <!-- Merkezden Mantıksal -->
  <path d="M 255 175 Q 180 190 140 195" stroke="#6a3fb5" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="137,195 147,192 145,201" fill="#6a3fb5" opacity="0.7"/>

  <!-- Merkezden Tanımlama -->
  <path d="M 385 175 Q 450 190 490 195" stroke="#c04070" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="493,195 483,192 485,201" fill="#c04070" opacity="0.7"/>

  <!-- Merkezden Üyelik -->
  <path d="M 270 195 Q 200 240 150 260" stroke="#1a8a8a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="147,262 157,257 155,266" fill="#1a8a8a" opacity="0.7"/>

  <!-- Merkezden Bit İşlemciler -->
  <path d="M 370 195 Q 440 240 490 260" stroke="#b89b1a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="493,262 483,257 485,266" fill="#b89b1a" opacity="0.7"/>

  <!-- Aritmetik ve Bit'ten Bileşik Atama'ya -->
  <path d="M 170 120 Q 220 250 250 280" stroke="#ee5a5a" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4,3"/>
  <polygon points="253,282 242,279 246,272" fill="#ee5a5a" opacity="0.5"/>

  <path d="M 540 260 Q 450 285 400 290" stroke="#ee5a5a" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="4,3"/>
  <polygon points="397,290 407,287 405,296" fill="#ee5a5a" opacity="0.5"/>

  <!-- Aritmetik ve Bit arası bağlantı etiketi -->
  <text x="320" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#cc5555" opacity="0.8">+ = bileşik atama</text>

  <!-- Toplam bilgi -->
  <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#95a5a6">Python'da 7 kategoride 27 işlemci ve 12 bileşik atama işlemcisi</text>
</svg>