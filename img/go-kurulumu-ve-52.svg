<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9ff"/>
      <stop offset="100%" style="stop-color:#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2d4a6b">Go Geliştirme Ortamı Kurulumu</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="#6ba3d6" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff" font-weight="bold">Go SDK</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e8f0fe">Derleyici + Araçlar</text>

  <!-- Sol üst: GOROOT -->
  <rect x="40" y="55" width="130" height="45" rx="10" fill="#a8d8b9" filter="url(#shadow)" opacity="0.85"/>
  <text x="105" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d5a3d" font-weight="bold">GOROOT</text>
  <text x="105" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d6b4f">Kurulum dizini</text>

  <!-- Sol alt: GOPATH -->
  <rect x="40" y="230" width="130" height="45" rx="10" fill="#d4b8e8" filter="url(#shadow)" opacity="0.85"/>
  <text x="105" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a3d7a" font-weight="bold">GOPATH</text>
  <text x="105" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b4b8f">Eski çalışma alanı</text>

  <!-- Sağ üst: VS Code -->
  <rect x="470" y="55" width="130" height="45" rx="10" fill="#f0c4a8" filter="url(#shadow)" opacity="0.85"/>
  <text x="535" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a4a2d" font-weight="bold">VS Code</text>
  <text x="535" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8f5a3d">Editör</text>

  <!-- Sağ alt: Go Modules -->
  <rect x="470" y="230" width="130" height="45" rx="10" fill="#f5e6a8" filter="url(#shadow)" opacity="0.85"/>
  <text x="535" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6a2d" font-weight="bold">Go Modules</text>
  <text x="535" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8f7a3d">Bağımlılık yönetimi</text>

  <!-- Alt orta: gopls -->
  <rect x="245" y="240" width="150" height="40" rx="10" fill="#b8d4e8" filter="url(#shadow)" opacity="0.85"/>
  <text x="320" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4a6b" font-weight="bold">gopls</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d5a7b">Dil sunucusu</text>

  <!-- Oklar - manuel çizim -->
  <!-- GOROOT -> Go SDK -->
  <path d="M170 78 L240 130" stroke="#5a8a6a" stroke-width="2" fill="none"/>
  <polygon points="240,130 232,122 234,132" fill="#5a8a6a"/>

  <!-- GOPATH -> Go SDK -->
  <path d="M170 252 L240 165" stroke="#7a5a9a" stroke-width="2" fill="none"/>
  <polygon points="240,165 232,170 238,158" fill="#7a5a9a"/>

  <!-- VS Code -> Go SDK -->
  <path d="M470 78 L400 130" stroke="#9a6a4a" stroke-width="2" fill="none"/>
  <polygon points="400,130 408,122 406,132" fill="#9a6a4a"/>

  <!-- Go Modules -> Go SDK -->
  <path d="M470 252 L400 165" stroke="#9a8a4a" stroke-width="2" fill="none"/>
  <polygon points="400,165 408,170 402,158" fill="#9a8a4a"/>

  <!-- gopls -> VS Code -->
  <path d="M320 240 L320 105" stroke="#4a6a8a" stroke-width="2" fill="none"/>
  <polygon points="320,105 315,113 325,113" fill="#4a6a8a"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a9a" opacity="0.7">go run . → Hızlı deneme | go build → Çalıştırılabilir üret</text>
</svg>