<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="nesneBaslik" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#d8f1e5"/>
    </linearGradient>
    <linearGradient id="jsonBaslik" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbe5d6"/>
      <stop offset="100%" stop-color="#f9eed0"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#50708a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#50708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#zemin)"/>
  <circle cx="55" cy="51" r="38" fill="#dceef5" opacity="0.48"/>
  <circle cx="595" cy="267" r="58" fill="#dcefdc" opacity="0.45"/>
  <path d="M25 279 C140 238 187 305 294 273 S486 218 620 257" fill="none" stroke="#c7e1dd" stroke-width="2" opacity="0.65"/>

  <!-- Gerçek dünya -->
  <rect x="28" y="109" width="128" height="105" rx="18" fill="#ffffff" filter="url(#golge)"/>
  <rect x="28" y="109" width="128" height="32" rx="18" fill="#e4f2ec"/>
  <rect x="28" y="126" width="128" height="15" fill="#e4f2ec"/>
  <text x="92" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356254">Gerçek varlık</text>
  <path d="M54 175 L65 157 Q68 152 77 152 L105 152 Q113 152 117 158 L126 175 L126 187 L53 187 Z" fill="#9ec8dc" stroke="#4e829c" stroke-width="2"/>
  <path d="M69 157 L79 157 L77 170 L59 170 Z" fill="#e8f6fb" opacity="0.9"/>
  <path d="M84 157 L103 157 L112 170 L81 170 Z" fill="#e8f6fb" opacity="0.9"/>
  <circle cx="70" cy="187" r="9" fill="#526b7b"/>
  <circle cx="70" cy="187" r="4" fill="#dce8eb"/>
  <circle cx="111" cy="187" r="9" fill="#526b7b"/>
  <circle cx="111" cy="187" r="4" fill="#dce8eb"/>
  <text x="92" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#49616a">Otomobil</text>

  <!-- Arrow 1 -->
  <path d="M166 162 L194 162" fill="none" stroke="#79a7b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="199,162 190,157 190,167" fill="#79a7b8"/>
  <text x="181" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63808b">modelle</text>

  <!-- Nesne -->
  <rect x="205" y="51" width="208" height="218" rx="20" fill="#ffffff" filter="url(#golge)"/>
  <rect x="205" y="51" width="208" height="43" rx="20" fill="url(#nesneBaslik)"/>
  <rect x="205" y="74" width="208" height="20" fill="url(#nesneBaslik)"/>
  <text x="309" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315a70">NESNE</text>
  <text x="309" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45697a">otomobil</text>

  <rect x="224" y="125" width="170" height="26" rx="8" fill="#edf7fd" filter="url(#hafifGolge)"/>
  <text x="237" y="142" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#49758a">marka</text>
  <text x="378" y="142" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355262">Volta</text>

  <rect x="224" y="157" width="170" height="26" rx="8" fill="#f8edf1" filter="url(#hafifGolge)"/>
  <text x="237" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a5363">renk</text>
  <text x="378" y="174" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64434b">kırmızı</text>

  <rect x="224" y="189" width="170" height="26" rx="8" fill="#eff6e9" filter="url(#hafifGolge)"/>
  <text x="237" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5d7b4d">hız</text>
  <text x="378" y="206" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#485e3e">30</text>

  <rect x="224" y="225" width="170" height="27" rx="8" fill="#e9f0fb" filter="url(#hafifGolge)"/>
  <path d="M240 239 L245 244 L254 233" fill="none" stroke="#547ea7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="265" y="243" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466b91">hızlan()</text>
  <text x="378" y="243" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597891">metot</text>

  <!-- Arrow 2 -->
  <path d="M423 162 L448 162" fill="none" stroke="#bf9a69" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="453,162 444,157 444,167" fill="#bf9a69"/>
  <text x="435" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6e4b">çevir</text>

  <!-- JSON -->
  <rect x="460" y="78" width="151" height="169" rx="18" fill="#ffffff" filter="url(#golge)"/>
  <rect x="460" y="78" width="151" height="39" rx="18" fill="url(#jsonBaslik)"/>
  <rect x="460" y="100" width="151" height="17" fill="url(#jsonBaslik)"/>
  <text x="535.5" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80613f">JSON METNİ</text>

  <text x="478" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6b47">{</text>
  <text x="488" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7180">"marka":</text>
  <text x="585" y="157" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a05f55">"Volta"</text>
  <text x="488" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7180">"hız":</text>
  <text x="585" y="178" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8750">30</text>
  <text x="488" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7180">"elektrikli":</text>
  <text x="585" y="199" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8750">true</text>
  <text x="478" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6b47">}</text>

  <!-- Alt süreç -->
  <path d="M309 278 L309 292" fill="none" stroke="#83a3ad" stroke-width="2"/>
  <polygon points="309,297 304,288 314,288" fill="#83a3ad"/>
  <rect x="223" y="298" width="172" height="18" rx="9" fill="#dceeea" opacity="0.95"/>
  <text x="309" y="311" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477468">Serileştir  →  Aktar  →  Ayrıştır</text>
</svg>