<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#dce8fb"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e9"/>
      <stop offset="100%" stop-color="#d4efda"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe8c7"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8d4e0"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#e0d4f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Zafiyet Analizi Süreci</text>

  <!-- Merkez kutu -->
  <rect x="245" y="55" width="150" height="42" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#b0c4de" stroke-width="1"/>
  <text x="320" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">Zafiyet Analizi</text>
  <text x="320" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d5a80">Nessus ve OpenVAS</text>

  <!-- Sol üst: Keşif -->
  <rect x="40" y="55" width="140" height="42" rx="10" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a8d5ba" stroke-width="1"/>
  <text x="110" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5c2e">1. Keşif</text>
  <text x="110" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d7a55">IP, port, servis tespiti</text>

  <!-- Sol alt: Eşleştirme -->
  <rect x="40" y="130" width="140" height="42" rx="10" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a8d5ba" stroke-width="1"/>
  <text x="110" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5c2e">2. Eşleştirme</text>
  <text x="110" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d7a55">CVE veritabanı karşılaştırması</text>

  <!-- Sağ üst: Önceliklendirme -->
  <rect x="460" y="55" width="140" height="42" rx="10" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#e8c9a0" stroke-width="1"/>
  <text x="530" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a4a1a">3. Önceliklendirme</text>
  <text x="530" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9a6a3a">CVSS puanı ve risk analizi</text>

  <!-- Sağ alt: İyileştirme -->
  <rect x="460" y="130" width="140" height="42" rx="10" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#e8c9a0" stroke-width="1"/>
  <text x="530" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a4a1a">4. İyileştirme</text>
  <text x="530" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9a6a3a">Yama, yapılandırma, takip</text>

  <!-- Oklar: soldan merkeze -->
  <path d="M180 76 L240 76" stroke="#5a8a6a" stroke-width="1.5" fill="none"/>
  <polygon points="240,72 248,76 240,80" fill="#5a8a6a"/>

  <path d="M180 151 L240 151" stroke="#5a8a6a" stroke-width="1.5" fill="none"/>
  <polygon points="240,147 248,151 240,155" fill="#5a8a6a"/>

  <!-- Oklar: merkezden sağa -->
  <path d="M400 76 L455 76" stroke="#b08040" stroke-width="1.5" fill="none"/>
  <polygon points="455,72 463,76 455,80" fill="#b08040"/>

  <path d="M400 151 L455 151" stroke="#b08040" stroke-width="1.5" fill="none"/>
  <polygon points="455,147 463,151 455,155" fill="#b08040"/>

  <!-- Alt kavramlar -->
  <rect x="40" y="215" width="130" height="36" rx="8" fill="url(#boxGrad4)" filter="url(#shadowLight)" stroke="#e0a0b0" stroke-width="1"/>
  <text x="105" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#7a1a30">CVE</text>

  <rect x="190" y="215" width="130" height="36" rx="8" fill="url(#boxGrad4)" filter="url(#shadowLight)" stroke="#e0a0b0" stroke-width="1"/>
  <text x="255" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#7a1a30">CVSS Skoru</text>

  <rect x="340" y="215" width="130" height="36" rx="8" fill="url(#boxGrad5)" filter="url(#shadowLight)" stroke="#b0a0d0" stroke-width="1"/>
  <text x="405" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a1a6a">Yanlış Pozitif</text>

  <rect x="490" y="215" width="130" height="36" rx="8" fill="url(#boxGrad5)" filter="url(#shadowLight)" stroke="#b0a0d0" stroke-width="1"/>
  <text x="555" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a1a6a">Doğrulama</text>

  <!-- Alt bağlantı çizgileri -->
  <line x1="105" y1="215" x2="105" y2="200" stroke="#c0a0b0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="255" y1="215" x2="255" y2="200" stroke="#c0a0b0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="405" y1="215" x2="405" y2="200" stroke="#b0a0c0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="555" y1="215" x2="555" y2="200" stroke="#b0a0c0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Alt bilgi -->
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a8a9a">Risk = Olasılık x Etki</text>
  <text x="320" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a8a9a">Öncelik = CVSS x Varlık Kritikliği</text>

  <!-- Döngü oku -->
  <path d="M530 172 C530 200 320 200 320 172" stroke="#b08040" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="316,172 320,180 324,172" fill="#b08040"/>

  <!-- Kimlik bilgili tarama notu -->
  <rect x="245" y="130" width="150" height="36" rx="8" fill="#f0f8ff" filter="url(#shadowLight)" stroke="#b0c8e0" stroke-width="1"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#2a4a6a">Kimlik Bilgili Tarama</text>
  <text x="320" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a6a8a">SSH, WinRM, agent</text>

  <!-- Kimlik bilgili tarama bağlantıları -->
  <line x1="320" y1="130" x2="320" y2="100" stroke="#b0c8e0" stroke-width="1" stroke-dasharray="3,3"/>
</svg>