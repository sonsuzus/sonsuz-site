<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="jointCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f0ff"/>
      <stop offset="100%" stop-color="#dce9fb"/>
    </linearGradient>
    <linearGradient id="matrixCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1eaff"/>
      <stop offset="100%" stop-color="#e5d9fb"/>
    </linearGradient>
    <linearGradient id="tipCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4f7ee"/>
      <stop offset="100%" stop-color="#d2efdf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7890a3" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71869a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="550" cy="54" r="82" fill="#dff3e9" opacity="0.46"/>
  <circle cx="78" cy="285" r="92" fill="#e4edff" opacity="0.55"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385068">Eklem Hızından Uç Nokta Hareketine</text>

  <rect x="32" y="75" width="160" height="170" rx="20" fill="url(#jointCard)" filter="url(#shadow)"/>
  <text x="112" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34516d">Eklem Uzayı</text>

  <rect x="53" y="118" width="118" height="43" rx="12" fill="#f8fbff" filter="url(#softShadow)"/>
  <circle cx="73" cy="139" r="10" fill="#83a9db"/>
  <path d="M69 139 L77 139 M73 135 L77 139 L73 143" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#36536c">q̇₁</text>

  <rect x="53" y="177" width="118" height="43" rx="12" fill="#f8fbff" filter="url(#softShadow)"/>
  <circle cx="73" cy="198" r="10" fill="#83a9db"/>
  <path d="M69 198 L77 198 M73 194 L77 198 L73 202" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#36536c">q̇₂</text>

  <path d="M192 160 L230 160" fill="none" stroke="#7794ad" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="230,160 221,155 221,165" fill="#7794ad"/>
  <text x="211" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668199">hızlar</text>

  <rect x="232" y="60" width="176" height="200" rx="22" fill="url(#matrixCard)" filter="url(#shadow)"/>
  <text x="320" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#563f82">Jacobian</text>
  <text x="320" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705d93">J(q)</text>

  <rect x="263" y="123" width="114" height="83" rx="11" fill="#fbfaff" stroke="#cbbbe9" stroke-width="1.4"/>
  <path d="M279 133 L272 133 L272 196 L279 196 M361 133 L368 133 L368 196 L361 196" fill="none" stroke="#806aa5" stroke-width="2" stroke-linecap="round"/>
  <path d="M320 132 L320 197 M277 164 L363 164" stroke="#ded3ef" stroke-width="1"/>
  <text x="298" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f4c7f">∂x/∂q₁</text>
  <text x="342" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f4c7f">∂x/∂q₂</text>
  <text x="298" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f4c7f">∂y/∂q₁</text>
  <text x="342" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f4c7f">∂y/∂q₂</text>

  <rect x="259" y="218" width="122" height="25" rx="10" fill="#d8caef"/>
  <text x="320" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5e4781">ẋ = J(q) q̇</text>

  <path d="M408 160 L447 160" fill="none" stroke="#7794ad" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="447,160 438,155 438,165" fill="#7794ad"/>
  <text x="427" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668199">dönüşüm</text>

  <rect x="450" y="75" width="158" height="170" rx="20" fill="url(#tipCard)" filter="url(#shadow)"/>
  <text x="529" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386555">Kartezyen Uzay</text>

  <path d="M481 193 L512 157 L548 174" fill="none" stroke="#5c8778" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="481" cy="193" r="10" fill="#7cad9a" stroke="#ffffff" stroke-width="3"/>
  <circle cx="512" cy="157" r="9" fill="#7cad9a" stroke="#ffffff" stroke-width="3"/>
  <circle cx="548" cy="174" r="10" fill="#f0a45e" stroke="#ffffff" stroke-width="3"/>
  <path d="M551 168 L572 145" fill="none" stroke="#e48652" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="574,142 566,146 571,151" fill="#e48652"/>
  <text x="570" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b96843">ẋ</text>
  <text x="529" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477563">Uç efektör hızı</text>

  <rect x="167" y="278" width="306" height="28" rx="14" fill="#ffffff" opacity="0.82" filter="url(#softShadow)"/>
  <circle cx="188" cy="292" r="6" fill="#c89bdf"/>
  <text x="202" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#625577">Ters çözüm: q̇ = J⁺ ẋ</text>
  <path d="M408 292 L438 292" fill="none" stroke="#a88ab9" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="438,292 431,288 431,296" fill="#a88ab9"/>
  <text x="452" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#796488">sözde ters</text>
</svg>