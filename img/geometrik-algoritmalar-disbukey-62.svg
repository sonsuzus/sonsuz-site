<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Geometrik Algoritmalar: Dışbükey Örtüden Tarama Doğrusuna</text>

  <!-- Sol üst: Yapı Taşları -->
  <rect x="20" y="45" width="140" height="95" rx="10" fill="#e8f4f8" filter="url(#shadow)" stroke="#b8d4e3" stroke-width="1"/>
  <text x="90" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Yapı Taşları</text>
  
  <!-- Nokta -->
  <circle cx="50" cy="90" r="4" fill="#2980b9"/>
  <text x="62" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Nokta P(x,y)</text>
  
  <!-- Vektör -->
  <line x1="45" y1="115" x2="85" y2="105" stroke="#e74c3c" stroke-width="2"/>
  <polygon points="85,105 79,101 82,108" fill="#e74c3c"/>
  <text x="95" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Vektör AB</text>

  <!-- Sağ üst: Çapraz Çarpım -->
  <rect x="180" y="45" width="200" height="95" rx="10" fill="#fef9e7" filter="url(#shadow)" stroke="#e6d5a8" stroke-width="1"/>
  <text x="280" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Çapraz Çarpım</text>
  
  <!-- Formül -->
  <text x="280" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">cross(A,B,C) = (B-A) x (C-A)</text>
  
  <!-- İşaretler -->
  <rect x="195" y="100" width="55" height="28" rx="6" fill="#d5f5e3" filter="url(#shadowLight)"/>
  <text x="222" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Sola dönüş</text>
  
  <rect x="258" y="100" width="55" height="28" rx="6" fill="#fadbd8" filter="url(#shadowLight)"/>
  <text x="285" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c0392b">Sağa dönüş</text>
  
  <rect x="321" y="100" width="48" height="28" rx="6" fill="#ebedef" filter="url(#shadowLight)"/>
  <text x="345" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5d6d7e">Doğrusal</text>

  <!-- Sağ üst ok: Çapraz çarpım -> Çokgen alanı -->
  <path d="M 380 92 L 420 92" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="420,92 413,88 413,96" fill="#7f8c8d"/>

  <!-- Orta sağ: Çokgen Alanı -->
  <rect x="425" y="45" width="195" height="95" rx="10" fill="#f4ecf7" filter="url(#shadow)" stroke="#d2b4de" stroke-width="1"/>
  <text x="522" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">Çokgen Alanı</text>
  
  <!-- Ayakkabı bağı formülü -->
  <text x="522" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">2A = Σ(xᵢyᵢ₊₁ - yᵢxᵢ₊₁)</text>
  
  <!-- Yön bilgisi -->
  <rect x="440" y="100" width="80" height="28" rx="6" fill="#d5f5e3" filter="url(#shadowLight)"/>
  <text x="480" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Saat yönü</text>
  
  <rect x="528" y="100" width="80" height="28" rx="6" fill="#fadbd8" filter="url(#shadowLight)"/>
  <text x="568" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c0392b">Ters yön</text>

  <!-- Sol alt: Dışbükey Örtü -->
  <rect x="20" y="165" width="280" height="135" rx="10" fill="#e8f8f5" filter="url(#shadow)" stroke="#a3d9c9" stroke-width="1"/>
  <text x="160" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0e6655">Dışbükey Örtü</text>
  
  <!-- Küçük nokta bulutu -->
  <circle cx="60" cy="215" r="3" fill="#2980b9"/>
  <circle cx="80" cy="230" r="3" fill="#2980b9"/>
  <circle cx="55" cy="245" r="3" fill="#2980b9"/>
  <circle cx="95" cy="210" r="3" fill="#2980b9"/>
  <circle cx="110" cy="240" r="3" fill="#2980b9"/>
  <circle cx="75" cy="255" r="3" fill="#2980b9"/>
  <circle cx="130" cy="225" r="3" fill="#2980b9"/>
  <circle cx="140" cy="250" r="3" fill="#2980b9"/>
  <circle cx="50" cy="230" r="3" fill="#2980b9"/>
  
  <!-- Örtü çizgisi -->
  <polygon points="55,245 50,230 60,215 95,210 130,225 140,250 75,255" fill="none" stroke="#1abc9c" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Monotonic Chain etiketi -->
  <rect x="160" y="210" width="125" height="28" rx="6" fill="#d1f2eb" filter="url(#shadowLight)"/>
  <text x="222" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0e6655">Monotonic Chain</text>
  
  <!-- Karmaşıklık -->
  <text x="222" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Sıralama O(n log n)</text>
  <text x="222" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Zincirler O(n)</text>

  <!-- Sağ alt: Tarama Doğrusu -->
  <rect x="320" y="165" width="300" height="135" rx="10" fill="#fef5e7" filter="url(#shadow)" stroke="#f0c27a" stroke-width="1"/>
  <text x="470" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#9c640c">Tarama Doğrusu</text>
  
  <!-- Hayali tarama çizgisi -->
  <line x1="345" y1="200" x2="345" y2="285" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,3"/>
  
  <!-- Doğru parçaları -->
  <line x1="360" y1="215" x2="420" y2="250" stroke="#3498db" stroke-width="2.5"/>
  <line x1="380" y1="270" x2="450" y2="230" stroke="#e74c3c" stroke-width="2.5"/>
  <line x1="430" y1="210" x2="480" y2="260" stroke="#2ecc71" stroke-width="2.5"/>
  <line x1="500" y1="240" x2="560" y2="215" stroke="#9b59b6" stroke-width="2.5"/>
  
  <!-- Kesişim noktası -->
  <circle cx="415" cy="248" r="4" fill="#e67e22" stroke="#fff" stroke-width="1"/>
  
  <!-- Olaylar -->
  <rect x="490" y="200" width="115" height="28" rx="6" fill="#fdebd0" filter="url(#shadowLight)"/>
  <text x="547" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9c640c">Olaylar: başlangıç</text>
  
  <rect x="490" y="235" width="115" height="28" rx="6" fill="#fdebd0" filter="url(#shadowLight)"/>
  <text x="547" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9c640c">bitiş, kesişim</text>
  
  <rect x="490" y="270" width="115" height="28" rx="6" fill="#d5f5e3" filter="url(#shadowLight)"/>
  <text x="547" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">Aktif küme: O(log n)</text>

  <!-- Oklar arası bağlantılar -->
  <!-- Yapı taşları -> Çapraz çarpım -->
  <path d="M 160 92 L 180 92" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="180,92 173,88 173,96" fill="#7f8c8d"/>
  
  <!-- Çapraz çarpım -> Dışbükey örtü -->
  <path d="M 280 140 L 280 165" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="280,165 276,158 284,158" fill="#7f8c8d"/>
  
  <!-- Çapraz çarpım -> Tarama doğrusu -->
  <path d="M 310 140 L 470 165" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="470,165 463,161 463,169" fill="#7f8c8d"/>
  
  <!-- Çokgen alanı -> Tarama doğrusu -->
  <path d="M 522 140 L 522 165" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="522,165 518,158 526,158" fill="#7f8c8d"/>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">Temel işlemler: nokta, vektör, çapraz çarpım, alan, dışbükey örtü, tarama doğrusu</text>
</svg>