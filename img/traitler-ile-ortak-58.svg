    <rect x="38" y="77" width="139" height="77" rx="18" fill="url(#typeGrad)" stroke="#ead19d"/>
    <circle cx="66" cy="113" r="17" fill="#fffaf0"/>
    <path d="M54 116 Q64 102 74 116 Q67 113 61 120 Q61 113 54 116Z" fill="#e59c55"/>
    <path d="M76 111 L85 108 L77 116Z" fill="#e59c55"/>
