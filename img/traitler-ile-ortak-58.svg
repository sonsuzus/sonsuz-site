<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="traitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d4ff"/>
      <stop offset="100%" stop-color="#c6e5ff"/>
    </linearGradient>
    <linearGradient id="typeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="100%" stop-color="#ffe2bc"/>
    </linearGradient>
    <linearGradient id="useGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f4df"/>
      <stop offset="100%" stop-color="#c9e8f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71839b" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71839b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="50" cy="47" r="74" fill="#cfe8ff" opacity="0.30"/>
  <circle cx="594" cy="280" r="95" fill="#d8f3d3" opacity="0.35"/>
  <path d="M28 276 C134 244 176 302 273 280 S453 240 614 274" fill="none" stroke="#b9d9d0" stroke-width="2" opacity="0.42"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405269">ORTAK DAVRANIŞ SÖZLEŞMESİ</text>

  <!-- Lines behind cards -->
