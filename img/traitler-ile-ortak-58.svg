  <path d="M177 211 C202 211 208 196 230 184" fill="none" stroke="#8194ae" stroke-width="2.2"/>
  <polygon points="230,184 221,181 225,190" fill="#8194ae"/>
  
  <path d="M410 140 C431 133 439 105 457 98" fill="none" stroke="#8194ae" stroke-width="2.2"/>
