  <!-- Bottom concept -->
  <g filter="url(#softShadow)">
    <rect x="205" y="250" width="230" height="43" rx="16" fill="#ffffff" opacity="0.88" stroke="#d3e1e5"/>
    <path d="M228 271 C234 263 243 263 249 271 C243 279 234 279 228 271Z" fill="#79a9a4"/>
    <circle cx="238" cy="271" r="2.5" fill="#ffffff"/>
    <text x="260" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#52656b">TİP DEĞİL · YETENEK</text>
  </g>
  <path d="M320 219 L320 244" fill="none" stroke="#8aabb0" stroke-width="2"/>
  <polygon points="320,250 315,242 325,242" fill="#8aabb0"/>
