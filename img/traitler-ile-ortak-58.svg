    <circle cx="483" cy="220" r="16" fill="#f8fffb"/>
    <rect x="474" y="211" width="18" height="18" rx="4" fill="#5e9bb6"/>
    <path d="M478 216 H488 M478 221 H488 M478 226 H484" stroke="#ffffff" stroke-width="1.4"/>
