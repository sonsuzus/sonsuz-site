    <text x="264" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46526d">isim() · zorunlu</text>
    <text x="264" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46526d">hiz() · zorunlu</text>
    <text x="264" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46526d">bilgi_ver() · varsayılan</text>
  </g>

  <!-- Usage cards -->
  <g filter="url(#softShadow)">
    <rect x="457" y="63" width="145" height="76" rx="18" fill="url(#useGrad)" stroke="#aed5c4"/>
    <circle cx="483" cy="101" r="16" fill="#f8fffb"/>
