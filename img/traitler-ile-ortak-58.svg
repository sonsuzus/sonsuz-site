    <path d="M58 216 L56 222 M74 216 L76 222" stroke="#4d7da7" stroke-width="2"/>
    <text x="100" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f5965">Uçak</text>
    <text x="100" y="226" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66717d">farklı veri</text>
  </g>

