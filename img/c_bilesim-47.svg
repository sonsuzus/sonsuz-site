<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="unionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7fb8d0"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <linearGradient id="typeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81ecec"/>
      <stop offset="100%" stop-color="#55a3a3"/>
    </linearGradient>
    <linearGradient id="accessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e994"/>
      <stop offset="100%" stop-color="#78c850"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2d3436">C Programlama - Bileşim (Union)</text>

  <!-- Bellek Bloğu (merkez) -->
  <rect x="220" y="95" width="200" height="90" rx="10" fill="url(#memGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2d3436">Ortak Bellek Alanı</text>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d3436">8 byte (en büyük üye)</text>
  
  <!-- Bellek içi bölümler -->
  <line x1="220" y1="155" x2="420" y2="155" stroke="#b2bec3" stroke-width="1"/>
  <line x1="320" y1="140" x2="320" y2="155" stroke="#b2bec3" stroke-width="1"/>
  <text x="270" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#636e72">int (4 byte)</text>
  <text x="370" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#636e72">float (4 byte)</text>

  <!-- Union Tanımı -->
  <rect x="40" y="60" width="150" height="70" rx="10" fill="url(#unionGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="115" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">union veri</text>
  <text x="115" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">int sayi;</text>
  <text x="115" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">float ondalik;</text>

  <!-- Değişkenler -->
  <rect x="40" y="200" width="150" height="70" rx="10" fill="url(#typeGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="115" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0e4d4d">Değişkenler</text>
  <text x="115" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0e4d4d">union veri d1;</text>
  <text x="115" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0e4d4d">union veri *d2;</text>

  <!-- Erişim -->
  <rect x="450" y="60" width="150" height="70" rx="10" fill="url(#accessGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="525" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#145a32">Erişim</text>
  <text x="525" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#145a32">d1.sayi</text>
  <text x="525" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#145a32">d2-&gt;ondalik</text>

  <!-- Önemli Not -->
  <rect x="450" y="200" width="150" height="70" rx="10" fill="#f8c291" filter="url(#shadow)" opacity="0.95"/>
  <text x="525" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6b3a1f">Önemli</text>
  <text x="525" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6b3a1f">Aynı anda tek üye</text>
  <text x="525" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6b3a1f">kullanılabilir</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Union -> Bellek -->
  <line x1="190" y1="95" x2="220" y2="120" stroke="#2d3436" stroke-width="2"/>
  <polygon points="220,120 214,112 216,122" fill="#2d3436"/>

  <!-- Değişkenler -> Bellek -->
  <line x1="190" y1="235" x2="220" y2="170" stroke="#2d3436" stroke-width="2"/>
  <polygon points="220,170 214,178 216,168" fill="#2d3436"/>

  <!-- Bellek -> Erişim -->
  <line x1="420" y1="120" x2="450" y2="95" stroke="#2d3436" stroke-width="2"/>
  <polygon points="450,95 442,94 446,102" fill="#2d3436"/>

  <!-- Bellek -> Önemli -->
  <line x1="420" y1="170" x2="450" y2="235" stroke="#2d3436" stroke-width="2"/>
  <polygon points="450,235 442,234 446,242" fill="#2d3436"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#636e72">. ve -&gt; işaretleri ile üyelere erişim sağlanır</text>
</svg>