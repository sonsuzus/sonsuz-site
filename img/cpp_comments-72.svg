<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="mainBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#3f51b5"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="exampleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <offset offset="0%" stop-color="#ffffff"/>
      <offset offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#37474f">C++ Yorum Satırları</text>
  <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c">Derleyici tarafından yok sayılır</text>

  <!-- Ana Kutu -->
  <rect x="240" y="68" width="160" height="44" rx="10" fill="url(#mainBox)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Yorum Satırı</text>
  <text x="320" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c5cae9">Açıklama ekleme</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol ok -->
  <path d="M 240 90 L 190 90 L 190 130 L 155 130" stroke="#546e7a" stroke-width="1.8" fill="none" stroke-dasharray="4,3"/>
  <polygon points="150,130 160,126 160,134" fill="#546e7a"/>
  
  <!-- Sağ ok -->
  <path d="M 400 90 L 450 90 L 450 130 L 485 130" stroke="#546e7a" stroke-width="1.8" fill="none" stroke-dasharray="4,3"/>
  <polygon points="490,130 480,126 480,134" fill="#546e7a"/>

  <!-- Sol Kutu: Çok Satırlı -->
  <rect x="30" y="130" width="120" height="52" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="90" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">/* ... */</text>
  <text x="90" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b2dfdb">Çok satırlı yorum</text>

  <!-- Sağ Kutu: Tek Satırlı -->
  <rect x="490" y="130" width="120" height="52" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="550" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">// ...</text>
  <text x="550" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffcdd2">Tek satırlık yorum</text>

  <!-- Alt Bilgi Kutuları -->
  <!-- Sol Alt -->
  <rect x="30" y="200" width="120" height="60" rx="8" fill="#ffffff" filter="url(#shadowLight)" stroke="#b2dfdb" stroke-width="1"/>
  <text x="90" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#00695c" font-weight="bold">Kullanım Alanı</text>
  <text x="90" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#546e7a">Birden fazla satırı</text>
  <text x="90" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#546e7a">açıklamak için</text>

  <!-- Sağ Alt -->
  <rect x="490" y="200" width="120" height="60" rx="8" fill="#ffffff" filter="url(#shadowLight)" stroke="#ffcdd2" stroke-width="1"/>
  <text x="550" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c62828" font-weight="bold">Kullanım Alanı</text>
  <text x="550" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#546e7a">Tek satırı iptal</text>
  <text x="550" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#546e7a">etmek veya not</text>

  <!-- Örnek Kutusu -->
  <rect x="180" y="200" width="280" height="100" rx="10" fill="url(#exampleBox)" filter="url(#shadowLight)" stroke="#cfd8dc" stroke-width="1"/>
  <text x="320" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#37474f">Örnek Kullanım</text>
  
  <!-- Kod satırları -->
  <text x="195" y="238" font-family="Consolas, monospace" font-size="10" fill="#00695c">/* Bu bir yorum */</text>
  <text x="195" y="254" font-family="Consolas, monospace" font-size="10" fill="#37474f">cout &lt;&lt; "Merhaba";</text>
  <text x="195" y="270" font-family="Consolas, monospace" font-size="10" fill="#c62828">// Tek satır yorum</text>
  <text x="195" y="286" font-family="Consolas, monospace" font-size="10" fill="#37474f">return 0;</text>

  <!-- Bağlantı çizgileri (örnek kutusuna) -->
  <path d="M 150 156 L 180 156 L 180 230" stroke="#546e7a" stroke-width="1.2" fill="none" stroke-dasharray="3,3"/>
  <path d="M 490 156 L 460 156 L 460 260" stroke="#546e7a" stroke-width="1.2" fill="none" stroke-dasharray="3,3"/>
</svg>