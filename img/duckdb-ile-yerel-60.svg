<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8faee8"/>
      <stop offset="100%" stop-color="#6c8fd0"/>
    </linearGradient>
    <linearGradient id="file" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7df"/>
      <stop offset="100%" stop-color="#f6ddb0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8295" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8295" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="43" r="55" fill="#dcecf8" opacity="0.55"/>
  <circle cx="580" cy="273" r="82" fill="#dcefdc" opacity="0.55"/>
  <path d="M22 266 C112 232 151 282 232 261 S394 228 459 255 S555 291 626 240" fill="none" stroke="#cfe3e8" stroke-width="2" opacity="0.65"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42617b">YEREL ANALİTİK AKIŞI</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71879a">Sunucusuz • tek dosya • hızlı SQL</text>

  <!-- Input cards -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="79" width="126" height="58" rx="14" fill="#ffffff"/>
    <path d="M46 93 h19 l7 7 v23 h-26 z" fill="url(#file)" stroke="#d5af5f" stroke-width="1.2"/>
    <path d="M65 93 v8 h7" fill="none" stroke="#d5af5f" stroke-width="1.2"/>
    <text x="84" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#725525">CSV</text>
    <text x="84" y="121" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7d8c96">Satış verisi</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="28" y="157" width="126" height="58" rx="14" fill="#ffffff"/>
    <path d="M46 171 h19 l7 7 v23 h-26 z" fill="#d9f1e2" stroke="#72ad87" stroke-width="1.2"/>
    <path d="M65 171 v8 h7" fill="none" stroke="#72ad87" stroke-width="1.2"/>
    <text x="84" y="183" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36704a">Parquet</text>
    <text x="84" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7d8c96">Sütunlu dosya</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="28" y="235" width="126" height="58" rx="14" fill="#ffffff"/>
    <rect x="45" y="248" width="28" height="28" rx="7" fill="#eadcf7" stroke="#a87bc8" stroke-width="1.2"/>
    <path d="M52 257 h14 M52 263 h9 M52 269 h12" stroke="#9263b4" stroke-width="1.4" stroke-linecap="round"/>
    <text x="84" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#70488d">Notebook</text>
    <text x="84" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7d8c96">Python ve SQL</text>
  </g>

  <!-- connectors input -->
  <path d="M154 108 H194" fill="none" stroke="#91a9bb" stroke-width="2"/>
  <polygon points="194,108 186,103 186,113" fill="#91a9bb"/>
  <path d="M154 186 H194" fill="none" stroke="#91a9bb" stroke-width="2"/>
  <polygon points="194,186 186,181 186,191" fill="#91a9bb"/>
  <path d="M154 264 H194" fill="none" stroke="#91a9bb" stroke-width="2"/>
  <polygon points="194,264 186,259 186,269" fill="#91a9bb"/>

  <!-- DuckDB core -->
  <g filter="url(#shadow)">
    <ellipse cx="269" cy="91" rx="75" ry="20" fill="#a7c0ef"/>
    <path d="M194 91 v116 c0 12 34 22 75 22 s75-10 75-22 V91z" fill="url(#core)"/>
    <ellipse cx="269" cy="207" rx="75" ry="22" fill="#6688c7"/>
    <ellipse cx="269" cy="91" rx="75" ry="20" fill="#bdd0f2"/>
    <ellipse cx="269" cy="91" rx="54" ry="12" fill="#edf4ff" opacity="0.8"/>
    <path d="M215 139 C240 150 298 150 323 139" fill="none" stroke="#dce9ff" stroke-width="1.2" opacity="0.55"/>
    <path d="M215 173 C240 184 298 184 323 173" fill="none" stroke="#dce9ff" stroke-width="1.2" opacity="0.55"/>
    <text x="269" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">DuckDB</text>
    <text x="269" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf4ff">Gömülü motor</text>
    <text x="269" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf4ff">analitik.duckdb</text>
    <text x="269" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e7f0ff">Tek dosya</text>
  </g>

  <!-- query card -->
  <path d="M344 151 H377" fill="none" stroke="#7899ac" stroke-width="2.2"/>
  <polygon points="377,151 369,146 369,156" fill="#7899ac"/>
  <g filter="url(#smallShadow)">
    <rect x="378" y="105" width="120" height="93" rx="17" fill="#ffffff"/>
    <rect x="394" y="121" width="87" height="22" rx="8" fill="#e5effc"/>
    <text x="437" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426fa9">SQL Sorgu</text>
    <path d="M397 157 h24" stroke="#68a786" stroke-width="5" stroke-linecap="round"/>
    <path d="M397 169 h58" stroke="#8aaad9" stroke-width="5" stroke-linecap="round"/>
    <path d="M397 181 h42" stroke="#d1a561" stroke-width="5" stroke-linecap="round"/>
    <text x="466" y="162" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587080">Filtre</text>
    <text x="466" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587080">Toplama</text>
  </g>

  <!-- optimization bubble -->
  <g filter="url(#smallShadow)">
    <rect x="386" y="220" width="105" height="60" rx="16" fill="#e6f5eb"/>
    <circle cx="409" cy="242" r="11" fill="#9bd2ac"/>
    <path d="M404 242 h10 M409 237 v10" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <text x="429" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7650">Vektör</text>
    <text x="401" y="264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8870">Sütun eleme</text>
  </g>
  <path d="M326 215 C345 247 360 250 386 250" fill="none" stroke="#85ad94" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="386,250 378,245 379,255" fill="#85ad94"/>

  <!-- output -->
  <path d="M498 151 H526" fill="none" stroke="#7899ac" stroke-width="2.2"/>
  <polygon points="526,151 518,146 518,156" fill="#7899ac"/>
  <g filter="url(#shadow)">
    <rect x="527" y="91" width="87" height="122" rx="18" fill="#ffffff"/>
    <rect x="542" y="107" width="57" height="22" rx="7" fill="#f3e4c8"/>
    <text x="570" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a6427">Rapor</text>
    <path d="M544 148 v43 h48" fill="none" stroke="#8296a2" stroke-width="1.5"/>
    <rect x="551" y="172" width="7" height="14" rx="2" fill="#82b794"/>
    <rect x="563" y="160" width="7" height="26" rx="2" fill="#7d9ed4"/>
    <rect x="575" y="151" width="7" height="35" rx="2" fill="#d6a45c"/>
    <text x="570" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657c8b">Hızlı analiz</text>
  </g>

  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668090">Veriyi taşımadan yerelde sorgula</text>
</svg>