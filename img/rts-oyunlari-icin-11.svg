<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#d0ebd8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef7e0"/>
      <stop offset="100%" stop-color="#fdecc8"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f8d7d5"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#d5d9ef"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#c8eef5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowSmall" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="640" height="320" rx="12" fill="url(#bg)"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">RTS Dinamik Akış Alanı Yol Bulma</text>

  <!-- Ana akış: Soldan sağa -->
  <!-- 1. Izgara Haritası -->
  <rect x="20" y="55" width="110" height="70" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#b0c4de" stroke-width="1"/>
  <text x="75" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Izgara Haritası</text>
  <text x="75" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Maliyet Katmanı</text>
  <text x="75" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Engel Verileri</text>

  <!-- Ok 1 -->
  <polygon points="135,90 148,85 148,95" fill="#5a7a9a"/>
  <line x1="130" y1="90" x2="148" y2="90" stroke="#5a7a9a" stroke-width="2"/>

  <!-- 2. Maliyet Alanı -->
  <rect x="155" y="55" width="110" height="70" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#a8c8b0" stroke-width="1"/>
  <text x="210" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Maliyet Alanı</text>
  <text x="210" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a5a">Geçiş Maliyeti</text>
  <text x="210" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a5a">Yol:1 Çamur:5</text>

  <!-- Ok 2 -->
  <polygon points="270,90 283,85 283,95" fill="#5a8a6a"/>
  <line x1="265" y1="90" x2="283" y2="90" stroke="#5a8a6a" stroke-width="2"/>

  <!-- 3. Entegrasyon Alanı -->
  <rect x="290" y="55" width="110" height="70" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#d4c8a0" stroke-width="1"/>
  <text x="345" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Entegrasyon</text>
  <text x="345" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a7a4a">Hedefe Toplam Maliyet</text>
  <text x="345" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a7a4a">Dijkstra Yayılımı</text>

  <!-- Ok 3 -->
  <polygon points="405,90 418,85 418,95" fill="#8a7a4a"/>
  <line x1="400" y1="90" x2="418" y2="90" stroke="#8a7a4a" stroke-width="2"/>

  <!-- 4. Akış Alanı -->
  <rect x="425" y="55" width="110" height="70" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#d4a0a0" stroke-width="1"/>
  <text x="480" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Akış Alanı</text>
  <text x="480" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a4a4a">Yön Vektörleri</text>
  <text x="480" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a4a4a">En Düşük Komşu</text>

  <!-- Ok 4 -->
  <polygon points="540,90 553,85 553,95" fill="#5a7a9a"/>
  <line x1="535" y1="90" x2="553" y2="90" stroke="#5a7a9a" stroke-width="2"/>

  <!-- 5. Birim Hareketi -->
  <rect x="560" y="55" width="60" height="70" rx="10" fill="url(#box6)" filter="url(#shadow)" stroke="#a0d0d8" stroke-width="1"/>
  <text x="590" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Birimler</text>
  <text x="590" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a8a">Yön Oku</text>
  <text x="590" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a8a">Hız</text>

  <!-- Alt bölüm: Dinamik Güncelleme -->
  <rect x="20" y="155" width="290" height="70" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#b0b8d8" stroke-width="1"/>
  <text x="165" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Dinamik Güncelleme</text>
  <text x="165" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a5a8a">Yerel Kirli Bölge</text>
  <text x="165" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a5a8a">Sektör Bazlı Yeniden Hesaplama</text>

  <!-- Ok 5: Dinamik güncelleme -> Entegrasyon -->
  <polygon points="250,150 265,145 265,155" fill="#6a7a9a"/>
  <line x1="245" y1="150" x2="265" y2="150" stroke="#6a7a9a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Alt bölüm: Karşılaştırma -->
  <rect x="330" y="155" width="290" height="70" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#b0b8d8" stroke-width="1"/>
  <text x="475" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Yöntem Karşılaştırması</text>
  <text x="475" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a5a8a">A*: Her Birim İçin Pahalı</text>
  <text x="475" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a5a8a">Akış Alanı: Grup İçin Verimli</text>

  <!-- Alt akış: Maliyet -> Dinamik -->
  <line x1="210" y1="125" x2="210" y2="150" stroke="#5a8a6a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="205,148 210,158 215,148" fill="#5a8a6a"/>

  <!-- Alt akış: Akış -> Karşılaştırma -->
  <line x1="480" y1="125" x2="480" y2="150" stroke="#8a4a4a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="475,148 480,158 485,148" fill="#8a4a4a"/>

  <!-- Formül kutusu -->
  <rect x="20" y="245" width="600" height="55" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadowSmall)" stroke="#c0c8d8" stroke-width="1"/>
  <text x="320" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Entegrasyon Formülü</text>
  <text x="320" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a5a7a">I(x) = min(I(komşu) + C(x, komşu))</text>
</svg>