  <g filter="url(#smallShadow)">
    <rect x="421" y="132" width="185" height="67" rx="16" fill="#ffffff"/>
    <rect x="435" y="146" width="32" height="32" rx="10" fill="#fff0cd"/>
    <path d="M442 166h18l-3-12h-12z" fill="#c89246"/>
    <path d="M445 154v-4h10v4" fill="none" stroke="#c89246" stroke-width="2" stroke-linecap="round"/>
