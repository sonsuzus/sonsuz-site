  <text x="480" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566e">BorgBackup</text>
  <text x="480" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718296">Verimli SSH depo</text>

  <g filter="url(#smallShadow)">
