    <rect x="435" y="220" width="32" height="32" rx="10" fill="#e9ddf8"/>
    <path d="M451 227l8 4v8c0 5-4 8-8 10-4-2-8-5-8-10v-8z" fill="#8c72bd"/>
    <path d="M447 238l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
