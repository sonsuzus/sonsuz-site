  <path d="M127 281h16" stroke="#b3c7d7" stroke-width="2"/>
  <circle cx="164" cy="281" r="12" fill="#d9f2e7"/>
  <text x="164" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f9279">2</text>
  <text x="185" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526c84">Ortam</text>
  <path d="M237 281h16" stroke="#b3c7d7" stroke-width="2"/>
  <circle cx="274" cy="281" r="12" fill="#eadffc"/>
  <text x="274" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765aa3">1</text>
  <text x="295" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526c84">Uzak konum</text>
