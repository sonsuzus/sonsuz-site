  <path d="M151 164 H204" fill="none" stroke="#8ca9bd" stroke-width="2.5"/>
  <polygon points="204,164 196,159 196,169" fill="#8ca9bd"/>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="208" y="94" width="166" height="142" rx="24" fill="url(#core)"/>
    <rect x="224" y="110" width="134" height="36" rx="13" fill="#ffffff" opacity="0.78"/>
    <path d="M243 128c0-9 7-16 16-16s16 7 16 16v8h-32z" fill="#6b95c3"/>
    <rect x="247" y="126" width="24" height="18" rx="4" fill="#8eb9df"/>
