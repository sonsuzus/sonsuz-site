  <polygon points="417,91 409,86 410,96" fill="#8ba8bd"/>
  <path d="M378 165 H417" fill="none" stroke="#8ba8bd" stroke-width="2.5"/>
  <polygon points="417,165 409,160 409,170" fill="#8ba8bd"/>
