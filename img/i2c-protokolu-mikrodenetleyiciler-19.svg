<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#778dd6"/>
      <stop offset="1" stop-color="#58aaa1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#507183" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="552" cy="44" r="88" fill="#dff3eb" opacity="0.55"/>
  <circle cx="88" cy="286" r="100" fill="#e1eafa" opacity="0.58"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3c5063" font-weight="700">I²C İLETİŞİM YOLU</text>

  <!-- Pull-up panel -->
  <g filter="url(#soft)">
    <rect x="194" y="42" width="252" height="64" rx="16" fill="#ffffff" opacity="0.9"/>
    <text x="320" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526274" font-weight="700">Pull-up dirençleri</text>
    <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7590a0">VCC ile hatlar yüksek seviyeye çıkar</text>
    <path d="M257 89h14l4-6 7 12 7-12 7 12 7-12 7 12 4-6h16" fill="none" stroke="#df8d78" stroke-width="2"/>
    <path d="M349 89h14l4-6 7 12 7-12 7 12 7-12 7 12 4-6h16" fill="none" stroke="#df8d78" stroke-width="2"/>
  </g>

  <path d="M292 106v26 M388 106v26" fill="none" stroke="#d39a89" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- controller -->
  <g filter="url(#shadow)">
    <rect x="35" y="128" width="126" height="111" rx="20" fill="#dce5fb"/>
    <rect x="47" y="141" width="102" height="84" rx="14" fill="#edf2ff"/>
    <rect x="72" y="153" width="52" height="37" rx="8" fill="#8498d9"/>
    <path d="M79 174h11v-12h13v12h14" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="78" cy="204" r="4" fill="#69b99d"/>
    <circle cx="94" cy="204" r="4" fill="#e6b15c"/>
    <circle cx="110" cy="204" r="4" fill="#e28380"/>
    <text x="98" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42546d" font-weight="700">Mikrodenetleyici</text>
  </g>

  <!-- Bus frame -->
  <g filter="url(#soft)">
    <rect x="187" y="124" width="248" height="120" rx="22" fill="#ffffff" opacity="0.82"/>
    <text x="211" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#516478" font-weight="700">Ortak veri yolu</text>

    <text x="211" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63768a">SDA</text>
    <line x1="250" y1="174" x2="407" y2="174" stroke="url(#bus)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="278" cy="174" r="5" fill="#ffffff" stroke="#728bd1" stroke-width="2"/>
    <circle cx="338" cy="174" r="5" fill="#ffffff" stroke="#62a99f" stroke-width="2"/>

    <text x="211" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63768a">SCL</text>
    <line x1="250" y1="207" x2="407" y2="207" stroke="url(#bus)" stroke-width="5" stroke-linecap="round"/>
    <path d="M270 207v-13h17v13h17v-13h17v13h17v-13h17v13" fill="none" stroke="#ffffff" stroke-width="1.7"/>
  </g>

  <!-- left links -->
  <path d="M161 174h26 M161 207h26" fill="none" stroke="#7c91cf" stroke-width="3"/>
  <circle cx="177" cy="174" r="3" fill="#7c91cf"/>
  <circle cx="177" cy="207" r="3" fill="#7c91cf"/>

  <!-- right distribution -->
  <path d="M435 174h18v-56h20 M435 207h28v-8h10 M435 174h18v79h20" fill="none" stroke="#67a99e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="453" cy="174" r="4" fill="#67a99e"/>
  <circle cx="463" cy="207" r="4" fill="#67a99e"/>

  <!-- device cards -->
  <g filter="url(#shadow)">
    <rect x="475" y="74" width="128" height="72" rx="16" fill="#fbe9d8"/>
    <circle cx="500" cy="104" r="15" fill="#e7a36c"/>
    <path d="M500 94v17 M494 104h12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="548" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76563f" font-weight="700">Sıcaklık</text>
    <text x="548" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b7559">0x76</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="163" width="128" height="72" rx="16" fill="#dff1e8"/>
    <rect x="488" y="180" width="25" height="27" rx="4" fill="#66ae9d"/>
    <path d="M493 187h15 M493 193h15 M493 199h9" stroke="#ffffff" stroke-width="1.5"/>
    <text x="553" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456b62" font-weight="700">Ekran</text>
    <text x="553" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#689286">0x3C</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="253" width="128" height="48" rx="15" fill="#ece3fa"/>
    <circle cx="500" cy="277" r="13" fill="#a88bd0"/>
    <path d="M494 280l5-7 4 5 4-7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="553" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e4d78" font-weight="700">İvmeölçer</text>
  </g>

  <!-- transaction strip -->
  <g filter="url(#soft)">
    <rect x="78" y="263" width="371" height="39" rx="15" fill="#ffffff" opacity="0.9"/>
    <text x="103" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617588" font-weight="700">BAŞLA</text>
    <path d="M151 282h23" stroke="#9aabba" stroke-width="1.5"/>
    <polygon points="174,282 168,278 168,286" fill="#9aabba"/>
    <text x="183" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617588">Adres</text>
    <path d="M224 282h23" stroke="#9aabba" stroke-width="1.5"/>
    <polygon points="247,282 241,278 241,286" fill="#9aabba"/>
    <text x="257" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617588">ACK</text>
    <path d="M286 282h23" stroke="#9aabba" stroke-width="1.5"/>
    <polygon points="309,282 303,278 303,286" fill="#9aabba"/>
    <text x="319" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617588">Veri</text>
    <path d="M347 282h23" stroke="#9aabba" stroke-width="1.5"/>
    <polygon points="370,282 364,278 364,286" fill="#9aabba"/>
    <text x="380" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617588" font-weight="700">DUR</text>
  </g>
</svg>