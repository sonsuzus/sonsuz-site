    <path d="M265 117 C265 104 275 95 288 95 C294 80 307 72 323 72 C341 72 356 84 360 100 C376 100 389 111 389 126 C389 142 376 153 360 153 H282 C265 153 252 141 252 126 C252 122 253 119 265 117Z" fill="#f8fffb" opacity="0.9"/>
    <text x="320" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#336956">Bulut sunucusu</text>
    <text x="320" y="131" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#578370">Şifreli hesaplama</text>

