    <text x="360" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d765f">f(E(x), E(y))</text>
    <path d="M307 183 H316" stroke="#6a9c86" stroke-width="2" stroke-linecap="round"/>
    <polygon points="321,183 313,178 313,188" fill="#6a9c86"/>
