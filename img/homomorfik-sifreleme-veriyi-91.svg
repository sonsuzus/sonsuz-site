    <text x="539" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#84652d">D(sonuç)</text>
    <text x="539" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5e7c4b">Anlamlı sonuç</text>
    <text x="539" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698294">Yalnızca kullanıcı</text>
