    <path d="M160 278 C160 272 163 269 168 269 C171 269 173 271 173 274 C173 278 169 279 169 282 H164 C164 278 160 278 160 278Z" fill="#a95c68"/>
    <text x="188" y="271" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526c7c">Gürültü</text>
    <text x="188" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748b98">işlemlerle büyür</text>

    <path d="M298 274 H328" stroke="#91a8b4" stroke-width="2"/>
    <polygon points="333,274 324,269 324,279" fill="#91a8b4"/>

    <circle cx="359" cy="274" r="13" fill="#d7e9fc"/>
    <path d="M353 274 a6 6 0 1 0 10-4 M365 269 v5 h-5" fill="none" stroke="#48769b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="383" y="271" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526c7c">Yenileme</text>
    <text x="383" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748b98">bootstrapping</text>
