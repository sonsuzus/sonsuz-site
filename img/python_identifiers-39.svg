<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Arkaplan -->
  <rect x="0" y="0" width="640" height="320" rx="12" fill="url(#bgGrad)"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Python Tanımlayıcılar</text>

  <!-- Merkez kavram -->
  <rect x="255" y="50" width="130" height="40" rx="20" fill="url(#boxGrad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">Tanımlayıcılar</text>

  <!-- Oklar - merkezden dışarı -->
  <!-- Ok 1: sol üst -->
  <path d="M 255 70 L 145 70" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <polygon points="145,70 155,65 155,75" fill="#64748b"/>

  <!-- Ok 2: sol alt -->
  <path d="M 255 80 L 145 130" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <polygon points="145,130 153,122 148,135" fill="#64748b"/>

  <!-- Ok 3: sağ üst -->
  <path d="M 385 70 L 495 70" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <polygon points="495,70 485,65 485,75" fill="#64748b"/>

  <!-- Ok 4: sağ alt -->
  <path d="M 385 80 L 495 130" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <polygon points="495,130 487,122 492,135" fill="#64748b"/>

  <!-- Ok 5: alt orta -->
  <path d="M 320 90 L 320 155" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <polygon points="320,155 315,145 325,145" fill="#64748b"/>

  <!-- Sol üst kural kutusu -->
  <rect x="30" y="45" width="115" height="50" rx="8" fill="url(#boxGrad2)" filter="url(#shadow)" opacity="0.9"/>
  <text x="87" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#14532d">Harf, rakam</text>
  <text x="87" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#14532d">ve alt çizgi</text>

  <!-- Sol alt kural kutusu -->
  <rect x="15" y="110" width="130" height="50" rx="8" fill="url(#boxGrad3)" filter="url(#shadow)" opacity="0.9"/>
  <text x="80" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#713f12">Büyük-küçük harf</text>
  <text x="80" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#713f12">duyarlılığı</text>

  <!-- Sağ üst kural kutusu -->
  <rect x="495" y="45" width="115" height="50" rx="8" fill="url(#boxGrad4)" filter="url(#shadow)" opacity="0.9"/>
  <text x="552" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#831843">Anahtar kelime</text>
  <text x="552" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#831843">kullanılamaz</text>

  <!-- Sağ alt kural kutusu -->
  <rect x="495" y="110" width="115" height="50" rx="8" fill="url(#boxGrad5)" filter="url(#shadow)" opacity="0.9"/>
  <text x="552" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#312e81">Rakam ile</text>
  <text x="552" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#312e81">başlayamaz</text>

  <!-- Alt orta örnek kutusu -->
  <rect x="200" y="155" width="240" height="145" rx="10" fill="url(#boxGrad6)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">Örnek Kod</text>

  <!-- Kod satırları -->
  <text x="215" y="195" font-family="Consolas, monospace" font-size="11" fill="#1e293b">deg1 = 21</text>
  <text x="215" y="212" font-family="Consolas, monospace" font-size="11" fill="#1e293b">deg_2 = 36</text>
  <text x="215" y="229" font-family="Consolas, monospace" font-size="11" fill="#1e293b">deg3 = 17</text>
  <text x="215" y="246" font-family="Consolas, monospace" font-size="11" fill="#1e293b">Deg3 = 25</text>

  <!-- Hata satırları -->
  <text x="215" y="268" font-family="Consolas, monospace" font-size="10" fill="#b91c1c"># for = 42  (hata)</text>
  <text x="215" y="285" font-family="Consolas, monospace" font-size="10" fill="#b91c1c"># 1deg = 75 (hata)</text>

  <!-- Çıktı kutusu -->
  <rect x="460" y="200" width="100" height="80" rx="8" fill="#ffffff" filter="url(#shadow)" opacity="0.85" stroke="#cbd5e1" stroke-width="1"/>
  <text x="510" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#334155">Çıktı</text>
  <text x="480" y="240" font-family="Consolas, monospace" font-size="11" fill="#334155">21</text>
  <text x="480" y="255" font-family="Consolas, monospace" font-size="11" fill="#334155">36</text>
  <text x="480" y="270" font-family="Consolas, monospace" font-size="11" fill="#334155">17</text>
  <text x="480" y="285" font-family="Consolas, monospace" font-size="11" fill="#334155">25</text>

  <!-- Çıktıya ok -->
  <path d="M 440 240 L 458 240" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <polygon points="458,240 448,235 448,245" fill="#64748b"/>

  <!-- Alt bilgi -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#94a3b8">Python tanımlayıcı kuralları ve örnek kullanım</text>
</svg>