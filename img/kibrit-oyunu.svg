<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
<path d="M160 75 Q200 75 240 120" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M160 235 Q200 235 240 200" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M400 120 Q440 75 480 90" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M400 200 Q440 225 480 225" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M320 240 L320 260" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="50" width="120" height="50" rx="12" fill="#dbeafe" filter="url(#sh)"/>
  <text x="100" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e40af">Başlangıç</text>
  <text x="100" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3b82f6">1.000.000 Çöp</text>
<rect x="40" y="200" width="120" height="70" rx="12" fill="#dcfce7" filter="url(#sh)"/>
  <text x="100" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#166534">Girdi</text>
  <text x="100" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#22c55e">p (Asal Sayı)</text>
  <text x="100" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#22c55e">n (Doğal Sayı)</text>
<rect x="240" y="80" width="160" height="160" rx="16" fill="#fef3c7" filter="url(#sh)"/>
  <text x="320" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Oyun Motoru</text>
  <text x="320" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b45309">Asallık Kontrolü</text>
  <text x="320" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b45309">Üs Hesaplama (pⁿ)</text>
  <text x="320" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b45309">Çöp Çıkarma</text>
  <text x="320" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b45309">Kazanan Kontrolü</text>
  <text x="320" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b45309">Sıra Yönetimi</text>
<rect x="480" y="50" width="120" height="80" rx="12" fill="#fce7f3" filter="url(#sh)"/>
  <text x="540" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9d174d">YZ Stratejisi</text>
  <text x="540" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#db2777">Kazanma Hamlesi</text>
  <text x="540" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#db2777">Rakibe Üs Bırakma</text>
<rect x="480" y="200" width="120" height="50" rx="12" fill="#ffedd5" filter="url(#sh)"/>
  <text x="540" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a3412">Zafer Koşulu</text>
  <text x="540" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ea580c">Asal Üs = Kalan Çöp</text>
<rect x="240" y="260" width="160" height="40" rx="10" fill="#f3e8ff" filter="url(#sh)"/>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b21a8">Matematiksel Farkındalık</text>
</svg>