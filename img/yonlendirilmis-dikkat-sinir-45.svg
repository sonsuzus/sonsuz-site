<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#b9d8f5"/>
      <stop offset="55%" stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#f49b8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a0" flood-opacity="0.20"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f29a78" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="286" r="72" fill="#d9edf4" opacity="0.35"/>
  <circle cx="586" cy="36" r="86" fill="#e4efd9" opacity="0.48"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566b">YÖNLENDİRİLMİŞ DİKKAT</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718493">Önemli bölgeleri seç, özellikleri güçlendir</text>

  <!-- Hedef sinyali -->
  <g filter="url(#shadow)">
    <rect x="231" y="20" width="178" height="42" rx="15" fill="#eee5fb" stroke="#d7c8ed"/>
    <circle cx="254" cy="41" r="11" fill="#ae91d3"/>
    <path d="M250 41h8M254 37v8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="273" y="45" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#654a7e">Hedef sinyali: kedi</text>
  </g>
  <path d="M320 63 L320 81" stroke="#9a7fba" stroke-width="2" stroke-linecap="round"/>
  <polygon points="314,78 326,78 320,87" fill="#9a7fba"/>

  <!-- Girdi -->
  <g filter="url(#shadow)">
    <rect x="31" y="101" width="136" height="151" rx="20" fill="#ffffff" stroke="#d9e5e7"/>
    <text x="51" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c6572">Görüntü</text>
    <rect x="50" y="143" width="98" height="82" rx="11" fill="#d7e9ec"/>
    <path d="M54 211 C73 187 84 203 96 184 C108 166 122 190 144 162 L144 221 L54 221Z" fill="#9fc8c3"/>
    <circle cx="98" cy="179" r="20" fill="#d9b28e"/>
    <path d="M82 166 L88 151 L96 164 M114 166 L108 151 L101 164" fill="#b9866d"/>
    <circle cx="91" cy="178" r="2.2" fill="#52606a"/>
    <circle cx="105" cy="178" r="2.2" fill="#52606a"/>
    <path d="M96 184 Q99 188 102 184" fill="none" stroke="#52606a" stroke-width="1.5"/>
    <text x="52" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909a">Tüm pikseller</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M174 175 L197 175" stroke="#8aa5ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="195,169 205,175 195,181" fill="#8aa5ae"/>

  <!-- Özellikler -->
  <g filter="url(#shadow)">
    <rect x="206" y="91" width="143" height="174" rx="20" fill="#ffffff" stroke="#d9e5e7"/>
    <text x="225" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c6572">Özellik haritası</text>
    <g transform="translate(226 136)">
      <rect width="18" height="18" rx="4" fill="#c6ddee"/>
      <rect x="23" width="18" height="18" rx="4" fill="#a8c7e1"/>
      <rect x="46" width="18" height="18" rx="4" fill="#d8e8d2"/>
      <rect x="69" width="18" height="18" rx="4" fill="#b7d7cf"/>
      <rect x="0" y="23" width="18" height="18" rx="4" fill="#b5d5d4"/>
      <rect x="23" y="23" width="18" height="18" rx="4" fill="#f4c898"/>
      <rect x="46" y="23" width="18" height="18" rx="4" fill="#f09782"/>
      <rect x="69" y="23" width="18" height="18" rx="4" fill="#ebbc8f"/>
      <rect x="0" y="46" width="18" height="18" rx="4" fill="#d6e5f1"/>
      <rect x="23" y="46" width="18" height="18" rx="4" fill="#f1bb8e"/>
      <rect x="46" y="46" width="18" height="18" rx="4" fill="#ff917d" filter="url(#glow)"/>
      <rect x="69" y="46" width="18" height="18" rx="4" fill="#d8e6cc"/>
      <rect x="0" y="69" width="18" height="18" rx="4" fill="#c3dded"/>
      <rect x="23" y="69" width="18" height="18" rx="4" fill="#b2d3d4"/>
      <rect x="46" y="69" width="18" height="18" rx="4" fill="#e8d2a1"/>
      <rect x="69" y="69" width="18" height="18" rx="4" fill="#c1d8cf"/>
    </g>
    <text x="225" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909a">H × W × C</text>
  </g>

  <!-- arrow 2 -->
  <path d="M356 175 L379 175" stroke="#8aa5ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="377,169 387,175 377,181" fill="#8aa5ae"/>

  <!-- attention -->
  <g filter="url(#shadow)">
    <rect x="388" y="91" width="120" height="174" rx="20" fill="#ffffff" stroke="#d9e5e7"/>
    <text x="407" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c6572">Dikkat</text>
    <rect x="409" y="134" width="77" height="77" rx="12" fill="url(#heat)" opacity="0.42"/>
    <circle cx="454" cy="178" r="28" fill="#f38e78" opacity="0.66" filter="url(#glow)"/>
    <circle cx="454" cy="178" r="12" fill="#fff0b7" opacity="0.9"/>
    <path d="M421 224 H477" stroke="#dae5e6" stroke-width="1"/>
    <circle cx="420" cy="224" r="4" fill="#b8d8f0"/>
    <circle cx="448" cy="224" r="4" fill="#f3ca8d"/>
    <circle cx="476" cy="224" r="4" fill="#ef8d79"/>
    <text x="411" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909a">α: 0 → 1</text>
  </g>

  <!-- multiplication -->
  <path d="M515 175 L532 175" stroke="#8aa5ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="530,169 540,175 530,181" fill="#8aa5ae"/>
  <circle cx="548" cy="175" r="17" fill="#dff0dd" stroke="#afd0ae" filter="url(#shadow)"/>
  <text x="543" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="700" fill="#5c8d67">×</text>
  <path d="M565 175 L580 175" stroke="#8aa5ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="578,169 588,175 578,181" fill="#8aa5ae"/>

  <!-- output -->
  <g filter="url(#shadow)">
    <rect x="587" y="119" width="43" height="112" rx="18" fill="#fffdf8" stroke="#e7dcc9"/>
    <path d="M601 143 L617 143" stroke="#e3b86c" stroke-width="7" stroke-linecap="round"/>
    <path d="M601 158 L617 158" stroke="#ef957c" stroke-width="7" stroke-linecap="round"/>
    <path d="M601 173 L617 173" stroke="#97c9bb" stroke-width="7" stroke-linecap="round"/>
    <path d="M601 188 L617 188" stroke="#9cc5e2" stroke-width="7" stroke-linecap="round"/>
    <text x="594" y="215" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5d6870">Karar</text>
  </g>

  <!-- footer -->
  <g>
    <rect x="31" y="280" width="578" height="23" rx="11" fill="#eaf2ed" opacity="0.85"/>
    <circle cx="50" cy="291.5" r="5" fill="#ef957c"/>
    <text x="62" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7474">Yüksek ağırlık: karar için daha etkili bölge</text>
    <path d="M422 291.5 L435 291.5" stroke="#779e8a" stroke-width="1.8"/>
    <polygon points="433,287 440,291.5 433,296" fill="#779e8a"/>
    <text x="448" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7474">Odaklanmış temsil</text>
  </g>
</svg>