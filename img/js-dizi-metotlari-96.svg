<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="180" y="18" width="280" height="36" rx="18" fill="#4a6fa5" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="41" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">JavaScript Dizi Metotları</text>

  <!-- Merkez düğüm -->
  <rect x="255" y="105" width="130" height="40" rx="20" fill="#6b9bd2" filter="url(#shadow)"/>
  <text x="320" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Dizi Metotları</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Push oku -->
  <path d="M 255 125 L 175 125 L 175 175" stroke="#5a8fbf" stroke-width="2" fill="none"/>
  <polygon points="170,183 175,173 180,183" fill="#5a8fbf"/>

  <!-- Unshift oku -->
  <path d="M 320 145 L 320 195" stroke="#5a8fbf" stroke-width="2" fill="none"/>
  <polygon points="315,203 320,193 325,203" fill="#5a8fbf"/>

  <!-- Splice oku -->
  <path d="M 385 125 L 465 125 L 465 175" stroke="#5a8fbf" stroke-width="2" fill="none"/>
  <polygon points="460,183 465,173 470,183" fill="#5a8fbf"/>

  <!-- Push kutusu -->
  <rect x="75" y="185" width="200" height="50" rx="10" fill="#e8f0fe" stroke="#6b9bd2" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="175" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#3a5a8c">push()</text>
  <text x="175" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9c">Sona eleman ekler</text>

  <!-- Unshift kutusu -->
  <rect x="220" y="205" width="200" height="50" rx="10" fill="#e8f0fe" stroke="#6b9bd2" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="320" y="227" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#3a5a8c">unshift()</text>
  <text x="320" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9c">Başa eleman ekler</text>

  <!-- Splice kutusu -->
  <rect x="365" y="185" width="200" height="50" rx="10" fill="#e8f0fe" stroke="#6b9bd2" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="465" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#3a5a8c">splice()</text>
  <text x="465" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9c">İstenen konuma ekler</text>

  <!-- Alt bilgi notu -->
  <rect x="140" y="278" width="360" height="28" rx="14" fill="#d4e6c8" opacity="0.8"/>
  <text x="320" y="297" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3d6b35">push ve unshift geriye eleman sayısını döndürür</text>
</svg>