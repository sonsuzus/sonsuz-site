<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#a0b8d0" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#a0b8d0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c4a6e">SQL GRANT Komutu</text>
  <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">Veri Kontrol Dili (DCL) ile Yetkilendirme</text>

  <!-- GRANT ana kutusu -->
  <rect x="245" y="70" width="150" height="48" rx="10" fill="#4a90d9" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">GRANT</text>
  <text x="320" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e0f0ff">Yetki Ver</text>

  <!-- Oklar (manuel çizim) -->
  <!-- GRANT -> yetki -->
  <line x1="245" y1="94" x2="175" y2="94" stroke="#5a7a9a" stroke-width="1.5"/>
  <polygon points="175,94 185,89 185,99" fill="#5a7a9a"/>

  <!-- GRANT -> nesne -->
  <line x1="320" y1="118" x2="320" y2="155" stroke="#5a7a9a" stroke-width="1.5"/>
  <polygon points="320,155 315,145 325,145" fill="#5a7a9a"/>

  <!-- GRANT -> hedef -->
  <line x1="395" y1="94" x2="465" y2="94" stroke="#5a7a9a" stroke-width="1.5"/>
  <polygon points="465,94 455,89 455,99" fill="#5a7a9a"/>

  <!-- Yetki kutusu -->
  <rect x="55" y="70" width="120" height="48" rx="10" fill="#f0b84a" filter="url(#shadowLight)"/>
  <text x="115" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#5a3e00">yetki_adı</text>
  <text x="115" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7a5e20">SELECT, INSERT, UPDATE</text>

  <!-- Nesne kutusu -->
  <rect x="230" y="155" width="180" height="48" rx="10" fill="#7ac74f" filter="url(#shadowLight)"/>
  <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1e4a1e">nesne_adı</text>
  <text x="320" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2e6a2e">Tablo, View, Stored Proc</text>

  <!-- Hedef kutusu -->
  <rect x="465" y="70" width="120" height="48" rx="10" fill="#e87a7a" filter="url(#shadowLight)"/>
  <text x="525" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#5a1010">hedef</text>
  <text x="525" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7a3030">Kullanıcı, PUBLIC, Rol</text>

  <!-- WITH GRANT OPTION kutusu -->
  <rect x="465" y="155" width="120" height="48" rx="10" fill="#9a8af0" filter="url(#shadowLight)"/>
  <text x="525" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#2a1e5a">WITH GRANT OPTION</text>
  <text x="525" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a3e7a">Yetki devretme izni</text>

  <!-- Nesne -> WITH GRANT OPTION bağlantısı -->
  <line x1="410" y1="179" x2="465" y2="179" stroke="#5a7a9a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="465,179 455,174 455,184" fill="#5a7a9a"/>

  <!-- Örnek komut kutusu -->
  <rect x="55" y="235" width="530" height="60" rx="10" fill="#ffffff" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="75" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c4a6e">Örnek:</text>
  <text x="75" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">GRANT SELECT ON personel TO Ahmet WITH GRANT OPTION</text>
  <text x="75" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a9aba">GRANT SELECT ON personel TO *.*  (tüm kullanıcılar)</text>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#8aa0b8">DCL komutları ile veritabanı güvenliği sağlanır</text>
</svg>