  <text x="226" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#355c73">Giriş portu</text>
  <text x="226" y="206" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#355c73">Giriş portu</text>
  <text x="414" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#355c73">Çıkış portu</text>
  <text x="414" y="206" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#355c73">Çıkış portu</text>

  <!-- Porttan merkeze oklar -->
  <path d="M269 116 L279 125" fill="none" stroke="#7a5ba0" stroke-width="2"/>
  <polygon points="279,125 269,122 274,115" fill="#7a5ba0"/>
  <path d="M269 202 L279 193" fill="none" stroke="#7a5ba0" stroke-width="2"/>
  <polygon points="279,193 274,201 269,194" fill="#7a5ba0"/>
  <path d="M371 116 L361 125" fill="none" stroke="#7a5ba0" stroke-width="2"/>
  <polygon points="361,125 366,115 371,122" fill="#7a5ba0"/>
  <path d="M371 202 L361 193" fill="none" stroke="#7a5ba0" stroke-width="2"/>
  <polygon points="361,193 371,194 366,201" fill="#7a5ba0"/>

  <!-- Çekirdek altıgen -->
  <g filter="url(#shadow)">
    <polygon points="320,77 385,115 385,190 320,228 255,190 255,115" fill="url(#core)"/>
  </g>
  <polygon points="320,87 376,119 376,186 320,218 264,186 264,119" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="320" cy="126" r="18" fill="#ffffff" opacity="0.62"/>
  <path d="M311 126 h18 M320 117 v18" stroke="#76559e" stroke-width="2.4" stroke-linecap="round"/>
  <text x="320" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#493369">Uygulama Çekirdeği</text>
  <text x="320" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b4479">Domain ve kurallar</text>

  <!-- Başlık ve açıklama -->
  <text x="320" y="25" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345168">Altıgen Mimari</text>
  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c7584">Teknoloji değişir, iş mantığı korunur</text>
</svg>