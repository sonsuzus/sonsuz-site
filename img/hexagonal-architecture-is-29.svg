  <text x="93" y="240" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#356e58">Bellek içi</text>
  <text x="93" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477a65">Test adaptörü</text>

  <text x="548" y="72" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#8b4658">Mesajlaşma</text>
  <text x="548" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#97596a">Çıkış adaptörü</text>

  <text x="548" y="240" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#435b99">Veritabanı</text>
  <text x="548" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d70a5">Çıkış adaptörü</text>

