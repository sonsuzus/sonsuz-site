    <rect x="35" y="215" width="104" height="58" rx="15" fill="#d9f1e4"/>
    <rect x="501" y="47" width="104" height="58" rx="15" fill="#fde0e5"/>
    <rect x="501" y="215" width="104" height="58" rx="15" fill="#e3e8fb"/>
  </g>

  <!-- Adaptör ikonları -->
  <g fill="none" stroke="#9c6d35" stroke-width="2" stroke-linecap="round">
    <path d="M58 72 h19 a3 3 0 0 1 3 3 v10 a3 3 0 0 1-3 3 H58 a3 3 0 0 1-3-3 V75 a3 3 0 0 1 3-3z"/>
    <path d="M60 78 h15 M60 83 h10"/>
  </g>
  <g fill="none" stroke="#43866b" stroke-width="2" stroke-linecap="round">
    <ellipse cx="67" cy="235" rx="13" ry="5"/>
    <path d="M54 235 v13 c0 3 6 5 13 5s13-2 13-5v-13"/>
    <path d="M54 241 c0 3 6 5 13 5s13-2 13-5"/>
  </g>
  <g fill="none" stroke="#ad6172" stroke-width="2" stroke-linecap="round">
    <path d="M56 82 h22 M56 75 h15 M56 89 h17"/>
    <circle cx="82" cy="75" r="3"/>
    <circle cx="82" cy="89" r="3"/>
  </g>
  <g fill="none" stroke="#536fae" stroke-width="2" stroke-linecap="round">
    <path d="M56 239 h22 M56 247 h16"/>
    <circle cx="53" cy="239" r="2"/>
    <circle cx="81" cy="239" r="2"/>
