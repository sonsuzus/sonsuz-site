<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c8ff"/>
      <stop offset="100%" stop-color="#bfa8ed"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f1ff"/>
      <stop offset="100%" stop-color="#b7dcf2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66809a" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#66809a" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="321" cy="159" r="139" fill="#ffffff" opacity="0.38"/>
  <circle cx="321" cy="159" r="112" fill="none" stroke="#b9d9db" stroke-width="1.5" stroke-dasharray="5 6" opacity="0.75"/>

  <!-- Bağlantılar -->
  <path d="M139 76 L220 116" fill="none" stroke="#6a91a8" stroke-width="2.2"/>
  <polygon points="220,116 210,115 215,106" fill="#6a91a8"/>
  <path d="M139 244 L220 202" fill="none" stroke="#6a91a8" stroke-width="2.2"/>
  <polygon points="220,202 215,212 210,203" fill="#6a91a8"/>
  <path d="M501 76 L420 116" fill="none" stroke="#6a91a8" stroke-width="2.2"/>
  <polygon points="420,116 425,106 430,115" fill="#6a91a8"/>
  <path d="M501 244 L420 202" fill="none" stroke="#6a91a8" stroke-width="2.2"/>
  <polygon points="420,202 430,203 425,212" fill="#6a91a8"/>

  <!-- Dış adaptörler -->
