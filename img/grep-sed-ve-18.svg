<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddecff"/>
      <stop offset="100%" stop-color="#cce7f2"/>
    </linearGradient>
    <linearGradient id="grepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7dcff"/>
      <stop offset="100%" stop-color="#d8c8f2"/>
    </linearGradient>
    <linearGradient id="sedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6f1e5"/>
      <stop offset="100%" stop-color="#bee5d3"/>
    </linearGradient>
    <linearGradient id="awkGrad" x1="0" y1="0" x2="1" y2="1">
