<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="pidGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeaff"/>
      <stop offset="100%" stop-color="#c9dcf8"/>
    </linearGradient>
    <linearGradient id="robotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f2ea"/>
      <stop offset="100%" stop-color="#bce2d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6d8294" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6d8294" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="67" cy="51" r="55" fill="#dcecff" opacity="0.45"/>
  <circle cx="584" cy="272" r="75" fill="#dcf2de" opacity="0.42"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536b">PID AYARI: HIZ VE KARARLILIK DENGESİ</text>

  <g filter="url(#shadow)">
    <rect x="25" y="74" width="112" height="66" rx="16" fill="#ffffff"/>
    <circle cx="51" cy="107" r="14" fill="#e8f0ff"/>
    <path d="M45 108 L50 113 L59 102" fill="none" stroke="#5483bc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="102" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#395269">Hedef</text>
    <text x="74" y="120" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647888">Konum</text>
  </g>

  <path d="M137 107 H166" fill="none" stroke="#7891a6" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="172,107 164,102 164,112" fill="#7891a6"/>

  <g filter="url(#shadow)">
    <rect x="174" y="55" width="150" height="104" rx="20" fill="url(#pidGrad)"/>
    <text x="249" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294c70">PID Denetleyici</text>
    <line x1="195" y1="95" x2="303" y2="95" stroke="#98b5d4" stroke-width="1"/>
    <rect x="193" y="108" width="30" height="30" rx="9" fill="#f7fbff"/>
    <rect x="234" y="108" width="30" height="30" rx="9" fill="#f7fbff"/>
    <rect x="275" y="108" width="30" height="30" rx="9" fill="#f7fbff"/>
    <text x="208" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e78a0">Kp</text>
    <text x="249" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e78a0">Ki</text>
    <text x="290" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e78a0">Kd</text>
  </g>

  <path d="M324 107 H352" fill="none" stroke="#7891a6" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="358,107 350,102 350,112" fill="#7891a6"/>

  <g filter="url(#shadow)">
    <rect x="360" y="74" width="117" height="66" rx="16" fill="url(#robotGrad)"/>
    <circle cx="388" cy="107" r="15" fill="#edf9f5"/>
    <path d="M378 113 L384 105 L391 108 L397 98" fill="none" stroke="#419379" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
