    <path d="M63 229 C68 215 73 215 78 229" fill="none" stroke="#d97963" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M62 220 C67 211 73 238 79 218" fill="none" stroke="#d97963" stroke-width="1.8" stroke-linecap="round"/>
    <text x="92" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#965143">Aşırı Salınım</text>
    <text x="62" y="256" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a26a5d">Yüksek Kp veya Ki</text>
    <text x="62" y="275" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a26a5d">Aşım ve yığılma</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="198" width="158" height="88" rx="18" fill="#fffbe9"/>
    <circle cx="465" cy="224" r="13" fill="#fff0bd"/>
    <path d="M456 228 L462 228 L465 220 L468 228 L475 228" fill="none" stroke="#bd9441" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="487" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#856825">Yavaş Tepki</text>
    <text x="456" y="256" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#92783e">Düşük kazançlar</text>
    <text x="456" y="275" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#92783e">Uzun yükselme süresi</text>
  </g>

  <path d="M202 241 H248 C265 241 273 228 280 217" fill="none" stroke="#d19a8e" stroke-width="2" stroke-linecap="round"/>
  <polygon points="284,211 275,216 283,221" fill="#d19a8e"/>
  <path d="M438 241 H392 C375 241 367 228 360 217" fill="none" stroke="#cab16d" stroke-width="2" stroke-linecap="round"/>
  <polygon points="356,211 357,221 365,216" fill="#cab16d"/>

  <g filter="url(#shadow)">
    <rect x="251" y="188" width="138" height="102" rx="22" fill="#ffffff"/>
    <circle cx="320" cy="224" r="22" fill="#e5f3ed"/>
    <path d="M307 227 L316 235 L335 214" fill="none" stroke="#4c9c7d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416c60">Dengeli Ayar</text>
    <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c887e">Hızlı ve kararlı</text>
  </g>

  <text x="320" y="309" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62798a">Kp ile hız • Kd ile sönüm • Ki ile kalıcı hata düzeltme</text>
</svg>