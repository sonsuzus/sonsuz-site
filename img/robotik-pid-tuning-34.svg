  <polygon points="137,140 130,148 140,151" fill="#83a398"/>
  <text x="436" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66857b">Ölçüm geri bildirimi</text>

  <g filter="url(#shadow)">
