<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e9"/>
      <stop offset="100%" stop-color="#c8ecd0"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Python Karakter Dizileri ve Metotları</text>

  <!-- Merkez Python Kutusu -->
  <rect x="255" y="50" width="130" height="40" rx="10" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#5c6bc0" stroke-width="1.2"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#283593">Python String</text>

  <!-- Oklar (merkezden dışa) -->
  <!-- Sol üst ok -->
  <path d="M 260 70 L 160 70" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="160,70 170,65 170,75" fill="#7f8c8d"/>

  <!-- Sağ üst ok -->
  <path d="M 380 70 L 480 70" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="480,70 470,65 470,75" fill="#7f8c8d"/>

  <!-- Sol alt ok -->
  <path d="M 270 90 L 170 130" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="170,130 177,122 180,132" fill="#7f8c8d"/>

  <!-- Sağ alt ok -->
  <path d="M 370 90 L 470 130" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="470,130 462,123 472,122" fill="#7f8c8d"/>

  <!-- Alt orta ok -->
  <path d="M 320 90 L 320 130" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="320,130 315,120 325,120" fill="#7f8c8d"/>

  <!-- 1. Kutu: Tırnak Kullanımı -->
  <rect x="30" y="45" width="120" height="50" rx="8" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#4fc3f7" stroke-width="1"/>
  <text x="90" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#01579b">Tırnak Kullanımı</text>
  <text x="90" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">' ' ve " "</text>

  <!-- 2. Kutu: Çok Satırlı -->
  <rect x="490" y="45" width="120" height="50" rx="8" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1"/>
  <text x="550" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1b5e20">Çok Satırlı</text>
  <text x="550" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">''' ''' veya """ """</text>

  <!-- 3. Kutu: Birleştirme -->
  <rect x="30" y="140" width="120" height="50" rx="8" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#ffa726" stroke-width="1"/>
  <text x="90" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#e65100">Birleştirme</text>
  <text x="90" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">+ operatörü</text>

  <!-- 4. Kutu: str() Dönüşümü -->
  <rect x="490" y="140" width="120" height="50" rx="8" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#ab47bc" stroke-width="1"/>
  <text x="550" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#4a148c">str() Dönüşümü</text>
  <text x="550" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">Sayıyı metne çevir</text>

  <!-- 5. Kutu: Örnek Kullanım -->
  <rect x="230" y="140" width="180" height="50" rx="8" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#5c6bc0" stroke-width="1"/>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#283593">Örnek Kullanım</text>
  <text x="320" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">"I'm from Turkey"</text>

  <!-- Alt Bilgi -->
  <rect x="170" y="225" width="300" height="35" rx="8" fill="#ffffff" opacity="0.7" filter="url(#shadow)" stroke="#b0bec5" stroke-width="0.8"/>
  <text x="320" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">Karakter dizisi içinde tırnak gösterme</text>
  <text x="320" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">ve metotlarla işleme</text>

  <!-- Alt bilgiye ok -->
  <path d="M 320 190 L 320 220" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="320,220 315,210 325,210" fill="#7f8c8d"/>

  <!-- Sağ alt küçük not -->
  <rect x="490" y="230" width="120" height="30" rx="6" fill="#e8f5e9" opacity="0.8" stroke="#81c784" stroke-width="0.8"/>
  <text x="550" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2e7d32">Metotlar: upper, lower</text>
</svg>