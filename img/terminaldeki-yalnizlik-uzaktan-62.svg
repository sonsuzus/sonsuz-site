<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#6b7c93" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#4a5b6e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Merkez: Zihinsel Harita -->
  <rect x="245" y="125" width="150" height="70" rx="14" fill="#ffffff" stroke="#7aa5c2" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Zihinsel Harita</text>
  <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6a7a">Yazılımcı Bilişi</text>

  <!-- Sol taraf: Ofis ortamı -->
  <rect x="30" y="60" width="130" height="80" rx="12" fill="#e8f4fd" stroke="#8fb8d9" stroke-width="1.2" filter="url(#shadow2)"/>
  <text x="95" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c5f7c">Ofis Ortamı</text>
  <text x="95" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a6a85">Sosyal geri bildirim</text>
  <text x="95" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a6a85">Anlık yardımlaşma</text>

  <!-- Sağ taraf: Uzaktan çalışma -->
  <rect x="480" y="60" width="130" height="80" rx="12" fill="#fdf3e7" stroke="#d4b08c" stroke-width="1.2" filter="url(#shadow2)"/>
  <text x="545" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5a3a">Uzaktan Çalışma</text>
  <text x="545" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6a4a">Sosyal izolasyon</text>
  <text x="545" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6a4a">Yüksek belirsizlik</text>

  <!-- Oklar: Ofis -> Merkez -->
  <path d="M160 100 L235 130" stroke="#5a8a9a" stroke-width="2" fill="none"/>
  <polygon points="235,130 226,126 228,134" fill="#5a8a9a"/>

  <!-- Oklar: Uzaktan -> Merkez -->
  <path d="M480 100 L405 130" stroke="#c08a5a" stroke-width="2" fill="none"/>
  <polygon points="405,130 414,126 412,134" fill="#c08a5a"/>

  <!-- Alt sol: Bilişsel yük -->
  <rect x="60" y="210" width="140" height="60" rx="10" fill="#eef7f0" stroke="#9cc2a8" stroke-width="1.2" filter="url(#shadow2)"/>
  <text x="130" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d6a4f">Bilişsel Yük</text>
  <text x="130" y="251" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a7a5a">L = Lp + La + Lu - Ds</text>

  <!-- Alt sağ: Problem çözme -->
  <rect x="440" y="210" width="150" height="60" rx="10" fill="#f0eef7" stroke="#b0a8cc" stroke-width="1.2" filter="url(#shadow2)"/>
  <text x="515" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a6a">Problem Çözme</text>
  <text x="515" y="251" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a4a7a">İç konuşma artar</text>

  <!-- Alt orta: Denge -->
  <rect x="250" y="235" width="140" height="50" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="1.2" filter="url(#shadow2)"/>
  <text x="320" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a5a6a">Yeniden Denge</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6a7a">İletişim + Günlük</text>

  <!-- Bağlantılar: Alt kutular -->
  <path d="M130 210 L130 180 Q130 170 140 170 L235 160" stroke="#5a8a6a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="235,160 226,157 228,165" fill="#5a8a6a"/>

  <path d="M515 210 L515 180 Q515 170 505 170 L405 160" stroke="#8a6aaa" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="405,160 414,157 412,165" fill="#8a6aaa"/>

  <!-- Merkezden alt orta bağlantı -->
  <path d="M320 195 L320 230" stroke="#7a9aaa" stroke-width="1.5" fill="none"/>
  <polygon points="320,230 316,222 324,222" fill="#7a9aaa"/>

  <!-- Üst bilgi etiketi -->
  <rect x="200" y="15" width="240" height="35" rx="8" fill="#d9e8f5" stroke="#a0b8d0" stroke-width="1" filter="url(#shadow2)"/>
  <text x="320" y="37" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a6a">Uzaktan Çalışma Dönüşümü</text>

  <!-- Denge oku (üst) -->
  <path d="M160 140 Q200 50 480 50 Q520 50 520 60" stroke="#8aa0b0" stroke-width="1.2" fill="none" stroke-dasharray="5,3"/>
  <polygon points="520,60 514,56 516,64" fill="#8aa0b0"/>
</svg>