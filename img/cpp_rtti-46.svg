<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Çalışma Zamanı Tür Tanımlama</text>

  <!-- Merkez: RTTI Çekirdeği -->
  <rect x="245" y="105" width="150" height="55" rx="14" fill="#6c5ce7" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">RTTI</text>
  <text x="320" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8e0ff">&lt;typeinfo&gt;</text>

  <!-- Sol üst: typeid işlemcisi -->
  <rect x="40" y="50" width="140" height="50" rx="10" fill="#a29bfe" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="110" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">typeid</text>
  <text x="110" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2d3436">Nesne veya tür adı</text>

  <!-- Sol alt: Çok biçimlilik -->
  <rect x="40" y="130" width="140" height="50" rx="10" fill="#74b9ff" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="110" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">Çok biçimlilik</text>
  <text x="110" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2d3436">Sanal fonksiyonlar</text>

  <!-- Sağ üst: dynamic_cast -->
  <rect x="460" y="50" width="140" height="50" rx="10" fill="#55efc4" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="530" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">dynamic_cast</text>
  <text x="530" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2d3436">Güvenli tür dönüşümü</text>

  <!-- Sağ alt: static_cast -->
  <rect x="460" y="130" width="140" height="50" rx="10" fill="#81ecec" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="530" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">static_cast</text>
  <text x="530" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2d3436">Derleme zamanı dönüşüm</text>

  <!-- Alt: Ana sınıf işaretçisi -->
  <rect x="200" y="230" width="240" height="55" rx="12" fill="#fab1a0" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="320" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d3436">Ana sınıf işaretçisi</text>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2d3436">Hangi nesneyi gösterdiği belirsiz</text>

  <!-- Oklar (manuel çizim) -->

  <!-- typeid -> RTTI -->
  <path d="M180,75 L240,75 L240,120" stroke="#636e72" stroke-width="1.8" fill="none"/>
  <polygon points="235,112 240,124 245,112" fill="#636e72"/>

  <!-- Çok biçimlilik -> RTTI -->
  <path d="M180,155 L240,155 L240,135" stroke="#636e72" stroke-width="1.8" fill="none"/>
  <polygon points="235,143 240,131 245,143" fill="#636e72"/>

  <!-- RTTI -> dynamic_cast -->
  <path d="M395,120 L455,120 L455,75" stroke="#636e72" stroke-width="1.8" fill="none"/>
  <polygon points="447,82 455,70 463,82" fill="#636e72"/>

  <!-- RTTI -> static_cast -->
  <path d="M395,135 L455,135 L455,155" stroke="#636e72" stroke-width="1.8" fill="none"/>
  <polygon points="447,147 455,159 463,147" fill="#636e72"/>

  <!-- RTTI -> Ana sınıf işaretçisi -->
  <path d="M320,160 L320,225" stroke="#636e72" stroke-width="1.8" fill="none"/>
  <polygon points="314,217 320,229 326,217" fill="#636e72"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#636e72" opacity="0.7">Çalışma zamanında nesne türünü belirleme ve kontrollü dönüşüm</text>
</svg>