  <g filter="url(#shadow)">
    <rect x="210" y="112" width="124" height="104" rx="24" fill="url(#core)"/>
    <circle cx="272" cy="145" r="20" fill="#ffffff" opacity="0.2"/>
    <path d="M263 145h18M272 136v18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="272" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Karar Motoru</text>
    <text x="272" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf4ff">Öncelik puanı</text>
  </g>

