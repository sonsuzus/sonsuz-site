    <text x="71" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a8b9b">Hızlı benimseme</text>

    <rect x="28" y="200" width="128" height="48" rx="14" fill="#ffffff"/>
    <circle cx="51" cy="224" r="12" fill="#fde8c9"/>
    <circle cx="48" cy="221" r="3" fill="#c78237"/>
    <circle cx="55" cy="221" r="3" fill="#c78237"/>
    <path d="M44 229c2-5 10-5 14 0" fill="none" stroke="#c78237" stroke-width="2" stroke-linecap="round"/>
    <text x="71" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40536a">Kitlesel kurs</text>
    <text x="71" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a8b9b">Ölçek ve erişim</text>
  </g>

  <!-- Lines to core -->
  <path d="M156 102 H192 Q201 102 205 112 L218 142" fill="none" stroke="#a7b9cb" stroke-width="2"/>
  <polygon points="216,136 224,147 211,145" fill="#a7b9cb"/>
  <path d="M156 163 H207" fill="none" stroke="#a7b9cb" stroke-width="2"/>
  <polygon points="202,158 213,163 202,168" fill="#a7b9cb"/>
  <path d="M156 224 H192 Q202 224 206 214 L218 184" fill="none" stroke="#a7b9cb" stroke-width="2"/>
  <polygon points="211,181 223,176 219,189" fill="#a7b9cb"/>

