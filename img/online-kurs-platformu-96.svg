<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8177d9"/>
      <stop offset="100%" stop-color="#5f9ed2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#55718b" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#55718b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="28" r="42" fill="#dceefa" opacity="0.6"/>
  <circle cx="602" cy="290" r="65" fill="#dff1da" opacity="0.55"/>
  <path d="M0 254 C112 217 149 290 242 267 S405 214 510 251 S593 278 640 241" fill="none" stroke="#cce5e1" stroke-width="2" opacity="0.7"/>

  <text x="28" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39536d">LMS SEÇİMİ</text>
  <text x="28" y="51" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718498">Öncelikler → platform uyumu</text>

  <!-- Input cards -->
  <g filter="url(#softShadow)">
