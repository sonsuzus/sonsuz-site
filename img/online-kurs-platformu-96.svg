  <g filter="url(#softShadow)">
    <rect x="393" y="79" width="154" height="67" rx="16" fill="#f1efff"/>
    <rect x="393" y="79" width="7" height="67" rx="3.5" fill="#776bd0"/>
    <text x="416" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c468b">Moodle</text>
    <text x="416" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e708e">Esnek • Modüler</text>

    <rect x="393" y="151" width="154" height="67" rx="16" fill="#e8f6f2"/>
    <rect x="393" y="151" width="7" height="67" rx="3.5" fill="#43a389"/>
    <text x="416" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#347765">Canvas</text>
    <text x="416" y="196" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66877f">Sade • Hızlı</text>

    <rect x="393" y="223" width="154" height="67" rx="16" fill="#fff2df"/>
    <rect x="393" y="223" width="7" height="67" rx="3.5" fill="#db943e"/>
    <text x="416" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a642a">Open edX</text>
    <text x="416" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#997b57">Büyük ölçek • MOOC</text>
