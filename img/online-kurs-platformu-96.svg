    <text x="71" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a8b9b">Eklenti ve kontrol</text>

    <rect x="28" y="139" width="128" height="48" rx="14" fill="#ffffff"/>
    <circle cx="51" cy="163" r="12" fill="#d9f1ea"/>
