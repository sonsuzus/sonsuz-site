  <path d="M334 143 H361 Q370 143 376 134 L388 116" fill="none" stroke="#a7b9cb" stroke-width="2"/>
  <polygon points="382,116 393,109 390,122" fill="#a7b9cb"/>
  <path d="M334 164 H387" fill="none" stroke="#a7b9cb" stroke-width="2"/>
  <polygon points="382,159 393,164 382,169" fill="#a7b9cb"/>
  <path d="M334 185 H361 Q370 185 376 194 L388 212" fill="none" stroke="#a7b9cb" stroke-width="2"/>
  <polygon points="390,206 393,219 382,212" fill="#a7b9cb"/>

