  <!-- Output insight -->
  <path d="M547 184 H571 Q579 184 579 175 V163" fill="none" stroke="#8eb7aa" stroke-width="2"/>
  <polygon points="574,166 579,154 584,166" fill="#8eb7aa"/>
  <g filter="url(#softShadow)">
    <rect x="565" y="94" width="54" height="61" rx="16" fill="#ffffff"/>
    <path d="M583 116c0-6 5-10 10-10s10 4 10 10c0 5-4 7-6 10v4h-8v-4c-2-3-6-5-6-10z" fill="#ddefa9"/>
    <path d="M589 136h8M591 140h4" stroke="#72914d" stroke-width="2" stroke-linecap="round"/>
    <text x="592" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b7180">Uyum</text>
  </g>

  <text x="28" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718498">En iyi seçim: hedefe uygun sürdürülebilir platform</text>
</svg>