<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkezi akış: Soldan sağa ana süreç -->
  <!-- Başlangıç: Problem -->
  <rect x="20" y="130" width="100" height="60" rx="10" fill="#e8f0fe" stroke="#4a7edb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="155" text-anchor="middle" fill="#1a3a6e" font-weight="bold">Problem</text>
  <text x="70" y="172" text-anchor="middle" fill="#3a5a8e">İki Cisim</text>

  <!-- Ok 1 -->
  <polygon points="125,160 140,155 140,165" fill="#4a7edb"/>
  <line x1="120" y1="160" x2="140" y2="160" stroke="#4a7edb" stroke-width="2"/>

  <!-- Model -->
  <rect x="145" y="120" width="110" height="80" rx="10" fill="#d1e7dd" stroke="#2e7d5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="142" text-anchor="middle" fill="#1a4a3a" font-weight="bold">Model</text>
  <text x="200" y="158" text-anchor="middle" fill="#2a5a4a">ZamanKonumHız</text>
  <text x="200" y="174" text-anchor="middle" fill="#2a5a4a">İvme + Enerji</text>
  <text x="200" y="190" text-anchor="middle" fill="#2a5a4a">(numpy)</text>

  <!-- Ok 2 -->
  <polygon points="260,160 275,155 275,165" fill="#2e7d5e"/>
  <line x1="255" y1="160" x2="275" y2="160" stroke="#2e7d5e" stroke-width="2"/>

  <!-- Sayısal Çözüm -->
  <rect x="280" y="115" width="120" height="90" rx="10" fill="#fde9d9" stroke="#d47a2a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="137" text-anchor="middle" fill="#7a3a0a" font-weight="bold">Sayısal Çözüm</text>
  <text x="340" y="153" text-anchor="middle" fill="#9a5a2a">Euler Metodu</text>
  <text x="340" y="169" text-anchor="middle" fill="#9a5a2a">Adım: dt</text>
  <text x="340" y="185" text-anchor="middle" fill="#9a5a2a">Döngü: t→tSon</text>

  <!-- Ok 3 -->
  <polygon points="405,160 420,155 420,165" fill="#d47a2a"/>
  <line x1="400" y1="160" x2="420" y2="160" stroke="#d47a2a" stroke-width="2"/>

  <!-- Sonuç ve Görselleştirme -->
  <rect x="425" y="120" width="110" height="80" rx="10" fill="#e6d9f0" stroke="#7a4a9e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="142" text-anchor="middle" fill="#3a1a5e" font-weight="bold">Sonuç</text>
  <text x="480" y="158" text-anchor="middle" fill="#5a3a7e">Konum + Hız</text>
  <text x="480" y="174" text-anchor="middle" fill="#5a3a7e">Grafik (matplotlib)</text>

  <!-- Alt akış: Enerji kontrolü -->
  <rect x="145" y="235" width="200" height="55" rx="10" fill="#fff3d6" stroke="#c49a2a" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="245" y="255" text-anchor="middle" fill="#6a4a0a" font-weight="bold">Enerji Korunumu Testi</text>
  <text x="245" y="272" text-anchor="middle" fill="#8a6a2a">Spesifik Enerji Sapması</text>

  <!-- Ok 4: enerji kontrolüne bağlantı -->
  <line x1="340" y1="205" x2="340" y2="230" stroke="#c49a2a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="335,228 340,238 345,228" fill="#c49a2a"/>

  <!-- Üst akış: scipy geçişi -->
  <rect x="280" y="30" width="180" height="55" rx="10" fill="#d4eaf7" stroke="#2a7ab5" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="370" y="50" text-anchor="middle" fill="#0a3a6e" font-weight="bold">İleri Adım: scipy</text>
  <text x="370" y="67" text-anchor="middle" fill="#2a5a8e">Daha geniş matematiksel</text>
  <text x="370" y="80" text-anchor="middle" fill="#2a5a8e">yöntemler</text>

  <!-- Ok 5: scipy'den çözüme -->
  <line x1="370" y1="85" x2="340" y2="112" stroke="#2a7ab5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="335,110 340,120 345,110" fill="#2a7ab5"/>

  <!-- Alt bilgi: numpy vektör işlemleri -->
  <rect x="20" y="235" width="100" height="55" rx="10" fill="#d1e7dd" stroke="#2e7d5e" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="70" y="255" text-anchor="middle" fill="#1a4a3a" font-weight="bold">numpy</text>
  <text x="70" y="272" text-anchor="middle" fill="#2a5a4a">Vektör</text>
  <text x="70" y="285" text-anchor="middle" fill="#2a5a4a">İşlemleri</text>

  <!-- Ok 6: numpy'dan modele -->
  <line x1="120" y1="260" x2="145" y2="200" stroke="#2e7d5e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="140,202 148,195 143,208" fill="#2e7d5e"/>

  <!-- Sağ alt: test ve doğrulama -->
  <rect x="425" y="235" width="110" height="55" rx="10" fill="#f0d0d0" stroke="#b54a4a" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="480" y="255" text-anchor="middle" fill="#6a1a1a" font-weight="bold">Test</text>
  <text x="480" y="272" text-anchor="middle" fill="#8a3a3a">Modül Testi</text>

  <!-- Ok 7: sonuçtan teste -->
  <line x1="480" y1="200" x2="480" y2="230" stroke="#b54a4a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="475,228 480,238 485,228" fill="#b54a4a"/>

  <!-- Başlık -->
  <text x="320" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6e">Bilimsel Programlama: Euler ile İki Cisim Problemi</text>
</svg>