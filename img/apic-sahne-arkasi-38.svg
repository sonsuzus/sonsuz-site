<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="apic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8477c9"/>
      <stop offset="100%" stop-color="#6357a8"/>
    </linearGradient>
    <linearGradient id="cpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ee2d5"/>
      <stop offset="100%" stop-color="#66bfb3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c6e88" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#53677e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="340" cy="158" r="124" fill="#dcecf3" opacity="0.42"/>
  <circle cx="340" cy="158" r="94" fill="#ffffff" opacity="0.38"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#46556d">Çok Çekirdekli Kesme Dağıtımı</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758399">IRQ akışı ve hedef çekirdek seçimi</text>

  <!-- Sources -->
  <g filter="url(#soft)">
    <rect x="28" y="76" width="116" height="45" rx="13" fill="#ffe5b9"/>
    <circle cx="51" cy="98" r="11" fill="#f5a94b"/>
    <path d="M47 98h8M51 94v8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="69" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665039">Fare ve USB</text>
    <text x="69" y="109" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7156">IRQ</text>

    <rect x="28" y="138" width="116" height="45" rx="13" fill="#cdeafa"/>
    <circle cx="51" cy="160" r="11" fill="#4f9bc6"/>
    <path d="M44 162c4-8 10-8 14 0M46 157h10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="69" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e5e70">Ağ kartı</text>
    <text x="69" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#638091">MSI-X</text>

    <rect x="28" y="200" width="116" height="45" rx="13" fill="#dbe8c2"/>
    <circle cx="51" cy="222" r="11" fill="#87ad56"/>
    <path d="M46 219h10v7H46zM49 216v3M53 216v3" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <text x="69" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#52683b">Disk ve sayaç</text>
    <text x="69" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74875d">Olaylar</text>
  </g>

  <!-- input lines -->
  <path d="M144 98H185" stroke="#cf9c55" stroke-width="2.5" fill="none"/>
  <polygon points="185,98 177,93 177,103" fill="#cf9c55"/>
  <path d="M144 160H185" stroke="#619bbd" stroke-width="2.5" fill="none"/>
  <polygon points="185,160 177,155 177,165" fill="#619bbd"/>
  <path d="M144 222H185" stroke="#8da35f" stroke-width="2.5" fill="none"/>
  <polygon points="185,222 177,217 177,227" fill="#8da35f"/>

  <!-- IOMMU -->
  <g filter="url(#soft)">
    <rect x="185" y="126" width="91" height="66" rx="16" fill="#e3dafa"/>
    <path d="M208 151l7-7 7 7-7 7z" fill="none" stroke="#7968b1" stroke-width="2"/>
    <path d="M220 160h22" stroke="#7968b1" stroke-width="2" stroke-linecap="round"/>
    <text x="231" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#56487d">IOMMU</text>
    <text x="231" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#786c9a">Eşleme</text>
  </g>

  <path d="M276 159H299" stroke="#7c70a7" stroke-width="2.5" fill="none"/>
  <polygon points="299,159 291,154 291,164" fill="#7c70a7"/>

  <!-- APIC central -->
  <g filter="url(#shadow)">
    <rect x="299" y="105" width="117" height="108" rx="22" fill="url(#apic)"/>
    <circle cx="357" cy="138" r="19" fill="#ffffff" opacity="0.2"/>
    <path d="M347 138h20M357 128v20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="357" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">I/O APIC</text>
    <text x="357" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eeeaff">Vektör ve hedef</text>
  </g>

  <!-- scheduler note -->
  <g filter="url(#soft)">
    <rect x="294" y="239" width="127" height="42" rx="13" fill="#ffffff"/>
    <text x="357" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c697d">İşletim sistemi</text>
    <text x="357" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8490a1">Yakınlık ve denge</text>
  </g>
  <path d="M357 213V231" stroke="#8090a7" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="357,239 352,231 362,231" fill="#8090a7"/>

  <!-- branches -->
  <path d="M416 136H454V82H478" stroke="#6879a5" stroke-width="2.5" fill="none"/>
  <polygon points="478,82 470,77 470,87" fill="#6879a5"/>
  <path d="M416 159H478" stroke="#6879a5" stroke-width="2.5" fill="none"/>
  <polygon points="478,159 470,154 470,164" fill="#6879a5"/>
  <path d="M416 182H454V236H478" stroke="#6879a5" stroke-width="2.5" fill="none"/>
  <polygon points="478,236 470,231 470,241" fill="#6879a5"/>

  <!-- CPUs -->
  <g filter="url(#soft)">
    <rect x="478" y="54" width="132" height="56" rx="16" fill="url(#cpu)"/>
    <rect x="491" y="67" width="24" height="24" rx="7" fill="#ffffff" opacity="0.45"/>
    <path d="M497 76h12M503 70v12" stroke="#398a82" stroke-width="1.8" stroke-linecap="round"/>
    <text x="529" y="77" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#245d58">Çekirdek 0</text>
    <text x="529" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397771">Yerel APIC</text>

    <rect x="478" y="131" width="132" height="56" rx="16" fill="#bde3ed"/>
    <rect x="491" y="144" width="24" height="24" rx="7" fill="#ffffff" opacity="0.45"/>
    <path d="M497 153h12M503 147v12" stroke="#41869e" stroke-width="1.8" stroke-linecap="round"/>
    <text x="529" y="154" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#285d70">Çekirdek 2</text>
    <text x="529" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47798a">Yerel APIC</text>

    <rect x="478" y="208" width="132" height="56" rx="16" fill="#d7e7b8"/>
    <rect x="491" y="221" width="24" height="24" rx="7" fill="#ffffff" opacity="0.45"/>
    <path d="M497 230h12M503 224v12" stroke="#73934d" stroke-width="1.8" stroke-linecap="round"/>
    <text x="529" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6834">Çekirdek 3</text>
    <text x="529" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708553">Yerel APIC</text>
  </g>

  <text x="448" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c7890">Hedef seçimi</text>
  <text x="438" y="297" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718097">Dengeli yük • düşük gecikme • önbellek yakınlığı</text>
</svg>