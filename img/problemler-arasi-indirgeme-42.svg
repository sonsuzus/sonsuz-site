<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="donusum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9c9fb"/>
      <stop offset="100%" stop-color="#c4b0ef"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#60708c" flood-opacity="0.20"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#60708c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="70" cy="48" r="74" fill="#dcecfb" opacity="0.48"/>
  <circle cx="583" cy="275" r="92" fill="#dff0d9" opacity="0.52"/>
  <circle cx="494" cy="46" r="38" fill="#f9e8c9" opacity="0.55"/>

  <text x="320" y="33" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f526a">Problemler Arası İndirgeme</text>
  <text x="320" y="51" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e7f92">A problemini tanıdık B problemine dönüştür</text>

  <g filter="url(#golge)">
    <rect x="40" y="93" width="164" height="142" rx="22" fill="#d9edff"/>
    <rect x="48" y="101" width="148" height="126" rx="17" fill="#eef8ff" opacity="0.84"/>
  </g>
  <circle cx="72" cy="122" r="17" fill="#7eb8df"/>
  <path d="M65 122h14M72 115v14" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="101" y="120" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#30516c">Kaynak Problem</text>
  <text x="101" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54738c">A ve girdi x</text>
  <rect x="61" y="163" width="122" height="42" rx="12" fill="#ffffff" opacity="0.84"/>
  <text x="122" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405b71">Zor soru</text>
  <text x="122" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718496">x ∈ A ?</text>

  <path d="M207 164 C226 164 231 164 245 164" fill="none" stroke="#7991a4" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="245,158 256,164 245,170" fill="#7991a4"/>

  <g filter="url(#golge)">
    <rect x="256" y="78" width="128" height="176" rx="28" fill="url(#donusum)"/>
    <rect x="266" y="88" width="108" height="156" rx="22" fill="#f5f0ff" opacity="0.55"/>
  </g>
  <circle cx="320" cy="117" r="26" fill="#8d75c7"/>
  <path d="M309 111h13l-4-5M331 123h-13l4 5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#493c6c">Dönüşüm f(x)</text>
  <text x="320" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665783">Polinom zaman</text>
  <rect x="278" y="197" width="84" height="29" rx="10" fill="#ffffff" opacity="0.72"/>
  <text x="320" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d4d7c">Yeni biçim</text>

  <path d="M386 164 C405 164 411 164 425 164" fill="none" stroke="#7991a4" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="425,158 436,164 425,170" fill="#7991a4"/>

  <g filter="url(#golge)">
    <rect x="436" y="93" width="164" height="142" rx="22" fill="#dcefd7"/>
    <rect x="444" y="101" width="148" height="126" rx="17" fill="#f3fbef" opacity="0.84"/>
  </g>
  <circle cx="468" cy="122" r="17" fill="#79ae79"/>
  <path d="M460 122l5 5 11-12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="496" y="120" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6645">Hedef Problem</text>
  <text x="496" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597b5d">B üzerinde çözüm</text>
  <rect x="457" y="163" width="122" height="42" rx="12" fill="#ffffff" opacity="0.84"/>
  <text x="518" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45664b">Bilinen yöntem</text>
  <text x="518" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718b70">f(x) ∈ B ?</text>

  <path d="M518 238v25H122v-25" fill="none" stroke="#8b9cab" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="116,245 122,234 128,245" fill="#8b9cab"/>
  <rect x="203" y="271" width="234" height="29" rx="14" fill="#ffffff" opacity="0.72" filter="url(#hafifGolge)"/>
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#546879">Cevap korunur: x ∈ A ⇔ f(x) ∈ B</text>
</svg>