<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="lb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#c8e4f5"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3f7e9"/>
      <stop offset="100%" stop-color="#ccebd8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6b8793" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#607d8b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="67" cy="52" r="55" fill="#dff1fc" opacity="0.55"/>
  <circle cx="580" cy="285" r="86" fill="#e0f3d8" opacity="0.48"/>

  <text x="28" y="28" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46616d" font-weight="600">Ölçeklenebilir web mimarisi</text>

  <!-- Internet -->
  <g filter="url(#shadow)">
    <rect x="28" y="112" width="105" height="90" rx="19" fill="#ffffff"/>
    <circle cx="80" cy="145" r="20" fill="#d9effa" stroke="#78afc7" stroke-width="1.4"/>
    <path d="M60 145h40M80 125c-7 7-7 33 0 40M80 125c7 7 7 33 0 40M63 137h34M63 153h34" fill="none" stroke="#4583a0" stroke-width="1.3" stroke-linecap="round"/>
    <text x="80" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315568" font-weight="600">İnternet</text>
  </g>

  <!-- ingress -->
  <path d="M143 157 H184" fill="none" stroke="#5c879b" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="184,157 176,152 176,162" fill="#5c879b"/>
  <text x="163" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527080">HTTPS · 443</text>

  <!-- Public subnet -->
  <rect x="192" y="76" width="164" height="166" rx="22" fill="#eaf5ff" opacity="0.72" stroke="#b7d8eb" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="208" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56809a" font-weight="600">Genel alt ağ</text>

  <!-- Load balancer -->
  <g filter="url(#shadow)">
    <rect x="216" y="116" width="116" height="89" rx="17" fill="url(#lb)" stroke="#8bbad1" stroke-width="1.2"/>
    <rect x="238" y="130" width="72" height="17" rx="8" fill="#ffffff" opacity="0.82"/>
    <text x="274" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#32627d" font-weight="600">OCI</text>
    <path d="M241 163h65M241 176h65M252 156v27M274 156v27M296 156v27" fill="none" stroke="#4f91af" stroke-width="2" stroke-linecap="round"/>
    <text x="274" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315d75" font-weight="600">Yük dengeleyici</text>
  </g>

  <!-- Private subnet -->
  <rect x="382" y="48" width="231" height="210" rx="22" fill="#eff9ed" opacity="0.84" stroke="#b8dab9" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="399" y="73" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547d5d" font-weight="600">Özel alt ağ · Backend Set</text>

  <!-- Branch lines -->
  <path d="M342 160 H369 V107 H406" fill="none" stroke="#609175" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="406,107 398,102 398,112" fill="#609175"/>
  <path d="M342 160 H406" fill="none" stroke="#609175" stroke-width="2" stroke-linecap="round"/>
  <polygon points="406,160 398,155 398,165" fill="#609175"/>
  <path d="M342 160 H369 V213 H406" fill="none" stroke="#609175" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="406,213 398,208 398,218" fill="#609175"/>
  <text x="372" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#507460">Sırayla dağıtım</text>

  <!-- servers -->
  <g filter="url(#softShadow)">
    <rect x="415" y="84" width="174" height="45" rx="12" fill="url(#server)" stroke="#9cc7a6"/>
    <rect x="428" y="95" width="22" height="23" rx="4" fill="#ffffff" opacity="0.82"/>
    <path d="M433 101h12M433 107h12M433 113h7" stroke="#5b9b6c" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="564" cy="98" r="6" fill="#69b77c"/>
    <text x="461" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6d49" font-weight="600">Ampere A1 · 01</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="415" y="137" width="174" height="45" rx="12" fill="url(#server)" stroke="#9cc7a6"/>
    <rect x="428" y="148" width="22" height="23" rx="4" fill="#ffffff" opacity="0.82"/>
    <path d="M433 154h12M433 160h12M433 166h7" stroke="#5b9b6c" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="564" cy="151" r="6" fill="#69b77c"/>
    <text x="461" y="161" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6d49" font-weight="600">Ampere A1 · 02</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="415" y="190" width="174" height="45" rx="12" fill="url(#server)" stroke="#9cc7a6"/>
    <rect x="428" y="201" width="22" height="23" rx="4" fill="#ffffff" opacity="0.82"/>
    <path d="M433 207h12M433 213h12M433 219h7" stroke="#5b9b6c" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="564" cy="204" r="6" fill="#69b77c"/>
    <text x="461" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6d49" font-weight="600">Ampere A1 · 03</text>
  </g>

  <!-- Health line -->
  <path d="M274 214 V270 H476" fill="none" stroke="#9b7ab0" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="476,270 468,265 468,275" fill="#9b7ab0"/>
  <g filter="url(#softShadow)">
    <rect x="482" y="248" width="113" height="45" rx="13" fill="#f2eafa" stroke="#c9addd"/>
    <path d="M497 271l6-7 6 9 7-14 7 12" fill="none" stroke="#8a61a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="548" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#704d86" font-weight="600">Sağlık kontrolü</text>
  </g>

  <text x="276" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617980">TLS sonlandırma · HTTP kontrolü</text>
</svg>