<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="shaderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7569b8"/>
      <stop offset="1" stop-color="#9a80cc"/>
    </linearGradient>
    <linearGradient id="ekranGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18234b"/>
      <stop offset="0.52" stop-color="#342762"/>
      <stop offset="1" stop-color="#166776"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#63718b" flood-opacity="0.22"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#63718b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="572" cy="47" r="74" fill="#cfeee7" opacity="0.38"/>
  <circle cx="74" cy="278" r="92" fill="#dce6ff" opacity="0.38"/>

  <text x="32" y="34" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34445f">Mandelbrot • WebGL Yakınlaştırma Akışı</text>

  <!-- Interaction panel -->
  <rect x="28" y="64" width="145" height="194" rx="18" fill="#ffffff" filter="url(#golge)"/>
  <rect x="28" y="64" width="145" height="38" rx="18" fill="#dcecfb"/>
  <rect x="28" y="84" width="145" height="18" fill="#dcecfb"/>
  <text x="48" y="88" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365675">Etkileşim</text>

  <rect x="44" y="119" width="112" height="40" rx="10" fill="#eef5ff" filter="url(#hafifGolge)"/>
  <circle cx="62" cy="139" r="9" fill="#89b9e6"/>
  <path d="M62 132 L62 146 M55 139 L69 139" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="78" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3b506b">Fare tekeri</text>
  <text x="78" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718298">Yakınlaştır</text>

  <rect x="44" y="174" width="112" height="40" rx="10" fill="#edf8f2" filter="url(#hafifGolge)"/>
  <path d="M54 196 C54 187 68 185 70 193 C72 200 65 204 59 202" fill="none" stroke="#71b99a" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 202 L60 197 L64 201" fill="#71b99a"/>
  <text x="78" y="191" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3b506b">Sürükle</text>
  <text x="78" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718298">Gezinme</text>

  <text x="45" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718298">Merkez ve ölçek</text>

  <!-- arrow 1 -->
  <path d="M180 160 L207 160" fill="none" stroke="#80a0bf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="207,160 199,155 199,165" fill="#80a0bf"/>

  <!-- uniform bridge -->
  <rect x="207" y="117" width="94" height="86" rx="16" fill="#fffdf7" filter="url(#golge)"/>
  <circle cx="230" cy="142" r="12" fill="#f6cf8b"/>
  <path d="M224 142 L236 142 M230 136 L230 148" stroke="#8d6330" stroke-width="1.7" stroke-linecap="round"/>
  <text x="250" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5f5060">Uniform</text>
  <text x="221" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e7180">uCenter</text>
  <text x="221" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e7180">uScale • uMaxIter</text>

  <!-- arrow 2 -->
  <path d="M307 160 L329 160" fill="none" stroke="#80a0bf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="329,160 321,155 321,165" fill="#80a0bf"/>

  <!-- Shader core -->
  <rect x="329" y="64" width="157" height="194" rx="19" fill="url(#shaderGrad)" filter="url(#golge)"/>
  <rect x="344" y="80" width="127" height="34" rx="10" fill="#ffffff" opacity="0.18"/>
  <text x="365" y="102" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Fragment Shader</text>

  <rect x="345" y="127" width="125" height="30" rx="9" fill="#ffffff" opacity="0.13"/>
  <text x="359" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">Piksel → karmaşık düzlem</text>

  <rect x="345" y="166" width="125" height="47" rx="9" fill="#ffffff" opacity="0.15"/>
  <text x="358" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">z = z² + c</text>
  <text x="358" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#f0ebff">|z|² &gt; 4 ?</text>

  <text x="353" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eeeaff">Paralel iterasyon</text>

  <!-- arrow 3 -->
  <path d="M493 160 L514 160" fill="none" stroke="#80a0bf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="514,160 506,155 506,165" fill="#80a0bf"/>

  <!-- Render screen -->
  <rect x="514" y="64" width="100" height="194" rx="18" fill="#ffffff" filter="url(#golge)"/>
  <rect x="525" y="80" width="78" height="125" rx="10" fill="url(#ekranGrad)"/>
  <path d="M528 142 C539 121 555 123 557 142 C559 158 543 163 540 149 C537 136 551 131 566 138 C582 145 591 130 599 108" fill="none" stroke="#ffce71" stroke-width="2.2"/>
  <path d="M528 150 C543 171 559 174 568 159 C575 147 564 141 558 150 C552 159 571 183 594 178" fill="none" stroke="#69d9d1" stroke-width="2"/>
  <path d="M532 132 C539 134 543 141 540 147 C537 153 530 150 532 145 C534 140 544 143 549 151" fill="none" stroke="#f78cb8" stroke-width="1.8"/>
  <circle cx="565" cy="147" r="19" fill="none" stroke="#b192ff" stroke-width="1.4" opacity="0.8"/>
  <circle cx="565" cy="147" r="11" fill="none" stroke="#ffce71" stroke-width="1.4" opacity="0.85"/>
  <circle cx="565" cy="147" r="4" fill="#111936"/>
  <path d="M579 128 L591 116" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
  <text x="532" y="226" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39506c">GPU Çıktısı</text>
  <text x="531" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718298">Fraktal renkler</text>

  <!-- zoom indicator -->
  <path d="M554 278 C574 274 590 264 596 248" fill="none" stroke="#75ae9d" stroke-width="1.8" stroke-dasharray="4 4"/>
  <polygon points="596,248 588,252 596,257" fill="#75ae9d"/>
  <text x="365" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52756c">Zoom arttıkça iterasyon artar</text>
</svg>