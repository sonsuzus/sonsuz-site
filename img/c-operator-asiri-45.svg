<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f4e5"/>
      <stop offset="100%" stop-color="#c7ecdb"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe1df"/>
      <stop offset="100%" stop-color="#ffd1ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7890a5" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7890a5" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="47" r="54" fill="#dceeff" opacity="0.48"/>
  <circle cx="588" cy="272" r="67" fill="#dbf2e0" opacity="0.55"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">Operatör Sözleşmesi</text>

  <g filter="url(#shadow)">
    <rect x="225" y="48" width="190" height="74" rx="20" fill="#e5efff" stroke="#aec8e7"/>
  </g>
  <circle cx="260" cy="85" r="20" fill="#7da7d9"/>
  <text x="260" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">==</text>
  <text x="286" y="78" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34516f">Eşitlik kuralı</text>
  <text x="286" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52708a">Tek anlam, iki yön</text>

  <path d="M224 86 H174" fill="none" stroke="#bd6970" stroke-width="2.2"/>
  <polygon points="174,86 183,81 183,91" fill="#bd6970"/>
  <path d="M416 86 H466" fill="none" stroke="#57967d" stroke-width="2.2"/>
  <polygon points="466,86 457,81 457,91" fill="#57967d"/>

  <g filter="url(#shadow)">
    <rect x="31" y="137" width="202" height="124" rx="18" fill="url(#risk)" stroke="#efaaa6"/>
  </g>
  <rect x="51" y="155" width="162" height="25" rx="10" fill="#fff5f4"/>
  <text x="132" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a64f57">Tutarsız Tasarım</text>

  <circle cx="67" cy="204" r="14" fill="#d87075"/>
  <text x="67" y="209" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#fff">==</text>
  <text x="91" y="209" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#704c55">normalleştir</text>

  <circle cx="67" cy="237" r="14" fill="#c75d63"/>
  <text x="67" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#fff">!=</text>
  <text x="91" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#704c55">ham değer</text>

  <path d="M160 202 C186 202 187 230 160 232" fill="none" stroke="#c55d64" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="160,232 168,227 167,236" fill="#c55d64"/>

  <g filter="url(#shadow)">
    <rect x="407" y="137" width="202" height="124" rx="18" fill="url(#safe)" stroke="#9ed4b7"/>
  </g>
  <rect x="427" y="155" width="162" height="25" rx="10" fill="#f5fffa"/>
  <text x="508" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34735d">Sağlam Tasarım</text>

  <circle cx="443" cy="214" r="18" fill="#5daa87"/>
  <text x="443" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#fff">==</text>
  <text x="470" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#346653">Tek kaynak</text>
  <text x="470" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7665">normalizasyon</text>

  <path d="M443 237 V249 H537" fill="none" stroke="#54947a" stroke-width="2"/>
  <polygon points="537,249 528,244 528,254" fill="#54947a"/>
  <rect x="539" y="237" width="48" height="24" rx="9" fill="#e9faf0" stroke="#8cc8a7"/>
  <text x="563" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37745c">!= !==</text>

  <g filter="url(#softShadow)">
    <rect x="173" y="276" width="294" height="28" rx="14" fill="#ffffff" stroke="#c9dbe3"/>
  </g>
  <circle cx="192" cy="290" r="7" fill="#8aaed1"/>
  <path d="M189 290 L191 293 L196 287" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="207" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466178">a == b</text>
  <text x="260" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b91a1">↔</text>
  <text x="279" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466178">b == a</text>
  <line x1="340" y1="283" x2="340" y2="297" stroke="#cad8df"/>
  <text x="354" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466178">!=</text>
  <text x="376" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b91a1">=</text>
  <text x="390" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466178">!(==)</text>
</svg>