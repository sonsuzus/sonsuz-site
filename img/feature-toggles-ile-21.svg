<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#c9e1f8"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddf4df"/>
      <stop offset="100%" stop-color="#c8eacb"/>
    </linearGradient>
    <linearGradient id="flagCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3cc"/>
      <stop offset="100%" stop-color="#ffe3a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#56708d" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#56708d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="594" cy="35" r="76" fill="#dff3ee" opacity="0.55"/>
  <circle cx="55" cy="300" r="96" fill="#e3edff" opacity="0.55"/>

  <text x="30" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536b">Güvenli dağıtım ve kontrollü yayınlama</text>
  <line x1="30" y1="42" x2="610" y2="42" stroke="#c9d9df" stroke-width="1"/>

  <!-- Deployment -->
  <g filter="url(#shadow)">
    <rect x="30" y="83" width="118" height="112" rx="18" fill="#ffffff"/>
    <rect x="42" y="96" width="94" height="41" rx="11" fill="#e7edfa"/>
    <path d="M60 116 L70 106 L80 116 L70 126 Z" fill="#6688b8"/>
    <path d="M86 107 L112 107 M86 116 L112 116 M86 125 L104 125" stroke="#6688b8" stroke-width="3" stroke-linecap="round"/>
    <text x="89" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536b">Kod dağıtımı</text>
    <text x="89" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718198">Üretime hazır</text>
  </g>

  <!-- arrow deployment to environments -->
  <path d="M148 139 H174 V112 H193" fill="none" stroke="#7891a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="193,107 202,112 193,117" fill="#7891a6"/>
  <path d="M174 139 V181 H193" fill="none" stroke="#7891a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="193,176 202,181 193,186" fill="#7891a6"/>

  <!-- Blue Green -->
  <g filter="url(#smallShadow)">
    <rect x="202" y="74" width="117" height="75" rx="16" fill="url(#blueCard)"/>
    <circle cx="224" cy="98" r="12" fill="#78a9df"/>
    <path d="M218 98 H230 M224 92 V104" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="262" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b82">Mavi ortam</text>
    <text x="262" y="123" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52799b">Eski sürüm</text>
  </g>
  <g filter="url(#smallShadow)">
    <rect x="202" y="154" width="117" height="75" rx="16" fill="url(#greenCard)"/>
    <circle cx="224" cy="178" r="12" fill="#70b883"/>
    <path d="M218 178 H230 M224 172 V184" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="262" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39744a">Yeşil ortam</text>
    <text x="262" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a8965">Yeni kod</text>
  </g>

  <!-- merge arrow -->
  <path d="M319 112 H337 V151 H354" fill="none" stroke="#7891a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M319 191 H337 V151" fill="none" stroke="#7891a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="354,146 363,151 354,156" fill="#7891a6"/>

  <!-- Flag service -->
  <g filter="url(#shadow)">
    <rect x="363" y="94" width="135" height="115" rx="20" fill="url(#flagCard)"/>
    <rect x="386" y="111" width="89" height="31" rx="9" fill="#fffaf0" opacity="0.8"/>
    <path d="M402 132 V118 M402 119 H422 L417 125 L422 131 H402" fill="none" stroke="#c38531" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="430" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8b5c20">Özellik bayrağı</text>
    <text x="430" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#967141">Açık veya kapalı</text>
  </g>

  <!-- service to rollout -->
  <path d="M498 151 H522" fill="none" stroke="#7891a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="522,146 531,151 522,156" fill="#7891a6"/>

  <!-- rollout / users -->
  <g filter="url(#shadow)">
    <rect x="531" y="70" width="79" height="164" rx="20" fill="#ffffff"/>
    <text x="570" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536b">Kademeli açılım</text>

    <rect x="545" y="108" width="50" height="20" rx="10" fill="#e6f0ff"/>
    <circle cx="556" cy="118" r="4" fill="#719bd0"/>
    <text x="578" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466d99">%5</text>

    <rect x="545" y="137" width="50" height="20" rx="10" fill="#e5f5e7"/>
    <circle cx="556" cy="147" r="4" fill="#70af7b"/>
    <text x="578" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477d51">%25</text>

    <rect x="545" y="166" width="50" height="20" rx="10" fill="#fff0cf"/>
    <circle cx="556" cy="176" r="4" fill="#d49a40"/>
    <text x="578" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#906522">%100</text>

    <path d="M548 207 H592" stroke="#d8e3e7" stroke-width="1.5"/>
    <text x="570" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718198">İzleme</text>
  </g>

  <!-- feedback -->
  <path d="M570 234 V270 H430 V222" fill="none" stroke="#9aaeb1" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="425,222 435,222 430,213" fill="#9aaeb1"/>
  <g filter="url(#smallShadow)">
    <rect x="262" y="252" width="154" height="38" rx="13" fill="#f2e6ef"/>
    <path d="M280 271 C280 264 290 264 290 271 C290 278 280 278 280 271 Z" fill="none" stroke="#ad6f9f" stroke-width="2"/>
    <text x="348" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#73516e">Hata ve gecikme izle</text>
  </g>

  <!-- rollback link -->
  <path d="M363 204 C342 230 326 241 307 251" fill="none" stroke="#b48379" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <polygon points="304,245 298,255 309,254" fill="#b48379"/>
  <text x="203" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b6460">Sorunda: bayrağı kapat</text>
</svg>