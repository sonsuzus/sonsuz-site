  </g>
  <text x="508" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#925b37">Tekrar eden</text>
  <text x="514" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#925b37">Küçük grafik</text>
  <path d="M540 161 L540 172" stroke="#ca956c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="534,170 546,170 540,178" fill="#ca956c"/>

  <rect x="216" y="278" width="395" height="25" rx="12.5" fill="#ffffff" opacity="0.72"/>
  <text x="243" y="295" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476575">Basamak seç → durumu güncelle → sonucu sakla → say</text>
