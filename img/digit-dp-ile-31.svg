  <text x="349" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39715e">tight</text>
  <text x="343" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b7e70">sınır</text>
  <text x="302" y="215" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39715e">state</text>
  <text x="295" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b7e70">toplam</text>

