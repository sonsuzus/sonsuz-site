  <polygon points="326,137 334,142 326,147" fill="#69a989"/>
  <path d="M355 167 C354 180 343 187 329 193" fill="none" stroke="#69a989" stroke-width="2" stroke-linecap="round"/>
  <polygon points="326,187 336,190 329,198" fill="#69a989"/>
  <path d="M286 196 C270 187 260 178 266 168" fill="none" stroke="#69a989" stroke-width="2" stroke-linecap="round"/>
  <polygon points="260,171 264,161 270,171" fill="#69a989"/>

