<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2faef"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f0ff"/>
      <stop offset="100%" stop-color="#cfe5fb"/>
    </linearGradient>
    <linearGradient id="mintCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2f8ed"/>
      <stop offset="100%" stop-color="#c9eedc"/>
    </linearGradient>
    <linearGradient id="peachCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0df"/>
      <stop offset="100%" stop-color="#f9dcb9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6d8494" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6d8494" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="62" cy="34" r="72" fill="#cce9f4" opacity="0.25"/>
  <circle cx="587" cy="292" r="96" fill="#d9efc9" opacity="0.3"/>
  <path d="M18 270 C128 245 168 295 277 271 S469 238 622 268" fill="none" stroke="#b8dbea" stroke-width="2" opacity="0.42"/>

