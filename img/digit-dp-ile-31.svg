  <path d="M100 165 L100 178" stroke="#6a9fbd" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="94,176 106,176 100,184" fill="#6a9fbd"/>
  <rect x="45" y="190" width="111" height="38" rx="10" fill="#ffffff" opacity="0.9"/>
  <text x="60" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315c77">F(R) − F(L−1)</text>

  <path d="M176 165 L205 165" stroke="#679bb8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="202,159 214,165 202,171" fill="#679bb8"/>

