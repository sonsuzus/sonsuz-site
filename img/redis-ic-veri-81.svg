<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8585"/>
      <stop offset="100%" stop-color="#d94e5d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#59708a" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#59708a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="#dcecf0" opacity="0.35"/>
  <circle cx="320" cy="160" r="82" fill="#ffffff" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#456075">Redis veri tipi seçimi</text>
  <text x="612" y="31" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718697">Doğru yapı • Hızlı erişim</text>

  <!-- bağlantılar -->
  <path d="M286 137 L192 89" fill="none" stroke="#93adbb" stroke-width="2"/>
  <polygon points="192,89 201,89 197,97" fill="#93adbb"/>
  <path d="M354 137 L448 89" fill="none" stroke="#93adbb" stroke-width="2"/>
  <polygon points="448,89 439,89 443,97" fill="#93adbb"/>
  <path d="M280 167 L187 192" fill="none" stroke="#93adbb" stroke-width="2"/>
  <polygon points="187,192 195,185 197,195" fill="#93adbb"/>
  <path d="M360 167 L453 192" fill="none" stroke="#93adbb" stroke-width="2"/>
  <polygon points="453,192 443,195 445,185" fill="#93adbb"/>
  <path d="M320 197 L320 246" fill="none" stroke="#93adbb" stroke-width="2"/>
  <polygon points="320,246 315,237 325,237" fill="#93adbb"/>

  <!-- üst sol String -->
  <g filter="url(#smallShadow)">
    <rect x="54" y="52" width="142" height="72" rx="16" fill="#fff1d8"/>
    <rect x="66" y="65" width="34" height="34" rx="10" fill="#f7bf67"/>
    <text x="83" y="87" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#825516">Aa</text>
    <text x="112" y="77" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6a5226">String</text>
    <text x="112" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6a4a">Sayaç • Oturum</text>
    <rect x="112" y="104" width="48" height="14" rx="7" fill="#ffe0a4"/>
    <text x="136" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8b621c">O(1)</text>
  </g>

  <!-- üst sağ Hash -->
  <g filter="url(#smallShadow)">
    <rect x="444" y="52" width="142" height="72" rx="16" fill="#e7f4ff"/>
    <rect x="456" y="65" width="34" height="34" rx="10" fill="#80bce5"/>
    <rect x="463" y="72" width="8" height="5" rx="1" fill="#ffffff"/>
    <rect x="475" y="72" width="8" height="5" rx="1" fill="#ffffff"/>
    <rect x="463" y="81" width="8" height="5" rx="1" fill="#ffffff"/>
    <rect x="475" y="81" width="8" height="5" rx="1" fill="#ffffff"/>
    <text x="502" y="77" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315c79">Hash</text>
    <text x="502" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52748a">Nesne alanları</text>
    <rect x="502" y="104" width="48" height="14" rx="7" fill="#cceaff"/>
    <text x="526" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#32709b">O(1)</text>
  </g>

  <!-- alt sol List -->
  <g filter="url(#smallShadow)">
    <rect x="42" y="166" width="145" height="72" rx="16" fill="#eee9ff"/>
    <rect x="54" y="179" width="34" height="34" rx="10" fill="#a99ae9"/>
    <path d="M62 188 L78 188 M62 195 L78 195 M62 202 L73 202" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="100" y="191" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#554883">List</text>
    <text x="100" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#716a92">Kuyruk • Olaylar</text>
    <rect x="100" y="218" width="65" height="14" rx="7" fill="#dcd3ff"/>
    <text x="132" y="229" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6656a5">Uçta O(1)</text>
  </g>

  <!-- alt sağ Set -->
  <g filter="url(#smallShadow)">
    <rect x="453" y="166" width="145" height="72" rx="16" fill="#e4f8ee"/>
    <rect x="465" y="179" width="34" height="34" rx="10" fill="#78c89e"/>
    <circle cx="474" cy="190" r="4" fill="#ffffff"/>
    <circle cx="488" cy="190" r="4" fill="#ffffff"/>
    <circle cx="481" cy="202" r="4" fill="#ffffff"/>
    <text x="511" y="191" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f7457">Set</text>
    <text x="511" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8570">Benzersiz üyelik</text>
    <rect x="511" y="218" width="48" height="14" rx="7" fill="#c9efd9"/>
    <text x="535" y="229" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39805a">O(1)</text>
  </g>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <rect x="266" y="119" width="108" height="80" rx="22" fill="url(#core)"/>
    <rect x="283" y="134" width="74" height="20" rx="10" fill="#ffffff" opacity="0.22"/>
    <text x="320" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Redis</text>
    <text x="320" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff4f4">Anahtar</text>
    <text x="320" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff4f4">ve değer</text>
  </g>

  <!-- alt Sorted Set -->
  <g filter="url(#smallShadow)">
    <rect x="232" y="246" width="176" height="58" rx="16" fill="#ffe9ee"/>
    <rect x="245" y="258" width="34" height="34" rx="10" fill="#e8899b"/>
    <path d="M253 282 L259 274 L264 278 L272 267" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="291" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8b4053">Sıralı Set</text>
    <text x="291" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#946775">Skor • Liderlik</text>
    <rect x="350" y="270" width="47" height="15" rx="7.5" fill="#ffcbd6"/>
    <text x="373.5" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a44158">O(log n)</text>
  </g>
</svg>