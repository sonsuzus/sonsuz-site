<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="forward" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9def8"/>
    </linearGradient>
    <linearGradient id="filter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0bd"/>
      <stop offset="100%" stop-color="#f6d58f"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff5e5"/>
      <stop offset="100%" stop-color="#bde6ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a0" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="45" r="78" fill="#dceeff" opacity="0.45"/>
  <circle cx="577" cy="274" r="104" fill="#dff3dc" opacity="0.52"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385168">Möbius Dönüşümü</text>
  <text x="320" y="47" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647989">Bölen toplamından özgün fonksiyona</text>

  <path d="M185 126 H239" fill="none" stroke="#7899b5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="239,126 230,121 230,131" fill="#7899b5"/>
  <path d="M401 126 H455" fill="none" stroke="#7899b5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="455,126 446,121 446,131" fill="#7899b5"/>

  <rect x="42" y="82" width="143" height="88" rx="18" fill="url(#forward)" filter="url(#shadow)"/>
  <text x="113.5" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294966">İleri dönüşüm</text>
  <rect x="58" y="119" width="111" height="32" rx="10" fill="#fafdff" opacity="0.82"/>
  <text x="113.5" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39586f">g(n) = Σ f(d)</text>
  <text x="113.5" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60798c">tüm bölenler</text>

  <rect x="239" y="68" width="162" height="116" rx="25" fill="url(#filter)" filter="url(#shadow)"/>
  <circle cx="320" cy="108" r="27" fill="#fff9e8" filter="url(#softShadow)"/>
  <text x="320" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a6922">μ</text>
  <text x="320" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#705020">Möbius filtresi</text>
  <text x="320" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6b40">işaretle ve ele</text>

  <rect x="455" y="82" width="143" height="88" rx="18" fill="url(#output)" filter="url(#shadow)"/>
  <text x="526.5" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#2f6651">Ters dönüşüm</text>
  <rect x="471" y="119" width="111" height="32" rx="10" fill="#fbfffc" opacity="0.85"/>
  <text x="526.5" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34634f">f(n) = Σ μ(d)g(n/d)</text>
  <text x="526.5" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e8170">özgün değer</text>

  <path d="M320 190 V210" fill="none" stroke="#c0984f" stroke-width="2" stroke-linecap="round"/>
  <polygon points="320,216 315,207 325,207" fill="#c0984f"/>

  <rect x="78" y="220" width="484" height="73" rx="18" fill="#ffffff" opacity="0.9" filter="url(#softShadow)"/>
  <text x="101" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#516b7b">μ kuralları</text>

  <rect x="187" y="232" width="96" height="39" rx="11" fill="#e3f0ff"/>
  <text x="235" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#385d7c">n = 1</text>
  <text x="235" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385d7c">+1</text>

  <rect x="296" y="232" width="112" height="39" rx="11" fill="#ffe5e1"/>
  <text x="352" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#87544e">asal kare</text>
  <text x="352" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#87544e">0</text>

  <rect x="421" y="232" width="119" height="39" rx="11" fill="#e1f4e8"/>
  <text x="480.5" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426d59">farklı asallar</text>
  <text x="480.5" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426d59">±1</text>

  <path d="M156 251 H177" fill="none" stroke="#9ab0bf" stroke-width="1.5"/>
  <path d="M284 251 H289" fill="none" stroke="#9ab0bf" stroke-width="1.5"/>
  <path d="M409 251 H414" fill="none" stroke="#9ab0bf" stroke-width="1.5"/>
</svg>