<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8daff2"/>
      <stop offset="100%" stop-color="#667ed6"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8ddc5"/>
      <stop offset="100%" stop-color="#68b898"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#59708b" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#59708b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="316" cy="161" r="128" fill="#dceafb" opacity="0.36"/>
  <circle cx="317" cy="161" r="98" fill="none" stroke="#a9c6df" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.7"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29455d">
    <!-- Sol girişler -->
    <g filter="url(#smallShadow)">
      <rect x="24" y="58" width="132" height="56" rx="15" fill="#fff8e5"/>
      <rect x="24" y="58" width="6" height="56" rx="3" fill="#efbd5a"/>
      <text x="44" y="82" font-weight="700">Maske</text>
      <text x="44" y="101" fill="#687887">?u ?l ?l ?l ?d ?d</text>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="24" y="143" width="132" height="56" rx="15" fill="#f4ecfb"/>
      <rect x="24" y="143" width="6" height="56" rx="3" fill="#aa84cf"/>
      <text x="44" y="167" font-weight="700">Hash modu</text>
      <text x="44" y="186" fill="#687887">Hızlı veya maliyetli</text>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="24" y="228" width="132" height="56" rx="15" fill="#e8f7f4"/>
      <rect x="24" y="228" width="6" height="56" rx="3" fill="#62bba9"/>
      <text x="44" y="252" font-weight="700">Aygıt ayarları</text>
      <text x="44" y="271" fill="#687887">Sürücü · güç · ısı</text>
    </g>

    <!-- Akış çizgileri -->
    <path d="M156 86 H184 Q193 86 193 95 V127 H210" fill="none" stroke="#8ba6bd" stroke-width="2"/>
    <polygon points="210,127 201,122 201,132" fill="#8ba6bd"/>
    <path d="M156 171 H191 Q199 171 199 163 H210" fill="none" stroke="#8ba6bd" stroke-width="2"/>
    <polygon points="210,163 201,158 201,168" fill="#8ba6bd"/>
    <path d="M156 256 H184 Q193 256 193 226 V197 H210" fill="none" stroke="#8ba6bd" stroke-width="2"/>
    <polygon points="210,197 201,192 201,202" fill="#8ba6bd"/>

    <!-- Merkez GPU -->
    <g filter="url(#shadow)">
      <rect x="210" y="92" width="215" height="140" rx="25" fill="url(#gpu)"/>
      <rect x="222" y="104" width="191" height="116" rx="18" fill="#f7fbff" opacity="0.17"/>
      <text x="317" y="123" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">GPU PARALEL MOTOR</text>

      <g fill="#dce8ff">
        <rect x="239" y="143" width="26" height="22" rx="6"/>
        <rect x="273" y="143" width="26" height="22" rx="6"/>
        <rect x="307" y="143" width="26" height="22" rx="6"/>
        <rect x="341" y="143" width="26" height="22" rx="6"/>
        <rect x="375" y="143" width="18" height="22" rx="6"/>
        <rect x="239" y="174" width="26" height="22" rx="6"/>
        <rect x="273" y="174" width="26" height="22" rx="6"/>
        <rect x="307" y="174" width="26" height="22" rx="6"/>
        <rect x="341" y="174" width="26" height="22" rx="6"/>
        <rect x="375" y="174" width="18" height="22" rx="6"/>
      </g>
      <g fill="#7fa2ea">
        <circle cx="252" cy="154" r="4"/>
        <circle cx="286" cy="154" r="4"/>
        <circle cx="320" cy="154" r="4"/>
        <circle cx="354" cy="154" r="4"/>
        <circle cx="384" cy="154" r="4"/>
        <circle cx="252" cy="185" r="4"/>
        <circle cx="286" cy="185" r="4"/>
        <circle cx="320" cy="185" r="4"/>
        <circle cx="354" cy="185" r="4"/>
        <circle cx="384" cy="185" r="4"/>
      </g>
      <text x="317" y="213" text-anchor="middle" fill="#eaf1ff">Binlerce eş zamanlı deneme</text>
    </g>

    <!-- Çıkış paralel -->
    <path d="M425 128 H455" fill="none" stroke="#6f90b0" stroke-width="2"/>
    <polygon points="455,128 446,123 446,133" fill="#6f90b0"/>
    <path d="M425 162 H455" fill="none" stroke="#6f90b0" stroke-width="2"/>
    <polygon points="455,162 446,157 446,167" fill="#6f90b0"/>
    <path d="M425 196 H455" fill="none" stroke="#6f90b0" stroke-width="2"/>
    <polygon points="455,196 446,191 446,201" fill="#6f90b0"/>

    <!-- Sağ sonuç -->
    <g filter="url(#shadow)">
      <rect x="455" y="74" width="161" height="176" rx="22" fill="#ffffff"/>
      <rect x="470" y="89" width="131" height="34" rx="11" fill="#e9f4ff"/>
      <text x="535" y="111" text-anchor="middle" font-weight="700">Hash karşılaştırma</text>

      <path d="M489 143 H550" stroke="#b1c7d9" stroke-width="2"/>
      <path d="M489 159 H570" stroke="#b1c7d9" stroke-width="2"/>
      <path d="M489 175 H542" stroke="#b1c7d9" stroke-width="2"/>

      <rect x="474" y="193" width="126" height="41" rx="12" fill="#e7f6ef"/>
      <path d="M491 211 L500 220 L516 202" fill="none" stroke="#48a880" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="526" y="217" font-weight="700" fill="#347960">Sonuç kontrolü</text>
    </g>

    <!-- Üst açıklama -->
    <g filter="url(#smallShadow)">
      <rect x="244" y="23" width="146" height="42" rx="15" fill="#ffffff"/>
      <text x="317" y="49" text-anchor="middle" font-weight="700">R = deneme hızı</text>
    </g>
    <path d="M317 65 V82" stroke="#91aabf" stroke-width="1.6"/>
    <polygon points="317,92 312,83 322,83" fill="#91aabf"/>

    <!-- Savunma -->
    <g filter="url(#shadow)">
      <rect x="464" y="266" width="152" height="39" rx="15" fill="url(#safe)"/>
      <path d="M482 276 L493 272 L504 276 V285 Q504 293 493 298 Q482 293 482 285 Z" fill="#ffffff" opacity="0.9"/>
      <path d="M488 285 L492 289 L499 280" fill="none" stroke="#55a989" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="550" y="290" text-anchor="middle" fill="#ffffff" font-weight="700">Güçlü savunma</text>
    </g>

    <!-- Alt bilgi -->
    <text x="317" y="278" text-anchor="middle" fill="#61798c">Dar maske → küçük anahtar uzayı</text>
    <text x="317" y="298" text-anchor="middle" fill="#61798c">Argon2id → yüksek maliyet</text>
  </g>
</svg>