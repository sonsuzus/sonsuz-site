    <polygon points="308,148 314,150 312,143" fill="#526fac"/>
    <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40547f">Topic: /cmd_vel</text>
    <text x="320" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66799d">Standart mesaj</text>
  </g>

  <!-- sağ düğümler -->
  <g filter="url(#hafifGolge)">
    <rect x="460" y="82" width="148" height="68" rx="16" fill="#fffdfd"/>
    <rect x="473" y="96" width="35" height="35" rx="11" fill="#eee5fa"/>
    <path d="M482 118 L488 108 L494 118 L500 108" fill="none" stroke="#7b5ca9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5365">Planlama</text>
    <text x="519" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718296">rota ve hız</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="460" y="178" width="148" height="68" rx="16" fill="#fffdf8"/>
    <rect x="473" y="192" width="35" height="35" rx="11" fill="#f9e3d7"/>
    <circle cx="484" cy="210" r="5" fill="none" stroke="#b66d4c" stroke-width="2"/>
    <circle cx="497" cy="210" r="5" fill="none" stroke="#b66d4c" stroke-width="2"/>
    <path d="M489 210 L492 210" stroke="#b66d4c" stroke-width="2"/>
    <text x="519" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5365">Motor</text>
    <text x="519" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718296">tekerlek kontrolü</text>
  </g>

  <!-- alt özellik kartları -->
  <g filter="url(#hafifGolge)">
    <rect x="106" y="269" width="126" height="30" rx="12" fill="#ffffff"/>
    <circle cx="122" cy="284" r="5" fill="#71ad9d"/>
    <text x="134" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#506477">Gevşek bağlı</text>

    <rect x="257" y="269" width="126" height="30" rx="12" fill="#ffffff"/>
    <circle cx="273" cy="284" r="5" fill="#7898d3"/>
    <text x="285" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#506477">DDS keşfi</text>

    <rect x="408" y="269" width="126" height="30" rx="12" fill="#ffffff"/>
    <circle cx="424" cy="284" r="5" fill="#d5926f"/>
    <text x="436" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#506477">QoS ayarları</text>
