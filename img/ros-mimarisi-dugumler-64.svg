    <circle cx="320" cy="137" r="24" fill="#ffffff" opacity="0.82"/>
    <path d="M308 139 C312 130, 323 128, 331 134" fill="none" stroke="#526fac" stroke-width="2.5" stroke-linecap="round"/>
