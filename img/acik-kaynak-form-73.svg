<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfeeff"/>
      <stop offset="100%" stop-color="#d7f3e8"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8195" flood-opacity="0.2"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8195" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="72" cy="52" r="58" fill="#dcefff" opacity="0.5"/>
  <circle cx="584" cy="285" r="75" fill="#dff3dc" opacity="0.48"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">Açık Kaynak Form Sistemleri</text>

  <!-- Bağlantılar -->
  <path d="M194 105 C224 105 231 122 250 137" fill="none" stroke="#9ab2c4" stroke-width="2"/>
  <polygon points="250,137 240,134 244,143" fill="#9ab2c4"/>
  <path d="M194 215 C224 215 231 198 250 183" fill="none" stroke="#9ab2c4" stroke-width="2"/>
  <polygon points="250,183 244,177 240,186" fill="#9ab2c4"/>
  <path d="M390 137 C410 122 417 105 446 105" fill="none" stroke="#9ab2c4" stroke-width="2"/>
  <polygon points="446,105 436,101 439,110" fill="#9ab2c4"/>
  <path d="M390 183 C410 198 417 215 446 215" fill="none" stroke="#9ab2c4" stroke-width="2"/>
  <polygon points="446,215 439,210 436,219" fill="#9ab2c4"/>

  <!-- Sol üst: Şema -->
  <g filter="url(#hafifGolge)">
    <rect x="48" y="65" width="146" height="80" rx="18" fill="#fff5dd"/>
    <rect x="63" y="80" width="29" height="29" rx="9" fill="#f6c96c"/>
    <path d="M71 89 H85 M71 95 H83 M71 101 H80" stroke="#8b6423" stroke-width="1.7" stroke-linecap="round"/>
    <text x="103" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#715526">Form Şeması</text>
    <text x="103" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7250">Sorular ve kurallar</text>
    <circle cx="72" cy="126" r="4" fill="#f0b848"/>
    <rect x="81" y="122" width="57" height="7" rx="3.5" fill="#efdca9"/>
  </g>

  <!-- Sol alt: Yanıt -->
  <g filter="url(#hafifGolge)">
    <rect x="48" y="175" width="146" height="80" rx="18" fill="#e8e4fb"/>
    <rect x="63" y="190" width="29" height="29" rx="9" fill="#a997e8"/>
    <path d="M70 198 H85 M70 204 H82 M70 210 H79" stroke="#514483" stroke-width="1.7" stroke-linecap="round"/>
    <text x="103" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#554783">Yanıt Arayüzü</text>
    <text x="103" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#766b96">Akış ve deneyim</text>
    <circle cx="72" cy="236" r="4" fill="#9985df"/>
    <rect x="81" y="232" width="57" height="7" rx="3.5" fill="#d1c8f2"/>
  </g>

  <!-- Merkez -->
  <g filter="url(#golge)">
    <rect x="250" y="104" width="140" height="112" rx="28" fill="url(#merkez)" stroke="#b7d5d3" stroke-width="1.2"/>
    <circle cx="320" cy="141" r="22" fill="#fff" opacity="0.85"/>
    <path d="M308 142 C308 134 314 129 320 129 C326 129 332 134 332 142 C332 150 326 155 320 155 C314 155 308 150 308 142Z" fill="#62aa9d"/>
    <path d="M315 142 L319 146 L326 137" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356d67">Açık Kaynak</text>
    <text x="320" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527f79">Veri sahipliği</text>
  </g>

  <!-- Sağ üst: Saklama -->
  <g filter="url(#hafifGolge)">
    <rect x="446" y="65" width="146" height="80" rx="18" fill="#dff3ec"/>
    <rect x="461" y="80" width="29" height="29" rx="9" fill="#72c4aa"/>
    <ellipse cx="475.5" cy="89" rx="8" ry="3.5" fill="none" stroke="#286e5c" stroke-width="1.5"/>
    <path d="M467.5 89 V101 C467.5 103 471 104.5 475.5 104.5 C480 104.5 483.5 103 483.5 101 V89" fill="none" stroke="#286e5c" stroke-width="1.5"/>
    <text x="501" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#276653">Veri Saklama</text>
    <text x="501" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#538273">Doğrulama ve kayıt</text>
    <rect x="461" y="122" width="61" height="7" rx="3.5" fill="#b7e3d4"/>
  </g>

  <!-- Sağ alt: Seçenekler -->
  <g filter="url(#hafifGolge)">
    <rect x="446" y="175" width="146" height="80" rx="18" fill="#e4f0ff"/>
    <text x="461" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345f87">Araç Seçimi</text>
    <rect x="461" y="208" width="10" height="10" rx="3" fill="#f2b963"/>
    <text x="478" y="217" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#516d84">OhMyForm</text>
    <rect x="461" y="226" width="10" height="10" rx="3" fill="#9784dc"/>
    <text x="478" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#516d84">Formbricks</text>
    <rect x="461" y="244" width="10" height="10" rx="3" fill="#65bda2"/>
    <text x="478" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#516d84">Nextcloud Forms</text>
  </g>

  <!-- Alt kriter şeridi -->
  <g filter="url(#hafifGolge)">
    <rect x="170" y="274" width="300" height="29" rx="14.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="192" cy="288.5" r="5" fill="#6daed7"/>
    <text x="204" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557087">Kolaylık</text>
    <circle cx="274" cy="288.5" r="5" fill="#70b89f"/>
    <text x="286" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557087">Gizlilik</text>
    <circle cx="358" cy="288.5" r="5" fill="#ac96df"/>
    <text x="370" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557087">Entegrasyon</text>
  </g>
</svg>