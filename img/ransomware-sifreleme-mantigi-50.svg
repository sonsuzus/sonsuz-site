    <text x="565" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456d50">Şifreli veri</text>
    <text x="565" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456d50">Sarılı anahtar</text>
    <text x="565" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456d50">Nonce ve etiket</text>
