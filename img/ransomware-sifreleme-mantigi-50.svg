    <rect x="194" y="271" width="177" height="30" rx="12" fill="#ffffff" opacity="0.88"/>
    <circle cx="212" cy="286" r="7" fill="#a887c8"/>
    <text x="287" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d4a6f">RSA: anahtar için güvenli</text>
