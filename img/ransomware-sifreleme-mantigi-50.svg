  <polygon points="384,227 379,235 389,235" fill="#947db2"/>
  <text x="311" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79658c">K yalnızca sarılır</text>

  <g filter="url(#shadow)">
    <rect x="397" y="236" width="138" height="56" rx="17" fill="url(#rsa)"/>
    <circle cx="422" cy="264" r="15" fill="#ffffff" opacity="0.73"/>
    <path d="M416 264 h12 M422 258 v12" stroke="#8766ad" stroke-width="2" stroke-linecap="round"/>
    <text x="477" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#60437d">RSA-OAEP</text>
    <text x="477" y="279" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705886">Açık anahtar PK</text>
