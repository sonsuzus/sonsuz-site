    <text x="247.5" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#265a75">AES-GCM</text>
    <text x="247.5" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456d80">Hızlı şifreleme</text>
    
    <rect x="196" y="163" width="103" height="27" rx="10" fill="#ffffff" opacity="0.7"/>
