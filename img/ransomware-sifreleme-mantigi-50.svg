    <text x="426" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3b7148">Şifreli veri</text>
    <text x="417" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#506d79">C + T</text>
    <text x="417" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#738994">Doğrulama etiketi</text>
  </g>

