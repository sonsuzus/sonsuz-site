  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8190">Hızlı veri koruma ve güvenli anahtar saklama</text>

  <g filter="url(#shadow)">
