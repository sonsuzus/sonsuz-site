  <polygon points="506,164 498,159 498,169" fill="#77a6bd"/>
  <path d="M535 264 H554 V197" fill="none" stroke="#947db2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="554,193 549,201 559,201" fill="#947db2"/>

