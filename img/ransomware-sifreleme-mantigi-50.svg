    <text x="254" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315f77">AES anahtarı K</text>
    
    <rect x="196" y="200" width="103" height="27" rx="10" fill="#ffffff" opacity="0.7"/>
    <circle cx="210" cy="213.5" r="6" fill="#9bc777"/>
    <text x="254" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315f77">Benzersiz nonce</text>
  </g>

