<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="aes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9efff"/>
      <stop offset="100%" stop-color="#bce2f4"/>
    </linearGradient>
    <linearGradient id="rsa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee2ff"/>
      <stop offset="100%" stop-color="#d8c5f2"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5f6df"/>
      <stop offset="100%" stop-color="#c9eabf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6b8294" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#678097" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="46" r="78" fill="#dcefff" opacity="0.5"/>
  <circle cx="583" cy="272" r="92" fill="#ddf2d8" opacity="0.55"/>
  <path d="M32 86 C150 62 206 85 300 54 S500 46 612 85" fill="none" stroke="#cfe1e9" stroke-width="1.5" opacity="0.65"/>
  
