<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="owner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#c7dff5"/>
    </linearGradient>
    <linearGradient id="heap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#c5edd5"/>
    </linearGradient>
    <linearGradient id="borrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde4a7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5d7890" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#547083" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="321" cy="159" r="113" fill="#dbeafe" opacity="0.22"/>
  <circle cx="321" cy="159" r="82" fill="#ffffff" opacity="0.38"/>

  <text x="28" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476074" font-weight="600">Rust sahiplik akışı</text>
  <rect x="28" y="41" width="584" height="1" fill="#cddce2"/>

  <path d="M177 135 C207 135 217 135 241 135" fill="none" stroke="#7694ae" stroke-width="2.5"/>
  <polygon points="241,135 231,129 231,141" fill="#7694ae"/>

  <path d="M397 134 C421 134 432 134 455 134" fill="none" stroke="#6f9b82" stroke-width="2.5"/>
  <polygon points="455,134 445,128 445,140" fill="#6f9b82"/>

  <path d="M321 195 L321 232" fill="none" stroke="#cf9b48" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="321,240 315,230 327,230" fill="#cf9b48"/>

  <path d="M458 178 C425 220 388 235 350 243" fill="none" stroke="#7992a5" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="343,245 352,238 354,249" fill="#7992a5"/>

  <g filter="url(#shadow)">
    <rect x="38" y="89" width="139" height="91" rx="18" fill="url(#owner)"/>
    <rect x="50" y="103" width="115" height="25" rx="10" fill="#ffffff" opacity="0.64"/>
    <text x="107.5" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31536e" font-weight="700">mesaj</text>
    <text x="107.5" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42677e">Stack değişkeni</text>
    <text x="107.5" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42677e">Tek sahip</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="241" y="86" width="156" height="111" rx="22" fill="#ffffff"/>
    <rect x="256" y="101" width="126" height="31" rx="12" fill="url(#owner)"/>
    <text x="319" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#254c68" font-weight="700">Sahiplik</text>
    <path d="M274 151 H364" stroke="#8eabc0" stroke-width="1.5"/>
    <circle cx="282" cy="166" r="5" fill="#6f9d85"/>
    <text x="295" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476579">Derleme zamanı</text>
    <circle cx="282" cy="184" r="5" fill="#d59a45"/>
    <text x="295" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476579">Güvenli erişim</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="89" width="148" height="91" rx="18" fill="url(#heap)"/>
    <ellipse cx="529" cy="113" rx="44" ry="10" fill="#ffffff" opacity="0.52"/>
    <rect x="485" y="113" width="88" height="31" fill="#b9e4c8" opacity="0.55"/>
    <ellipse cx="529" cy="144" rx="44" ry="10" fill="#addcc0" opacity="0.72"/>
    <text x="529" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35684b" font-weight="700">Heap veri</text>
  </g>

  <g filter="url(#soft)">
    <rect x="216" y="240" width="211" height="57" rx="17" fill="url(#borrow)"/>
    <circle cx="242" cy="268" r="14" fill="#fffaf0"/>
    <path d="M237 269 L241 273 L248 264" fill="none" stroke="#b27b2e" stroke-width="2.2"/>
    <text x="330" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#795623" font-weight="700">Kapsam sonu</text>
    <text x="330" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#795623">drop ile otomatik temizlik</text>
  </g>

  <g filter="url(#soft)">
    <rect x="42" y="215" width="137" height="54" rx="16" fill="#f4e8ff"/>
    <text x="110.5" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76538d" font-weight="700">Taşıma</text>
    <text x="110.5" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76538d">yeni sahip</text>
  </g>
  <path d="M178 232 C203 225 224 205 248 184" fill="none" stroke="#a678bb" stroke-width="2"/>
  <polygon points="254,179 244,182 252,190" fill="#a678bb"/>

  <g filter="url(#soft)">
    <rect x="461" y="215" width="141" height="54" rx="16" fill="#e2f2fc"/>
    <text x="531.5" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426d87" font-weight="700">Ödünç alma</text>
    <text x="531.5" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426d87">geçici erişim</text>
  </g>
  <path d="M462 230 C432 216 412 198 387 181" fill="none" stroke="#5e95b5" stroke-width="2"/>
  <polygon points="380,177 389,186 392,175" fill="#5e95b5"/>

  <text x="319" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#af7e32">sahip çıkar</text>
</svg>