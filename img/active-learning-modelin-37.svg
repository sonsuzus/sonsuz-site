<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8378cf"/>
      <stop offset="100%" stop-color="#5d9cd2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#506580" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#506580" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="#dfeefa" opacity="0.46"/>
  <circle cx="320" cy="160" r="92" fill="none" stroke="#b8cee1" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.7"/>

  <!-- Bağlantı eğrileri -->
  <path d="M201 111 C220 87, 248 73, 271 72" fill="none" stroke="#92aac2" stroke-width="2"/>
  <polygon points="270,67 282,72 271,78" fill="#92aac2"/>
  <path d="M371 73 C404 79, 426 95, 438 113" fill="none" stroke="#92aac2" stroke-width="2"/>
  <polygon points="435,111 444,122 431,119" fill="#92aac2"/>
  <path d="M442 202 C425 225, 396 241, 373 245" fill="none" stroke="#92aac2" stroke-width="2"/>
  <polygon points="376,239 362,247 377,251" fill="#92aac2"/>
  <path d="M267 244 C238 239, 215 224, 200 204" fill="none" stroke="#92aac2" stroke-width="2"/>
  <polygon points="204,205 194,194 207,198" fill="#92aac2"/>
  <path d="M192 142 C189 157, 189 171, 194 184" fill="none" stroke="#92aac2" stroke-width="2"/>
  <polygon points="188,180 196,194 199,178" fill="#92aac2"/>

  <!-- Üst sol: Etiketli veri -->
  <g filter="url(#soft)">
    <rect x="74" y="72" width="130" height="60" rx="16" fill="#fffdfb"/>
    <rect x="85" y="85" width="34" height="34" rx="10" fill="#bfe4d3"/>
    <circle cx="102" cy="98" r="6" fill="#5da882"/>
    <path d="M92 111 Q102 102 112 111" fill="none" stroke="#5da882" stroke-width="3" stroke-linecap="round"/>
    <text x="130" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33465b" font-weight="600">Başlangıç</text>
    <text x="130" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64778c">etiketli küme</text>
  </g>

  <!-- Üst sağ: Model -->
  <g filter="url(#soft)">
    <rect x="436" y="72" width="130" height="60" rx="16" fill="#fffdfb"/>
    <rect x="448" y="84" width="37" height="36" rx="10" fill="#d8cff2"/>
    <circle cx="459" cy="96" r="3" fill="#7765ba"/>
    <circle cx="474" cy="96" r="3" fill="#7765ba"/>
    <circle cx="466.5" cy="109" r="3" fill="#7765ba"/>
    <path d="M459 96 L474 96 L466.5 109 Z" fill="none" stroke="#7765ba" stroke-width="1.5"/>
    <text x="496" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33465b" font-weight="600">Modeli</text>
    <text x="496" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64778c">eğit</text>
  </g>

  <!-- Sağ alt: Seçim -->
  <g filter="url(#soft)">
    <rect x="436" y="190" width="130" height="60" rx="16" fill="#fffdfb"/>
    <rect x="448" y="202" width="36" height="36" rx="10" fill="#ffe2bd"/>
    <path d="M456 225 L463 217 L469 221 L477 209" fill="none" stroke="#cf853d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="477" cy="209" r="3" fill="#cf853d"/>
    <text x="496" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33465b" font-weight="600">Belirsiz</text>
    <text x="496" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64778c">örnekleri seç</text>
  </g>

  <!-- Alt sol: Uzman -->
  <g filter="url(#soft)">
    <rect x="74" y="190" width="130" height="60" rx="16" fill="#fffdfb"/>
    <rect x="85" y="202" width="36" height="36" rx="10" fill="#f8ccd5"/>
    <circle cx="103" cy="212" r="5" fill="#c75d77"/>
    <path d="M94 229 Q103 218 112 229" fill="none" stroke="#c75d77" stroke-width="3" stroke-linecap="round"/>
    <text x="132" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33465b" font-weight="600">Uzman</text>
    <text x="132" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64778c">etiketler</text>
  </g>

  <!-- Sol orta: Havuz -->
  <g filter="url(#soft)">
    <rect x="42" y="136" width="130" height="48" rx="15" fill="#fffdfb"/>
    <circle cx="63" cy="154" r="7" fill="#a7c9e8"/>
    <circle cx="83" cy="163" r="7" fill="#b8ddb6"/>
    <circle cx="103" cy="153" r="7" fill="#f0c883"/>
    <circle cx="123" cy="164" r="7" fill="#d5b9df"/>
    <text x="139" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#51677c">Veri havuzu</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="160" r="65" fill="url(#core)"/>
    <circle cx="320" cy="160" r="55" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <path d="M292 156 C300 139, 316 134, 329 143 C342 152, 347 171, 332 180 C317 189, 300 182, 292 170" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="287,166 294,178 301,165" fill="#ffffff"/>
    <text x="320" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">AKTİF</text>
    <text x="320" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">ÖĞRENME</text>
    <text x="320" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e9f3ff">geri bildirim döngüsü</text>
  </g>

  <!-- Alt bilgi -->
  <g filter="url(#soft)">
    <rect x="237" y="275" width="166" height="27" rx="13.5" fill="#ffffff"/>
    <circle cx="255" cy="288.5" r="5" fill="#e69b55"/>
    <text x="267" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#50657a">Yüksek entropi önceliği</text>
  </g>
</svg>