<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#90a4ae" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#37474f">Ağdaki Görünmez Gözler</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#607d8b">Wireshark ve Ettercap ile MitM Analizi</text>

  <!-- Merkez düğüm: Ağ Trafiği -->
  <rect x="245" y="105" width="150" height="50" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Ağ Trafiği</text>
  <text x="320" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">Paketler ve Akış</text>

  <!-- Sol üst: Wireshark -->
  <rect x="55" y="70" width="140" height="55" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="125" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">Wireshark</text>
  <text x="125" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a1b9a">Paket Yakalama</text>
  <text x="125" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a1b9a">ve Analiz</text>

  <!-- Sol alt: TShark -->
  <rect x="55" y="205" width="140" height="50" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="125" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">TShark</text>
  <text x="125" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#bf360c">Komut Satırı Analizi</text>

  <!-- Sağ üst: Ettercap -->
  <rect x="445" y="70" width="140" height="55" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#81c784" stroke-width="1.5"/>
  <text x="515" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Ettercap</text>
  <text x="515" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2e7d32">MitM Senaryoları</text>
  <text x="515" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2e7d32">ve ARP Analizi</text>

  <!-- Sağ alt: Şifreleme -->
  <rect x="445" y="205" width="140" height="50" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="515" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Şifreleme</text>
  <text x="515" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">HTTPS ve TLS Koruması</text>

  <!-- Alt merkez: Savunma -->
  <rect x="245" y="245" width="150" height="45" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="320" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Savunma</text>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#bf360c">Güvenli Ağ İlkeleri</text>

  <!-- Oklar: Wireshark -> Merkez -->
  <path d="M 195 97 L 240 115" stroke="#f48fb1" stroke-width="2" fill="none"/>
  <polygon points="240,115 231,110 233,119" fill="#f48fb1"/>

  <!-- Oklar: TShark -> Merkez -->
  <path d="M 195 230 L 240 140" stroke="#ffb74d" stroke-width="2" fill="none"/>
  <polygon points="240,140 231,136 235,145" fill="#ffb74d"/>

  <!-- Oklar: Merkez -> Ettercap -->
  <path d="M 395 115 L 440 97" stroke="#81c784" stroke-width="2" fill="none"/>
  <polygon points="440,97 431,93 433,102" fill="#81c784"/>

  <!-- Oklar: Merkez -> Şifreleme -->
  <path d="M 395 140 L 440 230" stroke="#90caf9" stroke-width="2" fill="none"/>
  <polygon points="440,230 431,226 435,235" fill="#90caf9"/>

  <!-- Oklar: Merkez -> Savunma -->
  <path d="M 320 155 L 320 240" stroke="#ffb74d" stroke-width="2" fill="none"/>
  <polygon points="320,240 315,231 325,231" fill="#ffb74d"/>

  <!-- Etiket: Promiscuous Mode -->
  <text x="125" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" font-style="italic">Promiscuous Mode</text>
  <line x1="125" y1="180" x2="125" y2="200" stroke="#78909c" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Etiket: ARP -->
  <text x="515" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" font-style="italic">ARP Sahteleme</text>
  <line x1="515" y1="180" x2="515" y2="200" stroke="#78909c" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#90a4ae">Yalnızca izinli laboratuvar ortamlarında kullanılmalıdır</text>
</svg>