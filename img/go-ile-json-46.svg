<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#90a4ae" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#37474f">Go JSON Serileştirme Akışı</text>

  <!-- Merkez: Go Struct -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Go Struct</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#283593">Alanlar + Tagler</text>

  <!-- Sol üst: Marshal -->
  <rect x="45" y="45" width="130" height="45" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="110" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Marshal</text>
  <text x="110" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">Yapı → JSON</text>

  <!-- Sağ üst: Unmarshal -->
  <rect x="465" y="45" width="130" height="45" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="530" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Unmarshal</text>
  <text x="530" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ef6c00">JSON → Yapı</text>

  <!-- Sol alt: JSON Çıktı -->
  <rect x="45" y="220" width="130" height="50" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="110" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">JSON Verisi</text>
  <text x="110" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ad1457">İletim / API</text>

  <!-- Sağ alt: Struct Geri -->
  <rect x="465" y="220" width="130" height="50" rx="10" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="530" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#311b92">Go Struct</text>
  <text x="530" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4527a0">Tip Güvenli Erişim</text>

  <!-- Alt orta: Hata Yönetimi -->
  <rect x="245" y="245" width="150" height="40" rx="10" fill="url(#boxGrad6)" filter="url(#shadow)" stroke="#4dd0e1" stroke-width="1.5"/>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#006064">Hata Yönetimi</text>
  <text x="320" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#00838f">Kontrol Şart</text>

  <!-- Oklar: Marshal yolu -->
  <path d="M175,67 L235,67 L235,130 L240,130" fill="none" stroke="#43a047" stroke-width="2"/>
  <polygon points="240,130 230,124 230,136" fill="#43a047"/>

  <!-- Oklar: Unmarshal yolu -->
  <path d="M465,67 L405,67 L405,130 L400,130" fill="none" stroke="#ef6c00" stroke-width="2"/>
  <polygon points="400,130 410,124 410,136" fill="#ef6c00"/>

  <!-- Oklar: JSON çıktıya -->
  <path d="M175,145 L175,245 L180,245" fill="none" stroke="#d81b60" stroke-width="2"/>
  <polygon points="180,245 170,239 170,251" fill="#d81b60"/>

  <!-- Oklar: Struct geri -->
  <path d="M465,145 L465,245 L460,245" fill="none" stroke="#5e35b1" stroke-width="2"/>
  <polygon points="460,245 470,239 470,251" fill="#5e35b1"/>

  <!-- Oklar: Hata yönetimine -->
  <path d="M320,170 L320,240" fill="none" stroke="#00acc1" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="320,240 315,230 325,230" fill="#00acc1"/>

  <!-- Etiketler -->
  <text x="205" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">dönüşüm</text>
  <text x="435" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ef6c00">çözümleme</text>

  <!-- Küçük ikonlar -->
  <circle cx="110" cy="195" r="4" fill="#66bb6a"/>
  <circle cx="530" cy="195" r="4" fill="#ffa726"/>
  <circle cx="320" cy="215" r="4" fill="#26c6da"/>
</svg>