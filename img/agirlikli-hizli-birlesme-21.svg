  <rect x="460" y="222" width="128" height="28" rx="12" fill="#e8e2fb"/>
  <text x="524" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#66568e">find: O(log N)</text>

  <path d="M234 286 L406 286" stroke="#9ab6a4" stroke-width="2" fill="none"/>
  <polygon points="406,281 416,286 406,291" fill="#71957d"/>
  <text x="320" y="304" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52705d">Yol sıkıştırma: düğümler köke yaklaşır</text>
</svg>