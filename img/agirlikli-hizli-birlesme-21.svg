  <text x="524" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#62558d">Dengeli yapı</text>
  <text x="524" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a709b">Sınırlı yükseklik</text>

  <path d="M524 140 L488 170 M524 140 L560 170 M488 170 L470 199 M488 170 L506 199 M560 170 L542 199 M560 170 L578 199" stroke="#877bbe" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g filter="url(#softShadow)">
    <circle cx="524" cy="137" r="15" fill="#cfc6f5"/>
    <circle cx="488" cy="170" r="13" fill="#ddd4fa"/>
    <circle cx="560" cy="170" r="13" fill="#ddd4fa"/>
    <circle cx="470" cy="201" r="11" fill="#eeeaff"/>
