  <text x="116" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b7269">Uzun zincir</text>

  <path d="M58 145 L84 145 M94 145 L120 145 M130 145 L156 145" stroke="#d08b7e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="84,140 94,145 84,150" fill="#d08b7e"/>
  <polygon points="120,140 130,145 120,150" fill="#d08b7e"/>
  <polygon points="156,140 166,145 156,150" fill="#d08b7e"/>

