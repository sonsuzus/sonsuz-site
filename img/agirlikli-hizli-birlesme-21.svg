  <text x="320" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527561">size[root] güncellenir</text>

  <path d="M210 161 L222 161" stroke="#94aab6" stroke-width="2.5" fill="none"/>
  <polygon points="222,156 230,161 222,166" fill="#7794a2"/>
  <path d="M414 161 L426 161" stroke="#94aab6" stroke-width="2.5" fill="none"/>
