<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="boxPhp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d4ecfb"/>
    </linearGradient>
    <linearGradient id="boxServer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3e0"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="boxHtml" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#d4f0d4"/>
    </linearGradient>
    <linearGradient id="boxBrowser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8fd"/>
      <stop offset="100%" stop-color="#e4d5f7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">PHP Akış Mimarisi</text>

  <!-- PHP Dosyası Kutusu -->
  <rect x="40" y="65" width="150" height="70" rx="10" fill="url(#boxPhp)" filter="url(#shadow)" stroke="#b8ddf0" stroke-width="1.5"/>
  <text x="115" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">PHP Dosyası</text>
  <text x="115" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">.php uzantılı</text>
  <text x="115" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">HTML + PHP kodları</text>

  <!-- Sunucu Kutusu -->
  <rect x="245" y="55" width="150" height="90" rx="10" fill="url(#boxServer)" filter="url(#shadow)" stroke="#f0d5a8" stroke-width="1.5"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7e5109">Yerel Sunucu</text>
  <text x="320" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">PHP yorumlayıcı</text>
  <text x="320" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Dinamik HTML üretir</text>
  <text x="320" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Sunucu taraflı çalışır</text>

  <!-- HTML Çıktı Kutusu -->
  <rect x="450" y="65" width="150" height="70" rx="10" fill="url(#boxHtml)" filter="url(#shadow)" stroke="#b8e0b8" stroke-width="1.5"/>
  <text x="525" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6b1e">HTML Çıktı</text>
  <text x="525" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Saf HTML kodu</text>
  <text x="525" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Tarayıcıya gönderilir</text>

  <!-- Tarayıcı Kutusu -->
  <rect x="245" y="200" width="150" height="70" rx="10" fill="url(#boxBrowser)" filter="url(#shadow)" stroke="#d4b8f0" stroke-width="1.5"/>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a1a7e">Web Tarayıcı</text>
  <text x="320" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">HTML dosyasını açar</text>
  <text x="320" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Sayfayı görüntüler</text>

  <!-- Ok: PHP Dosyası -> Sunucu -->
  <path d="M 190 100 L 235 100" stroke="#5a8ab3" stroke-width="2" fill="none"/>
  <polygon points="240,100 228,94 228,106" fill="#5a8ab3"/>

  <!-- Ok: Sunucu -> HTML Çıktı -->
  <path d="M 395 100 L 440 100" stroke="#5a8ab3" stroke-width="2" fill="none"/>
  <polygon points="445,100 433,94 433,106" fill="#5a8ab3"/>

  <!-- Ok: HTML Çıktı -> Tarayıcı (dolaylı) -->
  <path d="M 525 135 L 525 170 Q 525 180 515 180 L 405 180 Q 395 180 395 190 L 395 195" stroke="#5a8ab3" stroke-width="2" fill="none"/>
  <polygon points="395,200 389,188 401,188" fill="#5a8ab3"/>

  <!-- Ok: Sunucu -> Tarayıcı (doğrudan) -->
  <path d="M 320 145 L 320 190" stroke="#8a6ab3" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <polygon points="320,195 314,183 326,183" fill="#8a6ab3"/>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">PHP: Hypertext Preprocessor - Dinamik web sitesi oluşturma</text>

  <!-- Küçük etiketler -->
  <text x="212" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8ab3">gönderir</text>
  <text x="418" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8ab3">oluşturur</text>
  <text x="300" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a6ab3">doğrudan HTML</text>
</svg>