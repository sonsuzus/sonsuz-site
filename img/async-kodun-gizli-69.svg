<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#cce7df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7890a0" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7890a0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="159" r="111" fill="#dceef3" opacity="0.38"/>
  <circle cx="319" cy="159" r="88" fill="#ffffff" opacity="0.50"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40576b">ASYNC AKIŞI: KONTROLÜ BIRAK YA DA TAŞI</text>

  <!-- Sol üst: görevler -->
  <g filter="url(#softShadow)">
    <rect x="28" y="70" width="130" height="78" rx="17" fill="#ffffff"/>
    <rect x="39" y="82" width="108" height="24" rx="10" fill="#e3f2ff"/>
    <circle cx="53" cy="94" r="5" fill="#5a9ed6"/>
    <text x="64" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31536d">Görevler</text>
    <rect x="41" y="115" width="27" height="18" rx="7" fill="#d9f2e7"/>
    <rect x="76" y="115" width="27" height="18" rx="7" fill="#d9f2e7"/>
    <rect x="111" y="115" width="27" height="18" rx="7" fill="#d9f2e7"/>
    <text x="50" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39775c">1</text>
    <text x="85" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39775c">2</text>
    <text x="120" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39775c">3</text>
  </g>

  <!-- görevler -> loop -->
  <path d="M158 109 C181 109 184 130 207 139" fill="none" stroke="#6e9eb6" stroke-width="2.2"/>
  <polygon points="207,139 197,134 200,145" fill="#6e9eb6"/>

  <!-- Merkez event loop -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="159" r="65" fill="url(#loopGrad)" stroke="#a9d1d3" stroke-width="2"/>
    <circle cx="320" cy="159" r="48" fill="#ffffff" opacity="0.72"/>
    <path d="M291 151 A31 31 0 0 1 337 133" fill="none" stroke="#58a1b6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="339,132 329,132 334,141" fill="#58a1b6"/>
    <path d="M348 167 A31 31 0 0 1 301 185" fill="none" stroke="#58a1b6" stroke-width="3" stroke-linecap="round"/>
    <polygon points="299,186 309,185 304,176" fill="#58a1b6"/>
    <text x="320" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31596c">Event Loop</text>
    <text x="320" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547181">Sıradaki görev</text>
  </g>

  <!-- üst sağ: await -->
  <g filter="url(#softShadow)">
    <rect x="452" y="54" width="157" height="78" rx="17" fill="#ffffff"/>
    <rect x="465" y="68" width="32" height="32" rx="10" fill="#d8f3e4"/>
    <path d="M473 84 L479 90 L490 77" fill="none" stroke="#3c9b70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37725b">await</text>
    <text x="508" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567469">Kontrol geri verilir</text>
    <text x="466" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d936c">Eşzamanlı ilerleme</text>
  </g>
  <path d="M369 125 C396 99 416 94 452 94" fill="none" stroke="#54a881" stroke-width="2.4"/>
  <polygon points="452,94 442,89 443,99" fill="#54a881"/>

  <!-- alt sol blocker -->
  <g filter="url(#softShadow)">
    <rect x="28" y="202" width="170" height="86" rx="17" fill="#ffffff"/>
    <rect x="41" y="216" width="35" height="35" rx="10" fill="#ffe4e1"/>
    <rect x="49" y="224" width="19" height="19" rx="4" fill="none" stroke="#d76b62" stroke-width="2"/>
    <path d="M58 227 L58 234 L63 237" fill="none" stroke="#d76b62" stroke-width="2" stroke-linecap="round"/>
    <text x="87" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9d4c47">Bloklayan çağrı</text>
    <text x="41" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a75b54">time.sleep · senkron I/O</text>
  </g>
  <path d="M248 201 C226 220 218 236 198 241" fill="none" stroke="#d76b62" stroke-width="2.5"/>
  <polygon points="198,241 207,232 209,243" fill="#d76b62"/>

  <!-- stop bar -->
  <path d="M235 211 L265 211" stroke="#d76b62" stroke-width="5" stroke-linecap="round"/>
  <path d="M235 220 L265 220" stroke="#d76b62" stroke-width="5" stroke-linecap="round"/>
  <text x="239" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#b1544e">DONMA</text>

  <!-- alt right offload -->
  <g filter="url(#softShadow)">
    <rect x="433" y="202" width="176" height="86" rx="17" fill="#ffffff"/>
    <rect x="446" y="216" width="38" height="38" rx="10" fill="#e8e0fb"/>
    <circle cx="465" cy="235" r="10" fill="none" stroke="#8166be" stroke-width="2"/>
    <path d="M465 225 L465 235 L472 239" fill="none" stroke="#8166be" stroke-width="2" stroke-linecap="round"/>
    <text x="496" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#655098">Havuz</text>
    <text x="496" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74678c">Thread veya süreç</text>
    <text x="446" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66558e">Bloklayan işi taşı</text>
  </g>
  <path d="M369 193 C390 215 404 235 433 241" fill="none" stroke="#8065bd" stroke-width="2.5"/>
  <polygon points="433,241 423,233 421,244" fill="#8065bd"/>

  <!-- alt açıklama -->
  <g filter="url(#softShadow)">
    <rect x="222" y="274" width="198" height="31" rx="14" fill="#ffffff"/>
    <circle cx="240" cy="289" r="6" fill="#55a982"/>
    <text x="253" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f6670">Hızla geri dön, akışı koru</text>
  </g>
</svg>