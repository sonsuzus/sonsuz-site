  <text x="120" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29485c" font-weight="600">Saha Ölçümü</text>
  <text x="120" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8190">akım · gerilim · rüzgâr</text>

