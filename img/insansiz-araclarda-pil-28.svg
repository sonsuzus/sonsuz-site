  <text x="120" y="225" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29485c" font-weight="600">Görev Uygulama</text>
  <text x="120" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8190">seçim · hareket · sensör</text>

