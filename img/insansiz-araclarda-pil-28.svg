<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f1"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#557fc4"/>
      <stop offset="100%" stop-color="#6a9d9b"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#53708a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#567087" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="320" cy="160" r="133" fill="#dbeceb" opacity="0.42"/>
  <circle cx="320" cy="160" r="102" fill="none" stroke="#a9c9ca" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.65"/>

  <!-- Döngü bağlantıları -->
  <path d="M207 92 C238 50, 289 43, 325 53" fill="none" stroke="#6e9aaf" stroke-width="2.2" opacity="0.72"/>
