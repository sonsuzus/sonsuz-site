  <circle cx="307" cy="151" r="3" fill="#ffffff"/>
  <circle cx="320" cy="158" r="3" fill="#ffffff"/>
  <circle cx="336" cy="143" r="3" fill="#ffffff"/>
  <circle cx="350" cy="151" r="3" fill="#ffffff"/>
  <text x="320" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="600">Güvenli Optimizasyon</text>

