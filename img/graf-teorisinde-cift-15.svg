<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="kartMavi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f3ff"/>
      <stop offset="100%" stop-color="#d9eaff"/>
    </linearGradient>
    <linearGradient id="kartMor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1ecff"/>
      <stop offset="100%" stop-color="#e5dcff"/>
    </linearGradient>
    <linearGradient id="kartYesil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf8ef"/>
      <stop offset="100%" stop-color="#d8f0e1"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#60748a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#60748a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="67" cy="45" r="74" fill="#dcefff" opacity="0.48"/>
  <circle cx="585" cy="274" r="86" fill="#dff2df" opacity="0.5"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#33485f">Graf Dayanıklılığı: Köprü ve Eklem Noktası</text>

  <!-- Sol grafik kartı -->
  <rect x="22" y="53" width="180" height="226" rx="18" fill="url(#kartMavi)" filter="url(#golge)"/>
  <text x="42" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315774">Ağ yapısı</text>
  <text x="42" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58728b">Alternatif rota analizi</text>

  <!-- graph edges -->
  <path d="M62 145 L105 119 L145 146 L62 145 M105 119 L105 177 M62 145 L105 177 L145 146" fill="none" stroke="#718ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M105 177 L154 207" fill="none" stroke="#e47b67" stroke-width="5" stroke-linecap="round"/>
  <path d="M154 207 L174 238 L134 247 L154 207" fill="none" stroke="#718ca7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- nodes -->
  <circle cx="62" cy="145" r="10" fill="#ffffff" stroke="#5e84a5" stroke-width="2" filter="url(#hafifGolge)"/>
  <circle cx="105" cy="119" r="10" fill="#ffffff" stroke="#5e84a5" stroke-width="2" filter="url(#hafifGolge)"/>
  <circle cx="145" cy="146" r="10" fill="#ffffff" stroke="#5e84a5" stroke-width="2" filter="url(#hafifGolge)"/>
  <circle cx="105" cy="177" r="10" fill="#fff2d9" stroke="#db9c43" stroke-width="3" filter="url(#hafifGolge)"/>
  <circle cx="154" cy="207" r="11" fill="#ffe8e2" stroke="#dc6f5e" stroke-width="3" filter="url(#hafifGolge)"/>
  <circle cx="174" cy="238" r="10" fill="#ffffff" stroke="#5e84a5" stroke-width="2" filter="url(#hafifGolge)"/>
  <circle cx="134" cy="247" r="10" fill="#ffffff" stroke="#5e84a5" stroke-width="2" filter="url(#hafifGolge)"/>

  <text x="44" y="204" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ca5f51">Köprü</text>
  <path d="M92 201 L129 205" fill="none" stroke="#ca5f51" stroke-width="1.5"/>
  <polygon points="129,205 123,201 123,208" fill="#ca5f51"/>
  <text x="38" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#aa7930">Eklem</text>
  <path d="M82 228 L98 181" fill="none" stroke="#aa7930" stroke-width="1.5"/>
  <polygon points="98,181 93,187 101,189" fill="#aa7930"/>

  <!-- arrow left center -->
  <path d="M210 162 L245 162" fill="none" stroke="#7891a7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="245,162 236,157 236,167" fill="#7891a7"/>

  <!-- Merkez Tarjan -->
  <rect x="252" y="72" width="139" height="181" rx="20" fill="url(#kartMor)" filter="url(#golge)"/>
  <circle cx="321.5" cy="109" r="24" fill="#ffffff" opacity="0.82"/>
  <path d="M311 110 C313 98,329 97,332 107 C335 117,327 124,319 119 C313 116,310 115,311 110Z" fill="#9074c8"/>
  <path d="M304 136 L340 136" stroke="#b29cdc" stroke-width="2" stroke-linecap="round"/>
  <text x="321.5" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#58477e">Tarjan DFS</text>
  <text x="321.5" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665985">Keşif zamanı</text>
  <rect x="276" y="190" width="91" height="25" rx="10" fill="#ffffff" opacity="0.78"/>
  <text x="321.5" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#735ba4">disc ve low</text>
  <text x="321.5" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665985">Tek DFS turu</text>

  <!-- arrows center right -->
  <path d="M398 132 L430 132" fill="none" stroke="#7891a7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="430,132 421,127 421,137" fill="#7891a7"/>
  <path d="M398 206 L430 206" fill="none" stroke="#7891a7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="430,206 421,201 421,211" fill="#7891a7"/>

  <!-- Sağ sonuçlar -->
  <rect x="438" y="57" width="177" height="100" rx="18" fill="url(#kartYesil)" filter="url(#golge)"/>
  <circle cx="466" cy="88" r="15" fill="#ffe8e2" stroke="#dc725f" stroke-width="2"/>
  <path d="M461 88 L471 88 M466 83 L466 93" stroke="#dc725f" stroke-width="2" stroke-linecap="round"/>
  <text x="490" y="84" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6653">Kritik bağlantı</text>
  <text x="490" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587966">low[v] &gt; disc[u]</text>
  <rect x="458" y="119" width="133" height="23" rx="9" fill="#ffffff" opacity="0.72"/>
  <text x="524.5" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b85649">Köprü: tek hat riski</text>

  <rect x="438" y="174" width="177" height="100" rx="18" fill="#fff4df" filter="url(#golge)"/>
  <circle cx="466" cy="205" r="15" fill="#fff" stroke="#d5a14c" stroke-width="2"/>
  <circle cx="466" cy="205" r="4" fill="#d5a14c"/>
  <path d="M466 190 L466 184 M451 205 L445 205 M481 205 L487 205 M466 220 L466 226" stroke="#d5a14c" stroke-width="2" stroke-linecap="round"/>
  <text x="490" y="201" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#786037">Kritik düğüm</text>
  <text x="490" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#89734a">low[v] ≥ disc[u]</text>
  <rect x="458" y="236" width="133" height="23" rx="9" fill="#ffffff" opacity="0.75"/>
  <text x="524.5" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9c7430">Eklem: ayrılma riski</text>

  <!-- Bottom result band -->
  <rect x="205" y="281" width="230" height="25" rx="12" fill="#dff2e6" filter="url(#hafifGolge)"/>
  <circle cx="224" cy="293.5" r="6" fill="#68ae82"/>
  <text x="239" y="298" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7052">Çift bağlantılı bileşenler</text>
  <path d="M438 274 L421 283 L421 293 L435 293" fill="none" stroke="#7891a7" stroke-width="2"/>
  <polygon points="435,293 426,288 426,298" fill="#7891a7"/>
</svg>