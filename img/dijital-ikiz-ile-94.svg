  <text x="77" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35566d">ERP</text>

  <rect x="45" y="154" width="108" height="33" rx="11" fill="#daf2ea" filter="url(#soft)"/>
  <rect x="55" y="164" width="12" height="12" rx="3" fill="#65ad99"/>
