  <text x="192" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66818e">güncelle</text>

  <!-- Merkez dijital ikiz -->
  <rect x="218" y="75" width="195" height="169" rx="28" fill="url(#twin)" stroke="#bedfe0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="315" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315f6d">Dijital İkiz</text>
  <text x="315" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557984">Canlı tedarik ağı</text>

