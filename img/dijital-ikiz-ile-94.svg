<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="twin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#cfeee5"/>
    </linearGradient>
    <linearGradient id="scenario" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0da"/>
      <stop offset="100%" stop-color="#ffe0dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#688099" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71879a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="94" cy="48" r="72" fill="#ddecfa" opacity="0.48"/>
  <circle cx="576" cy="271" r="93" fill="#dff2dc" opacity="0.5"/>
  <path d="M42 258 C137 224 167 281 250 252 S396 219 465 251 S558 278 620 233" fill="none" stroke="#b9d9cf" stroke-width="2" opacity="0.45"/>

  <!-- Sol: Operasyonel Veri -->
