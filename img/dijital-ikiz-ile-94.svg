  <text x="310" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426875">Depo</text>
  <text x="375" y="165" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426875">Müşteri</text>

  <!-- Ikizden senaryo -->
  <path d="M414 159 H452" fill="none" stroke="#d39b78" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="452,159 443,154 443,164" fill="#d39b78"/>
  <text x="432" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b6a50">test et</text>

  <!-- Sağ senaryolar -->
  <rect x="455" y="45" width="160" height="214" rx="22" fill="#fffdfb" stroke="#f0ded1" filter="url(#shadow)"/>
  <text x="535" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#725644">Senaryo Laboratuvarı</text>

  <rect x="472" y="91" width="126" height="35" rx="11" fill="url(#scenario)" filter="url(#soft)"/>
  <circle cx="489" cy="108" r="7" fill="#e78978"/>
  <path d="M486 105l6 6M492 105l-6 6" stroke="#fff" stroke-width="1.4"/>
  <text x="504" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#754f46">Kesinti</text>

  <rect x="472" y="136" width="126" height="35" rx="11" fill="#e6f1ff" filter="url(#soft)"/>
  <path d="M483 153h13" stroke="#719fd0" stroke-width="2"/>
  <polygon points="496,153 490,149 490,157" fill="#719fd0"/>
  <text x="504" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6784">Alternatif kaynak</text>

  <rect x="472" y="181" width="126" height="35" rx="11" fill="#f6eed1" filter="url(#soft)"/>
  <path d="M483 204l5-8 5 8z" fill="#dfa44f"/>
  <text x="504" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75613d">Talep şoku</text>

  <!-- Sonuç -->
  <path d="M535 218 V235" fill="none" stroke="#80aa83" stroke-width="2.2"/>
  <polygon points="535,244 530,235 540,235" fill="#80aa83"/>
  <rect x="479" y="246" width="112" height="32" rx="11" fill="#dff1df" filter="url(#soft)"/>
  <path d="M490 266l5-5 4 3 7-9" fill="none" stroke="#5e9d69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="543" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456d4b">Karar kanıtı</text>

  <!-- Alt durum etiketi -->
  <rect x="218" y="267" width="195" height="28" rx="14" fill="#ffffff" opacity="0.82"/>
  <circle cx="239" cy="281" r="5" fill="#61b68d"/>
  <text x="252" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55707b">Stok · Sipariş · Teslimat</text>
</svg>