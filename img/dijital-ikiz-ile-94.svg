  <text x="77" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355f57">Depo</text>

  <rect x="45" y="197" width="108" height="33" rx="11" fill="#eee4fb" filter="url(#soft)"/>
  <rect x="55" y="207" width="12" height="12" rx="3" fill="#987cc3"/>
  <path d="M57.5 213h7M61 209.5v7" stroke="#fff" stroke-width="1.4"/>
  <text x="77" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e4b79">Taşıma</text>

  <!-- Veri akışı -->
  <path d="M171 159 H216" fill="none" stroke="#7ea8bf" stroke-width="2.5" stroke-linecap="round"/>
