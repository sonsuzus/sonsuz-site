  <circle cx="265" cy="166" r="12" fill="#80b5df" stroke="#fff" stroke-width="3"/>
  <circle cx="310" cy="142" r="14" fill="#67baa2" stroke="#fff" stroke-width="3"/>
  <circle cx="359" cy="167" r="12" fill="#eeab83" stroke="#fff" stroke-width="3"/>
  <circle cx="321" cy="204" r="13" fill="#8c82c5" stroke="#fff" stroke-width="3"/>
  <circle cx="270" cy="196" r="10" fill="#e8ca72" stroke="#fff" stroke-width="3"/>
