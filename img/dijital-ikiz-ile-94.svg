  <text x="99" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426277">Operasyonel Veri</text>

  <rect x="45" y="111" width="108" height="33" rx="11" fill="#dcecff" filter="url(#soft)"/>
