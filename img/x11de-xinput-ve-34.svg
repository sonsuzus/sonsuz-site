<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#888" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#dce8fb"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3e0"/>
      <stop offset="100%" stop-color="#fae8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#d4f0d4"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#3b5b92">X11 Canlı İmleç Tuvali Mimarisi</text>

  <!-- Merkez: X11 Sunucusu -->
  <rect x="245" y="70" width="150" height="52" rx="14" fill="url(#center)" stroke="#5b8fd4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a7a">X11 Sunucusu</text>
  <text x="320" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a9a">İmleç durumu ve olaylar</text>

  <!-- Üst: xinput -->
  <rect x="265" y="8" width="110" height="32" rx="10" fill="url(#box1)" stroke="#7da0d0" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="320" y="26" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3b5b92">xinput</text>

  <!-- Alt: xdotool -->
  <rect x="265" y="255" width="110" height="32" rx="10" fill="url(#box2)" stroke="#d4a050" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="320" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8a5a20">xdotool</text>

  <!-- Sol üst: Olay Akışı -->
  <rect x="20" y="45" width="105" height="40" rx="10" fill="#f2f0f7" stroke="#9a8ab8" stroke-width="1" filter="url(#shadow)"/>
  <text x="72" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a7a">Olay Akışı</text>
  <text x="72" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a6a9a">test-xi2</text>

  <!-- Sol alt: Konum Okuma -->
  <rect x="20" y="230" width="105" height="40" rx="10" fill="#f2f0f7" stroke="#9a8ab8" stroke-width="1" filter="url(#shadow)"/>
  <text x="72" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a7a">Konum Okuma</text>
  <text x="72" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a6a9a">getmouselocation</text>

  <!-- Sağ üst: Cizim Döngüsü -->
  <rect x="515" y="45" width="110" height="40" rx="10" fill="url(#box3)" stroke="#60a060" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="570" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a6a2a">Cizim Döngüsü</text>
  <text x="570" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a8a4a">16ms örnekleme</text>

  <!-- Sağ alt: Piksel Yürüyüşü -->
  <rect x="515" y="230" width="110" height="40" rx="10" fill="url(#box3)" stroke="#60a060" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="570" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a6a2a">Piksel Yürüyüşü</text>
  <text x="570" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a8a4a">robot ressam</text>

  <!-- Ok: xinput -> X11 -->
  <path d="M 300 42 L 300 68" stroke="#7da0d0" stroke-width="1.5" fill="none"/>
  <polygon points="295,68 300,76 305,68" fill="#7da0d0"/>

  <!-- Ok: X11 -> xdotool -->
  <path d="M 300 188 L 300 253" stroke="#d4a050" stroke-width="1.5" fill="none"/>
  <polygon points="295,253 300,261 305,253" fill="#d4a050"/>

  <!-- Ok: Olay Akisi -> X11 -->
  <path d="M 125 65 L 243 65" stroke="#9a8ab8" stroke-width="1.5" fill="none"/>
  <polygon points="243,60 251,65 243,70" fill="#9a8ab8"/>

  <!-- Ok: X11 -> Konum Okuma (aslinda konum okuma X11'den gelir) -->
  <path d="M 243 95 L 127 95" stroke="#9a8ab8" stroke-width="1.5" fill="none"/>
  <polygon points="127,90 119,95 127,100" fill="#9a8ab8"/>

  <!-- Ok: xdotool -> Piksel Yuruyusu -->
  <path d="M 377 95 L 513 95" stroke="#60a060" stroke-width="1.5" fill="none"/>
  <polygon points="513,90 521,95 513,100" fill="#60a060"/>

  <!-- Ok: Yuruyus -> Cizim (bilgi akisi) -->
  <path d="M 570 228 L 570 87" stroke="#60a060" stroke-width="1.5" fill="none"/>
  <polygon points="565,87 570,79 575,87" fill="#60a060"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a8a9a">X11 + Python + Tkinter = Canlı Dijital Eskiz Defteri</text>
</svg>