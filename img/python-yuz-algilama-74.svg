<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ba68c8"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="100%" stop-color="#e57373"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Yüz Algılama ve Tanıma Sistemi</text>

  <!-- Girdi Kaynakları -->
  <rect x="30" y="50" width="120" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="90" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Kamera</text>
  <text x="90" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">Canlı Görüntü</text>

  <rect x="30" y="115" width="120" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="90" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Fotoğraf</text>
  <text x="90" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">Dosya Girdisi</text>

  <rect x="30" y="180" width="120" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="90" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Video</text>
  <text x="90" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">Akış Dosyası</text>

  <!-- Ok: Girdi -> Ön İşleme -->
  <path d="M150 75 L195 75" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="198,75 190,70 190,80" fill="#555"/>

  <path d="M150 140 L195 140" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="198,140 190,135 190,145" fill="#555"/>

  <path d="M150 205 L195 205" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="198,205 190,200 190,210" fill="#555"/>

  <!-- Ön İşleme -->
  <rect x="200" y="60" width="130" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="265" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">Ön İşleme</text>
  <text x="265" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0d47a1">OpenCV</text>
  <text x="265" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0d47a1">NumPy Dizi</text>

  <!-- Ok: Ön İşleme -> Yüz Algılama -->
  <path d="M330 87 L375 87" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="378,87 370,82 370,92" fill="#555"/>

  <!-- Yüz Algılama -->
  <rect x="380" y="55" width="130" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="445" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Yüz Algılama</text>
  <text x="445" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">Haar Cascade</text>
  <text x="445" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">LBPH</text>

  <!-- Ok: Yüz Algılama -> Tanıma -->
  <path d="M510 82 L555 82" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="558,82 550,77 550,87" fill="#555"/>

  <!-- Tanıma -->
  <rect x="560" y="55" width="60" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="590" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">Tanıma</text>
  <text x="590" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">Karşılaştır</text>

  <!-- Veritabanı Kutusu -->
  <rect x="380" y="145" width="180" height="55" rx="10" fill="url(#box5)" filter="url(#shadow)" opacity="0.95"/>
  <text x="470" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#b71c1c">Yüz Veritabanı</text>
  <text x="470" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#b71c1c">faces/kisi01</text>
  <text x="470" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#b71c1c">Kaliteli Fotoğraflar</text>

  <!-- Ok: Veritabanı -> Tanıma -->
  <path d="M470 145 L470 115" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="470,112 465,120 475,120" fill="#555"/>

  <!-- Ok: Tanıma -> Sonuç -->
  <path d="M590 110 L590 195" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="590,198 585,190 595,190" fill="#555"/>

  <!-- Sonuç -->
  <rect x="380" y="200" width="180" height="55" rx="10" fill="url(#box6)" filter="url(#shadow)" opacity="0.95"/>
  <text x="470" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#004d40">Sonuç Çıktısı</text>
  <text x="470" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#004d40">İsim Etiketleme</text>
  <text x="470" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#004d40">Görüntü İşaretleme</text>

  <!-- Kurulum Bilgisi -->
  <rect x="30" y="255" width="290" height="50" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="175" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#37474f">Gerekli Kütüphaneler</text>
  <text x="175" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">opencv-contrib-python</text>
  <text x="175" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">numpy</text>

  <!-- Proje Dizini -->
  <rect x="340" y="255" width="280" height="50" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="480" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#37474f">Dizin Yapısı</text>
  <text x="480" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">projects/faces/kisi01</text>
  <text x="480" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">Kişi Fotoğraf Dizini</text>
</svg>