<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1ecf1"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">C++ İşlem Satırı ve İfade</text>

  <!-- Merkez kutu: İşlem Satırı -->
  <rect x="230" y="55" width="180" height="45" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a237e">İşlem Satırı</text>

  <!-- Ok: İşlem Satırı -> İfade (dikey) -->
  <path d="M320 100 L320 120" stroke="#5c6bc0" stroke-width="2" fill="none"/>
  <polygon points="314,118 320,130 326,118" fill="#5c6bc0"/>

  <!-- İfade kutusu -->
  <rect x="245" y="130" width="150" height="40" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="320" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#e65100">İfade</text>

  <!-- Alt bileşenler -->
  <!-- Değişken -->
  <rect x="50" y="200" width="120" height="40" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="110" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">Değişken</text>

  <!-- Sabit -->
  <rect x="200" y="200" width="120" height="40" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="260" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">Sabit</text>

  <!-- İşlemci -->
  <rect x="350" y="200" width="120" height="40" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="410" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">İşlemci</text>

  <!-- Atama -->
  <rect x="500" y="200" width="120" height="40" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="560" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">Atama</text>

  <!-- Oklar: İfade -> bileşenler -->
  <path d="M270 170 L110 200" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="118,194 110,206 126,202" fill="#78909c"/>

  <path d="M300 170 L260 200" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="266,194 258,206 274,202" fill="#78909c"/>

  <path d="M350 170 L410 200" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="402,194 414,206 420,194" fill="#78909c"/>

  <path d="M380 170 L560 200" stroke="#78909c" stroke-width="1.5" fill="none"/>
  <polygon points="552,194 564,206 570,194" fill="#78909c"/>

  <!-- Alt satır: İşlem satırı türleri -->
  <rect x="50" y="265" width="130" height="35" rx="8" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.2"/>
  <text x="115" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">Bildirim</text>

  <rect x="200" y="265" width="130" height="35" rx="8" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.2"/>
  <text x="265" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">Değer Atama</text>

  <rect x="350" y="265" width="130" height="35" rx="8" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.2"/>
  <text x="415" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">Fonksiyon Çağrısı</text>

  <rect x="500" y="265" width="120" height="35" rx="8" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.2"/>
  <text x="560" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">Döngü</text>

  <!-- Oklar: İşlem Satırı -> türler -->
  <path d="M250 100 L115 265" stroke="#ad1457" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="120,257 110,268 128,266" fill="#ad1457"/>

  <path d="M290 100 L265 265" stroke="#ad1457" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="270,257 260,268 278,266" fill="#ad1457"/>

  <path d="M350 100 L415 265" stroke="#ad1457" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="408,258 420,268 424,256" fill="#ad1457"/>

  <path d="M390 100 L560 265" stroke="#ad1457" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="552,258 564,268 570,256" fill="#ad1457"/>

  <!-- Örnek kod etiketi -->
  <rect x="15" y="55" width="180" height="30" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" opacity="0.8"/>
  <text x="105" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#616161">id3 = id1 + id2;</text>

  <rect x="445" y="55" width="180" height="30" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" opacity="0.8"/>
  <text x="535" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#616161">fonk();</text>
</svg>