<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">PHP Switch Yapısı</text>

  <!-- Giriş kutusu -->
  <rect x="245" y="42" width="150" height="36" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a237e" font-weight="bold">switch (ifade)</text>

  <!-- Ok: giriş -> değerlendirme -->
  <path d="M320 78 L320 95" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="315,93 320,103 325,93" fill="#546e7a"/>

  <!-- Değerlendirme kutusu -->
  <rect x="215" y="103" width="210" height="36" rx="10" fill="url(#box6)" filter="url(#shadow)" stroke="#4dd0e1" stroke-width="1.5"/>
  <text x="320" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#006064" font-weight="bold">İfade bir kez değerlendirilir</text>

  <!-- Ok: değerlendirme -> case'ler -->
  <path d="M320 139 L320 156" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="315,154 320,164 325,154" fill="#546e7a"/>

  <!-- Case 1 -->
  <rect x="40" y="166" width="120" height="36" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="100" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e65100" font-weight="bold">case değer 1</text>

  <!-- Case 2 -->
  <rect x="180" y="166" width="120" height="36" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="240" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e65100" font-weight="bold">case değer 2</text>

  <!-- Case 3 -->
  <rect x="320" y="166" width="120" height="36" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="380" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e65100" font-weight="bold">case değer 3</text>

  <!-- Default -->
  <rect x="460" y="166" width="120" height="36" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="520" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4527a0" font-weight="bold">default</text>

  <!-- Oklar: değerlendirme -> case'ler -->
  <path d="M260 139 L100 160" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="106,158 96,164 104,168" fill="#546e7a"/>

  <path d="M300 139 L240 160" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="246,158 236,164 244,168" fill="#546e7a"/>

  <path d="M340 139 L380 160" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="374,158 384,164 376,168" fill="#546e7a"/>

  <path d="M380 139 L520 160" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="514,158 524,164 516,168" fill="#546e7a"/>

  <!-- İşlem satırları -->
  <rect x="40" y="218" width="120" height="36" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="100" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">işlem satırı</text>

  <rect x="180" y="218" width="120" height="36" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="240" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">işlem satırı</text>

  <rect x="320" y="218" width="120" height="36" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="380" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">işlem satırı</text>

  <rect x="460" y="218" width="120" height="36" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="520" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1b5e20">işlem satırı</text>

  <!-- Oklar: case -> işlem -->
  <path d="M100 202 L100 212" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="95,210 100,220 105,210" fill="#546e7a"/>

  <path d="M240 202 L240 212" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="235,210 240,220 245,210" fill="#546e7a"/>

  <path d="M380 202 L380 212" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="375,210 380,220 385,210" fill="#546e7a"/>

  <path d="M520 202 L520 212" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="515,210 520,220 525,210" fill="#546e7a"/>

  <!-- Break etiketleri -->
  <text x="100" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c62828" font-style="italic">break</text>
  <text x="240" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c62828" font-style="italic">break</text>
  <text x="380" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c62828" font-style="italic">break</text>
  <text x="520" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c62828" font-style="italic">break</text>

  <!-- Veri türleri notu -->
  <rect x="40" y="285" width="540" height="28" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" opacity="0.8"/>
  <text x="320" y="304" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#616161">Desteklenen türler: integer, float, string</text>

  <!-- if elseif karşılaştırma notu -->
  <rect x="40" y="130" width="160" height="24" rx="6" fill="#fff8e1" stroke="#ffcc80" stroke-width="1" opacity="0.9"/>
  <text x="120" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f57f17">if elseif: her satırda değerlendirme</text>

  <!-- Alternatif sözdizimi notu -->
  <rect x="440" y="130" width="160" height="24" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1" opacity="0.9"/>
  <text x="520" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2e7d32">Alternatif: endswitch</text>
</svg>