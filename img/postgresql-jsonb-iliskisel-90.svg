<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d9f3e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4c6b7d" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4c6b7d" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="77" cy="47" r="74" fill="#cfe8ff" opacity="0.24"/>
  <circle cx="575" cy="278" r="105" fill="#d6f0c9" opacity="0.25"/>
  <path d="M24 270 C130 236 149 303 252 272 S424 224 615 259" fill="none" stroke="#c9dfdd" stroke-width="2" opacity="0.55"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315268">PostgreSQL JSONB · Hibrit Veri Modeli</text>

  <!-- Left source -->
  <g filter="url(#shadow)">
    <rect x="30" y="95" width="142" height="132" rx="18" fill="#fff8e7"/>
    <rect x="30" y="95" width="142" height="31" rx="18" fill="#ffe7a9"/>
    <rect x="30" y="112" width="142" height="14" fill="#ffe7a9"/>
  </g>
  <text x="101" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#745521">Değişken Nitelikler</text>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#725f38">
    <rect x="48" y="141" width="106" height="20" rx="8" fill="#fffdf6"/>
    <text x="61" y="155">ekran: 6.7</text>
    <rect x="48" y="168" width="106" height="20" rx="8" fill="#fffdf6"/>
    <text x="61" y="182">numara: 42</text>
    <rect x="48" y="195" width="106" height="20" rx="8" fill="#fffdf6"/>
    <text x="61" y="209">kavurma: koyu</text>
  </g>

  <!-- Arrow left to center -->
  <path d="M180 161 L213 161" fill="none" stroke="#7596a5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="213,161 204,156 204,166" fill="#7596a5"/>
  <text x="196" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#638190">sakla</text>

  <!-- Center core -->
  <g filter="url(#shadow)">
    <rect x="220" y="65" width="205" height="190" rx="22" fill="url(#core)" stroke="#bdd7d5" stroke-width="1.2"/>
  </g>
  <rect x="241" y="84" width="163" height="31" rx="11" fill="#507d91"/>
  <text x="322" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">ÜRÜNLER TABLOSU</text>

  <g filter="url(#smallShadow)">
    <rect x="241" y="128" width="163" height="49" rx="12" fill="#f8fcff"/>
  </g>
  <text x="255" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6579">İlişkisel Alanlar</text>
  <text x="255" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7884">id · ad · kategori · tarih</text>

  <g filter="url(#smallShadow)">
    <rect x="241" y="187" width="163" height="50" rx="12" fill="#edf9f1"/>
  </g>
  <path d="M257 203 L264 197 L271 203 L271 218 L257 218 Z" fill="#68a884"/>
  <path d="M263 204 L267 204" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="281" y="207" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d7560">attributes JSONB</text>
  <text x="281" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#598170">esnek belge yapısı</text>

  <!-- Center to index -->
  <path d="M433 129 C456 129 455 104 474 104" fill="none" stroke="#7596a5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="474,104 465,99 465,109" fill="#7596a5"/>

  <!-- Index -->
  <g filter="url(#shadow)">
    <rect x="481" y="55" width="130" height="98" rx="18" fill="#eee8ff"/>
  </g>
  <rect x="497" y="69" width="98" height="24" rx="9" fill="#8a78b8"/>
  <text x="546" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">GIN İNDEKSİ</text>
  <g fill="#b5a8dc">
    <rect x="498" y="106" width="21" height="27" rx="5"/>
    <rect x="526" y="100" width="21" height="33" rx="5"/>
    <rect x="554" y="110" width="21" height="23" rx="5"/>
  </g>
  <text x="546" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#635685">anahtar ve değer</text>

  <!-- Center to query -->
  <path d="M433 207 C454 207 452 230 474 230" fill="none" stroke="#7596a5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="474,230 465,225 465,235" fill="#7596a5"/>

  <!-- Query -->
  <g filter="url(#shadow)">
    <rect x="481" y="181" width="130" height="92" rx="18" fill="#e4f3ff"/>
  </g>
  <circle cx="512" cy="210" r="13" fill="#6eabc9"/>
  <circle cx="510" cy="208" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M514 213 L520 219" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="550" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386b84">Hızlı Sorgu</text>
  <rect x="497" y="226" width="97" height="25" rx="8" fill="#f8fcff"/>
  <text x="546" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7182">@&gt; · -&gt; · -&gt;&gt;</text>

  <!-- bottom benefit -->
  <path d="M322 263 L322 280" fill="none" stroke="#7596a5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="322,280 317,271 327,271" fill="#7596a5"/>
  <g filter="url(#smallShadow)">
    <rect x="209" y="285" width="226" height="26" rx="12" fill="#ffffff" opacity="0.94"/>
  </g>
  <text x="322" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477064">SQL bütünlüğü + NoSQL esnekliği</text>
</svg>