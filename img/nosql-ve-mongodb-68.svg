    <circle cx="486" cy="226" r="13" fill="#d4c5f4"/>
    <circle cx="481" cy="226" r="3" fill="none" stroke="#71569e" stroke-width="1.7"/>
    <circle cx="491" cy="226" r="3" fill="none" stroke="#71569e" stroke-width="1.7"/>
    <path d="M484 226 h4" stroke="#71569e" stroke-width="1.7"/>
    <text x="508" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5b526b">Referans</text>
    <text x="508" y="243" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74808a">Paylaşılan büyük veri</text>
    <rect x="477" y="253" width="38" height="5" rx="2.5" fill="#c4afe9"/>
    <rect x="520" y="253" width="56" height="5" rx="2.5" fill="#e0d7f4"/>
  </g>

  <!-- Merkez doküman -->
  <g filter="url(#golge)">
    <rect x="249" y="101" width="142" height="132" rx="20" fill="url(#merkez)" stroke="#b8d4e8"/>
    <rect x="266" y="118" width="108" height="25" rx="8" fill="#ffffff" opacity="0.86"/>
    <circle cx="280" cy="130" r="5" fill="#5d9bc3"/>
    <text x="292" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#36556c">MongoDB</text>

    <rect x="266" y="152" width="66" height="10" rx="4" fill="#a7cbe2"/>
    <rect x="337" y="152" width="25" height="10" rx="4" fill="#c7deeb"/>
    <rect x="266" y="169" width="43" height="10" rx="4" fill="#c7deeb"/>
    <rect x="314" y="169" width="48" height="10" rx="4" fill="#91c0dc"/>
    <rect x="266" y="186" width="96" height="10" rx="4" fill="#c7deeb"/>
    <rect x="266" y="204" width="52" height="10" rx="4" fill="#91c0dc"/>
    <rect x="323" y="204" width="39" height="10" rx="4" fill="#c7deeb"/>
