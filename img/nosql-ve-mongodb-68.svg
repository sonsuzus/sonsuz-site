  <polygon points="169,237 176,232 177,241" fill="#9cb6c6"/>
  <path d="M382 181 C430 196, 446 232, 472 237" fill="none" stroke="#9cb6c6" stroke-width="2"/>
  <polygon points="472,237 464,232 463,241" fill="#9cb6c6"/>

  <!-- Sol üst -->
  <g filter="url(#hafifGolge)">
    <rect x="43" y="70" width="135" height="70" rx="16" fill="#fff7df" stroke="#f0ddb1"/>
    <circle cx="67" cy="94" r="13" fill="#ffd98b"/>
    <path d="M62 94 h10 M67 89 v10" stroke="#9b6e18" stroke-width="2" stroke-linecap="round"/>
    <text x="89" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5d5a4c">Esnek Şema</text>
    <text x="89" y="111" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74808a">Alanlar değişebilir</text>
    <rect x="58" y="121" width="38" height="5" rx="2.5" fill="#f4d895"/>
    <rect x="101" y="121" width="58" height="5" rx="2.5" fill="#f8e9bd"/>
  </g>

  <!-- Sağ üst -->
  <g filter="url(#hafifGolge)">
    <rect x="462" y="70" width="135" height="70" rx="16" fill="#e9f8eb" stroke="#c9e7cf"/>
    <circle cx="486" cy="94" r="13" fill="#bfe6c5"/>
    <path d="M480 94 l4 4 8-9" fill="none" stroke="#398254" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4c6353">Doğrulama</text>
