<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8efff"/>
      <stop offset="100%" stop-color="#dce8ff"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7b90a8" flood-opacity="0.22"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7b90a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="78" cy="50" r="72" fill="#dff1f2" opacity="0.42"/>
  <circle cx="578" cy="274" r="92" fill="#e5e4ff" opacity="0.36"/>

  <text x="32" y="33" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#46586c">Doküman Tabanlı Veri Modelleme</text>
  <line x1="32" y1="43" x2="608" y2="43" stroke="#d5e1e9" stroke-width="1"/>

  <!-- Bağlantılar -->
  <path d="M258 152 C211 141, 194 110, 169 104" fill="none" stroke="#9cb6c6" stroke-width="2"/>
  <polygon points="169,104 177,100 175,109" fill="#9cb6c6"/>
  <path d="M382 152 C430 141, 447 110, 472 104" fill="none" stroke="#9cb6c6" stroke-width="2"/>
  <polygon points="472,104 464,100 466,109" fill="#9cb6c6"/>
