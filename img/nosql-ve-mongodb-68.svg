  <text x="320" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4b6578">Tek Doküman</text>

  <!-- Alt akış -->
  <path d="M205 291 H423" stroke="#c4d6df" stroke-width="2" stroke-linecap="round"/>
  <polygon points="423,291 415,286 415,296" fill="#9eb7c4"/>
  <circle cx="214" cy="291" r="5" fill="#8fbdd6"/>
  <text x="230" y="295" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657b88">Sorgu</text>
  <circle cx="306" cy="291" r="5" fill="#9ecfa8"/>
  <text x="322" y="295" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657b88">İndeks</text>
  <circle cx="400" cy="291" r="5" fill="#c4afe6"/>
  <text x="416" y="295" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657b88">Hız</text>
</svg>