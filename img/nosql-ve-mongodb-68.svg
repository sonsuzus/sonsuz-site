    <rect x="60" y="220" width="14" height="11" rx="2" fill="none" stroke="#a75365" stroke-width="1.8"/>
    <path d="M63 217 v4 M71 217 v4 M63 226 h8" stroke="#a75365" stroke-width="1.8" stroke-linecap="round"/>
    <text x="89" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#6b5158">Gömme</text>
    <text x="89" y="243" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74808a">Birlikte okunan veri</text>
    <rect x="58" y="253" width="25" height="5" rx="2.5" fill="#ec9fad"/>
    <rect x="88" y="253" width="43" height="5" rx="2.5" fill="#f4c8ce"/>
