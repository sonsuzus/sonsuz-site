<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="matrix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6efff"/>
      <stop offset="100%" stop-color="#d6e4fb"/>
    </linearGradient>
    <linearGradient id="list" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5f7eb"/>
      <stop offset="100%" stop-color="#d1eddc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#72849a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="64" cy="46" r="62" fill="#dceeff" opacity="0.38"/>
  <circle cx="590" cy="286" r="85" fill="#dff3df" opacity="0.42"/>

  <rect x="228" y="18" width="184" height="58" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="320" y="41" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34445b">GRAF G = (V, E)</text>
  <text x="320" y="61" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637188">Düğümler ve kenarlar</text>

  <circle cx="273" cy="50" r="5" fill="#819ce2"/>
  <circle cx="294" cy="61" r="5" fill="#7dcaad"/>
  <circle cx="308" cy="39" r="5" fill="#f2b778"/>
  <path d="M277 49 L303 40 M277 52 L290 59 M298 58 L306 43" stroke="#8795a8" stroke-width="2"/>

  <path d="M278 77 C250 94 183 94 164 112" fill="none" stroke="#7893bd" stroke-width="2.5"/>
  <polygon points="158,118 164,108 170,117" fill="#7893bd"/>
  <path d="M362 77 C390 94 457 94 476 112" fill="none" stroke="#6eae87" stroke-width="2.5"/>
  <polygon points="470,117 476,108 482,118" fill="#6eae87"/>

  <rect x="38" y="113" width="266" height="177" rx="20" fill="url(#matrix)" filter="url(#shadow)"/>
  <rect x="38" y="113" width="266" height="39" rx="20" fill="#c9dcfa"/>
  <path d="M38 133 Q38 152 58 152 L284 152 Q304 152 304 133" fill="#c9dcfa"/>
  <text x="171" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31547e">KOMŞULUK MATRİSİ</text>

  <rect x="60" y="168" width="94" height="91" rx="10" fill="#ffffff" opacity="0.88"/>
  <g stroke="#9bb2d0" stroke-width="1">
    <path d="M83 175 V252 M106 175 V252 M129 175 V252"/>
    <path d="M63 194 H151 M63 213 H151 M63 232 H151"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#486889" font-weight="600">
    <text x="72" y="190">0</text><text x="95" y="190">1</text><text x="118" y="190">1</text><text x="140" y="190">0</text>
    <text x="72" y="209">1</text><text x="95" y="209">0</text><text x="118" y="209">0</text><text x="140" y="209">1</text>
    <text x="72" y="228">1</text><text x="95" y="228">0</text><text x="118" y="228">0</text><text x="140" y="228">1</text>
    <text x="72" y="247">0</text><text x="95" y="247">1</text><text x="118" y="247">1</text><text x="140" y="247">0</text>
  </g>

  <rect x="173" y="169" width="109" height="31" rx="10" fill="#f7fbff" opacity="0.9"/>
  <text x="227" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6288">Yoğun graf</text>
  <rect x="173" y="210" width="109" height="31" rx="10" fill="#f7fbff" opacity="0.9"/>
  <text x="227" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6288">Bellek: O(V²)</text>
  <text x="171" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456486">Kenar sorgusu: O(1)</text>

  <rect x="336" y="113" width="266" height="177" rx="20" fill="url(#list)" filter="url(#shadow)"/>
  <rect x="336" y="113" width="266" height="39" rx="20" fill="#c5ead2"/>
  <path d="M336 133 Q336 152 356 152 L582 152 Q602 152 602 133" fill="#c5ead2"/>
  <text x="469" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35664d">KOMŞULUK LİSTESİ</text>

  <rect x="357" y="168" width="120" height="91" rx="10" fill="#ffffff" opacity="0.88"/>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3c7057">
    <text x="373" y="189" font-weight="700">0</text><text x="402" y="189">→ [1, 2]</text>
    <text x="373" y="210" font-weight="700">1</text><text x="402" y="210">→ [0, 3]</text>
    <text x="373" y="231" font-weight="700">2</text><text x="402" y="231">→ [0, 3]</text>
    <text x="373" y="252" font-weight="700">3</text><text x="402" y="252">→ [1, 2]</text>
  </g>

  <rect x="493" y="169" width="88" height="31" rx="10" fill="#f8fffa" opacity="0.9"/>
  <text x="537" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f7257">Seyrek graf</text>
  <rect x="493" y="210" width="88" height="31" rx="10" fill="#f8fffa" opacity="0.9"/>
  <text x="537" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f7257">O(V + E)</text>
  <text x="469" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43705a">Komşuları gez: O(d(v))</text>

  <path d="M304 301 H336" stroke="#91a1ae" stroke-width="2"/>
  <polygon points="320,296 329,301 320,306" fill="#91a1ae"/>
  <text x="320" y="316" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a6878">Yoğunluk seçimi belirler</text>
</svg>