<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="treePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f1ff"/>
      <stop offset="100%" stop-color="#edf8f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#718096" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#718096" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="46" cy="41" r="32" fill="#dceeff" opacity="0.52"/>
  <circle cx="603" cy="276" r="48" fill="#dff2e4" opacity="0.55"/>
  <circle cx="580" cy="51" r="18" fill="#fbe9c9" opacity="0.62"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34455d">İkili Ağaç Dolaşmaları</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a7b8d">Kökün ziyaret zamanı sıralamayı belirler</text>

  <rect x="27" y="67" width="226" height="223" rx="20" fill="url(#treePanel)" filter="url(#shadow)"/>
  <text x="48" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f5871">Örnek ikili ağaç</text>
  <text x="48" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718196">Her düğüm: en fazla iki çocuk</text>

  <path d="M140 148 L94 190 M140 148 L188 190 M94 208 L69 246 M94 208 L119 246 M188 208 L211 246"
        fill="none" stroke="#91a8bb" stroke-width="2.5" stroke-linecap="round"/>

  <g filter="url(#softShadow)">
    <circle cx="140" cy="143" r="22" fill="#8cbcf2"/>
    <circle cx="94" cy="203" r="20" fill="#a6d6bc"/>
    <circle cx="188" cy="203" r="20" fill="#f2bf83"/>
    <circle cx="69" cy="253" r="17" fill="#d5c3f2"/>
    <circle cx="119" cy="253" r="17" fill="#d5c3f2"/>
    <circle cx="211" cy="253" r="17" fill="#d5c3f2"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="140" y="147">8</text>
    <text x="94" y="207">3</text>
    <text x="188" y="207">10</text>
    <text x="69" y="257">1</text>
    <text x="119" y="257">6</text>
    <text x="211" y="257">14</text>
  </g>

  <path d="M271 177 L292 177" fill="none" stroke="#8aa0b4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="296,177 288,172 288,182" fill="#8aa0b4"/>

  <rect x="310" y="67" width="302" height="64" rx="16" fill="#fff8ed" filter="url(#shadow)"/>
  <rect x="310" y="67" width="8" height="64" rx="4" fill="#efa84d"/>
  <circle cx="342" cy="99" r="17" fill="#f7ca8a"/>
  <text x="342" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#774d1c">1</text>
  <text x="371" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#67451e">Ön sıra</text>
  <text x="371" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a684f">Kök → Sol → Sağ</text>
  <text x="509" y="102" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#9a6324">8 · 3 · 1 · 6</text>

  <rect x="310" y="145" width="302" height="64" rx="16" fill="#f0f8ff" filter="url(#shadow)"/>
  <rect x="310" y="145" width="8" height="64" rx="4" fill="#69a9e9"/>
  <circle cx="342" cy="177" r="17" fill="#a9cef3"/>
  <text x="342" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#315f91">2</text>
  <text x="371" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315e87">Orta sıra</text>
  <text x="371" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#59738c">Sol → Kök → Sağ</text>
  <text x="523" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#3974ae">Sıralı çıktı</text>

  <rect x="310" y="223" width="302" height="64" rx="16" fill="#f3fbf5" filter="url(#shadow)"/>
  <rect x="310" y="223" width="8" height="64" rx="4" fill="#76bc91"/>
  <circle cx="342" cy="255" r="17" fill="#b7dfc2"/>
  <text x="342" y="259" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#326746">3</text>
  <text x="371" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356a49">Son sıra</text>
  <text x="371" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c7e68">Sol → Sağ → Kök</text>
  <text x="526" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#47825b">Çocuklar önce</text>
</svg>