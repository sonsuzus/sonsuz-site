    <rect x="470" y="218" width="67" height="24" rx="8" fill="#e0f0dc"/>
    <rect x="447" y="177" width="47" height="28" rx="10" fill="#ffffff" stroke="#afd3d4"/>
    <rect x="507" y="177" width="47" height="28" rx="10" fill="#ffffff" stroke="#afd3d4"/>
    <rect x="568" y="177" width="31" height="28" rx="10" fill="#d9efdb"/>
    <rect x="512" y="119" width="58" height="22" rx="11" fill="#ffe8a9"/>
