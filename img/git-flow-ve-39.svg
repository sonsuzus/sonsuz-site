    <path d="M397 145 L429 145 L452 177" stroke="#7b83be" stroke-width="5"/>
    <path d="M452 177 L469 191" stroke="#7b83be" stroke-width="5"/>
    <path d="M486 230 L513 230 L537 202" stroke="#72a86f" stroke-width="5"/>
    <path d="M537 202 L550 191" stroke="#72a86f" stroke-width="5"/>
