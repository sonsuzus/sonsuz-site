    <path d="M68 224 L109 224 L139 194 L180 194" stroke="#506b7a" stroke-width="5"/>
    <path d="M68 159 L109 159 L139 194" stroke="#d87951" stroke-width="5"/>
    <path d="M68 127 L115 127 L144 159 L181 159" stroke="#bd80a4" stroke-width="5"/>
    <path d="M180 194 L215 224 L258 224" stroke="#506b7a" stroke-width="5"/>
