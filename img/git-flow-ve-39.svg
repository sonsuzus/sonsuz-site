<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="gitCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="100%" stop-color="#fff1e7"/>
    </linearGradient>
    <linearGradient id="trunkCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1fbff"/>
      <stop offset="100%" stop-color="#e6f6f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#587080" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#587080" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="47" cy="38" r="70" fill="#ddecfa" opacity="0.45"/>
  <circle cx="603" cy="280" r="84" fill="#dff2df" opacity="0.48"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405767">Paralel Geliştirme Stratejileri</text>
  <rect x="257" y="38" width="126" height="4" rx="2" fill="#82b9ca"/>

  <g filter="url(#shadow)">
    <rect x="25" y="58" width="276" height="223" rx="18" fill="url(#gitCard)" stroke="#f0c9ae"/>
    <rect x="339" y="58" width="276" height="223" rx="18" fill="url(#trunkCard)" stroke="#b9dddd"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="47" y="74" width="126" height="28" rx="14" fill="#e88658" filter="url(#smallShadow)"/>
    <text x="110" y="93" text-anchor="middle" font-weight="700" fill="#ffffff">Git Flow</text>
    <text x="187" y="92" fill="#9a6753">Kontrollü şeritler</text>

    <rect x="362" y="74" width="177" height="28" rx="14" fill="#55aeb0" filter="url(#smallShadow)"/>
    <text x="450" y="93" text-anchor="middle" font-weight="700" fill="#ffffff">Trunk-Based</text>
    <text x="550" y="92" fill="#487c7d">Hızlı entegrasyon</text>
  </g>

