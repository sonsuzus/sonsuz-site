<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e6fd"/>
      <stop offset="100%" stop-color="#b8d4f8"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b39ddb"/>
      <stop offset="100%" stop-color="#9575cd"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#4db6ac"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Vektörler</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">Dinamik Boyutlu Sıralı Konteyner</text>

  <!-- Merkez Vektör Kutusu -->
  <rect x="245" y="70" width="150" height="45" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a237e">Vektör</text>
  <text x="320" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#283593">Dinamik Dizi</text>

  <!-- Sol Üst: Dizi (Sabit Boyut) -->
  <rect x="40" y="75" width="130" height="40" rx="8" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="105" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Dizi</text>
  <text x="105" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2e7d32">Sabit Boyut</text>

  <!-- Sol Alt: Bellek Yönetimi -->
  <rect x="40" y="145" width="130" height="40" rx="8" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="105" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Bellek Yönetimi</text>
  <text x="105" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#ef6c00">Otomatik Tahsis</text>

  <!-- Sağ Üst: Sıralı Konteyner -->
  <rect x="470" y="75" width="130" height="40" rx="8" fill="url(#boxGrad4)" filter="url(#shadowLight)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="535" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">Sıralı Konteyner</text>
  <text x="535" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#ad1457">Doğrusal Depolama</text>

  <!-- Sağ Alt: Şablon Yapısı -->
  <rect x="470" y="145" width="130" height="40" rx="8" fill="url(#boxGrad5)" filter="url(#shadowLight)" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="535" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#311b92">Şablon Yapısı</text>
  <text x="535" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4527a0">T ve Allocator</text>

  <!-- Alt Orta: Constructor Fonksiyonları -->
  <rect x="245" y="145" width="150" height="40" rx="8" fill="url(#boxGrad6)" filter="url(#shadowLight)" stroke="#4db6ac" stroke-width="1.5"/>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#004d40">Constructor'lar</text>
  <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#00695c">Kurucu Fonksiyonlar</text>

  <!-- Oklar - Dizi ve Vektör arası -->
  <path d="M170 95 L240 95" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="240,90 250,95 240,100" fill="#546e7a"/>

  <!-- Oklar - Bellek ve Vektör arası -->
  <path d="M170 165 L240 165" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="240,160 250,165 240,170" fill="#546e7a"/>

  <!-- Oklar - Vektör ve Sıralı Konteyner arası -->
  <path d="M400 95 L465 95" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="465,90 475,95 465,100" fill="#546e7a"/>

  <!-- Oklar - Vektör ve Şablon arası -->
  <path d="M400 165 L465 165" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="465,160 475,165 465,170" fill="#546e7a"/>

  <!-- Oklar - Vektör ve Constructor arası -->
  <path d="M320 115 L320 140" stroke="#546e7a" stroke-width="1.8" fill="none"/>
  <polygon points="315,140 320,150 325,140" fill="#546e7a"/>

  <!-- Alt Bilgi Kutuları -->
  <rect x="40" y="230" width="180" height="35" rx="8" fill="#ffffff" opacity="0.7" filter="url(#shadowLight)" stroke="#b0bec5" stroke-width="1"/>
  <text x="130" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">Bitişik Depolama</text>
  <text x="130" y="259" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#607d8b">Elemanlar ardışık</text>

  <rect x="420" y="230" width="180" height="35" rx="8" fill="#ffffff" opacity="0.7" filter="url(#shadowLight)" stroke="#b0bec5" stroke-width="1"/>
  <text x="510" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#37474f">Tek Veri Türü</text>
  <text x="510" y="259" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#607d8b">T ile tanımlanır</text>

  <!-- Alt Bilgi Okları -->
  <path d="M220 247 L415 247" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <polygon points="415,243 423,247 415,251" fill="#90a4ae"/>

  <!-- Esneklik Etiketi -->
  <rect x="245" y="270" width="150" height="30" rx="15" fill="#e8eaf6" opacity="0.8" filter="url(#shadowLight)" stroke="#7986cb" stroke-width="1"/>
  <text x="320" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3949ab">Esneklik Sağlar</text>

  <!-- Esneklik Oku -->
  <path d="M320 265 L320 270" stroke="#7986cb" stroke-width="1.5" fill="none"/>
  <polygon points="316,270 320,277 324,270" fill="#7986cb"/>
</svg>