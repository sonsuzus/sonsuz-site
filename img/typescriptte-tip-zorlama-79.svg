<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#a0aec0" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#eef8f0"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c9cf5"/>
      <stop offset="100%" stop-color="#a5b8f8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a97c"/>
      <stop offset="100%" stop-color="#f8c8a5"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cd6a0"/>
      <stop offset="100%" stop-color="#a5f0c0"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c07c"/>
      <stop offset="100%" stop-color="#f8dba5"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c07cf5"/>
      <stop offset="100%" stop-color="#dba5f8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2d3748">TypeScript Tip Zorlama</text>

  <!-- Merkez kutu -->
  <rect x="250" y="52" width="140" height="44" rx="10" fill="url(#grad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">as</text>
  <text x="320" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ffffff" opacity="0.9">Derleyiciye not</text>

  <!-- Sol üst: Bilinen tip -->
  <rect x="40" y="52" width="140" height="44" rx="10" fill="url(#grad3)" filter="url(#shadow)" opacity="0.9"/>
  <text x="110" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a2a">Bilinen Tip</text>
  <text x="110" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a3a2a" opacity="0.8">string, number</text>

  <!-- Ok: Bilinen tip -> as -->
  <path d="M 180 74 L 245 74" stroke="#4a5568" stroke-width="2" fill="none"/>
  <polygon points="245,70 255,74 245,78" fill="#4a5568"/>

  <!-- Sol alt: Belirsiz tip -->
  <rect x="40" y="130" width="140" height="44" rx="10" fill="url(#grad4)" filter="url(#shadow)" opacity="0.9"/>
  <text x="110" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a2a1a">Belirsiz Tip</text>
  <text x="110" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a2a1a" opacity="0.8">unknown, any</text>

  <!-- Ok: Belirsiz tip -> as -->
  <path d="M 180 152 L 245 152" stroke="#4a5568" stroke-width="2" fill="none"/>
  <polygon points="245,148 255,152 245,156" fill="#4a5568"/>

  <!-- Sağ üst: Çalışma zamanı -->
  <rect x="460" y="52" width="140" height="44" rx="10" fill="url(#grad2)" filter="url(#shadow)" opacity="0.9"/>
  <text x="530" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a1a1a">Çalışma Zamanı</text>
  <text x="530" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a1a1a" opacity="0.8">Değer değişmez</text>

  <!-- Ok: as -> Çalışma zamanı -->
  <path d="M 390 74 L 455 74" stroke="#4a5568" stroke-width="2" fill="none"/>
  <polygon points="455,70 465,74 455,78" fill="#4a5568"/>

  <!-- Sağ alt: Tip güvenliği -->
  <rect x="460" y="130" width="140" height="44" rx="10" fill="url(#grad5)" filter="url(#shadow)" opacity="0.9"/>
  <text x="530" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a1a3a">Tip Güvenliği</text>
  <text x="530" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a1a3a" opacity="0.8">Derleyici görüşü</text>

  <!-- Ok: as -> Tip güvenliği -->
  <path d="M 390 152 L 455 152" stroke="#4a5568" stroke-width="2" fill="none"/>
  <polygon points="455,148 465,152 455,156" fill="#4a5568"/>

  <!-- Alt bölüm: Kullanım alanları -->
  <text x="320" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a5568">Kullanım Alanları</text>

  <rect x="40" y="225" width="120" height="36" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" filter="url(#shadow)" opacity="0.85"/>
  <text x="100" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d3748">DOM işlemleri</text>

  <rect x="180" y="225" width="120" height="36" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" filter="url(#shadow)" opacity="0.85"/>
  <text x="240" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d3748">API yanıtları</text>

  <rect x="320" y="225" width="120" height="36" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" filter="url(#shadow)" opacity="0.85"/>
  <text x="380" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d3748">Genel kütüphaneler</text>

  <rect x="460" y="225" width="140" height="36" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1" filter="url(#shadow)" opacity="0.85"/>
  <text x="530" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d3748">Doğrulama gerekli</text>

  <!-- Alt bilgi -->
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#718096" opacity="0.8">Kontrol edebiliyorsan kontrol et, gerçekten biliyorsan zorla</text>
</svg>