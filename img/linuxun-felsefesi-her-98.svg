<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c8ebf"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f4ea"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef7e0"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce8e6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Merkez ilke kutusu -->
  <g filter="url(#shadow)">
    <rect x="230" y="125" width="180" height="70" rx="16" fill="url(#centerGrad)"/>
    <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Her Şey Bir</text>
    <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Dosyadır</text>
  </g>

  <!-- Bağlantı çizgileri (manuel ok başları ile) -->
  <!-- Sol üst: Günlükler -->
  <path d="M 235 130 L 105 75" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="105,75 115,78 108,85" fill="#7a9cc6"/>

  <!-- Sağ üst: Aygıtlar -->
  <path d="M 405 130 L 535 75" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="535,75 525,78 532,85" fill="#7a9cc6"/>

  <!-- Sol alt: Süreçler -->
  <path d="M 235 190 L 105 245" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="105,245 115,242 108,235" fill="#7a9cc6"/>

  <!-- Sağ alt: Ayarlar -->
  <path d="M 405 190 L 535 245" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="535,245 525,242 532,235" fill="#7a9cc6"/>

  <!-- Sol üst: Metin Günlükleri -->
  <g filter="url(#shadowLight)">
    <rect x="20" y="30" width="130" height="60" rx="10" fill="url(#boxGrad1)"/>
    <text x="85" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3c5a7d">Metin Günlükleri</text>
    <text x="85" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9e">/var/log/...</text>
  </g>
  <g filter="url(#shadowLight)">
    <rect x="25" y="100" width="120" height="40" rx="8" fill="#ffffff" opacity="0.7"/>
    <text x="85" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">tail, grep</text>
    <text x="85" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a8aaa">Olayları tara</text>
  </g>

  <!-- Sağ üst: Donanım Aygıtları -->
  <g filter="url(#shadowLight)">
    <rect x="490" y="30" width="130" height="60" rx="10" fill="url(#boxGrad2)"/>
    <text x="555" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3d7a4a">Donanım Aygıtları</text>
    <text x="555" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a9e6a">/dev/...</text>
  </g>
  <g filter="url(#shadowLight)">
    <rect x="495" y="100" width="120" height="40" rx="8" fill="#ffffff" opacity="0.7"/>
    <text x="555" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a5a">okuma / yazma</text>
    <text x="555" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6aaa7a">Ortak arayüz</text>
  </g>

  <!-- Sol alt: Süreç Bilgisi -->
  <g filter="url(#shadowLight)">
    <rect x="20" y="230" width="130" height="60" rx="10" fill="url(#boxGrad3)"/>
    <text x="85" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8a6a2a">Süreç Bilgisi</text>
    <text x="85" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#aa8a4a">/proc/...</text>
  </g>
  <g filter="url(#shadowLight)">
    <rect x="25" y="180" width="120" height="40" rx="8" fill="#ffffff" opacity="0.7"/>
    <text x="85" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a7a3a">cat, less</text>
    <text x="85" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#aa9a5a">Sistemi incele</text>
  </g>

  <!-- Sağ alt: Sistem Ayarları -->
  <g filter="url(#shadowLight)">
    <rect x="490" y="230" width="130" height="60" rx="10" fill="url(#boxGrad4)"/>
    <text x="555" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#a53a3a">Sistem Ayarları</text>
    <text x="555" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c55a5a">/sys/...</text>
  </g>
  <g filter="url(#shadowLight)">
    <rect x="495" y="180" width="120" height="40" rx="8" fill="#ffffff" opacity="0.7"/>
    <text x="555" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a54a4a">read, echo</text>
    <text x="555" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c56a6a">Yapılandırmayı keşfet</text>
  </g>

  <!-- Alt bilgi: Bilişsel ekonomi etiketi -->
  <g filter="url(#shadowLight)">
    <rect x="200" y="270" width="240" height="35" rx="10" fill="#ffffff" opacity="0.6"/>
    <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9e">Bilişsel Ekonomi</text>
    <text x="320" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a9abe">Az model, az istisna, az maliyet</text>
  </g>

  <!-- Merkezden alt bilgiye ince bağlantı -->
  <path d="M 320 195 L 320 265" stroke="#7a9cc6" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="320,265 316,257 324,257" fill="#7a9cc6"/>

  <!-- Üst başlık -->
  <text x="320" y="20" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#3c5a7d" opacity="0.8">Unix Felsefesi: Ortak Dosya Arayüzü</text>
</svg>