<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f1"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#dff4e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6d88a0" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d88a0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M35 61 C133 22 180 36 240 68" fill="none" stroke="#c8dcf0" stroke-width="1.5" opacity="0.7"/>
  <path d="M422 278 C507 239 566 263 621 219" fill="none" stroke="#c7e4d0" stroke-width="1.5" opacity="0.75"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#38536a">TEK PANELDE ÇOKLU TAŞIYICI YÖNETİMİ</text>

  <!-- Order -->
  <g filter="url(#shadow)">
    <rect x="28" y="118" width="116" height="84" rx="18" fill="#fffdf9"/>
    <rect x="39" y="132" width="34" height="34" rx="10" fill="#ffe5bb"/>
    <path d="M48 142h16v15H48z M51 139h10" fill="none" stroke="#b87928" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="84" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#425b6d">Sipariş</text>
    <text x="86" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718291">Adres • Paket</text>
    <text x="86" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718291">Ödeme seçimi</text>
  </g>

  <!-- arrow left to core -->
  <path d="M145 160 H178" fill="none" stroke="#7896aa" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="178,160 170,155 170,165" fill="#7896aa"/>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="181" y="72" width="187" height="177" rx="23" fill="url(#core)" stroke="#b9d7d6"/>
    <circle cx="274" cy="108" r="21" fill="#ffffff" opacity="0.75"/>
    <path d="M264 105h20M264 112h14M264 98h16" fill="none" stroke="#478594" stroke-width="2" stroke-linecap="round"/>
    <text x="274" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315e6c">Entegrasyon Katmanı</text>
    <rect x="203" y="157" width="142" height="27" rx="9" fill="#ffffff" opacity="0.84"/>
    <text x="274" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416572">Ortak veri modeli</text>
    <rect x="203" y="192" width="142" height="35" rx="10" fill="#f7fffb" opacity="0.9"/>
    <text x="274" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54727d">Teklif • Etiket</text>
    <text x="274" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54727d">Takip olayları</text>
  </g>

  <!-- fan out lines -->
  <path d="M369 137 C385 137 388 82 403 82" fill="none" stroke="#7395a6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="403,82 395,77 396,87" fill="#7395a6"/>
  <path d="M369 160 H403" fill="none" stroke="#7395a6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="403,160 395,155 395,165" fill="#7395a6"/>
  <path d="M369 185 C385 185 388 238 403 238" fill="none" stroke="#7395a6" stroke-width="2" stroke-linecap="round"/>
  <polygon points="403,238 396,233 395,243" fill="#7395a6"/>

  <!-- carriers -->
  <g filter="url(#soft)">
    <rect x="406" y="53" width="121" height="57" rx="15" fill="#f5e8ff"/>
    <circle cx="429" cy="81" r="12" fill="#d9b9f4"/>
    <path d="M423 83l5-6 7 5" fill="none" stroke="#78529b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="470" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5d4770">Taşıyıcı A</text>
    <text x="470" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#886b99">Adaptör</text>
  </g>
  <g filter="url(#soft)">
    <rect x="406" y="132" width="121" height="57" rx="15" fill="#ffe9dc"/>
    <circle cx="429" cy="160" r="12" fill="#ffc396"/>
    <path d="M423 163h12M426 157h7M426 169h7" fill="none" stroke="#a65c33" stroke-width="1.8" stroke-linecap="round"/>
    <text x="470" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#76503d">Taşıyıcı B</text>
    <text x="470" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a36c4a">Adaptör</text>
  </g>
  <g filter="url(#soft)">
    <rect x="406" y="210" width="121" height="57" rx="15" fill="#dff3ed"/>
    <circle cx="429" cy="238" r="12" fill="#aadfcf"/>
    <path d="M422 241h14M425 236h8" fill="none" stroke="#3d8272" stroke-width="1.8" stroke-linecap="round"/>
    <text x="470" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#42675e">Taşıyıcı C</text>
    <text x="470" y="251" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8f80">Adaptör</text>
  </g>

  <!-- Selection -->
  <path d="M528 82 C543 82 544 141 555 141" fill="none" stroke="#7896aa" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M528 160 H555" fill="none" stroke="#7896aa" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M528 238 C543 238 544 179 555 179" fill="none" stroke="#7896aa" stroke-width="1.8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="557" y="116" width="66" height="89" rx="18" fill="#ffffff" stroke="#d2e0e7"/>
    <circle cx="590" cy="141" r="15" fill="#dcecff"/>
    <path d="M583 141l5 5 10-11" fill="none" stroke="#487ca8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="590" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3e6078">Seçim</text>
    <text x="590" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758896">Puanlama</text>
  </g>

  <!-- Bottom notes -->
  <g>
    <rect x="35" y="271" width="160" height="28" rx="12" fill="#e8f2ff"/>
    <text x="115" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e718e">Paralel teklif toplama</text>
    <rect x="207" y="271" width="169" height="28" rx="12" fill="#fff0df"/>
    <text x="291" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8e6948">Tekilleştirme ve anahtar</text>
    <rect x="388" y="271" width="202" height="28" rx="12" fill="#e4f4eb"/>
    <text x="489" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a7d68">Webhook ve durum takibi</text>
  </g>
</svg>