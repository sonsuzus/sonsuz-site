<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#d1e8d9"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef7e0"/>
      <stop offset="100%" stop-color="#faecc9"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f5d0cc"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#3c4043">C++ İşlemci Çoklu Görev</text>

  <!-- Ana kavram kutusu -->
  <rect x="230" y="50" width="180" height="44" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#aecbfa" stroke-width="1.5"/>
  <text x="320" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a73e8">İşlemci Çoklu Görev</text>
  <text x="320" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5f6368">Çok Biçimlilik</text>

  <!-- Oklar -->
  <polygon points="320,94 314,104 326,104" fill="#5f6368"/>
  <line x1="320" y1="94" x2="320" y2="104" stroke="#5f6368" stroke-width="1.5"/>

  <!-- Alt kavramlar -->
  <rect x="60" y="110" width="200" height="50" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#a8dab5" stroke-width="1.5"/>
  <text x="160" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#188038">Sınıf Üyesi</text>
  <text x="160" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5f6368">Üye Fonksiyon</text>

  <rect x="380" y="110" width="200" height="50" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#fdd663" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e37400">Sınıf Dışı</text>
  <text x="480" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5f6368">Friend Fonksiyon</text>

  <!-- Oklar -->
  <polygon points="160,110 154,100 166,100" fill="#5f6368"/>
  <line x1="160" y1="104" x2="160" y2="110" stroke="#5f6368" stroke-width="1.5"/>

  <polygon points="480,110 474,100 486,100" fill="#5f6368"/>
  <line x1="480" y1="104" x2="480" y2="110" stroke="#5f6368" stroke-width="1.5"/>

  <!-- Alt detaylar -->
  <rect x="60" y="185" width="200" height="50" rx="10" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#aecbfa" stroke-width="1.5"/>
  <text x="160" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a73e8">operator Anahtar Kelimesi</text>
  <text x="160" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5f6368">İşlemci Fonksiyonu</text>

  <rect x="380" y="185" width="200" height="50" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f5a09a" stroke-width="1.5"/>
  <text x="480" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c5221f">Orijinal Fonksiyon</text>
  <text x="480" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5f6368">Korunur</text>

  <!-- Oklar -->
  <polygon points="160,185 154,175 166,175" fill="#5f6368"/>
  <line x1="160" y1="179" x2="160" y2="185" stroke="#5f6368" stroke-width="1.5"/>

  <polygon points="480,185 474,175 486,175" fill="#5f6368"/>
  <line x1="480" y1="179" x2="480" y2="185" stroke="#5f6368" stroke-width="1.5"/>

  <!-- Alt kavramlar arası bağlantı -->
  <line x1="260" y1="135" x2="380" y2="135" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9aa0a6">veya</text>

  <!-- Alt detaylar arası bağlantı -->
  <line x1="260" y1="210" x2="380" y2="210" stroke="#9aa0a6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9aa0a6">ve</text>

  <!-- En alt bilgi -->
  <rect x="170" y="260" width="300" height="40" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#dadce0" stroke-width="1" opacity="0.8"/>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3c4043">İşlemci Fonksiyonu Yapısı</text>
  <text x="320" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5f6368">veri-türü sınıf-adı::operator(parametreler)</text>
</svg>