<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="maviKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f2ff"/>
      <stop offset="100%" stop-color="#d9eaff"/>
    </linearGradient>
    <linearGradient id="morKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ecff"/>
      <stop offset="100%" stop-color="#e9ddff"/>
    </linearGradient>
    <linearGradient id="yesilKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f8ed"/>
      <stop offset="100%" stop-color="#d8f0e0"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c7185" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5c7185" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="64" cy="45" r="84" fill="#cfe9ff" opacity="0.35"/>
  <circle cx="587" cy="274" r="105" fill="#d8f0c9" opacity="0.35"/>
  <circle cx="444" cy="36" r="47" fill="#eee2ff" opacity="0.42"/>

  <text x="32" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3b536b">KONTROLLÜ DENEY DÖNGÜSÜ</text>
  <line x1="32" y1="42" x2="608" y2="42" stroke="#c9d9e3" stroke-width="1"/>

  <!-- Kullanıcı trafiği -->
  <g filter="url(#golge)">
    <rect x="32" y="112" width="116" height="94" rx="18" fill="#ffffff"/>
    <circle cx="61" cy="148" r="16" fill="#d9efff"/>
    <circle cx="56" cy="144" r="5" fill="#5d97bf"/>
    <path d="M48 157 Q56 149 64 157" fill="none" stroke="#5d97bf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="68" cy="154" r="4" fill="#8ab9d8"/>
    <text x="82" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36546b">Trafik</text>
    <text x="82" y="162" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668093">Rastgele</text>
    <text x="82" y="179" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668093">atama</text>
  </g>

  <!-- bağlantılar kaynak -> varyantlar -->
  <path d="M148 144 H167 V104 H181" fill="none" stroke="#7b9db4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="181,99 191,104 181,109" fill="#7b9db4"/>
  <path d="M148 174 H167 V224 H181" fill="none" stroke="#7b9db4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="181,219 191,224 181,229" fill="#7b9db4"/>

  <!-- A -->
  <g filter="url(#golge)">
    <rect x="192" y="69" width="130" height="74" rx="16" fill="url(#maviKart)"/>
    <rect x="205" y="82" width="28" height="28" rx="9" fill="#79b5df"/>
    <text x="219" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">A</text>
    <text x="244" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315f7e">Mevcut</text>
    <text x="244" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52748b">10.000 ziyaretçi</text>
    <text x="205" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315f7e">800 dönüşüm · %8,0</text>
  </g>

  <!-- B -->
  <g filter="url(#golge)">
    <rect x="192" y="187" width="130" height="74" rx="16" fill="url(#morKart)"/>
    <rect x="205" y="200" width="28" height="28" rx="9" fill="#a47cce"/>
    <text x="219" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">B</text>
    <text x="244" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#62477b">Yeni fikir</text>
    <text x="244" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78648c">10.000 ziyaretçi</text>
    <text x="205" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62477b">880 dönüşüm · %8,8</text>
  </g>

  <!-- A/B -> ölçüm -->
  <path d="M322 106 H341 V145 H355" fill="none" stroke="#7b9db4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="355,140 365,145 355,150" fill="#7b9db4"/>
  <path d="M322 224 H341 V175 H355" fill="none" stroke="#7b9db4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="355,170 365,175 355,180" fill="#7b9db4"/>

  <!-- İstatistik -->
  <g filter="url(#golge)">
    <rect x="366" y="102" width="130" height="124" rx="20" fill="#ffffff"/>
    <circle cx="431" cy="127" r="20" fill="#fff0c9"/>
    <path d="M420 133 L427 126 L433 130 L443 119" fill="none" stroke="#d49435" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="420" cy="133" r="2.5" fill="#d49435"/>
    <circle cx="427" cy="126" r="2.5" fill="#d49435"/>
    <circle cx="433" cy="130" r="2.5" fill="#d49435"/>
    <circle cx="443" cy="119" r="2.5" fill="#d49435"/>
    <text x="431" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41596d">İstatistiksel test</text>
    <line x1="389" y1="173" x2="473" y2="173" stroke="#dce6e9"/>
    <text x="398" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637d8d">Fark</text>
    <text x="466" y="193" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4a7896">+0,8 puan</text>
    <text x="398" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637d8d">p-değeri</text>
    <text x="466" y="211" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e9a69">0,032</text>
  </g>

  <!-- test -> karar -->
  <path d="M496 164 H515" fill="none" stroke="#7b9db4" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="515,159 525,164 515,169" fill="#7b9db4"/>

  <!-- karar -->
  <g filter="url(#golge)">
    <rect x="526" y="91" width="84" height="146" rx="20" fill="url(#yesilKart)"/>
    <circle cx="568" cy="120" r="20" fill="#ffffff" opacity="0.82"/>
    <path d="M558 120 L565 127 L579 112" fill="none" stroke="#58a574" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="568" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#396a4d">Karar</text>
    <text x="568" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#507660">Anlamlı</text>
    <rect x="542" y="190" width="52" height="25" rx="10" fill="#ffffff" opacity="0.84"/>
    <text x="568" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43845b">B kazanır</text>
  </g>

  <!-- Alt notlar -->
  <g filter="url(#hafifGolge)">
    <rect x="32" y="278" width="576" height="25" rx="12" fill="#ffffff" opacity="0.86"/>
  </g>
  <circle cx="50" cy="290" r="5" fill="#6aaad1"/>
  <text x="62" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6879">Önceden belirlenmiş örneklem</text>
  <circle cx="254" cy="290" r="5" fill="#a986ca"/>
  <text x="266" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6879">Birincil metrik</text>
  <circle cx="400" cy="290" r="5" fill="#63aa7d"/>
  <text x="412" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6879">Pratik etki ve güvenlik</text>
</svg>