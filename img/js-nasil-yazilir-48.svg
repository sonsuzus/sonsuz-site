<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fde8e8"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f8e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Javascript Nasıl Yazılır?</text>

  <!-- Ana akış: Soldan sağa -->
  
  <!-- 1. Adım: Kaynak Dosyalar -->
  <rect x="30" y="70" width="130" height="70" rx="10" fill="url(#boxGrad1)" stroke="#b0c4de" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="95" y="100" text-anchor="middle" font-weight="bold" fill="#34495e">Kaynak Dosyalar</text>
  <text x="95" y="118" text-anchor="middle" fill="#5d6d7e">index.html</text>
  <text x="95" y="133" text-anchor="middle" fill="#5d6d7e">script.js</text>

  <!-- 2. Adım: HTML İskeleti -->
  <rect x="200" y="60" width="120" height="55" rx="10" fill="url(#boxGrad2)" stroke="#e8b4b4" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="260" y="82" text-anchor="middle" font-weight="bold" fill="#922b21">HTML İskeleti</text>
  <text x="260" y="98" text-anchor="middle" fill="#7b241c">! + Tab (VSCode)</text>

  <!-- 3. Adım: Bağlantı -->
  <rect x="360" y="70" width="110" height="55" rx="10" fill="url(#boxGrad3)" stroke="#a9cfa9" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="415" y="92" text-anchor="middle" font-weight="bold" fill="#1e6b3a">Bağlantı</text>
  <text x="415" y="108" text-anchor="middle" fill="#2e7d32">script etiketi</text>

  <!-- 4. Adım: Çalıştırma -->
  <rect x="510" y="60" width="110" height="70" rx="10" fill="url(#boxGrad1)" stroke="#b0c4de" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="565" y="85" text-anchor="middle" font-weight="bold" fill="#34495e">Çalıştırma</text>
  <text x="565" y="103" text-anchor="middle" fill="#5d6d7e">Tarayıcıda</text>
  <text x="565" y="118" text-anchor="middle" fill="#5d6d7e">Aç</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Ok 1: Kaynak -> HTML -->
  <path d="M160 105 L190 105" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="195,105 187,100 187,110" fill="#5d6d7e"/>

  <!-- Ok 2: HTML -> Bağlantı -->
  <path d="M320 88 L350 88" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="355,88 347,83 347,93" fill="#5d6d7e"/>

  <!-- Ok 3: Bağlantı -> Çalıştırma -->
  <path d="M470 98 L500 98" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="505,98 497,93 497,103" fill="#5d6d7e"/>

  <!-- Alt bilgi: Derleyici seçenekleri -->
  <rect x="150" y="180" width="340" height="45" rx="8" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="200" text-anchor="middle" font-weight="bold" fill="#2c3e50">Derleyici Seçenekleri</text>
  <text x="320" y="216" text-anchor="middle" fill="#5d6d7e">Tarayıcı (yerleşik)  |  Node.js (bu derste kullanılmaz)</text>

  <!-- Alt bilgi: Vurgu -->
  <rect x="180" y="245" width="280" height="40" rx="20" fill="#eaf2f8" stroke="#aed6f1" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="320" y="265" text-anchor="middle" fill="#2c3e50" font-weight="bold">Bu derste Node.js kullanılmayacak</text>
  <text x="320" y="278" text-anchor="middle" fill="#5d6d7e">Her kod için HTML sayfası gerekli</text>

  <!-- Dekoratif çizgiler -->
  <line x1="30" y1="310" x2="610" y2="310" stroke="#d5dbdb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="320" y="318" text-anchor="middle" fill="#aab7b8" font-size="10">Javascript Ders Notu - Akış Şeması</text>
</svg>