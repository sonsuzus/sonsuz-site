<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#6BB5E8"/>
    </linearGradient>
    <linearGradient id="dec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ED6A5"/>
      <stop offset="100%" stop-color="#5BBE8A"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5B87A"/>
      <stop offset="100%" stop-color="#E89B54"/>
    </linearGradient>
    <linearGradient id="oct" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B39DDB"/>
      <stop offset="100%" stop-color="#9575CD"/>
    </linearGradient>
    <linearGradient id="limit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F28B82"/>
      <stop offset="100%" stop-color="#E0605A"/>
    </linearGradient>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="30" y="15" width="580" height="36" rx="10" fill="url(#header)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="39" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PHP Integer Veri Türü</text>

  <!-- Merkez: Integer -->
  <rect x="255" y="75" width="130" height="40" rx="20" fill="#5C6BC0" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Integer</text>

  <!-- Alt küme: Tamsayılar -->
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#555" font-style="italic">Z = {..., -2, -1, 0, 1, 2, ...}</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Merkezden Dec'e -->
  <path d="M 285 115 L 170 160" stroke="#5BBE8A" stroke-width="2" fill="none"/>
  <polygon points="170,160 180,155 175,165" fill="#5BBE8A"/>

  <!-- Merkezden Hex'e -->
  <path d="M 320 115 L 320 160" stroke="#E89B54" stroke-width="2" fill="none"/>
  <polygon points="320,160 315,150 325,150" fill="#E89B54"/>

  <!-- Merkezden Oct'a -->
  <path d="M 355 115 L 470 160" stroke="#9575CD" stroke-width="2" fill="none"/>
  <polygon points="470,160 460,155 465,165" fill="#9575CD"/>

  <!-- Dec kutusu -->
  <rect x="80" y="165" width="180" height="55" rx="8" fill="url(#dec)" filter="url(#shadow)" opacity="0.95"/>
  <text x="170" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">10'luk (Decimal)</text>
  <text x="170" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff" opacity="0.9">0-9 arası değerler</text>

  <!-- Hex kutusu -->
  <rect x="230" y="165" width="180" height="55" rx="8" fill="url(#hex)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">16'lık (Hex)</text>
  <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff" opacity="0.9">0-9 ve A-F arası</text>

  <!-- Oct kutusu -->
  <rect x="380" y="165" width="180" height="55" rx="8" fill="url(#oct)" filter="url(#shadow)" opacity="0.95"/>
  <text x="470" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">8'lik (Octal)</text>
  <text x="470" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff" opacity="0.9">0-7 arası değerler</text>

  <!-- Örnek kodlar -->
  <rect x="30" y="235" width="280" height="70" rx="8" fill="#fff" filter="url(#shadow)" opacity="0.9" stroke="#ddd" stroke-width="1"/>
  <text x="45" y="255" font-family="Consolas, monospace" font-size="10" fill="#333">$deg = 127;   // 10'luk</text>
  <text x="45" y="270" font-family="Consolas, monospace" font-size="10" fill="#333">$deg = 0125;  // 8'lik</text>
  <text x="45" y="285" font-family="Consolas, monospace" font-size="10" fill="#333">$deg = 0xF8;  // 16'lık</text>

  <!-- Limit kutusu -->
  <rect x="330" y="235" width="280" height="70" rx="8" fill="url(#limit)" filter="url(#shadow)" opacity="0.95"/>
  <text x="470" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#fff">Sistem Sınırları</text>
  <text x="470" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff" opacity="0.95">32-bit: 2.147.483.647</text>
  <text x="470" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff" opacity="0.95">64-bit: ~9E18</text>

  <!-- Alt not -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#888">PHP_INT_SIZE ve PHP_INT_MAX sabitleri ile kontrol edilir</text>
</svg>