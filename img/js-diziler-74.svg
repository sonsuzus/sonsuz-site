<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f3f8ef;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d1ecf9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8efd0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3e2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fde8c8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e8fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0d4f7;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">JavaScript Diziler</text>

  <!-- Merkez kutu -->
  <rect x="245" y="55" width="150" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#7fb3d3" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">Dizi (Array)</text>

  <!-- Oklar (merkezden dışa) -->
  <!-- Sol üst ok -->
  <path d="M245,75 L170,75" stroke="#5d8aa8" stroke-width="2" fill="none"/>
  <polygon points="170,75 182,69 182,81" fill="#5d8aa8"/>

  <!-- Sağ üst ok -->
  <path d="M395,75 L470,75" stroke="#5d8aa8" stroke-width="2" fill="none"/>
  <polygon points="470,75 458,69 458,81" fill="#5d8aa8"/>

  <!-- Sol alt ok -->
  <path d="M260,100 L180,155" stroke="#5d8aa8" stroke-width="2" fill="none"/>
  <polygon points="180,155 190,146 176,143" fill="#5d8aa8"/>

  <!-- Sağ alt ok -->
  <path d="M380,100 L460,155" stroke="#5d8aa8" stroke-width="2" fill="none"/>
  <polygon points="460,155 450,146 464,143" fill="#5d8aa8"/>

  <!-- Alt ok -->
  <path d="M320,100 L320,155" stroke="#5d8aa8" stroke-width="2" fill="none"/>
  <polygon points="320,155 314,143 326,143" fill="#5d8aa8"/>

  <!-- Sol üst kutu: Tanımlama -->
  <rect x="30" y="50" width="130" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#82c785" stroke-width="1.5"/>
  <text x="95" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6b2e">Tanımlama</text>
  <text x="95" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d8a3e">var dizi = []</text>

  <!-- Sağ üst kutu: Erişim -->
  <rect x="480" y="50" width="130" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#82c785" stroke-width="1.5"/>
  <text x="545" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6b2e">Erişim</text>
  <text x="545" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d8a3e">dizi[0]</text>

  <!-- Sol alt kutu: String -->
  <rect x="30" y="160" width="130" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#d4a35c" stroke-width="1.5"/>
  <text x="95" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d5a1e">String</text>
  <text x="95" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9a6e24">split(",")</text>
  <text x="95" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b8860b">ile diziye çevirme</text>

  <!-- Sağ alt kutu: Metotlar -->
  <rect x="480" y="160" width="130" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#9b8ad4" stroke-width="1.5"/>
  <text x="545" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3b7a">Metotlar</text>
  <text x="545" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5e4d99">push, pop, map</text>
  <text x="545" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c5aa8">ve diğerleri</text>

  <!-- Alt kutu: Örnek -->
  <rect x="245" y="160" width="150" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#7fb3d3" stroke-width="1.5"/>
  <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Örnek Kullanım</text>
  <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c6e91">isimler + yaslar</text>
  <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3d7ea6">indeks ile birleştirme</text>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d" opacity="0.8">Diziler: birden fazla veriyi tek değişkende saklama</text>
</svg>