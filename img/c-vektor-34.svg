<svg width="640" height="320" viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f5f9ff"/>
    <stop offset="100%" stop-color="#f3f8ef"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#64748b" flood-opacity="0.14"/>
  </filter>
  <filter id="softShadow2" x="-15%" y="-15%" width="130%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748b" flood-opacity="0.12"/>
  </filter>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
  </marker>
</defs>
<rect x="0" y="0" width="640" height="320" rx="18" fill="url(#bgGrad)"/>

<!-- Soldaki tanımlama blokları -->
<g filter="url(#softShadow)">
  <rect x="24" y="22" width="132" height="56" rx="14" fill="#dbeafe"/>
</g>
