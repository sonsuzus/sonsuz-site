<path d="M 156 50 C 168 50, 172 42, 184 42" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M 156 118 C 168 118, 172 108, 184 110" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
