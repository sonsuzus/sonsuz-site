<path d="M 444 50 C 458 50, 462 44, 472 44" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M 444 108 C 458 108, 462 103, 472 103" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M 444 170 C 458 170, 462 165, 472 165" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
<path d="M 444 200 C 458 200, 462 224, 472 224" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

