<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#c8def5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f4e7"/>
      <stop offset="1" stop-color="#cfe8d6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0dc"/>
      <stop offset="1" stop-color="#f8ddbc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#718096" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#718096"/>
    </marker>
    <style>
      text { font-family:"Segoe UI",Tahoma,sans-serif; font-size:12px; fill:#334155; }
      .title { font-size:15px; font-weight:600; fill:#26364a; }
      .bold { font-weight:600; }
      .small { font-size:11px; }
      .line { fill:none; stroke:#718096; stroke-width:2; marker-end:url(#arrow); }
      .box { stroke:#d5dee8; stroke-width:1; }
    </style>
  </defs>

  <rect width="640" height="320" rx="18" fill="url(#bg)"/>

<text x="320" y="28" text-anchor="middle" class="title">Segment Ağacı ile Inversion Sayma</text>

  <!-- Input -->

  <rect x="25" y="68" width="145" height="72" rx="16" fill="#fff" class="box" filter="url(#shadow)"/>
  <text x="97" y="91" text-anchor="middle" class="bold">Dizi</text>
  <text x="97" y="115" text-anchor="middle">5   3   4   1   2</text>
  <text x="97" y="132" text-anchor="middle" class="small">sıralı olmayan çiftler</text>

  <!-- Compression -->

  <rect x="205" y="52" width="170" height="105" rx="18" fill="url(#blue)" class="box" filter="url(#shadow)"/>
  <text x="290" y="76" text-anchor="middle" class="bold">Değer Sıkıştırma</text>
  <text x="290" y="99" text-anchor="middle" class="small">sırala → benzersizleştir</text>
  <text x="290" y="124" text-anchor="middle" class="bold">1   2   3   4   5</text>
  <text x="290" y="144" text-anchor="middle" class="small">ikili arama</text>

  <path d="M170 104 L205 104" class="line"/>

  <!-- Segment tree -->

  <rect x="410" y="52" width="205" height="215" rx="18" fill="#fff" class="box" filter="url(#shadow)"/>
  <text x="512" y="76" text-anchor="middle" class="bold">Segment Ağacı</text>

  <!-- Tree -->

  <rect x="486" y="89" width="52" height="27" rx="8" fill="url(#green)" class="box"/>
  <text x="512" y="107" text-anchor="middle">5</text>

  <rect x="446" y="130" width="52" height="27" rx="8" fill="#edf5ff" class="box"/>
  <rect x="526" y="130" width="52" height="27" rx="8" fill="#edf5ff" class="box"/>
  <text x="472" y="148" text-anchor="middle">2</text>
  <text x="552" y="148" text-anchor="middle">3</text>

  <rect x="425" y="171" width="48" height="27" rx="8" fill="#f3f7fb" class="box"/>
  <rect x="478" y="171" width="48" height="27" rx="8" fill="#f3f7fb" class="box"/>
  <rect x="531" y="171" width="48" height="27" rx="8" fill="#f3f7fb" class="box"/>
  <text x="449" y="189" text-anchor="middle">1</text>
  <text x="502" y="189" text-anchor="middle">1</text>
  <text x="555" y="189" text-anchor="middle">1</text>

<path d="M512 116 L472 130 M512 116 L552 130 M472 157 L449 171 M472 157 L502 171 M552 157 L555 171" 
     fill="none" stroke="#91a1b3" stroke-width="1.5"/>

<text x="512" y="218" text-anchor="middle" class="small">aralık sorgusu</text> <rect x="438" y="230" width="148" height="23" rx="10" fill="url(#orange)"/> <text x="512" y="246" text-anchor="middle" class="small">büyük elemanları say</text>

  <path d="M375 104 L410 104" class="line"/>

  <!-- Processing -->

  <rect x="25" y="175" width="350" height="92" rx="18" fill="#fff" class="box" filter="url(#shadow)"/>
  <text x="200" y="199" text-anchor="middle" class="bold">Her eleman için</text>

  <circle cx="65" cy="229" r="19" fill="url(#blue)"/>
  <text x="65" y="233" text-anchor="middle" class="bold">1</text>
  <text x="92" y="233">Büyükleri sorgula</text>

  <path d="M170 229 L192 229" class="line"/>

  <circle cx="213" cy="229" r="19" fill="url(#green)"/>
  <text x="213" y="233" text-anchor="middle" class="bold">2</text>
  <text x="240" y="233">Inversion'a ekle</text>

  <path d="M312 229 L334 229" class="line"/>

  <circle cx="350" cy="229" r="19" fill="url(#orange)"/>
  <text x="350" y="233" text-anchor="middle" class="bold">3</text>

  <!-- Result -->

  <rect x="185" y="285" width="270" height="25" rx="12" fill="#e7f1eb" class="box"/>
  <text x="320" y="302" text-anchor="middle" class="bold">Toplam inversion = cevap</text>
</svg>
