  <path d="M464 207 V232 Q464 238 471 238 H479 Q486 238 486 245" fill="none" stroke="#769bac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="486,252 481,243 491,243" fill="#769bac"/>
