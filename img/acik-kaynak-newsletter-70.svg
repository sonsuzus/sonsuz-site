<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="listGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeeff"/>
      <stop offset="1" stop-color="#c7ddf8"/>
    </linearGradient>
    <linearGradient id="mauticGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee0ff"/>
      <stop offset="1" stop-color="#dcc8f2"/>
    </linearGradient>
    <linearGradient id="phpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#def2d8"/>
      <stop offset="1" stop-color="#c8e5c2"/>
    </linearGradient>
    <linearGradient id="deliveryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1cd"/>
      <stop offset="1" stop-color="#f8dca0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a0" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#607788" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="590" cy="38" r="84" fill="#dff2ee" opacity="0.55"/>
  <circle cx="46" cy="295" r="92" fill="#e4edff" opacity="0.65"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566b">Açık Kaynak Newsletter Seçimi</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718396">Araç karakteri → gönderim altyapısı</text>

  <!-- Connections -->
  <path d="M218 108 C263 108 262 145 309 145" fill="none" stroke="#88a8bd" stroke-width="2"/>
  <polygon points="309,145 299,140 301,150" fill="#88a8bd"/>
  <path d="M218 183 C257 183 264 170 309 170" fill="none" stroke="#a18ab8" stroke-width="2"/>
  <polygon points="309,170 299,165 301,175" fill="#a18ab8"/>
  <path d="M218 258 C263 258 264 195 309 195" fill="none" stroke="#83ab88" stroke-width="2"/>
  <polygon points="309,195 299,190 301,200" fill="#83ab88"/>

  <path d="M435 170 L472 170" fill="none" stroke="#d09d48" stroke-width="2.5"/>
  <polygon points="472,170 461,164 461,176" fill="#d09d48"/>

  <!-- Listmonk -->
  <g filter="url(#shadow)">
    <rect x="42" y="72" width="176" height="73" rx="16" fill="url(#listGrad)" stroke="#b6d1e8"/>
  </g>
  <rect x="57" y="87" width="34" height="34" rx="10" fill="#f7fbff" filter="url(#smallShadow)"/>
  <path d="M67 96 h14 M67 102 h14 M67 108 h9" stroke="#4e86ad" stroke-width="2" stroke-linecap="round"/>
  <text x="104" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d7f">Listmonk</text>
  <text x="104" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52738c">Hız ve sadelik</text>
  <text x="57" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52738c">Go · PostgreSQL · düşük kaynak</text>

  <!-- Mautic -->
  <g filter="url(#shadow)">
    <rect x="42" y="147" width="176" height="73" rx="16" fill="url(#mauticGrad)" stroke="#d0b7e7"/>
  </g>
  <rect x="57" y="162" width="34" height="34" rx="10" fill="#fcf9ff" filter="url(#smallShadow)"/>
  <circle cx="68" cy="172" r="3" fill="#8061a1"/>
  <circle cx="80" cy="185" r="3" fill="#8061a1"/>
  <path d="M70 174 L77 182 M68 176 V186 M70 186 H77" fill="none" stroke="#8061a1" stroke-width="1.7" stroke-linecap="round"/>
  <text x="104" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#684685">Mautic</text>
  <text x="104" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b628f">Güçlü otomasyon</text>
  <text x="57" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b628f">PHP · davranış akışları</text>

  <!-- phpList -->
  <g filter="url(#shadow)">
    <rect x="42" y="222" width="176" height="73" rx="16" fill="url(#phpGrad)" stroke="#b8d8b1"/>
  </g>
  <rect x="57" y="237" width="34" height="34" rx="10" fill="#fbfff9" filter="url(#smallShadow)"/>
  <circle cx="69" cy="247" r="3.5" fill="#5c9560"/>
  <circle cx="80" cy="247" r="3.5" fill="#5c9560"/>
  <path d="M63 258 C63 253 75 253 75 258 M74 258 C74 253 86 253 86 258" fill="none" stroke="#5c9560" stroke-width="1.8" stroke-linecap="round"/>
  <text x="104" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#46754b">phpList</text>
  <text x="104" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8161">Klasik liste yönetimi</text>
  <text x="57" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8161">PHP · uyumlu hosting</text>

  <!-- Central campaign -->
  <g filter="url(#shadow)">
    <rect x="309" y="112" width="126" height="116" rx="22" fill="#ffffff" stroke="#d7e3e7"/>
  </g>
  <circle cx="372" cy="147" r="22" fill="#e6f3f5"/>
  <path d="M359 141 L372 150 L385 141 V157 H359 Z" fill="none" stroke="#4d91a1" stroke-width="2" stroke-linejoin="round"/>
  <text x="372" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405e70">Kampanya</text>
  <text x="372" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e8490">Liste ve içerik</text>

  <!-- Delivery -->
  <g filter="url(#shadow)">
    <rect x="472" y="112" width="130" height="116" rx="22" fill="url(#deliveryGrad)" stroke="#ecd096"/>
  </g>
  <rect x="491" y="130" width="92" height="28" rx="10" fill="#fffaf0" opacity="0.9"/>
  <text x="537" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#936b2a">SMTP Servisi</text>
  <path d="M500 177 h74" stroke="#bd9147" stroke-width="2" stroke-linecap="round"/>
  <path d="M500 188 h52" stroke="#bd9147" stroke-width="2" stroke-linecap="round"/>
  <text x="537" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#866d40">Teslimat ve ölçüm</text>

  <!-- Bottom indicators -->
  <g filter="url(#smallShadow)">
    <rect x="278" y="258" width="84" height="30" rx="15" fill="#ffffff"/>
    <rect x="372" y="258" width="84" height="30" rx="15" fill="#ffffff"/>
    <rect x="466" y="258" width="108" height="30" rx="15" fill="#ffffff"/>
  </g>
  <text x="320" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527082">Performans</text>
  <text x="414" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705982">Otomasyon</text>
  <text x="520" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708062">Sürdürülebilirlik</text>
</svg>