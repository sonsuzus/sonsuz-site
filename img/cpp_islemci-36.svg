<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="220" y="15" width="200" height="36" rx="18" fill="#4a6fa5" filter="url(#shadow)"/>
  <text x="320" y="38" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">C++ İşlemciler</text>

  <!-- Merkez kavram -->
  <rect x="255" y="75" width="130" height="40" rx="20" fill="#6c8ebf" filter="url(#shadow)"/>
  <text x="320" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">İfade</text>

  <!-- Bağlantı çizgileri -->
  <line x1="320" y1="115" x2="320" y2="140" stroke="#7a8b9e" stroke-width="1.5"/>
  <line x1="320" y1="140" x2="160" y2="140" stroke="#7a8b9e" stroke-width="1.5"/>
  <line x1="320" y1="140" x2="480" y2="140" stroke="#7a8b9e" stroke-width="1.5"/>

  <!-- Ok uçları -->
  <polygon points="155,140 165,135 165,145" fill="#7a8b9e"/>
  <polygon points="485,140 475,135 475,145" fill="#7a8b9e"/>

  <!-- Sol grup: Aritmetik -->
  <rect x="40" y="120" width="240" height="180" rx="10" fill="#e8f0fe" stroke="#b0c4de" stroke-width="1.2" filter="url(#shadowLight)"/>
  <rect x="40" y="120" width="240" height="32" rx="10" fill="#5b8c5a"/>
  <rect x="40" y="140" width="240" height="12" fill="#5b8c5a"/>
  <text x="160" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Aritmetik İşlemciler</text>

  <!-- Aritmetik operatörler -->
  <rect x="60" y="165" width="90" height="26" rx="6" fill="#ffffff" stroke="#a8c0a0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="105" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4a2d">+ Toplama</text>

  <rect x="170" y="165" width="90" height="26" rx="6" fill="#ffffff" stroke="#a8c0a0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="215" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4a2d">- Çıkarma</text>

  <rect x="60" y="200" width="90" height="26" rx="6" fill="#ffffff" stroke="#a8c0a0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="105" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4a2d">* Çarpma</text>

  <rect x="170" y="200" width="90" height="26" rx="6" fill="#ffffff" stroke="#a8c0a0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="215" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4a2d">/ Bölme</text>

  <rect x="115" y="235" width="90" height="26" rx="6" fill="#fff3d6" stroke="#d4b86a" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="160" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b4d1a">% Kalan</text>

  <!-- Öncelik notu -->
  <rect x="60" y="272" width="200" height="20" rx="4" fill="#f0f4e8" stroke="#c0d0b0" stroke-width="0.8"/>
  <text x="160" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a3a">Öncelik sırası uygulanır</text>

  <!-- Sağ grup: Öncelik ve Parantez -->
  <rect x="360" y="120" width="240" height="180" rx="10" fill="#fef6e8" stroke="#e0c8a0" stroke-width="1.2" filter="url(#shadowLight)"/>
  <rect x="360" y="120" width="240" height="32" rx="10" fill="#c98a3d"/>
  <rect x="360" y="140" width="240" height="12" fill="#c98a3d"/>
  <text x="480" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Öncelik Kuralları</text>

  <rect x="380" y="165" width="200" height="40" rx="6" fill="#ffffff" stroke="#d4b86a" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="480" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a4a2a">Matematikteki öncelik</text>
  <text x="480" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a7a5a">sırasıyla aynıdır</text>

  <rect x="380" y="215" width="200" height="40" rx="6" fill="#ffffff" stroke="#d4b86a" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="480" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a4a2a">Parantez ile öncelik</text>
  <text x="480" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a7a5a">değiştirilebilir</text>

  <!-- Alt bağlantı -->
  <line x1="160" y1="300" x2="160" y2="310" stroke="#7a8b9e" stroke-width="1"/>
  <line x1="160" y1="310" x2="480" y2="310" stroke="#7a8b9e" stroke-width="1"/>
  <line x1="480" y1="310" x2="480" y2="300" stroke="#7a8b9e" stroke-width="1"/>
  <polygon points="480,295 475,303 485,303" fill="#7a8b9e"/>

  <!-- Alt bilgi -->
  <rect x="200" y="295" width="240" height="20" rx="10" fill="#d0e0d0" filter="url(#shadowLight)"/>
  <text x="320" y="309" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a3a">İşlemci grupları sınıflandırılır</text>
</svg>