<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez Python çekirdeği -->
  <circle cx="320" cy="160" r="52" fill="#4a90d9" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Python</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e0edff">14 Veri Türü</text>

  <!-- 6 grup etrafa yayılmış -->
  <!-- Grup 1: Sayısal -->
  <rect x="80" y="40" width="130" height="70" rx="10" fill="#ffd9a0" opacity="0.9" filter="url(#shadow)"/>
  <text x="145" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a3e00">Sayısal</text>
  <text x="145" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a3e00">int, float</text>
  <text x="145" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a3e00">complex, bool</text>

  <!-- Grup 2: Metin -->
  <rect x="430" y="40" width="130" height="70" rx="10" fill="#b8e0c0" opacity="0.9" filter="url(#shadow)"/>
  <text x="495" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a2a">Metin</text>
  <text x="495" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a4a2a">str</text>
  <text x="495" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a4a2a">karakter dizisi</text>

  <!-- Grup 3: Sıralama -->
  <rect x="80" y="210" width="130" height="70" rx="10" fill="#c0d8f0" opacity="0.9" filter="url(#shadow)"/>
  <text x="145" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a5a">Sıralama</text>
  <text x="145" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a3a5a">list, tuple</text>
  <text x="145" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a3a5a">range</text>

  <!-- Grup 4: Eşleme -->
  <rect x="430" y="210" width="130" height="70" rx="10" fill="#e0c8e8" opacity="0.9" filter="url(#shadow)"/>
  <text x="495" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a1a5a">Eşleme</text>
  <text x="495" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a1a5a">dict</text>
  <text x="495" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a1a5a">anahtar-değer</text>

  <!-- Grup 5: Küme -->
  <rect x="255" y="20" width="130" height="55" rx="10" fill="#f0d0b0" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="42" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a2a0a">Küme</text>
  <text x="320" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a2a0a">set, frozenset</text>

  <!-- Grup 6: Diğer -->
  <rect x="255" y="245" width="130" height="55" rx="10" fill="#d0e8d8" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a3a">Diğer</text>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a4a3a">None, bool</text>

  <!-- Bağlantı çizgileri ve oklar (manuel) -->
  <!-- Sayısal -->
  <path d="M 270 140 L 200 100" stroke="#8a6a3a" stroke-width="2" fill="none"/>
  <polygon points="200 100, 210 96, 206 104" fill="#8a6a3a"/>

  <!-- Metin -->
  <path d="M 370 140 L 440 100" stroke="#2a6a3a" stroke-width="2" fill="none"/>
  <polygon points="440 100, 430 96, 434 104" fill="#2a6a3a"/>

  <!-- Sıralama -->
  <path d="M 270 180 L 200 220" stroke="#2a5a8a" stroke-width="2" fill="none"/>
  <polygon points="200 220, 210 216, 206 224" fill="#2a5a8a"/>

  <!-- Eşleme -->
  <path d="M 370 180 L 440 220" stroke="#5a2a8a" stroke-width="2" fill="none"/>
  <polygon points="440 220, 430 216, 434 224" fill="#5a2a8a"/>

  <!-- Küme -->
  <path d="M 320 108 L 320 80" stroke="#8a4a2a" stroke-width="2" fill="none"/>
  <polygon points="320 80, 316 90, 324 90" fill="#8a4a2a"/>

  <!-- Diğer -->
  <path d="M 320 212 L 320 240" stroke="#2a6a5a" stroke-width="2" fill="none"/>
  <polygon points="320 240, 316 230, 324 230" fill="#2a6a5a"/>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#667788">6 grup altında toplanan 14 ön tanımlı veri türü</text>
</svg>