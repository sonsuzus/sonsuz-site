<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="mainCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="collision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7d8"/>
      <stop offset="100%" stop-color="#fff4d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7d9ab3" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6c8da6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="67" cy="38" r="58" fill="#dceeff" opacity="0.55"/>
  <circle cx="590" cy="282" r="78" fill="#dff3dd" opacity="0.5"/>
  <circle cx="504" cy="31" r="34" fill="#fff2cf" opacity="0.48"/>

