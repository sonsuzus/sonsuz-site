  <text x="559" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#92735b">garanti</text>

  <rect x="213" y="291" width="215" height="22" rx="11" fill="#dceee2"/>
  <text x="242" y="306" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4a725c">N &gt; K  →  en az bir tekrar</text>
