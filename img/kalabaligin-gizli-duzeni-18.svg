  <text x="431" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47705b">Yuva 2</text>
  <text x="355" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806633">Yuva 3</text>
  <text x="431" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a5639">2 nesne</text>
  <text x="393" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66517d">Yuva 5</text>

