  <text x="34" y="50" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668196">Nesne sayısı yuva sayısını aşarsa tekrar kaçınılmazdır</text>

  <rect x="28" y="76" width="148" height="205" rx="20" fill="url(#mainCard)" filter="url(#shadow)"/>
  <text x="48" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38556c">6 nesne</text>
  <text x="48" y="121" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71899a">Güvercinler</text>

