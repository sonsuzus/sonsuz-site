<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dce9ff"/>
      <stop offset="100%" stop-color="#d9f2e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7d99ad" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7d99ad" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M25 276 C125 238 160 292 255 263 S430 226 615 274" fill="none" stroke="#cce7dc" stroke-width="2" opacity="0.65"/>
  <path d="M31 62 C117 35 157 77 250 53 S434 25 605 62" fill="none" stroke="#d2e2f5" stroke-width="2" opacity="0.7"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#416177">Momentum Gözlemcisi</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7990a0">Dış kuvvet tahmini akışı</text>

  <!-- Input cards -->
  <g filter="url(#soft)">
    <rect x="34" y="92" width="125" height="49" rx="13" fill="#ffffff" stroke="#d6e5ed"/>
    <circle cx="57" cy="116" r="12" fill="#dbeaff"/>
    <path d="M52 116 L56 111 L61 113 L62 120 L56 122 L52 118 Z" fill="none" stroke="#5c83a3" stroke-width="1.5"/>
    <text x="76" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#38576b">Eklem ölçümü</text>
    <text x="76" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708998">q ve hız</text>
  </g>
  <g filter="url(#soft)">
    <rect x="34" y="166" width="125" height="49" rx="13" fill="#ffffff" stroke="#d6e5ed"/>
    <circle cx="57" cy="190" r="12" fill="#fff0d7"/>
    <path d="M51 193 L55 187 L60 187 L64 193" fill="none" stroke="#b47b35" stroke-width="1.6"/>
    <path d="M57 181 L57 191" stroke="#b47b35" stroke-width="1.6"/>
    <text x="76" y="186" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#38576b">Motor torku</text>
    <text x="76" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708998">τm</text>
  </g>

  <!-- arrows input -->
  <path d="M160 116 H200" fill="none" stroke="#89a9bb" stroke-width="2"/>
  <polygon points="207,116 198,111 198,121" fill="#89a9bb"/>
  <path d="M160 190 H187 V151 H200" fill="none" stroke="#89a9bb" stroke-width="2"/>
  <polygon points="207,151 198,146 198,156" fill="#89a9bb"/>

  <!-- Central observer -->
  <g filter="url(#shadow)">
    <rect x="207" y="83" width="201" height="143" rx="22" fill="url(#core)" stroke="#bfd9d7"/>
    <circle cx="307" cy="119" r="25" fill="#ffffff" opacity="0.9"/>
    <path d="M292 122 C298 108 316 107 322 120 C326 130 318 140 307 140 C297 140 290 132 292 122Z" fill="#80b9c3"/>
    <path d="M299 123 C303 116 312 116 316 123" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="303" cy="127" r="2" fill="#ffffff"/>
    <circle cx="313" cy="127" r="2" fill="#ffffff"/>
    <text x="307" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#315a66">Momentum Gözlemcisi</text>
    <text x="307" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587785">p = M(q) · hız</text>
    <path d="M244 195 H370" stroke="#b6d4d2" stroke-width="1"/>
    <text x="307" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#49717a">Model + integral geri besleme</text>
  </g>

  <!-- feedback -->
  <path d="M405 192 C432 192 431 246 371 246 H263 C228 246 222 229 222 220" fill="none" stroke="#8bb8ae" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="222,213 217,222 227,222" fill="#8bb8ae"/>
  <text x="390" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668b83">geri besleme</text>

  <!-- residual -->
  <path d="M409 154 H447" fill="none" stroke="#769db1" stroke-width="2.5"/>
  <polygon points="454,154 445,149 445,159" fill="#769db1"/>
  <g filter="url(#soft)">
    <rect x="454" y="126" width="83" height="56" rx="15" fill="#fce9ec" stroke="#efd0d6"/>
    <text x="495" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#9a4e60">Artık</text>
    <text x="495" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a66a77">r ≈ τext</text>
  </g>

  <!-- split outputs -->
  <path d="M538 145 H556 V92 H570" fill="none" stroke="#b18487" stroke-width="2"/>
  <polygon points="577,92 568,87 568,97" fill="#b18487"/>
  <path d="M538 164 H556 V225 H570" fill="none" stroke="#b18487" stroke-width="2"/>
  <polygon points="577,225 568,220 568,230" fill="#b18487"/>

  <g filter="url(#soft)">
    <rect x="577" y="64" width="55" height="57" rx="13" fill="#fff8e9" stroke="#efdfbd"/>
    <path d="M594 81 L606 81 L610 91 L604 101 L593 98 L590 89 Z" fill="none" stroke="#b58b43" stroke-width="1.6"/>
    <path d="M601 84 V97 M595 90 H607" stroke="#b58b43" stroke-width="1.3"/>
    <text x="604" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806235">Kuvvet</text>
  </g>

  <g filter="url(#soft)">
    <rect x="577" y="197" width="55" height="57" rx="13" fill="#f2e8fa" stroke="#dfccea"/>
    <path d="M604 211 L614 230 L594 230 Z" fill="#c58aca" opacity="0.75"/>
    <path d="M604 216 V224" stroke="#ffffff" stroke-width="2"/>
    <circle cx="604" cy="227" r="1.3" fill="#ffffff"/>
    <text x="604" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76517e">Temas</text>
  </g>

  <!-- small formula chips -->
  <g opacity="0.9">
    <rect x="184" y="272" width="111" height="25" rx="12" fill="#e6f1ff"/>
    <text x="239" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537694">İvme ölçmeden</text>
    <rect x="307" y="272" width="117" height="25" rx="12" fill="#e8f5e7"/>
    <text x="365" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587b5e">Eşik ve filtre</text>
  </g>
</svg>