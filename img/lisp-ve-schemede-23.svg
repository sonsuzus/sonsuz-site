<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e7ff"/>
      <stop offset="100%" stop-color="#c9f0e1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52708a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52708a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="83" cy="47" r="56" fill="#dceeff" opacity="0.48"/>
  <circle cx="571" cy="274" r="72" fill="#dff3de" opacity="0.48"/>
  <circle cx="334" cy="160" r="112" fill="#ffffff" opacity="0.35"/>

  <!-- bağlantılar -->
  <path d="M196 121 C226 121 235 132 250 140" fill="none" stroke="#8aa7bb" stroke-width="2"/>
  <polygon points="250,140 241,136 244,146" fill="#8aa7bb"/>
  <path d="M390 140 C407 132 418 121 444 121" fill="none" stroke="#8aa7bb" stroke-width="2"/>
  <polygon points="444,121 434,117 437,127" fill="#8aa7bb"/>
  <path d="M320 206 L320 235" fill="none" stroke="#8aa7bb" stroke-width="2"/>
  <polygon points="320,235 315,225 325,225" fill="#8aa7bb"/>
  <path d="M163 171 C201 193 224 204 258 221" fill="none" stroke="#b0a4cc" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M477 171 C440 193 416 204 382 221" fill="none" stroke="#b0a4cc" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- sol kart -->
  <g filter="url(#soft)">
    <rect x="38" y="77" width="158" height="96" rx="18" fill="#fff8e6"/>
    <rect x="38" y="77" width="158" height="27" rx="18" fill="#f9e7b9"/>
    <path d="M38 93 H196" stroke="#efd79a"/>
  </g>
  <text x="117" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6f5b29">Alıntılanmış Liste</text>
  <rect x="54" y="117" width="126" height="38" rx="10" fill="#ffffff" opacity="0.82"/>
  <text x="117" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5f6470">'(+ 2 3)</text>
  <circle cx="58" cy="163" r="4" fill="#e2b75b"/>
  <text x="69" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#69707b">Üzerinde dolaş</text>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <rect x="250" y="91" width="140" height="115" rx="25" fill="url(#core)" stroke="#b6d9d5"/>
    <circle cx="320" cy="130" r="25" fill="#ffffff" opacity="0.86"/>
    <path d="M306 124 Q320 113 334 124" fill="none" stroke="#4e8190" stroke-width="2"/>
    <path d="M306 136 Q320 147 334 136" fill="none" stroke="#4e8190" stroke-width="2"/>
    <circle cx="313" cy="128" r="2.5" fill="#4e8190"/>
    <circle cx="327" cy="128" r="2.5" fill="#4e8190"/>
  </g>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d67">KOD = VERİ</text>
  <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52747b">Homoiconicity</text>

  <!-- sağ kart -->
  <g filter="url(#soft)">
    <rect x="444" y="77" width="158" height="96" rx="18" fill="#f2ebff"/>
    <rect x="444" y="77" width="158" height="27" rx="18" fill="#e4d7fb"/>
    <path d="M444 93 H602" stroke="#d4c2f2"/>
  </g>
  <text x="523" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#66518b">Makro Genişletme</text>
  <rect x="460" y="117" width="126" height="17" rx="7" fill="#ffffff" opacity="0.82"/>
  <text x="523" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#625876">when</text>
  <path d="M523 138 L523 145" stroke="#987ec5" stroke-width="1.5"/>
  <polygon points="523,150 519,143 527,143" fill="#987ec5"/>
  <rect x="471" y="151" width="104" height="13" rx="6" fill="#ffffff" opacity="0.82"/>
  <text x="523" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#625876">if ve begin</text>

  <!-- alt AST -->
  <g filter="url(#soft)">
    <rect x="207" y="235" width="226" height="61" rx="17" fill="#e8f5f4"/>
  </g>
  <text x="320" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356b68">Görünür AST</text>
  <path d="M320 263 L290 278 M320 263 L350 278" stroke="#529b91" stroke-width="2"/>
  <circle cx="320" cy="262" r="7" fill="#72bdb2"/>
  <circle cx="290" cy="280" r="7" fill="#9cd5c7"/>
  <circle cx="350" cy="280" r="7" fill="#9cd5c7"/>
  <text x="320" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">+</text>
  <text x="290" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416d68">2</text>
  <text x="350" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416d68">3</text>

  <!-- küçük rozetler -->
  <g filter="url(#soft)">
    <rect x="49" y="207" width="124" height="31" rx="15" fill="#ffffff"/>
    <rect x="467" y="207" width="124" height="31" rx="15" fill="#ffffff"/>
  </g>
  <circle cx="66" cy="222.5" r="7" fill="#8dc5dd"/>
  <text x="111" y="227" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476c7b">Dönüştür</text>
  <path d="M77 222.5 H89" stroke="#5d94a8" stroke-width="1.5"/>
  <polygon points="92,222.5 86,219 86,226" fill="#5d94a8"/>

  <circle cx="484" cy="222.5" r="7" fill="#a8cfa0"/>
  <text x="535" y="227" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536f4f">Doğrula</text>
  <path d="M481 222 L483 225 L488 219" fill="none" stroke="#ffffff" stroke-width="1.5"/>
</svg>