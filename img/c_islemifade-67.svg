<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8da"/>
      <stop offset="100%" stop-color="#5a9bc7"/>
    </linearGradient>
    <linearGradient id="exprGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c96a"/>
      <stop offset="100%" stop-color="#e0b050"/>
    </linearGradient>
    <linearGradient id="varGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8a8"/>
      <stop offset="100%" stop-color="#8cc88c"/>
    </linearGradient>
    <linearGradient id="constGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a8d8"/>
      <stop offset="100%" stop-color="#c08cc8"/>
    </linearGradient>
    <linearGradient id="opGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a080"/>
      <stop offset="100%" stop-color="#e08868"/>
    </linearGradient>
    <linearGradient id="assignGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80b8d8"/>
      <stop offset="100%" stop-color="#68a0c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#3a5a7a">C İşlem Satırı ve İfade</text>

  <!-- Ana kavram: İşlem Satırı -->
  <rect x="220" y="45" width="200" height="44" rx="10" fill="url(#mainGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">İşlem Satırı</text>

  <!-- Ok: İşlem Satırı -> İfade -->
  <line x1="320" y1="89" x2="320" y2="108" stroke="#5a9bc7" stroke-width="2"/>
  <polygon points="314,108 320,120 326,108" fill="#5a9bc7"/>

  <!-- İfade kutusu -->
  <rect x="235" y="120" width="170" height="40" rx="10" fill="url(#exprGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#5a4a20">İfade</text>

  <!-- Alt bileşenler -->
  <!-- Oklar -->
  <line x1="255" y1="160" x2="175" y2="185" stroke="#8cc88c" stroke-width="1.8"/>
  <polygon points="175,185 188,188 180,178" fill="#8cc88c"/>

  <line x1="320" y1="160" x2="320" y2="185" stroke="#c08cc8" stroke-width="1.8"/>
  <polygon points="314,185 320,197 326,185" fill="#c08cc8"/>

  <line x1="385" y1="160" x2="465" y2="185" stroke="#e08868" stroke-width="1.8"/>
  <polygon points="465,185 452,188 460,178" fill="#e08868"/>

  <!-- Değişken -->
  <rect x="75" y="188" width="150" height="38" rx="9" fill="url(#varGrad)" filter="url(#shadowLight)" opacity="0.95"/>
  <text x="150" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a5a2a">Değişken</text>

  <!-- Sabit -->
  <rect x="245" y="198" width="150" height="38" rx="9" fill="url(#constGrad)" filter="url(#shadowLight)" opacity="0.95"/>
  <text x="320" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a2a5a">Sabit</text>

  <!-- İşlemci -->
  <rect x="415" y="188" width="150" height="38" rx="9" fill="url(#opGrad)" filter="url(#shadowLight)" opacity="0.95"/>
  <text x="490" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a2a1a">İşlemci</text>

  <!-- Örnek ifade -->
  <rect x="170" y="255" width="300" height="44" rx="10" fill="#ffffff" filter="url(#shadowLight)" stroke="#c0d8e8" stroke-width="1.5" opacity="0.95"/>
  <text x="320" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a5a7a">x = y + 2;</text>
  <text x="320" y="291" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a8aa0" font-style="italic">Matematiksel ifade</text>

  <!-- Atama bağlantısı -->
  <line x1="320" y1="238" x2="320" y2="255" stroke="#68a0c0" stroke-width="1.8" stroke-dasharray="4,3"/>
  <polygon points="314,255 320,265 326,255" fill="#68a0c0"/>

  <!-- İşlem satırı türleri -->
  <rect x="20" y="45" width="160" height="34" rx="8" fill="#e8f0f8" filter="url(#shadowLight)" stroke="#b0c8d8" stroke-width="1" opacity="0.9"/>
  <text x="100" y="66" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7a">Bildirim</text>

  <rect x="20" y="88" width="160" height="34" rx="8" fill="#e8f0f8" filter="url(#shadowLight)" stroke="#b0c8d8" stroke-width="1" opacity="0.9"/>
  <text x="100" y="109" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7a">Değer Atama</text>

  <rect x="20" y="131" width="160" height="34" rx="8" fill="#e8f0f8" filter="url(#shadowLight)" stroke="#b0c8d8" stroke-width="1" opacity="0.9"/>
  <text x="100" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7a">Fonksiyon Çağrısı</text>

  <rect x="20" y="174" width="160" height="34" rx="8" fill="#e8f0f8" filter="url(#shadowLight)" stroke="#b0c8d8" stroke-width="1" opacity="0.9"/>
  <text x="100" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7a">Döngü</text>

  <!-- Bağlantı çizgisi -->
  <line x1="180" y1="62" x2="220" y2="62" stroke="#b0c8d8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="180" y1="105" x2="220" y2="70" stroke="#b0c8d8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="180" y1="148" x2="220" y2="78" stroke="#b0c8d8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="180" y1="191" x2="220" y2="86" stroke="#b0c8d8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Sağ tarafta kod örneği -->
  <rect x="480" y="240" width="140" height="60" rx="8" fill="#f8f0e8" filter="url(#shadowLight)" stroke="#d8c8b0" stroke-width="1" opacity="0.9"/>
  <text x="550" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a3a" font-family="monospace">id1 = 4;</text>
  <text x="550" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a3a" font-family="monospace">id3 = id1 + id2;</text>
  <text x="550" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a3a" font-family="monospace">fonk();</text>

  <line x1="470" y1="270" x2="470" y2="270" stroke="#d8c8b0" stroke-width="1"/>
</svg>