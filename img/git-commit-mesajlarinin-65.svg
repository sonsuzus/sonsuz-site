<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#d1e8d4"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef7e0"/>
      <stop offset="100%" stop-color="#fdecc8"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f8d7d3"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Commit Mesajı Sosyolojisi</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#a0b8d8" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">Git Geçmişi</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7c">Takım Kültürü İzleri</text>

  <!-- Sol üst: İletişim -->
  <rect x="40" y="50" width="130" height="45" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#a8c8a8" stroke-width="1.5"/>
  <text x="105" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d5a2d">İletişim</text>
  <text x="105" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a4a">Alışkanlıklar</text>

  <!-- Sol alt: Baskı -->
  <rect x="40" y="220" width="130" height="45" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#d4b878" stroke-width="1.5"/>
  <text x="105" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5a20">Baskı Altında</text>
  <text x="105" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9a7a40">Davranış</text>

  <!-- Sağ üst: Sorumluluk -->
  <rect x="470" y="50" width="130" height="45" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#d4a0a0" stroke-width="1.5"/>
  <text x="535" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a2d2d">Sorumluluk</text>
  <text x="535" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9a4a4a">Paylaşımı</text>

  <!-- Sağ alt: Psikolojik güvenlik -->
  <rect x="470" y="220" width="130" height="45" rx="10" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#a0b8d8" stroke-width="1.5"/>
  <text x="535" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a5c">Güvenlik</text>
  <text x="535" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7c">Psikolojik</text>

  <!-- Alt merkez: Ortak hafıza -->
  <rect x="245" y="245" width="150" height="45" rx="10" fill="url(#boxGrad6)" filter="url(#shadow)" stroke="#88b888" stroke-width="1.5"/>
  <text x="320" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d5a2d">Ortak Hafıza</text>
  <text x="320" y="279" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a4a">Kurumsal Bilgi</text>

  <!-- Oklar: merkezden dışarı -->
  <!-- Sol üst ok -->
  <path d="M245 135 L175 80" stroke="#7a9a7a" stroke-width="2" fill="none"/>
  <polygon points="170,75 182,80 172,88" fill="#7a9a7a"/>

  <!-- Sol alt ok -->
  <path d="M245 160 L175 235" stroke="#b89850" stroke-width="2" fill="none"/>
  <polygon points="170,240 182,235 172,227" fill="#b89850"/>

  <!-- Sağ üst ok -->
  <path d="M395 135 L465 80" stroke="#b87070" stroke-width="2" fill="none"/>
  <polygon points="470,75 458,80 468,88" fill="#b87070"/>

  <!-- Sağ alt ok -->
  <path d="M395 160 L465 235" stroke="#7a9aba" stroke-width="2" fill="none"/>
  <polygon points="470,240 458,235 468,227" fill="#7a9aba"/>

  <!-- Alt merkez ok -->
  <path d="M320 170 L320 240" stroke="#6a9a6a" stroke-width="2" fill="none"/>
  <polygon points="315,245 325,245 320,235" fill="#6a9a6a"/>

  <!-- Üst bilgi etiketi -->
  <rect x="200" y="5" width="240" height="20" rx="8" fill="#e8f0fe" opacity="0.7"/>
  <text x="320" y="19" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a7c">Kod geçmişi, insan hikayesi</text>

  <!-- Alt bilgi etiketi -->
  <rect x="180" y="295" width="280" height="18" rx="8" fill="#e6f4ea" opacity="0.7"/>
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a4a">Düzenli mesajlar, saygılı ekip</text>
</svg>