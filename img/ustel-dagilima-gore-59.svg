<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="kartMavi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5f1ff"/>
      <stop offset="100%" stop-color="#d6eafe"/>
    </linearGradient>
    <linearGradient id="kartMor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1eaff"/>
      <stop offset="100%" stop-color="#e6d8fb"/>
    </linearGradient>
    <linearGradient id="kartYesil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5f7eb"/>
      <stop offset="100%" stop-color="#d1efdb"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="65" cy="48" r="42" fill="#dcefff" opacity="0.55"/>
  <circle cx="585" cy="270" r="62" fill="#dff3df" opacity="0.5"/>
  <circle cx="540" cy="46" r="24" fill="#eee4ff" opacity="0.65"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516b">Üstel Dağılıma Göre Rastgele Sayı Üretimi</text>
  <text x="320" y="47" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698097">Ters dönüşüm ile bekleme süresi simülasyonu</text>

  <path d="M164 123 L203 123" stroke="#86a3bd" stroke-width="2.5" fill="none"/>
  <polygon points="203,123 195,118 195,128" fill="#86a3bd"/>
  <path d="M350 123 L389 123" stroke="#86a3bd" stroke-width="2.5" fill="none"/>
  <polygon points="389,123 381,118 381,128" fill="#86a3bd"/>

  <g filter="url(#golge)">
    <rect x="36" y="79" width="128" height="89" rx="17" fill="url(#kartMavi)"/>
    <circle cx="64" cy="105" r="15" fill="#ffffff" opacity="0.78"/>
    <path d="M57 107 C60 97 67 98 70 105 C73 113 64 119 59 114 C57 112 57 109 57 107Z" fill="#69a8dc"/>
    <text x="87" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345875">Düzgün kaynak</text>
    <text x="87" y="123" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526f89">U ∈ [0,1)</text>
    <rect x="53" y="139" width="94" height="17" rx="8.5" fill="#ffffff" opacity="0.67"/>
    <text x="100" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a7290">rastgele sayı</text>
  </g>

  <g filter="url(#golge)">
    <rect x="203" y="70" width="147" height="106" rx="18" fill="url(#kartMor)"/>
    <circle cx="276.5" cy="95" r="17" fill="#ffffff" opacity="0.75"/>
    <text x="276.5" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76559a">ln</text>
    <text x="276.5" y="129" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#60417e">Ters dönüşüm</text>
    <text x="276.5" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d5b80">X = −ln(1−U) / λ</text>
  </g>

  <g filter="url(#golge)">
    <rect x="389" y="79" width="128" height="89" rx="17" fill="url(#kartYesil)"/>
    <circle cx="417" cy="105" r="15" fill="#ffffff" opacity="0.78"/>
    <path d="M408 113 C413 104 416 98 421 96 C426 98 430 103 429 110 C428 117 417 119 408 113Z" fill="#64b989"/>
    <text x="440" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37694e">Üstel değer</text>
    <text x="440" y="123" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7960">X ≥ 0</text>
    <rect x="406" y="139" width="94" height="17" rx="8.5" fill="#ffffff" opacity="0.67"/>
    <text x="453" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7960">bekleme süresi</text>
  </g>

  <path d="M276 176 L276 205" stroke="#9a86b0" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <polygon points="276,205 271,197 281,197" fill="#9a86b0"/>

  <g filter="url(#hafifGolge)">
    <rect x="202" y="207" width="149" height="45" rx="14" fill="#ffffff" opacity="0.9"/>
    <text x="276.5" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#536b80">Hız parametresi λ</text>
    <text x="276.5" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687e90">λ artar → süre kısalır</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="39" y="220" width="126" height="67" rx="15" fill="#ffffff" opacity="0.84"/>
    <text x="102" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c6b84">Doğrulama</text>
    <path d="M57 270 L57 251 L147 251" stroke="#9bb2c5" stroke-width="1.5" fill="none"/>
    <rect x="65" y="261" width="8" height="9" rx="2" fill="#8bb7df"/>
    <rect x="78" y="257" width="8" height="13" rx="2" fill="#8bb7df"/>
    <rect x="91" y="254" width="8" height="16" rx="2" fill="#8bb7df"/>
    <rect x="104" y="258" width="8" height="12" rx="2" fill="#8bb7df"/>
    <rect x="117" y="262" width="8" height="8" rx="2" fill="#8bb7df"/>
    <rect x="130" y="265" width="8" height="5" rx="2" fill="#8bb7df"/>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="390" y="207" width="191" height="80" rx="15" fill="#ffffff" opacity="0.86"/>
    <text x="485.5" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c6b84">Kullanım alanları</text>
    <rect x="405" y="241" width="48" height="27" rx="9" fill="#e7f2ff"/>
    <text x="429" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47769c">Kuyruk</text>
    <rect x="461" y="241" width="48" height="27" rx="9" fill="#eee7fb"/>
    <text x="485" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#725893">Ağ</text>
    <rect x="517" y="241" width="49" height="27" rx="9" fill="#e3f5e9"/>
    <text x="541.5" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d8062">Ömür</text>
  </g>

  <path d="M164 253 L192 253" stroke="#a4b7c7" stroke-width="1.7" fill="none"/>
  <polygon points="192,253 185,249 185,257" fill="#a4b7c7"/>
  <path d="M351 253 L379 253" stroke="#a4b7c7" stroke-width="1.7" fill="none"/>
  <polygon points="379,253 372,249 372,257" fill="#a4b7c7"/>
</svg>