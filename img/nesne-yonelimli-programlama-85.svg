  <path d="M170 92 L198 92 L216 119" fill="none" stroke="#8aa6bd" stroke-width="2"/>
  <polygon points="212,112 216,119 208,117" fill="#8aa6bd"/>
  <path d="M170 223 L198 223 L216 196" fill="none" stroke="#8aa6bd" stroke-width="2"/>
  <polygon points="208,198 216,196 213,204" fill="#8aa6bd"/>

