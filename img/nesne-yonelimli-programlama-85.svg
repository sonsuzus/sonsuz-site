  <g filter="url(#shadow)">
    <rect x="491" y="61" width="121" height="101" rx="18" fill="url(#objGrad)" stroke="#aed6bd" stroke-width="1.4"/>
    <rect x="503" y="72" width="97" height="28" rx="10" fill="#fafffc" opacity="0.9"/>
    <circle cx="519" cy="86" r="8" fill="#5e9ddd"/>
    <text x="554" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37604b">araba_1</text>
    <path d="M510 123 L517 113 L574 113 L584 123 L584 136 L510 136 Z" fill="#72a9dd"/>
    <circle cx="526" cy="137" r="7" fill="#4b6171"/>
