    <text x="112" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#675222">Özellikler</text>
    <text x="112" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806d42">renk · hız · yakıt</text>
  </g>

