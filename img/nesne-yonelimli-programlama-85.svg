<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="classGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfeaff"/>
      <stop offset="100%" stop-color="#cfe0fb"/>
    </linearGradient>
    <linearGradient id="objGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5f6ee"/>
      <stop offset="100%" stop-color="#cfeadb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8495" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8495" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="55" cy="42" r="56" fill="#dceeff" opacity="0.52"/>
  <circle cx="593" cy="278" r="78" fill="#dff3dd" opacity="0.55"/>
  <path d="M25 271 C130 238 163 291 263 266 S423 226 615 262" fill="none" stroke="#c9e4da" stroke-width="2" opacity="0.55"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365067">SINIF ŞABLONU VE BAĞIMSIZ NESNELER</text>

