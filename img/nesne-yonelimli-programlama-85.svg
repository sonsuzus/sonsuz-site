  <path d="M412 157 L440 157" fill="none" stroke="#678da7" stroke-width="2.2"/>
  <polygon points="440,152 449,157 440,162" fill="#678da7"/>
  <circle cx="461" cy="157" r="8" fill="#bed6e7"/>
  <path d="M469 157 L481 112 L481 207" fill="none" stroke="#678da7" stroke-width="2.2"/>
  <polygon points="476,119 481,112 484,121" fill="#678da7"/>
  <polygon points="476,198 481,207 485,198" fill="#678da7"/>
  <text x="454" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54768d">oluştur</text>

