    <text x="243" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42617d">marka</text>
    <text x="243" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42617d">renk, hız, yakıt</text>
