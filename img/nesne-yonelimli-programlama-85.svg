    <text x="243" y="209" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42617d">hızlan()</text>
    <text x="243" y="229" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42617d">fren_yap()</text>
