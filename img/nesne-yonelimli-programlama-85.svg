  <g filter="url(#softShadow)">
    <rect x="215" y="271" width="200" height="29" rx="14" fill="#ffffff" opacity="0.82"/>
    <text x="315" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4c6878">Nesne = Durum + Davranış</text>
