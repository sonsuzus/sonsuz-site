  </g>

  <!-- Object 2 -->
  <g filter="url(#shadow)">
    <rect x="491" y="177" width="121" height="101" rx="18" fill="url(#objGrad)" stroke="#aed6bd" stroke-width="1.4"/>
    <rect x="503" y="188" width="97" height="28" rx="10" fill="#fafffc" opacity="0.9"/>
    <circle cx="519" cy="202" r="8" fill="#e5b65c"/>
    <text x="554" y="206" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#37604b">araba_2</text>
