    <rect x="216" y="72" width="195" height="174" rx="22" fill="url(#classGrad)" stroke="#a8c4e3" stroke-width="1.5"/>
    <rect x="229" y="85" width="169" height="37" rx="13" fill="#f8fbff" opacity="0.88"/>
    <circle cx="252" cy="103" r="13" fill="#83aee2"/>
