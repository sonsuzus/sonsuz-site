    <text x="113" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#704365">Metotlar</text>
    <text x="113" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#835f7c">hızlan · fren yap</text>
  </g>

