<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="formula" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9ddf7"/>
    </linearGradient>
    <linearGradient id="test" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4f6dc"/>
      <stop offset="100%" stop-color="#c9eabb"/>
    </linearGradient>
    <linearGradient id="network" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e5ff"/>
      <stop offset="100%" stop-color="#e4c8f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c7890" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5c7890" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="83" cy="43" r="56" fill="#d7edff" opacity="0.36"/>
  <circle cx="580" cy="279" r="74" fill="#dff2ce" opacity="0.34"/>
  <path d="M22 267 C120 232, 154 294, 250 265 S427 236, 617 270" fill="none" stroke="#b7d7c6" stroke-width="1.5" opacity="0.45"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35546a">MERSENNE ASAL ARAYIŞI</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8391">Kısa formül • kesin test • ortak hesaplama</text>

  <path d="M182 157 L210 157" stroke="#7898ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="210,157 202,152 202,162" fill="#7898ad"/>
  <path d="M398 157 L427 157" stroke="#7898ad" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="427,157 419,152 419,162" fill="#7898ad"/>

  <g filter="url(#shadow)">
    <rect x="28" y="94" width="154" height="128" rx="19" fill="url(#formula)"/>
    <rect x="41" y="108" width="55" height="24" rx="12" fill="#ffffff" opacity="0.62"/>
    <text x="52" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45647d">ADAY</text>
    <text x="51" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#244862">Mₚ = 2ᵖ − 1</text>
    <line x1="51" y1="174" x2="157" y2="174" stroke="#86a8c2" stroke-width="1"/>
    <text x="51" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#48677c">p asal olmalı</text>
    <circle cx="153" cy="120" r="15" fill="#ffffff" opacity="0.8"/>
    <text x="148" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#51728c">2ᵖ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="76" width="188" height="162" rx="22" fill="url(#test)"/>
    <text x="231" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c673b">LUCAS–LEHMER TESTİ</text>
    <rect x="230" y="119" width="148" height="33" rx="11" fill="#ffffff" opacity="0.77"/>
    <text x="247" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3e6345">s₀ = 4</text>
    <path d="M304 156 C268 155, 257 190, 284 202 C315 216, 354 198, 340 171" fill="none" stroke="#6ea66c" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="340,171 330,173 337,181" fill="#6ea66c"/>
    <text x="239" y="176" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3e6345">s = s² − 2 mod Mₚ</text>
    <text x="250" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356338">p − 2 yineleme</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="427" y="94" width="184" height="128" rx="19" fill="url(#network)"/>
    <text x="449" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#694b79">DAĞITIK ARAMA</text>
    <path d="M493 153 L462 178 M493 153 L530 180 M493 153 L563 151" stroke="#a981ba" stroke-width="1.8"/>
    <circle cx="493" cy="153" r="17" fill="#fffaff"/>
    <text x="482" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#754f86">G</text>
    <rect x="445" y="174" width="36" height="25" rx="8" fill="#ffffff" opacity="0.83"/>
    <rect x="512" y="176" width="36" height="25" rx="8" fill="#ffffff" opacity="0.83"/>
    <rect x="550" y="139" width="42" height="25" rx="8" fill="#ffffff" opacity="0.83"/>
    <text x="451" y="191" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#714d80">Düğüm</text>
    <text x="518" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#714d80">Düğüm</text>
    <text x="556" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#714d80">Düğüm</text>
  </g>

  <g filter="url(#soft)">
    <rect x="126" y="259" width="175" height="39" rx="16" fill="#ffffff"/>
    <circle cx="147" cy="278" r="10" fill="#d8f0ca"/>
    <path d="M142 278 L146 282 L153 273" fill="none" stroke="#4e8a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="165" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416a48">s son = 0 → Asal</text>
  </g>

  <g filter="url(#soft)">
    <rect x="330" y="259" width="184" height="39" rx="16" fill="#ffffff"/>
    <circle cx="351" cy="278" r="10" fill="#f6d4d4"/>
    <path d="M347 274 L355 282 M355 274 L347 282" stroke="#a75d5d" stroke-width="2" stroke-linecap="round"/>
    <text x="369" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7f5050">s son ≠ 0 → Bileşik</text>
  </g>

  <path d="M304 238 L304 250 L214 250 L214 259" fill="none" stroke="#7ca47b" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="214,259 210,251 218,251" fill="#7ca47b"/>
  <path d="M304 238 L304 250 L422 250 L422 259" fill="none" stroke="#b17e7e" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="422,259 418,251 426,251" fill="#b17e7e"/>
</svg>