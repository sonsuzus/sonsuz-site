<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8ddf8"/>
    </linearGradient>
    <linearGradient id="poly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f5df"/>
      <stop offset="100%" stop-color="#cce9d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="35" r="72" fill="#dbeeff" opacity="0.38"/>
  <circle cx="570" cy="280" r="96" fill="#dff2d8" opacity="0.42"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334155">Depo Stratejisi</text>
  <text x="320" y="47" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Paylaşım ve izolasyon dengesi</text>

  <g filter="url(#shadow)">
    <rect x="38" y="70" width="230" height="174" rx="18" fill="url(#mono)" stroke="#a9c8ed"/>
    <rect x="372" y="70" width="230" height="174" rx="18" fill="url(#poly)" stroke="#acd5b2"/>
  </g>

  <rect x="57" y="86" width="192" height="29" rx="12" fill="#ffffff" opacity="0.8"/>
  <text x="153" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#28527d">MONOREPO</text>

  <rect x="391" y="86" width="192" height="29" rx="12" fill="#ffffff" opacity="0.8"/>
  <text x="487" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397449">POLYREPO</text>

  <g filter="url(#soft)">
    <rect x="77" y="137" width="152" height="69" rx="12" fill="#ffffff"/>
    <rect x="89" y="149" width="51" height="20" rx="7" fill="#d8e9ff"/>
    <rect x="166" y="149" width="51" height="20" rx="7" fill="#d8e9ff"/>
    <rect x="89" y="177" width="51" height="18" rx="7" fill="#d8e9ff"/>
