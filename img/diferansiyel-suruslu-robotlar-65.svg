    <text x="474" y="272" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#385f58">Hız farkı</text>
    <text x="474" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#22705e">ω = (vᵣ - vₗ) / L</text>
  </g>

