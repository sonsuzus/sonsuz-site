    <circle cx="56" cy="275" r="15" fill="#9bc6e8"/>
    <path d="M49 275 L62 275 M58 270 L63 275 L58 280" fill="none" stroke="#376d98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
