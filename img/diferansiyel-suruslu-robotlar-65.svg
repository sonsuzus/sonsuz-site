    <text x="518" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a36b18">SAĞ</text>
    <text x="551" y="85" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334b5f">vᵣ = 0.40</text>
    <line x1="499" y1="105" x2="598" y2="105" stroke="#c8d9e4" stroke-width="2"/>
    <rect x="499" y="112" width="89" height="6" rx="3" fill="#e1a951"/>
