<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++14 Değişken Şablonları</text>

  <!-- Sol üst: Şablon tanımı -->
  <rect x="30" y="55" width="180" height="90" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="120" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Şablon Tanımı</text>
  <text x="120" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">template &lt;typename T&gt;</text>
  <text x="120" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">constexpr T değişken = ifade;</text>
  <text x="120" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c">(örnek: t x = 21.7564)</text>

  <!-- Sağ üst: Tür ile kullanım -->
  <rect x="430" y="55" width="180" height="90" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="520" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Tür ile Kullanım</text>
  <text x="520" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">değişken-adı&lt;T&gt;</text>
  <text x="520" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">örnek: x&lt;int&gt;, x&lt;float&gt;</text>
  <text x="520" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c">(int ve float için ayrı örnekler)</text>

  <!-- Ok: Tanım -> Kullanım -->
  <path d="M215,100 L425,100" stroke="#546e7a" stroke-width="2" fill="none"/>
  <polygon points="425,94 437,100 425,106" fill="#546e7a"/>

  <!-- Alt orta: Özelleştirme -->
  <rect x="230" y="170" width="180" height="70" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="320" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Özelleştirme</text>
  <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">template &lt;&gt;</text>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">değişken&lt;T&gt; = özel değer;</text>

  <!-- Alt sol: Örnek değişkenler -->
  <rect x="30" y="170" width="170" height="70" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.5"/>
  <text x="115" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Örnek Değişkenler</text>
  <text x="115" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">t x = 21.7564</text>
  <text x="115" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">t y = 75.2189</text>

  <!-- Alt sağ: Çıktı -->
  <rect x="440" y="170" width="170" height="70" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="525" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Program Çıktısı</text>
  <text x="525" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">cout &lt;&lt; x&lt;int&gt;</text>
  <text x="525" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">cout &lt;&lt; x&lt;float&gt;</text>

  <!-- Oklar: Örnek -> Özelleştirme -->
  <path d="M200,205 L225,205" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="225,199 235,205 225,211" fill="#546e7a"/>

  <!-- Oklar: Özelleştirme -> Çıktı -->
  <path d="M415,205 L435,205" stroke="#546e7a" stroke-width="1.5" fill="none"/>
  <polygon points="435,199 445,205 435,211" fill="#546e7a"/>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#607d8b" font-style="italic">Şablon değişkenleri: tür bağımsız sabit değerler ve ifadeler</text>
</svg>