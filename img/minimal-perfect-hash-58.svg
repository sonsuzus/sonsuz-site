<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5edff"/>
      <stop offset="100%" stop-color="#d4e3fb"/>
    </linearGradient>
    <linearGradient id="hashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dcff"/>
      <stop offset="100%" stop-color="#d6c8f2"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff4ea"/>
      <stop offset="100%" stop-color="#c9e6d7"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1cf"/>
      <stop offset="100%" stop-color="#f5dfa2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7990a4" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7990a4" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="87" cy="46" r="70" fill="#dcecff" opacity="0.42"/>
  <circle cx="571" cy="274" r="92" fill="#dcefdc" opacity="0.36"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40556a">Minimal Perfect Hash</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718395">Sabit küme · çakışmasız indeksleme</text>

  <!-- Connections -->
  <path d="M150 121 C170 121 169 93 192 93" fill="none" stroke="#8d9db9" stroke-width="2"/>
  <polygon points="192,88 202,93 192,98" fill="#8d9db9"/>
  <path d="M150 143 C175 143 169 135 192 135" fill="none" stroke="#8d9db9" stroke-width="2"/>
  <polygon points="192,130 202,135 192,140" fill="#8d9db9"/>
  <path d="M150 165 C174 165 169 177 192 177" fill="none" stroke="#8d9db9" stroke-width="2"/>
  <polygon points="192,172 202,177 192,182" fill="#8d9db9"/>

  <path d="M302 93 C321 93 321 125 342 125" fill="none" stroke="#9b87bc" stroke-width="2"/>
  <path d="M302 135 L342 135" fill="none" stroke="#9b87bc" stroke-width="2"/>
  <path d="M302 177 C321 177 321 145 342 145" fill="none" stroke="#9b87bc" stroke-width="2"/>
  <polygon points="342,120 352,125 342,130" fill="#9b87bc"/>
  <polygon points="342,130 352,135 342,140" fill="#9b87bc"/>
  <polygon points="342,140 352,145 342,150" fill="#9b87bc"/>

  <path d="M445 135 C469 135 468 135 486 135" fill="none" stroke="#75a68c" stroke-width="2.5"/>
  <polygon points="486,130 496,135 486,140" fill="#75a68c"/>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="28" y="83" width="122" height="120" rx="18" fill="url(#keyGrad)"/>
  </g>
  <text x="47" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d5877">Anahtar kümesi</text>
  <rect x="43" y="119" width="91" height="20" rx="8" fill="#ffffff" opacity="0.78"/>
  <text x="55" y="133" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a627b">if</text>
  <rect x="43" y="145" width="91" height="20" rx="8" fill="#ffffff" opacity="0.78"/>
  <text x="55" y="159" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a627b">else</text>
  <rect x="43" y="171" width="91" height="20" rx="8" fill="#ffffff" opacity="0.78"/>
  <text x="55" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a627b">return</text>

  <!-- Hash functions -->
  <g filter="url(#shadow)">
    <rect x="202" y="72" width="100" height="42" rx="13" fill="url(#hashGrad)"/>
    <rect x="202" y="114" width="100" height="42" rx="13" fill="url(#hashGrad)"/>
    <rect x="202" y="156" width="100" height="42" rx="13" fill="url(#hashGrad)"/>
  </g>
  <text x="228" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#594678">h₁(k)</text>
  <text x="228" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#594678">h₂(k)</text>
  <text x="228" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#594678">h₃(k)</text>

  <!-- G array -->
  <g filter="url(#shadow)">
    <rect x="352" y="77" width="93" height="116" rx="18" fill="url(#tableGrad)"/>
  </g>
  <text x="374" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356651">Yardımcı g</text>
  <rect x="367" y="114" width="18" height="18" rx="5" fill="#ffffff" opacity="0.84"/>
  <rect x="389" y="114" width="18" height="18" rx="5" fill="#ffffff" opacity="0.84"/>
  <rect x="411" y="114" width="18" height="18" rx="5" fill="#ffffff" opacity="0.84"/>
  <text x="373" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7665">1</text>
  <text x="395" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7665">3</text>
  <text x="417" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7665">0</text>
  <text x="370" y="159" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7665">Topla</text>
  <text x="370" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7665">mod n</text>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="496" y="67" width="116" height="136" rx="18" fill="url(#outGrad)"/>
  </g>
  <text x="515" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76602e">Minimal indeks</text>
  <rect x="513" y="105" width="82" height="20" rx="7" fill="#ffffff" opacity="0.8"/>
  <rect x="513" y="130" width="82" height="20" rx="7" fill="#ffffff" opacity="0.8"/>
  <rect x="513" y="155" width="82" height="20" rx="7" fill="#ffffff" opacity="0.8"/>
  <text x="525" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#715d31">0 · if</text>
  <text x="525" y="144" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#715d31">1 · else</text>
  <text x="525" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#715d31">2 · return</text>
  <text x="516" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7540">Boş indeks yok</text>

  <!-- Bottom notes -->
  <g filter="url(#softShadow)">
    <rect x="65" y="245" width="152" height="43" rx="14" fill="#ffffff" opacity="0.82"/>
    <rect x="244" y="245" width="152" height="43" rx="14" fill="#ffffff" opacity="0.82"/>
    <rect x="423" y="245" width="152" height="43" rx="14" fill="#ffffff" opacity="0.82"/>
  </g>
  <circle cx="84" cy="266" r="8" fill="#9dbce8"/>
  <text x="99" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6174">Sabit veri</text>
  <circle cx="263" cy="266" r="8" fill="#b9a0dd"/>
  <text x="278" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6174">Çakışma yok</text>
  <circle cx="442" cy="266" r="8" fill="#92c9aa"/>
  <text x="457" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6174">O(1) sorgu</text>
</svg>