<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#edf7f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#a0b8d0" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#90b0a0" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık etiketi -->
  <text x="320" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Metin Özetleme Akışı</text>

  <!-- Giriş metni kutusu -->
  <rect x="40" y="60" width="120" height="50" rx="10" fill="#dbe9f7" filter="url(#shadow)"/>
  <text x="100" y="84" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Makale Metni</text>
  <text x="100" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#4a6a8a">Ham metin</text>

  <!-- Cümlelere bölme -->
  <rect x="230" y="60" width="150" height="50" rx="10" fill="#f2d9b3" filter="url(#shadow)"/>
  <text x="305" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a3a20">Cümlelere Bölme</text>
  <text x="305" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#6a5a30">Aday cümleler</text>

  <!-- Temizlik/adım -->
  <rect x="450" y="60" width="150" height="50" rx="10" fill="#d9e8d9" filter="url(#shadow)"/>
  <text x="525" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2a4a2a">Temizleme</text>
  <text x="525" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#4a6a4a">Stopword + düzen</text>

  <!-- Ok 1: Metin -> Bölme -->
  <path d="M160 85 L230 85" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="230 85, 220 80, 220 90" fill="#5a7a9a"/>

  <!-- Ok 2: Bölme -> Temizlik -->
  <path d="M380 85 L450 85" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="450 85, 440 80, 440 90" fill="#5a7a9a"/>

  <!-- İşleme çekirdeği -->
  <rect x="230" y="150" width="180" height="70" rx="12" fill="#c3d9e8" filter="url(#shadow)" stroke="#5a8aaa" stroke-width="1.5"/>
  <text x="320" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a3a5a">TF-IDF Vektörizasyon</text>
  <text x="320" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#2a5a8a">Kelime + Belge matrisi</text>
  <text x="320" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#2a5a8a">Kosinüs benzerliği</text>

  <!-- Puanlama kutusu -->
  <rect x="450" y="150" width="150" height="70" rx="12" fill="#e8c9c9" filter="url(#shadow)"/>
  <text x="525" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#5a2a2a">Ağırlıklı Puan</text>
  <text x="525" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#7a4a4a">0.8 benzerlik</text>
  <text x="525" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#7a4a4a">+ 0.2 konum</text>

  <!-- Ok: Temizlik -> İşleme -->
  <path d="M525 110 L525 140 L410 140 L410 150" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="410 150, 405 140, 415 140" fill="#5a7a9a"/>

  <!-- Ok: TF-IDF -> Puanlama -->
  <path d="M410 185 L450 185" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="450 185, 440 180, 440 190" fill="#5a7a9a"/>

  <!-- Sıralama kutusu -->
  <rect x="230" y="255" width="180" height="45" rx="10" fill="#d4c9e8" filter="url(#shadow)"/>
  <text x="320" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3a2a5a">Sıralama + Seçim</text>
  <text x="320" y="292" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#5a4a7a">İlk %30 yüksek puan</text>

  <!-- Ok: İşleme -> Sıralama -->
  <path d="M320 220 L320 255" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="320 255, 315 245, 325 245" fill="#5a7a9a"/>

  <!-- Sonuç kutusu -->
  <rect x="470" y="255" width="130" height="45" rx="12" fill="#b3e0b3" filter="url(#shadow)"/>
  <text x="535" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a4a1a">Özet Metin</text>
  <text x="535" y="292" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#3a6a3a">Temsili cümleler</text>

  <!-- Ok: Sıralama -> Sonuç -->
  <path d="M410 277 L470 277" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="470 277, 460 272, 460 282" fill="#5a7a9a"/>

  <!-- Matematiksel formül etiketi -->
  <rect x="40" y="150" width="160" height="70" rx="10" fill="#f5f0e0" filter="url(#shadowLight)" stroke="#c0b080" stroke-width="1"/>
  <text x="120" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#5a4a20">Puan Formülü</text>
  <text x="120" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#7a6a40">0.5 frekans</text>
  <text x="120" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#7a6a40">+ 0.3 benzerlik</text>
  <text x="120" y="217" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#7a6a40">+ 0.2 konum</text>

  <!-- Ok: Formül -> Puanlama -->
  <path d="M200 185 L230 185" stroke="#8a7a50" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
  <polygon points="230 185, 220 180, 220 190" fill="#8a7a50" opacity="0.7"/>

  <!-- Bağlam etiketi -->
  <rect x="40" y="255" width="160" height="45" rx="10" fill="#e0e8f0" filter="url(#shadowLight)"/>
  <text x="120" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#3a5a7a">TF-IDF + Kosinüs</text>
  <text x="120" y="292" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" text-anchor="middle" fill="#5a7a9a">Teorik altyapı</text>
</svg>