  <text x="45" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b5765">“Harika, sistem</text>
  <text x="45" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b5765">yine çöktü!”</text>
