<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4e6ff"/>
      <stop offset="100%" stop-color="#b8d4ff"/>
    </linearGradient>
    <linearGradient id="typeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd9b3"/>
      <stop offset="100%" stop-color="#ffc999"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b3e6cc"/>
      <stop offset="100%" stop-color="#99dbb8"/>
    </linearGradient>
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6d4ff"/>
      <stop offset="100%" stop-color="#d1b3ff"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Değişken Bildirimi</text>

  <!-- Bellek bloğu (ana kavram) -->
  <rect x="220" y="55" width="200" height="70" rx="12" fill="url(#memGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">Bellek Alanı</text>
  <text x="320" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c4a6e">İsim + Değer saklar</text>

  <!-- Bildirim sözdizimi kutusu -->
  <rect x="170" y="145" width="300" height="50" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#c0d8f0" stroke-width="1.5"/>
  <text x="320" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#2c3e50">
    <tspan font-weight="bold" fill="#c05621">veri-türü</tspan>
    <tspan> </tspan>
    <tspan font-weight="bold" fill="#1a7a4a">değişken-adı</tspan>
    <tspan>;</tspan>
  </text>
  <text x="320" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a8a9a">Bildirim sözdizimi</text>

  <!-- Ok: sözdizimi -> bellek -->
  <path d="M 270 145 Q 270 120 290 125" stroke="#4a7a9a" stroke-width="1.8" fill="none"/>
  <polygon points="290,122 298,127 288,130" fill="#4a7a9a"/>

  <!-- Bileşenler: veri türü -->
  <rect x="60" y="210" width="140" height="45" rx="10" fill="url(#typeGrad)" filter="url(#shadow)" opacity="0.85"/>
  <text x="130" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a3410">Veri Türü</text>
  <text x="130" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a4a20">int, float, char</text>

  <!-- Bileşenler: değişken adı -->
  <rect x="250" y="210" width="140" height="45" rx="10" fill="url(#nameGrad)" filter="url(#shadow)" opacity="0.85"/>
  <text x="320" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0a4a2a">Değişken Adı</text>
  <text x="320" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a5a3a">sayac, toplam</text>

  <!-- Bileşenler: değer atama -->
  <rect x="440" y="210" width="140" height="45" rx="10" fill="#ffe8cc" filter="url(#shadow)" opacity="0.85"/>
  <text x="510" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a4a10">Değer Atama</text>
  <text x="510" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a20">= 5; = 3.14;</text>

  <!-- Oklar bileşenlere -->
  <path d="M 130 210 L 130 195 Q 130 190 135 190 L 250 190 Q 255 190 255 195 L 255 210" stroke="#4a7a9a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="252,210 258,205 258,215" fill="#4a7a9a"/>

  <path d="M 510 210 L 510 195 Q 510 190 505 190 L 395 190 Q 390 190 390 195 L 390 210" stroke="#4a7a9a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="393,210 387,205 387,215" fill="#4a7a9a"/>

  <!-- Kapsam türleri -->
  <rect x="60" y="275" width="160" height="35" rx="8" fill="url(#scopeGrad)" filter="url(#shadow)" opacity="0.8"/>
  <text x="140" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a1a6a">Lokal Değişken</text>
  <text x="140" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a3a8a">Fonksiyon içi</text>

  <rect x="240" y="275" width="160" height="35" rx="8" fill="url(#scopeGrad)" filter="url(#shadow)" opacity="0.8"/>
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a1a6a">Parametre</text>
  <text x="320" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a3a8a">Fonksiyon argümanı</text>

  <rect x="420" y="275" width="160" height="35" rx="8" fill="url(#scopeGrad)" filter="url(#shadow)" opacity="0.8"/>
  <text x="500" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a1a6a">Global Değişken</text>
  <text x="500" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a3a8a">Tüm fonksiyonlar dışı</text>

  <!-- Bağlantı çizgisi kapsam -> bildirim -->
  <path d="M 140 210 L 140 200 Q 140 195 145 195 L 300 195 Q 305 195 305 200 L 305 210" stroke="#4a7a9a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" opacity="0.6"/>
  <path d="M 500 210 L 500 200 Q 500 195 495 195 L 340 195 Q 335 195 335 200 L 335 210" stroke="#4a7a9a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Not kutusu -->
  <rect x="460" y="55" width="150" height="55" rx="8" fill="#fff8e6" filter="url(#shadow)" stroke="#e6d4a0" stroke-width="1" opacity="0.9"/>
  <text x="535" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#8a6a20">Kural</text>
  <text x="535" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7a6a30">Önce bildirim</text>
  <text x="535" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7a6a30">Sonra kullanım</text>

  <!-- Kural bağlantısı -->
  <path d="M 420 90 Q 450 90 460 85" stroke="#8a7a40" stroke-width="1.2" fill="none" stroke-dasharray="3,2"/>
  <polygon points="458,82 468,85 458,90" fill="#8a7a40"/>
</svg>