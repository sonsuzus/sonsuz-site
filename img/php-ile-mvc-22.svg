<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#87c7e3"/>
    </linearGradient>
    <linearGradient id="viewGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd3b6"/>
      <stop offset="100%" stop-color="#ffc4a3"/>
    </linearGradient>
    <linearGradient id="controlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5e2d0"/>
      <stop offset="100%" stop-color="#9cd4bd"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c3b1e1"/>
      <stop offset="100%" stop-color="#b09ed6"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c8e0"/>
      <stop offset="100%" stop-color="#f0b1d1"/>
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf0c0"/>
      <stop offset="100%" stop-color="#f0e4a8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Çerçeve ve başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#4a5568">PHP MVC Mimari Akışı</text>

  <!-- Ok başlangıcı - kullanıcı isteği -->
  <rect x="40" y="60" width="70" height="32" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text x="75" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a5568">İstek</text>

  <!-- Ok 1 -->
  <line x1="110" y1="76" x2="145" y2="76" stroke="#718096" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Router -->
  <rect x="145" y="60" width="80" height="32" rx="8" fill="url(#routeGrad)" filter="url(#shadow)"/>
  <text x="185" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d3a5c" font-weight="bold">Router</text>

  <!-- Ok 2 -->
  <line x1="225" y1="76" x2="260" y2="76" stroke="#718096" stroke-width="2"/>

  <!-- Controller -->
  <rect x="260" y="55" width="95" height="42" rx="10" fill="url(#controlGrad)" filter="url(#shadow)"/>
  <text x="307" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d5d4e" font-weight="bold">Controller</text>
  <text x="307" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2d5d4e">Orkestra şefi</text>

  <!-- Ok 3 - Controller'dan Model'e -->
  <line x1="300" y1="97" x2="300" y2="130" stroke="#718096" stroke-width="2"/>

  <!-- Model -->
  <rect x="240" y="130" width="120" height="45" rx="10" fill="url(#modelGrad)" filter="url(#shadow)"/>
  <text x="300" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2a5b7a" font-weight="bold">Model</text>
  <text x="300" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a5b7a">Veri erişimi</text>

  <!-- Ok 4 - Model'den DB'ye -->
  <line x1="300" y1="175" x2="300" y2="205" stroke="#718096" stroke-width="2"/>

  <!-- Veritabanı -->
  <rect x="245" y="205" width="110" height="40" rx="20" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="300" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b3a5e" font-weight="bold">Veritabanı</text>
  <text x="300" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b3a5e">SQL</text>

  <!-- Ok 5 - Veri dönüşü -->
  <line x1="300" y1="205" x2="300" y2="175" stroke="#48bb78" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Ok 6 - Model'den Controller'a dönüş -->
  <line x1="360" y1="152" x2="395" y2="125" stroke="#48bb78" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Controller'dan View'a veri -->
  <line x1="355" y1="88" x2="420" y2="88" stroke="#718096" stroke-width="2"/>

  <!-- View -->
  <rect x="420" y="65" width="95" height="46" rx="10" fill="url(#viewGrad)" filter="url(#shadow)"/>
  <text x="467" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a5430" font-weight="bold">View</text>
  <text x="467" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5430">Arayüz</text>

  <!-- Ok 7 - View'dan HTML'e -->
  <line x1="515" y1="88" x2="555" y2="88" stroke="#718096" stroke-width="2"/>

  <!-- HTML Çıktı -->
  <rect x="555" y="65" width="60" height="42" rx="10" fill="url(#htmlGrad)" filter="url(#shadow)"/>
  <text x="585" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6a20" font-weight="bold">HTML</text>
  <text x="585" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a6a20">Çıktı</text>

  <!-- Soru işareti -->
  <circle cx="390" cy="160" r="16" fill="#e2e8f0" filter="url(#shadow)"/>
  <text x="390" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a5568">?</text>

  <!-- Yan etiketler / ipuçları -->
  <rect x="40" y="255" width="180" height="45" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text x="130" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a5568">Sorumluluk Ayrımı</text>
  <text x="130" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#718096">Sürdürülebilir + Modüler</text>

  <rect x="420" y="255" width="180" height="45" rx="8" fill="#ffffff" filter="url(#shadow)"/>
  <text x="510" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a5568">Test Edilebilir</text>
  <text x="510" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#718096">K = V + M + C</text>

  <!-- Alt not -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#a0aec0">Temiz mimari · Düzenli masa · Kaybolmayan tornavida</text>

  <!-- Ok başları -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#718096"/>
    </marker>
  </defs>
</svg>