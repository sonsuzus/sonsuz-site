<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="wep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcdd2"/>
      <stop offset="100%" stop-color="#ff8a80"/>
    </linearGradient>
    <linearGradient id="wpa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="wpa2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#b39ddb"/>
    </linearGradient>
    <linearGradient id="off" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Aircrack-ng ile Kablosuz Ağ Güvenlik Testi</text>

  <!-- Protokol kutuları (sol sütun) -->
  <rect x="30" y="50" width="130" height="60" rx="10" fill="url(#wep)" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a1a1a">WEP</text>
  <text x="95" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a1a1a">RC4 + 24 bit IV</text>

  <rect x="30" y="130" width="130" height="60" rx="10" fill="url(#wpa)" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2a0a">WPA</text>
  <text x="95" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a2a0a">TKIP</text>

  <rect x="30" y="210" width="130" height="60" rx="10" fill="url(#wpa2)" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a1a">WPA2</text>
  <text x="95" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a3a1a">AES-CCMP</text>

  <!-- Ok: WEP -> Aircrack -->
  <path d="M160 80 L210 80" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="210,75 220,80 210,85" fill="#555"/>

  <!-- Ok: WPA -> Aircrack -->
  <path d="M160 160 L210 160" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="210,155 220,160 210,165" fill="#555"/>

  <!-- Ok: WPA2 -> Aircrack -->
  <path d="M160 240 L210 240" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="210,235 220,240 210,245" fill="#555"/>

  <!-- Aircrack merkez kutusu -->
  <rect x="220" y="105" width="160" height="90" rx="12" fill="url(#air)" filter="url(#shadow)"/>
  <text x="300" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#0a2a3a">Aircrack-ng</text>
  <text x="300" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0a2a3a">Trafik izleme</text>
  <text x="300" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0a2a3a">Paket yakalama</text>

  <!-- Ok: Aircrack -> CAP dosyası -->
  <path d="M380 150 L430 150" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="430,145 440,150 430,155" fill="#555"/>

  <!-- CAP dosyası -->
  <rect x="440" y="115" width="130" height="70" rx="10" fill="url(#cap)" filter="url(#shadow)"/>
  <text x="505" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a1a4a">lab-kaydi.cap</text>
  <text x="505" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a1a4a">Kimlik doğrulama</text>
  <text x="505" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a1a4a">verisi</text>

  <!-- Ok: CAP -> Çevrimdışı test -->
  <path d="M505 185 L505 225" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="500,225 505,235 510,225" fill="#555"/>

  <!-- Çevrimdışı test kutusu -->
  <rect x="410" y="235" width="190" height="55" rx="10" fill="url(#off)" filter="url(#shadow)"/>
  <text x="505" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a0a">Çevrimdışı aday testi</text>
  <text x="505" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a3a0a">T = D / R</text>

  <!-- Etik: İzinli liste -->
  <rect x="220" y="240" width="160" height="40" rx="8" fill="#e0e0e0" filter="url(#shadow)" opacity="0.8"/>
  <text x="300" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#333">İzinli aday listesi</text>
  <text x="300" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555">(yalnızca laboratuvar)</text>

  <!-- Ok: İzinli liste -> Çevrimdışı test -->
  <path d="M380 260 L410 260" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="410,255 420,260 410,265" fill="#555"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a">Önce yetki, sonra terminal — yalnızca izole laboratuvar ağında</text>
</svg>