<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cb8e8"/>
      <stop offset="100%" stop-color="#5a9bd5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0a58c"/>
      <stop offset="100%" stop-color="#e88b6f"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8d8a8"/>
      <stop offset="100%" stop-color="#7cc47c"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7b5e0"/>
      <stop offset="100%" stop-color="#b98fc9"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7d98c"/>
      <stop offset="100%" stop-color="#eec46a"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Retro BBS Terminal İstemcisi</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">ANSI Renkleri ve ZMODEM ile</text>

  <!-- Merkez çekirdek: Terminal Emülatörü -->
  <rect x="240" y="120" width="160" height="60" rx="12" fill="url(#g1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Terminal Emülatörü</text>
  <text x="320" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e8f0fe">ANSI ayrıştırıcı</text>
  <text x="320" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e8f0fe">Sonlu durum makinesi</text>

  <!-- Sol üst: Taşıma Katmanı -->
  <rect x="40" y="60" width="140" height="55" rx="10" fill="url(#g2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="110" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Taşıma Katmanı</text>
  <text x="110" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff5f0">TCP / Seri port</text>
  <text x="110" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff5f0">Bayt sırası korunur</text>

  <!-- Sol alt: Girdi Yöneticisi -->
  <rect x="40" y="200" width="140" height="55" rx="10" fill="url(#g5)" filter="url(#shadow)" opacity="0.95"/>
  <text x="110" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a4a20">Girdi Yöneticisi</text>
  <text x="110" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a20">Tuşları uzak uca yollar</text>
  <text x="110" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a20">Özel tuşlar kaçış dizisi</text>

  <!-- Sağ üst: ZMODEM Motoru -->
  <rect x="460" y="60" width="140" height="55" rx="10" fill="url(#g3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="530" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">ZMODEM Motoru</text>
  <text x="530" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0fff0">Dosya transferi</text>
  <text x="530" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0fff0">CRC + kaldığı yerden devam</text>

  <!-- Sağ alt: Karakter Seti -->
  <rect x="460" y="200" width="140" height="55" rx="10" fill="url(#g4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="530" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Karakter Seti</text>
  <text x="530" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f5eef8">CP437 çözümleme</text>
  <text x="530" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f5eef8">Yapılandırılabilir</text>

  <!-- Oklar: Taşıma -> Terminal -->
  <path d="M180 88 L230 130" stroke="#5a9bd5" stroke-width="2" fill="none"/>
  <polygon points="230,130 222,124 226,134" fill="#5a9bd5"/>

  <!-- Oklar: Terminal -> Taşıma (girdi) -->
  <path d="M230 150 L180 105" stroke="#eec46a" stroke-width="2" fill="none"/>
  <polygon points="180,105 188,108 184,99" fill="#eec46a"/>

  <!-- Oklar: Girdi -> Terminal -->
  <path d="M180 215 L230 175" stroke="#eec46a" stroke-width="2" fill="none"/>
  <polygon points="230,175 222,178 227,169" fill="#eec46a"/>

  <!-- Oklar: Terminal -> ZMODEM -->
  <path d="M400 135 L450 95" stroke="#7cc47c" stroke-width="2" fill="none"/>
  <polygon points="450,95 442,98 446,89" fill="#7cc47c"/>

  <!-- Oklar: ZMODEM -> Terminal -->
  <path d="M450 110 L400 145" stroke="#7cc47c" stroke-width="2" fill="none"/>
  <polygon points="400,145 408,142 403,150" fill="#7cc47c"/>

  <!-- Oklar: Terminal -> Karakter Seti -->
  <path d="M400 165 L450 215" stroke="#b98fc9" stroke-width="2" fill="none"/>
  <polygon points="450,215 442,212 447,221" fill="#b98fc9"/>

  <!-- Oklar: Karakter Seti -> Terminal -->
  <path d="M450 230 L400 185" stroke="#b98fc9" stroke-width="2" fill="none"/>
  <polygon points="400,185 408,188 403,179" fill="#b98fc9"/>

  <!-- Alt bilgi: Akış kontrolü -->
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a9a7a" font-style="italic">Olay tabanlı G/Ç ve akış kontrolü</text>

  <!-- Dekoratif çerçeve -->
  <rect x="5" y="5" width="630" height="310" rx="14" fill="none" stroke="#c0d8e8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
</svg>