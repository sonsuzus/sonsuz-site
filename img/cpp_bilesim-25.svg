<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1e9f0"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e8f8"/>
      <stop offset="100%" stop-color="#e0d1f0"/>
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4f0d4"/>
      <stop offset="100%" stop-color="#b8e0b8"/>
    </linearGradient>
    <linearGradient id="memGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8e8d4"/>
      <stop offset="100%" stop-color="#f0d4b8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Bileşimler (Union) Bellek Modeli</text>

  <!-- Union bloğu -->
  <rect x="60" y="55" width="200" height="210" rx="14" fill="url(#boxGrad1)" stroke="#7fb3c8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">union Ornek</text>

  <!-- Elemanlar -->
  <rect x="85" y="95" width="150" height="36" rx="8" fill="#ffffff" stroke="#a0c4d8" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="160" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">int sayi (4 byte)</text>

  <rect x="85" y="140" width="150" height="36" rx="8" fill="#ffffff" stroke="#a0c4d8" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="160" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">double ondalik (8 byte)</text>

  <rect x="85" y="185" width="150" height="36" rx="8" fill="#ffffff" stroke="#a0c4d8" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="160" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e">char harf (1 byte)</text>

  <!-- Bellek bloğu -->
  <rect x="380" y="55" width="200" height="210" rx="14" fill="url(#boxGrad2)" stroke="#b39ddb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Bellek (8 byte)</text>

  <!-- Bellek hücreleri -->
  <rect x="400" y="95" width="160" height="28" rx="6" fill="url(#memGrad)" stroke="#7cb87c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="480" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d5a2d">1. byte</text>

  <rect x="400" y="127" width="160" height="28" rx="6" fill="url(#memGrad)" stroke="#7cb87c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="480" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d5a2d">2. byte</text>

  <rect x="400" y="159" width="160" height="28" rx="6" fill="url(#memGrad)" stroke="#7cb87c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="480" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d5a2d">3. byte</text>

  <rect x="400" y="191" width="160" height="28" rx="6" fill="url(#memGrad)" stroke="#7cb87c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="480" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d5a2d">4. byte</text>

  <rect x="400" y="223" width="160" height="28" rx="6" fill="url(#memGrad2)" stroke="#c89b6a" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="480" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a4d2d">5-8. byte</text>

  <!-- Oklar (elle çizilmiş) -->
  <!-- int → bellek -->
  <line x1="235" y1="113" x2="395" y2="113" stroke="#5a8a9a" stroke-width="2"/>
  <polygon points="395,113 387,108 387,118" fill="#5a8a9a"/>

  <!-- double → bellek -->
  <line x1="235" y1="158" x2="395" y2="158" stroke="#5a8a9a" stroke-width="2"/>
  <polygon points="395,158 387,153 387,163" fill="#5a8a9a"/>

  <!-- char → bellek -->
  <line x1="235" y1="203" x2="395" y2="203" stroke="#5a8a9a" stroke-width="2"/>
  <polygon points="395,203 387,198 387,208" fill="#5a8a9a"/>

  <!-- Aynı anda tek erişim notu -->
  <rect x="140" y="270" width="360" height="36" rx="10" fill="#fff8e1" stroke="#e6c86a" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a4d2d">Aynı anda sadece bir eleman belleği kullanabilir</text>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">En büyük veri türü kadar yer ayrılır: double → 8 byte</text>
</svg>