<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="heapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d4e8f0"/>
    </linearGradient>
    <linearGradient id="stackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f8e8"/>
      <stop offset="100%" stop-color="#e0f0d0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Rust Akıllı İşaretçiler</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a8a">Bellek Yönetimi ve Sahiplik Modeli</text>

  <!-- Stack bölgesi -->
  <rect x="30" y="60" width="180" height="230" rx="10" fill="url(#stackGrad)" stroke="#b8d4a0" stroke-width="1.5" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="120" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3d6b2e">Stack</text>

  <!-- Heap bölgesi -->
  <rect x="430" y="60" width="180" height="230" rx="10" fill="url(#heapGrad)" stroke="#a0c8d8" stroke-width="1.5" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="520" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a6b8a">Heap</text>

  <!-- Box kutusu -->
  <g filter="url(#shadow)">
    <rect x="55" y="100" width="130" height="52" rx="8" fill="url(#boxGrad)" stroke="#7fb3d3" stroke-width="1.5"/>
    <text x="120" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c5f8a">Box&lt;T&gt;</text>
    <text x="120" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a9a">Tek sahip</text>
  </g>

  <!-- Rc kutusu -->
  <g filter="url(#shadow)">
    <rect x="55" y="165" width="130" height="52" rx="8" fill="url(#boxGrad)" stroke="#9b8ec4" stroke-width="1.5"/>
    <text x="120" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a4a8a">Rc&lt;T&gt;</text>
    <text x="120" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a5a9a">Paylaşılan sahiplik</text>
  </g>

  <!-- RefCell kutusu -->
  <g filter="url(#shadow)">
    <rect x="55" y="230" width="130" height="52" rx="8" fill="url(#boxGrad)" stroke="#c49b7a" stroke-width="1.5"/>
    <text x="120" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8a5a2a">RefCell&lt;T&gt;</text>
    <text x="120" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9a6a3a">İçsel değişebilirlik</text>
  </g>

  <!-- Heap veri kutuları -->
  <g filter="url(#shadowLight)">
    <rect x="455" y="100" width="130" height="40" rx="6" fill="#ffffff" stroke="#a0c8d8" stroke-width="1.2"/>
    <text x="520" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a6a8a">Veri (T)</text>
    <text x="520" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a9aaa">Boyut dinamik</text>
  </g>

  <g filter="url(#shadowLight)">
    <rect x="455" y="155" width="130" height="40" rx="6" fill="#ffffff" stroke="#a0c8d8" stroke-width="1.2"/>
    <text x="520" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a6a8a">Sayaç: r</text>
    <text x="520" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a9aaa">r = r + 1 / r - 1</text>
  </g>

  <g filter="url(#shadowLight)">
    <rect x="455" y="230" width="130" height="40" rx="6" fill="#ffffff" stroke="#a0c8d8" stroke-width="1.2"/>
    <text x="520" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a6a8a">Borrow / Mut</text>
    <text x="520" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a9aaa">Çalışma zamanı kontrol</text>
  </g>

  <!-- Ok: Box -> Heap -->
  <path d="M 185 126 L 445 120" stroke="#7fb3d3" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <polygon points="445,120 435,115 435,125" fill="#7fb3d3"/>

  <!-- Ok: Rc -> Heap -->
  <path d="M 185 191 L 445 175" stroke="#9b8ec4" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <polygon points="445,175 435,170 435,180" fill="#9b8ec4"/>

  <!-- Ok: RefCell -> Heap -->
  <path d="M 185 256 L 445 250" stroke="#c49b7a" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <polygon points="445,250 435,245 435,255" fill="#c49b7a"/>

  <!-- Alt açıklama -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a8a" opacity="0.8">Sahiplik modeli: Box tek sahip, Rc paylaşımlı, RefCell çalışma zamanı denetimli</text>

  <!-- Küçük bilgi rozetleri -->
  <circle cx="45" cy="100" r="8" fill="#7fb3d3" opacity="0.3"/>
  <text x="45" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2c5f8a">1</text>

  <circle cx="45" cy="165" r="8" fill="#9b8ec4" opacity="0.3"/>
  <text x="45" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a4a8a">N</text>

  <circle cx="45" cy="230" r="8" fill="#c49b7a" opacity="0.3"/>
  <text x="45" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#8a5a2a">R</text>
</svg>