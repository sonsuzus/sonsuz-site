<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddeaff"/>
      <stop offset="100%" stop-color="#d8f3e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6f8498" flood-opacity="0.19"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71869a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="32" r="72" fill="#dff1fb" opacity="0.5"/>
  <circle cx="591" cy="286" r="92" fill="#e4f5d9" opacity="0.52"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40556b">KENDİ MÜZİK BULUTU</text>

  <!-- Arşiv -->
  <g filter="url(#shadow)">
    <rect x="30" y="105" width="125" height="110" rx="18" fill="#fffdf9"/>
    <rect x="30" y="105" width="125" height="29" rx="18" fill="#ffe8b9"/>
    <rect x="30" y="121" width="125" height="13" fill="#ffe8b9"/>
  </g>
  <path d="M55 158 h33 l9 9 v25 H55z" fill="#f7c86e" opacity="0.9"/>
  <path d="M55 158 h32 v9 H55z" fill="#fff1cf"/>
  <path d="M65 184 q8 -11 16 0 q-8 11 -16 0z" fill="none" stroke="#a8732c" stroke-width="2"/>
  <circle cx="73" cy="184" r="2.6" fill="#a8732c"/>
  <text x="111" y="161" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#475567">Müzik Arşivi</text>
  <text x="111" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748293">FLAC • MP3</text>
  <text x="92" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748293">etiket ve kapak</text>

  <!-- Arrow archive to core -->
  <path d="M163 160 H205" fill="none" stroke="#8ba3af" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="205,160 196,155 196,165" fill="#8ba3af"/>
  <text x="183" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718294">tara</text>

  <!-- Çekirdek -->
  <g filter="url(#shadow)">
    <rect x="210" y="85" width="184" height="151" rx="24" fill="url(#core)" stroke="#c9dfea" stroke-width="1"/>
  </g>
  <circle cx="302" cy="140" r="31" fill="#fff" opacity="0.84"/>
  <path d="M292 129 v25" fill="none" stroke="#5d83a5" stroke-width="3" stroke-linecap="round"/>
  <path d="M292 129 q9 1 16 -4" fill="none" stroke="#5d83a5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="284" cy="155" r="7" fill="#5d83a5"/>
  <path d="M312 137 v18" fill="none" stroke="#5d83a5" stroke-width="3" stroke-linecap="round"/>
