  <g filter="url(#softShadow)">
    <rect x="462" y="30" width="147" height="74" rx="16" fill="#f3e9ff"/>
  </g>
  <circle cx="485" cy="57" r="13" fill="#b98ce0"/>
  <circle cx="480" cy="54" r="3" fill="#fff"/>
  <circle cx="490" cy="52" r="3" fill="#fff"/>
  <circle cx="488" cy="62" r="3" fill="#fff"/>
  <path d="M482 55 L488 52 L488 61 L480 54" fill="none" stroke="#fff" stroke-width="1.2"/>
