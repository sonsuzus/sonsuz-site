  <g filter="url(#softShadow)">
    <rect x="456" y="124" width="153" height="74" rx="16" fill="#e1f3fc"/>
  </g>
  <rect x="474" y="142" width="23" height="34" rx="5" fill="#65b4d5"/>
  <rect x="479" y="147" width="13" height="3" rx="1.5" fill="#eafaff"/>
  <rect x="479" y="154" width="13" height="3" rx="1.5" fill="#eafaff"/>
  <circle cx="485.5" cy="167" r="2.5" fill="#d6f3df"/>
  <text x="510" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#35677f">Navidrome</text>
  <text x="510" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f8192">hafif ve hızlı</text>
  <text x="510" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#668fa4">kişisel sunucu</text>

