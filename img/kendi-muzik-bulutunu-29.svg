  <text x="508" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#907b9f">ActivityPub</text>

  <!-- Middle connection -->
  <path d="M402 160 H449" fill="none" stroke="#93a7b4" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="449,160 440,155 440,165" fill="#93a7b4"/>

