  <path d="M480 253 h15 M480 259 h15 M480 265 h10" stroke="#fff5e7" stroke-width="2" stroke-linecap="round"/>
  <text x="510" y="252" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#85572d">Ampache</text>
  <text x="510" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#926d47">katalog ve yetkiler</text>
  <text x="510" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a38160">web arşivi</text>

  <!-- Client indication -->
  <path d="M302 236 V275" fill="none" stroke="#8ba3af" stroke-width="2.1" stroke-linecap="round"/>
  <polygon points="302,282 297,273 307,273" fill="#8ba3af"/>
  <g filter="url(#softShadow)">
    <rect x="220" y="284" width="165" height="25" rx="12" fill="#ffffff"/>
  </g>
  <path d="M242 291 v10 M238 292 h8" stroke="#6d9cbb" stroke-width="2" stroke-linecap="round"/>
  <text x="308" y="301.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597084">tarayıcı ve mobil istemci</text>
</svg>