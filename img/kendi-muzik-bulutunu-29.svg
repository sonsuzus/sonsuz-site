  <text x="302" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#39566d">Müzik Sunucusu</text>
  <text x="302" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#61788b">indeks • veritabanı • akış</text>
  <rect x="235" y="215" width="134" height="12" rx="6" fill="#bfe5d3"/>
