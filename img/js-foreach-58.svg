<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">JavaScript forEach Döngüsü</text>

  <!-- Ana Dizi Kutusu -->
  <rect x="240" y="55" width="160" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">Dizi</text>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5f">[1, 2, 3]</text>

  <!-- Ok: Dizi -> forEach -->
  <line x1="320" y1="103" x2="320" y2="125" stroke="#64748b" stroke-width="2"/>
  <polygon points="314,123 320,133 326,123" fill="#64748b"/>

  <!-- forEach Kutusu -->
  <rect x="220" y="135" width="200" height="48" rx="10" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#14532d">forEach()</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#14532d">callback fonksiyonu</text>

  <!-- Ok: forEach -> Callback -->
  <line x1="320" y1="183" x2="320" y2="205" stroke="#64748b" stroke-width="2"/>
  <polygon points="314,203 320,213 326,203" fill="#64748b"/>

  <!-- Callback Kutusu -->
  <rect x="220" y="215" width="200" height="48" rx="10" fill="#fde68a" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Callback</text>
  <text x="320" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78350f">her eleman için çağrılır</text>

  <!-- Sağ Taraf: Fonksiyon Türleri -->
  <rect x="470" y="135" width="140" height="40" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="540" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3730a3">İsimli Fonksiyon</text>

  <rect x="470" y="190" width="140" height="40" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="540" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3730a3">Anonim Fonksiyon</text>

  <rect x="470" y="245" width="140" height="40" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="540" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3730a3">Arrow Fonksiyon</text>

  <!-- Bağlantılar: forEach -> Türler -->
  <line x1="420" y1="155" x2="470" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="466,151 474,155 466,159" fill="#94a3b8"/>

  <line x1="420" y1="175" x2="470" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="466,206 474,210 466,214" fill="#94a3b8"/>

  <line x1="420" y1="195" x2="470" y2="265" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="466,261 474,265 466,269" fill="#94a3b8"/>

  <!-- Sol Alt: Çıktı -->
  <rect x="40" y="215" width="130" height="48" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="105" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Konsol Çıktısı</text>
  <text x="105" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7f1d1d">1, 2, 3</text>

  <!-- Ok: Callback -> Çıktı -->
  <line x1="220" y1="239" x2="170" y2="239" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="174,235 166,239 174,243" fill="#94a3b8"/>

  <!-- Alt Bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">ES6 ile arrow fonksiyonlar daha sade bir kullanım sunar</text>
</svg>