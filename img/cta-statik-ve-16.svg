  <circle cx="600" cy="288" r="84" fill="#e2d9f4" opacity="0.35"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536a">C++ BAĞLAMA KARARI</text>

