    <circle cx="493" cy="244" r="11" fill="#d7c3ec"/>
    <path d="M487 240 h12 M487 245 h8 M487 250 h4" stroke="#765599" stroke-width="1.8" stroke-linecap="round"/>
    <text x="512" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#684785">Nesne</text>
    <text x="533" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c6097">dilimleme</text>
