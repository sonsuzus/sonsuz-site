    <text x="98" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527290">Derleme zamanı</text>
    <text x="120" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527290">Tür ve overload</text>
