    <circle cx="209" cy="244" r="11" fill="#f4d68a"/>
    <text x="209" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#99752a">?</text>
    <text x="228" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80641f">Varsayılan</text>
    <text x="251" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#91783b">argüman farkı</text>
  </g>

