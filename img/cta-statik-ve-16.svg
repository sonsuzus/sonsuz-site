    <rect x="329" y="222" width="128" height="70" rx="14" fill="#eaf4ff"/>
    <circle cx="351" cy="244" r="11" fill="#bad8f3"/>
    <path d="M351 238 v7 M351 249 v1" stroke="#477da9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="370" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6f98">Kurucuda</text>
    <text x="393" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547d9d">sanal çağrı</text>
  </g>

