<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#cce6dc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#55718a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#55718a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="77" cy="43" r="56" fill="#dceeff" opacity="0.48"/>
  <circle cx="593" cy="281" r="76" fill="#dcefd8" opacity="0.5"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42627a">KENDİNİ İYİLEŞTİREN ŞEBEKE</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718798">Arıza algılama • ayırma • yeniden besleme</text>

  <!-- Sensing panel -->
  <g filter="url(#shadow)">
    <rect x="28" y="82" width="138" height="178" rx="18" fill="#ffffff"/>
  </g>
  <rect x="43" y="99" width="108" height="31" rx="11" fill="#e6f2ff"/>
  <circle cx="60" cy="114.5" r="7" fill="#6ba9dc"/>
  <path d="M57 115 L60 110 L63 115 L60 120 Z" fill="#ffffff"/>
  <text x="75" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345f7d">Saha verisi</text>

  <path d="M58 157 C70 145 81 169 93 157 C105 145 116 169 130 151" fill="none" stroke="#79a9d2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="58" cy="157" r="3.5" fill="#79a9d2"/>
  <circle cx="130" cy="151" r="3.5" fill="#79a9d2"/>
  <text x="49" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557186">Röle olayları</text>
  <text x="49" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557186">Akım ve gerilim</text>
  <text x="49" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557186">Zaman damgası</text>

  <!-- arrow left to core -->
  <path d="M169 169 L199 169" fill="none" stroke="#82a6b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="199,169 191,164 191,174" fill="#82a6b8"/>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="203" y="91" width="183" height="160" rx="24" fill="url(#core)"/>
  </g>
  <text x="251" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b71">FLISR MOTORU</text>

  <g filter="url(#soft)">
    <rect x="223" y="137" width="143" height="28" rx="10" fill="#ffffff"/>
    <circle cx="240" cy="151" r="8" fill="#f5c978"/>
    <text x="255" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#485f6e">Tespit</text>
    <text x="321" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#bd6b58">A-B arızası</text>

    <rect x="223" y="173" width="143" height="28" rx="10" fill="#ffffff"/>
    <circle cx="240" cy="187" r="8" fill="#ed9d91"/>
    <text x="255" y="191" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#485f6e">İzolasyon</text>
    <path d="M330 183 L342 195 M342 183 L330 195" stroke="#c96860" stroke-width="2" stroke-linecap="round"/>

    <rect x="223" y="209" width="143" height="28" rx="10" fill="#ffffff"/>
    <circle cx="240" cy="223" r="8" fill="#8bcba8"/>
    <text x="255" y="227" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#485f6e">Restorasyon</text>
    <path d="M326 223 L337 223 L337 218 L347 226 L337 234 L337 229 L326 229 Z" fill="#4ca36f"/>
  </g>

  <!-- arrow core to grid -->
  <path d="M389 169 L418 169" fill="none" stroke="#82a6b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="418,169 410,164 410,174" fill="#82a6b8"/>

  <!-- Grid panel -->
  <g filter="url(#shadow)">
    <rect x="422" y="72" width="190" height="205" rx="18" fill="#ffffff"/>
  </g>
  <text x="446" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386051">YENİDEN BESLEME PLANI</text>

  <!-- grid connections -->
  <path d="M455 142 L497 170" fill="none" stroke="#6b8491" stroke-width="4" stroke-linecap="round"/>
  <path d="M497 170 L550 202" fill="none" stroke="#e38b83" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/>
  <path d="M455 142 L455 220" fill="none" stroke="#6b8491" stroke-width="4" stroke-linecap="round"/>
  <path d="M455 220 L550 202" fill="none" stroke="#57ad7d" stroke-width="5" stroke-linecap="round"/>
  <path d="M550 202 L579 202" fill="none" stroke="#57ad7d" stroke-width="5" stroke-linecap="round"/>

  <!-- switch on tie -->
  <rect x="491" y="205" width="19" height="10" rx="3" fill="#d7f1df" stroke="#57ad7d" stroke-width="1.5"/>
  <path d="M495 210 L506 210" stroke="#3e9b65" stroke-width="2"/>

  <!-- nodes -->
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle">
    <circle cx="455" cy="142" r="16" fill="#cce6fa" stroke="#6d9dc0" stroke-width="2"/>
    <text x="455" y="146" fill="#315c78" font-weight="700">S</text>
    <circle cx="497" cy="170" r="15" fill="#e9f1f5" stroke="#819aa8" stroke-width="2"/>
    <text x="497" y="174" fill="#45616f" font-weight="700">A</text>
    <circle cx="550" cy="202" r="15" fill="#fff0ec" stroke="#df877c" stroke-width="2"/>
    <text x="550" y="206" fill="#a75751" font-weight="700">B</text>
    <circle cx="579" cy="202" r="15" fill="#e1f5e8" stroke="#5fa77b" stroke-width="2"/>
    <text x="579" y="206" fill="#39775a" font-weight="700">C</text>
    <circle cx="455" cy="220" r="15" fill="#dff3e6" stroke="#62a87d" stroke-width="2"/>
    <text x="455" y="224" fill="#39775a" font-weight="700">E</text>
  </g>

  <text x="469" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758996">Kaynak</text>
  <text x="510" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b76058">Açık kesici</text>
  <text x="476" y="246" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e936b">E-C kapalı</text>

  <!-- capacity status -->
  <rect x="436" y="254" width="160" height="1" fill="#dce8e1"/>
  <circle cx="451" cy="266" r="5" fill="#65b782"/>
  <text x="464" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7560">Kapasite uygun · 3 / 4 MW</text>
</svg>