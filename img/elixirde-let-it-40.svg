<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="superGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b5e8c3"/>
      <stop offset="100%" stop-color="#8fd6a8"/>
    </linearGradient>
    <linearGradient id="crashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb3b3"/>
      <stop offset="100%" stop-color="#ff8a8a"/>
    </linearGradient>
    <linearGradient id="restartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2d3436">Let It Crash Mimarisi</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#636e72">Süreç izolasyonu ve denetim ağaçları</text>

  <!-- Üst süpervizör -->
  <rect x="245" y="60" width="150" height="40" rx="10" fill="url(#superGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Supervisor</text>

  <!-- Alt süpervizörler -->
  <rect x="80" y="130" width="130" height="36" rx="8" fill="url(#superGrad)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="145" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1a5276">Sup A</text>

  <rect x="255" y="130" width="130" height="36" rx="8" fill="url(#superGrad)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1a5276">Sup B</text>

  <rect x="430" y="130" width="130" height="36" rx="8" fill="url(#superGrad)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="495" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1a5276">Sup C</text>

  <!-- Bağlantı çizgileri (üst süpervizörden alt süpervizörlere) -->
  <line x1="280" y1="100" x2="145" y2="128" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="320" y1="100" x2="320" y2="128" stroke="#7ec8e3" stroke-width="2"/>
  <line x1="360" y1="100" x2="495" y2="128" stroke="#7ec8e3" stroke-width="2"/>

  <!-- İşçi süreçler -->
  <rect x="30" y="200" width="90" height="32" rx="7" fill="url(#workerGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="75" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6f3f">Worker 1</text>

  <rect x="140" y="200" width="90" height="32" rx="7" fill="url(#workerGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="185" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6f3f">Worker 2</text>

  <rect x="250" y="200" width="90" height="32" rx="7" fill="url(#workerGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="295" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6f3f">Worker 3</text>

  <rect x="360" y="200" width="90" height="32" rx="7" fill="url(#workerGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="405" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6f3f">Worker 4</text>

  <rect x="470" y="200" width="90" height="32" rx="7" fill="url(#workerGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="515" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6f3f">Worker 5</text>

  <!-- Bağlantı çizgileri (alt süpervizörlerden işçilere) -->
  <line x1="110" y1="166" x2="75" y2="198" stroke="#8fd6a8" stroke-width="1.5"/>
  <line x1="160" y1="166" x2="185" y2="198" stroke="#8fd6a8" stroke-width="1.5"/>
  <line x1="290" y1="166" x2="295" y2="198" stroke="#8fd6a8" stroke-width="1.5"/>
  <line x1="350" y1="166" x2="405" y2="198" stroke="#8fd6a8" stroke-width="1.5"/>
  <line x1="460" y1="166" x2="515" y2="198" stroke="#8fd6a8" stroke-width="1.5"/>

  <!-- Çöken süreç -->
  <rect x="250" y="255" width="90" height="32" rx="7" fill="url(#crashGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="295" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7b241c">Çöktü!</text>

  <!-- Yeniden başlatma oku -->
  <path d="M 295 232 L 295 253" stroke="#fdcb6e" stroke-width="2" fill="none"/>
  <polygon points="290,250 295,258 300,250" fill="#fdcb6e"/>

  <!-- Yeniden başlatma etiketi -->
  <rect x="310" y="255" width="100" height="32" rx="7" fill="url(#restartGrad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="360" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d6608">Yeniden Başlat</text>

  <!-- Yeniden başlatma oku -->
  <path d="M 410 271 L 345 271" stroke="#fdcb6e" stroke-width="2" fill="none"/>
  <polygon points="348,266 340,271 348,276" fill="#fdcb6e"/>

  <!-- İzolasyon vurgusu -->
  <rect x="30" y="255" width="190" height="32" rx="7" fill="#e8f0fe" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="125" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">İzole bellek ve mesaj kutusu</text>

  <!-- Dayanıklılık formülü -->
  <rect x="470" y="255" width="140" height="32" rx="7" fill="#eafaf1" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="540" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6f3f">İzolasyon × Denetim</text>

  <!-- Strateji etiketi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#636e72">Stratejiler: one_for_one, one_for_all, rest_for_one</text>
</svg>