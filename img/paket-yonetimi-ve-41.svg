<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="mod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
    <linearGradient id="dep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="sum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ba68c8"/>
    </linearGradient>
    <linearGradient id="semver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="100%" stop-color="#e57373"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Go Modül Mimarisi</text>

  <!-- Merkez modül -->
  <rect x="245" y="55" width="150" height="50" rx="10" fill="url(#mod)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Modül</text>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">go.mod + go.sum</text>

  <!-- Paketler (sol üst) -->
  <rect x="40" y="130" width="130" height="40" rx="8" fill="url(#pkg)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="105" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">Paketler</text>
  <text x="105" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1565c0">payment, user, logger</text>

  <!-- internal paketi (sol alt) -->
  <rect x="40" y="195" width="130" height="40" rx="8" fill="url(#pkg)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="105" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">internal</text>
  <text x="105" y="227" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1565c0">yalnızca iç kullanım</text>

  <!-- Bağımlılıklar (sağ üst) -->
  <rect x="470" y="130" width="130" height="40" rx="8" fill="url(#dep)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="535" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Bağımlılıklar</text>
  <text x="535" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ef6c00">uuid v1.6.0</text>

  <!-- Sürüm kontrolü (sağ alt) -->
  <rect x="470" y="195" width="130" height="40" rx="8" fill="url(#semver)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="535" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#b71c1c">Sürümleme</text>
  <text x="535" y="227" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c62828">MAJOR.MINOR.PATCH</text>

  <!-- go.sum (alt orta) -->
  <rect x="245" y="195" width="150" height="40" rx="8" fill="url(#sum)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">go.sum</text>
  <text x="320" y="227" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a1b9a">doğrulama izleri</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Modül -> Paketler -->
  <path d="M245,80 L175,130" stroke="#64b5f6" stroke-width="2" fill="none"/>
  <polygon points="175,130 184,124 178,136" fill="#64b5f6"/>

  <!-- Modül -> Bağımlılıklar -->
  <path d="M395,80 L465,130" stroke="#ffb74d" stroke-width="2" fill="none"/>
  <polygon points="465,130 456,124 462,136" fill="#ffb74d"/>

  <!-- Modül -> go.sum -->
  <path d="M320,105 L320,190" stroke="#ba68c8" stroke-width="2" fill="none"/>
  <polygon points="320,190 315,181 325,181" fill="#ba68c8"/>

  <!-- Paketler -> internal -->
  <path d="M105,170 L105,190" stroke="#64b5f6" stroke-width="1.5" fill="none"/>
  <polygon points="105,190 100,183 110,183" fill="#64b5f6"/>

  <!-- Bağımlılıklar -> Sürümleme -->
  <path d="M535,170 L535,190" stroke="#ffb74d" stroke-width="1.5" fill="none"/>
  <polygon points="535,190 530,183 540,183" fill="#ffb74d"/>

  <!-- Alt bilgi -->
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#546e7a" opacity="0.8">go mod init + go get + go mod tidy</text>

  <!-- Komut etiketi -->
  <rect x="200" y="280" width="240" height="25" rx="12" fill="#37474f" opacity="0.08"/>
  <text x="320" y="297" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#455a64" font-weight="bold">go mod init github.com/kullanici/proje</text>
</svg>