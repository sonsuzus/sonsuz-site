<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#5268c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5c7291" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5c7291" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="149" r="103" fill="#dfeafb" opacity="0.52"/>
  <circle cx="320" cy="149" r="82" fill="none" stroke="#b8cae3" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Veri -->
  <g filter="url(#softShadow)">
    <rect x="42" y="68" width="128" height="64" rx="16" fill="#ffffff"/>
    <rect x="42" y="68" width="7" height="64" rx="3.5" fill="#65b9c3"/>
  </g>
  <circle cx="75" cy="91" r="12" fill="#d9f3f1"/>
  <path d="M68 94 L73 89 L78 92 L84 84" fill="none" stroke="#3a9fa9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="99" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29445b" font-weight="600">Piyasa Verisi</text>
  <text x="99" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698094">Fiyat · Hacim</text>

  <!-- Sinyal -->
  <g filter="url(#softShadow)">
    <rect x="235" y="35" width="170" height="62" rx="16" fill="#ffffff"/>
    <rect x="235" y="35" width="170" height="7" rx="3.5" fill="#8a7ee8"/>
  </g>
  <circle cx="267" cy="68" r="13" fill="#ebe8ff"/>
  <path d="M258 73 L263 67 L268 70 L276 61" fill="none" stroke="#7467d3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290" y="66" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29445b" font-weight="600">Sinyal Motoru</text>
  <text x="290" y="83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698094">Ortalama · Kural</text>

  <!-- Risk -->
  <g filter="url(#softShadow)">
    <rect x="469" y="69" width="128" height="64" rx="16" fill="#ffffff"/>
    <rect x="590" y="69" width="7" height="64" rx="3.5" fill="#f0a35e"/>
  </g>
  <path d="M502 82 L516 87 L516 97 C516 105 510 110 502 113 C494 110 488 105 488 97 L488 87 Z" fill="#fff0df" stroke="#e79850" stroke-width="1.5"/>
  <path d="M496 97 L500 101 L508 92" fill="none" stroke="#d47a31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="526" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29445b" font-weight="600">Risk Kontrolü</text>
  <text x="526" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698094">Limit · Kayıp</text>

  <!-- Borsa -->
  <g filter="url(#softShadow)">
    <rect x="445" y="188" width="148" height="65" rx="16" fill="#ffffff"/>
    <rect x="445" y="246" width="148" height="7" rx="3.5" fill="#ed7583"/>
  </g>
  <circle cx="478" cy="219" r="13" fill="#ffe7ea"/>
  <path d="M470 223 L477 216 L482 221 L487 214" fill="none" stroke="#db6372" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="501" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29445b" font-weight="600">Emir Yürütme</text>
  <text x="501" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698094">Borsa · Gerçekleşme</text>

  <!-- Merkezi algoritma -->
  <g filter="url(#shadow)">
    <rect x="238" y="120" width="164" height="72" rx="22" fill="url(#core)"/>
    <circle cx="274" cy="156" r="18" fill="#ffffff" opacity="0.18"/>
    <path d="M264 158 L271 151 L277 157 L285 147" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="301" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="600">ALGORİTMA</text>
    <text x="301" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e7ebff">Hızlı · Tutarlı</text>
  </g>

  <!-- Connections -->
  <path d="M170 100 C198 100 204 134 238 142" fill="none" stroke="#72aeb8" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="232,137 240,143 230,145" fill="#72aeb8"/>
  <path d="M320 97 L320 119" fill="none" stroke="#8378d9" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="315,113 320,121 325,113" fill="#8378d9"/>
  <path d="M402 142 C433 132 440 103 469 101" fill="none" stroke="#d99a5a" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="461,97 470,101 463,106" fill="#d99a5a"/>
  <path d="M402 169 C430 177 433 207 445 215" fill="none" stroke="#d86e7a" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="438,208 447,216 436,217" fill="#d86e7a"/>

  <!-- Feedback -->
  <path d="M445 238 C359 289 197 274 166 187 C154 155 181 142 225 150" fill="none" stroke="#9ab2cc" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/>
  <polygon points="218,145 228,150 219,154" fill="#9ab2cc"/>
  <rect x="65" y="231" width="146" height="45" rx="14" fill="#ffffff" filter="url(#softShadow)"/>
  <circle cx="91" cy="253" r="10" fill="#e3f0ff"/>
  <path d="M86 254 L90 258 L97 249" fill="none" stroke="#528dc5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="109" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405d77" font-weight="600">Test ve İzleme</text>
</svg>