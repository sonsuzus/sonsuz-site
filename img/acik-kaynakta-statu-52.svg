<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fae8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#d1ebd1"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8ef"/>
      <stop offset="100%" stop-color="#f8d4e0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#d5d8ef"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#fcefb9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Açık Kaynakta Statü Algısı</text>

  <!-- Merkez düğüm -->
  <rect x="255" y="120" width="130" height="44" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#7a9cc6" stroke-width="1.5"/>
  <text x="320" y="138" text-anchor="middle" font-weight="bold" fill="#2c3e50">Algılanan Statü</text>
  <text x="320" y="154" text-anchor="middle" fill="#34495e" font-size="11">S = αC + βQ + γV + δR</text>

  <!-- Sol üst: Katkı Miktarı -->
  <rect x="55" y="40" width="120" height="40" rx="8" fill="url(#box2)" filter="url(#shadow)" stroke="#d4a054" stroke-width="1.2"/>
  <text x="115" y="56" text-anchor="middle" font-weight="bold" fill="#5d4037">Katkı Miktarı</text>
  <text x="115" y="70" text-anchor="middle" fill="#6d4c41" font-size="11">commit, PR, yıldız</text>

  <!-- Sol alt: Görünürlük -->
  <rect x="55" y="220" width="120" height="40" rx="8" fill="url(#box3)" filter="url(#shadow)" stroke="#5aa05a" stroke-width="1.2"/>
  <text x="115" y="236" text-anchor="middle" font-weight="bold" fill="#2e5d2e">Görünürlük</text>
  <text x="115" y="250" text-anchor="middle" fill="#3a6e3a" font-size="11">tanınırlık, popülerlik</text>

  <!-- Sağ üst: Katkı Kalitesi -->
  <rect x="465" y="40" width="120" height="40" rx="8" fill="url(#box4)" filter="url(#shadow)" stroke="#c06080" stroke-width="1.2"/>
  <text x="525" y="56" text-anchor="middle" font-weight="bold" fill="#6d2e44">Katkı Kalitesi</text>
  <text x="525" y="70" text-anchor="middle" fill="#7d3a54" font-size="11">inceleme, mentorluk</text>

  <!-- Sağ alt: İlişkisel Sermaye -->
  <rect x="465" y="220" width="120" height="40" rx="8" fill="url(#box5)" filter="url(#shadow)" stroke="#5a6ea0" stroke-width="1.2"/>
  <text x="525" y="236" text-anchor="middle" font-weight="bold" fill="#2e3d6e">İlişkisel Sermaye</text>
  <text x="525" y="250" text-anchor="middle" fill="#3a4d7e" font-size="11">ağ, tarihsel yakınlık</text>

  <!-- Alt merkez: Görünmez Emek -->
  <rect x="255" y="250" width="130" height="36" rx="8" fill="url(#box6)" filter="url(#shadow)" stroke="#b8a040" stroke-width="1.2"/>
  <text x="320" y="264" text-anchor="middle" font-weight="bold" fill="#5d4e20">Görünmez Emek</text>
  <text x="320" y="278" text-anchor="middle" fill="#6d5e30" font-size="11">arabuluculuk, bakım</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üst -> Merkez -->
  <path d="M175,62 L245,118" stroke="#7a9cc6" stroke-width="1.8" fill="none"/>
  <polygon points="245,118 236,112 238,121" fill="#7a9cc6"/>

  <!-- Sol alt -> Merkez -->
  <path d="M175,242 L245,168" stroke="#7a9cc6" stroke-width="1.8" fill="none"/>
  <polygon points="245,168 236,172 241,164" fill="#7a9cc6"/>

  <!-- Sağ üst -> Merkez -->
  <path d="M465,62 L395,118" stroke="#7a9cc6" stroke-width="1.8" fill="none"/>
  <polygon points="395,118 402,112 400,121" fill="#7a9cc6"/>

  <!-- Sağ alt -> Merkez -->
  <path d="M465,242 L395,168" stroke="#7a9cc6" stroke-width="1.8" fill="none"/>
  <polygon points="395,168 402,172 397,164" fill="#7a9cc6"/>

  <!-- Görünmez Emek -> Merkez (kesikli) -->
  <line x1="320" y1="248" x2="320" y2="166" stroke="#b8a040" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="320,166 315,174 325,174" fill="#b8a040"/>

  <!-- Etiket: Görünmez emek katkısı -->
  <text x="345" y="215" fill="#8a7a40" font-size="10" font-style="italic">göz ardı edilir</text>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" fill="#7f8c8d" font-size="10">Meritokrasi anlatısı α ve β'yı öne çıkarır; pratikte γ ve δ belirleyicidir</text>
</svg>