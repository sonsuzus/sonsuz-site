<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="legit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3e7"/>
      <stop offset="1" stop-color="#bce5d0"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1dc"/>
      <stop offset="1" stop-color="#f8bbb5"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8ff"/>
      <stop offset="1" stop-color="#c9d5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8498" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8092a0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="78" cy="43" r="62" fill="#dceeff" opacity="0.48"/>
  <circle cx="575" cy="278" r="88" fill="#dff2df" opacity="0.45"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536a">BGP Rota Kaçırma</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718196">Trafik yolu ve doğrulama</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="28" y="125" width="103" height="74" rx="17" fill="#ffffff"/>
    <circle cx="55" cy="151" r="13" fill="#d5e8ff"/>
    <path d="M48 151h14M55 144v14" stroke="#4979a9" stroke-width="2" stroke-linecap="round"/>
    <rect x="47" y="172" width="65" height="7" rx="3.5" fill="#c7d8e9"/>
    <rect x="57" y="184" width="45" height="5" rx="2.5" fill="#e0eaf3"/>
  </g>
  <text x="79.5" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42566c">Kullanıcı</text>

  <!-- BGP decision cloud -->
  <g filter="url(#shadow)">
    <rect x="178" y="106" width="133" height="109" rx="23" fill="#fffefb"/>
    <circle cx="211" cy="143" r="18" fill="#e5edff"/>
    <circle cx="241" cy="132" r="22" fill="#d7e4fb"/>
    <circle cx="270" cy="147" r="19" fill="#e7efff"/>
    <rect x="202" y="148" width="80" height="22" rx="11" fill="#d5e2fa"/>
    <path d="M216 158h51" stroke="#6682a9" stroke-width="2" stroke-linecap="round"/>
    <path d="M216 181h56M216 191h42" stroke="#aab9ca" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="244.5" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42566c">BGP Kararı</text>

  <!-- route client to bgp -->
  <path d="M132 161 C148 161 158 161 174 161" fill="none" stroke="#7692ae" stroke-width="3" stroke-linecap="round"/>
  <polygon points="177,161 168,156 168,166" fill="#7692ae"/>

  <!-- legitimate route top -->
  <path d="M311 139 C339 112 350 91 382 88" fill="none" stroke="#68ae89" stroke-width="4" stroke-linecap="round"/>
  <polygon points="386,88 377,83 379,94" fill="#68ae89"/>
  <text x="321" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d8c6c">Normal rota</text>

  <g filter="url(#shadow)">
    <rect x="387" y="51" width="116" height="74" rx="17" fill="url(#legit)"/>
    <circle cx="414" cy="78" r="15" fill="#ffffff" opacity="0.72"/>
    <path d="M406 79l6 6 12-14" fill="none" stroke="#438464" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="455" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386b52">Meşru AS</text>
    <text x="455" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a806b">ASN 64500</text>
  </g>

  <!-- attack route -->
  <path d="M311 181 C336 205 346 225 380 231" fill="none" stroke="#df7870" stroke-width="4" stroke-linecap="round"/>
  <polygon points="385,232 376,225 375,236" fill="#df7870"/>
  <text x="319" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ba5c59">Daha özgül /24</text>

  <g filter="url(#shadow)">
    <rect x="386" y="196" width="117" height="75" rx="17" fill="url(#risk)"/>
    <circle cx="415" cy="222" r="15" fill="#fff6f4" opacity="0.86"/>
    <path d="M415 213v11M415 230.5v1" stroke="#c5554f" stroke-width="3" stroke-linecap="round"/>
    <text x="456" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#994b4a">Şüpheli AS</text>
    <text x="456" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a96360">ASN 64496</text>
  </g>

  <!-- destination -->
  <g filter="url(#shadow)">
    <rect x="541" y="119" width="71" height="86" rx="18" fill="url(#safe)"/>
    <rect x="556" y="137" width="41" height="30" rx="5" fill="#ffffff" opacity="0.9"/>
    <path d="M563 148h27M563 156h18" stroke="#7992bb" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M565 181h23" stroke="#5d79a8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="576.5" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42566c">Hedef</text>

  <!-- paths to destination -->
  <path d="M504 88 C526 92 533 122 538 145" fill="none" stroke="#68ae89" stroke-width="3" stroke-linecap="round"/>
  <polygon points="539,150 533,140 544,141" fill="#68ae89"/>
  <path d="M504 233 C528 224 534 199 539 178" fill="none" stroke="#df7870" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
  <polygon points="540,173 544,184 533,182" fill="#df7870"/>

  <!-- protection badge -->
  <g filter="url(#soft)">
    <rect x="254" y="262" width="135" height="36" rx="18" fill="#ffffff"/>
    <path d="M273 270l9-4 9 4v8c0 6-4 10-9 12-5-2-9-6-9-12z" fill="#d8ebdf" stroke="#5c9b75" stroke-width="1.4"/>
    <path d="M278 278l3 3 5-6" fill="none" stroke="#4a8764" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="332" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6276">RPKI / ROV Doğrulama</text>
  </g>
  <path d="M445 272 C432 284 415 280 394 280" fill="none" stroke="#7fa78d" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="390,280 398,275 398,285" fill="#7fa78d"/>
</svg>