<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Kalıtım Mimarisi</text>

  <!-- Ana Sınıf (Üstte) -->
  <rect x="220" y="52" width="200" height="56" rx="12" fill="#a8d8ea" filter="url(#shadow)" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="320" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">Ana Sınıf</text>
  <text x="320" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Veri + Metotlar</text>

  <!-- Oklar (Ana -> Alt) -->
  <polygon points="220,80 200,80 208,74 208,86" fill="#5dade2"/>
  <polygon points="420,80 440,80 432,74 432,86" fill="#5dade2"/>

  <!-- Alt Sınıf 1 -->
  <rect x="40" y="150" width="160" height="60" rx="12" fill="#d5f5e3" filter="url(#shadow)" stroke="#82e0aa" stroke-width="1.5"/>
  <text x="120" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e8449">Alt Sınıf 1</text>
  <text x="120" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Devralma + Yeni Özellik</text>

  <!-- Alt Sınıf 2 -->
  <rect x="240" y="150" width="160" height="60" rx="12" fill="#fdebd0" filter="url(#shadow)" stroke="#f5b041" stroke-width="1.5"/>
  <text x="320" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#b9770e">Alt Sınıf 2</text>
  <text x="320" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Metot Ezme (Override)</text>

  <!-- Alt Sınıf 3 -->
  <rect x="440" y="150" width="160" height="60" rx="12" fill="#e8daef" filter="url(#shadow)" stroke="#bb8fce" stroke-width="1.5"/>
  <text x="520" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#6c3483">Alt Sınıf 3</text>
  <text x="520" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Genişletilmiş Davranış</text>

  <!-- Dikey bağlantı çizgileri -->
  <line x1="120" y1="108" x2="120" y2="150" stroke="#5dade2" stroke-width="2"/>
  <line x1="320" y1="108" x2="320" y2="150" stroke="#5dade2" stroke-width="2"/>
  <line x1="520" y1="108" x2="520" y2="150" stroke="#5dade2" stroke-width="2"/>

  <!-- Ortak özellikler etiketi -->
  <rect x="180" y="240" width="280" height="52" rx="10" fill="#ffffff" filter="url(#shadowLight)" stroke="#d5dbdb" stroke-width="1" opacity="0.85"/>
  <text x="320" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Ortak Özellikler</text>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5d6d7e">Kod Tekrarını Önler</text>

  <!-- Alt sınıflardan ortak özelliklere ince çizgiler -->
  <line x1="120" y1="210" x2="120" y2="240" stroke="#aab7b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="320" y1="210" x2="320" y2="240" stroke="#aab7b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="520" y1="210" x2="520" y2="240" stroke="#aab7b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">Türetme: Ana Sınıf → Alt Sınıflar</text>
</svg>