<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6b8297" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6b8297" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="160" r="119" fill="#ffffff" opacity="0.38"/>
  <circle cx="319" cy="160" r="92" fill="none" stroke="#b8d4e2" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.75"/>

  <!-- bağlantılar -->
  <path d="M268 139 C231 123 217 102 190 89" fill="none" stroke="#7698b0" stroke-width="2"/>
  <polygon points="190,89 200,87 195,96" fill="#7698b0"/>
  <path d="M268 180 C230 197 219 218 191 230" fill="none" stroke="#7698b0" stroke-width="2"/>
  <polygon points="191,230 197,221 201,231" fill="#7698b0"/>
  <path d="M372 139 C409 123 424 103 452 89" fill="none" stroke="#7698b0" stroke-width="2"/>
  <polygon points="452,89 447,98 443,88" fill="#7698b0"/>
  <path d="M372 180 C410 197 423 217 451 230" fill="none" stroke="#7698b0" stroke-width="2"/>
  <polygon points="451,230 441,230 446,221" fill="#7698b0"/>

  <!-- geri bildirim döngüsü -->
  <path d="M486 246 C511 278 427 292 349 276" fill="none" stroke="#9b88ba" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="349,276 358,270 356,280" fill="#9b88ba"/>

  <!-- görev -->
  <g filter="url(#smallShadow)">
    <rect x="36" y="132" width="118" height="56" rx="16" fill="#ffffff"/>
    <rect x="47" y="144" width="22" height="22" rx="7" fill="#d1fae5"/>
    <path d="M53 155 L57 159 L64 150" fill="none" stroke="#28836c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#28455b" font-weight="600">Hedef</text>
    <text x="80" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607b8d">Görev girişi</text>
  </g>
  <path d="M154 160 L255 160" fill="none" stroke="#668ba5" stroke-width="2.5"/>
  <polygon points="255,160 245,154 245,166" fill="#668ba5"/>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <rect x="267" y="119" width="106" height="82" rx="22" fill="url(#core)" stroke="#9bc6e3" stroke-width="1.2"/>
    <circle cx="320" cy="145" r="14" fill="#ffffff" opacity="0.8"/>
    <path d="M313 145 C316 138 324 138 327 145 C324 152 316 152 313 145Z" fill="#5488ae"/>
    <circle cx="320" cy="145" r="3" fill="#ffffff"/>
    <text x="320" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#244763" font-weight="700">Orkestratör</text>
    <text x="320" y="191" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527188">Politika ve akış</text>
  </g>

  <!-- araştırmacı -->
  <g filter="url(#smallShadow)">
    <rect x="72" y="49" width="119" height="57" rx="16" fill="#fff5d8"/>
    <circle cx="96" cy="76" r="13" fill="#fde5a5"/>
    <circle cx="94" cy="74" r="5" fill="none" stroke="#a97625" stroke-width="2"/>
    <path d="M98 78 L103 83" stroke="#a97625" stroke-width="2" stroke-linecap="round"/>
    <text x="117" y="74" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#674817" font-weight="700">Araştırmacı</text>
    <text x="117" y="90" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#92713d">Bulgu ve kaynak</text>
  </g>

  <!-- planlayıcı -->
  <g filter="url(#smallShadow)">
    <rect x="450" y="49" width="119" height="57" rx="16" fill="#e9e0fb"/>
    <circle cx="474" cy="76" r="13" fill="#d8c8f5"/>
    <path d="M468 70 L480 70 M468 76 L480 76 M468 82 L476 82" stroke="#70569d" stroke-width="2" stroke-linecap="round"/>
    <text x="495" y="74" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#523c7d" font-weight="700">Planlayıcı</text>
    <text x="495" y="90" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79659e">Adım ve bağımlılık</text>
  </g>

  <!-- uygulayıcı -->
  <g filter="url(#smallShadow)">
    <rect x="71" y="214" width="121" height="57" rx="16" fill="#dff5f0"/>
    <circle cx="96" cy="241" r="13" fill="#bfe8dd"/>
    <path d="M91 236 L87 241 L91 246 M101 236 L105 241 L101 246" fill="none" stroke="#287e75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="117" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#245f59" font-weight="700">Uygulayıcı</text>
    <text x="117" y="255" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54817c">Araç çağrısı</text>
  </g>

  <!-- denetçi -->
  <g filter="url(#smallShadow)">
    <rect x="449" y="214" width="121" height="57" rx="16" fill="#fde4e6"/>
    <circle cx="474" cy="241" r="13" fill="#f6c6cc"/>
    <path d="M474 233 L480 236 L479 244 C477 247 474 249 474 249 C474 249 471 247 469 244 L468 236 Z" fill="none" stroke="#ad5260" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M471 241 L473 243 L477 238" fill="none" stroke="#ad5260" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="495" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#813943" font-weight="700">Denetçi</text>
    <text x="495" y="255" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a0646b">Kalite kapısı</text>
  </g>

  <!-- bellek -->
  <g filter="url(#smallShadow)">
    <rect x="255" y="242" width="130" height="46" rx="15" fill="#ffffff"/>
    <ellipse cx="278" cy="253" rx="10" ry="4" fill="#c8def0"/>
    <path d="M268 253 L268 267 C268 272 288 272 288 267 L288 253" fill="#dbeafa"/>
    <path d="M268 260 C268 265 288 265 288 260 M268 267 C268 272 288 272 288 267" fill="none" stroke="#6b98ba" stroke-width="1"/>
    <text x="301" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355b76" font-weight="700">Bellek</text>
    <text x="301" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668298">Bağlam ve kayıt</text>
  </g>
  <path d="M320 201 L320 239" fill="none" stroke="#668ba5" stroke-width="2"/>
  <polygon points="320,239 314,229 326,229" fill="#668ba5"/>

  <!-- çıktı -->
  <g filter="url(#smallShadow)">
    <rect x="500" y="132" width="104" height="56" rx="16" fill="#ffffff"/>
    <rect x="513" y="145" width="21" height="18" rx="5" fill="#dbeafe"/>
    <path d="M517 154 L521 158 L529 150" fill="none" stroke="#477da5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="544" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#28455b" font-weight="700">Sonuç</text>
    <text x="544" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607b8d">Onaylı çıktı</text>
  </g>
  <path d="M373 160 L500 160" fill="none" stroke="#668ba5" stroke-width="2.5"/>
  <polygon points="500,160 490,154 490,166" fill="#668ba5"/>
</svg>