<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="ruleGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#ff7043"/>
    </linearGradient>
    <linearGradient id="ruleGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </linearGradient>
    <linearGradient id="ruleGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#ab47bc"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Merkez Boids modeli -->
  <rect x="240" y="120" width="160" height="80" rx="16" fill="url(#centerGrad)" filter="url(#shadow)"/>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Boids Modeli</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e3f2fd">Sürü Zekâsı</text>
  <text x="320" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e3f2fd">Simülasyon</text>

  <!-- Üç kural -->
  <!-- Ayrılma -->
  <rect x="40" y="40" width="140" height="70" rx="12" fill="url(#ruleGrad1)" filter="url(#shadow)"/>
  <text x="110" y="66" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Ayrılma</text>
  <text x="110" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffe0b2">Çarpışma Önleme</text>
  <text x="110" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffe0b2">w_s</text>

  <!-- Hizalanma -->
  <rect x="40" y="140" width="140" height="70" rx="12" fill="url(#ruleGrad2)" filter="url(#shadow)"/>
  <text x="110" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Hizalanma</text>
  <text x="110" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b2dfdb">Yön Birliği</text>
  <text x="110" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#b2dfdb">w_a</text>

  <!-- Bütünleşme -->
  <rect x="40" y="240" width="140" height="70" rx="12" fill="url(#ruleGrad3)" filter="url(#shadow)"/>
  <text x="110" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Bütünleşme</text>
  <text x="110" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e1bee7">Grup Bütünlüğü</text>
  <text x="110" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e1bee7">w_c</text>

  <!-- Çıktı -->
  <rect x="460" y="120" width="140" height="80" rx="16" fill="url(#outGrad)" filter="url(#shadow)"/>
  <text x="530" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#f57f17">Kolektif Davranış</text>
  <text x="530" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#795548">Düzen ve Kaos</text>
  <text x="530" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#795548">Dengesi</text>

  <!-- Oklar -->
  <!-- Ayrılma oku -->
  <path d="M 180 75 L 232 75" stroke="#ff7043" stroke-width="2.5" fill="none"/>
  <polygon points="238,75 228,69 228,81" fill="#ff7043"/>

  <!-- Hizalanma oku -->
  <path d="M 180 175 L 232 175" stroke="#26a69a" stroke-width="2.5" fill="none"/>
  <polygon points="238,175 228,169 228,181" fill="#26a69a"/>

  <!-- Bütünleşme oku -->
  <path d="M 180 275 L 232 275" stroke="#ab47bc" stroke-width="2.5" fill="none"/>
  <polygon points="238,275 228,269 228,281" fill="#ab47bc"/>

  <!-- Merkezden çıktıya ok -->
  <path d="M 400 160 L 452 160" stroke="#fbc02d" stroke-width="2.5" fill="none"/>
  <polygon points="458,160 448,154 448,166" fill="#fbc02d"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c">Yerel kurallar → Küresel örüntü</text>
</svg>