<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#d1e8d9"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef7e0"/>
      <stop offset="100%" stop-color="#fde9c8"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f6d7d4"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="centerBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3d7f5"/>
      <stop offset="100%" stop-color="#d0c1e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#3a4a5a">C İşlemciler ve Öncelik Sırası</text>

  <!-- Merkez kutu -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#centerBox)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a2a5a">İşlemciler</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a3a6a">İfadede işlem yapan</text>

  <!-- Aritmetik işlemciler -->
  <rect x="30" y="60" width="130" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="95" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a7a">Aritmetik</text>
  <text x="95" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a8a">+ - * / %</text>

  <!-- İlişkisel işlemciler -->
  <rect x="30" y="130" width="130" height="45" rx="10" fill="url(#box2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="95" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a6a3a">İlişkisel</text>
  <text x="95" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a7a4a">&lt; &gt; == !=</text>

  <!-- Mantıksal işlemciler -->
  <rect x="30" y="200" width="130" height="45" rx="10" fill="url(#box3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="95" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5a2a">Mantıksal</text>
  <text x="95" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a6a3a">&amp;&amp; || !</text>

  <!-- Atama işlemcileri -->
  <rect x="480" y="60" width="130" height="45" rx="10" fill="url(#box4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="545" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a2a2a">Atama</text>
  <text x="545" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a3a3a">= += -= *=</text>

  <!-- Özel işlemciler -->
  <rect x="480" y="130" width="130" height="45" rx="10" fill="url(#box5)" filter="url(#shadow)" opacity="0.95"/>
  <text x="545" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a7a">Özel</text>
  <text x="545" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a8a">&amp; ?: sizeof</text>

  <!-- Oklar (merkezden dışa) -->
  <!-- Sol üst -->
  <path d="M 245 130 L 165 92" stroke="#4a6a8a" stroke-width="1.8" fill="none" opacity="0.7"/>
  <polygon points="165 92, 174 96, 168 101" fill="#4a6a8a" opacity="0.7"/>
  <!-- Sol orta -->
  <path d="M 245 145 L 165 150" stroke="#4a6a8a" stroke-width="1.8" fill="none" opacity="0.7"/>
  <polygon points="165 150, 174 148, 174 153" fill="#4a6a8a" opacity="0.7"/>
  <!-- Sol alt -->
  <path d="M 245 160 L 165 208" stroke="#4a6a8a" stroke-width="1.8" fill="none" opacity="0.7"/>
  <polygon points="165 208, 174 204, 168 199" fill="#4a6a8a" opacity="0.7"/>

  <!-- Sağ üst -->
  <path d="M 395 130 L 475 92" stroke="#4a6a8a" stroke-width="1.8" fill="none" opacity="0.7"/>
  <polygon points="475 92, 466 96, 472 101" fill="#4a6a8a" opacity="0.7"/>
  <!-- Sağ orta -->
  <path d="M 395 145 L 475 150" stroke="#4a6a8a" stroke-width="1.8" fill="none" opacity="0.7"/>
  <polygon points="475 150, 466 148, 466 153" fill="#4a6a8a" opacity="0.7"/>
  <!-- Sağ alt -->
  <path d="M 395 160 L 475 208" stroke="#4a6a8a" stroke-width="1.8" fill="none" opacity="0.7"/>
  <polygon points="475 208, 466 204, 472 199" fill="#4a6a8a" opacity="0.7"/>

  <!-- Öncelik notu -->
  <rect x="180" y="250" width="280" height="45" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="320" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a4a5a">Öncelik Sırası</text>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">Parantez ile değiştirilebilir</text>

  <!-- Öncelik oku -->
  <path d="M 320 170 L 320 245" stroke="#8a6a3a" stroke-width="1.8" stroke-dasharray="5,4" fill="none" opacity="0.6"/>
  <polygon points="320 245, 315 236, 325 236" fill="#8a6a3a" opacity="0.6"/>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a9aaa">% işlemcisi bölme işleminde kalanı verir</text>
</svg>