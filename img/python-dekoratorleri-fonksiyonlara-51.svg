<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d4eaf7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Python Dekoratörleri</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5d7a9a">Fonksiyonları sarmalayan akıllı yapılar</text>

  <!-- Orijinal fonksiyon kutusu -->
  <rect x="30" y="75" width="140" height="70" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="100" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Orijinal</text>
  <text x="100" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e88e5">Fonksiyon</text>
  <text x="100" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64b5f6">f(x)</text>

  <!-- Dekoratör kutusu -->
  <rect x="250" y="60" width="150" height="100" rx="12" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="325" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Dekoratör</text>
  <text x="325" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#f57c00">D(f) = g</text>
  <text x="325" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ff9800">Sarmalama</text>
  <text x="325" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ffb74d">wrapper</text>

  <!-- Yeni fonksiyon kutusu -->
  <rect x="470" y="75" width="140" height="70" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#81c784" stroke-width="1.5"/>
  <text x="540" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Yeni Fonksiyon</text>
  <text x="540" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43a047">g(x)</text>
  <text x="540" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#66bb6a">+ ek davranış</text>

  <!-- Ok 1: Orijinal -> Dekoratör -->
  <path d="M170,110 L240,110" stroke="#546e7a" stroke-width="2" fill="none"/>
  <polygon points="240,104 252,110 240,116" fill="#546e7a"/>

  <!-- Ok 2: Dekoratör -> Yeni -->
  <path d="M400,110 L460,110" stroke="#546e7a" stroke-width="2" fill="none"/>
  <polygon points="460,104 472,110 460,116" fill="#546e7a"/>

  <!-- Alt özellikler -->
  <rect x="30" y="180" width="180" height="55" rx="8" fill="url(#box4)" filter="url(#shadowLight)" stroke="#f48fb1" stroke-width="1"/>
  <text x="120" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#c2185b">Zaman Ölçümü</text>
  <text x="120" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e91e63">perf_counter</text>

  <rect x="230" y="180" width="180" height="55" rx="8" fill="url(#box4)" filter="url(#shadowLight)" stroke="#f48fb1" stroke-width="1"/>
  <text x="320" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#c2185b">Yetki Kontrolü</text>
  <text x="320" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e91e63">Kimlik Doğrulama</text>

  <rect x="430" y="180" width="180" height="55" rx="8" fill="url(#box4)" filter="url(#shadowLight)" stroke="#f48fb1" stroke-width="1"/>
  <text x="520" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#c2185b">Kayıt Tutma</text>
  <text x="520" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e91e63">Loglama</text>

  <!-- Alt bağlantı çizgileri -->
  <path d="M100,145 L100,170" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <path d="M325,160 L325,170" stroke="#ffb74d" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <path d="M540,145 L540,170" stroke="#81c784" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>

  <!-- Alttan birleştiren çizgi -->
  <path d="M120,208 L230,208" stroke="#f48fb1" stroke-width="1" stroke-dasharray="3,3" fill="none"/>
  <path d="M320,208 L430,208" stroke="#f48fb1" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

  <!-- Dekoratör örnek kullanım -->
  <rect x="170" y="255" width="300" height="45" rx="8" fill="#263238" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="273" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#80cbc4">@sure_olc</text>
  <text x="320" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#80cbc4">def kareler_toplami(n):</text>

  <!-- Etiket: Kapanış -->
  <text x="325" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ff8f00" font-style="italic">closure</text>
</svg>