<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#2d3a4a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef5ec"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#374151">Python &amp; Cron Otomasyon Sistemi</text>

  <!-- ==================== FLOW: Left to Right ==================== -->

  <!-- CRON - Box 1 (far left) -->
  <rect x="30" y="80" width="110" height="54" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="85" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e3a5f">CRON</text>
  <text x="85" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3b5f8a">Zamanlayıcı</text>

  <!-- Clock icon inside cron -->
  <circle cx="85" cy="148" r="14" fill="none" stroke="#5b82b0" stroke-width="1.5" opacity="0.5"/>
  <path d="M85 142 L85 148 L90 152" fill="none" stroke="#5b82b0" stroke-width="1.5" opacity="0.5"/>

  <!-- Arrow 1: Cron -> Python Script -->
  <line x1="145" y1="107" x2="195" y2="107" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PYTHON SCRIPT - Box 2 (center) -->
  <rect x="200" y="70" width="130" height="74" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="265" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5a3e00">PYTHON SCRIPT</text>
  <text x="265" y="109" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a5a10">Çek + İşle + Üret</text>
  <text x="265" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#9a7a30">requests / csv / sum</text>

  <!-- Arrow 2: Python -> API -->
  <line x1="335" y1="90" x2="385" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API - Box 3 (upper right) -->
  <rect x="390" y="55" width="110" height="54" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.2"/>
  <text x="445" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#064e3b">API</text>
  <text x="445" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#177a55">JSON veri</text>

  <!-- Arrow 3: API -> Python (return) -->
  <path d="M445 113 L445 140 L265 140 L265 148" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="355" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#777">yanıt</text>

  <!-- Arrow 4: Python -> Report -->
  <line x1="335" y1="140" x2="385" y2="190" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- REPORT - Box 4 (bottom right) -->
  <rect x="390" y="185" width="130" height="54" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="455" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3b0764">RAPOR</text>
  <text x="455" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6d28d9">CSV / E-posta</text>

  <!-- Arrow 5: Report -> Log -->
  <line x1="455" y1="243" x2="455" y2="272" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LOG - small box bottom center -->
  <rect x="385" y="275" width="140" height="30" rx="8" fill="#f3f4f6" filter="url(#shadow)" stroke="#d1d5db" stroke-width="1"/>
  <text x="455" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Log yönlendirme</text>

  <!-- ==================== Decorative Elements ==================== -->

  <!-- Equation top right -->
  <rect x="530" y="60" width="90" height="40" rx="8" fill="none" stroke="#c0d6e8" stroke-width="1" opacity="0.6"/>
  <text x="575" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a85">T = n × Δt</text>
  <text x="575" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#6a8aa5">periyodik çalışma</text>

  <!-- Equation bottom right -->
  <rect x="540" y="170" width="80" height="40" rx="8" fill="none" stroke="#c0d6e8" stroke-width="1" opacity="0.6"/>
  <text x="580" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a85">R = Σ tutar</text>
  <text x="580" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#6a8aa5">toplam satış</text>

  <!-- Timer / cron schedule examples -->
  <rect x="530" y="260" width="90" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" opacity="0.8"/>
  <text x="575" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#475569">Cron örnek:</text>
  <text x="575" y="292" text-anchor="middle" font-family="Consolas, monospace" font-size="8" fill="#1e40af">0 9 * * *</text>
  <text x="575" y="304" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="8" fill="#475569">Her gün 09:00</text>

</svg>