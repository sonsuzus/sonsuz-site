    <text x="82" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6827">kalan 2</text>

    <rect x="32" y="136" width="132" height="48" rx="14" fill="#e4f5ea"/>
    <circle cx="57" cy="160" r="14" fill="#76c59a"/>
    <text x="57" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#245e42" font-weight="700">5</text>
    <text x="82" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b5d6b">mod 5</text>
    <text x="82" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#377557">kalan 3</text>

    <rect x="32" y="211" width="132" height="48" rx="14" fill="#e8edff"/>
    <circle cx="57" cy="235" r="14" fill="#91a8ed"/>
    <text x="57" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#354c91" font-weight="700">7</text>
    <text x="82" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b5d6b">mod 7</text>
    <text x="82" y="246" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c65ad">kalan 2</text>
