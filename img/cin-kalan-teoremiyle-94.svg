    <path d="M509 139 L509 123 C509 105,565 105,565 123 L565 139" fill="none" stroke="#e7e5ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="493" y="132" width="88" height="78" rx="16" fill="#f7f6ff"/>
    <circle cx="537" cy="161" r="10" fill="#7169bd"/>
    <path d="M537 171 L537 187" fill="none" stroke="#7169bd" stroke-width="6" stroke-linecap="round"/>
    <text x="537" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">en küçük şifre</text>
    <text x="537" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eeedff">çözüm</text>
    <text x="537" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#413a83" font-weight="700">23</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="435" y="270" width="174" height="30" rx="12" fill="#ffffff"/>
    <circle cx="454" cy="285" r="8" fill="#71c598"/>
    <path d="M450 285 L453 288 L459 281" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="468" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6373">2 · 3 · 2 doğrulandı</text>
