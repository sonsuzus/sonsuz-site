    <text x="319" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#627384">ortak modül</text>
    <text x="319" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#344b63" font-weight="700">M = 3 · 5 · 7 = 105</text>
    <rect x="270" y="195" width="98" height="22" rx="10" fill="#e6f5ed"/>
    <text x="319" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#347254">tek çözüm sınıfı</text>
  </g>

  <path d="M408 160 L453 160" fill="none" stroke="#776fc5" stroke-width="3"/>
  <polygon points="450,153 463,160 450,167" fill="#776fc5"/>

