  <path d="M164 85 C194 85,197 120,225 132" fill="none" stroke="#d2a940" stroke-width="2"/>
  <polygon points="224,127 234,136 221,138" fill="#d2a940"/>
  <path d="M164 160 L224 160" fill="none" stroke="#58ae7e" stroke-width="2"/>
  <polygon points="222,155 234,160 222,165" fill="#58ae7e"/>
  <path d="M164 235 C194 235,197 200,225 188" fill="none" stroke="#738add" stroke-width="2"/>
  <polygon points="221,182 234,184 225,193" fill="#738add"/>

  <g filter="url(#shadow)">
