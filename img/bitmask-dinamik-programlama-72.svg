<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Bitmask DP: Kombinasyon Patlamasını Yönetmek</text>

  <!-- Sol üst: Problem / Brute Force -->
  <rect x="30" y="50" width="160" height="70" rx="10" fill="#ffd6e0" filter="url(#shadow)" opacity="0.9"/>
  <text x="110" y="72" text-anchor="middle" font-weight="bold" fill="#5a1e2e">Brute Force</text>
  <text x="110" y="90" text-anchor="middle" fill="#5a1e2e">20! olasılık</text>
  <text x="110" y="106" text-anchor="middle" fill="#5a1e2e">O(n!)</text>

  <!-- Sağ üst: Bitmask Temsili -->
  <rect x="450" y="50" width="160" height="70" rx="10" fill="#d6e8ff" filter="url(#shadow)" opacity="0.9"/>
  <text x="530" y="72" text-anchor="middle" font-weight="bold" fill="#1e3a5a">Bitmask Temsili</text>
  <text x="530" y="90" text-anchor="middle" fill="#1e3a5a">0101 → {0, 2}</text>
  <text x="530" y="106" text-anchor="middle" fill="#1e3a5a">2^n durum</text>

  <!-- Ok: Brute Force -> Bitmask -->
  <path d="M190 85 L250 85" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="248,79 258,85 248,91" fill="#7f8c8d"/>

  <!-- Orta: DP Durumu -->
  <rect x="220" y="120" width="200" height="80" rx="12" fill="#e8f5e9" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="145" text-anchor="middle" font-weight="bold" fill="#1b5e20">dp[mask][last]</text>
  <text x="320" y="163" text-anchor="middle" fill="#2e7d32">Ziyaret edilen şehirler</text>
  <text x="320" y="179" text-anchor="middle" fill="#2e7d32">+ son şehir</text>
  <text x="320" y="195" text-anchor="middle" fill="#2e7d32">En düşük maliyet</text>

  <!-- Sol alt: Geçiş Formülü -->
  <rect x="30" y="230" width="180" height="70" rx="10" fill="#fff3e0" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="120" y="252" text-anchor="middle" font-weight="bold" fill="#4e342e">Geçiş Kuralı</text>
  <text x="120" y="270" text-anchor="middle" fill="#5d4037">dp[mask ∪ {nxt}][nxt]</text>
  <text x="120" y="286" text-anchor="middle" fill="#5d4037">= min(..., dp[mask][last] + cost)</text>

  <!-- Sağ alt: Karmaşıklık -->
  <rect x="450" y="230" width="160" height="70" rx="10" fill="#e0f7fa" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="530" y="252" text-anchor="middle" font-weight="bold" fill="#006064">Karmaşıklık</text>
  <text x="530" y="270" text-anchor="middle" fill="#00838f">Zaman: O(n² · 2ⁿ)</text>
  <text x="530" y="286" text-anchor="middle" fill="#00838f">Bellek: O(n · 2ⁿ)</text>

  <!-- Oklar: DP -> Geçiş ve Karmaşıklık -->
  <path d="M220 160 L215 230" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="209,222 215,232 221,222" fill="#7f8c8d"/>

  <path d="M420 160 L525 230" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="519,222 525,232 531,222" fill="#7f8c8d"/>

  <!-- Alt bilgi: Kullanım Alanları -->
  <rect x="220" y="230" width="200" height="70" rx="10" fill="#f3e5f5" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="252" text-anchor="middle" font-weight="bold" fill="#4a148c">Kullanım Alanları</text>
  <text x="320" y="270" text-anchor="middle" fill="#6a1b9a">Gezgin Satıcı, Atama,</text>
  <text x="320" y="286" text-anchor="middle" fill="#6a1b9a">Alt Küme Toplamı, Takım</text>

  <!-- Döngüsel ok: Geçiş -> DP (geri besleme) -->
  <path d="M215 235 C100 235 100 160 220 160" stroke="#9e9e9e" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="212,166 220,160 214,154" fill="#9e9e9e"/>

  <!-- Küçük bit örnekleri -->
  <rect x="30" y="140" width="160" height="60" rx="8" fill="#ffffff" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="110" y="160" text-anchor="middle" font-weight="bold" fill="#34495e">Bit İşlemleri</text>
  <text x="110" y="176" text-anchor="middle" fill="#555">Ekle: mask | (1 &lt;&lt; i)</text>
  <text x="110" y="192" text-anchor="middle" fill="#555">Seçili mi: mask &amp; (1 &lt;&lt; i)</text>

  <!-- Ok: Bit İşlemleri -> DP -->
  <path d="M190 170 L220 160" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="214,166 220,160 212,154" fill="#7f8c8d"/>
</svg>