<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8daf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c8199" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6c8199" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="589" cy="42" r="74" fill="#dff3ea" opacity="0.45"/>
  <circle cx="56" cy="284" r="86" fill="#dbeaff" opacity="0.42"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35536d">Hamle Sıralaması ile Alfa-Beta Budaması</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698093">Önce güçlü adaylar, sonra erken kesim</text>

  <g filter="url(#shadow)">
    <rect x="27" y="67" width="157" height="179" rx="18" fill="#ffffff"/>
  </g>
  <text x="48" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425e76">Hamle Önceliği</text>
  <line x1="47" y1="103" x2="163" y2="103" stroke="#dce7ec" stroke-width="1"/>

  <g filter="url(#smallShadow)">
    <rect x="45" y="115" width="120" height="22" rx="9" fill="#e5dffc"/>
    <circle cx="58" cy="126" r="7" fill="#8b78c9"/>
    <text x="55" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="700" fill="#ffffff">1</text>
    <text x="72" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#504673">TT hamlesi</text>

    <rect x="45" y="142" width="120" height="22" rx="9" fill="#ffe7d1"/>
    <circle cx="58" cy="153" r="7" fill="#e39552"/>
    <text x="55" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="700" fill="#ffffff">2</text>
    <text x="72" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#795436">Şah çekme</text>

    <rect x="45" y="169" width="120" height="22" rx="9" fill="#d9f1e7"/>
    <circle cx="58" cy="180" r="7" fill="#55a47c"/>
    <text x="55" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="700" fill="#ffffff">3</text>
    <text x="72" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d7059">Taş yeme</text>

    <rect x="45" y="196" width="120" height="22" rx="9" fill="#e3edf5"/>
    <circle cx="58" cy="207" r="7" fill="#7a9ab2"/>
    <text x="55" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="700" fill="#ffffff">4</text>
    <text x="72" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6578">Killer ve geçmiş</text>
  </g>

  <path d="M185 156 L213 156" stroke="#7291ae" stroke-width="2.5" fill="none"/>
  <polygon points="220,156 211,151 211,161" fill="#7291ae"/>

  <g filter="url(#shadow)">
    <rect x="221" y="85" width="188" height="144" rx="22" fill="url(#core)"/>
  </g>
  <text x="315" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31516d">Alfa-Beta Araması</text>

  <rect x="244" y="128" width="65" height="48" rx="13" fill="#ffffff" opacity="0.88"/>
  <text x="276" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477092">α</text>
  <text x="276" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#657e92">en iyi alt sınır</text>

  <rect x="321" y="128" width="65" height="48" rx="13" fill="#ffffff" opacity="0.88"/>
  <text x="353" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a4645e">β</text>
  <text x="353" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#657e92">üst sınır</text>

  <path d="M309 152 L319 152" stroke="#7b9ab4" stroke-width="2"/>
  <polygon points="320,152 314,148 314,156" fill="#7b9ab4"/>
  <text x="315" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31516d">α ≥ β  →  kes</text>

  <path d="M410 128 C429 128 427 103 445 103" stroke="#62a47e" stroke-width="2.5" fill="none"/>
  <polygon points="452,103 443,98 444,108" fill="#62a47e"/>
  <path d="M410 186 C429 186 427 207 445 207" stroke="#d17772" stroke-width="2.5" fill="none"/>
  <polygon points="452,207 443,202 444,212" fill="#d17772"/>

  <g filter="url(#shadow)">
    <rect x="453" y="72" width="158" height="66" rx="17" fill="#e0f3e8"/>
    <rect x="453" y="174" width="158" height="66" rx="17" fill="#fde5e3"/>
  </g>

  <circle cx="478" cy="105" r="15" fill="#77b896"/>
  <path d="M471 105 L476 110 L486 99" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="502" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386b52">Derin İnceleme</text>
  <text x="502" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8270">Umut veren dal</text>

  <circle cx="478" cy="207" r="15" fill="#df8580"/>
  <path d="M472 201 L484 213 M484 201 L472 213" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="502" y="203" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a4d4b">Budanan Dal</text>
  <text x="502" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b6a67">Gereksiz düğümler</text>

  <g filter="url(#shadow)">
    <rect x="133" y="266" width="374" height="37" rx="16" fill="#ffffff"/>
  </g>
  <circle cx="156" cy="284" r="11" fill="#8c80ca"/>
  <path d="M152 283 C152 278 160 278 160 283 M160 283 L157 280 M160 283 L157 286" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="177" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#536b80">Yinelemeli derinleşme</text>
  <text x="340" y="288" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72889a">önceki en iyi hamle → yeni turda ilk aday</text>

  <path d="M319 230 L319 259" stroke="#8b80c9" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="319,265 314,256 324,256" fill="#8b80c9"/>
</svg>