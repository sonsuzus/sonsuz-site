<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="zamanSeridi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9d9f7"/>
      <stop offset="100%" stop-color="#9eddb9"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6c8294" flood-opacity="0.2"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6c8294" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="74" cy="52" r="54" fill="#d8edff" opacity="0.48"/>
  <circle cx="588" cy="276" r="82" fill="#dff2d9" opacity="0.5"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">OLAY-GÜDÜMLÜ BENZETİM</text>

  <!-- Sol: öncelik kuyruğu -->
  <g filter="url(#golge)">
    <rect x="34" y="80" width="150" height="151" rx="18" fill="#ffffff"/>
    <rect x="34" y="80" width="150" height="35" rx="18" fill="#d9efff"/>
    <rect x="34" y="100" width="150" height="15" fill="#d9efff"/>
  </g>
  <text x="109" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31536c">Öncelik kuyruğu</text>

  <g filter="url(#hafifGolge)">
    <rect x="49" y="126" width="120" height="25" rx="8" fill="#fff4cb"/>
    <rect x="49" y="158" width="120" height="25" rx="8" fill="#ffe3dc"/>
    <rect x="49" y="190" width="120" height="25" rx="8" fill="#e4f5e8"/>
  </g>
  <text x="61" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a5522">0.80</text>
  <text x="116" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a5522">duvar</text>
  <text x="61" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#804d47">1.25</text>
  <text x="108" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#804d47">çarpışma</text>
  <text x="61" y="207" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#41684b">2.10</text>
  <text x="116" y="207" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#41684b">olay</text>

  <!-- Kuyruktan saate ok -->
  <path d="M185 155 L218 155" stroke="#65859b" stroke-width="2.5" fill="none"/>
  <polygon points="226,155 216,149 216,161" fill="#65859b"/>

  <!-- Merkez saat -->
  <g filter="url(#golge)">
    <circle cx="273" cy="155" r="48" fill="#ffffff"/>
    <circle cx="273" cy="155" r="38" fill="#e8f6ff" stroke="#9bcbe8" stroke-width="2"/>
  </g>
  <path d="M273 155 L273 130 M273 155 L293 166" stroke="#3f7da5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="273" cy="155" r="4" fill="#3f7da5"/>
  <text x="273" y="219" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">Saat sıçrar</text>

  <!-- Merkezden sahneye ok -->
  <path d="M322 155 L353 155" stroke="#65859b" stroke-width="2.5" fill="none"/>
  <polygon points="361,155 351,149 351,161" fill="#65859b"/>

  <!-- Çarpışma alanı -->
  <g filter="url(#golge)">
    <rect x="370" y="73" width="235" height="164" rx="20" fill="#ffffff"/>
  </g>
  <text x="487" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">Sonraki önemli olay</text>
  <rect x="388" y="111" width="199" height="93" rx="12" fill="#f5fbff" stroke="#c7e3ef" stroke-width="1.5"/>

  <!-- parçacık hareketleri -->
  <path d="M409 157 L451 157" stroke="#7da7c4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="458,157 448,151 448,163" fill="#7da7c4"/>
  <path d="M565 157 L523 157" stroke="#d28a7d" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="516,157 526,151 526,163" fill="#d28a7d"/>

  <circle cx="470" cy="157" r="17" fill="#88c7ec" stroke="#5e9fc5" stroke-width="2"/>
  <circle cx="504" cy="157" r="17" fill="#f3a99b" stroke="#cb796d" stroke-width="2"/>
  <path d="M487 126 L487 116" stroke="#ecad55" stroke-width="2"/>
  <path d="M480 121 L487 112 L494 121" fill="none" stroke="#ecad55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="487" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536b7d">çarpışma anı</text>

  <!-- Alt dönüş döngüsü -->
  <path d="M488 238 L488 270 L196 270 L196 249" stroke="#7aa88a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="196,241 190,251 202,251" fill="#7aa88a"/>
  <g filter="url(#hafifGolge)">
    <rect x="292" y="252" width="103" height="35" rx="13" fill="#dff2e5"/>
  </g>
  <text x="343" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#47745a">Yeni olayları planla</text>

  <!-- zaman şeridi -->
  <text x="34" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607988">zaman</text>
  <rect x="34" y="285" width="572" height="9" rx="5" fill="url(#zamanSeridi)" opacity="0.7"/>
  <circle cx="108" cy="289.5" r="7" fill="#f0b24e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="273" cy="289.5" r="7" fill="#4d9dcb" stroke="#ffffff" stroke-width="2"/>
  <circle cx="488" cy="289.5" r="7" fill="#e27d70" stroke="#ffffff" stroke-width="2"/>
  <text x="108" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687e8d">olay</text>
  <text x="273" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687e8d">atla</text>
  <text x="488" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687e8d">çözümle</text>
</svg>