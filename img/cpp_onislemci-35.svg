<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9ff"/>
      <stop offset="100%" style="stop-color:#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0fe"/>
      <stop offset="100%" style="stop-color:#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3e2"/>
      <stop offset="100%" style="stop-color:#fde8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f7e6"/>
      <stop offset="100%" style="stop-color:#d0edd0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce8e8"/>
      <stop offset="100%" style="stop-color:#f8d4d4"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eaf6"/>
      <stop offset="100%" style="stop-color:#d0d4f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">C++ Önişlemci Direktifleri</text>

  <!-- Merkez: Önişlemci -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#box5)" filter="url(#shadow)" stroke="#5c6bc0" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#283593">Önişlemci</text>
  <text x="320" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3949ab">Derleme Safhası 1</text>

  <!-- Sol üst: Kaynak Kod -->
  <rect x="40" y="40" width="130" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90a4ae" stroke-width="1"/>
  <text x="105" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#37474f">Kaynak Kod</text>
  <text x="105" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#607d8b">.cpp dosyası</text>

  <!-- Sağ üst: Derleyici -->
  <rect x="470" y="40" width="130" height="45" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#e57373" stroke-width="1"/>
  <text x="535" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c62828">Derleyici</text>
  <text x="535" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#d32f2f">Safha 2 ve Sonrası</text>

  <!-- Alt sol: #define -->
  <rect x="40" y="230" width="130" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#f0a030" stroke-width="1"/>
  <text x="105" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">#define</text>
  <text x="105" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f57c00">Makro Tanımlama</text>

  <!-- Alt orta: Makro Adı -->
  <rect x="245" y="230" width="150" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#66bb6a" stroke-width="1"/>
  <text x="320" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Makro Adı</text>
  <text x="320" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#43a047">Karakter Dizisi</text>

  <!-- Alt sağ: Değiştirme -->
  <rect x="470" y="230" width="130" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90a4ae" stroke-width="1"/>
  <text x="535" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#37474f">Metin Değişimi</text>
  <text x="535" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#607d8b">Her kullanımda</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Kaynak -> Önişlemci -->
  <line x1="170" y1="62" x2="240" y2="130" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="240,130 232,122 234,134" fill="#546e7a"/>

  <!-- Önişlemci -> Derleyici -->
  <line x1="400" y1="130" x2="465" y2="70" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="465,70 455,68 461,78" fill="#546e7a"/>

  <!-- #define -> Önişlemci -->
  <line x1="175" y1="245" x2="240" y2="160" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="240,160 231,154 235,167" fill="#546e7a"/>

  <!-- Önişlemci -> Makro Adı -->
  <line x1="320" y1="172" x2="320" y2="225" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="320,225 315,217 325,217" fill="#546e7a"/>

  <!-- Makro Adı -> Değiştirme -->
  <line x1="400" y1="250" x2="465" y2="250" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="465,250 457,245 457,255" fill="#546e7a"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" font-style="italic">Noktalı virgül kullanılmaz - Büyük harf tercih edilir</text>
</svg>