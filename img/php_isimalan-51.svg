<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf7e8"/>
      <stop offset="100%" stop-color="#d4eed0"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe8c7"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8fd"/>
      <stop offset="100%" stop-color="#e4d5f7"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8ef"/>
      <stop offset="100%" stop-color="#f8d4e2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">PHP İsim Alanları</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a9a">namespace anahtar kelimesi ile gruplama</text>

  <!-- Merkezi namespace kutusu -->
  <rect x="245" y="62" width="150" height="44" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#a0c4e8" stroke-width="1"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">namespace</text>
  <text x="320" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">name_bizim</text>

  <!-- Ok: namespace -> Sınıflar -->
  <path d="M 270 106 L 160 140" stroke="#7fb3d8" stroke-width="1.5" fill="none"/>
  <polygon points="160,143 168,137 163,148" fill="#7fb3d8"/>

  <!-- Ok: namespace -> Fonksiyonlar -->
  <path d="M 320 106 L 320 140" stroke="#7fb3d8" stroke-width="1.5" fill="none"/>
  <polygon points="320,143 315,135 325,135" fill="#7fb3d8"/>

  <!-- Ok: namespace -> Sabitler -->
  <path d="M 370 106 L 480 140" stroke="#7fb3d8" stroke-width="1.5" fill="none"/>
  <polygon points="480,143 472,137 477,148" fill="#7fb3d8"/>

  <!-- Sınıflar kutusu -->
  <rect x="55" y="145" width="170" height="52" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#a8d5a0" stroke-width="1"/>
  <text x="140" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6b3a">Sınıflar</text>
  <text x="140" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c5030">class sinif_bizim</text>

  <!-- Fonksiyonlar kutusu -->
  <rect x="245" y="145" width="150" height="52" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#e8c37a" stroke-width="1"/>
  <text x="320" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5c1e">Fonksiyonlar</text>
  <text x="320" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5c4a1e">function deger_goster</text>

  <!-- Sabitler kutusu -->
  <rect x="415" y="145" width="170" height="52" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#b8a0d8" stroke-width="1"/>
  <text x="500" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2e6b">Sabitler</text>
  <text x="500" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a2e4a">const CONBOOL = 1</text>

  <!-- Alt bölüm: Aynı isim farklı namespace -->
  <rect x="100" y="225" width="440" height="78" rx="12" fill="#ffffff" opacity="0.6" filter="url(#shadowLight)" stroke="#c0d8e8" stroke-width="1"/>

  <text x="320" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Aynı isim, farklı isim alanları</text>

  <!-- Alt namespace 1 -->
  <rect x="130" y="255" width="120" height="36" rx="8" fill="url(#boxGrad1)" filter="url(#shadowLight)" stroke="#a0c4e8" stroke-width="1"/>
  <text x="190" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#1a5276">namespace A</text>
  <text x="190" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2c3e50">class Urun</text>

  <!-- Alt namespace 2 -->
  <rect x="270" y="255" width="120" height="36" rx="8" fill="url(#boxGrad1)" filter="url(#shadowLight)" stroke="#a0c4e8" stroke-width="1"/>
  <text x="330" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#1a5276">namespace B</text>
  <text x="330" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2c3e50">class Urun</text>

  <!-- Alt namespace 3 -->
  <rect x="410" y="255" width="120" height="36" rx="8" fill="url(#boxGrad1)" filter="url(#shadowLight)" stroke="#a0c4e8" stroke-width="1"/>
  <text x="470" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#1a5276">namespace C</text>
  <text x="470" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2c3e50">class Urun</text>

  <!-- Çakışma yok etiketi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a7a9a" font-style="italic">Çakışma olmadan kullanım</text>

  <!-- Dekoratif çizgiler -->
  <line x1="55" y1="58" x2="585" y2="58" stroke="#c0d8e8" stroke-width="0.5" opacity="0.5"/>
  <line x1="55" y1="218" x2="585" y2="218" stroke="#c0d8e8" stroke-width="0.5" opacity="0.5"/>
</svg>