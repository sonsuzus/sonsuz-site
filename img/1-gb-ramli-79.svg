<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="memoryFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7ca8e8"/>
      <stop offset="100%" stop-color="#b5d4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7891a8" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6e879c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="591" cy="37" r="72" fill="#dceee5" opacity="0.55"/>
  <circle cx="48" cy="288" r="92" fill="#dceafb" opacity="0.58"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39546b">1 GB SUNUCUDA BELLEK KONTROLÜ</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708798">Ölç • Sınır koy • Topla • Koru</text>

  <!-- Memory limit card -->
  <rect x="27" y="76" width="136" height="194" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="48" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405c71">Sunucu Belleği</text>
  <text x="48" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#788d9c">1 GB kapasite</text>

  <rect x="51" y="139" width="42" height="101" rx="12" fill="#e7eff4"/>
  <rect x="51" y="174" width="42" height="66" rx="12" fill="url(#memoryFill)"/>
  <rect x="51" y="164" width="42" height="10" rx="4" fill="#f0ba79"/>
  <line x1="48" y1="164" x2="96" y2="164" stroke="#d87568" stroke-width="2"/>
  <text x="106" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#c2665b">650 MB</text>
  <text x="106" y="186" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728797">Yumuşak sınır</text>
  <text x="52" y="259" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54748a">RSS izle</text>

  <!-- arrow 1 -->
  <path d="M176 170 H203" fill="none" stroke="#89a2b3" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="203,170 195,165 195,175" fill="#89a2b3"/>

  <!-- Python core -->
  <rect x="215" y="76" width="190" height="194" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <text x="237" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405c71">Python Çalışma Alanı</text>
  <text x="237" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#788d9c">Nesneler ve referanslar</text>

  <circle cx="270" cy="170" r="35" fill="#e3f0ff" filter="url(#smallShadow)"/>
  <circle cx="270" cy="170" r="24" fill="#bcd9fa"/>
  <text x="246" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315a80">Referans</text>
  <text x="252" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496f90">Sayımı</text>

  <path d="M307 157 C329 141 345 143 354 157" fill="none" stroke="#88a9c7" stroke-width="2"/>
  <polygon points="356,160 347,157 352,151" fill="#88a9c7"/>
  <path d="M354 185 C334 202 320 199 307 185" fill="none" stroke="#88a9c7" stroke-width="2"/>
  <polygon points="305,182 314,185 309,191" fill="#88a9c7"/>

  <rect x="338" y="139" width="48" height="25" rx="8" fill="#f8dfc6"/>
  <rect x="338" y="176" width="48" height="25" rx="8" fill="#e5d9f7"/>
  <text x="346" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#865b39">Nesne</text>
  <text x="346" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#695282">Döngü</text>

  <rect x="237" y="220" width="145" height="29" rx="10" fill="#edf6ea"/>
  <circle cx="253" cy="234.5" r="5" fill="#70b17a"/>
  <text x="266" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7256">Arena: RSS kalabilir</text>

  <!-- arrow 2 -->
  <path d="M417 170 H444" fill="none" stroke="#89a2b3" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="444,170 436,165 436,175" fill="#89a2b3"/>

  <!-- controller -->
  <rect x="456" y="76" width="157" height="194" rx="20" fill="#ffffff" filter="url(#shadow)"/>
  <text x="477" y="104" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405c71">Bellek Koruyucu</text>
  <text x="477" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#788d9c">Bakım döngüsü</text>

  <rect x="476" y="140" width="116" height="27" rx="10" fill="#e0efff"/>
  <circle cx="491" cy="153.5" r="6" fill="#6098d5"/>
  <text x="505" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426a91">RSS ölçümü</text>

  <path d="M534 168 V178" fill="none" stroke="#8aa1b2" stroke-width="2"/>
  <polygon points="534,181 530,175 538,175" fill="#8aa1b2"/>

  <rect x="476" y="182" width="116" height="27" rx="10" fill="#fff0df"/>
  <circle cx="491" cy="195.5" r="6" fill="#e29b52"/>
  <text x="505" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b633e">Eşik kontrolü</text>

  <path d="M534 210 V220" fill="none" stroke="#8aa1b2" stroke-width="2"/>
  <polygon points="534,223 530,217 538,217" fill="#8aa1b2"/>

  <rect x="476" y="224" width="116" height="27" rx="10" fill="#e7f4e6"/>
  <circle cx="491" cy="237.5" r="6" fill="#64aa73"/>
  <text x="505" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7655">Tam toplama</text>

  <!-- looping return arrow -->
  <path d="M534 260 C534 291 310 294 310 275" fill="none" stroke="#78af90" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="310,270 305,278 315,277" fill="#78af90"/>
  <text x="365" y="300" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56806a">Sakin anda bakım</text>

  <!-- corner status -->
  <rect x="510" y="25" width="103" height="28" rx="14" fill="#ffffff" opacity="0.9" filter="url(#smallShadow)"/>
  <circle cx="528" cy="39" r="5" fill="#6fb27d"/>
  <text x="540" y="43" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#527660">Güvenli pay</text>
</svg>