<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">0'dan 8'e kadar durumlar, hangilerinin kaybeden (4'ün katları) hangilerinin kazanan olduğunu gösteriyor. 5 durumundan 4, 3 veya 2 durumuna geçiş okları, 5'in neden kazanan olduğunu gösteriyor.</desc>
