<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1e8f0"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e8f8"/>
      <stop offset="100%" stop-color="#e0d0f0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f8e8"/>
      <stop offset="100%" stop-color="#d0f0d0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f0e0"/>
      <stop offset="100%" stop-color="#f0e0c0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8e8e8"/>
      <stop offset="100%" stop-color="#f0d0d0"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Bilimsel Programlama: Diferansiyel Denklem Çözümü</text>

  <!-- Problem Tanımı -->
  <rect x="30" y="45" width="180" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#a0c8d8" stroke-width="1.5"/>
  <text x="120" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Problem</text>
  <text x="120" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">İvme = İkinci Türev</text>
  <text x="120" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">İki Cisim Yörüngesi</text>

  <!-- Dönüşüm -->
  <rect x="250" y="45" width="160" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#c0a8d8" stroke-width="1.5"/>
  <text x="330" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Dönüşüm</text>
  <text x="330" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">2. Derece → 1. Derece</text>
  <text x="330" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Değişken Dönüşümü</text>

  <!-- Çözüm -->
  <rect x="450" y="45" width="160" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#a8d8a8" stroke-width="1.5"/>
  <text x="530" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Çözüm</text>
  <text x="530" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">solve_ivp</text>
  <text x="530" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Sayısal İntegrasyon</text>

  <!-- Oklar (manuel) -->
  <polygon points="215,72 235,72 235,68 245,75 235,82 235,78 215,78" fill="#7f8c8d"/>
  <polygon points="415,72 435,72 435,68 445,75 435,82 435,78 415,78" fill="#7f8c8d"/>

  <!-- Yöntemler -->
  <rect x="30" y="130" width="180" height="65" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#d8c8a0" stroke-width="1.5"/>
  <text x="120" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Euler Yöntemi</text>
  <text x="120" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Sabit Adım (1 sn ve 5 sn)</text>
  <text x="120" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Düşük Doğruluk</text>

  <rect x="250" y="130" width="160" height="65" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#d8a8a8" stroke-width="1.5"/>
  <text x="330" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">RK23 / RK45</text>
  <text x="330" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Adaptif Adım</text>
  <text x="330" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Yüksek Doğruluk</text>

  <!-- Karşılaştırma -->
  <rect x="450" y="130" width="160" height="65" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#a0c8d8" stroke-width="1.5"/>
  <text x="530" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Karşılaştırma</text>
  <text x="530" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Enerji Hatası</text>
  <text x="530" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Log Ölçekli Grafik</text>

  <!-- Oklar -->
  <polygon points="215,162 235,162 235,158 245,165 235,172 235,168 215,168" fill="#7f8c8d"/>
  <polygon points="415,162 435,162 435,158 445,165 435,172 435,168 415,168" fill="#7f8c8d"/>

  <!-- Sonuç -->
  <rect x="140" y="225" width="360" height="55" rx="12" fill="url(#box3)" filter="url(#shadow)" stroke="#a8d8a8" stroke-width="2"/>
  <text x="320" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Sonuç</text>
  <text x="320" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">RK45 + Sıkı Tolerans (rtol, atol) → 10 Milyar Kat Daha İyi</text>

  <!-- Alt bağlantılar -->
  <line x1="320" y1="225" x2="320" y2="200" stroke="#7f8c8d" stroke-width="1.5"/>
  <polygon points="315,200 325,200 320,192" fill="#7f8c8d"/>

  <!-- Tolerans etiketi -->
  <rect x="30" y="260" width="100" height="40" rx="8" fill="#f0f0f0" filter="url(#shadow)" stroke="#b0b0b0" stroke-width="1"/>
  <text x="80" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">rtol = 1e-12</text>
  <text x="80" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">atol = 1e-15</text>

  <rect x="510" y="260" width="100" height="40" rx="8" fill="#f0f0f0" filter="url(#shadow)" stroke="#b0b0b0" stroke-width="1"/>
  <text x="560" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Enum ile</text>
  <text x="560" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Güvenli Seçim</text>

  <!-- Çizgiler -->
  <line x1="130" y1="280" x2="140" y2="280" stroke="#7f8c8d" stroke-width="1.5"/>
  <line x1="500" y1="280" x2="510" y2="280" stroke="#7f8c8d" stroke-width="1.5"/>
</svg>