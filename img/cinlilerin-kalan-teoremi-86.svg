<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#c8dcfa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#63728a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#63728a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="116" fill="#ffffff" opacity="0.34"/>
  <circle cx="320" cy="160" r="94" fill="none" stroke="#b9d4e4" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.8"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536d">ÇİNLİLERİN KALAN TEOREMİ</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Parçalı kalanlar → tek çözüm sınıfı</text>

  <!-- Connections -->
  <path d="M188 103 C222 109 241 123 266 140" fill="none" stroke="#8aaec6" stroke-width="2.2"/>
  <polygon points="266,140 256,139 261,131" fill="#8aaec6"/>
  <path d="M188 218 C222 207 241 193 266 180" fill="none" stroke="#8aaec6" stroke-width="2.2"/>
  <polygon points="266,180 261,189 256,181" fill="#8aaec6"/>
  <path d="M454 105 C421 111 401 124 376 141" fill="none" stroke="#8aaec6" stroke-width="2.2"/>
  <polygon points="376,141 381,132 386,140" fill="#8aaec6"/>
  <path d="M374 207 C415 218 446 227 478 237" fill="none" stroke="#9bbd9d" stroke-width="2.2"/>
  <polygon points="478,237 469,239 472,229" fill="#9bbd9d"/>

  <!-- Left clock 3 -->
  <g filter="url(#soft)">
    <rect x="42" y="71" width="146" height="66" rx="16" fill="#fff6dc"/>
    <circle cx="78" cy="104" r="22" fill="#ffe6a7" stroke="#e5b95f" stroke-width="1.5"/>
    <path d="M78 104 L78 87 M78 104 L93 111" fill="none" stroke="#916d26" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="78" cy="104" r="3" fill="#916d26"/>
    <text x="113" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#705522">Modül 3</text>
    <text x="113" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a713e">kalan 2</text>
  </g>

  <!-- Left clock 5 -->
  <g filter="url(#soft)">
    <rect x="42" y="185" width="146" height="66" rx="16" fill="#e6f6ef"/>
    <circle cx="78" cy="218" r="22" fill="#cceedd" stroke="#6eae91" stroke-width="1.5"/>
    <path d="M78 218 L91 207 M78 218 L78 235" fill="none" stroke="#397957" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="78" cy="218" r="3" fill="#397957"/>
    <text x="113" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397957">Modül 5</text>
    <text x="113" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58816a">kalan 3</text>
  </g>

  <!-- Right clock 7 -->
  <g filter="url(#soft)">
    <rect x="454" y="72" width="146" height="66" rx="16" fill="#f1eaff"/>
    <circle cx="490" cy="105" r="22" fill="#e0d0fa" stroke="#9b7cce" stroke-width="1.5"/>
    <path d="M490 105 L507 105 M490 105 L482 120" fill="none" stroke="#69489b" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="490" cy="105" r="3" fill="#69489b"/>
    <text x="525" y="97" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#69489b">Modül 7</text>
    <text x="525" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8368ad">kalan 2</text>
  </g>

  <!-- Center solution -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="160" r="58" fill="url(#core)" stroke="#8fb1d8" stroke-width="1.5"/>
    <circle cx="320" cy="160" r="45" fill="#f8fbff" opacity="0.76"/>
    <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405b7c">TEK ÇÖZÜM</text>
    <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#285b91">x = 23</text>
    <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58718e">mod 105</text>
  </g>

  <!-- Condition card -->
  <g filter="url(#soft)">
    <rect x="245" y="251" width="150" height="45" rx="14" fill="#ffffff"/>
    <circle cx="268" cy="273" r="12" fill="#d9f0de"/>
    <path d="M262 273 L266 277 L274 268" fill="none" stroke="#4f9566" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="290" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#476955">Aralarında asal</text>
    <text x="290" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728878">benzersiz sınıf</text>
  </g>

  <!-- Output -->
  <g filter="url(#soft)">
    <rect x="478" y="209" width="122" height="61" rx="16" fill="#e9f5e8"/>
    <path d="M496 229 h19 v18 h-19 z" fill="#b5ddb8" stroke="#6ca874" stroke-width="1.3"/>
    <path d="M500 235 h11 M500 241 h8" stroke="#5e9568" stroke-width="1.4" stroke-linecap="round"/>
    <text x="528" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426f4a">Çözüm</text>
    <text x="528" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587d5d">23 + 105k</text>
  </g>

  <path d="M320 218 L320 246" fill="none" stroke="#8aaec6" stroke-width="2"/>
  <polygon points="320,246 315,237 325,237" fill="#8aaec6"/>
</svg>