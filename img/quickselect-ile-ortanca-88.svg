<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4efff"/>
      <stop offset="100%" stop-color="#d5e6fa"/>
    </linearGradient>
    <linearGradient id="pivotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8bd"/>
      <stop offset="100%" stop-color="#ffd89a"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff4dd"/>
      <stop offset="100%" stop-color="#c8ebc6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#70849a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7990a5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="63" cy="52" r="55" fill="#dcefff" opacity="0.48"/>
  <circle cx="592" cy="269" r="80" fill="#e2f2d7" opacity="0.45"/>

