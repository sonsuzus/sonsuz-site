  <path d="M453 159 H474" fill="none" stroke="#7c9bb2" stroke-width="2"/>
  <polygon points="474,159 466,154 466,164" fill="#7c9bb2"/>

  <g filter="url(#shadow)">
    <rect x="481" y="74" width="130" height="73" rx="18" fill="#fff9ed" stroke="#eed8a7"/>
