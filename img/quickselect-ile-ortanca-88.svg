  </g>
  <text x="52" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#527186">Beklenen süre: O(n)</text>
  <path d="M207 282 H236" stroke="#c8d7df" stroke-width="1"/>
  <text x="252" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607889">Ortanca için k = ⌊n / 2⌋</text>
  <path d="M432 282 H455" stroke="#c8d7df" stroke-width="1"/>
  <text x="472" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607889">yalnız hedef yol</text>
