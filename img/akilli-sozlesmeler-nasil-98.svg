<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="contract" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e5ff"/>
      <stop offset="100%" stop-color="#d8f0ff"/>
    </linearGradient>
    <linearGradient id="funded" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2c9"/>
      <stop offset="100%" stop-color="#ffe1ac"/>
    </linearGradient>
    <linearGradient id="paid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f6df"/>
      <stop offset="100%" stop-color="#bdebc9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6b7e9a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5d7190" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="568" cy="49" r="74" fill="#d9f2eb" opacity="0.44"/>
  <circle cx="58" cy="285" r="86" fill="#dcecff" opacity="0.46"/>

  <text x="28" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52647c" font-weight="600">AKILLI SÖZLEŞME · KOŞULLU EMANET</text>

  <!-- Buyer -->
  <g filter="url(#shadow)">
    <rect x="28" y="84" width="115" height="92" rx="19" fill="#ffffff"/>
    <circle cx="85" cy="114" r="17" fill="#dbeaff"/>
    <circle cx="85" cy="109" r="6" fill="#7694c6"/>
    <path d="M74 126 C76 118 94 118 96 126" fill="none" stroke="#7694c6" stroke-width="3" stroke-linecap="round"/>
    <text x="85" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33465f" font-weight="700">Alıcı</text>
    <text x="85" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718199">İşlem imzalar</text>
  </g>

  <!-- flow arrow buyer contract -->
  <path d="M149 130 H184" fill="none" stroke="#7891b4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="184,130 175,125 175,135" fill="#7891b4"/>
  <text x="166" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637691">ETH yatır</text>

  <!-- Contract -->
  <g filter="url(#shadow)">
    <rect x="190" y="58" width="252" height="164" rx="24" fill="url(#contract)" stroke="#c5c8ed"/>
    <rect x="211" y="77" width="210" height="32" rx="12" fill="#ffffff" opacity="0.72"/>
    <path d="M227 91 h10 M227 97 h10 M227 103 h10" stroke="#7066a8" stroke-width="2" stroke-linecap="round"/>
    <text x="250" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d3971" font-weight="700">Zincirdeki Kod</text>
    <rect x="213" y="124" width="96" height="72" rx="15" fill="url(#funded)" filter="url(#softShadow)"/>
    <circle cx="235" cy="148" r="11" fill="#f6c862"/>
    <path d="M235 141 v14 M231 145 h7 M230 153 h10" stroke="#8e6922" stroke-width="1.8" stroke-linecap="round"/>
    <text x="266" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71531a" font-weight="700">Emanet</text>
    <text x="266" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#866c37">Bakiye tutulur</text>

    <rect x="322" y="124" width="98" height="72" rx="15" fill="#ffffff" opacity="0.76"/>
    <path d="M343 144 l7 7 13-15" fill="none" stroke="#5c9f7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="374" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405c52" font-weight="700">Koşullar</text>
    <text x="374" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657a72">Yetki · açık mı?</text>
  </g>

  <!-- seller -->
  <g filter="url(#shadow)">
    <rect x="496" y="84" width="116" height="92" rx="19" fill="#ffffff"/>
    <circle cx="554" cy="114" r="17" fill="#d9f4e1"/>
    <circle cx="554" cy="109" r="6" fill="#5d9d75"/>
    <path d="M543 126 C545 118 563 118 565 126" fill="none" stroke="#5d9d75" stroke-width="3" stroke-linecap="round"/>
    <text x="554" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365d46" font-weight="700">Satıcı</text>
    <text x="554" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718199">Ödeme alır</text>
  </g>

  <!-- contract seller output -->
  <path d="M448 130 H489" fill="none" stroke="#5b9b78" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="489,130 480,125 480,135" fill="#5b9b78"/>
  <text x="469" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d8166">Ödeme</text>

  <!-- State machine -->
  <g filter="url(#softShadow)">
    <rect x="106" y="251" width="105" height="42" rx="15" fill="#ffffff"/>
    <rect x="265" y="251" width="108" height="42" rx="15" fill="url(#funded)"/>
    <rect x="432" y="251" width="105" height="42" rx="15" fill="url(#paid)"/>
  </g>
  <text x="158" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f6278" font-weight="700">Ödeme bekliyor</text>
  <text x="319" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d25" font-weight="700">Fonlandı</text>
  <text x="484" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f7254" font-weight="700">Ödendi</text>

  <path d="M216 272 H258" fill="none" stroke="#7d8fa7" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="258,272 249,267 249,277" fill="#7d8fa7"/>
  <path d="M378 272 H425" fill="none" stroke="#5d9c78" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="425,272 416,267 416,277" fill="#5d9c78"/>

  <!-- approval action -->
  <path d="M317 226 V239" fill="none" stroke="#7169a4" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="317,246 312,237 322,237" fill="#7169a4"/>
  <rect x="267" y="225" width="100" height="22" rx="10" fill="#ffffff" opacity="0.9"/>
  <text x="317" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d568e">Alıcı onayı</text>

  <!-- oracle callout -->
  <g filter="url(#softShadow)">
    <rect x="460" y="199" width="145" height="35" rx="13" fill="#fffdf5" stroke="#eadcb8"/>
    <circle cx="480" cy="216" r="9" fill="#f6d585"/>
    <path d="M480 211 v6 M480 221 v1" stroke="#80632d" stroke-width="2" stroke-linecap="round"/>
    <text x="540" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80632d">Dış veri: Oracle</text>
  </g>
  <path d="M462 215 C441 210 432 198 414 190" fill="none" stroke="#b49454" stroke-width="1.8" stroke-dasharray="4 4"/>
</svg>