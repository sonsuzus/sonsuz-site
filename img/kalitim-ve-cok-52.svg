<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5f5"/>
      <stop offset="100%" stop-color="#d4b8e8"/>
    </linearGradient>
    <linearGradient id="childGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5e8f5"/>
      <stop offset="100%" stop-color="#b8d4e8"/>
    </linearGradient>
    <linearGradient id="childGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5f0e0"/>
      <stop offset="100%" stop-color="#b8e0cc"/>
    </linearGradient>
    <linearGradient id="childGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d5"/>
      <stop offset="100%" stop-color="#e8d4b8"/>
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d5e8"/>
      <stop offset="100%" stop-color="#e0b8d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="640" height="320" fill="url(#bgGrad)" rx="8"/>

  <!-- Başlık etiketi -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a4a6a">Kalıtım ve Çok Biçimlilik</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#7a7a9a">Ortak geçmiş, farklı karakter</text>

  <!-- Merkez: Temel sınıf -->
  <rect x="245" y="80" width="150" height="70" rx="12" fill="url(#baseGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="108" text-anchor="middle" font-weight="bold" fill="#3a2a4a">Hayvan</text>
  <text x="320" y="124" text-anchor="middle" fill="#4a3a5a">ad, bilgi_ver()</text>
  <text x="320" y="140" text-anchor="middle" fill="#4a3a5a">ses_cikar()</text>

  <!-- Alt sınıflar -->
  <rect x="40" y="190" width="130" height="60" rx="10" fill="url(#childGrad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="105" y="214" text-anchor="middle" font-weight="bold" fill="#2a3a4a">Kedi</text>
  <text x="105" y="230" text-anchor="middle" fill="#3a4a5a">ses_cikar()</text>
  <text x="105" y="244" text-anchor="middle" fill="#3a4a5a">→ "Miyav!"</text>

  <rect x="255" y="190" width="130" height="60" rx="10" fill="url(#childGrad2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="214" text-anchor="middle" font-weight="bold" fill="#2a4a3a">Kopek</text>
  <text x="320" y="230" text-anchor="middle" fill="#3a5a4a">ses_cikar()</text>
  <text x="320" y="244" text-anchor="middle" fill="#3a5a4a">→ "Hav hav!"</text>

  <rect x="470" y="190" width="130" height="60" rx="10" fill="url(#childGrad3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="535" y="214" text-anchor="middle" font-weight="bold" fill="#4a3a2a">Kus</text>
  <text x="535" y="230" text-anchor="middle" fill="#5a4a3a">super() ile</text>
  <text x="535" y="244" text-anchor="middle" fill="#5a4a3a">genişletme</text>

  <!-- Kalıtım okları -->
  <path d="M 180 190 L 290 155" stroke="#7a6a8a" stroke-width="1.8" fill="none"/>
  <polygon points="290,155 281,158 285,149" fill="#7a6a8a"/>

  <path d="M 320 190 L 320 155" stroke="#7a6a8a" stroke-width="1.8" fill="none"/>
  <polygon points="320,155 314,158 326,158" fill="#7a6a8a"/>

  <path d="M 460 190 L 350 155" stroke="#7a6a8a" stroke-width="1.8" fill="none"/>
  <polygon points="350,155 341,158 345,149" fill="#7a6a8a"/>

  <!-- Çok biçimlilik bölgesi -->
  <rect x="40" y="270" width="560" height="40" rx="8" fill="url(#polyGrad)" filter="url(#shadow)" opacity="0.85"/>
  <text x="320" y="288" text-anchor="middle" font-weight="bold" fill="#4a2a3a">Çok Biçimlilik: Aynı çağrı, farklı davranış</text>
  <text x="320" y="302" text-anchor="middle" fill="#5a3a4a">for hayvan in hayvanlar: hayvan.ses_cikar()</text>

  <!-- Bağlantı çizgisi -->
  <line x1="320" y1="250" x2="320" y2="270" stroke="#7a5a6a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Etiketler -->
  <text x="105" y="180" text-anchor="middle" font-size="10" fill="#5a6a7a">alt sınıf</text>
  <text x="320" y="180" text-anchor="middle" font-size="10" fill="#5a6a7a">alt sınıf</text>
  <text x="535" y="180" text-anchor="middle" font-size="10" fill="#5a6a7a">alt sınıf</text>

  <!-- Temel sınıf etiketi -->
  <text x="320" y="72" text-anchor="middle" font-size="10" fill="#5a4a6a">temel sınıf</text>
</svg>