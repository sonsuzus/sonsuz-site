<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b8dd9"/>
      <stop offset="100%" stop-color="#7aa8e8"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0936b"/>
      <stop offset="100%" stop-color="#f5b08a"/>
    </linearGradient>
    <linearGradient id="funcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fbf8f"/>
      <stop offset="100%" stop-color="#8fd4aa"/>
    </linearGradient>
    <linearGradient id="declGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b58fd6"/>
      <stop offset="100%" stop-color="#cba9e8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#8899aa" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#8899aa" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <rect x="180" y="14" width="280" height="32" rx="16" fill="url(#headerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="35" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">C Program Yapısı</text>

  <!-- Ok işaretleri (manuel çizim) -->
  <defs>
    <polygon id="arrowDown" points="0,0 -5,-7 5,-7"/>
  </defs>

  <!-- 1. Başlık Dosya Bildirimleri -->
  <rect x="80" y="70" width="200" height="52" rx="10" fill="url(#declGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="180" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Başlık Dosya</text>
  <text x="180" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#f0eaff">#include &lt;...&gt;</text>

  <!-- 2. Fonksiyon Bildirimleri -->
  <rect x="360" y="70" width="200" height="52" rx="10" fill="url(#declGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="460" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Fonksiyon Bildirimi</text>
  <text x="460" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#f0eaff">dönüş tipi ad(param);</text>

  <!-- Oklar: başlıktan aşağı -->
  <path d="M180,122 L180,150" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="180,155 175,146 185,146" fill="#7a9cc6"/>

  <path d="M460,122 L460,150" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="460,155 455,146 465,146" fill="#7a9cc6"/>

  <!-- Yatay bağlantı çizgisi -->
  <path d="M180,140 L460,140" stroke="#7a9cc6" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>

  <!-- 3. main() Fonksiyonu - merkez -->
  <rect x="220" y="160" width="200" height="60" rx="12" fill="url(#mainGrad)" filter="url(#shadow)"/>
  <text x="320" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">main() Fonksiyonu</text>
  <text x="320" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff5ee">int main(void) { ... }</text>

  <!-- Oklar: bildirimlerden main'e -->
  <path d="M180,122 L180,140 L320,140 L320,160" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="320,165 315,156 325,156" fill="#7a9cc6"/>

  <path d="M460,122 L460,140 L320,140 L320,160" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="320,165 315,156 325,156" fill="#7a9cc6"/>

  <!-- 4. Fonksiyon Ana Yapıları -->
  <rect x="80" y="250" width="200" height="52" rx="10" fill="url(#funcGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="180" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Fonksiyon Gövdesi</text>
  <text x="180" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eafff2">tip ad(param) { ... }</text>

  <rect x="360" y="250" width="200" height="52" rx="10" fill="url(#funcGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="460" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Fonksiyon Gövdesi</text>
  <text x="460" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eafff2">tip ad(param) { ... }</text>

  <!-- Oklar: main'den fonksiyonlara -->
  <path d="M260,220 L260,240 L180,240 L180,250" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="180,255 175,246 185,246" fill="#7a9cc6"/>

  <path d="M380,220 L380,240 L460,240 L460,250" stroke="#7a9cc6" stroke-width="2" fill="none"/>
  <polygon points="460,255 455,246 465,246" fill="#7a9cc6"/>

  <!-- Alt not -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6688aa" font-style="italic">En az bir main() fonksiyonu zorunludur</text>
</svg>