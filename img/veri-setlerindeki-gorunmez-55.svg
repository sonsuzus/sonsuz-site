<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320"> <defs> <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#f5f9ff"/> <stop offset="1" stop-color="#f3f8ef"/> </linearGradient> <linearGradient id="data" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#dcecff"/> <stop offset="1" stop-color="#c9def4"/> </linearGradient> <linearGradient id="bias" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#fff0dc"/> <stop offset="1" stop-color="#f5d8bc"/> </linearGradient> <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#e3f4e8"/> <stop offset="1" stop-color="#cfe7d7"/> </linearGradient> <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"> <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#718096" flood-opacity=".18"/> </filter> <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"> <path d="M0 0 L8 4 L0 8 Z" fill="#718096"/> </marker> <style> text{font-family:"Segoe UI",Tahoma,sans-serif;font-size:12px;fill:#334155} .title{font-size:15px;font-weight:600;fill:#26364a} .bold{font-weight:600} .small{font-size:11px} .line{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)} .dash{fill:none;stroke:#91a1b3;stroke-width:1.5;stroke-dasharray:5 5} .box{stroke:#d5dee8;stroke-width:1} </style> </defs> <rect width="640" height="320" rx="18" fill="url(#bg)"/>

<text x="320" y="27" text-anchor="middle" class="title">Veri Önyargısı → Model Kararı</text>

<!-- Gerçek dünya --> <rect x="25" y="65" width="115" height="86" rx="16" fill="#fff" class="box" filter="url(#shadow)"/> <text x="82" y="88" text-anchor="middle" class="bold">Gerçek Dünya</text> <circle cx="53" cy="113" r="10" fill="#c9d9e8"/> <circle cx="82" cy="113" r="10" fill="#d8e9d9"/> <circle cx="111" cy="113" r="10" fill="#e8d8ed"/> <circle cx="53" cy="137" r="7" fill="#f0d9b8"/> <circle cx="82" cy="137" r="7" fill="#c9d9e8"/> <circle cx="111" cy="137" r="7" fill="#d8e9d9"/> <!-- Veri toplama --> <rect x="170" y="65" width="125" height="86" rx="16" fill="url(#data)" class="box" filter="url(#shadow)"/> <text x="232" y="88" text-anchor="middle" class="bold">Veri Toplama</text> <path d="M202 108 h61 v23 h-61 z" fill="#fff" opacity=".8"/> <ellipse cx="232" cy="108" rx="30.5" ry="7" fill="#d8e5f2" stroke="#9bb1c8"/> <path d="M202 108v23 M263 108v23" stroke="#9bb1c8" fill="none"/> <text x="232" y="145" text-anchor="middle" class="small">Kim temsil ediliyor?</text> <path d="M140 108 L170 108" class="line"/> <!-- Veri seti --> <rect x="325" y="65" width="125" height="86" rx="16" fill="#fff" class="box" filter="url(#shadow)"/> <text x="387" y="88" text-anchor="middle" class="bold">Veri Seti</text> <circle cx="350" cy="108" r="6" fill="#8bb6e2"/> <circle cx="370" cy="108" r="6" fill="#8bb6e2"/> <circle cx="390" cy="108" r="6" fill="#8bb6e2"/> <circle cx="410" cy="108" r="6" fill="#e3c27f"/> <circle cx="430" cy="108" r="6" fill="#c9d6c9"/> <circle cx="350" cy="126" r="6" fill="#8bb6e2"/> <circle cx="370" cy="126" r="6" fill="#8bb6e2"/> <circle cx="390" cy="126" r="6" fill="#c9d6c9"/> <rect x="410" y="120" width="12" height="12" rx="3" fill="none" stroke="#c3ccd5" stroke-dasharray="2 2"/> <rect x="430" y="120" width="12" height="12" rx="3" fill="none" stroke="#c3ccd5" stroke-dasharray="2 2"/> <text x="387" y="145" text-anchor="middle" class="small">Eksik / dengesiz temsil</text> <path d="M295 108 L325 108" class="line"/> <!-- Önyargı --> <rect x="170" y="180" width="125" height="86" rx="16" fill="url(#bias)" class="box" filter="url(#shadow)"/> <text x="232" y="203" text-anchor="middle" class="bold">Önyargı</text> <circle cx="232" cy="226" r="17" fill="#fff" opacity=".8"/> <text x="232" y="232" text-anchor="middle" font-size="20" fill="#c78352">!</text> <text x="232" y="252" text-anchor="middle" class="small">Geçmiş kararlar</text> <!-- Model --> <rect x="325" y="180" width="125" height="86" rx="16" fill="url(#model)" class="box" filter="url(#shadow)"/> <text x="387" y="203" text-anchor="middle" class="bold">Model</text> <circle cx="350" cy="231" r="7" fill="#91b9e4"/> <circle cx="387" cy="218" r="7" fill="#91b9e4"/> <circle cx="387" cy="244" r="7" fill="#91b9e4"/> <circle cx="424" cy="231" r="7" fill="#91b9e4"/> <path d="M356 228 L381 220 M356 234 L381 242 M393 220 L418 228 M393 242 L418 234" stroke="#7e9fbe" fill="none"/> <text x="387" y="258" text-anchor="middle" class="small">Önyargıyı öğrenebilir</text> <!-- Decision --> <rect x="480" y="65" width="135" height="201" rx="18" fill="#fff" class="box" filter="url(#shadow)"/> <text x="547" y="89" text-anchor="middle" class="bold">Model Kararı</text> <rect x="500" y="105" width="95" height="30" rx="10" fill="#e5f3e8"/> <text x="547" y="125" text-anchor="middle">Olumlu</text> <rect x="500" y="143" width="95" height="30" rx="10" fill="#fff0d8"/> <text x="547" y="163" text-anchor="middle">Belirsiz</text> <rect x="500" y="181" width="95" height="30" rx="10" fill="#f7e1df"/> <text x="547" y="201" text-anchor="middle">Olumsuz</text>

<text x="547" y="235" text-anchor="middle" class="small">Gruplar arasında</text>
<text x="547" y="251" text-anchor="middle" class="small">hata farkı oluşabilir</text>

