<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe47a"/>
      <stop offset="100%" stop-color="#ffc971"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.2"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="74" cy="62" r="42" fill="#dff2fa" opacity="0.65"/>
  <circle cx="579" cy="264" r="57" fill="#e6f4d8" opacity="0.7"/>
  <path d="M35 159 C116 112, 153 208, 223 167 S353 118, 422 158 S536 208, 612 145" fill="none" stroke="#d8e7ed" stroke-width="2"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33475b">
    <text x="320" y="30" text-anchor="middle" font-weight="700" font-size="15" fill="#39516a">Bloklardan Algoritmik Düşünmeye</text>
    <text x="320" y="48" text-anchor="middle" fill="#6a8193">Görsel kodlama ile keşfet, dene ve açıkla</text>
  </g>

  <!-- Sol: bloklar -->
  <g filter="url(#shadow)">
    <rect x="42" y="101" width="142" height="127" rx="20" fill="#ffffff"/>
    <rect x="42" y="101" width="142" height="31" rx="20" fill="#dbeeff"/>
    <path d="M42 120 H184 V132 H42Z" fill="#dbeeff"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31526e">
    <text x="113" y="121" text-anchor="middle" font-weight="700">Görsel Bloklar</text>
  </g>
  <g filter="url(#softShadow)">
    <path d="M59 145 h76 a7 7 0 0 1 7 7 v8 a7 7 0 0 1-7 7 H59 a7 7 0 0 1-7-7 v-8 a7 7 0 0 1 7-7z" fill="#ffbd79"/>
    <circle cx="66" cy="156" r="4" fill="#fff2d8"/>
    <text x="100" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c4d21">Başlat</text>
    <path d="M73 173 h75 a7 7 0 0 1 7 7 v8 a7 7 0 0 1-7 7 H73 a7 7 0 0 1-7-7 v-8 a7 7 0 0 1 7-7z" fill="#8ed8f8"/>
    <circle cx="80" cy="184" r="4" fill="#e8faff"/>
    <text x="115" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#235a78">Hareket et</text>
    <path d="M58 201 h74 a7 7 0 0 1 7 7 v8 a7 7 0 0 1-7 7 H58 a7 7 0 0 1-7-7 v-8 a7 7 0 0 1 7-7z" fill="#c8a5ed"/>
    <circle cx="65" cy="212" r="4" fill="#f4eaff"/>
    <text x="100" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#563a77">Puan artır</text>
  </g>

  <!-- arrow left to center -->
  <path d="M194 165 H222" fill="none" stroke="#7d9bb0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="228,165 218,159 218,171" fill="#7d9bb0"/>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="165" r="78" fill="url(#core)"/>
    <circle cx="320" cy="165" r="62" fill="#fff9e9" opacity="0.74"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" text-anchor="middle">
    <text x="320" y="145" font-size="13" font-weight="700" fill="#624b2b">ALGORİTMA</text>
    <path d="M286 156 H354" stroke="#d69f50" stroke-width="2" stroke-linecap="round"/>
    <text x="320" y="176" font-size="12" fill="#765b38">Planla</text>
    <text x="320" y="194" font-size="12" fill="#765b38">Uygula</text>
  </g>
  <circle cx="320" cy="215" r="12" fill="#ffffff" opacity="0.85"/>
  <path d="M315 215 l4 4 7-9" fill="none" stroke="#72ad70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Üst kavram -->
  <path d="M300 81 L310 91" fill="none" stroke="#9eb5c4" stroke-width="2"/>
  <g filter="url(#softShadow)">
    <rect x="220" y="58" width="90" height="28" rx="14" fill="#d9f2eb"/>
  </g>
  <text x="265" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35685e">Sıralama</text>

  <!-- Üst sağ kavram -->
  <path d="M358 99 L379 84" fill="none" stroke="#9eb5c4" stroke-width="2"/>
  <g filter="url(#softShadow)">
    <rect x="378" y="57" width="90" height="28" rx="14" fill="#e6dcfa"/>
  </g>
  <text x="423" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c4c82">Koşul</text>

  <!-- alt kavram -->
  <path d="M284 236 L267 253" fill="none" stroke="#9eb5c4" stroke-width="2"/>
  <g filter="url(#softShadow)">
    <rect x="194" y="250" width="93" height="28" rx="14" fill="#dbeeff"/>
  </g>
  <text x="240" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365e7b">Döngü</text>

  <!-- alt sağ kavram -->
  <path d="M358 232 L383 250" fill="none" stroke="#9eb5c4" stroke-width="2"/>
  <g filter="url(#softShadow)">
    <rect x="382" y="250" width="101" height="28" rx="14" fill="#ffe1d1"/>
  </g>
  <text x="432" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a553d">Değişken</text>

  <!-- arrow center to right -->
  <path d="M403 165 H429" fill="none" stroke="#7d9bb0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="435,165 425,159 425,171" fill="#7d9bb0"/>

  <!-- Sağ oyun/test -->
  <g filter="url(#shadow)">
    <rect x="444" y="101" width="154" height="127" rx="20" fill="#ffffff"/>
    <rect x="444" y="101" width="154" height="31" rx="20" fill="#dff2d4"/>
    <path d="M444 120 H598 V132 H444Z" fill="#dff2d4"/>
  </g>
  <text x="521" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41643a">Keşif ve Test</text>

  <g filter="url(#softShadow)">
    <rect x="461" y="145" width="74" height="62" rx="11" fill="#edf8ff" stroke="#c6e5f4"/>
    <circle cx="477" cy="163" r="10" fill="#ffcb72"/>
    <path d="M472 160 l5-5 5 5 -2 6 h-6z" fill="#fff5cb"/>
    <path d="M493 179 h24" stroke="#88b8d2" stroke-width="3" stroke-linecap="round"/>
    <path d="M493 187 h17" stroke="#b1d1e3" stroke-width="3" stroke-linecap="round"/>
    <text x="498" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#47718a">Oyun</text>
  </g>

  <g>
    <circle cx="556" cy="155" r="9" fill="#a6d994"/>
    <path d="M552 155 l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="571" y="159" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486a4a">Dene</text>
    <circle cx="556" cy="180" r="9" fill="#f5b6a5"/>
    <path d="M552 176 l8 8 M560 176 l-8 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="571" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80554a">Hata bul</text>
    <path d="M546 202 h34" stroke="#9cc889" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="320" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607789">Görünür sonuçlar, problem çözme becerisini güçlendirir</text>
</svg>