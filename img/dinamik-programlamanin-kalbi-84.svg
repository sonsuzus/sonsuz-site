    <rect x="479" y="81" width="116" height="25" rx="8" fill="#dceaff"/>
    <rect x="479" y="113" width="116" height="25" rx="8" fill="#edf7dd"/>
    <rect x="479" y="145" width="116" height="25" rx="8" fill="#ffe8d4"/>
    <rect x="479" y="177" width="116" height="17" rx="7" fill="#e9e1ff"/>
  </g>
  <path d="M512 81 V194 M552 81 V194" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <text x="491" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6e94">Durum</text>
  <text x="532" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6e94">Geçiş</text>
  <text x="573" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d6e94">Sonuç</text>
  <text x="491" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54745c">n−2</text>
  <text x="532" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54745c">+</text>
  <text x="573" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54745c">saklı</text>
  <text x="491" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936747">n−1</text>
  <text x="532" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936747">+</text>
  <text x="573" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936747">saklı</text>
  <text x="537" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#655985">Her durum bir kez</text>

