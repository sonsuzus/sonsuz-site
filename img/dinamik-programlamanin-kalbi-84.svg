  <g filter="url(#soft)">
    <rect x="62" y="247" width="128" height="37" rx="18" fill="#ffffff"/>
    <rect x="210" y="247" width="122" height="37" rx="18" fill="#ffffff"/>
    <rect x="352" y="247" width="130" height="37" rx="18" fill="#ffffff"/>
