  <text x="82" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#715a26">Ana problem</text>
  <text x="82" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7650">F(n)</text>

  <path d="M130 119 C148 106 151 92 169 84" fill="none" stroke="#8ca4b5" stroke-width="2.5"/>
  <polygon points="169,79 166,88 175,85" fill="#8ca4b5"/>
  <path d="M130 136 C147 148 152 164 169 175" fill="none" stroke="#8ca4b5" stroke-width="2.5"/>
  <polygon points="169,169 168,179 177,174" fill="#8ca4b5"/>

  <g filter="url(#soft)">
    <rect x="170" y="61" width="78" height="42" rx="12" fill="#e6ddff"/>
    <rect x="170" y="157" width="78" height="42" rx="12" fill="#d9f3e7"/>
  </g>
  <text x="209" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5f5682">Alt problem</text>
  <text x="209" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#427567">Alt problem</text>
  <text x="209" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#776c99">F(n−1)</text>
  <text x="209" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b8a7c">F(n−2)</text>

  <path d="M248 82 C269 88 276 111 287 126" fill="none" stroke="#9a95bb" stroke-width="2.5"/>
  <polygon points="287,120 281,129 291,128" fill="#9a95bb"/>
  <path d="M248 178 C270 169 276 151 287 140" fill="none" stroke="#77a99a" stroke-width="2.5"/>
  <polygon points="286,136 282,145 292,143" fill="#77a99a"/>

