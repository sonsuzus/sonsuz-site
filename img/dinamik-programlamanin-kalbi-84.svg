  <circle cx="82" cy="265" r="8" fill="#f2c976"/>
  <path d="M79 265 h6 M82 262 v6" stroke="#80642b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="130" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7182">Örtüşen altlar</text>
  <circle cx="230" cy="265" r="8" fill="#aee0ca"/>
  <path d="M226 265 l3 3 6 -7" fill="none" stroke="#40745f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="280" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7182">En iyi yapı</text>
  <circle cx="372" cy="265" r="8" fill="#cbbcf1"/>
  <path d="M369 262 h6 v6 h-6z" fill="none" stroke="#66558d" stroke-width="1.4"/>
  <text x="432" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7182">O(n) hesaplama</text>
