  <circle cx="319" cy="135" r="15" fill="#ffffff" opacity="0.85"/>
  <path d="M314 135 h10 M319 130 v10" stroke="#4f7e8b" stroke-width="2.2" stroke-linecap="round"/>
  <text x="365" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#376875">Durum</text>
  <text x="365" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7d7a">DP(i, c)</text>
  <text x="365" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547a83">Önbellek</text>

