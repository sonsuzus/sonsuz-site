<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9dcff"/>
      <stop offset="100%" stop-color="#b8f0dd"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#55708c" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#70849b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="65" cy="44" r="74" fill="#dcecff" opacity="0.55"/>
  <circle cx="590" cy="278" r="86" fill="#d8f1dc" opacity="0.55"/>
  <path d="M18 265 C118 224 145 298 232 276 S394 235 495 276 S582 280 630 239" fill="none" stroke="#c8dfdf" stroke-width="2" opacity="0.55"/>

  <text x="32" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#48637b">DİNAMİK PROGRAMLAMA</text>
  <text x="32" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758a9d">Tekrarı sakla, çözümü büyüt</text>

  <!-- recursive subproblems -->
  <g filter="url(#soft)">
    <rect x="35" y="105" width="95" height="45" rx="13" fill="#fff4d7"/>
    <rect x="40" y="109" width="85" height="35" rx="10" fill="#fff9e8"/>
