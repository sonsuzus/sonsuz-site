<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="timeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8bbdea"/>
      <stop offset="55%" stop-color="#9bcdb5"/>
      <stop offset="100%" stop-color="#f1b779"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#66839a" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#536f80" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="73" cy="35" r="74" fill="#dceefa" opacity="0.55"/>
  <circle cx="586" cy="269" r="95" fill="#e3f2dc" opacity="0.6"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38566a">MVCC · Sürüm Zaman Yolculuğu</text>

  <!-- reader -->
  <g filter="url(#shadow)">
    <rect x="27" y="83" width="144" height="112" rx="18" fill="#ffffff"/>
    <rect x="27" y="83" width="144" height="31" rx="18" fill="#d9edff"/>
    <rect x="27" y="101" width="144" height="13" fill="#d9edff"/>
  </g>
  <circle cx="53" cy="99" r="10" fill="#75aad2"/>
  <path d="M49 99h8M53 95v8" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="70" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b76">Okuyucu A</text>
  <text x="46" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527082">Snapshot: 10:00</text>
  <rect x="45" y="148" width="107" height="29" rx="9" fill="#edf7ff"/>
  <text x="98" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3675a1">Fiyat: 100</text>

  <!-- arrow reader to version -->
  <path d="M171 139 C191 139 194 139 210 139" fill="none" stroke="#76aaca" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="210,139 202,134 202,144" fill="#76aaca"/>

  <!-- center version timeline -->
  <g filter="url(#shadow)">
    <rect x="211" y="57" width="218" height="166" rx="21" fill="#ffffff"/>
  </g>
  <text x="320" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5e65">Satır Sürümleri</text>
  <path d="M242 145 H396" stroke="url(#timeLine)" stroke-width="8" stroke-linecap="round"/>
  <path d="M250 145 H388" stroke="#ffffff" stroke-width="1" opacity="0.7"/>

  <circle cx="265" cy="145" r="18" fill="#d9edff" stroke="#76aad0" stroke-width="2"/>
  <text x="265" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#366e94">v1</text>
  <text x="265" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52768a">100</text>

  <circle cx="337" cy="145" r="18" fill="#e2f3e5" stroke="#7eb692" stroke-width="2"/>
  <text x="337" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#427a58">v2</text>
  <text x="337" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527565">120</text>

  <circle cx="394" cy="145" r="11" fill="#fff0dc" stroke="#e6a760" stroke-width="2"/>
  <text x="320" y="191" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66808a">Geçmiş ← tutarlı görünüm → güncel</text>
  <path d="M265 117 V105" stroke="#76aaca" stroke-width="1.5"/>
  <text x="265" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a7189">10:00</text>
  <path d="M337 117 V105" stroke="#78af8d" stroke-width="1.5"/>
  <text x="337" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7560">10:01</text>

  <!-- writer -->
  <g filter="url(#shadow)">
    <rect x="469" y="83" width="144" height="112" rx="18" fill="#ffffff"/>
    <rect x="469" y="83" width="144" height="31" rx="18" fill="#ffe8d2"/>
    <rect x="469" y="101" width="144" height="13" fill="#ffe8d2"/>
  </g>
  <circle cx="495" cy="99" r="10" fill="#df9853"/>
  <path d="M491 102l8-8M492 94l3 3M496 101l3 3" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="512" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#815426">Yazar B</text>
  <text x="488" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#826d5a">Güncelle: 10:01</text>
  <rect x="487" y="148" width="107" height="29" rx="9" fill="#fff4e7"/>
  <text x="540" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#b36b28">Yeni: 120</text>

  <!-- writer arrow -->
  <path d="M469 139 C451 139 447 139 430 139" fill="none" stroke="#dc9a55" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="430,139 438,134 438,144" fill="#dc9a55"/>

  <!-- split note -->
  <path d="M320 223 V243" stroke="#8aadb9" stroke-width="2" stroke-linecap="round"/>
  <polygon points="320,250 315,241 325,241" fill="#8aadb9"/>

  <!-- maintenance -->
  <g filter="url(#soft)">
    <rect x="193" y="251" width="254" height="47" rx="16" fill="#e7f4e9"/>
  </g>
  <circle cx="221" cy="274" r="13" fill="#86b99a"/>
  <path d="M215 274a6 6 0 1 0 10-4M227 274a6 6 0 1 1-10 4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="244" y="271" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#49745a">Eski sürüm temizliği</text>
  <text x="244" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62836e">Aktif işlemler bitince</text>

  <!-- conflict annotation -->
  <path d="M541 204 V225 H459" fill="none" stroke="#d7a36b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="536" y="217" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7045">Yazma çatışması</text>
</svg>