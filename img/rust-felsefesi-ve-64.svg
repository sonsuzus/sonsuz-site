<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="rustCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9bd"/>
      <stop offset="100%" stop-color="#f6b98f"/>
    </linearGradient>
    <linearGradient id="safeCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f1df"/>
      <stop offset="100%" stop-color="#abdcba"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6e8798" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6e8798" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="77" cy="55" r="66" fill="#dbeefa" opacity="0.52"/>
  <circle cx="577" cy="269" r="92" fill="#dff2d7" opacity="0.46"/>
  <path d="M42 262 C138 221, 173 294, 269 258 S441 205, 604 245" fill="none" stroke="#c9e3e7" stroke-width="2" opacity="0.65"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355164">Rust: derleme zamanında bellek güvenliği</text>

  <!-- input: value -->
  <g filter="url(#smallShadow)">
    <rect x="31" y="111" width="119" height="102" rx="18" fill="#e0eafa"/>
    <rect x="31" y="111" width="119" height="102" rx="18" fill="none" stroke="#c3d5ec"/>
  </g>
  <circle cx="91" cy="139" r="18" fill="#b8d0f0"/>
  <path d="M84 139 h14 M84 145 h10 M84 133 h10" fill="none" stroke="#456b91" stroke-width="2" stroke-linecap="round"/>
  <text x="91" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36556f">Değer</text>
  <text x="91" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587184">Heap ve kapsam</text>

  <!-- connector left -->
  <path d="M151 162 H202" fill="none" stroke="#7d9db4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="202,162 193,157 193,167" fill="#7d9db4"/>

  <!-- central compiler -->
  <g filter="url(#shadow)">
    <rect x="203" y="75" width="230" height="174" rx="24" fill="url(#rustCard)"/>
    <rect x="203" y="75" width="230" height="174" rx="24" fill="none" stroke="#e3a77e"/>
  </g>
  <circle cx="318" cy="109" r="21" fill="#fff0e5" opacity="0.9"/>
  <path d="M309 101 h18 v16 h-18 z M313 97 v4 M323 97 v4 M313 117 v4 M323 117 v4 M313 106 h10" fill="none" stroke="#a7542c" stroke-width="2" stroke-linejoin="round"/>
  <text x="318" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#713b27">Rust Derleyicisi</text>

  <g>
    <rect x="222" y="158" width="77" height="34" rx="10" fill="#fff5ec" opacity="0.88"/>
    <text x="260.5" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79462f">Sahiplik</text>
    <rect x="306" y="158" width="108" height="34" rx="10" fill="#fff5ec" opacity="0.88"/>
    <text x="360" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79462f">Ödünç alma</text>
    <rect x="262" y="200" width="112" height="34" rx="10" fill="#fff5ec" opacity="0.88"/>
    <text x="318" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79462f">Yaşam süresi</text>
  </g>

  <!-- upper output -->
  <path d="M434 117 H484" fill="none" stroke="#6fa286" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="484,117 475,112 475,122" fill="#6fa286"/>
  <g filter="url(#smallShadow)">
    <rect x="485" y="70" width="124" height="92" rx="17" fill="url(#safeCard)"/>
    <rect x="485" y="70" width="124" height="92" rx="17" fill="none" stroke="#9ecdb0"/>
  </g>
  <circle cx="547" cy="96" r="15" fill="#f3fff5"/>
  <path d="M540 96 l5 5 10-11" fill="none" stroke="#3d8a5b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="547" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#326a49">Güvenli kod</text>
  <text x="547" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527562">Derleme onayı</text>

  <!-- lower output -->
  <path d="M434 208 H484" fill="none" stroke="#718ba3" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="484,208 475,203 475,213" fill="#718ba3"/>
  <g filter="url(#smallShadow)">
    <rect x="485" y="180" width="124" height="91" rx="17" fill="#e4edf7"/>
    <rect x="485" y="180" width="124" height="91" rx="17" fill="none" stroke="#bfd0e1"/>
  </g>
  <circle cx="547" cy="206" r="15" fill="#f8fbff"/>
  <path d="M540 211 l14-14 M540 197 l14 14" fill="none" stroke="#5b738c" stroke-width="2.2" stroke-linecap="round"/>
  <text x="547" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405d76">Hata engeli</text>
  <text x="547" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60788e">Geçersiz erişim</text>

  <!-- bottom note -->
  <g filter="url(#smallShadow)">
    <rect x="190" y="270" width="260" height="32" rx="15" fill="#d9edf0"/>
  </g>
  <path d="M233 270 V255" fill="none" stroke="#7da9ae" stroke-width="2"/>
  <polygon points="233,255 228,263 238,263" fill="#7da9ae"/>
  <text x="320" y="291" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3e6c72">Deterministik drop · çöp toplayıcı yok</text>
</svg>