<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7196d8"/>
      <stop offset="100%" stop-color="#5279bd"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c8495" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71909e" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="#dcecf5" opacity="0.42"/>
  <circle cx="320" cy="160" r="88" fill="none" stroke="#a7c5d7" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.65"/>

  <!-- Bağlantılar -->
  <path d="M260 136 L190 96" fill="none" stroke="#94abc0" stroke-width="2"/>
  <polygon points="190,96 200,96 195,104" fill="#94abc0"/>
  <path d="M380 136 L450 96" fill="none" stroke="#94abc0" stroke-width="2"/>
  <polygon points="450,96 445,104 455,104" fill="#94abc0"/>
  <path d="M256 176 L180 212" fill="none" stroke="#94abc0" stroke-width="2"/>
  <polygon points="180,212 190,204 191,214" fill="#94abc0"/>
  <path d="M384 176 L460 212" fill="none" stroke="#94abc0" stroke-width="2"/>
  <polygon points="460,212 449,214 451,204" fill="#94abc0"/>

  <!-- Sol üst: Matematik -->
  <g filter="url(#soft)">
    <rect x="58" y="53" width="137" height="72" rx="16" fill="#fff4d9"/>
    <rect x="70" y="65" width="31" height="31" rx="9" fill="#f4c867"/>
    <text x="85.5" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#75551c">√</text>
    <text x="111" y="78" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b5960">math.h</text>
    <text x="111" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657278">sqrt · pow · hypot</text>
  </g>

  <!-- Sağ üst: Metin -->
  <g filter="url(#soft)">
    <rect x="445" y="53" width="137" height="72" rx="16" fill="#e7f5ec"/>
    <rect x="457" y="65" width="31" height="31" rx="9" fill="#86c7a5"/>
    <text x="472.5" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#295c44">Aa</text>
    <text x="498" y="78" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b5960">string.h</text>
    <text x="498" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657278">strlen · memmove</text>
  </g>

  <!-- Sol alt: Bellek -->
  <g filter="url(#soft)">
    <rect x="49" y="190" width="143" height="72" rx="16" fill="#f3eafd"/>
    <rect x="61" y="202" width="31" height="31" rx="9" fill="#b999dd"/>
    <path d="M69 211 h15 v4 h-15z M69 219 h15 v4 h-15z" fill="#ffffff"/>
    <text x="102" y="215" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b5960">stdlib.h</text>
    <text x="102" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657278">malloc · realloc · free</text>
  </g>

  <!-- Sağ alt: Girdi çıktı -->
  <g filter="url(#soft)">
    <rect x="448" y="190" width="143" height="72" rx="16" fill="#e6f1fe"/>
    <rect x="460" y="202" width="31" height="31" rx="9" fill="#83afe4"/>
    <path d="M468 210 h15 v11 h-15z M471 213 h9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="501" y="215" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b5960">stdio.h</text>
    <text x="501" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657278">printf · fgets</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="255" y="112" width="130" height="96" rx="23" fill="url(#core)"/>
    <rect x="271" y="128" width="28" height="28" rx="8" fill="#dce9ff" opacity="0.95"/>
    <path d="M278 136 h14 M278 142 h10 M278 148 h13" stroke="#547ab8" stroke-width="2" stroke-linecap="round"/>
    <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">C Standart</text>
    <text x="320" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e7f0ff">Kütüphanesi</text>
  </g>

  <!-- Alt akış -->
  <path d="M320 208 L320 276" fill="none" stroke="#718ca2" stroke-width="2.2"/>
  <polygon points="320,280 314,270 326,270" fill="#718ca2"/>

  <g filter="url(#soft)">
    <rect x="209" y="279" width="222" height="30" rx="14" fill="#ffffff"/>
    <circle cx="228" cy="294" r="8" fill="#8fc7a4"/>
    <path d="M224.5 294 l2.4 2.5 4.7-5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="244" y="298" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d616b">Sözleşme: kapasite · dönüş · serbest bırak</text>
  </g>

  <!-- Köşe notları -->
  <text x="30" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66808c">Başlıklar bildirir</text>
  <path d="M136 27 L227 27 L227 61" fill="none" stroke="#b2c6cf" stroke-width="1.5"/>
  <polygon points="227,65 222,57 232,57" fill="#b2c6cf"/>

  <text x="463" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66808c">Kütüphane uygular</text>
  <path d="M442 27 L414 27 L414 61" fill="none" stroke="#b2c6cf" stroke-width="1.5"/>
  <polygon points="414,65 409,57 419,57" fill="#b2c6cf"/>
</svg>