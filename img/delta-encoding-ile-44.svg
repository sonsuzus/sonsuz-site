    <text x="477" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67808b">Hash doğrulama</text>
    <text x="477" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67808b">Düzenli anlık görüntü</text>
  </g>

  <path d="M566 176 L566 193 C566 199 560 202 553 202 H498" fill="none" stroke="#8aa2ad" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="498,202 506,197 506,207" fill="#8aa2ad"/>

  <text x="84" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Benzer sürümler</text>
  <text x="84" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">ortak veriyi paylaşır</text>
</svg>