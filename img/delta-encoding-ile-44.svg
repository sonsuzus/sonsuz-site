  <path d="M350 239 C395 239 405 206 435 181" fill="none" stroke="#7190a5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="435,181 425,184 431,191" fill="#7190a5"/>

  <g filter="url(#golge)">
    <rect x="44" y="85" width="130" height="91" rx="17" fill="url(#bazGrad)" stroke="#9bbfdd"/>
    <rect x="62" y="104" width="45" height="50" rx="6" fill="#ffffff" opacity="0.82"/>
    <path d="M72 118 H97 M72 128 H97 M72 138 H90" stroke="#82a7c4" stroke-width="3" stroke-linecap="round"/>
    <text x="119" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36536b">Baz Dosya</text>
    <text x="119" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527186">v1 · 100 MB</text>
    <text x="119" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527186">Tam kopya</text>
  </g>

  <g filter="url(#golge)">
