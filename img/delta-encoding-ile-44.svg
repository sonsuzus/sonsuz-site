<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="bazGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e9ff"/>
      <stop offset="100%" stop-color="#bcd9f5"/>
    </linearGradient>
    <linearGradient id="deltaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff5df"/>
      <stop offset="100%" stop-color="#bfe6c4"/>
    </linearGradient>
    <linearGradient id="hedefGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0d6"/>
      <stop offset="100%" stop-color="#f5d39d"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7690a5" flood-opacity="0.22"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7690a5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="90" cy="58" r="68" fill="#dbeeff" opacity="0.42"/>
  <circle cx="565" cy="263" r="92" fill="#dff1d8" opacity="0.48"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36536b">Delta Encoding ile Akıllı Depolama</text>
  <text x="320" y="49" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Sadece değişen bölümleri sakla</text>

