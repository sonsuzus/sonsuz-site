  <path d="M335 129 L390 129" fill="none" stroke="#7190a5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="390,129 381,124 381,134" fill="#7190a5"/>

  <path d="M280 175 L280 209" fill="none" stroke="#7190a5" stroke-width="2.5" stroke-linecap="round"/>
