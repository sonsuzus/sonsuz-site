    <circle cx="280" cy="113" r="20" fill="#ffffff" opacity="0.83"/>
    <path d="M270 113 H290 M280 103 V123" stroke="#4d9a64" stroke-width="3" stroke-linecap="round"/>
    <text x="280" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#326a46">Delta</text>
    <text x="280" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c7c59">2 MB fark</text>
  </g>

