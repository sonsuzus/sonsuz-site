    <text x="469" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76522b">Hedef Dosya</text>
    <text x="469" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#89683e">v2 · yeniden kurulur</text>
    <text x="469" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#89683e">B + Δ → T</text>
  </g>

  <g filter="url(#golge)">
    <rect x="190" y="210" width="160" height="73" rx="17" fill="#ece5fa" stroke="#b9a8d9"/>
    <path d="M214 241 C214 232 221 226 230 226 H244 C253 226 260 232 260 241 V257 H214 Z" fill="#ffffff" opacity="0.78"/>
    <path d="M222 246 H252 M222 253 H244" stroke="#9179b7" stroke-width="3" stroke-linecap="round"/>
    <text x="275" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5f4a84">Verimli Depo</text>
    <text x="275" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#786492">Baz + küçük fark</text>
    <text x="275" y="275" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#786492">Alan tasarrufu</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="435" y="207" width="145" height="76" rx="15" fill="#ffffff" stroke="#c9d9df"/>
    <circle cx="457" cy="231" r="11" fill="#cdebf1"/>
    <path d="M452 231 L456 235 L463 227" fill="none" stroke="#428499" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
