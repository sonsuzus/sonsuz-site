<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#bfd9f5"/>
    </linearGradient>
    <filter id="golge" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#64748b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="68" cy="44" r="52" fill="#dceeff" opacity="0.55"/>
  <circle cx="588" cy="282" r="74" fill="#dff1d9" opacity="0.48"/>
  <circle cx="565" cy="48" r="30" fill="#fff2c9" opacity="0.5"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#50627a" font-weight="600">DERLEME ZAMANINDA TİP ÇIKARIMI</text>

  <!-- Sol kanıt kartları -->
  <g filter="url(#hafifGolge)">
    <rect x="34" y="68" width="146" height="48" rx="14" fill="#fffdf8"/>
    <rect x="34" y="68" width="7" height="48" rx="4" fill="#f2bd62"/>
    <text x="54" y="88" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43536a" font-weight="600">Sabit değer</text>
    <text x="54" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78879a">42  ·  sayı</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="34" y="137" width="146" height="48" rx="14" fill="#fffdf8"/>
    <rect x="34" y="137" width="7" height="48" rx="4" fill="#ae8ed6"/>
    <text x="54" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43536a" font-weight="600">İfade analizi</text>
    <text x="54" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78879a">işleç  ·  dönüş</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="34" y="206" width="146" height="48" rx="14" fill="#fffdf8"/>
    <rect x="34" y="206" width="7" height="48" rx="4" fill="#72ba9a"/>
    <text x="54" y="226" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43536a" font-weight="600">Genel kısıtlar</text>
    <text x="54" y="243" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78879a">liste  ·  T[]</text>
  </g>

  <!-- Bağlantılar -->
  <path d="M180 92 H220 Q230 92 236 105 L253 145" fill="none" stroke="#a9b9c9" stroke-width="2"/>
  <polygon points="251,137 258,148 247,146" fill="#7d91a5"/>
  <path d="M180 161 H244" fill="none" stroke="#a9b9c9" stroke-width="2"/>
  <polygon points="235,156 245,161 235,166" fill="#7d91a5"/>
  <path d="M180 230 H220 Q230 230 236 217 L253 177" fill="none" stroke="#a9b9c9" stroke-width="2"/>
  <polygon points="247,176 258,174 253,185" fill="#7d91a5"/>

  <!-- Merkez derleyici -->
  <g filter="url(#golge)">
    <rect x="244" y="92" width="154" height="138" rx="25" fill="url(#merkez)" stroke="#9dbfe2" stroke-width="1.2"/>
    <circle cx="321" cy="135" r="25" fill="#f8fcff" stroke="#91b8df" stroke-width="1.5"/>
    <path d="M309 132 H333 M309 139 H326 M314 125 H329" fill="none" stroke="#5e89b5" stroke-width="2.2" stroke-linecap="round"/>
    <text x="321" y="179" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365a7d" font-weight="700">Derleyici</text>
    <text x="321" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52728f">Mantıksal sonuç</text>
    <rect x="274" y="207" width="94" height="13" rx="6.5" fill="#9fc6b8"/>
  </g>

  <!-- Sağ sonuç -->
  <path d="M398 161 H440" fill="none" stroke="#789bbd" stroke-width="2.4"/>
  <polygon points="431,155 442,161 431,167" fill="#5d86ad"/>

  <g filter="url(#golge)">
    <rect x="442" y="86" width="164" height="112" rx="20" fill="#fffdf9" stroke="#c7ddd1" stroke-width="1.2"/>
    <rect x="462" y="106" width="124" height="27" rx="9" fill="#dff1e4"/>
    <text x="524" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#39705a" font-weight="700">Kesin tür</text>
    <text x="462" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55687a">puan  :  int</text>
    <text x="462" y="178" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55687a">sonuç : number</text>
  </g>

  <!-- Alt sözleşme ve hata -->
  <path d="M321 230 V260" fill="none" stroke="#789bbd" stroke-width="2"/>
  <polygon points="315,251 321,262 327,251" fill="#5d86ad"/>

  <g filter="url(#hafifGolge)">
    <rect x="216" y="262" width="210" height="39" rx="15" fill="#e3f2e9"/>
    <path d="M240 281 l6 6 12 -14" fill="none" stroke="#3e9471" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="330" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356953" font-weight="700">Tip sözleşmesi korunur</text>
  </g>

  <!-- Hata engeli -->
  <path d="M524 198 V230" fill="none" stroke="#d09a9a" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="518,221 524,232 530,221" fill="#c87979"/>
  <g filter="url(#hafifGolge)">
    <rect x="455" y="232" width="138" height="50" rx="15" fill="#fff0ef"/>
    <circle cx="478" cy="257" r="12" fill="#ef9b96"/>
    <path d="M473 252 L483 262 M483 252 L473 262" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="549" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#944c4c" font-weight="700">Uyumsuz atama</text>
    <text x="549" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#aa6868">erken hata</text>
  </g>
</svg>