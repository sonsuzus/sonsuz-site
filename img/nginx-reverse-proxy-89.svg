<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="nginx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f1dd"/>
      <stop offset="100%" stop-color="#bde2c5"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5ddff"/>
      <stop offset="100%" stop-color="#cdc0f4"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9edff"/>
      <stop offset="100%" stop-color="#bcdcf3"/>
    </linearGradient>
    <linearGradient id="media" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe8c9"/>
      <stop offset="100%" stop-color="#f4d0a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#52718a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52718a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="570" cy="42" r="90" fill="#dff3ea" opacity="0.52"/>
  <circle cx="72" cy="298" r="110" fill="#deecff" opacity="0.5"/>

  <text x="30" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#456276">Tek Alan Adı • Akıllı Yönlendirme</text>

  <g filter="url(#shadow)">
    <rect x="28" y="122" width="116" height="78" rx="18" fill="#ffffff"/>
    <rect x="39" y="135" width="40" height="30" rx="7" fill="#d9edff"/>
    <rect x="45" y="141" width="28" height="18" rx="3" fill="#75a9cd"/>
    <rect x="54" y="168" width="10" height="4" rx="2" fill="#75a9cd"/>
    <text x="88" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38556a">İstemci</text>
    <text x="88" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668191">Tarayıcı</text>
  </g>

  <path d="M145 155 H205" fill="none" stroke="#7193a8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="205,155 196,150 196,160" fill="#7193a8"/>
  <text x="151" y="143" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e7b8d">example.com</text>

  <g filter="url(#shadow)">
    <rect x="211" y="82" width="172" height="149" rx="23" fill="url(#nginx)" stroke="#a4d0ae" stroke-width="1.2"/>
    <rect x="231" y="101" width="132" height="38" rx="12" fill="#ffffff" opacity="0.82"/>
    <path d="M248 120 h18 M257 111 v18" stroke="#3e9360" stroke-width="3" stroke-linecap="round"/>
    <text x="277" y="123" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#286842">Nginx</text>
    <text x="239" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d7352">Reverse Proxy</text>
    <rect x="234" y="171" width="126" height="35" rx="10" fill="#eff9f0"/>
    <text x="248" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7d5d">TLS • Kurallar</text>
  </g>

  <path d="M384 116 H424 V74 H452" fill="none" stroke="#7895a6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="452,74 443,69 443,79" fill="#7895a6"/>
  <path d="M384 156 H452" fill="none" stroke="#7895a6" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="452,156 443,151 443,161" fill="#7895a6"/>
  <path d="M384 197 H424 V239 H452" fill="none" stroke="#7895a6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="452,239 443,234 443,244" fill="#7895a6"/>

  <g filter="url(#softShadow)">
