    <path d="M477 61 h19 M477 66 h19 M477 71 h12" stroke="#dff1ff" stroke-width="1.5"/>
    <text x="511" y="68" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b73">Arayüz</text>
    <text x="511" y="86" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597a90">/</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="458" y="122" width="151" height="68" rx="16" fill="url(#api)"/>
    <circle cx="486" cy="150" r="14" fill="#876fc6"/>
    <path d="M479 150 h14 M486 143 v14" stroke="#f5f1ff" stroke-width="2" stroke-linecap="round"/>
    <text x="511" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f3d80">API Havuzu</text>
    <text x="511" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#706095">/api/</text>
  </g>

  <g filter="url(#softShadow)">
