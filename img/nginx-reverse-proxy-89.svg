    <path d="M473 253 l10-13 8 8 7-10 12 15z" fill="#c98d4d"/>
    <circle cx="491" cy="232" r="4" fill="#fff3d8"/>
    <text x="511" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#785632">Dosya Servisi</text>
    <text x="511" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#987249">/uploads/</text>
  </g>

  <g opacity="0.92">
    <rect x="301" y="247" width="161" height="31" rx="15" fill="#ffffff" filter="url(#softShadow)"/>
    <circle cx="319" cy="262.5" r="5" fill="#62b77a"/>
    <text x="331" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537083">Tek giriş: 80 / 443</text>
  </g>

  <path d="M455 156 h-24" fill="none" stroke="#b3cad5" stroke-width="1.4" stroke-dasharray="3 4"/>
  <text x="395" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d798b">yol seçimi</text>
