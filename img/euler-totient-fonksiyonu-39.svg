    <circle cx="484" cy="80" r="14" fill="#93cfb7"/>
    <path d="M478 80l4 4 8-9" fill="none" stroke="#326c57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="508" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e5964">RSA</text>
    <text x="508" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#697681">Anahtar koşulu</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="458" y="195" width="144" height="70" rx="17" fill="#ffe9df"/>
    <circle cx="484" cy="220" r="14" fill="#edb08f"/>
    <text x="484" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#844d35">≡</text>
    <text x="508" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e5964">Bulmaca</text>
    <text x="508" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#697681">Modüler döngü</text>
  </g>

  <g opacity="0.85">
