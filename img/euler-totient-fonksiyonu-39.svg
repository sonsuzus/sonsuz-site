    <path d="M58 220h12M64 214v12" stroke="#654d88" stroke-width="1.8" stroke-linecap="round"/>
    <text x="88" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e5964">Eleme</text>
    <text x="88" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#697681">Asal çarpanlar</text>
  </g>

  <g filter="url(#shadow)">
