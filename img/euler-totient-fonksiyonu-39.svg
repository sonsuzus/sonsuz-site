    <circle cx="320" cy="143" r="24" fill="#ffffff" opacity="0.8"/>
    <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#286271">φ(n)</text>
    <text x="320" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356473">Aralarında asal sayım</text>
    <text x="320" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587985">φ(36) = 12</text>
  </g>

  <g filter="url(#softShadow)">
