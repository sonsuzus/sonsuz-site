  <path d="M395 190 C419 205 434 218 458 229" fill="none" stroke="#c08c71" stroke-width="2.2"/>
  <polygon points="458,229 452,220 448,229" fill="#c08c71"/>

  <g filter="url(#softShadow)">
    <rect x="38" y="55" width="143" height="70" rx="17" fill="#fff6dc"/>
    <circle cx="64" cy="80" r="14" fill="#f4ce79"/>
    <text x="64" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#74551d">n</text>
    <text x="88" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e5964">Sayı</text>
    <text x="88" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#697681">36 = 2² · 3²</text>
  </g>

  <g filter="url(#softShadow)">
