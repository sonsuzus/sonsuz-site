    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8ea7b7" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="108" fill="#dbeeff" opacity="0.34"/>
  <circle cx="320" cy="160" r="82" fill="none" stroke="#b7d8d2" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>

  <path d="M180 90 C210 102 226 117 245 130" fill="none" stroke="#759db7" stroke-width="2.2"/>
  <polygon points="245,130 235,128 240,120" fill="#759db7"/>
  <path d="M180 230 C208 215 224 203 244 190" fill="none" stroke="#9a8fbd" stroke-width="2.2"/>
  <polygon points="244,190 239,200 234,192" fill="#9a8fbd"/>

  <path d="M395 130 C418 114 434 101 458 91" fill="none" stroke="#6d9f93" stroke-width="2.2"/>
