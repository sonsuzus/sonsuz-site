<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2faef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d9f4e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="88" cy="42" r="68" fill="#dceeff" opacity="0.42"/>
  <circle cx="577" cy="280" r="92" fill="#dff4df" opacity="0.46"/>
  <path d="M22 286 C95 262 132 301 198 284 S314 262 375 282 S510 303 617 261" fill="none" stroke="#c8dfd7" stroke-width="1.5" opacity="0.65"/>

  <!-- Input cards -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="38" width="128" height="62" rx="16" fill="#fff" stroke="#d4e4ee"/>
    <circle cx="51" cy="60" r="12" fill="#dce9ff"/>
    <path d="M40 61 L45 61 L48 52 L52 70 L56 57 L61 61 L64 61" fill="none" stroke="#5c78a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="61" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29435b" font-weight="600">EEG</text>
    <text x="75" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718498">Göz artefaktı</text>

    <rect x="28" y="129" width="128" height="62" rx="16" fill="#fff" stroke="#d4e4ee"/>
    <circle cx="51" cy="151" r="12" fill="#ffe8df"/>
    <path d="M40 152 L45 152 L48 146 L51 158 L54 140 L57 156 L61 152 L65 152" fill="none" stroke="#b96758" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="152" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29435b" font-weight="600">EKG</text>
    <text x="75" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718498">Baz kayması</text>

    <rect x="28" y="220" width="128" height="62" rx="16" fill="#fff" stroke="#d4e4ee"/>
    <circle cx="51" cy="242" r="12" fill="#e6defb"/>
    <path d="M40 243 L43 239 L46 246 L49 237 L52 248 L55 238 L58 246 L61 240 L65 243" fill="none" stroke="#8065ad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="243" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29435b" font-weight="600">EMG</text>
    <text x="75" y="262" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718498">Hareket</text>
  </g>

  <!-- paths to core -->
  <g fill="none" stroke="#a5bbc6" stroke-width="2" stroke-linecap="round">
    <path d="M156 69 C178 69 181 116 207 122"/>
    <path d="M156 160 L207 160"/>
    <path d="M156 251 C178 251 181 204 207 198"/>
  </g>
  <g fill="#a5bbc6">
    <polygon points="207,122 198,117 200,127"/>
    <polygon points="207,160 198,155 198,165"/>
    <polygon points="207,198 200,193 198,203"/>
  </g>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="208" y="82" width="187" height="157" rx="24" fill="url(#core)" stroke="#bcd8d7"/>
    <text x="301.5" y="111" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315365" font-weight="700">TEMİZLEME HATTI</text>
    <line x1="237" y1="122" x2="366" y2="122" stroke="#b7d5d3"/>

    <rect x="231" y="136" width="65" height="71" rx="12" fill="#fafdff" stroke="#c9dce8"/>
    <path d="M244 169 L251 169 L254 155 L258 182 L263 159 L267 169 L282 169" fill="none" stroke="#4d86a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="263.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547184">Bant</text>

    <rect x="307" y="136" width="65" height="71" rx="12" fill="#fafdff" stroke="#c9dce8"/>
    <circle cx="339.5" cy="166" r="15" fill="none" stroke="#6c9c8c" stroke-width="2"/>
    <path d="M329 166 L350 166" stroke="#6c9c8c" stroke-width="2" stroke-linecap="round"/>
    <text x="339.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547184">Notch</text>

    <path d="M296 171 L304 171" stroke="#8da9b5" stroke-width="2"/>
    <polygon points="307,171 301,167 301,175" fill="#8da9b5"/>
  </g>

  <!-- Core to analysis -->
  <path d="M395 160 L430 160" fill="none" stroke="#8aa9a7" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="430,160 421,155 421,165" fill="#8aa9a7"/>

  <!-- validation -->
  <g filter="url(#shadow)">
    <rect x="431" y="92" width="112" height="136" rx="20" fill="#fffdf9" stroke="#dfd8c8"/>
    <text x="487" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a5141" font-weight="700">DOĞRULAMA</text>
    <line x1="453" y1="130" x2="521" y2="130" stroke="#e3dccd"/>
    <path d="M452 159 C460 159 461 151 467 151 C473 151 473 172 479 172 C485 172 486 144 492 144 C498 144 499 160 505 160 C512 160 514 154 521 154" fill="none" stroke="#ce7966" stroke-width="2" stroke-linecap="round"/>
    <path d="M452 181 C466 181 473 174 487 179 S508 186 521 174" fill="none" stroke="#6fa18c" stroke-width="2" stroke-linecap="round"/>
    <text x="487" y="209" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b7161">Ham ve temiz</text>
  </g>

  <!-- output -->
  <path d="M543 160 L568 160" fill="none" stroke="#8aa9a7" stroke-width="2.3" stroke-linecap="round"/>
  <polygon points="568,160 559,155 559,165" fill="#8aa9a7"/>
  <g filter="url(#smallShadow)">
    <rect x="569" y="123" width="48" height="74" rx="16" fill="#e3f3e8" stroke="#b9d9c4"/>
    <path d="M582 159 L588 165 L604 147" fill="none" stroke="#4c9871" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="593" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3c7658" font-weight="600">Bilgi</text>
  </g>

  <text x="302" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708896">Amaç: sinyali koru, gürültüyü azalt</text>
</svg>