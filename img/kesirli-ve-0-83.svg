<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ed"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e4ff"/>
      <stop offset="100%" stop-color="#c3d9ff"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8cc"/>
      <stop offset="100%" stop-color="#ffddb3"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1f0d1"/>
      <stop offset="100%" stop-color="#b8e6b8"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6d4f5"/>
      <stop offset="100%" stop-color="#d4b8ed"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#e8e0f5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect x="0" y="0" width="640" height="320" rx="12" fill="url(#bg)"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#3a3a5a">Sırt Çantası Problemi</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="55" width="150" height="45" rx="12" fill="url(#centerGrad)" stroke="#b8a8d8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a6a">Sırt Çantası</text>
  <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a4a7a">Kapasite: W</text>

  <!-- Sol üst: Kesirli -->
  <rect x="40" y="130" width="190" height="55" rx="10" fill="url(#boxGrad1)" stroke="#8ab0e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a7a">Kesirli Model</text>
  <text x="135" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a5a8a">0 ≤ xᵢ ≤ 1</text>
  <text x="135" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a5a8a">Bölünebilir eşyalar</text>

  <!-- Sol alt: Açgözlü -->
  <rect x="40" y="215" width="190" height="55" rx="10" fill="url(#boxGrad2)" stroke="#e8b080" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a4a20">Açgözlü Algoritma</text>
  <text x="135" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a30">Değer / Ağırlık oranı</text>
  <text x="135" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a30">O(n log n)</text>

  <!-- Sağ üst: 0-1 -->
  <rect x="410" y="130" width="190" height="55" rx="10" fill="url(#boxGrad3)" stroke="#70b870" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a6a2a">0-1 Model</text>
  <text x="505" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a7a3a">xᵢ ∈ {0, 1}</text>
  <text x="505" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a7a3a">Bölünemez eşyalar</text>

  <!-- Sağ alt: Dinamik -->
  <rect x="410" y="215" width="190" height="55" rx="10" fill="url(#boxGrad4)" stroke="#a080c8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a2a7a">Dinamik Programlama</text>
  <text x="505" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a3a8a">dp[c] = max(dp[c], dp[c-wᵢ] + vᵢ)</text>
  <text x="505" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a3a8a">O(nW)</text>

  <!-- Oklar: Merkezden sol üst -->
  <path d="M 245 80 L 235 130" stroke="#8ab0e8" stroke-width="2" fill="none"/>
  <polygon points="233,130 238,118 228,118" fill="#8ab0e8"/>

  <!-- Oklar: Merkezden sağ üst -->
  <path d="M 395 80 L 405 130" stroke="#70b870" stroke-width="2" fill="none"/>
  <polygon points="407,130 412,118 402,118" fill="#70b870"/>

  <!-- Oklar: Sol üstten sol alta -->
  <path d="M 135 185 L 135 215" stroke="#e8b080" stroke-width="2" fill="none"/>
  <polygon points="135,215 140,205 130,205" fill="#e8b080"/>

  <!-- Oklar: Sağ üstten sağ alta -->
  <path d="M 505 185 L 505 215" stroke="#a080c8" stroke-width="2" fill="none"/>
  <polygon points="505,215 510,205 500,205" fill="#a080c8"/>

  <!-- Alt not -->
  <rect x="180" y="290" width="280" height="25" rx="8" fill="#ffffff80" stroke="#c0c0d0" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="320" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a4a6a">Açgözlü seçim özelliği: Kesirli modelde geçerli, 0-1 modelde değil</text>
</svg>