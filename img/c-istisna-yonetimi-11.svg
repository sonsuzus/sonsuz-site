<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="tryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c7ddf7"/>
    </linearGradient>
    <linearGradient id="catchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0d9"/>
      <stop offset="100%" stop-color="#f8d9aa"/>
    </linearGradient>
    <linearGradient id="finalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff3e5"/>
      <stop offset="100%" stop-color="#bee5ca"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9dce1"/>
      <stop offset="100%" stop-color="#efbac5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6c8294" flood-opacity="0.2"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6c8294" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="55" r="50" fill="#d7edfb" opacity="0.45"/>
  <circle cx="581" cy="270" r="67" fill="#ddefcf" opacity="0.38"/>
  <path d="M26 275 C130 233 149 290 246 264 S418 224 614 275" fill="none" stroke="#c8e1d5" stroke-width="2" opacity="0.55"/>

  <text x="30" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39546b">C# İSTİSNA YÖNETİMİ</text>
  <text x="30" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718495">Kontrollü hata akışı</text>

  <!-- Riskli işlem -->
  <g filter="url(#shadow)">
    <rect x="40" y="106" width="148" height="92" rx="18" fill="url(#tryGrad)" stroke="#a6c5e5"/>
    <rect x="54" y="120" width="37" height="37" rx="11" fill="#ffffff" opacity="0.72"/>
    <path d="M66 130 L78 130 M72 124 L72 143 M66 143 L78 143" fill="none" stroke="#4b7ca8" stroke-width="2" stroke-linecap="round"/>
    <text x="103" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365c7b">try</text>
    <text x="103" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58758d">Riskli işlem</text>
    <rect x="55" y="169" width="116" height="16" rx="8" fill="#ffffff" opacity="0.52"/>
    <text x="67" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557088">Dosya oku</text>
  </g>

  <!-- başarılı yol -->
  <path d="M188 152 L232 152" fill="none" stroke="#6fa77e" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="232,152 223,147 223,157" fill="#6fa77e"/>
  <g filter="url(#softShadow)">
    <rect x="241" y="126" width="112" height="52" rx="15" fill="url(#finalGrad)" stroke="#9aceaa"/>
    <circle cx="267" cy="152" r="13" fill="#ffffff" opacity="0.75"/>
    <path d="M261 152 L265 156 L273 147" fill="none" stroke="#4d9a67" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="288" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36714c">Başarılı</text>
    <text x="288" y="165" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56836a">Devam et</text>
  </g>

  <!-- hata dallanması -->
  <path d="M114 198 L114 232 L255 232" fill="none" stroke="#d18a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="255,232 246,227 246,237" fill="#d18a72"/>
  <text x="129" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#aa6756">İstisna</text>

  <!-- catch column -->
  <g filter="url(#shadow)">
    <rect x="265" y="194" width="150" height="95" rx="18" fill="url(#catchGrad)" stroke="#e7bd7c"/>
    <rect x="280" y="208" width="37" height="37" rx="11" fill="#ffffff" opacity="0.72"/>
    <path d="M292 217 L304 217 M298 211 L298 230 M292 230 L304 230" fill="none" stroke="#b37432" stroke-width="2" stroke-linecap="round"/>
    <text x="328" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#936027">catch</text>
    <text x="328" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#876d4c">Türüne göre yakala</text>
    <rect x="280" y="255" width="119" height="19" rx="9" fill="#ffffff" opacity="0.52"/>
    <text x="291" y="269" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#836b4d">Özelden genele</text>
  </g>

  <!-- Catch variants -->
  <path d="M415 218 L441 218" fill="none" stroke="#c98c4d" stroke-width="2" stroke-linecap="round"/>
  <polygon points="441,218 433,213 433,223" fill="#c98c4d"/>
  <path d="M415 260 L441 260" fill="none" stroke="#c98c4d" stroke-width="2" stroke-linecap="round"/>
  <polygon points="441,260 433,255 433,265" fill="#c98c4d"/>

  <g filter="url(#softShadow)">
    <rect x="450" y="193" width="153" height="49" rx="14" fill="#fff8ed" stroke="#edc991"/>
    <circle cx="470" cy="217" r="10" fill="#f7d39c"/>
    <path d="M470 211 L470 219 M470 223 L470 224" stroke="#8f6028" stroke-width="2" stroke-linecap="round"/>
    <text x="488" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#875b27">Dosya bulunamadı</text>
    <text x="488" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7955">Hedefli tepki</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="450" y="251" width="153" height="49" rx="14" fill="#fff3f4" stroke="#e7b2bd"/>
    <circle cx="470" cy="275" r="10" fill="#efc0c9"/>
    <path d="M466 271 L474 279 M474 271 L466 279" stroke="#a65668" stroke-width="1.8" stroke-linecap="round"/>
    <text x="488" y="274" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#965062">Özel istisna</text>
    <text x="488" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7180">Bağlam bilgisi</text>
  </g>

  <!-- finally -->
  <path d="M353 178 L353 185" fill="none" stroke="#699c79" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="353,194 348,185 358,185" fill="#699c79"/>
  <g filter="url(#shadow)">
    <rect x="400" y="84" width="180" height="75" rx="18" fill="url(#finalGrad)" stroke="#9bceaa"/>
    <circle cx="427" cy="121" r="17" fill="#ffffff" opacity="0.72"/>
    <path d="M420 121 L425 126 L435 115" fill="none" stroke="#4c9865" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="456" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39724d">finally</text>
    <text x="456" y="131" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557c63">Kaynak temizliği</text>
    <text x="456" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#638b70">Her durumda çalışır</text>
  </g>

  <!-- finally connector indicates common flow -->
  <path d="M353 126 L353 104 L400 104" fill="none" stroke="#699c79" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="400,104 391,99 391,109" fill="#699c79"/>

  <!-- bottom log -->
  <g filter="url(#softShadow)">
    <rect x="42" y="254" width="166" height="42" rx="14" fill="#ece9fa" stroke="#c8bee6"/>
    <path d="M62 266 L62 284 M67 266 L67 284 M72 266 L72 284" stroke="#7867aa" stroke-width="2" stroke-linecap="round"/>
    <text x="87" y="272" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#62518d">Günlük kaydı</text>
    <text x="87" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#786d99">Görünür hata</text>
  </g>
  <path d="M208 275 L255 275" fill="none" stroke="#8474ad" stroke-width="2" stroke-linecap="round"/>
  <polygon points="255,275 246,270 246,280" fill="#8474ad"/>
</svg>