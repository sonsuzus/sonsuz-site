<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Netfilter Kedi Çevirme Mimarisi</text>

  <!-- Katman 1: Kernel -->
  <rect x="30" y="50" width="180" height="230" rx="12" fill="#e8f4f8" stroke="#b8d4e3" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">KERNEL</text>

  <!-- Netfilter Hook -->
  <rect x="50" y="90" width="140" height="45" rx="8" fill="#d4eaf7" stroke="#85c1e9" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="120" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">Netfilter Hook</text>
  <text x="120" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5d6d7e">NF_INET_LOCAL_OUT</text>

  <!-- TCP Port Kontrol -->
  <rect x="50" y="150" width="140" height="45" rx="8" fill="#d4eaf7" stroke="#85c1e9" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="120" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">TCP Port 80</text>
  <text x="120" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5d6d7e">skb-&gt;mark = 0xC47</text>

  <!-- NFQUEUE -->
  <rect x="50" y="210" width="140" height="45" rx="8" fill="#d4eaf7" stroke="#85c1e9" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="120" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">NFQUEUE</text>
  <text x="120" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5d6d7e">Kullanıcı alanına ilet</text>

  <!-- Ok: Kernel -> Kullanıcı -->
  <path d="M 190 232 L 235 232" stroke="#5dade2" stroke-width="2" fill="none"/>
  <polygon points="235,232 225,227 225,237" fill="#5dade2"/>

  <!-- Katman 2: Kullanıcı Alanı -->
  <rect x="240" y="50" width="180" height="230" rx="12" fill="#fef9e7" stroke="#f0d9a0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#b7950b">KULLANICI ALANI</text>

  <!-- HTTP Proxy -->
  <rect x="260" y="90" width="140" height="45" rx="8" fill="#fdebd0" stroke="#f5b041" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="330" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7e5109">HTTP Proxy</text>
  <text x="330" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9c640c">Port 8080</text>

  <!-- Kedi Tespiti -->
  <rect x="260" y="150" width="140" height="45" rx="8" fill="#fdebd0" stroke="#f5b041" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="330" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7e5109">Kedi Tespiti</text>
  <text x="330" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9c640c">URL + Content-Type</text>

  <!-- Görsel İşleme -->
  <rect x="260" y="210" width="140" height="45" rx="8" fill="#fdebd0" stroke="#f5b041" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="330" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7e5109">Pillow ile Çevir</text>
  <text x="330" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9c640c">FLIP_TOP_BOTTOM</text>

  <!-- Ok: Kullanıcı -> Tarayıcı -->
  <path d="M 420 232 L 465 232" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="465,232 455,227 455,237" fill="#27ae60"/>

  <!-- Katman 3: Tarayıcı -->
  <rect x="470" y="50" width="150" height="230" rx="12" fill="#eafaf1" stroke="#a9dfbf" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="545" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e8449">TARAYICI</text>

  <!-- İstek -->
  <rect x="490" y="90" width="110" height="45" rx="8" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="545" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#145a32">GET /cat.jpg</text>
  <text x="545" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e8449">HTTP İsteği</text>

  <!-- Yanıt -->
  <rect x="490" y="150" width="110" height="45" rx="8" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="545" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#145a32">200 OK</text>
  <text x="545" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e8449">Ters Görsel</text>

  <!-- Ters Görsel -->
  <rect x="490" y="210" width="110" height="45" rx="8" fill="#d5f5e3" stroke="#82e0aa" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="545" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#145a32">Kedi Ters</text>
  <text x="545" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e8449">Sihirli Etki</text>

  <!-- Döngü okları -->
  <path d="M 545 50 L 545 40 L 120 40 L 120 50" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <polygon points="120,50 115,42 125,42" fill="#7f8c8d"/>

  <path d="M 120 255 L 120 270 L 545 270 L 545 255" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <polygon points="545,255 540,263 550,263" fill="#7f8c8d"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#95a5a6">Yalnızca düz HTTP - HTTPS şifreli olduğu için kapsam dışı</text>
</svg>