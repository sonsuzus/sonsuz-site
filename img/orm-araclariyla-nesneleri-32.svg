  <text x="77" y="86" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315c64">Nesne Modeli</text>

  <g filter="url(#smallShadow)">
    <rect x="53" y="113" width="136" height="38" rx="9" fill="#e9f7f6"/>
