  <path d="M368 260 H383" stroke="#8da5ae" stroke-width="1.7"/>
  <polygon points="383,260 377,256 377,264" fill="#8da5ae"/>

  <rect x="386" y="247" width="89" height="27" rx="8" fill="#e7e3fb"/>
  <text x="430" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#60569a">INSERT</text>
  <path d="M477 260 H492" stroke="#8da5ae" stroke-width="1.7"/>
  <polygon points="492,260 486,256 486,264" fill="#8da5ae"/>

  <text x="516" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#54734f">Satır</text>

  <!-- ilişki çizgisi -->
  <path d="M120 213 C172 225 200 225 249 204" fill="none" stroke="#8bc4c1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="173" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8d8a">1 → N ilişki</text>
