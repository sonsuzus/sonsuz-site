  <text x="480" y="86" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#566e37">İlişkisel Veri</text>

  <g filter="url(#smallShadow)">
    <rect x="453" y="113" width="134" height="35" rx="8" fill="#f5faec"/>
    <rect x="453" y="157" width="134" height="35" rx="8" fill="#f5faec"/>
  </g>
  <text x="465" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#607a3d">users</text>
  <text x="465" y="142" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#788966">id | name | email</text>
  <text x="465" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#607a3d">orders</text>
  <text x="465" y="186" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#788966">id | user_id | tutar</text>

