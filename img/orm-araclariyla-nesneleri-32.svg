  <g filter="url(#shadow)">
    <rect x="89" y="237" width="462" height="57" rx="16" fill="#ffffff" stroke="#d4e2e8"/>
  </g>
  <text x="112" y="259" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526879">Nesne işlemi</text>

  <rect x="206" y="247" width="70" height="27" rx="8" fill="#d9f1e5"/>
  <text x="241" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d7659">Kaydet</text>
  <path d="M278 260 H293" stroke="#8da5ae" stroke-width="1.7"/>
  <polygon points="293,260 287,256 287,264" fill="#8da5ae"/>

