<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="ormGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9d4ff"/>
      <stop offset="100%" stop-color="#c6e5fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66809a" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#66809a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="62" cy="34" r="50" fill="#dff2f1" opacity="0.58"/>
  <circle cx="584" cy="283" r="76" fill="#e4e3fb" opacity="0.55"/>
  <path d="M25 261 C135 226 184 272 281 248 S491 205 616 236" fill="none" stroke="#bedee2" stroke-width="1.5" opacity="0.65"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40556b">Nesne Dünyası ile Veritabanı Arasında ORM</text>

  <!-- Sol nesne dünyası -->
  <g filter="url(#shadow)">
    <rect x="38" y="65" width="166" height="143" rx="18" fill="#fdfefe" stroke="#b8dce0"/>
