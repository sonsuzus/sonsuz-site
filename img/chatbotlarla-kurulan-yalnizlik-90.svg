<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#c5e3f6"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb8b8"/>
      <stop offset="100%" stop-color="#ffd3b6"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5ead7"/>
      <stop offset="100%" stop-color="#c7f0db"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#ffb8b8"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Dijital Sohbet ve Yalnızlık İlişkisi</text>

  <!-- Merkez: Yalnızlık -->
  <rect x="245" y="120" width="150" height="60" rx="14" fill="url(#centerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="146" text-anchor="middle" font-weight="bold" fill="#1a5c3a">Yalnızlık</text>
  <text x="320" y="164" text-anchor="middle" fill="#2d6a4f" font-size="11">L = max(0, Ba - Bd)</text>

  <!-- Sol: Chatbot -->
  <rect x="40" y="100" width="140" height="100" rx="14" fill="url(#chatGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="110" y="126" text-anchor="middle" font-weight="bold" fill="#1a5276">Chatbot</text>
  <line x1="70" y1="138" x2="150" y2="138" stroke="#1a5276" stroke-width="0.8" opacity="0.4"/>
  <text x="110" y="154" text-anchor="middle" fill="#1a5276" font-size="11">7/24 erişilebilir</text>
  <text x="110" y="170" text-anchor="middle" fill="#1a5276" font-size="11">Yargılanma yok</text>
  <text x="110" y="186" text-anchor="middle" fill="#1a5276" font-size="11">Empati simülasyonu</text>

  <!-- Sağ: İnsan İlişkisi -->
  <rect x="460" y="100" width="140" height="100" rx="14" fill="url(#humanGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="530" y="126" text-anchor="middle" font-weight="bold" fill="#7b241c">İnsan İlişkisi</text>
  <line x1="490" y1="138" x2="570" y2="138" stroke="#7b241c" stroke-width="0.8" opacity="0.4"/>
  <text x="530" y="154" text-anchor="middle" fill="#7b241c" font-size="11">Karşılıklılık</text>
  <text x="530" y="170" text-anchor="middle" fill="#7b241c" font-size="11">Belirsizlik</text>
  <text x="530" y="186" text-anchor="middle" fill="#7b241c" font-size="11">Fiziksel ortaklık</text>

  <!-- Chatbot'tan Yalnızlığa ok -->
  <path d="M180 140 L235 140" stroke="#5dade2" stroke-width="2.5" fill="none"/>
  <polygon points="238,140 228,135 228,145" fill="#5dade2"/>

  <!-- İnsandan Yalnızlığa ok -->
  <path d="M460 140 L405 140" stroke="#e74c3c" stroke-width="2.5" fill="none"/>
  <polygon points="402,140 412,135 412,145" fill="#e74c3c"/>

  <!-- Alt sol: Kaçınma döngüsü -->
  <rect x="40" y="240" width="140" height="55" rx="12" fill="#f9e79f" filter="url(#shadow)" opacity="0.9"/>
  <text x="110" y="262" text-anchor="middle" font-weight="bold" fill="#7d6608">Kaçınma Amaçlı</text>
  <text x="110" y="278" text-anchor="middle" fill="#7d6608" font-size="11">Kullanım (C)</text>

  <!-- Alt sağ: Sosyal temas -->
  <rect x="460" y="240" width="140" height="55" rx="12" fill="#a9dfbf" filter="url(#shadow)" opacity="0.9"/>
  <text x="530" y="262" text-anchor="middle" font-weight="bold" fill="#145a32">Sağlıklı Sosyal</text>
  <text x="530" y="278" text-anchor="middle" fill="#145a32" font-size="11">Temas (S)</text>

  <!-- Alt merkez: Model -->
  <rect x="245" y="245" width="150" height="45" rx="12" fill="#d5dbdb" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="264" text-anchor="middle" font-weight="bold" fill="#2c3e50">İzolasyon Modeli</text>
  <text x="320" y="280" text-anchor="middle" fill="#2c3e50" font-size="11">I(t+1) = I + kC - hS</text>

  <!-- Kaçınma ok -->
  <path d="M110 240 L110 205" stroke="#f1c40f" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="110,200 105,210 115,210" fill="#f1c40f"/>

  <!-- Sosyal temas ok -->
  <path d="M530 240 L530 205" stroke="#27ae60" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="530,200 525,210 535,210" fill="#27ae60"/>

  <!-- Kaçınma modele ok -->
  <path d="M180 267 L235 267" stroke="#f1c40f" stroke-width="2" fill="none"/>
  <polygon points="238,267 228,262 228,272" fill="#f1c40f"/>

  <!-- Sosyal modele ok -->
  <path d="M460 267 L405 267" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="402,267 412,262 412,272" fill="#27ae60"/>

  <!-- Köprü etiketi -->
  <rect x="270" y="70" width="100" height="28" rx="10" fill="#f0f3f5" filter="url(#shadow)" opacity="0.85"/>
  <text x="320" y="88" text-anchor="middle" fill="#5d6d7e" font-size="11" font-weight="bold">Köprü mü?</text>

  <!-- Köprü oku -->
  <path d="M320 98 L320 115" stroke="#5d6d7e" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <polygon points="320,118 315,108 325,108" fill="#5d6d7e"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" fill="#7f8c8d" font-size="10" opacity="0.8">Kavramsal model: Dijital sohbet köprü mü, varış noktası mı?</text>
</svg>