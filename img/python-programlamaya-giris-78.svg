<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Python Fonksiyonlar</text>

  <!-- Merkez fonksiyon kutusu -->
  <rect x="245" y="55" width="150" height="50" rx="12" fill="#e8f4f8" stroke="#5dade2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">def fonksiyon</text>
  <text x="320" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">parametreler</text>

  <!-- Girdi oku -->
  <path d="M 120 80 L 235 80" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="235,74 245,80 235,86" fill="#7f8c8d"/>

  <!-- Girdi kutusu -->
  <rect x="30" y="60" width="90" height="40" rx="10" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="75" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Girdi</text>
  <text x="75" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7d6608">argümanlar</text>

  <!-- Çıktı oku -->
  <path d="M 395 80 L 510 80" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="510,74 520,80 510,86" fill="#7f8c8d"/>

  <!-- Çıktı kutusu -->
  <rect x="520" y="60" width="90" height="40" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="565" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e8449">Çıktı</text>
  <text x="565" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e8449">return</text>

  <!-- Alt bileşenler -->
  <!-- Kütüphane -->
  <rect x="30" y="150" width="130" height="45" rx="10" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="95" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">Kütüphane</text>
  <text x="95" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c3483">import math</text>

  <!-- İsim alanı -->
  <rect x="200" y="150" width="130" height="45" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="265" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#a04000">İsim Alanı</text>
  <text x="265" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#a04000">math.pi</text>

  <!-- Yerel değişken -->
  <rect x="370" y="150" width="130" height="45" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="435" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#154360">Yerel Değişken</text>
  <text x="435" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#154360">global</text>

  <!-- Belgeleme -->
  <rect x="540" y="150" width="80" height="45" rx="10" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="580" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#922b21">Docstring</text>
  <text x="580" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#922b21">"""..."""</text>

  <!-- Bağlantı çizgileri -->
  <path d="M 95 105 L 95 140" stroke="#8e44ad" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 265 105 L 265 140" stroke="#e67e22" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 435 105 L 435 140" stroke="#2980b9" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M 580 105 L 580 140" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

  <!-- Alt bilgi -->
  <text x="320" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">Fonksiyonlar: kara kutu yaklaşımı</text>

  <!-- Fonksiyon fabrikası -->
  <rect x="100" y="250" width="180" height="40" rx="10" fill="#d5f5e3" stroke="#1abc9c" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="190" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#0e6655">Fonksiyon Fabrikası</text>
  <text x="190" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#0e6655">fonksiyon döndürür</text>

  <!-- Fonksiyon alan fonksiyon -->
  <rect x="360" y="250" width="180" height="40" rx="10" fill="#f9e79f" stroke="#f1c40f" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="450" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#7d6608">Fonksiyon Alan</text>
  <text x="450" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7d6608">parametre olarak</text>

  <!-- Oklar -->
  <path d="M 280 250 L 350 250" stroke="#7f8c8d" stroke-width="1.5" fill="none"/>
  <polygon points="350,245 358,250 350,255" fill="#7f8c8d"/>
</svg>