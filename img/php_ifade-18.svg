<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f3f8ef;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">PHP İfade Yapısı</text>

  <!-- Ana formül kutusu -->
  <rect x="140" y="52" width="360" height="44" rx="10" fill="#e8f4fd" stroke="#5b9bd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#2c3e50" font-weight="bold">ifade = veriler + işlemciler</text>

  <!-- Sol bileşen: Veriler -->
  <rect x="40" y="130" width="160" height="100" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">VERİLER</text>
  <line x1="60" y1="168" x2="180" y2="168" stroke="#82b366" stroke-width="1" opacity="0.5"/>
  <text x="120" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d5a2e">Değişkenler</text>
  <text x="120" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d5a2e">Sabitler</text>

  <!-- Sağ bileşen: İşlemciler -->
  <rect x="440" y="130" width="160" height="100" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">İŞLEMCİLER</text>
  <line x1="460" y1="168" x2="580" y2="168" stroke="#b85450" stroke-width="1" opacity="0.5"/>
  <text x="520" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a2e2a">+ - * /</text>
  <text x="520" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a2e2a">= . vb.</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol ok -->
  <line x1="200" y1="180" x2="268" y2="180" stroke="#82b366" stroke-width="2"/>
  <polygon points="268,174 280,180 268,186" fill="#82b366"/>

  <!-- Sağ ok -->
  <line x1="440" y1="180" x2="372" y2="180" stroke="#b85450" stroke-width="2"/>
  <polygon points="372,174 360,180 372,186" fill="#b85450"/>

  <!-- Alt örnek bölümü -->
  <rect x="140" y="260" width="360" height="44" rx="10" fill="#fff3cc" stroke="#d6b656" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50">Örnek: $deg03 = $deg02 + 4;</text>
  <text x="320" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6a2e">Sonuç: 25 25 29 17</text>

  <!-- Bağlantı çizgileri -->
  <line x1="320" y1="96" x2="320" y2="130" stroke="#5b9bd5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="314,130 320,140 326,130" fill="#5b9bd5"/>

  <line x1="320" y1="230" x2="320" y2="260" stroke="#d6b656" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="314,260 320,250 326,260" fill="#d6b656"/>
</svg>