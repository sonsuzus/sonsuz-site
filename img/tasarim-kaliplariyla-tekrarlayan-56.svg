<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#d9f5e7"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#64748b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="320" cy="160" r="136" fill="#dbeafe" opacity="0.22"/>
  <circle cx="320" cy="160" r="106" fill="#ffffff" opacity="0.46"/>

  <!-- Bağlantılar -->
  <path d="M254 139 C227 121,210 108,181 94" fill="none" stroke="#93a9c9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="181,94 190,94 185,102" fill="#93a9c9"/>

  <path d="M386 139 C414 121,431 108,460 94" fill="none" stroke="#93a9c9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="460,94 451,94 456,102" fill="#93a9c9"/>

  <path d="M320 204 C320 221,320 235,320 251" fill="none" stroke="#93a9c9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320,251 315,242 325,242" fill="#93a9c9"/>

  <!-- Singleton -->
  <g filter="url(#golge)">
    <rect x="44" y="42" width="148" height="91" rx="18" fill="#fff4df"/>
    <rect x="57" y="55" width="35" height="35" rx="11" fill="#f8c979"/>
    <circle cx="74.5" cy="67" r="7" fill="#ffffff"/>
    <path d="M65 78 C68 71,81 71,84 78" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="104" y="70" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80520a">Singleton</text>
    <text x="104" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7280">Tek ortak örnek</text>
    <rect x="58" y="104" width="120" height="13" rx="6.5" fill="#f6d99e"/>
    <circle cx="68" cy="110.5" r="3" fill="#c98b24"/>
    <path d="M78 110.5 H163" stroke="#bd8530" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Factory -->
  <g filter="url(#golge)">
    <rect x="448" y="42" width="148" height="91" rx="18" fill="#eee9ff"/>
    <rect x="461" y="55" width="35" height="35" rx="11" fill="#b6a1eb"/>
    <path d="M469 77 V69 H474 V63 H483 V69 H488 V77 Z" fill="#ffffff"/>
    <path d="M467 78 H490" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="508" y="70" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c4794">Factory</text>
    <text x="508" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7280">Üretim kararı</text>
    <rect x="462" y="104" width="120" height="13" rx="6.5" fill="#d9cff6"/>
    <rect x="470" y="107" width="13" height="7" rx="2" fill="#8266c2"/>
    <rect x="490" y="107" width="13" height="7" rx="2" fill="#9b83d3"/>
    <rect x="510" y="107" width="13" height="7" rx="2" fill="#b19ce1"/>
    <path d="M532 110.5 H570" stroke="#8b73c7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Merkez -->
  <g filter="url(#golge)">
    <rect x="239" y="113" width="162" height="94" rx="25" fill="url(#merkez)" stroke="#c5ddec" stroke-width="1.2"/>
    <circle cx="320" cy="142" r="19" fill="#ffffff" opacity="0.88"/>
    <path d="M311 143 H329 M320 134 V152" stroke="#4f83a6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="320" cy="143" r="5" fill="#77a8c7"/>
    <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d76">Bağımlılık Yönetimi</text>
    <text x="320" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587284">Değişimin etkisini daralt</text>
  </g>

  <!-- Observer -->
  <g filter="url(#golge)">
    <rect x="206" y="250" width="228" height="56" rx="18" fill="#e1f5ee"/>
    <rect x="219" y="261" width="34" height="34" rx="10" fill="#82cdb5"/>
    <circle cx="236" cy="272" r="5" fill="#ffffff"/>
    <circle cx="228" cy="284" r="4" fill="#ffffff"/>
    <circle cx="244" cy="284" r="4" fill="#ffffff"/>
    <path d="M236 277 V280 M232 282 L230 283 M240 282 L242 283" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="266" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#28735e">Observer</text>
    <text x="266" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7970">Bir yayıncı → çok abone</text>
    <circle cx="403" cy="278" r="5" fill="#5bb89b"/>
    <circle cx="418" cy="278" r="5" fill="#8bd2bc"/>
  </g>

  <!-- Alt notlar -->
  <g filter="url(#hafifGolge)">
    <rect x="46" y="241" width="127" height="38" rx="14" fill="#ffffff" opacity="0.9"/>
    <text x="109.5" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60758a">Kontrollü erişim</text>
    <rect x="467" y="241" width="127" height="38" rx="14" fill="#ffffff" opacity="0.9"/>
    <text x="530.5" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60758a">Gevşek bağlılık</text>
  </g>
</svg>