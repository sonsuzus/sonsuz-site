<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2faef"/>
    </linearGradient>
    <linearGradient id="rabbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6dcdf"/>
      <stop offset="100%" stop-color="#fbecee"/>
    </linearGradient>
    <linearGradient id="kafka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecf9"/>
      <stop offset="100%" stop-color="#e9e2f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#70869b" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#718599" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="57" cy="52" r="76" fill="#dff1ee" opacity="0.48"/>
  <circle cx="590" cy="272" r="92" fill="#e9e1f8" opacity="0.42"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34495d">Mesajlaşma Sistemleri</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718094">Görev dağıtımı ve olay akışı</text>

  <g filter="url(#shadow)">
    <rect x="24" y="70" width="270" height="214" rx="20" fill="url(#rabbit)" stroke="#e4b9c0"/>
    <rect x="346" y="70" width="270" height="214" rx="20" fill="url(#kafka)" stroke="#bfcfec"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="54" y="84" width="116" height="28" rx="14" fill="#c96d78"/>
    <text x="112" y="103" text-anchor="middle" font-weight="700" fill="#ffffff">RabbitMQ</text>
    <text x="55" y="130" fill="#83515a" font-weight="700">Görev odaklı kuyruk</text>

    <rect x="378" y="84" width="94" height="28" rx="14" fill="#697db7"/>
    <text x="425" y="103" text-anchor="middle" font-weight="700" fill="#ffffff">Kafka</text>
    <text x="378" y="130" fill="#53678f" font-weight="700">Olay odaklı günlük</text>
  </g>

  <g filter="url(#soft)" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="43" y="151" width="54" height="43" rx="11" fill="#ffffff"/>
    <text x="70" y="177" text-anchor="middle" fill="#5a6270">Üretici</text>

    <rect x="126" y="151" width="62" height="43" rx="11" fill="#fff8f8"/>
    <text x="157" y="169" text-anchor="middle" fill="#8d5360">Exchange</text>
    <text x="157" y="184" text-anchor="middle" fill="#8d5360">Yönlendirme</text>

    <rect x="215" y="143" width="57" height="24" rx="8" fill="#ffffff"/>
    <rect x="215" y="177" width="57" height="24" rx="8" fill="#ffffff"/>
