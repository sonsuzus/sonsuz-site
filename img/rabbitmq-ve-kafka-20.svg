    <line x1="461" y1="170" x2="529" y2="170" stroke="#9fadd1" stroke-width="3" stroke-linecap="round"/>
    <line x1="461" y1="180" x2="529" y2="180" stroke="#9fadd1" stroke-width="3" stroke-linecap="round"/>
    <line x1="461" y1="190" x2="529" y2="190" stroke="#9fadd1" stroke-width="3" stroke-linecap="round"/>

    <path d="M543 157 L559 151" stroke="#677eb6" stroke-width="2" stroke-linecap="round"/>
    <path d="M543 187 L559 193" stroke="#677eb6" stroke-width="2" stroke-linecap="round"/>
    <polygon points="565,149 557,148 560,155" fill="#677eb6"/>
    <polygon points="565,195 560,189 557,196" fill="#677eb6"/>

    <rect x="565" y="137" width="37" height="29" rx="8" fill="#fdfdff"/>
    <rect x="565" y="180" width="37" height="29" rx="8" fill="#fdfdff"/>
    <text x="583.5" y="156" text-anchor="middle" fill="#5b6d94">Grup</text>
    <text x="583.5" y="199" text-anchor="middle" fill="#5b6d94">Grup</text>

    <rect x="374" y="221" width="214" height="39" rx="12" fill="#ffffff" opacity="0.86"/>
    <text x="481" y="238" text-anchor="middle" fill="#56698f">Olay geçmişi saklanır</text>
    <text x="481" y="253" text-anchor="middle" fill="#56698f">Her grup kendi ofsetiyle okur</text>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="272" y="137" width="96" height="43" rx="15" fill="#ffffff" filter="url(#soft)"/>
    <text x="320" y="155" text-anchor="middle" font-weight="700" fill="#4b6170">Doğru seçim</text>
    <text x="320" y="170" text-anchor="middle" fill="#667c88">ihtiyaca göre</text>

    <path d="M295 190 L280 207" stroke="#98a7ae" stroke-width="2" stroke-linecap="round"/>
    <polygon points="276,212 278,203 284,209" fill="#98a7ae"/>
    <path d="M345 190 L360 207" stroke="#98a7ae" stroke-width="2" stroke-linecap="round"/>
    <polygon points="364,212 356,209 362,203" fill="#98a7ae"/>
