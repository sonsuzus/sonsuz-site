    <text x="243.5" y="193" text-anchor="middle" fill="#5a6270">Kuyruk</text>

    <path d="M98 172 L120 172" stroke="#bf707b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="126,172 118,167 118,177" fill="#bf707b"/>
    <path d="M189 172 L207 156" stroke="#bf707b" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="213,151 204,153 210,159" fill="#bf707b"/>
    <path d="M189 174 L207 187" stroke="#bf707b" stroke-width="2.5" stroke-linecap="round"/>
