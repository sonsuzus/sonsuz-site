  <text x="310" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66547f">diff --staged</text>

  <g filter="url(#shadow)">
    <rect x="437" y="88" width="169" height="115" rx="18" fill="url(#repo)" stroke="#aad7b9"/>
  </g>
  <rect x="453" y="105" width="33" height="30" rx="8" fill="#ffffff" opacity="0.82"/>
  <ellipse cx="469.5" cy="113" rx="9" ry="4" fill="none" stroke="#4f8c66" stroke-width="1.7"/>
  <path d="M460.5 113 L460.5 126 C460.5 131 478.5 131 478.5 126 L478.5 113 M460.5 120 C460.5 125 478.5 125 478.5 120" fill="none" stroke="#4f8c66" stroke-width="1.7"/>
  <text x="500" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39694d">Yerel Depo</text>
  <text x="500" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b8069">Kalıcı tarihçe</text>
  <rect x="453" y="159" width="137" height="26" rx="9" fill="#ffffff" opacity="0.72"/>
  <text x="521.5" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#477558">git log</text>

  <path d="M521 218 L521 232 L449 232" fill="none" stroke="#719782" stroke-width="2" stroke-linecap="round"/>
  <polygon points="449,232 459,226 459,238" fill="#719782"/>
  <text x="500" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597863">önceki kayıt</text>

  <g filter="url(#soft)">
    <rect x="279" y="239" width="170" height="58" rx="16" fill="#ffffff" stroke="#c7dccd"/>
  </g>
  <circle cx="303" cy="268" r="15" fill="#c8ead3"/>
  <path d="M297 268 L301 272 L309 263" fill="none" stroke="#43815a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="325" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f644d">Commit Fotoğrafı</text>
  <text x="325" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668071">Mesaj · Yazar · Tarih</text>

  <path d="M279 268 L241 268 L241 214" fill="none" stroke="#8ba7b5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="241,214 235,224 247,224" fill="#8ba7b5"/>
  <text x="225" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66818c">anlamlı kapsam</text>

  <path d="M449 268 L487 268 L487 214" fill="none" stroke="#8ba7b5" stroke-width="2" stroke-linecap="round"/>
  <polygon points="487,214 481,224 493,224" fill="#8ba7b5"/>
  <text x="510" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66818c">kimlik ve bağ</text>
</svg>