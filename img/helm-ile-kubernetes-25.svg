<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="helmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9d8ff"/>
      <stop offset="100%" stop-color="#d2c6ff"/>
    </linearGradient>
    <linearGradient id="clusterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f0d9"/>
      <stop offset="100%" stop-color="#bde4f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6d8497" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#607789" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="77" cy="50" r="70" fill="#cce9f5" opacity="0.30"/>
  <circle cx="578" cy="284" r="88" fill="#d7edbf" opacity="0.28"/>
  <path d="M28 279 C144 245 170 285 266 261 S424 230 610 272" fill="none" stroke="#b4d7c6" stroke-width="2" opacity="0.35"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566b">Helm ile Paket Akışı</text>
  <text x="32" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718394">Tek şablon, ortama özel değerler</text>

  <!-- Sol: Chart -->
  <g filter="url(#shadow)">
    <rect x="32" y="82" width="145" height="163" rx="18" fill="#ffffff"/>
    <rect x="32" y="82" width="145" height="39" rx="18" fill="url(#helmGrad)"/>
    <rect x="32" y="104" width="145" height="17" fill="url(#helmGrad)"/>
  </g>
  <path d="M53 96 h12 l4 4 v11 h-16 z" fill="#ffffff" opacity="0.95"/>
  <path d="M65 96 v5 h5" fill="none" stroke="#91a5d4" stroke-width="1.5"/>
  <text x="79" y="106" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#354c65">Chart</text>

  <g filter="url(#soft)">
    <rect x="47" y="136" width="115" height="26" rx="8" fill="#edf5ff"/>
    <rect x="47" y="170" width="115" height="26" rx="8" fill="#f4efff"/>
    <rect x="47" y="204" width="115" height="26" rx="8" fill="#eef9f2"/>
  </g>
  <text x="61" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486278">Chart.yaml</text>
  <text x="61" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e5580">Şablonlar</text>
  <text x="61" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45705b">Varsayılanlar</text>

