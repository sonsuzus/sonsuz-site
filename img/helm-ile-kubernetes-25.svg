  <text x="549" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6380">Dağıtım</text>
  <text x="553" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d765a">Servis</text>
  <text x="550" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80613d">Giriş</text>
  <text x="552" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#655681">Gizli</text>

  <path d="M520 151 H528" fill="none" stroke="#7696b0" stroke-width="2"/>
  <polygon points="527,146 536,151 527,156" fill="#7696b0"/>
  <path d="M520 217 C530 217 525 217 530 217" fill="none" stroke="#94a885" stroke-width="2"/>
  <polygon points="529,212 538,217 529,222" fill="#94a885"/>

  <!-- bottom release -->
  <g filter="url(#shadow)">
    <rect x="219" y="244" width="224" height="48" rx="15" fill="#ffffff"/>
    <rect x="229" y="254" width="28" height="28" rx="9" fill="#d7efcb"/>
  </g>
  <path d="M238 268 h10 M243 263 v10" stroke="#52906b" stroke-width="2" stroke-linecap="round"/>
  <text x="270" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425e50">Release: web-api-üretim</text>
  <text x="270" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718278">Sürüm geçmişi ve geri alma</text>
</svg>