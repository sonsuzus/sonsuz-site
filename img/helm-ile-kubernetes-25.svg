  <text x="284" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a5b2d">Hazırlık</text>
  <text x="350" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426b4d">Üretim</text>

