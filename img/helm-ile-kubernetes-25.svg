  <g filter="url(#soft)">
    <rect x="542" y="117" width="58" height="25" rx="8" fill="#e8f2ff"/>
    <rect x="542" y="150" width="58" height="25" rx="8" fill="#edf9ed"/>
    <rect x="542" y="183" width="58" height="25" rx="8" fill="#fff1df"/>
    <rect x="542" y="216" width="58" height="25" rx="8" fill="#f1ebff"/>
