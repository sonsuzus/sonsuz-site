  <polygon points="207,105 216,110 207,115" fill="#7696b0"/>
  <path d="M364 110 C390 110 390 151 417 151" fill="none" stroke="#7696b0" stroke-width="2"/>
  <polygon points="416,146 425,151 416,156" fill="#7696b0"/>
  <path d="M400 197 C407 203 411 211 422 216" fill="none" stroke="#94a885" stroke-width="2"/>
  <polygon points="417,211 427,218 415,220" fill="#94a885"/>

