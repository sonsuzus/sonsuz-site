  <circle cx="233" cy="85" r="8" fill="#f4ae54"/>
  <path d="M230 85 h6 M233 82 v6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="248" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#705229">Values</text>
  <text x="228" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f6656">replica: 4</text>
  <text x="228" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f6656">etiket: 2.4.0</text>

