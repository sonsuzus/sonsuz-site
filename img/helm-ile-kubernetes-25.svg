  </g>
  <circle cx="472" cy="137" r="20" fill="#ffffff" opacity="0.8"/>
  <path d="M462 137 h20 M472 127 v20" stroke="#6d7eb3" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M456 161 C465 168 480 168 488 161" fill="none" stroke="#7889bc" stroke-width="2" stroke-linecap="round"/>
  <text x="443" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e5070">İşleme</text>

  <!-- Cluster -->
  <g filter="url(#shadow)">
    <rect x="530" y="68" width="82" height="190" rx="18" fill="#ffffff"/>
    <rect x="530" y="68" width="82" height="35" rx="18" fill="url(#clusterGrad)"/>
    <rect x="530" y="87" width="82" height="16" fill="url(#clusterGrad)"/>
