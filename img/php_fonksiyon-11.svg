<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">PHP Fonksiyonlar</text>

  <!-- Merkez kavram -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Fonksiyon</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e40af">Kod bloğu + isim</text>

  <!-- Sol üst: Tanım -->
  <rect x="40" y="55" width="160" height="65" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#86efac" stroke-width="1.5"/>
  <text x="120" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Tanım</text>
  <text x="120" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#166534">function ad()</text>
  <text x="120" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#166534">{ komutlar }</text>

  <!-- Sol alt: Çağrı -->
  <rect x="40" y="200" width="160" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="120" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#713f12">Çağrı</text>
  <text x="120" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#854d0e">ad()</text>

  <!-- Sağ üst: Yerleşik -->
  <rect x="440" y="55" width="160" height="65" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="520" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Yerleşik</text>
  <text x="520" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9d174d">Hazır fonksiyonlar</text>
  <text x="520" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9d174d">PHP eklentileri</text>

  <!-- Sağ alt: Kullanıcı tanımlı -->
  <rect x="440" y="200" width="160" height="55" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="520" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">Kullanıcı tanımlı</text>
  <text x="520" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4338ca">İsim: harf veya _</text>

  <!-- Alt orta: Örnek -->
  <rect x="245" y="245" width="150" height="45" rx="10" fill="url(#box6)" filter="url(#shadow)" stroke="#fdba74" stroke-width="1.5"/>
  <text x="320" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">Örnek</text>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9a3412">sayi_yazdir()</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Tanım -> Merkez -->
  <path d="M200 87 L245 130" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="245,130 236,124 238,134" fill="#64748b"/>

  <!-- Çağrı -> Merkez -->
  <path d="M200 227 L245 155" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="245,155 236,158 241,148" fill="#64748b"/>

  <!-- Merkez -> Yerleşik -->
  <path d="M395 130 L440 87" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="440,87 431,86 436,94" fill="#64748b"/>

  <!-- Merkez -> Kullanıcı tanımlı -->
  <path d="M395 155 L440 227" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="440,227 433,221 434,231" fill="#64748b"/>

  <!-- Merkez -> Örnek -->
  <path d="M320 170 L320 245" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="320,245 315,237 325,237" fill="#64748b"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#94a3b8">PHP fonksiyon kavramı ve türleri</text>
</svg>