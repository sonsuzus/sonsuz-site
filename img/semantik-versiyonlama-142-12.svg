<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#7f9cf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#718096" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#718096" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="116" fill="#dceeff" opacity="0.38"/>
  <circle cx="320" cy="160" r="82" fill="#ffffff" opacity="0.48"/>

  <text x="28" y="30" fill="#4a5568" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">SEMANTİK SÜRÜMLEME</text>
  <text x="612" y="30" text-anchor="end" fill="#718096" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">API sözleşmesi</text>

  <!-- connections -->
  <path d="M272 133 C231 116 209 104 176 97" fill="none" stroke="#e57b8d" stroke-width="2.5"/>
  <polygon points="176,97 185,94 181,103" fill="#e57b8d"/>
  <path d="M368 133 C408 116 432 104 465 97" fill="none" stroke="#57a77c" stroke-width="2.5"/>
  <polygon points="465,97 456,103 460,94" fill="#57a77c"/>
  <path d="M320 207 C320 226 320 234 320 250" fill="none" stroke="#4f9fc2" stroke-width="2.5"/>
  <polygon points="320,250 315,241 325,241" fill="#4f9fc2"/>

  <!-- range links -->
  <path d="M118 154 C158 170 202 178 251 178" fill="none" stroke="#a88bdf" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85"/>
  <path d="M522 154 C482 170 438 178 389 178" fill="none" stroke="#a88bdf" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85"/>

  <!-- left range -->
  <g filter="url(#softShadow)">
    <rect x="28" y="126" width="117" height="55" rx="15" fill="#f4efff"/>
    <rect x="39" y="137" width="27" height="27" rx="9" fill="#a88bdf"/>
  </g>
  <text x="52.5" y="155" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">~</text>
  <text x="76" y="149" fill="#5d4d82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">~2.4.1</text>
  <text x="76" y="166" fill="#776998" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Yalnızca patch</text>

  <!-- right range -->
  <g filter="url(#softShadow)">
    <rect x="495" y="126" width="117" height="55" rx="15" fill="#f4efff"/>
    <rect x="506" y="137" width="27" height="27" rx="9" fill="#a88bdf"/>
  </g>
  <text x="519.5" y="155" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">^</text>
  <text x="543" y="149" fill="#5d4d82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">^2.4.1</text>
  <text x="543" y="166" fill="#776998" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Minor ve patch</text>

  <!-- major -->
  <g filter="url(#shadow)">
