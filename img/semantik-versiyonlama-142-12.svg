  <text x="112" y="99" fill="#a65c6a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Kırıcı değişim</text>
  <text x="112" y="116" fill="#bd7783" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">1.9.0 → 2.0.0</text>

  <!-- minor -->
  <g filter="url(#shadow)">
    <rect x="450" y="55" width="142" height="74" rx="18" fill="#f1fbf5"/>
    <rect x="463" y="68" width="39" height="39" rx="12" fill="#57a77c"/>
  </g>
  <path d="M475 90 h15 M482.5 82.5 v15" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="514" y="80" fill="#337653" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">MINOR</text>
  <text x="514" y="99" fill="#4e8b68" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Yeni özellik</text>
  <text x="514" y="116" fill="#6ca180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">2.3.1 → 2.4.0</text>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="252" y="112" width="136" height="96" rx="25" fill="url(#core)"/>
  </g>
  <text x="320" y="137" text-anchor="middle" fill="#e8edff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">SÜRÜM</text>
  <text x="320" y="171" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">2 . 4 . 1</text>
  <path d="M279 183 h82" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <text x="320" y="197" text-anchor="middle" fill="#e8edff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Uyumluluk sinyali</text>

  <!-- patch -->
  <g filter="url(#shadow)">
    <rect x="249" y="251" width="142" height="55" rx="18" fill="#eff9fd"/>
    <rect x="262" y="263" width="31" height="31" rx="10" fill="#4f9fc2"/>
  </g>
  <path d="M270 279 l5 5 10-12" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="305" y="273" fill="#326f8a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">PATCH</text>
  <text x="305" y="290" fill="#54879d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Hata düzeltme · 2.4.1</text>
