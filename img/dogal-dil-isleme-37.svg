<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#c8dcf7"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7dcff"/>
      <stop offset="100%" stop-color="#d9caf5"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d5f3e6"/>
      <stop offset="100%" stop-color="#bce5d4"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0cf"/>
      <stop offset="100%" stop-color="#f6dfac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6e8194" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6e8194" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="100" cy="55" r="78" fill="#dcecfb" opacity="0.42"/>
  <circle cx="573" cy="264" r="92" fill="#dcefd9" opacity="0.42"/>
  <path d="M30 158 C108 126, 157 199, 232 169 S365 121, 431 158 S536 211, 617 159" fill="none" stroke="#b9d7d8" stroke-width="1.5" opacity="0.5"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42546b">Klinik NLP Bilgi Çıkarım Hattı</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708096">Serbest notlardan güvenilir yapılandırılmış veri</text>

  <!-- connectors -->
  <path d="M142 163 L169 163" fill="none" stroke="#718ba2" stroke-width="2.2"/>
  <polygon points="169,163 161,158 161,168" fill="#718ba2"/>
  <path d="M279 163 L305 163" fill="none" stroke="#718ba2" stroke-width="2.2"/>
  <polygon points="305,163 297,158 297,168" fill="#718ba2"/>
  <path d="M420 163 L447 163" fill="none" stroke="#718ba2" stroke-width="2.2"/>
  <polygon points="447,163 439,158 439,168" fill="#718ba2"/>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="28" y="106" width="114" height="114" rx="19" fill="url(#note)"/>
    <rect x="40" y="120" width="90" height="82" rx="11" fill="#f9fcff" opacity="0.8"/>
  </g>
  <path d="M111 120 L130 139 L111 139 Z" fill="#c4d8f0"/>
  <path d="M111 120 L111 139 L130 139" fill="none" stroke="#9db7d2" stroke-width="1"/>
  <path d="M53 151 L113 151 M53 164 L104 164 M53 177 L96 177" stroke="#91a9c0" stroke-width="3" stroke-linecap="round"/>
  <text x="85" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#344b64">Klinik Not</text>
  <text x="85" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60778e">Serbest metin</text>

  <!-- processing -->
  <g filter="url(#shadow)">
    <rect x="169" y="89" width="110" height="148" rx="20" fill="url(#model)"/>
    <rect x="181" y="103" width="86" height="30" rx="10" fill="#f8f5ff" opacity="0.86"/>
    <rect x="181" y="142" width="86" height="30" rx="10" fill="#f8f5ff" opacity="0.86"/>
    <rect x="181" y="181" width="86" height="40" rx="10" fill="#f8f5ff" opacity="0.86"/>
  </g>
  <text x="224" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#55446e">Ayırma</text>
  <text x="224" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#55446e">Normalizasyon</text>
  <text x="224" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#55446e">Bağlamsal</text>
  <text x="224" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#68577f">model</text>

  <!-- extraction core -->
  <g filter="url(#shadow)">
    <rect x="305" y="78" width="115" height="170" rx="22" fill="#d8eafc"/>
    <circle cx="362.5" cy="128" r="31" fill="#f7fbff"/>
    <circle cx="362.5" cy="128" r="20" fill="#a8c9ec"/>
    <path d="M349 128 L358 137 L377 116" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="320" y="174" width="85" height="25" rx="9" fill="#f6fbff" opacity="0.9"/>
    <rect x="320" y="207" width="85" height="25" rx="9" fill="#f6fbff" opacity="0.9"/>
  </g>
  <text x="362.5" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546e">Varlık ve ilişki</text>
  <text x="362.5" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546e">Bağlam çözümü</text>

  <!-- output -->
  <g filter="url(#shadow)">
    <rect x="447" y="96" width="163" height="134" rx="20" fill="url(#data)"/>
    <rect x="462" y="112" width="133" height="28" rx="8" fill="#f9fffb" opacity="0.88"/>
    <rect x="462" y="146" width="133" height="28" rx="8" fill="#f9fffb" opacity="0.88"/>
    <rect x="462" y="180" width="133" height="34" rx="8" fill="#f9fffb" opacity="0.88"/>
  </g>
  <circle cx="477" cy="126" r="5" fill="#6eaf91"/>
  <text x="489" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365e4c">İlaç: Metformin</text>
  <circle cx="477" cy="160" r="5" fill="#d47b7b"/>
  <text x="489" y="164" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365e4c">Ateş: yok</text>
  <circle cx="477" cy="194" r="5" fill="#7b90c9"/>
  <text x="489" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365e4c">Zaman: geçmiş</text>
  <text x="528" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496d5c">Yapılandırılmış veri</text>

  <!-- upper metadata -->
  <path d="M362 77 L362 63 L437 63 L437 77" fill="none" stroke="#8ca6b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g filter="url(#smallShadow)">
    <rect x="389" y="32" width="96" height="31" rx="13" fill="url(#safe)"/>
  </g>
  <path d="M405 41 L415 37 L425 41 L425 49 C425 54 420 57 415 59 C410 57 405 54 405 49 Z" fill="none" stroke="#a97936" stroke-width="1.5"/>
  <text x="451" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765323">Terminoloji</text>

  <!-- lower safety governance -->
  <path d="M362 248 L362 267" fill="none" stroke="#8ca6b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g filter="url(#smallShadow)">
    <rect x="263" y="267" width="199" height="36" rx="15" fill="#fff2d5"/>
  </g>
  <path d="M281 278 L289 274 L297 278 L297 285 C297 290 293 293 289 295 C285 293 281 290 281 285 Z" fill="#d9a354"/>
  <path d="M313 285 L324 285 M318.5 279.5 L318.5 290.5" stroke="#87622e" stroke-width="1.5" stroke-linecap="round"/>
  <text x="379" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765323">Mahremiyet ve doktor onayı</text>
</svg>