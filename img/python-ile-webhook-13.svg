<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f3f8ef;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a9bb5"/>
    </marker>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">Webhook Entegrasyon Akışı</text>

  <!-- Sosyal Medya Kaynağı -->
  <rect x="40" y="60" width="120" height="55" rx="10" fill="#e8f0fe" stroke="#b8cbe8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a90d9">Sosyal Medya</text>
  <text x="100" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a9cc6">Olay: @bahsetme</text>

  <!-- Ok 1 -->
  <line x1="160" y1="87" x2="205" y2="87" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="182" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a9bb5">POST</text>

  <!-- Python Doğrulama Katmanı -->
  <rect x="210" y="55" width="130" height="65" rx="10" fill="#d8f0e0" stroke="#a8d4b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="275" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3da55d">Python Alıcı</text>
  <text x="275" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6ab583">İmza Doğrulama</text>
  <text x="275" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6ab583">Veri Kontrolü</text>

  <!-- Ok 2 -->
  <line x1="340" y1="87" x2="385" y2="87" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- İşleme ve Dönüşüm -->
  <rect x="390" y="55" width="130" height="65" rx="10" fill="#fdf0d8" stroke="#e8d4a8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="455" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#d99e2b">Dönüştürme</text>
  <text x="455" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c9975a">Veri Eşleme</text>
  <text x="455" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c9975a">Format Çevirisi</text>

  <!-- Ok 3 -->
  <line x1="520" y1="87" x2="555" y2="87" stroke="#8a9bb5" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Hedef Forum -->
  <rect x="560" y="55" width="60" height="55" rx="10" fill="#e8e0f0" stroke="#c8b8d8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8a5cb8">Forum</text>
  <text x="590" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a07fc0">API</text>

  <!-- Güvenlik Katmanı -->
  <rect x="210" y="150" width="310" height="50" rx="10" fill="#f5e8e8" stroke="#e0c8c8" stroke-width="1.5" filter="url(#shadowSmall)"/>
  <text x="365" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c05a5a">HMAC İmza Doğrulama</text>
  <text x="365" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#d08080">SHA256 + Secret Key</text>

  <!-- Ok güvenlik -->
  <line x1="275" y1="120" x2="275" y2="148" stroke="#c05a5a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Idempotency Katmanı -->
  <rect x="210" y="220" width="310" height="50" rx="10" fill="#e8f0f8" stroke="#b8cce8" stroke-width="1.5" filter="url(#shadowSmall)"/>
  <text x="365" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a7ab5">İdempotency Kontrolü</text>
  <text x="365" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a9ec8">Tekrar eden olay işlenmez</text>

  <!-- Ok idempotency -->
  <line x1="365" y1="200" x2="365" y2="218" stroke="#4a7ab5" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Hata Yönetimi -->
  <rect x="210" y="285" width="310" height="25" rx="8" fill="#e0f0e8" stroke="#b8d8c8" stroke-width="1" filter="url(#shadowSmall)"/>
  <text x="365" y="301" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a8a7a">Üstel Geri Çekilme: delay = min(2^n, 300)</text>

  <!-- Ok hata -->
  <line x1="320" y1="270" x2="320" y2="283" stroke="#5a8a7a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="410" y1="270" x2="410" y2="283" stroke="#5a8a7a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Kuyruk -->
  <rect x="40" y="150" width="140" height="45" rx="10" fill="#f0e8d8" stroke="#d8c8a8" stroke-width="1.5" filter="url(#shadowSmall)"/>
  <text x="110" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#b08040">İşlem Kuyruğu</text>
  <text x="110" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c8a060">Başarısız işlemler</text>

  <!-- Ok kuyruk -->
  <line x1="210" y1="130" x2="140" y2="148" stroke="#b08040" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Loglama -->
  <rect x="40" y="220" width="140" height="40" rx="10" fill="#e0f0f8" stroke="#b8d0e8" stroke-width="1.5" filter="url(#shadowSmall)"/>
  <text x="110" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a9ab5">Loglama</text>
  <text x="110" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6ab0c8">Olay kaydı</text>

  <!-- Ok log -->
  <line x1="275" y1="200" x2="160" y2="238" stroke="#4a9ab5" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Tekrar deneme oku -->
  <path d="M 40 172 Q 15 172 15 210 Q 15 248 40 240" fill="none" stroke="#b08040" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <!-- Veri Akışı etiketi -->
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a9bb5" font-style="italic">Veri Akışı</text>
</svg>