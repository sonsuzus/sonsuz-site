<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="sender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ddecff"/>
      <stop offset="100%" stop-color="#bdd9f6"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcf4df"/>
      <stop offset="100%" stop-color="#bce1c5"/>
    </linearGradient>
    <linearGradient id="switch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c9"/>
      <stop offset="100%" stop-color="#f5d98f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c7890" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5c7890" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="65" cy="282" r="82" fill="#d9edf7" opacity="0.42"/>
  <circle cx="585" cy="40" r="90" fill="#e4f3d9" opacity="0.46"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38516a">ARP: IP Adresinden MAC Adresine</text>

  <g filter="url(#soft)">
    <rect x="238" y="45" width="164" height="54" rx="15" fill="#ffffff" stroke="#d8e5ed"/>
    <rect x="252" y="57" width="24" height="17" rx="4" fill="#cce6fb"/>
    <path d="M257 63h14M257 68h10" stroke="#5587ad" stroke-width="1.5" stroke-linecap="round"/>
    <text x="287" y="67" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425a6d">ARP Önbelleği</text>
    <text x="287" y="84" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718595">Kayıt kontrolü</text>
  </g>

  <path d="M320 101 L320 119" stroke="#8aa3b2" stroke-width="2" stroke-linecap="round"/>
  <polygon points="314,115 326,115 320,123" fill="#8aa3b2"/>

  <g filter="url(#shadow)">
    <rect x="42" y="140" width="145" height="117" rx="19" fill="url(#sender)" stroke="#a8cce6"/>
    <rect x="58" y="158" width="47" height="34" rx="6" fill="#ffffff" opacity="0.84"/>
    <rect x="65" y="164" width="33" height="20" rx="3" fill="#75b3dc"/>
    <path d="M76 199h12M71 204h22" stroke="#5786a6" stroke-width="2" stroke-linecap="round"/>
    <text x="120" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#335d7a">Gönderici</text>
    <text x="120" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426d8b">IP: .1.10</text>
    <text x="58" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426d8b">Hedef: 192.168.1.20</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="257" y="141" width="126" height="111" rx="20" fill="url(#switch)" stroke="#e3c56d"/>
    <rect x="280" y="161" width="80" height="37" rx="8" fill="#fffdf5" opacity="0.9"/>
    <circle cx="294" cy="179" r="4" fill="#e09d57"/>
    <circle cx="309" cy="179" r="4" fill="#e09d57"/>
    <circle cx="324" cy="179" r="4" fill="#e09d57"/>
    <circle cx="339" cy="179" r="4" fill="#e09d57"/>
    <path d="M286 207h68" stroke="#c7964b" stroke-width="2" stroke-linecap="round"/>
    <text x="320" y="229" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80622d">Yerel Ağ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="454" y="140" width="145" height="117" rx="19" fill="url(#target)" stroke="#a6d2ae"/>
    <rect x="470" y="158" width="47" height="34" rx="6" fill="#ffffff" opacity="0.84"/>
    <rect x="477" y="164" width="33" height="20" rx="3" fill="#68ad78"/>
    <path d="M488 199h12M483 204h22" stroke="#568d63" stroke-width="2" stroke-linecap="round"/>
    <text x="532" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#396847">Hedef</text>
    <text x="532" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#497956">IP: .1.20</text>
    <text x="470" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#497956">MAC: 00:1A:2B...</text>
  </g>

  <path d="M188 164 C212 130, 233 130, 255 161" fill="none" stroke="#d17968" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="247,155 258,162 245,166" fill="#d17968"/>
  <rect x="190" y="106" width="133" height="29" rx="12" fill="#fff0ed" stroke="#f0c7bd" filter="url(#soft)"/>
  <text x="256" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a65c50">ARP İsteği · Yayın</text>

  <path d="M385 221 C413 248, 431 248, 452 219" fill="none" stroke="#538cb0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="444,220 454,214 452,227" fill="#538cb0"/>
  <rect x="382" y="264" width="136" height="29" rx="12" fill="#e7f4fb" stroke="#c5dfed" filter="url(#soft)"/>
  <text x="450" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40779b">ARP Yanıtı · MAC</text>

  <path d="M255 207 L190 207" stroke="#bd9851" stroke-width="1.7" stroke-dasharray="4 5" stroke-linecap="round"/>
  <path d="M385 207 L452 207" stroke="#bd9851" stroke-width="1.7" stroke-dasharray="4 5" stroke-linecap="round"/>

  <g filter="url(#soft)">
    <rect x="69" y="274" width="210" height="27" rx="13" fill="#ffffff" opacity="0.92" stroke="#d8e5ed"/>
    <text x="174" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d7f">IPv4 → MAC eşleşmesi</text>
  </g>
</svg>