  <line x1="47" y1="151" x2="171" y2="151" stroke="#dbe7ed" stroke-width="1"/>
  <path d="M47 154 C54 142 59 165 66 151 C72 140 77 162 83 151 L91 151 L97 143 L102 174 L108 123 L114 157 L120 151 C129 145 133 157 140 151 C146 143 152 160 160 150 C164 147 167 151 171 151" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
