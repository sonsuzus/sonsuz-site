  <polygon points="115,262 123,265 118,270" fill="#91aab9"/>
  <circle cx="102" cy="256" r="12" fill="#dcebf6" filter="url(#soft)"/>
  <path d="M97 254 C97 249 107 249 107 254 C107 258 104 259 104 262 L100 262 C100 259 97 258 97 254Z" fill="#668faa"/>
  <path d="M98 265 L106 265" stroke="#668faa" stroke-width="1.6" stroke-linecap="round"/>
  <text x="70" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587184">Uzman</text>
