<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8175d8"/>
      <stop offset="100%" stop-color="#5f9fca"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6b7d91" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#65768a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="160" r="105" fill="#ffffff" opacity="0.38"/>
  <circle cx="319" cy="160" r="80" fill="none" stroke="#bdd6dd" stroke-width="1.5" stroke-dasharray="4 6"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#44556b">ÇOKLU ROBOT GÖREV TAHSİSİ</text>

  <!-- connections -->
  <path d="M178 94 C208 102 223 116 244 132" fill="none" stroke="#91aebb" stroke-width="2"/>
  <polygon points="244,132 234,129 239,121" fill="#91aebb"/>
  <path d="M463 94 C432 102 416 116 395 132" fill="none" stroke="#91aebb" stroke-width="2"/>
  <polygon points="395,132 400,121 406,129" fill="#91aebb"/>
  <path d="M179 230 C208 221 224 207 244 190" fill="none" stroke="#91aebb" stroke-width="2"/>
  <polygon points="244,190 239,201 234,193" fill="#91aebb"/>
  <path d="M462 230 C432 221 416 207 395 190" fill="none" stroke="#91aebb" stroke-width="2"/>
  <polygon points="395,190 406,193 400,201" fill="#91aebb"/>

  <!-- upper left -->
  <g filter="url(#soft)">
    <rect x="38" y="59" width="141" height="71" rx="17" fill="#e7f3fb"/>
    <rect x="51" y="74" width="35" height="35" rx="11" fill="#9ed1e5"/>
    <circle cx="68.5" cy="85" r="6" fill="#ffffff"/>
    <path d="M59 100 Q68.5 89 78 100" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="98" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36566c">Robotlar</text>
    <text x="98" y="106" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c7788">Yetenek · Batarya</text>
  </g>

  <!-- upper right -->
  <g filter="url(#soft)">
    <rect x="462" y="59" width="141" height="71" rx="17" fill="#fff2dd"/>
    <rect x="475" y="74" width="35" height="35" rx="11" fill="#f1be75"/>
    <path d="M483 84 h19 v16 h-19 z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M488 81 v6 M497 81 v6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="521" y="87" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7a5830">Görevler</text>
    <text x="521" y="106" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7050">Öncelik · Süre</text>
  </g>

  <!-- lower left -->
  <g filter="url(#soft)">
    <rect x="38" y="195" width="141" height="71" rx="17" fill="#eaf6e8"/>
    <rect x="51" y="210" width="35" height="35" rx="11" fill="#9acb9d"/>
    <path d="M59 232 C63 221 72 221 77 215" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M74 215 h4 v5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="98" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426b49">Kısıtlar</text>
    <text x="98" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66826b">Zaman · Kapasite</text>
  </g>

  <!-- lower right -->
  <g filter="url(#soft)">
    <rect x="462" y="195" width="141" height="71" rx="17" fill="#f8e9f0"/>
    <rect x="475" y="210" width="35" height="35" rx="11" fill="#dca4ba"/>
    <path d="M483 232 h20 M486 228 l-3 4 3 4 M500 228 l3 4 -3 4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="521" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7b4c61">Dinamiklik</text>
    <text x="521" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#916579">Yeni görev · İletişim</text>
  </g>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="244" y="112" width="152" height="96" rx="25" fill="url(#core)"/>
    <circle cx="320" cy="143" r="20" fill="#ffffff" opacity="0.19"/>
    <path d="M310 143 h20 M320 133 v20 M313 136 l14 14 M327 136 l-14 14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">OPTİMİZASYON</text>
    <text x="320" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf5ff">Maliyet · Enerji · Mesafe</text>
  </g>

  <!-- bottom outcome -->
  <path d="M320 210 L320 236" fill="none" stroke="#6d91a4" stroke-width="2.5"/>
  <polygon points="320,242 314,232 326,232" fill="#6d91a4"/>
  <g filter="url(#soft)">
    <rect x="218" y="251" width="204" height="45" rx="16" fill="#ffffff"/>
    <circle cx="244" cy="273.5" r="12" fill="#83bdb0"/>
    <path d="M238 274 l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="264" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#455a69">Denge: Kalite ve Hız</text>
    <text x="264" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748491">Kesin · Sezgisel · Dağıtık</text>
  </g>
</svg>