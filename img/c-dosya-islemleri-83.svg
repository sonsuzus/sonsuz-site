<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="akıs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fc9ee"/>
      <stop offset="100%" stop-color="#91d6b2"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#496477" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#496477" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="70" cy="43" r="66" fill="#dceefa" opacity="0.58"/>
  <circle cx="580" cy="271" r="86" fill="#dff1df" opacity="0.55"/>
  <path d="M42 160 C120 106 171 213 250 161 S397 109 480 158 S558 211 615 153" fill="none" stroke="#c7e2e7" stroke-width="2" opacity="0.58"/>

  <!-- Sol: geçici bellek -->
  <g filter="url(#golge)">
    <rect x="34" y="99" width="145" height="122" rx="18" fill="#e8f2ff" stroke="#b9d8ee"/>
    <rect x="50" y="116" width="112" height="28" rx="9" fill="#ffffff"/>
    <rect x="50" y="153" width="112" height="17" rx="6" fill="#c8e5f8"/>
    <rect x="50" y="178" width="87" height="17" rx="6" fill="#d7eaf8"/>
