  <g filter="url(#hafifGolge)">
    <rect x="49" y="254" width="112" height="40" rx="12" fill="#ffffff" stroke="#c8deed"/>
    <rect x="181" y="254" width="112" height="40" rx="12" fill="#ffffff" stroke="#c8e7d4"/>
    <rect x="313" y="254" width="112" height="40" rx="12" fill="#ffffff" stroke="#ead8ad"/>
    <rect x="445" y="254" width="146" height="40" rx="12" fill="#ffffff" stroke="#e1c9d9"/>
  </g>
  <text x="105" y="279" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#41677b">fopen</text>
  <text x="237" y="279" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47735a">Okuma ve yazma</text>
  <text x="369" y="279" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#826b35">Tampon</text>
  <text x="518" y="279" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80516e">fclose ve denetim</text>

  <path d="M161 274 H174" fill="none" stroke="#aac9d7" stroke-width="2"/>
  <polygon points="180,274 171,268 171,280" fill="#aac9d7"/>
  <path d="M293 274 H306" fill="none" stroke="#a9d4b8" stroke-width="2"/>
  <polygon points="312,274 303,268 303,280" fill="#a9d4b8"/>
  <path d="M425 274 H438" fill="none" stroke="#dccb9a" stroke-width="2"/>
  <polygon points="444,274 435,268 435,280" fill="#dccb9a"/>

  <!-- Üst standart akışlar -->
  <g filter="url(#hafifGolge)">
    <rect x="225" y="17" width="190" height="43" rx="14" fill="#ffffff" stroke="#d0ddea"/>
    <circle cx="250" cy="38.5" r="10" fill="#ddecf8"/>
    <circle cx="320" cy="38.5" r="10" fill="#dff2e7"/>
    <circle cx="390" cy="38.5" r="10" fill="#f6e2e8"/>
  </g>
  <text x="250" y="42.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#527b96">G</text>
  <text x="320" y="42.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4f8668">Ç</text>
  <text x="390" y="42.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#9b6377">H</text>
  <text x="250" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567084">stdin</text>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567084">stdout</text>
  <text x="390" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567084">stderr</text>
</svg>