  <text x="320" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a7667">Tampon ve konum</text>

  <!-- Sağ: kalıcı disk -->
  <g filter="url(#golge)">
    <rect x="461" y="99" width="145" height="122" rx="18" fill="#eaf6e9" stroke="#bcdfbe"/>
    <ellipse cx="533.5" cy="124" rx="47" ry="13" fill="#bce2c0"/>
    <path d="M486.5 124 V184 C486.5 191 507.5 197 533.5 197 C559.5 197 580.5 191 580.5 184 V124" fill="#d8efd8" stroke="#9dcfa4"/>
    <path d="M486.5 151 C486.5 158 507.5 164 533.5 164 C559.5 164 580.5 158 580.5 151" fill="none" stroke="#9dcfa4"/>
    <path d="M486.5 174 C486.5 181 507.5 187 533.5 187 C559.5 187 580.5 181 580.5 174" fill="none" stroke="#9dcfa4"/>
  </g>
  <text x="533.5" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#426e49">Kalıcı depolama</text>
  <text x="533.5" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54775a">Dosya ve disk</text>

  <!-- Ana bağlantılar -->
  <path d="M181 151 H223" fill="none" stroke="#75b8dc" stroke-width="3" stroke-linecap="round"/>
  <polygon points="229,151 218,144 218,158" fill="#75b8dc"/>
  <path d="M411 151 H453" fill="none" stroke="#70bd97" stroke-width="3" stroke-linecap="round"/>
  <polygon points="459,151 448,144 448,158" fill="#70bd97"/>
  <path d="M220 169 H189" fill="none" stroke="#9bc9df" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="183,169 194,162 194,176" fill="#9bc9df"/>
  <path d="M451 169 H420" fill="none" stroke="#a5d5b4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="414,169 425,162 425,176" fill="#a5d5b4"/>

