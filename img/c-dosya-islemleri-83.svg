  <text x="106.5" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547181">Değişkenler</text>

  <!-- Merkez: FILE stream -->
  <g filter="url(#golge)">
    <rect x="231" y="92" width="178" height="138" rx="24" fill="#ffffff" stroke="#b6d8d0" stroke-width="1.5"/>
    <circle cx="320" cy="145" r="38" fill="#dcf3e8"/>
    <circle cx="320" cy="145" r="27" fill="#ffffff" stroke="#a8d9c2"/>
    <path d="M301 145 H334" fill="none" stroke="url(#akıs)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="337,145 327,138 327,152" fill="#68ba98"/>
    <path d="M339 161 H306" fill="none" stroke="#79bde0" stroke-width="6" stroke-linecap="round"/>
    <polygon points="303,161 313,154 313,168" fill="#5aabd3"/>
