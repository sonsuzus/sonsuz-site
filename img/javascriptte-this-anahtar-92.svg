<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez: this -->
  <rect x="260" y="120" width="120" height="48" rx="14" fill="#6c5ce7" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="140" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="14">this</text>
  <text x="320" y="156" text-anchor="middle" fill="#e0d4ff" font-size="11">dinamik bağlam</text>

  <!-- Sol üst: Metot çağrısı -->
  <rect x="40" y="30" width="140" height="52" rx="10" fill="#a29bfe" opacity="0.85" filter="url(#shadow)"/>
  <text x="110" y="50" text-anchor="middle" fill="#2d3436" font-weight="bold">nesne.metot()</text>
  <text x="110" y="68" text-anchor="middle" fill="#2d3436" opacity="0.8">this = nesne</text>

  <!-- Sol orta: Bağımsız çağrı -->
  <rect x="40" y="110" width="140" height="52" rx="10" fill="#fab1a0" opacity="0.85" filter="url(#shadow)"/>
  <text x="110" y="130" text-anchor="middle" fill="#2d3436" font-weight="bold">fonksiyon()</text>
  <text x="110" y="148" text-anchor="middle" fill="#2d3436" opacity="0.8">strict: undefined</text>

  <!-- Sol alt: call/apply -->
  <rect x="40" y="190" width="140" height="52" rx="10" fill="#74b9ff" opacity="0.85" filter="url(#shadow)"/>
  <text x="110" y="210" text-anchor="middle" fill="#2d3436" font-weight="bold">call / apply</text>
  <text x="110" y="228" text-anchor="middle" fill="#2d3436" opacity="0.8">this = verilen nesne</text>

  <!-- Sağ üst: new -->
  <rect x="460" y="30" width="140" height="52" rx="10" fill="#55efc4" opacity="0.85" filter="url(#shadow)"/>
  <text x="530" y="50" text-anchor="middle" fill="#2d3436" font-weight="bold">new Fonksiyon()</text>
  <text x="530" y="68" text-anchor="middle" fill="#2d3436" opacity="0.8">this = yeni nesne</text>

  <!-- Sağ orta: bind -->
  <rect x="460" y="110" width="140" height="52" rx="10" fill="#ffeaa7" opacity="0.85" filter="url(#shadow)"/>
  <text x="530" y="130" text-anchor="middle" fill="#2d3436" font-weight="bold">bind</text>
  <text x="530" y="148" text-anchor="middle" fill="#2d3436" opacity="0.8">kalıcı bağlı fonksiyon</text>

  <!-- Sağ alt: Ok fonksiyonu -->
  <rect x="460" y="190" width="140" height="52" rx="10" fill="#fd79a8" opacity="0.85" filter="url(#shadow)"/>
  <text x="530" y="210" text-anchor="middle" fill="#2d3436" font-weight="bold">() =&gt; { }</text>
  <text x="530" y="228" text-anchor="middle" fill="#2d3436" opacity="0.8">sözcüksel dış kapsam</text>

  <!-- Oklar: merkeze doğru -->
  <!-- Sol üstten -->
  <path d="M180 56 L252 132" stroke="#636e72" stroke-width="2" fill="none"/>
  <polygon points="252,132 240,124 248,140" fill="#636e72"/>

  <!-- Sol ortadan -->
  <path d="M180 136 L252 142" stroke="#636e72" stroke-width="2" fill="none"/>
  <polygon points="252,142 240,134 244,150" fill="#636e72"/>

  <!-- Sol alttan -->
  <path d="M180 216 L252 158" stroke="#636e72" stroke-width="2" fill="none"/>
  <polygon points="252,158 238,154 246,168" fill="#636e72"/>

  <!-- Sağ üstten -->
  <path d="M460 56 L388 132" stroke="#636e72" stroke-width="2" fill="none"/>
  <polygon points="388,132 400,124 392,140" fill="#636e72"/>

  <!-- Sağ ortadan -->
  <path d="M460 136 L388 142" stroke="#636e72" stroke-width="2" fill="none"/>
  <polygon points="388,142 400,134 396,150" fill="#636e72"/>

  <!-- Sağ alttan -->
  <path d="M460 216 L388 158" stroke="#636e72" stroke-width="2" fill="none"/>
  <polygon points="388,158 402,154 394,168" fill="#636e72"/>

  <!-- Alt bilgi -->
  <rect x="200" y="270" width="240" height="34" rx="8" fill="#dfe6e9" opacity="0.7"/>
  <text x="320" y="286" text-anchor="middle" fill="#2d3436" font-size="11">Çağrı biçimi → this değerini belirler</text>
  <text x="320" y="298" text-anchor="middle" fill="#636e72" font-size="10">Tanım değil, çağrı önemlidir</text>
</svg>