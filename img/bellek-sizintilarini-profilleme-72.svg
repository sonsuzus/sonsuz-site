<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8eaff"/>
      <stop offset="100%" stop-color="#bddaf5"/>
    </linearGradient>
    <linearGradient id="alert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe7c8"/>
      <stop offset="100%" stop-color="#f8cfa8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7891a8" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
