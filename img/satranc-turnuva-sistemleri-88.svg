<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#c8f0df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6b8597" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#72899a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="81" cy="42" r="74" fill="#dceeff" opacity="0.45"/>
  <circle cx="583" cy="280" r="92" fill="#dff3d8" opacity="0.48"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41586a">TURNUVA YÖNETİM AKIŞI</text>

  <!-- Left input panel -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="155" height="180" rx="20" fill="#ffffff"/>
    <rect x="30" y="72" width="155" height="42" rx="20" fill="#e9f2ff"/>
    <rect x="30" y="94" width="155" height="20" fill="#e9f2ff"/>
  </g>
  <text x="107" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#46627b">TURNuva VERİSİ</text>

  <g filter="url(#smallShadow)">
    <rect x="47" y="128" width="121" height="28" rx="9" fill="#f6fbff" stroke="#d5e4ef"/>
    <circle cx="62" cy="142" r="5" fill="#87aee8"/>
    <text x="78" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#465c6d">Oyuncular</text>

    <rect x="47" y="166" width="121" height="28" rx="9" fill="#f6fbff" stroke="#d5e4ef"/>
    <circle cx="62" cy="180" r="5" fill="#86cfac"/>
    <text x="78" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#465c6d">Puanlar</text>

    <rect x="47" y="204" width="121" height="28" rx="9" fill="#f6fbff" stroke="#d5e4ef"/>
    <circle cx="62" cy="218" r="5" fill="#e7a77f"/>
    <text x="78" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#465c6d">Kısıtlar</text>
  </g>

  <!-- arrows to core -->
  <path d="M185 162 H218" fill="none" stroke="#7c9aac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="226,162 216,156 216,168" fill="#7c9aac"/>

  <!-- Central engine -->
  <g filter="url(#shadow)">
    <rect x="228" y="76" width="185" height="172" rx="25" fill="url(#core)" stroke="#b8dacc"/>
  </g>
  <circle cx="320" cy="120" r="26" fill="#ffffff" filter="url(#smallShadow)"/>
  <path d="M307 121 L315 129 L334 110" fill="none" stroke="#58a879" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365c4d">Eşlendirme Motoru</text>
  <text x="320" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537266">Swiss kuralları</text>
  <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537266">Renk dengesi</text>
  <text x="320" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537266">Eşitlik bozma</text>

  <!-- output arrows -->
  <path d="M413 117 H445" fill="none" stroke="#7c9aac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="453,117 443,111 443,123" fill="#7c9aac"/>
  <path d="M413 162 H445" fill="none" stroke="#7c9aac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="453,162 443,156 443,168" fill="#7c9aac"/>
  <path d="M413 207 H445" fill="none" stroke="#7c9aac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="453,207 443,201 443,213" fill="#7c9aac"/>

  <!-- Platforms -->
  <g filter="url(#shadow)">
    <rect x="455" y="76" width="155" height="76" rx="17" fill="#fff4e8"/>
    <rect x="455" y="124" width="155" height="28" rx="17" fill="#ffe8cf"/>
  </g>
  <rect x="470" y="91" width="29" height="24" rx="7" fill="#e9a56e"/>
  <path d="M478 97 H491 M478 103 H491 M478 109 H487" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="511" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#755036">Swiss-Manager</text>
  <text x="511" y="124" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#866650">Masaüstü ve rapor</text>

  <g filter="url(#shadow)">
    <rect x="455" y="162" width="155" height="76" rx="17" fill="#edf4ff"/>
    <rect x="455" y="210" width="155" height="28" rx="17" fill="#dceaff"/>
  </g>
  <rect x="470" y="177" width="29" height="24" rx="7" fill="#779fdd"/>
  <path d="M477 190 C480 184 485 184 488 190 M481 184 V195 M488 184 V195" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="511" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#455f88">Tornelo</text>
  <text x="511" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c7192">Bulut ve canlı yayın</text>

  <g filter="url(#shadow)">
    <rect x="455" y="248" width="155" height="48" rx="17" fill="#f1edff"/>
  </g>
  <rect x="470" y="260" width="29" height="24" rx="7" fill="#9c87d4"/>
  <path d="M477 272 H492 M480 267 V277 M489 267 V277" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="511" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c4b87">Lichess</text>

  <!-- lower link for lichess -->
  <path d="M383 248 C402 274 423 272 445 272" fill="none" stroke="#7c9aac" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="453,272 443,266 443,278" fill="#7c9aac"/>

  <!-- tiny score badge -->
  <g filter="url(#smallShadow)">
    <rect x="245" y="258" width="151" height="34" rx="12" fill="#ffffff"/>
  </g>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536a77">Sonuçlar → Sıralama</text>
</svg>