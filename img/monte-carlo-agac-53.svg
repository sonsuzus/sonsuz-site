<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#776fe4"/>
      <stop offset="100%" stop-color="#9c94ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#59718b" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#59718b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="35" cy="45" r="54" fill="#dceef4" opacity="0.52"/>
  <circle cx="605" cy="278" r="72" fill="#e4f1d9" opacity="0.58"/>
  <circle cx="548" cy="42" r="24" fill="#f8e8d7" opacity="0.72"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526477" font-weight="600">GO'DA AKILLI ARAMA</text>

  <!-- Go board / huge search space -->
  <g filter="url(#shadow)">
    <rect x="27" y="61" width="153" height="205" rx="18" fill="#fffdf8"/>
    <rect x="43" y="77" width="121" height="121" rx="9" fill="#ebc783"/>
    <g stroke="#9f7948" stroke-width="1" opacity="0.85">
      <path d="M58 84V191 M74 84V191 M90 84V191 M106 84V191 M122 84V191 M138 84V191 M154 84V191"/>
      <path d="M51 92H157 M51 108H157 M51 124H157 M51 140H157 M51 156H157 M51 172H157 M51 188H157"/>
    </g>
    <g fill="#413f48" filter="url(#smallShadow)">
      <circle cx="74" cy="108" r="6"/><circle cx="106" cy="124" r="6"/><circle cx="138" cy="156" r="6"/>
      <circle cx="90" cy="172" r="6"/><circle cx="122" cy="92" r="6"/>
    </g>
    <g fill="#f8f7f2" stroke="#c8c5bc" stroke-width="1" filter="url(#smallShadow)">
      <circle cx="90" cy="124" r="6"/><circle cx="122" cy="140" r="6"/><circle cx="74" cy="156" r="6"/>
      <circle cx="138" cy="108" r="6"/>
    </g>
    <text x="55" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405367" font-weight="700">Dev arama uzayı</text>
    <text x="55" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718293">Dallanma: 200+</text>
  </g>

  <!-- Incoming arrow -->
  <path d="M184 159H209" stroke="#8295a6" stroke-width="2.5" fill="none"/>
  <polygon points="215,159 206,154 206,164" fill="#8295a6"/>

  <!-- Central MCTS -->
  <g filter="url(#shadow)">
    <circle cx="319" cy="160" r="83" fill="#ffffff"/>
    <circle cx="319" cy="160" r="54" fill="url(#core)"/>
    <circle cx="319" cy="160" r="44" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
    <text x="319" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">MCTS</text>
    <text x="319" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#f1efff">UCT dengesi</text>
  </g>

  <!-- cycle connectors -->
  <path d="M283 95 C245 91 229 103 225 125" stroke="#6f90a3" stroke-width="2" fill="none"/>
  <polygon points="224,132 220,122 230,125" fill="#6f90a3"/>
  <path d="M237 177 C241 211 262 228 282 231" stroke="#6f90a3" stroke-width="2" fill="none"/>
  <polygon points="289,232 279,236 281,226" fill="#6f90a3"/>
  <path d="M356 232 C391 229 407 211 410 190" stroke="#6f90a3" stroke-width="2" fill="none"/>
  <polygon points="411,183 415,193 405,190" fill="#6f90a3"/>
  <path d="M407 133 C402 103 380 91 357 94" stroke="#6f90a3" stroke-width="2" fill="none"/>
  <polygon points="350,95 359,90 358,100" fill="#6f90a3"/>

  <!-- phase cards -->
  <g filter="url(#smallShadow)">
    <rect x="196" y="114" width="83" height="43" rx="12" fill="#dceefa"/>
    <circle cx="211" cy="135" r="9" fill="#86b9d8"/>
    <path d="M207 135h8M211 131v8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="253" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34536a" font-weight="700">Seçim</text>

    <rect x="222" y="215" width="97" height="43" rx="12" fill="#dff2e8"/>
    <circle cx="238" cy="236" r="9" fill="#79bd9a"/>
    <path d="M234 236h8M238 232v8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="278" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38634d" font-weight="700">Genişletme</text>

    <rect x="348" y="215" width="93" height="43" rx="12" fill="#fff0d9"/>
    <circle cx="363" cy="236" r="9" fill="#e6af69"/>
    <path d="M359 232l8 8M367 232l-8 8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="401" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76552e" font-weight="700">Simülasyon</text>

    <rect x="361" y="114" width="108" height="43" rx="12" fill="#f0e3f7"/>
    <circle cx="377" cy="135" r="9" fill="#ba88cb"/>
    <path d="M373 132l4 4 5-6" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="426" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#654276" font-weight="700">Geri yayılım</text>
  </g>

  <!-- Output tree -->
  <path d="M406 160H452" stroke="#8295a6" stroke-width="2.5" fill="none"/>
  <polygon points="458,160 449,155 449,165" fill="#8295a6"/>

  <g filter="url(#shadow)">
    <rect x="465" y="61" width="147" height="205" rx="18" fill="#ffffff"/>
    <text x="486" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405367" font-weight="700">Umut vaat eden yollar</text>

    <path d="M496 135H528 M528 135V113 M528 135V161 M528 113H553 M528 161H553 M553 113V99 M553 113V126 M553 161V148 M553 161V174 M553 99H578 M553 126H578 M553 148H578 M553 174H578" stroke="#91a4b3" stroke-width="2" fill="none"/>
    <g filter="url(#smallShadow)">
      <rect x="481" y="123" width="31" height="24" rx="8" fill="#9a91e9"/>
      <text x="496" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Kök</text>
      <rect x="542" y="87" width="22" height="24" rx="7" fill="#8bc6a5"/>
      <rect x="542" y="114" width="22" height="24" rx="7" fill="#d7dce1"/>
      <rect x="542" y="136" width="22" height="24" rx="7" fill="#e9b976"/>
      <rect x="542" y="163" width="22" height="24" rx="7" fill="#d7dce1"/>
      <rect x="571" y="87" width="25" height="24" rx="7" fill="#72b68e"/>
      <rect x="571" y="114" width="25" height="24" rx="7" fill="#d7dce1"/>
      <rect x="571" y="136" width="25" height="24" rx="7" fill="#e8b46d"/>
      <rect x="571" y="163" width="25" height="24" rx="7" fill="#d7dce1"/>
    </g>

    <rect x="484" y="211" width="109" height="32" rx="10" fill="#eff7f1"/>
    <circle cx="501" cy="227" r="6" fill="#66ad85"/>
    <text x="541" y="231" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416452">En iyi hamle</text>
  </g>

  <text x="320" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c7e8e">Keşif  •  Başarı  •  İstatistiksel sezgi</text>
</svg>