    <text x="52" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b83">Optional</text>
    <text x="52" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55728d">Değer var mı?</text>

    <path d="M120 130 L120 144" stroke="#799ab8" stroke-width="2" stroke-linecap="round"/>
    <polygon points="120,144 115,137 125,137" fill="#799ab8"/>
    <path d="M120 144 C120 151 79 151 79 160" fill="none" stroke="#799ab8" stroke-width="2" stroke-linecap="round"/>
    <path d="M120 144 C120 151 162 151 162 160" fill="none" stroke="#799ab8" stroke-width="2" stroke-linecap="round"/>

    <g filter="url(#smallShadow)">
      <rect x="47" y="160" width="65" height="51" rx="13" fill="#ffffff"/>
      <circle cx="62" cy="178" r="7" fill="#83bda0"/>
      <text x="80" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#426555">.some</text>
      <text x="79" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667986">Değer</text>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="129" y="160" width="65" height="51" rx="13" fill="#ffffff"/>
      <circle cx="144" cy="178" r="7" fill="#d998a1"/>
      <text x="162" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#80545b">.none</text>
      <text x="161" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#667986">nil</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="431" y="73" width="179" height="162" rx="22" fill="url(#arcGrad)"/>
    <text x="453" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35684c">ARC</text>
    <text x="453" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557b66">Nesne yaşamı</text>

    <g filter="url(#smallShadow)">
      <rect x="450" y="139" width="57" height="48" rx="13" fill="#ffffff"/>
      <text x="478.5" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#426555">strong</text>
      <text x="478.5" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687a72">+1</text>
    </g>

    <g filter="url(#smallShadow)">
      <rect x="534" y="139" width="57" height="48" rx="13" fill="#ffffff"/>
      <text x="562.5" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#426555">weak</text>
      <text x="562.5" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687a72">0</text>
    </g>

    <path d="M507 163 L528 163" stroke="#6caa83" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="528,163 520,158 520,168" fill="#6caa83"/>

    <path d="M478 203 C490 221 541 221 562 192" fill="none" stroke="#82a991" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="562,192 553,196 558,202" fill="#82a991"/>
    <text x="520" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#537160">Döngüyü kır</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="175" y="260" width="290" height="34" rx="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="197" cy="277" r="8" fill="#9bbbe0"/>
    <path d="M193 277 L196 280 L202 273" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e687c">Kontrol et</text>
    <path d="M281 277 L300 277" stroke="#a0b5c4" stroke-width="2" stroke-linecap="round"/>
    <polygon points="300,277 293,273 293,281" fill="#a0b5c4"/>
    <text x="314" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e687c">Güvenle temizle</text>
