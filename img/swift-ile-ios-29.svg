<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="optionalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9ddf7"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff3e6"/>
      <stop offset="100%" stop-color="#c6e7d3"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee3ff"/>
      <stop offset="100%" stop-color="#dccdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52708a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="45" cy="38" r="74" fill="#d7ebfa" opacity="0.38"/>
  <circle cx="601" cy="283" r="88" fill="#d9f0dc" opacity="0.42"/>
  <circle cx="318" cy="155" r="115" fill="#ffffff" opacity="0.30"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#526879">Swift iOS Uygulama Mimarisi</text>

  <path d="M259 154 L209 154" stroke="#8ba4ba" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="209,154 219,148 219,160" fill="#8ba4ba"/>
  <path d="M381 154 L431 154" stroke="#8ba4ba" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="431,154 421,148 421,160" fill="#8ba4ba"/>

  <g filter="url(#shadow)">
    <rect x="259" y="104" width="122" height="100" rx="24" fill="url(#coreGrad)"/>
    <circle cx="320" cy="132" r="18" fill="#ffffff" opacity="0.72"/>
    <path d="M312 132 L317 137 L329 125" fill="none" stroke="#765b9b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f3c6b">Güvenli Kod</text>
    <text x="320" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#68557f">Belirsizlik ve yaşam</text>
  </g>

  <g filter="url(#shadow)">
