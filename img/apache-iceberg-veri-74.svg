<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#cbe8e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6b8492" flood-opacity="0.2"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6b8492" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="48" r="72" fill="#dcefff" opacity="0.45"/>
  <circle cx="593" cy="277" r="84" fill="#dff2da" opacity="0.42"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355568">Apache Iceberg Tablo Katmanı</text>

  <!-- Sol: sorgu motorları -->
  <g filter="url(#softShadow)">
    <rect x="24" y="77" width="113" height="126" rx="18" fill="#ffffff"/>
    <rect x="31" y="84" width="99" height="30" rx="10" fill="#eee4ff"/>
    <rect x="31" y="122" width="99" height="30" rx="10" fill="#e2f4ff"/>
    <rect x="31" y="160" width="99" height="30" rx="10" fill="#e4f3e1"/>
  </g>
  <text x="80" y="66" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#486273">Sorgu Motorları</text>
  <text x="80" y="104" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e4275">Spark</text>
  <text x="80" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35667b">Flink ve Trino</text>
  <text x="80" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456b48">SQL Okuma Yazma</text>

  <!-- bağlantı sol-merkez -->
  <path d="M137 140 C150 140 155 140 166 140" fill="none" stroke="#7ca6b3" stroke-width="2"/>
  <polygon points="166,140 158,135 158,145" fill="#7ca6b3"/>
  <path d="M166 158 C154 158 149 158 137 158" fill="none" stroke="#9ab5be" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="137,158 145,153 145,163" fill="#9ab5be"/>

  <!-- Merkez iceberg -->
  <g filter="url(#shadow)">
    <rect x="167" y="64" width="258" height="174" rx="24" fill="#ffffff"/>
    <rect x="178" y="75" width="236" height="45" rx="15" fill="url(#ice)"/>
    <rect x="190" y="131" width="212" height="28" rx="10" fill="#dcecff"/>
    <rect x="201" y="168" width="190" height="26" rx="9" fill="#e5f4ed"/>
    <rect x="212" y="202" width="168" height="24" rx="8" fill="#fff2d9"/>
  </g>
  <text x="296" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#24566c">Iceberg Mantıksal Tablo</text>
  <text x="296" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416d7b">Şema ve gizli bölümleme</text>
  <text x="296" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#38617a">Tablo Metadata</text>
  <text x="296" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42745e">Manifest Listesi ve Manifestler</text>
  <text x="296" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806333">Dosya İstatistikleri</text>

  <!-- Sağ snapshot -->
  <path d="M425 122 C441 122 447 113 459 108" fill="none" stroke="#7198ac" stroke-width="2"/>
  <polygon points="459,108 450,106 454,115" fill="#7198ac"/>
  <path d="M425 188 C442 188 447 194 459 200" fill="none" stroke="#7198ac" stroke-width="2"/>
  <polygon points="459,200 454,193 450,202" fill="#7198ac"/>

  <g filter="url(#softShadow)">
    <rect x="461" y="62" width="151" height="84" rx="17" fill="#fff" stroke="#d3e4ef"/>
    <rect x="461" y="165" width="151" height="84" rx="17" fill="#fff" stroke="#d7ead4"/>
    <circle cx="482" cy="90" r="11" fill="#cfe9ff"/>
    <circle cx="482" cy="193" r="11" fill="#d9efcf"/>
  </g>
  <text x="499" y="84" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42687a">Snapshot</text>
  <text x="499" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567483">Atomik sürüm</text>
  <text x="499" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567483">Zaman yolculuğu</text>
  <text x="499" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d7450">İşlem Güveni</text>
  <text x="499" y="206" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#59765b">Çakışma algılama</text>
  <text x="499" y="225" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#59765b">Yeniden deneme</text>

  <!-- Alt storage -->
  <path d="M296 238 L296 259" fill="none" stroke="#7ba58e" stroke-width="2"/>
  <polygon points="296,259 291,251 301,251" fill="#7ba58e"/>
  <g filter="url(#shadow)">
    <rect x="132" y="265" width="329" height="39" rx="15" fill="#dcefe8"/>
    <rect x="143" y="273" width="57" height="23" rx="7" fill="#c7e1f5"/>
    <rect x="210" y="273" width="57" height="23" rx="7" fill="#cce8d2"/>
    <rect x="277" y="273" width="57" height="23" rx="7" fill="#f9e0b9"/>
    <rect x="344" y="273" width="105" height="23" rx="7" fill="#d9d5f4"/>
  </g>
  <text x="171" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365e76">Parquet</text>
  <text x="238" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3e6a47">ORC</text>
  <text x="305" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765934">Avro</text>
  <text x="396" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#564b83">Veri Gölü Depolama</text>
</svg>