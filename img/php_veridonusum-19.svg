<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ec"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3e2"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">PHP Veri Dönüşümleri</text>

  <!-- Sol üst: Değişken Tanımlama -->
  <rect x="40" y="55" width="170" height="90" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#b8cfe8" stroke-width="1.2"/>
  <text x="125" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Değişken Tanımlama</text>
  <text x="125" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">$deg01 = TRUE</text>
  <text x="125" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">$deg02 = 21</text>
  <text x="125" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">$deg03 = 14.64</text>

  <!-- Sağ üst: Tür Belirleme -->
  <rect x="430" y="55" width="170" height="90" rx="12" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#e8d5b0" stroke-width="1.2"/>
  <text x="515" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Tür Belirleme</text>
  <text x="515" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">var_dump()</text>
  <text x="515" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">boolean true</text>
  <text x="515" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">int 21</text>

  <!-- Ok: soldan sağa -->
  <path d="M 215 100 L 420 100" stroke="#5b8db8" stroke-width="2" fill="none"/>
  <polygon points="420,94 432,100 420,106" fill="#5b8db8"/>

  <!-- Alt orta: Geçici Tip Dönüşümü -->
  <rect x="200" y="185" width="240" height="90" rx="12" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#a8d5b0" stroke-width="1.2"/>
  <text x="320" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Geçici Tip Dönüşümü</text>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">(int) $deg01</text>
  <text x="320" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">(string) $deg03</text>
  <text x="320" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">(float) $deg02</text>

  <!-- Dikey oklar -->
  <path d="M 125 150 L 125 175" stroke="#5b8db8" stroke-width="2" fill="none"/>
  <polygon points="119,175 125,187 131,175" fill="#5b8db8"/>

  <path d="M 515 150 L 515 175" stroke="#5b8db8" stroke-width="2" fill="none"/>
  <polygon points="509,175 515,187 521,175" fill="#5b8db8"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">PHP dinamik tür sistemine sahiptir</text>
</svg>