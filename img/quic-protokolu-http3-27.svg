  </g>

  <path d="M255 210 H376" fill="none" stroke="#b5c4cc" stroke-width="2" stroke-dasharray="4 5"/>
  <polygon points="371,205 381,210 371,215" fill="#8ea2ad"/>

  <g filter="url(#softShadow)">
    <rect x="184" y="289" width="272" height="24" rx="12" fill="#ffffff" stroke="#d7e2e6"/>
    <circle cx="202" cy="301" r="5" fill="#68b79a"/>
    <text x="216" y="305" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526876">UDP üzerinde • TLS 1.3 • 0-RTT / 1-RTT • Bağlantı Kimliği</text>
