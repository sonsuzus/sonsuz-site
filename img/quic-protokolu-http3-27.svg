      <rect x="467" y="198" width="52" height="47" rx="10" fill="#ffffff"/>
      <rect x="529" y="198" width="52" height="47" rx="10" fill="#ffffff"/>
    </g>
    <text x="431" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536d67">Akış A</text>
    <text x="493" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536d67">Akış B</text>
    <text x="555" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536d67">Akış C</text>
