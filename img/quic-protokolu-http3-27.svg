<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="tcpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9e5"/>
      <stop offset="100%" stop-color="#fff7f2"/>
    </linearGradient>
    <linearGradient id="quicGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2f5ee"/>
      <stop offset="100%" stop-color="#f3fcf8"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfeaff"/>
      <stop offset="100%" stop-color="#e9e2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#70839a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#638095" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="60" cy="42" r="82" fill="#dceeff" opacity="0.42"/>
  <circle cx="592" cy="278" r="100" fill="#dff3d9" opacity="0.4"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40556d">WEB TAŞIMA KATMANI</text>

  <g filter="url(#shadow)">
    <rect x="238" y="47" width="164" height="62" rx="20" fill="url(#coreGrad)" stroke="#bdccef"/>
    <circle cx="270" cy="78" r="16" fill="#ffffff" opacity="0.78"/>
    <path d="M262 78h16M270 70v16" fill="none" stroke="#6d83bb" stroke-width="2" stroke-linecap="round"/>
    <text x="330" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e5281">Tarayıcı</text>
    <text x="330" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657596">HTTP İstekleri</text>
  </g>

