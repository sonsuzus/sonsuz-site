<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#5268c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#506078" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#506078" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="42" r="72" fill="#dceeff" opacity="0.55"/>
  <circle cx="574" cy="278" r="94" fill="#dff3dd" opacity="0.5"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5270">APOLLO UÇUŞ BİLGİSAYARI</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#73849a">Kısıtlı kaynakta kritik görev yönetimi</text>

  <!-- Sol girişler -->
  <g filter="url(#smallShadow)">
    <rect x="31" y="91" width="126" height="54" rx="14" fill="#e4f4ff" stroke="#b7dcef"/>
    <circle cx="55" cy="118" r="13" fill="#8ec8e8"/>
    <path d="M48 119 L53 114 L57 117 L63 110" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="77" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35566e">Sensörler</text>
    <text x="77" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#648096">Veri akışı</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="31" y="177" width="126" height="54" rx="14" fill="#f6eafd" stroke="#dfc5ef"/>
    <rect x="45" y="190" width="21" height="25" rx="4" fill="#b482d0"/>
    <circle cx="51" cy="197" r="2" fill="#ffffff"/>
    <circle cx="59" cy="197" r="2" fill="#ffffff"/>
    <circle cx="51" cy="205" r="2" fill="#ffffff"/>
    <circle cx="59" cy="205" r="2" fill="#ffffff"/>
    <text x="77" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#68427d">DSKY</text>
    <text x="77" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#89679a">Astronot</text>
  </g>

  <!-- Sol bağlantılar -->
  <path d="M157 118 H199" fill="none" stroke="#89b9d1" stroke-width="2"/>
  <polygon points="199,118 192,114 192,122" fill="#89b9d1"/>
  <path d="M157 204 H199" fill="none" stroke="#bb91cc" stroke-width="2"/>
  <polygon points="199,204 192,200 192,208" fill="#bb91cc"/>

  <!-- AGC merkez -->
  <g filter="url(#shadow)">
    <rect x="199" y="74" width="245" height="177" rx="24" fill="#ffffff" stroke="#d8e2ee"/>
    <rect x="218" y="91" width="207" height="44" rx="14" fill="url(#core)"/>
    <circle cx="244" cy="113" r="14" fill="#ffffff" opacity="0.19"/>
    <path d="M236 113 H252 M244 105 V121" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="267" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">AGC</text>
    <text x="267" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e5eaff">Uçuş bilgisayarı</text>

    <!-- Bellek -->
    <rect x="218" y="151" width="92" height="80" rx="13" fill="#fff4db" stroke="#f0d28c"/>
    <rect x="232" y="164" width="18" height="12" rx="3" fill="#eabf62"/>
    <rect x="232" y="181" width="18" height="12" rx="3" fill="#eabf62"/>
    <rect x="232" y="198" width="18" height="12" rx="3" fill="#eabf62"/>
    <text x="260" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80612b">Bellek</text>
    <text x="260" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#94743c">2 KB</text>
    <text x="260" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#94743c">çalışma alanı</text>

    <!-- Executive -->
    <rect x="322" y="151" width="103" height="80" rx="13" fill="#e6f6ea" stroke="#b9dec1"/>
    <circle cx="342" cy="174" r="10" fill="#75b789"/>
    <path d="M342 168 V174 L347 177" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="359" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7450">Executive</text>
    <text x="337" y="195" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#578467">Öncelik</text>
    <text x="337" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#578467">zamanlama</text>
  </g>

  <!-- Bellekten executive bağlantısı -->
  <path d="M310 191 H322" fill="none" stroke="#d3aa55" stroke-width="2"/>
  <polygon points="322,191 315,187 315,195" fill="#d3aa55"/>

  <!-- Sağ üst program -->
  <g filter="url(#smallShadow)">
    <rect x="480" y="80" width="128" height="64" rx="15" fill="#fff0ed" stroke="#efc6bd"/>
    <path d="M498 99 H512 M498 106 H519 M498 113 H508 M498 120 H516" stroke="#dc8b7b" stroke-width="2" stroke-linecap="round"/>
    <text x="530" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8e5147">Core Rope</text>
    <text x="530" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a46b61">Kalıcı kod</text>
  </g>
  <path d="M444 113 H480" fill="none" stroke="#d89382" stroke-width="2"/>
  <polygon points="480,113 473,109 473,117" fill="#d89382"/>

  <!-- Sağ alt çıktılar -->
  <g filter="url(#smallShadow)">
    <rect x="480" y="177" width="128" height="54" rx="15" fill="#e9f1ff" stroke="#c4d6f2"/>
    <path d="M497 210 C497 196 516 196 516 210" fill="none" stroke="#779cd5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="506" cy="207" r="3" fill="#779cd5"/>
    <text x="530" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466caa">Yönlendirme</text>
    <text x="530" y="217" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6687ba">Motorlar</text>
  </g>
  <path d="M444 204 H480" fill="none" stroke="#769ad1" stroke-width="2"/>
  <polygon points="480,204 473,200 473,208" fill="#769ad1"/>

  <!-- Alarm bandı -->
  <g filter="url(#smallShadow)">
    <rect x="151" y="270" width="338" height="32" rx="14" fill="#fff7df" stroke="#f0d88d"/>
    <circle cx="174" cy="286" r="10" fill="#e7ae45"/>
    <path d="M174 280 V287" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="174" cy="291" r="1.5" fill="#ffffff"/>
    <text x="194" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7d6327">1201 / 1202</text>
    <text x="288" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7440">Yardımcı işleri bırak, kritik görevi sürdür</text>
  </g>
  <path d="M383 251 V270" fill="none" stroke="#d9b55c" stroke-width="2"/>
  <polygon points="383,270 379,263 387,263" fill="#d9b55c"/>
</svg>