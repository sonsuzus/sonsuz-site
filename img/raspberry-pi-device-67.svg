<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e4fc"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#cceacc"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e1ccff"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8ec"/>
      <stop offset="100%" stop-color="#ffccd4"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Device Tree Sorgulayıcı</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="130" width="150" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#7baaf7" stroke-width="1.5"/>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a6b">/proc/device-tree</text>
  <text x="320" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a8b">Düğüm ve Özellikler</text>

  <!-- Sol üst: GPIO -->
  <rect x="40" y="50" width="140" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#5cb85c" stroke-width="1.5"/>
  <text x="110" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5c1a">GPIO</text>
  <text x="110" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a7a2a">gpio@7e200000</text>
  <text x="110" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a9a4a">reg: 0xb4</text>

  <!-- Sol alt: I2C -->
  <rect x="40" y="220" width="140" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#f0ad4e" stroke-width="1.5"/>
  <text x="110" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a4a1a">I2C</text>
  <text x="110" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9a6a2a">i2c@7e804000</text>
  <text x="110" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ba8a4a">reg: 0x1000</text>

  <!-- Sağ üst: SPI -->
  <rect x="460" y="50" width="140" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="530" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a1a6b">SPI</text>
  <text x="530" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a3a8b">spi@7e204000</text>
  <text x="530" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5aab">reg: 0x1000</text>

  <!-- Sağ alt: UART -->
  <rect x="460" y="220" width="140" height="55" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="530" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6b1a1a">UART</text>
  <text x="530" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8b3a3a">uart@7e201000</text>
  <text x="530" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ab5a5a">reg: 0x200</text>

  <!-- Oklar (manuel çizim) -->
  <!-- GPIO -> Merkez -->
  <path d="M180 78 L235 145" stroke="#5cb85c" stroke-width="2" fill="none"/>
  <polygon points="235,145 226,138 228,150" fill="#5cb85c"/>

  <!-- I2C -> Merkez -->
  <path d="M180 248 L235 165" stroke="#f0ad4e" stroke-width="2" fill="none"/>
  <polygon points="235,165 226,158 228,170" fill="#f0ad4e"/>

  <!-- SPI -> Merkez -->
  <path d="M460 78 L405 145" stroke="#9b59b6" stroke-width="2" fill="none"/>
  <polygon points="405,145 396,138 398,150" fill="#9b59b6"/>

  <!-- UART -> Merkez -->
  <path d="M460 248 L405 165" stroke="#e74c3c" stroke-width="2" fill="none"/>
  <polygon points="405,165 396,158 398,170" fill="#e74c3c"/>

  <!-- Alt bilgi: Adres hücreleri -->
  <rect x="200" y="270" width="240" height="35" rx="8" fill="#ffffff" filter="url(#shadow)" stroke="#b0bec5" stroke-width="1" opacity="0.9"/>
  <text x="320" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">#address-cells + #size-cells</text>
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#607d8b">reg = adres + boyut</text>

  <!-- Üst bilgi: ranges dönüşümü -->
  <rect x="200" y="10" width="240" height="30" rx="8" fill="#ffffff" filter="url(#shadow)" stroke="#b0bec5" stroke-width="1" opacity="0.9"/>
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">ranges: bus adresi → CPU adresi</text>

  <!-- Bağlantı çizgileri (üst bilgi) -->
  <line x1="320" y1="40" x2="320" y2="130" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="320,130 315,122 325,122" fill="#90a4ae"/>

  <!-- Bağlantı çizgileri (alt bilgi) -->
  <line x1="320" y1="180" x2="320" y2="270" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="320,270 315,262 325,262" fill="#90a4ae"/>

  <!-- Küçük etiketler -->
  <text x="110" y="45" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">compatible: brcm,bcm2711</text>
  <text x="530" y="45" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">compatible: brcm,bcm2711</text>
  <text x="110" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">compatible: brcm,bcm2711</text>
  <text x="530" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">compatible: brcm,bcm2711</text>

  <!-- Durum etiketleri -->
  <text x="110" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">status: okay</text>
  <text x="530" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">status: okay</text>
  <text x="110" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">status: okay</text>
  <text x="530" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">status: okay</text>
</svg>