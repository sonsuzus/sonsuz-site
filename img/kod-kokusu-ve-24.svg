<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#697de0"/>
      <stop offset="100%" stop-color="#5365c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#53657a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#53657a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="115" fill="#dce8fb" opacity="0.42"/>
  <circle cx="320" cy="160" r="82" fill="#eef5ff" opacity="0.76"/>

  <!-- Bağlantılar -->
  <path d="M195 85 C225 95 238 111 258 126" fill="none" stroke="#a8b7cb" stroke-width="2"/>
  <polygon points="258,126 249,124 253,117" fill="#a8b7cb"/>
  <path d="M445 85 C415 95 402 111 382 126" fill="none" stroke="#a8b7cb" stroke-width="2"/>
  <polygon points="382,126 387,117 391,124" fill="#a8b7cb"/>
  <path d="M197 240 C227 226 240 210 257 193" fill="none" stroke="#a8b7cb" stroke-width="2"/>
  <polygon points="257,193 253,202 248,195" fill="#a8b7cb"/>
  <path d="M443 240 C413 226 400 210 383 193" fill="none" stroke="#a8b7cb" stroke-width="2"/>
  <polygon points="383,193 392,195 387,202" fill="#a8b7cb"/>

  <!-- Akış döngüsü -->
  <path d="M210 133 C208 115 218 102 235 96" fill="none" stroke="#86a9b2" stroke-width="2"/>
  <polygon points="235,96 226,95 230,103" fill="#86a9b2"/>
  <path d="M405 96 C422 102 432 115 430 133" fill="none" stroke="#86a9b2" stroke-width="2"/>
  <polygon points="430,133 424,126 433,126" fill="#86a9b2"/>
  <path d="M430 187 C432 205 422 218 405 224" fill="none" stroke="#86a9b2" stroke-width="2"/>
  <polygon points="405,224 414,225 410,217" fill="#86a9b2"/>
  <path d="M235 224 C218 218 208 205 210 187" fill="none" stroke="#86a9b2" stroke-width="2"/>
  <polygon points="210,187 216,194 207,194" fill="#86a9b2"/>

  <!-- Sol üst: koku -->
  <g filter="url(#soft)">
    <rect x="55" y="51" width="144" height="68" rx="16" fill="#fff6e9"/>
    <rect x="67" y="63" width="28" height="28" rx="9" fill="#f5bf78"/>
    <path d="M76 70 L86 70 M76 77 L86 77 M76 84 L82 84" stroke="#8c5b26" stroke-width="2" stroke-linecap="round"/>
    <text x="105" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#55452f">Kod kokusu</text>
    <text x="105" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#766249">Uzun metot</text>
  </g>

  <!-- Sağ üst: test -->
  <g filter="url(#soft)">
    <rect x="441" y="51" width="144" height="68" rx="16" fill="#eaf8f1"/>
    <rect x="453" y="63" width="28" height="28" rx="9" fill="#8ed1b3"/>
    <path d="M460 77 L466 83 L475 71" fill="none" stroke="#276f56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="491" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315f50">Güvenlik ağı</text>
    <text x="491" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53796c">Testler yeşil</text>
  </g>

  <!-- Sol alt: küçük adım -->
  <g filter="url(#soft)">
    <rect x="55" y="207" width="144" height="68" rx="16" fill="#f0edff"/>
    <rect x="67" y="219" width="28" height="28" rx="9" fill="#b5a5e7"/>
    <path d="M74 233 H87 M82 227 L88 233 L82 239" fill="none" stroke="#594c96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e4675">Tek dönüşüm</text>
    <text x="105" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#706894">Küçük adım</text>
  </g>

  <!-- Sağ alt: temiz -->
  <g filter="url(#soft)">
    <rect x="441" y="207" width="144" height="68" rx="16" fill="#e8f4ff"/>
    <rect x="453" y="219" width="28" height="28" rx="9" fill="#8ebee4"/>
    <path d="M460 239 H474 M460 233 H470 M460 227 H474" stroke="#28638d" stroke-width="2" stroke-linecap="round"/>
    <text x="491" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345b78">Temiz yapı</text>
    <text x="491" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567994">Ayrık sorumluluk</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="247" y="119" width="146" height="82" rx="23" fill="url(#core)"/>
    <circle cx="276" cy="150" r="16" fill="#ffffff" opacity="0.18"/>
    <path d="M268 151 L274 157 L286 143" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="298" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Yeniden</text>
    <text x="298" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf0ff">düzenleme</text>
    <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e4e9ff">Davranış korunur</text>
  </g>

  <!-- Alt bilgi -->
  <g filter="url(#soft)">
    <rect x="218" y="285" width="204" height="25" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="320" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526476">Risk = karmaşıklık × kapsam × test açığı</text>
  </g>
</svg>