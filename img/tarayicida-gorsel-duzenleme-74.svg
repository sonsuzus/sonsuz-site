<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="canvasGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8ecff"/>
      <stop offset="100%" stop-color="#e2f6ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="67" cy="45" r="72" fill="#dceeff" opacity="0.52"/>
  <circle cx="588" cy="275" r="96" fill="#ddf3e5" opacity="0.55"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516c">Tarayıcıda Görsel Düzenleme</text>

  <!-- Source -->
  <g filter="url(#shadow)">
    <rect x="28" y="117" width="108" height="86" rx="18" fill="#ffffff"/>
    <rect x="42" y="132" width="80" height="48" rx="8" fill="#ffd6bf"/>
    <circle cx="62" cy="148" r="7" fill="#fff3c4"/>
    <path d="M44 174 L66 156 L79 167 L91 151 L120 174 Z" fill="#91c9ae"/>
    <rect x="51" y="187" width="62" height="5" rx="2.5" fill="#d6e3ec"/>
  </g>
  <text x="82" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40596f">Görsel Dosya</text>

  <!-- arrow source central -->
  <path d="M141 160 H178" fill="none" stroke="#80a5b9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="178,160 170,155 170,165" fill="#80a5b9"/>

  <!-- Core Browser -->
  <g filter="url(#shadow)">
    <rect x="184" y="78" width="218" height="164" rx="22" fill="#ffffff"/>
    <rect x="184" y="78" width="218" height="32" rx="22" fill="#dcecff"/>
    <rect x="184" y="96" width="218" height="14" fill="#dcecff"/>
    <circle cx="205" cy="94" r="4" fill="#f49d9d"/>
    <circle cx="219" cy="94" r="4" fill="#f4ca7a"/>
    <circle cx="233" cy="94" r="4" fill="#89cfa1"/>
    <text x="294" y="99" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516c">Tarayıcı</text>

    <rect x="203" y="123" width="78" height="91" rx="12" fill="url(#canvasGrad)"/>
    <path d="M212 197 L231 174 L245 187 L259 163 L273 197 Z" fill="#78bfa2"/>
    <circle cx="228" cy="150" r="9" fill="#fff0a8"/>
    <rect x="214" y="132" width="55" height="73" rx="8" fill="none" stroke="#5d98c1" stroke-width="2" stroke-dasharray="5 4"/>

    <g filter="url(#smallShadow)">
      <rect x="296" y="124" width="86" height="22" rx="8" fill="#f6e7ff"/>
      <text x="339" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72508a">Canvas ve WebGL</text>
      <rect x="296" y="153" width="86" height="22" rx="8" fill="#e5f4e9"/>
      <text x="339" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#46755a">Piksel İşleme</text>
      <rect x="296" y="182" width="86" height="22" rx="8" fill="#fff0d9"/>
      <text x="339" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#886238">Yerel Gizlilik</text>
    </g>
  </g>

  <!-- tools spine -->
  <path d="M405 160 H430" fill="none" stroke="#80a5b9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="430,160 422,155 422,165" fill="#80a5b9"/>
  <path d="M432 73 V247" fill="none" stroke="#afc5d1" stroke-width="2" stroke-linecap="round"/>

  <!-- top tool -->
  <path d="M432 73 H455" fill="none" stroke="#80a5b9" stroke-width="2"/>
  <polygon points="455,73 447,68 447,78" fill="#80a5b9"/>
  <g filter="url(#shadow)">
    <rect x="459" y="42" width="153" height="63" rx="16" fill="#ffffff"/>
    <rect x="471" y="55" width="28" height="28" rx="8" fill="#d9eaff"/>
    <path d="M478 76 L484 64 L490 70 L495 61" fill="none" stroke="#5783ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="66" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516c">Photopea</text>
    <text x="510" y="84" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687f90">Katmanlı stüdyo</text>
  </g>

  <!-- mid tool -->
  <path d="M432 160 H455" fill="none" stroke="#80a5b9" stroke-width="2"/>
  <polygon points="455,160 447,155 447,165" fill="#80a5b9"/>
  <g filter="url(#shadow)">
    <rect x="459" y="129" width="153" height="63" rx="16" fill="#ffffff"/>
    <rect x="471" y="142" width="28" height="28" rx="8" fill="#e5f4e9"/>
    <path d="M478 151 H492 M478 157 H488 M478 163 H492" stroke="#5b9b70" stroke-width="2" stroke-linecap="round"/>
    <text x="510" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516c">Pintura</text>
    <text x="510" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687f90">Ürüne gömülü</text>
  </g>

  <!-- bottom tool -->
  <path d="M432 247 H455" fill="none" stroke="#80a5b9" stroke-width="2"/>
  <polygon points="455,247 447,242 447,252" fill="#80a5b9"/>
  <g filter="url(#shadow)">
    <rect x="459" y="216" width="153" height="63" rx="16" fill="#ffffff"/>
    <rect x="471" y="229" width="28" height="28" rx="8" fill="#fff0d9"/>
    <path d="M478 237 L485 244 L478 251 M492 237 L485 244 L492 251" fill="none" stroke="#b78142" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="240" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36516c">TUI Image Editor</text>
    <text x="510" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687f90">Açık kaynak</text>
  </g>

  <!-- action pills -->
  <g filter="url(#smallShadow)">
    <rect x="164" y="266" width="81" height="25" rx="12" fill="#ffffff"/>
    <text x="204" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536e81">Kırpma</text>
    <rect x="253" y="266" width="118" height="25" rx="12" fill="#ffffff"/>
    <text x="312" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536e81">Yeniden boyut</text>
    <rect x="379" y="266" width="76" height="25" rx="12" fill="#ffffff"/>
    <text x="417" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536e81">Açıklama</text>
  </g>
</svg>