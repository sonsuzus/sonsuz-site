<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Bilimsel Programlama: Eğik Atış ve Euler Metodu</text>

  <!-- 4 Adım - Sol üstten sağa -->
  <!-- Adım 1: Hazırlık -->
  <rect x="30" y="50" width="120" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="90" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">1. Hazırlık</text>
  <text x="90" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e3a8a">Sabitler, sınıflar</text>
  <text x="90" y="99" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e3a8a">ve veri yapıları</text>

  <!-- Ok 1 -> 2 -->
  <path d="M 150 77 L 185 77" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="185,77 177,72 177,82" fill="#64748b"/>

  <!-- Adım 2: Hesaplama -->
  <rect x="190" y="50" width="120" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="250" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#166534">2. Hesaplama</text>
  <text x="250" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#166534">Gerçek çözüm</text>
  <text x="250" y="99" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#166534">ve Euler adımları</text>

  <!-- Ok 2 -> 3 -->
  <path d="M 310 77 L 345 77" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="345,77 337,72 337,82" fill="#64748b"/>

  <!-- Adım 3: Veri Analizi -->
  <rect x="350" y="50" width="120" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="410" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">3. Veri Analizi</text>
  <text x="410" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#854d0e">Gerçek ve Euler</text>
  <text x="410" y="99" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#854d0e">farkı (hata)</text>

  <!-- Ok 3 -> 4 -->
  <path d="M 470 77 L 505 77" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="505,77 497,72 497,82" fill="#64748b"/>

  <!-- Adım 4: Görselleştirme -->
  <rect x="510" y="50" width="110" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="565" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#9d174d">4. Görselleştirme</text>
  <text x="565" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9d174d">Konum, hız</text>
  <text x="565" y="99" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9d174d">ve hata grafikleri</text>

  <!-- Orta bölüm: Fizik modeli -->
  <rect x="130" y="135" width="380" height="75" rx="12" fill="url(#box5)" filter="url(#shadow)"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3730a3">Eğik Atış Modeli</text>

  <!-- Konum formülleri -->
  <text x="320" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3730a3">rx(t) = rx(0) + vx(0)·t</text>
  <text x="320" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3730a3">ry(t) = ry(0) + vy(0)·t − ½·g·t²</text>
  <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3730a3">vy(t) = vy(0) − g·t</text>

  <!-- Alt bölüm: Euler karşılaştırması -->
  <rect x="130" y="235" width="180" height="60" rx="10" fill="url(#box6)" filter="url(#shadow)"/>
  <text x="220" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">Euler Yöntemi</text>
  <text x="220" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">Adım büyüklüğü: 0.5 sn</text>
  <text x="220" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">Konum hatası: %4</text>

  <rect x="340" y="235" width="180" height="60" rx="10" fill="url(#box6)" filter="url(#shadow)"/>
  <text x="430" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#334155">Gerçek Çözüm</text>
  <text x="430" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">Analitik formüller</text>
  <text x="430" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">Hata: 0 (kayan nokta)</text>

  <!-- Ok: Model -> Euler -->
  <path d="M 320 210 L 220 233" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="220,233 228,230 227,239" fill="#64748b"/>

  <!-- Ok: Model -> Gerçek -->
  <path d="M 320 210 L 430 233" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="430,233 422,230 423,239" fill="#64748b"/>

  <!-- Ok: Euler <-> Gerçek (karşılaştırma) -->
  <path d="M 322 265 L 338 265" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" fill="none"/>
  <polygon points="338,265 330,261 330,269" fill="#ef4444"/>
  <polygon points="322,265 330,261 330,269" fill="#ef4444"/>

  <!-- Küçük etiket: karşılaştırma -->
  <text x="330" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ef4444">fark</text>
</svg>