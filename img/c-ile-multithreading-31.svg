<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d7f3e5"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7891a5" flood-opacity="0.22"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7891a5" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="320" cy="160" r="122" fill="#d9eefa" opacity="0.34"/>
  <circle cx="320" cy="160" r="92" fill="#ffffff" opacity="0.32"/>

  <!-- Bağlantılar -->
  <path d="M251 142 C224 132 206 119 183 108" fill="none" stroke="#7e9db4" stroke-width="2.2"/>
  <polygon points="178,105 186,105 182,112" fill="#7e9db4"/>
  <path d="M389 142 C416 132 434 119 457 108" fill="none" stroke="#7e9db4" stroke-width="2.2"/>
  <polygon points="462,105 454,105 458,112" fill="#7e9db4"/>
  <path d="M260 194 C230 207 205 220 177 234" fill="none" stroke="#7e9db4" stroke-width="2.2"/>
  <polygon points="172,237 178,230 181,237" fill="#7e9db4"/>
  <path d="M380 194 C410 207 435 220 463 234" fill="none" stroke="#7e9db4" stroke-width="2.2"/>
  <polygon points="468,237 459,237 462,230" fill="#7e9db4"/>

  <!-- Sol üst TPL -->
  <g filter="url(#golge)">
    <rect x="46" y="55" width="142" height="78" rx="18" fill="#fff4da"/>
    <rect x="58" y="67" width="34" height="34" rx="10" fill="#f5c76c"/>
    <path d="M67 77 h16 M67 84 h16 M71 91 h8" stroke="#8c641b" stroke-width="2" stroke-linecap="round"/>
    <text x="105" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d4534" font-weight="700">TPL</text>
    <text x="105" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#746650">CPU hesaplama</text>
    <text x="58" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a754d">Parallel • Task.Run</text>
  </g>

  <!-- Sağ üst Async -->
  <g filter="url(#golge)">
    <rect x="452" y="55" width="142" height="78" rx="18" fill="#e5f5ef"/>
    <rect x="464" y="67" width="34" height="34" rx="10" fill="#83cfad"/>
    <path d="M473 85 h16 M481 77 v16" stroke="#216e55" stroke-width="2.2" stroke-linecap="round"/>
    <text x="511" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35594c" font-weight="700">async / await</text>
    <text x="511" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58786c">Beklemeli I/O</text>
    <text x="464" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#558270">Ağ • Dosya • Veri</text>
  </g>

  <!-- Sol alt ThreadPool -->
  <g filter="url(#golge)">
    <rect x="38" y="211" width="150" height="67" rx="18" fill="#eee9fb"/>
    <circle cx="64" cy="238" r="16" fill="#bba8e7"/>
    <path d="M57 238 h14 M64 231 v14" stroke="#594784" stroke-width="2" stroke-linecap="round"/>
    <text x="91" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e4268" font-weight="700">İş Parçacığı Havuzu</text>
    <text x="58" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75688f">Çekirdeklere dağıtım</text>
  </g>

  <!-- Sağ alt Güvenlik -->
  <g filter="url(#golge)">
    <rect x="452" y="211" width="150" height="67" rx="18" fill="#fde9e8"/>
    <rect x="466" y="222" width="29" height="31" rx="8" fill="#efaaa4"/>
    <path d="M473 236 v-4 a7 7 0 0 1 14 0 v4 M471 236 h18 v12 h-18 z" fill="none" stroke="#914a49" stroke-width="2" stroke-linejoin="round"/>
    <text x="509" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#694346" font-weight="700">Güvenli Durum</text>
    <text x="466" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#956267">lock • Interlocked • İptal</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#golge)">
    <rect x="247" y="115" width="146" height="92" rx="26" fill="url(#merkez)" stroke="#c6dfed" stroke-width="1.5"/>
    <circle cx="320" cy="144" r="17" fill="#ffffff" opacity="0.86"/>
    <path d="M312 144 h16 M320 136 v16" stroke="#4684a2" stroke-width="2.4" stroke-linecap="round"/>
    <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31596c" font-weight="700">Görev Orkestrasyonu</text>
    <text x="320" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7f8e">Task</text>
  </g>

  <!-- Alt ölçüm şeridi -->
  <g filter="url(#hafifGolge)">
    <rect x="222" y="279" width="196" height="26" rx="13" fill="#ffffff" opacity="0.92"/>
    <path d="M242 293 h18 l5-7 8 12 8-9 8 4 h18" fill="none" stroke="#62a68b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="307" y="297" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52746a">Ölç, sonra paralelleştir</text>
  </g>
</svg>