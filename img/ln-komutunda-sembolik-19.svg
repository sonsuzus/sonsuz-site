<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="inodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9d6f5"/>
      <stop offset="100%" stop-color="#d9ebfb"/>
    </linearGradient>
    <linearGradient id="hardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8efd7"/>
      <stop offset="100%" stop-color="#e5f8eb"/>
    </linearGradient>
    <linearGradient id="softGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8d5bd"/>
      <stop offset="100%" stop-color="#fff0e4"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9cdf5"/>
      <stop offset="100%" stop-color="#eee9fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6d8294" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6d8294" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="78" cy="49" r="55" fill="#d8eff0" opacity="0.42"/>
  <circle cx="593" cy="278" r="70" fill="#e2dafa" opacity="0.34"/>
  <path d="M36 158 C106 118 128 211 194 168 S297 120 340 151" fill="none" stroke="#d2e7e7" stroke-width="2" opacity="0.7"/>
  <path d="M342 151 C410 118 457 205 601 142" fill="none" stroke="#d9e3f3" stroke-width="2" opacity="0.8"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e5869">ln Bağları: İsim, Inode ve Veri</text>

  <!-- Sol: sabit bağ -->
  <rect x="38" y="68" width="144" height="48" rx="14" fill="url(#hardGrad)" filter="url(#shadow)"/>
  <rect x="38" y="68" width="144" height="48" rx="14" fill="none" stroke="#9ccfb0"/>
  <text x="110" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35684a">rapor.txt</text>
  <text x="110" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#578067">Sabit bağ</text>

  <rect x="38" y="194" width="144" height="48" rx="14" fill="url(#hardGrad)" filter="url(#shadow)"/>
  <rect x="38" y="194" width="144" height="48" rx="14" fill="none" stroke="#9ccfb0"/>
  <text x="110" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35684a">rapor-yedek.txt</text>
  <text x="110" y="231" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#578067">Aynı inode</text>

  <!-- Bağlar sol -->
  <path d="M182 92 C211 92 218 115 240 133" fill="none" stroke="#67a982" stroke-width="2.5"/>
  <polygon points="238,127 250,140 234,137" fill="#67a982"/>
  <path d="M182 218 C211 218 218 195 240 178" fill="none" stroke="#67a982" stroke-width="2.5"/>
  <polygon points="234,173 250,170 238,183" fill="#67a982"/>

  <!-- Merkez inode -->
  <rect x="248" y="112" width="144" height="96" rx="22" fill="url(#inodeGrad)" filter="url(#shadow)"/>
  <rect x="248" y="112" width="144" height="96" rx="22" fill="none" stroke="#92bddd"/>
  <circle cx="320" cy="142" r="17" fill="#eef8ff" stroke="#7eafd3" stroke-width="1.5"/>
  <circle cx="320" cy="142" r="5" fill="#76a8cf"/>
  <text x="320" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b79">inode 1842</text>
  <text x="320" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52758e">Bağ sayısı: 2</text>

  <!-- Veri -->
  <path d="M392 160 L436 160" fill="none" stroke="#7698bb" stroke-width="2.5"/>
  <polygon points="431,154 443,160 431,166" fill="#7698bb"/>
  <rect x="443" y="133" width="94" height="54" rx="16" fill="url(#dataGrad)" filter="url(#softShadow)"/>
  <rect x="443" y="133" width="94" height="54" rx="16" fill="none" stroke="#b1a2d8"/>
  <path d="M467 149 h45 M467 158 h45 M467 167 h31" stroke="#897bb8" stroke-width="2" stroke-linecap="round"/>
  <text x="490" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f5680">Veri blokları</text>

  <!-- Sağ: sembolik bağ -->
  <rect x="458" y="54" width="145" height="54" rx="14" fill="url(#softGrad)" filter="url(#shadow)"/>
  <rect x="458" y="54" width="145" height="54" rx="14" fill="none" stroke="#e4ac88"/>
  <text x="530" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8b5132">rapor-kisayol.txt</text>
  <text x="530" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a46d4d">Sembolik bağ</text>

  <path d="M512 108 C487 119 466 122 431 128" fill="none" stroke="#d5875d" stroke-width="2.5" stroke-dasharray="5 4"/>
  <polygon points="435,121 421,130 437,133" fill="#d5875d"/>
  <rect x="458" y="116" width="145" height="30" rx="10" fill="#fff8f2" opacity="0.92"/>
  <text x="530" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b6547">Yol: rapor.txt</text>

  <!-- Alt notlar -->
  <rect x="38" y="269" width="242" height="32" rx="12" fill="#e6f7eb" filter="url(#softShadow)"/>
  <circle cx="57" cy="285" r="9" fill="#72b68d"/>
  <path d="M53 285 l3 3 6 -7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426d51">Ad silinse bile veri erişilebilir</text>

  <rect x="333" y="269" width="270" height="32" rx="12" fill="#fff0e7" filter="url(#softShadow)"/>
  <circle cx="352" cy="285" r="9" fill="#d8865c"/>
  <path d="M348 281 l8 8 M356 281 l-8 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="368" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b593e">Hedef taşınırsa bağ kırılabilir</text>
</svg>