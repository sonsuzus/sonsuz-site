<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">PHP Veri Türleri</text>

  <!-- Merkez düğüm -->
  <rect x="265" y="50" width="110" height="36" rx="18" fill="#4a90d9" filter="url(#shadow)"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" fill="#fff" font-weight="bold">PHP</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Temel türlere oklar -->
  <path d="M 275 86 L 120 130" stroke="#5a6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="120,130 128,124 124,134" fill="#5a6b7a"/>
  <path d="M 310 86 L 310 130" stroke="#5a6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="310,130 304,124 316,124" fill="#5a6b7a"/>
  <path d="M 345 86 L 520 130" stroke="#5a6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="520,130 512,124 516,134" fill="#5a6b7a"/>

  <!-- Bileşik türlere ok -->
  <path d="M 320 86 L 320 210" stroke="#5a6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="320,210 314,204 326,204" fill="#5a6b7a"/>

  <!-- Özel türlere ok -->
  <path d="M 320 86 L 320 270" stroke="#5a6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="320,270 314,264 326,264" fill="#5a6b7a"/>

  <!-- Temel Veri Türleri -->
  <rect x="45" y="130" width="150" height="28" rx="14" fill="#e8f4f8" stroke="#4a90d9" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Temel Türler</text>

  <rect x="30" y="165" width="90" height="24" rx="12" fill="#d4eaf7" filter="url(#shadow)"/>
  <text x="75" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">boolean</text>

  <rect x="130" y="165" width="80" height="24" rx="12" fill="#d4eaf7" filter="url(#shadow)"/>
  <text x="170" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">integer</text>

  <rect x="30" y="196" width="90" height="24" rx="12" fill="#d4eaf7" filter="url(#shadow)"/>
  <text x="75" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">float</text>

  <rect x="130" y="196" width="80" height="24" rx="12" fill="#d4eaf7" filter="url(#shadow)"/>
  <text x="170" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">string</text>

  <!-- Bileşik Veri Türleri -->
  <rect x="245" y="210" width="150" height="28" rx="14" fill="#e8f8e8" stroke="#27ae60" stroke-width="1" filter="url(#shadow)"/>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Bileşik Türler</text>

  <rect x="235" y="245" width="70" height="24" rx="12" fill="#d5f5e3" filter="url(#shadow)"/>
  <text x="270" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Dizi</text>

  <rect x="315" y="245" width="80" height="24" rx="12" fill="#d5f5e3" filter="url(#shadow)"/>
  <text x="355" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Nesne</text>

  <!-- Özel Veri Türleri -->
  <rect x="245" y="270" width="150" height="28" rx="14" fill="#fdf2e9" stroke="#e67e22" stroke-width="1" filter="url(#shadow)"/>
  <text x="320" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Özel Türler</text>

  <rect x="235" y="305" width="80" height="24" rx="12" fill="#fdebd0" filter="url(#shadow)"/>
  <text x="275" y="321" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">resource</text>

  <rect x="325" y="305" width="60" height="24" rx="12" fill="#fdebd0" filter="url(#shadow)"/>
  <text x="355" y="321" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">NULL</text>

  <!-- Sözde Veri Türleri -->
  <rect x="470" y="130" width="140" height="28" rx="14" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1" filter="url(#shadow)"/>
  <text x="540" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Sözde Türler</text>

  <rect x="480" y="165" width="60" height="24" rx="12" fill="#e8daef" filter="url(#shadow)"/>
  <text x="510" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">mixed</text>

  <rect x="550" y="165" width="70" height="24" rx="12" fill="#e8daef" filter="url(#shadow)"/>
  <text x="585" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">number</text>

  <rect x="480" y="196" width="70" height="24" rx="12" fill="#e8daef" filter="url(#shadow)"/>
  <text x="515" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">callback</text>

  <rect x="560" y="196" width="60" height="24" rx="12" fill="#e8daef" filter="url(#shadow)"/>
  <text x="590" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">void</text>

  <!-- Sözde türlere ok -->
  <path d="M 375 86 L 540 130" stroke="#5a6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="540,130 532,124 536,134" fill="#5a6b7a"/>

  <!-- Açıklama notu -->
  <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d" opacity="0.8">PHP 8'de 10 temel, bileşik ve özel veri türü</text>
</svg>