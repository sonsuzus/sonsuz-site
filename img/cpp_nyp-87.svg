<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C++ Nesneye Yönelik Programlama</text>

  <!-- Evrim akışı - soldan sağa -->
  <text x="30" y="60" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">Evrim:</text>

  <!-- Makine Kodu -->
  <rect x="30" y="70" width="100" height="44" rx="8" fill="#e2e8f0" filter="url(#shadow)"/>
  <text x="80" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">Makine Kodu</text>
  <text x="80" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">(0 ve 1)</text>

  <!-- Ok -->
  <polygon points="135,92 145,92 145,88 155,92 145,96 145,92" fill="#94a3b8"/>

  <!-- Assembly -->
  <rect x="160" y="70" width="100" height="44" rx="8" fill="#e2e8f0" filter="url(#shadow)"/>
  <text x="210" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">Assembly</text>
  <text x="210" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">(düşük seviye)</text>

  <!-- Ok -->
  <polygon points="265,92 275,92 275,88 285,92 275,96 275,92" fill="#94a3b8"/>

  <!-- Yapısal -->
  <rect x="290" y="70" width="100" height="44" rx="8" fill="#e2e8f0" filter="url(#shadow)"/>
  <text x="340" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">Yapısal</text>
  <text x="340" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">(C, Pascal)</text>

  <!-- Ok -->
  <polygon points="395,92 405,92 405,88 415,92 405,96 405,92" fill="#94a3b8"/>

  <!-- OOP -->
  <rect x="420" y="70" width="110" height="44" rx="8" fill="url(#box1)" filter="url(#shadow)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="475" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">NYP</text>
  <text x="475" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e40af">(C++)</text>

  <!-- Ana OOP kavramları -->
  <text x="30" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">Temel Kavramlar:</text>

  <!-- Sınıf -->
  <rect x="30" y="160" width="120" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="90" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Sınıf</text>
  <text x="90" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#92400e">(veri + metod)</text>

  <!-- Nesne -->
  <rect x="180" y="160" width="120" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="240" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">Nesne</text>
  <text x="240" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#065f46">(sınıf örneği)</text>

  <!-- Miras -->
  <rect x="330" y="160" width="120" height="50" rx="10" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="390" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Miras</text>
  <text x="390" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#9d174d">(kalıtım)</text>

  <!-- Metod -->
  <rect x="480" y="160" width="130" height="50" rx="10" fill="url(#box5)" filter="url(#shadow)"/>
  <text x="545" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">Metod</text>
  <text x="545" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4338ca">(fonksiyon)</text>

  <!-- Bağlantı çizgileri -->
  <line x1="150" y1="185" x2="180" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="185" x2="330" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="450" y1="185" x2="480" y2="185" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Özellikler -->
  <text x="30" y="240" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">Özellikler:</text>

  <rect x="30" y="250" width="180" height="50" rx="10" fill="url(#box6)" filter="url(#shadow)"/>
  <text x="120" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Kod Tekrarını Azaltır</text>
  <text x="120" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#991b1b">(yeniden kullanılabilirlik)</text>

  <rect x="240" y="250" width="180" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="330" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Veri Soyutlama</text>
  <text x="330" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1e40af">(kapsülleme)</text>

  <rect x="450" y="250" width="160" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="530" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">Çok Biçimlilik</text>
  <text x="530" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#065f46">(polimorfizm)</text>

  <!-- OOP kavramına bağlantı -->
  <line x1="475" y1="114" x2="475" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="471,140 475,148 479,140" fill="#94a3b8"/>

</svg>