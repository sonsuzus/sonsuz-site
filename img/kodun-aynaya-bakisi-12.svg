  <text x="103" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d75">Tekrar azalır</text>
  <path d="M191 280h24" stroke="#b6c9cc" stroke-width="1.5"/>
  <circle cx="234" cy="280" r="10" fill="#fff0d5"/>
  <path d="M234 274v7M234 286v1" stroke="#b17d2f" stroke-width="2" stroke-linecap="round"/>
  <text x="252" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d75">Gizli karmaşıklık izlenmeli</text>
</svg>