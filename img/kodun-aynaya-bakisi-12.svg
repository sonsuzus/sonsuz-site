  <circle cx="216" cy="84" r="12" fill="#ffe7a8"/>
  <path d="M211 84h10M216 79v10" stroke="#ab7a25" stroke-width="2" stroke-linecap="round"/>
  <text x="257" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#75603a">Yapılandırma</text>
  <text x="257" y="97" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#897755">C</text>

