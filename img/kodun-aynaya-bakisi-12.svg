<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#d9f1e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#58708a" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#58708a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="53" cy="51" r="71" fill="#dceeff" opacity="0.48"/>
  <circle cx="600" cy="276" r="88" fill="#dcefdc" opacity="0.5"/>
  <path d="M30 260 C125 215 150 298 240 265 S385 215 465 264 S570 282 625 232" fill="none" stroke="#c6dfd2" stroke-width="2" opacity="0.55"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40566d">KODUN AYNAYA BAKIŞI</text>

  <!-- Input source -->
  <g filter="url(#smallShadow)">
    <rect x="31" y="104" width="132" height="108" rx="18" fill="#fffdfb"/>
