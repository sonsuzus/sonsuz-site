  <path d="M379 129C399 111 411 100 431 98" fill="none" stroke="#896aa0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="436,97 427,93 430,103" fill="#896aa0"/>

  <!-- output -->
  <path d="M410 187H449" fill="none" stroke="#5f9295" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="454,187 445,182 445,192" fill="#5f9295"/>
  <g filter="url(#shadow)">
    <rect x="455" y="156" width="153" height="105" rx="19" fill="#eaf7ef" stroke="#b9ddc5"/>
