  <rect x="473" y="175" width="30" height="35" rx="6" fill="#d5f0df" stroke="#91c4a2"/>
  <path d="M480 185h16M480 192h16M480 199h11" stroke="#52916b" stroke-width="2" stroke-linecap="round"/>
  <text x="550" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386b4e">Üretilmiş Kod</text>
  <text x="550" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8069">P'</text>
  <rect x="474" y="222" width="116" height="21" rx="10.5" fill="#dff2e6"/>
  <text x="532" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e7b5e">Derleme zamanı</text>

