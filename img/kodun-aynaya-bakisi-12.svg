  <text x="93" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#738394">P</text>
  <rect x="48" y="174" width="98" height="20" rx="10" fill="#edf5ff"/>
  <text x="97" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58738e">İfade ve kurallar</text>

