<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#90a4ae" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#90a4ae" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#37474f">C++ İlk Program Akışı</text>

  <!-- Kaynak kod bloğu -->
  <rect x="30" y="50" width="180" height="100" rx="10" fill="#fff3e0" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="120" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Kaynak Kod</text>
  <text x="120" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">#include</text>
  <text x="120" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">using namespace</text>
  <text x="120" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">int main()</text>
  <text x="120" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">cout &lt;&lt; ...</text>

  <!-- Ok 1 -->
  <polygon points="215,100 235,95 235,105" fill="#546e7a"/>
  <line x1="210" y1="100" x2="235" y2="100" stroke="#546e7a" stroke-width="2"/>

  <!-- Önişlemci -->
  <rect x="240" y="50" width="160" height="100" rx="10" fill="#e3f2fd" filter="url(#shadow)" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="320" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Önişlemci</text>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a237e">#include iostream</text>
  <text x="320" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a237e">başlık dosyasını</text>
  <text x="320" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a237e">programa ekler</text>

  <!-- Ok 2 -->
  <polygon points="405,100 425,95 425,105" fill="#546e7a"/>
  <line x1="400" y1="100" x2="425" y2="100" stroke="#546e7a" stroke-width="2"/>

  <!-- Derleyici -->
  <rect x="430" y="50" width="180" height="100" rx="10" fill="#fce4ec" filter="url(#shadow)" stroke="#f06292" stroke-width="1.5"/>
  <text x="520" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Derleyici</text>
  <text x="520" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">Büyük/küçük harf</text>
  <text x="520" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">duyarlılığı</text>
  <text x="520" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">kod üretimi</text>

  <!-- Alt akış: Yorumlar -->
  <rect x="30" y="190" width="180" height="80" rx="10" fill="#e8f5e9" filter="url(#shadowLight)" stroke="#81c784" stroke-width="1.5"/>
  <text x="120" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Yorumlar</text>
  <text x="120" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">// ile başlar</text>
  <text x="120" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">derleyici işlemez</text>

  <!-- Ok 3 -->
  <polygon points="215,230 235,225 235,235" fill="#546e7a"/>
  <line x1="210" y1="230" x2="235" y2="230" stroke="#546e7a" stroke-width="2"/>

  <!-- İsim alanı -->
  <rect x="240" y="190" width="160" height="80" rx="10" fill="#ede7f6" filter="url(#shadowLight)" stroke="#9575cd" stroke-width="1.5"/>
  <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4527a0">İsim Alanı</text>
  <text x="320" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">std kullanımı</text>
  <text x="320" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">cout erişimi</text>

  <!-- Ok 4 -->
  <polygon points="405,230 425,225 425,235" fill="#546e7a"/>
  <line x1="400" y1="230" x2="425" y2="230" stroke="#546e7a" stroke-width="2"/>

  <!-- Çıktı -->
  <rect x="430" y="190" width="180" height="80" rx="10" fill="#fff8e1" filter="url(#shadowLight)" stroke="#ffd54f" stroke-width="1.5"/>
  <text x="520" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#f57f17">Program Çıktısı</text>
  <text x="520" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">"C++ Programlama Dili"</text>
  <text x="520" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">return 0</text>

  <!-- Dikey bağlantı çizgileri -->
  <line x1="120" y1="150" x2="120" y2="190" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="320" y1="150" x2="320" y2="190" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="520" y1="150" x2="520" y2="190" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c" font-style="italic">Derleme ve çalıştırma süreci</text>
</svg>