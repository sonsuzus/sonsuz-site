<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#5a5a7a" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#5a5a7a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f9fd"/>
      <stop offset="100%" stop-color="#eef0f8"/>
    </linearGradient>
    <linearGradient id="boxMaze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8e6cf"/>
      <stop offset="100%" stop-color="#8fd3b7"/>
    </linearGradient>
    <linearGradient id="boxCube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd3b6"/>
      <stop offset="100%" stop-color="#f2b8a0"/>
    </linearGradient>
    <linearGradient id="boxCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcf0ff"/>
      <stop offset="100%" stop-color="#b8d9f0"/>
    </linearGradient>
    <linearGradient id="boxTech" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5f4"/>
      <stop offset="100%" stop-color="#d4b8e8"/>
    </linearGradient>
    <linearGradient id="boxTrade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5aa"/>
      <stop offset="100%" stop-color="#f5d78a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#7a7a9a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="640" height="320" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3d3d5c">Zekâ Oyunları için Algoritma Optimizasyonu</text>

  <!-- Core Search Space Box -->
  <rect x="245" y="52" width="150" height="48" rx="14" fill="url(#boxCore)" filter="url(#shadow)" stroke="#9bb8d4" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c4a6e">Arama Uzayı</text>
  <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4a6a8a">O(b^d) · Big O</text>

  <!-- Left Maze Branch -->
  <g>
    <path d="M245,76 L160,76" stroke="#7a9a8a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="40" y="52" width="110" height="48" rx="14" fill="url(#boxMaze)" filter="url(#shadow)" stroke="#7fbfa8" stroke-width="1.5"/>
    <text x="95" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e4a3a">Labirent</text>
    <text x="95" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3a6a5a">A* yıldız oyuncu</text>

    <!-- A* box -->
    <rect x="40" y="120" width="110" height="52" rx="12" fill="#c3e8d8" filter="url(#shadowLight)" stroke="#7fbfa8" stroke-width="1.2"/>
    <text x="95" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e4a3a">A* Algoritması</text>
    <text x="95" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#3a6a5a">f = g + h</text>

    <!-- Heuristic -->
    <rect x="40" y="190" width="110" height="44" rx="10" fill="#d8f0e6" filter="url(#shadowLight)" stroke="#a8d4c0" stroke-width="1"/>
    <text x="95" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#2a5a4a">Sezgisel</text>
    <text x="95" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#4a7a6a">Manhattan mesafesi</text>

    <path d="M95,120 L95,104" stroke="#7fbfa8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M95,170 L95,190" stroke="#7fbfa8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Right Rubik Branch -->
  <g>
    <path d="M395,76 L480,76" stroke="#c49a7a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="490" y="52" width="110" height="48" rx="14" fill="url(#boxCube)" filter="url(#shadow)" stroke="#d4a080" stroke-width="1.5"/>
    <text x="545" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5a2e1e">Rubik Küpü</text>
    <text x="545" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a4a3a">4.3×10^19 durum</text>

    <!-- IDA* box -->
    <rect x="490" y="120" width="110" height="52" rx="12" fill="#f5d8c4" filter="url(#shadowLight)" stroke="#d4a080" stroke-width="1.2"/>
    <text x="545" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#5a2e1e">IDA*</text>
    <text x="545" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a4a3a">hafızada verimli</text>

    <!-- Pattern DB -->
    <rect x="490" y="190" width="110" height="44" rx="10" fill="#fce8d8" filter="url(#shadowLight)" stroke="#e8b898" stroke-width="1"/>
    <text x="545" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#6a3a2a">Pattern DB</text>
    <text x="545" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8a5a4a">önceden hesaplanmış</text>

    <path d="M545,120 L545,104" stroke="#d4a080" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M545,170 L545,190" stroke="#d4a080" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Bottom Techniques Section -->
  <g>
    <path d="M160,212 L160,250" stroke="#7a7a9a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="20" y="256" width="130" height="48" rx="12" fill="url(#boxTrade)" filter="url(#shadowLight)" stroke="#d4b878" stroke-width="1.2"/>
    <text x="85" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#4a3a1e">Zaman vs Bellek</text>
    <text x="85" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6a5a3a">DFS: O(d) bellek</text>

    <path d="M545,212 L545,250" stroke="#7a7a9a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="490" y="256" width="130" height="48" rx="12" fill="url(#boxTrade)" filter="url(#shadowLight)" stroke="#d4b878" stroke-width="1.2"/>
    <text x="555" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#4a3a1e">Temsil Biçimi</text>
    <text x="555" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6a5a3a">bitset, permütasyon</text>

    <!-- Center bottom box -->
    <path d="M320,105 L320,250" stroke="#7a7a9a" stroke-width="1.8" stroke-dasharray="4,3"/>
    <rect x="255" y="256" width="130" height="48" rx="12" fill="url(#boxTech)" filter="url(#shadowLight)" stroke="#b8a0d4" stroke-width="1.2"/>
    <text x="320" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#3a2a5a">Veri Yapıları</text>
    <text x="320" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5a4a7a">set, heap, hash</text>

    <!-- Small algorithm tags -->
    <rect x="220" y="160" width="80" height="30" rx="8" fill="#f0f0fa" filter="url(#shadowLight)" stroke="#c0c0d8" stroke-width="1"/>
    <text x="260" y="179" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5a5a7a">DFS / BFS</text>

    <path d="M260,160 L260,52" stroke="#c0c0d8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Decorative small maze-like pattern -->
  <g opacity="0.3">
    <circle cx="15" cy="150" r="2" fill="#4a7a6a"/>
    <circle cx="25" cy="145" r="2" fill="#4a7a6a"/>
    <circle cx="35" cy="155" r="2" fill="#4a7a6a"/>
    <line x1="15" y1="150" x2="25" y2="145" stroke="#4a7a6a" stroke-width="1"/>
    <line x1="25" y1="145" x2="35" y2="155" stroke="#4a7a6a" stroke-width="1"/>
  </g>
  <g opacity="0.3">
    <circle cx="625" cy="150" r="2" fill="#7a4a3a"/>
    <circle cx="615" cy="145" r="2" fill="#7a4a3a"/>
    <circle cx="605" cy="155" r="2" fill="#7a4a3a"/>
    <line x1="625" y1="150" x2="615" y2="145" stroke="#7a4a3a" stroke-width="1"/>
    <line x1="615" y1="145" x2="605" y2="155" stroke="#7a4a3a" stroke-width="1"/>
  </g>
</svg>