  <g>
    <rect x="469" y="235" width="37" height="21" rx="10" fill="#e1f3e9"/>
    <text x="487" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43876c">↓ km</text>
    <rect x="512" y="235" width="37" height="21" rx="10" fill="#e9e5ff"/>
    <text x="530" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665cae">↓ süre</text>
    <rect x="555" y="235" width="37" height="21" rx="10" fill="#fff0df"/>
    <text x="573" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#b4773b">↓ yakıt</text>
  </g>

  <!-- Alt açıklama -->
  <g opacity="0.9">
    <circle cx="252" cy="286" r="4" fill="#72be9a"/>
    <text x="263" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58708a">Değişen koşullarda yeniden hesaplama</text>
