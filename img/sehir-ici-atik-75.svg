  <text x="50" y="74" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365673">Şehir grafı</text>
  <g stroke="#9aafbd" stroke-width="2" fill="none">
    <path d="M58 111 L91 99 L120 118 L163 102"/>
    <path d="M58 111 L82 132 L120 118 L151 133 L163 102"/>
    <path d="M91 99 L151 133"/>
