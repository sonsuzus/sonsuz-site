    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M0 255 C100 215 149 283 249 245 S421 212 640 269 L640 320 L0 320 Z" fill="#dff2e8" opacity="0.55"/>
  <circle cx="585" cy="45" r="57" fill="#dcefff" opacity="0.45"/>
  <circle cx="52" cy="283" r="62" fill="#d6f0e2" opacity="0.5"/>

