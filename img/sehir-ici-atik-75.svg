  <path d="M331 147 C331 153 326 157 320 157 C314 157 309 153 309 147" fill="none" stroke="#4e9ebb" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M309 147 L313 151 M309 147 L314 144" fill="none" stroke="#4e9ebb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Rota motoru</text>
  <text x="320" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eaf8ff">CVRP · sezgisel</text>

