  <path d="M480 185 C493 164 491 125 516 128 C537 131 520 165 546 166 C569 167 561 121 581 119" fill="none" stroke="#c6d5cf" stroke-width="5" stroke-linecap="round"/>
  <path d="M480 185 C493 164 491 125 516 128 C537 131 520 165 546 166 C569 167 561 121 581 119" fill="none" stroke="#5bba91" stroke-width="3" stroke-linecap="round"/>
