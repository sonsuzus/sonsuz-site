<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa8e8"/>
      <stop offset="100%" stop-color="#5b8ed1"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b27a"/>
      <stop offset="100%" stop-color="#e59866"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#82c9a8"/>
      <stop offset="100%" stop-color="#5fa884"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b39ddb"/>
      <stop offset="100%" stop-color="#9575cd"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#d14b74"/>
    </linearGradient>
  </defs>

  <!-- Arkaplan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Riya'nın Doğum Günü Algoritması</text>

  <!-- Girdi Kutusu -->
  <rect x="30" y="55" width="120" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="90" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff" font-weight="bold">Girdi</text>
  <text x="90" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eaf2ff">T ve N değerleri</text>

  <!-- Ok: Girdi -> Dizi Oluşturma -->
  <path d="M150,80 L190,80" stroke="#5b8ed1" stroke-width="2" fill="none"/>
  <polygon points="195,80 185,75 185,85" fill="#5b8ed1"/>

  <!-- Dizi Oluşturma Kutusu -->
  <rect x="200" y="50" width="140" height="60" rx="10" fill="url(#box2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="270" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff" font-weight="bold">Dizi Üretimi</text>
  <text x="270" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff8ef">a[n+1] = 2a[n] - a[n-1] + 4</text>

  <!-- Ok: Dizi -> Formül Uygula -->
  <path d="M340,80 L380,80" stroke="#e59866" stroke-width="2" fill="none"/>
  <polygon points="385,80 375,75 375,85" fill="#e59866"/>

  <!-- Formül Kutusu -->
  <rect x="390" y="50" width="130" height="60" rx="10" fill="url(#box3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="455" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff" font-weight="bold">İlk Değerler</text>
  <text x="455" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eafff5">a[1] = 1, a[2] = 6</text>

  <!-- Ok: Formül -> Modulo -->
  <path d="M520,80 L555,80" stroke="#5fa884" stroke-width="2" fill="none"/>
  <polygon points="560,80 550,75 550,85" fill="#5fa884"/>

  <!-- Modulo Kutusu -->
  <rect x="565" y="50" width="55" height="60" rx="10" fill="url(#box4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="592" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff" font-weight="bold">Mod</text>
  <text x="592" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#f0eaff">10^9+7</text>

  <!-- Alt satır: Test döngüsü -->
  <rect x="200" y="150" width="180" height="55" rx="10" fill="url(#box5)" filter="url(#shadow)" opacity="0.9"/>
  <text x="290" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff" font-weight="bold">Test Döngüsü</text>
  <text x="290" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ffeaf1">T adet N için çalıştır</text>

  <!-- Ok: Girdi -> Test Döngüsü -->
  <path d="M90,105 L90,130 Q90,140 100,140 L200,140 Q210,140 210,150" stroke="#d14b74" stroke-width="2" fill="none"/>
  <polygon points="210,155 205,145 215,145" fill="#d14b74"/>

  <!-- Ok: Test Döngüsü -> Dizi Üretimi -->
  <path d="M290,150 L290,110" stroke="#d14b74" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="290,105 285,115 295,115" fill="#d14b74"/>

  <!-- Çıktı Kutusu -->
  <rect x="420" y="150" width="130" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)" opacity="0.9"/>
  <text x="485" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#fff" font-weight="bold">Çıktı</text>
  <text x="485" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eaf2ff">N'inci eleman</text>

  <!-- Ok: Modulo -> Çıktı -->
  <path d="M592,110 L592,130 Q592,140 582,140 L550,140 Q540,140 540,150" stroke="#5b8ed1" stroke-width="2" fill="none"/>
  <polygon points="540,155 535,145 545,145" fill="#5b8ed1"/>

  <!-- Örnek notu -->
  <rect x="30" y="230" width="580" height="70" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.7"/>
  <text x="320" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34495e" font-weight="bold">Örnek Akış</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5d6d7e">N = 1 → 1</text>
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5d6d7e">N = 3 → 15 (1, 6, 15)</text>
</svg>