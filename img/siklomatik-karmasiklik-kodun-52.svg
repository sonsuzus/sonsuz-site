<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9be3c5"/>
      <stop offset="50%" stop-color="#ffd78a"/>
      <stop offset="100%" stop-color="#f39b9b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#58708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="84" cy="44" r="60" fill="#cde8fa" opacity="0.28"/>
  <circle cx="582" cy="278" r="90" fill="#d9efd0" opacity="0.36"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34475b">Siklomatik Karmaşıklık</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708194">Kontrol akışından risk haritasına</text>

  <!-- Left source / flow graph panel -->
  <g filter="url(#shadow)">
    <rect x="25" y="70" width="182" height="215" rx="18" fill="#ffffff"/>
  </g>
  <text x="43" y="95" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43627a">Kontrol akış grafiği</text>

  <path d="M78 119 L78 137" stroke="#7892aa" stroke-width="2" fill="none"/>
  <polygon points="78,143 73,135 83,135" fill="#7892aa"/>
  <path d="M78 170 L78 184 L49 184 L49 207" stroke="#7892aa" stroke-width="2" fill="none"/>
  <polygon points="49,213 44,205 54,205" fill="#7892aa"/>
  <path d="M108 154 L153 154 L153 207" stroke="#7892aa" stroke-width="2" fill="none"/>
  <polygon points="153,213 148,205 158,205" fill="#7892aa"/>
  <path d="M49 239 L49 254 L99 254 L99 263" stroke="#7892aa" stroke-width="2" fill="none"/>
  <path d="M153 239 L153 254 L99 254" stroke="#7892aa" stroke-width="2" fill="none"/>
  <polygon points="99,269 94,261 104,261" fill="#7892aa"/>

  <g filter="url(#soft)">
    <rect x="52" y="103" width="52" height="18" rx="9" fill="#bce6d2"/>
    <polygon points="78,137 108,154 78,171 48,154" fill="#cfe6fb"/>
    <rect x="27" y="213" width="44" height="26" rx="8" fill="#ddeefe"/>
    <rect x="131" y="213" width="44" height="26" rx="8" fill="#ffe5ad"/>
    <rect x="72" y="269" width="54" height="17" rx="8.5" fill="#ead8fa"/>
  </g>

  <text x="65" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#285a49">Giriş</text>
  <text x="66" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41627d">if?</text>
  <text x="31" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456681">Yol A</text>
  <text x="135" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c5a1e">Yol B</text>
  <text x="83" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65427e">Çıkış</text>
  <text x="114" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7b8b">evet</text>
  <text x="55" y="180" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7b8b">hayır</text>

  <!-- flow to calculation -->
  <path d="M213 178 C228 178 230 178 244 178" stroke="#7190a9" stroke-width="2.5" fill="none"/>
  <polygon points="251,178 242,173 242,183" fill="#7190a9"/>

  <!-- Center metric -->
  <g filter="url(#shadow)">
    <rect x="250" y="101" width="146" height="154" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="323" cy="135" r="25" fill="#dceeff"/>
  <path d="M309 135 L318 144 L338 124" fill="none" stroke="#4f83a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="276" y="179" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41566b">Bağımsız yollar</text>
  <text x="277" y="207" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65788a">M = E − N + 2P</text>
  <rect x="278" y="220" width="90" height="22" rx="11" fill="#e4f4e7"/>
  <text x="293" y="235" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397052">M = D + 1</text>

  <!-- to risk -->
  <path d="M402 178 C418 178 423 178 437 178" stroke="#7190a9" stroke-width="2.5" fill="none"/>
  <polygon points="444,178 435,173 435,183" fill="#7190a9"/>

  <!-- Right insight panel -->
  <g filter="url(#shadow)">
    <rect x="443" y="70" width="171" height="215" rx="18" fill="#ffffff"/>
  </g>
  <text x="461" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#435f72">Risk ve test sinyali</text>

  <rect x="462" y="115" width="132" height="14" rx="7" fill="url(#risk)"/>
  <circle cx="482" cy="122" r="9" fill="#ffffff" stroke="#5c9a7e" stroke-width="3"/>
  <text x="462" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6677">Düşük</text>
  <text x="540" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6677">Yüksek</text>

  <g filter="url(#soft)">
    <rect x="462" y="166" width="132" height="37" rx="11" fill="#e8f4fd"/>
    <rect x="462" y="214" width="132" height="37" rx="11" fill="#fff1d7"/>
  </g>
  <circle cx="480" cy="184" r="8" fill="#74b6dd"/>
  <path d="M476 184 L479 187 L485 180" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="496" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42647d">En az M test</text>

  <path d="M475 232 L485 232 M480 227 L480 237" stroke="#cf8b3e" stroke-width="2" stroke-linecap="round"/>
  <text x="496" y="236" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76582d">İncele ve böl</text>

  <text x="462" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b8995">Karar arttıkça risk artar</text>
</svg>