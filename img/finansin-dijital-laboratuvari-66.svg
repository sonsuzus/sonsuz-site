<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcd5ff"/>
      <stop offset="100%" stop-color="#c7e8f4"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5f7dc"/>
      <stop offset="100%" stop-color="#ccebd9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#60738a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#60738a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="81" cy="47" r="72" fill="#d8eff3" opacity="0.42"/>
  <circle cx="582" cy="274" r="96" fill="#e4efd4" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536b">FİNANSAL SİMÜLASYON LABORATUVARI</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728197">Belirsizlikten karar görünürlüğüne</text>

  <!-- Left input group -->
  <rect x="27" y="78" width="151" height="187" rx="18" fill="#eef6ff" filter="url(#shadow)"/>
  <text x="48" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#435a78">Varsayımlar</text>

  <rect x="43" y="119" width="119" height="35" rx="11" fill="#fff5df" filter="url(#soft)"/>
  <circle cx="60" cy="136" r="7" fill="#f4bc62"/>
  <path d="M57 138 L60 131 L63 138 Z" fill="#fffdf7"/>
  <text x="76" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c5b55">Gelir büyümesi</text>

  <rect x="43" y="164" width="119" height="35" rx="11" fill="#fce9ed" filter="url(#soft)"/>
  <circle cx="60" cy="181" r="7" fill="#e78a9a"/>
  <path d="M56 178 L64 178 L60 185 Z" fill="#fffdfd"/>
  <text x="76" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66535a">Maliyet oranı</text>

  <rect x="43" y="209" width="119" height="35" rx="11" fill="#e5f3ed" filter="url(#soft)"/>
  <circle cx="60" cy="226" r="7" fill="#6db79b"/>
  <path d="M57 226 H63 M60 223 V229" stroke="#ffffff" stroke-width="1.5"/>
  <text x="76" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d625d">İskonto oranı</text>

  <!-- arrow left to center -->
  <path d="M181 170 H216" fill="none" stroke="#8094ad" stroke-width="2"/>
  <polygon points="223,170 214,165 214,175" fill="#8094ad"/>
  <text x="181" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71839a">örnekle</text>

  <!-- Central engine -->
  <rect x="226" y="82" width="181" height="177" rx="25" fill="url(#engine)" filter="url(#shadow)"/>
  <circle cx="316.5" cy="145" r="43" fill="#ffffff" opacity="0.68"/>
  <circle cx="316.5" cy="145" r="31" fill="#8176c6" opacity="0.16"/>
  <path d="M292 147 C300 124 321 116 339 131 C355 145 342 168 322 171 C303 174 288 163 292 147Z" fill="#7d70bd"/>
  <path d="M308 129 C303 143 303 153 308 164" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M323 127 C329 140 330 153 324 165" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="317" cy="145" r="4" fill="#f8d66e"/>
  <text x="316" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45416f">Python Simülasyonu</text>
  <text x="316" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c6384">10.000 senaryo</text>
  <rect x="258" y="237" width="117" height="9" rx="4.5" fill="#ffffff" opacity="0.62"/>
  <rect x="258" y="237" width="79" height="9" rx="4.5" fill="#8276c4"/>

  <!-- Arrow central to output -->
  <path d="M410 170 H445" fill="none" stroke="#8094ad" stroke-width="2"/>
  <polygon points="452,170 443,165 443,175" fill="#8094ad"/>
  <text x="410" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71839a">hesapla</text>

  <!-- Right result -->
  <rect x="455" y="78" width="157" height="187" rx="18" fill="url(#result)" filter="url(#shadow)"/>
  <text x="476" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416458">NPV Dağılımı</text>

  <line x1="476" y1="198" x2="591" y2="198" stroke="#9ab8aa" stroke-width="1.5"/>
  <rect x="480" y="174" width="10" height="24" rx="4" fill="#9dd5be"/>
  <rect x="494" y="157" width="10" height="41" rx="4" fill="#83c7ad"/>
  <rect x="508" y="136" width="10" height="62" rx="4" fill="#6dbb9f"/>
  <rect x="522" y="120" width="10" height="78" rx="4" fill="#54aa90"/>
  <rect x="536" y="130" width="10" height="68" rx="4" fill="#62b394"/>
  <rect x="550" y="150" width="10" height="48" rx="4" fill="#85c8aa"/>
  <rect x="564" y="169" width="10" height="29" rx="4" fill="#a2d8c1"/>

  <line x1="495" y1="116" x2="495" y2="207" stroke="#d48188" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="487" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647a70">P5</text>
  <line x1="536" y1="111" x2="536" y2="207" stroke="#576d93" stroke-width="2"/>
  <text x="522" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536682">Medyan</text>
  <line x1="575" y1="116" x2="575" y2="207" stroke="#d48188" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="566" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647a70">P95</text>

  <!-- bottom interpretation strip -->
  <rect x="180" y="278" width="280" height="25" rx="12" fill="#ffffff" opacity="0.78" filter="url(#soft)"/>
  <circle cx="199" cy="290.5" r="6" fill="#e78a9a"/>
  <text x="212" y="295" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#586979">Negatif NPV riski</text>
  <circle cx="341" cy="290.5" r="6" fill="#6dbb9f"/>
  <text x="354" y="295" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#586979">Karar için aralık</text>
</svg>