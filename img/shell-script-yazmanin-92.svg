<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#26a69a"/>
    </linearGradient>
    <linearGradient id="box1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="box2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
    <linearGradient id="box3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <linearGradient id="box4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1"/>
      <stop offset="100%" stop-color="#f06292"/>
    </linearGradient>
    <linearGradient id="box5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ba68c8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Merkez düğüm -->
  <circle cx="320" cy="160" r="58" fill="url(#centerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <circle cx="320" cy="160" r="50" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <text x="320" y="152" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold">Shell</text>
  <text x="320" y="170" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold">Zanaatı</text>

  <!-- Dış halka bağlantıları -->
  <!-- Çizgiler -->
  <line x1="320" y1="102" x2="320" y2="62" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>
  <line x1="374" y1="118" x2="448" y2="72" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>
  <line x1="378" y1="160" x2="468" y2="160" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>
  <line x1="374" y1="202" x2="448" y2="248" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>
  <line x1="320" y1="218" x2="320" y2="258" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>
  <line x1="266" y1="202" x2="192" y2="248" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>
  <line x1="262" y1="160" x2="172" y2="160" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>
  <line x1="266" y1="118" x2="192" y2="72" stroke="#78909c" stroke-width="1.8" opacity="0.6"/>

  <!-- Ok uçları (manuel çizim) -->
  <polygon points="320,58 315,68 325,68" fill="#78909c" opacity="0.7"/>
  <polygon points="452,68 442,66 446,76" fill="#78909c" opacity="0.7"/>
  <polygon points="472,160 462,155 462,165" fill="#78909c" opacity="0.7"/>
  <polygon points="452,252 446,242 442,252" fill="#78909c" opacity="0.7"/>
  <polygon points="320,262 315,252 325,252" fill="#78909c" opacity="0.7"/>
  <polygon points="188,252 194,242 198,252" fill="#78909c" opacity="0.7"/>
  <polygon points="168,160 178,155 178,165" fill="#78909c" opacity="0.7"/>
  <polygon points="188,68 194,78 198,68" fill="#78909c" opacity="0.7"/>

  <!-- Dış kutular -->
  <!-- Üst: Kısalık -->
  <rect x="270" y="20" width="100" height="38" rx="10" fill="url(#box1Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="43" text-anchor="middle" fill="#4e342e" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Kısalık</text>

  <!-- Sağ üst: Doğruluk -->
  <rect x="452" y="38" width="100" height="38" rx="10" fill="url(#box2Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="502" y="61" text-anchor="middle" fill="#0d47a1" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Doğruluk</text>

  <!-- Sağ: Okunabilirlik -->
  <rect x="472" y="140" width="100" height="38" rx="10" fill="url(#box3Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="522" y="163" text-anchor="middle" fill="#1b5e20" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Okunabilirlik</text>

  <!-- Sağ alt: Güvenlik -->
  <rect x="452" y="238" width="100" height="38" rx="10" fill="url(#box4Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="502" y="261" text-anchor="middle" fill="#880e4f" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Güvenlik</text>

  <!-- Alt: Sadelik -->
  <rect x="270" y="262" width="100" height="38" rx="10" fill="url(#box5Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="285" text-anchor="middle" fill="#4a148c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Sadelik</text>

  <!-- Sol alt: Niyet -->
  <rect x="88" y="238" width="100" height="38" rx="10" fill="url(#box4Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="138" y="261" text-anchor="middle" fill="#880e4f" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Niyet</text>

  <!-- Sol: Bakım -->
  <rect x="68" y="140" width="100" height="38" rx="10" fill="url(#box3Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="118" y="163" text-anchor="middle" fill="#1b5e20" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Bakım</text>

  <!-- Sol üst: Şiirsellik -->
  <rect x="88" y="38" width="100" height="38" rx="10" fill="url(#box2Grad)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="138" y="61" text-anchor="middle" fill="#0d47a1" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Şiirsellik</text>

  <!-- İç halka: küçük dekoratif halkalar -->
  <circle cx="320" cy="160" r="42" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>

  <!-- Alt bilgi etiketi -->
  <text x="320" y="312" text-anchor="middle" fill="#546e7a" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" opacity="0.7">Değer = (Doğruluk × Okunabilirlik × Güvenlik) / Karmaşıklık</text>
</svg>