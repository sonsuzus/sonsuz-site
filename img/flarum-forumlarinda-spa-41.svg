<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d9ff2"/>
      <stop offset="100%" stop-color="#6687dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#52647d" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52647d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="122" fill="#dfeafa" opacity="0.42"/>
  <circle cx="320" cy="160" r="94" fill="none" stroke="#b9cdec" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Bağlantı çizgileri -->
  <path d="M171 95 C205 106 221 119 243 132" fill="none" stroke="#98afd4" stroke-width="2"/>
  <polygon points="242,126 252,138 237,137" fill="#98afd4"/>
  <path d="M469 95 C435 106 419 119 397 132" fill="none" stroke="#98afd4" stroke-width="2"/>
  <polygon points="403,137 388,138 398,126" fill="#98afd4"/>
  <path d="M171 225 C205 214 221 201 243 188" fill="none" stroke="#98afd4" stroke-width="2"/>
  <polygon points="237,183 252,182 242,194" fill="#98afd4"/>
  <path d="M469 225 C435 214 419 201 397 188" fill="none" stroke="#98afd4" stroke-width="2"/>
  <polygon points="398,194 388,182 403,183" fill="#98afd4"/>

  <!-- Sol üst kullanıcı -->
  <g filter="url(#smallShadow)">
    <rect x="38" y="57" width="134" height="76" rx="17" fill="#fffdfb"/>
    <circle cx="69" cy="87" r="16" fill="#f4b88e"/>
    <circle cx="69" cy="83" r="6" fill="#fff5e8"/>
    <path d="M59 99 C61 91 77 91 79 99" fill="#fff5e8"/>
    <text x="94" y="83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40516b" font-weight="600">Kullanıcı</text>
    <text x="94" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8190a5">Bağlantı tıklar</text>
  </g>

  <!-- Sağ üst rota -->
  <g filter="url(#smallShadow)">
    <rect x="468" y="57" width="134" height="76" rx="17" fill="#fffdfb"/>
    <path d="M496 84 h23" fill="none" stroke="#8d76cd" stroke-width="3" stroke-linecap="round"/>
    <path d="M513 76 l9 8 -9 8" fill="none" stroke="#8d76cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="536" y="83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40516b" font-weight="600">Rota</text>
    <text x="536" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8190a5">İstemci geçişi</text>
  </g>

  <!-- Sol alt API -->
  <g filter="url(#smallShadow)">
    <rect x="38" y="187" width="134" height="76" rx="17" fill="#fffdfb"/>
    <rect x="57" y="206" width="30" height="36" rx="6" fill="#8ccdbd"/>
    <path d="M64 216 h16 M64 224 h16 M64 232 h10" stroke="#effaf6" stroke-width="2" stroke-linecap="round"/>
    <text x="96" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40516b" font-weight="600">JSON:API</text>
    <text x="96" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8190a5">Hedef veri</text>
  </g>

  <!-- Sağ alt ekran -->
  <g filter="url(#smallShadow)">
    <rect x="468" y="187" width="134" height="76" rx="17" fill="#fffdfb"/>
    <rect x="488" y="206" width="35" height="35" rx="6" fill="#efbb89"/>
    <path d="M495 215 h21 M495 222 h15 M495 229 h18" stroke="#fff8ef" stroke-width="2.4" stroke-linecap="round"/>
    <text x="534" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40516b" font-weight="600">Görünüm</text>
    <text x="534" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8190a5">Parçalı güncelleme</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="244" y="105" width="152" height="110" rx="25" fill="url(#core)"/>
    <circle cx="320" cy="138" r="23" fill="#ffffff" opacity="0.18"/>
    <path d="M309 138 h20 M319 128 l10 10 -10 10" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Flarum SPA</text>
    <text x="320" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eaf0ff">Mithril.js çekirdeği</text>
  </g>

  <!-- Alt süreç şeridi -->
  <g filter="url(#smallShadow)">
    <rect x="178" y="274" width="284" height="28" rx="14" fill="#ffffff" opacity="0.92"/>
    <text x="215" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7089">Mağaza</text>
    <path d="M270 288 h28" stroke="#a3b5d0" stroke-width="1.8"/>
    <polygon points="298,283 306,288 298,293" fill="#a3b5d0"/>
    <text x="320" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7089">Sanal DOM</text>
    <path d="M381 288 h28" stroke="#a3b5d0" stroke-width="1.8"/>
    <polygon points="409,283 417,288 409,293" fill="#a3b5d0"/>
    <text x="426" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7089">Yama</text>
  </g>
</svg>