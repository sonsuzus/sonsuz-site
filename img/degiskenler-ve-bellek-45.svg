<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d8f2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6e8ca4" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7696a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="46" r="52" fill="#d9eff4" opacity="0.42"/>
  <circle cx="589" cy="277" r="68" fill="#dcefd4" opacity="0.42"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6a7c" font-weight="600">DEĞİŞKEN • TİP • BELLEK</text>
  <line x1="32" y1="40" x2="608" y2="40" stroke="#c9dce3" stroke-width="1"/>

  <!-- Sol: değişken -->
  <g filter="url(#shadow)">
    <rect x="31" y="82" width="131" height="103" rx="18" fill="#fffdf9" stroke="#c9ddec"/>
    <rect x="48" y="101" width="96" height="38" rx="10" fill="#e2f0ff"/>
    <text x="96" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315b78" font-weight="700">x : int32</text>
    <text x="96" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617887">Ad • Tip • Ömür</text>
  </g>

  <!-- Arrow -->
  <path d="M171 133 L203 133" fill="none" stroke="#7b9caf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="211,133 200,127 200,139" fill="#7b9caf"/>

  <!-- compiler -->
  <g filter="url(#shadow)">
    <rect x="213" y="70" width="176" height="126" rx="22" fill="url(#core)" stroke="#b9d6df"/>
    <circle cx="301" cy="104" r="21" fill="#ffffff" opacity="0.82"/>
    <path d="M291 104 L298 111 L312 96" fill="none" stroke="#4b9278" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="301" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315f68" font-weight="700">Derleyici Denetimi</text>
    <text x="301" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567681">Uyum • Aralık • Taşma</text>
  </g>

  <!-- arrows right split -->
  <path d="M399 111 L426 111 L426 91 L445 91" fill="none" stroke="#809bae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="453,91 442,85 442,97" fill="#809bae"/>
  <path d="M399 155 L426 155 L426 177 L445 177" fill="none" stroke="#809bae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="453,177 442,171 442,183" fill="#809bae"/>

  <!-- representation -->
  <g filter="url(#soft)">
    <rect x="454" y="57" width="154" height="69" rx="15" fill="#fff9e8" stroke="#e5d6a9"/>
    <text x="531" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79633e" font-weight="700">Bit Temsili</text>
    <g fill="#d4a75e">
      <rect x="476" y="96" width="12" height="12" rx="3"/>
      <rect x="493" y="96" width="12" height="12" rx="3" opacity="0.7"/>
      <rect x="510" y="96" width="12" height="12" rx="3"/>
      <rect x="527" y="96" width="12" height="12" rx="3" opacity="0.7"/>
      <rect x="544" y="96" width="12" height="12" rx="3"/>
      <rect x="561" y="96" width="12" height="12" rx="3" opacity="0.7"/>
    </g>
    <text x="531" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a7651">Bayt ve anlam</text>
  </g>

  <!-- memory -->
  <g filter="url(#soft)">
    <rect x="454" y="143" width="154" height="69" rx="15" fill="#f3edff" stroke="#d4c5e9"/>
    <text x="531" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65527d" font-weight="700">Bellek Düzeni</text>
    <rect x="476" y="181" width="18" height="15" rx="3" fill="#a888ce"/>
    <rect x="496" y="181" width="18" height="15" rx="3" fill="#d9cbed"/>
    <rect x="516" y="181" width="18" height="15" rx="3" fill="#a888ce"/>
    <rect x="536" y="181" width="18" height="15" rx="3" fill="#d9cbed"/>
    <rect x="556" y="181" width="28" height="15" rx="3" fill="#a888ce"/>
    <text x="531" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79688d">Hizalama • Dolgu</text>
  </g>

  <!-- lower connector -->
  <path d="M301 205 L301 225" fill="none" stroke="#7b9caf" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="301,233 295,222 307,222" fill="#7b9caf"/>

  <!-- bottom panel -->
  <g filter="url(#shadow)">
    <rect x="100" y="235" width="402" height="65" rx="18" fill="#ffffff" stroke="#d3e2e3"/>
    <text x="124" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476d77" font-weight="700">Yaşam Süresi</text>
    
    <rect x="219" y="248" width="72" height="34" rx="9" fill="#e5f0ff"/>
    <text x="255" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6585">Yığın</text>
    
    <rect x="303" y="248" width="72" height="34" rx="9" fill="#e4f5e9"/>
    <text x="339" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#41785c">Öbek</text>
    
    <rect x="387" y="248" width="91" height="34" rx="9" fill="#f5ebff"/>
    <text x="432" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#715783">Statik Veri</text>
  </g>

  <path d="M291 265 L298 265" stroke="#8da9b6" stroke-width="2" stroke-linecap="round"/>
  <path d="M375 265 L382 265" stroke="#8da9b6" stroke-width="2" stroke-linecap="round"/>
</svg>