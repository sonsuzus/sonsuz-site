<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#c8dcfb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5d7690" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#617989" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="43" r="58" fill="#dff2ec" opacity="0.45"/>
  <circle cx="583" cy="272" r="78" fill="#e1e9ff" opacity="0.5"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566b">Gecikme Telafisi</text>
  <text x="320" y="45" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718394">Tepkisellik · Tutarlılık · Adalet</text>

  <!-- connection paths -->
  <path d="M187 137 C220 105 239 105 267 126" fill="none" stroke="#7897af" stroke-width="2"/>
  <polygon points="267,126 258,121 260,131" fill="#7897af"/>
  <path d="M267 164 C235 185 220 184 187 160" fill="none" stroke="#7897af" stroke-width="2"/>
  <polygon points="187,160 196,161 192,152" fill="#7897af"/>

  <path d="M453 137 C420 105 401 105 373 126" fill="none" stroke="#7897af" stroke-width="2"/>
  <polygon points="373,126 382,121 380,131" fill="#7897af"/>
  <path d="M373 164 C405 185 420 184 453 160" fill="none" stroke="#7897af" stroke-width="2"/>
  <polygon points="453,160 444,161 448,152" fill="#7897af"/>

  <!-- latency pills -->
  <g filter="url(#smallShadow)">
    <rect x="201" y="91" width="74" height="24" rx="12" fill="#fff7dc"/>
    <text x="238" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6b22">RTT / 2</text>
    <rect x="365" y="91" width="74" height="24" rx="12" fill="#fff7dc"/>
    <text x="402" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6b22">Jitter</text>
  </g>

  <!-- left client -->
  <g filter="url(#shadow)">
    <rect x="38" y="112" width="149" height="91" rx="18" fill="#e5f5ef"/>
    <rect x="52" y="126" width="121" height="26" rx="10" fill="#cceade"/>
    <circle cx="66" cy="139" r="5" fill="#55a987"/>
    <text x="112" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315e53">Yerel İstemci</text>
    <path d="M58 173 H83" stroke="#69ad90" stroke-width="3" stroke-linecap="round"/>
    <polygon points="83,173 76,168 76,178" fill="#69ad90"/>
    <rect x="92" y="162" width="68" height="23" rx="8" fill="#f8fffc"/>
    <text x="126" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#467362">Anlık giriş</text>
    <text x="112" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7e73">Tahmin</text>
  </g>

  <!-- server -->
  <g filter="url(#shadow)">
    <rect x="267" y="111" width="106" height="94" rx="20" fill="url(#server)"/>
    <rect x="282" y="125" width="76" height="22" rx="8" fill="#eef5ff"/>
    <circle cx="296" cy="136" r="4" fill="#527cc1"/>
    <text x="325" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315378">Sunucu</text>
    <path d="M293 162 H347" stroke="#7299c8" stroke-width="2"/>
    <path d="M293 174 H337" stroke="#7299c8" stroke-width="2"/>
    <path d="M293 186 H327" stroke="#7299c8" stroke-width="2"/>
    <text x="320" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b6d92">Otoriter durum</text>
  </g>

  <!-- right remote client -->
  <g filter="url(#shadow)">
    <rect x="453" y="112" width="149" height="91" rx="18" fill="#f1eafa"/>
    <rect x="467" y="126" width="121" height="26" rx="10" fill="#e3d6f5"/>
    <circle cx="481" cy="139" r="5" fill="#966bc2"/>
    <text x="527" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#60417d">Uzak Oyuncu</text>
    <path d="M473 173 H497" stroke="#a47bca" stroke-width="3" stroke-linecap="round"/>
    <polygon points="497,173 490,168 490,178" fill="#a47bca"/>
    <rect x="505" y="162" width="70" height="23" rx="8" fill="#fdfaff"/>
    <text x="540" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#72518d">Tampon</text>
    <text x="527" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b668d">Enterpolasyon</text>
  </g>

  <!-- bottom techniques -->
  <path d="M112 218 V236 H225" fill="none" stroke="#8aa699" stroke-width="1.5"/>
  <polygon points="225,236 218,232 218,240" fill="#8aa699"/>
  <path d="M320 211 V233" fill="none" stroke="#809cbb" stroke-width="1.5"/>
  <polygon points="320,233 316,226 324,226" fill="#809cbb"/>
  <path d="M527 218 V236 H415" fill="none" stroke="#a28ab9" stroke-width="1.5"/>
  <polygon points="415,236 422,232 422,240" fill="#a28ab9"/>

  <g filter="url(#smallShadow)">
    <rect x="43" y="239" width="178" height="58" rx="15" fill="#ffffff"/>
    <circle cx="66" cy="261" r="12" fill="#d8f1e5"/>
    <path d="M60 261 L65 266 L73 256" fill="none" stroke="#4f9a78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426d5d">İstemci tahmini</text>
    <text x="88" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#73897f">Hemen hareket et</text>

    <rect x="231" y="239" width="178" height="58" rx="15" fill="#ffffff"/>
    <circle cx="254" cy="261" r="12" fill="#dceaff"/>
    <path d="M248 261 H260 M254 255 V267" stroke="#537eb5" stroke-width="2" stroke-linecap="round"/>
    <text x="276" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#47698d">Uzlaştırma</text>
    <text x="276" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71869d">Onayla ve düzelt</text>

    <rect x="419" y="239" width="178" height="58" rx="15" fill="#ffffff"/>
    <circle cx="442" cy="261" r="12" fill="#f1e1cb"/>
    <path d="M442 253 V261 L448 265" fill="none" stroke="#ad7a3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="464" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#856138">Geçmişe sarma</text>
    <text x="464" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#927d62">Vuruş zamanı testi</text>
  </g>
</svg>