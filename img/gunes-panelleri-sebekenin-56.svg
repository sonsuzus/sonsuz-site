<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="100%" stop-color="#ffd983"/>
    </linearGradient>
    <linearGradient id="inv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe9ff"/>
      <stop offset="100%" stop-color="#bcd1f6"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcf5e6"/>
      <stop offset="100%" stop-color="#a8dfc2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7991a6" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5d7890" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="146" r="115" fill="#ffffff" opacity="0.34"/>
  <path d="M40 265 C160 230 225 284 340 255 S515 226 610 258" fill="none" stroke="#b8d9db" stroke-width="2" opacity="0.32"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29465a">
    <!-- Solar source -->
    <g filter="url(#shadow)">
      <rect x="32" y="82" width="132" height="122" rx="19" fill="url(#solar)" stroke="#edc96e"/>
    </g>
    <circle cx="62" cy="108" r="16" fill="#fff9d9" stroke="#edb94d" stroke-width="1.5"/>
    <path d="M62 84 L62 76 M62 140 L62 132 M38 108 L46 108 M78 108 L86 108 M45 91 L50 96 M74 120 L79 125 M79 91 L74 96 M50 120 L45 125" fill="none" stroke="#e3ad3f" stroke-width="2" stroke-linecap="round"/>
    <rect x="48" y="137" width="94" height="42" rx="6" fill="#4c79a7" stroke="#38658f"/>
    <path d="M56 147 H134 M56 158 H134 M71 137 V179 M95 137 V179 M119 137 V179" stroke="#b9d8f2" stroke-width="1"/>
    <text x="98" y="193" text-anchor="middle" font-weight="600">Güneş Paneli</text>
    <text x="98" y="217" text-anchor="middle" fill="#7d5c1f">DC enerji</text>

    <!-- DC arrow -->
    <path d="M165 143 H205" fill="none" stroke="#d29d3b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="205,143 195,137 195,149" fill="#d29d3b"/>
    <text x="184" y="132" text-anchor="middle" fill="#8b6a2d">DC</text>

    <!-- inverter -->
    <g filter="url(#shadow)">
      <rect x="207" y="61" width="208" height="168" rx="22" fill="url(#inv)" stroke="#91add3"/>
    </g>
    <text x="311" y="87" text-anchor="middle" font-weight="700" fill="#315777">İnverter</text>
    <rect x="228" y="100" width="78" height="48" rx="11" fill="#eff5ff" stroke="#9db6d8" filter="url(#soft)"/>
    <text x="267" y="120" text-anchor="middle" font-weight="600">DC Bağlantı</text>
    <path d="M242 134 H292" stroke="#5f88ad" stroke-width="2"/>
    <path d="M242 139 C248 130 254 148 260 139 S272 130 278 139 S290 148 296 139" fill="none" stroke="#4d7ca8" stroke-width="1.8"/>

    <rect x="318" y="100" width="77" height="48" rx="11" fill="#eff5ff" stroke="#9db6d8" filter="url(#soft)"/>
    <text x="356" y="120" text-anchor="middle" font-weight="600">Filtre</text>
    <path d="M331 137 C337 126 343 148 349 137 S361 126 367 137 S379 148 385 137" fill="none" stroke="#4d7ca8" stroke-width="2"/>

    <path d="M306 124 H317" stroke="#5f88ad" stroke-width="2"/>
    <polygon points="317,124 310,120 310,128" fill="#5f88ad"/>

    <rect x="245" y="165" width="133" height="45" rx="12" fill="#d9e8ff" stroke="#89a9d3"/>
    <circle cx="269" cy="187" r="13" fill="#9ac2ec"/>
    <path d="M269 176 V187 L277 193" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="324" y="184" text-anchor="middle" font-weight="700">PLL</text>
    <text x="324" y="200" text-anchor="middle">Faz ve frekans</text>

    <!-- grid arrow -->
    <path d="M416 143 H454" fill="none" stroke="#4eab7b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="454,143 444,137 444,149" fill="#4eab7b"/>
    <text x="435" y="132" text-anchor="middle" fill="#337857">AC</text>

    <!-- Grid -->
    <g filter="url(#shadow)">
      <rect x="456" y="82" width="152" height="122" rx="19" fill="url(#grid)" stroke="#78bb97"/>
    </g>
    <text x="532" y="108" text-anchor="middle" font-weight="700" fill="#326c51">Şebeke</text>
    <path d="M479 151 C488 125 497 177 506 151 S524 125 533 151 S551 177 560 151 S578 125 587 151" fill="none" stroke="#3e9b6d" stroke-width="3" stroke-linecap="round"/>
    <path d="M485 171 H579" stroke="#7ebc9b" stroke-width="1.5"/>
    <text x="532" y="192" text-anchor="middle" fill="#397557">50 Hz referans</text>

    <!-- feedback from grid to PLL -->
    <path d="M514 205 C514 259 410 267 365 214" fill="none" stroke="#6998c0" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="365,214 374,216 369,223" fill="#6998c0"/>
    <text x="449" y="267" text-anchor="middle" fill="#557d9f">Gerilim ölçümü</text>

    <!-- lower control modules -->
    <g filter="url(#soft)">
      <rect x="51" y="257" width="132" height="43" rx="14" fill="#fceaca" stroke="#e7bf78"/>
      <rect x="211" y="257" width="142" height="43" rx="14" fill="#e7efff" stroke="#a8bde2"/>
      <rect x="382" y="257" width="156" height="43" rx="14" fill="#e2f3e9" stroke="#94cbaa"/>
    </g>
    <text x="117" y="283" text-anchor="middle" font-weight="600">MPPT ve güç</text>
    <text x="282" y="283" text-anchor="middle" font-weight="600">Akım denetimi</text>
    <text x="460" y="283" text-anchor="middle" font-weight="600">Koruma ve ada önleme</text>

    <path d="M117 256 V232 H257" fill="none" stroke="#c39a50" stroke-width="1.7"/>
    <polygon points="257,232 249,228 249,236" fill="#c39a50"/>
    <path d="M282 256 V231 H322 V212" fill="none" stroke="#718fb8" stroke-width="1.7"/>
    <polygon points="322,212 318,220 326,220" fill="#718fb8"/>
    <path d="M460 256 V230 H532 V205" fill="none" stroke="#62a680" stroke-width="1.7"/>
    <polygon points="532,205 528,213 536,213" fill="#62a680"/>
  </g>
</svg>