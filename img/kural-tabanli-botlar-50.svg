<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1ecf1"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3cd"/>
      <stop offset="100%" stop-color="#ffeaa7"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4edda"/>
      <stop offset="100%" stop-color="#c3e6cb"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d7da"/>
      <stop offset="100%" stop-color="#f5c6cb"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6d8db"/>
      <stop offset="100%" stop-color="#c6c8ca"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="8"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Kural Tabanlı Bot Mimarisi</text>

  <!-- Merkez blok -->
  <rect x="245" y="105" width="150" height="50" rx="10" fill="url(#boxGrad1)" stroke="#5bc0de" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Kural Motoru</text>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a5276">if-else + puanlama</text>

  <!-- Sol üst: Girdi -->
  <rect x="45" y="40" width="130" height="45" rx="10" fill="url(#boxGrad2)" stroke="#f0ad4e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Metin Girdisi</text>
  <text x="110" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7d6608">normalize et</text>

  <!-- Sol alt: Sinyal çıkarımı -->
  <rect x="45" y="145" width="130" height="55" rx="10" fill="url(#boxGrad3)" stroke="#28a745" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#155724">Sinyal Çıkarımı</text>
  <text x="110" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#155724">anahtar kelime</text>
  <text x="110" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#155724">desen + puan</text>

  <!-- Sağ üst: Kural deposu -->
  <rect x="465" y="40" width="130" height="45" rx="10" fill="url(#boxGrad4)" stroke="#dc3545" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#721c24">Kural Deposu</text>
  <text x="530" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#721c24">JSON / YAML</text>

  <!-- Sağ alt: Karar -->
  <rect x="465" y="145" width="130" height="55" rx="10" fill="url(#boxGrad5)" stroke="#6c757d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#343a40">Karar Çıktısı</text>
  <text x="530" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#343a40">kuyruk + skor</text>
  <text x="530" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#343a40">açıklama</text>

  <!-- Alt: Günlük kaydı -->
  <rect x="245" y="240" width="150" height="40" rx="10" fill="#e2e3e5" stroke="#adb5bd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#383d41">Günlük Kaydı</text>
  <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#383d41">denetim + iyileştirme</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Girdi -> Kural Motoru -->
  <path d="M175,62 L240,62 L240,120 L238,120" stroke="#5bc0de" stroke-width="1.8" fill="none"/>
  <polygon points="232,120 242,120 237,112" fill="#5bc0de"/>

  <!-- Sinyal -> Kural Motoru -->
  <path d="M175,172 L240,172 L240,140 L238,140" stroke="#28a745" stroke-width="1.8" fill="none"/>
  <polygon points="232,140 242,140 237,132" fill="#28a745"/>

  <!-- Kural Deposu -> Kural Motoru -->
  <path d="M465,62 L400,62 L400,120 L402,120" stroke="#dc3545" stroke-width="1.8" fill="none"/>
  <polygon points="408,120 398,120 403,112" fill="#dc3545"/>

  <!-- Kural Motoru -> Karar -->
  <path d="M400,140 L465,140 L465,165 L467,165" stroke="#6c757d" stroke-width="1.8" fill="none"/>
  <polygon points="473,165 463,165 468,157" fill="#6c757d"/>

  <!-- Kural Motoru -> Günlük -->
  <path d="M320,155 L320,235 L318,235" stroke="#adb5bd" stroke-width="1.8" fill="none"/>
  <polygon points="312,235 322,235 317,227" fill="#adb5bd"/>

  <!-- Karar -> Günlük -->
  <path d="M530,200 L530,260 L400,260 L402,260" stroke="#adb5bd" stroke-width="1.8" fill="none"/>
  <polygon points="408,260 398,260 403,252" fill="#adb5bd"/>

  <!-- Etiketler -->
  <text x="215" y="52" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5bc0de">ham metin</text>
  <text x="215" y="185" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#28a745">sinyaller</text>
  <text x="425" y="52" text-anchor="start" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#dc3545">kurallar</text>
  <text x="425" y="152" text-anchor="start" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c757d">sonuç</text>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c757d" opacity="0.8">açıklanabilir ve test edilebilir otomasyon</text>
</svg>