<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#c7ecee"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8c291"/>
      <stop offset="100%" stop-color="#fad390"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#82ccdd"/>
      <stop offset="100%" stop-color="#60a3bc"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8e994"/>
      <stop offset="100%" stop-color="#78e08f"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6b93b"/>
      <stop offset="100%" stop-color="#e58e26"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e77f67"/>
      <stop offset="100%" stop-color="#eb2f06"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python Döngü Alıştırmaları</text>
  <line x1="180" y1="40" x2="460" y2="40" stroke="#bdc3c7" stroke-width="1"/>

  <!-- Merkez düğüm -->
  <rect x="255" y="120" width="130" height="48" rx="12" fill="url(#g3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fff">Döngü</text>

  <!-- Dış halka kutuları -->
  <!-- Collatz -->
  <rect x="30" y="50" width="130" height="44" rx="10" fill="url(#g1)" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Collatz</text>
  <text x="95" y="84" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">En uzun zincir</text>

  <!-- Taylor -->
  <rect x="200" y="30" width="130" height="44" rx="10" fill="url(#g2)" filter="url(#shadow)" opacity="0.9"/>
  <text x="265" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Taylor Serisi</text>
  <text x="265" y="64" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">e^x hesabı</text>

  <!-- Karekök -->
  <rect x="370" y="30" width="130" height="44" rx="10" fill="url(#g4)" filter="url(#shadow)" opacity="0.9"/>
  <text x="435" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Babil Yöntemi</text>
  <text x="435" y="64" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Karekök bulma</text>

  <!-- Pi -->
  <rect x="500" y="80" width="120" height="44" rx="10" fill="url(#g5)" filter="url(#shadow)" opacity="0.9"/>
  <text x="560" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Machin Formülü</text>
  <text x="560" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Pi hesabı</text>

  <!-- Lojistik -->
  <rect x="500" y="200" width="120" height="44" rx="10" fill="url(#g6)" filter="url(#shadow)" opacity="0.9"/>
  <text x="560" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Lojistik</text>
  <text x="560" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff">Kaos</text>

  <!-- SIR -->
  <rect x="30" y="220" width="130" height="44" rx="10" fill="url(#g1)" filter="url(#shadow)" opacity="0.9"/>
  <text x="95" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">SIR Modeli</text>
  <text x="95" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Salgın simülasyonu</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Collatz -> Merkez -->
  <path d="M160 72 L250 130" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="250,130 240,124 244,135" fill="#7f8c8d"/>

  <!-- Taylor -> Merkez -->
  <path d="M265 74 L265 118" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="265,118 259,108 271,108" fill="#7f8c8d"/>

  <!-- Karekök -> Merkez -->
  <path d="M435 74 L370 130" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="370,130 380,124 376,135" fill="#7f8c8d"/>

  <!-- Pi -> Merkez -->
  <path d="M530 124 L390 138" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="390,138 400,132 396,143" fill="#7f8c8d"/>

  <!-- Lojistik -> Merkez -->
  <path d="M530 222 L390 170" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="390,170 400,176 394,165" fill="#7f8c8d"/>

  <!-- SIR -> Merkez -->
  <path d="M160 242 L250 172" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  <polygon points="250,172 240,178 246,167" fill="#7f8c8d"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">while ve for döngüleri ile sayısal algoritmalar</text>
</svg>