<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dcf5"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddf5e6"/>
      <stop offset="100%" stop-color="#c4e9d5"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d9"/>
      <stop offset="100%" stop-color="#f8d8be"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#56708b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#425b72" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="78" cy="51" r="68" fill="#dcecf8" opacity="0.42"/>
  <circle cx="586" cy="271" r="82" fill="#dcefdc" opacity="0.48"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35516b">AKILLI SÖZLEŞME GÜVENLİĞİ</text>
  <text x="320" y="49" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8192">Çağrı akışı ve sayısal sınırlar</text>

  <!-- Left threat -->
  <rect x="28" y="86" width="155" height="160" rx="20" fill="#fff8f1" stroke="#f2cfae" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="105" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a95e42">Yeniden Giriş</text>

  <rect x="48" y="130" width="113" height="39" rx="12" fill="url(#warn)" filter="url(#soft)"/>
  <text x="104" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#754b3a">Harici çağrı</text>

  <path d="M104 174 L104 194" stroke="#cf7958" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="98,190 110,190 104,199" fill="#cf7958"/>
  <path d="M58 210 C44 187,50 180,71 180" fill="none" stroke="#cf7958" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="66,174 76,181 64,185" fill="#cf7958"/>

  <rect x="49" y="203" width="112" height="26" rx="10" fill="#fde2d7"/>
  <text x="105" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b4b42">Tekrar çağrı</text>

  <!-- Right threat -->
  <rect x="457" y="86" width="155" height="160" rx="20" fill="#f9fbf5" stroke="#c9dec2" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="534" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5c8060">Taşma Koruması</text>

  <rect x="478" y="130" width="112" height="39" rx="12" fill="#e7f3db" filter="url(#soft)"/>
  <text x="534" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496c50">0 — 255</text>

  <path d="M534 174 L534 192" stroke="#72a171" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="528,188 540,188 534,197" fill="#72a171"/>

  <rect x="478" y="202" width="112" height="28" rx="10" fill="#d7ecd3"/>
  <text x="534" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416b49">İşlem geri al</text>

  <!-- center connectors -->
  <path d="M183 166 C203 166,210 166,228 166" fill="none" stroke="#8ba7b9" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="222,160 234,166 222,172" fill="#8ba7b9"/>
  <path d="M457 166 C438 166,431 166,412 166" fill="none" stroke="#8ba7b9" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="418,160 406,166 418,172" fill="#8ba7b9"/>

  <!-- central vault -->
  <rect x="230" y="76" width="180" height="190" rx="26" fill="url(#vault)" stroke="#a9c5df" stroke-width="1.4" filter="url(#shadow)"/>
  <rect x="250" y="96" width="140" height="34" rx="13" fill="#f5faff" opacity="0.9"/>
  <text x="320" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35556f">Güvenli Kasa</text>

  <rect x="252" y="143" width="136" height="31" rx="11" fill="url(#safe)" filter="url(#soft)"/>
  <circle cx="272" cy="158" r="8" fill="#72ad83"/>
  <path d="M268 158 L271 161 L277 154" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="326" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#396148">Kontroller</text>

  <path d="M320 177 L320 187" stroke="#7296ad" stroke-width="2" stroke-linecap="round"/>
  <polygon points="315,184 325,184 320,191" fill="#7296ad"/>

  <rect x="252" y="193" width="136" height="31" rx="11" fill="#d7e8fa" filter="url(#soft)"/>
  <circle cx="272" cy="208" r="8" fill="#6d9fc8"/>
  <path d="M269 208 L275 208 M272 205 L272 211" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="326" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365b7a">Durum etkileri</text>

  <path d="M320 226 L320 236" stroke="#7296ad" stroke-width="2" stroke-linecap="round"/>
  <polygon points="315,233 325,233 320,240" fill="#7296ad"/>

  <rect x="252" y="242" width="136" height="31" rx="11" fill="#edf4fc"/>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42647e">Etkileşimler</text>

  <!-- lower badges -->
  <rect x="76" y="270" width="166" height="29" rx="14" fill="#fce5dd" filter="url(#soft)"/>
  <text x="159" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#965247">CEI ve giriş kilidi</text>

  <rect x="398" y="270" width="166" height="29" rx="14" fill="#e0f0dd" filter="url(#soft)"/>
  <text x="481" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4b7651">Solidity 0.8 ve sınırlar</text>
</svg>