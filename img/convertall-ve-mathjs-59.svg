<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#d9f3e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#66839a" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#66839a" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="42" r="58" fill="#dceeff" opacity="0.48"/>
  <circle cx="588" cy="278" r="78" fill="#dff3dc" opacity="0.50"/>
  <circle cx="587" cy="44" r="27" fill="#fff0c9" opacity="0.55"/>

  <text x="32" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#466276">AKILLI BİRİM DÖNÜŞÜMÜ</text>
  <text x="32" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718a9b">İfade → doğrulama → güvenilir sonuç</text>

  <!-- connectors -->
  <path d="M166 145 H205" fill="none" stroke="#7b9ab0" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="205,145 197,140 197,150" fill="#7b9ab0"/>
  <path d="M352 145 H386" fill="none" stroke="#7b9ab0" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="386,145 378,140 378,150" fill="#7b9ab0"/>
  <path d="M504 129 C532 111,535 93,535 80" fill="none" stroke="#70a98a" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="535,80 530,89 540,89" fill="#70a98a"/>
  <path d="M504 160 C532 179,535 205,535 221" fill="none" stroke="#d57d7d" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="535,221 530,212 540,212" fill="#d57d7d"/>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="31" y="105" width="135" height="82" rx="17" fill="#ffffff"/>
    <rect x="31" y="105" width="135" height="10" rx="5" fill="#b9d9f6"/>
  </g>
  <circle cx="55" cy="136" r="13" fill="#e4f2ff"/>
  <path d="M49 136 H61 M55 130 V142" stroke="#4f8fbd" stroke-width="1.8" stroke-linecap="round"/>
  <text x="77" y="133" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35566b">Kullanıcı Girişi</text>
  <text x="77" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">10 km / saat</text>
  <rect x="46" y="164" width="104" height="10" rx="5" fill="#eef5fa"/>
  <rect x="46" y="164" width="62" height="10" rx="5" fill="#cce5f7"/>

  <!-- parser -->
  <g filter="url(#shadow)">
    <rect x="205" y="96" width="147" height="98" rx="19" fill="#ffffff"/>
    <rect x="205" y="96" width="147" height="98" rx="19" fill="url(#core)" opacity="0.32"/>
  </g>
  <rect x="222" y="114" width="113" height="24" rx="8" fill="#dbeeff"/>
  <text x="278.5" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6c8b">Ayrıştırıcı</text>
  <path d="M225 157 H240 M246 157 H258 M264 157 H280 M286 157 H299 M305 157 H329" stroke="#7095aa" stroke-width="2" stroke-linecap="round"/>
  <circle cx="243" cy="157" r="3" fill="#7ec3a0"/>
  <circle cx="283" cy="157" r="3" fill="#f0b968"/>
  <circle cx="302" cy="157" r="3" fill="#8db9e8"/>
  <text x="278.5" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Bileşik birimler</text>

  <!-- engine -->
  <g filter="url(#shadow)">
    <rect x="386" y="104" width="118" height="80" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="416" cy="144" r="19" fill="#e3f4e9"/>
  <path d="M406 144 H426 M416 134 V154 M410 138 L422 150 M422 138 L410 150" stroke="#559b74" stroke-width="1.5" stroke-linecap="round"/>
  <text x="458" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6c55">MathJS</text>
  <text x="458" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Dönüşüm motoru</text>
  <text x="458" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#588069">y = ax + b</text>

  <!-- valid -->
  <g filter="url(#smallShadow)">
    <rect x="535" y="49" width="80" height="65" rx="15" fill="#ffffff"/>
    <rect x="535" y="49" width="80" height="65" rx="15" fill="#e3f5e8" opacity="0.58"/>
  </g>
  <circle cx="552" cy="71" r="9" fill="#78bd92"/>
  <path d="M548 71 L551 74 L557 67" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="575" y="74" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d7354">Uyumlu</text>
  <text x="575" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c876b">10000 m</text>

  <!-- invalid -->
  <g filter="url(#smallShadow)">
    <rect x="535" y="221" width="80" height="61" rx="15" fill="#ffffff"/>
    <rect x="535" y="221" width="80" height="61" rx="15" fill="#fde8e8" opacity="0.75"/>
  </g>
  <circle cx="552" cy="242" r="9" fill="#df8585"/>
  <path d="M548 238 L556 246 M556 238 L548 246" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="576" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9a5555">Uyumsuz</text>
  <text x="575" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a86a6a">Boyut hatası</text>

  <!-- bottom features -->
  <path d="M278 204 V235" stroke="#a8b9c4" stroke-width="1.7" stroke-dasharray="4 5"/>
  <polygon points="278,235 273,227 283,227" fill="#a8b9c4"/>
  <g filter="url(#smallShadow)">
    <rect x="172" y="243" width="212" height="44" rx="15" fill="#ffffff"/>
  </g>
  <circle cx="198" cy="265" r="12" fill="#fff1d3"/>
  <path d="M192 265 H204 M198 259 V271" stroke="#ce963b" stroke-width="1.7" stroke-linecap="round"/>
  <text x="220" y="262" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526d7d">Güvenli işlem</text>
  <text x="220" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728897">Hata yakalama ve testler</text>
</svg>