<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f9e6"/>
      <stop offset="100%" stop-color="#d0f0d0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8f9"/>
      <stop offset="100%" stop-color="#e0d0f0"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C Numaralandırma (enum) Yapısı</text>

  <!-- Ana sözdizimi kutusu -->
  <rect x="140" y="45" width="360" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="320" y="65" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276" font-weight="bold">enum etiket-adı {liste} değişken-listesi;</text>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">etiket-adı veya değişken-listesi isteğe bağlı</text>

  <!-- Ok: ana kutu -> örnek 1 -->
  <path d="M 230 95 L 230 115 L 130 130" stroke="#5b9bd5" stroke-width="1.5" fill="none"/>
  <polygon points="125,132 135,128 133,137" fill="#5b9bd5"/>

  <!-- Örnek 1: varsayılan değerler -->
  <rect x="30" y="135" width="200" height="65" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#e67e22" stroke-width="1.5"/>
  <text x="130" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7e5109" font-weight="bold">Varsayılan Değerler</text>
  <text x="130" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">enum renk { mavi, turuncu, mor, siyah } e;</text>
  <text x="130" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">mavi=0, turuncu=1, mor=2, siyah=3</text>

  <!-- Ok: ana kutu -> örnek 2 -->
  <path d="M 410 95 L 410 115 L 510 130" stroke="#5b9bd5" stroke-width="1.5" fill="none"/>
  <polygon points="515,132 505,128 507,137" fill="#5b9bd5"/>

  <!-- Örnek 2: özel değerler -->
  <rect x="410" y="135" width="200" height="65" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="510" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e6b3a" font-weight="bold">Özel Değer Atama</text>
  <text x="510" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">enum renk { mavi=3, turuncu, mor=7, siyah } e1;</text>
  <text x="510" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">mavi=3, turuncu=4, mor=7, siyah=8</text>

  <!-- Alt bağlantı: örnek 1 -> #define karşılığı -->
  <path d="M 130 200 L 130 225 L 200 240" stroke="#e67e22" stroke-width="1.5" fill="none"/>
  <polygon points="205,242 195,238 197,247" fill="#e67e22"/>

  <!-- #define karşılığı -->
  <rect x="30" y="245" width="250" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="155" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b2c6f" font-weight="bold">#define ile Eşdeğer</text>
  <text x="155" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">#define mavi 0, #define turuncu 1</text>
  <text x="155" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">#define mor 2, #define siyah 3</text>

  <!-- Alt bağlantı: örnek 2 -> kısıtlama -->
  <path d="M 510 200 L 510 225 L 430 240" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <polygon points="425,242 435,238 433,247" fill="#27ae60"/>

  <!-- Kısıtlama kutusu -->
  <rect x="360" y="245" width="250" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#2980b9" stroke-width="1.5"/>
  <text x="485" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a5276" font-weight="bold">Değişken Kısıtlaması</text>
  <text x="485" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">e değişkeni yalnızca listedeki</text>
  <text x="485" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">değerleri alabilir</text>

  <!-- Küçük etiketler -->
  <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">Derleyici en soldan başlayarak 0'dan itibaren artan int değerler atar</text>
</svg>