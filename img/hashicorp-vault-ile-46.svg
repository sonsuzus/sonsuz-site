<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#756ce0"/>
      <stop offset="100%" stop-color="#5651bb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52627d" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52627d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="319" cy="160" r="124" fill="#dcecf7" opacity="0.38"/>
  <circle cx="319" cy="160" r="92" fill="#ffffff" opacity="0.34"/>

  <!-- Bağlantılar -->
  <path d="M171 87 C205 87 211 115 240 129" fill="none" stroke="#93a5bc" stroke-width="2"/>
  <polygon points="240,129 231,123 233,134" fill="#93a5bc"/>
  <path d="M171 228 C205 228 211 202 240 188" fill="none" stroke="#93a5bc" stroke-width="2"/>
  <polygon points="240,188 233,183 231,194" fill="#93a5bc"/>
  <path d="M400 129 C431 113 441 86 469 86" fill="none" stroke="#93a5bc" stroke-width="2"/>
  <polygon points="469,86 459,81 459,91" fill="#93a5bc"/>
  <path d="M400 190 C431 205 441 230 469 230" fill="none" stroke="#93a5bc" stroke-width="2"/>
  <polygon points="469,230 459,225 459,235" fill="#93a5bc"/>

  <!-- Sol üst kimlik -->
  <g filter="url(#softShadow)">
    <rect x="35" y="53" width="136" height="68" rx="16" fill="#ffffff"/>
    <rect x="48" y="67" width="31" height="31" rx="9" fill="#dceefb"/>
    <circle cx="63.5" cy="76" r="5" fill="#4d91c7"/>
    <path d="M54 91 C56 84 71 84 73 91" fill="none" stroke="#4d91c7" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="78" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31435b" font-weight="600">İş yükü</text>
    <text x="90" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">OIDC · Kubernetes</text>
  </g>

  <!-- Sol alt policy -->
  <g filter="url(#softShadow)">
    <rect x="35" y="195" width="136" height="68" rx="16" fill="#ffffff"/>
    <rect x="48" y="209" width="31" height="31" rx="9" fill="#e7e0fb"/>
    <path d="M58 216 L69 216 L73 221 L73 233 L54 233 L54 221 Z" fill="none" stroke="#7566bf" stroke-width="2"/>
    <path d="M58 225 L61 228 L68 221" fill="none" stroke="#7566bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31435b" font-weight="600">Politika</text>
    <text x="90" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">En az ayrıcalık</text>
  </g>

  <!-- Merkezi Vault -->
  <g filter="url(#shadow)">
    <rect x="240" y="104" width="160" height="112" rx="27" fill="url(#vaultGrad)"/>
    <rect x="251" y="115" width="138" height="90" rx="20" fill="#ffffff" opacity="0.1"/>
    <path d="M290 159 L290 145 C290 129 310 120 320 120 C330 120 350 129 350 145 L350 159" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <rect x="278" y="153" width="84" height="39" rx="10" fill="#ffffff"/>
    <circle cx="320" cy="170" r="6" fill="#625ac6"/>
    <path d="M320 176 L320 182" stroke="#625ac6" stroke-width="3" stroke-linecap="round"/>
    <text x="320" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="600">Şifreli Kasa</text>
  </g>

  <!-- Sağ üst engine -->
  <g filter="url(#softShadow)">
    <rect x="469" y="52" width="137" height="69" rx="16" fill="#ffffff"/>
    <rect x="482" y="66" width="31" height="31" rx="9" fill="#dff4e7"/>
    <path d="M490 76 L505 76 M490 82 L505 82 M490 88 L500 88" stroke="#45946b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="524" y="77" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31435b" font-weight="600">Sır motoru</text>
    <text x="524" y="95" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">KV · PKI · Veritabanı</text>
  </g>

  <!-- Sağ alt lease -->
  <g filter="url(#softShadow)">
    <rect x="469" y="195" width="137" height="69" rx="16" fill="#ffffff"/>
    <rect x="482" y="209" width="31" height="31" rx="9" fill="#fff0d8"/>
    <circle cx="497.5" cy="224.5" r="9" fill="none" stroke="#d28b35" stroke-width="2.5"/>
    <path d="M497.5 218 L497.5 225 L503 228" fill="none" stroke="#d28b35" stroke-width="2.5" stroke-linecap="round"/>
    <text x="524" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31435b" font-weight="600">Dinamik erişim</text>
    <text x="524" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">TTL · Yenileme · İptal</text>
  </g>

  <!-- Alt denetim şeridi -->
  <g filter="url(#softShadow)">
    <rect x="199" y="278" width="242" height="28" rx="14" fill="#ffffff"/>
    <circle cx="217" cy="292" r="6" fill="#73b98e"/>
    <path d="M217 288 L217 292 L221 294" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="231" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486174">Denetim kaydı</text>
    <path d="M326 292 L354 292" stroke="#b7c5d1" stroke-width="1.5"/>
    <circle cx="365" cy="292" r="6" fill="#789bd0"/>
    <text x="378" y="296" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486174">Rotasyon</text>
  </g>
</svg>