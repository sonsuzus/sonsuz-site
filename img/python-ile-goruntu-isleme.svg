<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="100%" height="100%" style="background-color: #f0f4f8; font-family: 'Segoe UI', Arial, sans-serif; border-radius: 10px;">
  <!-- Başlık -->
  <text x="210" y="35" text-anchor="middle" fill="#2c3e50" font-size="18" font-weight="bold">Python ile Görüntü İşleme</text>
  <text x="210" y="55" text-anchor="middle" fill="#7f8c8d" font-size="12">Piksellerle Dans</text>

  <!-- Renkli Piksel Matrisi (3x3) -->
  <text x="70" y="80" text-anchor="middle" fill="#2980b9" font-size="12" font-weight="bold">Renkli (R,G,B)</text>
  <rect x="40" y="90" width="60" height="60" rx="4" fill="#e74c3c" stroke="#fff" stroke-width="1"/>
  <rect x="105" y="90" width="60" height="60" rx="4" fill="#2ecc71" stroke="#fff" stroke-width="1"/>
  <rect x="170" y="90" width="60" height="60" rx="4" fill="#3498db" stroke="#fff" stroke-width="1"/>
  <rect x="40" y="155" width="60" height="60" rx="4" fill="#f1c40f" stroke="#fff" stroke-width="1"/>
  <rect x="105" y="155" width="60" height="60" rx="4" fill="#9b59b6" stroke="#fff" stroke-width="1"/>
  <rect x="170" y="155" width="60" height="60" rx="4" fill="#e67e22" stroke="#fff" stroke-width="1"/>
  <rect x="40" y="220" width="60" height="60" rx="4" fill="#1abc9c" stroke="#fff" stroke-width="1"/>
  <rect x="105" y="220" width="60" height="60" rx="4" fill="#e84393" stroke="#fff" stroke-width="1"/>
  <rect x="170" y="220" width="60" height="60" rx="4" fill="#00b894" stroke="#fff" stroke-width="1"/>

  <!-- Ok -->
  <line x1="245" y1="150" x2="285" y2="150" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Gri Tonlama Matrisi -->
  <text x="350" y="80" text-anchor="middle" fill="#7f8c8d" font-size="12" font-weight="bold">Gri Tonlama</text>
  <rect x="300" y="90" width="40" height="40" rx="3" fill="#666" stroke="#fff" stroke-width="1"/>
  <rect x="345" y="90" width="40" height="40" rx="3" fill="#aaa" stroke="#fff" stroke-width="1"/>
  <rect x="390" y="90" width="40" height="40" rx="3" fill="#888" stroke="#fff" stroke-width="1"/>
  <rect x="300" y="135" width="40" height="40" rx="3" fill="#bbb" stroke="#fff" stroke-width="1"/>
  <rect x="345" y="135" width="40" height="40" rx="3" fill="#555" stroke="#fff" stroke-width="1"/>
  <rect x="390" y="135" width="40" height="40" rx="3" fill="#999" stroke="#fff" stroke-width="1"/>
  <rect x="300" y="180" width="40" height="40" rx="3" fill="#ccc" stroke="#fff" stroke-width="1"/>
  <rect x="345" y="180" width="40" height="40" rx="3" fill="#777" stroke="#fff" stroke-width="1"/>
  <rect x="390" y="180" width="40" height="40" rx="3" fill="#444" stroke="#fff" stroke-width="1"/>

  <!-- Formül -->
  <text x="210" y="255" text-anchor="middle" fill="#e67e22" font-size="13" font-family="serif" font-style="italic">Gray = 0.299·R + 0.587·G + 0.114·B</text>

  <!-- Küçük kod parçacığı -->
  <rect x="10" y="260" width="80" height="18" rx="4" fill="#2c3e50" opacity="0.8"/>
  <text x="50" y="274" text-anchor="middle" fill="#ecf0f1" font-size="10">import cv2</text>
  <rect x="340" y="260" width="70" height="18" rx="4" fill="#2c3e50" opacity="0.8"/>
  <text x="375" y="274" text-anchor="middle" fill="#ecf0f1" font-size="10">NumPy</text>
</svg>