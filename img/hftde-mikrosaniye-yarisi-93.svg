    <text x="483" y="246" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#29465a" font-weight="700">Risk Kontrolü</text>
    <text x="483" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718491">Limit ve durdurma</text>
