    <text x="143" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3e769a">20 µs</text>
    <text x="43" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718491">p99</text>
