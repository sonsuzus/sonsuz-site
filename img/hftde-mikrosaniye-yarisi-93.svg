<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#77b9ee"/>
      <stop offset="100%" stop-color="#6dc99a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6c8294" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6c8294" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="58" r="55" fill="#dceeff" opacity="0.55"/>
  <circle cx="589" cy="265" r="76" fill="#dff3df" opacity="0.55"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42596b" font-weight="700">Mikrosaniye Yarışı</text>
  <text x="28" y="46" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a8d99">Fiyat bilgisi → karar → emir → ölçüm</text>

