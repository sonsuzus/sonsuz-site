<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5dcff"/>
      <stop offset="100%" stop-color="#d4e9ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7890a5" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7890a5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="92" cy="39" r="70" fill="#dceef6" opacity="0.38"/>
  <circle cx="577" cy="278" r="95" fill="#dcefdc" opacity="0.38"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40546a">WEB PERFORMANSININ ÖLÇÜLEBİLİR AKIŞI</text>

  <!-- source -->
  <g filter="url(#shadow)">
    <rect x="32" y="120" width="116" height="82" rx="18" fill="#ffffff"/>
    <rect x="43" y="134" width="94" height="24" rx="8" fill="#d8eff0"/>
    <path d="M58 150h25M58 143h38M94 142h27M94 150h20" stroke="#5c8e94" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="44" y="169" width="40" height="20" rx="5" fill="#f7d9c9"/>
    <rect x="89" y="169" width="47" height="20" rx="5" fill="#d9e2ff"/>
    <text x="90" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40546a">Web Sayfası</text>
  </g>

  <!-- arrow source core -->
  <path d="M151 160H190" fill="none" stroke="#7999aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="190,160 181,155 181,165" fill="#7999aa"/>

  <!-- observer -->
  <g filter="url(#softShadow)">
    <rect x="193" y="132" width="94" height="56" rx="15" fill="#fffdf8"/>
    <path d="M214 151c8-9 20-9 28 0-8 9-20 9-28 0Z" fill="none" stroke="#b58654" stroke-width="2"/>
    <circle cx="228" cy="151" r="3.5" fill="#b58654"/>
    <path d="M211 169h58" stroke="#d7bd99" stroke-width="3" stroke-linecap="round"/>
    <text x="240" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40546a">Gözlemci</text>
  </g>

  <path d="M290 160H315" fill="none" stroke="#7999aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="315,160 306,155 306,165" fill="#7999aa"/>

  <!-- core central -->
  <g filter="url(#shadow)">
    <rect x="318" y="98" width="142" height="124" rx="25" fill="url(#core)" stroke="#c4d7eb" stroke-width="1.2"/>
    <circle cx="389" cy="139" r="25" fill="#ffffff" opacity="0.85"/>
    <path d="M375 140h9l5-12 7 23 5-11h10" fill="none" stroke="#697da8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="389" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#485c7e">Core Web Vitals</text>
    <text x="389" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#627895">Tarayıcı ölçümü</text>
  </g>

  <!-- metric branches -->
  <path d="M462 126C480 105 483 78 495 74" fill="none" stroke="#8a9eae" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="495,74 485,75 491,83" fill="#8a9eae"/>
  <path d="M462 160H493" fill="none" stroke="#8a9eae" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="493,160 484,155 484,165" fill="#8a9eae"/>
  <path d="M462 194c18 20 21 46 33 50" fill="none" stroke="#8a9eae" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="495,244 486,236 484,246" fill="#8a9eae"/>

  <!-- LCP -->
  <g filter="url(#softShadow)">
    <rect x="499" y="43" width="111" height="57" rx="15" fill="#fff4df"/>
    <circle cx="520" cy="70" r="12" fill="#f6c778"/>
    <path d="M520 62v9l6 4" fill="none" stroke="#96692d" stroke-width="2" stroke-linecap="round"/>
    <text x="544" y="66" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76532b">LCP</text>
    <text x="544" y="83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#876b48">Görünme</text>
  </g>

  <!-- INP -->
  <g filter="url(#softShadow)">
    <rect x="499" y="131" width="111" height="57" rx="15" fill="#e2f3eb"/>
    <circle cx="520" cy="159" r="12" fill="#96cfb1"/>
    <path d="M516 154l9 5-5 3-2 5-3-13Z" fill="#477d63"/>
    <text x="544" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6f58">INP</text>
    <text x="544" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#577d69">Tepki</text>
  </g>

  <!-- CLS -->
  <g filter="url(#softShadow)">
    <rect x="499" y="219" width="111" height="57" rx="15" fill="#eee6fa"/>
    <rect x="509" y="238" width="17" height="15" rx="3" fill="#b9a0dd"/>
    <path d="M530 246h12M539 240l5 6-5 6" fill="none" stroke="#76608f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="552" y="243" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#67527d">CLS</text>
    <text x="552" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79688d">Kararlılık</text>
  </g>

  <!-- lower process rail -->
  <path d="M112 266H446" fill="none" stroke="#b5cbd1" stroke-width="2" stroke-linecap="round"/>
  <polygon points="446,266 437,261 437,271" fill="#91aeb6"/>

  <g filter="url(#softShadow)">
    <rect x="140" y="245" width="103" height="42" rx="13" fill="#ffffff"/>
    <text x="191" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#506979">Saha Verisi</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="270" y="245" width="104" height="42" rx="13" fill="#ffffff"/>
    <text x="322" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#506979">Kalite Puanı</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="400" y="245" width="103" height="42" rx="13" fill="#ffffff"/>
    <text x="451" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#506979">CI/CD Denetim</text>
  </g>
</svg>