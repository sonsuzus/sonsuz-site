<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="gecit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9d8ff"/>
      <stop offset="100%" stop-color="#bcefe2"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c7392" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5c7392" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="80" cy="45" r="65" fill="#dcecff" opacity="0.48"/>
  <circle cx="583" cy="276" r="90" fill="#d9f2db" opacity="0.42"/>

  <text x="32" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38506d">Tek Kapı ile Mikroservis Yönetimi</text>
  <text x="32" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7d91">Merkezî denetim ve güvenli yönlendirme</text>

  <!-- Client -->
  <g filter="url(#golge)">
    <rect x="34" y="108" width="112" height="96" rx="19" fill="#ffffff"/>
    <rect x="47" y="121" width="86" height="50" rx="9" fill="#ddecff"/>
    <rect x="62" y="181" width="56" height="7" rx="3.5" fill="#a9bedb"/>
    <circle cx="90" cy="146" r="13" fill="#7698c7"/>
    <path d="M84 146 L89 151 L98 140" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40556f">İstemci</text>

  <!-- Incoming arrow -->
  <path d="M151 156 H193" fill="none" stroke="#7490af" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="198,156 189,151 189,161" fill="#7490af"/>
  <text x="171" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60768d">İstek</text>

  <!-- Load balancer -->
  <g filter="url(#hafifGolge)">
    <rect x="202" y="85" width="132" height="44" rx="14" fill="#fff7d9" stroke="#edd99a"/>
    <circle cx="222" cy="107" r="9" fill="#e9bd65"/>
    <path d="M217 107 H227 M222 102 V112" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="274" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#6d5a2d">Yük Dengeleyici</text>
  </g>

  <!-- Line down to replicas -->
  <path d="M268 130 V145 M238 145 H298" fill="none" stroke="#9a895d" stroke-width="2" stroke-linecap="round"/>
  <path d="M238 145 V153 M298 145 V153" fill="none" stroke="#9a895d" stroke-width="2" stroke-linecap="round"/>

  <!-- Gateways -->
  <g filter="url(#golge)">
    <rect x="181" y="155" width="115" height="83" rx="18" fill="url(#gecit)" stroke="#9dc9d4"/>
    <rect x="198" y="171" width="28" height="28" rx="8" fill="#5d9fbc"/>
    <path d="M206 185 H218 M212 179 V191" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="247" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#2e596d">API Gateway</text>
    <text x="247" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426f7c">Örnek A</text>
    <rect x="202" y="214" width="90" height="8" rx="4" fill="#ffffff" opacity="0.72"/>
  </g>

  <g filter="url(#golge)">
    <rect x="310" y="155" width="115" height="83" rx="18" fill="url(#gecit)" stroke="#9dc9d4"/>
    <rect x="327" y="171" width="28" height="28" rx="8" fill="#5d9fbc"/>
    <path d="M335 185 H347 M341 179 V191" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="376" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#2e596d">API Gateway</text>
    <text x="376" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426f7c">Örnek B</text>
    <rect x="331" y="214" width="90" height="8" rx="4" fill="#ffffff" opacity="0.72"/>
  </g>

  <!-- Security control pills -->
  <g filter="url(#hafifGolge)">
    <rect x="180" y="258" width="98" height="32" rx="12" fill="#eee5ff"/>
    <path d="M196 267 L203 264 L210 267 V273 C210 278 203 281 203 281 C203 281 196 278 196 273 Z" fill="#9474be"/>
    <text x="243" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5d4778">Kimlik</text>
  </g>
  <g filter="url(#hafifGolge)">
    <rect x="291" y="258" width="111" height="32" rx="12" fill="#ffe9dc"/>
    <circle cx="309" cy="274" r="9" fill="#df8c66"/>
    <path d="M309 269 V274 L313 277" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#895139">Hız sınırı</text>
  </g>
  <path d="M230 239 V254 M370 239 V254" fill="none" stroke="#90a8ae" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Outbound routing -->
  <path d="M430 181 H459 V103 H480" fill="none" stroke="#668da2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="485,103 476,98 476,108" fill="#668da2"/>
  <path d="M430 190 H470 V160 H480" fill="none" stroke="#668da2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="485,160 476,155 476,165" fill="#668da2"/>
  <path d="M430 199 H459 V217 H480" fill="none" stroke="#668da2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="485,217 476,212 476,222" fill="#668da2"/>

  <!-- Services -->
  <g filter="url(#hafifGolge)">
    <rect x="485" y="76" width="124" height="53" rx="15" fill="#ffe7e2"/>
    <circle cx="510" cy="102" r="13" fill="#e78e7c"/>
    <circle cx="510" cy="98" r="4" fill="#ffffff"/>
    <path d="M503 110 C504 104 516 104 517 110" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="559" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#79463f">Kullanıcı</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="485" y="133" width="124" height="53" rx="15" fill="#e5efff"/>
    <rect x="500" y="148" width="20" height="20" rx="5" fill="#7196cf"/>
    <path d="M505 154 H516 M505 159 H513" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="559" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#3f5c8d">Sipariş</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="485" y="190" width="124" height="53" rx="15" fill="#e6f5e9"/>
    <circle cx="510" cy="216" r="13" fill="#78af88"/>
    <path d="M503 216 H517 M510 209 V223" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="559" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#416d4c">Ödeme ve Stok</text>
  </g>

  <!-- Response -->
  <path d="M459 249 H150" fill="none" stroke="#91a8b4" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round"/>
  <polygon points="145,249 154,244 154,254" fill="#91a8b4"/>
  <text x="156" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7f8c">Yanıt ve kayıt</text>
</svg>