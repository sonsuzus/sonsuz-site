<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7e9"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2e7"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8fd"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Ana Başlık -->
  <rect x="200" y="15" width="240" height="36" rx="18" fill="#4a7db5" filter="url(#shadow1)" opacity="0.9"/>
  <text x="320" y="38" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Python Listeler</text>

  <!-- Merkez Liste Kutusu -->
  <rect x="240" y="70" width="160" height="50" rx="10" fill="url(#boxGrad1)" stroke="#5b9bd5" stroke-width="1.5" filter="url(#shadow1)"/>
  <text x="320" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c5f8a" text-anchor="middle">Liste</text>
  <text x="320" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7db5" text-anchor="middle">[10, 20, 30]</text>

  <!-- Ok: Liste -> Öğeler -->
  <path d="M 320 120 L 320 145" stroke="#5b9bd5" stroke-width="2" fill="none"/>
  <polygon points="315,143 320,153 325,143" fill="#5b9bd5"/>

  <!-- Öğeler Kutusu -->
  <rect x="220" y="155" width="200" height="40" rx="10" fill="url(#boxGrad2)" stroke="#6fbf73" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="320" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d6e30" text-anchor="middle">Öğeler</text>
  <text x="320" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a4d" text-anchor="middle">Sıralı değer kümesi</text>

  <!-- Ok: Öğeler -> İndis -->
  <path d="M 220 175 L 160 175" stroke="#6fbf73" stroke-width="2" fill="none"/>
  <polygon points="162,170 152,175 162,180" fill="#6fbf73"/>

  <!-- İndis Kutusu -->
  <rect x="40" y="155" width="110" height="40" rx="10" fill="url(#boxGrad2)" stroke="#6fbf73" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="95" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d6e30" text-anchor="middle">İndis</text>
  <text x="95" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a4d" text-anchor="middle">0, 1, 2...</text>

  <!-- Ok: Öğeler -> Diziler -->
  <path d="M 420 175 L 480 175" stroke="#6fbf73" stroke-width="2" fill="none"/>
  <polygon points="478,170 488,175 478,180" fill="#6fbf73"/>

  <!-- Diziler Kutusu -->
  <rect x="490" y="155" width="120" height="40" rx="10" fill="url(#boxGrad2)" stroke="#6fbf73" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="550" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2d6e30" text-anchor="middle">Diziler</text>
  <text x="550" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a4d" text-anchor="middle">Sequences</text>

  <!-- Alt Bölüm: Liste Türleri -->
  <rect x="70" y="230" width="500" height="70" rx="12" fill="#ffffff" opacity="0.6" filter="url(#shadow2)"/>

  <text x="320" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a5a5a" text-anchor="middle">Liste Türleri</text>

  <!-- Tamsayı Listesi -->
  <rect x="95" y="258" width="100" height="30" rx="8" fill="url(#boxGrad3)" stroke="#e8a75d" stroke-width="1.2"/>
  <text x="145" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a5a20" text-anchor="middle">Tamsayı</text>

  <!-- Karakter Dizisi -->
  <rect x="215" y="258" width="100" height="30" rx="8" fill="url(#boxGrad3)" stroke="#e8a75d" stroke-width="1.2"/>
  <text x="265" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a5a20" text-anchor="middle">Karakter Dizisi</text>

  <!-- İçiçe Liste -->
  <rect x="335" y="258" width="100" height="30" rx="8" fill="url(#boxGrad3)" stroke="#e8a75d" stroke-width="1.2"/>
  <text x="385" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a5a20" text-anchor="middle">İçiçe Liste</text>

  <!-- Boş Liste -->
  <rect x="455" y="258" width="90" height="30" rx="8" fill="url(#boxGrad3)" stroke="#e8a75d" stroke-width="1.2"/>
  <text x="500" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a5a20" text-anchor="middle">Boş Liste []</text>

  <!-- Bağlantı Çizgileri -->
  <line x1="145" y1="258" x2="145" y2="248" stroke="#d4a373" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="265" y1="258" x2="265" y2="248" stroke="#d4a373" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="385" y1="258" x2="385" y2="248" stroke="#d4a373" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="258" x2="500" y2="248" stroke="#d4a373" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Boolean Değer -->
  <rect x="240" y="120" width="160" height="25" rx="8" fill="url(#boxGrad4)" stroke="#9b7bb8" stroke-width="1.2" opacity="0.9"/>
  <text x="320" y="137" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6b4d8a" text-anchor="middle">Boolean: [] = Yanlış</text>

</svg>