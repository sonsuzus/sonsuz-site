<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  
  <text x="20" y="25" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7799AA">Terminal Oyun Mimarisi</text>

  <!-- Oklar -->
  <g stroke="#8899AA" stroke-width="2" fill="none">
    <line x1="260" y1="160" x2="150" y2="160"/>
    <line x1="320" y1="80" x2="320" y2="120"/>
    <line x1="320" y1="240" x2="320" y2="200"/>
    <line x1="380" y1="160" x2="490" y2="160"/>
  </g>

  <!-- Ok başları -->
  <g fill="#8899AA">
    <polygon points="150,160 160,155 160,165"/>
    <polygon points="320,120 315,110 325,110"/>
    <polygon points="320,200 315,210 325,210"/>
    <polygon points="490,160 480,155 480,165"/>
  </g>

  <!-- Ok etiketleri -->
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#556677">
    <text x="205" y="153" text-anchor="middle">yaz</text>
    <text x="328" y="103" text-anchor="start">tuş</text>
    <text x="328" y="223" text-anchor="start">oku</text>
    <text x="435" y="153" text-anchor="middle">çiz</text>
  </g>

  <!-- ANSI Kutusu -->
  <g filter="url(#shadow)" font-family="Segoe UI, Tahoma, sans-serif">
    <rect x="20" y="120" width="130" height="80" rx="14" fill="#FFE0CC" stroke="#E0A97A"/>
    <text x="85" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4B5A">ANSI Kodları</text>
    <text x="85" y="170" text-anchor="middle" font-size="12" fill="#3D4B5A">İmleç + Renk + Temizlik</text>
  </g>

  <!-- Girdi Kutusu -->
  <g filter="url(#shadow)" font-family="Segoe UI, Tahoma, sans-serif">
    <rect x="250" y="20" width="140" height="60" rx="12" fill="#CCE5FF" stroke="#8FB7D9"/>
    <text x="320" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4B5A">Anlık Girdi</text>
    <text x="320" y="60" text-anchor="middle" font-size="12" fill="#3D4B5A">Raw Mode</text>
  </g>

  <!-- Durum Kutusu -->
  <g filter="url(#shadow)" font-family="Segoe UI, Tahoma, sans-serif">
    <rect x="250" y="240" width="140" height="60" rx="12" fill="#E2F5CC" stroke="#A9C88C"/>
    <text x="320" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4B5A">Oyun Durumu</text>
    <text x="320" y="280" text-anchor="middle" font-size="12" fill="#3D4B5A">Liste + Yön + Yem + Skor</text>
  </g>

  <!-- Render Kutusu -->
  <g filter="url(#shadow)" font-family="Segoe UI, Tahoma, sans-serif">
    <rect x="490" y="120" width="130" height="80" rx="14" fill="#F7D9F7" stroke="#C993C9"/>
    <text x="555" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4B5A">Render Stratejisi</text>
    <text x="555" y="170" text-anchor="middle" font-size="12" fill="#3D4B5A">Sadece değişeni çiz</text>
  </g>

  <!-- Merkez Döngü Kutusu -->
  <g filter="url(#shadow)" font-family="Segoe UI, Tahoma, sans-serif">
    <rect x="260" y="120" width="120" height="80" rx="14" fill="#FFF2CC" stroke="#D6C68A"/>
    <text x="320" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4B5A">GERÇEK</text>
    <text x="320" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#3D4B5A">ZAMANLI DÖNGÜ</text>
  </g>
</svg>