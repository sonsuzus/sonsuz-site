  <path d="M490 130 L494 134 L501 126" fill="none" stroke="#3a8660" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="513" y="134" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#438060">T erişilebilir</text>
  <text x="491" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#748398">O(nT) zaman, O(T) bellek</text>

