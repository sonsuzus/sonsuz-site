  <text x="32" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Küçük T → kapasite tabanlı DP</text>
  <text x="394" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Büyük T → farklı yaklaşım</text>
