  <text x="320" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#375a7d">YÜRÜYÜŞ MOTORU</text>
  <text x="320" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c6d8e">Gen DNA'sı</text>
  <path d="M284 176 C296 163 308 189 320 176 C332 163 344 189 356 176" fill="none" stroke="#5382b5" stroke-width="3" stroke-linecap="round"/>
  <path d="M284 191 H356" stroke="#83a7ca" stroke-width="2" stroke-linecap="round"/>
  <circle cx="292" cy="191" r="3" fill="#5382b5"/>
  <circle cx="320" cy="191" r="3" fill="#5382b5"/>
  <circle cx="348" cy="191" r="3" fill="#5382b5"/>

  <!-- Alt açıklama -->
  <g opacity="0.86">
    <rect x="239" y="286" width="162" height="23" rx="11.5" fill="#dcebe4"/>
    <text x="320" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#487261">Nesiller boyunca iyileşme</text>
