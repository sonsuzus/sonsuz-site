  <text x="128.5" y="77" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#66552d">Rastgele Popülasyon</text>
  <g fill="#e8ad76">
    <circle cx="84" cy="97" r="6"/><circle cx="103" cy="97" r="6"/>
    <circle cx="122" cy="97" r="6"/><circle cx="141" cy="97" r="6"/>
    <circle cx="160" cy="97" r="6"/>
  </g>
  <g fill="#fff8e8" opacity="0.8">
