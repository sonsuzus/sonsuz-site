  <text x="487" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#91465f">Uygunluk Skoru</text>
  <text x="487" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a45a71">mesafe · denge · enerji</text>

