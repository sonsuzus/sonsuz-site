  <text x="146.5" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5e4b88">Seçim ve Çaprazlama</text>
  <text x="146.5" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74629a">Mutasyon · Elitizm</text>

