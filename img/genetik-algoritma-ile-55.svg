<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9daf4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7084a0" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6f8a85" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="123" fill="#ffffff" opacity="0.36"/>
  <circle cx="320" cy="160" r="92" fill="none" stroke="#bfd6dc" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- Bağlantılar -->
  <path d="M195 86 C237 61 270 57 292 72" fill="none" stroke="#8daeb9" stroke-width="2.5"/>
  <polygon points="291,65 305,76 288,79" fill="#8daeb9"/>

  <path d="M403 77 C449 78 473 94 488 119" fill="none" stroke="#8daeb9" stroke-width="2.5"/>
  <polygon points="480,116 493,130 476,126" fill="#8daeb9"/>

