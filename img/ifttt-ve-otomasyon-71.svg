<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="github" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4fa"/>
      <stop offset="100%" stop-color="#d9d4f1"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff4ed"/>
      <stop offset="100%" stop-color="#c9eadf"/>
    </linearGradient>
    <linearGradient id="ifttt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0d9"/>
      <stop offset="100%" stop-color="#f8dfb7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceefd"/>
      <stop offset="100%" stop-color="#c7e0f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-35%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="60" cy="53" r="58" fill="#d9ecfa" opacity="0.35"/>
  <circle cx="587" cy="277" r="80" fill="#dff0d7" opacity="0.38"/>
  <path d="M34 225 C137 258 192 238 275 260 S463 289 611 246" fill="none" stroke="#b9dcbf" stroke-width="2" opacity="0.38"/>

  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">OLAY TABANLI OTOMASYON ZİNCİRİ</text>
  <text x="320" y="51" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71889a">Olay → Koşul → Eylem</text>

  <!-- connectors -->
  <path d="M145 135 H178" fill="none" stroke="#7993aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="178,135 169,130 169,140" fill="#7993aa"/>
  <path d="M301 135 H334" fill="none" stroke="#7993aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="334,135 325,130 325,140" fill="#7993aa"/>
  <path d="M457 135 H490" fill="none" stroke="#7993aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="490,135 481,130 481,140" fill="#7993aa"/>

  <!-- GitHub -->
  <g filter="url(#shadow)">
    <rect x="28" y="88" width="117" height="94" rx="18" fill="url(#github)"/>
  </g>
  <circle cx="56" cy="116" r="16" fill="#756c9c"/>
  <path d="M48 119 Q48 109 56 109 Q64 109 64 119 M51 122 L51 125 M61 122 L61 125 M53 116 L54 116 M58 116 L59 116" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="88" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e4967">GitHub</text>
  <text x="88" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f6680">Yeni kayıt</text>
  <rect x="44" y="149" width="84" height="20" rx="10" fill="#ffffff" opacity="0.72"/>
  <text x="86" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#625984">Webhook</text>

  <!-- Python -->
  <g filter="url(#shadow)">
    <rect x="178" y="76" width="123" height="116" rx="18" fill="url(#app)"/>
  </g>
  <rect x="198" y="94" width="39" height="39" rx="11" fill="#5eaa93"/>
  <path d="M207 106 L213 112 L207 118 M220 106 L214 112 L220 118" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="111" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b52">Uygulama</text>
  <text x="248" y="129" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f746b">Python</text>
  <path d="M194 147 H285" stroke="#a8d9ca" stroke-width="1"/>
  <circle cx="204" cy="164" r="5" fill="#e77d72"/>
  <text x="216" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#40685f">urgent etiketi</text>

  <!-- IFTTT -->
  <g filter="url(#shadow)">
    <rect x="334" y="88" width="123" height="94" rx="18" fill="url(#ifttt)"/>
  </g>
  <rect x="354" y="106" width="33" height="33" rx="8" fill="#ed725f"/>
  <rect x="359" y="112" width="7" height="7" rx="1.5" fill="#fff"/>
  <rect x="374" y="112" width="7" height="7" rx="1.5" fill="#fff"/>
  <rect x="359" y="126" width="7" height="7" rx="1.5" fill="#fff"/>
  <rect x="374" y="126" width="7" height="7" rx="1.5" fill="#fff"/>
  <text x="398" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805231">IFTTT</text>
  <text x="398" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8c6b4a">Webhooks</text>
  <rect x="351" y="149" width="89" height="20" rx="10" fill="#ffffff" opacity="0.65"/>
  <text x="395" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#92663c">HTTP isteği</text>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="490" y="88" width="121" height="94" rx="18" fill="url(#phone)"/>
  </g>
  <rect x="510" y="101" width="26" height="48" rx="6" fill="#4a83a8"/>
  <rect x="514" y="107" width="18" height="31" rx="2" fill="#e9f6ff"/>
  <circle cx="523" cy="144" r="2" fill="#e9f6ff"/>
  <text x="550" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356482">Telefon</text>
  <text x="550" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52758d">Bildirim</text>
  <path d="M507 160 C512 153 520 153 525 160 C530 153 538 153 543 160" fill="none" stroke="#70a2bf" stroke-width="2" stroke-linecap="round"/>

  <!-- lower resilience rail -->
  <path d="M239 193 V220 H313" fill="none" stroke="#91a7b7" stroke-width="1.8" stroke-dasharray="4 4"/>
  <polygon points="313,220 305,216 305,224" fill="#91a7b7"/>
  <path d="M395 220 H457 V193" fill="none" stroke="#91a7b7" stroke-width="1.8" stroke-dasharray="4 4"/>
  <polygon points="457,193 453,201 461,201" fill="#91a7b7"/>

  <g filter="url(#smallShadow)">
    <rect x="313" y="202" width="82" height="37" rx="13" fill="#ffffff"/>
  </g>
  <circle cx="331" cy="220" r="9" fill="#a9c6d5"/>
  <path d="M327 220 H335 M331 216 V224" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="360" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526e80">Kuyruk</text>
  <text x="360" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758d9b">yeniden dene</text>

  <!-- footer cards -->
  <g filter="url(#smallShadow)">
    <rect x="94" y="260" width="126" height="35" rx="12" fill="#ffffff" opacity="0.9"/>
    <rect x="257" y="260" width="126" height="35" rx="12" fill="#ffffff" opacity="0.9"/>
    <rect x="420" y="260" width="126" height="35" rx="12" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="111" cy="277" r="5" fill="#8377ae"/>
  <text x="124" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526978">Olay kaydı</text>
  <circle cx="274" cy="277" r="5" fill="#5eaa93"/>
  <text x="287" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526978">Tekilleştirme</text>
  <circle cx="437" cy="277" r="5" fill="#e39a55"/>
  <text x="450" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526978">Hız sınırı</text>
</svg>