<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#90a4ae" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#37474f">Javascript Değişkenler</text>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c">Geçici Veri Saklama ve Hesaplama</text>

  <!-- Bellek Alanı (ana kavram) -->
  <rect x="220" y="100" width="200" height="60" rx="14" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Bellek Alanı</text>
  <text x="320" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Geçici veri saklama</text>

  <!-- Değişkenler -->
  <rect x="50" y="190" width="130" height="50" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="115" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">var not1</text>
  <text x="115" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">= 50</text>

  <rect x="255" y="190" width="130" height="50" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">var not2</text>
  <text x="320" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">= 60</text>

  <rect x="460" y="190" width="130" height="50" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="525" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">var k</text>
  <text x="525" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">= undefined</text>

  <!-- Hesaplama kutusu -->
  <rect x="220" y="260" width="200" height="45" rx="12" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">ortalama</text>
  <text x="320" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">(not1 + not2) / 2</text>

  <!-- Oklar (manuel çizim) -->
  <!-- not1 -> bellek -->
  <line x1="115" y1="190" x2="280" y2="160" stroke="#ff9800" stroke-width="1.8"/>
  <polygon points="280,160 272,155 276,164" fill="#ff9800"/>

  <!-- not2 -> bellek -->
  <line x1="320" y1="190" x2="320" y2="160" stroke="#ff9800" stroke-width="1.8"/>
  <polygon points="320,160 314,155 326,155" fill="#ff9800"/>

  <!-- k -> bellek -->
  <line x1="525" y1="190" x2="360" y2="160" stroke="#ff9800" stroke-width="1.8"/>
  <polygon points="360,160 352,155 356,164" fill="#ff9800"/>

  <!-- bellek -> ortalama -->
  <line x1="320" y1="160" x2="320" y2="260" stroke="#66bb6a" stroke-width="1.8"/>
  <polygon points="320,260 314,252 326,252" fill="#66bb6a"/>

  <!-- Değişken tanımlama etiketi -->
  <rect x="50" y="65" width="180" height="28" rx="8" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#b39ddb" stroke-width="1.2"/>
  <text x="140" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4527a0">var / let ile tanımlama</text>

  <!-- Değer atama etiketi -->
  <rect x="410" y="65" width="180" height="28" rx="8" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f48fb1" stroke-width="1.2"/>
  <text x="500" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">= değer atama</text>

  <!-- Tanımlama -> bellek -->
  <line x1="140" y1="93" x2="260" y2="100" stroke="#7e57c2" stroke-width="1.5"/>
  <polygon points="260,100 252,96 254,105" fill="#7e57c2"/>

  <!-- Atama -> bellek -->
  <line x1="500" y1="93" x2="380" y2="100" stroke="#ec407a" stroke-width="1.5"/>
  <polygon points="380,100 372,96 374,105" fill="#ec407a"/>

  <!-- Noktalı virgül notu -->
  <text x="590" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" transform="rotate(-90, 590, 270)">; noktalı virgül</text>

  <!-- String atama notu -->
  <text x="80" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" transform="rotate(90, 80, 270)">string: tek tırnak veya çift tırnak</text>
</svg>