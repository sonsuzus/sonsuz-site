<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8cccf2"/>
      <stop offset="100%" stop-color="#9edbb4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#52738a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52738a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="61" cy="45" r="72" fill="#dff1fb" opacity="0.55"/>
  <circle cx="589" cy="268" r="94" fill="#def1d9" opacity="0.48"/>
  <path d="M42 192 C124 149 159 224 234 190 S361 155 434 188 S544 219 610 163" fill="none" stroke="#b9dce9" stroke-width="2" stroke-dasharray="5 7" opacity="0.7"/>

  <text x="32" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">Gerçek Zamanlı Dolandırıcılık Dedektifi</text>
  <text x="32" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668196">Bağlam → anomali skoru → dengeli karar</text>

  <!-- input signals -->
  <g filter="url(#smallShadow)">
    <rect x="31" y="78" width="118" height="54" rx="15" fill="#ffffff"/>
    <rect x="31" y="78" width="7" height="54" rx="4" fill="#77bfe8"/>
    <circle cx="57" cy="105" r="13" fill="#e4f4fc"/>
    <path d="M52 101 h10 M52 106 h7 M52 111 h10" stroke="#4b9fcf" stroke-width="2" stroke-linecap="round"/>
    <text x="79" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#34576d">İşlem Akışı</text>
    <text x="79" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668196">anlık olaylar</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="31" y="151" width="118" height="54" rx="15" fill="#ffffff"/>
    <rect x="31" y="151" width="7" height="54" rx="4" fill="#a48ddd"/>
    <circle cx="57" cy="178" r="13" fill="#eeeafd"/>
    <path d="M51 182 V176 M57 182 V171 M63 182 V174" stroke="#7964bb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="79" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4d4376">Davranış Geçmişi</text>
    <text x="79" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71698c">özellik deposu</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="31" y="224" width="118" height="54" rx="15" fill="#ffffff"/>
    <rect x="31" y="224" width="7" height="54" rx="4" fill="#e8ae75"/>
    <circle cx="57" cy="251" r="13" fill="#fff1e3"/>
    <path d="M51 253 l4 4 9-11" fill="none" stroke="#d58442" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="79" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#765236">Kurallar ve Sinyaller</text>
    <text x="79" y="263" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8c725b">cihaz · konum</text>
  </g>

  <!-- lines to feature hub -->
  <path d="M149 105 H174 V153 H194" fill="none" stroke="#80bfe0" stroke-width="2.2"/>
  <polygon points="194,153 186,148 186,158" fill="#80bfe0"/>
  <path d="M149 178 H194" fill="none" stroke="#9785cf" stroke-width="2.2"/>
  <polygon points="194,178 186,173 186,183" fill="#9785cf"/>
  <path d="M149 251 H174 V203 H194" fill="none" stroke="#dfab78" stroke-width="2.2"/>
  <polygon points="194,203 186,198 186,208" fill="#dfab78"/>

  <!-- feature window -->
  <g filter="url(#shadow)">
    <rect x="194" y="126" width="119" height="105" rx="19" fill="#ffffff"/>
    <rect x="207" y="140" width="93" height="25" rx="10" fill="#e8f5fc"/>
    <text x="253.5" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3a718c">Zaman Penceresi</text>
    <text x="253.5" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58758a">tekilleştirme</text>
    <text x="253.5" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58758a">olay zamanı</text>
    <circle cx="212" cy="214" r="4" fill="#9fcce2"/>
    <circle cx="224" cy="214" r="4" fill="#b1d9b7"/>
    <circle cx="236" cy="214" r="4" fill="#dcc99d"/>
  </g>

  <path d="M313 178 H335" fill="none" stroke="#6faecf" stroke-width="2.4"/>
  <polygon points="335,178 327,173 327,183" fill="#6faecf"/>

  <!-- model -->
  <g filter="url(#shadow)">
    <rect x="335" y="104" width="130" height="148" rx="22" fill="#ffffff"/>
    <circle cx="400" cy="145" r="27" fill="#e6f4ea"/>
    <path d="M400 124 V166 M400 134 L384 145 L400 156 L416 145 Z" fill="none" stroke="#58a978" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="400" cy="134" r="3.5" fill="#58a978"/>
    <circle cx="384" cy="145" r="3.5" fill="#58a978"/>
    <circle cx="400" cy="156" r="3.5" fill="#58a978"/>
    <circle cx="416" cy="145" r="3.5" fill="#58a978"/>
    <text x="400" y="191" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356d4b">Anomali Modeli</text>
    <text x="400" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#628070">yalnızlaştırma</text>
    <rect x="360" y="221" width="80" height="16" rx="8" fill="#f0f8f1"/>
    <text x="400" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c8c62">skor üret</text>
  </g>

  <path d="M465 178 H487" fill="none" stroke="#62ad81" stroke-width="2.4"/>
  <polygon points="487,178 479,173 479,183" fill="#62ad81"/>

  <!-- decision -->
  <g filter="url(#shadow)">
    <rect x="487" y="126" width="121" height="105" rx="19" fill="#ffffff"/>
    <path d="M547 143 L575 171 L547 199 L519 171 Z" fill="#fff2dd" stroke="#e1ad66" stroke-width="1.5"/>
    <text x="547" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805a2c">Karar</text>
    <text x="547" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#805a2c">servisi</text>
  </g>

  <!-- outputs -->
  <path d="M547 126 V89 H582" fill="none" stroke="#70b689" stroke-width="2"/>
  <polygon points="582,89 574,84 574,94" fill="#70b689"/>
  <rect x="582" y="72" width="46" height="33" rx="11" fill="#e6f5e9" filter="url(#smallShadow)"/>
  <text x="605" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#427a54">Geçir</text>

  <path d="M608 178 H619" fill="none" stroke="#d59b4d" stroke-width="2"/>
  <polygon points="619,178 611,173 611,183" fill="#d59b4d"/>
  <rect x="570" y="162" width="58" height="32" rx="11" fill="#fff2df" filter="url(#smallShadow)"/>
  <text x="599" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#96632b">Doğrula</text>

  <path d="M547 231 V266 H582" fill="none" stroke="#dd7480" stroke-width="2"/>
  <polygon points="582,266 574,261 574,271" fill="#dd7480"/>
  <rect x="582" y="249" width="46" height="33" rx="11" fill="#fde8eb" filter="url(#smallShadow)"/>
  <text x="605" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#a54a58">İncele</text>

  <!-- feedback monitoring -->
  <path d="M400 252 V281 H253 V244" fill="none" stroke="#9bb8c8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <polygon points="253,244 248,252 258,252" fill="#9bb8c8"/>
  <rect x="305" y="270" width="92" height="25" rx="12" fill="#eef4f7" filter="url(#smallShadow)"/>
  <text x="351" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557286">İzleme ve eğitim</text>
</svg>