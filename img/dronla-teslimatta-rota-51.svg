<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#d9f4e5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#58708b" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a7180" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="120" fill="#dbeefd" opacity="0.35"/>
  <circle cx="320" cy="160" r="88" fill="none" stroke="#aac8dc" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.65"/>

  <!-- Bağlantılar -->
  <path d="M175 84 C207 95 225 111 246 126" fill="none" stroke="#7a9db9" stroke-width="2"/>
  <polygon points="246,126 237,124 241,133" fill="#7a9db9"/>

  <path d="M177 235 C204 220 225 202 249 187" fill="none" stroke="#7a9db9" stroke-width="2"/>
  <polygon points="249,187 240,188 244,196" fill="#7a9db9"/>

  <path d="M457 83 C432 98 414 111 394 126" fill="none" stroke="#7a9db9" stroke-width="2"/>
  <polygon points="394,126 399,117 405,125" fill="#7a9db9"/>

  <path d="M461 234 C433 218 416 201 394 186" fill="none" stroke="#7a9db9" stroke-width="2"/>
  <polygon points="394,186 404,188 399,196" fill="#7a9db9"/>

  <!-- Sol üst: yük -->
  <g filter="url(#soft)">
    <rect x="48" y="50" width="128" height="68" rx="16" fill="#fff4df"/>
    <rect x="59" y="61" width="30" height="30" rx="8" fill="#ffd79a"/>
    <path d="M66 70 h16 v13 h-16z M66 70 l8-5 8 5 M74 65 v18" fill="none" stroke="#a96d2a" stroke-width="1.5"/>
    <text x="101" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#5b4a35">Yük</text>
    <text x="101" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b6a52">Etapta azalır</text>
  </g>

  <!-- Sol alt: rüzgar -->
  <g filter="url(#soft)">
    <rect x="48" y="202" width="130" height="68" rx="16" fill="#e7f0ff"/>
    <path d="M62 226 C70 218 80 222 84 226 C89 231 97 230 101 225" fill="none" stroke="#6297c5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M62 239 C72 232 84 236 89 240 C94 244 103 243 109 237" fill="none" stroke="#6297c5" stroke-width="2.2" stroke-linecap="round"/>
    <text x="117" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#405d78">Rüzgâr</text>
    <text x="117" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60788e">Yön etkisi</text>
  </g>

  <!-- Sağ üst: batarya -->
  <g filter="url(#soft)">
    <rect x="458" y="50" width="137" height="68" rx="16" fill="#e5f7e9"/>
    <rect x="471" y="64" width="31" height="19" rx="4" fill="none" stroke="#45956a" stroke-width="2"/>
    <rect x="503" y="69" width="4" height="9" rx="1" fill="#45956a"/>
    <rect x="474" y="67" width="19" height="13" rx="2" fill="#7bd49d"/>
    <text x="517" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#355e45">Batarya</text>
    <text x="517" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587563">Güvenlik payı</text>
  </g>

  <!-- Sağ alt: süre risk -->
  <g filter="url(#soft)">
    <rect x="456" y="202" width="139" height="68" rx="16" fill="#f3eafd"/>
    <circle cx="476" cy="233" r="14" fill="#dfc7f5"/>
    <path d="M476 224 v10 l7 4" fill="none" stroke="#76529a" stroke-width="2" stroke-linecap="round"/>
    <text x="500" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#58446e">Süre ve risk</text>
    <text x="500" y="248" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79698b">Kısıtlar</text>
  </g>

  <!-- Merkez planlayıcı -->
  <g filter="url(#shadow)">
    <rect x="246" y="105" width="148" height="110" rx="24" fill="url(#core)" stroke="#b6d4d4" stroke-width="1.2"/>
    <text x="320" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315969">ENERJİ PLANLAYICI</text>
    <path d="M278 157 H358" stroke="#78a4ae" stroke-width="2" stroke-linecap="round"/>
    <path d="M278 157 l8-6 M278 157 l8 6" fill="none" stroke="#78a4ae" stroke-width="2" stroke-linecap="round"/>
    <path d="M358 157 l-8-6 M358 157 l-8 6" fill="none" stroke="#78a4ae" stroke-width="2" stroke-linecap="round"/>
    <path d="M292 177 C302 166 318 180 328 168 C338 156 351 163 356 173" fill="none" stroke="#4f9d83" stroke-width="2.5" stroke-linecap="round"/>
    <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#48717d">Mesafe + tüketim</text>
  </g>

  <!-- Alt rota sonucu -->
  <path d="M320 216 L320 244" fill="none" stroke="#527f91" stroke-width="2.2"/>
  <polygon points="320,244 315,235 325,235" fill="#527f91"/>

  <g filter="url(#shadow)">
    <rect x="216" y="250" width="208" height="49" rx="16" fill="#ffffff"/>
    <circle cx="240" cy="274" r="12" fill="#c8ead9"/>
    <path d="M234 274 l4 4 8-9" fill="none" stroke="#36845a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="262" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345a4a">Güvenli rota seçimi</text>
    <text x="262" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668071">Teslimat ve dönüş</text>
  </g>

  <!-- Drone -->
  <g transform="translate(303 32)" filter="url(#soft)">
    <path d="M17 13 h16 M25 5 v16 M9 8 l8 5 M41 8 l-8 5 M9 18 l8-5 M41 18 l-8-5" stroke="#54768b" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="10" cy="8" r="5" fill="#b9d9ef" stroke="#54768b" stroke-width="1"/>
    <circle cx="40" cy="8" r="5" fill="#b9d9ef" stroke="#54768b" stroke-width="1"/>
    <circle cx="10" cy="18" r="5" fill="#b9d9ef" stroke="#54768b" stroke-width="1"/>
    <circle cx="40" cy="18" r="5" fill="#b9d9ef" stroke="#54768b" stroke-width="1"/>
    <rect x="19" y="10" width="12" height="10" rx="3" fill="#557f96"/>
  </g>
</svg>