<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">List Comprehension ile Pythonik Veri Üretimi</text>

  <!-- Kaynak kutusu -->
  <rect x="30" y="60" width="120" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="90" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">Kaynak Liste</text>
  <text x="90" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">A = [1,2,3,4,5]</text>

  <!-- Dönüşüm kutusu -->
  <rect x="260" y="55" width="130" height="60" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="325" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Dönüşüm</text>
  <text x="325" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">[f(x) for x in A]</text>

  <!-- Filtre kutusu -->
  <rect x="260" y="140" width="130" height="60" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="325" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#713f12">Filtreleme</text>
  <text x="325" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">[x for x in A if p(x)]</text>

  <!-- Koşullu dönüşüm kutusu -->
  <rect x="260" y="225" width="130" height="60" rx="10" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="325" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Koşullu Dönüşüm</text>
  <text x="325" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">[a if c else b for x in A]</text>

  <!-- Sonuç kutusu -->
  <rect x="490" y="120" width="120" height="50" rx="10" fill="url(#box5)" filter="url(#shadow)"/>
  <text x="550" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">Yeni Liste</text>
  <text x="550" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">B = [f(x) ...]</text>

  <!-- Ok 1: Kaynak -> Dönüşüm -->
  <path d="M150 80 L260 80" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="260,75 272,80 260,85" fill="#64748b"/>

  <!-- Ok 2: Kaynak -> Filtre -->
  <path d="M150 95 Q200 120 260 165" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="260,160 272,165 260,170" fill="#64748b"/>

  <!-- Ok 3: Kaynak -> Koşullu -->
  <path d="M150 105 Q220 200 260 250" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="260,245 272,250 260,255" fill="#64748b"/>

  <!-- Ok 4: Dönüşüm -> Sonuç -->
  <path d="M390 80 Q440 80 490 135" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="490,130 502,135 490,140" fill="#64748b"/>

  <!-- Ok 5: Filtre -> Sonuç -->
  <path d="M390 165 Q440 160 490 150" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="490,145 502,150 490,155" fill="#64748b"/>

  <!-- Ok 6: Koşullu -> Sonuç -->
  <path d="M390 250 Q440 220 490 170" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="490,165 502,170 490,175" fill="#64748b"/>

  <!-- Performans notu -->
  <rect x="30" y="220" width="180" height="70" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadow)"/>
  <text x="120" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Performans</text>
  <text x="120" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">Liste: O(n) bellek</text>
  <text x="120" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">Generator: O(1) bellek</text>

  <!-- Pythonik denge notu -->
  <rect x="490" y="230" width="120" height="60" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadow)"/>
  <text x="550" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Pythonik Denge</text>
  <text x="550" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">Okunabilirlik</text>
  <text x="550" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">Kısa ve net ifade</text>
</svg>