<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9edff"/>
      <stop offset="100%" stop-color="#c7ddf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#65809b" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#65809b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="42" r="52" fill="#dff3e8" opacity="0.55"/>
  <circle cx="585" cy="275" r="72" fill="#e3eaff" opacity="0.58"/>
  <path d="M24 270 C120 230, 145 305, 235 275 S390 225, 470 274 S565 299, 625 248" fill="none" stroke="#b9dace" stroke-width="2" opacity="0.48"/>

  <!-- Bağlantılar -->
  <path d="M169 151 C191 151, 200 151, 218 151" fill="none" stroke="#718ba5" stroke-width="2.5"/>
  <polygon points="218,151 210,146 210,156" fill="#718ba5"/>
  <path d="M347 151 C367 151, 378 151, 394 151" fill="none" stroke="#718ba5" stroke-width="2.5"/>
  <polygon points="394,151 386,146 386,156" fill="#718ba5"/>

  <path d="M285 113 C285 93, 215 88, 169 88" fill="none" stroke="#91a8bd" stroke-width="2"/>
  <polygon points="169,88 177,83 176,93" fill="#91a8bd"/>
  <path d="M285 189 C285 219, 215 227, 169 227" fill="none" stroke="#91a8bd" stroke-width="2"/>
  <polygon points="169,227 177,222 176,232" fill="#91a8bd"/>

  <path d="M457 113 C457 91, 544 88, 568 88" fill="none" stroke="#91a8bd" stroke-width="2"/>
  <polygon points="568,88 560,83 560,93" fill="#91a8bd"/>
  <path d="M457 189 C457 219, 537 227, 568 227" fill="none" stroke="#91a8bd" stroke-width="2"/>
  <polygon points="568,227 560,222 560,232" fill="#91a8bd"/>

  <!-- Sol üst: Zaman -->
  <g filter="url(#smallShadow)">
    <rect x="34" y="56" width="135" height="64" rx="16" fill="#fff5dc"/>
    <rect x="47" y="69" width="28" height="28" rx="9" fill="#ffd78e"/>
    <path d="M61 75 L61 84 L68 88" fill="none" stroke="#926b25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b5967">Zaman sınırı</text>
    <text x="86" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65717d">İşlem bütçesi</text>
  </g>

  <!-- Sol alt: Bellek -->
  <g filter="url(#smallShadow)">
    <rect x="34" y="195" width="135" height="64" rx="16" fill="#e9f5ef"/>
    <rect x="47" y="208" width="28" height="28" rx="9" fill="#b8e3ca"/>
    <rect x="54" y="215" width="14" height="3" rx="1.5" fill="#4f8a69"/>
    <rect x="54" y="222" width="14" height="3" rx="1.5" fill="#4f8a69"/>
    <rect x="54" y="229" width="9" height="3" rx="1.5" fill="#4f8a69"/>
    <text x="86" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b5967">Bellek sınırı</text>
    <text x="86" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65717d">Alan bütçesi</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="218" y="113" width="129" height="76" rx="21" fill="url(#core)"/>
    <circle cx="246" cy="151" r="17" fill="#eff8ff"/>
    <path d="M238 151 L244 157 L255 144" fill="none" stroke="#4a7ca4" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="271" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f5e78">Kısıtları oku</text>
    <text x="271" y="165" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58748d">Ölçeği belirle</text>
  </g>

  <!-- Karar -->
  <g filter="url(#shadow)">
    <rect x="394" y="113" width="126" height="76" rx="21" fill="#ece5fb"/>
    <circle cx="421" cy="151" r="17" fill="#faf7ff"/>
    <path d="M414 144 L428 144 M414 151 L428 151 M414 158 L423 158" stroke="#7963a4" stroke-width="2.4" stroke-linecap="round"/>
    <text x="447" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#54456f">Algoritma</text>
    <text x="447" y="165" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e6182">seçimi</text>
  </g>

  <!-- Sağ üst karmaşıklık -->
  <g filter="url(#smallShadow)">
    <rect x="520" y="55" width="92" height="67" rx="16" fill="#e5f2ff"/>
    <text x="536" y="77" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426987">Hedef sınıf</text>
    <text x="536" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527994">O(n log n)</text>
    <text x="536" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527994">veya O(n)</text>
  </g>

  <!-- Sağ alt sonuç -->
  <g filter="url(#smallShadow)">
    <rect x="520" y="194" width="92" height="67" rx="16" fill="#e7f5df"/>
    <text x="535" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#47735b">Özel yapı</text>
    <text x="535" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#568068">İki işaretçi</text>
    <text x="535" y="253" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#568068">DP sıkıştırma</text>
  </g>

  <!-- Alt akış şeridi -->
  <g filter="url(#smallShadow)">
    <rect x="184" y="270" width="272" height="32" rx="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="204" cy="286" r="7" fill="#f4b8a9"/>
    <text x="218" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596775">Kaba kuvvet</text>
    <path d="M291 286 L310 286" stroke="#93a5b2" stroke-width="2"/>
    <polygon points="310,286 303,281 303,291" fill="#93a5b2"/>
    <circle cx="329" cy="286" r="7" fill="#a8d9bd"/>
    <text x="343" y="290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496d59">Uygun çözüm</text>
  </g>
</svg>