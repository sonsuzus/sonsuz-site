<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#cceee5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7891a5" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7891a5" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="57" r="50" fill="#dceeff" opacity="0.46"/>
  <circle cx="575" cy="263" r="67" fill="#dff3df" opacity="0.45"/>
  <path d="M22 275 C130 235 167 303 259 275 S418 222 620 268" fill="none" stroke="#c8e3e8" stroke-width="2" opacity="0.55"/>

  <!-- Kaynak -->
  <g filter="url(#softShadow)">
    <rect x="235" y="18" width="170" height="48" rx="16" fill="#ffffff" stroke="#c7dce9"/>
    <circle cx="263" cy="42" r="13" fill="#e4f2ff"/>
    <path d="M257 38h12M257 42h12M257 46h8" fill="none" stroke="#5790b1" stroke-width="1.7" stroke-linecap="round"/>
    <text x="281" y="39" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31566d" font-weight="600">Uygulama Verisi</text>
    <text x="281" y="54" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7190a2">satırlar ve istekler</text>
  </g>

  <!-- source arrow -->
  <path d="M320 67 L320 91" fill="none" stroke="#6d9caf" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="314,86 326,86 320,96" fill="#6d9caf"/>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="215" y="97" width="210" height="78" rx="22" fill="url(#router)" stroke="#aacbd1"/>
    <circle cx="255" cy="136" r="23" fill="#ffffff" opacity="0.88"/>
    <path d="M244 132 L255 124 L266 132 L255 140 Z" fill="none" stroke="#4b88a0" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M244 141 L255 149 L266 141" fill="none" stroke="#4b88a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="287" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#28566a" font-weight="700">Shard Yönlendirici</text>
    <text x="287" y="146" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54798a">Anahtar seçimi</text>
    <text x="287" y="162" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54798a">hash(key) mod N</text>
  </g>

  <!-- branched links -->
  <path d="M215 139 L159 139 L159 213 L114 213" fill="none" stroke="#80aebc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="119,207 119,219 108,213" fill="#80aebc"/>
  <path d="M425 139 L481 139 L481 213 L526 213" fill="none" stroke="#80aebc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="521,207 521,219 532,213" fill="#80aebc"/>
  <path d="M267 175 L211 211" fill="none" stroke="#80aebc" stroke-width="2" stroke-linecap="round"/>
  <polygon points="211,204 217,214 203,216" fill="#80aebc"/>
  <path d="M373 175 L429 211" fill="none" stroke="#80aebc" stroke-width="2" stroke-linecap="round"/>
  <polygon points="423,214 429,204 437,216" fill="#80aebc"/>

  <!-- shard 1 -->
  <g filter="url(#softShadow)">
    <rect x="38" y="213" width="142" height="76" rx="17" fill="#fff5dd" stroke="#ead6a6"/>
    <rect x="53" y="228" width="34" height="44" rx="8" fill="#f7dfa1"/>
    <ellipse cx="70" cy="238" rx="10" ry="4.5" fill="#d5a95b"/>
    <path d="M60 238v24c0 6 20 6 20 0v-24M60 250c0 6 20 6 20 0" fill="none" stroke="#b78439" stroke-width="1.2"/>
    <text x="97" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#775924" font-weight="700">Shard 1</text>
    <text x="97" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7942">Aralık</text>
    <text x="97" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7942">1–1M</text>
  </g>

  <!-- shard 2 -->
  <g filter="url(#softShadow)">
    <rect x="184" y="213" width="128" height="76" rx="17" fill="#e8f1ff" stroke="#bfd4ef"/>
    <rect x="199" y="228" width="34" height="44" rx="8" fill="#cfe0fb"/>
    <ellipse cx="216" cy="238" rx="10" ry="4.5" fill="#7d9fd2"/>
    <path d="M206 238v24c0 6 20 6 20 0v-24M206 250c0 6 20 6 20 0" fill="none" stroke="#6386bd" stroke-width="1.2"/>
    <text x="242" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496d9c" font-weight="700">Shard 2</text>
    <text x="242" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6685aa">Hash</text>
    <text x="242" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6685aa">denge</text>
  </g>

  <!-- shard 3 -->
  <g filter="url(#softShadow)">
    <rect x="328" y="213" width="128" height="76" rx="17" fill="#f2eaff" stroke="#d9c5ed"/>
    <rect x="343" y="228" width="34" height="44" rx="8" fill="#e1cff5"/>
    <ellipse cx="360" cy="238" rx="10" ry="4.5" fill="#a982c4"/>
    <path d="M350 238v24c0 6 20 6 20 0v-24M350 250c0 6 20 6 20 0" fill="none" stroke="#8e66af" stroke-width="1.2"/>
    <text x="386" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#70518d" font-weight="700">Shard 3</text>
    <text x="386" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6aa2">Dizin</text>
    <text x="386" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6aa2">esneklik</text>
  </g>

  <!-- shard 4 -->
  <g filter="url(#softShadow)">
    <rect x="472" y="213" width="130" height="76" rx="17" fill="#e4f7ed" stroke="#bbdfca"/>
    <rect x="487" y="228" width="34" height="44" rx="8" fill="#c9ecd9"/>
    <ellipse cx="504" cy="238" rx="10" ry="4.5" fill="#70b58d"/>
    <path d="M494 238v24c0 6 20 6 20 0v-24M494 250c0 6 20 6 20 0" fill="none" stroke="#519b71" stroke-width="1.2"/>
    <text x="530" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397052" font-weight="700">Shard 4</text>
    <text x="530" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c9271">Bölge</text>
    <text x="530" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c9271">yakınlık</text>
  </g>

  <text x="320" y="307" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8792">Yatay ölçekleme · bağımsız veri düğümleri</text>
</svg>