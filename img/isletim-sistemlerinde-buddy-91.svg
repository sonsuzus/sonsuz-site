<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9e2ff"/>
      <stop offset="100%" stop-color="#d8ecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#53708d" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#53708d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="42" r="76" fill="#dff2f1" opacity="0.48"/>
  <circle cx="588" cy="275" r="88" fill="#e6e0ff" opacity="0.38"/>

  <text x="32" y="36" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35506b">BUDDY BELLEK YÖNETİMİ</text>
  <text x="32" y="55" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647b91">Böl • Tahsis et • Birleştir</text>

  <!-- request -->
  <g filter="url(#shadow)">
    <rect x="30" y="111" width="112" height="86" rx="18" fill="#ffffff"/>
    <rect x="42" y="125" width="34" height="34" rx="10" fill="#ffe8c7"/>
    <path d="M52 136h14M52 142h14M52 148h9" fill="none" stroke="#bd7b31" stroke-width="2" stroke-linecap="round"/>
    <text x="42" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d5870">İstek</text>
    <text x="42" y="191" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8194">13 KB</text>
  </g>

  <path d="M153 154H183" stroke="#6f8faa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="190,154 181,149 181,159" fill="#6f8faa"/>

  <!-- main allocator -->
  <g filter="url(#shadow)">
    <rect x="200" y="78" width="232" height="169" rx="22" fill="url(#core)"/>
    <text x="220" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40516d">Çekirdek Buddy Alanı</text>
    <text x="220" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65758e">2'nin kuvvetleri</text>

    <!-- 64 -->
    <rect x="220" y="137" width="191" height="30" rx="8" fill="#b9d9ee"/>
    <text x="230" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355570">64 KB</text>

    <!-- split -->
    <path d="M315 169V180M267 180H363M267 180V188M363 180V188" fill="none" stroke="#708da6" stroke-width="2"/>
    <polygon points="267,193 262,185 272,185" fill="#708da6"/>
    <polygon points="363,193 358,185 368,185" fill="#708da6"/>

    <rect x="220" y="194" width="91" height="29" rx="8" fill="#c9e8da"/>
    <rect x="320" y="194" width="91" height="29" rx="8" fill="#c9e8da"/>
    <text x="230" y="213" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386353">32 KB</text>
    <text x="330" y="213" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386353">32 KB</text>

    <path d="M265 225V232M242 232H287M242 232V237M287 232V237" fill="none" stroke="#708da6" stroke-width="2"/>
    <rect x="220" y="239" width="43" height="0" rx="5" fill="#ffdea8"/>
    <rect x="220" y="238" width="43" height="0" rx="5" fill="#ffdea8"/>
  </g>

  <!-- allocated 16 pair foreground -->
  <g filter="url(#smallShadow)">
    <rect x="217" y="238" width="47" height="31" rx="8" fill="#ffc96d"/>
    <rect x="269" y="238" width="47" height="31" rx="8" fill="#bfe5d0"/>
    <text x="226" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805219">16 KB</text>
    <text x="278" y="258" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386353">16 KB</text>
  </g>
  <text x="219" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a6829">tahsis</text>
  <text x="271" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47715f">eş blok</text>

  <!-- exit arrow -->
  <path d="M444 154H468" stroke="#6f8faa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="475,154 466,149 466,159" fill="#6f8faa"/>

  <!-- right subsystem -->
  <g filter="url(#shadow)">
    <rect x="484" y="80" width="126" height="167" rx="21" fill="#ffffff"/>
    <text x="501" y="107" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40516d">Boş Listeler</text>

    <rect x="500" y="122" width="94" height="23" rx="7" fill="#e5dcff"/>
    <text x="510" y="138" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#584c88">Order 4 · 64</text>

    <rect x="500" y="151" width="94" height="23" rx="7" fill="#d8f0e4"/>
    <text x="510" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f735d">Order 3 · 32</text>

    <rect x="500" y="180" width="94" height="23" rx="7" fill="#ffe9bf"/>
    <text x="510" y="196" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8c6430">Order 2 · 16</text>

    <path d="M516 220h38" stroke="#65869e" stroke-width="2" stroke-linecap="round"/>
    <path d="M535 211v18" stroke="#65869e" stroke-width="2" stroke-linecap="round"/>
    <text x="563" y="225" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60778e">XOR</text>
  </g>

  <!-- merge return -->
  <path d="M549 258C516 295 405 294 344 279" fill="none" stroke="#82a694" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="337,278 347,274 345,284" fill="#82a694"/>
  <g filter="url(#smallShadow)">
    <rect x="422" y="267" width="105" height="29" rx="14" fill="#e2f2e8"/>
    <text x="436" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f7865">Serbest → Birleş</text>
  </g>
</svg>