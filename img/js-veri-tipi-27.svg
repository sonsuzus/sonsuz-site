<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1e9f0"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">JavaScript Veri Tipi Dönüşümü</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="130" width="150" height="50" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a237e">Dönüşüm</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Merkezi</text>

  <!-- Sol üst: Number to String -->
  <rect x="30" y="60" width="140" height="55" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Number</text>
  <text x="100" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">String(10)</text>
  <text x="100" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6d4c41">→ "10"</text>

  <!-- Sol alt: Boolean to String -->
  <rect x="30" y="200" width="140" height="55" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="100" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Boolean</text>
  <text x="100" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2e7d32">String(true)</text>
  <text x="100" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#388e3c">→ "true"</text>

  <!-- Sağ üst: Date to String -->
  <rect x="470" y="60" width="140" height="55" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="540" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">Date</text>
  <text x="540" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ad1457">String(new Date())</text>
  <text x="540" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#c2185b">→ tarih metni</text>

  <!-- Sağ alt: Array to String -->
  <rect x="470" y="200" width="140" height="55" rx="10" fill="url(#boxGrad5)" filter="url(#shadow)" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="540" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#311b92">Array</text>
  <text x="540" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4527a0">String([1,2,3,4])</text>
  <text x="540" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5e35b1">→ "1,2,3,4"</text>

  <!-- Alt merkez: Number() örneği -->
  <rect x="245" y="240" width="150" height="55" rx="10" fill="url(#boxGrad6)" filter="url(#shadow)" stroke="#4dd0e1" stroke-width="1.5"/>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#006064">Number()</text>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#00838f">"20" → 20</text>
  <text x="320" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#0097a7">10 + Number("20") = 30</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üstten merkeze -->
  <path d="M170 87 L235 140" stroke="#ff9800" stroke-width="2" fill="none"/>
  <polygon points="235,140 226,133 228,143" fill="#ff9800"/>

  <!-- Sol alttan merkeze -->
  <path d="M170 227 L235 170" stroke="#4caf50" stroke-width="2" fill="none"/>
  <polygon points="235,170 226,177 228,167" fill="#4caf50"/>

  <!-- Sağ üstten merkeze -->
  <path d="M470 87 L405 140" stroke="#e91e63" stroke-width="2" fill="none"/>
  <polygon points="405,140 414,133 412,143" fill="#e91e63"/>

  <!-- Sağ alttan merkeze -->
  <path d="M470 227 L405 170" stroke="#9c27b0" stroke-width="2" fill="none"/>
  <polygon points="405,170 414,177 412,167" fill="#9c27b0"/>

  <!-- Merkezden alt kutuya -->
  <path d="M320 180 L320 230" stroke="#00bcd4" stroke-width="2" fill="none"/>
  <polygon points="320,230 315,221 325,221" fill="#00bcd4"/>

  <!-- Etiketler -->
  <text x="195" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" transform="rotate(-20 195 105)">String()</text>
  <text x="195" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" transform="rotate(20 195 215)">String()</text>
  <text x="445" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" transform="rotate(20 445 105)">String()</text>
  <text x="445" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" transform="rotate(-20 445 215)">String()</text>

  <!-- Alt bilgi -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#90a4ae">Esnek dönüşüm yapısı</text>
</svg>