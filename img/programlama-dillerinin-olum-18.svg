<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bc47f"/>
      <stop offset="100%" stop-color="#4a9e6e"/>
    </linearGradient>
    <linearGradient id="legacyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b35e"/>
      <stop offset="100%" stop-color="#d98e3d"/>
    </linearGradient>
    <linearGradient id="deadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e9aaf"/>
      <stop offset="100%" stop-color="#5c6b7a"/>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c9bd1"/>
      <stop offset="100%" stop-color="#4a7ba6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Dijital Arkeoloji: Dil Yaşam Döngüsü</text>

  <!-- Yaşam skoru formülü -->
  <rect x="30" y="42" width="180" height="52" rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="120" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Yaşam Skoru</text>
  <text x="120" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">L = 0.30R + 0.25C</text>
  <text x="120" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">+ 0.20P + 0.15J + 0.10E</text>

  <!-- Sinyal kaynakları -->
  <rect x="230" y="42" width="180" height="52" rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="320" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Dijital Nabız</text>
  <text x="320" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Sürüm + Paket + Katkıcı</text>
  <text x="320" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">+ İş + Eğitim + Göç</text>

  <!-- Göç döngüsü -->
  <rect x="430" y="42" width="180" height="52" rx="10" fill="#ffffff" opacity="0.85" filter="url(#shadowLight)"/>
  <text x="520" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Topluluk Göçü</text>
  <text x="520" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Kütüphane → Uygulama</text>
  <text x="520" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">→ İş → Öğrenci</text>

  <!-- Oklar: formülden sinyale -->
  <path d="M210,68 L228,68" stroke="#5c6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="228,63 236,68 228,73" fill="#5c6b7a"/>

  <!-- Oklar: sinyalden göçe -->
  <path d="M410,68 L428,68" stroke="#5c6b7a" stroke-width="1.5" fill="none"/>
  <polygon points="428,63 436,68 428,73" fill="#5c6b7a"/>

  <!-- Yaşam evreleri -->
  <!-- Yaşayan -->
  <rect x="60" y="130" width="150" height="70" rx="12" fill="url(#liveGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="135" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Yaşayan</text>
  <text x="135" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f5e9">Yeni sürüm ve paketler</text>
  <text x="135" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f5e9">Ekosistem büyür</text>

  <!-- Miras -->
  <rect x="245" y="130" width="150" height="70" rx="12" fill="url(#legacyGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Miras Dili</text>
  <text x="320" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff8e1">Bakım sürer</text>
  <text x="320" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff8e1">Kurumsal sistemlerde yaşar</text>

  <!-- Ölü -->
  <rect x="430" y="130" width="150" height="70" rx="12" fill="url(#deadGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="505" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Ölü Dil</text>
  <text x="505" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eceff1">Resmî bakım yok</text>
  <text x="505" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eceff1">Arşiv / hobi nesnesi</text>

  <!-- Evreler arası oklar -->
  <path d="M210,165 L243,165" stroke="#5c6b7a" stroke-width="2" fill="none"/>
  <polygon points="243,159 253,165 243,171" fill="#5c6b7a"/>

  <path d="M395,165 L428,165" stroke="#5c6b7a" stroke-width="2" fill="none"/>
  <polygon points="428,159 438,165 428,171" fill="#5c6b7a"/>

  <!-- Çöküş döngüsü -->
  <rect x="200" y="230" width="240" height="55" rx="10" fill="#ffffff" opacity="0.8" filter="url(#shadowLight)"/>
  <text x="320" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Kendini Besleyen Çöküş</text>
  <text x="320" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Paket ↓ → Uygulama ↓ → İş ↓ → Öğrenci ↓</text>

  <!-- Döngü okları -->
  <path d="M440,245 L480,245 L480,215 L440,215" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="440,209 448,215 440,221" fill="#c0392b"/>

  <!-- Arkeoloji aracı -->
  <rect x="30" y="230" width="150" height="55" rx="10" fill="#e8f0fe" opacity="0.9" filter="url(#shadowLight)"/>
  <text x="105" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Arkeoloji Aracı</text>
  <text x="105" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Eğilim analizi</text>
  <text x="105" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Negatif eğim uyarısı</text>

  <!-- Dönüşüm notu -->
  <rect x="460" y="230" width="150" height="55" rx="10" fill="#fde8e8" opacity="0.9" filter="url(#shadowLight)"/>
  <text x="535" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Dönüşüm</text>
  <text x="535" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Fikirler miras kalır</text>
  <text x="535" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Retro diriliş mümkün</text>

  <!-- Alt bağlantı okları -->
  <path d="M135,200 L135,228" stroke="#5c6b7a" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <polygon points="130,228 135,236 140,228" fill="#5c6b7a"/>

  <path d="M320,200 L320,228" stroke="#5c6b7a" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <polygon points="315,228 320,236 325,228" fill="#5c6b7a"/>

  <path d="M505,200 L505,228" stroke="#5c6b7a" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <polygon points="500,228 505,236 510,228" fill="#5c6b7a"/>

  <!-- COBOL örneği -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d" font-style="italic">COBOL (1959) hâlâ finans altyapısında çalışıyor</text>
</svg>