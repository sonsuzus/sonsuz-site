  <text x="320" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54708a">Eşli programcı</text>

  <path d="M287 123 C246 140 190 143 151 161" fill="none" stroke="#91aaba" stroke-width="2.2"/>
  <polygon points="151,161 160,155 158,165" fill="#91aaba"/>
  <path d="M353 123 C395 140 449 143 489 161" fill="none" stroke="#77a77e" stroke-width="2.2"/>
  <polygon points="489,161 480,155 482,165" fill="#77a77e"/>

