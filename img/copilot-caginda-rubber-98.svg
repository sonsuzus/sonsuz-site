  <circle cx="417" cy="201" r="17" fill="#f8fff7"/>
  <path d="M408 201 l6 6 l12 -13" fill="none" stroke="#5d9b66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
