<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="aiFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#cfe2fb"/>
    </linearGradient>
    <linearGradient id="riskFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5e1"/>
      <stop offset="100%" stop-color="#fbd1cd"/>
    </linearGradient>
    <linearGradient id="goodFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff4df"/>
      <stop offset="100%" stop-color="#c9eacb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#54708a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#54708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="66" cy="45" r="76" fill="#d9ecff" opacity="0.38"/>
  <circle cx="590" cy="280" r="100" fill="#dff2d8" opacity="0.42"/>
  <path d="M34 88 C138 31 204 54 281 23" fill="none" stroke="#c3dff0" stroke-width="2" opacity="0.55"/>
  <path d="M393 298 C482 234 555 243 625 185" fill="none" stroke="#cce4c7" stroke-width="2" opacity="0.6"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40576c">Yapay zekâ önerisi: hız mı, anlayış mı?</text>

  <g filter="url(#shadow)">
    <rect x="237" y="48" width="166" height="75" rx="18" fill="url(#aiFill)" stroke="#a7c7e7"/>
  </g>
  <rect x="251" y="63" width="33" height="33" rx="10" fill="#ffffff" opacity="0.8"/>
  <path d="M259 77 h17 M259 83 h12 M259 89 h15" stroke="#5383b0" stroke-width="2" stroke-linecap="round"/>
