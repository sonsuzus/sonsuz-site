  <text x="493" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e8462">Açıkla, test et, sorgula</text>

  <path d="M150 237 L150 257" fill="none" stroke="#cc8b85" stroke-width="2"/>
  <polygon points="150,267 145,257 155,257" fill="#cc8b85"/>
  <path d="M490 237 L490 257" fill="none" stroke="#72a779" stroke-width="2"/>
  <polygon points="490,267 485,257 495,257" fill="#72a779"/>

  <g filter="url(#softShadow)">
    <rect x="62" y="267" width="176" height="38" rx="14" fill="#fff8f6" stroke="#ecc5bf"/>
  </g>
  <text x="150" y="291" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#9c5751">Bağımlılık ve hata riski</text>

  <g filter="url(#softShadow)">
    <rect x="402" y="267" width="176" height="38" rx="14" fill="#f7fff5" stroke="#b9dcb9"/>
  </g>
  <text x="490" y="291" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#42784b">Öğrenme ve dayanıklılık</text>

  <text x="225" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7d6870">Tab ile geç</text>
  <text x="415" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5e7864">Neden doğru?</text>
</svg>