<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="lambdaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8e7ff"/>
      <stop offset="100%" stop-color="#c9ddff"/>
    </linearGradient>
    <linearGradient id="interfaceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7f3df"/>
      <stop offset="100%" stop-color="#bde9cd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6f88a0" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71869a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="68" cy="41" r="72" fill="#dceeff" opacity="0.48"/>
  <circle cx="598" cy="277" r="92" fill="#dcefd8" opacity="0.44"/>
  <path d="M28 268 C140 218 174 304 283 272 S461 208 615 237" fill="none" stroke="#bdd9ce" stroke-width="2" opacity="0.42"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52687a" font-weight="600">DAVRANIŞI ARAYÜZE BAĞLAMA</text>

  <!-- Lambda source -->
  <g filter="url(#shadow)">
    <rect x="35" y="104" width="151" height="111" rx="20" fill="url(#lambdaGrad)" stroke="#a8c5ee"/>
    <circle cx="65" cy="137" r="17" fill="#f7fbff" stroke="#a5c3ec"/>
    <text x="65" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" fill="#4676ae" font-weight="700">λ</text>
    <text x="111" y="134" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365976" font-weight="700">Lambda</text>
    <text x="111" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54718a">Anonim davranış</text>
    <rect x="56" y="171" width="109" height="25" rx="9" fill="#f8fbff" opacity="0.88"/>
    <text x="110" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#446c91">(a, b) → a + b</text>
  </g>

  <!-- arrow lambda to interface -->
  <path d="M187 159 H234" fill="none" stroke="#7da8c5" stroke-width="2.5"/>
  <polygon points="240,159 230,153 230,165" fill="#7da8c5"/>
  <text x="211" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63829a">hedef tür</text>

  <!-- Central Interface -->
  <g filter="url(#shadow)">
    <rect x="242" y="80" width="163" height="159" rx="24" fill="url(#interfaceGrad)" stroke="#93cfaa" stroke-width="1.2"/>
    <rect x="273" y="99" width="102" height="27" rx="10" fill="#f7fffa" opacity="0.90"/>
    <text x="324" y="117" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#357253" font-weight="700">@FunctionalInterface</text>
    <circle cx="324" cy="151" r="25" fill="#effbf2" stroke="#94ceaa"/>
    <path d="M314 150 L321 157 L336 141" fill="none" stroke="#4a9d6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="324" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#326a4e" font-weight="700">Fonksiyonel arayüz</text>
    <text x="324" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b8470">Tek soyut metot</text>
  </g>

  <!-- branches -->
  <path d="M406 129 C425 129 426 76 445 76" fill="none" stroke="#88aab4" stroke-width="2.2"/>
  <polygon points="451,76 441,70 441,82" fill="#88aab4"/>
  <path d="M406 160 H445" fill="none" stroke="#88aab4" stroke-width="2.2"/>
  <polygon points="451,160 441,154 441,166" fill="#88aab4"/>
  <path d="M406 191 C425 191 426 251 445 251" fill="none" stroke="#88aab4" stroke-width="2.2"/>
  <polygon points="451,251 441,245 441,257" fill="#88aab4"/>

  <!-- Output top -->
  <g filter="url(#smallShadow)">
    <rect x="454" y="43" width="148" height="66" rx="16" fill="#fff2d8" stroke="#efd09b"/>
    <circle cx="477" cy="76" r="13" fill="#fffaf0"/>
    <path d="M471 77 H483 M477 71 V83" stroke="#ce9250" stroke-width="2.2" stroke-linecap="round"/>
    <text x="535" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6033" font-weight="700">Hesaplayıcı</text>
    <text x="535" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9c7549">topla ve çarp</text>
  </g>

  <!-- Output middle -->
  <g filter="url(#smallShadow)">
    <rect x="454" y="127" width="148" height="66" rx="16" fill="#f0e9ff" stroke="#cbb8ed"/>
    <circle cx="477" cy="160" r="13" fill="#fbf9ff"/>
    <path d="M470 157 C475 151 481 151 485 157 M470 164 C475 170 481 170 485 164" fill="none" stroke="#8667b7" stroke-width="2" stroke-linecap="round"/>
    <text x="535" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#674b93" font-weight="700">Hazır arayüzler</text>
    <text x="535" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b649e">Koşul ve dönüşüm</text>
  </g>

  <!-- Output bottom -->
  <g filter="url(#smallShadow)">
    <rect x="454" y="218" width="148" height="66" rx="16" fill="#dff3f1" stroke="#a9d9d2"/>
    <circle cx="477" cy="251" r="13" fill="#f5fffe"/>
    <path d="M469 247 H477 L481 242 L486 247 M469 255 H477 L481 260 L486 255" fill="none" stroke="#438f88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="535" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33736d" font-weight="700">Stream akışı</text>
    <text x="535" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#548c87">Filtrele · dönüştür · tüket</text>
  </g>

  <!-- Decorative connection dots -->
  <circle cx="219" cy="159" r="3" fill="#9abbd1"/>
  <circle cx="427" cy="129" r="3" fill="#a1bec2"/>
  <circle cx="427" cy="160" r="3" fill="#a1bec2"/>
  <circle cx="427" cy="191" r="3" fill="#a1bec2"/>
</svg>