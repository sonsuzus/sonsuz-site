<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="problemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde8e8"/>
      <stop offset="100%" stop-color="#fbd5d5"/>
    </linearGradient>
    <linearGradient id="aptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="langGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="nixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="8"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2d3748">Paket Yöneticilerinin Bağımlılık Savaşları</text>

  <!-- Problem kutusu -->
  <rect x="40" y="55" width="130" height="70" rx="10" fill="url(#problemGrad)" filter="url(#shadow)" stroke="#fca5a5" stroke-width="1"/>
  <text x="105" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Bağımlılık</text>
  <text x="105" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d">Çakışması</text>
  <text x="105" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#991b1b">Sürüm kısıtları</text>

  <!-- Problem alt açıklama -->
  <text x="105" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Kesişim boşsa çözüm yok</text>

  <!-- Ok: Problem -> apt -->
  <path d="M 170 80 L 215 80" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <polygon points="215,75 225,80 215,85" fill="#4b5563"/>

  <!-- apt kutusu -->
  <rect x="228" y="50" width="120" height="60" rx="10" fill="url(#aptGrad)" filter="url(#shadowLight)" stroke="#a5b4fc" stroke-width="1"/>
  <text x="288" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">apt / yum</text>
  <text x="288" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4338ca">Sistem geneli</text>

  <!-- apt alt özellikler -->
  <text x="288" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Merkezi depo</text>
  <text x="288" y="138" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Paylaşımlı durum</text>

  <!-- Ok: Problem -> Dil -->
  <path d="M 170 95 L 215 95" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <polygon points="215,90 225,95 215,100" fill="#4b5563"/>

  <!-- Dil kutusu -->
  <rect x="228" y="145" width="120" height="60" rx="10" fill="url(#langGrad)" filter="url(#shadowLight)" stroke="#6ee7b7" stroke-width="1"/>
  <text x="288" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">npm / pip</text>
  <text x="288" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#047857">Proje tabanlı</text>

  <!-- Dil alt özellikler -->
  <text x="288" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Sanal ortam</text>
  <text x="288" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Kilit dosyası</text>

  <!-- Ok: Problem -> Nix -->
  <path d="M 170 110 L 215 110" stroke="#4b5563" stroke-width="1.5" fill="none"/>
  <polygon points="215,105 225,110 215,115" fill="#4b5563"/>

  <!-- Nix kutusu -->
  <rect x="228" y="240" width="120" height="60" rx="10" fill="url(#nixGrad)" filter="url(#shadowLight)" stroke="#fcd34d" stroke-width="1"/>
  <text x="288" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Nix</text>
  <text x="288" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#92400e">İçerik adresli</text>

  <!-- Nix alt özellikler -->
  <text x="288" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">İzole, tekrarlanabilir</text>

  <!-- Sağ taraf: Karşılaştırma tablosu -->
  <rect x="390" y="50" width="220" height="250" rx="10" fill="#ffffff" filter="url(#shadowLight)" stroke="#e5e7eb" stroke-width="1" opacity="0.9"/>

  <!-- Tablo başlığı -->
  <rect x="390" y="50" width="220" height="28" rx="10" fill="#4f46e5" opacity="0.9"/>
  <rect x="390" y="68" width="220" height="10" fill="#4f46e5" opacity="0.9"/>
  <text x="500" y="69" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Karşılaştırma</text>

  <!-- Tablo satırları -->
  <line x1="400" y1="88" x2="600" y2="88" stroke="#e5e7eb" stroke-width="0.8"/>
  <text x="405" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#374151">Özellik</text>
  <text x="470" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#374151">apt</text>
  <text x="520" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#374151">npm/pip</text>
  <text x="575" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#374151">Nix</text>

  <line x1="400" y1="112" x2="600" y2="112" stroke="#e5e7eb" stroke-width="0.5"/>

  <text x="405" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4b5563">İzolasyon</text>
  <text x="470" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Sistem</text>
  <text x="520" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Proje</text>
  <text x="575" y="128" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Paket</text>

  <line x1="400" y1="135" x2="600" y2="135" stroke="#e5e7eb" stroke-width="0.5"/>

  <text x="405" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4b5563">Sürüm çokluğu</text>
  <text x="470" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#dc2626">Zor</text>
  <text x="520" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#d97706">Kısmen</text>
  <text x="575" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#059669">Doğal</text>

  <line x1="400" y1="158" x2="600" y2="158" stroke="#e5e7eb" stroke-width="0.5"/>

  <text x="405" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4b5563">Tekrarlanabilirlik</text>
  <text x="470" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Depo</text>
  <text x="520" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Kilit</text>
  <text x="575" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#059669">Hash</text>

  <line x1="400" y1="181" x2="600" y2="181" stroke="#e5e7eb" stroke-width="0.5"/>

  <text x="405" y="197" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4b5563">Geri alma</text>
  <text x="470" y="197" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#dc2626">Sınırlı</text>
  <text x="520" y="197" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#d97706">Manuel</text>
  <text x="575" y="197" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#059669">Kolay</text>

  <line x1="400" y1="204" x2="600" y2="204" stroke="#e5e7eb" stroke-width="0.5"/>

  <!-- Alt bilgi -->
  <text x="500" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">Bağımlılık grafı: yönlü ve</text>
  <text x="500" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6b7280">ortak paketler içerebilir</text>

  <!-- Nix formülü -->
  <rect x="390" y="250" width="220" height="45" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="500" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#92400e">storePath = H(kaynak,</text>
  <text x="500" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#92400e">bağımlılıklar, derleme)</text>

  <!-- Bağlantı çizgileri (sağ tarafa) -->
  <path d="M 348 80 L 390 80" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <path d="M 348 175 L 390 175" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>
  <path d="M 348 270 L 390 270" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4,3" fill="none"/>

  <!-- Ok işaretleri -->
  <polygon points="390,76 398,80 390,84" fill="#4b5563"/>
  <polygon points="390,171 398,175 390,179" fill="#4b5563"/>
  <polygon points="390,266 398,270 390,274" fill="#4b5563"/>
</svg>