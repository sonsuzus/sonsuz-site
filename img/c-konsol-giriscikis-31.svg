<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f1"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dce9ff"/>
      <stop offset="100%" stop-color="#d8f2e7"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71849a" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71849a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="127" fill="#d9edf0" opacity="0.28"/>
  <circle cx="320" cy="160" r="96" fill="none" stroke="#b9d9dc" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.7"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43566d">C KONSOL GİRİŞ VE ÇIKIŞ</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718196">Akış tabanlı iletişim modeli</text>

  <!-- Kullanıcı -->
  <g filter="url(#shadow)">
    <rect x="28" y="105" width="112" height="104" rx="18" fill="#fff8e5"/>
    <circle cx="84" cy="134" r="17" fill="#ffd891"/>
    <circle cx="84" cy="130" r="6" fill="#8b694a"/>
    <path d="M70 151 Q84 141 98 151 L101 166 L67 166 Z" fill="#efb968"/>
    <rect x="49" y="176" width="70" height="18" rx="9" fill="#f7e4b9"/>
  </g>
  <text x="84" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#735d3d">Kullanıcı</text>

  <!-- Klavye -->
  <g filter="url(#smallShadow)">
    <rect x="164" y="67" width="122" height="55" rx="14" fill="#e9dcfb"/>
    <rect x="179" y="82" width="92" height="24" rx="5" fill="#f8f4ff"/>
    <path d="M188 89h8m5 0h8m5 0h8m5 0h8m5 0h8m5 0h8M188 98h13m5 0h13m5 0h13m5 0h13" stroke="#a18abe" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="225" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#625174">Klavye</text>
  <text x="225" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6a8a">stdin</text>

  <!-- Ekran -->
  <g filter="url(#smallShadow)">
    <rect x="469" y="66" width="137" height="67" rx="14" fill="#d9efff"/>
    <rect x="481" y="78" width="113" height="39" rx="6" fill="#f8fdff"/>
    <path d="M492 89h34M492 99h65M492 109h45" stroke="#76a7c4" stroke-width="3" stroke-linecap="round"/>
    <path d="M518 133v9m-18 0h36" stroke="#78a4bc" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="537" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41657b">Terminal</text>
  <text x="537" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67859a">stdout</text>

  <!-- Core Program -->
  <g filter="url(#shadow)">
    <rect x="251" y="119" width="138" height="103" rx="22" fill="url(#core)" stroke="#bbd9d8" stroke-width="1.2"/>
    <rect x="272" y="139" width="96" height="26" rx="8" fill="#f7fffd"/>
    <path d="M286 147v10m7-10v10m7-10v10m7-10v10m7-10v10m7-10v10" stroke="#5f9993" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M276 181h88" stroke="#9bc4bf" stroke-width="1.5"/>
    <circle cx="288" cy="198" r="4" fill="#78b6ab"/>
    <circle cx="303" cy="198" r="4" fill="#78b6ab"/>
    <circle cx="318" cy="198" r="4" fill="#78b6ab"/>
    <circle cx="333" cy="198" r="4" fill="#78b6ab"/>
    <circle cx="348" cy="198" r="4" fill="#78b6ab"/>
  </g>
  <text x="320" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365e60">C Programı</text>

  <!-- flow lines -->
  <path d="M140 157 H214 V126" fill="none" stroke="#a78acb" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="214,126 208,136 220,136" fill="#a78acb"/>
  <path d="M286 102 H320 V115" fill="none" stroke="#8e75b0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320,115 314,105 326,105" fill="#8e75b0"/>
  <path d="M389 151 H449 V101 H469" fill="none" stroke="#71a8c7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="469,101 459,95 459,107" fill="#71a8c7"/>

  <!-- Function panels -->
  <g filter="url(#smallShadow)">
    <rect x="62" y="238" width="139" height="58" rx="15" fill="#efe8fb"/>
    <rect x="76" y="250" width="48" height="25" rx="7" fill="#d9c8f3"/>
    <text x="100" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5e477b">scanf</text>
    <text x="137" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#675778">Veri al</text>
    <text x="137" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#675778">Tür denetle</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="250" y="257" width="140" height="45" rx="15" fill="#e1f3e9"/>
    <rect x="264" y="267" width="42" height="24" rx="7" fill="#bce3cf"/>
    <text x="285" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356d59">fgets</text>
    <text x="319" y="283" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#497662">Güvenli metin</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="440" y="238" width="139" height="58" rx="15" fill="#dceefa"/>
    <rect x="454" y="250" width="48" height="25" rx="7" fill="#bddcf2"/>
    <text x="478" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#366984">printf</text>
    <text x="515" y="260" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7288">Biçimli</text>
    <text x="515" y="277" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b7288">çıktı</text>
  </g>

  <path d="M201 266 H225 V212 H251" fill="none" stroke="#b19bcf" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M390 280 H414 V212 H389" fill="none" stroke="#83b9aa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M440 266 H416 V212 H389" fill="none" stroke="#8ab8d0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- stderr -->
  <g filter="url(#smallShadow)">
    <rect x="474" y="183" width="112" height="31" rx="11" fill="#ffe6e4"/>
    <circle cx="491" cy="198" r="7" fill="#ed8c87"/>
    <path d="M491 194v5m0 3v1" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="531" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9b5551">stderr · Hata</text>
  </g>
  <path d="M389 188 H463" fill="none" stroke="#df8b86" stroke-width="2" stroke-linecap="round"/>
  <polygon points="463,188 454,183 454,193" fill="#df8b86"/>
</svg>