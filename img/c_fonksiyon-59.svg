<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C Fonksiyon Yapısı</text>

  <!-- Fonksiyon bloğu (merkez) -->
  <rect x="220" y="100" width="200" height="60" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Fonksiyon</text>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">İşlem satırları</text>

  <!-- Girdi: Parametreler (sol) -->
  <rect x="40" y="100" width="140" height="60" rx="12" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="110" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#e65100">Parametreler</text>
  <text x="110" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4e342e">Argümanlar</text>

  <!-- Ok: Parametreler -> Fonksiyon -->
  <path d="M180 130 L215 130" stroke="#546e7a" stroke-width="2" fill="none"/>
  <polygon points="218,130 208,125 208,135" fill="#546e7a"/>

  <!-- Çıktı: return (sağ) -->
  <rect x="460" y="100" width="140" height="60" rx="12" fill="url(#box3)" filter="url(#shadow)" stroke="#81c784" stroke-width="1.5"/>
  <text x="530" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">return</text>
  <text x="530" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">Sonuç döndürür</text>

  <!-- Ok: Fonksiyon -> return -->
  <path d="M420 130 L455 130" stroke="#546e7a" stroke-width="2" fill="none"/>
  <polygon points="458,130 448,125 448,135" fill="#546e7a"/>

  <!-- Üst: veri-türü -->
  <rect x="220" y="20" width="200" height="50" rx="12" fill="url(#box4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.5"/>
  <text x="320" y="40" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#c2185b">veri-türü</text>
  <text x="320" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">int, float, void...</text>

  <!-- Ok: veri-türü -> Fonksiyon -->
  <path d="M320 70 L320 95" stroke="#546e7a" stroke-width="2" fill="none"/>
  <polygon points="320,98 315,88 325,88" fill="#546e7a"/>

  <!-- Alt: fonksiyon-adı -->
  <rect x="220" y="195" width="200" height="50" rx="12" fill="url(#box5)" filter="url(#shadow)" stroke="#9575cd" stroke-width="1.5"/>
  <text x="320" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#4527a0">fonksiyon-adı</text>
  <text x="320" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">Çağrı için kullanılır</text>

  <!-- Ok: Fonksiyon -> fonksiyon-adı -->
  <path d="M320 160 L320 190" stroke="#546e7a" stroke-width="2" fill="none"/>
  <polygon points="320,193 315,183 325,183" fill="#546e7a"/>

  <!-- Alt bilgi -->
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c">Fonksiyon-adı ve işlem satırları zorunludur</text>
  <text x="320" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78909c">veri-türü, parametreler ve return isteğe bağlıdır</text>
</svg>