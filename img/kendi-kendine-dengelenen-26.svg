<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b9d8f5"/>
      <stop offset="100%" stop-color="#8fb9e1"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66809a" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78919c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="81" cy="55" r="48" fill="#dceef9" opacity="0.55"/>
  <circle cx="569" cy="265" r="68" fill="#dff1db" opacity="0.52"/>
  <path d="M35 266 C130 246 176 280 260 264 S410 242 605 269" fill="none" stroke="#c8e1d0" stroke-width="2" opacity="0.7"/>

  <!-- Bağlantı çizgileri -->
  <path d="M170 105 C202 105 211 118 230 132" fill="none" stroke="#7894ab" stroke-width="2.5"/>
  <polygon points="230,132 218,128 222,140" fill="#7894ab"/>
  <path d="M322 93 C349 80 366 79 391 85" fill="none" stroke="#7894ab" stroke-width="2.5"/>
  <polygon points="391,85 380,79 381,91" fill="#7894ab"/>
  <path d="M473 111 C493 127 503 143 510 160" fill="none" stroke="#7894ab" stroke-width="2.5"/>
  <polygon points="510,160 502,150 514,148" fill="#7894ab"/>
  <path d="M471 224 C434 249 390 257 342 251" fill="none" stroke="#7894ab" stroke-width="2.5"/>
  <polygon points="342,251 353,245 351,257" fill="#7894ab"/>
  <path d="M245 245 C194 231 167 198 164 151" fill="none" stroke="#7894ab" stroke-width="2.5"/>
  <polygon points="164,151 171,162 159,162" fill="#7894ab"/>

  <!-- IMU -->
  <g filter="url(#softShadow)">
    <rect x="56" y="70" width="114" height="70" rx="17" fill="#fffdf8"/>
    <rect x="56" y="70" width="114" height="70" rx="17" fill="none" stroke="#d6c99e"/>
    <circle cx="84" cy="103" r="16" fill="#f8d98a"/>
    <path d="M84 93 L84 113 M74 103 L94 103" stroke="#8f7540" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M108 95 C115 89 125 89 133 95 M108 111 C115 117 125 117 133 111" fill="none" stroke="#75a5bc" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#485867">IMU</text>
  </g>

  <!-- Filtre -->
  <g filter="url(#shadow)">
    <rect x="230" y="57" width="94" height="73" rx="17" fill="#e5f1ff"/>
    <rect x="230" y="57" width="94" height="73" rx="17" fill="none" stroke="#a8c7e5"/>
    <path d="M252 86 C259 75 269 98 276 86 S293 75 301 86" fill="none" stroke="#5488b0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M252 100 L301 100" stroke="#8eb6d6" stroke-width="2" stroke-linecap="round"/>
    <text x="277" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#405a70">Filtre</text>
  </g>

  <!-- PID -->
  <g filter="url(#shadow)">
    <rect x="391" y="56" width="97" height="73" rx="17" fill="#eee8fb"/>
    <rect x="391" y="56" width="97" height="73" rx="17" fill="none" stroke="#c8b9e7"/>
    <text x="439.5" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="600" fill="#6f5b9d">PID</text>
    <text x="439.5" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#57496f">Denetleyici</text>
  </g>

  <!-- Motor -->
  <g filter="url(#shadow)">
    <rect x="485" y="150" width="112" height="72" rx="17" fill="#e1f4e9"/>
    <rect x="485" y="150" width="112" height="72" rx="17" fill="none" stroke="#a9d5ba"/>
    <rect x="505" y="171" width="35" height="24" rx="6" fill="#82bb9a"/>
    <path d="M540 176 L552 176 L560 183 L552 190 L540 190" fill="#b3d9bf" stroke="#629579" stroke-width="1.5"/>
    <path d="M512 183 L533 183" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="541" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426653">Motor sürücü</text>
  </g>

  <!-- Robot -->
  <g filter="url(#shadow)">
    <rect x="245" y="191" width="105" height="72" rx="19" fill="#fffdf8"/>
    <rect x="245" y="191" width="105" height="72" rx="19" fill="none" stroke="#b3c9d7"/>
    <circle cx="266" cy="247" r="16" fill="#526c7d"/>
    <circle cx="266" cy="247" r="8" fill="#c9dce5"/>
    <circle cx="329" cy="247" r="16" fill="#526c7d"/>
    <circle cx="329" cy="247" r="8" fill="#c9dce5"/>
    <path d="M276 229 L289 166 Q291 156 301 156 Q311 156 313 166 L323 229 Z" fill="url(#robotBody)" stroke="#658ca9" stroke-width="1.5"/>
    <rect x="282" y="177" width="38" height="24" rx="7" fill="#d9edf9" opacity="0.92"/>
    <circle cx="301" cy="188" r="5" fill="#f2c96d"/>
    <path d="M301 156 L301 141" stroke="#658ca9" stroke-width="2" stroke-linecap="round"/>
    <circle cx="301" cy="138" r="4" fill="#84b89b"/>
    <text x="297.5" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#43535e">Denge robotu</text>
  </g>

  <!-- Hata ve geri besleme -->
  <g filter="url(#softShadow)">
    <rect x="73" y="194" width="108" height="58" rx="16" fill="#fff0ea"/>
    <rect x="73" y="194" width="108" height="58" rx="16" fill="none" stroke="#e6bcae"/>
    <path d="M94 211 L108 225 L123 207" fill="none" stroke="#ce7c68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="139" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#775349">Açı hatası</text>
    <text x="139" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b7063">geri besleme</text>
  </g>

  <!-- Denge çizgisi -->
  <path d="M302 143 L302 104" stroke="#8baa9c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="316" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668477">dik hedef</text>
</svg>