  <text x="320" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#ffffff">topla(a, b): sayı</text>
  <text x="320" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e7e4ff">Giriş şartı · Çıkış garantisi</text>

