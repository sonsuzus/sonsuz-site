    <circle cx="320" cy="242" r="13" fill="#897bc9"/>
    <path d="M314 242 H326 M320 236 V248" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="320" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#544888">Modüler güvenlik</text>
    <text x="320" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6f649c">açık sözleşmeler</text>
  </g>

