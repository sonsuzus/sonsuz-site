    <text x="508" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356c70">Güçlü araç desteği</text>
    <text x="508" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e8084">tamamlama ve uyarı</text>
  </g>

  <path d="M286 222 L209 196" fill="none" stroke="#b8addd" stroke-width="1.5"/>
