<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="bigGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe8ff"/>
      <stop offset="100%" stop-color="#b9d8f5"/>
    </linearGradient>
    <linearGradient id="smallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5bc"/>
      <stop offset="100%" stop-color="#f6c987"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7892a5" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7892a5" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="55" r="70" fill="#dceefb" opacity="0.52"/>
  <circle cx="590" cy="280" r="93" fill="#ddefd6" opacity="0.48"/>

  <text x="32" y="36" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38556b">Küçükten Büyüğe Birleştirme</text>
  <text x="32" y="55" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Az veri taşı, büyük kümede kal</text>

  <g filter="url(#shadow)">
    <rect x="32" y="91" width="130" height="78" rx="18" fill="url(#smallGrad)" stroke="#e8b96e"/>
    <rect x="32" y="197" width="130" height="58" rx="18" fill="url(#smallGrad)" stroke="#e8b96e"/>
  </g>
  <text x="53" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765326">Küçük küme</text>
  <text x="53" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#85663a">3 eleman</text>
  <circle cx="55" cy="151" r="4" fill="#e89557"/>
  <circle cx="69" cy="151" r="4" fill="#e89557"/>
  <circle cx="83" cy="151" r="4" fill="#e89557"/>

  <text x="53" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765326">Alt küme</text>
  <text x="53" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#85663a">1 eleman</text>
  <circle cx="136" cy="228" r="5" fill="#e89557"/>

  <path d="M162 129 C190 129 188 151 216 151" fill="none" stroke="#df9c4c" stroke-width="2.5"/>
  <polygon points="216,151 207,146 208,156" fill="#df9c4c"/>
  <path d="M162 226 C190 226 186 183 216 183" fill="none" stroke="#df9c4c" stroke-width="2.5"/>
  <polygon points="216,183 207,178 208,188" fill="#df9c4c"/>

