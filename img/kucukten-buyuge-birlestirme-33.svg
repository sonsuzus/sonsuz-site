    <rect x="218" y="99" width="190" height="137" rx="24" fill="url(#bigGrad)" stroke="#94bddb" stroke-width="1.3"/>
    <rect x="238" y="118" width="150" height="32" rx="12" fill="#eff8ff" opacity="0.72"/>
  </g>
  <text x="257" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b78">Büyük küme korunur</text>
  <text x="254" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e7189">Hedef koleksiyon</text>
  <circle cx="253" cy="199" r="7" fill="#5695c3"/>
  <circle cx="276" cy="199" r="7" fill="#6aa8d1"/>
  <circle cx="299" cy="199" r="7" fill="#7bb8dc"/>
  <circle cx="322" cy="199" r="7" fill="#e89557"/>
  <circle cx="345" cy="199" r="7" fill="#e89557"/>
  <circle cx="368" cy="199" r="7" fill="#e89557"/>
  <text x="252" y="220" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e7189">yerinde kalır</text>

  <path d="M408 167 C433 167 437 121 460 121" fill="none" stroke="#6d9db9" stroke-width="2.5"/>
  <polygon points="460,121 451,116 452,126" fill="#6d9db9"/>

  <g filter="url(#soft)">
    <rect x="462" y="78" width="145" height="90" rx="19" fill="#e5f3dd" stroke="#a9cf98"/>
    <rect x="462" y="190" width="145" height="75" rx="19" fill="#eee6fa" stroke="#c6aee0"/>
  </g>
  <text x="481" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f7849">Her taşımada</text>
  <text x="481" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60835b">boyut en az</text>
  <text x="481" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f7849">2 kat büyür</text>

  <path d="M534 168 L534 190" fill="none" stroke="#9d80bd" stroke-width="2.5"/>
  <polygon points="534,190 529,181 539,181" fill="#9d80bd"/>
  <text x="483" y="217" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#705484">Amortisman</text>
  <text x="483" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806896">Eleman başına O(log n)</text>
  <text x="483" y="257" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806896">Toplam O(n log n)</text>

  <g opacity="0.7">
    <path d="M238 274 H391" stroke="#b6cad4" stroke-width="1.5"/>
    <circle cx="251" cy="274" r="4" fill="#e89557"/>
    <circle cx="281" cy="274" r="4" fill="#e89557"/>
    <circle cx="321" cy="274" r="4" fill="#78acd0"/>
    <circle cx="371" cy="274" r="4" fill="#78acd0"/>
    <text x="238" y="298" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8593">1 → 2 → 4 → 8</text>
  </g>
</svg>