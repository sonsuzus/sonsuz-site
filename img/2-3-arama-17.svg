  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#304b65">Dengeli Arama Ağacı: Aynı Fikir, İki Temsil</text>

  <rect x="25" y="49" width="250" height="236" rx="20" fill="url(#blueCard)" filter="url(#shadow)"/>
