<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3dd"/>
      <stop offset="100%" stop-color="#ffe4d3"/>
    </linearGradient>
    <linearGradient id="alarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdce0"/>
      <stop offset="100%" stop-color="#ffc4cc"/>
    </linearGradient>
    <linearGradient id="catch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff6f2"/>
      <stop offset="100%" stop-color="#c6ebe4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
