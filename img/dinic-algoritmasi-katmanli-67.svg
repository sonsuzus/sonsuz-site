    <linearGradient id="sourceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#badcff"/>
      <stop offset="100%" stop-color="#87baf0"/>
    </linearGradient>
    <linearGradient id="sinkGrad" x1="0" y1="0" x2="1" y2="1">
