<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ddff"/>
      <stop offset="100%" stop-color="#d7e9ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="49" r="58" fill="#d9f2ee" opacity="0.42"/>
  <circle cx="584" cy="274" r="82" fill="#e7dcff" opacity="0.32"/>
  <path d="M34 270 C134 225 157 300 249 278 S420 234 607 283" fill="none" stroke="#b9ddd6" stroke-width="2" opacity="0.45"/>

  <!-- source -->
  <g filter="url(#shadow)">
    <rect x="28" y="119" width="130" height="88" rx="18" fill="#ffffff"/>
    <rect x="39" y="131" width="35" height="28" rx="9" fill="#ccefe8"/>
    <path d="M49 141 h15 M49 148 h11" stroke="#378f84" stroke-width="2" stroke-linecap="round"/>
    <text x="84" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#294850">suspend</text>
    <text x="43" y="177" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526c73">Sıralı kod</text>
    <text x="43" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526c73">askı noktaları</text>
  </g>

  <!-- Arrow source to compiler -->
  <path d="M160 163 H190" fill="none" stroke="#6d8f9a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M190 163 L181 157 L181 169 Z" fill="#6d8f9a"/>

  <!-- compiler transformation -->
  <g filter="url(#soft)">
    <rect x="193" y="135" width="90" height="56" rx="16" fill="#fff3ce"/>
    <path d="M213 151 L227 143 L241 151 L241 166 L227 174 L213 166 Z" fill="#f6c96c" stroke="#b8862d" stroke-width="1.5"/>
    <path d="M221 153 h12 M221 159 h12 M221 165 h7" stroke="#865e1f" stroke-width="1.5" stroke-linecap="round"/>
    <text x="246" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#73511c">Derleyici</text>
    <text x="246" y="175" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6c31">dönüşümü</text>
  </g>

  <path d="M285 163 H310" fill="none" stroke="#6d8f9a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M310 163 L301 157 L301 169 Z" fill="#6d8f9a"/>

  <!-- central state machine -->
  <g filter="url(#shadow)">
    <rect x="313" y="73" width="188" height="183" rx="25" fill="url(#core)" stroke="#c4b7e6" stroke-width="1.2"/>
    <text x="407" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#48406f">Durum Makinesi</text>
    <text x="407" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#696288">label ile devam</text>

    <rect x="335" y="135" width="47" height="38" rx="11" fill="#ffffff" opacity="0.94"/>
    <text x="358.5" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b5790">0</text>
    <text x="358.5" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65717e">başla</text>

    <rect x="408" y="135" width="47" height="38" rx="11" fill="#ffffff" opacity="0.94"/>
    <text x="431.5" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b5790">1</text>
    <text x="431.5" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65717e">kullanıcı</text>

    <rect x="371" y="195" width="47" height="38" rx="11" fill="#ffffff" opacity="0.94"/>
    <text x="394.5" y="211" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5b5790">2</text>
    <text x="394.5" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65717e">sonuç</text>

    <path d="M383 154 H402" fill="none" stroke="#8378aa" stroke-width="1.8"/>
    <path d="M402 154 L396 150 L396 158 Z" fill="#8378aa"/>
    <path d="M431 175 C431 188 418 195 410 199" fill="none" stroke="#8378aa" stroke-width="1.8"/>
    <path d="M410 199 L413 192 L419 203 Z" fill="#8378aa"/>
    <path d="M370 214 C342 207 329 186 335 170" fill="none" stroke="#a098bc" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- continuation upper -->
  <path d="M404 70 V48" fill="none" stroke="#668c99" stroke-width="2" stroke-linecap="round"/>
  <path d="M404 48 L399 56 L409 56 Z" fill="#668c99"/>
  <g filter="url(#soft)">
    <rect x="332" y="17" width="144" height="32" rx="14" fill="#d7f1ec"/>
    <circle cx="353" cy="33" r="9" fill="#72bdb0"/>
    <path d="M350 33 h6 M353 30 v6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="365" y="37" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356b66">Continuation</text>
  </g>

  <!-- right async -->
  <path d="M503 163 H526" fill="none" stroke="#6d8f9a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M526 163 L517 157 L517 169 Z" fill="#6d8f9a"/>

  <g filter="url(#shadow)">
    <rect x="529" y="104" width="87" height="116" rx="19" fill="#ffffff"/>
    <text x="572.5" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385b7a">Dispatcher</text>
    <rect x="545" y="143" width="56" height="15" rx="7.5" fill="#d6eafd"/>
    <rect x="545" y="166" width="56" height="15" rx="7.5" fill="#d9f1e3"/>
    <rect x="545" y="189" width="56" height="15" rx="7.5" fill="#f8e1d1"/>
    <circle cx="554" cy="150.5" r="3" fill="#5795c4"/>
    <circle cx="554" cy="173.5" r="3" fill="#63a77e"/>
    <circle cx="554" cy="196.5" r="3" fill="#ce8967"/>
    <text x="572" y="154" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56738b">iş parçacığı</text>
  </g>

  <!-- suspend release loop -->
  <path d="M503 221 C535 260 510 287 468 281 C439 277 438 254 454 242" fill="none" stroke="#66a99d" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
  <path d="M454 242 L445 246 L452 252 Z" fill="#66a99d"/>
  <text x="481" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d8179">askı ve sürdürme</text>

  <!-- status pill -->
  <g filter="url(#soft)">
    <rect x="53" y="244" width="184" height="35" rx="17" fill="#e3f2fb"/>
    <circle cx="73" cy="261.5" r="7" fill="#65a8c4"/>
    <path d="M70 262 h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="87" y="266" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35647a">Thread serbest kalır</text>
  </g>
</svg>