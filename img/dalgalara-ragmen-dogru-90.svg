<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cce9ef"/>
      <stop offset="100%" stop-color="#b8ddec"/>
    </linearGradient>
    <linearGradient id="vessel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#739bc3"/>
      <stop offset="100%" stop-color="#476f9c"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#68829a" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58788d" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <path d="M0 267 C42 253 72 281 114 267 S188 252 230 268 S302 282 344 267 S416 252 458 267 S532 282 574 267 S616 253 640 261 L640 320 L0 320Z" fill="url(#sea)" opacity="0.7"/>
  <path d="M0 282 C36 270 73 294 109 282 S182 271 218 283 S291 295 327 282 S400 270 436 283 S509 294 545 282 S604 272 640 281" fill="none" stroke="#8fc6d5" stroke-width="2" opacity="0.7"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486276" font-weight="600">OTONOM NAVİGASYON DÖNGÜSÜ</text>

  <!-- Sensors -->
  <g filter="url(#soft)">
    <rect x="27" y="65" width="106" height="137" rx="18" fill="#edf5ff" stroke="#bfd6eb"/>
    <text x="80" y="89" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#41617c" font-weight="600">Sensörler</text>

    <rect x="42" y="103" width="76" height="23" rx="9" fill="#cfe6fb"/>
    <text x="80" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365d7c">GNSS</text>

    <rect x="42" y="135" width="76" height="23" rx="9" fill="#d8f0e3"/>
    <text x="80" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3b6c58">IMU</text>

    <rect x="42" y="167" width="76" height="23" rx="9" fill="#f8e5bf"/>
    <text x="80" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c6140">Pusula</text>
  </g>

  <!-- arrow sensors -->
  <path d="M137 133 H159" fill="none" stroke="#718ea3" stroke-width="2"/>
  <polygon points="166,133 157,128 157,138" fill="#718ea3"/>

  <!-- Estimator -->
  <g filter="url(#shadow)">
    <rect x="166" y="72" width="119" height="121" rx="19" fill="#e2f2ef" stroke="#b9d9d1"/>
    <circle cx="225" cy="105" r="22" fill="#b9dfd5"/>
    <path d="M214 106 L222 113 L237 96" fill="none" stroke="#397767" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="225" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356b5e" font-weight="600">Durum Kestirici</text>
    <text x="225" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8279">Filtreleme</text>
    <text x="225" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8279">Konum · Hız · Baş</text>
  </g>

  <!-- arrow estimator planner -->
  <path d="M289 132 H309" fill="none" stroke="#718ea3" stroke-width="2"/>
  <polygon points="316,132 307,127 307,137" fill="#718ea3"/>

  <!-- Planner -->
  <g filter="url(#shadow)">
    <rect x="316" y="72" width="119" height="121" rx="19" fill="#f9eed5" stroke="#ead6a9"/>
    <path d="M335 118 C352 91 373 146 414 101" fill="none" stroke="#c58e43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="335" cy="118" r="4" fill="#c58e43"/>
    <circle cx="414" cy="101" r="5" fill="#d56f5b"/>
    <text x="375" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#81612f" font-weight="600">LOS Planlayıcı</text>
    <text x="375" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#927542">Rota ve bakış</text>
    <text x="375" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#927542">Sapma düzeltme</text>
  </g>

  <!-- arrow planner controller -->
  <path d="M439 132 H459" fill="none" stroke="#718ea3" stroke-width="2"/>
  <polygon points="466,132 457,127 457,137" fill="#718ea3"/>

  <!-- Controller -->
  <g filter="url(#shadow)">
    <rect x="466" y="72" width="109" height="121" rx="19" fill="#eee5f7" stroke="#d7c5ea"/>
    <circle cx="520" cy="108" r="23" fill="#d9c8ed"/>
    <path d="M509 108 H531 M520 97 V119" stroke="#765692" stroke-width="3" stroke-linecap="round"/>
    <text x="520" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#65477f" font-weight="600">PI Kontrolcü</text>
    <text x="520" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#81669a">Dümen ve itki</text>
    <text x="520" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#81669a">Sınır yönetimi</text>
  </g>

  <!-- actuator arrow -->
  <path d="M576 139 C599 145 601 183 575 207" fill="none" stroke="#718ea3" stroke-width="2"/>
  <polygon points="572,213 572,202 581,208" fill="#718ea3"/>

  <!-- Vessel card -->
  <g filter="url(#shadow)">
    <rect x="446" y="218" width="148" height="72" rx="18" fill="#e5f0fa" stroke="#bdd4e7"/>
    <text x="520" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456681" font-weight="600">İnsansız Deniz Aracı</text>
    <path d="M482 263 L549 263 L540 275 L493 275 Z" fill="url(#vessel)"/>
    <rect x="507" y="254" width="18" height="9" rx="3" fill="#769dbe"/>
    <path d="M549 269 H567" stroke="#547b9e" stroke-width="2"/>
    <path d="M567 269 L561 265 M567 269 L561 273" stroke="#547b9e" stroke-width="2" fill="none"/>
  </g>

  <!-- Environment influences -->
  <g filter="url(#soft)">
    <rect x="46" y="224" width="149" height="59" rx="17" fill="#dceff0" stroke="#b9d9da"/>
    <text x="120" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6c72" font-weight="600">Deniz Etkileri</text>
    <text x="120" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8589">Akıntı · Dalga · Rüzgâr</text>
  </g>

  <!-- environment to vessel -->
  <path d="M198 253 C278 239 365 271 441 261" fill="none" stroke="#62aab5" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="447,260 438,255 439,265" fill="#62aab5"/>

  <!-- feedback -->
  <path d="M461 288 C396 313 270 306 226 211" fill="none" stroke="#809cb1" stroke-width="2" stroke-dasharray="5 5"/>
  <polygon points="223,204 231,211 221,214" fill="#809cb1"/>
  <text x="329" y="307" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#688296">Geri besleme</text>

  <!-- route detail -->
  <path d="M606 111 C620 109 627 103 634 94" fill="none" stroke="#d98770" stroke-width="2"/>
  <circle cx="633" cy="93" r="4" fill="#d98770"/>
  <text x="598" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a665c">Hedef</text>
</svg>