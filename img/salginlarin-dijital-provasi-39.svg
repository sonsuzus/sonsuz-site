<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#c9dcf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#62809a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#62809a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="44" r="74" fill="#dff2ee" opacity="0.55"/>
  <circle cx="594" cy="274" r="95" fill="#e6edff" opacity="0.6"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#496274">SALGIN SİMÜLASYONU</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#758998">Varsayımlar → denemeler → olası sonuçlar</text>

  <!-- Left model card -->
  <rect x="29" y="87" width="150" height="158" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="49" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#38546b">SIR Modeli</text>
  <line x1="49" y1="125" x2="159" y2="125" stroke="#dce7eb"/>

  <circle cx="64" cy="151" r="12" fill="#bfe9dc"/>
  <text x="60.5" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#296b5a">S</text>
  <text x="84" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536b79">Duyarlı</text>

  <circle cx="64" cy="181" r="12" fill="#ffd4c7"/>
  <text x="61.5" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a4543c">I</text>
  <text x="84" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536b79">Bulaştırıcı</text>

  <circle cx="64" cy="211" r="12" fill="#d9d2f4"/>
  <text x="60.5" y="215" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665595">R</text>
  <text x="84" y="215" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536b79">İyileşmiş</text>

  <!-- Arrow SIR to core -->
  <path d="M179 166 H214" fill="none" stroke="#7c9aaa" stroke-width="2"/>
  <polygon points="220,166 211,161 211,171" fill="#7c9aaa"/>

  <!-- Central core -->
  <rect x="221" y="78" width="196" height="180" rx="25" fill="url(#core)" filter="url(#shadow)"/>
  <circle cx="319" cy="140" r="38" fill="#f8fcff" opacity="0.96" filter="url(#softShadow)"/>
  <circle cx="319" cy="140" r="25" fill="#86b5d5"/>
  <path d="M307 142 C312 130 322 128 330 135 C337 142 330 153 319 157 C309 153 302 149 307 142Z" fill="#ffffff"/>
  <path d="M311 174 H327" stroke="#6a8ea8" stroke-width="2" stroke-linecap="round"/>
  <path d="M311 181 H327" stroke="#6a8ea8" stroke-width="2" stroke-linecap="round"/>
  <text x="319" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#365872">Algoritmik</text>
  <text x="319" y="224" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#365872">simülasyon</text>
  <rect x="247" y="235" width="144" height="1" fill="#a5c3d7"/>
  <text x="319" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54728a">N = S + I + R</text>

  <!-- Top inputs -->
  <rect x="224" y="55" width="83" height="29" rx="12" fill="#fff3c9" filter="url(#softShadow)"/>
  <text x="265.5" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80651d">β Bulaşma</text>
  <path d="M266 84 V94" fill="none" stroke="#b79c54" stroke-width="1.5"/>
  <polygon points="266,100 262,93 270,93" fill="#b79c54"/>

  <rect x="330" y="55" width="83" height="29" rx="12" fill="#eadffc" filter="url(#softShadow)"/>
  <text x="371.5" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705797">γ İyileşme</text>
  <path d="M372 84 V94" fill="none" stroke="#917bb8" stroke-width="1.5"/>
  <polygon points="372,100 368,93 376,93" fill="#917bb8"/>

  <!-- Flow right -->
  <path d="M417 166 H446" fill="none" stroke="#7c9aaa" stroke-width="2"/>
  <polygon points="452,166 443,161 443,171" fill="#7c9aaa"/>

  <!-- Outcome panel -->
  <rect x="453" y="87" width="158" height="158" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="474" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#38546b">Olası Sonuçlar</text>
  <line x1="474" y1="125" x2="589" y2="125" stroke="#dce7eb"/>
  <line x1="478" y1="213" x2="589" y2="213" stroke="#adc5d0" stroke-width="1.2"/>
  <line x1="478" y1="143" x2="478" y2="213" stroke="#adc5d0" stroke-width="1.2"/>
  <path d="M480 207 C490 201 495 194 503 181 C511 167 516 146 528 143 C542 140 550 166 558 181 C566 195 576 201 587 205" fill="none" stroke="#e88369" stroke-width="3" stroke-linecap="round"/>
  <path d="M480 207 C491 204 503 198 512 185 C522 171 530 159 539 162 C550 166 558 183 568 192 C575 199 582 202 587 204" fill="none" stroke="#7ab6a0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="528" cy="143" r="4" fill="#e88369"/>
  <text x="536" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a85743">Zirve</text>
  <text x="481" y="232" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607986">Belirsizlik aralığı</text>

  <!-- Bottom experiment strip -->
  <rect x="95" y="274" width="450" height="30" rx="15" fill="#ffffff" opacity="0.9" filter="url(#softShadow)"/>
  <circle cx="122" cy="289" r="7" fill="#f2c26b"/>
  <text x="137" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#566f7e">Temas azalt</text>
  <circle cx="267" cy="289" r="7" fill="#9bcdbb"/>
  <text x="282" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#566f7e">Bağışıklık</text>
  <circle cx="400" cy="289" r="7" fill="#b8a8dc"/>
  <text x="415" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#566f7e">Tekrarlı koşu</text>
</svg>