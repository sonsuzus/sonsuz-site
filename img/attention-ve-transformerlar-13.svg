<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7fb8d8"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8e0c8"/>
      <stop offset="100%" stop-color="#8cc9a8"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d8a8"/>
      <stop offset="100%" stop-color="#e8b878"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b8e8"/>
      <stop offset="100%" stop-color="#b898d8"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b8c8"/>
      <stop offset="100%" stop-color="#d898b0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Attention ve Transformer Mimarisi</text>

  <!-- Merkez: Transformer -->
  <rect x="245" y="120" width="150" height="50" rx="14" fill="url(#grad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a4a">Transformer</text>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a3a4a">Paralel İşleme</text>

  <!-- Sol üst: Girdi -->
  <rect x="30" y="50" width="130" height="45" rx="12" fill="url(#grad2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="95" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a2a">Token Girdisi</text>
  <text x="95" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a4a2a">Konum Kodlama</text>

  <!-- Sol alt: RNN / LSTM -->
  <rect x="30" y="220" width="130" height="45" rx="12" fill="url(#grad5)" filter="url(#shadow)" opacity="0.85"/>
  <text x="95" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a1a2a">RNN / LSTM</text>
  <text x="95" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a1a2a">Sıralı İşleme</text>

  <!-- Sağ üst: Self-Attention -->
  <rect x="470" y="50" width="140" height="45" rx="12" fill="url(#grad3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="540" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a1a">Self-Attention</text>
  <text x="540" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a3a1a">Q, K, V Mekanizması</text>

  <!-- Sağ alt: Multi-head -->
  <rect x="470" y="220" width="140" height="45" rx="12" fill="url(#grad4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="540" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a1a4a">Multi-Head Dikkat</text>
  <text x="540" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a1a4a">Farklı İlişkiler</text>

  <!-- Oklar: Girdi -> Transformer -->
  <path d="M160 72 L235 120" stroke="#5a8a6a" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <polygon points="235,120 225,112 228,124" fill="#5a8a6a"/>

  <!-- Oklar: RNN -> Transformer (karşılaştırma) -->
  <path d="M160 242 L235 155" stroke="#a06070" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <polygon points="235,155 225,148 228,160" fill="#a06070"/>

  <!-- Oklar: Transformer -> Self-Attention -->
  <path d="M395 135 L460 85" stroke="#8a7a3a" stroke-width="2" fill="none"/>
  <polygon points="460,85 450,80 452,92" fill="#8a7a3a"/>

  <!-- Oklar: Transformer -> Multi-head -->
  <path d="M395 155 L460 235" stroke="#5a3a8a" stroke-width="2" fill="none"/>
  <polygon points="460,235 450,228 452,240" fill="#5a3a8a"/>

  <!-- Alt bilgi: O(n^2) maliyet -->
  <rect x="200" y="270" width="240" height="35" rx="10" fill="#ffffff" opacity="0.6" filter="url(#shadow)"/>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Dikkat Maliyeti: O(n²)</text>
  <text x="320" y="298" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a7a8a">Sparse Attention ve FlashAttention çözümü</text>

  <!-- Üst bilgi: Bağlam -->
  <rect x="200" y="42" width="240" height="30" rx="10" fill="#ffffff" opacity="0.5" filter="url(#shadow)"/>
  <text x="320" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Bağlamı Eşzamanlı Keşfetme</text>

  <!-- Küçük etiketler -->
  <text x="185" y="100" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#4a7a5a">paralel</text>
  <text x="185" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#8a5a6a">sıralı</text>
  <text x="430" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#8a7a3a">benzerlik</text>
  <text x="430" y="210" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#5a3a8a">çoklu bakış</text>
</svg>