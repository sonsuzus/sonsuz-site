<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">C++ Alıştırmalar</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="50" width="150" height="40" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Alıştırma Seti</text>

  <!-- Sol üst: Sözdizimi Hataları -->
  <rect x="30" y="120" width="180" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="120" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Sözdizimi Hataları</text>
  <text x="120" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#bf360c">C ve C++ kuralları</text>

  <!-- Sol alt: Yorum Analizi -->
  <rect x="30" y="210" width="180" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#81c784" stroke-width="1.5"/>
  <text x="120" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Yorum Analizi</text>
  <text x="120" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">sizeof(nec) durumu</text>

  <!-- Sağ üst: Hata Türleri -->
  <rect x="430" y="120" width="180" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.5"/>
  <text x="520" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Hata Türleri</text>
  <text x="520" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">Bildirim ve atama</text>

  <!-- Sağ alt: Derleme Davranışı -->
  <rect x="430" y="210" width="180" height="55" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#9575cd" stroke-width="1.5"/>
  <text x="520" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4527a0">Derleme Davranışı</text>
  <text x="520" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#311b92">C ve C++ farkları</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Merkez -> Sol üst -->
  <path d="M 245 75 L 215 120" stroke="#78909c" stroke-width="1.8" fill="none"/>
  <polygon points="215,120 222,112 218,122" fill="#78909c"/>

  <!-- Merkez -> Sağ üst -->
  <path d="M 395 75 L 425 120" stroke="#78909c" stroke-width="1.8" fill="none"/>
  <polygon points="425,120 418,112 422,122" fill="#78909c"/>

  <!-- Sol üst -> Sol alt -->
  <path d="M 120 175 L 120 205" stroke="#78909c" stroke-width="1.8" fill="none"/>
  <polygon points="120,205 115,197 125,197" fill="#78909c"/>

  <!-- Sağ üst -> Sağ alt -->
  <path d="M 520 175 L 520 205" stroke="#78909c" stroke-width="1.8" fill="none"/>
  <polygon points="520,205 515,197 525,197" fill="#78909c"/>

  <!-- Alt bağlantı -->
  <path d="M 210 237 L 425 237" stroke="#78909c" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>
  <polygon points="425,237 417,232 417,242" fill="#78909c"/>

  <!-- Küçük etiketler -->
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#607d8b" opacity="0.8">Kod inceleme ve hata ayıklama odaklı</text>
</svg>