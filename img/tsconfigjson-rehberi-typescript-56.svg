<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#a0b8c8" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#b0c8d8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c4a5e">tsconfig.json Yapılandırma Mimarisi</text>

  <!-- Merkez düğüm: tsconfig.json -->
  <rect x="245" y="50" width="150" height="42" rx="10" fill="#5b8db8" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">tsconfig.json</text>

  <!-- Sol üst: Derleyici Girdisi -->
  <rect x="30" y="55" width="130" height="38" rx="8" fill="#7fb3d5" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="95" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a3a4a">.ts / .tsx Dosyaları</text>

  <!-- Sol alt: Derleyici -->
  <rect x="30" y="130" width="130" height="38" rx="8" fill="#6aa84f" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="95" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a3a2a">tsc Derleyici</text>

  <!-- Sağ üst: Hedef -->
  <rect x="480" y="55" width="130" height="38" rx="8" fill="#e8a87c" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="545" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a2a1a">JavaScript Çıktısı</text>

  <!-- Sağ alt: Tip Kontrolü -->
  <rect x="480" y="130" width="130" height="38" rx="8" fill="#d98ba8" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="545" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a1a2a">Tip Kontrolü</text>

  <!-- Oklar: Sol üst -> Merkez -->
  <path d="M 160 74 L 240 71" stroke="#5b8db8" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="240,71 230,66 230,76" fill="#5b8db8" opacity="0.7"/>

  <!-- Oklar: Sol alt -> Merkez -->
  <path d="M 160 149 L 240 92" stroke="#5b8db8" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="240,92 230,88 233,97" fill="#5b8db8" opacity="0.7"/>

  <!-- Oklar: Merkez -> Sağ üst -->
  <path d="M 400 71 L 475 74" stroke="#5b8db8" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="475,74 465,69 465,79" fill="#5b8db8" opacity="0.7"/>

  <!-- Oklar: Merkez -> Sağ alt -->
  <path d="M 400 92 L 475 149" stroke="#5b8db8" stroke-width="2" fill="none" opacity="0.7"/>
  <polygon points="475,149 467,143 467,153" fill="#5b8db8" opacity="0.7"/>

  <!-- Alt bölüm: Anahtar Ayarlar -->
  <text x="320" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c4a5e">Temel Yapılandırma Alanları</text>

  <!-- Üç alt kutu -->
  <rect x="40" y="215" width="160" height="38" rx="8" fill="#a8c8e8" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="120" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a3a4a">target ve module</text>

  <rect x="240" y="215" width="160" height="38" rx="8" fill="#b8d8a8" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="320" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1a3a2a">strict Mod</text>

  <rect x="440" y="215" width="160" height="38" rx="8" fill="#e8c8b8" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="520" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a2a1a">include ve exclude</text>

  <!-- Bağlantı çizgileri -->
  <line x1="120" y1="253" x2="120" y2="270" stroke="#a0b8c8" stroke-width="1.5" opacity="0.5"/>
  <line x1="320" y1="253" x2="320" y2="270" stroke="#a0b8c8" stroke-width="1.5" opacity="0.5"/>
  <line x1="520" y1="253" x2="520" y2="270" stroke="#a0b8c8" stroke-width="1.5" opacity="0.5"/>

  <!-- Alt not -->
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7a8a" opacity="0.8">Derleme Süreci ve Güvenlik Ağı</text>

  <!-- Dekoratif ok: Girdi -> Çıktı -->
  <path d="M 200 290 L 440 290" stroke="#8ab0c8" stroke-width="1.5" stroke-dasharray="4,3" fill="none" opacity="0.4"/>
  <polygon points="440,290 432,286 432,294" fill="#8ab0c8" opacity="0.4"/>
</svg>