<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#5BA0E9"/>
    </linearGradient>
    <linearGradient id="aggGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8B195"/>
      <stop offset="100%" stop-color="#F67280"/>
    </linearGradient>
    <linearGradient id="scalarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#82C7A0"/>
      <stop offset="100%" stop-color="#56A87A"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık kutusu -->
  <rect x="220" y="15" width="200" height="38" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="320" y="39" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SQL Fonksiyonları</text>

  <!-- Bağlantı çizgileri (manuel ok başları ile) -->
  <!-- Sol çizgi -->
  <path d="M 260 53 L 170 85" stroke="#555" stroke-width="1.8" fill="none"/>
  <polygon points="170,85 178,80 174,88" fill="#555"/>

  <!-- Sağ çizgi -->
  <path d="M 380 53 L 470 85" stroke="#555" stroke-width="1.8" fill="none"/>
  <polygon points="470,85 462,80 466,88" fill="#555"/>

  <!-- Çoklu Satır (Aggregate) Kutusu -->
  <rect x="40" y="88" width="240" height="42" rx="10" fill="url(#aggGrad)" filter="url(#shadow)"/>
  <text x="160" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Çoklu Satır (Aggregate)</text>
  <text x="160" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff" opacity="0.9">Birden çok değer → tek sonuç</text>

  <!-- Sayısal (Scalar) Kutusu -->
  <rect x="360" y="88" width="240" height="42" rx="10" fill="url(#scalarGrad)" filter="url(#shadow)"/>
  <text x="480" y="107" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Sayısal (Scalar)</text>
  <text x="480" y="122" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#fff" opacity="0.9">Tek değer → tek sonuç</text>

  <!-- Alt bağlantı çizgileri -->
  <!-- Aggregate alt çizgileri -->
  <path d="M 100 130 L 100 155" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="100,155 104,147 96,147" fill="#555"/>

  <path d="M 160 130 L 160 155" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="160,155 164,147 156,147" fill="#555"/>

  <path d="M 220 130 L 220 155" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="220,155 224,147 216,147" fill="#555"/>

  <!-- Scalar alt çizgileri -->
  <path d="M 420 130 L 420 155" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="420,155 424,147 416,147" fill="#555"/>

  <path d="M 480 130 L 480 155" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="480,155 484,147 476,147" fill="#555"/>

  <path d="M 540 130 L 540 155" stroke="#555" stroke-width="1.5" fill="none"/>
  <polygon points="540,155 544,147 536,147" fill="#555"/>

  <!-- Aggregate fonksiyon kutuları -->
  <rect x="50" y="158" width="100" height="28" rx="7" fill="#FDD9B5" filter="url(#shadow)"/>
  <text x="100" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5D4037">AVG()</text>

  <rect x="160" y="158" width="100" height="28" rx="7" fill="#FDD9B5" filter="url(#shadow)"/>
  <text x="210" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5D4037">COUNT()</text>

  <rect x="105" y="195" width="100" height="28" rx="7" fill="#FDD9B5" filter="url(#shadow)"/>
  <text x="155" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5D4037">MAX()</text>

  <rect x="30" y="232" width="100" height="28" rx="7" fill="#FDD9B5" filter="url(#shadow)"/>
  <text x="80" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5D4037">MIN()</text>

  <rect x="140" y="232" width="100" height="28" rx="7" fill="#FDD9B5" filter="url(#shadow)"/>
  <text x="190" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5D4037">SUM()</text>

  <rect x="70" y="270" width="100" height="28" rx="7" fill="#FDD9B5" filter="url(#shadow)"/>
  <text x="120" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5D4037">FIRST()</text>

  <rect x="180" y="270" width="100" height="28" rx="7" fill="#FDD9B5" filter="url(#shadow)"/>
  <text x="230" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5D4037">LAST()</text>

  <!-- Scalar fonksiyon kutuları -->
  <rect x="370" y="158" width="100" height="28" rx="7" fill="#C8E6C9" filter="url(#shadow)"/>
  <text x="420" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1B5E20">LCASE()</text>

  <rect x="480" y="158" width="100" height="28" rx="7" fill="#C8E6C9" filter="url(#shadow)"/>
  <text x="530" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1B5E20">LEN()</text>

  <rect x="425" y="195" width="100" height="28" rx="7" fill="#C8E6C9" filter="url(#shadow)"/>
  <text x="475" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1B5E20">MID()</text>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888" opacity="0.8">SQL Programlama Fonksiyonları</text>
</svg>