<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#c8f0c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Go Eşzamanlılık Mimarisi</text>

  <!-- Merkez: Goroutine -->
  <rect x="245" y="120" width="150" height="60" rx="12" fill="url(#center)" filter="url(#shadow)" stroke="#90caf9" stroke-width="1.5"/>
  <text x="320" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Goroutine</text>
  <text x="320" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#37474f">Hafif görev</text>

  <!-- Sol üst: Eşzamanlılık -->
  <rect x="30" y="45" width="140" height="55" rx="10" fill="url(#box1)" filter="url(#shadowLight)" stroke="#4fc3f7" stroke-width="1.2"/>
  <text x="100" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0277bd">Eşzamanlılık</text>
  <text x="100" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">Tasarım modeli</text>

  <!-- Sol alt: Paralellik -->
  <rect x="30" y="220" width="140" height="55" rx="10" fill="url(#box2)" filter="url(#shadowLight)" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="100" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Paralellik</text>
  <text x="100" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">Donanım desteği</text>

  <!-- Sağ üst: Channel -->
  <rect x="470" y="45" width="140" height="55" rx="10" fill="url(#box3)" filter="url(#shadowLight)" stroke="#ffb74d" stroke-width="1.2"/>
  <text x="540" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Channel</text>
  <text x="540" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">Veri taşıma</text>

  <!-- Sağ alt: WaitGroup -->
  <rect x="470" y="220" width="140" height="55" rx="10" fill="url(#box4)" filter="url(#shadowLight)" stroke="#f06292" stroke-width="1.2"/>
  <text x="540" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">WaitGroup</text>
  <text x="540" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64">Senkronizasyon</text>

  <!-- Oklar: Eşzamanlılık -> Goroutine -->
  <path d="M170 72 C 200 72, 215 120, 240 135" fill="none" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="240,138 232,130 236,140" fill="#546e7a"/>

  <!-- Oklar: Paralellik -> Goroutine -->
  <path d="M170 247 C 200 247, 215 200, 240 185" fill="none" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="240,182 232,190 236,180" fill="#546e7a"/>

  <!-- Oklar: Goroutine -> Channel -->
  <path d="M400 135 C 430 120, 445 72, 465 68" fill="none" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="468,68 458,63 460,73" fill="#546e7a"/>

  <!-- Oklar: Goroutine -> WaitGroup -->
  <path d="M400 185 C 430 200, 445 247, 465 251" fill="none" stroke="#546e7a" stroke-width="1.8"/>
  <polygon points="468,251 458,256 460,246" fill="#546e7a"/>

  <!-- Alt bilgi: Scheduler -->
  <rect x="220" y="270" width="200" height="35" rx="8" fill="#eceff1" filter="url(#shadowLight)" stroke="#b0bec5" stroke-width="1"/>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#37474f">Go Scheduler</text>
  <text x="320" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#607d8b">OS thread dağıtımı</text>

  <!-- Scheduler bağlantıları -->
  <line x1="270" y1="180" x2="270" y2="268" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="370" y1="180" x2="370" y2="268" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Çekirdekler -->
  <rect x="30" y="130" width="60" height="30" rx="6" fill="#e8eaf6" filter="url(#shadowLight)" stroke="#7986cb" stroke-width="1"/>
  <text x="60" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3949ab">Çekirdek 1</text>

  <rect x="30" y="170" width="60" height="30" rx="6" fill="#e8eaf6" filter="url(#shadowLight)" stroke="#7986cb" stroke-width="1"/>
  <text x="60" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3949ab">Çekirdek 2</text>

  <!-- Çekirdek bağlantıları -->
  <path d="M90 145 C 130 145, 160 135, 240 135" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M90 185 C 130 185, 160 195, 240 185" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Amdahl etiketi -->
  <text x="540" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#78909c" font-style="italic">Amdahl: Hız = 1 / ((1-p) + p/n)</text>
</svg>