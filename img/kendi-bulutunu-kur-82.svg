  <g filter="url(#shadow)">
    <path d="M264 176 C244 176 232 163 232 147 C232 131 244 119 260 118 C265 96 284 83 307 88 C320 72 347 76 358 95 C381 91 402 106 402 128 C416 131 426 142 426 157 C426 174 413 187 395 187 H265 C249 187 239 179 239 165" fill="url(#cloudFill)" stroke="#8bb5c0" stroke-width="1.5"/>
    <rect x="267" y="126" width="107" height="35" rx="10" fill="#ffffff" opacity="0.8"/>
    <path d="M287 143 h11 m4 0 h11 m4 0 h11 m4 0 h11" stroke="#60a4a2" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="320" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6270">Kişisel Bulut</text>

  <!-- bottom solution cards -->
  <g filter="url(#softShadow)">
    <rect x="206" y="228" width="83" height="67" rx="14" fill="#e5dcfa"/>
    <circle cx="226" cy="246" r="9" fill="#a68ad5"/>
    <path d="M221 246 H231 M226 241 V251" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="247" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#604a86">Nextcloud</text>
    <text x="247" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#735f94">ekosistem</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="302" y="228" width="83" height="67" rx="14" fill="#d7f0e3"/>
    <circle cx="322" cy="246" r="9" fill="#65af91"/>
    <path d="M317 246 H327 M322 241 V251" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="343" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36735f">Seafile</text>
    <text x="343" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e8774">hızlı eşitleme</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="398" y="228" width="83" height="67" rx="14" fill="#f9e2cb"/>
    <circle cx="418" cy="246" r="9" fill="#d79563"/>
    <path d="M413 246 H423 M418 241 V251" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="439" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8d5a38">ownCloud</text>
    <text x="439" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a17250">kurumsal</text>
  </g>

  <!-- Security badge -->
  <g filter="url(#softShadow)">
    <rect x="40" y="241" width="114" height="43" rx="15" fill="#ffffff"/>
    <path d="M59 250 L70 246 L81 250 V259 C81 267 76 272 70 275 C64 272 59 267 59 259 Z" fill="#9fc9b0"/>
    <path d="M65 259 L69 263 L76 255" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="113" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#496474">Güvenlik</text>
    <text x="113" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8390">ve yedek</text>
  </g>

  <!-- database badge -->
  <g filter="url(#softShadow)">
    <rect x="486" y="241" width="114" height="43" rx="15" fill="#ffffff"/>
    <ellipse cx="507" cy="251" rx="11" ry="4.5" fill="#9dbed6"/>
    <path d="M496 251 V265 C496 268 501 270 507 270 C513 270 518 268 518 265 V251" fill="#cfe5f4" stroke="#9dbed6" stroke-width="1"/>
    <path d="M496 258 C496 261 501 263 507 263 C513 263 518 261 518 258" fill="none" stroke="#9dbed6" stroke-width="1"/>
    <text x="556" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#496474">Veri ve</text>
    <text x="556" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8390">yapılandırma</text>
  </g>
</svg>