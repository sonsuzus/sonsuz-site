<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9edff"/>
      <stop offset="1" stop-color="#c9e6df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8394" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8394" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="73" cy="62" r="48" fill="#dceeff" opacity="0.45"/>
  <circle cx="579" cy="259" r="74" fill="#dff1d9" opacity="0.48"/>
  <circle cx="570" cy="48" r="29" fill="#fbe9ca" opacity="0.45"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d586a">KENDİ BULUTUNU KUR</text>

  <!-- Connections behind -->
  <path d="M177 148 C207 143 211 136 237 130" fill="none" stroke="#83a5b5" stroke-width="2"/>
  <polygon points="237,130 229,126 231,134" fill="#83a5b5"/>
  <path d="M403 129 C430 136 438 143 462 148" fill="none" stroke="#83a5b5" stroke-width="2"/>
  <polygon points="462,148 454,143 455,151" fill="#83a5b5"/>
  <path d="M320 187 L320 218" fill="none" stroke="#83a5b5" stroke-width="2"/>
  <polygon points="320,218 315,210 325,210" fill="#83a5b5"/>
  <path d="M265 227 C231 215 191 204 157 195" fill="none" stroke="#93b0c0" stroke-width="1.7"/>
  <polygon points="157,195 165,193 162,201" fill="#93b0c0"/>
  <path d="M375 227 C407 215 447 204 482 195" fill="none" stroke="#93b0c0" stroke-width="1.7"/>
  <polygon points="482,195 474,193 477,201" fill="#93b0c0"/>

  <!-- Left device -->
  <g filter="url(#softShadow)">
    <rect x="57" y="110" width="120" height="77" rx="17" fill="#ffffff"/>
    <rect x="70" y="122" width="94" height="47" rx="7" fill="#dff1ff"/>
    <path d="M97 177 H137" stroke="#7993a1" stroke-width="4" stroke-linecap="round"/>
    <path d="M109 170 L105 177 H129 L125 170" fill="#b6ccd5"/>
  </g>
  <text x="117" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#496474">Cihazlar</text>
  <text x="117" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8390">eşitleme</text>

  <!-- Right share -->
  <g filter="url(#softShadow)">
    <rect x="462" y="110" width="121" height="77" rx="17" fill="#ffffff"/>
    <circle cx="504" cy="139" r="11" fill="#f8d7b5"/>
    <circle cx="538" cy="142" r="11" fill="#d5dcf8"/>
    <path d="M485 165 C488 151 520 151 523 165" fill="#f8d7b5"/>
    <path d="M519 165 C522 153 551 153 555 165" fill="#d5dcf8"/>
    <path d="M513 141 H529" stroke="#7690b8" stroke-width="2"/>
    <polygon points="529,141 523,137 523,145" fill="#7690b8"/>
