<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3e0"/>
      <stop offset="100%" stop-color="#fae4c0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#c8e6d0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f5d0cc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Derleyici Geri Bildirim Döngüsü</text>

  <!-- Döngüsel akış: Kod → Geri Bildirim → Düzeltme → Yeni Kod -->
  
  <!-- 1. Kod (üst) -->
  <rect x="230" y="50" width="180" height="48" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#a0b4d8" stroke-width="1.5"/>
  <text x="320" y="70" text-anchor="middle" font-weight="bold" fill="#2c3e50">Kod Yazma</text>
  <text x="320" y="86" text-anchor="middle" fill="#4a5a7a">Tahmin + ifade</text>

  <!-- 2. Derleyici (sağ) -->
  <rect x="440" y="50" width="170" height="48" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#d4b08c" stroke-width="1.5"/>
  <text x="525" y="70" text-anchor="middle" font-weight="bold" fill="#2c3e50">Derleyici Sınaması</text>
  <text x="525" y="86" text-anchor="middle" fill="#7a5a3a">Kural denetimi</text>

  <!-- 3. Hata Mesajı (alt sağ) -->
  <rect x="440" y="140" width="170" height="48" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#d4a0a0" stroke-width="1.5"/>
  <text x="525" y="160" text-anchor="middle" font-weight="bold" fill="#2c3e50">Hata Mesajı</text>
  <text x="525" y="176" text-anchor="middle" fill="#7a3a3a">Farkı gösterir</text>

  <!-- 4. Geri Bildirim (alt) -->
  <rect x="230" y="140" width="180" height="48" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#8cb8a0" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-weight="bold" fill="#2c3e50">Geri Bildirim</text>
  <text x="320" y="176" text-anchor="middle" fill="#3a6a4a">Zihinsel model güncelle</text>

  <!-- 5. Düzeltme (sol) -->
  <rect x="30" y="95" width="170" height="48" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#a0b4d8" stroke-width="1.5"/>
  <text x="115" y="115" text-anchor="middle" font-weight="bold" fill="#2c3e50">Düzeltme</text>
  <text x="115" y="131" text-anchor="middle" fill="#4a5a7a">Yeni deneme</text>

  <!-- Oklar (manuel çizim) -->
  
  <!-- Kod → Derleyici (üst ok) -->
  <path d="M410,74 L438,74" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="438,70 448,74 438,78" fill="#5a7a9a"/>

  <!-- Derleyici → Hata Mesajı (dikey ok) -->
  <path d="M525,98 L525,138" stroke="#c05a5a" stroke-width="2" fill="none"/>
  <polygon points="521,138 525,148 529,138" fill="#c05a5a"/>

  <!-- Hata Mesajı → Geri Bildirim (sol ok) -->
  <path d="M438,164 L412,164" stroke="#5a8a6a" stroke-width="2" fill="none"/>
  <polygon points="412,160 402,164 412,168" fill="#5a8a6a"/>

  <!-- Geri Bildirim → Düzeltme (sol ok) -->
  <path d="M228,164 L202,164" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="202,160 192,164 202,168" fill="#5a7a9a"/>

  <!-- Düzeltme → Kod (döngüyü tamamla) -->
  <path d="M115,93 L115,74 L228,74" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="228,70 238,74 228,78" fill="#5a7a9a"/>

  <!-- Merkezde öğrenme verimi -->
  <circle cx="320" cy="118" r="22" fill="#e8f0fe" opacity="0.6" stroke="#a0b4d8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#3a5a7a">V = bilgi / deneme</text>

  <!-- Alt bilgi: Hata türleri -->
  <rect x="30" y="220" width="580" height="85" rx="10" fill="#ffffff" opacity="0.5" filter="url(#shadow)"/>
  <text x="50" y="240" font-weight="bold" fill="#2c3e50">Hata Türleri</text>

  <!-- Sözdizimi -->
  <rect x="50" y="252" width="120" height="38" rx="8" fill="#fce8e6" stroke="#d4a0a0" stroke-width="1"/>
  <text x="110" y="268" text-anchor="middle" font-weight="bold" fill="#7a3a3a">Sözdizimi</text>
  <text x="110" y="282" text-anchor="middle" font-size="10" fill="#5a3a3a">Dil bilgisi kuralları</text>

  <!-- Tür -->
  <rect x="190" y="252" width="120" height="38" rx="8" fill="#fef3e0" stroke="#d4b08c" stroke-width="1"/>
  <text x="250" y="268" text-anchor="middle" font-weight="bold" fill="#7a5a3a">Tür</text>
  <text x="250" y="282" text-anchor="middle" font-size="10" fill="#5a4a3a">Değer sınırları</text>

  <!-- Bağlama -->
  <rect x="330" y="252" width="120" height="38" rx="8" fill="#e8f0fe" stroke="#a0b4d8" stroke-width="1"/>
  <text x="390" y="268" text-anchor="middle" font-weight="bold" fill="#3a5a7a">Bağlama</text>
  <text x="390" y="282" text-anchor="middle" font-size="10" fill="#3a4a6a">Kapsam + bildirim</text>

  <!-- Mantık -->
  <rect x="470" y="252" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#8cb8a0" stroke-width="1"/>
  <text x="530" y="268" text-anchor="middle" font-weight="bold" fill="#3a6a4a">Mantık</text>
  <text x="530" y="282" text-anchor="middle" font-size="10" fill="#3a5a4a">Sessiz kalır</text>

</svg>