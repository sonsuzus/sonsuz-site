<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9e8"/>
      <stop offset="100%" stop-color="#dff0d0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8d0d8"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2f1"/>
      <stop offset="100%" stop-color="#c8e6e0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#3a4a5a">Derleyici Optimizasyonu: Soyutlama Katmanı</text>

  <!-- Sol taraf: Kaynak Kod -->
  <rect x="30" y="55" width="160" height="90" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#b0c4de" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Kaynak Kod</text>
  <text x="110" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Niyet ve sözleşme</text>
  <text x="110" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Soyut makine tarifi</text>
  <text x="110" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Döngüler, değişkenler</text>

  <!-- Sağ taraf: Makine Kodu -->
  <rect x="450" y="55" width="160" height="90" rx="12" fill="url(#box2)" filter="url(#shadow)" stroke="#a8c8a0" stroke-width="1.5"/>
  <text x="530" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Makine Kodu</text>
  <text x="530" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a4a">Register ve veri akışı</text>
  <text x="530" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a4a">Inline edilmiş ifadeler</text>
  <text x="530" y="136" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a4a">Vektör komutları</text>

  <!-- Ok: Kaynak -> Derleyici -->
  <path d="M190 100 L235 100" stroke="#5a7a9a" stroke-width="2" fill="none"/>
  <polygon points="235,94 245,100 235,106" fill="#5a7a9a"/>

  <!-- Ok: Derleyici -> Makine -->
  <path d="M405 100 L450 100" stroke="#5a8a5a" stroke-width="2" fill="none"/>
  <polygon points="450,94 460,100 450,106" fill="#5a8a5a"/>

  <!-- Orta: Derleyici -->
  <rect x="235" y="45" width="170" height="110" rx="14" fill="url(#box3)" filter="url(#shadow)" stroke="#e0c090" stroke-width="2"/>
  <text x="320" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#5a4a2a">Derleyici</text>
  <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a4a">As-if kuralı</text>
  <text x="320" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a4a">Davranış korunur</text>
  <text x="320" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a4a">Yeniden yazım</text>
  <text x="320" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a4a">Sıra değişimi</text>

  <!-- Alt: Optimizasyon teknikleri -->
  <text x="320" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a4a5a">Optimizasyon Stratejileri</text>

  <!-- Teknik kutuları -->
  <rect x="30" y="200" width="120" height="55" rx="10" fill="url(#box4)" filter="url(#shadowLight)" stroke="#e0a0b0" stroke-width="1"/>
  <text x="90" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#6a3a4a">Sabit Hesaplama</text>
  <text x="90" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8a5a6a">n(n-1)/2 dönüşümü</text>

  <rect x="170" y="200" width="120" height="55" rx="10" fill="url(#box5)" filter="url(#shadowLight)" stroke="#a0c8c0" stroke-width="1"/>
  <text x="230" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a6a5a">Döngü Açma</text>
  <text x="230" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8a7a">Vektör komutları</text>

  <rect x="310" y="200" width="120" height="55" rx="10" fill="url(#box1)" filter="url(#shadowLight)" stroke="#b0c4de" stroke-width="1"/>
  <text x="370" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a4a6a">Ölü Kod Silme</text>
  <text x="370" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a8a">Yan etkisiz işlemler</text>

  <rect x="450" y="200" width="120" height="55" rx="10" fill="url(#box2)" filter="url(#shadowLight)" stroke="#a8c8a0" stroke-width="1"/>
  <text x="510" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#3a6a3a">Tanımsız Davranış</text>
  <text x="510" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a8a5a">Signed overflow varsayımı</text>

  <!-- Alt bağlantı çizgileri -->
  <line x1="90" y1="200" x2="90" y2="185" stroke="#a0b0c0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="230" y1="200" x2="230" y2="185" stroke="#a0b0c0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="370" y1="200" x2="370" y2="185" stroke="#a0b0c0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="200" x2="510" y2="185" stroke="#a0b0c0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Alt bilgi -->
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a" opacity="0.8">P_kaynak(x) ≡ P_makine(x) — Aynı gözlemlenebilir davranış</text>

  <!-- Vurgu okları: Kaynak -> Derleyici -> Makine arası köprü -->
  <path d="M110 145 C110 170, 320 170, 320 155" stroke="#c0a080" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.6"/>
  <path d="M530 145 C530 170, 320 170, 320 155" stroke="#c0a080" stroke-width="1" fill="none" stroke-dasharray="4,3" opacity="0.6"/>
</svg>