<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e4ff"/>
      <stop offset="100%" stop-color="#d5f0f8"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#66829a" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#637d90" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="556" cy="48" r="82" fill="#dff4ed" opacity="0.45"/>
  <circle cx="91" cy="284" r="98" fill="#e5edff" opacity="0.52"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#496070">AKILLI KAYNAK PLANLAMA</text>

  <!-- connectors behind -->
  <path d="M158 91 C190 91 190 124 229 132" fill="none" stroke="#8ba8b8" stroke-width="2"/>
  <polygon points="229,132 219,127 221,137" fill="#8ba8b8"/>
  <path d="M158 160 C185 160 198 160 226 160" fill="none" stroke="#8ba8b8" stroke-width="2"/>
  <polygon points="226,160 216,155 216,165" fill="#8ba8b8"/>
  <path d="M158 229 C190 229 190 197 229 188" fill="none" stroke="#8ba8b8" stroke-width="2"/>
  <polygon points="229,188 221,183 219,193" fill="#8ba8b8"/>

  <path d="M401 160 C426 160 435 160 459 160" fill="none" stroke="#719bab" stroke-width="2.4"/>
  <polygon points="459,160 449,154 449,166" fill="#719bab"/>

  <path d="M529 213 C529 241 481 253 418 246" fill="none" stroke="#a0b7a7" stroke-width="1.7" stroke-dasharray="5 4"/>
  <polygon points="418,246 427,240 426,250" fill="#a0b7a7"/>

  <!-- left resource cards -->
  <g filter="url(#soft)">
    <rect x="35" y="58" width="123" height="65" rx="16" fill="#fff4df"/>
    <rect x="48" y="73" width="28" height="28" rx="8" fill="#f7c978"/>
    <rect x="54" y="80" width="16" height="13" rx="2" fill="none" stroke="#9b6c26" stroke-width="1.6"/>
    <path d="M58 93V86H66V93" fill="none" stroke="#9b6c26" stroke-width="1.4"/>
    <text x="86" y="83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#65533b">Yatak</text>
    <text x="86" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a6e5a">Tür ve uygunluk</text>
  </g>

  <g filter="url(#soft)">
    <rect x="35" y="128" width="123" height="65" rx="16" fill="#e6f5ef"/>
    <rect x="48" y="143" width="28" height="28" rx="8" fill="#8fd2b7"/>
    <circle cx="62" cy="151" r="4" fill="none" stroke="#317968" stroke-width="1.5"/>
    <path d="M54 165C54 159 70 159 70 165M72 153V161M68 157H76" fill="none" stroke="#317968" stroke-width="1.5" stroke-linecap="round"/>
    <text x="86" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#425e57">Personel</text>
    <text x="86" y="171" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647a73">Yetkinlik ve vardiya</text>
  </g>

  <g filter="url(#soft)">
    <rect x="35" y="198" width="123" height="65" rx="16" fill="#e8efff"/>
    <rect x="48" y="213" width="28" height="28" rx="8" fill="#a6c1f5"/>
    <rect x="55" y="220" width="14" height="13" rx="2" fill="none" stroke="#486caa" stroke-width="1.5"/>
    <path d="M59 216V220M65 216V220M58 227H66" fill="none" stroke="#486caa" stroke-width="1.5" stroke-linecap="round"/>
    <text x="86" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#43587e">Ekipman</text>
    <text x="86" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62718d">Cihaz ve bakım</text>
  </g>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="228" y="99" width="174" height="122" rx="26" fill="url(#core)"/>
    <rect x="243" y="115" width="144" height="31" rx="12" fill="#ffffff" opacity="0.74"/>
    <text x="315" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4b5680">OPTİMİZASYON</text>
    <path d="M260 169H280M350 169H370" fill="none" stroke="#7882ae" stroke-width="2" stroke-linecap="round"/>
    <circle cx="315" cy="169" r="22" fill="#766fc5"/>
    <path d="M305 170L312 177L326 161" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="315" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#59657d">Kısıtlar ve öncelik</text>
  </g>

  <!-- right outcome -->
  <g filter="url(#shadow)">
    <rect x="459" y="106" width="140" height="107" rx="20" fill="#eef8ed"/>
    <circle cx="529" cy="137" r="20" fill="#94cf9a"/>
    <path d="M519 137L526 144L540 128" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="529" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#46654c">Uygulanabilir plan</text>
    <text x="529" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687d6c">Güvenli hizmet</text>
  </g>

  <!-- feedback label -->
  <g filter="url(#soft)">
    <rect x="253" y="251" width="166" height="35" rx="13" fill="#ffffff" opacity="0.88"/>
    <path d="M271 269 C275 263 284 263 288 269" fill="none" stroke="#76a487" stroke-width="1.7" stroke-linecap="round"/>
    <polygon points="287,264 293,269 286,272" fill="#76a487"/>
    <text x="344" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587264">Güncelleme ve tampon</text>
  </g>
</svg>