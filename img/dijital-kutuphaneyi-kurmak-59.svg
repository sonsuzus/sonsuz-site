<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d9f5"/>
      <stop offset="1" stop-color="#8fc0e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#52718a" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#52718a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="587" cy="42" r="70" fill="#dceff0" opacity="0.6"/>
  <circle cx="46" cy="290" r="86" fill="#e6eefb" opacity="0.65"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39536b">BİLGİ HİYERARŞİSİ</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8191">Aşamalı keşif ve çapraz erişim</text>

  <!-- hierarchy connections -->
  <path d="M130 158 C151 158 146 98 169 98" fill="none" stroke="#88aabc" stroke-width="2"/>
  <path d="M130 158 C151 158 146 190 169 190" fill="none" stroke="#88aabc" stroke-width="2"/>
  <path d="M284 98 C301 98 297 70 315 70" fill="none" stroke="#88aabc" stroke-width="2"/>
  <path d="M284 98 C301 98 297 111 315 111" fill="none" stroke="#88aabc" stroke-width="2"/>
  <path d="M284 98 C301 98 297 152 315 152" fill="none" stroke="#88aabc" stroke-width="2"/>
  <path d="M284 190 C301 190 297 224 315 224" fill="none" stroke="#88aabc" stroke-width="2"/>
  <path d="M427 152 C445 152 439 152 458 152" fill="none" stroke="#88aabc" stroke-width="2"/>
  <polygon points="458,152 451,148 451,156" fill="#88aabc"/>

  <!-- Shelf -->
  <g filter="url(#shadow)">
    <rect x="28" y="112" width="102" height="93" rx="17" fill="url(#shelf)"/>
    <rect x="37" y="130" width="84" height="10" rx="5" fill="#eaf6ff" opacity="0.9"/>
    <rect x="37" y="146" width="84" height="7" rx="3.5" fill="#5c99c5" opacity="0.38"/>
    <rect x="37" y="177" width="84" height="10" rx="5" fill="#eaf6ff" opacity="0.9"/>
    <rect x="37" y="192" width="84" height="5" rx="2.5" fill="#5c99c5" opacity="0.36"/>
  </g>
  <text x="79" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#244b68">Raf</text>
  <text x="79" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54728a">Yazılım Platformu</text>

  <!-- Books -->
  <g filter="url(#soft)">
    <rect x="169" y="71" width="115" height="55" rx="13" fill="#d9d1f2"/>
    <rect x="180" y="81" width="8" height="35" rx="4" fill="#9e8bcf"/>
    <text x="230" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#514473">Kimlik</text>
    <text x="230" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#655b80">Servisi</text>
  </g>
  <g filter="url(#soft)">
    <rect x="169" y="163" width="115" height="55" rx="13" fill="#f9d9b5"/>
    <rect x="180" y="173" width="8" height="35" rx="4" fill="#df9b55"/>
    <text x="230" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7a5229">Ödeme</text>
    <text x="230" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d643b">Servisi</text>
  </g>
  <text x="226" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54728a">Kitaplar</text>

  <!-- Chapters -->
  <g filter="url(#soft)">
    <rect x="315" y="49" width="112" height="42" rx="12" fill="#d2ecdf"/>
    <circle cx="333" cy="70" r="7" fill="#72b693"/>
    <text x="374" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386750">Mimari</text>
  </g>
  <g filter="url(#soft)">
    <rect x="315" y="90" width="112" height="42" rx="12" fill="#d2ecdf"/>
    <circle cx="333" cy="111" r="7" fill="#72b693"/>
    <text x="374" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386750">Operasyon</text>
  </g>
  <g filter="url(#soft)">
    <rect x="315" y="131" width="112" height="42" rx="12" fill="#d2ecdf"/>
    <circle cx="333" cy="152" r="7" fill="#72b693"/>
    <text x="374" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386750">Sorun Giderme</text>
  </g>
  <g filter="url(#soft)">
    <rect x="315" y="203" width="112" height="42" rx="12" fill="#e8eaf0"/>
    <circle cx="333" cy="224" r="7" fill="#9aa8b7"/>
    <text x="374" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#586877">Bölümler</text>
  </g>

  <!-- Page -->
  <g filter="url(#shadow)">
    <rect x="458" y="103" width="151" height="99" rx="16" fill="#fffdf8"/>
    <path d="M569 103 L609 143 L569 143 Z" fill="#f2e8d4"/>
    <path d="M569 103 L569 143 L609 143" fill="none" stroke="#dbc9a9" stroke-width="1.5"/>
    <rect x="475" y="124" width="72" height="8" rx="4" fill="#e49760"/>
    <rect x="475" y="141" width="111" height="6" rx="3" fill="#c6d1d4"/>
    <rect x="475" y="153" width="93" height="6" rx="3" fill="#c6d1d4"/>
    <rect x="475" y="165" width="104" height="6" rx="3" fill="#c6d1d4"/>
    <text x="533" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#70533a">Sayfa</text>
  </g>
  <text x="533" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54728a">Uygulanabilir bilgi</text>

  <!-- network overlays -->
  <path d="M371 245 C401 284 472 281 510 224" fill="none" stroke="#9b83ca" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="510,224 503,227 509,232" fill="#9b83ca"/>
  <path d="M230 126 C247 275 432 294 523 228" fill="none" stroke="#e39a5e" stroke-width="1.7" stroke-dasharray="4 5" opacity="0.9"/>
  <polygon points="523,228 516,230 521,236" fill="#e39a5e"/>

  <!-- bottom legend -->
  <g filter="url(#soft)">
    <rect x="74" y="264" width="493" height="35" rx="17" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="99" cy="281" r="7" fill="#79b895"/>
  <text x="113" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496477">Hiyerarşi</text>
  <path d="M201 281 L224 281" stroke="#9b83ca" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="234" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496477">Çapraz bağlantı</text>
  <circle cx="376" cy="281" r="7" fill="#e49a61"/>
  <text x="390" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496477">Etiket ve arama</text>
</svg>