<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9ddf5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6b8497" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#778c9d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="318" cy="161" r="122" fill="#d9eddf" opacity="0.3"/>
  <circle cx="318" cy="161" r="86" fill="#ffffff" opacity="0.38"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526575" font-weight="600">Nihai tutarlılık</text>
  <text x="612" y="30" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718391">Kısa süreli ayrışma → yakınsama</text>

  <!-- left source -->
  <g filter="url(#shadow)">
    <rect x="38" y="119" width="126" height="84" rx="18" fill="#ffffff"/>
    <rect x="49" y="131" width="104" height="28" rx="10" fill="#d9ebff"/>
    <text x="101" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#34536b" font-weight="600">Yazma isteği</text>
    <text x="101" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#627888">değer: 42</text>
  </g>

  <!-- incoming arrow -->
  <path d="M164 161 L208 161" stroke="#6e98b2" stroke-width="2.5" fill="none"/>
  <polygon points="208,161 198,155 198,167" fill="#6e98b2"/>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="211" y="111" width="215" height="100" rx="23" fill="url(#core)"/>
    <circle cx="247" cy="161" r="20" fill="#ffffff" opacity="0.82"/>
    <path d="M238 162 C241 151 255 151 257 160 C258 168 252 174 247 178 C241 174 236 169 238 162Z" fill="#6a91b1"/>
    <text x="329" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#294c65" font-weight="700">Çoğaltma katmanı</text>
    <text x="329" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557087">W ve R ayarı</text>
    <text x="329" y="192" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557087">N kopya</text>
  </g>

  <!-- replication lines -->
  <path d="M426 143 L466 92" stroke="#7c9caf" stroke-width="2.3" fill="none"/>
  <polygon points="466,92 456,96 463,103" fill="#7c9caf"/>
  <path d="M426 161 L466 161" stroke="#7c9caf" stroke-width="2.3" fill="none"/>
  <polygon points="466,161 456,155 456,167" fill="#7c9caf"/>
  <path d="M426 180 L466 230" stroke="#7c9caf" stroke-width="2.3" fill="none"/>
  <polygon points="466,230 458,220 451,226" fill="#7c9caf"/>

  <!-- replicas -->
  <g filter="url(#soft)">
    <rect x="470" y="57" width="132" height="65" rx="15" fill="#fff9e9"/>
    <circle cx="493" cy="81" r="10" fill="#f2c96b"/>
    <path d="M489 81 L492 84 L498 77" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="544" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66552e" font-weight="600">Kopya A</text>
    <text x="544" y="103" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#887747">eski değer: 39</text>
  </g>

  <g filter="url(#soft)">
    <rect x="470" y="129" width="132" height="65" rx="15" fill="#e4f4ec"/>
    <circle cx="493" cy="153" r="10" fill="#70bb91"/>
    <path d="M489 153 L492 156 L498 149" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="544" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356a4d" font-weight="600">Kopya B</text>
    <text x="544" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#57816a">değer: 42</text>
  </g>

  <g filter="url(#soft)">
    <rect x="470" y="201" width="132" height="65" rx="15" fill="#f8e8ee"/>
    <circle cx="493" cy="225" r="10" fill="#d78ba7"/>
    <path d="M489 225 L492 228 L498 221" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="544" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#70455a" font-weight="600">Kopya C</text>
    <text x="544" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#956579">eski değer: 40</text>
  </g>

  <!-- repair convergence -->
  <path d="M536 122 L536 128" stroke="#83a895" stroke-width="1.7" stroke-dasharray="3 3"/>
  <path d="M536 194 L536 200" stroke="#83a895" stroke-width="1.7" stroke-dasharray="3 3"/>
  <path d="M614 94 C629 112 629 209 614 228" stroke="#87ad98" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <polygon points="614,228 610,217 621,220" fill="#87ad98"/>

  <!-- footer chips -->
  <g filter="url(#soft)">
    <rect x="43" y="250" width="150" height="38" rx="14" fill="#ffffff"/>
    <circle cx="61" cy="269" r="7" fill="#e9aa78"/>
    <text x="122" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617582">Bölünmede: hizmet sürer</text>
  </g>
  <g filter="url(#soft)">
    <rect x="212" y="250" width="158" height="38" rx="14" fill="#ffffff"/>
    <circle cx="230" cy="269" r="7" fill="#89b4d7"/>
    <text x="298" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617582">Geçici eski okuma</text>
  </g>
  <g filter="url(#soft)">
    <rect x="389" y="250" width="170" height="38" rx="14" fill="#ffffff"/>
    <circle cx="407" cy="269" r="7" fill="#79b68d"/>
    <text x="484" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617582">Onarım: tümü 42</text>
  </g>
</svg>