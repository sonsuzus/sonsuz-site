<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe4ff"/>
      <stop offset="100%" stop-color="#b9d6f5"/>
    </linearGradient>
    <linearGradient id="modern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7f1dc"/>
      <stop offset="100%" stop-color="#bde3c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
