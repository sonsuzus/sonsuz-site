<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#ccebdc"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1c9"/>
      <stop offset="100%" stop-color="#ffd6c3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#54738a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#54738a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="#ffffff" opacity="0.38"/>
  <circle cx="320" cy="160" r="88" fill="none" stroke="#b8d7d1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.65"/>

  <!-- Bağlantılar -->
  <path d="M164 78 C203 88 218 108 244 126" fill="none" stroke="#86a9bc" stroke-width="2.5"/>
  <polygon points="244,126 234,123 238,133" fill="#86a9bc"/>
  <path d="M164 159 C193 159 211 159 239 159" fill="none" stroke="#86a9bc" stroke-width="2.5"/>
  <polygon points="241,159 231,154 231,164" fill="#86a9bc"/>
  <path d="M164 242 C204 231 220 211 245 193" fill="none" stroke="#86a9bc" stroke-width="2.5"/>
  <polygon points="245,193 234,195 240,203" fill="#86a9bc"/>

  <path d="M397 160 C423 160 438 160 461 160" fill="none" stroke="#759ca1" stroke-width="3"/>
  <polygon points="463,160 452,154 452,166" fill="#759ca1"/>
  <path d="M535 197 C535 215 535 227 535 242" fill="none" stroke="#d28d6f" stroke-width="2.5"/>
  <polygon points="535,244 530,233 540,233" fill="#d28d6f"/>

  <!-- Sol girişler -->
  <g filter="url(#soft)">
    <rect x="30" y="46" width="134" height="63" rx="16" fill="#e1f0ff"/>
    <circle cx="57" cy="76" r="15" fill="#87c7ed"/>
    <path d="M57 62 L57 76 L66 81" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="83" y="72" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31566d" font-weight="600">Sıcaklık</text>
    <text x="83" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587487">Derece-gün</text>
  </g>

  <g filter="url(#soft)">
    <rect x="30" y="128" width="134" height="63" rx="16" fill="#ddf4ed"/>
    <circle cx="57" cy="159" r="15" fill="#7bcbb1"/>
    <path d="M57 146 C51 154 48 158 48 163 A9 9 0 0 0 66 163 C66 158 63 154 57 146Z" fill="#ffffff"/>
    <text x="83" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315f59" font-weight="600">Bağıl nem</text>
    <text x="83" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557b73">Uygunluk</text>
  </g>

  <g filter="url(#soft)">
    <rect x="30" y="210" width="134" height="63" rx="16" fill="#eee6ff"/>
    <circle cx="57" cy="241" r="15" fill="#b39be5"/>
    <path d="M48 246 C53 236 57 234 63 237 M51 250 C58 244 63 245 67 250" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
    <text x="83" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#514474" font-weight="600">Saha verisi</text>
    <text x="83" y="254" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#746a91">Tuzak ve kayıt</text>
  </g>

  <!-- Merkezi model -->
  <g filter="url(#shadow)">
    <rect x="242" y="106" width="156" height="108" rx="25" fill="url(#core)" stroke="#b2d3d1" stroke-width="1.2"/>
    <circle cx="320" cy="136" r="21" fill="#ffffff" opacity="0.86"/>
    <path d="M309 140 C314 129 320 145 325 134 C329 125 334 133 338 128" fill="none" stroke="#4f8a88" stroke-width="2.5" stroke-linecap="round"/>
    <text x="320" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315e63" font-weight="700">Hibrit Model</text>
    <text x="320" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53747b">Büyüme ve kapasite</text>
  </g>

  <!-- Risk -->
  <g filter="url(#shadow)">
    <rect x="462" y="115" width="146" height="83" rx="19" fill="url(#risk)" stroke="#edc2a2" stroke-width="1.2"/>
    <circle cx="492" cy="146" r="17" fill="#ffffff" opacity="0.83"/>
    <path d="M492 134 L505 158 L479 158 Z" fill="#ed9b65"/>
    <rect x="490.5" y="142" width="3" height="8" rx="1.5" fill="#ffffff"/>
    <circle cx="492" cy="153.5" r="1.6" fill="#ffffff"/>
    <text x="519" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#804e38" font-weight="700">İstila riski</text>
    <text x="519" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a6a50">Düşük · Orta · Yüksek</text>
  </g>

  <!-- Erken uyarı -->
  <g filter="url(#soft)">
    <rect x="447" y="244" width="176" height="49" rx="15" fill="#fffdf6" stroke="#edd9a1" stroke-width="1.2"/>
    <circle cx="475" cy="268.5" r="13" fill="#f4c96c"/>
    <path d="M469 270 L473 274 L481 264" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="497" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d27" font-weight="700">Erken uyarı</text>
    <text x="497" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d7a4c">Saha gözlemi</text>
  </g>

  <!-- Alt doğrulama şeridi -->
  <g opacity="0.9">
    <path d="M202 285 L424 285" stroke="#a9c5c0" stroke-width="1.5"/>
    <circle cx="218" cy="285" r="4" fill="#80b9ac"/>
    <circle cx="320" cy="285" r="4" fill="#80b9ac"/>
    <circle cx="420" cy="285" r="4" fill="#80b9ac"/>
    <text x="320" y="307" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66827e">Kalibrasyon · Doğrulama · İzleme</text>
  </g>
</svg>