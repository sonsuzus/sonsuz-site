<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Veri Odaklı Tasarım</text>

  <!-- Merkez struct kutusu -->
  <rect x="245" y="55" width="150" height="55" rx="10" fill="#e8f4f8" stroke="#5b9bd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Struct</text>
  <text x="320" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#34495e">Veri Paketi</text>

  <!-- Sol üst: Alanlar -->
  <rect x="40" y="50" width="130" height="70" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="105" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e8449">Alanlar</text>
  <text x="105" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Current, Maximum</text>
  <text x="105" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Health, Armor</text>

  <!-- Sol alt: Değer Tipi -->
  <rect x="40" y="145" width="130" height="55" rx="10" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="105" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#a04000">Değer Tipi</text>
  <text x="105" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Kopyalanabilir</text>

  <!-- Sağ üst: Veri Odaklı -->
  <rect x="470" y="50" width="130" height="70" rx="10" fill="#ebdef0" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="535" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6c3483">Veri Odaklı</text>
  <text x="535" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Ardışık Diziler</text>
  <text x="535" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Cache Dostu</text>

  <!-- Sağ alt: Performans -->
  <rect x="470" y="145" width="130" height="55" rx="10" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="535" y="168" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#922b21">Performans</text>
  <text x="535" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Düşük Gecikme</text>

  <!-- Alt merkez: Kullanım Alanları -->
  <rect x="220" y="240" width="200" height="55" rx="10" fill="#d6eaf8" stroke="#2980b9" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Kullanım Alanları</text>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Oyun Bileşenleri, 2D Nokta</text>

  <!-- Oklar - manuel çizim -->
  <!-- Merkezden sol üste -->
  <path d="M245,80 L175,80" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="175,74 185,80 175,86" fill="#27ae60"/>

  <!-- Merkezden sol alta -->
  <path d="M245,95 L175,165" stroke="#e67e22" stroke-width="2" fill="none"/>
  <polygon points="177,158 187,163 178,170" fill="#e67e22"/>

  <!-- Merkezden sağ üste -->
  <path d="M395,80 L465,80" stroke="#8e44ad" stroke-width="2" fill="none"/>
  <polygon points="465,74 455,80 465,86" fill="#8e44ad"/>

  <!-- Merkezden sağ alta -->
  <path d="M395,95 L465,165" stroke="#c0392b" stroke-width="2" fill="none"/>
  <polygon points="458,158 468,163 457,170" fill="#c0392b"/>

  <!-- Merkezden alt merkeze -->
  <path d="M320,110 L320,235" stroke="#2980b9" stroke-width="2" fill="none"/>
  <polygon points="314,235 320,245 326,235" fill="#2980b9"/>

  <!-- Sol üstten sol alta bağlantı -->
  <path d="M105,120 L105,140" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="100,140 105,148 110,140" fill="#7f8c8d"/>

  <!-- Sağ üstten sağ alta bağlantı -->
  <path d="M535,120 L535,140" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="530,140 535,148 540,140" fill="#7f8c8d"/>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7f8c8d">Struct: Veriyi kahraman yapmak</text>
</svg>