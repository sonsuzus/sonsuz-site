<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d8f4e5"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7290a3" flood-opacity="0.20"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7290a3" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="83" cy="50" r="74" fill="#dceeff" opacity="0.48"/>
  <circle cx="582" cy="279" r="90" fill="#dff3df" opacity="0.48"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40566a">AKTİVASYON FONKSİYONLARI</text>

  <!-- input -->
  <g filter="url(#hafifGolge)">
    <rect x="22" y="120" width="113" height="82" rx="17" fill="#ffffff" stroke="#d6e3ec"/>
  </g>
  <text x="78" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43586a">Girdiler</text>
  <circle cx="49" cy="169" r="8" fill="#a8d4f4"/>
  <circle cx="78" cy="169" r="8" fill="#b8e4c6"/>
  <circle cx="107" cy="169" r="8" fill="#f7d49a"/>
  <text x="49" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607585">x₁</text>
  <text x="78" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607585">x₂</text>
  <text x="107" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607585">xₙ</text>

  <!-- arrow input -->
  <path d="M136 161 L170 161" stroke="#8da7b7" stroke-width="2.5" fill="none"/>
  <polygon points="170,161 162,156 162,166" fill="#8da7b7"/>

  <!-- center neuron -->
  <g filter="url(#golge)">
    <rect x="174" y="108" width="132" height="106" rx="22" fill="url(#merkez)" stroke="#c5dce2"/>
  </g>
  <circle cx="240" cy="143" r="20" fill="#ffffff" opacity="0.88"/>
  <path d="M228 145 L236 152 L252 133" fill="none" stroke="#50a47b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385466">Ağırlıklı Toplam</text>
  <text x="240" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607585">z = Σwx + b</text>

  <!-- branching -->
  <path d="M307 161 L330 161 L330 77 L351 77" stroke="#8da7b7" stroke-width="2.3" fill="none" stroke-linejoin="round"/>
  <polygon points="351,77 343,72 343,82" fill="#8da7b7"/>
  <path d="M307 161 L351 161" stroke="#8da7b7" stroke-width="2.3" fill="none"/>
  <polygon points="351,161 343,156 343,166" fill="#8da7b7"/>
  <path d="M307 161 L330 161 L330 245 L351 245" stroke="#8da7b7" stroke-width="2.3" fill="none" stroke-linejoin="round"/>
  <polygon points="351,245 343,240 343,250" fill="#8da7b7"/>

  <!-- sigmoid -->
  <g filter="url(#hafifGolge)">
    <rect x="355" y="42" width="171" height="70" rx="16" fill="#fff7e9" stroke="#f0d9ac"/>
  </g>
  <text x="373" y="65" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8b6330">Sigmoid</text>
  <text x="373" y="84" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8c7654">0 ile 1</text>
  <path d="M451 91 C461 91 463 89 468 84 C474 78 478 68 485 64 C492 60 500 60 512 60" fill="none" stroke="#dc9e47" stroke-width="3" stroke-linecap="round"/>
  <path d="M451 94 L451 53 M451 87 L515 87" stroke="#d8c9ac" stroke-width="1"/>

  <!-- relu -->
  <g filter="url(#hafifGolge)">
    <rect x="355" y="126" width="171" height="70" rx="16" fill="#edf8f1" stroke="#c4e3cf"/>
  </g>
  <text x="373" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397557">ReLU</text>
  <text x="373" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f806d">Hızlı geçiş</text>
  <path d="M451 177 L476 177 L508 143" fill="none" stroke="#54ae79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M451 181 L451 139 M451 177 L515 177" stroke="#c2dcca" stroke-width="1"/>

  <!-- tanh -->
  <g filter="url(#hafifGolge)">
    <rect x="355" y="210" width="171" height="70" rx="16" fill="#f3efff" stroke="#d9ceef"/>
  </g>
  <text x="373" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#685294">Tanh</text>
  <text x="373" y="252" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c7198">-1 ile 1</text>
  <path d="M451 257 C461 257 465 254 471 247 C478 239 481 232 486 230 C492 228 500 227 512 227" fill="none" stroke="#9277c8" stroke-width="3" stroke-linecap="round"/>
  <path d="M451 263 L451 220 M451 242 L515 242" stroke="#d6cdeb" stroke-width="1"/>

  <!-- output decision -->
  <path d="M527 77 L548 77 L548 161 L560 161" stroke="#8da7b7" stroke-width="2.3" fill="none" stroke-linejoin="round"/>
  <path d="M527 161 L560 161" stroke="#8da7b7" stroke-width="2.3" fill="none"/>
  <path d="M527 245 L548 245 L548 161 L560 161" stroke="#8da7b7" stroke-width="2.3" fill="none" stroke-linejoin="round"/>
  <polygon points="560,161 552,156 552,166" fill="#8da7b7"/>

  <g filter="url(#golge)">
    <rect x="564" y="119" width="61" height="84" rx="17" fill="#ffffff" stroke="#d5e1e8"/>
  </g>
  <circle cx="594" cy="146" r="13" fill="#dceeff"/>
  <path d="M588 146 L592 150 L600 141" fill="none" stroke="#4d89b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="594" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43586a">Karar</text>

  <text x="320" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637987">Doğrusal olmayan dönüşüm • Öğrenme ve gradyan akışı</text>
</svg>