<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe9ff"/>
      <stop offset="100%" stop-color="#d9f2e7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7994a3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="43" r="54" fill="#dff1f4" opacity="0.55"/>
  <circle cx="577" cy="274" r="74" fill="#e5e8ff" opacity="0.5"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#466077">Kısıt Tatmin ve Geri İzleme</text>

  <!-- Input CSP -->
  <g filter="url(#softShadow)">
    <rect x="28" y="78" width="130" height="154" rx="18" fill="#ffffff"/>
    <rect x="28" y="78" width="130" height="31" rx="18" fill="#dcecff"/>
    <rect x="28" y="96" width="130" height="13" fill="#dcecff"/>
  </g>
  <text x="93" y="99" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#42627b">CSP Modeli</text>

  <rect x="43" y="122" width="100" height="26" rx="9" fill="#eef5ff"/>
  <circle cx="57" cy="135" r="5" fill="#89aee9"/>
  <text x="68" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526777">Değişkenler</text>

  <rect x="43" y="157" width="100" height="26" rx="9" fill="#effaf4"/>
  <circle cx="57" cy="170" r="5" fill="#82c7a7"/>
  <text x="68" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526777">Alanlar</text>

  <rect x="43" y="192" width="100" height="26" rx="9" fill="#fff4e8"/>
  <circle cx="57" cy="205" r="5" fill="#e4ae72"/>
  <text x="68" y="209" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526777">Kısıtlar</text>

  <!-- arrow input to center -->
  <path d="M168 155 H210" fill="none" stroke="#7d9db4" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="210,155 201,150 201,160" fill="#7d9db4"/>

  <!-- Core -->
  <g filter="url(#shadow)">
    <rect x="218" y="86" width="198" height="138" rx="25" fill="url(#core)" stroke="#c4dbe2" stroke-width="1.2"/>
  </g>
  <circle cx="317" cy="126" r="25" fill="#ffffff" opacity="0.85"/>
  <path d="M309 119 C315 113 325 116 326 123 C328 132 320 138 312 136" fill="none" stroke="#6289aa" stroke-width="2" stroke-linecap="round"/>
  <polygon points="309,136 314,137 312,131" fill="#6289aa"/>
  <path d="M325 130 C319 136 309 133 308 126" fill="none" stroke="#78ad91" stroke-width="2" stroke-linecap="round"/>
  <polygon points="308,126 307,132 313,130" fill="#78ad91"/>

  <text x="317" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385b70">Backtracking Motoru</text>
  <text x="317" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557080">Dene · Kontrol et · İlerle</text>
  <text x="317" y="208" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557080">Olmazsa geri dön</text>

  <!-- Right branches -->
  <path d="M426 127 H452 V91 H472" fill="none" stroke="#8b9fb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="472,91 463,86 463,96" fill="#8b9fb0"/>
  <path d="M426 184 H452 V223 H472" fill="none" stroke="#8b9fb0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="472,223 463,218 463,228" fill="#8b9fb0"/>

  <!-- Sudoku -->
  <g filter="url(#softShadow)">
    <rect x="480" y="53" width="132" height="78" rx="16" fill="#ffffff"/>
    <rect x="480" y="53" width="132" height="25" rx="16" fill="#ece5ff"/>
    <rect x="480" y="67" width="132" height="11" fill="#ece5ff"/>
  </g>
  <text x="546" y="71" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#62528a">Sudoku Kuralları</text>
  <g fill="none" stroke="#927dc8" stroke-width="1.4">
    <rect x="495" y="88" width="30" height="30" rx="3"/>
    <path d="M505 88 V118 M515 88 V118 M495 98 H525 M495 108 H525"/>
  </g>
  <text x="538" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d6a77">Satır ve sütun</text>
  <text x="538" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d6a77">Bölge</text>

  <!-- Futoshiki -->
  <g filter="url(#softShadow)">
    <rect x="480" y="184" width="132" height="82" rx="16" fill="#ffffff"/>
    <rect x="480" y="184" width="132" height="25" rx="16" fill="#dff4ed"/>
    <rect x="480" y="198" width="132" height="11" fill="#dff4ed"/>
  </g>
  <text x="546" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#437660">Futoshiki Kuralları</text>
  <g fill="none" stroke="#68ab8b" stroke-width="1.4">
    <rect x="495" y="219" width="30" height="30" rx="3"/>
    <path d="M505 219 V249 M515 219 V249 M495 229 H525 M495 239 H525"/>
  </g>
  <text x="538" y="229" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d6a77">Satır ve sütun</text>
  <text x="538" y="246" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d6a77">Eşitsizlik &lt; &gt;</text>

  <!-- bottom intelligence -->
  <path d="M317 234 V254" fill="none" stroke="#849dac" stroke-width="2" stroke-linecap="round"/>
  <polygon points="317,254 312,245 322,245" fill="#849dac"/>

  <g filter="url(#softShadow)">
    <rect x="191" y="262" width="252" height="39" rx="15" fill="#ffffff"/>
  </g>
  <circle cx="216" cy="281.5" r="11" fill="#fff0d8"/>
  <path d="M211 282 H220 M216 277 V286" stroke="#d49a4b" stroke-width="1.8" stroke-linecap="round"/>
  <text x="235" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526b79">Erken budama ve en az aday seçimi</text>
</svg>