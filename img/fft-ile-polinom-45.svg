<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="fftFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#cbe0fa"/>
    </linearGradient>
    <linearGradient id="multFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0c9"/>
      <stop offset="100%" stop-color="#ffe2a1"/>
    </linearGradient>
    <linearGradient id="invFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f2dc"/>
      <stop offset="100%" stop-color="#bde7c6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7990a3" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7990a3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="85" cy="55" r="68" fill="#dcecff" opacity="0.42"/>
  <circle cx="578" cy="276" r="86" fill="#daf0d8" opacity="0.42"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">FFT İLE BÜYÜK SAYI ÇARPIMI</text>
  <text x="320" y="47" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#698094">Evrişim → frekans uzayı → hızlı sonuç</text>

  <path d="M140 127 L166 127" stroke="#7893aa" stroke-width="2.2" fill="none"/>
