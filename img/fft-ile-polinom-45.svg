  <path d="M282 127 L306 127" stroke="#7893aa" stroke-width="2.2" fill="none"/>
  <polygon points="306,127 298,122 298,132" fill="#7893aa"/>

  <path d="M424 127 L450 127" stroke="#7893aa" stroke-width="2.2" fill="none"/>
  <polygon points="450,127 442,122 442,132" fill="#7893aa"/>

  <path d="M528 160 L528 198 L400 198 L400 211" stroke="#7893aa" stroke-width="2.2" fill="none"/>
  <polygon points="400,211 395,203 405,203" fill="#7893aa"/>

  <g filter="url(#shadow)">
    <rect x="34" y="91" width="106" height="72" rx="17" fill="#ffffff"/>
    <rect x="45" y="102" width="84" height="24" rx="9" fill="#f0d9e5"/>
  </g>
  <text x="87" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#754c62">Basamaklar</text>
  <text x="87" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c6678">1234 · 5678</text>

  <g filter="url(#shadow)">
    <rect x="166" y="91" width="116" height="72" rx="17" fill="#ffffff"/>
    <rect x="177" y="102" width="94" height="24" rx="9" fill="#eadff8"/>
  </g>
  <text x="224" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#66527c">Polinomlar</text>
  <text x="224" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c6678">katsayı dizisi</text>

  <g filter="url(#shadow)">
    <rect x="306" y="77" width="118" height="100" rx="20" fill="url(#fftFill)"/>
    <circle cx="365" cy="106" r="16" fill="#ffffff" opacity="0.7"/>
    <path d="M356 106 C360 96 370 96 374 106 C370 116 360 116 356 106 Z" fill="none" stroke="#527da3" stroke-width="1.7"/>
    <path d="M353 106 L377 106 M365 94 L365 118" stroke="#527da3" stroke-width="1.3" opacity="0.75"/>
  </g>
  <text x="365" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315c7f">FFT</text>
  <text x="365" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416b8b">frekans uzayı</text>

  <g filter="url(#shadow)">
