    <path d="M473 120 L487 134 M487 120 L473 134" stroke="#9a6d18" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="544" y="120" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7c5a19">Noktasal çarpım</text>
  <text x="544" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#806d43">değer · değer</text>

  <g filter="url(#smallShadow)">
    <rect x="285" y="211" width="230" height="72" rx="18" fill="url(#invFill)"/>
    <circle cx="322" cy="247" r="18" fill="#ffffff" opacity="0.65"/>
    <path d="M313 247 C316 238 327 235 333 242 M331 252 C328 259 317 260 312 253" fill="none" stroke="#478459" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="334,242 328,241 331,247" fill="#478459"/>
    <polygon points="311,253 317,254 314,248" fill="#478459"/>
  </g>
  <text x="418" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#376d47">Ters FFT ve taşıma</text>
  <text x="418" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f7b5d">sonuç katsayıları</text>

  <g filter="url(#smallShadow)">
    <rect x="35" y="219" width="196" height="48" rx="15" fill="#ffffff"/>
  </g>
  <path d="M55 243 L78 243" stroke="#c1788d" stroke-width="3" stroke-linecap="round"/>
  <path d="M55 252 L94 252" stroke="#c1788d" stroke-width="3" stroke-linecap="round"/>
  <text x="145" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#536d80">Klasik yöntem</text>
  <text x="145" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a6574">O(n²)</text>

  <path d="M231 243 L267 243" stroke="#6b9a78" stroke-width="2.2" fill="none"/>
  <polygon points="267,243 259,238 259,248" fill="#6b9a78"/>

  <text x="550" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7750">O(n log n)</text>
  <text x="550" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#638070">çok büyük girdiler</text>
</svg>