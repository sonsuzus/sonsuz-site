<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7fb3d5"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e6b8"/>
      <stop offset="100%" stop-color="#8fc98f"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="100%" stop-color="#e8b87e"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7bde2"/>
      <stop offset="100%" stop-color="#bb8fce"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b0c8"/>
      <stop offset="100%" stop-color="#e08aa8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Python Temel Veri Yapıları</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="120" width="150" height="48" rx="12" fill="#5d8aa8" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#fff">Python</text>
  <text x="320" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#eaf2f8">Sayılar ve Aritmetik</text>

  <!-- Oklar (manuel) -->
  <!-- Sayılar -->
  <line x1="245" y1="130" x2="120" y2="80" stroke="#7fb3d5" stroke-width="2"/>
  <polygon points="120,80 132,82 126,90" fill="#7fb3d5"/>
  <!-- Dizeler -->
  <line x1="245" y1="144" x2="100" y2="200" stroke="#8fc98f" stroke-width="2"/>
  <polygon points="100,200 112,196 106,208" fill="#8fc98f"/>
  <!-- Listeler -->
  <line x1="395" y1="130" x2="520" y2="80" stroke="#e8b87e" stroke-width="2"/>
  <polygon points="520,80 508,82 514,90" fill="#e8b87e"/>
  <!-- Sözlükler -->
  <line x1="395" y1="144" x2="540" y2="200" stroke="#bb8fce" stroke-width="2"/>
  <polygon points="540,200 528,196 534,208" fill="#bb8fce"/>
  <!-- Çokuzlar -->
  <line x1="320" y1="168" x2="320" y2="240" stroke="#e08aa8" stroke-width="2"/>
  <polygon points="320,240 314,228 326,228" fill="#e08aa8"/>

  <!-- Sayılar -->
  <rect x="30" y="40" width="120" height="56" rx="10" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="90" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Sayılar</text>
  <text x="90" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">int, float, complex</text>

  <!-- Dizeler -->
  <rect x="20" y="180" width="120" height="56" rx="10" fill="url(#g2)" filter="url(#shadow)"/>
  <text x="80" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6b3a">Dizeler</text>
  <text x="80" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6b3a">str, immutable</text>

  <!-- Listeler -->
  <rect x="490" y="40" width="120" height="56" rx="10" fill="url(#g3)" filter="url(#shadow)"/>
  <text x="550" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7e5109">Listeler</text>
  <text x="550" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7e5109">list, mutable</text>

  <!-- Sözlükler -->
  <rect x="500" y="180" width="120" height="56" rx="10" fill="url(#g4)" filter="url(#shadow)"/>
  <text x="560" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5b2c6f">Sözlükler</text>
  <text x="560" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5b2c6f">dict, hash table</text>

  <!-- Çokuzlar -->
  <rect x="260" y="250" width="120" height="48" rx="10" fill="url(#g5)" filter="url(#shadow)"/>
  <text x="320" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7b2d4e">Çokuzlar</text>
  <text x="320" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7b2d4e">tuple, immutable</text>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d" opacity="0.8">Aritmetik: + - * / // % **</text>
</svg>