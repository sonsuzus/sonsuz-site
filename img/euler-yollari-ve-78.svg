<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9e8f5"/>
      <stop offset="100%" stop-color="#b9dded"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7190a0" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#557586" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="42" r="78" fill="#dceff2" opacity="0.55"/>
  <circle cx="590" cy="274" r="95" fill="#e1efcf" opacity="0.52"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#486373">KÖNİGSBERG'DEN GRAF TEORİSİNE</text>

  <!-- City card -->
  <rect x="24" y="52" width="180" height="218" rx="20" fill="#ffffff" opacity="0.88" filter="url(#shadow)"/>
  <text x="48" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#507080">Şehir ve köprüler</text>

  <path d="M32 119 C67 101 87 133 116 119 S167 103 197 122 L197 179 C163 194 145 169 114 184 S65 195 32 174Z" fill="url(#river)" opacity="0.95"/>
  <path d="M39 91 C72 82 95 91 101 119 C80 132 59 130 39 120Z" fill="#b9dca9" filter="url(#soft)"/>
  <path d="M125 89 C158 82 186 91 194 112 L194 133 C169 140 147 134 125 119Z" fill="#c8e3aa" filter="url(#soft)"/>
  <path d="M39 185 C69 170 96 180 104 211 L102 237 C77 243 56 233 39 224Z" fill="#b9dca9" filter="url(#soft)"/>
  <path d="M127 181 C153 165 182 178 195 194 L195 229 C171 240 145 229 126 212Z" fill="#c8e3aa" filter="url(#soft)"/>

  <!-- bridges -->
  <g stroke="#b17961" stroke-width="6" stroke-linecap="round" filter="url(#soft)">
    <path d="M94 113 L130 111"/>
    <path d="M92 121 L129 119"/>
    <path d="M76 129 L75 181"/>
    <path d="M147 130 L147 180"/>
    <path d="M157 135 L163 179"/>
    <path d="M101 183 L129 190"/>
    <path d="M100 192 L128 200"/>
  </g>
  <text x="59" y="255" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53717c">7 köprü</text>

  <!-- Transform arrow -->
  <path d="M218 158 L267 158" fill="none" stroke="#7797a4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="272,158 262,152 262,164" fill="#7797a4"/>
  <rect x="218" y="130" width="55" height="20" rx="10" fill="#e7f1f4"/>
  <text x="228" y="144" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55727d">soyutla</text>

  <!-- Graph card -->
  <rect x="286" y="52" width="180" height="218" rx="20" fill="#ffffff" opacity="0.9" filter="url(#shadow)"/>
  <text x="312" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#507080">Çoklu graf</text>

  <!-- edges -->
  <g fill="none" stroke="#7895b8" stroke-width="3" stroke-linecap="round">
    <path d="M342 118 C365 94 391 96 411 118"/>
    <path d="M344 125 C366 108 388 110 409 125"/>
    <path d="M338 132 C320 151 321 184 339 204"/>
    <path d="M414 132 C430 150 430 184 414 204"/>
    <path d="M350 211 C369 191 389 191 403 211"/>
    <path d="M350 218 C369 204 388 204 403 218"/>
    <path d="M414 207 C438 191 443 229 415 226"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="340" cy="123" r="16" fill="#f6c7be"/>
    <circle cx="412" cy="123" r="16" fill="#f6d99e"/>
    <circle cx="340" cy="214" r="16" fill="#c8def5"/>
    <circle cx="412" cy="214" r="16" fill="#cbe6bd"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#45616d">
    <text x="340" y="127">A</text>
    <text x="412" y="127">B</text>
    <text x="340" y="218">C</text>
    <text x="412" y="218">D</text>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" text-anchor="middle" fill="#637c86">
    <text x="340" y="103">3</text>
    <text x="412" y="103">3</text>
    <text x="320" y="221">3</text>
    <text x="438" y="221">5</text>
  </g>

  <!-- Decision arrow -->
  <path d="M480 158 L515 158" fill="none" stroke="#7797a4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="520,158 510,152 510,164" fill="#7797a4"/>

  <!-- Result card -->
  <rect x="528" y="91" width="92" height="134" rx="20" fill="#fffafa" filter="url(#shadow)"/>
  <circle cx="574" cy="128" r="25" fill="#f5c6c6" opacity="0.75"/>
  <path d="M563 117 L585 139 M585 117 L563 139" stroke="#b95d65" stroke-width="4" stroke-linecap="round"/>
  <text x="574" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#96515a">4 tek düğüm</text>
  <text x="574" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#96515a">Euler yolu yok</text>

  <!-- Bottom rule -->
  <rect x="236" y="282" width="300" height="25" rx="12.5" fill="#e5f0e8"/>
  <text x="386" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e7064">Kural: Tek dereceli düğüm sayısı en fazla 2</text>
</svg>