<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Merkez düğüm -->
  <rect x="245" y="125" width="150" height="50" rx="12" fill="#e8f0fe" stroke="#4a7edb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Linux Masaüstü</text>
  <text x="320" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a7a">Sürekli Gelişim</text>

  <!-- Dış halka elemanları -->
  <!-- Beklenti -->
  <rect x="40" y="40" width="130" height="55" rx="10" fill="#fff3e0" stroke="#e67e22" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="105" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Beklenti</text>
  <text x="105" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a7a">Her Yıl Artan</text>

  <!-- Deneyim -->
  <rect x="470" y="40" width="130" height="55" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="535" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Deneyim</text>
  <text x="535" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a7a">Gerçek İlerleme</text>

  <!-- Pazar Payı -->
  <rect x="40" y="225" width="130" height="55" rx="10" fill="#fce4ec" stroke="#d81b60" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="105" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Pazar Payı</text>
  <text x="105" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a7a">Küçük Ama Artan</text>

  <!-- Geçiş Maliyeti -->
  <rect x="470" y="225" width="130" height="55" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="535" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Geçiş Maliyeti</text>
  <text x="535" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a7a">Kullanıcı Çekincesi</text>

  <!-- Topluluk -->
  <rect x="255" y="15" width="130" height="45" rx="10" fill="#e0f7fa" stroke="#00acc1" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="35" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Topluluk</text>
  <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a7a">Kültürel Slogan</text>

  <!-- Ağ Etkisi -->
  <rect x="255" y="260" width="130" height="45" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2" filter="url(#shadowLight)"/>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Ağ Etkisi</text>
  <text x="320" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5a6a7a">Değer = n²</text>

  <!-- Bağlantılar (oklar) -->
  <!-- Beklenti -> Merkez -->
  <path d="M170 68 L240 125" stroke="#e67e22" stroke-width="1.5" fill="none"/>
  <polygon points="240,125 231,118 233,128" fill="#e67e22"/>

  <!-- Deneyim -> Merkez -->
  <path d="M470 68 L400 125" stroke="#43a047" stroke-width="1.5" fill="none"/>
  <polygon points="400,125 407,118 405,128" fill="#43a047"/>

  <!-- Pazar Payi -> Merkez -->
  <path d="M170 252 L240 195" stroke="#d81b60" stroke-width="1.5" fill="none"/>
  <polygon points="240,195 231,202 233,192" fill="#d81b60"/>

  <!-- Geçiş Maliyeti -> Merkez -->
  <path d="M470 252 L400 195" stroke="#5e35b1" stroke-width="1.5" fill="none"/>
  <polygon points="400,195 407,202 405,192" fill="#5e35b1"/>

  <!-- Topluluk -> Merkez -->
  <path d="M320 60 L320 120" stroke="#00acc1" stroke-width="1.5" fill="none"/>
  <polygon points="320,120 315,112 325,112" fill="#00acc1"/>

  <!-- Ağ Etkisi -> Merkez -->
  <path d="M320 260 L320 180" stroke="#f9a825" stroke-width="1.5" fill="none"/>
  <polygon points="320,180 315,188 325,188" fill="#f9a825"/>

  <!-- Beklenti > Deneyim etiketi -->
  <text x="320" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#e67e22" font-weight="bold">Beklenti &gt; Deneyim</text>

  <!-- Alt bilgi -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#7a8a9a" opacity="0.8">Her yıl biraz daha yaklaşılan uzun bir dönem</text>
</svg>