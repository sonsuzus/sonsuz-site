<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9f4ff"/>
      <stop offset="100%" stop-color="#d9ecfb"/>
    </linearGradient>
    <linearGradient id="panelRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f1"/>
      <stop offset="100%" stop-color="#f9dfe4"/>
