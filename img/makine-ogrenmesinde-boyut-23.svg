    <linearGradient id="panelMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf9f2"/>
      <stop offset="100%" stop-color="#d9f0e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
