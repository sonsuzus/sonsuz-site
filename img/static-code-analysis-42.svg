<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#c8ddfb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#69819d" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#69819d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="89" cy="46" r="72" fill="#dceef6" opacity="0.42"/>
  <circle cx="584" cy="278" r="95" fill="#e1f2d7" opacity="0.42"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36506b">STATİK KOD ANALİZİ</text>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#627b8e">Çalıştırmadan önce görünürlük</text>

  <!-- Kaynak kod -->
  <g filter="url(#shadow)">
    <rect x="31" y="103" width="133" height="139" rx="18" fill="#fffdf9" stroke="#c8d8e5"/>
    <rect x="31" y="103" width="133" height="32" rx="18" fill="#d7eee4"/>
    <path d="M31 121 H164 V135 H31 Z" fill="#d7eee4"/>
    <circle cx="51" cy="119" r="4" fill="#77b99c"/>
    <circle cx="64" cy="119" r="4" fill="#efc775"/>
    <circle cx="77" cy="119" r="4" fill="#e58d8d"/>
    <text x="99" y="123" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6657">Kaynak Kod</text>
    <path d="M51 153 H101" stroke="#7993ad" stroke-width="4" stroke-linecap="round"/>
    <path d="M51 167 H135" stroke="#b0c0d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M51 181 H112" stroke="#7993ad" stroke-width="4" stroke-linecap="round"/>
    <path d="M51 195 H129" stroke="#b0c0d0" stroke-width="4" stroke-linecap="round"/>
    <path d="M51 209 H91" stroke="#7993ad" stroke-width="4" stroke-linecap="round"/>
    <text x="97" y="229" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8295">Çalışmadan incele</text>
  </g>

  <!-- Bağlantı -->
  <path d="M164 172 H205" stroke="#7797b3" stroke-width="2.5" fill="none"/>
  <polygon points="205,172 196,167 196,177" fill="#7797b3"/>

  <!-- Analiz çekirdeği -->
  <g filter="url(#shadow)">
    <rect x="205" y="105" width="170" height="133" rx="26" fill="url(#core)" stroke="#a9c6e6"/>
    <circle cx="290" cy="153" r="31" fill="#f8fcff" stroke="#91b7dc" stroke-width="2"/>
    <path d="M274 141 H290 L299 150 V169 H274 Z" fill="#d6e9fb" stroke="#6390bc" stroke-width="1.5"/>
    <path d="M290 141 V151 H299" fill="none" stroke="#6390bc" stroke-width="1.5"/>
    <path d="M279 156 H294 M279 162 H292" stroke="#6390bc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="303" cy="168" r="9" fill="#ffdf91" stroke="#d5a948" stroke-width="1.5"/>
    <path d="M303 163 V169 M303 173.5 V174" stroke="#8d6721" stroke-width="1.7" stroke-linecap="round"/>
    <text x="290" y="204" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345878">Analiz Motoru</text>
    <text x="290" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58758f">SAST ve kurallar</text>
  </g>

  <!-- Çekirdekten üst dallar -->
  <path d="M375 142 H398 V78 H417" stroke="#809eb8" stroke-width="2" fill="none"/>
  <polygon points="417,78 408,73 408,83" fill="#809eb8"/>
  <path d="M375 160 H417" stroke="#809eb8" stroke-width="2" fill="none"/>
  <polygon points="417,160 408,155 408,165" fill="#809eb8"/>
  <path d="M375 186 H398 V243 H417" stroke="#809eb8" stroke-width="2" fill="none"/>
  <polygon points="417,243 408,238 408,248" fill="#809eb8"/>

  <!-- İnceleme türleri -->
  <g filter="url(#smallShadow)">
    <rect x="417" y="52" width="117" height="52" rx="14" fill="#fff5dc" stroke="#ead39b"/>
    <circle cx="438" cy="78" r="12" fill="#ffe7aa"/>
    <path d="M433 78 H443 M438 73 V83" stroke="#9d7832" stroke-width="1.7" stroke-linecap="round"/>
    <text x="480" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#755c2e">Sözdizimi</text>
    <text x="480" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d7650">Stil ve tip</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="417" y="134" width="117" height="52" rx="14" fill="#e7f3ff" stroke="#afd0eb"/>
    <circle cx="438" cy="160" r="12" fill="#cce6fb"/>
    <path d="M432 156 L438 151 L444 156 M438 151 V169 M432 164 L438 169 L444 164" fill="none" stroke="#467da8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3a6f97">Kontrol Akışı</text>
    <text x="480" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c83a2">Karmaşıklık</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="417" y="217" width="117" height="52" rx="14" fill="#e5f4e8" stroke="#afd7b8"/>
    <circle cx="438" cy="243" r="12" fill="#ccead1"/>
    <path d="M430 243 H446 M442 239 L446 243 L442 247 M430 238 V248" fill="none" stroke="#43815a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="240" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39754f">Veri Akışı</text>
    <text x="480" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c866b">Kirli veri izi</text>
  </g>

  <!-- Sonuç kolu -->
  <path d="M534 78 H550 V160 H562" stroke="#809eb8" stroke-width="2" fill="none"/>
  <path d="M534 160 H562" stroke="#809eb8" stroke-width="2" fill="none"/>
  <path d="M534 243 H550 V160 H562" stroke="#809eb8" stroke-width="2" fill="none"/>
  <polygon points="562,160 553,155 553,165" fill="#809eb8"/>

  <!-- Bulgular -->
  <g filter="url(#shadow)">
    <rect x="562" y="103" width="57" height="114" rx="18" fill="#fffafa" stroke="#edc3c3"/>
    <path d="M590 122 L607 151 L590 180 L573 151 Z" fill="#ffe0d9" stroke="#dd8476" stroke-width="1.5"/>
    <path d="M590 137 V154 M590 164 V165" stroke="#b8524b" stroke-width="2.3" stroke-linecap="round"/>
    <text x="590" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8b514c">Bulgu</text>
  </g>

  <!-- alt bilgi -->
  <g filter="url(#smallShadow)">
    <rect x="191" y="270" width="258" height="31" rx="14" fill="#ffffff" opacity="0.92" stroke="#d6e3dd"/>
    <circle cx="211" cy="285.5" r="7" fill="#8ac49a"/>
    <path d="M207.5 285.5 L210.5 288.5 L215.5 282.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="326" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486d5a">Erken geri bildirim · CI/CD kalite eşiği</text>
  </g>
</svg>