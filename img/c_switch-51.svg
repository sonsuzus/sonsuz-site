<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C Programlama - Switch Kalıbı</text>

  <!-- Switch ifade kutusu -->
  <rect x="240" y="45" width="160" height="42" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">switch(ifade)</text>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">değer üret</text>

  <!-- Ok: switch -> case1 -->
  <path d="M 280 87 L 120 130" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="120,130 130,124 128,136" fill="#64748b"/>

  <!-- Ok: switch -> case2 -->
  <path d="M 320 87 L 320 130" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="320,130 314,120 326,120" fill="#64748b"/>

  <!-- Ok: switch -> case3 -->
  <path d="M 360 87 L 520 130" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="520,130 510,124 512,136" fill="#64748b"/>

  <!-- Case 1 kutusu -->
  <rect x="45" y="130" width="150" height="52" rx="10" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="120" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">case sabit1</text>
  <text x="120" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">işlem satırı</text>
  <text x="120" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#b91c1c">break</text>

  <!-- Case 2 kutusu -->
  <rect x="245" y="130" width="150" height="52" rx="10" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">case sabit2</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">işlem satırı</text>
  <text x="320" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#b91c1c">break</text>

  <!-- Case 3 kutusu -->
  <rect x="445" y="130" width="150" height="52" rx="10" fill="url(#boxGrad4)" filter="url(#shadowLight)" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="520" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">case sabit3</text>
  <text x="520" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">işlem satırı</text>
  <text x="520" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#b91c1c">break</text>

  <!-- Ok: case1 -> default -->
  <path d="M 120 182 L 120 220 L 300 220" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="300,220 290,214 290,226" fill="#64748b"/>

  <!-- Ok: case2 -> default -->
  <path d="M 320 182 L 320 220" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="320,220 314,210 326,210" fill="#64748b"/>

  <!-- Ok: case3 -> default -->
  <path d="M 520 182 L 520 220 L 340 220" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="340,220 350,214 350,226" fill="#64748b"/>

  <!-- Default kutusu -->
  <rect x="245" y="220" width="150" height="42" rx="10" fill="url(#boxGrad5)" filter="url(#shadowLight)" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="320" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">default</text>
  <text x="320" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">işlem satırı</text>

  <!-- Ok: default -> çıkış -->
  <path d="M 320 262 L 320 290" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="320,290 314,280 326,280" fill="#64748b"/>

  <!-- Çıkış kutusu -->
  <rect x="270" y="290" width="100" height="24" rx="8" fill="url(#boxGrad6)" filter="url(#shadowLight)" stroke="#fda4af" stroke-width="1.5"/>
  <text x="320" y="306" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#881337">çıkış</text>

  <!-- Karşılaştırma notu -->
  <rect x="15" y="45" width="190" height="42" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadowLight)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="110" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">ifade değeri</text>
  <text x="110" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">sabitlerle karşılaştırılır</text>

  <!-- Hızlı not -->
  <rect x="460" y="45" width="165" height="42" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadowLight)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="542" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">if-else-if yerine</text>
  <text x="542" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">daha hızlı ve pratik</text>
</svg>