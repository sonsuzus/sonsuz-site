  </g>
  <text x="320" y="130" text-anchor="middle" fill="#486879" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">KÜME</text>
  <g fill="#72aaca">
    <circle cx="280" cy="153" r="8"/>
    <circle cx="306" cy="153" r="8"/>
    <circle cx="332" cy="153" r="8"/>
    <circle cx="358" cy="153" r="8"/>
  </g>
  <text x="280" y="157" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">a</text>
  <text x="306" y="157" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">b</text>
  <text x="332" y="157" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">c</text>
  <text x="358" y="157" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">d</text>
  <text x="320" y="183" text-anchor="middle" fill="#587586" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Tam k seçim</text>

  <!-- Alt yöntem -->
  <g filter="url(#soft)">
    <rect x="237" y="247" width="166" height="55" rx="17" fill="#eaf7f2" stroke="#c4e2d4"/>
  </g>
  <rect x="252" y="260" width="30" height="29" rx="9" fill="#72bda4"/>
  <text x="267" y="280" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">01</text>
  <text x="293" y="271" fill="#596778" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Bit maskesi</text>
  <text x="293" y="289" fill="#66887d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">1 sayısını denetle</text>

  <!-- Doğrulama şeridi -->
  <g filter="url(#soft)">
    <rect x="42" y="260" width="157" height="42" rx="15" fill="#ffffff" stroke="#d7e5e8"/>
  </g>
  <circle cx="62" cy="281" r="11" fill="#80c5ae"/>
  <path d="M57 281 L61 285 L68 277" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="278" fill="#596778" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Doğrulama</text>
  <text x="80" y="293" fill="#718493" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Tekrarsız sonuçlar</text>

  <g filter="url(#soft)">
    <rect x="441" y="260" width="157" height="42" rx="15" fill="#ffffff" stroke="#d7e5e8"/>
  </g>
  <text x="519" y="278" text-anchor="middle" fill="#596778" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Beklenen sayı</text>
  <text x="519" y="294" text-anchor="middle" fill="#5486a2" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">{n seç k}</text>

  <path d="M199 281 H229" fill="none" stroke="#a8bdc7" stroke-width="1.7"/>
  <polygon points="229,281 221,277 221,285" fill="#a8bdc7"/>
  <path d="M411 281 H441" fill="none" stroke="#a8bdc7" stroke-width="1.7"/>
  <polygon points="441,281 433,277 433,285" fill="#a8bdc7"/>
</svg>