  <path d="M383 137 C418 120, 441 108, 468 98" fill="none" stroke="#8daabd" stroke-width="2"/>
  <polygon points="468,98 459,96 463,104" fill="#8daabd"/>
  <path d="M320 198 C320 219, 320 229, 320 246" fill="none" stroke="#8daabd" stroke-width="2"/>
  <polygon points="320,246 315,237 325,237" fill="#8daabd"/>

  <!-- Sol yöntem -->
  <g filter="url(#soft)">
    <rect x="42" y="61" width="157" height="78" rx="17" fill="#fff7e9" stroke="#f0d5a4"/>
  </g>
  <rect x="57" y="76" width="29" height="29" rx="9" fill="#f6c96f"/>
  <path d="M65 84 L72 80 L78 84 L78 94 L72 98 L65 94 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="96" y="86" fill="#596778" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Geri izleme</text>
  <text x="96" y="105" fill="#768493" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Seç • geri dön • buda</text>
  <path d="M61 119 H178" stroke="#ead9b9" stroke-width="1"/>
  <text x="61" y="132" fill="#9a7b40" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Esnek kurallar</text>

  <!-- Sağ yöntem -->
  <g filter="url(#soft)">
    <rect x="441" y="61" width="157" height="78" rx="17" fill="#f0edff" stroke="#d7cef4"/>
  </g>
  <rect x="456" y="76" width="29" height="29" rx="9" fill="#a99ae5"/>
  <path d="M464 91 H477 M474 86 L479 91 L474 96" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="495" y="86" fill="#596778" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">İndeks ilerletme</text>
  <text x="495" y="105" fill="#768493" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Sıralı • tembel üretim</text>
