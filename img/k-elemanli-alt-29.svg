<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#d8f3e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7990a8" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6d8298" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="154" r="108" fill="#d8eafa" opacity="0.34"/>
  <circle cx="320" cy="154" r="77" fill="none" stroke="#b8d8d2" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.8"/>

  <text x="28" y="31" fill="#587085" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">K-elemanlı alt küme üretimi</text>
  <line x1="28" y1="39" x2="612" y2="39" stroke="#c9d9e1" stroke-width="1"/>

  <!-- Bağlantılar -->
  <path d="M258 136 C224 120, 201 109, 175 98" fill="none" stroke="#8daabd" stroke-width="2"/>
