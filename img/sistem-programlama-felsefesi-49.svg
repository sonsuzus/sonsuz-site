<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#37474f">Sistem Programlama Felsefesi</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="55" width="150" height="44" rx="22" fill="url(#centerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fff">Sistem Programlama</text>

  <!-- C kutusu (sol) -->
  <rect x="40" y="130" width="160" height="90" rx="12" fill="url(#cGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="120" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#fff">C</text>
  <line x1="60" y1="168" x2="180" y2="168" stroke="#ffffff40" stroke-width="1"/>
  <text x="120" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e3f2fd">Doğrudanlık</text>
  <text x="120" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e3f2fd">Kontrol</text>
  <text x="120" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e3f2fd">Düşük maliyet</text>

  <!-- C++ kutusu (sağ) -->
  <rect x="440" y="130" width="160" height="90" rx="12" fill="url(#cppGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="520" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#fff">C++</text>
  <line x1="460" y1="168" x2="580" y2="168" stroke="#ffffff40" stroke-width="1"/>
  <text x="520" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f5e9">Soyutlama</text>
  <text x="520" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f5e9">RAII</text>
  <text x="520" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f5e9">Sıfır maliyet</text>

  <!-- Merkezden C'ye ok -->
  <path d="M 245 78 L 210 78 L 210 155 L 200 155" stroke="#0288d1" stroke-width="2.5" fill="none"/>
  <polygon points="195,155 205,149 205,161" fill="#0288d1"/>

  <!-- Merkezden C++'a ok -->
  <path d="M 395 78 L 430 78 L 430 155 L 440 155" stroke="#2e7d32" stroke-width="2.5" fill="none"/>
  <polygon points="445,155 435,149 435,161" fill="#2e7d32"/>

  <!-- Formül kutusu -->
  <rect x="155" y="240" width="330" height="38" rx="10" fill="url(#formulaGrad)" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="320" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#f3e5f5" font-weight="bold">T = Hesaplama + Bellek + Senkronizasyon + Soyutlama</text>

  <!-- Alt etiketler -->
  <text x="120" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64" opacity="0.8">elle yönetim</text>
  <text x="520" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#455a64" opacity="0.8">dile devredilen</text>

  <!-- C alt özellikleri -->
  <rect x="55" y="270" width="130" height="24" rx="6" fill="#e3f2fd" filter="url(#shadowLight)" opacity="0.7"/>
  <text x="120" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1565c0">malloc/free disiplini</text>

  <!-- C++ alt özellikleri -->
  <rect x="455" y="270" width="130" height="24" rx="6" fill="#e8f5e9" filter="url(#shadowLight)" opacity="0.7"/>
  <text x="520" y="286" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2e7d32">Akıllı işaretçiler</text>

  <!-- Karar rehberi ipucu -->
  <rect x="20" y="55" width="90" height="28" rx="14" fill="#fff9c4" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="65" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#f57f17">Çekirdek, sürücü</text>

  <rect x="530" y="55" width="90" height="28" rx="14" fill="#fff9c4" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="575" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#f57f17">Oyun motoru, servis</text>

  <!-- Bağlantı çizgileri -->
  <line x1="110" y1="83" x2="110" y2="130" stroke="#f57f17" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="530" y1="83" x2="530" y2="130" stroke="#f57f17" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Felsefe özeti -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#78909c" font-style="italic">"C her ayrıntıyı ben yönetirim der; C++ tekrar eden hataları dile devreder."</text>
</svg>