<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c9bcf"/>
      <stop offset="100%" stop-color="#5a8bbf"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#8bc6d9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e0c8"/>
      <stop offset="100%" stop-color="#9cd0b0"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b8"/>
      <stop offset="100%" stop-color="#e8b898"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c8f0"/>
      <stop offset="100%" stop-color="#b8a8e0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d0d8"/>
      <stop offset="100%" stop-color="#e0b0c0"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8e8e0"/>
      <stop offset="100%" stop-color="#a8d0c8"/>
    </linearGradient>
    <linearGradient id="box7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8c0"/>
      <stop offset="100%" stop-color="#e0d0a0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#3a5a7a">Python Fonksiyon Alıştırmaları</text>

  <!-- Merkez düğüm -->
  <rect x="240" y="55" width="160" height="44" rx="22" fill="url(#mainGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Fonksiyonlar</text>

  <!-- Bağlantı çizgileri ve oklar (manuel ok uçları) -->
  <!-- 1: En küçük parametre -->
  <path d="M240,72 L170,72" stroke="#6c9bcf" stroke-width="2" fill="none"/>
  <polygon points="175,66 165,72 175,78" fill="#6c9bcf"/>

  <!-- 2: Fibonacci -->
  <path d="M260,95 L210,140" stroke="#6c9bcf" stroke-width="2" fill="none"/>
  <polygon points="215,134 205,140 215,146" fill="#6c9bcf"/>

  <!-- 3: Satranç atı -->
  <path d="M320,99 L320,145" stroke="#6c9bcf" stroke-width="2" fill="none"/>
  <polygon points="314,140 320,150 326,140" fill="#6c9bcf"/>

  <!-- 4: Karekök -->
  <path d="M380,95 L430,140" stroke="#6c9bcf" stroke-width="2" fill="none"/>
  <polygon points="425,134 435,140 425,146" fill="#6c9bcf"/>

  <!-- 5: Machin Pi -->
  <path d="M400,72 L470,72" stroke="#6c9bcf" stroke-width="2" fill="none"/>
  <polygon points="465,66 475,72 465,78" fill="#6c9bcf"/>

  <!-- 6: İkinci derece -->
  <path d="M380,55 L430,20" stroke="#6c9bcf" stroke-width="2" fill="none"/>
  <polygon points="425,25 435,15 425,15" fill="#6c9bcf"/>

  <!-- 7: Mükemmel sayılar -->
  <path d="M260,55 L210,20" stroke="#6c9bcf" stroke-width="2" fill="none"/>
  <polygon points="215,15 205,15 215,25" fill="#6c9bcf"/>

  <!-- Kutular -->
  <!-- 1: En küçük parametre -->
  <rect x="40" y="52" width="130" height="40" rx="10" fill="url(#box1)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="105" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a4a6a">En Küçük Parametre</text>

  <!-- 2: Fibonacci -->
  <rect x="140" y="140" width="130" height="40" rx="10" fill="url(#box2)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="205" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a3a">Fibonacci Sayıları</text>

  <!-- 3: Satranç atı -->
  <rect x="270" y="150" width="100" height="40" rx="10" fill="url(#box3)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a3a2a">Satranç Atı</text>

  <!-- 4: Karekök -->
  <rect x="430" y="140" width="100" height="40" rx="10" fill="url(#box4)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="480" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a2a6a">Karekök</text>

  <!-- 5: Machin Pi -->
  <rect x="470" y="52" width="130" height="40" rx="10" fill="url(#box5)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="535" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a2a4a">Machin ile Pi</text>

  <!-- 6: İkinci derece -->
  <rect x="430" y="5" width="130" height="40" rx="10" fill="url(#box6)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="495" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a5a">2. Derece Kökler</text>

  <!-- 7: Mükemmel sayılar -->
  <rect x="80" y="5" width="130" height="40" rx="10" fill="url(#box7)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="145" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a2a">Mükemmel Sayılar</text>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a8a9a" opacity="0.8">Python Programlamaya Giriş • Fonksiyon Uygulamaları</text>
</svg>