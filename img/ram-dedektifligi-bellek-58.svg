<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9eafd"/>
      <stop offset="100%" stop-color="#c7dbf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890aa" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#67839a" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="80" cy="44" r="58" fill="#dceef0" opacity="0.38"/>
  <circle cx="574" cy="266" r="82" fill="#e7f1d6" opacity="0.46"/>
  <path d="M30 250 C122 220 135 275 216 249 S350 221 426 245 S543 281 619 229" fill="none" stroke="#cde0e5" stroke-width="1.5" opacity="0.6"/>

  <!-- Capture card -->
  <g filter="url(#soft)">
    <rect x="28" y="99" width="126" height="112" rx="18" fill="#fffdf9"/>
    <rect x="39" y="110" width="104" height="26" rx="10" fill="#dff1e9"/>
    <path d="M65 163 h38 M65 176 h51 M65 189 h27" stroke="#79a898" stroke-width="3" stroke-linecap="round"/>
    <rect x="109" y="154" width="20" height="31" rx="4" fill="#a9d5c2"/>
    <path d="M115 154 v-6 M123 154 v-6" stroke="#659a87" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="91" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315c50" font-weight="600">Canlı Yakalama</text>
  <text x="91" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607b75">İmaj ve Özet</text>

  <!-- Arrow 1 -->
  <path d="M158 155 H196" stroke="#6a91ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="204,155 194,149 194,161" fill="#6a91ae"/>

  <!-- Central RAM -->
  <g filter="url(#shadow)">
    <rect x="208" y="65" width="210" height="156" rx="26" fill="url(#ram)"/>
    <rect x="221" y="78" width="184" height="130" rx="19" fill="#eef6ff" opacity="0.7"/>
    <rect x="239" y="101" width="116" height="66" rx="11" fill="#789fc5"/>
    <rect x="247" y="109" width="100" height="50" rx="7" fill="#dceafa"/>
    <path d="M261 123 h72 M261 135 h50 M261 147 h65" stroke="#8da9c6" stroke-width="4" stroke-linecap="round"/>
    <rect x="367" y="110" width="19" height="18" rx="4" fill="#aac9e7"/>
    <rect x="367" y="139" width="19" height="18" rx="4" fill="#aac9e7"/>
    <path d="M249 181 h128" stroke="#7e9dbc" stroke-width="4" stroke-linecap="round"/>
    <path d="M261 181 v10 M282 181 v10 M303 181 v10 M324 181 v10 M345 181 v10 M366 181 v10" stroke="#7e9dbc" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="313" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315879" font-weight="700">RAM İmajı</text>
  <text x="313" y="203" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456984">Uçucu Kanıt</text>

  <!-- Analysis flow -->
  <path d="M423 142 H448" stroke="#6a91ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="456,142 446,136 446,148" fill="#6a91ae"/>

  <!-- Analysis panel -->
  <g filter="url(#soft)">
    <rect x="460" y="49" width="151" height="186" rx="20" fill="#fffefd"/>
    <rect x="473" y="62" width="125" height="28" rx="10" fill="#eee4f7"/>
    <circle cx="487" cy="76" r="6" fill="#a882c2"/>
    <path d="M497 76 h82" stroke="#a882c2" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="535" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#634478" font-weight="700">Volatility 3</text>

  <!-- branches -->
  <path d="M483 112 H496 M483 112 V190 M483 151 H496 M483 190 H496" fill="none" stroke="#b09abe" stroke-width="2"/>
  <circle cx="483" cy="112" r="3.5" fill="#ae91c3"/>
  <circle cx="483" cy="151" r="3.5" fill="#ae91c3"/>
  <circle cx="483" cy="190" r="3.5" fill="#ae91c3"/>

  <rect x="496" y="99" width="91" height="26" rx="8" fill="#edf5fc"/>
  <circle cx="509" cy="112" r="6" fill="#80b2d6"/>
  <text x="548" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456984">Süreçler</text>

  <rect x="496" y="138" width="91" height="26" rx="8" fill="#fff0df"/>
  <path d="M505 151 h11 M510 146 v10" stroke="#d69658" stroke-width="2" stroke-linecap="round"/>
  <text x="550" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#87572b">Enjeksiyon</text>

  <rect x="496" y="177" width="91" height="26" rx="8" fill="#e5f4ec"/>
  <path d="M504 194 C509 185 516 202 521 188" fill="none" stroke="#64a785" stroke-width="2"/>
  <text x="551" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f795d">Ağ İzleri</text>

  <!-- Bottom evidence chain -->
  <g filter="url(#soft)">
    <rect x="114" y="255" width="411" height="47" rx="18" fill="#ffffff" opacity="0.94"/>
  </g>
  <circle cx="145" cy="278" r="13" fill="#d9eee4"/>
  <path d="M139 278 l4 4 8-9" fill="none" stroke="#559777" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="169" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d6755" font-weight="600">Çapraz Bulgular</text>

  <path d="M273 278 H303" stroke="#9eb6c0" stroke-width="2"/>
  <polygon points="310,278 300,272 300,284" fill="#9eb6c0"/>

  <circle cx="332" cy="278" r="13" fill="#fff0d9"/>
  <path d="M326 282 l12-12 M326 270 l12 12" stroke="#c78248" stroke-width="2" stroke-linecap="round"/>
  <text x="354" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765231" font-weight="600">Öncelik Puanı</text>

  <path d="M449 278 H469" stroke="#9eb6c0" stroke-width="2"/>
  <polygon points="476,278 466,272 466,284" fill="#9eb6c0"/>

  <circle cx="496" cy="278" r="13" fill="#e8e1f5"/>
  <path d="M490 278 h12 M496 272 v12" stroke="#8064a2" stroke-width="2" stroke-linecap="round"/>
  <text x="518" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60477b" font-weight="600">Kanıt Zinciri</text>
</svg>