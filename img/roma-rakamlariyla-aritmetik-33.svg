  <text x="494" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58786a">Taşıma kuralı</text>

  <g filter="url(#shadow)">
    <rect x="564" y="96" width="57" height="98" rx="18" fill="url(#resultGrad)"/>
