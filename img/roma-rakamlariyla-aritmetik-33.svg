  <text x="361.5" y="144" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b6880">XXXVVIIII</text>
  <text x="361.5" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587585">Birleştir ve sırala</text>

