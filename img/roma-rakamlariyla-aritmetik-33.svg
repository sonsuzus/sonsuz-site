  <polygon points="202,220 194,216 195,225" fill="#89a6b5"/>
  <path d="M259 224 C288 207 363 207 395 220" fill="none" stroke="#89a6b5" stroke-width="1.8" stroke-dasharray="4 4"/>
  <polygon points="396,220 388,216 389,225" fill="#89a6b5"/>

