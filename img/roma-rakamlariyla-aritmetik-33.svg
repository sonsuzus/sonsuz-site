<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4efff"/>
      <stop offset="1" stop-color="#d8e8fb"/>
    </linearGradient>
    <linearGradient id="processGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f7ea"/>
      <stop offset="1" stop-color="#d3eedb"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3d8"/>
      <stop offset="1" stop-color="#ffe5a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6e8494" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7590a0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="68" cy="54" r="42" fill="#dceefe" opacity="0.48"/>
  <circle cx="589" cy="266" r="67" fill="#dcefdc" opacity="0.42"/>
  <circle cx="418" cy="37" r="23" fill="#fff0cf" opacity="0.52"/>

