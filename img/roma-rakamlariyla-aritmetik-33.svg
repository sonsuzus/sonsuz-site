  <text x="223.5" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58786a">Çıkarma yok</text>
  <text x="223.5" y="189" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58786a">toplamsal biçim</text>

