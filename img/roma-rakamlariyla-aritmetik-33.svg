  <text x="275" y="261" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#417356">+</text>
  <text x="298" y="251" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405f4c">Dağıtma</text>
  <text x="298" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f7f69">Sembol değerleri</text>

