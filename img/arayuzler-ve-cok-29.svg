<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e6ff"/>
      <stop offset="100%" stop-color="#e0ccff"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Davranış Sözleşmesi</text>

  <!-- Merkez Arayüz Kutusu -->
  <rect x="245" y="105" width="150" height="50" rx="12" fill="url(#box2)" filter="url(#shadow)" stroke="#9c27b0" stroke-width="1.5" opacity="0.9"/>
  <text x="320" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">«interface»</text>
  <text x="320" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">Payable</text>

  <!-- Sol Üst: Somut Sınıf 1 -->
  <rect x="45" y="55" width="130" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#1976d2" stroke-width="1.2" opacity="0.9"/>
  <text x="110" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">Employee</text>
  <text x="110" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1565c0">calculatePayment()</text>

  <!-- Sol Alt: Somut Sınıf 2 -->
  <rect x="45" y="220" width="130" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#1976d2" stroke-width="1.2" opacity="0.9"/>
  <text x="110" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">Freelancer</text>
  <text x="110" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1565c0">calculatePayment()</text>

  <!-- Sağ Üst: Tüketen Kod -->
  <rect x="465" y="55" width="140" height="45" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#e65100" stroke-width="1.2" opacity="0.9"/>
  <text x="535" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#bf360c">printPayment()</text>
  <text x="535" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e65100">entity: Payable</text>

  <!-- Sağ Alt: Test Kodu -->
  <rect x="465" y="220" width="140" height="45" rx="10" fill="url(#box6)" filter="url(#shadow)" stroke="#00838f" stroke-width="1.2" opacity="0.9"/>
  <text x="535" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#006064">Test Kodu</text>
  <text x="535" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#00838f">Mock Nesne</text>

  <!-- Alt Orta: İlke Kutusu -->
  <rect x="245" y="250" width="150" height="40" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#2e7d32" stroke-width="1.2" opacity="0.9"/>
  <text x="320" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#1b5e20">Açık/Kapalı Prensibi</text>
  <text x="320" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2e7d32">Yeni türler eklenebilir</text>

  <!-- Oklar: Sınıflardan Arayüze (implement) -->
  <path d="M175,78 L240,120" stroke="#1976d2" stroke-width="1.8" fill="none" stroke-dasharray="6,3"/>
  <polygon points="240,120 231,114 233,124" fill="#1976d2"/>

  <path d="M175,242 L240,140" stroke="#1976d2" stroke-width="1.8" fill="none" stroke-dasharray="6,3"/>
  <polygon points="240,140 231,134 233,144" fill="#1976d2"/>

  <!-- Oklar: Arayüzden Tüketen Koda -->
  <path d="M400,120 L460,80" stroke="#e65100" stroke-width="1.8" fill="none"/>
  <polygon points="460,80 451,76 453,86" fill="#e65100"/>

  <!-- Oklar: Arayüzden Test Koduna -->
  <path d="M400,140 L460,240" stroke="#00838f" stroke-width="1.8" fill="none"/>
  <polygon points="460,240 451,236 453,246" fill="#00838f"/>

  <!-- Oklar: Arayüzden İlkeye -->
  <path d="M320,155 L320,245" stroke="#2e7d32" stroke-width="1.8" fill="none"/>
  <polygon points="320,245 315,237 325,237" fill="#2e7d32"/>

  <!-- Etiketler -->
  <text x="195" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555" transform="rotate(-20,195,68)">uygular</text>
  <text x="195" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555" transform="rotate(20,195,225)">uygular</text>
  <text x="440" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555" transform="rotate(-15,440,92)">çağırır</text>
  <text x="440" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555" transform="rotate(15,440,200)">kullanır</text>

  <!-- Kimlik vs Davranış etiketi -->
  <rect x="45" y="140" width="130" height="35" rx="8" fill="#fff" opacity="0.7" filter="url(#shadow)"/>
  <text x="110" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#888" text-decoration="line-through">Kimlik: Kimsin?</text>
  <text x="110" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#4caf50">Davranış: Ne yaparsın?</text>

  <!-- Sağ alt bilgi -->
  <rect x="465" y="140" width="140" height="35" rx="8" fill="#fff" opacity="0.7" filter="url(#shadow)"/>
  <text x="535" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555">Bağımlılık: Soyuta</text>
  <text x="535" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#555">Somuta değil</text>
</svg>