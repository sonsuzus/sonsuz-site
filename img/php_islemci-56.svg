<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#a0b8d0" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">PHP İşlemciler</text>

  <!-- Merkez kavram -->
  <rect x="250" y="50" width="140" height="44" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">İşlemci</text>

  <!-- Ok: merkezden üçlü gruba -->
  <path d="M 320 94 L 320 118" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="315,116 320,126 325,116" fill="#64748b"/>

  <!-- Üçlü gruplama -->
  <rect x="110" y="128" width="140" height="36" rx="8" fill="url(#box2)" filter="url(#shadow)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="180" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78350f">Tekli (+ +)</text>

  <rect x="250" y="128" width="140" height="36" rx="8" fill="url(#box2)" filter="url(#shadow)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78350f">İkili (+ -)</text>

  <rect x="390" y="128" width="140" height="36" rx="8" fill="url(#box2)" filter="url(#shadow)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="460" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78350f">Üçlü (? :)</text>

  <!-- Oklar aşağı -->
  <path d="M 180 164 L 180 188" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="175,186 180,196 185,186" fill="#64748b"/>

  <path d="M 320 164 L 320 188" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="315,186 320,196 325,186" fill="#64748b"/>

  <path d="M 460 164 L 460 188" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="455,186 460,196 465,186" fill="#64748b"/>

  <!-- Aritmetik işlemciler -->
  <rect x="40" y="198" width="120" height="40" rx="8" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.5"/>
  <text x="100" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#064e3b">+ Toplama</text>

  <rect x="170" y="198" width="120" height="40" rx="8" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.5"/>
  <text x="230" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#064e3b">- Çıkarma</text>

  <rect x="300" y="198" width="120" height="40" rx="8" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.5"/>
  <text x="360" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#064e3b">* Çarpma</text>

  <rect x="430" y="198" width="120" height="40" rx="8" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.5"/>
  <text x="490" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#064e3b">/ Bölme</text>

  <!-- Yüzde kutusu -->
  <rect x="250" y="252" width="140" height="36" rx="8" fill="url(#box4)" filter="url(#shadow)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="320" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#831843">% Kalan</text>

  <!-- Ok yüzdeye -->
  <path d="M 360 238 L 360 248" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="355,246 360,256 365,246" fill="#64748b"/>

  <!-- Alt not -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">İfade: işlemci + değerler</text>
</svg>