<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="anaKart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#66809a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#66809a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="556" cy="54" r="78" fill="#dceef5" opacity="0.48"/>
  <circle cx="72" cy="276" r="95" fill="#e1f1d7" opacity="0.42"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31516c">Asenkron Akış ve Callback</text>

  <!-- Main thread -->
  <rect x="38" y="61" width="153" height="192" rx="18" fill="url(#anaKart)" stroke="#cbdcea" filter="url(#golge)"/>
  <rect x="55" y="77" width="119" height="29" rx="10" fill="#dcecff"/>
  <text x="114.5" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355875">Ana İş Parçacığı</text>

  <rect x="57" y="121" width="115" height="38" rx="10" fill="#fff5d9" stroke="#efd99c" filter="url(#hafifGolge)"/>
  <text x="114.5" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#745c20">Çağrı Yığını</text>

  <rect x="57" y="177" width="115" height="50" rx="10" fill="#e5f4e8" stroke="#b9ddbf"/>
  <circle cx="76" cy="202" r="6" fill="#65af75"/>
  <text x="119" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356c43">Arayüz</text>
  <text x="119" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356c43">çalışmaya devam</text>

  <!-- outgoing arrow -->
  <path d="M192 140 H235" fill="none" stroke="#7092af" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="235,140 226,134 226,146" fill="#7092af"/>
  <text x="213" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7890">devret</text>

  <!-- Web API -->
  <rect x="244" y="74" width="151" height="120" rx="18" fill="#fff" stroke="#d4e0e8" filter="url(#golge)"/>
  <rect x="261" y="90" width="117" height="28" rx="10" fill="#e4f2ed"/>
  <text x="319.5" y="109" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#396c61">Tarayıcı API</text>

  <rect x="263" y="132" width="49" height="42" rx="9" fill="#f1e9ff"/>
  <path d="M287 143 v10 l7 5" fill="none" stroke="#8067a8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="287" cy="153" r="11" fill="none" stroke="#8067a8" stroke-width="1.5"/>
  <text x="287" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665080">Zamanlayıcı</text>

  <rect x="326" y="132" width="50" height="42" rx="9" fill="#e2efff"/>
  <path d="M337 147 h28 M337 154 h20 M337 161 h24" stroke="#4a80b5" stroke-width="2" stroke-linecap="round"/>
  <text x="351" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416f9b">Ağ isteği</text>

  <!-- down arrow to queue -->
  <path d="M320 195 V223" fill="none" stroke="#7092af" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="320,230 314,221 326,221" fill="#7092af"/>

  <!-- Queue -->
  <rect x="244" y="233" width="151" height="54" rx="16" fill="#ffffff" stroke="#d4e0e8" filter="url(#golge)"/>
  <text x="319.5" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b6375">Görev Kuyruğu</text>
  <rect x="264" y="264" width="20" height="10" rx="4" fill="#ffd58a"/>
  <rect x="290" y="264" width="20" height="10" rx="4" fill="#baa4e5"/>
  <rect x="316" y="264" width="20" height="10" rx="4" fill="#82c9a2"/>
  <text x="355" y="274" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668093">callback</text>

  <!-- Event loop -->
  <circle cx="490" cy="160" r="71" fill="#fff" stroke="#cbddea" stroke-width="2" filter="url(#golge)"/>
  <circle cx="490" cy="160" r="45" fill="#eaf5fb"/>
  <path d="M468 150 C477 132 502 130 512 146" fill="none" stroke="#4f91b6" stroke-width="3" stroke-linecap="round"/>
  <polygon points="514,153 507,144 518,143" fill="#4f91b6"/>
  <path d="M512 170 C504 188 479 190 468 174" fill="none" stroke="#64ad82" stroke-width="3" stroke-linecap="round"/>
  <polygon points="466,167 474,176 463,178" fill="#64ad82"/>
  <text x="490" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d78">Olay Döngüsü</text>
  <text x="490" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58758a">yığın boş mu?</text>

  <!-- queue to loop -->
  <path d="M396 258 C427 256 430 214 445 198" fill="none" stroke="#7092af" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="450,192 440,196 448,204" fill="#7092af"/>

  <!-- loop back to stack -->
  <path d="M449 109 C417 64 260 52 182 110" fill="none" stroke="#7092af" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="177,114 184,104 188,114" fill="#7092af"/>
  <rect x="278" y="43" width="109" height="25" rx="10" fill="#f8fbfd" stroke="#d6e3eb"/>
  <text x="332.5" y="60" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557088">yığın boşsa çalıştır</text>

  <!-- callback result -->
  <rect x="538" y="126" width="76" height="68" rx="15" fill="#fff8e7" stroke="#ebdba7" filter="url(#hafifGolge)"/>
  <path d="M558 145 h35 M558 153 h26 M558 161 h31" stroke="#b28a35" stroke-width="2" stroke-linecap="round"/>
  <text x="576" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#806321">Sonuç</text>
  <path d="M563 195 C552 220 528 231 502 231" fill="none" stroke="#7b9ab3" stroke-width="2" stroke-dasharray="4 5"/>
</svg>