<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7e9"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff3e0"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce4ec"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede7f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C Diziler (Arrays)</text>
  <text x="320" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7a9a">Aynı veri türünde değişkenler tek isim altında</text>

  <!-- Ana kavram kutusu: Dizi Bildirimi -->
  <rect x="220" y="70" width="200" height="52" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#b0c4de" stroke-width="1.2"/>
  <text x="320" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Dizi Bildirimi</text>
  <text x="320" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6a8a" font-style="italic">veri-çeşidi dizi-adı [boyut]</text>

  <!-- Ok: bildirimden elemanlara -->
  <path d="M 270 122 L 160 170" stroke="#7fa8c9" stroke-width="1.8" fill="none"/>
  <polygon points="160,170 169,163 163,175" fill="#7fa8c9"/>

  <path d="M 370 122 L 480 170" stroke="#7fa8c9" stroke-width="1.8" fill="none"/>
  <polygon points="480,170 471,163 477,175" fill="#7fa8c9"/>

  <!-- Sol taraf: Tek boyutlu dizi kavramı -->
  <rect x="40" y="175" width="180" height="55" rx="10" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a8d5ba" stroke-width="1.2"/>
  <text x="130" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c5e3a">Tek Boyutlu Dizi</text>
  <text x="130" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a7a5a">Aynı türden değişkenler</text>
  <text x="130" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a7a5a">tek isim altında toplanır</text>

  <!-- Sağ taraf: İndeks ile erişim -->
  <rect x="420" y="175" width="180" height="55" rx="10" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#e6c9a8" stroke-width="1.2"/>
  <text x="510" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5a2a">İndeks ile Erişim</text>
  <text x="510" y="215" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7a4a">dizi[0], dizi[1], ...</text>
  <text x="510" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7a4a">0'dan başlayan sıra</text>

  <!-- Alt kısım: Dizi elemanları görselleştirmesi -->
  <rect x="120" y="255" width="400" height="48" rx="8" fill="#ffffff" filter="url(#shadowLight)" stroke="#c0c8d0" stroke-width="1"/>
  
  <!-- Eleman kutuları -->
  <rect x="130" y="263" width="52" height="32" rx="4" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="156" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1565c0" font-weight="bold">dizi[0]</text>

  <rect x="190" y="263" width="52" height="32" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="216" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2e7d32" font-weight="bold">dizi[1]</text>

  <rect x="250" y="263" width="52" height="32" rx="4" fill="#fff8e1" stroke="#ffe082" stroke-width="1"/>
  <text x="276" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#f57f17" font-weight="bold">dizi[2]</text>

  <rect x="310" y="263" width="52" height="32" rx="4" fill="#fce4ec" stroke="#f48fb1" stroke-width="1"/>
  <text x="336" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#c2185b" font-weight="bold">dizi[3]</text>

  <rect x="370" y="263" width="52" height="32" rx="4" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="396" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a1b9a" font-weight="bold">dizi[4]</text>

  <rect x="430" y="263" width="52" height="32" rx="4" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1"/>
  <text x="456" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#00695c" font-weight="bold">...</text>

  <!-- Alt bilgi -->
  <text x="320" y="312" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a8a9a">Aynı veri türünde değerler tutar • Boyut ihtiyaca göre ayarlanır</text>
</svg>