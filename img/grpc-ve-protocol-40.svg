<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="grpc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#716fe5"/>
      <stop offset="100%" stop-color="#4eabd0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#54718d" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#60758a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="54" r="68" fill="#cfeafb" opacity="0.35"/>
  <circle cx="590" cy="277" r="90" fill="#d7efca" opacity="0.32"/>
  <circle cx="320" cy="158" r="122" fill="#ffffff" opacity="0.38"/>

  <text x="30" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334d64">SERVİSLER ARASI İLETİŞİM</text>
  <text x="30" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71869a">Şemalı ikili veri ve HTTP/2 akışı</text>

  <!-- REST panel -->
  <g filter="url(#shadow)">
    <rect x="28" y="83" width="143" height="173" rx="18" fill="#fff8ef"/>
    <rect x="28" y="83" width="143" height="36" rx="18" fill="#f5b86b"/>
    <rect x="28" y="101" width="143" height="18" fill="#f5b86b"/>
  </g>
  <text x="99.5" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#704619">REST ve JSON</text>

  <g filter="url(#soft)">
    <rect x="44" y="137" width="111" height="41" rx="10" fill="#ffffff"/>
    <rect x="44" y="188" width="111" height="48" rx="10" fill="#ffffff"/>
  </g>
  <text x="57" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#73562c">{ }</text>
  <text x="83" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a5c68">Metin paket</text>
  <text x="57" y="211" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74808b">Ayrıştırma</text>
  <text x="57" y="227" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a7b50">daha fazla yük</text>

  <!-- arrow REST to center -->
  <path d="M171 169 H218" fill="none" stroke="#d39a4d" stroke-width="3" stroke-linecap="round"/>
  <polygon points="218,169 209,163 209,175" fill="#d39a4d"/>

  <!-- Proto central -->
  <g filter="url(#shadow)">
    <rect x="221" y="99" width="177" height="139" rx="24" fill="url(#grpc)"/>
    <rect x="234" y="113" width="151" height="111" rx="17" fill="#ffffff" opacity="0.14"/>
  </g>
  <path d="M276 127 L321 127 L339 145 L339 200 L276 200 Z" fill="#ffffff" opacity="0.96"/>
  <path d="M321 127 L321 145 L339 145" fill="none" stroke="#7791c0" stroke-width="2"/>
  <path d="M288 159 H325 M288 171 H317 M288 183 H310" stroke="#6e78bf" stroke-width="3" stroke-linecap="round"/>
  <text x="360" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">.proto</text>
  <text x="360" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eef5ff">Sözleşme</text>
  <text x="360" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#eef5ff">Kod üretimi</text>

  <!-- central to grpc bus -->
  <path d="M398 169 H432" fill="none" stroke="#6078cf" stroke-width="3" stroke-linecap="round"/>
  <polygon points="432,169 423,163 423,175" fill="#6078cf"/>

  <!-- grpc transport -->
  <g filter="url(#shadow)">
    <rect x="435" y="83" width="176" height="173" rx="18" fill="#eef8ff"/>
    <rect x="435" y="83" width="176" height="36" rx="18" fill="#62afd0"/>
    <rect x="435" y="101" width="176" height="18" fill="#62afd0"/>
  </g>
  <text x="523" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">gRPC ve Protobuf</text>

  <g filter="url(#soft)">
    <rect x="452" y="137" width="142" height="32" rx="10" fill="#ffffff"/>
    <rect x="452" y="180" width="142" height="57" rx="10" fill="#ffffff"/>
  </g>
  <text x="523" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39718e">HTTP/2 · İkili veri</text>

  <!-- stream lines -->
  <path d="M468 197 H558" stroke="#60a8c7" stroke-width="3" stroke-linecap="round"/>
  <polygon points="558,197 550,192 550,202" fill="#60a8c7"/>
  <path d="M558 210 H468" stroke="#836fd0" stroke-width="3" stroke-linecap="round"/>
  <polygon points="468,210 476,205 476,215" fill="#836fd0"/>
  <path d="M468 224 H558" stroke="#72bf8a" stroke-width="3" stroke-linecap="round"/>
  <polygon points="558,224 550,219 550,229" fill="#72bf8a"/>
  <text x="523" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547789">Çift yönlü akış</text>

  <!-- bottom metrics -->
  <g filter="url(#soft)">
    <rect x="113" y="275" width="118" height="27" rx="13.5" fill="#e7f4eb"/>
    <rect x="261" y="275" width="118" height="27" rx="13.5" fill="#e9edff"/>
    <rect x="409" y="275" width="118" height="27" rx="13.5" fill="#e8f5fa"/>
  </g>
  <circle cx="129" cy="288.5" r="5" fill="#60af7b"/>
  <text x="141" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426658">Küçük paket</text>
  <circle cx="277" cy="288.5" r="5" fill="#716fe5"/>
  <text x="289" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55558d">Az CPU</text>
  <circle cx="425" cy="288.5" r="5" fill="#52a5c5"/>
  <text x="437" y="293" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f7183">Düşük gecikme</text>
</svg>