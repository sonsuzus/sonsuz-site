<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="Go ters proxy ve yük dengeleme mimarisi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f1"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff1ff"/>
      <stop offset="100%" stop-color="#c9e4f7"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5f7e8"/>
      <stop offset="100%" stop-color="#cfead7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71889a" flood-opacity=".2"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5f8194" flood-opacity=".16"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#5c98b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#67a77a"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="85" cy="55" r="74" fill="#dceffc" opacity=".42"/>
  <circle cx="579" cy="278" r="104" fill="#dff2dc" opacity=".45"/>

  <text x="32" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416378">Go Ters Proxy · Ağ Geçidi</text>
  <text x="607" y="31" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#68818c">Round Robin</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="34" y="121" width="112" height="94" rx="19" fill="#fff" stroke="#d9e7ee"/>
    <circle cx="90" cy="151" r="16" fill="#d9effb"/>
    <path d="M82 153c2-7 14-7 16 0M86 146a4 4 0 1 0 8 0a4 4 0 0 0-8 0" fill="none" stroke="#5085a2" stroke-width="2" stroke-linecap="round"/>
    <text x="90" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36576a">İstemci</text>
    <text x="90" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8491">HTTP İstek</text>
  </g>

  <!-- Inbound -->
  <path d="M148 168 H203" fill="none" stroke="#5c98b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <rect x="155" y="141" width="42" height="19" rx="9.5" fill="#e1f1fa"/>
  <text x="176" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a7b96">TLS</text>

  <!-- Gateway -->
  <g filter="url(#shadow)">
    <rect x="207" y="80" width="204" height="178" rx="23" fill="url(#gateway)" stroke="#b8d8e9"/>
    <rect x="225" y="99" width="168" height="35" rx="12" fill="#f8fdff" opacity=".9"/>
    <text x="309" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#2e617d">Go Ters Proxy</text>

    <rect x="225" y="147" width="76" height="38" rx="11" fill="#fff" filter="url(#softShadow)"/>
    <path d="M244 166l5 5 10-12" fill="none" stroke="#5c9d72" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="273" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426575">Güvenlik</text>

    <rect x="317" y="147" width="76" height="38" rx="11" fill="#fff" filter="url(#softShadow)"/>
    <path d="M331 171h4v-8h5v8h5v-13h5v13" fill="none" stroke="#5c98b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="365" y="171" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426575">Gözlem</text>

    <rect x="225" y="198" width="168" height="39" rx="12" fill="#fff" filter="url(#softShadow)"/>
    <circle cx="248" cy="217" r="10" fill="#d9f0df"/>
    <path d="M244 217h8M248 213v8" stroke="#58a16e" stroke-width="1.7" stroke-linecap="round"/>
    <text x="319" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426575">Yük Dengeleyici</text>
  </g>

  <!-- Route paths -->
  <path d="M412 216 H438 V98 H465" fill="none" stroke="#67a77a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
  <path d="M412 217 H465" fill="none" stroke="#67a77a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M412 218 H438 V256 H465" fill="none" stroke="#67a77a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>

  <!-- Backends -->
  <g filter="url(#shadow)">
    <rect x="470" y="65" width="136" height="65" rx="16" fill="url(#backend)" stroke="#bfdfc5"/>
    <rect x="484" y="79" width="24" height="24" rx="7" fill="#fff"/>
    <path d="M490 86h12M490 91h12M490 96h7" stroke="#5b9c70" stroke-width="1.6" stroke-linecap="round"/>
    <text x="548" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6d4b">Servis 1</text>
    <text x="548" y="111" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63806a">Sağlıklı</text>

    <rect x="470" y="185" width="136" height="65" rx="16" fill="url(#backend)" stroke="#bfdfc5"/>
    <rect x="484" y="199" width="24" height="24" rx="7" fill="#fff"/>
    <path d="M490 206h12M490 211h12M490 216h7" stroke="#5b9c70" stroke-width="1.6" stroke-linecap="round"/>
    <text x="548" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6d4b">Servis 2</text>
    <text x="548" y="231" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#63806a">Sağlıklı</text>

    <rect x="470" y="253" width="136" height="48" rx="16" fill="url(#backend)" stroke="#bfdfc5"/>
    <rect x="484" y="265" width="21" height="21" rx="6" fill="#fff"/>
    <path d="M489 271h11M489 276h11M489 281h6" stroke="#5b9c70" stroke-width="1.5" stroke-linecap="round"/>
    <text x="554" y="281" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6d4b">Servis 3</text>
  </g>

  <!-- Selection indicator -->
  <g filter="url(#softShadow)">
    <rect x="423" y="139" width="68" height="26" rx="13" fill="#fff"/>
    <text x="457" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557885">1 → 2 → 3</text>
  </g>
</svg>