  <rect x="466" y="66" width="143" height="201" rx="20" fill="#f2f8f3" filter="url(#shadow)"/>
  <text x="537.5" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#476178">HEDEFLER</text>

