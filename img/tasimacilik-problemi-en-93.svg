  <rect x="239" y="91" width="162" height="151" rx="24" fill="url(#core)" filter="url(#shadow)"/>
  <circle cx="320" cy="135" r="29" fill="#ffffff" opacity="0.85"/>
  <path d="M306 135h28M320 121v28" stroke="#5d88a7" stroke-width="2.5" stroke-linecap="round"/>
