  <circle cx="499" cy="242" r="10" fill="#69ad8e"/>
  <path d="M494 244h10M496 240h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="518" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6858">İzmir</text>
  <text x="518" y="254" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587184">Talep 80</text>

  <!-- Footer balance -->
  <rect x="211" y="270" width="218" height="30" rx="15" fill="#ffffff" opacity="0.88" filter="url(#softShadow)"/>
  <circle cx="232" cy="285" r="7" fill="#70ae91"/>
  <path d="M229 285l2 2 4-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b6b64">Arz 250 = Talep 250</text>
