  <text x="518" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587184">Talep 80</text>

  <rect x="481" y="164" width="113" height="39" rx="12" fill="#ffe4d4" filter="url(#softShadow)"/>
