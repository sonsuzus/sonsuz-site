  <rect x="271" y="212" width="98" height="18" rx="9" fill="#fff" opacity="0.75"/>
  <text x="320" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4b8270">En iyi plan</text>

