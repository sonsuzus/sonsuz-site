  <text x="94" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d82">Kapasite 100</text>

  <rect x="47" y="181" width="112" height="55" rx="14" fill="#d8f0e4" filter="url(#softShadow)"/>
  <rect x="58" y="194" width="25" height="24" rx="6" fill="#62aa8c"/>
  <path d="M62 214h18M65 209h12M68 204h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="94" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355f52">Fabrika B</text>
  <text x="94" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d82">Kapasite 150</text>

