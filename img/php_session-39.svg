<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f3f8ef;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d1ecf1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3cd;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffeeba;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4edda;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c3e6cb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8d7da;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f5c6cb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d6d8db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c6c8ca;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="8"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">PHP Oturum Mimarisi</text>

  <!-- Kullanıcı Kutusu -->
  <rect x="40" y="60" width="120" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#b8d4e3" stroke-width="1"/>
  <text x="100" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Kullanıcı</text>
  <text x="100" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Web Tarayıcı</text>

  <!-- Çerez Kutusu -->
  <rect x="40" y="160" width="120" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#d4b106" stroke-width="1"/>
  <text x="100" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Çerez</text>
  <text x="100" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">UID Değeri</text>

  <!-- Sunucu Kutusu -->
  <rect x="260" y="60" width="140" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#8fbf9f" stroke-width="1"/>
  <text x="330" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6f3e">Sunucu</text>
  <text x="330" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">PHP Motoru</text>

  <!-- Oturum Kutusu -->
  <rect x="260" y="160" width="140" height="50" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#d17a7a" stroke-width="1"/>
  <text x="330" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#922b21">Oturum</text>
  <text x="330" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Değişkenler</text>

  <!-- Veritabanı Kutusu -->
  <rect x="480" y="110" width="130" height="50" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#7b8d9e" stroke-width="1"/>
  <text x="545" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Veritabanı</text>
  <text x="545" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Kalıcı Depolama</text>

  <!-- Ok: Kullanıcı -> Sunucu -->
  <line x1="160" y1="85" x2="255" y2="85" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="255,80 268,85 255,90" fill="#2c3e50"/>

  <!-- Ok: Sunucu -> Kullanıcı (Çerez) -->
  <line x1="200" y1="110" x2="200" y2="155" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="195,155 200,168 205,155" fill="#2c3e50"/>

  <!-- Ok: Çerez -> Kullanıcı -->
  <line x1="100" y1="160" x2="100" y2="115" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="95,115 100,102 105,115" fill="#2c3e50"/>

  <!-- Ok: Sunucu -> Oturum -->
  <line x1="330" y1="110" x2="330" y2="155" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="325,155 330,168 335,155" fill="#2c3e50"/>

  <!-- Ok: Oturum -> Veritabanı -->
  <line x1="400" y1="185" x2="475" y2="145" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="475,140 488,142 475,150" fill="#2c3e50"/>

  <!-- Ok: Veritabanı -> Oturum -->
  <line x1="475" y1="130" x2="405" y2="170" stroke="#2c3e50" stroke-width="2"/>
  <polygon points="405,175 400,162 410,168" fill="#2c3e50"/>

  <!-- Etiketler -->
  <text x="195" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276" font-style="italic">İstek</text>
  <text x="195" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d6608" font-style="italic">UID Çerez</text>
  <text x="295" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#922b21" font-style="italic">Kayıt</text>
  <text x="445" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e6f3e" font-style="italic">Senkronizasyon</text>

  <!-- Bilgi Notu -->
  <rect x="40" y="250" width="570" height="50" rx="8" fill="#ffffff" opacity="0.7" stroke="#bdc3c7" stroke-width="1"/>
  <text x="325" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Çerez: Tarayıcıda saklanır</text>
  <text x="325" y="288" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Oturum: Sunucuda saklanır ve UID ile eşleşir</text>
</svg>