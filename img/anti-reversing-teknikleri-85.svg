<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d9"/>
      <stop offset="100%" stop-color="#ffe4aa"/>
    </linearGradient>
    <filter id="golge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#54708a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#54708a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="320" cy="160" r="128" fill="#dceeff" opacity="0.38"/>
  <circle cx="320" cy="160" r="92" fill="#ffffff" opacity="0.45"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536c">ANALİZ ORTAMI DEĞERLENDİRMESİ</text>

  <!-- Bağlantılar -->
  <path d="M184 91 C219 102 239 117 259 132" fill="none" stroke="#8ba6bd" stroke-width="2"/>
  <polygon points="259,132 250,130 254,123" fill="#8ba6bd"/>
  <path d="M184 222 C218 211 238 197 259 184" fill="none" stroke="#8ba6bd" stroke-width="2"/>
  <polygon points="259,184 253,193 249,186" fill="#8ba6bd"/>
  <path d="M381 132 C404 116 426 103 456 91" fill="none" stroke="#8ba6bd" stroke-width="2"/>
  <polygon points="456,91 448,99 445,91" fill="#8ba6bd"/>
  <path d="M381 184 C406 199 427 211 456 222" fill="none" stroke="#8ba6bd" stroke-width="2"/>
  <polygon points="456,222 445,222 448,214" fill="#8ba6bd"/>

  <!-- Sol üst -->
  <g filter="url(#golge)">
    <rect x="42" y="56" width="142" height="72" rx="17" fill="#e5f1ff"/>
    <rect x="56" y="70" width="34" height="34" rx="10" fill="#9fcbf2"/>
    <path d="M65 89 h16 M73 81 v16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="101" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34546d">İzleme İşaretleri</text>
    <text x="101" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567187">Zamanlama ve araç</text>
  </g>

  <!-- Sol alt -->
  <g filter="url(#golge)">
    <rect x="42" y="188" width="142" height="72" rx="17" fill="#e5f7ef"/>
    <rect x="56" y="202" width="34" height="34" rx="10" fill="#9bd9c0"/>
    <rect x="64" y="211" width="18" height="13" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M69 228 h8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="101" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355e52">Ortam İzleri</text>
    <text x="101" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52756b">Donanım ve etkinlik</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#golge)">
    <rect x="258" y="112" width="124" height="96" rx="25" fill="url(#merkez)" stroke="#f0c46e" stroke-width="1.2"/>
    <circle cx="320" cy="143" r="20" fill="#ffffff" opacity="0.85"/>
    <path d="M320 130 v13 l9 6" fill="none" stroke="#d69636" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="320" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#71511d">Risk Puanı</text>
    <text x="320" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#93703a">Birleşik sinyaller</text>
  </g>

  <!-- Sağ üst -->
  <g filter="url(#golge)">
    <rect x="456" y="56" width="142" height="72" rx="17" fill="#f0ebff"/>
    <rect x="470" y="70" width="34" height="34" rx="10" fill="#c4b1ed"/>
    <path d="M479 94 l5-13 5 8 6-8" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="515" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#574977">Analiz Maliyeti</text>
    <text x="515" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71658c">Zaman ve uzmanlık</text>
  </g>

  <!-- Sağ alt -->
  <g filter="url(#golge)">
    <rect x="456" y="188" width="142" height="72" rx="17" fill="#ffecef"/>
    <rect x="470" y="202" width="34" height="34" rx="10" fill="#efaebe"/>
    <path d="M478 218 l5 5 12-13" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="515" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#784857">Savunma Gözlemi</text>
    <text x="515" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#936270">Karşılaştırma ve kayıt</text>
  </g>

  <!-- Alt not -->
  <g filter="url(#hafifGolge)">
    <rect x="182" y="276" width="276" height="27" rx="13.5" fill="#ffffff" opacity="0.88"/>
    <circle cx="201" cy="289.5" r="5" fill="#76b99a"/>
    <text x="214" y="294" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466574">Tek sinyal değil, katmanlı değerlendirme</text>
  </g>
</svg>