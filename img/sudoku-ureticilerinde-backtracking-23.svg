<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#d9f2e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7c96a8" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7c96a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="65" cy="55" r="70" fill="#dceeff" opacity="0.45"/>
  <circle cx="584" cy="280" r="88" fill="#dff3df" opacity="0.42"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">Sudoku Üretim Döngüsü</text>

  <!-- Connector lines -->
  <path d="M179 109 C200 109, 204 118, 221 128" fill="none" stroke="#7da1ad" stroke-width="2"/>
  <polygon points="221,128 213,126 216,119" fill="#7da1ad"/>
  <path d="M421 128 C438 117, 444 109, 462 109" fill="none" stroke="#7da1ad" stroke-width="2"/>
  <polygon points="462,109 454,116 453,107" fill="#7da1ad"/>
  <path d="M502 147 C502 171, 457 191, 421 203" fill="none" stroke="#7da1ad" stroke-width="2"/>
  <polygon points="421,203 428,196 430,205" fill="#7da1ad"/>
  <path d="M220 203 C183 190, 139 174, 139 148" fill="none" stroke="#7da1ad" stroke-width="2"/>
  <polygon points="139,148 145,156 135,156" fill="#7da1ad"/>

  <!-- Top left -->
  <g filter="url(#shadow)">
    <rect x="45" y="69" width="134" height="79" rx="18" fill="#fff4d9"/>
    <rect x="57" y="82" width="31" height="31" rx="10" fill="#ffd98c"/>
    <path d="M66 98 L73 91 L81 98 L73 105 Z" fill="none" stroke="#926b28" stroke-width="1.8"/>
    <text x="100" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6b5226">Tam Tahta</text>
    <text x="100" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7e6a45">Rastgele DFS</text>
    <text x="62" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7e6a45">Geçerli çözüm</text>
  </g>

  <!-- Top right -->
  <g filter="url(#shadow)">
    <rect x="462" y="69" width="134" height="79" rx="18" fill="#fce4ed"/>
    <rect x="474" y="82" width="31" height="31" rx="10" fill="#f6b8cd"/>
    <path d="M481 89 L498 106 M498 89 L481 106" stroke="#9d4263" stroke-width="1.8"/>
    <circle cx="489.5" cy="97.5" r="3.5" fill="none" stroke="#9d4263" stroke-width="1.5"/>
    <text x="516" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#784254">İpucu Silme</text>
    <text x="516" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6170">Simetrik çiftler</text>
    <text x="479" y="135" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6170">Geçici kaldırma</text>
  </g>

  <!-- Bottom left -->
  <g filter="url(#shadow)">
    <rect x="45" y="202" width="154" height="78" rx="18" fill="#e8e4fb"/>
    <rect x="57" y="215" width="31" height="31" rx="10" fill="#c9bdf3"/>
    <path d="M65 224 H80 M65 230 H76 M65 236 H72" stroke="#5e5599" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#51477e">Geri İzleme</text>
    <text x="100" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#716995">MRV ile seçim</text>
    <text x="62" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#716995">Aday yoksa geri dön</text>
  </g>

  <!-- Bottom right -->
  <g filter="url(#shadow)">
    <rect x="441" y="202" width="155" height="78" rx="18" fill="#dff2ed"/>
    <rect x="453" y="215" width="31" height="31" rx="10" fill="#a8dfd0"/>
    <path d="M460 239 L467 231 L472 235 L481 224" fill="none" stroke="#317c70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="496" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#326d64">Zorluk Ayarı</text>
    <text x="496" y="247" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587f79">İpucu ve maliyet</text>
    <text x="458" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#587f79">Hedef seviye</text>
  </g>

  <!-- Center core -->
  <g filter="url(#shadow)">
    <rect x="220" y="82" width="201" height="156" rx="25" fill="url(#core)" stroke="#c2dae1" stroke-width="1.2"/>
    <text x="320" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345d70">Kısıt Tatmin Motoru</text>

    <!-- sudoku grid -->
    <g transform="translate(270 119)" filter="url(#smallShadow)">
      <rect width="99" height="99" rx="7" fill="#fbfeff" stroke="#6d9cac" stroke-width="1.5"/>
      <path d="M33 0 V99 M66 0 V99 M0 33 H99 M0 66 H99" stroke="#91b4bf" stroke-width="1"/>
      <path d="M11 0 V99 M22 0 V99 M44 0 V99 M55 0 V99 M77 0 V99 M88 0 V99 M0 11 H99 M0 22 H99 M0 44 H99 M0 55 H99 M0 77 H99 M0 88 H99" stroke="#c8dde2" stroke-width="0.7"/>
      <text x="16.5" y="19" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">5</text>
      <text x="49.5" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">8</text>
      <text x="82.5" y="19" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">1</text>
      <text x="27.5" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">7</text>
      <rect x="44" y="44" width="11" height="11" rx="2" fill="#f7ca7c"/>
      <text x="49.5" y="52" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#74551c">?</text>
      <text x="71.5" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">4</text>
      <text x="16.5" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">9</text>
      <text x="60.5" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">6</text>
      <text x="82.5" y="85" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c7385">2</text>
    </g>
  </g>

  <!-- uniqueness badge -->
  <g filter="url(#smallShadow)">
    <rect x="248" y="247" width="145" height="28" rx="14" fill="#ffffff"/>
    <circle cx="265" cy="261" r="7" fill="#7bd1a8"/>
    <path d="M261.5 261 L264 263.5 L269 258.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="323" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6c60">Tek çözüm kontrolü</text>
  </g>
</svg>