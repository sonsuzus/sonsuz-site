  <circle cx="243" cy="87" r="8" fill="#70a5d0"/>
  <path d="M240 87 h6 M243 84 v6" stroke="#ffffff" stroke-width="1.4"/>
  <text x="258" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42677e">RTK-GPS</text>

  <path d="M238 231 q5 -10 10 0 q5 10 10 0" fill="none" stroke="#c9825b" stroke-width="2"/>
  <text x="260" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8d5c42">IMU</text>

  <circle cx="348" cy="87" r="9" fill="#9c86d1"/>
  <path d="M342 87 h12 M348 81 v12" stroke="#ffffff" stroke-width="1.4"/>
  <text x="362" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#655487">LiDAR</text>

  <rect x="340" y="224" width="17" height="13" rx="3" fill="#66ae98"/>
  <circle cx="350" cy="230.5" r="3" fill="#ffffff"/>
  <text x="363" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#467967">Kamera</text>

  <!-- sensor links -->
  <path d="M268 108 L289 130 M268 212 L289 191 M372 108 L351 130 M372 212 L351 191" fill="none" stroke="#90a8b1" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- fusion core -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="161" r="43" fill="#ffffff" stroke="#9cc5ca" stroke-width="2"/>
    <circle cx="320" cy="161" r="32" fill="#dff2f0"/>
  </g>
  <path d="M303 162 C310 149 320 176 328 158 C333 147 338 160 341 153" fill="none" stroke="#3e8f91" stroke-width="2.5" stroke-linecap="round"/>
  <text x="287" y="185" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356b70">Sensör Füzyonu</text>

  <!-- Planning -->
  <path d="M365 161 H398" fill="none" stroke="#7297a4" stroke-width="2"/>
  <polygon points="397,156 407,161 397,166" fill="#7297a4"/>
  <g filter="url(#shadow)">
    <rect x="407" y="123" width="102" height="77" rx="16" fill="#fffdf8"/>
  </g>
  <path d="M422 146 h24 l8 9 l16 -17 M422 174 h21 l12 -10 l25 12" fill="none" stroke="#d18c55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="420" y="190" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7d5b3b">Rota Planlama</text>
  <text x="425" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#96806b">Takip ve kontrol</text>

  <!-- control to vehicle -->
  <path d="M510 161 H532" fill="none" stroke="#7297a4" stroke-width="2"/>
  <polygon points="531,156 541,161 531,166" fill="#7297a4"/>
  <text x="510" y="150" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67838e">komut</text>

  <!-- Tractor -->
  <g filter="url(#shadow)">
    <rect x="540" y="115" width="75" height="93" rx="18" fill="#f5fbf5"/>
  </g>
  <circle cx="558" cy="183" r="12" fill="#405c65"/>
  <circle cx="558" cy="183" r="5" fill="#b9d0d2"/>
  <circle cx="596" cy="181" r="17" fill="#405c65"/>
  <circle cx="596" cy="181" r="7" fill="#b9d0d2"/>
  <path d="M550 172 V146 Q550 140 556 140 H574 V160 H600 Q605 160 605 165 V173 Z" fill="#75b683" stroke="#4f8d61" stroke-width="1.5"/>
  <path d="M558 144 H571 V157 H558 Z" fill="#bfe3ed"/>
  <path d="M578 151 h13" stroke="#4f8d61" stroke-width="3" stroke-linecap="round"/>
  <rect x="562" y="130" width="5" height="11" rx="2" fill="#627d83"/>
  <circle cx="564.5" cy="127" r="4" fill="#7daec5"/>
  <text x="551" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#426b4b">Otonom Traktör</text>

  <!-- Safety panel -->
  <g filter="url(#smallShadow)">
    <rect x="435" y="245" width="169" height="43" rx="13" fill="#fff0eb"/>
  </g>
  <path d="M452 254 l10 18 h-20 z" fill="#e27d64"/>
  <path d="M452 260 v6 M452 270 v1" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="471" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#925240">Engel Algılama</text>
  <text x="471" y="280" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a16c5a">Yavaşla veya dur</text>
  <path d="M576 208 V241" fill="none" stroke="#c98a7c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="571,240 576,247 581,240" fill="#c98a7c"/>
</svg>