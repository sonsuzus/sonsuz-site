<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ed"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9edbd"/>
      <stop offset="100%" stop-color="#bfe0a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7890a0" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#668090" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="589" cy="38" r="70" fill="#dceef7" opacity="0.48"/>
  <circle cx="62" cy="289" r="80" fill="#e5f2d7" opacity="0.55"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31566b">OTONOM TARLA NAVİGASYONU</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#68808d">Algıla · Birleştir · Planla · Uygula</text>

  <!-- Field map -->
  <g filter="url(#shadow)">
    <rect x="28" y="70" width="165" height="196" rx="18" fill="#ffffff"/>
    <rect x="41" y="106" width="139" height="145" rx="12" fill="url(#field)" stroke="#98be79" stroke-width="1.5"/>
  </g>
  <text x="52" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41624b">Dijital Tarla</text>
  <text x="128" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668270">sınırlar</text>

  <path d="M54 126 H161 Q169 126 169 134 V139 H59 Q52 139 52 146 V151 H161 Q169 151 169 159 V164 H59 Q52 164 52 171 V176 H161 Q169 176 169 184 V189 H59 Q52 189 52 196 V201 H161 Q169 201 169 209 V214 H59 Q52 214 52 221 V226 H161" fill="none" stroke="#f8fff3" stroke-width="5" stroke-linecap="round"/>
  <path d="M54 126 H161 Q169 126 169 134 V139 H59 Q52 139 52 146 V151 H161 Q169 151 169 159 V164 H59 Q52 164 52 171 V176 H161 Q169 176 169 184 V189 H59 Q52 189 52 196 V201 H161 Q169 201 169 209 V214 H59 Q52 214 52 221 V226 H161" fill="none" stroke="#5d9e74" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
  <polygon points="157,222 168,226 157,230" fill="#397c58"/>
  <circle cx="81" cy="152" r="7" fill="#ef947c" stroke="#ffffff" stroke-width="2"/>
  <text x="49" y="242" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52715d">Paralel şeritler</text>

  <!-- arrows field to brain -->
  <path d="M195 144 C211 144 215 144 229 144" fill="none" stroke="#7297a4" stroke-width="2"/>
  <polygon points="228,139 238,144 228,149" fill="#7297a4"/>
  <text x="197" y="133" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67838e">rota</text>

  <!-- Sensor satellites -->
  <g filter="url(#smallShadow)">
    <rect x="225" y="66" width="86" height="42" rx="12" fill="#e0efff"/>
    <rect x="225" y="212" width="86" height="42" rx="12" fill="#fce8d8"/>
    <rect x="329" y="66" width="86" height="42" rx="12" fill="#e9e2fb"/>
    <rect x="329" y="212" width="86" height="42" rx="12" fill="#dff3ec"/>
