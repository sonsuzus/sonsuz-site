    <rect x="507" y="83" width="66" height="49" rx="14" fill="url(#safe)"/>
    <rect x="375" y="149" width="66" height="49" rx="14" fill="url(#safe)"/>
    <rect x="533" y="149" width="66" height="49" rx="14" fill="url(#safe)"/>
