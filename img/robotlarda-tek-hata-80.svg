<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2faef"/>
    </linearGradient>
    <linearGradient id="central" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9d4"/>
      <stop offset="100%" stop-color="#f8bcb5"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9f1ff"/>
      <stop offset="100%" stop-color="#a9daf2"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff4d8"/>
      <stop offset="100%" stop-color="#b9e1ac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#557080" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#557080" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="78" cy="46" r="76" fill="#cfeaff" opacity="0.28"/>
  <circle cx="589" cy="278" r="90" fill="#d9f3ca" opacity="0.32"/>

  <text x="30" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385366">Tek hata noktası</text>
  <text x="385" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385366">Dağıtık kontrol</text>

  <rect x="24" y="48" width="258" height="236" rx="22" fill="#ffffff" opacity="0.74" filter="url(#shadow)"/>
  <rect x="358" y="48" width="258" height="236" rx="22" fill="#ffffff" opacity="0.74" filter="url(#shadow)"/>

