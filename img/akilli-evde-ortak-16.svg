    <circle cx="486" cy="185" r="15" fill="#f4c2a9"/>
    <path d="M478 188h16M486 177v16" stroke="#a85c3f" stroke-width="2" stroke-linecap="round"/>
    <text x="512" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#88523f">Otomasyon</text>
    <text x="512" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a1705e">Yerel tepki</text>
  </g>

  <g filter="url(#soft)">
    <rect x="459" y="234" width="151" height="57" rx="16" fill="#e9f6f5"/>
    <circle cx="486" cy="262" r="15" fill="#a9ded9"/>
    <path d="M478 264l5 5 11-13" fill="none" stroke="#347a76" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="512" y="259" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#39716f">Uyumlu Ev</text>
    <text x="512" y="276" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8a87">Tek sistem</text>
  </g>
</svg>