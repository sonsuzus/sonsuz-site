    <rect x="234" y="91" width="158" height="54" rx="17" fill="url(#core)"/>
    <path d="M258 117h22M269 106v22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="294" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Yerel Merkez</text>
