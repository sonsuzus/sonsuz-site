<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b9ee8"/>
      <stop offset="100%" stop-color="#7792ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#42627f" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5b7185" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="71" cy="58" r="80" fill="#dceef7" opacity="0.45"/>
  <circle cx="592" cy="279" r="105" fill="#dff0dd" opacity="0.55"/>

  <text x="32" y="33" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#456078">AKILLI EVDE ORTAK DİL</text>
  <text x="32" y="51" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718397">Bağlantı · Protokol · Anlam</text>

  <!-- Left device group -->
  <g filter="url(#soft)">
    <rect x="31" y="82" width="119" height="58" rx="16" fill="#fff4d9"/>
