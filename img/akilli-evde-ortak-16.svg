    <path d="M55 123h6" stroke="#8b6922" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#66532a">Ampul</text>
    <text x="82" y="125" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d7e5b">Wi-Fi</text>
  </g>

  <g filter="url(#soft)">
    <rect x="31" y="156" width="119" height="58" rx="16" fill="#e6f4e7"/>
    <circle cx="58" cy="185" r="15" fill="#b9ddba"/>
    <path d="M58 176v18M49 185h18" stroke="#477953" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="185" r="5" fill="none" stroke="#477953" stroke-width="2"/>
    <text x="82" y="182" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#41684b">Sensör</text>
    <text x="82" y="199" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64856c">Zigbee</text>
  </g>

  <g filter="url(#soft)">
    <rect x="31" y="230" width="119" height="58" rx="16" fill="#f0e8fb"/>
    <circle cx="58" cy="259" r="15" fill="#d1bce9"/>
    <path d="M51 260c2-8 12-8 14 0M53 254c2-4 8-4 10 0" fill="none" stroke="#70518e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="58" cy="263" r="2" fill="#70518e"/>
    <text x="82" y="256" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#624479">Termostat</text>
    <text x="82" y="273" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#84699a">Thread</text>
  </g>

  <!-- lines to core -->
  <path d="M150 111H218" fill="none" stroke="#9badba" stroke-width="2"/>
  <polygon points="218,111 209,106 209,116" fill="#9badba"/>
  <path d="M150 185H218" fill="none" stroke="#9badba" stroke-width="2"/>
  <polygon points="218,185 209,180 209,190" fill="#9badba"/>
  <path d="M150 259H218" fill="none" stroke="#9badba" stroke-width="2"/>
  <polygon points="218,259 209,254 209,264" fill="#9badba"/>

