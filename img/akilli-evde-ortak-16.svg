    <rect x="234" y="158" width="158" height="35" rx="11" fill="#edf4ff"/>
    <text x="249" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4d6e9d">Bağlantı</text>
    <text x="330" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6681a4">IP · Ağ</text>

    <rect x="234" y="202" width="158" height="35" rx="11" fill="#eaf7ef"/>
    <text x="249" y="225" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#4b7b60">Dönüştürme</text>
    <text x="330" y="225" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668d75">MQTT</text>

    <rect x="234" y="246" width="158" height="35" rx="11" fill="#f6effd"/>
    <text x="249" y="269" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#76538f">Anlamsal Uyum</text>
    <circle cx="372" cy="263" r="8" fill="#b596d5"/>
    <path d="M368 263l3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- outgoing -->
  <path d="M408 142C435 142 434 108 459 108" fill="none" stroke="#879bac" stroke-width="2"/>
  <polygon points="459,108 451,104 452,113" fill="#879bac"/>
  <path d="M408 185H459" fill="none" stroke="#879bac" stroke-width="2"/>
  <polygon points="459,185 450,180 450,190" fill="#879bac"/>
  <path d="M408 228C435 228 434 262 459 262" fill="none" stroke="#879bac" stroke-width="2"/>
  <polygon points="459,262 451,257 452,266" fill="#879bac"/>

  <!-- right destinations -->
  <g filter="url(#soft)">
    <rect x="459" y="80" width="151" height="57" rx="16" fill="#e8f0ff"/>
    <circle cx="486" cy="108" r="15" fill="#b7ccf4"/>
    <path d="M478 111c4-10 12-10 16 0M480 104c3-5 9-5 12 0" fill="none" stroke="#45699e" stroke-width="2" stroke-linecap="round"/>
    <text x="512" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#435f8a">Matter</text>
    <text x="512" y="122" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7084a3">Çoklu yönetim</text>
  </g>

