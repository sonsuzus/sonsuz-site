    <text x="386" y="263" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#73818d">Eğlence ve ipuçları</text>
    <text x="386" y="282" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#73818d">Kontrol hissi</text>
