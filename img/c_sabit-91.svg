<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f4ea"/>
      <stop offset="100%" stop-color="#d0e8d8"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef7e0"/>
      <stop offset="100%" stop-color="#faecc8"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce8e6"/>
      <stop offset="100%" stop-color="#f5d0cc"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eaed"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#3c4043">C Programlama Sabitler</text>
  <line x1="180" y1="40" x2="460" y2="40" stroke="#9aa0a6" stroke-width="1" opacity="0.5"/>

  <!-- Merkez kutu: Sabitler -->
  <rect x="255" y="120" width="130" height="50" rx="12" fill="url(#centerGrad)" filter="url(#shadow)" stroke="#9aa0a6" stroke-width="1"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#3c4043">SABİTLER</text>
  <text x="320" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5f6368">Değiştirilemez</text>

  <!-- Sol üst: int sabit -->
  <rect x="40" y="70" width="120" height="55" rx="10" fill="url(#boxGrad1)" filter="url(#shadowLight)" stroke="#aecbfa" stroke-width="1"/>
  <text x="100" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a73e8">int sabit</text>
  <text x="100" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3c4043">21</text>

  <!-- Sağ üst: float sabit -->
  <rect x="480" y="70" width="120" height="55" rx="10" fill="url(#boxGrad1)" filter="url(#shadowLight)" stroke="#aecbfa" stroke-width="1"/>
  <text x="540" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a73e8">float sabit</text>
  <text x="540" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3c4043">35.754</text>

  <!-- Sol orta: char sabit -->
  <rect x="40" y="145" width="120" height="55" rx="10" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a8dab5" stroke-width="1"/>
  <text x="100" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#188038">char sabit</text>
  <text x="100" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3c4043">'B'</text>

  <!-- Sağ orta: Geniş char sabit -->
  <rect x="480" y="145" width="120" height="55" rx="10" fill="url(#boxGrad2)" filter="url(#shadowLight)" stroke="#a8dab5" stroke-width="1"/>
  <text x="540" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#188038">Geniş char</text>
  <text x="540" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3c4043">L'B'</text>

  <!-- Sol alt: Karakter dizisi -->
  <rect x="40" y="220" width="120" height="55" rx="10" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#fdd663" stroke-width="1"/>
  <text x="100" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e37400">Karakter dizisi</text>
  <text x="100" y="260" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3c4043">"Bilgisayar"</text>

  <!-- Sağ alt: Geniş karakter dizisi -->
  <rect x="480" y="220" width="120" height="55" rx="10" fill="url(#boxGrad3)" filter="url(#shadowLight)" stroke="#fdd663" stroke-width="1"/>
  <text x="540" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e37400">Geniş karakter dizisi</text>
  <text x="540" y="260" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3c4043">L"Bilgisayar"</text>

  <!-- Oklar: merkezden dışa -->
  <!-- Sol üst ok -->
  <path d="M255,135 L165,105" stroke="#9aa0a6" stroke-width="1.5" fill="none"/>
  <polygon points="165,105 176,107 171,98" fill="#9aa0a6"/>

  <!-- Sağ üst ok -->
  <path d="M385,135 L475,105" stroke="#9aa0a6" stroke-width="1.5" fill="none"/>
  <polygon points="475,105 464,107 469,98" fill="#9aa0a6"/>

  <!-- Sol orta ok -->
  <path d="M255,150 L165,170" stroke="#9aa0a6" stroke-width="1.5" fill="none"/>
  <polygon points="165,170 176,168 171,177" fill="#9aa0a6"/>

  <!-- Sağ orta ok -->
  <path d="M385,150 L475,170" stroke="#9aa0a6" stroke-width="1.5" fill="none"/>
  <polygon points="475,170 464,168 469,177" fill="#9aa0a6"/>

  <!-- Sol alt ok -->
  <path d="M255,165 L165,240" stroke="#9aa0a6" stroke-width="1.5" fill="none"/>
  <polygon points="165,240 176,236 170,229" fill="#9aa0a6"/>

  <!-- Sağ alt ok -->
  <path d="M385,165 L475,240" stroke="#9aa0a6" stroke-width="1.5" fill="none"/>
  <polygon points="475,240 464,236 470,229" fill="#9aa0a6"/>

  <!-- Alt bilgi: Tür ekleri -->
  <rect x="200" y="285" width="240" height="28" rx="8" fill="#f1f3f4" filter="url(#shadowLight)" stroke="#dadce0" stroke-width="0.5"/>
  <text x="320" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5f6368">
    <tspan font-weight="bold" fill="#1a73e8">U</tspan> int · 
    <tspan font-weight="bold" fill="#1a73e8">F</tspan> float · 
    <tspan font-weight="bold" fill="#1a73e8">L</tspan> long · 
    <tspan font-weight="bold" fill="#1a73e8">LL</tspan> long long
  </text>
</svg>