<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9efff"/>
      <stop offset="100%" stop-color="#c9e2fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7894aa" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7894aa" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="77" cy="51" r="70" fill="#dff3ed" opacity="0.48"/>
  <circle cx="585" cy="272" r="90" fill="#dceeff" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36536b">EMİR EŞLEŞTİRME MOTORU</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8393">Tek yazarlı, fiyat-zaman öncelikli işlem hattı</text>

  <!-- Flow connections -->
  <path d="M132 119 H151" fill="none" stroke="#7e9fb5" stroke-width="2"/>
  <polygon points="151,119 143,114 143,124" fill="#7e9fb5"/>
  <path d="M254 119 H273" fill="none" stroke="#7e9fb5" stroke-width="2"/>
  <polygon points="273,119 265,114 265,124" fill="#7e9fb5"/>
  <path d="M376 119 H395" fill="none" stroke="#7e9fb5" stroke-width="2"/>
  <polygon points="395,119 387,114 387,124" fill="#7e9fb5"/>
  <path d="M498 119 H517" fill="none" stroke="#7e9fb5" stroke-width="2"/>
  <polygon points="517,119 509,114 509,124" fill="#7e9fb5"/>

  <!-- Pipeline cards -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="82" width="104" height="74" rx="15" fill="#ffffff"/>
    <rect x="28" y="82" width="104" height="7" rx="4" fill="#a9d8d1"/>
    <circle cx="51" cy="113" r="12" fill="#e0f5f0"/>
    <path d="M46 113 h10 M51 108 v10" stroke="#4f958b" stroke-width="2" stroke-linecap="round"/>
    <text x="69" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">Ağ geçidi</text>
    <text x="43" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8392">Doğrulama</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="151" y="82" width="103" height="74" rx="15" fill="#ffffff"/>
    <rect x="151" y="82" width="103" height="7" rx="4" fill="#f1c88e"/>
    <circle cx="174" cy="113" r="12" fill="#fff0d8"/>
    <path d="M169 116 l4-6 4 3 4-6" fill="none" stroke="#bd8032" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">Risk</text>
    <text x="166" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8392">Rezerv</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="273" y="82" width="103" height="74" rx="15" fill="#ffffff"/>
    <rect x="273" y="82" width="103" height="7" rx="4" fill="#b9b4e8"/>
    <circle cx="296" cy="113" r="12" fill="#eeecff"/>
    <path d="M291 109 h10 M291 113 h7 M291 117 h4" stroke="#776ec0" stroke-width="2" stroke-linecap="round"/>
    <text x="314" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">Sıralayıcı</text>
    <text x="288" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8392">Sıra no</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="395" y="82" width="103" height="74" rx="15" fill="#ffffff"/>
    <rect x="395" y="82" width="103" height="7" rx="4" fill="#a3c9ef"/>
    <circle cx="418" cy="113" r="12" fill="#e1f0fd"/>
    <path d="M412 110 h12 M412 116 h12 M415 107 v12 M421 107 v12" stroke="#4c8fc2" stroke-width="1.6" stroke-linecap="round"/>
    <text x="436" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">Motor</text>
    <text x="410" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8392">Eşleştir</text>
  </g>

  <g filter="url(#smallShadow)">
    <rect x="517" y="82" width="95" height="74" rx="15" fill="#ffffff"/>
    <rect x="517" y="82" width="95" height="7" rx="4" fill="#a8d7ad"/>
    <circle cx="540" cy="113" r="12" fill="#e4f5e5"/>
    <path d="M535 113 l4 4 7-8" fill="none" stroke="#57925e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="558" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">Olaylar</text>
    <text x="532" y="140" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8392">Yayınla</text>
  </g>

  <!-- Central Order book -->
  <g filter="url(#shadow)">
    <rect x="169" y="187" width="302" height="106" rx="20" fill="url(#engine)" stroke="#b6d5ed"/>
    <text x="194" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315775">EMİR DEFTERİ</text>
    <text x="194" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#54758a">Fiyat-zaman önceliği</text>

    <rect x="194" y="246" width="105" height="29" rx="8" fill="#e8f7ed"/>
    <circle cx="210" cy="260" r="5" fill="#63b779"/>
    <text x="222" y="264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#407453">Alış kuyruğu</text>

    <rect x="314" y="246" width="132" height="29" rx="8" fill="#fff0ec"/>
    <circle cx="330" cy="260" r="5" fill="#df8174"/>
    <text x="342" y="264" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a554d">Satış kuyruğu</text>
  </g>

  <!-- Connection motor to book -->
  <path d="M446 157 V177 H413 V187" fill="none" stroke="#6799bb" stroke-width="2"/>
  <polygon points="413,187 408,179 418,179" fill="#6799bb"/>

  <!-- Persistence left -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="204" width="116" height="70" rx="16" fill="#ffffff"/>
    <rect x="28" y="204" width="6" height="70" rx="3" fill="#c3ace3"/>
    <ellipse cx="57" cy="224" rx="13" ry="5" fill="#e9e2f8" stroke="#9278bd"/>
    <path d="M44 224 v20 c0 7 26 7 26 0 v-20 M44 234 c0 7 26 7 26 0" fill="none" stroke="#9278bd" stroke-width="1.5"/>
    <text x="80" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">Komut</text>
    <text x="80" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8392">günlüğü</text>
  </g>
  <path d="M144 239 H169" fill="none" stroke="#8c82bd" stroke-width="2"/>
  <polygon points="169,239 161,234 161,244" fill="#8c82bd"/>

  <!-- Outputs right -->
  <g filter="url(#smallShadow)">
    <rect x="496" y="204" width="116" height="70" rx="16" fill="#ffffff"/>
    <rect x="606" y="204" width="6" height="70" rx="3" fill="#8cc7c7"/>
    <circle cx="524" cy="230" r="13" fill="#e2f5f4"/>
    <path d="M518 230 h12 M524 224 v12" stroke="#4b9695" stroke-width="1.8" stroke-linecap="round"/>
    <text x="546" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385568">İşlem ve</text>
    <text x="546" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b8392">piyasa verisi</text>
  </g>
  <path d="M471 239 H496" fill="none" stroke="#579f9d" stroke-width="2"/>
  <polygon points="496,239 488,234 488,244" fill="#579f9d"/>

  <text x="198" y="307" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708b9b">Deterministik yürütme</text>
  <circle cx="181" cy="303" r="5" fill="#6a9fc5"/>
</svg>