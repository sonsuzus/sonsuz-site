<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d1ecf9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f8e8"/>
      <stop offset="100%" stop-color="#d0f0d0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e8f8"/>
      <stop offset="100%" stop-color="#e0d0f0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce8e8"/>
      <stop offset="100%" stop-color="#f8d0d0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Bit Manipülasyonu ve Olimpiyat Soruları</text>

  <!-- Merkez kavram -->
  <rect x="245" y="50" width="150" height="40" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#8ec5e8" stroke-width="1.5"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Bit Operatörleri</text>

  <!-- XOR kutusu -->
  <rect x="40" y="130" width="130" height="55" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#e8b060" stroke-width="1.5"/>
  <text x="105" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7e5100">XOR</text>
  <text x="105" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6b4c1a">Parite ve iptal</text>

  <!-- AND kutusu -->
  <rect x="255" y="130" width="130" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#6fbf6f" stroke-width="1.5"/>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6b1e">AND</text>
  <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d6b2d">Ortak bitler</text>

  <!-- OR kutusu -->
  <rect x="470" y="130" width="130" height="55" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#a070c0" stroke-width="1.5"/>
  <text x="535" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2d6b">OR</text>
  <text x="535" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a2d6b">Birleşim</text>

  <!-- Alt küme DP kutusu -->
  <rect x="40" y="230" width="170" height="55" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#d08080" stroke-width="1.5"/>
  <text x="125" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#8b1a1a">Alt küme DP</text>
  <text x="125" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a2d2d">Maske ile durum</text>

  <!-- Yol XOR kutusu -->
  <rect x="255" y="230" width="170" height="55" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#8ec5e8" stroke-width="1.5"/>
  <text x="340" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Yol XOR</text>
  <text x="340" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">Ağaç sorguları</text>

  <!-- Kapsama kutusu -->
  <rect x="470" y="230" width="130" height="55" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#6fbf6f" stroke-width="1.5"/>
  <text x="535" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e6b1e">Kapsama</text>
  <text x="535" y="270" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2d6b2d">Beceri maskesi</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Merkezden XOR'a -->
  <path d="M245 75 L175 125" stroke="#888" stroke-width="1.5" fill="none"/>
  <polygon points="170,128 182,122 178,132" fill="#888"/>

  <!-- Merkezden AND'e -->
  <path d="M320 90 L320 125" stroke="#888" stroke-width="1.5" fill="none"/>
  <polygon points="320,130 316,122 324,122" fill="#888"/>

  <!-- Merkezden OR'a -->
  <path d="M395 75 L465 125" stroke="#888" stroke-width="1.5" fill="none"/>
  <polygon points="470,128 458,132 462,122" fill="#888"/>

  <!-- XOR'dan Alt küme DP'ye -->
  <path d="M105 185 L115 225" stroke="#888" stroke-width="1.5" fill="none"/>
  <polygon points="117,230 108,222 122,224" fill="#888"/>

  <!-- AND'den Yol XOR'a -->
  <path d="M320 185 L330 225" stroke="#888" stroke-width="1.5" fill="none"/>
  <polygon points="332,230 323,222 337,224" fill="#888"/>

  <!-- OR'dan Kapsama'ya -->
  <path d="M535 185 L535 225" stroke="#888" stroke-width="1.5" fill="none"/>
  <polygon points="535,230 531,222 539,222" fill="#888"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">Küçük evrenlerde büyük hız kazanımı</text>
</svg>