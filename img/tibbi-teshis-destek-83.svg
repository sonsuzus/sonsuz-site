<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3eaff"/>
      <stop offset="1" stop-color="#d9f3ea"/>
    </linearGradient>
    <linearGradient id="priority" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2db"/>
      <stop offset="1" stop-color="#ffe4cf"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71849b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71849b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="84" cy="42" r="64" fill="#dcecff" opacity="0.46"/>
  <circle cx="586" cy="282" r="91" fill="#dff2df" opacity="0.48"/>
  <path d="M0 260 C115 220 175 300 270 267 S452 213 640 248" fill="none" stroke="#cfe5df" stroke-width="2" opacity="0.55"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c536c">TEŞHİS DESTEK AKIŞI</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718197">Semptomdan klinik önceliğe</text>

  <!-- Semptom paneli -->
  <g filter="url(#shadow)">
    <rect x="28" y="76" width="138" height="178" rx="20" fill="#ffffff"/>
    <rect x="28" y="76" width="138" height="42" rx="20" fill="#dfeaff"/>
    <rect x="28" y="101" width="138" height="17" fill="#dfeaff"/>
  </g>
  <circle cx="52" cy="97" r="11" fill="#7895d7"/>
  <path d="M48 97h8M52 93v8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="70" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40536e">Semptomlar</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f6171">
    <rect x="43" y="133" width="108" height="26" rx="10" fill="#fff3e6"/>
    <circle cx="57" cy="146" r="5" fill="#f29b72"/>
    <text x="70" y="150">Ateş</text>
    <rect x="43" y="166" width="108" height="26" rx="10" fill="#e8f5ef"/>
    <circle cx="57" cy="179" r="5" fill="#67b999"/>
    <text x="70" y="183">Öksürük</text>
    <rect x="43" y="199" width="108" height="38" rx="10" fill="#ebf2ff"/>
    <circle cx="57" cy="214" r="5" fill="#7199df"/>
    <text x="70" y="216">Nefes darlığı</text>
    <text x="70" y="229" font-size="10" fill="#748499">Satürasyon</text>
  </g>

  <!-- arrow input -->
  <path d="M174 164 H204" fill="none" stroke="#91a9c4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="204,164 196,159 196,169" fill="#91a9c4"/>

  <!-- Decision tree -->
  <g filter="url(#shadow)">
    <rect x="211" y="61" width="190" height="204" rx="24" fill="url(#tree)"/>
    <rect x="224" y="74" width="164" height="30" rx="12" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="306" y="94" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3c5872">Karar Ağacı</text>

  <!-- tree branches -->
  <path d="M306 124 V142 M306 142 H260 M306 142 H350 M260 142 V167 M350 142 V167 M260 190 V207 M350 190 V207" fill="none" stroke="#7298ac" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="260,162 256,168 264,168" fill="#7298ac"/>
  <polygon points="350,162 346,168 354,168" fill="#7298ac"/>

  <g filter="url(#soft)">
    <rect x="250" y="111" width="112" height="27" rx="11" fill="#ffffff"/>
    <rect x="226" y="166" width="68" height="27" rx="11" fill="#ffffff"/>
    <rect x="316" y="166" width="68" height="27" rx="11" fill="#ffffff"/>
    <rect x="226" y="207" width="68" height="32" rx="11" fill="#fefdfb"/>
    <rect x="316" y="207" width="68" height="32" rx="11" fill="#fefdfb"/>
  </g>
  <g font-family="Segoe UI, Tahoma, sans-serif" fill="#466174">
    <text x="306" y="129" text-anchor="middle" font-size="12" font-weight="600">Ateş var mı?</text>
    <text x="260" y="183" text-anchor="middle" font-size="11">Satürasyon</text>
    <text x="350" y="183" text-anchor="middle" font-size="11">Öksürük</text>
    <text x="260" y="221" text-anchor="middle" font-size="10" fill="#647a8b">Düşük</text>
    <text x="350" y="221" text-anchor="middle" font-size="10" fill="#647a8b">Belirgin</text>
  </g>
  <text x="241" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c8996">Evet</text>
  <text x="335" y="155" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6c8996">Hayır</text>

  <!-- arrow output -->
  <path d="M409 164 H433" fill="none" stroke="#91a9c4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="433,164 425,159 425,169" fill="#91a9c4"/>

  <!-- priorities -->
  <g filter="url(#shadow)">
    <rect x="440" y="76" width="172" height="178" rx="20" fill="#ffffff"/>
    <rect x="440" y="76" width="172" height="42" rx="20" fill="url(#priority)"/>
    <rect x="440" y="101" width="172" height="17" fill="url(#priority)"/>
  </g>
  <circle cx="464" cy="97" r="11" fill="#e89567"/>
  <path d="M460 94h8M460 98h6M460 102h4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="482" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#664b40">Öncelik Listesi</text>

  <g font-family="Segoe UI, Tahoma, sans-serif">
    <rect x="454" y="130" width="144" height="30" rx="10" fill="#ffe8e0"/>
    <circle cx="470" cy="145" r="10" fill="#e97866"/>
    <text x="470" y="149" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
    <text x="488" y="142" font-size="12" font-weight="700" fill="#704d4a">Zatürre</text>
    <text x="488" y="153" font-size="10" fill="#a16b61">Yüksek olasılık</text>

    <rect x="454" y="168" width="144" height="30" rx="10" fill="#fff4df"/>
    <circle cx="470" cy="183" r="10" fill="#e6ad57"/>
    <text x="470" y="187" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="488" y="180" font-size="12" font-weight="700" fill="#716044">Grip</text>
    <text x="488" y="191" font-size="10" fill="#9c8767">Orta olasılık</text>

    <rect x="454" y="206" width="144" height="30" rx="10" fill="#e8f4ed"/>
    <circle cx="470" cy="221" r="10" fill="#6fb58f"/>
    <text x="470" y="225" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
    <text x="488" y="218" font-size="12" font-weight="700" fill="#4e6d5b">Alerji</text>
    <text x="488" y="229" font-size="10" fill="#769283">Düşük olasılık</text>
  </g>

  <!-- Clinician oversight -->
  <g filter="url(#soft)">
    <rect x="204" y="278" width="232" height="29" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="223" cy="292.5" r="8" fill="#7199df"/>
  <path d="M220 293l2 2 5-5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="239" y="297" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6474">Hekim değerlendirmesi ve doğrulama</text>
  <path d="M515 254 V270 H436" fill="none" stroke="#91a9c4" stroke-width="2" stroke-linecap="round"/>
  <polygon points="436,270 444,265 444,275" fill="#91a9c4"/>
</svg>