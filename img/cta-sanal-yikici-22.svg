<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3f1"/>
      <stop offset="100%" stop-color="#ffe4df"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#effaf4"/>
      <stop offset="100%" stop-color="#d9f3e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6b8294" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#65778c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="62" cy="38" r="54" fill="#dceefd" opacity="0.55"/>
  <circle cx="591" cy="276" r="72" fill="#dff3e4" opacity="0.6"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385064">Çok Biçimli Silme</text>
  <text x="320" y="44" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718391">Base* üzerinden delete</text>

  <g filter="url(#shadow)">
    <rect x="230" y="61" width="180" height="58" rx="16" fill="#e6eefb" stroke="#9db7da"/>
    <rect x="246" y="75" width="33" height="30" rx="8" fill="#bcd3f2"/>
    <path d="M255 84 h15 M255 91 h15 M255 98 h10" stroke="#597da7" stroke-width="2" stroke-linecap="round"/>
    <text x="293" y="86" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536e">Base* işaretçisi</text>
    <text x="293" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64788b">Dinamik nesne: Derived</text>
  </g>

  <path d="M278 120 C239 136 185 140 155 155" fill="none" stroke="#d48778" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="153,155 162,149 160,160" fill="#d48778"/>
  <path d="M362 120 C401 136 456 140 485 155" fill="none" stroke="#5ea77d" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="487,155 478,149 480,160" fill="#5ea77d"/>

  <g filter="url(#shadow)">
    <rect x="42" y="158" width="232" height="128" rx="18" fill="url(#danger)" stroke="#e8a092"/>
    <rect x="59" y="174" width="37" height="37" rx="10" fill="#f8c6bf"/>
    <path d="M77 181 l0 13 M77 201 l0 1" stroke="#a94b42" stroke-width="3" stroke-linecap="round"/>
    <text x="108" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8c4039">Sanal olmayan yıkıcı</text>
    <text x="108" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a15e57">delete Base*</text>

    <path d="M74 230 H242" stroke="#e6b5ad" stroke-width="1.5"/>
    <g filter="url(#soft)">
      <rect x="62" y="241" width="82" height="29" rx="9" fill="#fff8f6"/>
      <text x="103" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#974b43">Base yok olur</text>
      <rect x="166" y="241" width="89" height="29" rx="9" fill="#f7d3ce"/>
      <text x="210" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a7443b">Tanımsız davranış</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="366" y="158" width="232" height="128" rx="18" fill="url(#safe)" stroke="#91caaa"/>
    <rect x="383" y="174" width="37" height="37" rx="10" fill="#bde6cc"/>
    <path d="M391 192 l7 7 14-17" fill="none" stroke="#3d8b62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="432" y="187" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#337653">Sanal yıkıcı</text>
    <text x="432" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56836a">virtual ~Base()</text>

    <path d="M398 230 H566" stroke="#b7ddc4" stroke-width="1.5"/>
    <g filter="url(#soft)">
      <rect x="385" y="241" width="82" height="29" rx="9" fill="#f8fffa"/>
      <text x="426" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397b58">Derived temizlenir</text>
      <path d="M470 255 H483" stroke="#63a982" stroke-width="2"/>
      <polygon points="485,255 479,251 479,259" fill="#63a982"/>
      <rect x="490" y="241" width="91" height="29" rx="9" fill="#f8fffa"/>
      <text x="535" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397b58">Base temizlenir</text>
    </g>
  </g>

  <g filter="url(#soft)">
    <rect x="196" y="293" width="248" height="20" rx="10" fill="#ddeaf0"/>
    <text x="320" y="307" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#456476">Kural: Çok biçimlilik varsa yıkıcı sanal olmalı</text>
  </g>
</svg>