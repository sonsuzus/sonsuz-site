<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dce8f1"/>
      <stop offset="100%" stop-color="#d5e5dc"/>
    </linearGradient>
    <radialGradient id="lightStrong">
      <stop offset="0%" stop-color="#fff6bb" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#ffe89a" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#ffe89a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightSoft">
      <stop offset="0%" stop-color="#fff8cf" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#fff8cf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7790a1" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffd85c" flood-opacity="0.75"/>
    </filter>
  </defs>

