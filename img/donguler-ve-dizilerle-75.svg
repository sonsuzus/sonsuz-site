    <text x="270" y="237" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#655181">T(n) = c · n · O(n)</text>
  </g>

  <!-- arrow two -->
  <path d="M420 160 H447" fill="none" stroke="#7695a8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="454,160 445,155 445,165" fill="#7695a8"/>

