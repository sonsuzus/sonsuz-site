    <rect x="470" y="93" width="121" height="28" rx="10" fill="#ffffff" opacity="0.76"/>
    <text x="488" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d7053">HTML KARTLARI</text>

