    <rect x="48" y="93" width="124" height="28" rx="10" fill="#ffffff" opacity="0.74"/>
    <text x="62" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385c76">ÜRÜN DİZİSİ</text>

    <rect x="49" y="132" width="122" height="25" rx="8" fill="#ffffff" opacity="0.72"/>
    <circle cx="62" cy="144.5" r="4" fill="#6aa7cc"/>
    <text x="73" y="149" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426176">ad · fiyat · stok</text>

    <rect x="49" y="164" width="122" height="25" rx="8" fill="#ffffff" opacity="0.72"/>
    <circle cx="62" cy="176.5" r="4" fill="#7ab69c"/>
    <text x="73" y="181" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426176">ad · fiyat · stok</text>

    <rect x="49" y="196" width="122" height="25" rx="8" fill="#ffffff" opacity="0.72"/>
    <circle cx="62" cy="208.5" r="4" fill="#d59b78"/>
    <text x="73" y="213" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426176">ad · fiyat · stok</text>
  </g>

  <!-- arrow one -->
  <path d="M196 160 H222" fill="none" stroke="#7695a8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="229,160 220,155 220,165" fill="#7695a8"/>

  <!-- processing -->
  <g filter="url(#shadow)">
    <rect x="230" y="67" width="180" height="189" rx="22" fill="url(#loopGrad)" stroke="#c4b5e2"/>
    <text x="252" y="95" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#574677">DÖNGÜ MOTORU</text>

    <rect x="248" y="108" width="144" height="39" rx="12" fill="#ffffff" opacity="0.72"/>
    <text x="264" y="132" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#655181">foreach</text>
