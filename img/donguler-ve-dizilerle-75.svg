<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#cce3f5"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8dfff"/>
      <stop offset="100%" stop-color="#d5c8f5"/>
    </linearGradient>
    <linearGradient id="viewGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3df"/>
      <stop offset="100%" stop-color="#c4e8d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7390a0" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71899b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="55" cy="42" r="72" fill="#d9edf8" opacity="0.38"/>
  <circle cx="604" cy="279" r="88" fill="#ddefd9" opacity="0.44"/>
  <path d="M32 276 C118 245 145 293 224 273 S358 244 425 275 S543 299 620 253" fill="none" stroke="#c7dfd9" stroke-width="1.5" opacity="0.55"/>

