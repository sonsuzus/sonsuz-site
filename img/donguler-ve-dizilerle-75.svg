    <rect x="480" y="140" width="43" height="5" rx="2.5" fill="#69a780"/>
    <rect x="480" y="149" width="78" height="4" rx="2" fill="#a4cdb1"/>
    <circle cx="576" cy="145" r="6" fill="#77b78d"/>

    <rect x="470" y="165" width="121" height="26" rx="8" fill="#ffffff" opacity="0.78"/>
    <rect x="480" y="173" width="48" height="5" rx="2.5" fill="#69a780"/>
    <rect x="480" y="182" width="72" height="4" rx="2" fill="#a4cdb1"/>
    <circle cx="576" cy="178" r="6" fill="#d9987a"/>

    <rect x="470" y="198" width="121" height="26" rx="8" fill="#ffffff" opacity="0.78"/>
    <rect x="480" y="206" width="39" height="5" rx="2.5" fill="#69a780"/>
    <rect x="480" y="215" width="80" height="4" rx="2" fill="#a4cdb1"/>
    <circle cx="576" cy="211" r="6" fill="#77b78d"/>
