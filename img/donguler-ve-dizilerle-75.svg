  <!-- lower features -->
  <g filter="url(#soft)">
    <rect x="55" y="270" width="158" height="33" rx="13" fill="#ffffff" stroke="#d6e5ec"/>
    <circle cx="73" cy="286.5" r="8" fill="#d8ebf8"/>
    <path d="M69 286 L72 289 L77 283" fill="none" stroke="#4d91bd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6675">Güvenli gösterim</text>
  </g>

  <g filter="url(#soft)">
    <rect x="239" y="270" width="158" height="33" rx="13" fill="#ffffff" stroke="#d6e5ec"/>
    <circle cx="257" cy="286.5" r="8" fill="#eee4ff"/>
    <path d="M253 286.5 H261 M257 282.5 V290.5" stroke="#816ca8" stroke-width="1.7" stroke-linecap="round"/>
    <text x="274" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#596676">Kolay güncelleme</text>
  </g>

  <g filter="url(#soft)">
    <rect x="423" y="270" width="161" height="33" rx="13" fill="#ffffff" stroke="#d6e5ec"/>
    <circle cx="441" cy="286.5" r="8" fill="#e2f2e4"/>
    <path d="M437 286.5 H445" stroke="#59966e" stroke-width="1.7" stroke-linecap="round"/>
    <text x="458" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e6675">Boş liste denetimi</text>
