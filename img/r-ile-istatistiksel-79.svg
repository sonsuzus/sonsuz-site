  <text x="48" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#506676">Hipotez</text>
  <text x="121" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#637785">H₀: etki veya fark yok</text>
  <text x="48" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#506676">Çıktılar</text>
