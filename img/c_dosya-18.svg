<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7fb8d0"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e0c8"/>
      <stop offset="100%" stop-color="#8cc9a8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="100%" stop-color="#e8b88a"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c5f0"/>
      <stop offset="100%" stop-color="#b8a5dd"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6db3f2"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">C Dosya Giriş Çıkış Sistemi</text>

  <!-- Merkez: Akış kavramı -->
  <rect x="245" y="120" width="150" height="60" rx="14" fill="url(#center)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#fff">Akış</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f4fd">FILE * işaretçisi</text>

  <!-- Üst: C Programı -->
  <rect x="270" y="40" width="100" height="40" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="320" y="64" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a4a">C Programı</text>

  <!-- Üst-akış bağlantısı -->
  <path d="M320 80 L320 115" stroke="#4a90d9" stroke-width="2" fill="none"/>
  <polygon points="315,112 320,122 325,112" fill="#4a90d9"/>

  <!-- Sol üst: Klavye -->
  <rect x="30" y="80" width="120" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="90" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a2a">Klavye</text>
  <text x="90" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c5a3a">donanım aygıtı</text>

  <!-- Sol alt: Disk dosyası -->
  <rect x="30" y="200" width="120" height="50" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="90" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2a1a">Disk Dosyası</text>
  <text x="90" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a3a2a">kalıcı veri</text>

  <!-- Sağ üst: Ekran -->
  <rect x="490" y="80" width="120" height="50" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="550" y="102" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a2a">Ekran</text>
  <text x="550" y="118" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c5a3a">çıktı aygıtı</text>

  <!-- Sağ alt: Yazıcı -->
  <rect x="490" y="200" width="120" height="50" rx="10" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="550" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a1a4a">Yazıcı</text>
  <text x="550" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a2a6a">çıktı aygıtı</text>

  <!-- Akıştan aygıtlara bağlantılar -->
  <!-- Akış -> Klavye -->
  <path d="M245 140 L155 115" stroke="#5a9a6a" stroke-width="2" fill="none"/>
  <polygon points="160,112 150,114 157,120" fill="#5a9a6a"/>

  <!-- Akış -> Disk -->
  <path d="M245 160 L155 220" stroke="#d48a5a" stroke-width="2" fill="none"/>
  <polygon points="160,217 150,222 162,224" fill="#d48a5a"/>

  <!-- Akış -> Ekran -->
  <path d="M395 140 L485 115" stroke="#5a9a6a" stroke-width="2" fill="none"/>
  <polygon points="480,112 490,114 483,120" fill="#5a9a6a"/>

  <!-- Akış -> Yazıcı -->
  <path d="M395 160 L485 220" stroke="#8a7ac0" stroke-width="2" fill="none"/>
  <polygon points="480,217 490,222 478,224" fill="#8a7ac0"/>

  <!-- Alt not -->
  <text x="320" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">stdio.h içindeki FILE yapısı ile tüm aygıtlara erişim</text>

  <!-- Çevresel oklar (soyut döngü) -->
  <path d="M320 190 L320 210" stroke="#4a90d9" stroke-width="1.5" fill="none" opacity="0.4"/>
  <polygon points="316,207 320,214 324,207" fill="#4a90d9" opacity="0.4"/>
</svg>