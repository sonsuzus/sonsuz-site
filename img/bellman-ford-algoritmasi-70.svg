  <circle cx="523" cy="184" r="12" fill="#f6b8af"/>
  <text x="519" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a3d3a">B</text>
  <circle cx="507" cy="205" r="12" fill="#f6b8af"/>
  <text x="503" y="209" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8a3d3a">C</text>

  <rect x="546" y="169" width="28" height="28" rx="9" fill="#f29a8f"/>
  <text x="555" y="189" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="700" fill="#ffffff">!</text>
  <text x="454" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a55350">Negatif döngü</text>

  <path d="M269 280 L541 280" stroke="#d2dce4" stroke-width="1.5"/>
  <circle cx="269" cy="280" r="5" fill="#7aaee0"/>
  <circle cx="405" cy="280" r="5" fill="#a98cdb"/>
  <circle cx="541" cy="280" r="5" fill="#e87f76"/>
  <text x="280" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60758a">mesafeler yayılır</text>
  <text x="416" y="285" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#60758a">iyileşme sürerse: uyarı</text>
