<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#71849a" flood-opacity="0.20"/>
    </filter>
    <filter id="hafifGolge" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#71849a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arka)"/>
  <circle cx="82" cy="42" r="66" fill="#dceeff" opacity="0.55"/>
  <circle cx="589" cy="280" r="86" fill="#dff2de" opacity="0.55"/>

  <rect x="24" y="24" width="592" height="272" rx="22" fill="url(#panel)" filter="url(#golge)"/>

  <text x="48" y="55" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43556b">BELLMAN-FORD</text>
  <text x="48" y="74" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">Kenarları yinele, maliyetleri yay, döngüyü denetle</text>

