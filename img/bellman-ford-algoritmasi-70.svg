  <circle cx="105" cy="169" r="17" fill="#a9d3f5"/>
  <text x="101" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#284a6b">S</text>
  <text x="79" y="217" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45647d">d[S] = 0</text>
  <text x="67" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718096">diğerleri: ∞</text>

