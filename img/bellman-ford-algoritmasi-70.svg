  <text x="239" y="239" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f5075">d[V] ← min(d[V], d[U]+w)</text>

  <path d="M394 169 L433 169" stroke="#7195b6" stroke-width="2.5" fill="none"/>
  <polygon points="433,169 424,164 424,174" fill="#7195b6"/>

