  <text x="228" y="141" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7b6b92">|V| − 1 tur</text>

  <circle cx="246" cy="190" r="20" fill="#cbb9ec"/>
  <text x="242" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#51406e">U</text>
  <circle cx="348" cy="190" r="20" fill="#b4dfc2"/>
  <text x="344" y="194" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345f47">V</text>

