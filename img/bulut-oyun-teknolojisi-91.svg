  <g filter="url(#shadow)">
    <rect x="381" y="62" width="211" height="194" rx="24" fill="#ffffff"/>
    <rect x="397" y="77" width="179" height="31" rx="11" fill="#e4f2e8"/>
    <circle cx="416" cy="92.5" r="7" fill="#78c598"/>
    <rect x="431" y="87" width="72" height="11" rx="5.5" fill="#a5cdb3"/>
    <circle cx="550" cy="92.5" r="4" fill="#72bf91"/>
    
    <rect x="397" y="117" width="179" height="31" rx="11" fill="#f4e9fc"/>
    <circle cx="416" cy="132.5" r="7" fill="#b580d3"/>
    <rect x="431" y="127" width="91" height="11" rx="5.5" fill="#d2b3e4"/>
    <circle cx="550" cy="132.5" r="4" fill="#b580d3"/>

    <rect x="397" y="157" width="179" height="31" rx="11" fill="#fff2d9"/>
    <circle cx="416" cy="172.5" r="7" fill="#e6ad56"/>
    <rect x="431" y="167" width="104" height="11" rx="5.5" fill="#efd09b"/>
    <circle cx="550" cy="172.5" r="4" fill="#e6ad56"/>

    <rect x="397" y="197" width="179" height="43" rx="11" fill="#e4effc"/>
    <rect x="411" y="207" width="67" height="7" rx="3.5" fill="#91b9dc"/>
    <rect x="411" y="221" width="112" height="7" rx="3.5" fill="#bed4e9"/>
    <circle cx="550" cy="218" r="11" fill="#80b5dd"/>
    <path d="M545 218 L549 222 L556 214" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="486.5" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43715a">Oyun motoru</text>
  <text x="486.5" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76518d">GPU kare üretimi</text>
  <text x="486.5" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#966c2c">Video kodlayıcı</text>
  <text x="486.5" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385c78">Veri merkezi</text>

  <!-- video return route -->
  <path d="M381 219 C342 219 337 235 281 235 C239 235 221 226 194 226" fill="none" stroke="#71b998" stroke-width="4" stroke-linecap="round"/>
  <polygon points="194,220 182,226 194,232" fill="#71b998"/>
  <g filter="url(#smallShadow)">
    <rect x="260" y="249" width="117" height="27" rx="13.5" fill="#e4f5ea"/>
    <text x="318.5" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397258">Sıkıştırılmış video</text>
  </g>

  <!-- latency -->
  <g filter="url(#smallShadow)">
    <rect x="222" y="286" width="196" height="24" rx="12" fill="#ffffff"/>
    <circle cx="238" cy="298" r="6" fill="#efb85d"/>
    <text x="322" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d7c">Toplam gecikme: yaklaşık 67 ms</text>
