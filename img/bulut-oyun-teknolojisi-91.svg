  <g filter="url(#smallShadow)">
    <path d="M228 86 C228 73 239 64 252 64 C257 50 270 41 286 41 C304 41 319 53 322 69 C338 67 352 78 352 93 C352 108 340 119 325 119 L252 119 C238 119 228 106 228 93 C228 90 228 88 228 86 Z" fill="url(#net)"/>
    <circle cx="269" cy="86" r="4" fill="#ffffff"/>
    <circle cx="289" cy="75" r="4" fill="#ffffff"/>
    <circle cx="310" cy="92" r="4" fill="#ffffff"/>
    <path d="M272 84 L286 77 M292 77 L307 90" stroke="#5ca1b7" stroke-width="2"/>
  </g>
  <text x="290" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#45677b">İNTERNET</text>
  <text x="290" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Ping ve jitter</text>

