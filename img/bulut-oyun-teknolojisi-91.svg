    <rect x="86" y="180" width="56" height="7" rx="3.5" fill="#c4d5df"/>
    <rect x="102" y="187" width="24" height="21" rx="4" fill="#c4d5df"/>
    <rect x="74" y="208" width="80" height="6" rx="3" fill="#aabdc8"/>
  </g>
  <text x="114" y="230" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36546b">OYUNCU CİHAZI</text>
  <text x="114" y="247" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607b8b">Ekran ve kontrol</text>

  <!-- Controller -->
  <g filter="url(#smallShadow)">
    <path d="M69 263 C59 253 60 237 72 232 C81 228 89 235 95 241 L133 241 C140 235 147 229 157 232 C169 236 171 253 161 263 C154 270 145 266 138 257 L91 257 C84 266 76 270 69 263 Z" fill="#b5d8f3"/>
    <rect x="79" y="244" width="14" height="4" rx="2" fill="#477a9c"/>
    <rect x="84" y="239" width="4" height="14" rx="2" fill="#477a9c"/>
    <circle cx="146" cy="244" r="3" fill="#ec8fa1"/>
    <circle cx="155" cy="250" r="3" fill="#7dc69d"/>
  </g>

  <!-- Input route -->
  <path d="M193 199 C231 199 234 180 267 180" fill="none" stroke="#719bb7" stroke-width="3" stroke-linecap="round"/>
  <polygon points="267,174 279,180 267,186" fill="#719bb7"/>
  <g filter="url(#smallShadow)">
    <rect x="201" y="165" width="77" height="27" rx="13.5" fill="#e5f2fc"/>
    <text x="239.5" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f647b">Komut paketi</text>
  </g>

