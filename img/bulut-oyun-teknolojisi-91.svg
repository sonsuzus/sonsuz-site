<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="net" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9d8fa"/>
      <stop offset="100%" stop-color="#a8e5ca"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6f8da0" flood-opacity="0.2"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7891a2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="37" cy="35" r="56" fill="#dceefa" opacity="0.58"/>
  <circle cx="605" cy="285" r="82" fill="#dff2df" opacity="0.65"/>
  <circle cx="556" cy="38" r="30" fill="#fff0c9" opacity="0.55"/>

  <text x="320" y="29" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38566b">BULUT OYUN VERİ DÖNGÜSÜ</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="38" y="83" width="152" height="158" rx="22" fill="#ffffff"/>
    <rect x="51" y="97" width="126" height="76" rx="12" fill="#d8edff"/>
