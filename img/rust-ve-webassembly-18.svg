<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7f0"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c4b8"/>
      <stop offset="100%" stop-color="#d4a090"/>
    </linearGradient>
    <linearGradient id="wasmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d4e8"/>
      <stop offset="100%" stop-color="#8fb8d4"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6a0"/>
      <stop offset="100%" stop-color="#d4c870"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e0d0"/>
      <stop offset="100%" stop-color="#a0c8b0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Rust + WebAssembly Mimarisi</text>

  <!-- Tarayıcı Kapsayıcı -->
  <rect x="20" y="45" width="600" height="255" rx="14" fill="#ffffff20" stroke="#a0c0b0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="40" y="65" font-size="11" fill="#4a6a5a" font-weight="bold">TARAYICI</text>

  <!-- JavaScript Katmanı -->
  <rect x="40" y="80" width="180" height="90" rx="10" fill="url(#jsGrad)" filter="url(#shadow)"/>
  <text x="130" y="105" text-anchor="middle" font-weight="bold" fill="#5a4a20">JavaScript</text>
  <text x="130" y="122" text-anchor="middle" fill="#5a4a20">Arayüz ve Olay Yönetimi</text>
  <text x="130" y="139" text-anchor="middle" fill="#5a4a20">DOM Erişimi</text>
  <text x="130" y="156" text-anchor="middle" fill="#5a4a20">Çağrı Köprüsü</text>

  <!-- Rust Katmanı -->
  <rect x="420" y="80" width="180" height="90" rx="10" fill="url(#rustGrad)" filter="url(#shadow)"/>
  <text x="510" y="105" text-anchor="middle" font-weight="bold" fill="#5a2010">Rust Motoru</text>
  <text x="510" y="122" text-anchor="middle" fill="#5a2010">Sahipik Modeli</text>
  <text x="510" y="139" text-anchor="middle" fill="#5a2010">Güvenli Bellek</text>
  <text x="510" y="156" text-anchor="middle" fill="#5a2010">Hesaplama Çekirdeği</text>

  <!-- WASM Katmanı -->
  <rect x="230" y="80" width="170" height="90" rx="10" fill="url(#wasmGrad)" filter="url(#shadow)"/>
  <text x="315" y="105" text-anchor="middle" font-weight="bold" fill="#1a3a5a">WebAssembly</text>
  <text x="315" y="122" text-anchor="middle" fill="#1a3a5a">İkili Komut Seti</text>
  <text x="315" y="139" text-anchor="middle" fill="#1a3a5a">Doğrulanabilir</text>
  <text x="315" y="156" text-anchor="middle" fill="#1a3a5a">Sanal Makine</text>

  <!-- Ok: JS -> WASM -->
  <path d="M220 125 L228 125" stroke="#5a4a20" stroke-width="2" fill="none"/>
  <polygon points="232,125 224,121 224,129" fill="#5a4a20"/>

  <!-- Ok: WASM -> Rust -->
  <path d="M400 125 L418 125" stroke="#5a2010" stroke-width="2" fill="none"/>
  <polygon points="422,125 414,121 414,129" fill="#5a2010"/>

  <!-- Veri Transferi Etiketi -->
  <text x="315" y="75" text-anchor="middle" font-size="10" fill="#4a6a8a">sınır geçişi</text>

  <!-- Performans Bileşenleri -->
  <text x="40" y="205" font-size="11" font-weight="bold" fill="#2c5a3a">Performans Denklemi</text>

  <rect x="40" y="215" width="130" height="35" rx="8" fill="#d0e8d8" filter="url(#shadow)"/>
  <text x="105" y="237" text-anchor="middle" fill="#2c5a3a">T hesap</text>

  <text x="185" y="238" text-anchor="middle" fill="#2c5a3a" font-size="14">+</text>

  <rect x="205" y="215" width="130" height="35" rx="8" fill="#d0d8e8" filter="url(#shadow)"/>
  <text x="270" y="237" text-anchor="middle" fill="#2c3a5a">T veri transferi</text>

  <text x="350" y="238" text-anchor="middle" fill="#2c5a3a" font-size="14">+</text>

  <rect x="365" y="215" width="130" height="35" rx="8" fill="#e0d0e8" filter="url(#shadow)"/>
  <text x="430" y="237" text-anchor="middle" fill="#4a2c5a">T başlatma</text>

  <!-- Öneri Kutusu -->
  <rect x="520" y="215" width="80" height="35" rx="8" fill="#e8e0d0" filter="url(#shadow)"/>
  <text x="560" y="237" text-anchor="middle" fill="#5a4a2c">Ölç + Taşı</text>

  <!-- Alt Bilgi -->
  <rect x="40" y="265" width="560" height="25" rx="6" fill="#b8d4c8" opacity="0.6"/>
  <text x="320" y="282" text-anchor="middle" font-size="11" fill="#2c4a3a">Büyük paketler hâlinde hesaplama gönder, küçük çağrılardan kaçın</text>

  <!-- wasm-pack Araç Zinciri -->
  <rect x="40" y="80" width="0" height="0" fill="none"/>
  <text x="560" y="300" text-anchor="middle" font-size="10" fill="#6a8a7a">wasm-pack + wasm-bindgen</text>
</svg>