<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7ddff"/>
      <stop offset="100%" stop-color="#d6c8f5"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a5" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a5" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="42" r="70" fill="#dff1f6" opacity="0.48"/>
  <circle cx="582" cy="279" r="96" fill="#e1f0d7" opacity="0.43"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39536b">Birebir Tipler: Kesin Değer Sınırı</text>

  <g filter="url(#shadow)">
    <rect x="36" y="82" width="157" height="148" rx="22" fill="#ffffff"/>
  </g>
  <text x="114" y="111" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#486176">Geniş Tip</text>
  <rect x="56" y="126" width="117" height="30" rx="12" fill="#dceefa"/>
  <text x="114" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35627d">string</text>
  <rect x="56" y="166" width="117" height="30" rx="12" fill="#f4e8d8"/>
  <text x="114" y="186" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#835b38">rastgele değer</text>
  <text x="114" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#78909f">geniş küme</text>

  <path d="M198 155 H234" stroke="#7290a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="242,155 232,149 232,161" fill="#7290a6"/>

  <g filter="url(#shadow)">
    <rect x="246" y="68" width="150" height="173" rx="25" fill="url(#gate)"/>
  </g>
  <circle cx="321" cy="105" r="23" fill="#ffffff" opacity="0.8"/>
  <path d="M310 105 L318 113 L334 96" fill="none" stroke="#7560a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="321" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#514274">Tip Denetimi</text>
  <text x="321" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66558b">"başlat" | "durdur"</text>
  <rect x="271" y="187" width="100" height="29" rx="10" fill="#ffffff" opacity="0.72"/>
  <text x="321" y="206" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d4d80">birleşim tipi</text>

  <path d="M400 127 H432" stroke="#5b9b83" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="440,127 430,121 430,133" fill="#5b9b83"/>
  <path d="M400 192 C420 192 418 261 440 261" fill="none" stroke="#d77972" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="448,261 438,255 438,267" fill="#d77972"/>

  <g filter="url(#softShadow)">
    <rect x="445" y="72" width="159" height="112" rx="20" fill="#ffffff"/>
  </g>
  <text x="524" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#477665">Geçerli Değerler</text>
  <rect x="462" y="116" width="61" height="37" rx="12" fill="#d8f0e2"/>
  <text x="492" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#32745d">başlat</text>
  <rect x="529" y="116" width="59" height="37" rx="12" fill="#d8f0e2"/>
  <text x="558" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#32745d">durdur</text>
  <text x="524" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#679181">otomatik tamamlama</text>

  <g filter="url(#softShadow)">
    <rect x="445" y="223" width="159" height="70" rx="19" fill="#fff7f5"/>
  </g>
  <circle cx="472" cy="258" r="15" fill="#f6d8d5"/>
  <path d="M466 252 L478 264 M478 252 L466 264" stroke="#c96461" stroke-width="2.4" stroke-linecap="round"/>
  <text x="538" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#a9504d">Geçersiz</text>
  <text x="538" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b66a66">derleme hatası</text>

  <text x="321" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#687f90">Değer kümesi daralır, tip güvenliği artar</text>
</svg>