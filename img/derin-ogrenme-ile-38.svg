<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeeff"/>
      <stop offset="1" stop-color="#bcdcf4"/>
    </linearGradient>
    <linearGradient id="cnnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2d8ff"/>
      <stop offset="1" stop-color="#cdbff2"/>
    </linearGradient>
    <linearGradient id="humanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3cf"/>
      <stop offset="1" stop-color="#f5c9a9"/>
    </linearGradient>
    <linearGradient id="resultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f1df"/>
      <stop offset="1" stop-color="#b9e4c9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7290a8" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7a91a2" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="42" r="86" fill="#d9edf7" opacity="0.38"/>
  <circle cx="579" cy="275" r="104" fill="#dbeed9" opacity="0.42"/>
  <path d="M38 276 C150 240 173 295 275 271 S469 222 604 253" fill="none" stroke="#b9d9d2" stroke-width="1.5" opacity="0.5"/>

  <!-- bağlantılar -->
  <path d="M151 160 L196 160" fill="none" stroke="#87a6b5" stroke-width="3" stroke-linecap="round"/>
  <polygon points="196,160 187,154 187,166" fill="#87a6b5"/>

  <path d="M353 137 C375 119 388 110 408 106" fill="none" stroke="#8d9bb2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="408,106 398,102 401,112" fill="#8d9bb2"/>

  <path d="M353 182 C376 201 389 211 408 215" fill="none" stroke="#8d9bb2" stroke-width="3" stroke-linecap="round"/>
  <polygon points="408,215 400,208 398,218" fill="#8d9bb2"/>

  <path d="M524 159 L558 159" fill="none" stroke="#7ca490" stroke-width="3" stroke-linecap="round"/>
  <polygon points="558,159 549,153 549,165" fill="#7ca490"/>

  <!-- görüntü -->
  <g filter="url(#shadow)">
    <rect x="28" y="106" width="123" height="108" rx="20" fill="url(#scanGrad)"/>
    <rect x="40" y="121" width="54" height="65" rx="10" fill="#f6fbff" opacity="0.82"/>
    <circle cx="67" cy="153" r="21" fill="#b9d2e2"/>
    <path d="M54 143 C59 134 75 134 80 143 L80 168 C75 174 59 174 54 168Z" fill="#86aabd" opacity="0.72"/>
    <circle cx="74" cy="157" r="5" fill="#f08f8f"/>
    <circle cx="74" cy="157" r="10" fill="none" stroke="#e96e74" stroke-width="1.5" opacity="0.8"/>
    <path d="M106 133 L136 133 M106 144 L129 144 M106 155 L135 155 M106 166 L123 166" stroke="#79a1b7" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
    <text x="89.5" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#31546a" font-weight="600">Tıbbi görüntü</text>
  </g>

  <!-- CNN -->
  <g filter="url(#shadow)">
    <rect x="198" y="94" width="155" height="132" rx="22" fill="url(#cnnGrad)"/>
    <text x="275.5" y="119" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c4075" font-weight="700">CNN analizi</text>

    <rect x="217" y="134" width="26" height="51" rx="5" fill="#f5f2ff"/>
    <path d="M222 143 L238 143 M222 152 L238 152 M222 161 L238 161 M222 170 L238 170 M222 179 L238 179" stroke="#9986c8" stroke-width="2"/>
    <rect x="252" y="140" width="26" height="40" rx="5" fill="#eeeaff"/>
    <path d="M257 148 L273 148 M257 157 L273 157 M257 166 L273 166 M257 175 L273 175" stroke="#8d7abd" stroke-width="2"/>
    <rect x="287" y="146" width="26" height="28" rx="5" fill="#e6e0fa"/>
    <circle cx="300" cy="155" r="3.5" fill="#7964af"/>
    <circle cx="300" cy="166" r="3.5" fill="#7964af"/>
    <path d="M243 159 L252 159 M278 159 L287 159" stroke="#8d7abd" stroke-width="2"/>
    <path d="M319 159 L331 159" stroke="#7964af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="337" cy="159" r="8" fill="#806bb5"/>
    <circle cx="337" cy="159" r="3" fill="#f7f5ff"/>
    <text x="275.5" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#594986">Örüntü ve olasılık</text>
  </g>

  <!-- üst uzman -->
  <g filter="url(#softShadow)">
    <rect x="409" y="59" width="115" height="91" rx="19" fill="url(#humanGrad)"/>
    <circle cx="442" cy="91" r="13" fill="#fff7f0"/>
    <circle cx="442" cy="87" r="5" fill="#c78d72"/>
    <path d="M432 105 C434 96 450 96 452 105 L452 113 L432 113Z" fill="#c78d72"/>
    <rect x="465" y="80" width="39" height="8" rx="4" fill="#c9876d" opacity="0.72"/>
    <rect x="465" y="96" width="29" height="8" rx="4" fill="#c9876d" opacity="0.55"/>
    <text x="466.5" y="134" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#754934" font-weight="600">Radyolog</text>
  </g>

  <!-- alt klinik bağlam -->
  <g filter="url(#softShadow)">
    <rect x="409" y="170" width="115" height="91" rx="19" fill="#d8edf0"/>
    <circle cx="438" cy="199" r="15" fill="#f7ffff"/>
    <path d="M438 188 L438 210 M427 199 L449 199" stroke="#5596a2" stroke-width="4" stroke-linecap="round"/>
    <rect x="464" y="187" width="40" height="8" rx="4" fill="#68a8b0" opacity="0.75"/>
    <rect x="464" y="203" width="29" height="8" rx="4" fill="#68a8b0" opacity="0.55"/>
    <text x="466.5" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356b74" font-weight="600">Klinik bağlam</text>
  </g>

  <!-- karar -->
  <g filter="url(#shadow)">
    <rect x="559" y="113" width="58" height="95" rx="20" fill="url(#resultGrad)"/>
    <circle cx="588" cy="143" r="15" fill="#f7fff8"/>
    <path d="M580 143 L586 149 L598 136" fill="none" stroke="#4b9d6d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M575 169 L601 169 M579 178 L597 178" stroke="#6dab83" stroke-width="3" stroke-linecap="round"/>
    <text x="588" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#367252" font-weight="700">Karar</text>
  </g>

  <!-- alt denetim şeridi -->
  <g filter="url(#softShadow)">
    <rect x="170" y="263" width="299" height="33" rx="16" fill="#ffffff" opacity="0.86"/>
    <circle cx="192" cy="279.5" r="7" fill="#7eafd0"/>
    <path d="M207 279.5 L222 279.5" stroke="#9eb8c7" stroke-width="2"/>
    <circle cx="236" cy="279.5" r="7" fill="#927bc0"/>
    <path d="M251 279.5 L266 279.5" stroke="#9eb8c7" stroke-width="2"/>
    <circle cx="280" cy="279.5" r="7" fill="#e09b76"/>
    <path d="M295 279.5 L310 279.5" stroke="#9eb8c7" stroke-width="2"/>
    <circle cx="324" cy="279.5" r="7" fill="#69a982"/>
    <text x="393" y="283.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#506e76">Doğrulama ve denetim</text>
  </g>
</svg>