<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c9bd1"/>
      <stop offset="100%" stop-color="#4a7fb5"/>
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#8bc4d8"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5e3c9"/>
      <stop offset="100%" stop-color="#9ad4b0"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d9a8"/>
      <stop offset="100%" stop-color="#e8c48a"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b8e8"/>
      <stop offset="100%" stop-color="#c0a0d8"/>
    </linearGradient>
    <linearGradient id="algGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0a8a8"/>
      <stop offset="100%" stop-color="#d88a8a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#3a5a7a">Problem Çözme ve Algoritma</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="55" width="150" height="40" rx="20" fill="url(#centerGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Sistematik Yaklaşım</text>

  <!-- 1. Adım -->
  <rect x="40" y="120" width="120" height="36" rx="10" fill="url(#stepGrad1)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="100" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a4a5a">1. Anla ve Kabul Et</text>

  <!-- 2. Adım -->
  <rect x="190" y="120" width="120" height="36" rx="10" fill="url(#stepGrad2)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="250" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a5a3a">2. Parçalara Böl</text>

  <!-- 3. Adım -->
  <rect x="340" y="120" width="120" height="36" rx="10" fill="url(#stepGrad3)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="400" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#5a4a2a">3. Basitten Karmaşığa</text>

  <!-- 4. Adım -->
  <rect x="490" y="120" width="120" height="36" rx="10" fill="url(#stepGrad4)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="550" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#4a2a5a">4. Genelle ve Kontrol Et</text>

  <!-- Merkezden adımlara oklar -->
  <!-- Ok 1 -->
  <path d="M 260 95 L 110 118" stroke="#5a8ab5" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polygon points="110,118 120,114 114,124" fill="#5a8ab5" opacity="0.7"/>

  <!-- Ok 2 -->
  <path d="M 290 95 L 250 118" stroke="#5a8ab5" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polygon points="250,118 260,114 254,124" fill="#5a8ab5" opacity="0.7"/>

  <!-- Ok 3 -->
  <path d="M 350 95 L 390 118" stroke="#5a8ab5" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polygon points="390,118 380,114 386,124" fill="#5a8ab5" opacity="0.7"/>

  <!-- Ok 4 -->
  <path d="M 380 95 L 530 118" stroke="#5a8ab5" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polygon points="530,118 520,114 526,124" fill="#5a8ab5" opacity="0.7"/>

  <!-- Algoritma kutusu -->
  <rect x="220" y="185" width="200" height="40" rx="12" fill="url(#algGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a2a2a">Algoritma</text>

  <!-- Adımlardan algoritmaya oklar -->
  <path d="M 100 156 L 250 183" stroke="#b07070" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="250,183 240,180 246,189" fill="#b07070" opacity="0.6"/>

  <path d="M 250 156 L 290 183" stroke="#b07070" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="290,183 280,180 286,189" fill="#b07070" opacity="0.6"/>

  <path d="M 400 156 L 360 183" stroke="#b07070" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="360,183 370,180 364,189" fill="#b07070" opacity="0.6"/>

  <path d="M 550 156 L 390 183" stroke="#b07070" stroke-width="1.5" fill="none" opacity="0.6"/>
  <polygon points="390,183 400,180 394,189" fill="#b07070" opacity="0.6"/>

  <!-- Algoritma kriterleri -->
  <rect x="60" y="250" width="110" height="30" rx="8" fill="#e8f0e8" stroke="#8ab58a" stroke-width="1" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="115" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a5a3a">Girdi</text>

  <rect x="190" y="250" width="110" height="30" rx="8" fill="#e8f0e8" stroke="#8ab58a" stroke-width="1" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="245" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a5a3a">Çıktı</text>

  <rect x="320" y="250" width="110" height="30" rx="8" fill="#e8f0e8" stroke="#8ab58a" stroke-width="1" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="375" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a5a3a">Açıklık</text>

  <rect x="450" y="250" width="110" height="30" rx="8" fill="#e8f0e8" stroke="#8ab58a" stroke-width="1" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="505" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a5a3a">Sonluluk</text>

  <!-- Algoritmadan kriterlere oklar -->
  <path d="M 240 225 L 125 248" stroke="#8ab58a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <polygon points="125,248 136,245 130,254" fill="#8ab58a" opacity="0.6"/>

  <path d="M 280 225 L 240 248" stroke="#8ab58a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <polygon points="240,248 250,245 244,254" fill="#8ab58a" opacity="0.6"/>

  <path d="M 340 225 L 370 248" stroke="#8ab58a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <polygon points="370,248 360,245 366,254" fill="#8ab58a" opacity="0.6"/>

  <path d="M 400 225 L 495 248" stroke="#8ab58a" stroke-width="1.2" fill="none" opacity="0.6"/>
  <polygon points="495,248 484,245 490,254" fill="#8ab58a" opacity="0.6"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#7a9a7a" opacity="0.7">Descartes Yöntemi ve Alharezmi Mirası</text>
</svg>