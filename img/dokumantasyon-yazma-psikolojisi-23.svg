  <text x="320" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526a71">Yaz · İncele · Güncelle</text>

  <path d="M320 206 V224" stroke="#789b89" stroke-width="3" stroke-linecap="round"/>
  <polygon points="320,231 314,221 326,221" fill="#789b89"/>

  <path d="M92 253 C138 292 210 300 246 280" fill="none" stroke="#9fc4e3" stroke-width="2" stroke-dasharray="5 5" opacity="0.9"/>
  <polygon points="251,277 240,277 246,287" fill="#9fc4e3"/>
  <path d="M394 280 C435 300 504 290 548 253" fill="none" stroke="#d9b879" stroke-width="2" stroke-dasharray="5 5" opacity="0.9"/>
  <polygon points="553,249 542,252 550,260" fill="#d9b879"/>

  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647b80">Bilgi paylaşımı · sürdürülebilir ekip hafızası</text>
