<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9c8f2"/>
      <stop offset="50%" stop-color="#b9dfd0"/>
      <stop offset="100%" stop-color="#f3d4a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6d8490" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#59717d" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="83" cy="52" r="48" fill="#dceeff" opacity="0.55"/>
  <circle cx="569" cy="271" r="72" fill="#e1f1d9" opacity="0.55"/>
  <circle cx="555" cy="46" r="25" fill="#fff0d5" opacity="0.7"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385262">Bilgi boşluğunu dokümantasyon kapatır</text>

  <g filter="url(#shadow)">
    <rect x="42" y="82" width="146" height="158" rx="20" fill="#e8f2ff"/>
    <rect x="452" y="82" width="146" height="158" rx="20" fill="#fff2dd"/>
    <rect x="212" y="116" width="216" height="90" rx="22" fill="url(#bridge)"/>
  </g>

  <text x="115" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35628b">Geliştirici</text>
  <text x="525" y="108" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#96632e">Okuyucu</text>

  <g filter="url(#softShadow)">
    <rect x="65" y="125" width="100" height="38" rx="10" fill="#ffffff"/>
    <rect x="65" y="177" width="100" height="38" rx="10" fill="#ffffff"/>
    <rect x="475" y="125" width="100" height="38" rx="10" fill="#ffffff"/>
    <rect x="475" y="177" width="100" height="38" rx="10" fill="#ffffff"/>
  </g>

  <text x="115" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#415a68">Kod bilgisi</text>
  <text x="115" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#415a68">Karar gerekçesi</text>
  <text x="525" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#415a68">Ön bilgi</text>
  <text x="525" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#415a68">Doğru karar</text>

  <path d="M188 145 H208" stroke="#6e9dc5" stroke-width="3" stroke-linecap="round"/>
  <polygon points="212,145 203,140 203,150" fill="#6e9dc5"/>
  <path d="M428 145 H448" stroke="#b78951" stroke-width="3" stroke-linecap="round"/>
  <polygon points="452,145 443,140 443,150" fill="#b78951"/>

  <text x="320" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b62">Dokümantasyon</text>
  <text x="320" y="163" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365c64">Amaç · Model · Kullanım</text>
  <text x="320" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#365c64">Sınırlar · Gerekçe</text>

