<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1ecf1"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <linearGradient id="box6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <linearGradient id="box7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Otomatik Programlama Rüyası</text>

  <!-- Antik Çağ Kutusu -->
  <rect x="30" y="50" width="120" height="60" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="90" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5276">Antik Otomatlar</text>
  <text x="90" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a5276">Mekanik Davranış</text>

  <!-- Ok 1 -->
  <path d="M150 80 L190 80" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="195,80 185,75 185,85" fill="#5d6d7e"/>

  <!-- Mekanik Hesaplama Kutusu -->
  <rect x="200" y="50" width="130" height="60" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="265" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7b4b00">Mekanik Hesaplama</text>
  <text x="265" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7b4b00">Leibniz, Babbage</text>
  <text x="265" y="100" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7b4b00">Ada Lovelace</text>

  <!-- Ok 2 -->
  <path d="M330 80 L370 80" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="375,80 365,75 365,85" fill="#5d6d7e"/>

  <!-- Derleyiciler Kutusu -->
  <rect x="380" y="50" width="120" height="60" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="440" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Derleyiciler</text>
  <text x="440" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1b5e20">Soyut Kod</text>

  <!-- Ok 3 -->
  <path d="M500 80 L540 80" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="545,80 535,75 535,85" fill="#5d6d7e"/>

  <!-- Program Sentezi Kutusu -->
  <rect x="30" y="170" width="130" height="60" rx="10" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="95" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#880e4f">Program Sentezi</text>
  <text x="95" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#880e4f">Arama Uzayı</text>

  <!-- Ok 4 -->
  <path d="M160 200 L200 200" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="205,200 195,195 195,205" fill="#5d6d7e"/>

  <!-- Uzman Sistemler Kutusu -->
  <rect x="210" y="170" width="120" height="60" rx="10" fill="url(#box5)" filter="url(#shadow)"/>
  <text x="270" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#283593">Uzman Sistemler</text>
  <text x="270" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#283593">Kural Tabanlı</text>

  <!-- Ok 5 -->
  <path d="M330 200 L370 200" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="375,200 365,195 365,205" fill="#5d6d7e"/>

  <!-- Genetik Programlama Kutusu -->
  <rect x="380" y="170" width="120" height="60" rx="10" fill="url(#box6)" filter="url(#shadow)"/>
  <text x="440" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Genetik Programlama</text>
  <text x="440" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7d6608">Evrimsel Arama</text>

  <!-- Ok 6 -->
  <path d="M500 200 L540 200" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="545,200 535,195 535,205" fill="#5d6d7e"/>

  <!-- LLM Kutusu -->
  <rect x="210" y="260" width="220" height="45" rx="10" fill="url(#box7)" filter="url(#shadow)"/>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a148c">Büyük Dil Modelleri</text>
  <text x="320" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a148c">İstatistiksel Öğrenme</text>

  <!-- Dikey Oklar -->
  <path d="M95 110 L95 170" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="95,175 90,165 100,165" fill="#5d6d7e"/>

  <path d="M440 110 L440 170" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="440,175 435,165 445,165" fill="#5d6d7e"/>

  <!-- LLM'ye birleşen oklar -->
  <path d="M270 230 L270 260" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="270,265 265,255 275,255" fill="#5d6d7e"/>

  <path d="M440 230 L440 260" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="440,265 435,255 445,255" fill="#5d6d7e"/>

  <!-- Yatay birleşme -->
  <path d="M270 260 L320 260" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <path d="M440 260 L370 260" stroke="#5d6d7e" stroke-width="2" fill="none"/>

  <!-- Durum formülü -->
  <rect x="510" y="260" width="110" height="45" rx="10" fill="#ffffff" filter="url(#shadow)" opacity="0.9"/>
  <text x="565" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Durum Formülü</text>
  <text x="565" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c3e50">S(t+1) = f(S(t), G)</text>

  <!-- Ok formüle -->
  <path d="M430 282 L510 282" stroke="#5d6d7e" stroke-width="2" fill="none"/>
  <polygon points="515,282 505,277 505,287" fill="#5d6d7e"/>

  <!-- Alt bilgi -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d" opacity="0.8">İnsan niyeti → Makine üretimi</text>
</svg>