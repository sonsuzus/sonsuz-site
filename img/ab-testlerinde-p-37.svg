<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="maviKart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9ddf6"/>
    </linearGradient>
    <linearGradient id="yesilKart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddf5df"/>
      <stop offset="100%" stop-color="#bde5c5"/>
    </linearGradient>
    <linearGradient id="morKart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee6ff"/>
      <stop offset="100%" stop-color="#dcccf5"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#58708a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#58708a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
