  <text x="480" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8c416a">MÜŞTERİ</text>
  <text x="480" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a36686">Boyut tablosu</text>

