    <circle cx="18" cy="14" r="5" fill="#76ba8b"/>
    <text x="31" y="18" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527064">Az tekrar</text>
    <path d="M94 14 L110 14" stroke="#99aab3" stroke-width="1.5"/>
    <polygon points="110,14 104,10 104,18" fill="#99aab3"/>
    <circle cx="129" cy="14" r="5" fill="#d89b71"/>
    <text x="142" y="18" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#756154">Daha çok JOIN</text>
  </g>
