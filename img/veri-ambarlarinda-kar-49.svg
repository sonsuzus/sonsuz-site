    <polygon points="451,100 442,99 446,107"/>
    <polygon points="186,237 195,230 190,241"/>
    <polygon points="454,237 445,230 450,241"/>
    <polygon points="89,100 97,95 97,105"/>
    <polygon points="129,57 124,65 134,65"/>
    <polygon points="553,100 545,95 545,105"/>
  </g>

  <!-- Fact -->
  <g filter="url(#shadow)">
