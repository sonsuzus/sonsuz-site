  </g>

  <text x="30" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#526c80">Kar Tanesi Şeması</text>
  <text x="30" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8193a1">Normalize boyutlar • daha az tekrar</text>

  <!-- Connections -->
  <g fill="none" stroke="#8da6b7" stroke-width="2.2" stroke-linecap="round">
    <path d="M267 154 L190 100"/>
    <path d="M373 154 L451 100"/>
    <path d="M267 182 L186 237"/>
    <path d="M373 182 L454 237"/>
    <path d="M129 100 L89 100"/>
    <path d="M129 100 L129 57"/>
    <path d="M512 100 L553 100"/>
  </g>
  <g fill="#8da6b7">
