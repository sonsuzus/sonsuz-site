  <text x="483" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39777a">TARİH</text>
  <text x="483" y="251" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#568e90">Gün • ay • yıl</text>

