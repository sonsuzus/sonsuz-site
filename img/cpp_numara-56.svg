<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Ana Başlık -->
  <text x="320" y="35" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">C++ Numaralandırma Yapısı</text>

  <!-- Merkez Kutu: Genel Sözdizimi -->
  <rect x="180" y="55" width="280" height="50" rx="10" fill="url(#box1)" filter="url(#shadow)"/>
  <text x="320" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5f" font-weight="bold">enum etiket-adı {liste}</text>
  <text x="320" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5f">değişken-listesi;</text>

  <!-- Ok: Merkezden örneğe -->
  <path d="M 320 105 L 320 125" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="314,123 320,133 326,123" fill="#64748b"/>

  <!-- Örnek Kutu -->
  <rect x="170" y="135" width="300" height="45" rx="10" fill="url(#box2)" filter="url(#shadow)"/>
  <text x="320" y="153" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5f" font-weight="bold">enum renk { mavi, turuncu, mor, siyah } e;</text>
  <text x="320" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">e değişkeni sadece listedeki değerleri alır</text>

  <!-- Sol Alt: Varsayılan Değerler -->
  <rect x="30" y="210" width="180" height="80" rx="10" fill="url(#box3)" filter="url(#shadow)"/>
  <text x="120" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5f" font-weight="bold">Varsayılan Değerler</text>
  <text x="120" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">mavi = 0</text>
  <text x="120" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">turuncu = 1</text>
  <text x="120" y="284" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">mor = 2, siyah = 3</text>

  <!-- Sağ Alt: Özel Değerler -->
  <rect x="430" y="210" width="180" height="80" rx="10" fill="url(#box4)" filter="url(#shadow)"/>
  <text x="520" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5f" font-weight="bold">Özel Değer Atama</text>
  <text x="520" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">mavi = 3, turuncu = 4</text>
  <text x="520" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">mor = 7, siyah = 8</text>

  <!-- Oklar: Örnekten alt kutulara -->
  <path d="M 230 180 L 140 205" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="146,200 136,208 148,212" fill="#64748b"/>

  <path d="M 410 180 L 500 205" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="494,200 504,208 492,212" fill="#64748b"/>

  <!-- Alt Orta: #define Karşılığı -->
  <rect x="230" y="245" width="180" height="45" rx="10" fill="url(#box5)" filter="url(#shadow)"/>
  <text x="320" y="263" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e3a5f" font-weight="bold">#define ile Eşdeğer</text>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">mavi 0, turuncu 1, mor 2, siyah 3</text>

  <!-- Ok: Sol alttan alt orta -->
  <path d="M 210 270 L 225 270" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="223,266 233,270 223,274" fill="#64748b"/>

  <!-- Ok: Sağ alttan alt orta -->
  <path d="M 430 270 L 415 270" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="417,266 407,270 417,274" fill="#64748b"/>
</svg>