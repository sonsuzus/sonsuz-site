  <path d="M430 161c8 18 10 36 20 53" fill="none" stroke="#9ab2b5" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Alt açıklama -->
  <g filter="url(#soft)">
    <rect x="76" y="266" width="488" height="31" rx="15.5" fill="#ffffff" opacity="0.88"/>
    <circle cx="102" cy="281.5" r="6" fill="#aa91d5"/>
    <text x="116" y="285.5" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#566c79">Taşlar → anlamlı kümeler → dikkat rotası → açıklanabilir karar</text>
