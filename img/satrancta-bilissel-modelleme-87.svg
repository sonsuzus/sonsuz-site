  <g filter="url(#shadow)">
    <rect x="452" y="181" width="157" height="71" rx="18" fill="#ffffff"/>
    <rect x="468" y="197" width="34" height="34" rx="11" fill="#e2f1ce"/>
    <path d="M476 208h18M476 214h13M476 220h9" stroke="#5f9270" stroke-width="2" stroke-linecap="round"/>
    <text x="519" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b5e69" font-weight="600">Öğrenme desteği</text>
    <text x="519" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71808a">Gerekçeli geri bildirim</text>
  </g>

