  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="119" fill="#ffffff" opacity="0.36"/>
  <circle cx="320" cy="160" r="93" fill="none" stroke="#c8dfdf" stroke-width="1.5" stroke-dasharray="4 6"/>

