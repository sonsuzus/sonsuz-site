    <rect x="468" y="80" width="34" height="34" rx="11" fill="#ffe0df"/>
    <path d="M477 101l6-8 5 4 6-9" fill="none" stroke="#be6662" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="519" y="91" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4b5e69" font-weight="600">Usta bakışı</text>
    <text x="519" y="111" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71808a">Öncelik tahmini</text>
