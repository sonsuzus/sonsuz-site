<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#58718c" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58718c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="588" cy="48" r="72" fill="#dceffc" opacity="0.52"/>
  <circle cx="42" cy="284" r="85" fill="#e1f3dc" opacity="0.42"/>

  <rect x="22" y="24" width="280" height="272" rx="22" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="48" y="54" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31485d">Üst üste binen kümeler</text>
  <text x="48" y="74" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7f91">Ortak alan iki kez sayılır</text>

  <circle cx="137" cy="159" r="73" fill="#92c9f4" opacity="0.60"/>
  <circle cx="206" cy="159" r="73" fill="#f6bd83" opacity="0.62"/>
  <circle cx="137" cy="159" r="73" fill="none" stroke="#5ca3d5" stroke-width="2"/>
  <circle cx="206" cy="159" r="73" fill="none" stroke="#dc9a54" stroke-width="2"/>

  <rect x="76" y="106" width="75" height="27" rx="13" fill="#eaf6ff" filter="url(#smallShadow)"/>
  <text x="113.5" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3279a9">Python · 30</text>

  <rect x="186" y="106" width="89" height="27" rx="13" fill="#fff1e2" filter="url(#smallShadow)"/>
  <text x="230.5" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#b36b25">JavaScript · 25</text>

  <ellipse cx="171.5" cy="159" rx="26" ry="37" fill="#c8b3dd" opacity="0.8"/>
  <text x="171.5" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#51416d">Ortak</text>
  <text x="171.5" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#51416d">10</text>

  <rect x="57" y="246" width="210" height="31" rx="12" fill="#eef5f2" stroke="#d6e6de"/>
  <text x="162" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356452">Birleşim: 30 + 25 − 10 = 45</text>

  <path d="M318 160 H343" fill="none" stroke="#7895a9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="350,160 340,154 340,166" fill="#7895a9"/>

  <rect x="365" y="24" width="253" height="272" rx="22" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="391" y="54" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31485d">Dahil etme – hariç tutma</text>
  <text x="391" y="74" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b7f91">Her eleman tam bir kez sayılır</text>

  <path d="M420 118 V226" fill="none" stroke="#c7d6df" stroke-width="2"/>
  <circle cx="420" cy="118" r="5" fill="#74b6e5"/>
  <circle cx="420" cy="172" r="5" fill="#e79a7c"/>
  <circle cx="420" cy="226" r="5" fill="#85c59c"/>

  <rect x="442" y="96" width="145" height="43" rx="13" fill="#e8f5ff" stroke="#c8e5f7" filter="url(#smallShadow)"/>
  <text x="458" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#397da8">Tek kümeler</text>
  <text x="458" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b7890">Eklenir  +</text>

  <rect x="442" y="150" width="145" height="43" rx="13" fill="#fff0ea" stroke="#f2d4c8" filter="url(#smallShadow)"/>
  <text x="458" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#b56850">İkili kesişimler</text>
  <text x="458" y="184" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8c7168">Çıkarılır  −</text>

  <rect x="442" y="204" width="145" height="43" rx="13" fill="#ebf7ee" stroke="#cde7d4" filter="url(#smallShadow)"/>
  <text x="458" y="222" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#47835b">Üçlü kesişim</text>
  <text x="458" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b8066">Yeniden eklenir  +</text>

  <path d="M420 139 V145" fill="none" stroke="#9eb4c1" stroke-width="2"/>
  <polygon points="420,150 416,143 424,143" fill="#9eb4c1"/>
  <path d="M420 193 V199" fill="none" stroke="#9eb4c1" stroke-width="2"/>
  <polygon points="420,204 416,197 424,197" fill="#9eb4c1"/>

  <rect x="391" y="261" width="200" height="22" rx="11" fill="#f0f4fa"/>
  <text x="491" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#536a7c">+  −  +  −  ...  dönüşümlü</text>
</svg>