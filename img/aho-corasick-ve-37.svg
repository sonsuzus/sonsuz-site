  </g>
  <text x="92" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315875">Yasaklı Sözcükler</text>
  <rect x="39" y="97" width="106" height="28" rx="10" fill="#ffffff" opacity="0.82"/>
  <text x="92" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#35546b">aba</text>
