  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#33465b">Yasaklı Kelimelerden Kaçınan Metin Sayımı</text>

  <!-- Left input -->
  <g filter="url(#shadow)">
