    <path d="M248 220 H392" stroke="#8badc0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M251 229 H389" stroke="#9bbccc" stroke-width="2.2" stroke-linecap="round"/>
    <text x="320" y="249" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#58768b">HTTP/2 çoğullama</text>
    <text x="320" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718d9e">Tek bağlantıda eşzamanlı akışlar</text>
