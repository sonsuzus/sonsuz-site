    <text x="278" y="76" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#887540">Tip güvenliği ve kod üretimi</text>
  </g>

  <path d="M320 86 L320 102" stroke="#8aa5b7" stroke-width="2"/>
  <polygon points="315,99 325,99 320,106" fill="#8aa5b7"/>

