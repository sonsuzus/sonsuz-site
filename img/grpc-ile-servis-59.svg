    <circle cx="241" cy="151" r="20" fill="#ffffff" opacity="0.19"/>
    <path d="M231 151 h20 M241 141 v20" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">gRPC KATMANI</text>
    <text x="320" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#edf8ff">HTTP/2 üzerinde Protobuf</text>
    <rect x="272" y="172" width="96" height="15" rx="7.5" fill="#ffffff" opacity="0.19"/>
    <text x="320" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">Kompakt ikili veri</text>
  </g>

  <g filter="url(#soft)">
