<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="grpc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7169c9"/>
      <stop offset="100%" stop-color="#4f9cc4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#58718b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#58718b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="75" cy="57" r="74" fill="#dceefd" opacity="0.48"/>
  <circle cx="581" cy="266" r="91" fill="#dff1df" opacity="0.5"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39546b">MİKRO SERVİSLERDE gRPC İLETİŞİMİ</text>

  <g filter="url(#soft)">
    <rect x="223" y="42" width="194" height="43" rx="14" fill="#fff7d9" stroke="#efd789"/>
