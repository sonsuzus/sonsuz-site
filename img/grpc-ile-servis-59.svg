    <circle cx="55" cy="139" r="14" fill="#78b8db"/>
    <path d="M49 139 h12 M55 133 v12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="97" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#34647e">Sipariş</text>
