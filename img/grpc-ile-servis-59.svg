    <text x="114" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#735088">İletişim modelleri</text>
    <circle cx="63" cy="261" r="5" fill="#a878c5"/>
    <text x="75" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d84">Tekil çağrı</text>
    <circle cx="63" cy="279" r="5" fill="#7fbdba"/>
    <text x="75" y="283" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765d84">Çift yönlü akış</text>
  </g>

  <g filter="url(#soft)">
    <rect x="453" y="218" width="145" height="73" rx="17" fill="#fff1e6" stroke="#efd0b5"/>
    <text x="525" y="241" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8c6245">Dayanıklılık</text>
    <path d="M474 253 l9 -5 9 5 v9 c0 7 -5 12 -9 14 -4 -2 -9 -7 -9 -14z" fill="#df9c65"/>
    <path d="M480 262 l3 3 5 -7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#87694f">Deadline</text>
