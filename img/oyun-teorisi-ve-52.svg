<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#c8e2fa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee4ff"/>
      <stop offset="100%" stop-color="#ddcef8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff5e8"/>
      <stop offset="100%" stop-color="#c9ecd8"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9d6"/>
      <stop offset="100%" stop-color="#f8d6b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#66829b" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#66829b" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="55" cy="44" r="62" fill="#dceeff" opacity="0.38"/>
  <circle cx="595" cy="275" r="88" fill="#d7f0df" opacity="0.42"/>
  <circle cx="335" cy="38" r="25" fill="#eee4ff" opacity="0.55"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#41566b">SPRAGUE-GRUNDY AKIŞI</text>

  <!-- Sol: oyun koşulları -->
  <g filter="url(#shadow)">
    <rect x="25" y="65" width="145" height="205" rx="20" fill="#ffffff"/>
    <rect x="25" y="65" width="145" height="42" rx="20" fill="url(#blue)"/>
    <rect x="25" y="89" width="145" height="18" fill="url(#blue)"/>
  </g>
  <text x="97.5" y="91" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365873">Oyun Sınıfı</text>

  <g filter="url(#smallShadow)">
    <rect x="39" y="121" width="117" height="25" rx="10" fill="#edf7ff"/>
    <rect x="39" y="153" width="117" height="25" rx="10" fill="#edf7ff"/>
    <rect x="39" y="185" width="117" height="25" rx="10" fill="#edf7ff"/>
    <rect x="39" y="217" width="117" height="25" rx="10" fill="#edf7ff"/>
  </g>
  <circle cx="52" cy="133.5" r="4" fill="#6aa9d6"/>
  <circle cx="52" cy="165.5" r="4" fill="#6aa9d6"/>
  <circle cx="52" cy="197.5" r="4" fill="#6aa9d6"/>
  <circle cx="52" cy="229.5" r="4" fill="#6aa9d6"/>
  <text x="65" y="138" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456276">İki oyunculu</text>
  <text x="65" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456276">Sıra tabanlı</text>
  <text x="65" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456276">Şanssız ve sonlu</text>
  <text x="65" y="234" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456276">Tarafsız</text>

  <!-- arrow 1 -->
  <path d="M177 167 L204 167" stroke="#7b98ad" stroke-width="2.2" fill="none"/>
  <polygon points="204,167 196,162 196,172" fill="#7b98ad"/>

  <!-- Merkez mex -->
  <g filter="url(#shadow)">
    <rect x="213" y="83" width="180" height="173" rx="24" fill="#ffffff"/>
    <rect x="227" y="97" width="152" height="43" rx="16" fill="url(#violet)"/>
  </g>
  <text x="303" y="123" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5d4a80">Grundy Hesabı</text>

  <g filter="url(#smallShadow)">
    <rect x="232" y="152" width="53" height="54" rx="13" fill="#f5f0ff"/>
    <rect x="322" y="152" width="53" height="54" rx="13" fill="#f5f0ff"/>
  </g>
  <text x="258.5" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665381">Seçenek</text>
  <text x="258.5" y="191" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665381">{0,1,3}</text>
  <text x="348.5" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665381">mex</text>
  <text x="348.5" y="191" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#665381">= 2</text>
  <path d="M291 179 L313 179" stroke="#9a83bd" stroke-width="2" fill="none"/>
  <polygon points="313,179 306,175 306,183" fill="#9a83bd"/>
  <rect x="248" y="218" width="110" height="23" rx="11" fill="#eee7fb"/>
  <text x="303" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d4a80">g(Konum) = değer</text>

  <!-- arrow 2 -->
  <path d="M400 167 L425 167" stroke="#7b98ad" stroke-width="2.2" fill="none"/>
  <polygon points="425,167 417,162 417,172" fill="#7b98ad"/>

  <!-- Sağ: bağımsız yığınlar -->
  <g filter="url(#shadow)">
    <rect x="434" y="59" width="181" height="218" rx="21" fill="#ffffff"/>
    <rect x="434" y="59" width="181" height="43" rx="20" fill="url(#mint)"/>
    <rect x="434" y="84" width="181" height="18" fill="url(#mint)"/>
  </g>
  <text x="524.5" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6a57">Bağımsız Alt Oyunlar</text>

  <!-- piles -->
  <g filter="url(#smallShadow)">
    <rect x="454" y="126" width="31" height="46" rx="10" fill="url(#peach)"/>
    <rect x="496" y="116" width="31" height="56" rx="10" fill="url(#blue)"/>
    <rect x="538" y="135" width="31" height="37" rx="10" fill="url(#violet)"/>
  </g>
  <text x="469.5" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#875e45">g₁</text>
  <text x="511.5" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#476980">g₂</text>
  <text x="553.5" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#665381">g₃</text>

  <path d="M469 183 L469 195 L579 195 L579 183" stroke="#78a18a" stroke-width="2" fill="none"/>
  <path d="M524 195 L524 205" stroke="#78a18a" stroke-width="2" fill="none"/>
  <polygon points="524,205 519,197 529,197" fill="#78a18a"/>

  <rect x="462" y="211" width="125" height="25" rx="12" fill="#e1f4e7"/>
  <text x="524.5" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f6d58">g₁ ⊕ g₂ ⊕ g₃</text>

  <g filter="url(#smallShadow)">
    <rect x="456" y="246" width="66" height="20" rx="10" fill="#f4dfe0"/>
    <rect x="528" y="246" width="66" height="20" rx="10" fill="#dff2e7"/>
  </g>
  <text x="489" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a5054">0 → P konumu</text>
  <text x="561" y="260" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3e7458">≠0 → N konumu</text>
</svg>