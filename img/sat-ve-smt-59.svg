<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="solver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6ddff"/>
      <stop offset="100%" stop-color="#d8edff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7991a8" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7991a8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="81" cy="38" r="62" fill="#dff1ff" opacity="0.45"/>
  <circle cx="578" cy="285" r="82" fill="#dff3df" opacity="0.5"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42566b">Problemi mantık diline çevir</text>

  <!-- Problem sources -->
  <g filter="url(#smallShadow)">
    <rect x="26" y="55" width="112" height="43" rx="14" fill="#fff5d9"/>
    <rect x="26" y="111" width="112" height="43" rx="14" fill="#e2f4eb"/>
    <rect x="26" y="167" width="112" height="43" rx="14" fill="#e5efff"/>
  </g>
  <circle cx="48" cy="76" r="10" fill="#f5c96d"/>
  <path d="M43 76h10M48 71v10" stroke="#8a6621" stroke-width="1.6" stroke-linecap="round"/>
  <text x="66" y="80" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d5964">Planlama</text>

  <circle cx="48" cy="132" r="10" fill="#82cba7"/>
  <path d="M43 136l4-8 4 5 3-5" fill="none" stroke="#276849" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="136" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d5964">Doğrulama</text>

  <circle cx="48" cy="188" r="10" fill="#8fb8f2"/>
  <path d="M43 186h10M45 191h6M46 181h4" stroke="#305d99" stroke-width="1.4" stroke-linecap="round"/>
  <text x="66" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d5964">Bulmaca</text>

  <!-- source merge arrows -->
  <path d="M138 76 H160 V130 H177" fill="none" stroke="#91a4b3" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M138 132 H177" fill="none" stroke="#91a4b3" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M138 188 H160 V144 H177" fill="none" stroke="#91a4b3" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="177,132 169,127 169,137" fill="#91a4b3"/>

  <!-- Modeling -->
  <g filter="url(#shadow)">
    <rect x="178" y="88" width="126" height="89" rx="18" fill="#ffffff"/>
  </g>
  <rect x="193" y="103" width="35" height="24" rx="8" fill="#dcecff"/>
  <path d="M201 111h18M201 118h12" stroke="#5184b7" stroke-width="1.5" stroke-linecap="round"/>
  <text x="238" y="112" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f5264">Modelleme</text>
  <text x="194" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607181">Değişkenler</text>
  <text x="194" y="163" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#607181">Kısıtlar</text>

  <path d="M304 132 H325" fill="none" stroke="#70899d" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="325,132 317,127 317,137" fill="#70899d"/>

  <!-- Solver hub -->
  <g filter="url(#shadow)">
    <rect x="326" y="53" width="171" height="160" rx="24" fill="url(#solver)"/>
  </g>
  <text x="411.5" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40516e">ÇÖZÜCÜ</text>
  <line x1="352" y1="92" x2="471" y2="92" stroke="#aab9d4" stroke-width="1"/>

  <g filter="url(#smallShadow)">
    <rect x="345" y="106" width="61" height="47" rx="12" fill="#ffffff"/>
    <rect x="417" y="106" width="61" height="47" rx="12" fill="#ffffff"/>
  </g>
  <text x="375.5" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#70569e">SAT</text>
  <text x="375.5" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657080">Boolean</text>
  <text x="447.5" y="126" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31718a">SMT</text>
  <text x="447.5" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#657080">Teoriler</text>

  <path d="M375 153 V166 H447 V153" fill="none" stroke="#90a2bd" stroke-width="1.4" stroke-linecap="round"/>
  <g filter="url(#smallShadow)">
    <rect x="358" y="174" width="107" height="24" rx="10" fill="#fdfdff"/>
  </g>
  <text x="411.5" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56657a">Ara ve öğren</text>

  <!-- feedback -->
  <path d="M347 187 C329 186 323 168 329 155" fill="none" stroke="#b17688" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="332,155 326,162 335,162" fill="#b17688"/>
  <text x="277" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a26175">Çelişki</text>

  <!-- theory chips -->
  <g opacity="0.95">
    <rect x="329" y="226" width="55" height="25" rx="10" fill="#fbe5c4" filter="url(#smallShadow)"/>
    <rect x="393" y="226" width="45" height="25" rx="10" fill="#d8f0e4" filter="url(#smallShadow)"/>
    <rect x="447" y="226" width="50" height="25" rx="10" fill="#dce9ff" filter="url(#smallShadow)"/>
    <text x="356.5" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76603c">Sayı</text>
    <text x="415.5" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#426d58">Dizi</text>
    <text x="472" y="242" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#496989">Bitler</text>
  </g>

  <!-- output arrow -->
  <path d="M497 132 H519" fill="none" stroke="#70899d" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="519,132 511,127 511,137" fill="#70899d"/>

  <!-- Results -->
  <g filter="url(#shadow)">
    <rect x="520" y="76" width="94" height="112" rx="18" fill="#ffffff"/>
  </g>
  <text x="567" y="101" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43576a">Sonuç</text>
  <rect x="535" y="113" width="64" height="22" rx="9" fill="#d9f3e4"/>
  <text x="567" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#337250">SAT</text>
  <text x="567" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#647383">Geçerli model</text>
  <line x1="539" y1="161" x2="595" y2="161" stroke="#e1e7eb"/>
  <text x="567" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a5b68">UNSAT</text>

  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#62798a">Kuralları tarif et · Aramayı çözücüye bırak</text>
</svg>