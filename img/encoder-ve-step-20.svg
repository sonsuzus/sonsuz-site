    <circle cx="470" cy="242" r="16" fill="#ffffff" opacity="0.7"/>
    <path d="M460 239 C463 233 470 231 475 235 C480 239 479 247 473 250" fill="none" stroke="#0f766e" stroke-width="2"/>
    <path d="M463 250 L459 245 L466 244" fill="#0f766e"/>
