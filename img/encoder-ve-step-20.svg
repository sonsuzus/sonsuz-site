    <text x="520" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#28756f">Gerçek konum</text>
  </g>

  <path d="M536 173 V205" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="536,205 531,196 541,196" fill="#0f766e"/>

