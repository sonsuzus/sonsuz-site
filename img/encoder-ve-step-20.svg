  </g>

  <path d="M381 242 H340" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="340,242 349,237 349,247" fill="#0f766e"/>
  <text x="387" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#0f766e">Geri besleme</text>

  <text x="160" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Komut</text>
  <text x="314" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Darbe</text>
  <text x="465" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Hareket</text>
