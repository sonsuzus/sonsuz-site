    <path d="M536 94 V101 M536 131 V138 M514 116 H521 M551 116 H558" stroke="#c2410c" stroke-width="2.4" stroke-linecap="round"/>
    <text x="536" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a3412">Step Motor</text>
  </g>

