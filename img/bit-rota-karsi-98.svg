<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9eafe"/>
      <stop offset="1" stop-color="#c7dbf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#58708b" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#58708b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="116" fill="#dceef0" opacity="0.38"/>
  <circle cx="320" cy="160" r="91" fill="none" stroke="#9fc8c5" stroke-width="2" stroke-dasharray="5 6" opacity="0.8"/>

  <!-- Riskler -->
  <g filter="url(#smallShadow)">
    <rect x="35" y="42" width="132" height="54" rx="15" fill="#fbe4e4"/>
    <circle cx="59" cy="69" r="13" fill="#ef9b9b"/>
    <path d="M55 64 L63 72 M63 64 L55 72" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round"/>
    <text x="81" y="66" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75484b" font-weight="600">Bit rot</text>
    <text x="81" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8a6466">sessiz değişim</text>

    <rect x="35" y="214" width="132" height="54" rx="15" fill="#faecd6"/>
    <circle cx="59" cy="241" r="13" fill="#e9b46b"/>
    <path d="M59 233 L59 242 L65 246" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="81" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#775b3d" font-weight="600">Ortam yaşlanması</text>
    <text x="81" y="254" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d7151">HDD · SSD · teyp</text>
  </g>

  <!-- Sol bağlantılar -->
  <path d="M167 70 C205 70 206 104 236 118" fill="none" stroke="#c9878a" stroke-width="2"/>
  <polygon points="233,112 244,121 230,123" fill="#c9878a"/>
  <path d="M167 241 C205 241 207 213 236 201" fill="none" stroke="#d3a05e" stroke-width="2"/>
  <polygon points="230,196 244,198 234,207" fill="#d3a05e"/>

  <!-- Merkez arşiv -->
  <g filter="url(#shadow)">
    <rect x="238" y="104" width="164" height="112" rx="24" fill="url(#core)" stroke="#a7c4e1"/>
    <rect x="263" y="127" width="42" height="50" rx="7" fill="#ffffff" opacity="0.88"/>
    <path d="M294 127 L305 138 L294 138 Z" fill="#d9eafe"/>
    <path d="M270 147 H297 M270 156 H297 M270 165 H288" stroke="#90aed0" stroke-width="2" stroke-linecap="round"/>
    <text x="319" y="147" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315471" font-weight="700">Dijital Arşiv</text>
    <text x="319" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#58758e">veri + özet</text>
    <rect x="263" y="187" width="114" height="14" rx="7" fill="#a9d7c3"/>
    <text x="278" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#356858" font-weight="600">doğrulama zinciri</text>
  </g>

  <!-- Koruma düğümleri -->
  <g filter="url(#smallShadow)">
    <rect x="249" y="26" width="142" height="48" rx="15" fill="#e3dffc"/>
    <circle cx="274" cy="50" r="13" fill="#9d93db"/>
    <path d="M268 50 L272 54 L280 45" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="296" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#514a87" font-weight="700">ECC</text>
    <text x="296" y="63" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#706a9a">düzeltme</text>

    <rect x="249" y="246" width="142" height="48" rx="15" fill="#dcefe4"/>
    <circle cx="274" cy="270" r="13" fill="#79b99a"/>
    <path d="M268 270 H280 M274 264 V276" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="296" y="268" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#386c59" font-weight="700">Scrubbing</text>
    <text x="296" y="283" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8977">düzenli tarama</text>
  </g>

  <path d="M320 74 L320 94" stroke="#8d83c7" stroke-width="2"/>
  <polygon points="315,91 320,101 325,91" fill="#8d83c7"/>
  <path d="M320 246 L320 226" stroke="#69a98c" stroke-width="2"/>
  <polygon points="315,229 320,219 325,229" fill="#69a98c"/>

  <!-- Sağ koruma ve kopyalar -->
  <path d="M404 142 C429 134 429 105 449 97" fill="none" stroke="#719bb5" stroke-width="2"/>
  <polygon points="445,92 457,94 449,103" fill="#719bb5"/>
  <path d="M404 160 H449" fill="none" stroke="#719bb5" stroke-width="2"/>
  <polygon points="445,155 456,160 445,165" fill="#719bb5"/>
  <path d="M404 179 C429 187 429 215 449 223" fill="none" stroke="#719bb5" stroke-width="2"/>
  <polygon points="449,217 457,226 445,228" fill="#719bb5"/>

  <g filter="url(#smallShadow)">
    <rect x="458" y="62" width="148" height="48" rx="15" fill="#e2effb"/>
    <circle cx="483" cy="86" r="13" fill="#78a9d2"/>
    <path d="M477 87 L481 91 L490 81" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="506" y="83" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3b6687" font-weight="700">Checksum</text>
    <text x="506" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6687a1">algılama</text>

    <rect x="458" y="136" width="148" height="48" rx="15" fill="#dff1ed"/>
    <circle cx="483" cy="160" r="13" fill="#70b8a7"/>
    <path d="M476 160 C476 153 487 151 490 157 M490 157 L490 152 M490 157 L485 157" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="506" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#356e64" font-weight="700">Sağlam kopya</text>
    <text x="506" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c8b83">geri yükleme</text>

    <rect x="458" y="210" width="148" height="48" rx="15" fill="#f0e4fa"/>
    <circle cx="483" cy="234" r="13" fill="#af87cb"/>
    <circle cx="479" cy="231" r="3" fill="#ffffff"/>
    <circle cx="488" cy="238" r="3" fill="#ffffff"/>
    <path d="M481 233 L486 237" stroke="#ffffff" stroke-width="1.8"/>
    <text x="506" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#694b7e" font-weight="700">3-2-1 kuralı</text>
    <text x="506" y="246" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#886b9b">farklı ortamlar</text>
  </g>

  <text x="320" y="313" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66807b">Kaydet · Doğrula · Çoğalt · Yenile</text>
</svg>