<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9d4"/>
      <stop offset="100%" stop-color="#ffe9c7"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f2ee"/>
      <stop offset="100%" stop-color="#dce9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c7890" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#46657a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="306" cy="158" r="121" fill="#dceffc" opacity="0.38"/>
  <circle cx="306" cy="158" r="88" fill="none" stroke="#b8d6e8" stroke-width="1.5" stroke-dasharray="4 6"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#36536a">Ağ İçi Sızma Zinciri</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668195">Kimlik merkezli yayılma ve erken durdurma</text>

  <!-- attack paths -->
  <path d="M140 157 C174 157 184 157 211 157" fill="none" stroke="#db8d7e" stroke-width="3" stroke-linecap="round"/>
  <polygon points="210,151 222,157 210,163" fill="#db8d7e"/>
  <path d="M306 117 C326 92 350 79 379 74" fill="none" stroke="#d6a05d" stroke-width="3" stroke-linecap="round"/>
  <polygon points="375,68 389,72 379,80" fill="#d6a05d"/>
  <path d="M344 160 C362 160 374 160 391 160" fill="none" stroke="#d98579" stroke-width="3" stroke-linecap="round"/>
  <polygon points="389,154 401,160 389,166" fill="#d98579"/>
  <path d="M305 199 C329 219 351 232 376 238" fill="none" stroke="#d6a05d" stroke-width="3" stroke-linecap="round"/>
  <polygon points="373,232 387,241 371,244" fill="#d6a05d"/>

  <!-- compromised device -->
  <g filter="url(#shadow)">
    <rect x="28" y="111" width="113" height="93" rx="17" fill="url(#risk)"/>
    <rect x="49" y="130" width="71" height="43" rx="6" fill="#fffaf8" stroke="#d6887c" stroke-width="2"/>
    <path d="M43 180 H126 L119 187 H50 Z" fill="#d6887c"/>
    <circle cx="84" cy="151" r="9" fill="#f2a092"/>
    <path d="M84 145 V152 M80 152 H88" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="84.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7b4541">İlk Cihaz</text>
  </g>

  <!-- identity hub -->
  <g filter="url(#shadow)">
    <circle cx="284" cy="158" r="62" fill="#fffdf8" stroke="#8bb8cb" stroke-width="2"/>
    <circle cx="284" cy="158" r="45" fill="#e2f2f3"/>
    <path d="M278 136 a17 17 0 1 1 -9 31 l-12 12 h-11 v-11 l13-13 a17 17 0 0 1 19-19z" fill="#5e9fb2"/>
    <circle cx="278" cy="151" r="5" fill="#fff"/>
    <path d="M250 179 h12 M255 174 v10" stroke="#5e9fb2" stroke-width="3" stroke-linecap="round"/>
    <text x="284" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#326174">Kimlikler</text>
  </g>

  <!-- assets -->
  <g filter="url(#softShadow)">
    <rect x="391" y="43" width="126" height="60" rx="14" fill="#fff4dc"/>
    <rect x="406" y="57" width="25" height="31" rx="4" fill="#e7ae62"/>
    <path d="M410 63 H427 M410 70 H427 M410 77 H427" stroke="#fff6e9" stroke-width="2"/>
    <text x="464" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#76552d">Dosya</text>
    <text x="464" y="87" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#76552d">Sunucusu</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="401" y="130" width="132" height="60" rx="14" fill="#ffe1dc"/>
    <rect x="416" y="144" width="28" height="29" rx="5" fill="#d97f75"/>
    <circle cx="430" cy="153" r="4" fill="#fff4f2"/>
    <path d="M421 167 H439" stroke="#fff4f2" stroke-width="2" stroke-linecap="round"/>
    <text x="483" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#814944">Yönetim</text>
    <text x="483" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#814944">Sistemi</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="387" y="211" width="140" height="60" rx="14" fill="#eee4fb"/>
    <path d="M407 252 V230 Q407 222 415 222 H434 Q442 222 442 230 V252 Z" fill="#9474bb"/>
    <path d="M412 234 H437 M412 242 H437" stroke="#f8f3ff" stroke-width="2"/>
    <text x="478" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#584475">Etki Alanı</text>
    <text x="478" y="254" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#584475">Denetleyicisi</text>
  </g>

  <!-- defensive barrier -->
  <path d="M559 78 C590 94 600 118 600 158 C600 205 580 230 559 242 C538 230 518 205 518 158 C518 118 528 94 559 78 Z" fill="url(#safe)" stroke="#65a99c" stroke-width="2" filter="url(#shadow)"/>
  <path d="M545 158 L555 168 L575 143" fill="none" stroke="#398679" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="559" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#39766d">Zinciri Kes</text>

  <!-- defense connection -->
  <path d="M530 160 H511" stroke="#65a99c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="516,154 505,160 516,166" fill="#65a99c"/>

  <!-- bottom stages -->
  <g filter="url(#softShadow)">
    <rect x="28" y="254" width="92" height="39" rx="12" fill="#e3eefb"/>
    <text x="74" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#416782">Keşif</text>
    <rect x="132" y="254" width="107" height="39" rx="12" fill="#e8def8"/>
    <text x="185.5" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#604a7b">Kimlik Hırsızlığı</text>
    <rect x="251" y="254" width="92" height="39" rx="12" fill="#ffe8cc"/>
    <text x="297" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#805d33">Sıçrama</text>
  </g>
  <path d="M121 273 H128" stroke="#91abc0" stroke-width="2"/>
  <polygon points="127,269 134,273 127,277" fill="#91abc0"/>
  <path d="M240 273 H247" stroke="#a28ab9" stroke-width="2"/>
  <polygon points="246,269 253,273 246,277" fill="#a28ab9"/>

  <text x="437" y="302" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557180">İzleme · Segmentasyon · En Az Ayrıcalık</text>
</svg>