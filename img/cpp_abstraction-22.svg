<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b5e2cd"/>
      <stop offset="100%" stop-color="#8fd4b4"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d8b8"/>
      <stop offset="100%" stop-color="#f0c9a8"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c5f0"/>
      <stop offset="100%" stop-color="#bda8e0"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b8c8"/>
      <stop offset="100%" stop-color="#e89ab0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C++ Soyutlama Mimarisi</text>

  <!-- Soyut Sınıf (merkez) -->
  <rect x="220" y="55" width="200" height="70" rx="12" fill="url(#grad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a3a4a">Soyut Sınıf</text>
  <text x="320" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a3a4a">Saf Sanal Fonksiyon</text>
  <text x="320" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1a3a4a">Ortak Değişkenler</text>

  <!-- Alt Sınıf 1 -->
  <rect x="40" y="180" width="160" height="60" rx="10" fill="url(#grad2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="120" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a2a">Türetilen Sınıf 1</text>
  <text x="120" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a3a2a">Sanal Fonksiyon</text>
  <text x="120" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#1a3a2a">Yeniden Tanımlama</text>

  <!-- Alt Sınıf 2 -->
  <rect x="240" y="180" width="160" height="60" rx="10" fill="url(#grad3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a2a1a">Türetilen Sınıf 2</text>
  <text x="320" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a2a1a">Sanal Fonksiyon</text>
  <text x="320" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a2a1a">Yeniden Tanımlama</text>

  <!-- Alt Sınıf 3 -->
  <rect x="440" y="180" width="160" height="60" rx="10" fill="url(#grad4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="520" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a1a4a">Türetilen Sınıf 3</text>
  <text x="520" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a1a4a">Sanal Fonksiyon</text>
  <text x="520" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2a1a4a">Yeniden Tanımlama</text>

  <!-- Veri Gizleme Kutusu -->
  <rect x="220" y="265" width="200" height="40" rx="10" fill="url(#grad5)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a1a2a">Veri Gizleme</text>
  <text x="320" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a1a2a">Private Değişkenler</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Soyut Sınıf -> Alt Sınıf 1 -->
  <path d="M 260 125 L 130 175" stroke="#5a8a9a" stroke-width="2" fill="none"/>
  <polygon points="130,175 140,170 135,182" fill="#5a8a9a"/>

  <!-- Soyut Sınıf -> Alt Sınıf 2 -->
  <path d="M 320 125 L 320 175" stroke="#5a8a9a" stroke-width="2" fill="none"/>
  <polygon points="320,175 315,165 325,165" fill="#5a8a9a"/>

  <!-- Soyut Sınıf -> Alt Sınıf 3 -->
  <path d="M 380 125 L 510 175" stroke="#5a8a9a" stroke-width="2" fill="none"/>
  <polygon points="510,175 500,170 505,182" fill="#5a8a9a"/>

  <!-- Alt Sınıf 1 -> Veri Gizleme -->
  <path d="M 160 240 L 260 262" stroke="#a06070" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="260,262 250,258 254,268" fill="#a06070"/>

  <!-- Alt Sınıf 2 -> Veri Gizleme -->
  <path d="M 320 240 L 320 262" stroke="#a06070" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="320,262 315,254 325,254" fill="#a06070"/>

  <!-- Alt Sınıf 3 -> Veri Gizleme -->
  <path d="M 480 240 L 380 262" stroke="#a06070" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="380,262 390,258 386,268" fill="#a06070"/>

  <!-- Kalıtım etiketi -->
  <text x="130" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a7a" font-style="italic">kalıtım</text>
  <text x="345" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a7a" font-style="italic">kalıtım</text>
  <text x="500" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a6a7a" font-style="italic">kalıtım</text>

  <!-- Şablon etiketi -->
  <rect x="20" y="55" width="100" height="40" rx="8" fill="#e8f0e8" stroke="#8ab88a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a5a2a">Şablonlar</text>
  <text x="70" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2a5a2a">Genel Kod</text>

  <!-- Sınıf etiketi -->
  <rect x="520" y="55" width="100" height="40" rx="8" fill="#e8f0e8" stroke="#8ab88a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="570" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a5a2a">Sınıflar</text>
  <text x="570" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="9" fill="#2a5a2a">Veri Soyutlama</text>

  <!-- Şablon ve Sınıf bağlantıları -->
  <path d="M 120 75 L 215 75" stroke="#8ab88a" stroke-width="1.5" fill="none"/>
  <polygon points="215,75 205,70 205,80" fill="#8ab88a"/>

  <path d="M 425 75 L 515 75" stroke="#8ab88a" stroke-width="1.5" fill="none"/>
  <polygon points="515,75 505,70 505,80" fill="#8ab88a"/>
</svg>