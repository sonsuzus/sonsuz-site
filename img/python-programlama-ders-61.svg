<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede7f6"/>
      <stop offset="100%" stop-color="#d1c4e9"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez düğüm -->
  <rect x="245" y="125" width="150" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Karakter Dizileri</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1976d2">Bileşik Veri Tipi</text>

  <!-- Bağlantı çizgileri -->
  <!-- Sol üst -->
  <path d="M 245 145 L 160 145 L 160 80" stroke="#90a4ae" stroke-width="1.5" fill="none"/>
  <polygon points="160,72 156,82 164,82" fill="#90a4ae"/>

  <!-- Sol alt -->
  <path d="M 245 155 L 160 155 L 160 230" stroke="#90a4ae" stroke-width="1.5" fill="none"/>
  <polygon points="160,238 156,228 164,228" fill="#90a4ae"/>

  <!-- Sağ üst -->
  <path d="M 395 140 L 480 140 L 480 80" stroke="#90a4ae" stroke-width="1.5" fill="none"/>
  <polygon points="480,72 476,82 484,82" fill="#90a4ae"/>

  <!-- Sağ alt -->
  <path d="M 395 160 L 480 160 L 480 230" stroke="#90a4ae" stroke-width="1.5" fill="none"/>
  <polygon points="480,238 476,228 484,228" fill="#90a4ae"/>

  <!-- Alt merkez -->
  <path d="M 320 175 L 320 240" stroke="#90a4ae" stroke-width="1.5" fill="none"/>
  <polygon points="320,248 316,238 324,238" fill="#90a4ae"/>

  <!-- Sol üst kutu: İndis ve Dilim -->
  <rect x="80" y="30" width="160" height="42" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#81c784" stroke-width="1.5"/>
  <text x="160" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">İndis ve Dilim</text>
  <text x="160" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#388e3c">[] [n:m]</text>

  <!-- Sol alt kutu: Uzunluk -->
  <rect x="80" y="238" width="160" height="42" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="160" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Uzunluk ve Gezinme</text>
  <text x="160" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ef6c00">len() for döngüsü</text>

  <!-- Sağ üst kutu: Değişmezlik -->
  <rect x="400" y="30" width="160" height="42" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#f06292" stroke-width="1.5"/>
  <text x="480" y="48" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Değişmezlik</text>
  <text x="480" y="63" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#d81b60">Immutable</text>

  <!-- Sağ alt kutu: Metotlar -->
  <rect x="400" y="238" width="160" height="42" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#9575cd" stroke-width="1.5"/>
  <text x="480" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4527a0">Metotlar</text>
  <text x="480" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#5e35b1">find() in count()</text>

  <!-- Alt merkez kutu: Biçimlendirme -->
  <rect x="250" y="248" width="140" height="36" rx="10" fill="#e0f7fa" filter="url(#shadow)" stroke="#4dd0e1" stroke-width="1.5"/>
  <text x="320" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#00838f">Biçimlendirme</text>
  <text x="320" y="278" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#0097a7">%s %d %f</text>

  <!-- Üst bilgi etiketi -->
  <text x="320" y="20" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#546e7a" font-style="italic">Python Ders 7: Karakter Dizileri</text>
</svg>