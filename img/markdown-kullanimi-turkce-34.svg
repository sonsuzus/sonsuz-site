<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#d4eaf7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#d2f0d2"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf2e9"/>
      <stop offset="100%" stop-color="#fae8d8"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8fd"/>
      <stop offset="100%" stop-color="#e8d9f7"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e6"/>
      <stop offset="100%" stop-color="#ffeccc"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f0fa"/>
      <stop offset="100%" stop-color="#d4e4f5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez düğüm -->
  <rect x="255" y="125" width="130" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#7ab8d4" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f7a">Markdown</text>
  <text x="320" y="164" text-anchor="middle" font-size="11" fill="#4a7a95">Biçimlendirme Dili</text>

  <!-- Dış düğümler (saat yönünde) -->
  <!-- Başlık -->
  <rect x="55" y="35" width="100" height="40" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#8bc48b" stroke-width="1.5"/>
  <text x="105" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d6b2d">Başlık</text>

  <!-- Vurgulama -->
  <rect x="55" y="145" width="100" height="40" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#d4a373" stroke-width="1.5"/>
  <text x="105" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b5e34">Vurgulama</text>

  <!-- Maddeleme -->
  <rect x="55" y="255" width="100" height="40" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="105" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#5e4b8b">Maddeleme</text>

  <!-- Bağlantı -->
  <rect x="270" y="255" width="100" height="40" rx="10" fill="url(#box5)" filter="url(#shadow)" stroke="#e0a800" stroke-width="1.5"/>
  <text x="320" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d00">Bağlantı</text>

  <!-- Tablo -->
  <rect x="485" y="255" width="100" height="40" rx="10" fill="url(#box6)" filter="url(#shadow)" stroke="#7a9cc6" stroke-width="1.5"/>
  <text x="535" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d5a80">Tablo</text>

  <!-- Resim -->
  <rect x="485" y="145" width="100" height="40" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#8bc48b" stroke-width="1.5"/>
  <text x="535" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d6b2d">Resim</text>

  <!-- Kod -->
  <rect x="485" y="35" width="100" height="40" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#d4a373" stroke-width="1.5"/>
  <text x="535" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b5e34">Kod</text>

  <!-- Alıntı -->
  <rect x="270" y="35" width="100" height="40" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="320" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#5e4b8b">Alıntı</text>

  <!-- Bağlantı çizgileri ve oklar (manuel) -->
  <!-- Başlık -->
  <path d="M155 55 L255 140" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="255,140 247,132 248,144" fill="#7ab8d4"/>

  <!-- Vurgulama -->
  <path d="M155 165 L255 150" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="255,150 247,146 248,156" fill="#7ab8d4"/>

  <!-- Maddeleme -->
  <path d="M155 275 L255 165" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="255,165 247,161 248,171" fill="#7ab8d4"/>

  <!-- Bağlantı -->
  <path d="M370 165 L320 255" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="320,255 314,247 326,247" fill="#7ab8d4"/>

  <!-- Tablo -->
  <path d="M485 275 L370 165" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="370,165 362,169 370,175" fill="#7ab8d4"/>

  <!-- Resim -->
  <path d="M485 165 L385 150" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="385,150 377,146 378,156" fill="#7ab8d4"/>

  <!-- Kod -->
  <path d="M485 55 L385 140" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="385,140 377,134 378,146" fill="#7ab8d4"/>

  <!-- Alıntı -->
  <path d="M370 55 L320 125" stroke="#7ab8d4" stroke-width="1.5" fill="none"/>
  <polygon points="320,125 314,119 326,119" fill="#7ab8d4"/>

  <!-- Alt bilgi etiketi -->
  <text x="320" y="310" text-anchor="middle" font-size="11" fill="#8899aa" opacity="0.8">Düz metin ile zengin içerik</text>
</svg>