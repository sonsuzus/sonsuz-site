<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#cdeedc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#6d8495" flood-opacity="0.20"/>
    </filter>
    <filter id="soft" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6d8495" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="65" cy="43" r="58" fill="#dceeff" opacity="0.42"/>
  <circle cx="589" cy="276" r="78" fill="#dff3de" opacity="0.45"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#385466">Kısıtlı Etik Karar Akışı</text>

  <path d="M157 127 L209 127" stroke="#7895a5" stroke-width="2.2" fill="none"/>
  <polygon points="209,127 201,122 201,132" fill="#7895a5"/>
  <path d="M372 127 L424 127" stroke="#7895a5" stroke-width="2.2" fill="none"/>
  <polygon points="424,127 416,122 416,132" fill="#7895a5"/>
  <path d="M528 160 L528 211" stroke="#7895a5" stroke-width="2.2" fill="none"/>
  <polygon points="528,211 523,203 533,203" fill="#7895a5"/>

  <g filter="url(#soft)">
    <rect x="30" y="82" width="127" height="91" rx="18" fill="#e1f0ff" stroke="#c1dcf1"/>
    <circle cx="59" cy="111" r="16" fill="#8dc4eb"/>
    <path d="M51 113 Q59 101 67 113 M54 118 Q59 122 64 118" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35576d">Algı ve Tahmin</text>
    <text x="82" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547282">Belirsizlik</text>
    <text x="82" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547282">Olasılık</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="209" y="67" width="163" height="120" rx="22" fill="url(#core)" stroke="#b4d5d3"/>
    <circle cx="290" cy="101" r="24" fill="#ffffff" opacity="0.88"/>
    <path d="M280 101 L287 108 L302 91" fill="none" stroke="#4d9b81" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="290" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315d5a">Etik Kısıtlar</text>
    <text x="290" y="161" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527573">Yasal • Ayrımcısız</text>
    <text x="290" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#527573">Hedefli zarar yok</text>
  </g>

  <g filter="url(#soft)">
    <rect x="424" y="82" width="174" height="91" rx="18" fill="#f9eed7" stroke="#ecd7aa"/>
    <circle cx="453" cy="111" r="16" fill="#efbd70"/>
    <path d="M445 116 L453 106 L461 116 M453 106 L453 121" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="477" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#725a32">Zarar Azaltma</text>
    <text x="477" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#826c49">Maliyet karşılaştır</text>
    <text x="477" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#826c49">En düşük risk</text>
  </g>

  <path d="M290 187 L290 219" stroke="#7895a5" stroke-width="2.2" fill="none"/>
  <polygon points="290,219 285,211 295,211" fill="#7895a5"/>

  <g filter="url(#soft)">
    <rect x="178" y="219" width="224" height="70" rx="18" fill="#ede5fa" stroke="#d7c7ed"/>
    <text x="290" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5e4a78">Güvenli Varsayılan</text>
    <text x="290" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75618a">Kontrollü fren ve şeridi koru</text>
  </g>

  <g filter="url(#soft)">
    <rect x="441" y="219" width="174" height="70" rx="18" fill="#dff1ed" stroke="#c0dfd7"/>
    <circle cx="468" cy="245" r="13" fill="#7fc4b3"/>
    <path d="M462 245 L466 249 L474 240" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="540" y="243" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#386d65">Karar Kaydı</text>
    <text x="540" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557f78">Denetlenebilirlik</text>
  </g>

  <path d="M402 254 L441 254" stroke="#7895a5" stroke-width="2.2" fill="none"/>
  <polygon points="441,254 433,249 433,259" fill="#7895a5"/>

  <text x="76" y="200" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66818e">Sensör verisi</text>
  <text x="513" y="200" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#826c49">C(a) = olasılık × şiddet + risk</text>
</svg>