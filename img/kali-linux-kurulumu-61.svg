<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="isoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9eaff"/>
      <stop offset="100%" stop-color="#c5ddfa"/>
    </linearGradient>
    <linearGradient id="usbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8f4e9"/>
      <stop offset="100%" stop-color="#bce8d8"/>
    </linearGradient>
    <linearGradient id="diskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbe5d7"/>
      <stop offset="100%" stop-color="#f5cdb8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#59718a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#59718a" flood-opacity="0.14"/>
    </filter>
  </defs>

