<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">TRUNCATE TABLE Komutu</text>
  <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">Tablo içindeki tüm verileri hızlıca siler</text>

  <!-- Sol üst: Komut kutusu -->
  <rect x="40" y="75" width="180" height="55" rx="10" fill="url(#boxGrad1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1"/>
  <text x="130" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">TRUNCATE TABLE</text>
  <text x="130" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e40af">tablo_adı</text>

  <!-- Sağ üst: Hedef tablo -->
  <rect x="400" y="75" width="190" height="55" rx="10" fill="url(#boxGrad2)" filter="url(#shadow)" stroke="#a5b4fc" stroke-width="1"/>
  <text x="495" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">Hedef Tablo</text>
  <text x="495" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3730a3">Veritabanı Nesnesi</text>

  <!-- Ok: Komut -> Hedef -->
  <polygon points="225,102 260,95 260,109" fill="#6366f1"/>
  <line x1="225" y1="102" x2="260" y2="102" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Alt: Tablo içeriği -->
  <rect x="120" y="175" width="180" height="100" rx="10" fill="url(#boxGrad3)" filter="url(#shadow)" stroke="#f9a8d4" stroke-width="1"/>
  <text x="210" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Tablo Verileri</text>
  <line x1="140" y1="208" x2="280" y2="208" stroke="#f472b6" stroke-width="1"/>

  <!-- Veri satırları -->
  <rect x="145" y="218" width="130" height="12" rx="3" fill="#fdf2f8" opacity="0.8"/>
  <rect x="145" y="236" width="130" height="12" rx="3" fill="#fdf2f8" opacity="0.8"/>
  <rect x="145" y="254" width="130" height="12" rx="3" fill="#fdf2f8" opacity="0.8"/>

  <!-- Sağ alt: Sonuç -->
  <rect x="380" y="175" width="210" height="100" rx="10" fill="url(#boxGrad4)" filter="url(#shadow)" stroke="#86efac" stroke-width="1"/>
  <text x="485" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#14532d">Sonuç</text>
  <line x1="400" y1="208" x2="570" y2="208" stroke="#4ade80" stroke-width="1"/>

  <text x="485" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#166534">Tüm satırlar silinir</text>
  <text x="485" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#166534">Tablo yapısı korunur</text>
  <text x="485" y="268" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#166534">Geri alınamaz</text>

  <!-- Ok: Tablo verileri -> Sonuç -->
  <polygon points="305,225 345,218 345,232" fill="#10b981"/>
  <line x1="305" y1="225" x2="345" y2="225" stroke="#10b981" stroke-width="2.5"/>

  <!-- Ok: Hedef Tablo -> Tablo Verileri (dikey) -->
  <polygon points="495,135 488,160 502,160" fill="#8b5cf6"/>
  <line x1="495" y1="135" x2="495" y2="160" stroke="#8b5cf6" stroke-width="2.5"/>

  <!-- Alt bilgi -->
  <rect x="40" y="270" width="180" height="35" rx="8" fill="url(#boxGrad5)" filter="url(#shadowLight)" stroke="#fdba74" stroke-width="1"/>
  <text x="130" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7c2d12">DELETE ile farkı:</text>
  <text x="130" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7c2d12">WHERE koşulu yoktur</text>

  <!-- Bilgi notu -->
  <rect x="380" y="270" width="210" height="35" rx="8" fill="#f1f5f9" filter="url(#shadowLight)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="485" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">Hız avantajı sağlar</text>
  <text x="485" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#475569">Log kaydı daha azdır</text>

</svg>