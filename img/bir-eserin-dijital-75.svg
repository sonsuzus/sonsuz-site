<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ee"/>
    </linearGradient>
    <linearGradient id="passport" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f8efd9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#4d6675" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4d6675" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="92" cy="43" r="70" fill="#dceefa" opacity="0.55"/>
  <circle cx="580" cy="270" r="92" fill="#dff0d8" opacity="0.48"/>

  <text x="28" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345064">ESERİN DİJİTAL PASAPORTU</text>
  <line x1="28" y1="38" x2="612" y2="38" stroke="#c9dae0" stroke-width="1"/>

  <!-- Sol kaynaklar -->
  <g filter="url(#smallShadow)">
    <rect x="28" y="72" width="125" height="47" rx="13" fill="#e5f1ff"/>
    <rect x="28" y="132" width="125" height="47" rx="13" fill="#e9f7ed"/>
    <rect x="28" y="192" width="125" height="47" rx="13" fill="#f6eafa"/>
  </g>

  <circle cx="51" cy="95" r="12" fill="#8fc1eb"/>
  <path d="M46 91h10v8H46z M48 89h6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="70" y="92" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31546b">Eser kimliği</text>
  <text x="70" y="108" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567080">Fotoğraf ve ölçüm</text>

  <circle cx="51" cy="155" r="12" fill="#88c99a"/>
  <path d="M46 149h10v12H46z M48 152h6M48 155h6M48 158h4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <text x="70" y="152" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315c43">Kanıt belgesi</text>
  <text x="70" y="168" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567080">Rapor ve arşiv</text>

  <circle cx="51" cy="215" r="12" fill="#c69bdb"/>
  <path d="M46 218l4-7 3 3 3-3 2 7z" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="70" y="212" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#654175">Kurum imzası</text>
  <text x="70" y="228" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567080">Yetki doğrulaması</text>

  <!-- arrows to center -->
  <path d="M153 95H187" fill="none" stroke="#8aa6b3" stroke-width="1.5"/>
  <polygon points="187,95 180,91 180,99" fill="#8aa6b3"/>
  <path d="M153 155H187" fill="none" stroke="#8aa6b3" stroke-width="1.5"/>
  <polygon points="187,155 180,151 180,159" fill="#8aa6b3"/>
  <path d="M153 215H187" fill="none" stroke="#8aa6b3" stroke-width="1.5"/>
  <polygon points="187,215 180,211 180,219" fill="#8aa6b3"/>

  <!-- Central Passport -->
  <g filter="url(#shadow)">
    <rect x="188" y="65" width="175" height="180" rx="20" fill="url(#passport)" stroke="#e2c98c" stroke-width="1.2"/>
  </g>
  <rect x="207" y="82" width="137" height="30" rx="10" fill="#dcae5d"/>
  <path d="M220 105v-14h10l5 7-5 7z" fill="#fff8e9" opacity="0.9"/>
  <text x="246" y="101" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#fff">Dijital pasaport</text>

  <rect x="207" y="126" width="137" height="30" rx="8" fill="#fff" opacity="0.82"/>
  <text x="219" y="145" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466071">Eser: M-042</text>
  <rect x="207" y="164" width="137" height="30" rx="8" fill="#fff" opacity="0.82"/>
  <text x="219" y="183" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466071">Belge özeti</text>
  <rect x="207" y="202" width="137" height="25" rx="8" fill="#fff" opacity="0.82"/>
  <text x="219" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466071">Olay zinciri</text>

  <!-- Right ledger -->
  <path d="M363 155H391" fill="none" stroke="#7198a8" stroke-width="2"/>
  <polygon points="391,155 383,150 383,160" fill="#7198a8"/>

  <text x="411" y="68" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345064">İZLENEBİLİR KAYIT</text>
  <g filter="url(#smallShadow)">
    <rect x="401" y="79" width="205" height="45" rx="13" fill="#d9eef0"/>
    <rect x="401" y="137" width="205" height="45" rx="13" fill="#dce8fb"/>
    <rect x="401" y="195" width="205" height="45" rx="13" fill="#e8f2d7"/>
  </g>

  <circle cx="424" cy="101" r="11" fill="#5eb2b6"/>
  <text x="445" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315f65">1. Keşif ve inceleme</text>
  <text x="445" y="114" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567080">Tarih · belge · imza</text>

  <circle cx="424" cy="159" r="11" fill="#719ed6"/>
  <text x="445" y="156" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d5d87">2. Ödünç verme</text>
  <text x="445" y="172" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567080">Önceki özete bağlı</text>

  <circle cx="424" cy="217" r="11" fill="#93b95e"/>
  <text x="445" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526d30">3. Düzeltme kaydı</text>
  <text x="445" y="230" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#567080">Geçmiş korunur</text>

  <path d="M424 124v13" fill="none" stroke="#9ab3ba" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M424 182v13" fill="none" stroke="#9ab3ba" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- bottom principle -->
  <g filter="url(#smallShadow)">
    <rect x="93" y="266" width="454" height="35" rx="15" fill="#ffffff" opacity="0.88"/>
  </g>
  <circle cx="116" cy="283" r="10" fill="#f1bf6e"/>
  <path d="M116 277v7M116 288v1" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="135" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#425d67">Kriptografi imzayı doğrular</text>
  <line x1="305" y1="276" x2="305" y2="292" stroke="#d6e0df"/>
  <text x="323" y="287" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d76">Tarihsel doğruluk uzmanlık ve kanıt gerektirir</text>
</svg>