<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#cce4f7"/>
    </linearGradient>
    <linearGradient id="contract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ddff"/>
      <stop offset="100%" stop-color="#d8c7f1"/>
    </linearGradient>
    <linearGradient id="impl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3df"/>
      <stop offset="100%" stop-color="#bfe6cb"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0ca"/>
      <stop offset="100%" stop-color="#f7dca1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7290a0" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7290a0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="600" cy="32" r="76" fill="#d9f0e5" opacity="0.46"/>
  <circle cx="28" cy="298" r="90" fill="#dce9ff" opacity="0.48"/>

  <text x="30" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#456070">Düzenli Koddan Esnek Mimariye</text>
  <line x1="30" y1="42" x2="610" y2="42" stroke="#c7d8df" stroke-width="1"/>

  <!-- Paket alanı -->
  <g filter="url(#shadow)">
    <rect x="30" y="76" width="145" height="174" rx="18" fill="#eef7ff" stroke="#bdd8eb"/>
  </g>
  <text x="48" y="103" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d6780">Paket Haritası</text>
  <text x="48" y="120" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67808d">ad alanı ve düzen</text>

  <g filter="url(#smallShadow)">
    <rect x="47" y="138" width="112" height="38" rx="10" fill="url(#pkg)"/>
    <rect x="47" y="190" width="112" height="38" rx="10" fill="url(#pkg)"/>
  </g>
  <path d="M57 149 h13 l4 5 h22" fill="none" stroke="#5483a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M57 201 h13 l4 5 h22" fill="none" stroke="#5483a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="57" y="167" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#284e68">com.magaza</text>
  <text x="57" y="219" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#284e68">payment / user</text>

  <!-- flow to contract -->
  <path d="M175 164 C195 164 196 164 214 164" fill="none" stroke="#83a6b8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="214,164 205,158 205,170" fill="#83a6b8"/>
  <text x="181" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8490">import</text>

  <!-- interfaces -->
  <g filter="url(#shadow)">
    <rect x="218" y="67" width="182" height="194" rx="20" fill="#f8f5ff" stroke="#d3c5ed"/>
  </g>
  <text x="238" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#644b91">Davranış Sözleşmeleri</text>
  <text x="238" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7e7193">arayüzler</text>

  <g filter="url(#smallShadow)">
    <rect x="240" y="132" width="137" height="42" rx="11" fill="url(#contract)"/>
    <rect x="240" y="193" width="137" height="42" rx="11" fill="url(#contract)"/>
  </g>
  <circle cx="258" cy="153" r="8" fill="#896eb1"/>
  <path d="M254 153 h8 M258 149 v8" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="258" cy="214" r="8" fill="#896eb1"/>
  <path d="M254 214 h8 M258 210 v8" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <text x="275" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#503d78">Payable</text>
  <text x="275" y="218" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#503d78">Refundable</text>

  <!-- implementation connections -->
  <path d="M400 153 C421 153 420 132 439 132" fill="none" stroke="#8ba99a" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="439,132 430,126 431,137" fill="#8ba99a"/>
  <path d="M400 214 C421 214 420 172 439 172" fill="none" stroke="#8ba99a" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="439,172 430,166 431,177" fill="#8ba99a"/>

  <!-- implementation -->
  <g filter="url(#shadow)">
    <rect x="442" y="100" width="160" height="106" rx="18" fill="#f4fcf5" stroke="#bcdcc7"/>
  </g>
  <text x="460" y="127" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7453">Uygulama</text>
  <g filter="url(#smallShadow)">
    <rect x="458" y="141" width="128" height="43" rx="11" fill="url(#impl)"/>
  </g>
  <path d="M471 155 l6 -5 l6 5 v12 h-12z" fill="none" stroke="#4d8a62" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="492" y="166" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#356447">BankTransfer</text>
  <text x="459" y="197" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#618171">implements</text>

  <!-- service lower flow -->
  <path d="M522 207 L522 229" fill="none" stroke="#b39362" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="522,239 516,229 528,229" fill="#b39362"/>

  <g filter="url(#shadow)">
    <rect x="424" y="241" width="196" height="53" rx="16" fill="url(#service)" stroke="#e5c67f"/>
  </g>
  <path d="M444 257 h14 a4 4 0 0 1 4 4 v13 h-18z" fill="none" stroke="#9a7134" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M447 265 h12" stroke="#9a7134" stroke-width="1.5" stroke-linecap="round"/>
  <text x="475" y="265" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765326">CheckoutService</text>
  <text x="475" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7040">Payable bağımlılığı</text>

  <!-- legend -->
  <g opacity="0.85">
    <circle cx="43" cy="280" r="5" fill="#7ca6c4"/>
    <text x="54" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617a87">Paket</text>
    <circle cx="111" cy="280" r="5" fill="#9c82c4"/>
    <text x="122" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617a87">Sözleşme</text>
    <circle cx="210" cy="280" r="5" fill="#78ae87"/>
    <text x="221" y="284" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#617a87">Esnek uygulama</text>
  </g>
</svg>