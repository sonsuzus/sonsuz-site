  <polygon points="443,95 434,90 434,100" fill="#7f9aa1"/>
  <path d="M393 190 H422 V221 H443" fill="none" stroke="#7f9aa1" stroke-width="2"/>
  <polygon points="443,221 434,216 434,226" fill="#7f9aa1"/>

