  <path d="M174 197 H207" fill="none" stroke="#8095a7" stroke-width="2"/>
  <polygon points="207,197 198,192 198,202" fill="#8095a7"/>

  <!-- GIL core -->
  <g filter="url(#shadow)">
    <rect x="208" y="85" width="184" height="146" rx="24" fill="url(#gilGrad)"/>
  </g>
  <rect x="224" y="101" width="152" height="114" rx="18" fill="#fff8e8" opacity="0.72"/>
  <path d="M274 149 v-13 c0-18 13-30 26-30s26 12 26 30v13" fill="none" stroke="#9b6e3a" stroke-width="10" stroke-linecap="round"/>
  <rect x="259" y="145" width="82" height="53" rx="11" fill="#bd8242"/>
