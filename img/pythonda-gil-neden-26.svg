  <text x="574" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b4a">R</text>

  <!-- right lower C api -->
  <g filter="url(#shadow)">
    <rect x="444" y="180" width="166" height="81" rx="17" fill="#eeeafd"/>
  </g>
  <text x="462" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5e5683">C uzantıları</text>
  <rect x="462" y="217" width="41" height="25" rx="8" fill="#c8bff2"/>
  <rect x="510" y="217" width="41" height="25" rx="8" fill="#b5d9f4"/>
  <rect x="558" y="217" width="33" height="25" rx="8" fill="#d4c8f3"/>
  <text x="482" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#554c7a">C API</text>
  <text x="530" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a6f89">Paket</text>
  <text x="574" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#554c7a">Eski</text>

  <!-- bottom alternative -->
  <path d="M300 232 V259" fill="none" stroke="#6b9d88" stroke-width="2"/>
  <polygon points="300,259 295,250 305,250" fill="#6b9d88"/>
  <g filter="url(#smallShadow)">
    <rect x="199" y="261" width="202" height="43" rx="16" fill="url(#safeGrad)"/>
  </g>
  <text x="300" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d705b">Serbest iş parçacığı</text>
  <text x="300" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56806d">ince kilitler • uyumluluk • maliyet</text>
