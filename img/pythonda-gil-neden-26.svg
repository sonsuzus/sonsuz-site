<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="gilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe7ad"/>
      <stop offset="100%" stop-color="#ffd18a"/>
    </linearGradient>
    <linearGradient id="safeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f3e4"/>
      <stop offset="100%" stop-color="#bce8d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7390a0" flood-opacity="0.19"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#718596" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="75" cy="45" r="54" fill="#dceeff" opacity="0.48"/>
  <circle cx="589" cy="274" r="78" fill="#dff3e5" opacity="0.52"/>
  <circle cx="548" cy="42" r="29" fill="#fff0c9" opacity="0.55"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#395266">CPython ve GIL</text>
  <text x="28" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718595">Bir kilit, birçok yapısal bağ</text>

  <!-- left threads -->
  <g filter="url(#shadow)">
    <rect x="28" y="84" width="145" height="148" rx="18" fill="#e8f1ff"/>
  </g>
  <text x="48" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#48627a">İş parçacıkları</text>
  <g filter="url(#smallShadow)">
    <rect x="47" y="124" width="106" height="22" rx="10" fill="#ffffff"/>
    <rect x="47" y="155" width="106" height="22" rx="10" fill="#ffffff"/>
    <rect x="47" y="186" width="106" height="22" rx="10" fill="#ffffff"/>
  </g>
  <circle cx="62" cy="135" r="5" fill="#92b9ef"/>
  <circle cx="62" cy="166" r="5" fill="#a69be8"/>
  <circle cx="62" cy="197" r="5" fill="#76c7b0"/>
  <text x="76" y="139" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536c7e">Python kodu</text>
  <text x="76" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536c7e">Python kodu</text>
  <text x="76" y="201" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#536c7e">Python kodu</text>

  <!-- arrows incoming -->
  <path d="M174 135 H207" fill="none" stroke="#8095a7" stroke-width="2"/>
  <polygon points="207,135 198,130 198,140" fill="#8095a7"/>
  <path d="M174 166 H207" fill="none" stroke="#8095a7" stroke-width="2"/>
