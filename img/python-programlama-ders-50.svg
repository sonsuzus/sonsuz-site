<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#a0b8d0" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f6ff"/>
      <stop offset="100%" stop-color="#eef7ec"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdeee8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eafaf0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5ecfa"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c4a6e">Python Ders 2: Değişkenler, Deyimler ve Cümleler</text>

  <!-- Merkez kavram -->
  <rect x="245" y="55" width="150" height="42" rx="21" fill="#4a7dbd" opacity="0.9" filter="url(#shadow)"/>
  <text x="320" y="81" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Kod Yapıları</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üst ok -->
  <path d="M 245 76 L 170 76" stroke="#5a8ab5" stroke-width="2" fill="none"/>
  <polygon points="170,70 158,76 170,82" fill="#5a8ab5"/>
  <!-- Sağ üst ok -->
  <path d="M 395 76 L 470 76" stroke="#5a8ab5" stroke-width="2" fill="none"/>
  <polygon points="470,70 482,76 470,82" fill="#5a8ab5"/>
  <!-- Sol alt ok -->
  <path d="M 245 90 L 170 130" stroke="#5a8ab5" stroke-width="2" fill="none"/>
  <polygon points="170,122 160,136 178,132" fill="#5a8ab5"/>
  <!-- Sağ alt ok -->
  <path d="M 395 90 L 470 130" stroke="#5a8ab5" stroke-width="2" fill="none"/>
  <polygon points="470,122 480,136 462,132" fill="#5a8ab5"/>
  <!-- Alt orta ok -->
  <path d="M 320 97 L 320 135" stroke="#5a8ab5" stroke-width="2" fill="none"/>
  <polygon points="314,135 320,147 326,135" fill="#5a8ab5"/>

  <!-- Değerler ve Tipler -->
  <rect x="30" y="55" width="120" height="42" rx="10" fill="url(#box1)" stroke="#b8cfe8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c4a6e">Değerler</text>
  <text x="90" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">int, float, str</text>

  <!-- Değişkenler -->
  <rect x="490" y="55" width="120" height="42" rx="10" fill="url(#box2)" stroke="#e8c8b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6e4a2c">Değişkenler</text>
  <text x="550" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#8a6a4a">isim = değer</text>

  <!-- Cümleler -->
  <rect x="30" y="145" width="120" height="42" rx="10" fill="url(#box3)" stroke="#b8e8c8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c6e4a">Cümleler</text>
  <text x="90" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a6a">print, atama</text>

  <!-- Deyimler -->
  <rect x="490" y="145" width="120" height="42" rx="10" fill="url(#box4)" stroke="#d8b8e8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a2c6e">Deyimler</text>
  <text x="550" y="178" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a4a8a">işleç + işlenen</text>

  <!-- Alt kavramlar -->
  <rect x="245" y="150" width="150" height="42" rx="10" fill="url(#box1)" stroke="#b8cfe8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="167" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c4a6e">İşleçler</text>
  <text x="320" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">+, -, *, /, //</text>

  <!-- Alt bağlantılar -->
  <path d="M 90 187 L 90 215" stroke="#5a8ab5" stroke-width="1.5" fill="none"/>
  <polygon points="84,215 90,227 96,215" fill="#5a8ab5"/>
  <path d="M 550 187 L 550 215" stroke="#5a8ab5" stroke-width="1.5" fill="none"/>
  <polygon points="544,215 550,227 556,215" fill="#5a8ab5"/>
  <path d="M 320 192 L 320 215" stroke="#5a8ab5" stroke-width="1.5" fill="none"/>
  <polygon points="314,215 320,227 326,215" fill="#5a8ab5"/>

  <!-- Alt detaylar -->
  <rect x="30" y="230" width="120" height="35" rx="8" fill="#ffffff" stroke="#c8d8e8" stroke-width="1" filter="url(#shadow)"/>
  <text x="90" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Anahtar Kelimeler</text>

  <rect x="245" y="230" width="150" height="35" rx="8" fill="#ffffff" stroke="#c8d8e8" stroke-width="1" filter="url(#shadow)"/>
  <text x="320" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Öncelik Kuralları</text>

  <rect x="490" y="230" width="120" height="35" rx="8" fill="#ffffff" stroke="#c8d8e8" stroke-width="1" filter="url(#shadow)"/>
  <text x="550" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a8a">Kompozisyon</text>

  <!-- Alt oklar -->
  <path d="M 90 265 L 90 285" stroke="#5a8ab5" stroke-width="1.5" fill="none"/>
  <polygon points="84,285 90,297 96,285" fill="#5a8ab5"/>
  <path d="M 320 265 L 320 285" stroke="#5a8ab5" stroke-width="1.5" fill="none"/>
  <polygon points="314,285 320,297 326,285" fill="#5a8ab5"/>
  <path d="M 550 265 L 550 285" stroke="#5a8ab5" stroke-width="1.5" fill="none"/>
  <polygon points="544,285 550,297 556,285" fill="#5a8ab5"/>

  <!-- En alt -->
  <rect x="170" y="300" width="300" height="15" rx="7" fill="#4a7dbd" opacity="0.15"/>
  <text x="320" y="311" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#2c4a6e">Temel Programlama Kavramları</text>
</svg>