<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="classGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#88c4d8"/>
    </linearGradient>
    <linearGradient id="objGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8e0b8"/>
      <stop offset="100%" stop-color="#9ad09a"/>
    </linearGradient>
    <linearGradient id="attrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="100%" stop-color="#e8b87e"/>
    </linearGradient>
    <linearGradient id="methodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c3b8e8"/>
      <stop offset="100%" stop-color="#a898d8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#3a5a7a">Python Sınıf Yapısı</text>

  <!-- Sınıf kutusu -->
  <rect x="50" y="50" width="180" height="220" rx="14" fill="url(#classGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="140" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a3a4a">Sınıf Bildirimi</text>
  <line x1="65" y1="85" x2="215" y2="85" stroke="#1a3a4a" stroke-width="1" opacity="0.3"/>

  <!-- Ortak değişkenler -->
  <rect x="65" y="95" width="150" height="40" rx="8" fill="url(#attrGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="140" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a2a0a">Ortak Değişkenler</text>
  <text x="140" y="127" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a4a2a">(dışarıdan erişilebilir)</text>

  <!-- Özel değişkenler -->
  <rect x="65" y="145" width="150" height="40" rx="8" fill="url(#attrGrad)" filter="url(#shadow)" opacity="0.75"/>
  <text x="140" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a2a0a">Özel Değişkenler</text>
  <text x="140" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#6a4a2a">(__ ile başlar)</text>

  <!-- __init__ metodu -->
  <rect x="65" y="195" width="150" height="35" rx="8" fill="url(#methodGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="140" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a1a5a">__init__ (kurucu)</text>
  <text x="140" y="225" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a3a7a">başlangıç ataması</text>

  <!-- Diğer metodlar -->
  <rect x="65" y="240" width="150" height="25" rx="8" fill="url(#methodGrad)" filter="url(#shadow)" opacity="0.7"/>
  <text x="140" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a1a5a">Diğer Metodlar</text>

  <!-- Ok: Sınıf -> Nesne -->
  <path d="M 235 160 L 295 160" stroke="#3a6a8a" stroke-width="2" fill="none"/>
  <polygon points="295,155 305,160 295,165" fill="#3a6a8a"/>

  <!-- Nesne kutusu -->
  <rect x="310" y="50" width="180" height="220" rx="14" fill="url(#objGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="400" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a4a1a">Nesne Örnekleri</text>
  <line x1="325" y1="85" x2="475" y2="85" stroke="#1a4a1a" stroke-width="1" opacity="0.3"/>

  <!-- Nesne 1 -->
  <rect x="325" y="95" width="150" height="40" rx="8" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="400" y="112" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a2a">nesne1</text>
  <text x="400" y="127" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a7a4a">sınıf kopyası</text>

  <!-- Nesne 2 -->
  <rect x="325" y="145" width="150" height="40" rx="8" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="400" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a2a">nesne2</text>
  <text x="400" y="177" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a7a4a">sınıf kopyası</text>

  <!-- Nesne 3 -->
  <rect x="325" y="195" width="150" height="40" rx="8" fill="#ffffff" filter="url(#shadow)" opacity="0.85"/>
  <text x="400" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a2a">nesne3</text>
  <text x="400" y="227" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#4a7a4a">sınıf kopyası</text>

  <!-- Erişim okları -->
  <path d="M 400 240 L 400 260" stroke="#3a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="395,260 400,268 405,260" fill="#3a7a3a"/>

  <text x="400" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">nesne.değişken</text>
  <text x="400" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">nesne.metod()</text>

  <!-- Sağ tarafta erişim notu -->
  <rect x="520" y="95" width="100" height="130" rx="10" fill="#e8f0e8" filter="url(#shadow)" opacity="0.8"/>
  <text x="570" y="115" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#2a5a2a">Erişim</text>
  <line x1="530" y1="122" x2="610" y2="122" stroke="#2a5a2a" stroke-width="0.5" opacity="0.3"/>
  <text x="570" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">Sadece nesne</text>
  <text x="570" y="155" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">üzerinden</text>
  <text x="570" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">erişilir</text>
  <text x="570" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#3a6a3a">Kapsülleme</text>

  <!-- Bağlantı çizgisi -->
  <path d="M 475 160 L 520 160" stroke="#3a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="520,155 528,160 520,165" fill="#3a7a3a"/>
</svg>