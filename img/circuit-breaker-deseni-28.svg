<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="closed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcf5e8"/>
      <stop offset="100%" stop-color="#bce8d2"/>
    </linearGradient>
    <linearGradient id="open" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe5e1"/>
      <stop offset="100%" stop-color="#f5bcb8"/>
    </linearGradient>
    <linearGradient id="half" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d5"/>
      <stop offset="100%" stop-color="#f5d98b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#60819a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#60819a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="323" cy="157" r="118" fill="#dceefa" opacity="0.35"/>
  <circle cx="322" cy="157" r="91" fill="none" stroke="#c9dce8" stroke-width="1.5" stroke-dasharray="4 6"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">DEVRE KESİCİ</text>
  <text x="28" y="46" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71889a">Zincirleme hataya karşı koruma</text>

  <!-- İstemci -->
  <g filter="url(#shadow)">
    <rect x="27" y="126" width="112" height="64" rx="16" fill="#ffffff"/>
    <rect x="38" y="140" width="26" height="26" rx="8" fill="#dceafa"/>
    <circle cx="51" cy="150" r="5" fill="#6295bc"/>
    <path d="M42 162 C44 155 58 155 60 162" fill="none" stroke="#6295bc" stroke-width="2" stroke-linecap="round"/>
    <text x="76" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">İstemci</text>
    <text x="76" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a0">İstek</text>
  </g>

  <!-- giriş oku -->
  <path d="M140 157 H188" fill="none" stroke="#6388a2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="188,157 180,152 180,162" fill="#6388a2"/>

  <!-- merkez sigorta -->
  <g filter="url(#shadow)">
    <rect x="190" y="107" width="143" height="100" rx="22" fill="#ffffff"/>
    <rect x="208" y="125" width="107" height="30" rx="10" fill="#e6f1fa"/>
    <text x="261.5" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">Devre Kesici</text>
    <path d="M217 174 H239 L247 164 L257 185 L268 164 L278 174 H306" fill="none" stroke="#527b99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="220" cy="174" r="4" fill="#77b695"/>
    <circle cx="304" cy="174" r="4" fill="#77b695"/>
  </g>

  <!-- hedef -->
  <path d="M334 157 H483" fill="none" stroke="#6388a2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="483,157 475,152 475,162" fill="#6388a2"/>
  <g filter="url(#shadow)">
    <rect x="485" y="126" width="128" height="64" rx="16" fill="#ffffff"/>
    <rect x="499" y="140" width="28" height="28" rx="8" fill="#e4ecff"/>
    <path d="M506 148 H520 M506 154 H520 M506 160 H515" stroke="#7188b8" stroke-width="2" stroke-linecap="round"/>
    <text x="540" y="153" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">Bağımlı</text>
    <text x="540" y="169" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7890a0">Servis</text>
  </g>

  <!-- closed state -->
  <g filter="url(#smallShadow)">
    <rect x="224" y="65" width="101" height="38" rx="13" fill="url(#closed)"/>
    <circle cx="241" cy="84" r="7" fill="#4b9b70"/>
    <path d="M237.5 84 L240 86.5 L245 81" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="278" y="88" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#317253">Kapalı</text>
  </g>
  <path d="M274 104 V107" fill="none" stroke="#69a886" stroke-width="2"/>
  <polygon points="274,111 270,105 278,105" fill="#69a886"/>

  <!-- error branch to open -->
  <path d="M207 178 C174 201 177 242 222 251" fill="none" stroke="#d37e79" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="226,252 219,246 220,255" fill="#d37e79"/>
  <text x="156" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ae6260">Hata eşiği</text>

  <!-- open state -->
  <g filter="url(#smallShadow)">
    <rect x="224" y="248" width="101" height="38" rx="13" fill="url(#open)"/>
    <circle cx="241" cy="267" r="7" fill="#cf6764"/>
    <path d="M237.5 263.5 L244.5 270.5 M244.5 263.5 L237.5 270.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="278" y="271" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#984947">Açık</text>
  </g>

  <!-- fallback -->
  <path d="M223 267 H137" fill="none" stroke="#d37e79" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="137,267 145,262 145,272" fill="#d37e79"/>
  <g filter="url(#smallShadow)">
    <rect x="27" y="240" width="108" height="53" rx="15" fill="#fffafa"/>
    <rect x="39" y="252" width="24" height="24" rx="7" fill="#ffe2df"/>
    <path d="M45 264 H57 M51 258 V270" stroke="#c46d68" stroke-width="2" stroke-linecap="round"/>
    <text x="75" y="262" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8d5452">Alternatif</text>
    <text x="75" y="278" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9e7774">Hızlı yanıt</text>
  </g>

  <!-- wait to half-open -->
  <path d="M326 267 C369 263 397 239 400 205" fill="none" stroke="#c89b3d" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="400,201 395,208 404,207" fill="#c89b3d"/>
  <text x="353" y="249" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#97742e">Bekleme</text>

  <!-- half open -->
  <g filter="url(#smallShadow)">
    <rect x="399" y="199" width="112" height="38" rx="13" fill="url(#half)"/>
    <circle cx="417" cy="218" r="7" fill="#cf9e32"/>
    <path d="M417 213 V218 L421 221" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="465" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#87651e">Yarı Açık</text>
  </g>

  <!-- test to target -->
  <path d="M455 198 C476 186 492 181 504 184" fill="none" stroke="#c89b3d" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <polygon points="508,185 501,179 500,188" fill="#c89b3d"/>
  <text x="484" y="208" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#97742e">Test</text>

  <!-- success loop -->
  <path d="M416 216 C382 207 350 192 326 177" fill="none" stroke="#65a984" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="322,174 331,174 327,182" fill="#65a984"/>
  <text x="353" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4c8d6a">Başarı</text>

  <!-- metrics -->
  <g opacity="0.9">
    <rect x="510" y="249" width="103" height="38" rx="12" fill="#e8f1f6"/>
    <path d="M523 274 V263 M530 274 V256 M537 274 V267" stroke="#668ba5" stroke-width="2.2" stroke-linecap="round"/>
    <text x="551" y="271" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#57758a">Metrikler</text>
  </g>
</svg>