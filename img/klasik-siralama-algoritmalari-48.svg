  <circle cx="306" cy="149" r="4" fill="#e88fa0"/>
  <circle cx="320" cy="171" r="4" fill="#7bb3d7"/>
  <circle cx="320" cy="139" r="4" fill="#8dbb78"/>
  <circle cx="334" cy="139" r="4" fill="#aa90d0"/>
  <circle cx="334" cy="160" r="4" fill="#72bba9"/>
  <circle cx="348" cy="160" r="4" fill="#f0b45c"/>
