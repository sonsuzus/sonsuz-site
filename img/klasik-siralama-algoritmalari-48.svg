  <text x="78" y="256" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3d789f">O(n)</text>
  <text x="117" y="256" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#597080">Küçük liste</text>

