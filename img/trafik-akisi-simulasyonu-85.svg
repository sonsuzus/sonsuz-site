      <stop offset="100%" stop-color="#cdddf7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a8" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7890a8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="118" fill="#dbeaf0" opacity="0.34"/>
  <circle cx="320" cy="160" r="94" fill="none" stroke="#aac7d0" stroke-width="2" stroke-dasharray="5 7" opacity="0.55"/>

