<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c8ddf7"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#59718a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#526f75" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="76" cy="52" r="90" fill="#d9edf3" opacity="0.34"/>
  <circle cx="584" cy="267" r="120" fill="#e6f1d9" opacity="0.42"/>

  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38536a">ÖNYARGI SİSTEMİ</text>

  <!-- left data source -->
  <g filter="url(#soft)">
    <rect x="30" y="70" width="144" height="120" rx="18" fill="#fff7e9" stroke="#efcf96"/>
    <circle cx="57" cy="98" r="15" fill="#f6d491"/>
    <path d="M50 99h14M57 92v14" stroke="#8d6630" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="96" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6d5130">Veri Geçmişi</text>
    <text x="49" y="129" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765f40">Eksik temsil</text>
    <text x="49" y="151" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765f40">İnsan etiketleri</text>
    <text x="49" y="173" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#765f40">Vekil değişken</text>
  </g>

  <!-- algorithm source -->
  <g filter="url(#soft)">
    <rect x="30" y="211" width="144" height="78" rx="18" fill="#f2edff" stroke="#d3c3f1"/>
    <circle cx="57" cy="238" r="15" fill="#d9ccf5"/>
    <path d="M50 233h14M50 238h14M50 243h14" stroke="#64518e" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="236" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#594778">Algoritma</text>
    <text x="49" y="267" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#705e8d">Kayıp ve eşik</text>
  </g>

  <!-- arrows to model -->
  <path d="M174 130H217" fill="none" stroke="#b4813b" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="224,130 215,125 215,135" fill="#b4813b"/>
  <path d="M174 250H217" fill="none" stroke="#8067ae" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="224,250 215,245 215,255" fill="#8067ae"/>

  <!-- central model -->
  <g filter="url(#shadow)">
    <rect x="224" y="107" width="181" height="122" rx="25" fill="url(#core)" stroke="#9bbbd7"/>
    <circle cx="314" cy="145" r="25" fill="#ffffff" opacity="0.72"/>
    <path d="M299 144c7-13 22-13 30 0M299 151c7 13 22 13 30 0" fill="none" stroke="#4f799c" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="304" cy="145" r="3" fill="#4f799c"/>
    <circle cx="324" cy="145" r="3" fill="#4f799c"/>
    <text x="314" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b79">Öğrenen Model</text>
    <text x="314" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4e718d">Örüntüyü büyütebilir</text>
  </g>

  <!-- arrow right -->
  <path d="M405 168H448" fill="none" stroke="#5f88a1" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="455,168 446,163 446,173" fill="#5f88a1"/>

  <!-- decision -->
  <g filter="url(#shadow)">
    <rect x="455" y="92" width="153" height="151" rx="21" fill="#ecf7ee" stroke="#a9d2b1"/>
    <circle cx="486" cy="122" r="16" fill="#c9e8d0"/>
    <path d="M478 122l5 5 11-12" fill="none" stroke="#39744b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="512" y="126" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#356247">Karar</text>
    <line x1="477" y1="147" x2="586" y2="147" stroke="#b8d8be"/>
    <text x="477" y="170" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476d53">İşe alım</text>
    <text x="477" y="193" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476d53">Kredi</text>
    <text x="477" y="216" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476d53">Hizmet erişimi</text>
  </g>

  <!-- audit loop -->
  <path d="M529 243v34c0 12-10 18-22 18H239c-12 0-19-7-19-18v-20" fill="none" stroke="#699789" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 5"/>
  <polygon points="220,250 225,260 215,260" fill="#699789"/>
  <g filter="url(#soft)">
    <rect x="275" y="270" width="192" height="35" rx="14" fill="#ffffff" stroke="#b7d8ce"/>
    <text x="371" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#42766a">Grup bazlı adalet kontrolü</text>
  </g>
</svg>