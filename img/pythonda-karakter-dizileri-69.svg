<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#d1e8f0"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0e8"/>
      <stop offset="100%" stop-color="#d4e4d4"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e8f4"/>
      <stop offset="100%" stop-color="#e0d4ec"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f0e8"/>
      <stop offset="100%" stop-color="#ece4d4"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e8f0"/>
      <stop offset="100%" stop-color="#b8d8e8"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez: String -->
  <rect x="245" y="125" width="150" height="70" rx="14" fill="url(#center)" filter="url(#shadow)" stroke="#7ab8d0" stroke-width="1.5"/>
  <text x="320" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2a5a70">String</text>
  <text x="320" y="172" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a7a90">karakter dizisi</text>

  <!-- Sol üst: İndeksleme -->
  <rect x="40" y="30" width="140" height="80" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#8ab8d0" stroke-width="1.2"/>
  <text x="110" y="55" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2a5a70">İndeksleme</text>
  <text x="110" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a90">metin[0]</text>
  <text x="110" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a90">metin[-1]</text>

  <!-- Sağ üst: Dilimleme -->
  <rect x="460" y="30" width="140" height="80" rx="12" fill="url(#box2)" filter="url(#shadow)" stroke="#8ab890" stroke-width="1.2"/>
  <text x="530" y="55" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#2a6a40">Dilimleme</text>
  <text x="530" y="75" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a60">metin[a:b]</text>
  <text x="530" y="92" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a60">metin[::-1]</text>

  <!-- Sol alt: Metotlar -->
  <rect x="40" y="210" width="140" height="80" rx="12" fill="url(#box3)" filter="url(#shadow)" stroke="#a88ac0" stroke-width="1.2"/>
  <text x="110" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#5a3a80">Metotlar</text>
  <text x="110" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a5aa0">lower() upper()</text>
  <text x="110" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a5aa0">strip() split()</text>

  <!-- Sağ alt: Arama -->
  <rect x="460" y="210" width="140" height="80" rx="12" fill="url(#box4)" filter="url(#shadow)" stroke="#c0a878" stroke-width="1.2"/>
  <text x="530" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#806020">Arama</text>
  <text x="530" y="255" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a08040">in operatörü</text>
  <text x="530" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a08040">find()</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üstten merkeze -->
  <path d="M180 70 L240 130" stroke="#7ab8d0" stroke-width="2" fill="none"/>
  <polygon points="240,130 232,120 234,132" fill="#7ab8d0"/>

  <!-- Sağ üstten merkeze -->
  <path d="M460 70 L400 130" stroke="#8ab890" stroke-width="2" fill="none"/>
  <polygon points="400,130 408,120 406,132" fill="#8ab890"/>

  <!-- Sol alttan merkeze -->
  <path d="M180 250 L240 195" stroke="#a88ac0" stroke-width="2" fill="none"/>
  <polygon points="240,195 232,205 234,193" fill="#a88ac0"/>

  <!-- Sağ alttan merkeze -->
  <path d="M460 250 L400 195" stroke="#c0a878" stroke-width="2" fill="none"/>
  <polygon points="400,195 408,205 406,193" fill="#c0a878"/>

  <!-- Alt bilgi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a8a9a" opacity="0.8">Python str: immutable ve güçlü metotlarla donanımlı</text>
</svg>