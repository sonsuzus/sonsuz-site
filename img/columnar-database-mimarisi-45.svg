    <rect x="298" y="126" width="98" height="25" rx="8" fill="#f7f2ff" opacity="0.9"/>
    <rect x="298" y="159" width="98" height="25" rx="8" fill="#f7f2ff" opacity="0.9"/>
    <rect x="298" y="192" width="98" height="25" rx="8" fill="#f7f2ff" opacity="0.9"/>
