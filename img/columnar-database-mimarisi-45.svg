<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bce6f5"/>
      <stop offset="100%" stop-color="#8dcae2"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ee6c5"/>
      <stop offset="100%" stop-color="#57b98d"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2d5fb"/>
      <stop offset="100%" stop-color="#bda8ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#57718a" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#53c491" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="594" cy="38" r="62" fill="#d9eff3" opacity="0.45"/>
  <circle cx="42" cy="293" r="76" fill="#e2f1d6" opacity="0.5"/>

  <text x="30" y="34" fill="#334e61" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Sütun Bazlı Analitik Akış</text>
  <text x="30" y="52" fill="#728795" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Az sütun oku · çok satırı tara</text>

  <g filter="url(#shadow)">
    <rect x="29" y="76" width="191" height="194" rx="16" fill="#ffffff"/>
    <rect x="29" y="76" width="191" height="33" rx="16" fill="#e5f0f8"/>
    <rect x="29" y="96" width="191" height="13" fill="#e5f0f8"/>
  </g>
  <text x="47" y="98" fill="#39566a" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Siparişler · 20 sütun</text>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <text x="48" y="128" fill="#718796">müşteri</text>
