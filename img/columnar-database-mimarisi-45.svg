    <text x="48" y="152" fill="#718796">tarih</text>
    <rect x="111" y="140" width="88" height="16" rx="5" fill="url(#active)" filter="url(#glow)"/>
    <text x="48" y="176" fill="#718796">kategori</text>
    <rect x="111" y="164" width="88" height="16" rx="5" fill="url(#active)" filter="url(#glow)"/>
    <text x="48" y="200" fill="#718796">miktar</text>
