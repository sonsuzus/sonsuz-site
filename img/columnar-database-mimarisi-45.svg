  <text x="305" y="209" fill="#67548d" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Vektör işleme</text>

  <path d="M419 171 H459" stroke="#8a71bd" stroke-width="3" stroke-linecap="round"/>
  <polygon points="459,171 449,165 449,177" fill="#8a71bd"/>

  <g filter="url(#shadow)">
    <rect x="469" y="91" width="143" height="158" rx="18" fill="#ffffff"/>
    <rect x="469" y="91" width="143" height="35" rx="18" fill="#d8f0e5"/>
    <rect x="469" y="111" width="143" height="15" fill="#d8f0e5"/>
  </g>
  <text x="488" y="114" fill="#39735c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Analitik sonuç</text>

  <text x="487" y="149" fill="#6a8290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Kategori</text>
  <text x="560" y="149" fill="#6a8290" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Ciro</text>
  <path d="M486 157 H595" stroke="#dce8e7" stroke-width="1"/>
  <text x="487" y="178" fill="#456272" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Elektronik</text>
  <rect x="559" y="167" width="29" height="9" rx="4" fill="#62c394"/>
  <text x="487" y="201" fill="#456272" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Ev yaşamı</text>
  <rect x="559" y="190" width="20" height="9" rx="4" fill="#8bcfb1"/>
  <text x="487" y="224" fill="#456272" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Giyim</text>
  <rect x="559" y="213" width="13" height="9" rx="4" fill="#b1ddc7"/>

  <g transform="translate(269 265)">
    <rect x="0" y="0" width="109" height="28" rx="14" fill="#e5f4eb"/>
    <circle cx="16" cy="14" r="5" fill="#52b886"/>
    <text x="29" y="18" fill="#438064" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Daha az G/Ç</text>
