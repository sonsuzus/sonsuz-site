<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez düğüm -->
  <rect x="255" y="125" width="130" height="50" rx="12" fill="#6c8ebf" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">Bizans Generalleri</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e8f0fe">Problemi</text>

  <!-- Sol üst: Dürüst General -->
  <rect x="40" y="40" width="120" height="45" rx="10" fill="#a8c5a0" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="100" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d4a2d" font-weight="bold">Dürüst General</text>
  <text x="100" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d5c3d">Doğru bilgi</text>

  <!-- Sağ üst: Hain General -->
  <rect x="480" y="40" width="120" height="45" rx="10" fill="#d4a0a0" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="540" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c2d2d" font-weight="bold">Hain General</text>
  <text x="540" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c3d3d">Çelişkili mesaj</text>

  <!-- Sol alt: Kararsız General -->
  <rect x="40" y="235" width="120" height="45" rx="10" fill="#d4c5a0" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="100" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c4d2d" font-weight="bold">Kararsız General</text>
  <text x="100" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c6d3d">Gecikmiş yanıt</text>

  <!-- Sağ alt: Doğrulayıcı -->
  <rect x="480" y="235" width="120" height="45" rx="10" fill="#9ab8d4" filter="url(#shadowLight)" opacity="0.85"/>
  <text x="540" y="253" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2d3d5c" font-weight="bold">Doğrulayıcı</text>
  <text x="540" y="269" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3d4d6c">İmza ve quorum</text>

  <!-- Oklar: Dürüst -> Merkez -->
  <path d="M160 62 L250 135" stroke="#6c8ebf" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="250,135 242,128 244,138" fill="#6c8ebf" opacity="0.6"/>

  <!-- Oklar: Hain -> Merkez -->
  <path d="M480 62 L390 135" stroke="#d4a0a0" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="390,135 398,128 396,138" fill="#d4a0a0" opacity="0.6"/>

  <!-- Oklar: Kararsız -> Merkez -->
  <path d="M160 257 L250 185" stroke="#d4c5a0" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="250,185 242,192 244,182" fill="#d4c5a0" opacity="0.6"/>

  <!-- Oklar: Doğrulayıcı -> Merkez -->
  <path d="M480 257 L390 185" stroke="#9ab8d4" stroke-width="2" fill="none" opacity="0.6"/>
  <polygon points="390,185 398,192 396,182" fill="#9ab8d4" opacity="0.6"/>

  <!-- Alt bilgi: Temel ilkeler -->
  <rect x="200" y="270" width="240" height="35" rx="8" fill="#e8eef5" filter="url(#shadowLight)" opacity="0.7"/>
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4a5a6a">Tutarlılık · Geçerlilik · Sonlanma</text>
  <text x="320" y="299" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a6a7a">n ≥ 3f + 1</text>

  <!-- Üst bilgi: Güven mekanizması -->
  <rect x="230" y="15" width="180" height="30" rx="8" fill="#d0e0d0" filter="url(#shadowLight)" opacity="0.6"/>
  <text x="320" y="35" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3a5a3a">Güven = Mekanizma</text>
</svg>