<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="mavi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceeff"/>
      <stop offset="100%" stop-color="#c9ddf7"/>
    </linearGradient>
    <linearGradient id="mor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eee4ff"/>
      <stop offset="100%" stop-color="#ddd0f5"/>
    </linearGradient>
    <linearGradient id="yesil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddf3e4"/>
      <stop offset="100%" stop-color="#c9e8d3"/>
    </linearGradient>
    <linearGradient id="turuncu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d8"/>
      <stop offset="100%" stop-color="#f6ddba"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#55718a" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#55718a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#zemin)"/>
  <circle cx="70" cy="278" r="94" fill="#dceeff" opacity="0.32"/>
  <circle cx="583" cy="42" r="88" fill="#dff2e4" opacity="0.35"/>

  <text x="28" y="29" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38546b">DNS Çözümleme Akışı</text>
  <text x="28" y="47" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#728695">Alan adı → IP adresi</text>

  <!-- İstemci -->
  <g filter="url(#golge)">
    <rect x="28" y="116" width="112" height="104" rx="18" fill="url(#mavi)" stroke="#b7d1ea"/>
    <rect x="51" y="136" width="66" height="42" rx="6" fill="#fafdff" stroke="#88afd0" stroke-width="2"/>
    <rect x="58" y="143" width="52" height="27" rx="3" fill="#d8ebfa"/>
    <path d="M44 188 H124" stroke="#88afd0" stroke-width="3" stroke-linecap="round"/>
    <path d="M77 188 L72 201 H96 L91 188" fill="none" stroke="#88afd0" stroke-width="3" stroke-linejoin="round"/>
    <text x="84" y="209" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#345b78">İstemci</text>
  </g>
  <rect x="42" y="229" width="84" height="23" rx="11" fill="#ffffff" opacity="0.75"/>
  <text x="84" y="245" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6980">www.example.com</text>

  <!-- İstemci resolver bağlantısı -->
  <path d="M140 164 H178" fill="none" stroke="#6590b0" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="178,164 169,159 169,169" fill="#6590b0"/>
  <text x="159" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6d8190">sorgu</text>

  <!-- Resolver -->
  <g filter="url(#golge)">
    <rect x="181" y="102" width="137" height="126" rx="20" fill="url(#mor)" stroke="#cab8e5"/>
    <circle cx="249.5" cy="136" r="20" fill="#f9f6ff" stroke="#a88bd0" stroke-width="2"/>
    <path d="M239 137 C239 129 246 125 251 129 C256 123 266 127 266 135 C266 142 260 145 253 145 H241 C236 145 234 140 239 137Z" fill="#b79cde"/>
    <rect x="204" y="166" width="91" height="26" rx="9" fill="#ffffff" opacity="0.75"/>
    <text x="249.5" y="184" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#57446f">Özyinelemeli</text>
    <text x="249.5" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#57446f">çözücü</text>
  </g>

  <!-- Önbellek -->
  <g filter="url(#hafifGolge)">
    <rect x="190" y="246" width="119" height="48" rx="14" fill="url(#turuncu)" stroke="#e7c795"/>
    <path d="M211 261 C211 256 218 256 218 261 V279 C218 284 211 284 211 279Z" fill="#fff9ef" stroke="#c99b62"/>
    <path d="M211 267 H218 M211 273 H218" stroke="#c99b62"/>
    <text x="261" y="267" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7a5931">Önbellek</text>
    <text x="261" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7a5931">TTL</text>
  </g>
  <path d="M249 228 V246" fill="none" stroke="#b18b61" stroke-width="2" stroke-linecap="round"/>
  <polygon points="249,246 244,237 254,237" fill="#b18b61"/>

  <!-- Hiyerarşi bağlantıları -->
  <path d="M318 137 H349 V84 H377" fill="none" stroke="#7c91a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="377,84 368,79 368,89" fill="#7c91a1"/>
  <path d="M318 164 H348 V161 H377" fill="none" stroke="#7c91a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="377,161 368,156 368,166" fill="#7c91a1"/>
  <path d="M318 193 H349 V238 H377" fill="none" stroke="#7c91a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="377,238 368,233 368,243" fill="#7c91a1"/>

  <!-- Sunucular -->
  <g filter="url(#hafifGolge)">
    <rect x="380" y="55" width="125" height="58" rx="16" fill="url(#mavi)" stroke="#b2cee4"/>
    <circle cx="406" cy="84" r="14" fill="#f9fdff" stroke="#82aaca" stroke-width="1.5"/>
    <path d="M397 84 H415 M406 75 V93 M400 78 C405 81 407 87 400 90 M412 78 C407 81 405 87 412 90" fill="none" stroke="#6898bd" stroke-width="1.3"/>
    <text x="450" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365a75">Kök sunucu</text>
    <text x="450" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52748c">TLD yönlendirmesi</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="380" y="132" width="125" height="58" rx="16" fill="url(#yesil)" stroke="#afd5ba"/>
    <circle cx="406" cy="161" r="14" fill="#fbfffc" stroke="#7aae8c" stroke-width="1.5"/>
    <text x="406" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#548365">.com</text>
    <text x="456" y="157" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6a4d">TLD sunucusu</text>
    <text x="456" y="175" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d8069">Yetkili adresi</text>
  </g>

  <g filter="url(#hafifGolge)">
    <rect x="380" y="209" width="125" height="58" rx="16" fill="url(#turuncu)" stroke="#e5c38f"/>
    <rect x="394" y="224" width="24" height="28" rx="4" fill="#fffaf1" stroke="#c99b62"/>
    <path d="M400 232 H412 M400 239 H412 M400 246 H407" stroke="#c99b62" stroke-width="1.5"/>
    <text x="458" y="234" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#77552d">Yetkili</text>
    <text x="458" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#77552d">sunucu</text>
  </g>

  <!-- Yanıt dönüşü -->
  <path d="M505 238 H535 V164 H553" fill="none" stroke="#5a9b7a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
  <polygon points="553,164 544,159 544,169" fill="#5a9b7a"/>
  <text x="536" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#56816a">A veya AAAA</text>

  <!-- Sonuç -->
  <g filter="url(#golge)">
    <rect x="554" y="119" width="64" height="91" rx="18" fill="url(#yesil)" stroke="#a9d2b5"/>
    <path d="M570 137 H602 V168 H570Z" fill="#fbfffc" stroke="#75a989" stroke-width="1.5"/>
    <path d="M576 146 H596 M576 153 H591 M576 160 H587" stroke="#75a989" stroke-width="1.5" stroke-linecap="round"/>
    <text x="586" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#38684a">IP</text>
  </g>
  <text x="586" y="229" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#486e56">93.184.216.34</text>

  <!-- DNSSEC -->
  <g filter="url(#hafifGolge)">
    <rect x="527" y="251" width="91" height="35" rx="13" fill="#e6efff" stroke="#bfd0ec"/>
    <path d="M543 260 L550 257 L557 260 V267 C557 273 550 276 550 276 C550 276 543 273 543 267Z" fill="#779bc5"/>
    <path d="M547 267 L549 269 L553 264" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="584" y="273" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#48698d">DNSSEC</text>
  </g>
</svg>