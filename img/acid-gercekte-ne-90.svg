<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6979cf"/>
      <stop offset="100%" stop-color="#5364b4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#40506d" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#40506d" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="78" cy="49" r="63" fill="#dceef4" opacity="0.48"/>
  <circle cx="587" cy="272" r="86" fill="#e1efd8" opacity="0.55"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#43506a">GÜVENİLİR İŞLEM SÖZLEŞMESİ</text>

  <!-- bağlantılar -->
  <path d="M272 132 L198 91" fill="none" stroke="#aeb9d1" stroke-width="2"/>
  <path d="M368 132 L442 91" fill="none" stroke="#aeb9d1" stroke-width="2"/>
  <path d="M272 192 L198 233" fill="none" stroke="#aeb9d1" stroke-width="2"/>
  <path d="M368 192 L442 233" fill="none" stroke="#aeb9d1" stroke-width="2"/>

  <!-- Atomiklik -->
  <g filter="url(#shadow)">
    <rect x="42" y="52" width="164" height="80" rx="16" fill="#fff3ef"/>
    <rect x="55" y="67" width="34" height="34" rx="10" fill="#f49a84"/>
    <path d="M65 80 L72 73 L79 80 L72 88 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#71483e">Atomiklik</text>
    <text x="100" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#89665b">Ya hep ya hiç</text>
    <text x="57" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9b756b">Geri al veya onayla</text>
  </g>

  <!-- Tutarlılık -->
  <g filter="url(#shadow)">
    <rect x="434" y="52" width="164" height="80" rx="16" fill="#edf8ee"/>
    <rect x="447" y="67" width="34" height="34" rx="10" fill="#78ba87"/>
    <path d="M455 84 L462 91 L475 76" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="492" y="79" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#406a4b">Tutarlılık</text>
    <text x="492" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b8063">Kurallar korunur</text>
    <text x="449" y="119" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c9274">Kısıtlar ve denetim</text>
  </g>

  <!-- İzolasyon -->
  <g filter="url(#shadow)">
    <rect x="42" y="194" width="164" height="80" rx="16" fill="#f3effd"/>
    <rect x="55" y="209" width="34" height="34" rx="10" fill="#9b82d1"/>
    <path d="M63 229 L63 219 L69 215 L76 219 L76 229" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M69 223 L71 225 L75 220" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#594776">İzolasyon</text>
    <text x="100" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#75618f">Ara sonuç görünmez</text>
    <text x="57" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#87739f">Eşzamanlı koruma</text>
  </g>

  <!-- Kalıcılık -->
  <g filter="url(#shadow)">
    <rect x="434" y="194" width="164" height="80" rx="16" fill="#eff7fc"/>
    <rect x="447" y="209" width="34" height="34" rx="10" fill="#76afcf"/>
    <ellipse cx="464" cy="218" rx="9" ry="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M455 218 L455 232 C455 237 473 237 473 232 L473 218" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M455 225 C455 230 473 230 473 225" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="492" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e6680">Kalıcılık</text>
    <text x="492" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5a8098">Onay kalır</text>
    <text x="449" y="261" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6b92aa">Günlükten kurtarma</text>
  </g>

  <!-- merkez -->
  <g filter="url(#shadow)">
    <rect x="246" y="120" width="148" height="84" rx="22" fill="url(#core)"/>
    <text x="320" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#ffffff">İŞLEM</text>
    <text x="320" y="166" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#e9edff">100 TL Transfer</text>
    <rect x="276" y="177" width="88" height="15" rx="7.5" fill="#ffffff" opacity="0.18"/>
    <text x="320" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#ffffff">COMMIT</text>
  </g>

  <!-- alt akış -->
  <g filter="url(#smallShadow)">
    <rect x="178" y="289" width="284" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
    <text x="196" y="304" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53607a">A hesabı</text>
    <path d="M254 300 L324 300" fill="none" stroke="#6f80bb" stroke-width="2"/>
    <polygon points="324,300 317,296 317,304" fill="#6f80bb"/>
    <text x="334" y="304" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#53607a">B hesabı</text>
    <text x="423" y="304" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f8a62">Toplam korunur</text>
  </g>
</svg>