  <path d="M58 176 C53 176 50 180 50 185 C50 191 58 196 58 196 C58 196 66 191 66 185 C66 180 63 176 58 176 Z M58 182.5 A2.5 2.5 0 1 1 57.9 182.5" fill="none" stroke="#438c75" stroke-width="1.8"/>
