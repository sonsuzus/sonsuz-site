    </filter>
  </defs>

  <rect width="640" height="320" rx="20" fill="url(#bg)"/>
  <path d="M22 261 C110 220 151 287 232 248 S375 228 454 260 S557 271 621 229" fill="none" stroke="#cde4d8" stroke-width="2" opacity="0.65"/>
