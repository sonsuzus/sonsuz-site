<svg viewBox="0 0 640 320" width="640" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">SQL INSERT Komutu</text>

  <!-- Ana kutu: INSERT INTO -->
  <rect x="230" y="50" width="180" height="50" rx="12" fill="url(#box1)" filter="url(#shadow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a5f">INSERT INTO</text>
  <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#334155">tablo_adı</text>

  <!-- Ok: ana kutu -> iki seçenek -->
  <path d="M 320 100 L 320 120 L 200 135" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="200,140 195,128 205,132" fill="#64748b"/>

  <path d="M 320 100 L 320 120 L 440 135" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="440,140 435,128 445,132" fill="#64748b"/>

  <!-- Seçenek 1: Sütun adı ile -->
  <rect x="50" y="145" width="240" height="65" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="170" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Sütun Adı ile</text>
  <text x="170" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78350f">INSERT INTO tablo</text>
  <text x="170" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78350f">(sütun1, sütun2)</text>
  <text x="170" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#78350f">VALUES (deger1, deger2)</text>

  <!-- Seçenek 2: Sadece değerler -->
  <rect x="350" y="145" width="240" height="65" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#34d399" stroke-width="1.5"/>
  <text x="470" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">Sadece Değerler</text>
  <text x="470" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#064e3b">INSERT INTO tablo</text>
  <text x="470" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#064e3b">VALUES</text>
  <text x="470" y="205" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#064e3b">(deger1, deger2)</text>

  <!-- Ok: seçenekler -> sonuç -->
  <path d="M 170 210 L 170 240 L 250 255" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="250,260 241,248 255,252" fill="#64748b"/>

  <path d="M 470 210 L 470 240 L 390 255" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="390,260 381,248 395,252" fill="#64748b"/>

  <!-- Sonuç: Yeni kayıt -->
  <rect x="230" y="260" width="180" height="45" rx="12" fill="url(#box4)" filter="url(#shadow)" stroke="#f472b6" stroke-width="1.5"/>
  <text x="320" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">Yeni Kayıt</text>
  <text x="320" y="296" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#831843">Tabloya yeni satır eklenir</text>

  <!-- Alt bilgi: Örnek -->
  <rect x="40" y="275" width="160" height="35" rx="8" fill="url(#box5)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
  <text x="120" y="290" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#312e81">Örnek Tablo</text>
  <text x="120" y="303" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#312e81">personel</text>
</svg>