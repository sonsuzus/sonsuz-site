<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="queue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c9dcf5"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#daf3e5"/>
      <stop offset="100%" stop-color="#bfe4d0"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="100%" stop-color="#f7dca0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5e7890" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#587287" flood-opacity="0.17"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="82" cy="38" r="72" fill="#dceffd" opacity="0.45"/>
  <circle cx="584" cy="290" r="92" fill="#dff2dc" opacity="0.5"/>

  <text x="32" y="30" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#35566d">Eşzamanlı İşleme Mimarisi</text>
  <text x="32" y="48" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a8492">İşleri böl • çekirdeklere dağıt • ortak veriyi koru</text>

  <!-- source work -->
  <g filter="url(#shadow)">
    <rect x="32" y="94" width="122" height="132" rx="19" fill="#ffffff"/>
    <rect x="32" y="94" width="122" height="34" rx="19" fill="#e8f1ff"/>
    <rect x="32" y="111" width="122" height="17" fill="#e8f1ff"/>
  </g>
  <text x="93" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b76">Uygulama İşi</text>
  <rect x="52" y="143" width="80" height="12" rx="6" fill="#a8c9ee"/>
  <rect x="52" y="164" width="64" height="12" rx="6" fill="#b8d8f4"/>
  <rect x="52" y="185" width="74" height="12" rx="6" fill="#c9e2f7"/>
  <text x="93" y="217" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668092">Bağımsız parçalar</text>

  <!-- arrow source to queue -->
  <path d="M154 160 H188" fill="none" stroke="#698da7" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="194,160 186,155 186,165" fill="#698da7"/>

  <!-- queue -->
  <g filter="url(#shadow)">
    <rect x="196" y="119" width="126" height="82" rx="18" fill="url(#queue)"/>
  </g>
  <text x="259" y="145" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b76">İş Kuyruğu</text>
  <rect x="216" y="159" width="17" height="20" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="239" y="159" width="17" height="20" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="262" y="159" width="17" height="20" rx="5" fill="#ffffff" opacity="0.9"/>
  <rect x="285" y="159" width="17" height="20" rx="5" fill="#ffffff" opacity="0.9"/>

  <!-- branch lines -->
  <path d="M322 160 H345 V96 H365" fill="none" stroke="#6d9b87" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="371,96 363,91 363,101" fill="#6d9b87"/>
  <path d="M322 160 H365" fill="none" stroke="#6d9b87" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="371,160 363,155 363,165" fill="#6d9b87"/>
  <path d="M322 160 H345 V224 H365" fill="none" stroke="#6d9b87" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="371,224 363,219 363,229" fill="#6d9b87"/>

  <!-- cores -->
  <g filter="url(#smallShadow)">
    <rect x="374" y="67" width="112" height="58" rx="15" fill="url(#core)"/>
    <rect x="374" y="131" width="112" height="58" rx="15" fill="url(#core)"/>
    <rect x="374" y="195" width="112" height="58" rx="15" fill="url(#core)"/>
  </g>
  <circle cx="398" cy="96" r="12" fill="#ffffff" opacity="0.82"/>
  <circle cx="398" cy="160" r="12" fill="#ffffff" opacity="0.82"/>
  <circle cx="398" cy="224" r="12" fill="#ffffff" opacity="0.82"/>
  <text x="430" y="93" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315e4b">Çekirdek 1</text>
  <text x="430" y="110" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557a68">İş parçacığı</text>
  <text x="430" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315e4b">Çekirdek 2</text>
  <text x="430" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557a68">İş parçacığı</text>
  <text x="430" y="221" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315e4b">Çekirdek N</text>
  <text x="430" y="238" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#557a68">İş parçacığı</text>

  <!-- shared memory -->
  <path d="M486 96 H510 V160 H524" fill="none" stroke="#b28848" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M486 160 H524" fill="none" stroke="#b28848" stroke-width="2" stroke-linecap="round"/>
  <path d="M486 224 H510 V160" fill="none" stroke="#b28848" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="528" y="118" width="84" height="84" rx="18" fill="url(#memory)"/>
  </g>
  <rect x="550" y="139" width="40" height="29" rx="6" fill="#fffaf0" stroke="#d4ae68" stroke-width="1.5"/>
  <path d="M560 139 V134 C560 126 580 126 580 134 V139" fill="none" stroke="#b48a3f" stroke-width="3" stroke-linecap="round"/>
  <text x="570" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#765725">Ortak Bellek</text>

  <!-- lower notes -->
  <g filter="url(#smallShadow)">
    <rect x="34" y="258" width="176" height="38" rx="13" fill="#ffffff"/>
    <rect x="224" y="258" width="184" height="38" rx="13" fill="#ffffff"/>
    <rect x="422" y="258" width="190" height="38" rx="13" fill="#ffffff"/>
  </g>
  <circle cx="54" cy="277" r="9" fill="#8db9df"/>
  <path d="M50 277 H58 M54 273 V281" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  <text x="70" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#45677e">Kısa kritik bölge</text>

  <circle cx="244" cy="277" r="9" fill="#e9bd72"/>
  <path d="M240 277 H248" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="260" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e5a38">Kilit veya atomik işlem</text>

  <circle cx="442" cy="277" r="9" fill="#9acda8"/>
  <path d="M438 277 L441 280 L447 273" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="458" y="281" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#466c52">Hızlanma: seri bölüm sınırlı</text>
</svg>