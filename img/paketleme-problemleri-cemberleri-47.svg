<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#766ee8"/>
      <stop offset="100%" stop-color="#5a9cde"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#42587a" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#42587a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="70" cy="49" r="72" fill="#dceefb" opacity="0.55"/>
  <circle cx="594" cy="288" r="94" fill="#dff2df" opacity="0.6"/>
  <path d="M38 278 C146 236 183 284 266 265 S411 218 594 247" fill="none" stroke="#b9dcca" stroke-width="2" opacity="0.35"/>

  <!-- connector lines -->
  <path d="M213 151 L263 151" fill="none" stroke="#9dacbd" stroke-width="2.5"/>
  <polygon points="263,151 254,146 254,156" fill="#9dacbd"/>
  <path d="M377 151 L426 151" fill="none" stroke="#9dacbd" stroke-width="2.5"/>
  <polygon points="426,151 417,146 417,156" fill="#9dacbd"/>

  <!-- left card -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="183" height="160" rx="20" fill="#ffffff"/>
  </g>
  <rect x="47" y="88" width="88" height="25" rx="12.5" fill="#dff3ed"/>
  <text x="91" y="105" text-anchor="middle" fill="#387c69" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Girdi Alanı</text>
  <text x="48" y="135" fill="#34445c" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Taşıyıcı Bölge</text>

  <rect x="48" y="145" width="146" height="65" rx="9" fill="#eff8f3" stroke="#9bcdb8" stroke-width="1.5"/>
  <rect x="58" y="155" width="28" height="20" rx="4" fill="#f4c687"/>
  <rect x="91" y="155" width="28" height="20" rx="4" fill="#f0a6a0"/>
  <circle cx="145" cy="165" r="11" fill="#9ec9f0"/>
  <circle cx="173" cy="165" r="11" fill="#b8a9e7"/>
  <rect x="58" y="181" width="38" height="18" rx="4" fill="#9ed9c6"/>
  <circle cx="118" cy="190" r="9" fill="#f3d173"/>
  <rect x="134" y="181" width="45" height="18" rx="4" fill="#a6c4ed"/>

  <text x="48" y="221" fill="#718096" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Şekiller ve sınırlar</text>

  <!-- center engine -->
  <g filter="url(#shadow)">
    <rect x="263" y="82" width="114" height="140" rx="24" fill="url(#centerGrad)"/>
  </g>
  <circle cx="320" cy="126" r="29" fill="#ffffff" opacity="0.17"/>
  <path d="M304 130 L315 141 L338 113" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="171" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700">Yerleştirme</text>
  <text x="320" y="189" text-anchor="middle" fill="#e8efff" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Optimizasyonu</text>
  <circle cx="288" cy="204" r="3" fill="#c7e7ff"/>
  <circle cx="320" cy="204" r="3" fill="#c7e7ff"/>
  <circle cx="352" cy="204" r="3" fill="#c7e7ff"/>

  <!-- right output -->
  <g filter="url(#shadow)">
    <rect x="426" y="55" width="184" height="194" rx="20" fill="#ffffff"/>
  </g>
  <rect x="442" y="71" width="102" height="25" rx="12.5" fill="#eeeaff"/>
  <text x="493" y="88" text-anchor="middle" fill="#695bb6" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Verimli Düzen</text>

  <!-- packed container -->
  <rect x="443" y="108" width="149" height="88" rx="10" fill="#f7fbff" stroke="#9db8d3" stroke-width="1.5"/>
  <!-- hexagonal packed circles -->
  <g fill="#83bce5" stroke="#5b9dce" stroke-width="1">
    <circle cx="461" cy="125" r="10"/><circle cx="485" cy="125" r="10"/><circle cx="509" cy="125" r="10"/><circle cx="533" cy="125" r="10"/><circle cx="557" cy="125" r="10"/>
    <circle cx="473" cy="145" r="10"/><circle cx="497" cy="145" r="10"/><circle cx="521" cy="145" r="10"/><circle cx="545" cy="145" r="10"/><circle cx="569" cy="145" r="10"/>
    <circle cx="461" cy="165" r="10"/><circle cx="485" cy="165" r="10"/><circle cx="509" cy="165" r="10"/><circle cx="533" cy="165" r="10"/><circle cx="557" cy="165" r="10"/>
    <circle cx="473" cy="185" r="10"/><circle cx="497" cy="185" r="10"/><circle cx="521" cy="185" r="10"/><circle cx="545" cy="185" r="10"/><circle cx="569" cy="185" r="10"/>
  </g>

  <rect x="443" y="208" width="67" height="24" rx="12" fill="#e5f5ec"/>
  <text x="476.5" y="224.5" text-anchor="middle" fill="#367a64" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Yoğunluk ↑</text>
  <rect x="518" y="208" width="74" height="24" rx="12" fill="#fff1dc"/>
  <text x="555" y="224.5" text-anchor="middle" fill="#a66c24" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600">Boşluk ↓</text>

  <!-- bottom strategy chips -->
  <g filter="url(#smallShadow)">
    <rect x="92" y="268" width="108" height="31" rx="15.5" fill="#ffffff"/>
    <rect x="211" y="268" width="113" height="31" rx="15.5" fill="#ffffff"/>
    <rect x="335" y="268" width="111" height="31" rx="15.5" fill="#ffffff"/>
    <rect x="457" y="268" width="103" height="31" rx="15.5" fill="#ffffff"/>
  </g>
  <circle cx="109" cy="283.5" r="5" fill="#7eb6e0"/>
  <text x="151" y="287.5" text-anchor="middle" fill="#4b5c71" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Kare ızgara</text>
  <circle cx="228" cy="283.5" r="5" fill="#9b8ade"/>
  <text x="275" y="287.5" text-anchor="middle" fill="#4b5c71" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Altıgen düzen</text>
  <circle cx="352" cy="283.5" r="5" fill="#f0b66c"/>
  <text x="397" y="287.5" text-anchor="middle" fill="#4b5c71" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">Sezgisel arama</text>
  <circle cx="474" cy="283.5" r="5" fill="#76c5a5"/>
  <text x="519" y="287.5" text-anchor="middle" fill="#4b5c71" font-family="Segoe UI, Tahoma, sans-serif" font-size="12">En iyi denge</text>
</svg>