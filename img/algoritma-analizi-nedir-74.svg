<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f0f7ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e2f7"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3e2"/>
      <stop offset="100%" stop-color="#fde8c8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6f7e6"/>
      <stop offset="100%" stop-color="#d0edd0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce8f0"/>
      <stop offset="100%" stop-color="#f8d4e2"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0f8"/>
      <stop offset="100%" stop-color="#d8ccef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Merkez kutu -->
  <rect x="245" y="120" width="150" height="50" rx="12" fill="url(#center)" filter="url(#shadow)" stroke="#b8a8e0" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#4a3a7a">Algoritma Analizi</text>
  <text x="320" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a8a">Kaynak Tahmini</text>

  <!-- Sol üst: Girdi -->
  <rect x="60" y="40" width="130" height="45" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#a0b8e0" stroke-width="1.5"/>
  <text x="125" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a4a7a">Girdi Boyutu</text>
  <text x="125" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a6a9a">n</text>

  <!-- Sağ üst: Zaman -->
  <rect x="450" y="40" width="130" height="45" rx="10" fill="url(#box2)" filter="url(#shadow)" stroke="#e0c8a0" stroke-width="1.5"/>
  <text x="515" y="58" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a5a2a">Zaman</text>
  <text x="515" y="74" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9a7a4a">Karmaşıklığı</text>

  <!-- Sağ alt: Alan -->
  <rect x="450" y="230" width="130" height="45" rx="10" fill="url(#box3)" filter="url(#shadow)" stroke="#a0d0a0" stroke-width="1.5"/>
  <text x="515" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a6a2a">Alan</text>
  <text x="515" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a8a4a">Karmaşıklığı</text>

  <!-- Sol alt: Bağımsızlık -->
  <rect x="60" y="230" width="130" height="45" rx="10" fill="url(#box4)" filter="url(#shadow)" stroke="#e0a0b8" stroke-width="1.5"/>
  <text x="125" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a2a4a">Dil Bağımsız</text>
  <text x="125" y="264" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9a4a6a">Teorik Analiz</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Girdi -> Merkez -->
  <path d="M190 62 L235 130" stroke="#6a8ab0" stroke-width="2" fill="none"/>
  <polygon points="235,130 228,118 232,130 228,130" fill="#6a8ab0"/>

  <!-- Merkez -> Zaman -->
  <path d="M395 130 L440 70" stroke="#b09060" stroke-width="2" fill="none"/>
  <polygon points="440,70 428,72 440,76 436,70" fill="#b09060"/>

  <!-- Merkez -> Alan -->
  <path d="M395 150 L440 240" stroke="#6a9a6a" stroke-width="2" fill="none"/>
  <polygon points="440,240 428,232 432,240 428,240" fill="#6a9a6a"/>

  <!-- Bağımsızlık -> Merkez -->
  <path d="M190 250 L235 165" stroke="#b06a8a" stroke-width="2" fill="none"/>
  <polygon points="235,165 228,175 232,165 228,165" fill="#b06a8a"/>

  <!-- Big O kavramı -->
  <rect x="245" y="40" width="150" height="35" rx="8" fill="#ffffff" filter="url(#shadow)" stroke="#c0c0e0" stroke-width="1" opacity="0.9"/>
  <text x="320" y="54" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a3a6a">Big O</text>
  <text x="320" y="68" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a5a8a">Notasyonu</text>

  <!-- Big O -> Merkez -->
  <path d="M320 75 L320 115" stroke="#8080b0" stroke-width="2" fill="none"/>
  <polygon points="320,115 314,105 320,109 320,105" fill="#8080b0"/>

  <!-- Alt not: Performans -->
  <rect x="245" y="230" width="150" height="35" rx="8" fill="#ffffff" filter="url(#shadow)" stroke="#c0d0c0" stroke-width="1" opacity="0.9"/>
  <text x="320" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a6a3a">Performans</text>
  <text x="320" y="258" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a8a5a">Ölçümü</text>

  <!-- Merkez -> Performans -->
  <path d="M320 170 L320 225" stroke="#6a9a6a" stroke-width="2" fill="none"/>
  <polygon points="320,225 314,215 320,219 320,215" fill="#6a9a6a"/>

  <!-- Bağlam etiketi -->
  <text x="320" y="310" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6a7a6a" opacity="0.8">Teorik kaynak kullanımı analizi</text>
</svg>