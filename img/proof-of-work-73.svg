<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="blockA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="blockB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="blockC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#64748b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="594" cy="44" r="68" fill="#dbeafe" opacity="0.36"/>
  <circle cx="42" cy="284" r="82" fill="#dcfce7" opacity="0.42"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334155">Blok Zinciri ve İş Kanıtı</text>
  <text x="28" y="49" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Hash bağlantısı geçmişi korur</text>

  <!-- Mining panel -->
  <g filter="url(#shadow)">
    <rect x="28" y="75" width="138" height="172" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="42" y="91" width="110" height="28" rx="10" fill="#ede9fe"/>
  <text x="97" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">Madencilik</text>

  <rect x="43" y="132" width="108" height="32" rx="9" fill="#f8fafc" stroke="#dbe4ef"/>
  <text x="53" y="152" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Nonce: 10428</text>
  <path d="M97 170 C145 169, 150 200, 121 207 C96 213, 78 195, 87 181" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="84,181 91,179 88,187" fill="#8b5cf6"/>
  <rect x="43" y="201" width="108" height="30" rx="9" fill="#e0f2fe"/>
  <text x="97" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#0369a1">0000ab7c...</text>

  <!-- Arrow mine to chain -->
  <path d="M168 161 L193 161" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="193,161 185,156 185,166" fill="#64748b"/>
  <text x="179" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">hash</text>

  <!-- chain connector -->
  <path d="M250 160 L270 160" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="270,160 261,154 261,166" fill="#94a3b8"/>
  <path d="M382 160 L402 160" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="402,160 393,154 393,166" fill="#94a3b8"/>

  <!-- Blocks -->
  <g filter="url(#shadow)">
    <rect x="194" y="89" width="57" height="143" rx="14" fill="url(#blockA)" stroke="#93c5fd"/>
    <rect x="270" y="89" width="112" height="143" rx="14" fill="url(#blockB)" stroke="#86efac"/>
    <rect x="402" y="89" width="112" height="143" rx="14" fill="url(#blockC)" stroke="#fcd34d"/>
  </g>

  <rect x="203" y="100" width="39" height="23" rx="7" fill="#ffffff" opacity="0.78"/>
  <text x="222" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">0</text>
  <text x="222" y="141" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334155">Genesis</text>
  <path d="M206 155 L238 155 M206 164 L234 164 M206 173 L229 173" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <text x="222" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">0000...</text>

  <rect x="281" y="100" width="32" height="23" rx="7" fill="#ffffff" opacity="0.8"/>
  <text x="297" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">1</text>
  <text x="326" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334155">İşlemler</text>
  <text x="326" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Ayşe → Can</text>
  <path d="M284 178 L368 178" stroke="#86efac" stroke-width="1"/>
  <text x="326" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Önceki hash</text>
  <text x="326" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">0000ab7c...</text>

  <rect x="413" y="100" width="32" height="23" rx="7" fill="#ffffff" opacity="0.8"/>
  <text x="429" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#92400e">2</text>
  <text x="458" y="143" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#334155">İşlemler</text>
  <text x="458" y="162" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Can → Ece</text>
  <path d="M416 178 L500 178" stroke="#fbbf24" stroke-width="1"/>
  <text x="458" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Önceki hash</text>
  <text x="458" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#92400e">00004e91...</text>

  <!-- verification branch -->
  <path d="M458 235 L458 258 L532 258" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="532,258 523,253 523,263" fill="#64748b"/>
  <g filter="url(#soft)">
    <rect x="536" y="239" width="78" height="38" rx="12" fill="#ffffff" stroke="#bbf7d0"/>
  </g>
  <circle cx="553" cy="258" r="10" fill="#bbf7d0"/>
  <path d="M548 258 L552 262 L559 253" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="577" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">Geçerli</text>

  <text x="319" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Zorluk ↑  →  Deneme sayısı ve maliyet ↑</text>
</svg>