<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="55%" stop-color="#f2faf7"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#c7dcff"/>
    </linearGradient>
    <linearGradient id="parse" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e8dcff"/>
      <stop offset="100%" stop-color="#d7c5f8"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d9f5e8"/>
      <stop offset="100%" stop-color="#bde6d3"/>
    </linearGradient>
    <linearGradient id="vm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0cb"/>
      <stop offset="100%" stop-color="#f8dca0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#7184a0" flood-opacity=".18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7184a0" flood-opacity=".2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7990b0"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="68" cy="46" r="76" fill="#dbeeff" opacity=".45"/>
  <circle cx="580" cy="276" r="90" fill="#d7f3e5" opacity=".42"/>

  <text x="320" y="31" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#415774">Mini Yorumlayıcı Akışı</text>
  <text x="320" y="49" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71839b">C içinde kaynak koddan çalışan sanal makineye</text>

  <path d="M125 159 H151" fill="none" stroke="#7990b0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M263 159 H289" fill="none" stroke="#7990b0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M401 159 H427" fill="none" stroke="#7990b0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M539 159 H560" fill="none" stroke="#7990b0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="20" y="94" width="105" height="130" rx="18" fill="url(#source)"/>
    <rect x="158" y="94" width="105" height="130" rx="18" fill="url(#parse)"/>
    <rect x="296" y="94" width="105" height="130" rx="18" fill="url(#code)"/>
    <rect x="434" y="94" width="105" height="130" rx="18" fill="url(#vm)"/>
    <rect x="560" y="118" width="64" height="82" rx="18" fill="#e2f5ef"/>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#314967">
    <text x="72" y="122" text-anchor="middle" font-weight="700">Kaynak Kod</text>
    <rect x="39" y="135" width="67" height="65" rx="8" fill="#fafdff" opacity=".92"/>
    <text x="47" y="152" font-family="Tahoma, sans-serif" font-size="11" fill="#54719a">SET x 10</text>
    <text x="47" y="170" font-family="Tahoma, sans-serif" font-size="11" fill="#54719a">ADD x 7</text>
    <text x="47" y="188" font-family="Tahoma, sans-serif" font-size="11" fill="#54719a">PRINT x</text>

    <text x="210" y="122" text-anchor="middle" font-weight="700">Lexer + Parser</text>
    <g filter="url(#smallShadow)">
      <rect x="177" y="136" width="67" height="20" rx="7" fill="#faf8ff"/>
      <rect x="177" y="163" width="67" height="20" rx="7" fill="#faf8ff"/>
      <rect x="177" y="190" width="67" height="20" rx="7" fill="#faf8ff"/>
    </g>
    <text x="210" y="150" text-anchor="middle" font-size="11">Tokenlar</text>
    <text x="210" y="177" text-anchor="middle" font-size="11">Kurallar</text>
    <text x="210" y="204" text-anchor="middle" font-size="11">Komutlar</text>

    <text x="348" y="122" text-anchor="middle" font-weight="700">Kod Üretimi</text>
    <rect x="315" y="137" width="67" height="64" rx="8" fill="#f9fffb" opacity=".9"/>
    <text x="348" y="153" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="10" fill="#438169">OP_SET</text>
    <text x="348" y="170" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="10" fill="#438169">OP_ADD</text>
    <text x="348" y="187" text-anchor="middle" font-family="Tahoma, sans-serif" font-size="10" fill="#438169">OP_PRINT</text>

    <text x="486" y="122" text-anchor="middle" font-weight="700">Sanal Makine</text>
    <circle cx="486" cy="166" r="27" fill="#fffaf0" stroke="#e4bb62" stroke-width="1.5"/>
    <path d="M477 153 L501 166 L477 179 Z" fill="#e2a837"/>
    <text x="486" y="208" text-anchor="middle" font-size="11">Bellek · ip</text>

    <text x="592" y="143" text-anchor="middle" font-weight="700">Çıktı</text>
    <rect x="572" y="153" width="40" height="30" rx="8" fill="#fbfffd"/>
    <text x="592" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#357561">17</text>
  </g>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12">
    <rect x="86" y="247" width="468" height="43" rx="16" fill="#ffffff" opacity=".78" filter="url(#smallShadow)"/>
    <circle cx="111" cy="268" r="8" fill="#79a9e8"/>
    <text x="126" y="272" fill="#526a87">Metin</text>
    <path d="M166 268 H198" stroke="#99aac2" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="218" cy="268" r="8" fill="#b091e5"/>
    <text x="233" y="272" fill="#526a87">Yapı</text>
    <path d="M272 268 H304" stroke="#99aac2" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="324" cy="268" r="8" fill="#70c79d"/>
    <text x="339" y="272" fill="#526a87">Bytecode</text>
    <path d="M405 268 H437" stroke="#99aac2" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="457" cy="268" r="8" fill="#e5b44d"/>
    <text x="472" y="272" fill="#526a87">Çalışma</text>
  </g>
</svg>