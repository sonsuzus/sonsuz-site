<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Segoe UI, Tahoma, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <marker id="arrowYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DB2777"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Kökten dallara -->
  <path d="M 320 60 C 320 80, 120 80, 120 100" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <path d="M 320 60 L 320 100" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 320 60 C 320 80, 520 80, 520 100" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- Üst seviyeden alt seviyeye -->
  <path d="M 120 150 L 120 190" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <path d="M 320 150 L 320 190" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 520 150 L 520 190" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- Alt seviyeden sonuca -->
  <path d="M 120 240 C 120 255, 220 250, 220 260" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <path d="M 320 240 L 320 260" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 520 240 C 520 255, 420 250, 420 260" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- Kök kutu -->
  <rect x="200" y="20" width="240" height="40" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="40" font-size="12" font-weight="bold" fill="#3730A3" text-anchor="middle" dominant-baseline="middle">Python Olasılık Laboratuvarı</text>

  <!-- Üst seviye kutular -->
  <rect x="40" y="100" width="160" height="50" rx="10" fill="#FDE68A" stroke="#FCD34D" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="125" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle" dominant-baseline="middle">Yazı-Tura</text>
  <text x="120" y="140" font-size="12" fill="#92400E" text-anchor="middle" dominant-baseline="middle">Simülasyonu</text>

  <rect x="250" y="100" width="140" height="50" rx="10" fill="#A7F3D0" stroke="#6EE7B7" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="125" font-size="12" font-weight="bold" fill="#064E3B" text-anchor="middle" dominant-baseline="middle">Binom</text>
  <text x="320" y="140" font-size="12" fill="#064E3B" text-anchor="middle" dominant-baseline="middle">Dağılımı</text>

  <rect x="440" y="100" width="160" height="50" rx="10" fill="#FBCFE8" stroke="#F9A8D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="125" font-size="12" font-weight="bold" fill="#831843" text-anchor="middle" dominant-baseline="middle">Monty Hall</text>
  <text x="520" y="140" font-size="12" fill="#831843" text-anchor="middle" dominant-baseline="middle">Paradoksu</text>

  <!-- Alt seviye kutular -->
  <rect x="40" y="190" width="160" height="50" rx="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="215" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle" dominant-baseline="middle">Büyük Sayılar</text>
  <text x="120" y="230" font-size="12" fill="#78350F" text-anchor="middle" dominant-baseline="middle">Yasası</text>

  <rect x="250" y="190" width="140" height="50" rx="10" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="215" font-size="12" font-weight="bold" fill="#064E3B" text-anchor="middle" dominant-baseline="middle">Deneysel</text>
  <text x="320" y="230" font-size="12" fill="#064E3B" text-anchor="middle" dominant-baseline="middle">Dağılım</text>

  <rect x="440" y="190" width="160" height="50" rx="10" fill="#FCE7F3" stroke="#FBCFE8" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="215" font-size="12" font-weight="bold" fill="#831843" text-anchor="middle" dominant-baseline="middle">Koşullu</text>
  <text x="520" y="230" font-size="12" fill="#831843" text-anchor="middle" dominant-baseline="middle">Olasılık</text>

  <!-- Sonuç kutusu -->
  <rect x="190" y="260" width="260" height="40" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="280" font-size="12" font-weight="bold" fill="#1E3A8A" text-anchor="middle" dominant-baseline="middle">Sonuç: Rastgelelik → Matematik</text>
</svg>