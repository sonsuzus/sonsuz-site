<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="structGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c9eb2"/>
      <stop offset="100%" stop-color="#5a7d94"/>
    </linearGradient>
    <linearGradient id="memberGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d5c0"/>
      <stop offset="100%" stop-color="#f2b8a0"/>
    </linearGradient>
    <linearGradient id="memberGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5e0d8"/>
      <stop offset="100%" stop-color="#a3c9bf"/>
    </linearGradient>
    <linearGradient id="memberGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4c8e8"/>
      <stop offset="100%" stop-color="#b8a8d6"/>
    </linearGradient>
    <linearGradient id="memberGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e6a8"/>
      <stop offset="100%" stop-color="#e8d48a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#3a5a6a">C Programlama - Yapı (Struct)</text>

  <!-- Merkezi yapı kutusu -->
  <rect x="245" y="55" width="150" height="50" rx="12" fill="url(#structGrad)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">struct Yapı</text>
  <text x="320" y="95" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f0f5">kullanıcı tanımlı tür</text>

  <!-- Üst bilgi etiketi -->
  <text x="320" y="125" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7d94" font-style="italic">farklı türleri tek isim altında toplar</text>

  <!-- Oklar - merkezden dışa -->
  <!-- Ok 1 (üst sol) -->
  <path d="M 245 80 L 165 80" stroke="#7c9eb2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="165,74 155,80 165,86" fill="#7c9eb2"/>

  <!-- Ok 2 (üst sağ) -->
  <path d="M 395 80 L 475 80" stroke="#7c9eb2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="475,74 485,80 475,86" fill="#7c9eb2"/>

  <!-- Ok 3 (sol alt) -->
  <path d="M 260 105 L 170 165" stroke="#7c9eb2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="170,159 162,170 178,168" fill="#7c9eb2"/>

  <!-- Ok 4 (sağ alt) -->
  <path d="M 380 105 L 470 165" stroke="#7c9eb2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="470,159 478,170 462,168" fill="#7c9eb2"/>

  <!-- Ok 5 (alt orta) -->
  <path d="M 320 105 L 320 170" stroke="#7c9eb2" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="314,170 320,180 326,170" fill="#7c9eb2"/>

  <!-- Eleman kutuları -->
  <!-- Eleman 1: int -->
  <rect x="55" y="55" width="100" height="45" rx="10" fill="url(#memberGrad1)" filter="url(#shadowLight)"/>
  <text x="105" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a3a2a">int</text>
  <text x="105" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a5a4a">numara</text>

  <!-- Eleman 2: char -->
  <rect x="485" y="55" width="100" height="45" rx="10" fill="url(#memberGrad2)" filter="url(#shadowLight)"/>
  <text x="535" y="73" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2a5a4a">char</text>
  <text x="535" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a7a6a">ad[20]</text>

  <!-- Eleman 3: float -->
  <rect x="70" y="175" width="100" height="45" rx="10" fill="url(#memberGrad3)" filter="url(#shadowLight)"/>
  <text x="120" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a2a6a">float</text>
  <text x="120" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a4a8a">ortalama</text>

  <!-- Eleman 4: double -->
  <rect x="470" y="175" width="100" height="45" rx="10" fill="url(#memberGrad4)" filter="url(#shadowLight)"/>
  <text x="520" y="193" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a4a1a">double</text>
  <text x="520" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a6a3a">not</text>

  <!-- Alt bilgi kutusu -->
  <rect x="200" y="180" width="240" height="40" rx="10" fill="#e8f0f5" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="198" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#3a5a6a">farklı veri türleri bir arada</text>
  <text x="320" y="213" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7d94">dizi aynı tür için kullanılır</text>

  <!-- Alt bilgi oku -->
  <path d="M 320 170 L 320 180" stroke="#7c9eb2" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <polygon points="316,180 320,186 324,180" fill="#7c9eb2"/>

  <!-- Yapı bildirimi etiketi -->
  <text x="320" y="250" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a7d94">struct adı { veri-türü eleman; ... } değişken;</text>

  <!-- Dekoratif çizgi -->
  <line x1="180" y1="265" x2="460" y2="265" stroke="#c5d5e0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Alt not -->
  <text x="320" y="285" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8aa8b8">yapı adı veya değişken listesinden en az biri tanımlanmalıdır</text>

  <!-- Küçük dekoratif öğeler -->
  <circle cx="30" cy="300" r="3" fill="#c5e0d8" opacity="0.6"/>
  <circle cx="610" cy="300" r="3" fill="#d4c8e8" opacity="0.6"/>
  <circle cx="610" cy="20" r="3" fill="#f7e6a8" opacity="0.6"/>
  <circle cx="30" cy="20" r="3" fill="#f9d5c0" opacity="0.6"/>
</svg>