<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">Konveks Zarf: Nokta Bulutunun Lastik Bandı</text>

  <!-- Nokta bulutu alanı -->
  <rect x="30" y="45" width="340" height="240" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadowLight)"/>

  <!-- Noktalar -->
  <circle cx="70" cy="240" r="4" fill="#e74c3c" opacity="0.8"/>
  <circle cx="110" cy="200" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="90" cy="160" r="4" fill="#e67e22" opacity="0.8"/>
  <circle cx="140" cy="230" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="160" cy="180" r="4" fill="#2ecc71" opacity="0.8"/>
  <circle cx="130" cy="130" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="200" cy="250" r="4" fill="#e74c3c" opacity="0.8"/>
  <circle cx="220" cy="210" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="190" cy="160" r="4" fill="#e67e22" opacity="0.8"/>
  <circle cx="250" cy="240" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="270" cy="190" r="4" fill="#2ecc71" opacity="0.8"/>
  <circle cx="240" cy="140" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="300" cy="230" r="4" fill="#e74c3c" opacity="0.8"/>
  <circle cx="320" cy="180" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="290" cy="120" r="4" fill="#e67e22" opacity="0.8"/>
  <circle cx="340" cy="140" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="350" cy="100" r="4" fill="#2ecc71" opacity="0.8"/>
  <circle cx="180" cy="100" r="4" fill="#3498db" opacity="0.8"/>
  <circle cx="120" cy="90" r="4" fill="#e74c3c" opacity="0.8"/>
  <circle cx="230" cy="90" r="4" fill="#3498db" opacity="0.8"/>

  <!-- Konveks zarf çizgisi (lastik bant) -->
  <polygon points="70,240 140,230 200,250 300,230 350,100 290,120 230,90 120,90 90,160" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.9" filter="url(#shadow)"/>

  <!-- Zarf köşeleri -->
  <circle cx="70" cy="240" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="140" cy="230" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="200" cy="250" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="300" cy="230" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="350" cy="100" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="290" cy="120" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="230" cy="90" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="120" cy="90" r="5" fill="#2ecc71" opacity="0.9"/>
  <circle cx="90" cy="160" r="5" fill="#2ecc71" opacity="0.9"/>

  <!-- Etiket: Lastik bant -->
  <text x="195" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Lastik bant (zarf)</text>

  <!-- Sağ taraf: Algoritma akışı -->
  <rect x="395" y="45" width="220" height="240" rx="10" fill="#ffffff" opacity="0.7" filter="url(#shadowLight)"/>

  <!-- Akış elemanları -->
  <rect x="415" y="60" width="180" height="36" rx="8" fill="#e8f4fd" stroke="#3498db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="83" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Noktaları sırala</text>

  <!-- Ok (manuel) -->
  <polygon points="505,100 501,108 509,108" fill="#7f8c8d"/>
  <line x1="505" y1="96" x2="505" y2="106" stroke="#7f8c8d" stroke-width="1.5"/>

  <rect x="415" y="112" width="180" height="36" rx="8" fill="#e8f8e8" stroke="#2ecc71" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="135" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Alt zarf oluştur</text>

  <!-- Ok (manuel) -->
  <polygon points="505,152 501,160 509,160" fill="#7f8c8d"/>
  <line x1="505" y1="148" x2="505" y2="158" stroke="#7f8c8d" stroke-width="1.5"/>

  <rect x="415" y="164" width="180" height="36" rx="8" fill="#e8f8e8" stroke="#2ecc71" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="187" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Üst zarf oluştur</text>

  <!-- Ok (manuel) -->
  <polygon points="505,204 501,212 509,212" fill="#7f8c8d"/>
  <line x1="505" y1="200" x2="505" y2="210" stroke="#7f8c8d" stroke-width="1.5"/>

  <rect x="415" y="216" width="180" height="36" rx="8" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">Zarfları birleştir</text>

  <!-- Karar kutusu -->
  <rect x="415" y="262" width="180" height="20" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1.2" opacity="0.9"/>
  <text x="505" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#c0392b">Çapraz çarpım kontrolü</text>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">cross(O,A,B) &gt; 0 → sola dönüş | &lt; 0 → sağa dönüş | = 0 → doğrusal</text>
</svg>