    <path d="M200 108 h12 M206 102 v12" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
    <text x="246" y="113" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Erişim Tokenı</text>
    <text x="239" y="147" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">API çağrıları</text>
