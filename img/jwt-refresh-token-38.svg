    <text x="402" y="137" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Doğrula ve yenile</text>
    <rect x="357" y="153" width="90" height="31" rx="9" fill="url(#refresh)"/>
    <text x="402" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#166534">Rotasyon</text>
    <text x="402" y="197" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">eski token iptal</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="497" y="92" width="115" height="96" rx="18" fill="#ffffff"/>
    <ellipse cx="554" cy="111" rx="30" ry="9" fill="#fde68a"/>
    <path d="M524 111 v37 c0 5 13 9 30 9 s30-4 30-9 v-37" fill="#fef3c7"/>
    <path d="M524 129 c0 5 13 9 30 9 s30-4 30-9 M524 147 c0 5 13 9 30 9 s30-4 30-9" fill="none" stroke="#d97706" stroke-width="1.2"/>
    <text x="554" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#92400e">Oturum Ailesi</text>
  </g>

  <path d="M402 208 V242 H238 V220" fill="none" stroke="#65a30d" stroke-width="2"/>
  <polygon points="238,220 233,228 243,228" fill="#65a30d"/>
  <rect x="278" y="231" width="124" height="22" rx="9" fill="#ecfccb" filter="url(#soft)"/>
  <text x="340" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#3f6212">Yeni token çifti</text>

  <path d="M402 208 V268 H490" fill="none" stroke="#ef4444" stroke-width="2"/>
  <polygon points="490,268 482,263 482,273" fill="#ef4444"/>
  <g filter="url(#soft)">
    <rect x="490" y="245" width="122" height="48" rx="14" fill="#fff1f2"/>
    <circle cx="510" cy="269" r="10" fill="#fecdd3"/>
    <path d="M506 265 l8 8 M514 265 l-8 8" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <text x="560" y="266" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Tekrar kullanım</text>
    <text x="560" y="282" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#b91c1c">Aileyi iptal et</text>
  </g>

  <path d="M85 205 V225 H175" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="85" cy="205" r="3" fill="#22c55e"/>
  <text x="130" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">Güvenli saklama</text>
