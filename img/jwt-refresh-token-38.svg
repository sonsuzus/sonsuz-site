    <path d="M51 121 C51 116 59 116 59 121" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <text x="86" y="121" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#0f4c6e">İstemci</text>
    <text x="85" y="151" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">Kısa erişim</text>
    <text x="85" y="169" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#475569">uzun yenileme</text>
  </g>

