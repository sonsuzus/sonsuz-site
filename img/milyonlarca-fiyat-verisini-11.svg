    <rect x="475" y="100" width="32" height="7" rx="3.5" fill="#7298bd"/>
    <rect x="514" y="100" width="53" height="7" rx="3.5" fill="#abc4dd"/>
    <text x="525" y="117" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#52728d">1 gün</text>
  </g>
  <g filter="url(#soft)">
    <rect x="470" y="134" width="120" height="35" rx="10" fill="#dff3e6"/>
    <rect x="482" y="143" width="24" height="7" rx="3.5" fill="#65a87d"/>
    <rect x="512" y="143" width="49" height="7" rx="3.5" fill="#a5d5b6"/>
    <text x="519" y="160" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#47785a">1 saat</text>
  </g>

  <rect x="462" y="181" width="136" height="67" rx="11" fill="#f4f9ff" stroke="#d7e4ef"/>
  <line x1="473" y1="234" x2="587" y2="234" stroke="#b8cbd5" stroke-width="1.3"/>
  <line x1="473" y1="193" x2="473" y2="234" stroke="#b8cbd5" stroke-width="1.3"/>
  <g stroke-width="2">
    <line x1="485" y1="208" x2="485" y2="229" stroke="#e17676"/>
    <rect x="481" y="213" width="8" height="10" fill="#e99292"/>
    <line x1="503" y1="199" x2="503" y2="222" stroke="#5cae7a"/>
    <rect x="499" y="204" width="8" height="13" fill="#79c494"/>
    <line x1="521" y1="202" x2="521" y2="230" stroke="#e17676"/>
    <rect x="517" y="208" width="8" height="15" fill="#e99292"/>
    <line x1="539" y1="190" x2="539" y2="217" stroke="#5cae7a"/>
    <rect x="535" y="197" width="8" height="14" fill="#79c494"/>
    <line x1="557" y1="187" x2="557" y2="210" stroke="#5cae7a"/>
    <rect x="553" y="192" width="8" height="12" fill="#79c494"/>
    <line x1="575" y1="194" x2="575" y2="219" stroke="#e17676"/>
    <rect x="571" y="200" width="8" height="12" fill="#e99292"/>
