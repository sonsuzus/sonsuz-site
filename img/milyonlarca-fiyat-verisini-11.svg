  <text x="251" y="113" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#397152">Zaman kovaları</text>
  <text x="254" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#42698b">Özetleme</text>
  <text x="249" y="198" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#397152">OHLC ve hacim</text>
  <text x="249" y="214" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5b7e69">aralık korunur</text>
  <path d="M307 125 V132" stroke="#76a287" stroke-width="2"/>
  <polygon points="307,137 302,130 312,130" fill="#76a287"/>
  <path d="M307 169 V176" stroke="#76a287" stroke-width="2"/>
  <polygon points="307,181 302,174 312,174" fill="#76a287"/>

