<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="rawGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#c7dcf6"/>
    </linearGradient>
    <linearGradient id="sumGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff4e5"/>
      <stop offset="1" stop-color="#bce4cd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7890a6" flood-opacity="0.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6f8797" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="72" cy="33" r="55" fill="#d7ecff" opacity="0.45"/>
  <circle cx="590" cy="280" r="78" fill="#dff1d5" opacity="0.48"/>

  <text x="28" y="31" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40566a">Ham veriden anlamlı grafiğe</text>

  <!-- Raw stream -->
  <g filter="url(#shadow)">
    <rect x="27" y="65" width="137" height="187" rx="18" fill="#f9fcff"/>
    <rect x="27" y="65" width="137" height="39" rx="18" fill="url(#rawGrad)"/>
    <rect x="27" y="87" width="137" height="17" fill="url(#rawGrad)"/>
  </g>
  <text x="48" y="89" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#31526d">Ham işlem akışı</text>
  <text x="46" y="123" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7383">Zaman</text>
  <text x="95" y="123" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7383">Fiyat</text>
  <line x1="43" y1="132" x2="147" y2="132" stroke="#cad9e5"/>
  <g fill="#7c9bb3">
    <circle cx="51" cy="148" r="3"/><circle cx="51" cy="166" r="3"/><circle cx="51" cy="184" r="3"/>
    <circle cx="51" cy="202" r="3"/><circle cx="51" cy="220" r="3"/>
  </g>
  <g stroke="#9eb4c5" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="148" x2="142" y2="148"/>
    <line x1="64" y1="166" x2="126" y2="166"/>
    <line x1="64" y1="184" x2="145" y2="184"/>
    <line x1="64" y1="202" x2="115" y2="202"/>
    <line x1="64" y1="220" x2="137" y2="220"/>
  </g>
  <text x="47" y="241" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5d7383">Milyonlarca kayıt</text>

  <!-- Arrow -->
  <path d="M174 158 H207" fill="none" stroke="#6d92a2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="214,158 205,152 205,164" fill="#6d92a2"/>

  <!-- Processing core -->
  <g filter="url(#shadow)">
    <rect x="219" y="76" width="177" height="165" rx="22" fill="#fbfffb"/>
    <rect x="233" y="91" width="149" height="34" rx="11" fill="#e4f4e9"/>
    <rect x="233" y="135" width="149" height="34" rx="11" fill="#e9f2ff"/>
    <rect x="233" y="179" width="149" height="45" rx="11" fill="url(#sumGrad)"/>
