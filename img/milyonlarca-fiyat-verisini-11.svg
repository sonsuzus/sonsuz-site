  <text x="478" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526d7b">Okunabilir grafik</text>

  <!-- bottom annotation -->
  <g filter="url(#soft)">
    <rect x="201" y="270" width="237" height="31" rx="14" fill="#ffffff" opacity="0.9"/>
  </g>
  <circle cx="221" cy="285" r="7" fill="#81b99a"/>
  <path d="M218 285 L220 287 L225 282" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="238" y="289" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#526b72">Görünür aralık kadar veri</text>
</svg>