<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="merkez" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e5"/>
      <stop offset="100%" stop-color="#ffecc0"/>
    </linearGradient>
    <filter id="golge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5d7186" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5d7186" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="87" cy="42" r="58" fill="#dff1f3" opacity="0.48"/>
  <circle cx="588" cy="274" r="76" fill="#e3edcf" opacity="0.45"/>
  <path d="M25 248 C116 218 143 300 222 275 S367 221 433 253 S548 279 621 230" fill="none" stroke="#cadfe1" stroke-width="1.5" opacity="0.65"/>

  <text x="320" y="27" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405369">ANLAMLI İNSAN DENETİMİ</text>
  <text x="320" y="44" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#708093">Karar önerisi, etik fren ve sorumluluk zinciri</text>

  <!-- Sol: otonom değerlendirme -->
  <g filter="url(#golge)">
    <rect x="34" y="87" width="154" height="160" rx="18" fill="#ffffff" stroke="#d8e7ee"/>
  </g>
  <rect x="51" y="103" width="120" height="29" rx="10" fill="#dff1f5"/>
  <circle cx="67" cy="117.5" r="7" fill="#63afc0"/>
  <path d="M63 118 L66 121 L72 114" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="121.5" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#355a68">Otonom Sistem</text>

  <path d="M62 153 H72 M62 153 V162 M72 153 V162 M62 162 H72" fill="none" stroke="#6e99a7" stroke-width="1.6" stroke-linecap="round"/>
  <text x="84" y="157" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6272">Algılama</text>
  <line x1="61" y1="174" x2="164" y2="174" stroke="#e5edf0"/>
  <circle cx="67" cy="192" r="7" fill="#a6c8df"/>
  <path d="M64 192 L67 189 L70 192 L67 195 Z" fill="#ffffff"/>
  <text x="84" y="196" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6272">Sınıflandırma</text>
  <line x1="61" y1="212" x2="164" y2="212" stroke="#e5edf0"/>
  <path d="M61 230 L67 220 L73 230 Z" fill="#e5a86d"/>
  <text x="84" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d6272">Risk hesabı</text>

  <!-- Akış sol-merkez -->
  <path d="M190 166 H228" fill="none" stroke="#83aebb" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="233,166 225,161 225,171" fill="#83aebb"/>
  <text x="208" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8391">öneri</text>

  <!-- Merkez: insan kapısı -->
  <g filter="url(#golge)">
    <rect x="237" y="72" width="166" height="187" rx="22" fill="url(#merkez)" stroke="#efd9a2"/>
  </g>
  <circle cx="320" cy="113" r="27" fill="#f6c967"/>
  <circle cx="320" cy="105" r="8" fill="#ffffff"/>
  <path d="M305 132 C306 120 334 120 335 132" fill="#ffffff"/>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#705526">Yetkili İnsan</text>
  <text x="320" y="176" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7e6b44">Bağlam ve muhakeme</text>

  <rect x="262" y="191" width="116" height="33" rx="10" fill="#ffffff" stroke="#ecd69d"/>
  <path d="M278 201 L283 206 L292 196" fill="none" stroke="#4fa080" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="327" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#53705d">ONAY veya RED</text>
  <text x="320" y="244" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8b7647">Son söz insanda</text>

  <!-- Üst etik fren -->
  <g filter="url(#hafifGolge)">
    <rect x="253" y="50" width="134" height="21" rx="10" fill="#f6e6e9" stroke="#eccbd1"/>
  </g>
  <path d="M270 55 L276 55 L279 60 L276 66 L270 66 L267 60 Z" fill="#d77282"/>
  <text x="326" y="64.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#8f4f5a">Etik Fren</text>

  <!-- Sağ: güvenli sonuçlar -->
  <path d="M405 166 H440" fill="none" stroke="#83aebb" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="445,166 437,161 437,171" fill="#83aebb"/>
  <text x="423" y="154" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6c8391">karar</text>

  <g filter="url(#golge)">
    <rect x="449" y="87" width="157" height="160" rx="18" fill="#ffffff" stroke="#d8e7dd"/>
  </g>
  <text x="527.5" y="114" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#405b56">Güvenli Yönetişim</text>

  <rect x="466" y="129" width="123" height="29" rx="9" fill="#e6f3e9"/>
  <circle cx="482" cy="143.5" r="7" fill="#5caf7c"/>
  <path d="M479 144 L482 147 L487 140" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="536" y="147.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#436957">Güvenli duruş</text>

  <rect x="466" y="169" width="123" height="29" rx="9" fill="#e8eff9"/>
  <path d="M477 176 H487 V191 H477 Z M480 180 H484 M480 184 H484" fill="none" stroke="#6d91bd" stroke-width="1.4"/>
  <text x="536" y="187.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4f6684">Karar kaydı</text>

  <rect x="466" y="209" width="123" height="22" rx="8" fill="#f7edf3"/>
  <text x="527.5" y="224.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#80586c">Sorumluluk zinciri</text>

  <!-- Alt açıklama kartları -->
  <g filter="url(#hafifGolge)">
    <rect x="48" y="270" width="162" height="30" rx="12" fill="#edf5fa"/>
    <rect x="230" y="270" width="180" height="30" rx="12" fill="#fff4db"/>
    <rect x="430" y="270" width="162" height="30" rx="12" fill="#edf7ee"/>
  </g>
  <text x="129" y="289.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#547184">Belirsizlik tespiti</text>
  <text x="320" y="289.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#79643c">İnsan onayı zorunlu</text>
  <text x="511" y="289.5" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#55765e">İzlenebilir sonuç</text>
</svg>