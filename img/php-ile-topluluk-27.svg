<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#334155" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Arka Plan -->
  <rect width="640" height="320" fill="#eef2f7"/>
  <circle cx="320" cy="160" r="130" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Bağlantılar -->
  <line x1="250" y1="130" x2="205" y2="70" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="130" x2="445" y2="70" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="180" x2="195" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="165" x2="445" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Merkez: PHP -->
  <rect x="250" y="110" width="140" height="60" rx="14" fill="#c7d2fe" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="133" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">PHP</text>
  <text x="320" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">Topluluk Platformu</text>

  <!-- Sol Üst: Dinamik Sayfa -->
  <rect x="40" y="30" width="160" height="80" rx="12" fill="#fbcfe8" stroke="#f472b6" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Dinamik Sayfa</text>
  <text x="120" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">Veri + Yetki + Şablon</text>
  <text x="120" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">HTML çıktısı</text>

  <!-- Sol Alt: Veritabanı -->
  <rect x="30" y="210" width="160" height="80" rx="12" fill="#a7f3d0" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Veritabanı</text>
  <text x="110" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">Users · Topics · Posts</text>
  <text x="110" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">Roles · Categories</text>

  <!-- Sağ Üst: Güvenlik -->
  <rect x="450" y="30" width="160" height="80" rx="12" fill="#fde68a" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Güvenlik</text>
  <text x="530" y="75" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">SQLi · XSS · CSRF</text>
  <text x="530" y="90" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">PDO + htmlspecialchars</text>

  <!-- Sağ Alt: Evrim -->
  <rect x="450" y="210" width="160" height="80" rx="12" fill="#bae6fd" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Evrim</text>
  <text x="530" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">Statik → Klasik</text>
  <text x="530" y="270" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#334155">→ Modern PHP</text>
</svg>