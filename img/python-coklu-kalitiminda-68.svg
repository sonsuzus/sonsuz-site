  <text x="394" y="115" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#50416c">MRO ziyaret listesi</text>
  <text x="394" y="130" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#67577f">C  →  A  →  B  →  Temel</text>

  <path d="M480 136 L480 146" stroke="#9a88bd" stroke-width="2"/>
  <polygon points="480,150 476,143 484,143" fill="#9a88bd"/>

  <text x="394" y="174" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#975f31">Metot akışı</text>
  <text x="394" y="188" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a704d">A  →  B  →  Temel</text>

  <path d="M480 197 L480 207" stroke="#76a66c" stroke-width="2"/>
  <polygon points="480,211 476,204 484,204" fill="#76a66c"/>

  <text x="394" y="233" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4f8058">Kural: sıradaki sınıfa geç</text>

  <g filter="url(#soft)">
    <rect x="353" y="278" width="253" height="25" rx="12" fill="#dbeeff"/>
  </g>
  <text x="479" y="295" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#476b8e">super() ebeveyni değil, MRO sonraki adımını çağırır</text>
</svg>