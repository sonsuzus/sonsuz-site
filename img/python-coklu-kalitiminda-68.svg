  <polygon points="164,244 154,240 162,234" fill="#9aaac0"/>
  <path d="M248 199 L211 238" fill="none" stroke="#9aaac0" stroke-width="2.2"/>
  <polygon points="207,244 209,234 217,240" fill="#9aaac0"/>

