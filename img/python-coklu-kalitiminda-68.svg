    <rect x="68" y="151" width="110" height="48" rx="14" fill="#ffe5cc"/>
    <rect x="193" y="151" width="110" height="48" rx="14" fill="#dff4dc"/>
    <rect x="126" y="244" width="110" height="45" rx="14" fill="#eadfff"/>
