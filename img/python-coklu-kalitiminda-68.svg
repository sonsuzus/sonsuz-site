    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6c7d93" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="52" cy="50" r="78" fill="#d9efff" opacity="0.48"/>
  <circle cx="586" cy="282" r="98" fill="#dff3d7" opacity="0.45"/>

  <text x="32" y="32" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#40526a">ÇOKLU KALITIM • MRO YOLU</text>
  <text x="32" y="50" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#718198">C3 sıralaması metot aramasını belirler</text>

  <path d="M155 106 L126 145" fill="none" stroke="#9aaac0" stroke-width="2.2"/>
  <polygon points="122,151 124,141 132,147" fill="#9aaac0"/>
  <path d="M207 106 L243 145" fill="none" stroke="#9aaac0" stroke-width="2.2"/>
  <polygon points="247,151 237,147 245,141" fill="#9aaac0"/>

