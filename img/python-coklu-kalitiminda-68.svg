    <rect x="374" y="91" width="212" height="42" rx="12" fill="url(#mro)"/>
    <rect x="374" y="151" width="212" height="43" rx="12" fill="#fff1e4"/>
    <rect x="374" y="211" width="212" height="34" rx="12" fill="#e9f6e4"/>
