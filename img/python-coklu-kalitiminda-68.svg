  <text x="181" y="93" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#31516d">C</text>
  <text x="123" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#80522c">A</text>
  <text x="123" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#9a704d">mesaj()</text>
  <text x="248" y="173" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3f7048">B</text>
  <text x="248" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5f8c68">mesaj()</text>
  <text x="181" y="265" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#5f5279">Temel</text>
  <text x="181" y="280" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#776b91">mesaj()</text>

  <path d="M178 211 C198 211 211 207 225 202" fill="none" stroke="#8067b5" stroke-width="3" stroke-linecap="round"/>
  <polygon points="231,199 221,198 225,207" fill="#8067b5"/>
  <path d="M248 210 C243 224 226 233 210 241" fill="none" stroke="#8067b5" stroke-width="3" stroke-linecap="round"/>
  <polygon points="204,244 213,238 215,247" fill="#8067b5"/>
  <text x="208" y="224" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#7558a9">super()</text>

