<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">C Dinamik Bellek Yönetimi</text>

  <!-- Merkez kavram -->
  <rect x="240" y="55" width="160" height="44" rx="22" fill="#4a90d9" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Dinamik Bellek</text>

  <!-- Dört fonksiyon kutusu -->
  <!-- malloc -->
  <rect x="40" y="140" width="120" height="40" rx="8" fill="#e8f4f8" stroke="#5dade2" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="100" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1a5276">malloc()</text>

  <!-- calloc -->
  <rect x="190" y="140" width="120" height="40" rx="8" fill="#eafaf1" stroke="#52be80" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="250" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#145a32">calloc()</text>

  <!-- realloc -->
  <rect x="340" y="140" width="120" height="40" rx="8" fill="#fef9e7" stroke="#f4d03f" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="400" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#7d6608">realloc()</text>

  <!-- free -->
  <rect x="490" y="140" width="120" height="40" rx="8" fill="#fdedec" stroke="#ec7063" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="550" y="165" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#922b21">free()</text>

  <!-- Bağlantı çizgileri (merkezden fonksiyonlara) -->
  <!-- malloc bağlantısı -->
  <path d="M 260 99 L 120 138" stroke="#5dade2" stroke-width="2" fill="none"/>
  <polygon points="120,138 128,132 126,142" fill="#5dade2"/>

  <!-- calloc bağlantısı -->
  <path d="M 290 99 L 260 138" stroke="#52be80" stroke-width="2" fill="none"/>
  <polygon points="260,138 268,132 266,142" fill="#52be80"/>

  <!-- realloc bağlantısı -->
  <path d="M 350 99 L 380 138" stroke="#f4d03f" stroke-width="2" fill="none"/>
  <polygon points="380,138 388,132 386,142" fill="#f4d03f"/>

  <!-- free bağlantısı -->
  <path d="M 380 99 L 520 138" stroke="#ec7063" stroke-width="2" fill="none"/>
  <polygon points="520,138 528,132 526,142" fill="#ec7063"/>

  <!-- Alt açıklama kutuları -->
  <!-- Tahsis -->
  <rect x="40" y="215" width="120" height="50" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="100" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Bellek tahsis eder</text>
  <text x="100" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">(boyut belirleme)</text>

  <!-- Sıfırlama -->
  <rect x="190" y="215" width="120" height="50" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="250" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Sıfırlı bellek</text>
  <text x="250" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">(başlangıç değeri)</text>

  <!-- Yeniden boyutlandırma -->
  <rect x="340" y="215" width="120" height="50" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="400" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Yeniden boyutlandır</text>
  <text x="400" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">(mevcut blok)</text>

  <!-- Serbest bırakma -->
  <rect x="490" y="215" width="120" height="50" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="550" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">Belleği boşalt</text>
  <text x="550" y="252" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d">(geri kazanım)</text>

  <!-- Alt bilgi -->
  <text x="320" y="300" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7f8c8d" opacity="0.8">Program çalışma zamanında ihtiyaca göre bellek yönetimi</text>
</svg>