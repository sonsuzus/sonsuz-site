<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dceaff"/>
      <stop offset="100%" stop-color="#d9f2e3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5f7c92" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#617a8c" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="80" cy="45" r="68" fill="#dff0fb" opacity="0.48"/>
  <circle cx="589" cy="281" r="86" fill="#e2f3db" opacity="0.5"/>
  <path d="M30 160 C115 100, 168 239, 254 164 S405 87, 507 151 S570 201, 620 142" fill="none" stroke="#b9d7d2" stroke-width="2" opacity="0.42"/>

  <!-- MIDI Giriş -->
  <g filter="url(#shadow)">
    <rect x="28" y="103" width="128" height="115" rx="20" fill="#ffffff"/>
    <rect x="28" y="103" width="128" height="31" rx="20" fill="#d9eafd"/>
    <rect x="28" y="119" width="128" height="15" fill="#d9eafd"/>
    <text x="92" y="124" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#355774" font-weight="600">MIDI Giriş</text>

    <rect x="46" y="151" width="91" height="39" rx="7" fill="#eef6ff" stroke="#b8d4ed"/>
    <rect x="51" y="156" width="10" height="28" rx="2" fill="#ffffff" stroke="#abc6df"/>
    <rect x="62" y="156" width="10" height="28" rx="2" fill="#ffffff" stroke="#abc6df"/>
    <rect x="73" y="156" width="10" height="28" rx="2" fill="#ffffff" stroke="#abc6df"/>
    <rect x="84" y="156" width="10" height="28" rx="2" fill="#ffffff" stroke="#abc6df"/>
    <rect x="95" y="156" width="10" height="28" rx="2" fill="#ffffff" stroke="#abc6df"/>
    <rect x="106" y="156" width="10" height="28" rx="2" fill="#ffffff" stroke="#abc6df"/>
    <rect x="117" y="156" width="10" height="28" rx="2" fill="#ffffff" stroke="#abc6df"/>
    <rect x="68" y="156" width="7" height="17" rx="1" fill="#6686a2"/>
    <rect x="90" y="156" width="7" height="17" rx="1" fill="#6686a2"/>
    <rect x="112" y="156" width="7" height="17" rx="1" fill="#6686a2"/>
    <text x="92" y="207" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#5c7181">Nota · Hız · Kanal</text>
  </g>

  <!-- Arrow to core -->
  <path d="M157 160 H194" fill="none" stroke="#789bad" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M194 160 L186 155 L186 165 Z" fill="#789bad"/>

  <!-- Core engine -->
  <g filter="url(#shadow)">
    <rect x="196" y="61" width="212" height="198" rx="26" fill="url(#core)" stroke="#bddbd5"/>
    <text x="302" y="90" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#315e5e" font-weight="700">Beste Motoru</text>

    <g filter="url(#smallShadow)">
      <rect x="217" y="106" width="170" height="37" rx="11" fill="#ffffff"/>
      <circle cx="238" cy="124.5" r="10" fill="#cbe3ff"/>
      <path d="M235 124 H241 M238 121 V128" stroke="#47789c" stroke-width="1.5" stroke-linecap="round"/>
      <text x="252" y="129" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456474">Gam Eşleme</text>
      <text x="370" y="129" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668692">0 2 4 5 7</text>
    </g>

    <path d="M302 145 V157" fill="none" stroke="#79a5a2" stroke-width="2"/>
    <path d="M302 157 L297 150 L307 150 Z" fill="#79a5a2"/>

    <g filter="url(#smallShadow)">
      <rect x="217" y="160" width="170" height="37" rx="11" fill="#ffffff"/>
      <circle cx="238" cy="178.5" r="10" fill="#d8f0ce"/>
      <path d="M233 181 L238 174 L243 181" fill="none" stroke="#56845d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="252" y="183" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456474">Akor Seçimi</text>
      <text x="369" y="183" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#668692">I · IV · V</text>
    </g>

    <path d="M302 199 V211" fill="none" stroke="#79a5a2" stroke-width="2"/>
    <path d="M302 211 L297 204 L307 204 Z" fill="#79a5a2"/>

    <g filter="url(#smallShadow)">
      <rect x="217" y="214" width="170" height="28" rx="10" fill="#ffffff"/>
      <text x="302" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#456474">Olasılık ve Tempo</text>
    </g>
  </g>

  <!-- Branching -->
  <path d="M409 159 H432 V100 H453" fill="none" stroke="#809eaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M453 100 L445 95 L445 105 Z" fill="#809eaa"/>
  <path d="M409 159 H432 V218 H453" fill="none" stroke="#809eaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M453 218 L445 213 L445 223 Z" fill="#809eaa"/>
  <circle cx="432" cy="159" r="4" fill="#789fab"/>

  <!-- Outputs -->
  <g filter="url(#shadow)">
    <rect x="455" y="54" width="156" height="92" rx="19" fill="#fffdf8" stroke="#f0d9ab"/>
    <circle cx="485" cy="92" r="19" fill="#ffe8b9"/>
    <path d="M477 99 C479 90, 482 94, 484 85 C486 95, 490 87, 493 99" fill="none" stroke="#a97526" stroke-width="2" stroke-linecap="round"/>
    <text x="516" y="84" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#795d38" font-weight="700">Arpej</text>
    <text x="516" y="105" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#8d7960">Sıralı notalar</text>
    <path d="M477 121 H588" stroke="#efd9ae" stroke-width="1"/>
    <circle cx="486" cy="122" r="3" fill="#d7a651"/>
    <circle cx="507" cy="116" r="3" fill="#d7a651"/>
    <circle cx="528" cy="123" r="3" fill="#d7a651"/>
    <circle cx="549" cy="110" r="3" fill="#d7a651"/>
    <circle cx="570" cy="118" r="3" fill="#d7a651"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="172" width="156" height="92" rx="19" fill="#fffaff" stroke="#e2c9ea"/>
    <circle cx="485" cy="210" r="19" fill="#ead7f4"/>
    <path d="M478 216 V205 M485 216 V199 M492 216 V202" stroke="#89629d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="516" y="202" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#71557f" font-weight="700">Müzikal Çıktı</text>
    <text x="516" y="223" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#88718f">Akor ve melodi</text>
    <text x="516" y="245" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a18aa8">Dinamik · ritim</text>
  </g>
</svg>