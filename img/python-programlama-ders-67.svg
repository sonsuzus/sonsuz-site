<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="box6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cffafe"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Python Koşul İfadeleri</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="130" width="150" height="44" rx="10" fill="url(#box1)" filter="url(#shadow)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="320" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Koşul İfadeleri</text>
  <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e40af">if / elif / else</text>

  <!-- Sol üst: Modül -->
  <rect x="40" y="55" width="130" height="40" rx="8" fill="url(#box2)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="105" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Modül İşleci</text>
  <text x="105" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#b45309">% kalan bulur</text>

  <!-- Sol orta: Boolean -->
  <rect x="40" y="125" width="130" height="40" rx="8" fill="url(#box3)" filter="url(#shadow)" stroke="#10b981" stroke-width="1.2"/>
  <text x="105" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#065f46">Boolean Değerler</text>
  <text x="105" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#047857">True ve False</text>

  <!-- Sol alt: Karşılaştırma -->
  <rect x="40" y="195" width="130" height="40" rx="8" fill="url(#box4)" filter="url(#shadow)" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="105" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Karşılaştırma</text>
  <text x="105" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6d28d9">==, !=, >, <, >=, <=</text>

  <!-- Sağ üst: Mantıksal -->
  <rect x="470" y="55" width="130" height="40" rx="8" fill="url(#box5)" filter="url(#shadow)" stroke="#ec4899" stroke-width="1.2"/>
  <text x="535" y="72" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#9d174d">Mantıksal İşleçler</text>
  <text x="535" y="86" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#be185d">and, or, not</text>

  <!-- Sağ orta: İçiçe -->
  <rect x="470" y="125" width="130" height="40" rx="8" fill="url(#box6)" filter="url(#shadow)" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="535" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#155e75">İçiçe Koşullar</text>
  <text x="535" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0e7490">if içinde if</text>

  <!-- Sağ alt: Girdi -->
  <rect x="470" y="195" width="130" height="40" rx="8" fill="url(#box2)" filter="url(#shadow)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="535" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Klavye Girdisi</text>
  <text x="535" y="226" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#b45309">input() ve int()</text>

  <!-- Alt merkez: Tip Dönüşümü -->
  <rect x="245" y="245" width="150" height="40" rx="8" fill="url(#box4)" filter="url(#shadow)" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Tip Dönüşümü</text>
  <text x="320" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6d28d9">int(), float(), str()</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üstten merkeze -->
  <path d="M170 75 L235 130" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="235,130 226,122 228,133" fill="#64748b"/>

  <!-- Sol ortadan merkeze -->
  <path d="M170 145 L235 148" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="235,148 226,143 226,153" fill="#64748b"/>

  <!-- Sol alttan merkeze -->
  <path d="M170 215 L235 168" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="235,168 226,172 232,180" fill="#64748b"/>

  <!-- Sağ üstten merkeze -->
  <path d="M470 75 L405 130" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="405,130 414,122 412,133" fill="#64748b"/>

  <!-- Sağ ortadan merkeze -->
  <path d="M470 145 L405 148" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="405,148 414,143 414,153" fill="#64748b"/>

  <!-- Sağ alttan merkeze -->
  <path d="M470 215 L405 168" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="405,168 414,172 408,180" fill="#64748b"/>

  <!-- Merkezden alt merkeze -->
  <path d="M320 174 L320 235" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <polygon points="320,235 315,226 325,226" fill="#64748b"/>

  <!-- Alt bilgi -->
  <text x="320" y="308" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">Ders 4: Koşullar, Karşılaştırmalar ve Mantık</text>
</svg>