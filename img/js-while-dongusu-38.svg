<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">JavaScript While Döngüsü</text>

  <!-- Sol üst: Sözdizimi kutusu -->
  <rect x="20" y="50" width="180" height="100" rx="10" fill="#e8f4fd" stroke="#5b9bd5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Sözdizimi</text>
  <text x="35" y="90" font-family="Consolas, monospace" font-size="11" fill="#1a5276">while (koşul) {</text>
  <text x="45" y="108" font-family="Consolas, monospace" font-size="11" fill="#1a5276">// kodlar</text>
  <text x="35" y="126" font-family="Consolas, monospace" font-size="11" fill="#1a5276">}</text>

  <!-- Sağ üst: Akış şeması -->
  <!-- Başlangıç -->
  <ellipse cx="420" cy="65" rx="45" ry="18" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="420" y="70" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#1e8449">Başlangıç</text>

  <!-- Koşul karar elması -->
  <polygon points="420,100 480,135 420,170 360,135" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#a04000">koşul</text>
  <text x="420" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a04000">doğru mu?</text>

  <!-- Ok: başlangıçtan koşula -->
  <line x1="420" y1="83" x2="420" y2="98" stroke="#555" stroke-width="1.5"/>
  <polygon points="416,98 420,108 424,98" fill="#555"/>

  <!-- Evet (true) dalı - sağa -->
  <line x1="480" y1="135" x2="540" y2="135" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="540,131 550,135 540,139" fill="#27ae60"/>
  <text x="510" y="128" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Evet</text>

  <!-- İşlem kutusu -->
  <rect x="552" y="115" width="70" height="40" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="587" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">i += 1</text>
  <text x="587" y="146" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">kodlar</text>

  <!-- İşlemden koşula geri dönüş -->
  <line x1="587" y1="115" x2="587" y2="55" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="587" y1="55" x2="420" y2="55" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="420" y1="55" x2="420" y2="98" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="416,98 420,108 424,98" fill="#27ae60"/>

  <!-- Hayır (false) dalı - aşağı -->
  <line x1="420" y1="170" x2="420" y2="200" stroke="#e74c3c" stroke-width="1.5"/>
  <polygon points="416,200 420,210 424,200" fill="#e74c3c"/>
  <text x="435" y="192" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">Hayır</text>

  <!-- Bitiş -->
  <ellipse cx="420" cy="230" rx="45" ry="18" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="420" y="235" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#922b21">Bitiş</text>

  <!-- Ok: hayırdan bitişe -->
  <line x1="420" y1="210" x2="420" y2="210" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- Alt bölüm: Örnek akış -->
  <rect x="20" y="170" width="290" height="130" rx="10" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="165" y="190" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7d6608">Örnek: 1'den 5'e kadar say</text>

  <!-- Mini akış -->
  <rect x="35" y="205" width="50" height="25" rx="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="60" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0e6251">i = 1</text>

  <line x1="85" y1="217" x2="105" y2="217" stroke="#555" stroke-width="1.2"/>
  <polygon points="105,213 112,217 105,221" fill="#555"/>

  <rect x="112" y="205" width="60" height="25" rx="5" fill="#fdebd0" stroke="#e67e22" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="142" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#a04000">i &lt;= 5?</text>

  <line x1="172" y1="217" x2="192" y2="217" stroke="#27ae60" stroke-width="1.2"/>
  <polygon points="192,213 199,217 192,221" fill="#27ae60"/>
  <text x="185" y="210" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#27ae60">E</text>

  <rect x="199" y="205" width="55" height="25" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="226" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#1e8449">yazdır</text>

  <line x1="254" y1="217" x2="274" y2="217" stroke="#555" stroke-width="1.2"/>
  <polygon points="274,213 281,217 274,221" fill="#555"/>

  <rect x="281" y="205" width="25" height="25" rx="5" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1" filter="url(#shadowLight)"/>
  <text x="293" y="222" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#0e6251">i+1</text>

  <!-- Geri dönüş oku -->
  <path d="M293,230 L293,250 L60,250 L60,232" fill="none" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="56,232 60,242 64,232" fill="#27ae60"/>

  <!-- Çıktı -->
  <text x="60" y="268" font-family="Consolas, monospace" font-size="11" fill="#2c3e50">Çıktı: 1 2 3 4 5</text>

  <!-- Sağ alt: Sonsuz döngü uyarısı -->
  <rect x="440" y="255" width="180" height="50" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadowLight)"/>
  <text x="530" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#922b21">Dikkat!</text>
  <text x="530" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#922b21">i artmazsa sonsuz döngü</text>
</svg>