<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="arkaPlan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f1f8ef"/>
    </linearGradient>
    <linearGradient id="tryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeaff"/>
      <stop offset="100%" stop-color="#b9d8fb"/>
    </linearGradient>
    <linearGradient id="exceptGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe5df"/>
      <stop offset="100%" stop-color="#ffc9bd"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcf4df"/>
      <stop offset="100%" stop-color="#bde8c6"/>
    </linearGradient>
    <linearGradient id="finallyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eee7ff"/>
      <stop offset="100%" stop-color="#d9cef7"/>
    </linearGradient>
    <filter id="golge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#688099" flood-opacity="0.18"/>
    </filter>
    <filter id="hafifGolge" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#688099" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#arkaPlan)"/>
  <circle cx="69" cy="62" r="48" fill="#d9eff2" opacity="0.45"/>
  <circle cx="579" cy="270" r="70" fill="#e2dafa" opacity="0.35"/>
  <path d="M33 270 C142 233, 177 290, 276 268 S457 218, 609 264" fill="none" stroke="#c9dfdf" stroke-width="2" opacity="0.6"/>

  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#40526a">Try-Except ile Kontrollü Akış</text>

  <g filter="url(#hafifGolge)">
    <rect x="28" y="105" width="117" height="94" rx="18" fill="#ffffff"/>
    <rect x="36" y="114" width="101" height="24" rx="12" fill="#e7f1fb"/>
    <text x="86.5" y="130" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="600" fill="#47627e">Riskli İşlem</text>
    <text x="86.5" y="159" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64758a">girdi</text>
    <text x="86.5" y="180" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64758a">dosya</text>
  </g>

  <path d="M146 151 L189 151" fill="none" stroke="#7b9bb4" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="189,151 180,146 180,156" fill="#7b9bb4"/>

  <g filter="url(#golge)">
    <path d="M250 66 L350 66 Q359 66 359 75 L359 146 Q359 205 300 231 Q241 205 241 146 L241 75 Q241 66 250 66 Z" fill="url(#tryGrad)" stroke="#8aadd3" stroke-width="1.4"/>
    <path d="M258 82 L342 82" stroke="#ffffff" stroke-width="2" opacity="0.75" stroke-linecap="round"/>
    <text x="300" y="110" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#315b87">try</text>
    <text x="300" y="134" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476985">çalıştır</text>
    <path d="M283 159 L296 172 L320 145" fill="none" stroke="#41835c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="300" y="199" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476985">güvenli sınır</text>
  </g>

  <path d="M360 120 C395 120, 397 87, 429 87" fill="none" stroke="#e09280" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="429,87 420,82 420,92" fill="#e09280"/>
  <text x="391" y="98" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a65b50">istisna</text>

  <g filter="url(#hafifGolge)">
    <rect x="431" y="48" width="163" height="76" rx="18" fill="url(#exceptGrad)" stroke="#edab9c" stroke-width="1.2"/>
    <rect x="444" y="60" width="67" height="23" rx="11" fill="#ffffff" opacity="0.62"/>
    <text x="477.5" y="76" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#9c4c43">except</text>
    <text x="513" y="105" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#875b57">Hatayı yönet</text>
  </g>

  <path d="M360 177 C390 177, 395 204, 429 204" fill="none" stroke="#6fa985" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="429,204 420,199 420,209" fill="#6fa985"/>
  <text x="392" y="195" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#528366">sorun yok</text>

  <g filter="url(#hafifGolge)">
    <rect x="431" y="166" width="163" height="76" rx="18" fill="url(#successGrad)" stroke="#91cba0" stroke-width="1.2"/>
    <rect x="444" y="178" width="51" height="23" rx="11" fill="#ffffff" opacity="0.62"/>
    <text x="469.5" y="194" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#3e7b51">else</text>
    <text x="513" y="223" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#4d7760">Sonucu işle</text>
  </g>

  <path d="M512 125 L512 156" fill="none" stroke="#9a8bbd" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M512 243 C512 261, 485 267, 447 267 L365 267" fill="none" stroke="#9a8bbd" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="365,267 374,262 374,272" fill="#9a8bbd"/>
  <path d="M300 232 L300 255" fill="none" stroke="#9a8bbd" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="300,255 295,246 305,246" fill="#9a8bbd"/>

  <g filter="url(#golge)">
    <rect x="176" y="256" width="189" height="48" rx="16" fill="url(#finallyGrad)" stroke="#b8a9dc" stroke-width="1.2"/>
    <circle cx="204" cy="280" r="13" fill="#ffffff" opacity="0.7"/>
    <path d="M204 272 L204 280 L210 284" fill="none" stroke="#77699e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="282" y="277" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#625584">finally</text>
    <text x="282" y="293" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#74698f">Her durumda temizle</text>
  </g>
</svg>