<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">C++ Referans Kavramı</text>

  <!-- Merkez: Değişken -->
  <rect x="245" y="120" width="150" height="52" rx="12" fill="url(#boxGrad1)" filter="url(#shadow)"/>
  <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#1e3a5f">int id</text>
  <text x="320" y="160" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#334155">Değişken</text>

  <!-- Sol üst: Referans bildirimi -->
  <rect x="30" y="55" width="160" height="60" rx="12" fill="url(#boxGrad2)" filter="url(#shadow)"/>
  <text x="110" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#78350f">Referans Bildirimi</text>
  <text x="110" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#92400e">int&amp; rid = id;</text>

  <!-- Sağ üst: Bellek -->
  <rect x="450" y="55" width="160" height="60" rx="12" fill="url(#boxGrad3)" filter="url(#shadow)"/>
  <text x="530" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#064e3b">Bellek Kullanımı</text>
  <text x="530" y="96" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#065f46">Ek bellek yok</text>

  <!-- Sol alt: İkinci isim -->
  <rect x="30" y="210" width="160" height="60" rx="12" fill="url(#boxGrad4)" filter="url(#shadow)"/>
  <text x="110" y="233" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#831843">İkinci İsim</text>
  <text x="110" y="251" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#9d174d">rid, id için takma ad</text>

  <!-- Sağ alt: Kullanım alanları -->
  <rect x="450" y="210" width="160" height="60" rx="12" fill="url(#boxGrad5)" filter="url(#shadow)"/>
  <text x="530" y="228" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#312e81">Kullanım Alanları</text>
  <text x="530" y="246" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4338ca">Sınıf, parametre, dönüş</text>

  <!-- Oklar (manuel çizim) -->
  <!-- Sol üst -> Merkez -->
  <path d="M190,85 L235,130" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="235,130 225,124 228,134" fill="#64748b"/>

  <!-- Sağ üst -> Merkez -->
  <path d="M450,85 L405,130" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="405,130 415,124 412,134" fill="#64748b"/>

  <!-- Merkez -> Sol alt -->
  <path d="M280,172 L190,210" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="190,210 202,208 194,200" fill="#64748b"/>

  <!-- Merkez -> Sağ alt -->
  <path d="M360,172 L450,210" stroke="#64748b" stroke-width="2" fill="none"/>
  <polygon points="450,210 438,208 446,200" fill="#64748b"/>

  <!-- Alt not -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">Değişkene farklı isimle erişim</text>
</svg>