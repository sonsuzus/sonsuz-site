<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Python Döngüler</text>

  <!-- Merkez düğüm -->
  <rect x="255" y="55" width="130" height="45" rx="12" fill="#4a90d9" filter="url(#shadow)" opacity="0.9"/>
  <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Döngü</text>

  <!-- For döngüsü kutusu -->
  <rect x="80" y="130" width="140" height="50" rx="12" fill="#5cb85c" filter="url(#shadow)" opacity="0.9"/>
  <text x="150" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">for</text>
  <text x="150" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#e8f5e9">değişken in dizi</text>

  <!-- While döngüsü kutusu -->
  <rect x="420" y="130" width="140" height="50" rx="12" fill="#f0ad4e" filter="url(#shadow)" opacity="0.9"/>
  <text x="490" y="152" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">while</text>
  <text x="490" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#fff8e1">koşul sağlandıkça</text>

  <!-- Oklar merkezden -->
  <!-- For oku -->
  <path d="M 320 100 L 320 110 L 220 110 L 220 125" stroke="#5cb85c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="215,125 225,125 220,135" fill="#5cb85c"/>

  <!-- While oku -->
  <path d="M 320 100 L 320 110 L 490 110 L 490 125" stroke="#f0ad4e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <polygon points="485,125 495,125 490,135" fill="#f0ad4e"/>

  <!-- Veri türleri kutusu -->
  <rect x="230" y="215" width="180" height="75" rx="12" fill="#9b59b6" filter="url(#shadow)" opacity="0.85"/>
  <text x="320" y="237" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Veri Türleri</text>
  <text x="320" y="257" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#f3e5f5">Liste, Tuple, Küme</text>
  <text x="320" y="275" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#f3e5f5">Sözlük, Karakter Dizisi</text>

  <!-- For'dan veri türlerine ok -->
  <path d="M 150 180 L 150 200 L 280 200 L 280 210" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,4" stroke-linecap="round"/>
  <polygon points="275,210 285,210 280,220" fill="#9b59b6"/>

  <!-- While'dan veri türlerine ok -->
  <path d="M 490 180 L 490 200 L 360 200 L 360 210" stroke="#9b59b6" stroke-width="2" fill="none" stroke-dasharray="5,4" stroke-linecap="round"/>
  <polygon points="355,210 365,210 360,220" fill="#9b59b6"/>

  <!-- Alt bilgi: girinti kuralı -->
  <rect x="55" y="255" width="180" height="40" rx="10" fill="#e74c3c" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="145" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Girinti Kuralı</text>
  <text x="145" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffebee">İşlem satırları içeride</text>

  <rect x="405" y="255" width="180" height="40" rx="10" fill="#e74c3c" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="495" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Tekrar Kullanım</text>
  <text x="495" y="287" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffebee">Kod tekrarı yok</text>

  <!-- Alt bağlantılar -->
  <path d="M 145 255 L 145 240 L 150 240" stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 495 255 L 495 240 L 490 240" stroke="#e74c3c" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Döngü tekrar sembolü -->
  <path d="M 320 55 C 320 40, 380 40, 380 55" stroke="#2c3e50" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="3,3"/>
  <path d="M 380 55 C 380 70, 320 70, 320 55" stroke="#2c3e50" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="3,3"/>
</svg>