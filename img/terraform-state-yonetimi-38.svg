    <path d="M516 63 L529 58 L542 63 V74 C542 83 536 89 529 92 C522 89 516 83 516 74 Z" fill="#71a86c"/>
    <path d="M523 74 L527 78 L535 68" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="553" y="72" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#416b43" font-weight="700">Şifreleme</text>
