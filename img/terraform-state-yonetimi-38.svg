  <g filter="url(#softShadow)">
    <rect x="177" y="275" width="81" height="28" rx="12" fill="#dff1ff"/>
    <text x="217" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#397293" font-weight="600">Geliştirme</text>
    <rect x="279" y="275" width="81" height="28" rx="12" fill="#fff0d9"/>
    <text x="319" y="294" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#976839" font-weight="600">Hazırlık</text>
