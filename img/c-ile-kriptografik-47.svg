<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="RSA ve hibrit şifreleme kavramsal diyagramı">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eef9f2"/>
    </linearGradient>
    <linearGradient id="rsa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7889d8"/>
      <stop offset="100%" stop-color="#596ac0"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#85d7c5"/>
      <stop offset="100%" stop-color="#5eb8b1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#62718c" flood-opacity=".18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#62718c" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#71819b"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="124" fill="#ffffff" opacity=".42"/>
  <circle cx="320" cy="160" r="102" fill="none" stroke="#d9e5ed" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#33435c">
    <path d="M164 93 C194 93 208 111 229 126" fill="none" stroke="#71819b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M164 225 C194 225 210 207 229 193" fill="none" stroke="#71819b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M411 151 C438 151 453 128 474 113" fill="none" stroke="#71819b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M411 169 C438 169 452 191 474 207" fill="none" stroke="#71819b" stroke-width="2" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="35" y="57" width="130" height="72" rx="17" fill="#ffffff" stroke="#d8e5ef"/>
      <rect x="35" y="189" width="130" height="72" rx="17" fill="#ffffff" stroke="#d8e5ef"/>
    </g>
    <circle cx="62" cy="93" r="16" fill="#e8edff"/>
    <text x="62" y="98" text-anchor="middle" font-weight="700" fill="#6072c5">p·q</text>
    <text x="88" y="89" font-weight="700">Asal Sayılar</text>
    <text x="88" y="108" fill="#71819b">n ve φ(n)</text>

    <circle cx="62" cy="225" r="16" fill="#e1f6ef"/>
    <path d="M55 225h14M62 218v14" stroke="#429d8d" stroke-width="2" stroke-linecap="round"/>
    <text x="88" y="221" font-weight="700">Açık Mesaj</text>
    <text x="88" y="240" fill="#71819b">M · veri</text>

    <g filter="url(#shadow)">
      <rect x="229" y="88" width="182" height="144" rx="25" fill="url(#rsa)"/>
    </g>
    <path d="M283 149v-13c0-16 11-27 28-27s28 11 28 27v13" fill="none" stroke="#eef1ff" stroke-width="10" stroke-linecap="round"/>
    <rect x="270" y="143" width="82" height="57" rx="12" fill="#edf0ff"/>
    <circle cx="311" cy="166" r="7" fill="#6274c8"/>
    <path d="M311 173v12" stroke="#6274c8" stroke-width="4" stroke-linecap="round"/>
    <text x="370" y="129" fill="#f5f6ff" font-weight="700">RSA</text>
    <text x="370" y="148" fill="#e0e5ff">C = Mᵉ mod n</text>
    <text x="370" y="168" fill="#e0e5ff">M = Cᵈ mod n</text>
    <text x="320" y="218" text-anchor="middle" fill="#e9edff">Modüler Aritmetik</text>

    <g filter="url(#shadow)">
      <rect x="474" y="76" width="131" height="73" rx="17" fill="#ffffff" stroke="#d8e5ef"/>
      <rect x="474" y="171" width="131" height="73" rx="17" fill="#ffffff" stroke="#d8e5ef"/>
    </g>
    <circle cx="502" cy="112" r="16" fill="#f0eaff"/>
    <path d="M496 113l5 5 8-11" fill="none" stroke="#8a70bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="528" y="108" font-weight="700">Anahtar Çifti</text>
    <text x="528" y="127" fill="#71819b">e · d · n</text>

    <circle cx="502" cy="207" r="16" fill="#e1f6ef"/>
    <path d="M494 207h16M497 202h10M497 212h10" stroke="#429d8d" stroke-width="2" stroke-linecap="round"/>
    <text x="528" y="203" font-weight="700">Hibrit Akış</text>
    <text x="528" y="222" fill="#71819b">AES anahtarı</text>

    <g filter="url(#smallShadow)">
      <rect x="247" y="27" width="146" height="32" rx="16" fill="#ffffff" stroke="#dbe6ef"/>
    </g>
    <text x="320" y="47" text-anchor="middle" font-weight="700" fill="#52647c">C++ · Hızlı Üs Alma</text>
    <path d="M320 59v20" fill="none" stroke="#9aa8ba" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="320" y="286" text-anchor="middle" fill="#667891">Güvenli kütüphaneler · OAEP · Kriptografik RNG</text>
  </g>
</svg>