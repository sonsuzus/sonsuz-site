    <rect x="43" y="202" width="84" height="28" rx="9" fill="#e5e9ff"/>
  </g>
  <text x="85" y="149" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#674b45">x = bellek</text>
  <text x="85" y="185" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#476143">y = a + b</text>
  <text x="85" y="221" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#464d7a">z = y × 2</text>

  <path d="M143 170 H171" fill="none" stroke="#7893a9" stroke-width="2"/>
  <polygon points="177,170 168,165 168,175" fill="#7893a9"/>

