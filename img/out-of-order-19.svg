  <path d="M448 132 V139" fill="none" stroke="#d18a7d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="367" y="82" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#a06a61">boşluk</text>
  <text x="359" y="291" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#66816b">paralellik</text>
