  <text x="448" y="183" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#628664">Erken çalışır</text>
  <text x="448" y="232" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4e5b9b">Çarpma</text>
  <text x="448" y="251" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6674b6">y sonrası</text>

  <path d="M500 102 C520 102 519 145 532 145" fill="none" stroke="#a7b6c1" stroke-width="2"/>
