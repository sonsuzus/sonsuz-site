<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8d8ea"/>
      <stop offset="100%" stop-color="#7ec8e3"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5e2c8"/>
      <stop offset="100%" stop-color="#8fd6a8"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d3a0"/>
      <stop offset="100%" stop-color="#f5c07a"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9b8e8"/>
      <stop offset="100%" stop-color="#b09ad8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)" rx="12"/>

  <!-- Başlık -->
  <text x="320" y="30" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Kod Kalitesi ve Performans Analizi</text>

  <!-- Merkez düğüm -->
  <rect x="245" y="55" width="150" height="40" rx="10" fill="url(#grad1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="320" y="80" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a3a4a">Kod Analizi</text>

  <!-- Ok: merkezden doğruluk -->
  <path d="M 290 95 C 270 130, 200 140, 160 155" stroke="#5a9ab5" stroke-width="2" fill="none"/>
  <polygon points="155,158 168,153 163,165" fill="#5a9ab5"/>

  <!-- Ok: merkezden performans -->
  <path d="M 350 95 C 370 130, 440 140, 480 155" stroke="#5a9ab5" stroke-width="2" fill="none"/>
  <polygon points="485,158 472,153 477,165" fill="#5a9ab5"/>

  <!-- Sol üst: Birim Testi -->
  <rect x="40" y="150" width="140" height="50" rx="10" fill="url(#grad2)" filter="url(#shadowLight)" opacity="0.95"/>
  <text x="110" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a2a">Birim Testi</text>
  <text x="110" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a3a">Doğruluk Dedektifi</text>

  <!-- Sol alt: Entegrasyon -->
  <rect x="40" y="230" width="140" height="40" rx="10" fill="url(#grad2)" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="110" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a4a2a">Entegrasyon</text>
  <text x="110" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2a5a3a">Parça Uyumu</text>

  <!-- Sağ üst: Profil Analizi -->
  <rect x="460" y="150" width="140" height="50" rx="10" fill="url(#grad3)" filter="url(#shadowLight)" opacity="0.95"/>
  <text x="530" y="170" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a3a1a">Profil Analizi</text>
  <text x="530" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a4a2a">Performans Dedektifi</text>

  <!-- Sağ alt: Benchmark -->
  <rect x="460" y="230" width="140" height="40" rx="10" fill="url(#grad3)" filter="url(#shadowLight)" opacity="0.8"/>
  <text x="530" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#5a3a1a">Benchmark</text>
  <text x="530" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#6a4a2a">Hız Karşılaştırma</text>

  <!-- Alt merkez: Araçlar -->
  <rect x="200" y="230" width="240" height="40" rx="10" fill="url(#grad4)" filter="url(#shadowLight)" opacity="0.9"/>
  <text x="320" y="248" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a2a5a">Araçlar: pytest ve cProfile</text>
  <text x="320" y="262" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#4a3a6a">Test ve Ölçüm</text>

  <!-- Oklar: sol üstten sol alta -->
  <path d="M 110 200 L 110 225" stroke="#7ab88a" stroke-width="1.5" fill="none"/>
  <polygon points="110,230 105,222 115,222" fill="#7ab88a"/>

  <!-- Oklar: sağ üstten sağ alta -->
  <path d="M 530 200 L 530 225" stroke="#d4a05a" stroke-width="1.5" fill="none"/>
  <polygon points="530,230 525,222 535,222" fill="#d4a05a"/>

  <!-- Oklar: sol üstten alt merkeze -->
  <path d="M 180 175 C 220 190, 250 210, 280 225" stroke="#9a9ab5" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="285,228 273,225 279,235" fill="#9a9ab5"/>

  <!-- Oklar: sağ üstten alt merkeze -->
  <path d="M 460 175 C 420 190, 390 210, 360 225" stroke="#9a9ab5" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="355,228 367,225 361,235" fill="#9a9ab5"/>

  <!-- Alt bilgi -->
  <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a8a9a" font-style="italic">Önce testle doğrula, sonra profille ölç</text>
</svg>