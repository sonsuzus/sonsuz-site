      <stop offset="100%" stop-color="#f2f9f0"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9d8ff"/>
      <stop offset="100%" stop-color="#b8c8f0"/>
