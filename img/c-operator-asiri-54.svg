<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f2f9ef"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcecff"/>
      <stop offset="100%" stop-color="#cfe2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#6e8bab" flood-opacity="0.20"/>
    </filter>
    <filter id="smallShadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#657f91" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="320" cy="160" r="117" fill="#dceef2" opacity="0.34"/>
  <circle cx="320" cy="160" r="89" fill="none" stroke="#b9d5d9" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.75"/>

  <!-- Bağlantılar -->
  <path d="M181 82 C213 96 231 111 253 128" fill="none" stroke="#8aabc5" stroke-width="2"/>
  <polygon points="252,122 263,134 248,132" fill="#8aabc5"/>

  <path d="M459 82 C426 96 409 111 387 128" fill="none" stroke="#9caecf" stroke-width="2"/>
  <polygon points="392,132 377,134 388,122" fill="#9caecf"/>

  <path d="M183 238 C214 224 232 209 253 192" fill="none" stroke="#8fba9c" stroke-width="2"/>
  <polygon points="248,188 263,186 253,199" fill="#8fba9c"/>

  <path d="M458 238 C425 224 407 209 387 192" fill="none" stroke="#d2a68d" stroke-width="2"/>
  <polygon points="387,199 377,186 392,188" fill="#d2a68d"/>

  <!-- Sol üst -->
  <g filter="url(#smallShadow)">
    <rect x="42" y="48" width="142" height="68" rx="16" fill="#fff8e9"/>
    <rect x="54" y="60" width="34" height="34" rx="10" fill="#f5dca4"/>
    <text x="71" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="17" font-weight="700" fill="#8a641f">+</text>
    <text x="98" y="75" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d5965">Toplama</text>
    <text x="98" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e7780">operator+</text>
  </g>

  <!-- Sağ üst -->
  <g filter="url(#smallShadow)">
    <rect x="456" y="48" width="142" height="68" rx="16" fill="#f4f1ff"/>
    <rect x="468" y="60" width="34" height="34" rx="10" fill="#d8cdf7"/>
    <text x="485" y="82" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="700" fill="#66538e">==</text>
    <text x="512" y="75" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d5965">Karşılaştırma</text>
    <text x="512" y="94" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e7780">operator==</text>
  </g>

  <!-- Sol alt -->
  <g filter="url(#smallShadow)">
    <rect x="42" y="204" width="142" height="68" rx="16" fill="#eef9f0"/>
    <rect x="54" y="216" width="34" height="34" rx="10" fill="#cbe8d1"/>
    <text x="71" y="238" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="17" font-weight="700" fill="#39734a">++</text>
    <text x="98" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d5965">Artırma</text>
    <text x="98" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e7780">operator++</text>
  </g>

  <!-- Sağ alt -->
  <g filter="url(#smallShadow)">
    <rect x="456" y="204" width="142" height="68" rx="16" fill="#fff1eb"/>
    <rect x="468" y="216" width="34" height="34" rx="10" fill="#f1c8b6"/>
    <text x="485" y="239" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="17" font-weight="700" fill="#a55d3f">&lt;&lt;</text>
    <text x="512" y="231" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#4d5965">Akış yazdırma</text>
    <text x="512" y="250" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#6e7780">global ve friend</text>
  </g>

  <!-- Merkez -->
  <g filter="url(#shadow)">
    <rect x="239" y="105" width="162" height="110" rx="24" fill="url(#core)" stroke="#b6d1eb" stroke-width="1.5"/>
    <rect x="270" y="120" width="100" height="28" rx="10" fill="#ffffff" opacity="0.78"/>
    <text x="320" y="139" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#365b7b">Vektor Sınıfı</text>

    <line x1="267" y1="163" x2="373" y2="163" stroke="#a9c7e0" stroke-width="1"/>
    <text x="320" y="181" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42637d">x, y bileşenleri</text>
    <text x="320" y="201" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#42637d">doğal sözdizimi</text>
  </g>

  <!-- Alt akış -->
  <path d="M286 283 L354 283" fill="none" stroke="#789ab8" stroke-width="2"/>
  <polygon points="354,278 366,283 354,288" fill="#789ab8"/>
  <g filter="url(#smallShadow)">
    <rect x="174" y="267" width="108" height="34" rx="12" fill="#ffffff"/>
    <text x="228" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526474">a + b</text>
    <rect x="370" y="267" width="108" height="34" rx="12" fill="#ffffff"/>
    <text x="424" y="289" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#526474">a.operator+(b)</text>
  </g>
</svg>