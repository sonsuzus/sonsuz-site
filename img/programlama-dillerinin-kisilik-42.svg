<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#f3f8ef"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d4e6f9"/>
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9e4de"/>
      <stop offset="100%" stop-color="#a8d8d0"/>
    </linearGradient>
    <linearGradient id="haskellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d4f7"/>
      <stop offset="100%" stop-color="#b8b8e8"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde2c8"/>
      <stop offset="100%" stop-color="#f5cba0"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#fde69a"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0c8"/>
      <stop offset="100%" stop-color="#e8b4a8"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d5d8dc"/>
      <stop offset="100%" stop-color="#bdc3c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#8899aa" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="1.5" flood-color="#8899aa" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="640" height="320" fill="url(#bgGrad)" rx="8"/>

  <!-- Başlık -->
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Dil Kişilik Haritası</text>

  <!-- Merkez düğüm -->
  <g filter="url(#shadow)">
    <rect x="255" y="120" width="130" height="50" rx="12" fill="url(#centerGrad)" stroke="#a0b8d8" stroke-width="1"/>
    <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Programlama</text>
    <text x="320" y="156" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Dilleri</text>
  </g>

  <!-- Ok ucu fonksiyonu: manuel çizim -->
  <!-- Python kutusu -->
  <g filter="url(#shadowLight)">
    <rect x="40" y="45" width="110" height="42" rx="10" fill="url(#pythonGrad)" stroke="#7fb5a8" stroke-width="1"/>
    <text x="95" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#1a5c4a">Python</text>
    <text x="95" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">INTJ/ENFP</text>
  </g>
  <!-- Python bağlantı çizgisi -->
  <line x1="150" y1="66" x2="255" y2="130" stroke="#7fb5a8" stroke-width="1.5" opacity="0.7"/>
  <!-- Ok ucu -->
  <polygon points="252,126 260,132 252,138" fill="#7fb5a8" opacity="0.8"/>

  <!-- Haskell kutusu -->
  <g filter="url(#shadowLight)">
    <rect x="40" y="115" width="110" height="42" rx="10" fill="url(#haskellGrad)" stroke="#8f8fd0" stroke-width="1"/>
    <text x="95" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a3a7a">Haskell</text>
    <text x="95" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">INTP</text>
  </g>
  <!-- Haskell bağlantı çizgisi -->
  <line x1="150" y1="136" x2="255" y2="140" stroke="#8f8fd0" stroke-width="1.5" opacity="0.7"/>
  <!-- Ok ucu -->
  <polygon points="252,136 260,142 252,148" fill="#8f8fd0" opacity="0.8"/>

  <!-- Java kutusu -->
  <g filter="url(#shadowLight)">
    <rect x="40" y="185" width="110" height="42" rx="10" fill="url(#javaGrad)" stroke="#d4a06a" stroke-width="1"/>
    <text x="95" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a4a1a">Java</text>
    <text x="95" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">ISTJ</text>
  </g>
  <!-- Java bağlantı çizgisi -->
  <line x1="150" y1="206" x2="255" y2="150" stroke="#d4a06a" stroke-width="1.5" opacity="0.7"/>
  <!-- Ok ucu -->
  <polygon points="252,146 260,152 252,158" fill="#d4a06a" opacity="0.8"/>

  <!-- JavaScript kutusu -->
  <g filter="url(#shadowLight)">
    <rect x="490" y="45" width="110" height="42" rx="10" fill="url(#jsGrad)" stroke="#d4b84a" stroke-width="1"/>
    <text x="545" y="62" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#6b5a10">JavaScript</text>
    <text x="545" y="78" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">ENFP</text>
  </g>
  <!-- JavaScript bağlantı çizgisi -->
  <line x1="490" y1="66" x2="385" y2="130" stroke="#d4b84a" stroke-width="1.5" opacity="0.7"/>
  <!-- Ok ucu -->
  <polygon points="388,126 380,132 388,138" fill="#d4b84a" opacity="0.8"/>

  <!-- Rust kutusu -->
  <g filter="url(#shadowLight)">
    <rect x="490" y="115" width="110" height="42" rx="10" fill="url(#rustGrad)" stroke="#c08070" stroke-width="1"/>
    <text x="545" y="132" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#7a3020">Rust</text>
    <text x="545" y="148" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">ESTJ</text>
  </g>
  <!-- Rust bağlantı çizgisi -->
  <line x1="490" y1="136" x2="385" y2="140" stroke="#c08070" stroke-width="1.5" opacity="0.7"/>
  <!-- Ok ucu -->
  <polygon points="388,136 380,142 388,148" fill="#c08070" opacity="0.8"/>

  <!-- C kutusu -->
  <g filter="url(#shadowLight)">
    <rect x="490" y="185" width="110" height="42" rx="10" fill="url(#cGrad)" stroke="#9099a0" stroke-width="1"/>
    <text x="545" y="202" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#3a4045">C</text>
    <text x="545" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#2c3e50">ISTP</text>
  </g>
  <!-- C bağlantı çizgisi -->
  <line x1="490" y1="206" x2="385" y2="150" stroke="#9099a0" stroke-width="1.5" opacity="0.7"/>
  <!-- Ok ucu -->
  <polygon points="388,146 380,152 388,158" fill="#9099a0" opacity="0.8"/>

  <!-- Formül paneli -->
  <g filter="url(#shadowLight)">
    <rect x="200" y="255" width="240" height="50" rx="10" fill="#ffffff" stroke="#c0c8d0" stroke-width="0.8" opacity="0.9"/>
    <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">K = 0.4T + 0.3P + 0.3S</text>
    <text x="320" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#5a6a7a">T: Tip katılığı · P: Paradigma · S: Sözdizimi</text>
  </g>

  <!-- Eksen etiketleri -->
  <text x="30" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a8a9a" transform="rotate(-90, 30, 270)">Esnek</text>
  <text x="610" y="270" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#7a8a9a" transform="rotate(90, 610, 270)">Kuralcı</text>

  <!-- Alt bilgi -->
  <text x="320" y="315" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#8899aa">Mizahi bir mercek: tasarım tercihlerini konuşmayı kolaylaştırır</text>
</svg>